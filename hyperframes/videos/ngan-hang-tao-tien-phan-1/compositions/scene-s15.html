      <style>

      }
      body {
        margin: 0;

        color: #141414;

      /* Composition Root Contract: width & height 100%, stamped by runtime data-width/data-height */
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Standard Full-Frame Clip Box */
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;

      /* Visual Foundation: 84px Grid Pattern */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),

        background-size: 84px 84px;
        background-position: center center;
        z-index: 1;
      }

      /* Paper Grain Texture (Multiply Blend) */
      .bg-grain {
        position: absolute;
        inset: 0;
        opacity: 0.18;
        mix-blend-mode: multiply;
        pointer-events: none;
        z-index: 2;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

        left: 0;
        width: 100%;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;

      /* Content Rig: Vertically aligned within safe bounds */
      .content-rig {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
        pointer-events: none;

      .tag-text {

        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 2px;

        flex-direction: column;

      /* Card Header */

        align-items: center;

      .player-tier {

        font-weight: 900;
        color: #FF6A1A;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .player-name {
        font-size: 26px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 0.5px;

      .player-ovr {

      /* Card Image Wrapper */

      .card-img {

        display: block;

        justify-content: space-between;

      .price-title {

        font-weight: 700;
        color: #F7F4EC;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .price-val {

        font-weight: 900;
        color: #FF6A1A;
        letter-spacing: 0.5px;
      }

      /* 3. Progress Card: 1 Tháng Cày Cuốc */
      .progress-card {

        width: 920px;

        background: #F5F0E4;

        box-shadow: 8px 8px 0px #141414;
        border-radius: 14px;
        padding: 16px 26px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        will-change: transform, opacity;
      }
      .progress-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .progress-title-group {
        display: flex;
        flex-direction: column;
      }
      .progress-label {
        font-size: 21px;
        font-weight: 900;
        color: #141414;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .progress-sub {
        font-size: 16px;
        font-weight: 700;
        color: #141414;
        opacity: 0.75;
        margin-top: 2px;
      }

      /* Overlay Icon: Clock Badge (atMs: 121470) */
      .clock-badge {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #141414;
        border: 2.5px solid #FF6A1A;
        border-radius: 20px;
        padding: 6px 16px;
        box-shadow: 3px 3px 0px rgba(20, 20, 20, 0.3);
        will-change: transform, opacity;
      }
      .clock-svg {
        width: 26px;
        height: 26px;
        display: block;
      }
      .clock-text {
        font-size: 17px;
        font-weight: 900;
        color: #FF6A1A;
        letter-spacing: 0.5px;
      }

      /* Progress Bar Track & Fill */
      .progress-track {
        height: 32px;
        background: #141414;
        border: 3px solid #141414;
        border-radius: 8px;
        position: relative;
        overflow: hidden;
      }
      .progress-fill {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #FF6A1A;
        border-right: 3px solid #F7F4EC;
        will-change: transform;
      }

      /* Milestones Row */
      .progress-milestones {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .milestone-item {
        font-size: 17px;
        font-weight: 700;
        color: #141414;
      }
      .milestone-item.highlight {
        font-weight: 900;
        background: #FF6A1A;
        color: #141414;
        padding: 2px 10px;
        border-radius: 4px;
        border: 1.5px solid #141414;
      }

      /* 4. Punch Phrase Banner (atMs: 120470) */
      .punch-banner {
        margin-top: 18px;
        width: 920px;
        height: 125px;
        background: #141414;
        border: 4px solid #FF6A1A;
        box-shadow: 8px 8px 0px rgba(20, 20, 20, 0.4);
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        will-change: transform, opacity;
      }
      .punch-text-wrap {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .punch-lead {
        font-size: 52px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: -0.5px;
      }
      .punch-val {
        font-size: 58px;
        font-weight: 900;
        color: #FF6A1A;
        letter-spacing: 0.5px;
      }
      .punch-sub {
        font-size: 18px;
        font-weight: 700;
        color: #F7F4EC;
        opacity: 0.85;
        margin-top: 2px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
    </style>

    <div id="root" data-composition-id="scene-s15" data-width="1080" data-height="1920" data-duration="8.97">
      <!-- Fixed Signature Bottom Brand Bar -->
      <div class="bottom-brand-bar"></div>

      <!-- Main Scene Clip (S15: 8.97s) -->
      <section id="scene-s15" class="clip" data-start="0" data-duration="8.97">
        <!-- Visual Foundation: 84px Grid & Subtle Grain -->
        <div class="bg-grid"></div>
        <div class="bg-grain"></div>

        <!-- Safe Content Zone Container -->
        <div class="content-rig">
          <!-- 1. Top Context Tag -->
          <div id="top-tag" class="top-tag">
            <span class="tag-dot"></span>
            <span class="tag-text">FIFA ONLINE 4 • VÍ DỤ ĐIỂN HÌNH</span>
          </div>

          <!-- 2. Hero Card: Ronaldo R9 Mockup -->
          <div id="hero-card" class="hero-card">

              <div id="overlay-badge" class="overlay-badge">

          <div id="progress-card" class="progress-card">

    <script>
      const tl = gsap.timeline({ paused: true });

      // Ken Burns Slow Camera Zoom on card image (0s to 8.97s)
      tl.fromTo(
        ".card-img",
        { scale: 1 },
        { scale: 1.12, duration: 8.97, ease: "none" },
        0
      );

      // Hero Card: Spiral Entrance Transition at t = 0.2s
      tl.fromTo(
        "#hero-card",
        { scale: 0, rotation: -70, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
        0.2
      );

      // Top Context Tag drops in at t = 0.75s
      tl.fromTo(
        "#top-tag",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.75
      );

      // Progress Card enters from bottom at t = 1.35s
      tl.fromTo(
        "#progress-card",
        { y: 45, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        1.35
      );

      // Seek-safe Progress Bar fill from scaleX 0 to 1 with explicit left center origin
      tl.fromTo(
        "#progress-fill",
        { scaleX: 0, transformOrigin: "left center" },
        { scaleX: 1, transformOrigin: "left center", duration: 2.6, ease: "power2.inOut" },
        2.3
      );

      // Overlay 1: Label "VẬT PHẨM ĐỈNH CAO" springs in at t = 5.26s (atMs: 118550)
      // Settles into deliberate level rotation: 0 (no accidental tilt)
      tl.fromTo(
        "#overlay-badge",
        { scale: 0, rotation: -12, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        5.26
      );

      // Overlay 2: Punch Phrase "RÔ BÉO: 500 CỦ" pops up at t = 7.18s (atMs: 120470)
      tl.fromTo(
        "#punch-banner",
        { scale: 0.85, y: 25, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        7.18
      );

      // Overlay 3: Clock Icon Badge arrives at t = 8.18s (atMs: 121470)
      tl.fromTo(
        "#clock-badge",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        8.18
      );

      // Clock hands: rotation and transformOrigin established purely via explicit GSAP fromTo state
      tl.fromTo(
        "#clock-hands",
        { rotation: 0, transformOrigin: "18px 18px" },
        { rotation: 360, transformOrigin: "18px 18px", duration: 0.6, ease: "power1.inOut" },
        8.22
      );

      // Register master timeline on window.__timelines
      window.__timelines["scene-s15"] = tl;
    </script>
