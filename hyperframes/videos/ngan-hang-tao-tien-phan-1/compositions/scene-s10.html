        <div id="camera-wrap">
          <div class="content-layout">
            <!-- 1. Header Badge -->
            <div id="header-badge" class="header-pill">
              <span class="accent-dot"></span>

    <!-- GSAP Seekable Timeline Script -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // Measure SVG path lengths for the self-drawing 'rise' icon
      const riseMain = document.getElementById("rise-path-main");
      const riseHead = document.getElementById("rise-path-head");
      const lenMain = riseMain.getTotalLength();
      const lenHead = riseHead.getTotalLength();

      riseMain.style.strokeDasharray = lenMain;
      riseMain.style.strokeDashoffset = lenMain;
      riseHead.style.strokeDasharray = lenHead;
      riseHead.style.strokeDashoffset = lenHead;

      // 0.0s - 6.64s: Subtle camera zoom
      tl.fromTo("#camera-wrap", { scale: 1.0 }, { scale: 1.04, duration: 6.64, ease: "none" }, 0);

      // Entrance strike animation (0.05s - 0.45s)
      tl.fromTo("#header-badge", { y: -50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power4.out" }, 0.05);
      tl.fromTo("#flow-card", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "power4.out" }, 0.15);
      tl.fromTo("#multiplier-badge", { scale: 0.6, opacity: 0 }, { scale: 1.0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.35);
      tl.fromTo("#goods-card", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "power4.out" }, 0.25);

      // 1.62s: Overlay 1: 'SẢN LƯỢNG ĐỨNG YÊN' stamp-strike
      tl.fromTo("#stamp-banner", { scale: 1.25, opacity: 0 }, { scale: 1.0, opacity: 1, duration: 0.35, ease: "power4.out" }, 1.62);

      // 2.80s - 3.80s: Price tags erupting
      tl.fromTo("#surge-tag-1", { scale: 0.5, opacity: 0, y: 15 }, { scale: 1.0, opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 2.80);
      tl.fromTo("#surge-tag-2", { scale: 0.5, opacity: 0, y: 15 }, { scale: 1.0, opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 3.20);
      tl.fromTo("#surge-tag-3", { scale: 0.5, opacity: 0, y: 15 }, { scale: 1.0, opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, 3.60);

      // 4.57s: Overlay 2: 'GIÁ CẢ LEO THANG'
      tl.fromTo("#punch-banner", { y: 35, opacity: 0, scale: 0.95 }, { y: 0, opacity: 1, scale: 1.0, duration: 0.45, ease: "power3.out" }, 4.57);

      // 6.14s: Overlay 3: 'icon' 'rise' drawing
      tl.to("#rise-path-main", { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" }, 6.14);
      tl.to("#rise-path-head", { strokeDashoffset: 0, duration: 0.16, ease: "power2.out" }, 6.32);

      // Register the paused timeline with HyperFrames runtime
      window.__timelines["scene-s10"] = tl;
    </script>
