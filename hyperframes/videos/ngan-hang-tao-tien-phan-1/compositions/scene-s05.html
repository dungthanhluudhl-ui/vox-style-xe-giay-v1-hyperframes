    <div
      id="root"
      data-composition-id="scene-s05"

    >
      <!-- Single Clean Timed Scene Clip -->
      <section id="scene-s05" class="clip" data-start="0" data-duration="8.4">
        <!-- 4 Ruled Horizontal Lines (20%, 40%, 60%, 80%) for Chart Variant -->
        <div class="chart-line" style="top: 384px;" data-layout-ignore="true"></div>
        <div class="chart-tick" style="top: 384px;" data-layout-ignore="true"></div>

        <div class="chart-line" style="top: 1152px;" data-layout-ignore="true"></div>
        <div class="chart-tick" style="top: 1152px;" data-layout-ignore="true"></div>

        <div class="chart-line" style="top: 1536px;" data-layout-ignore="true"></div>
        <div class="chart-tick" style="top: 1536px;" data-layout-ignore="true"></div>

        <!-- Camera Rig for gentle documentary zoom -->
        <div id="camera-rig">
          <!-- Category Header -->
          <div class="header-wrapper" id="header-tag">
            <span class="header-kicker">THỐNG KÊ KINH TẾ // DỮ LIỆU</span>

          <!-- Central Data Pillar Group -->
          <div class="pillar-container" id="pillar-group">
            <div class="datum-line" id="pillar-base-line" data-layout-ignore="true"></div>

            <!-- Massive Top Segment (92% - 97%) -->
            <div id="pillar-top-block" data-layout-allow-occlusion="true" data-layout-allow-overlap="true">
              <div class="block-pattern" data-layout-ignore="true"></div>
              <h2 class="stat-top-number">92% – 97%</h2>

    <!-- GSAP Seekable Timeline -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // 0. Slow documentary camera zoom-in from explicit 1.0 to 1.025
      tl.fromTo("#camera-rig",
        { scale: 1 },
        { scale: 1.025, duration: 8.4, ease: "none" },
        0
      );

      // 1. Entrance (Punch) at 0.15s
      tl.fromTo("#header-tag",
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.15
      );

      tl.fromTo("#pillar-base-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power2.out" },
        0.2
      );

      // Pillar shoots up with explicit endpoint values
      tl.fromTo("#pillar-top-block",
        { scaleY: 0, opacity: 0, y: 0 },
        { scaleY: 1, opacity: 1, y: 0, duration: 0.7, ease: "power4.out" },
        0.3
      );

      tl.fromTo("#pillar-bottom-slice",
        { scaleY: 0, opacity: 0, y: 0 },
        { scaleY: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.5
      );

      // 2. Overlay 1: "GIẤY VÀ XU" (entrance: 1.32s, hold 1.8s -> exit: 3.12s)
      tl.fromTo("#label-paper-coin",
        { opacity: 0, scale: 0.88, y: 15 },
        { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "power3.out" },
        1.32
      );

      tl.to("#label-paper-coin", {
        opacity: 0,
        y: -15,
        scale: 0.95,
        duration: 0.3,
        ease: "power2.in"
      }, 3.12);

      // 3. The Separation & Reveal (3.6s - 4.8s)
      // Laser incision across the base using scaleX on transforms
      tl.fromTo("#laser-cut",
        { scaleX: 0, opacity: 1 },
        { scaleX: 1, opacity: 1, duration: 0.35, ease: "power2.inOut" },
        3.6
      );

      tl.to("#laser-cut", {
        opacity: 0,
        duration: 0.2,
        ease: "power1.out"
      }, 3.95);

      // Pillar separates: Top block moves up, bottom slice moves down & turns orange
      tl.to("#pillar-top-block", {
        y: -24,
        duration: 0.55,
        ease: "power3.out"
      }, 3.95);

      tl.to("#pillar-bottom-slice", {
        y: 20,
        backgroundColor: "#FF6A1A",
        borderColor: "#FF6A1A",
        duration: 0.55,
        ease: "power3.out"
      }, 3.95);

      tl.to("#slice-label", {
        color: "#141414",
        duration: 0.25
      }, 4.05);

      // Slice callout appears smoothly
      tl.fromTo("#slice-callout",
        { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" },
        4.25
      );

      // 4. Overlay 2: Punch Phrase "CHỈ CHIẾM 3% - 8%" (entrance: 5.8s, hold 2.4s)
      tl.fromTo("#punch-card",
        { opacity: 0, scale: 0.9, y: -20 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" },
        5.8
      );

      // 5. Overlay 3: Density Icon (entrance: 7.3s, hold to end)
      tl.fromTo("#density-badge",
        { opacity: 0, scale: 0.88, y: 18 },
        { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" },
        7.3
      );

      // Pulse the active density dot (finite repeat, seek-safe)
      tl.fromTo(".density-dot.active",
        { scale: 1 },
        { scale: 1.35, duration: 0.32, yoyo: true, repeat: 1, ease: "power2.out" },
        7.65
      );

      // Register the paused timeline with exact composition ID
      window.__timelines["scene-s05"] = tl;
    </script>
