    <script>
      // Khởi tạo đo đạc SVG Stroke Paths chính xác
      document.querySelectorAll(".draw-path").forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = (len + 1) + "px";
        p.style.strokeDashoffset = (len + 1) + "px";

      // Tạo timeline GSAP tất định, paused
      const tl = gsap.timeline({ paused: true });

      // =================================================================
      // HERO CARD CHUNG & CAMERA MOTION

      // Strike transition entrance cho hero card
      tl.fromTo(
        "#hero-card",
        { y: 50, scale: 0.95, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power4.out" },
        0.05
      );

      tl.fromTo(
        "#hero-img",
        { transformOrigin: "center 20%", scale: 1.25, y: 0, x: 0 },
        { scale: 1.1, duration: 4.06, ease: "none" },
        0
      );

      // S16-2: Cut sang khu vực tiền ảo bùng nổ + Camera pan-right
      tl.set("#hero-img", { transformOrigin: "center 80%", scale: 1.35, y: -75, x: -35 }, 4.06);
      tl.to("#hero-img", { x: 35, duration: 2.88, ease: "none" }, 4.06);

      // Chuyển corner tag tương ứng
      tl.to("#corner-tag-s1", { opacity: 0, duration: 0.1 }, 4.06);
      tl.fromTo("#corner-tag-s2", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, 4.06);

      // =================================================================
      // CHOREOGRAPHY SHOT 1: (0s -> 4.06s)

      tl.fromTo(
        "#s1-data-panel",
        { y: 60, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.2
      );

      // Strike-through gạch cam giá 500M BP
      tl.to(
        "#s1-strike-bar",
        { scaleX: 1, duration: 0.35, ease: "power2.inOut" },
        0.75
      );

      // Vẽ biểu đồ tụt dốc
      tl.to(
        "#s1-crash-path",
        { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
        0.85
      );

      // Giá mới 50M nảy vào
      tl.fromTo(
        "#s1-new-price-wrap",
        { scale: 0.75, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        1.15
      );

      // Overlay label: MÙA THẺ MỚI (1.75s, hold 1.6s)
      tl.fromTo(
        "#s1-label-season",
        { scale: 0.6, opacity: 0, rotation: -12 },
        { scale: 1, opacity: 1, rotation: -4, duration: 0.38, ease: "power3.out" },
        1.75
      );
      tl.to(
        "#s1-label-season",
        { opacity: 0, scale: 0.9, duration: 0.25, ease: "power1.in" },
        3.35
      );

      // Punch Phrase: TỤT DỐC: CÒN 50 CỦ (3.40s)
      tl.fromTo(
        "#s1-punch-phrase",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power4.out" },
        3.40
      );

      // Icon fall (3.52s)
      tl.fromTo(
        "#s1-icon-fall",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.28, ease: "power3.out" },
        3.52
      );
      tl.to(
        "#s1-icon-fall-path",
        { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
        3.55
      );
      tl.to(

        { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },

        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },

      );

      // Biểu đồ dựng đứng vẽ lên

      // Bộ đếm nhảy số phi mã: 50 -> 5000 Tỷ BP
