<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      /* Background Chart Variant */
      #chart-bg-layer {
        position: absolute;
        inset: 0;
        background-color: #E7E3D9;
      }
      .grid-pattern {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }

      /* Hero Media Layer with Camera Rig */
      #camera-rig {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      #video-wrapper {
        position: absolute;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #main-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Chart Elements SVG */
      .chart-elements-svg {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
        mix-blend-mode: multiply;
      }
      .chart-line-h {
        transform-origin: 0% 50%;
      }
      .chart-tick {
        transform-origin: 0% 50%;
      }
      .chart-label {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 700;
        font-size: 20px;
        fill: #141414;
        letter-spacing: 1px;
      }

      /* UI & Overlays Layer: Strictly separated zones */
      .overlay-center-box {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Zone 1 (Upper zone): Cost Annotation (#cost-badge) */
      #cost-overlay-slot {
        top: 290px;
      }
      #cost-badge {
        position: relative;
        background: #141414;
        border: 3.5px solid #FF6A1A;
        border-radius: 14px;
        padding: 20px 38px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
        opacity: 0;
        will-change: transform, opacity;
      }
      .badge-tag {
        font-size: 19px;
        font-weight: 700;
        color: #FF6A1A;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .badge-main-text {
        font-size: 48px;
        font-weight: 900;
        color: #F7F4EC;
        line-height: 1.15;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .badge-sub-text {
        font-size: 22px;
        font-weight: 700;
        color: #E7E3D9;
        margin-top: 6px;
        letter-spacing: 1px;
      }

      /* Zone 2 (Lower zone): Punch Phrase Card (#punch-badge) well above caption safe zone */
      #punch-overlay-slot {
        bottom: 430px;
      }
      #punch-badge {
        position: relative;
        background: #141414;
        border: 4px solid #141414;
        border-radius: 12px;
        padding: 26px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 12px 12px 0px #FF6A1A, 0 24px 48px rgba(0, 0, 0, 0.4);
        opacity: 0;
        will-change: transform, opacity;
      }
      .punch-tag {
        font-size: 22px;
        font-weight: 700;
        color: #FF6A1A;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .punch-main-text {
        font-size: 72px;
        font-weight: 900;
        color: #F7F4EC;
        line-height: 1.1;
        letter-spacing: 1px;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .punch-sub-text {
        font-size: 24px;
        font-weight: 700;
        color: #E7E3D9;
        margin-top: 10px;
        letter-spacing: 1.5px;
      }

      /* Signature Brand Orange Bottom Bar */
      #bottom-signature-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 999;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s12"
      data-width="1080"
      data-height="1920"
      data-duration="7.36"
    >
      <!-- Base Chart Background Layer -->
      <div id="chart-bg-layer" class="layer">
        <div class="grid-pattern"></div>
      </div>

      <!-- Hero Video Media Layer with Zoom Camera Motion -->
      <div id="camera-rig" class="layer">
        <div id="video-wrapper">
          <video
            id="main-video"
            data-start="0"
            data-duration="7.36"
            data-media-start="0.3"
            muted
            playsinline
            src="assets/vid-04-dollar-profit-cost-breakdown.mp4"
          ></video>
        </div>

        <!-- Ruled Horizontal Chart Lines & Level Indicators -->
        <svg id="chart-overlay" class="chart-elements-svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <!-- 4 Ruled Horizontal Lines across canvas -->
          <line class="chart-line-h" x1="0" y1="360" x2="1080" y2="360" stroke="rgba(20,20,20,0.32)" stroke-width="2.5" />
          <line class="chart-line-h" x1="0" y1="720" x2="1080" y2="720" stroke="rgba(20,20,20,0.32)" stroke-width="2.5" />
          <line class="chart-line-h" x1="0" y1="1080" x2="1080" y2="1080" stroke="rgba(20,20,20,0.32)" stroke-width="2.5" />
          <line class="chart-line-h" x1="0" y1="1440" x2="1080" y2="1440" stroke="rgba(20,20,20,0.32)" stroke-width="2.5" />

          <!-- Left-Edge Orange Tick Marks -->
          <rect class="chart-tick" x="0" y="354" width="32" height="12" fill="#FF6A1A" />
          <rect class="chart-tick" x="0" y="714" width="32" height="12" fill="#FF6A1A" />
          <rect class="chart-tick" x="0" y="1074" width="32" height="12" fill="#FF6A1A" />
          <rect class="chart-tick" x="0" y="1434" width="32" height="12" fill="#FF6A1A" />

          <!-- Chart Level Labels -->
          <text class="chart-label" x="44" y="348">MỨC 100% — $10.00</text>
          <text class="chart-label" x="44" y="708">MỨC 75%</text>
          <text class="chart-label" x="44" y="1068">MỨC 50%</text>
          <text class="chart-label" x="44" y="1428">MỨC 25%</text>
        </svg>
      </div>

      <!-- UI Annotation Overlays in Separate Zones -->
      <div id="ui-layer" class="layer">
        <!-- Zone 1: Cost Annotation "CHI PHÍ: 3 CENT" (atMs 95010 -> offset 2.81s) -->
        <div id="cost-overlay-slot" class="overlay-center-box">
          <div id="cost-badge">
            <span class="badge-tag">CHI PHÍ IN ẤN</span>
            <span class="badge-main-text">CHI PHÍ: 3 CENT</span>
            <span class="badge-sub-text">TỨC 0,03 USD / TỜ</span>
          </div>
        </div>

        <!-- Zone 2: Punch Phrase "MỆNH GIÁ: $10" (firm arrival at t = 5.50s, holds to scene end) -->
        <div id="punch-overlay-slot" class="overlay-center-box">
          <div id="punch-badge">
            <span class="punch-tag">GIÁ TRỊ THỰC TẾ</span>
            <span class="punch-main-text">MỆNH GIÁ: $10</span>
            <span class="punch-sub-text">CHÊNH LỆCH GẤP 333 LẦN</span>
          </div>
        </div>
      </div>

      <!-- Signature Orange Bar at Bottom Edge -->
      <div id="bottom-signature-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Scene Entrance: "grow" animation (0s - 0.5s)
      tl.fromTo(
        "#camera-rig",
        { scale: 0.92, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0
      );

      // Camera Motion: continuous cinematic zoom-in across scene duration
      tl.to(
        "#camera-rig",
        { scale: 1.06, duration: 6.86, ease: "none" },
        0.5
      );

      // 2. Chart lines & ticks progressive entrance
      tl.fromTo(
        ".chart-line-h",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.55, stagger: 0.08, ease: "power2.out", transformOrigin: "0% 50%" },
        0.15
      );
      tl.fromTo(
        ".chart-tick",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.4, stagger: 0.08, ease: "power2.out", transformOrigin: "0% 50%" },
        0.25
      );
      tl.fromTo(
        ".chart-label",
        { opacity: 0, x: -16 },
        { opacity: 0.75, x: 0, duration: 0.45, stagger: 0.08, ease: "power2.out" },
        0.35
      );

      // 3. Zone 1: Cost Annotation "CHI PHÍ: 3 CENT"
      // Enters at t = 2.81s (spoken beat "3 cent"), holds 2.0s
      tl.fromTo(
        "#cost-badge",
        { scale: 0.85, opacity: 0, y: 28 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        2.81
      );

      // Clean opacity fade out before punch badge enters
      tl.to(
        "#cost-badge",
        { opacity: 0, y: -20, scale: 0.95, duration: 0.35, ease: "power2.in" },
        4.81
      );

      // 4. Zone 2: Punch Phrase "MỆNH GIÁ: $10"
      // Arrives firmly at t = 5.50s into dedicated lower zone and holds 1.86s to scene end (>= 1.6s bar)
      tl.fromTo(
        "#punch-badge",
        { scale: 0.85, opacity: 0, y: 36 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        5.50
      );

      // Register master timeline on window.__timelines
      window.__timelines["scene-s12"] = tl;
    </script>
  
    </template>
  </body>
</html>
