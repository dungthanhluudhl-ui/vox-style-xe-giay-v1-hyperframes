        var length = Math.ceil(el.getTotalLength());
        el.style.strokeDasharray = length;
        el.style.strokeDashoffset = length;

    // Khởi tạo Timeline paused duy nhất cho composition "scene-s13"

    // 0. Slow Zoom-out Ken Burns trên ảnh hero asset

      0
