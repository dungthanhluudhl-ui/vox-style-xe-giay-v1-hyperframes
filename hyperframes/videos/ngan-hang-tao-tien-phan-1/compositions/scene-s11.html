  <script>
    const tl = gsap.timeline({ paused: true });

    // Khởi tạo transform-origin tường minh ngay tại mốc t=0 (không animate transformOrigin)
    tl.set("#peel-curl", { transformOrigin: "top right" }, 0);
    tl.set("#vault-box", { transformOrigin: "50% 50%" }, 0);
    tl.set("#gauge-group", { transformOrigin: "0px 0px" }, 0);
    tl.set("#gauge-needle", { transformOrigin: "0px 0px" }, 0);
    tl.set("#valve-wheel", { transformOrigin: "0px 0px" }, 0);
    tl.set("#ban-overlay", { transformOrigin: "0px 0px" }, 0);
    tl.set("#state-stamp", { transformOrigin: "50% 50%" }, 0);
    tl.set(["#meter-digital", "#meter-cash"], { transformOrigin: "left center" }, 0);

    // 0.0s - 0.7s: Peel Transition mở màn cảnh
    tl.fromTo(
      "#peel-curl",
      { x: 0, y: 0, opacity: 1 },
      { x: 1200, y: -800, opacity: 0, duration: 0.7, ease: "power2.inOut" },
      0
    );

    tl.fromTo(
      "#scene-content",
      { clipPath: "polygon(0 0, 100% 0, 100% 0, 0 0)" },
      { clipPath: "polygon(0 0, 100% 0, 100% 100%, 0 100%)", duration: 0.65, ease: "power3.out" },
      0
    );

    // Xuất hiện Header & Kho tiền
    tl.fromTo(
      "#header-card",
      { y: -30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.15
    );

    tl.fromTo(
      "#vault-box",
      { scale: 0.88, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
      0.22
    );

    // Đồng hồ áp lực và dòng tiền mặt bắt đầu chảy
    tl.fromTo(
      "#gauge-group",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      0.3
    );

    // Gauge needle writer 1: tăng áp lực từ -60 đến 48
    tl.fromTo(
      "#gauge-needle",
      { rotation: -60 },
      { rotation: 48, duration: 0.7, ease: "power2.out" },
      0.4
    );

    tl.fromTo(
      ".flow-bill-top",
      { y: -35, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, stagger: 0.08, ease: "power2.out" },
      0.45
    );

    // Gauge needle writer 2: giảm áp lực từ 48 về -42 (endpoint tường minh)
    tl.fromTo(
      "#gauge-needle",
      { rotation: 48 },
      { rotation: -42, duration: 0.45, ease: "power3.in" },
      1.25
    );

    // Valve wheel writer: xoay từ 0 đến 220 độ
    tl.fromTo(
      "#valve-wheel",
      { rotation: 0 },
      { rotation: 220, duration: 0.5, ease: "power2.inOut" },
      1.3
    );

    // Clamps siết chặt với endpoint tường minh
    tl.fromTo(
      "#clamp-left",
      { x: 0 },
      { x: 38, duration: 0.35, ease: "power3.in" },
      1.35
    );

    tl.fromTo(
      "#clamp-right",
      { x: 0 },
      { x: -38, duration: 0.35, ease: "power3.in" },
      1.35
    );

    // 1.54s: Overlay Icon Ban xuất hiện
    tl.fromTo(
      "#ban-overlay",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      1.54
    );
