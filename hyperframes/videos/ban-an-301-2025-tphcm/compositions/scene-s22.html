    <script>
      // Single paused seekable GSAP timeline matching root data-composition-id
      const tl = gsap.timeline({ paused: true });

      // 0.0s - 0.7s: Scene entrance (rise)
      tl.fromTo(
        "#header-box",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.1,
      );

      // 0.35s - 1.0s: Mốc bắt đầu 22/10/2022 xuất hiện
      tl.fromTo(
        "#node-start",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.35,
      );
      tl.fromTo(
        "#card-start",
        { x: -25, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.45,
      );

      // 0.85s - 1.55s: Vẽ đoạn trục trên
      tl.fromTo(
        "#spine-upper",
        { scaleY: 0 },
        { scaleY: 1, duration: 0.7, ease: "power2.inOut" },
        0.85,
      );

      // 3.32s: Overlay 1 "4 THÁNG LẨN TRỐN" xuất hiện (atMs 182800 -> 3.32s)
      tl.fromTo(
        "#card-middle",
        { scale: 0.88, y: 20, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        3.32,
      );

      // 5.52s: Overlay 1 ẩn đi sau đúng holdMs = 2200ms (3.32s + 2.2s = 5.52s)
      tl.to(
        "#card-middle",
        { opacity: 0, y: -15, duration: 0.35, ease: "power2.in" },
        5.52,
      );

      // 4.60s - 5.30s: Vẽ tiếp đoạn trục dưới
      tl.fromTo(
        "#spine-lower",
        { scaleY: 0 },
        { scaleY: 1, duration: 0.7, ease: "power2.inOut" },
        4.6,
      );

      // 6.12s: Overlay 2 Punch-phrase "22/02/2023 ĐẦU THÚ" xuất hiện (atMs 185600 -> 6.12s)
      tl.fromTo(
        "#node-end",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        6.12,
      );
      tl.fromTo(
        "#card-end",
        { scale: 0.9, y: 20, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        6.12,
      );

      // 6.25s: Thẻ tiếp nhận hồ sơ trượt lên sẵn sàng
      tl.fromTo(
        "#stamp-box",
        { y: 25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        6.25,
      );

      // 6.70s: Con dấu đỏ đóng dứt khoát lên biên bản tiếp nhận
      tl.fromTo(
        "#seal-mark",
        { scale: 2.2, rotation: 20, opacity: 0 },
        { scale: 1, rotation: -8, opacity: 1, duration: 0.32, ease: "power3.out" },
        6.7,
      );

      // 8.20s - 8.32s: Kết thúc nhịp hiển thị
      tl.to(
        ["#card-end", "#node-end", "#stamp-box"],
        { opacity: 0, duration: 0.12, ease: "power2.in" },
        8.2,
      );

      // Register timeline
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s22"] = tl;
    </script>
