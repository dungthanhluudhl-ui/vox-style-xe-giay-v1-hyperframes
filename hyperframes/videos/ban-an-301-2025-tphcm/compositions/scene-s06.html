      <style>

.hf-text-ink { color: #141414; }

      /* Bảng màu an toàn chuẩn WCAG */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #f7f4ec; }
      .hf-hl-orange { color: #141414; background-color: #ff6a1a; }
      .hf-plate-ink { color: #f7f4ec; background-color: #141414; }
      .hf-plate-ink-orange { color: #ff6a1a; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #f5f0e4; }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        margin: 0;
        background: #f5f0e4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        width: 1080px;
        height: 1920px;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f5f0e4;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Thanh cam nhận diện cố định ở mép dưới */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background: #ff6a1a;
        z-index: 100;
      }

      /* Bố cục nội dung chính trong dải an toàn (Y: 160px - 1390px) */
      .scene-container {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 175px 50px 540px 50px;
      }

      /* Khối tiêu đề hồ sơ */
      .docket-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        margin-bottom: 30px;
      }
      .docket-meta {
        font-size: 20px;
        font-weight: 700;
        color: #141414;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 12px;
      }
      .main-punch-badge {
        background: #141414;
        color: #ff6a1a;
        font-size: 48px;
        font-weight: 900;
        line-height: 1.2;
        padding: 14px 40px;
        border-radius: 8px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.25);
      }
      .context-subtitle {
        margin-top: 14px;
        font-size: 22px;
        font-weight: 700;
        color: #141414;
        background: #e7e3d9;
        border: 2px solid #141414;
        padding: 6px 20px;
        border-radius: 6px;
      }

      /* Danh sách thẻ hồ sơ hai đối tượng */
      .cards-stack {
        display: flex;
        flex-direction: column;
        gap: 28px;
        width: 100%;
      }

      .docket-card {
        background: #e7e3d9;
        border: 4px solid #141414;
        border-radius: 12px;
        padding: 22px 28px;
        box-shadow: 6px 6px 0px #141414;
        display: flex;
        flex-direction: column;
        height: 350px;
        position: relative;
      }

      .card-topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #141414;
        padding-bottom: 10px;
        margin-bottom: 14px;
      }
      .card-index {
        font-size: 20px;
        font-weight: 900;
        color: #141414;
        letter-spacing: 1px;
      }
      .card-status {
        font-size: 18px;
        font-weight: 900;
        background: #f5f0e4;
        border: 2px solid #141414;
        color: #141414;
        padding: 4px 14px;
        border-radius: 4px;
        letter-spacing: 1px;
      }

      /* Hàng diagram biến đổi mã hóa -> định danh */
      .transform-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        margin-bottom: 16px;
      }

      .code-side {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 380px;
      }
      .side-label {
        font-size: 17px;
        font-weight: 700;
        color: #141414;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .code-box {
        position: relative;
        width: 100%;
        height: 110px;
        background: #f5f0e4;
        border: 3px solid #141414;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .code-text {
        font-size: 64px;
        font-weight: 900;
        color: #141414;
        line-height: 1;
      }

      /* SVG gạch ngang viết tắt */
      .strike-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .strike-line {
        stroke: #ff6a1a;
        stroke-width: 10;
        stroke-linecap: round;
        fill: none;
      }

      .name-hint {
        margin-top: 8px;
        font-size: 20px;
        font-weight: 900;
        color: #141414;
        text-align: center;
      }

      /* Icon mũi tên kết nối: nền kem chữ mực ban đầu (16.2:1), chuyển sang cam chữ mực (6.4:1) khi kích hoạt */
      .arrow-container {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: #f5f0e4;
        border: 3px solid #141414;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .arrow-symbol {
        color: #141414;
        font-size: 28px;
        font-weight: 900;
        line-height: 1;
      }

      /* Khung nhãn đích sau khi giải mã */
      .decode-slot {
        position: relative;
        width: 100%;
        height: 110px;
        border: 3px dashed rgba(20, 20, 20, 0.4);
        border-radius: 8px;
        background: #f5f0e4;
      }
      .decoded-box {
        position: absolute;
        inset: -3px;
        background: #ff6a1a;
        border: 3px solid #141414;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 4px 4px 0px #141414;
      }
      .decoded-text {
        font-size: 58px;
        font-weight: 900;
        color: #141414;
        letter-spacing: 2px;
        line-height: 1;
      }

      /* Tấm nhãn định danh chính thức theo kịch bản */
      .formula-plate {
        background: #141414;
        border-radius: 6px;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
      }
      .formula-text {
        color: #f7f4ec;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 1px;
      }
      .formula-accent {
        color: #ff6a1a;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s06"
      data-width="1080"
      data-height="1920"
      data-duration="11.65"
    >
      <section id="scene-s06" class="clip" data-start="0" data-duration="11.65">
        <div id="scene-wrapper" class="scene-container">
          <!-- Phần tiêu đề cảnh -->
          <div class="docket-header">
            <div id="docket-meta" class="docket-meta">HỒ SƠ TÒA ÁN // ĐỐI TƯỢNG</div>
            <div id="header-badge" class="main-punch-badge">MÃ HÓA BẢN ÁN</div>
            <div id="context-note" class="context-subtitle">
              QUY ƯỚC TÊN GỌI DỄ THEO DÕI
            </div>
          </div>

          <!-- Danh sách 2 thẻ đối tượng -->
          <div class="cards-stack">
            <!-- Thẻ 1: Quách Kiến H -> Kiên -->
            <div id="card-1" class="docket-card">
              <div class="card-topbar">
                <span class="card-index">ĐỐI TƯỢNG 01</span>
                <span id="status-1" class="card-status">KÝ HIỆU BẢN ÁN</span>
              </div>
              <div class="transform-row">
                <div class="code-side">
                  <span class="side-label">KÝ HIỆU GỐC</span>
                  <div class="code-box">
                    <span class="code-text">H</span>
                    <svg class="strike-svg" viewBox="0 0 380 110">
                      <line
                        id="strike-path-1"
                        class="strike-line"
                        x1="40"
                        y1="75"
                        x2="340"
                        y2="35"
                      />
                    </svg>
                  </div>
                  <span class="name-hint">QUÁCH KIẾN H</span>
                </div>

                <div id="arrow-1" class="arrow-container">
                  <span class="arrow-symbol">→</span>
                </div>

                <div class="code-side">
                  <span class="side-label">TÊN QUY ƯỚC</span>
                  <div class="decode-slot">
                    <div id="decoded-box-1" class="decoded-box">
                      <span class="decoded-text">KIÊN</span>
                    </div>
                  </div>
                  <span class="name-hint">ĐÃ ĐỊNH DANH</span>
                </div>
              </div>

              <div id="overlay-badge-1" class="formula-plate">
                <span class="formula-text">
                  QUÁCH KIẾN H = <span class="formula-accent">KIÊN</span>
                </span>
              </div>
            </div>

            <!-- Thẻ 2: Nguyễn Minh N3 -> Nam -->
            <div id="card-2" class="docket-card">
              <div class="card-topbar">
                <span class="card-index">ĐỐI TƯỢNG 02</span>
                <span id="status-2" class="card-status">KÝ HIỆU BẢN ÁN</span>
              </div>
              <div class="transform-row">
                <div class="code-side">
                  <span class="side-label">KÝ HIỆU GỐC</span>
                  <div class="code-box">
                    <span class="code-text">N3</span>
                    <svg class="strike-svg" viewBox="0 0 380 110">
                      <line
                        id="strike-path-2"
                        class="strike-line"
                        x1="40"
                        y1="75"
                        x2="340"
                        y2="35"
                      />
                    </svg>
                  </div>
                  <span class="name-hint">NGUYỄN MINH N3</span>
                </div>

                <div id="arrow-2" class="arrow-container">
                  <span class="arrow-symbol">→</span>

                <div class="code-side">
                  <span class="side-label">TÊN QUY ƯỚC</span>
                  <div class="decode-slot">

                    </div>
                  </div>
                  <span class="name-hint">ĐÃ ĐỊNH DANH</span>
                </div>
              </div>

              <div id="overlay-badge-2" class="formula-plate">

                  NGUYỄN MINH N3 = <span class="formula-accent">NAM</span>

      <!-- Dải cam cố định ở đáy khung hình -->
      <div class="brand-bottom-bar"></div>

    <script>
      // Thiết lập đường gạch nét SVG cho hiệu ứng tự vẽ
      const p1 = document.getElementById("strike-path-1");
      const p2 = document.getElementById("strike-path-2");
      if (p1) {
        const len1 = p1.getTotalLength();
        p1.style.strokeDasharray = len1;
        p1.style.strokeDashoffset = len1;
      }
      if (p2) {
        const len2 = p2.getTotalLength();
        p2.style.strokeDasharray = len2;
        p2.style.strokeDashoffset = len2;
      }

      // Khởi tạo Timeline HyperFrames chính thức (seek-safe, deterministic)
      const tl = gsap.timeline({ paused: true });

      // 0.0s: Chuyển cảnh vào (grow)
      tl.fromTo(
        "#scene-wrapper",
        { scale: 0.94, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.0
      );

      // 0.35s - 0.75s: Tiêu đề và nhãn "MÃ HÓA BẢN ÁN" (khớp atMs 47500 = 0.59s)
      tl.fromTo(
        "#docket-meta",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power1.out" },
        0.35
      );
      tl.fromTo(
        "#header-badge",
        { y: -24, scale: 0.9, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.59
      );
      tl.fromTo(
        "#context-note",
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.75
      );

      // 0.95s - 1.25s: Hai thẻ hồ sơ tiến vào hiển thị ký hiệu mã hóa
      tl.fromTo(
        "#card-1",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.95
      );
      tl.fromTo(
        "#card-2",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.2
      );

      // Trạng thái ban đầu của các nhãn giải mã
      tl.set(["#decoded-box-1", "#decoded-box-2"], { opacity: 0, scale: 0.75 }, 0);
      tl.set(["#overlay-badge-1", "#overlay-badge-2"], { opacity: 0, y: 12 }, 0);

      // 7.49s (atMs 54400): Giải mã Quách Kiến H -> KIÊN
      tl.to(
        "#strike-path-1",
        { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
        7.49
      );
      tl.to("#arrow-1", { backgroundColor: "#FF6A1A", duration: 0.25 }, 7.55);
      tl.to("#status-1", { backgroundColor: "#FF6A1A", duration: 0.25 }, 7.55);
      tl.fromTo(
        "#decoded-box-1",
        { scale: 0.75, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        7.55
      );
      tl.fromTo(
        "#overlay-badge-1",
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        7.49
      );

      // 9.29s (atMs 56200): Giải mã Nguyễn Minh N3 -> NAM
      tl.to(
        "#strike-path-2",
        { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
        9.29
      );
      tl.to("#arrow-2", { backgroundColor: "#FF6A1A", duration: 0.25 }, 9.35);
      tl.to("#status-2", { backgroundColor: "#FF6A1A", duration: 0.25 }, 9.35);
      tl.fromTo(
        "#decoded-box-2",
        { scale: 0.75, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        9.35
      );
      tl.fromTo(
        "#overlay-badge-2",
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        9.29
      );

      // Đăng ký timeline cho HyperFrames seek
      window.__timelines["scene-s06"] = tl;
    </script>
