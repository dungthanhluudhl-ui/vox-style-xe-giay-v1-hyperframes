      /* Sân khấu 3D cho hiệu ứng transition-in "flip" */
      .perspective-stage {
        position: absolute;

      .camera-canvas {
        position: absolute;
        inset: 0;

      /* Ảnh minh họa AI chính phủ toàn bộ khung 1080x1920, giữ nguyên màu gốc */

      /* Lớp dimmer nửa bên trái: mờ dần khi Kiên đã thoát hiểm để dồn trọng tâm sang bên phải */
      .split-dimmer-left {
        position: absolute;

        left: 0;

        background-color: #141414;

      /* Đường phân cách rách giấy / split line đặc trưng Vox */
      .split-divider {

    <!-- Composition Root (1080x1920, 10.4s) -->

      <!-- Lưới giấy ngà Vox -->

        <!-- Perspective Wrapper cho 3D Flip Transition -->

            <!-- Ảnh minh họa gốc (img-11): phân tách đối chiếu hành vi Kiên & đồng bọn -->

        <!-- UI Overlays Layer (Cố định trong Safe Zone) -->

          </div>

          <!-- Reverse Vector Diagram: Mũi tên uốn ngược 180 độ biểu đạt bản chất -->
          <div id="diagram-box" class="diagram-container">
            <div class="hf-plate-ink diagram-plate">
              <svg class="diagram-svg" viewBox="0 0 912 136">

                <g id="diagram-branch-flee">

                  <text

                  >

    <!-- GSAP Seekable Timeline Script -->
    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      // 1. Giai đoạn mở đầu (0.0s - 2.5s):
      // Transition-in "flip": Sân khấu xoay lật 3D nhẹ vào tầm mắt
      tl.fromTo(
        "#camera-canvas",
        { rotationY: -14, scale: 0.94, opacity: 0 },
        { rotationY: 0, scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
        0
      );

      // Camera motion: Parallax pan chậm từ bên trái (chạy trốn) sang bên phải (truy lùng)
      tl.fromTo(
        "#bg-photo",
        { scale: 1.05, x: 30 },
        { scale: 1.15, x: -40, duration: 10.4, ease: "sine.inOut" },
        0
      );

      // Header Tag trượt vào từ trên
      tl.fromTo(
        "#header-tag",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
        0.35
      );

      // Khung sơ đồ xuất hiện
      tl.fromTo(
        "#diagram-box",
        { y: -20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.55
      );

      // Diagram nhánh 1 (hướng chạy trốn sang trái) vẽ ra
      tl.fromTo(
        "#path-flee",
        { strokeDashoffset: 320 },
        { strokeDashoffset: 0, duration: 0.75, ease: "power2.out" },
        0.75
      );
      tl.fromTo(
        "#arrow-flee-head",
        { scale: 0, transformOrigin: "140px 46px" },
        { scale: 1, duration: 0.25, ease: "power2.out" },
        1.45
      );
      tl.fromTo(
        "#text-flee",
        { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
        1.2
      );

      // Giữ ẩn các nhánh đảo chiều ban đầu
      tl.set("#diagram-pivot", { opacity: 0 }, 0);
      tl.set("#diagram-branch-chase", { opacity: 0 }, 0);
      tl.set("#split-line", { scaleY: 0, opacity: 0 }, 0);

      // 2. Giai đoạn 2 (2.52s - 4.8s):
      // Overlay 1: "NGUY HIỂM ĐÃ QUA" xuất hiện tại 2.52s (theo shotlist atMs: 99800)
      tl.fromTo(
        "#overlay-left",
        { y: 35, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        2.52
      );

      // Overlay 1 mờ dần ra sau khi giữ đủ 2000ms
      tl.to(
        "#overlay-left",
        { y: -15, opacity: 0, duration: 0.35, ease: "power2.in" },
        4.75
      );

      // 3. Giai đoạn 3 (4.8s - 7.4s):
      // Chuyển biến: Kiên thoát hiểm, gọi người, chuẩn bị hung khí
      // Nửa trái mờ dần biểu thị việc đã thoát khỏi nguy cơ tức thời
      tl.to(
        "#left-dimmer",
        { opacity: 0.7, duration: 0.8, ease: "power2.out" },
        4.6
      );

      // Đường rách ngăn đôi split-line hạ xuống
      tl.fromTo(
        "#split-line",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        4.65
      );

      // Diagram: Bẻ ngược góc 180 độ
      tl.to("#diagram-pivot", { opacity: 1, duration: 0.2 }, 4.8);
      tl.fromTo(
        "#path-pivot-arc",
        { strokeDashoffset: 140 },
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        4.85
      );

      tl.to("#diagram-branch-chase", { opacity: 1, duration: 0.2 }, 5.15);
      tl.fromTo(
        "#path-chase",
        { strokeDashoffset: 360 },
        { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
        5.2
      );
      tl.fromTo(
        "#arrow-chase-head",
        { scale: 0, transformOrigin: "776px 98px" },
        { scale: 1, duration: 0.25, ease: "power2.out" },
        5.75
      );
      tl.fromTo(
        "#text-chase",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
        5.4
      );

      // Overlay 2: "CHUẨN BỊ VŨ KHÍ" xuất hiện tại 5.22s (theo shotlist atMs: 102500)
      tl.fromTo(
        "#overlay-right",
        { y: 35, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        5.22
      );

      // Overlay 2 mờ dần ra sau khi giữ đủ 2000ms
      tl.to(
        "#overlay-right",
        { y: -15, opacity: 0, duration: 0.35, ease: "power2.in" },
        7.45
      );

      // 4. Giai đoạn 4 (7.92s - 10.4s):
      // Punch-phrase: "CHỦ ĐỘNG TRẢ THÙ" xuất hiện tại 7.92s (theo shotlist atMs: 105200)
      tl.fromTo(
        "#overlay-punch",
        { y: 45, opacity: 0, scale: 0.92 },
        { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        7.92
      );

      // Đăng ký timeline gốc duy nhất
      window.__timelines["scene-s12"] = tl;
    </script>
