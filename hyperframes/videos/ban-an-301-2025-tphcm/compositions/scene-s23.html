<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }

      /* Root composition sizing */
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #E7E3D9;
      }

      /* Clip layout contract */
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Lưới nền tinh tế phong cách Vox */
      .vox-grid-bg {
        position: absolute;
        inset: 0;
        background-size: 84px 84px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.15) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.15) 1.5px, transparent 1.5px);
        pointer-events: none;
        z-index: 2;
        mix-blend-mode: multiply;
      }

      /* Wrapper ảnh nền chính - Full bleed 1080x1920 */
      #scene-container {
        position: absolute;
        inset: 0;
        overflow: hidden;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      #bg-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
        will-change: transform;
      }

      /* Lớp phủ dốc bảo vệ vùng đọc chữ và tương phản */
      .scene-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(20, 20, 20, 0.1) 0%, rgba(20, 20, 20, 0.55) 100%);
        pointer-events: none;
        z-index: 1;
      }

      /* Lớp căn giữa cho các overlays (đặt trong dải an toàn y: 160 -> 1390) */
      .overlay-center-box {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 50px;
        pointer-events: none;
        z-index: 10;
      }

      /* Tấm nền đặc bảo đảm 100% WCAG Contrast Ratio (> 4.5:1) */
      .hf-plate-ink {
        background-color: #141414;
        opacity: 1;
        border-radius: 16px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        align-items: center;
        will-change: transform, opacity;
      }

      /* Mini badge trên đầu thẻ */
      .vox-badge {
        background-color: #FF6A1A;
        color: #141414;
        font-weight: 900;
        font-size: 20px;
        line-height: 1;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 8px 20px;
        border-radius: 4px;
        display: inline-block;
        margin-bottom: 20px;
      }

      /* Overlay 1: Scale Card */
      #overlay-scale-card {
        padding: 36px 48px;
        border: 2px solid #FF6A1A;
        width: 100%;
        max-width: 820px;
        text-align: center;
      }

      .scale-svg-container {
        width: 180px;
        height: 150px;
        margin: 10px 0 18px 0;
      }

      .scale-stroke {
        fill: none;
        stroke: #FF6A1A;
        stroke-width: 4.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .scale-subtext {
        color: #E7E3D9;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 1px;
        margin: 0;
        text-transform: uppercase;
      }

      /* Overlay 2: Label Card */
      #overlay-label-card {
        padding: 44px 52px;
        border-left: 10px solid #FF6A1A;
        width: 100%;
        max-width: 900px;
        text-align: center;
      }

      .label-main-text {
        color: #F7F4EC;
        font-size: 58px;
        font-weight: 900;
        line-height: 1.25;
        margin: 0 0 16px 0;
        letter-spacing: -0.5px;
        text-transform: uppercase;
      }

      .label-sub-text {
        color: #FF6A1A;
        font-size: 26px;
        font-weight: 700;
        margin: 0;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      /* Overlay 3: Punch-phrase Card */
      #overlay-punch-card {
        padding: 50px 56px;
        border: 3px solid #FF6A1A;
        width: 100%;
        max-width: 920px;
        text-align: center;
      }

      .punch-main-text {
        color: #F7F4EC;
        font-size: 80px;
        font-weight: 900;
        line-height: 1.15;
        margin: 0 0 20px 0;
        letter-spacing: -1px;
        text-transform: uppercase;
      }

      .punch-accent-bar {
        width: 160px;
        height: 6px;
        background-color: #FF6A1A;
        margin-bottom: 20px;
        border-radius: 3px;
      }

      .punch-sub-text {
        color: #E7E3D9;
        font-size: 28px;
        font-weight: 700;
        margin: 0;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      /* Dải cam mép đáy nhận diện thương hiệu cố định */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s23"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="8.71"
    >
      <!-- Base Shot Layer (Ảnh nền toàn khung + camera zoom-in) -->
      <section id="shot-base" class="clip" data-start="0" data-duration="8.71">
        <div id="scene-container">
          <img
            id="bg-image"
            src="assets/img-01-justice-scale-vigilantism-defense.jpg"
            alt="Cán cân công lý"
          />
          <div class="scene-vignette"></div>
          <div class="vox-grid-bg"></div>
        </div>
      </section>

      <!-- Overlay 1: Icon Scale (atMs: 188800 -> 0.97s, holdMs: 2200 -> 2.2s) -->
      <section id="overlay-scale-clip" class="clip" data-start="0.97" data-duration="2.2">
        <div class="overlay-center-box">
          <div id="overlay-scale-card" class="hf-plate-ink">
            <span class="vox-badge">CÁN CÂN CÔNG LÝ</span>
            <div class="scale-svg-container">
              <svg id="svg-scale" viewBox="0 0 200 160" width="180" height="150" xmlns="http://www.w3.org/2000/svg">
                <!-- Trụ giữa thẳng đứng -->
                <path class="scale-stroke scale-anim-path" d="M 100 15 L 100 145" />
                <!-- Chân đế ngang -->
                <path class="scale-stroke scale-anim-path" d="M 55 145 L 145 145" />
                <!-- Cần cân ngang -->
                <path class="scale-stroke scale-anim-path" d="M 30 45 L 170 45" />
                <!-- Đĩa trái (dây treo và chảo cân) -->
                <path class="scale-stroke scale-anim-path" d="M 30 45 L 10 95" />
                <path class="scale-stroke scale-anim-path" d="M 30 45 L 50 95" />
                <path class="scale-stroke scale-anim-path" d="M 5 95 Q 30 118 55 95 Z" />
                <!-- Đĩa phải (dây treo và chảo cân) -->
                <path class="scale-stroke scale-anim-path" d="M 170 45 L 150 95" />
                <path class="scale-stroke scale-anim-path" d="M 170 45 L 190 95" />
                <path class="scale-stroke scale-anim-path" d="M 145 95 Q 170 118 195 95 Z" />
              </svg>
            </div>
            <p class="scale-subtext">ĐỐI CHIẾU LỖI &amp; MỨC ÁN</p>
          </div>
        </div>
      </section>

      <!-- Overlay 2: Label (atMs: 191800 -> 3.97s, holdMs: 2200 -> 2.2s) -->
      <section id="overlay-label-clip" class="clip" data-start="3.97" data-duration="2.2">
        <div class="overlay-center-box">
          <div id="overlay-label-card" class="hf-plate-ink">
            <span class="vox-badge">TÌNH TIẾT XÁC MINH</span>
            <h2 class="label-main-text">NẠN NHÂN TỪNG TRUY SÁT</h2>
            <p class="label-sub-text">LỖI BAN ĐẦU TỪ PHÍA BỊ HẠI</p>
          </div>
        </div>
      </section>

      <!-- Overlay 3: Punch-phrase (atMs: 194600 -> 6.77s, holdMs: 1900 -> 1.94s) -->
      <section id="overlay-punch-clip" class="clip" data-start="6.77" data-duration="1.94">
        <div class="overlay-center-box">
          <div id="overlay-punch-card" class="hf-plate-ink">
            <span class="vox-badge">TRANH LUẬN PHÁP LÝ</span>
            <h1 class="punch-main-text">VÌ SAO XỬ NẶNG?</h1>
            <div class="punch-accent-bar"></div>
            <p class="punch-sub-text">MỨC ÁN NẶNG NỀ</p>
          </div>
        </div>
      </section>

      <!-- Thanh cam đáy cố định nhận diện thương hiệu -->
      <div id="brand-bottom-bar"></div>
    </div>

    <script>
      // Setup các nét vẽ SVG self-drawing cho icon scale
      const scalePaths = document.querySelectorAll("#svg-scale .scale-anim-path");
      scalePaths.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = length;
        path.style.strokeDashoffset = length;
      });

      // Tạo paused timeline duy nhất cho composition
      const tl = gsap.timeline({ paused: true });

      // 1. Scene Entrance (Flip 3D transition) tại t=0
      tl.fromTo(
        "#scene-container",
        {
          opacity: 0,
          rotationY: -16,
          scale: 0.94,
          transformPerspective: 1200
        },
        {
          opacity: 1,
          rotationY: 0,
          scale: 1.0,
          duration: 0.8,
          ease: "power3.out"
        },
        0
      );

      // 2. Camera Motion: Zoom-in từ 1.0x lên 1.09x xuyên suốt thời lượng scene (8.71s)
      tl.fromTo(
        "#bg-image",
        { scale: 1.0 },
        {
          scale: 1.09,
          duration: 8.71,
          ease: "none"
        },
        0
      );

      // 3. Overlay 1 Animation: Icon Scale Card (atMs 188800 -> 0.97s)
      tl.fromTo(
        "#overlay-scale-card",
        {
          opacity: 0,
          scale: 0.86,
          y: 35
        },
        {
          opacity: 1,
          scale: 1.0,
          y: 0,
          duration: 0.45,
          ease: "power3.out"
        },
        0.97
      );

      // Các nét của icon scale tự vẽ dần (SVG path draw)
      tl.to(
        "#svg-scale .scale-anim-path",
        {
          strokeDashoffset: 0,
          duration: 0.65,
          stagger: 0.05,
          ease: "power2.out"
        },
        1.1
      );

      // Thu nhẹ Overlay 1 trước khi kết thúc slot hiển thị của nó
      tl.to(
        "#overlay-scale-card",
        {
          opacity: 0,
          y: -20,
          duration: 0.25,
          ease: "power2.in"
        },
        2.92
      );

      // 4. Overlay 2 Animation: Label "NẠN NHÂN TỪNG TRUY SÁT" (atMs 191800 -> 3.97s)
      tl.fromTo(
        "#overlay-label-card",
        {
          opacity: 0,
          scale: 0.9,
          y: 40
        },
        {
          opacity: 1,
          scale: 1.0,
          y: 0,
          duration: 0.45,
          ease: "power3.out"
        },
        3.97
      );

      // Thu nhẹ Overlay 2 trước khi kết thúc slot hiển thị của nó
      tl.to(
        "#overlay-label-card",
        {
          opacity: 0,
          y: -20,
          duration: 0.25,
          ease: "power2.in"
        },
        5.92
      );

      // 5. Overlay 3 Animation: Punch-phrase "VÌ SAO XỬ NẶNG?" (atMs 194600 -> 6.77s)
      tl.fromTo(
        "#overlay-punch-card",
        {
          opacity: 0,
          scale: 0.92,
          y: 30
        },
        {
          opacity: 1,
          scale: 1.0,
          y: 0,
          duration: 0.38,
          ease: "power4.out"
        },
        6.77
      );

      // Đăng ký timeline chính lên window.__timelines
      window.__timelines["scene-s23"] = tl;
    </script>
  
    </template>
  </body>
</html>
