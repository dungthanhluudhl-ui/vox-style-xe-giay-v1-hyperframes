    // Khởi tạo GSAP Timeline tuân thủ Deterministic Render Contract của HyperFrames

    const scaleIconPath = document.getElementById("icon-scale-path");

      scaleIconPath.style.strokeDasharray = pathLen;

    // 1. Entrance "zoom-through" toàn khung hình (0.0s -> 0.8s)

      0.0
    );

      { rotation: -2, duration: 0.8, ease: "power2.out" },
      0.2
    );
    tl.fromTo("#suspension-left",
      { y: 0 },
      { y: 8, duration: 0.8, ease: "power2.out" },
      0.2
    );
    tl.fromTo("#suspension-right",
      { y: 0 },

    // 3. Overlay 1: Nhãn "SƠ THẨM ĐÃ XEM XÉT" xuất hiện lúc 1.12s (tương ứng 306400ms trong kịch bản)
    tl.fromTo("#stamp-already-considered",
      { scale: 0, opacity: 0, rotation: -12 },
      { scale: 1, opacity: 1, rotation: -4, duration: 0.55, ease: "power3.out" },
      1.12

    // Chồng tài liệu hơi khẽ lún xuống do có tem đóng mộc (tất định, giá trị tuyệt đối)

      { y: 0 },
      { y: 6, duration: 0.25, ease: "power1.out" },
      1.22
    );

    // 4. Quả tạ đen khổng lồ lao xuống từ trên cao lúc 4.15s và giáng mạnh xuống đĩa cân lúc 4.7s

      { y: -380, opacity: 0, scale: 1.2 },
      { y: 0, opacity: 1, scale: 1.0, duration: 0.55, ease: "power4.in" },
      4.15

    // 5. Cú va chạm cực mạnh: Cán cân nghiêng đổ hoàn toàn sang phải (4.7s -> 5.3s)

    );
    tl.to("#suspension-left",
      { y: -110, duration: 0.6, ease: "power3.out" },
      4.7
    );
    tl.to("#suspension-right",
      { y: 110, duration: 0.6, ease: "power3.out" },

    );

    // Chồng giấy ở đĩa trái bị nảy tung nhẹ do quán tính hất lên (tất định, giá trị tuyệt đối)
    tl.fromTo("#mitigating-docs-pack",
      { y: 6 },
      { y: -30, duration: 0.35, ease: "power2.out" },

    tl.to("#mitigating-docs-pack",
      { y: 0, duration: 0.3, ease: "power1.in" },

    // Vẽ nét SVG icon scale
    if (scaleIconPath) {
