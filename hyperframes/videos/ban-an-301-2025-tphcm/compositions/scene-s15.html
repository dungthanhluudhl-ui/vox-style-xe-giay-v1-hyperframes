<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #141414;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      width: 1080px;
      height: 1920px;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    /* Quy ước bắt buộc: .clip sử dụng position: absolute; inset: 0 */
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Camera rig & background photo */
    .camera-rig {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .bg-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 45%;
      display: block;
    }

    /* Hiệu ứng chớp nhẹ khi strike */
    .strike-flash {
      position: absolute;
      inset: 0;
      background-color: #FFFFFF;
      opacity: 0;
      pointer-events: none;
      z-index: 3;
    }

    /* Background variant "chart": 4 đường kẻ ngang tại 20%, 40%, 60%, 80% + vạch đo cam */
    .chart-variant-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }

    .chart-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, rgba(255, 106, 26, 0.9) 0px, rgba(255, 106, 26, 0.9) 32px, rgba(247, 244, 236, 0.35) 32px, rgba(247, 244, 236, 0.15) 100%);
    }

    .chart-line-1 { top: 384px; }  /* 20% */
    .chart-line-2 { top: 768px; }  /* 40% */
    .chart-line-3 { top: 1152px; } /* 60% */
    .chart-line-4 { top: 1536px; } /* 80% */

    /* Overlay 1: Nhãn chứng cứ "ĐẬP PHÁ XE MÁY" */
    .label-host {
      display: flex;
      align-items: flex-start;
      padding-top: 240px;
      padding-left: 60px;
      pointer-events: none;
      z-index: 10;
    }

    .evidence-tag {
      background-color: #141414;
      border-left: 10px solid #FF6A1A;
      border-radius: 8px;
      padding: 18px 32px;
      display: inline-flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
      will-change: transform, opacity;
    }

    .evidence-tag-text {
      color: #F7F4EC;
      font-weight: 900;
      font-size: 40px;
      letter-spacing: 1.5px;
      line-height: 1.2;
      text-transform: uppercase;
    }

    /* Overlay 2: Con tem giám định định giá "THIỆT HẠI 6.300.000Đ"
       Đặt trong dải hữu dụng an toàn (usableBandY [160, 1390]), cách xa caption zone ở đáy */
    .punch-host {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 680px;
      pointer-events: none;
      z-index: 20;
    }

    .assessment-card {
      background-color: #141414;
      border: 4px solid #FF6A1A;
      border-radius: 16px;
      padding: 26px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.75);
      transform-origin: 50% 50%;
      will-change: transform, opacity;
      max-width: 960px;
    }

    .assessment-title {
      color: #F7F4EC;
      font-weight: 900;
      font-size: 42px;
      letter-spacing: 3px;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .assessment-number-badge {
      background-color: #FF6A1A;
      color: #141414;
      padding: 12px 36px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 72px;
      line-height: 1.1;
      letter-spacing: 1px;
    }

    /* Dải cam cố định ở đáy khung hình theo Style DNA */
    .bottom-orange-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s15"
    data-width="1080"
    data-height="1920"
    data-duration="6.93"
  >
    <!-- Shot chính: Hình ảnh đập phá xe máy và camera motion -->
    <div id="shot-s15-1" class="clip" data-start="0" data-duration="6.93">
      <div id="camera-rig" class="camera-rig" data-layout-allow-overflow="true">
        <img
          id="bg-photo"
          class="bg-photo"
          src="assets/img-22-vandalizing-motorbike-property-damage.jpg"
          alt="Hành vi đập phá xe máy"
        />
      </div>

      <!-- Lớp biểu đồ chart kẻ ngang theo backgroundVariant -->
      <div class="chart-variant-layer">
        <div class="chart-line chart-line-1"></div>
        <div class="chart-line chart-line-2"></div>
        <div class="chart-line chart-line-3"></div>
        <div class="chart-line chart-line-4"></div>
      </div>

      <!-- Hiệu ứng va đập (strike flash) -->
      <div id="strike-flash" class="strike-flash"></div>
    </div>

    <!-- Overlay 1: Label ĐẬP PHÁ XE MÁY (atMs: 126200 -> 1.24s, holdMs: 2000) -->
    <div id="clip-label" class="clip label-host" data-start="1.24" data-duration="2.4">
      <div id="evidence-tag" class="evidence-tag">
        <span class="evidence-tag-text">ĐẬP PHÁ XE MÁY</span>
      </div>
    </div>

    <!-- Overlay 2: Punch phrase THIỆT HẠI 6.300.000Đ (atMs: 128800 -> 3.84s, holdMs: 2200) -->
    <div id="clip-punch" class="clip punch-host" data-start="3.84" data-duration="3.09" data-layout-allow-caption-zone="true">
      <div id="assessment-card" class="assessment-card" data-layout-allow-caption-zone="true">
        <div class="assessment-title">THIỆT HẠI</div>
        <div class="assessment-number-badge">6.300.000Đ</div>
      </div>
    </div>

    <!-- Thanh cam chữ ký cố định đáy khung hình -->
    <div class="bottom-orange-bar"></div>
  </div>

  <script>
    // HyperFrames Seekable Timeline Registry
    const tl = gsap.timeline({ paused: true });

    // 1. Entrance Animation "strike": Cú va đập dứt khoát t=0 -> 0.35s
    tl.fromTo(
      "#camera-rig",
      { scale: 1.16, y: -45, rotation: 0.8 },
      { scale: 1.0, y: 0, rotation: 0, duration: 0.35, ease: "power4.out" },
      0
    );

    // Chớp sáng va chạm tức thì
    tl.fromTo(
      "#strike-flash",
      { opacity: 0.55 },
      { opacity: 0, duration: 0.22, ease: "power2.out" },
      0
    );

    // 2. Camera motion: zoom-in chậm dần vào khu vực thân xe và nhãn định giá
    tl.to(
      "#camera-rig",
      { scale: 1.24, y: -65, duration: 6.58, ease: "sine.out" },
      0.35
    );

    // 3. Overlay 1: "ĐẬP PHÁ XE MÁY" xuất hiện tại t = 1.24s
    tl.fromTo(
      "#evidence-tag",
      { x: -50, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
      1.24
    );

    // Ẩn Overlay 1 tại t = 3.25s (trước khi clip-label kết thúc ở 3.64s)
    tl.to(
      "#evidence-tag",
      { y: -20, opacity: 0, duration: 0.25, ease: "power2.in" },
      3.25
    );

    // 4. Overlay 2: "THIỆT HẠI 6.300.000Đ" dập dấu định giá tại t = 3.84s
    tl.fromTo(
      "#assessment-card",
      { scale: 1.45, opacity: 0, rotation: -2.5 },
      { scale: 1.0, opacity: 1, rotation: 0, duration: 0.42, ease: "power4.out" },
      3.84
    );

    // Rung lắc nhẹ sau cú đóng tem mạnh mẽ (strike stamp impact)
    tl.to(
      "#assessment-card",
      { rotation: 1.2, duration: 0.08, ease: "power1.inOut" },
      4.26
    );
    tl.to(
      "#assessment-card",
      { rotation: 0, duration: 0.12, ease: "power2.out" },
      4.34
    );

    // Thu nhỏ nhẹ để chuyển giao cảnh mượt mà ở cuối scene
    tl.to(
      "#assessment-card",
      { opacity: 0, scale: 0.95, duration: 0.3, ease: "power2.in" },
      6.55
    );

    // Đăng ký timeline cho HyperFrames seek runtime
    window.__timelines["scene-s15"] = tl;
  </script>

    </template>
  </body>
</html>
