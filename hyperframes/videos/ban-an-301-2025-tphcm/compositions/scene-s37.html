<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Lớp hình nền chính phủ toàn màn hình, giữ nguyên màu gốc của ảnh */
    .bg-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #bg-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: 50% 45%;
      display: block;
    }

    /* Thanh cam thương hiệu cố định mép đáy */
    .bottom-brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Containers định vị overlay - dùng flex căn giữa an toàn */
    .overlay-card {
      position: absolute;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    /* 1. Label ngày xét xử phúc thẩm */
    #overlay-date {
      top: 250px;
      z-index: 30;
      opacity: 0;
    }

    .date-badge {
      background-color: #141414;
      color: #F7F4EC;
      font-weight: 900;
      font-size: 42px;
      letter-spacing: 2px;
      padding: 16px 44px;
      border-left: 10px solid #FF6A1A;
      border-radius: 6px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.75);
    }

    /* 2. Punch-phrase: BÁC TOÀN BỘ KHÁNG CÁO (Tem đóng dấu phán quyết) */
    #overlay-reject {
      top: 640px;
      z-index: 40;
      opacity: 0;
      transform-origin: 50% 50%;
    }

    .stamp-plate {
      background-color: #141414;
      padding: 24px 36px;
      border-radius: 10px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.85);
    }

    .stamp-border {
      border: 5px solid #FF6A1A;
      padding: 18px 40px;
      border-radius: 6px;
    }

    .stamp-text {
      color: #FF6A1A;
      font-weight: 900;
      font-size: 58px;
      letter-spacing: 2px;
      text-align: center;
      display: block;
      white-space: nowrap;
    }

    /* 3. Punch-phrase: Y ÁN CHUNG THÂN (Phán quyết tối hậu) */
    #overlay-sentence {
      top: 680px;
      z-index: 50;
      opacity: 0;
      transform-origin: 50% 50%;
    }

    .sentence-plate {
      background-color: #141414;
      padding: 18px 20px;
      border-radius: 12px;
      border: 4px solid #FF6A1A;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
    }

    .sentence-banner {
      background-color: #FF6A1A;
      padding: 24px 56px;
      border-radius: 6px;
    }

    .sentence-text {
      color: #141414;
      font-weight: 900;
      font-size: 72px;
      letter-spacing: 3px;
      text-align: center;
      display: block;
      white-space: nowrap;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s37"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="11"
  >
    <!-- Shot S37-1: Toàn bộ scene 11 giây -->
    <section id="shot-s37-1" class="clip" data-start="0" data-duration="11">
      <!-- Ảnh nền chính phủ toàn màn hình, giữ nguyên màu gốc -->
      <div class="bg-layer">
        <img
          id="bg-photo"
          src="assets/img-16-defendants-courtroom-life-sentence.jpg"
          alt="Bị cáo tại phiên tòa phúc thẩm"
        >
      </div>

      <!-- Overlay 1: Ngày phán quyết -->
      <div id="overlay-date" class="overlay-card">
        <div class="date-badge">NGÀY 28/04/2025</div>
      </div>

      <!-- Overlay 2: Bác toàn bộ kháng cáo -->
      <div id="overlay-reject" class="overlay-card">
        <div class="stamp-plate">
          <div class="stamp-border">
            <span class="stamp-text">BÁC TOÀN BỘ KHÁNG CÁO</span>
          </div>
        </div>
      </div>

      <!-- Overlay 3: Y án chung thân -->
      <div id="overlay-sentence" class="overlay-card">
        <div class="sentence-plate">
          <div class="sentence-banner">
            <span class="sentence-text">Y ÁN CHUNG THÂN</span>
          </div>
        </div>
      </div>

      <!-- Chữ ký thị giác nhận diện thương hiệu -->
      <div class="bottom-brand-bar"></div>
    </section>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. Camera motion zoom-out chậm rãi từ 1.1x về 1.03x suốt 11s
    tl.fromTo(
      "#bg-photo",
      { scale: 1.10 },
      { scale: 1.03, duration: 11, ease: "none" },
      0
    );

    // 2. Overlay 1 (NGÀY 28/04/2025): xuất hiện lúc 1.0s, kết thúc lúc 3.0s (hold 2.0s)
    tl.fromTo(
      "#overlay-date",
      { opacity: 0, y: -30 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      1.0
    );
    tl.to(
      "#overlay-date",
      { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
      3.0
    );

    // 3. Overlay 2 (BÁC TOÀN BỘ KHÁNG CÁO): cú dập strike lúc 4.8s, kết thúc lúc 7.0s (hold 2.2s)
    tl.fromTo(
      "#overlay-reject",
      { opacity: 0, scale: 1.35, rotation: -3.5 },
      { opacity: 1, scale: 1.0, rotation: -1.5, duration: 0.45, ease: "power4.out" },
      4.8
    );
    tl.to(
      "#overlay-reject",
      { opacity: 0, scale: 0.95, duration: 0.35, ease: "power2.in" },
      7.0
    );

    // 4. Overlay 3 (Y ÁN CHUNG THÂN): cú dập tối hậu lúc 8.4s, giữ vững đến hết scene (hold 2.4s)
    tl.fromTo(
      "#overlay-sentence",
      { opacity: 0, scale: 1.45, rotation: 1.5 },
      { opacity: 1, scale: 1.0, rotation: 0, duration: 0.45, ease: "power4.out" },
      8.4
    );

    // Đăng ký timeline gốc cho HyperFrames runtime
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s37"] = tl;
  </script>

    </template>
  </body>
</html>
