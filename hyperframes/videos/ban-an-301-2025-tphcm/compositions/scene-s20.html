    <script>
      // Initialize SVG stroke dash patterns deterministically
      const drawPaths = document.querySelectorAll(".draw-path");
      drawPaths.forEach((path) => {
        const len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
      });

      const warnTriangle = document.querySelector(".warning-triangle");
      if (warnTriangle) {
        const len = warnTriangle.getTotalLength();
        warnTriangle.style.strokeDasharray = len;
        warnTriangle.style.strokeDashoffset = len;
      }

      const warnLine = document.querySelector(".warning-mark-line");
      if (warnLine) {
        const len = warnLine.getTotalLength();
        warnLine.style.strokeDasharray = len;
        warnLine.style.strokeDashoffset = len;
      }

      // Root paused timeline
      const tl = gsap.timeline({ paused: true });

      // Phase 1: Unfold entrance of the forensic schematic
      tl.fromTo(
        "#blueprint-frame",
        { scaleY: 0.1, scaleX: 0.85, opacity: 0, transformOrigin: "50% 50%" },
        { scaleY: 1, scaleX: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.05
      );

      tl.fromTo(
        "#case-header",
        { y: -20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.1
      );

      // Path progressive drawing
      drawPaths.forEach((path, idx) => {
        const len = path.getTotalLength();
        tl.fromTo(
          path,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" },
          0.2 + idx * 0.02
        );
      });

      // Reticle Target Arrival
      tl.fromTo(
        "#radar-reticle",
        { scale: 0, opacity: 0, transformOrigin: "510px 440px" },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.45
      );

      // Finite Reticle Pulse
      tl.fromTo(
        "#radar-pulse-ring",
        { scale: 0.95, opacity: 0.4, transformOrigin: "510px 440px" },
        { scale: 1.08, opacity: 0.95, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 6 },
        0.95
      );

      // Phase 2: Overlay 1 ("KHÔNG PHẢI XÂY XÁT") at 1.07s
      tl.fromTo(
        "#overlay-1-box",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.2, ease: "power3.out" },
        1.07
      );

      tl.to(
        "#overlay-1-box",
        { y: -15, opacity: 0, duration: 0.12, ease: "power2.in" },
        3.12
      );

      // Phase 3: Overlay 2 (Warning Icon & Callout) at 4.07s
      tl.fromTo(
        "#overlay-2-box",
        { scale: 0.94, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.2, ease: "power3.out" },
        4.07
      );

      if (warnTriangle) {
        const len = warnTriangle.getTotalLength();
        tl.fromTo(
          warnTriangle,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
          4.15
        );
      }

      if (warnLine) {
        const len = warnLine.getTotalLength();
        tl.fromTo(
