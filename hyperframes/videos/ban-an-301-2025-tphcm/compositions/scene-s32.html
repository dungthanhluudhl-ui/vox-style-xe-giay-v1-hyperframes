    <div
      id="root"
      data-composition-id="scene-s32"
      data-width="1080"
      data-height="1920"
      data-duration="10"
    >
      <!-- Dải cam đáy cố định nhận diện thương hiệu -->
      <div class="bottom-orange-bar"></div>

      <!-- Shot S32-1: Tập tài liệu biên lai nộp tiền và đơn bãi nại -->
      <section class="clip" data-start="0" data-duration="10">
        <!-- Khung camera chuyển động zoom-in nhẹ 1.0x -> 1.08x -->
        <div class="camera-viewport">
          <div id="camera-rig" class="camera-rig">
            <img
              id="bg-photo"
              class="bg-photo"
              src="assets/img-07-mitigating-circumstances-legal-documents.jpg"
              alt="Hồ sơ tài liệu bồi thường và khắc phục hậu quả"
            />
          </div>
        </div>

        <!-- Lớp phủ biểu đồ (Chart background variant) -->
        <div class="chart-grid-overlay">
          <div class="chart-line chart-line-1"><div class="chart-tick"></div></div>
          <div class="chart-line chart-line-2"><div class="chart-tick"></div></div>
          <div class="chart-line chart-line-3"><div class="chart-tick"></div></div>
          <div class="chart-line chart-line-4"><div class="chart-tick"></div></div>
        </div>

        <!-- Lớp các thẻ overlay đồ hoạ -->
        <div class="ui-layer">
          <!-- Tag danh mục hồ sơ -->
          <div id="header-tag" class="header-tag">
            <div class="header-tag-bullet"></div>
            <div class="header-tag-text">CHỨNG CỨ · TÌNH TIẾT GIẢM NHẸ</div>
          </div>

          <!-- Card 1: Bồi thường thiệt hại (chứa icon money + label 250 + 100 TRIỆU) -->
          <div id="compensation-card" class="compensation-card">
            <div class="card-top-row">
              <div class="icon-container">
                <svg class="money-svg" viewBox="0 0 90 60">
                  <!-- Viền tờ tiền -->
                  <rect class="svg-stroke-item" x="4" y="4" width="82" height="52" rx="6" />
                  <!-- Vòng tròn trung tâm -->
                  <circle class="svg-stroke-item" cx="45" cy="30" r="14" />
                  <!-- Ký hiệu tiền tệ trung tâm -->
                  <path class="svg-stroke-item" d="M 45 21 L 45 39" />
                  <path class="svg-stroke-item" d="M 40 25 C 40 22 50 22 50 27 C 50 33 40 31 40 35 C 40 39 50 39 50 36" />
                  <!-- Vòng tròn trang trí hai bên -->
                  <circle class="svg-stroke-item" cx="16" cy="30" r="5" />
                  <circle class="svg-stroke-item" cx="74" cy="30" r="5" />
                </svg>
              </div>
              <div class="card-badge">KHẮC PHỤC HẬU QUẢ</div>
            </div>

            <div class="compensation-title">NỘP TIỀN BỒI THƯỜNG THIỆT HẠI:</div>
            <div id="compensation-value-box" class="compensation-value-box">
              <div id="compensation-value" class="compensation-value">
                BỒI THƯỜNG: 250 + 100 TRIỆU
              </div>
            </div>
          </div>

          <!-- Card 2: Đơn bãi nại từ gia đình bị hại -->
          <div id="mitigation-card" class="mitigation-card">
            <div class="mitigation-info">
              <div class="mitigation-subtitle">ĐƠN CỦA GIA ĐÌNH BỊ HẠI</div>
              <div class="mitigation-main-text">BỊ HẠI XIN GIẢM ÁN</div>
            </div>
            <div id="stamp-seal" class="stamp-seal">
              <div class="stamp-inner-text-top">XÁC NHẬN</div>
              <div class="stamp-inner-icon">✓</div>

    <script>
      // Khởi tạo timeline chính ở trạng thái paused
      const tl = gsap.timeline({ paused: true });

      // Thiết lập đo và ẩn các đường vẽ SVG icon money
      const svgElements = document.querySelectorAll(".svg-stroke-item");
      svgElements.forEach((el) => {
        const len = el.getTotalLength ? el.getTotalLength() : 200;
        el.style.strokeDasharray = len + "px";
        el.style.strokeDashoffset = len + "px";
      });

      // 1. Transition In "rise" & Camera Zoom-in
      // Nền ảnh rise nhẹ vào khung hình lúc 0s
      tl.fromTo(
        "#bg-photo",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
        0
      );

      // Chuyển động máy quay zoom-in nhẹ từ 1.0x lên 1.08x trong suốt cảnh
      tl.fromTo(
        "#camera-rig",
        { scale: 1.0, y: 0 },
        { scale: 1.08, y: -25, duration: 10, ease: "sine.out" },
        0
      );

      // Header Tag xuất hiện
      tl.fromTo(
        "#header-tag",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.4
      );

      // 2. Overlay Icon "money" & Card 1 xuất hiện tại t = 1.78s (atMs: 279000, 279000 - 277220 = 1780ms)
      tl.fromTo(
        "#compensation-card",
        { y: 40, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" },
        1.78
      );

      // Từng nét vẽ icon money hoàn thành dần
      tl.to(
        svgElements,
        {
          strokeDashoffset: 0,
          duration: 0.9,
          stagger: 0.08,
          ease: "power2.out"
        },
        1.9
      );

      // 3. Label "BỒI THƯỜNG: 250 + 100 TRIỆU" xuất hiện nổi bật tại t = 3.18s (atMs: 280400, 280400 - 277220 = 3180ms)
      tl.fromTo(
        "#compensation-value-box",
        { scale: 0.92, opacity: 0, y: 15 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        3.18
      );

      // 4. Label "BỊ HẠI XIN GIẢM ÁN" xuất hiện tại t = 8.18s (atMs: 285400, 285400 - 277220 = 8180ms)
      tl.fromTo(
        "#mitigation-card",
        { y: 35, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        8.18
      );

      // Con dấu mộc xác nhận bãi nại đóng xuống dứt khoát
      tl.fromTo(
        "#stamp-seal",
        { scale: 1.8, opacity: 0, rotation: -25 },
        { scale: 1, opacity: 1, rotation: -8, duration: 0.45, ease: "power4.out" },
        8.4
      );

      // Đăng ký timeline cho HyperFrames seek
      window.__timelines["scene-s32"] = tl;
    </script>
