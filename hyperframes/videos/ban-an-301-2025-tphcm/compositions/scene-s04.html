    .years-card {

    /* Phase 2: TÙ CHUNG THÂN Verdict Card */

      top: 340px;

    /* Persistent brand bottom bar */
    .bottom-orange-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      background: #FF6A1A;
      z-index: 99;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s04"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="7.1"
  >
    <!-- Background photo with slow camera zoom-out -->
    <div id="bg-camera" class="clip" data-start="0" data-duration="7.1" data-layout-allow-overflow="true">
      <img
        id="bg-photo"
        src="assets/img-19-prison-bars-clock-sentence.jpg"
        alt="Song sắt nhà tù và đồng hồ án phạt"
        data-layout-allow-overflow="true"
      />
    </div>

    <!-- Overlay 1: 7 - 10 - 20 NĂM Strike (0.48s - 2.43s) -->
    <div id="clip-strike-years" class="clip" data-start="0.48" data-duration="1.95">
      <div id="card-years" class="plate-card years-card">
        <div class="years-header">
          <div class="years-label">CÁC MỐC THỜI HẠN XEM XÉT</div>
          <div id="stamp-rejected" class="stamp-rejected" data-layout-allow-overlap="true">KHÔNG PHẢI!</div>
        </div>
        <div class="years-wrap" data-layout-allow-occlusion="true" data-layout-allow-overlap="true">
          <div class="years-number" data-layout-allow-occlusion="true" data-layout-allow-overlap="true">7 - 10 - 20 NĂM</div>
          <div id="strike-bar" class="strike-bar" data-layout-allow-overlap="true" style="transform-origin: left center;"></div>
        </div>
      </div>
    </div>

    <!-- Overlay 2 & 3: TÙ CHUNG THÂN and Question Icon (2.50s - 7.10s) -->
    <div id="clip-verdict" class="clip" data-start="2.5" data-duration="4.6">
      <!-- Verdict punch phrase card -->
      <div id="card-verdict" class="plate-card verdict-card">
        <div class="verdict-tag">PHÁN QUYẾT CHÍNH THỨC</div>
        <h1 class="verdict-heading">TÙ CHUNG THÂN</h1>
        <div id="verdict-line" class="verdict-divider" style="transform-origin: left center;"></div>

      <!-- Question investigation card with progressive SVG drawing -->
      <div id="card-question" class="plate-card question-card">
        <svg id="q-svg" viewBox="0 0 140 140" width="110" height="110" style="flex-shrink: 0;">
          <circle
            id="q-circle"
            cx="70"

            r="60"
            fill="none"
            stroke="#FF6A1A"
            stroke-width="5"
            stroke-linecap="round"
          />
          <path
            id="q-path"
            d="M 50 56 C 50 40, 60 34, 70 34 C 82 34, 92 42, 92 54 C 92 66, 80 74, 70 84 L 70 92"

            id="q-dot"

        </svg>
        <div id="q-text-block" class="q-content">
          <div class="q-tag">CÂU HỎI LỚN</div>
          <div class="q-title">ĐÃ XẢY RA CHUYỆN GÌ?</div>
          <div class="q-desc">TRONG KHOẢNG THỜI GIAN NGẮN NGỦI</div>
        </div>
      </div>

    <!-- Fixed bottom brand stripe -->

  <script>
    // Prepare SVG path lengths for deterministic progressive drawing
    const qCircle = document.getElementById("q-circle");
    const qPath = document.getElementById("q-path");
    if (qCircle && qCircle.getTotalLength) {
      const cLen = qCircle.getTotalLength();
      qCircle.style.strokeDasharray = cLen;
      qCircle.style.strokeDashoffset = cLen;
    }
    if (qPath && qPath.getTotalLength) {
      const pLen = qPath.getTotalLength();
      qPath.style.strokeDasharray = pLen;
      qPath.style.strokeDashoffset = pLen;
    }

    // Build seekable, paused master timeline
    const tl = gsap.timeline({ paused: true });

    // 1. Camera zoom-out over entire scene duration (0.0s - 7.1s)
    tl.fromTo(
      "#bg-photo",
      { scale: 1.15, transformOrigin: "center center" },
      { scale: 1.02, duration: 7.1, ease: "none" },
      0
    );

    // 2. Overlay 1: 7 - 10 - 20 NĂM arrives and gets decisively struck out (0.48s - 2.43s)
    tl.fromTo(
      "#card-years",
      { scale: 0.88, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
      0.48
    );

    tl.fromTo(
      "#strike-bar",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.22, ease: "power4.out" },
      0.88
    );

    tl.fromTo(
      "#stamp-rejected",
      { scale: 1.9, opacity: 0, rotation: 16 },
      { scale: 1, opacity: 1, rotation: -4, duration: 0.22, ease: "power4.out" },
      1.02
    );

    tl.to(
      "#card-years",
      { scale: 0.92, y: -40, opacity: 0, duration: 0.25, ease: "power2.in" },
      2.15
    );

    // 3. Overlay 2: TÙ CHUNG THÂN verdict strikes in (2.58s - 7.1s)
    tl.fromTo(
      "#card-verdict",
      { scale: 1.25, opacity: 0, y: -30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power4.out" },
      2.58
    );

    tl.fromTo(
      "#verdict-line",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.35, ease: "power3.out" },
      2.85
    );

    // 4. Overlay 3: Question investigation card and self-drawing icon (4.88s - 7.1s)
    tl.fromTo(
      "#card-question",
      { y: 35, opacity: 0, scale: 0.96 },
      { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
      4.88
    );

    tl.to(
      "#q-circle",
      { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
      5.05
    );

    tl.to(
      "#q-path",
      { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
      5.18
    );

    tl.fromTo(
      "#q-dot",
      { scale: 0 },
      { scale: 1, duration: 0.2, ease: "power3.out" },
      5.55
    );

    tl.fromTo(
      "#q-text-block",
      { opacity: 0, x: 20 },
      { opacity: 1, x: 0, duration: 0.38, ease: "power3.out" },
      5.30
    );

    // Register single paused timeline on HyperFrames runtime
    window.__timelines["scene-s04"] = tl;
  </script>
