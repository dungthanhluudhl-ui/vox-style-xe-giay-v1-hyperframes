<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #F5F0E4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #F5F0E4;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Thanh cam nhận diện thương hiệu cố định mép đáy */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 100;
      }

      /* Container hồ sơ tài liệu đặt trong Safe Zone Y: [160, 1390] */
      .dossier-wrapper {
        position: absolute;
        top: 190px;
        left: 60px;
        width: 960px;
        height: 1140px;
        transform-origin: 50% 40%;
      }

      /* Tấm nền hồ sơ toà án trích xuất (Legal Document Dossier) */
      .dossier-sheet {
        position: relative;
        width: 100%;
        height: 100%;
        background-color: #E7E3D9;
        border: 4px solid #141414;
        box-shadow: 16px 16px 0px rgba(20, 20, 20, 0.18);
        padding: 48px 44px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* Header hồ sơ */
      .dossier-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 3px solid #141414;
        padding-bottom: 22px;
      }

      .badge-category {
        background-color: #FF6A1A;
        color: #141414;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 8px 18px;
        border: 2px solid #141414;
      }

      .dossier-meta {
        background-color: #141414;
        color: #F7F4EC;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 1px;
        padding: 8px 16px;
      }

      /* Tiêu đề chính và nhân thân */
      .dossier-title-group {
        margin-top: 12px;
      }

      .dossier-main-title {
        font-size: 64px;
        font-weight: 900;
        line-height: 1.18;
        color: #141414;
        margin: 0 0 12px 0;
        text-transform: uppercase;
      }

      .dossier-subject {
        font-size: 28px;
        font-weight: 700;
        color: #141414;
        display: inline-block;
        padding-bottom: 6px;
        border-bottom: 2px dashed rgba(20, 20, 20, 0.45);
      }

      /* Danh sách bằng chứng khen thưởng và công lao */
      .evidence-list {
        display: flex;
        flex-direction: column;
        gap: 32px;
        margin: 20px 0;
      }

      /* Thẻ chứng nhận chi tiết */
      .evidence-card {
        background-color: #141414;
        color: #F7F4EC;
        border: 3px solid #141414;
        padding: 32px 30px;
        position: relative;
        transform-origin: 50% 50%;
      }

      .card-top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }

      .card-subtext {
        font-size: 22px;
        font-weight: 700;
        color: #F7F4EC;
        text-transform: uppercase;
        letter-spacing: 1.2px;
      }

      .stamp-verified {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background-color: #E7E3D9;
        color: #141414;
        font-size: 18px;
        font-weight: 900;
        padding: 4px 12px;
        border: 2px solid #141414;
      }

      /* Khối nhãn điểm nhấn nổi bật */
      .highlight-label-plate {
        background-color: #FF6A1A;
        color: #141414;
        padding: 16px 24px;
        border: 2px solid #141414;
        display: inline-block;
        transform-origin: 0% 50%;
      }

      .highlight-label-text {
        font-size: 44px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: 0.5px;
        margin: 0;
        color: #141414;
      }

      /* Con dấu kiểm chứng góc hồ sơ */
      .dossier-footer-seal {
        padding-top: 20px;
        border-top: 2px solid rgba(20, 20, 20, 0.25);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .seal-note {
        font-size: 20px;
        font-weight: 700;
        color: #141414;
      }

      .seal-tag {
        font-size: 18px;
        font-weight: 900;
        background-color: #141414;
        color: #F7F4EC;
        padding: 6px 14px;
      }

      /* SVG Icon Check */
      .icon-check-wrapper {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .check-svg-icon {
        width: 28px;
        height: 28px;
        display: block;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s33"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7"
    >
      <!-- Clip toàn cảnh S33 -->
      <section id="scene-s33" class="clip" data-start="0" data-duration="7">
        
        <!-- Khối hồ sơ tài liệu trích xuất -->
        <div id="dossier" class="dossier-wrapper">
          <div class="dossier-sheet">
            
            <!-- Header hồ sơ -->
            <div id="dossier-hdr" class="dossier-header">
              <div class="badge-category">HỒ SƠ TÒA ÁN</div>
              <div class="dossier-meta">TÌNH TIẾT XÁC MINH</div>
            </div>

            <!-- Tiêu đề lớn & nhân thân -->
            <div id="dossier-title-wrap" class="dossier-title-group">
              <h1 class="dossier-main-title">TÌNH TIẾT GIẢM NHẸ</h1>
              <div class="dossier-subject">BỊ CÁO: TÍN</div>
            </div>

            <!-- 2 Khối chứng thư khen thưởng và công lao -->
            <div class="evidence-list">
              
              <!-- Chứng thư 1: Danh hiệu khen thưởng -->
              <div id="evidence-card-military" class="evidence-card">
                <div class="card-top-row">
                  <span class="card-subtext">CHỨNG NHẬN KHEN THƯỞNG</span>
                  <div id="stamp-check-1" class="stamp-verified">
                    <span class="icon-check-wrapper">
                      <svg class="check-svg-icon" viewBox="0 0 32 32">
                        <circle cx="16" cy="16" r="14" fill="#FF6A1A" stroke="#141414" stroke-width="2" />
                        <path
                          id="check-path-svg"
                          d="M 9 16 L 14 21 L 23 11"
                          fill="none"
                          stroke="#141414"
                          stroke-width="3.5"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                    </span>
                    <span>ĐÃ XÁC THỰC</span>
                  </div>
                </div>

                <div id="label-plate-military" class="highlight-label-plate">
                  <div class="highlight-label-text">CHIẾN SĨ TIÊN TIẾN</div>
                </div>
              </div>

              <!-- Chứng thư 2: Thân nhân có công cách mạng -->
              <div id="evidence-card-family" class="evidence-card">
                <div class="card-top-row">
                  <span class="card-subtext">CÔNG LAO CÁCH MẠNG</span>
                  <div id="stamp-check-2" class="stamp-verified">
                    <span>GHI NHẬN</span>
                  </div>
                </div>

                <div id="label-plate-family" class="highlight-label-plate">
                  <div class="highlight-label-text">GIA ĐÌNH CÓ CÔNG</div>
                </div>
              </div>

            </div>

            <!-- Footer con dấu lưu trữ -->
            <div id="dossier-ftr" class="dossier-footer-seal">
              <span class="seal-note">CĂN CỨ XEM XÉT KHI LƯỢNG HÌNH</span>
              <span class="seal-tag">TRÍCH LỤC</span>
            </div>

          </div>
        </div>

      </section>

      <!-- Thanh màu cam cố định ở mép đáy -->
      <div class="bottom-brand-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s33"] = tl;

      // Chuẩn bị vẽ SVG Path cho icon check
      const checkPath = document.getElementById("check-path-svg");
      if (checkPath && checkPath.getTotalLength) {
        const pathLen = checkPath.getTotalLength();
        checkPath.style.strokeDasharray = pathLen;
        checkPath.style.strokeDashoffset = pathLen;
      }

      // 1. Vào cảnh: Dossier lớn xuất hiện theo hiệu ứng "grow" (t = 0.2s)
      tl.fromTo(
        "#dossier",
        { scale: 0.88, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.75, ease: "power3.out" },
        0.2
      );

      // 2. Nội dung phần đầu hồ sơ lộ diện (t = 0.5s)
      tl.fromTo(
        "#dossier-hdr, #dossier-title-wrap",
        { opacity: 0, y: 15 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.1 },
        0.5
      );

      // 3. Khối thẻ Chứng nhận khen thưởng xuất hiện (t = 0.85s)
      tl.fromTo(
        "#evidence-card-military",
        { opacity: 0, scale: 0.94, y: 20 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.85
      );

      // 4. Overlay Icon Check vẽ mượt mà (t = 1.18s, khớp timestamp 288400ms trong shotlist)
      tl.fromTo(
        "#stamp-check-1",
        { scale: 0.8, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        1.18
      );
      if (checkPath) {
        tl.to(
          "#check-path-svg",
          { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
          1.25
        );
      }

      // 5. Overlay Label "CHIẾN SĨ TIÊN TIẾN" bật sáng rõ nét (t = 2.98s, khớp timestamp 290200ms)
      tl.fromTo(
        "#label-plate-military",
        { scale: 0.85, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        2.98
      );

      // 6. Khối thẻ Thân nhân cách mạng xuất hiện (t = 4.2s)
      tl.fromTo(
        "#evidence-card-family",
        { opacity: 0, scale: 0.94, y: 20 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" },
        4.2
      );

      // 7. Overlay Label "GIA ĐÌNH CÓ CÔNG" bật sáng rõ nét (t = 5.18s, khớp timestamp 292400ms)
      tl.fromTo(
        "#label-plate-family",
        { scale: 0.85, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        5.18
      );
      tl.fromTo(
        "#stamp-check-2",
        { scale: 0.8, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        5.3
      );

      // 8. Footer hồ sơ hoàn tất (t = 5.6s)
      tl.fromTo(
        "#dossier-ftr",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power1.out" },
        5.6
      );
    </script>
  
    </template>
  </body>
</html>
