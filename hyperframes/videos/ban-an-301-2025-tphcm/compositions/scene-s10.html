      { scaleY: 1, opacity: 1, duration: 0.7, ease: "power3.out" },

    tl.fromTo(

    // Xuất hiện Case Header

      "#alert-container",
      { scale: 0.88, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      3.36
    );

    tl.to(
      "#alert-container",
      { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" },
      5.05
    );

    // 3. Hung khí 1: "KIẾM DÀI 1.0M" (atMs: 86800 -> 5.76s)

      "#weapon-block-1",
      { opacity: 0, x: -35 },

      5.76
    );

    tl.fromTo(
      "#measure-line-1",
      { strokeDashoffset: 520 },
      { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
      5.95
    );

    tl.fromTo(

      { opacity: 0 },
      { opacity: 1, duration: 0.1 },
      6.45
    );

    tl.fromTo(
      "#badge-val-1",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },

      { opacity: 1, duration: 0.1 },

      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      8.75
    );
