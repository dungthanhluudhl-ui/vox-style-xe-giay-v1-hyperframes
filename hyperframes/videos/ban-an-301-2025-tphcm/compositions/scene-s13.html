<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #141414;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      width: 1080px;
      height: 1920px;
    }
    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #141414;
    }
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Background Photo & Camera Framing - Phủ toàn khung, giữ nguyên màu gốc */
    .photo-wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #bg-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      transform-origin: 50% 50%;
    }

    /* Fixed Vox Style signature bottom bar */
    .bottom-orange-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 16px;
      background-color: #FF6A1A;
      z-index: 90;
    }

    /* Shatter entrance transition shards */
    .shatter-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .shatter-shard {
      position: absolute;
      inset: 0;
      background-color: #141414;
    }
    #shard-1 {
      clip-path: polygon(0% 0%, 55% 0%, 48% 52%, 0% 45%);
    }
    #shard-2 {
      clip-path: polygon(55% 0%, 100% 0%, 100% 55%, 48% 52%);
    }
    #shard-3 {
      clip-path: polygon(0% 45%, 48% 52%, 52% 100%, 0% 100%);
    }
    #shard-4 {
      clip-path: polygon(48% 52%, 100% 55%, 100% 100%, 52% 100%);
    }

    /* Overlay Badge Containers (Safe Zone Top: 160px, Bottom: 530px) */
    .badge-aligner {
      position: absolute;
      top: 280px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }
    .plate-ink {
      background-color: #141414;
      padding: 24px 44px;
      border-radius: 16px;
      border-left: 10px solid #FF6A1A;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
    }
    .stamp-text {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 52px;
      line-height: 1.25;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .text-orange {
      color: #FF6A1A;
      font-weight: 900;
    }
    .text-light {
      color: #F7F4EC;
      font-weight: 900;
    }

    /* Warning Icon Badge Container */
    .warning-aligner {
      position: absolute;
      top: 410px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }
    .warning-plate {
      width: 170px;
      height: 170px;
      padding: 0;
      border-radius: 28px;
      border: 4px solid #FF6A1A;
      border-left: 4px solid #FF6A1A;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
    }
    .warning-icon {
      width: 120px;
      height: 120px;
      display: block;
    }
    #warn-triangle {
      fill: none;
      stroke: #FF6A1A;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #warn-stem {
      stroke: #F7F4EC;
      stroke-width: 8;
      stroke-linecap: round;
      transform-origin: 60px 59px;
    }
    #warn-dot {
      fill: #F7F4EC;
      transform-origin: 60px 87px;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s13"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="10.92"
  >
    <!-- Shot S13-1: Background photo with zoom-out camera motion -->
    <div id="shot-s13-1" class="clip" data-start="0" data-duration="10.92" data-track-index="0">
      <div class="photo-wrapper">
        <img
          id="bg-photo"
          src="assets/img-04-arson-mob-revenge-cutout.jpg"
          alt="Đám đông cầm can xăng tiến tới phóng hỏa ngôi nhà cháy"
        />
      </div>
    </div>

    <!-- Entrance Transition: Shatter Overlay -->
    <div id="shatter-clip" class="clip" data-start="0" data-duration="0.6" data-track-index="1">
      <div class="shatter-layer">
        <div class="shatter-shard" id="shard-1" data-layout-allow-overflow="true"></div>
        <div class="shatter-shard" id="shard-2" data-layout-allow-overflow="true"></div>
        <div class="shatter-shard" id="shard-3" data-layout-allow-overflow="true"></div>
        <div class="shatter-shard" id="shard-4" data-layout-allow-overflow="true"></div>
      </div>
    </div>

    <!-- Overlay 1: "CHẠY RA = THOÁT NẠN" (atMs: 109800, holdMs: 2200 -> 2.12s to 4.32s) -->
    <div id="label-1-clip" class="clip" data-start="2.12" data-duration="2.2" data-track-index="2">
      <div class="badge-aligner">
        <div class="plate-ink" id="badge-1">
          <div class="stamp-text">
            <span class="text-orange">CHẠY RA</span>
            <span class="text-light"> = THOÁT NẠN</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Overlay 2: "MANG XĂNG QUAY LẠI" (atMs: 114400, holdMs: 2200 -> 6.72s to 8.92s) -->
    <div id="label-2-clip" class="clip" data-start="6.72" data-duration="2.2" data-track-index="2">
      <div class="badge-aligner">
        <div class="plate-ink" id="badge-2">
          <div class="stamp-text">
            <span class="text-orange">MANG XĂNG</span>
            <span class="text-light"> QUAY LẠI</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Overlay 3: Warning Icon (atMs: 116600, holdMs: 1800 -> 8.92s to 10.72s) -->
    <div id="warning-icon-clip" class="clip" data-start="8.92" data-duration="1.8" data-track-index="3">
      <div class="warning-aligner">
        <div class="plate-ink warning-plate" id="warning-badge">
          <svg id="warning-svg" class="warning-icon" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <path id="warn-triangle" d="M 60 18 L 106 98 L 14 98 Z" />
            <line id="warn-stem" x1="60" y1="46" x2="60" y2="72" />
            <circle id="warn-dot" cx="60" cy="87" r="5" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Permanent brand signature bottom bar -->
    <div class="bottom-orange-bar" data-layout-ignore="true"></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. Camera Motion: zoom-out from 1.15x to 1.05x over the entire scene
    tl.fromTo(
      "#bg-photo",
      { scale: 1.15 },
      { scale: 1.05, duration: 10.92, ease: "none" },
      0
    );

    // 2. Shatter Entrance Shards
    tl.fromTo(
      "#shard-1",
      { x: 0, y: 0, rotation: 0, opacity: 1 },
      { x: -160, y: -140, rotation: -5, opacity: 0, duration: 0.45, ease: "power3.in" },
      0.05
    );
    tl.fromTo(
      "#shard-2",
      { x: 0, y: 0, rotation: 0, opacity: 1 },
      { x: 160, y: -150, rotation: 6, opacity: 0, duration: 0.45, ease: "power3.in" },
      0.05
    );
    tl.fromTo(
      "#shard-3",
      { x: 0, y: 0, rotation: 0, opacity: 1 },
      { x: -150, y: 160, rotation: 4, opacity: 0, duration: 0.45, ease: "power3.in" },
      0.05
    );
    tl.fromTo(
      "#shard-4",
      { x: 0, y: 0, rotation: 0, opacity: 1 },
      { x: 170, y: 150, rotation: -6, opacity: 0, duration: 0.45, ease: "power3.in" },
      0.05
    );

    // 3. Overlay 1: "CHẠY RA = THOÁT NẠN" (start: 2.12s, duration: 2.2s -> ends at 4.32s)
    tl.fromTo(
      "#badge-1",
      { scale: 0.85, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      2.12
    );
    tl.to(
      "#badge-1",
      { opacity: 0, y: -20, duration: 0.2, ease: "power2.in" },
      4.12
    );

    // 4. Overlay 2: "MANG XĂNG QUAY LẠI" (start: 6.72s, duration: 2.2s -> ends at 8.92s)
    tl.fromTo(
      "#badge-2",
      { scale: 0.85, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      6.72
    );
    tl.to(
      "#badge-2",
      { opacity: 0, y: -20, duration: 0.2, ease: "power2.in" },
      8.72
    );

    // 5. Overlay 3: Warning Icon (start: 8.92s, duration: 1.8s -> ends at 10.72s)
    const triangle = document.getElementById("warn-triangle");
    if (triangle) {
      const len = triangle.getTotalLength ? triangle.getTotalLength() : 280;
      triangle.style.strokeDasharray = len + "";
      triangle.style.strokeDashoffset = len + "";
    }

    tl.fromTo(
      "#warning-badge",
      { scale: 0.7, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      8.92
    );
    tl.to(
      "#warn-triangle",
      { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
      8.98
    );
    tl.fromTo(
      "#warn-stem",
      { opacity: 0, scaleY: 0 },
      { opacity: 1, scaleY: 1, duration: 0.25, ease: "power2.out" },
      9.35
    );
    tl.fromTo(
      "#warn-dot",
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" },
      9.5
    );
    tl.to(
      "#warning-badge",
      { opacity: 0, scale: 0.9, duration: 0.2, ease: "power2.in" },
      10.52
    );

    // Register single paused timeline on window.__timelines
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s13"] = tl;
  </script>

    </template>
  </body>
</html>
