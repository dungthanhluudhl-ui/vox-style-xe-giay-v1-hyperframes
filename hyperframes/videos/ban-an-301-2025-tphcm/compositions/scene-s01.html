<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #141414;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #141414;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Background Photo: Full-bleed, original colors preserved */
      #bg-photo {
        position: absolute;
        inset: -6%;
        width: 112%;
        height: 112%;
        object-fit: cover;
        object-position: center;
        will-change: transform, opacity;
      }
      .scene-grid-lines {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.18) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.18) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        pointer-events: none;
      }

      /* Visual Brand Bar */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 90;
      }

      /* Overlay 1: Punch Phrase */
      .punch-layout {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 60px;
      }
      #punch-box {
        background-color: #141414;
        border: 2px solid rgba(255, 106, 26, 0.85);
        border-radius: 12px;
        padding: 44px 50px;
        width: 100%;
        max-width: 960px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        will-change: transform, opacity;
      }
      .punch-tag {
        background-color: #FF6A1A;
        color: #141414;
        font-weight: 900;
        font-size: 26px;
        letter-spacing: 2px;
        padding: 6px 18px;
        border-radius: 4px;
        margin-bottom: 22px;
        text-transform: uppercase;
      }
      .punch-title {
        margin: 0;
        font-size: 70px;
        font-weight: 900;
        line-height: 1.34;
        color: #F7F4EC;
        text-transform: uppercase;
        letter-spacing: -0.5px;
      }

      /* Overlay 2: Label BỊ HẠI BAN ĐẦU */
      .label-left-layout {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        padding-left: 80px;
      }
      #label-victim-box {
        background-color: #141414;
        border-left: 12px solid #FF6A1A;
        border-radius: 0 12px 12px 0;
        padding: 34px 44px;
        max-width: 820px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        will-change: transform, opacity;
      }
      .dossier-sub-tag {
        color: #FF6A1A;
        font-weight: 900;
        font-size: 24px;
        letter-spacing: 2.5px;
        margin-bottom: 12px;
        text-transform: uppercase;
      }
      .dossier-main-text {
        margin: 0;
        font-size: 58px;
        font-weight: 900;
        line-height: 1.25;
        color: #F7F4EC;
        text-transform: uppercase;
      }

      /* Overlay 3: Icon Warning */
      .center-icon-layout {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #warning-box {
        background-color: #141414;
        border: 3px solid #FF6A1A;
        border-radius: 24px;
        padding: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        will-change: transform, opacity;
      }
      .warning-svg {
        width: 220px;
        height: 220px;
        display: block;
      }
      .warning-svg path,
      .warning-svg line {
        fill: none;
        stroke: #FF6A1A;
        stroke-width: 14;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Overlay 4: Label ĐỔI VAI THỦ PHẠM */
      .center-culprit-layout {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 70px;
      }
      #label-culprit-box {
        background-color: #141414;
        border: 4px solid #FF6A1A;
        border-radius: 14px;
        padding: 42px 48px;
        width: 100%;
        max-width: 940px;
        text-align: center;
        will-change: transform, opacity;
      }
      .culprit-title {
        margin: 0;
        font-size: 68px;
        font-weight: 900;
        line-height: 1.25;
        color: #F7F4EC;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s01"
      data-width="1080"
      data-height="1920"
      data-duration="12.54"
      data-fps="30"
    >
      <!-- Background Clip: Full-bleed photo with original colors, no vignette -->
      <div id="clip-bg" class="clip" data-start="0" data-duration="12.54" data-track-index="0">
        <img
          id="bg-photo"
          src="assets/img-03-crime-scene-evidence-collage.jpg"
          alt="Hồ sơ hiện trường án mạng"
        />
        <div class="scene-grid-lines"></div>
      </div>

      <!-- Overlay 1: Punch Phrase (0.2s -> 2.6s) -->
      <div
        id="clip-punch"
        class="clip punch-layout"
        data-start="0.2"
        data-duration="2.4"
        data-track-index="1"
      >
        <div id="punch-box">
          <div class="punch-tag">HỒ SƠ VỤ ÁN</div>
          <h1 class="punch-title">NGHỊCH LÝ ĐẢO CHIỀU</h1>
        </div>
      </div>

      <!-- Overlay 2: Label BỊ HẠI BAN ĐẦU (3.2s -> 5.2s) -->
      <div
        id="clip-label-victim"
        class="clip label-left-layout"
        data-start="3.2"
        data-duration="2.0"
        data-track-index="2"
      >
        <div id="label-victim-box">
          <div class="dossier-sub-tag">XUẤT PHÁT ĐIỂM</div>
          <div class="dossier-main-text">BỊ HẠI BAN ĐẦU</div>
        </div>
      </div>

      <!-- Overlay 3: Icon Warning (5.6s -> 7.8s) -->
      <div
        id="clip-icon-warning"
        class="clip center-icon-layout"
        data-start="5.6"
        data-duration="2.2"
        data-track-index="3"
      >
        <div id="warning-box">
          <svg class="warning-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <path id="warn-triangle" d="M 100 26 L 180 166 L 20 166 Z" />
            <line id="warn-stem" x1="100" y1="72" x2="100" y2="120" />
            <line id="warn-dot" x1="100" y1="144" x2="100" y2="148" />
          </svg>
        </div>
      </div>

      <!-- Overlay 4: Label ĐỔI VAI THỦ PHẠM (10.3s -> 12.54s) -->
      <div
        id="clip-label-culprit"
        class="clip center-culprit-layout"
        data-start="10.3"
        data-duration="2.24"
        data-track-index="4"
      >
        <div id="label-culprit-box">
          <h2 class="culprit-title">ĐỔI VAI THỦ PHẠM</h2>
        </div>
      </div>

      <!-- Persistent Brand Accent Bar -->
      <div id="brand-bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Setup SVG stroke drawing for Warning Icon
      const trianglePath = document.getElementById("warn-triangle");
      const stemLine = document.getElementById("warn-stem");
      const dotLine = document.getElementById("warn-dot");

      if (trianglePath) {
        const triLen = trianglePath.getTotalLength();
        trianglePath.style.strokeDasharray = triLen;
        trianglePath.style.strokeDashoffset = triLen;
      }
      if (stemLine) {
        const stemLen = stemLine.getTotalLength();
        stemLine.style.strokeDasharray = stemLen;
        stemLine.style.strokeDashoffset = stemLen;
      }
      if (dotLine) {
        const dotLen = dotLine.getTotalLength();
        dotLine.style.strokeDasharray = dotLen;
        dotLine.style.strokeDashoffset = dotLen;
      }

      // 1. Background Motion: Zoom-through transitionIn (0s - 0.6s) then slow Ken Burns (0.6s - 12.54s)
      tl.fromTo(
        "#bg-photo",
        { scale: 1.26, opacity: 0 },
        { scale: 1.05, opacity: 1, duration: 0.6, ease: "power2.out" },
        0
      );
      tl.to(
        "#bg-photo",
        { scale: 1.15, duration: 11.94, ease: "none" },
        0.6
      );

      // 2. Overlay 1: Punch Phrase (starts at 0.2s, holds, exits before 2.6s)
      tl.fromTo(
        "#punch-box",
        { y: 46, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.52, ease: "power3.out" },
        0.2
      );
      tl.to(
        "#punch-box",
        { y: -24, opacity: 0, duration: 0.28, ease: "power2.in" },
        2.28
      );

      // 3. Overlay 2: Label BỊ HẠI BAN ĐẦU (starts at 3.2s, exits before 5.2s)
      tl.fromTo(
        "#label-victim-box",
        { x: -55, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.46, ease: "power3.out" },
        3.2
      );
      tl.to(
        "#label-victim-box",
        { x: 30, opacity: 0, duration: 0.28, ease: "power2.in" },
        4.88
      );

      // 4. Overlay 3: Icon Warning (starts at 5.6s, animated strokes, exits before 7.8s)
      tl.fromTo(
        "#warning-box",
        { scale: 0.78, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        5.6
      );
      tl.to(
        "#warn-triangle",
        { strokeDashoffset: 0, duration: 0.72, ease: "power2.out" },
        5.72
      );
      tl.to(
        "#warn-stem",
        { strokeDashoffset: 0, duration: 0.36, ease: "power2.out" },
        6.14
      );
      tl.to(
        "#warn-dot",
        { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" },
        6.42
      );
      tl.to(
        "#warning-box",
        { scale: 0.88, opacity: 0, duration: 0.28, ease: "power2.in" },
        7.48
      );

      // 5. Overlay 4: Label ĐỔI VAI THỦ PHẠM (starts at 10.3s -> holds to scene end)
      tl.fromTo(
        "#label-culprit-box",
        { scale: 1.12, opacity: 0, y: 32 },
        { scale: 1, opacity: 1, y: 0, duration: 0.46, ease: "power3.out" },
        10.3
      );
      tl.to(
        "#label-culprit-box",
        { opacity: 0.95, duration: 0.2, ease: "power1.in" },
        12.34
      );

      // Register master timeline with HyperFrames seek adapter
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s01"] = tl;
    </script>
  
    </template>
  </body>
</html>
