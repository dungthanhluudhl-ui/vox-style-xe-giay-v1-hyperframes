<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #141414;
        color: #F7F4EC;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #E7E3D9;
      }
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Lớp nền ảnh toàn khung hình (background-photo / split) - Giữ nguyên màu gốc của asset */
      .media-viewport {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #141414;
      }
      .media-inner {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        will-change: transform;
      }
      .hero-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Thanh cam thương hiệu ở đáy khung hình (Style DNA signature) */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 10px;
        background: #FF6A1A;
        z-index: 50;
      }

      /* Container bố cục an toàn cho overlay text */
      .overlay-wrapper {
        position: absolute;
        top: 240px;
        left: 60px;
        right: 60px;
        height: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      /* Tấm nền đặc (solid plate #141414) đảm bảo độ tương phản WCAG 100% trên ảnh */
      .editorial-plate {
        background: #141414;
        border-radius: 14px;
        padding: 26px 36px;
        border-left: 8px solid #FF6A1A;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 960px;
        will-change: transform, opacity;
      }

      .eyebrow-tag {
        align-self: flex-start;
        background: #FF6A1A;
        color: #141414;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 6px 14px;
        border-radius: 6px;
        line-height: 1.2;
      }

      .main-title {
        margin: 0;
        font-size: 58px;
        font-weight: 900;
        line-height: 1.25;
        color: #F7F4EC;
        letter-spacing: -0.5px;
      }

      .main-title .highlight-orange {
        color: #FF6A1A;
        display: block;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s40"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="5.95"
    >
      <!-- Shot S40-1: Lớp hình ảnh đối chiếu (split comic) phủ toàn khung -->
      <section id="shot-media" class="clip" data-start="0" data-duration="5.95">
        <div id="media-peel-container" class="media-viewport">
          <div id="camera-rig" class="media-inner">
            <img
              class="hero-image"
              src="assets/img-11-gang-retaliation-chase-split.jpg"
              alt="Minh họa phân tách đối chiếu: Chạy trốn đối nghịch Trả đũa"
            />
          </div>
        </div>
      </section>

      <!-- Overlay 1: Nhãn mở đầu "TỪ NGƯỜI CHẠY TRỐN" (atMs 356000 -> 0.74s, holdMs 2000) -->
      <section id="overlay-1-clip" class="clip" data-start="0.74" data-duration="2.0">
        <div class="overlay-wrapper">
          <div id="plate-1" class="editorial-plate">
            <div class="eyebrow-tag">HOÀN CẢNH BAN ĐẦU</div>
            <h1 class="main-title">TỪ NGƯỜI CHẠY TRỐN</h1>
          </div>
        </div>
      </section>

      <!-- Overlay 2: Punch-phrase "THÀNH KẺ TƯỚC MẠNG SỐNG" (atMs 358200 -> 2.94s, holdMs 2200) -->
      <section id="overlay-2-clip" class="clip" data-start="2.94" data-duration="2.9">
        <div class="overlay-wrapper">
          <div id="plate-2" class="editorial-plate">
            <div class="eyebrow-tag">BƯỚC NGOẶT HÀNH VI</div>
            <h1 class="main-title">
              THÀNH KẺ
              <span class="highlight-orange">TƯỚC MẠNG SỐNG</span>
            </h1>
          </div>
        </div>
      </section>

      <!-- Thanh thương hiệu cố định mép đáy khung hình -->
      <div class="brand-bottom-bar"></div>
    </div>

    <script>
      // Khởi tạo Timeline GSAP tất định, paused theo đúng HyperFrames contract
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance: Transition "peel" mở màn hình ảnh bằng diagonal clipPath unmasking
      tl.fromTo(
        "#media-peel-container",
        { clipPath: "polygon(0% 0%, 0% 0%, 0% 100%, 0% 100%)" },
        {
          clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)",
          duration: 0.75,
          ease: "power2.out"
        },
        0
      );

      // Camera ban đầu: khung hình cân bằng đối chiếu 2 nửa (người chạy trốn bên trái vs băng nhóm bên phải)
      tl.fromTo(
        "#camera-rig",
        { scale: 1.1, x: 0, y: 0 },
        { scale: 1.05, x: 0, y: 0, duration: 1.0, ease: "power2.out" },
        0
      );

      // 2. Overlay 1 ("TỪ NGƯỜI CHẠY TRỐN"): Xuất hiện tại 0.74s, giữ chắc chắn và trượt ra trước nhịp zoom
      tl.fromTo(
        "#plate-1",
        { opacity: 0, y: 35 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.74
      );
      tl.to(
        "#plate-1",
        { opacity: 0, y: -25, duration: 0.3, ease: "power2.in" },
        2.44
      );

      // 3. Camera Motion: Zoom-in dứt khoát vào nửa bên phải (băng nhóm cầm hung khí trả đũa)
      tl.to(
        "#camera-rig",
        {
          scale: 1.56,
          x: -290,
          y: -50,
          duration: 1.25,
          ease: "power3.inOut"
        },
        2.55
      );

      // 4. Overlay 2 (Punch-phrase "THÀNH KẺ TƯỚC MẠNG SỐNG"): Nổ ra tại 2.94s đúng lúc camera khóa vào hung thủ
      tl.fromTo(
        "#plate-2",
        { opacity: 0, scale: 0.92, y: 30 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" },
        2.94
      );

      // Giữ chuyển động máy chậm rãi, dứt khoát tới hết cảnh
      tl.to(
        "#camera-rig",
        {
          scale: 1.6,
          x: -305,
          y: -55,
          duration: 2.15,
          ease: "sine.out"
        },
        3.8
      );

      // Đăng ký timeline duy nhất trên window.__timelines
      window.__timelines["scene-s40"] = tl;
    </script>
  
    </template>
  </body>
</html>
