        0,

        { y: -40, scale: 0.88 },
        { y: 0, scale: 1, duration: 0.35, ease: "power3.out" },
        0.36,
      );

      tl.to(
        "#svg-fall path, #svg-fall circle",
        {
          strokeDashoffset: 0,
          duration: 0.55,
          stagger: 0.07,
          ease: "power2.out",

        1.94,
