    <script>
      // Single paused master timeline for HyperFrames
      const tl = gsap.timeline({
        paused: true,
        defaults: { ease: "power3.out" },
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s39"] = tl;

      // SVG path length setup for clean path drawing
      const trunk = document.getElementById("path-trunk");
      const pathLeft = document.getElementById("path-left");
      const pathRight = document.getElementById("path-right");
      const banCircle = document.getElementById("ban-circle");
      const banSlash = document.getElementById("ban-slash");

      const trunkLen = trunk.getTotalLength();
      trunk.style.strokeDasharray = trunkLen;
      trunk.style.strokeDashoffset = trunkLen;

      const leftLen = pathLeft.getTotalLength();
      pathLeft.style.strokeDasharray = leftLen;
      pathLeft.style.strokeDashoffset = leftLen;

      const rightLen = pathRight.getTotalLength();
      pathRight.style.strokeDasharray = rightLen;
      pathRight.style.strokeDashoffset = rightLen;

      const circleLen = banCircle.getTotalLength();
      banCircle.style.strokeDasharray = circleLen;
      banCircle.style.strokeDashoffset = circleLen;

      const slashLen = banSlash.getTotalLength();
      banSlash.style.strokeDasharray = slashLen;
      banSlash.style.strokeDashoffset = slashLen;

      // Initial visual states
      gsap.set("#header-block", { opacity: 0, y: -24 });
      gsap.set("#origin-node", { opacity: 0, scale: 0.9, y: 30 });
      gsap.set("#branch-left", { opacity: 0, y: 40 });
      gsap.set("#branch-right", { opacity: 0, y: 40 });
      gsap.set("#ban-container", { opacity: 0, scale: 0 });
      gsap.set("#stamp-missed", { opacity: 0, scale: 0.85, y: 20 });
      gsap.set("#weapon-box", { opacity: 0, scale: 0.85, y: 20 });
      gsap.set("#conclusion-card", { opacity: 0, y: 30 });

      // 0.0s - 0.8s: Scene entrance & header reveal
      tl.to("#header-block", { opacity: 1, y: 0, duration: 0.7 }, 0.2);

      // 1.38s: Overlay 1 -> "ĐÃ THOÁT KHỎI DAO"
      tl.to(
        "#origin-node",
        {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.7,
        },
        1.38,
      );

      // 2.7s - 3.8s: Fork paths draw downwards & destination columns emerge
      tl.to("#path-trunk", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 2.7);
      tl.to("#path-left", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 3.0);
      tl.to("#path-right", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 3.1);

      tl.to("#branch-left", { opacity: 1, y: 0, duration: 0.6 }, 3.5);
      tl.to("#branch-right", { opacity: 1, y: 0, duration: 0.6 }, 3.7);

      // 4.78s: Overlay 2 -> "ban" Icon strikes across the safe branch
      tl.to(
        "#ban-container",
        {
          opacity: 1,
          scale: 1,
          duration: 0.4,
          ease: "power3.out",
        },
        4.78,
      );
      tl.to(
        banCircle,
        {
          strokeDashoffset: 0,
          duration: 0.5,
          ease: "power2.out",
        },
        4.85,
      );
      tl.to(
        banSlash,
        {
          strokeDashoffset: 0,
          duration: 0.4,
          ease: "power2.out",
        },
        5.15,
      );

      // 7.18s: Overlay 3 -> "BỎ LỠ CƠ HỘI DỪNG LẠI"
      tl.to(
        "#stamp-missed",
        {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.5,
          ease: "power3.out",
        },
        7.18,
      );

      // 10.18s: Overlay 4 -> "TỤ TẬP VŨ KHÍ"
      tl.to(
        "#weapon-box",
        {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.55,
          ease: "power3.out",
        },
        10.18,
      );

      // Pulse / emphasize the right branch card
      tl.to(
        "#card-vengeance",
        {
          boxShadow: "10px 10px 0px #FF6A1A",
          duration: 0.4,
        },
        10.25,
      );

      // 11.4s: Editorial conclusion summary card
      tl.to(
        "#conclusion-card",
        {
          opacity: 1,
          y: 0,
          duration: 0.6,
          ease: "power3.out",
        },
        11.4,
      );
    </script>
