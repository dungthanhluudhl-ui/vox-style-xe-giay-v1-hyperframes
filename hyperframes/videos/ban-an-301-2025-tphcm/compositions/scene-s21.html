<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #0b0f14;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f14;
    }

    .clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* Camera rig & background photo */
    .camera-rig {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: 50% 45%;
      will-change: transform;
    }

    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Vox style signature bottom bar */
    .brand-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 10px;
      background-color: #FF6A1A;
      z-index: 50;
    }

    /* Safe-zone overlay rows */
    .overlay-row {
      position: absolute;
      left: 0;
      right: 0;
      height: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .row-label {
      top: 360px;
      z-index: 30;
    }

    .row-icon {
      top: 500px;
      z-index: 31;
    }

    /* Solid high-contrast plate for label */
    .label-plate {
      display: inline-flex;
      align-items: center;
      background-color: #141414;
      padding: 18px 36px 18px 24px;
      border-radius: 6px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
      will-change: transform, opacity;
    }

    .label-accent-bar {
      width: 8px;
      height: 48px;
      background-color: #FF6A1A;
      border-radius: 2px;
      margin-right: 22px;
      flex-shrink: 0;
    }

    .label-typography {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 46px;
      line-height: 1.2;
      letter-spacing: 1.5px;
      color: #F7F4EC;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Solid high-contrast circular badge for person icon */
    .icon-plate {
      width: 108px;
      height: 108px;
      background-color: #141414;
      border: 3.5px solid #FF6A1A;
      border-radius: 50%;
      display: grid;
      place-items: center;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.55);
      will-change: transform, opacity;
    }

    .person-svg {
      width: 68px;
      height: 68px;
      display: block;
    }

    .person-path {
      fill: none;
      stroke: #FF6A1A;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s21"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="5.54"
  >
    <!-- Shot S21-1: Background photo & camera motion (giữ nguyên màu sắc asset nguyên bản) -->
    <div id="shot-s21-1" class="clip" data-start="0" data-duration="5.54">
      <div id="camera-rig" class="camera-rig">
        <img
          id="bg-photo"
          class="bg-image"
          src="assets/img-12-suspect-fleeing-court-gavel.jpg"
          alt="Bóng đối tượng trốn chạy khỏi búa toà án"
        />
      </div>
      <div class="brand-bottom-bar"></div>
    </div>

    <!-- Overlay 1: Label "PHI TANG HUNG KHÍ" (start: 2.86s, duration: 2.2s) -->
    <div id="clip-overlay-label" class="clip" data-start="2.86" data-duration="2.2">
      <div class="overlay-row row-label">
        <div id="label-card" class="label-plate">
          <div class="label-accent-bar"></div>
          <span class="label-typography">PHI TANG HUNG KHÍ</span>
        </div>
      </div>
    </div>

    <!-- Overlay 2: Icon "person" (start: 4.26s, duration: 1.2s) -->
    <div id="clip-overlay-icon" class="clip" data-start="4.26" data-duration="1.2">
      <div class="overlay-row row-icon">
        <div id="icon-badge" class="icon-plate">
          <svg class="person-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- head -->
            <circle class="person-path" cx="50" cy="24" r="12" />
            <!-- torso -->
            <path class="person-path" d="M 50 38 L 48 64" />
            <!-- arms in running motion -->
            <path class="person-path" d="M 30 52 L 49 43 L 70 54" />
            <!-- legs in stride -->
            <path class="person-path" d="M 32 86 L 48 64 L 66 78 L 76 90" />
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Prepare SVG stroke geometry for progressive path drawing
    const personPaths = document.querySelectorAll(".person-path");
    const pathLengths = [];
    personPaths.forEach((path) => {
      const len = path.getTotalLength();
      pathLengths.push(len);
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = len;
    });

    // Master seekable GSAP timeline
    const tl = gsap.timeline({ paused: true });

    // 1. Shot S21-1 transitionIn: wobble-drop (0.0s to 0.7s)
    tl.fromTo(
      "#camera-rig",
      { y: -75, rotation: 1.8, scale: 1.05 },
      { y: 0, rotation: 0, scale: 1.02, duration: 0.7, ease: "power3.out" },
      0
    );

    // Camera motion: continuous zoom-in following the flee momentum (0.7s to 5.54s)
    tl.to(
      "#camera-rig",
      { scale: 1.1, duration: 4.84, ease: "sine.out" },
      0.7
    );

    // 2. Overlay 1: "PHI TANG HUNG KHÍ" entrance, settle & exit fade
    tl.fromTo(
      "#label-card",
      { y: -30, opacity: 0, scale: 0.94 },
      { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
      2.86
    );

    tl.to(
      "#label-card",
      { opacity: 0, y: -8, duration: 0.22, ease: "power2.in" },
      4.82
    );

    // 3. Overlay 2: "person" icon entrance, SVG progressive path draw & exit fade
    tl.fromTo(
      "#icon-badge",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      4.26
    );

    personPaths.forEach((path, i) => {
      const len = pathLengths[i];
      tl.fromTo(
        path,
        { strokeDashoffset: len },
        { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
        4.32 + i * 0.07
      );
    });

    tl.to(
      "#icon-badge",
      { opacity: 0, scale: 0.94, duration: 0.2, ease: "power2.in" },
      5.24
    );

    // Register paused timeline with HyperFrames runtime
    window.__timelines["scene-s21"] = tl;
  </script>

    </template>
  </body>
</html>
