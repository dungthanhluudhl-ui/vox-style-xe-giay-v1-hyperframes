<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #141414;
      color: #F7F4EC;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      width: 1080px;
      height: 1920px;
      position: relative;
    }
    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    /* Standard HyperFrames clip rule: position:absolute; inset:0 */
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Background image layer covering entire 1080x1920 frame */
    #bg-photo-wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      transform-origin: 50% 30%;
    }
    #hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform-origin: 50% 35%;
    }

    /* Spotlight vignette & split divider styling */
    #spotlight-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(20, 20, 20, 0.08) 20%, rgba(20, 20, 20, 0.58) 100%);
    }
    #peel-curtain {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      pointer-events: none;
      z-index: 5;
    }

    /* Fixed brand signature bottom bar */
    #bottom-accent-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 14px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Reusable solid plates for high-contrast legible overlays */
    .evidence-plate {
      position: absolute;
      background-color: #141414;
      border-left: 10px solid #FF6A1A;
      box-sizing: border-box;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      height: auto;
    }
    .badge-tag {
      display: inline-block;
      background-color: #FF6A1A;
      color: #141414;
      font-weight: 900;
      font-size: 24px;
      line-height: 1;
      padding: 8px 18px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* Overlay 1: 23:50 TỬ VONG (top safe band) */
    #ov1-container {
      top: 260px;
      left: 60px;
      width: 860px;
      padding: 28px 36px;
    }
    .ov1-title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.2;
      color: #F7F4EC;
    }
    .ov1-title .accent {
      color: #FF6A1A;
    }

    /* Overlay 2: Clock Icon (top safe band) */
    #ov2-container {
      top: 260px;
      left: 60px;
      width: 620px;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .clock-svg-box {
      width: 140px;
      height: 140px;
      flex-shrink: 0;
    }
    .clock-info-col {
      display: flex;
      flex-direction: column;
    }
    .clock-digital {
      font-size: 56px;
      font-weight: 900;
      color: #FF6A1A;
      line-height: 1.1;
      letter-spacing: 2px;
    }

    /* Overlay 3: SỐC MẤT MÁU CẤP (centered in mid-hero band) */
    #ov3-container {
      top: 780px;
      left: 60px;
      width: 960px;
      padding: 32px 36px;
    }
    .ov3-heading {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.25;
      color: #F7F4EC;
    }

    /* Overlay 4: Punch-phrase THỦNG TIM & ĐỘNG MẠCH (positioned safely above caption band) */
    #ov4-container {
      top: 780px;
      left: 60px;
      width: 960px;
      padding: 32px 36px;
    }
    .ov4-punch {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.25;
      color: #F7F4EC;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .ov4-punch .highlight {
      color: #FF6A1A;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s19"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="9.51"
  >
    <!-- Background Split Photo Clip -->
    <div id="clip-bg" class="clip" data-start="0" data-duration="9.51">
      <div id="bg-photo-wrapper">
        <img
          id="hero-img"
          src="assets/img-06-forensic-report-emergency-room.jpg"
          alt="Báo cáo giám định pháp y tử thi"
        />
      </div>
      <div id="spotlight-vignette"></div>
      <!-- Peel transition entrance curtain -->
      <div id="peel-curtain"></div>
    </div>

    <!-- Overlay 1: 23:50 TỬ VONG (atMs: 157000 -> 0.98s, holdMs: 2200 -> 2.2s) -->
    <div id="clip-ov1" class="clip" data-start="0.98" data-duration="2.2">
      <div id="ov1-container" class="evidence-plate hf-plate-ink">
        <div class="badge-tag">HỒ SƠ BỆNH VIỆN</div>
        <div class="ov1-title"><span class="accent">23:50</span> TỬ VONG</div>
      </div>
    </div>

    <!-- Overlay 2: Icon Clock (atMs: 159200 -> 3.18s, holdMs: 1600 -> 1.6s) -->
    <div id="clip-ov2" class="clip" data-start="3.18" data-duration="1.6">
      <div id="ov2-container" class="evidence-plate hf-plate-ink">
        <div class="clock-svg-box">
          <svg viewBox="0 0 160 160" width="140" height="140">
            <!-- Clock Dial Rim -->
            <circle
              id="clock-rim"
              cx="80"
              cy="80"
              r="66"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="7"
              stroke-linecap="round"
              style="transform-origin: 80px 80px; transform: rotate(-90deg);"
            />
            <!-- Hour ticks -->
            <line class="clock-tick" x1="80" y1="24" x2="80" y2="34" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" />
            <line class="clock-tick" x1="136" y1="80" x2="126" y2="80" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" />
            <line class="clock-tick" x1="80" y1="136" x2="80" y2="126" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" />
            <line class="clock-tick" x1="24" y1="80" x2="34" y2="80" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" />
            <!-- Hour Hand pointing to 11h50 -->
            <line
              id="hand-hour"
              x1="80"
              y1="80"
              x2="76"
              y2="44"
              stroke="#F7F4EC"
              stroke-width="8"
              stroke-linecap="round"
            />
            <!-- Minute Hand pointing to 50 min -->
            <line
              id="hand-min"
              x1="80"
              y1="80"
              x2="32"
              y2="52"
              stroke="#FF6A1A"
              stroke-width="6"
              stroke-linecap="round"
            />
            <!-- Pin Center -->
            <circle cx="80" cy="80" r="6" fill="#FF6A1A" />
          </svg>
        </div>
        <div class="clock-info-col">
          <div class="badge-tag" style="margin-bottom: 6px;">THỜI ĐIỂM</div>
          <div class="clock-digital">23:50</div>
        </div>
      </div>
    </div>

    <!-- Overlay 3: SỐC MẤT MÁU CẤP (atMs: 161600 -> 5.58s, holdMs: 2000 -> 2.0s) -->
    <div id="clip-ov3" class="clip" data-start="5.58" data-duration="2.0">
      <div id="ov3-container" class="evidence-plate hf-plate-ink">
        <div class="badge-tag">KẾT LUẬN GIÁM ĐỊNH</div>
        <div class="ov3-heading">SỐC MẤT MÁU CẤP</div>
      </div>
    </div>

    <!-- Overlay 4: Punch-phrase THỦNG TIM & ĐỘNG MẠCH (atMs: 163600 -> 7.58s, holdMs: 1900 -> 1.93s) -->
    <div id="clip-ov4" class="clip" data-start="7.58" data-duration="1.93">
      <div id="ov4-container" class="evidence-plate hf-plate-ink">
        <div class="badge-tag">NGUYÊN NHÂN TỬ VONG</div>
        <div class="ov4-punch">
          <span class="highlight">THỦNG TIM</span> &amp; ĐỘNG MẠCH
        </div>
      </div>
    </div>

    <!-- Bottom Brand Accent Bar -->
    <div id="bottom-accent-bar"></div>
  </div>

  <script>
    // Prepare SVG path lengths for deterministic progressive drawing
    const clockRim = document.getElementById("clock-rim");
    if (clockRim) {
      const rimLen = clockRim.getTotalLength ? clockRim.getTotalLength() : 414.7;
      clockRim.style.strokeDasharray = rimLen + "";
      clockRim.style.strokeDashoffset = rimLen + "";
    }

    const handHour = document.getElementById("hand-hour");
    if (handHour) {
      const hourLen = handHour.getTotalLength ? handHour.getTotalLength() : 36.2;
      handHour.style.strokeDasharray = hourLen + "";
      handHour.style.strokeDashoffset = hourLen + "";
    }

    const handMin = document.getElementById("hand-min");
    if (handMin) {
      const minLen = handMin.getTotalLength ? handMin.getTotalLength() : 55.7;
      handMin.style.strokeDasharray = minLen + "";
      handMin.style.strokeDashoffset = minLen + "";
    }

    // Single master paused timeline
    const tl = gsap.timeline({ paused: true });

    // 1. Entrance "peel" animation (0.0s - 0.7s)
    tl.fromTo(
      "#peel-curtain",
      { clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)" },
      { clipPath: "polygon(100% 0%, 100% 0%, 100% 100%, 100% 100%)", duration: 0.7, ease: "power2.inOut" },
      0
    );

    // 2. Camera motion: continuous pan from upper emergency clock down to lower heart anatomy report
    // Phase 1 (0s - 4.5s): Framing upper hospital clock
    tl.fromTo(
      "#hero-img",
      { scale: 1.18, y: 50, x: -15 },
      { scale: 1.20, y: 30, x: 10, duration: 4.5, ease: "power1.out" },
      0
    );

    // Phase 2 (4.5s - 9.51s): Pan down firmly to forensic heart report and hold
    tl.to(
      "#hero-img",
      { scale: 1.26, y: -130, x: -20, duration: 5.01, ease: "power2.inOut" },
      4.5
    );

    // 3. Overlay 1 Animations: 23:50 TỬ VONG (Starts at 0.98s, clip ends at 3.18s)
    tl.fromTo(
      "#ov1-container",
      { x: -60, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      0.98
    );
    tl.to(
      "#ov1-container",
      { opacity: 0, x: -20, duration: 0.25, ease: "power2.in" },
      2.93
    );

    // 4. Overlay 2 Animations: Clock Icon Path Draw (Starts at 3.18s, clip ends at 4.78s)
    tl.fromTo(
      "#ov2-container",
      { scale: 0.9, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      3.18
    );
    if (clockRim) {
      tl.to("#clock-rim", { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 3.25);
    }
    if (handHour) {
      tl.to("#hand-hour", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 3.45);
    }
    if (handMin) {
      tl.to("#hand-min", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 3.55);
    }
    tl.to(
      "#ov2-container",
      { opacity: 0, scale: 0.96, duration: 0.25, ease: "power2.in" },
      4.53
    );

    // 5. Overlay 3 Animations: SỐC MẤT MÁU CẤP (Starts at 5.58s, clip ends at 7.58s)
    tl.fromTo(
      "#ov3-container",
      { y: 30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" },
      5.58
    );
    tl.to(
      "#ov3-container",
      { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" },
      7.33
    );

    // 6. Overlay 4 Animations: THỦNG TIM & ĐỘNG MẠCH (Starts at 7.58s, lasts until end 9.51s)
    tl.fromTo(
      "#ov4-container",
      { scale: 0.92, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.38, ease: "power3.out" },
      7.58
    );
    tl.fromTo(
      ".ov4-punch .highlight",
      { color: "#F7F4EC" },
      { color: "#FF6A1A", duration: 0.3, ease: "none" },
      7.95
    );

    // Register paused timeline with HyperFrames
    window.__timelines["scene-s19"] = tl;
  </script>

    </template>
  </body>
</html>
