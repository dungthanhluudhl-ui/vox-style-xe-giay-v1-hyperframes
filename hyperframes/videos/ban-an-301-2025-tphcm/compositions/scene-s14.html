  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }

      * {

      }
      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;

      #root {

        width: 100%;
        height: 100%;

      .clip {

      /* Lưới nền kỹ thuật 84px chuẩn Vox DNA */
      .grid-pattern {

        inset: 0;
        pointer-events: none;
      }

      /* Thanh cam thương hiệu cố định mép đáy */
      #bottom-brand-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 100;
      }

      /* Header & Metadata */
      .header-container {
        position: absolute;
        top: 180px;
        left: 60px;
        right: 60px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        z-index: 20;
      }
      .meta-tag {
        align-self: flex-start;
        background-color: #141414;
        color: #f7f4ec;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 2px;
        padding: 6px 16px;
        border-radius: 4px;
        text-transform: uppercase;
      }
      .scene-title {
        margin: 0;
        font-size: 64px;
        font-weight: 900;
        line-height: 1.15;
        color: #141414;
        letter-spacing: -1px;
        text-transform: uppercase;
      }
      .header-line {
        width: 100%;
        height: 2px;
        background-color: rgba(20, 20, 20, 0.25);

      /* Khu vực Hero Diagram */
      .diagram-stage {
        position: absolute;
        top: 360px;
        left: 60px;
        right: 60px;
        height: 840px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }

      .svg-canvas {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      /* Overlay Badge thông tin phương tiện */
      .spec-badge {
        position: absolute;
        left: 50%;
        top: 490px;
        transform: translateX(-50%);
        background-color: #141414;
        color: #f7f4ec;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 2px;
        padding: 8px 24px;
        border-radius: 6px;
        white-space: nowrap;
        z-index: 25;
        box-shadow: 0 4px 14px rgba(20, 20, 20, 0.15);
      }

      /* Khung ngắm mục tiêu & Banner cảnh báo (atMs 123200) */
      .alert-container {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 1140px;
        display: flex;
        flex-direction: column;
        align-items: center;

        z-index: 30;

      .alert-banner {

        color: #141414;
        font-size: 42px;
        font-weight: 900;

        padding: 16px 36px;
        border: 4px solid #141414;
        box-shadow: 6px 6px 0 #141414;
        text-transform: uppercase;
        text-align: center;
      }
      .sub-alert-badge {
        background-color: #141414;
        color: #f7f4ec;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
        padding: 8px 20px;
        border-radius: 4px;
        text-transform: uppercase;
        text-align: center;
      }

      /* Khung ngắm góc (Corner brackets) */
      .bracket {
        fill: none;
        stroke: #141414;
        stroke-width: 5;
        stroke-linecap: square;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s14"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6.36"
    >
      <!-- Lưới kỹ thuật nền 84px chuẩn Vox DNA -->
      <svg class="grid-pattern" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="grid84" width="84" height="84" patternUnits="userSpaceOnUse">
            <path d="M 84 0 L 0 0 0 84" fill="none" stroke="rgba(20,20,20,0.32)" stroke-width="1.5" />

        </defs>
        <rect width="1080" height="1920" fill="url(#grid84)" />

      <!-- Clip diễn hoạt chính của Scene S14 -->

        <!-- Header Info -->

          <div class="meta-tag">HỒ SƠ // TRINH SÁT TẠI CHỖ</div>
          <h1 class="scene-title">PHÁT HIỆN XE NẠN NHÂN</h1>

        <!-- Nhãn định danh phương tiện theo kịch bản -->
        <div class="spec-badge" id="vehicle-badge">PHƯƠNG TIỆN: HONDA VISION</div>

        <!-- Sơ đồ Kỹ Thuật, Radar & Tâm Ngắm Tròn Màu Cam Khoanh Vùng Xe -->
        <div class="diagram-stage" id="diagram-group">
          <svg class="svg-canvas" viewBox="0 0 960 840" xmlns="http://www.w3.org/2000/svg">
            <!-- VÒNG TÂM NGẮM TRÒN MÀU CAM KHOANH VÙNG TOÀN BỘ XE MÁY -->
            <g id="orange-target-reticle" transform="translate(480, 430)">
              <!-- Vòng tròn ngắm cam lớn bao quanh toàn bộ xe -->
              <circle
                id="target-circle-outer"
                r="330"
                fill="none"
                stroke="#ff6a1a"
                stroke-width="5"
                stroke-dasharray="24 14"
              />
              <!-- Vòng tròn ngắm cam phụ bên trong -->
              <circle
                id="target-circle-inner"
                r="305"
                fill="none"
                stroke="#ff6a1a"
                stroke-width="2.5"
                stroke-dasharray="8 6"
              />
              <!-- 4 vạch tiêu chuẩn cam định vị 4 hướng bao quanh xe -->
              <line x1="-355" y1="0" x2="-280" y2="0" stroke="#ff6a1a" stroke-width="4" stroke-linecap="round" />
              <line x1="280" y1="0" x2="355" y2="0" stroke="#ff6a1a" stroke-width="4" stroke-linecap="round" />
              <line x1="0" y1="-355" x2="0" y2="-280" stroke="#ff6a1a" stroke-width="4" stroke-linecap="round" />
              <line x1="0" y1="280" x2="0" y2="355" stroke="#ff6a1a" stroke-width="4" stroke-linecap="round" />

              <!-- Các nấc đo chia độ màu cam trên vòng ngắm bao quanh xe -->
              <circle r="345" fill="none" stroke="#ff6a1a" stroke-width="1.5" stroke-dasharray="4 24" />
            </g>

            <!-- Hệ trục radar kỹ thuật phụ trợ nền -->
            <g id="radar-rings" transform="translate(480, 430)">
              <circle r="230" fill="none" stroke="rgba(20,20,20,0.3)" stroke-width="1.5" />
              <line x1="-360" y1="0" x2="360" y2="0" stroke="rgba(20,20,20,0.2)" stroke-width="1" stroke-dasharray="6 6" />
              <line x1="0" y1="-360" x2="0" y2="360" stroke="rgba(20,20,20,0.2)" stroke-width="1" stroke-dasharray="6 6" />
            </g>

            <!-- Khung ngoặc góc reticle khóa mục tiêu -->
            <g id="reticle-brackets">
              <path class="bracket" id="b-tl" d="M 140 230 L 140 150 L 220 150" />
              <path class="bracket" id="b-tr" d="M 820 230 L 820 150 L 740 150" />
              <path class="bracket" id="b-bl" d="M 140 630 L 140 710 L 220 710" />
              <path class="bracket" id="b-br" d="M 820 630 L 820 710 L 740 710" />
            </g>

            <!-- Vector Minh Họa Kỹ Thuật: Xe máy Honda Vision nằm trọn trong vòng ngắm cam -->
            <g id="scooter-vector" transform="translate(480, 450)">
              <!-- Mặt đường tiếp đất kỹ thuật -->
              <line x1="-280" y1="175" x2="280" y2="175" stroke="#141414" stroke-width="3" stroke-linecap="round" />

              <!-- Bánh trước (bên trái) -->
              <g transform="translate(-160, 110)">
                <circle r="60" fill="#e7e3d9" stroke="#141414" stroke-width="10" />
                <circle r="42" fill="none" stroke="#141414" stroke-width="3" stroke-dasharray="10 6" />
                <circle r="14" fill="#141414" />
                <line x1="0" y1="0" x2="35" y2="-95" stroke="#141414" stroke-width="8" stroke-linecap="round" />
                <line x1="-8" y1="-10" x2="27" y2="-105" stroke="#141414" stroke-width="4" stroke-linecap="round" />
              </g>

              <!-- Bánh sau (bên phải) -->
              <g transform="translate(150, 110)">
                <circle r="60" fill="#e7e3d9" stroke="#141414" stroke-width="10" />
                <circle r="42" fill="none" stroke="#141414" stroke-width="3" stroke-dasharray="10 6" />
                <circle r="14" fill="#141414" />
                <!-- Ống xả thể thao -->
                <path d="M -40 25 L 50 10 L 65 -5 L -20 10 Z" fill="#141414" />
                <line x1="45" y1="10" x2="60" y2="-5" stroke="#ff6a1a" stroke-width="4" />
                <line x1="-15" y1="-5" x2="-35" y2="-80" stroke="#141414" stroke-width="7" stroke-linecap="round" />
              </g>

              <!-- Thân xe & Dàn áo Honda Vision (Blueprint Silhouette) -->
              <path
                d="M -135 15
                   C -130 -30, -115 -85, -95 -125
                   L -80 -170
                   L -115 -185
                   L -100 -205
                   L -65 -190
                   L -50 -185
                   C -40 -150, -35 -110, -25 -70
                   L 20 -70
                   C 35 -110, 70 -130, 130 -125
                   L 190 -70
                   C 215 -30, 220 15, 210 50
                   L 130 50
                   L 100 85
                   L 20 85
                   L -20 20
                   L -110 20
                   Z"
                fill="#141414"
              />

              <!-- Yên xe -->
              <path
                d="M -20 -72
                   C 20 -82, 75 -90, 140 -85
                   C 160 -85, 175 -75, 170 -62
                   C 130 -58, 60 -58, 15 -62
                   Z"
                fill="#f7f4ec"
                stroke="#141414"
                stroke-width="3"
              />

              <!-- Điểm nhấn màu cam trên yếm trước Honda Vision -->
              <path
                d="M -90 -120
                   L -75 -165
                   L -55 -155
                   L -70 -115
                   Z"
                fill="#ff6a1a"
              />
              <polygon points="-85,-175 -60,-170 -65,-182 -88,-185" fill="#f7f4ec" />

              <!-- Gương chiếu hậu & Chân chống -->
              <line x1="-70" y1="-190" x2="-85" y2="-235" stroke="#141414" stroke-width="4" stroke-linecap="round" />
              <ellipse cx="-88" cy="-242" rx="14" ry="9" transform="rotate(-20, -88, -242)" fill="#141414" />
              <line x1="-20" y1="75" x2="-45" y2="175" stroke="#141414" stroke-width="6" stroke-linecap="round" />
            </g>

            <!-- Sóng xung kích định vị lan tỏa khi Pin tiếp đất (atMs 120500) -->
            <g id="radar-pulse" transform="translate(480, 430)">
              <circle id="pulse-1" r="20" fill="none" stroke="#ff6a1a" stroke-width="4" opacity="0" />
              <circle id="pulse-2" r="20" fill="none" stroke="#ff6a1a" stroke-width="3" opacity="0" />
            </g>

            <!-- Biểu tượng Pin định vị màu cam rọi thẳng xuống xe (atMs 120500 = 1.9s) -->
            <g id="pin-icon" transform="translate(480, 310)">
              <!-- Bóng ghim Pin tiếp xúc xe -->
              <ellipse cx="0" cy="115" rx="18" ry="6" fill="rgba(20,20,20,0.3)" />
              <!-- Đường dóng tiêu cự rọi từ Pin xuống xe -->
              <line x1="0" y1="95" x2="0" y2="120" stroke="#ff6a1a" stroke-width="3" stroke-dasharray="4 3" />
              <!-- Thân Pin màu cam viền mực -->
              <path
                d="M 0 95
                   C -20 65, -34 45, -34 20
                   C -34 -18, -18 -34, 0 -34
                   C 18 -34, 34 -18, 34 20
                   C 34 45, 20 65, 0 95
                   Z"
                fill="#ff6a1a"
                stroke="#141414"
                stroke-width="5"
                stroke-linejoin="round"
              />
              <!-- Tâm ghim Pin -->
              <circle cx="0" cy="18" r="12" fill="#141414" />
              <circle cx="0" cy="18" r="5" fill="#f7f4ec" />
            </g>
          </svg>
        </div>

        <!-- Banner Callout: "MỤC TIÊU THAY THẾ" (xuất hiện tại atMs 123200 = 4.6s) -->
        <div class="alert-container" id="alert-callout">
          <div class="alert-banner" id="target-label">MỤC TIÊU THAY THẾ</div>
          <div class="sub-alert-badge" id="target-sublabel">KHÔNG TÌM THẤY NGƯỜI → XỬ LÝ XE TRƯỚC</div>
        </div>
      </div>

      <!-- Dải cam thương hiệu nhận diện đáy khung hình -->
      <div id="bottom-brand-bar"></div>
    </div>

    <script>
      // Khởi tạo GSAP Timeline tất định deterministic
      const tl = gsap.timeline({ paused: true });

      // Thiết lập trạng thái ban đầu tuyệt đối
      gsap.set("#header-block", { opacity: 0, y: -30 });
      gsap.set("#vehicle-badge", { opacity: 0, scale: 0.8 });
      gsap.set("#diagram-group", { opacity: 0, scale: 0.88 });
      gsap.set("#orange-target-reticle", { rotation: -40, scale: 0.85, opacity: 0 });
      gsap.set("#radar-rings", { rotation: -20 });
      gsap.set("#pin-icon", { opacity: 0, y: -120 });
      gsap.set("#radar-pulse circle", { opacity: 0, scale: 0.1 });
      gsap.set("#alert-callout", { opacity: 0, scale: 1.35, y: 30 });
      gsap.set(".bracket", { stroke: "#141414", strokeWidth: 5 });

      // ==========================================
      // GIAI ĐOẠN 1: ENTRANCE (0.0s -> 1.5s) - "grow"
      // ==========================================
      // 1. Header xuất hiện
      tl.to("#header-block", {
        opacity: 1,
        y: 0,
        duration: 0.7,
        ease: "power3.out",
      }, 0.2);

      // 2. Toàn bộ sơ đồ & xe máy phóng lớn (grow entrance)
      tl.to("#diagram-group", {
        opacity: 1,
        scale: 1,
        duration: 0.9,
        ease: "power3.out",
      }, 0.3);

      // 3. Vòng tâm ngắm tròn màu cam khoanh vùng toàn bộ xe máy nở ra rõ nét
      tl.to("#orange-target-reticle", {
        opacity: 1,
        scale: 1,
        duration: 0.8,
        ease: "power3.out",
      }, 0.4);

      // 4. Badge phương tiện hiện ra
      tl.to("#vehicle-badge", {
        opacity: 1,
        scale: 1,
        duration: 0.5,
        ease: "power3.out",
      }, 0.7);

      // Vòng tròn ngắm cam xoay chậm duy trì trinh sát kỹ thuật
      tl.to("#orange-target-reticle", {
        rotation: 20,
        duration: 5.8,
        ease: "none",
      }, 0.4);

      // =======================================================
      // GIAI ĐOẠN 2: OVERLAY PIN ĐỊNH VỊ (1.9s) - atMs 120500 ((120500-118600)/1000 = 1.9s)
      // =======================================================
      // Biểu tượng Pin cam cắm thẳng xuống xe nạn nhân
      tl.to("#pin-icon", {
        opacity: 1,
        y: 0,
        duration: 0.45,
        ease: "power3.in",
      }, 1.9);

      // Sóng radar xung kích lan tỏa từ điểm cắm pin rọi vào xe
      tl.to("#pulse-1", {
        opacity: 1,
        scale: 1,
        duration: 0.1,
      }, 2.35);
      tl.to("#pulse-1", {
        scale: 7.5,
        opacity: 0,
        duration: 0.85,
        ease: "power2.out",
      }, 2.45);

      tl.to("#pulse-2", {
        opacity: 0.8,
        scale: 1,
        duration: 0.1,
      }, 2.55);
      tl.to("#pulse-2", {
        scale: 6.0,
        opacity: 0,
        duration: 0.75,
        ease: "power2.out",
      }, 2.65);

      // Pin nhấp nhô nhẹ giữ nhịp thị giác (từ 2.9s)
      tl.to("#pin-icon", {
        y: -10,
        duration: 0.8,
        ease: "sine.inOut",
        yoyo: true,
        repeat: 1,
      }, 2.9);

      // =========================================================================
      // GIAI ĐOẠN 3: OVERLAY MỤC TIÊU THAY THẾ (4.6s) - atMs 123200 ((123200-118600)/1000 = 4.6s)
      // =========================================================================
      // Vòng tròn ngắm cam siết mạnh vào xe khóa mục tiêu
      tl.to("#target-circle-outer", {
        strokeWidth: 9,
        duration: 0.25,
        ease: "power2.out",
      }, 4.55);
      tl.to("#target-circle-inner", {
        strokeWidth: 5,
        duration: 0.25,
        ease: "power2.out",
      }, 4.55);

      // Khung ngắm góc chuyển sang màu cam siết lại
      tl.to(".bracket", {
        stroke: "#ff6a1a",
        strokeWidth: 8,
        duration: 0.2,
        ease: "power2.out",
      }, 4.55);

      tl.to("#reticle-brackets", {
        scale: 0.94,
        transformOrigin: "480px 430px",
        duration: 0.2,
        ease: "power2.out",
      }, 4.55);
      tl.to("#reticle-brackets", {
        scale: 1.0,
        transformOrigin: "480px 430px",
        duration: 0.25,
        ease: "back.out(2)",
      }, 4.75);

      // Banner "MỤC TIÊU THAY THẾ" dập mạnh xuống (Punch entrance)
      tl.to("#alert-callout", {
        opacity: 1,
        scale: 1,
        y: 0,
        duration: 0.4,
        ease: "power4.out",
      }, 4.6);

      // Đăng ký timeline paused vào window.__timelines
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s14"] = tl;
    </script>
  
    </template>
  </body>
