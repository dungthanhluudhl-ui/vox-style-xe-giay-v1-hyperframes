<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body, html {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Camera container & Background image: giữ nguyên 100% màu sắc gốc của asset */
      .camera-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform-origin: 50% 40%;
      }
      .full-bg-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Bottom Brand Bar cố định nhận diện thương hiệu */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }

      /* Overlay 1: Phone call indicator widget (chuẩn Icon Vocabulary Vox) */
      .phone-widget-container {
        position: absolute;
        top: 320px;
        left: 70px;
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .phone-icon-box {
        position: relative;
        width: 130px;
        height: 130px;
        background-color: #141414;
        border: 3px solid #FF6A1A;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
      }

      /* Overlay 2: Punch phrase GỌI NGƯỜI TIẾP VIỆN */
      .punch-label-1-wrap {
        position: absolute;
        top: 560px;
        left: 70px;
        width: 940px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .punch-banner-main {
        background-color: #141414;
        border-left: 12px solid #FF6A1A;
        border-radius: 14px;
        padding: 24px 36px;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.65);
      }
      .punch-phrase-title {
        margin: 0;
        font-size: 64px;
        font-weight: 900;
        line-height: 1.25;
        color: #F7F4EC;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* Overlay 3: Punch phrase LÊ QUỐC T2 = TÍN */
      .punch-label-2-wrap {
        position: absolute;
        top: 560px;
        left: 70px;
        width: 940px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .id-card-banner {
        background-color: #141414;
        border-left: 12px solid #FF6A1A;
        border-radius: 14px;
        padding: 26px 36px;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.65);
      }
      .id-card-title {
        margin: 0;
        font-size: 64px;
        font-weight: 900;
        line-height: 1.25;
        color: #F7F4EC;
        letter-spacing: 1px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s09"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="9.48"
    >
      <!-- Shot 1 Nền chính: Toàn cảnh Kiên gọi điện hẻm đêm (0.00s -> 9.48s), giữ nguyên màu gốc -->
      <section id="shot-bg" class="clip" data-start="0" data-duration="9.48">
        <div id="camera-frame" class="camera-container" data-layout-allow-overflow="true">
          <img
            id="bg-img"
            class="full-bg-image"
            src="assets/img-14-angry-man-calling-dark-alley.jpg"
            alt="Kiên gọi điện thoại hẻm đêm"
          />
        </div>
      </section>

      <!-- Overlay 1: Icon phone + sóng gọi đi (t = 1.84s -> 4.04s, duration = 2.20s) -->
      <section id="clip-overlay-phone" class="clip" data-start="1.84" data-duration="2.2">
        <div id="phone-widget" class="phone-widget-container">
          <div class="phone-icon-box">
            <!-- SVG Phone tự vẽ chuẩn Vox Icon Vocabulary -->
            <svg viewBox="0 0 100 100" width="84" height="84" style="overflow: visible;">
              <!-- Sóng tín hiệu calling radar -->
              <circle id="wave-1" cx="50" cy="50" r="30" fill="none" stroke="#FF6A1A" stroke-width="3" stroke-linecap="round" opacity="0" />
              <circle id="wave-2" cx="50" cy="50" r="44" fill="none" stroke="#FF6A1A" stroke-width="2.5" stroke-linecap="round" opacity="0" />
              <circle id="wave-3" cx="50" cy="50" r="58" fill="none" stroke="#FF6A1A" stroke-width="2" stroke-linecap="round" opacity="0" />
              <!-- Biểu tượng điện thoại di động cầm tay -->
              <rect
                id="phone-body"
                x="33"
                y="20"
                width="34"
                height="60"
                rx="7"
                fill="#141414"
                stroke="#FF6A1A"
                stroke-width="3.5"
              />
              <line id="phone-speaker" x1="42" y1="28" x2="58" y2="28" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
              <circle id="phone-home" cx="50" cy="71" r="3.5" fill="#FF6A1A" />
            </svg>
          </div>
        </div>
      </section>

      <!-- Overlay 2: Label GỌI NGƯỜI TIẾP VIỆN (t = 3.64s -> 5.84s, duration = 2.20s) -->
      <section id="clip-overlay-label-1" class="clip" data-start="3.64" data-duration="2.2">
        <div id="label-1-wrapper" class="punch-label-1-wrap">
          <div id="banner-step" class="punch-banner-main">
            <h1 class="punch-phrase-title">GỌI NGƯỜI TIẾP VIỆN</h1>
          </div>
        </div>
      </section>

      <!-- Overlay 3: Label LÊ QUỐC T2 = TÍN (t = 7.24s -> 9.48s, duration = 2.24s) -->
      <section id="clip-overlay-label-2" class="clip" data-start="7.24" data-duration="2.24">
        <div id="label-2-wrapper" class="punch-label-2-wrap">
          <div id="banner-id" class="id-card-banner">
            <h1 class="id-card-title">LÊ QUỐC T2 = TÍN</h1>
          </div>
        </div>
      </section>

      <!-- Thanh cam đáy cố định nhận diện thương hiệu -->
      <div id="brand-bar" class="bottom-brand-bar"></div>
    </div>

    <!-- GSAP Script -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. TransitionIn "punch" + Zoom-in liên tục của Shot 1
      // Punch effect mở màn lúc t=0 (scale từ 1.18x nén về 1.05x nhanh với ease dứt khoát)
      tl.fromTo(
        "#bg-img",
        { scale: 1.18, opacity: 0.8 },
        { scale: 1.05, opacity: 1, duration: 0.45, ease: "power4.out" },
        0
      );
      // Camera zoom-in từ 1.05x lên 1.14x xuyên suốt toàn bộ scene 9.48s
      tl.fromTo(
        "#camera-frame",
        { scale: 1.0 },
        { scale: 1.085, ease: "none", duration: 9.48 },
        0
      );

      // 2. Overlay 1: Phone Icon (t = 1.84s -> 4.04s)
      tl.fromTo(
        "#phone-widget",
        { scale: 0, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.84
      );
      // Tự vẽ nét viền điện thoại
      tl.fromTo(
        "#phone-body",
        { strokeDasharray: 200, strokeDashoffset: 200 },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        1.95
      );
      // Sóng tín hiệu calling wave 1, 2, 3 lan tỏa
      tl.fromTo(
        "#wave-1",
        { opacity: 0, scale: 0.7, transformOrigin: "50px 50px" },
        { opacity: 0.9, scale: 1.15, duration: 0.5, ease: "power2.out" },
        2.1
      );
      tl.fromTo(
        "#wave-2",
        { opacity: 0, scale: 0.7, transformOrigin: "50px 50px" },
        { opacity: 0.75, scale: 1.3, duration: 0.5, ease: "power2.out" },
        2.25
      );
      tl.fromTo(
        "#wave-3",
        { opacity: 0, scale: 0.7, transformOrigin: "50px 50px" },
        { opacity: 0.6, scale: 1.45, duration: 0.5, ease: "power2.out" },
        2.4
      );
      // Exit fade out nhẹ trước khi hết thời gian clip overlay 1
      tl.to(
        "#phone-widget",
        { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" },
        3.74
      );

      // 3. Overlay 2: Punch phrase "GỌI NGƯỜI TIẾP VIỆN" (t = 3.64s -> 5.84s)
      tl.fromTo(
        "#banner-step",
        { x: -70, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.48, ease: "power3.out" },
        3.64
      );
      // Exit của nhãn 1
      tl.to(
        "#label-1-wrapper",
        { opacity: 0, x: 40, duration: 0.32, ease: "power2.in" },
        5.52
      );

      // 4. Overlay 3: Punch phrase "LÊ QUỐC T2 = TÍN" (t = 7.24s -> 9.48s)
      tl.fromTo(
        "#banner-id",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        7.24
      );

      // Đăng ký timeline gốc duy nhất
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s09"] = tl;
    </script>
  
    </template>
  </body>
</html>
