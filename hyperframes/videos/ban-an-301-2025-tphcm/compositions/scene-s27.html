<!doctype html>

      }
      .role-card.highlight-tin .card-role-label {

      }
      .card-name {
        margin: 0;
        font-size: 56px;
        font-weight: 900;

      /* Highlight callout badge */

        text-transform: uppercase;
      }
      .detail-val {
        font-size: 22px;
        font-weight: 700;
        color: #f7f4ec;
      }

      /* Vector connector */
      .connector-wrap {
        position: absolute;
        top: 900px;
        left: 60px;
        right: 60px;
        height: 110px;
        z-index: 5;
        pointer-events: none;

      .connector-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      /* Legal outcome card */
      .outcome-card {
        position: absolute;
        top: 1015px;
        left: 60px;
        right: 60px;
        background-color: #141414;
        border: 4px solid #ff6a1a;
        border-radius: 20px;
        padding: 30px 36px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 32px;

      .outcome-icon-box {
        width: 104px;
        height: 104px;
        border-radius: 16px;
        background-color: rgba(255, 106, 26, 0.15);
        border: 3px solid #ff6a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .outcome-content {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .outcome-tag {
        font-size: 20px;
        font-weight: 900;
        color: #ff6a1a;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .outcome-title {
        margin: 0;
        font-size: 46px;
        font-weight: 900;
        color: #f7f4ec;
        line-height: 1.2;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .outcome-desc {
        margin: 4px 0 0 0;
        font-size: 22px;
        font-weight: 700;
        color: #e7e3d9;
      }

      /* Fixed bottom orange signature bar */
      .signature-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s27"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="8.46"
    >
      <section id="scene-clip" class="clip" data-start="0" data-duration="8.46">
        <!-- Header -->
        <header class="doc-header" id="doc-header">
          <div class="doc-badge-row">
            <span class="doc-badge">HỘI ĐỒNG XÉT XỬ</span>
            <span class="doc-subtag">KẾT LUẬN</span>
          </div>
          <h1 class="main-title">PHÂN HÓA VAI TRÒ ĐỒNG PHẠM</h1>
          <div class="divider-line"></div>
        </header>

        <!-- Diagram 2 Cards -->
        <main class="diagram-container">
          <div class="cards-row">
            <!-- Kiên -->
            <article class="role-card" id="card-kien">
              <div class="card-top">
                <span class="card-role-label">KHỞI XƯỚNG / TRUY ĐUỔI</span>
                <h2 class="card-name">KIÊN</h2>
              </div>
              <div class="action-badge hf-hl-orange" id="badge-kien">
                KIÊN: CẦM KIẾM TRUY ĐUỔI
              </div>
              <div class="card-details">
                <div class="detail-item">
                  <span class="detail-label">VŨ KHÍ</span>
                  <span class="detail-val">Kiếm</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">VAI TRÒ</span>
                  <span class="detail-val">Khởi xướng, rượt đuổi</span>
                </div>
              </div>
            </article>

            <!-- Tín -->
            <article class="role-card highlight-tin" id="card-tin">
              <div class="card-top">
                <span class="card-role-label">TRỰC TIẾP TẤN CÔNG</span>
                <h2 class="card-name">TÍN</h2>
              </div>
              <div class="action-badge hf-hl-orange" id="badge-tin">
                TÍN: ĐÂM CHÍ MẠNG
              </div>
              <div class="card-details">
                <div class="detail-item">
                  <span class="detail-label">VŨ KHÍ</span>
                  <span class="detail-val">Phóng lợn</span>
                </div>
                <div class="detail-item">
                  <span class="detail-label">VAI TRÒ</span>
                  <span class="detail-val">Trực tiếp đâm</span>
                </div>
              </div>
            </article>
          </div>
        </main>

        <!-- Dynamic Connectors -->
        <div class="connector-wrap">
          <svg class="connector-svg" viewBox="0 0 960 110" preserveAspectRatio="none">
            <!-- Left path from center of Card Kien (~232px) to central junction (480px, 105px) -->
            <path
              id="path-left"
              d="M 232 0 L 232 50 L 476 100"
              fill="none"
              stroke="#141414"
              stroke-width="5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <!-- Right path from center of Card Tin (~728px) to central junction (484px, 105px) -->
            <path
              id="path-right"
              d="M 728 0 L 728 50 L 484 100"
              fill="none"
              stroke="#ff6a1a"
              stroke-width="5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>

        <!-- Outcome Card -->
        <aside class="outcome-card" id="outcome-card">
          <div class="outcome-icon-box" id="icon-fall">
            <!-- Vox Icon vocabulary: fall -->
            <svg width="76" height="76" viewBox="0 0 100 100" fill="none">
              <!-- Head -->
              <circle cx="68" cy="30" r="10" fill="#FF6A1A" />
              <!-- Falling body -->
              <path
                d="M 60 40 L 42 60 L 20 66 M 42 60 L 30 86 M 52 48 L 34 44"
                stroke="#FF6A1A"
                stroke-width="7"
                stroke-linecap="round"

              <!-- Downward impact marker -->
              <path
                d="M 78 18 L 78 38 M 73 32 L 78 38 L 83 32"

            <span class="outcome-tag">HẬU QUẢ TỘI PHẠM</span>
            <h3 class="outcome-title">NẠN NHÂN TỬ VONG</h3>
            <p class="outcome-desc">Trách nhiệm hình sự đồng phạm</p>
          </div>

        <!-- Brand signature bottom bar -->
        <footer class="signature-bar"></footer>
      </section>
    </div>

    <script>
      // Setup SVG dash properties deterministically
      const pathLeft = document.getElementById("path-left");
      const pathRight = document.getElementById("path-right");
      let lenLeft = 250;
      let lenRight = 250;
      if (pathLeft && pathRight) {
        lenLeft = pathLeft.getTotalLength();
        pathLeft.style.strokeDasharray = lenLeft + " " + lenLeft;
        pathLeft.style.strokeDashoffset = lenLeft;

        lenRight = pathRight.getTotalLength();
        pathRight.style.strokeDasharray = lenRight + " " + lenRight;
        pathRight.style.strokeDashoffset = lenRight;
      }

      // Root paused timeline
      const tl = gsap.timeline({ paused: true });

      // Initial states for seek determinism
      tl.set("#badge-kien", { opacity: 0, scale: 0.92 }, 0);
      tl.set("#badge-tin", { opacity: 0, scale: 0.92 }, 0);
      tl.set("#outcome-card", { opacity: 0, scale: 0.92, y: 30 }, 0);
      if (pathLeft) tl.set("#path-left", { strokeDashoffset: lenLeft }, 0);
      if (pathRight) tl.set("#path-right", { strokeDashoffset: lenRight }, 0);

      // Phase 1: Entrance punch of court header (0.15s)
      tl.fromTo(
        "#doc-header",
        { scale: 0.94, opacity: 0, y: -24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        0.15,
      );

      // Phase 2: Role cards establish
      tl.fromTo(
        "#card-kien",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.35,
      );
      tl.fromTo(
        "#card-tin",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.5,
      );

      // Phase 3: Overlay 1 - KIÊN: CẦM KIẾM TRUY ĐUỔI at 1.08s
      tl.to(
        "#badge-kien",
        {
          opacity: 1,
          scale: 1,
          duration: 0.45,
          ease: "power3.out",
        },
        1.08,
      );
      tl.to(
        "#card-kien",
        {
          borderColor: "#ff6a1a",
          duration: 0.35,
          ease: "power2.out",
        },
        1.08,
      );

      // Phase 4: Overlay 2 - TÍN: ĐÂM CHÍ MẠNG at 4.58s
      tl.to(
        "#badge-tin",
        {
          opacity: 1,
          scale: 1,
          duration: 0.45,
          ease: "power3.out",
        },
        4.58,
      );
      // Subtle pulse reaction on critical strike card
      tl.fromTo(
        "#card-tin",
        { scale: 1 },
        { scale: 1.03, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" },
        4.58,
      );

      // Phase 5: Connectors converging from both roles to legal consequence
      tl.to(
        "#path-left",
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        6.1,
      );
      tl.to(
        "#path-right",
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        6.2,
      );

      // Phase 6: Overlay 3 - Icon fall & Outcome card at 6.88s
      tl.to(
        "#outcome-card",
        {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.6,
          ease: "power3.out",
        },
        6.88,
      );
      tl.fromTo(
        "#icon-fall",
        { scale: 0.5, rotation: -18, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        6.95,
      );

      // Register timeline
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s27"] = tl;
    </script>
  
    </template>
