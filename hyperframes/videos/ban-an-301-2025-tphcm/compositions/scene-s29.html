<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #F5F0E4;
      }

      /* Core clip positioning convention */
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Fixed brand bottom bar */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 1000;
      }

      /* 3D scene flipper */
      #perspective-container {
        position: absolute;
        inset: 0;
        perspective: 1400px;
      }
      #scene-flipper {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transform-origin: 50% 50%;
      }

      /* Background photo container */
      #camera-rig {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #main-asset {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 50% 50%;
      }

      /* Overlay 1: Question Icon badge */
      #icon-clip {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        pointer-events: none;
        z-index: 100;
      }
      #icon-wrapper {
        margin-top: 320px;
        will-change: transform, opacity;
      }
      .icon-badge {
        width: 144px;
        height: 144px;
        background-color: #141414;
        border: 4px solid #FF6A1A;
        border-radius: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      }
      .icon-svg {
        display: block;
      }

      /* Overlay 2: Label "TỔNG HỢP HÌNH PHẠT" */
      #label-clip {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        pointer-events: none;
        z-index: 200;
      }
      #label-card {
        margin-top: 300px;
        background-color: #141414;
        border-radius: 10px;
        padding: 16px 32px 16px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        border: 2px solid rgba(255, 106, 26, 0.4);
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.4);
        will-change: transform, opacity;
      }
      #label-accent {
        width: 6px;
        height: 36px;
        background-color: #FF6A1A;
        border-radius: 3px;
        display: block;
      }
      .label-text {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 34px;
        letter-spacing: 2px;
        color: #F7F4EC;
        white-space: nowrap;
        text-transform: uppercase;
      }

      /* Overlay 3: Punch Phrase "HÌNH PHẠT: CHUNG THÂN" */
      #punch-clip {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        pointer-events: none;
        z-index: 300;
      }
      #punch-card {
        margin-top: 410px;
        background-color: #141414;
        border-radius: 14px;
        padding: 24px 44px;
        border: 4px solid #FF6A1A;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        will-change: transform, opacity;
      }
      .punch-text {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 54px;
        line-height: 1.2;
        letter-spacing: 2px;
        display: flex;
        align-items: center;
        gap: 16px;
        white-space: nowrap;
        text-transform: uppercase;
      }
      .punch-white {
        color: #F7F4EC;
      }
      .punch-orange {
        color: #FF6A1A;
      }

      /* Pre-computed safe WCAG classes */
      .hf-plate-ink {
        background-color: #141414;
        color: #F7F4EC;
      }
      .hf-plate-ink-orange {
        background-color: #141414;
        color: #FF6A1A;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s29"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="10.84"
    >
      <!-- Base Shot 1: Background image with zoom-out camera motion -->
      <section id="scene-clip" class="clip" data-start="0" data-duration="10.84">
        <div id="perspective-container">
          <div id="scene-flipper">
            <div id="camera-rig">
              <img
                id="main-asset"
                src="assets/img-05-life-sentence-penalty-aggregation.jpg"
                alt="Búa thẩm phán gõ xuống công thức pháp lý"
              />
            </div>
          </div>
        </div>
      </section>

      <!-- Overlay 1: Question Icon badge -->
      <section id="icon-clip" class="clip" data-start="2.18" data-duration="2.42">
        <div id="icon-wrapper">
          <div class="icon-badge">
            <svg class="icon-svg" viewBox="0 0 100 100" width="88" height="88" fill="none">
              <path
                id="q-stroke"
                d="M 32 36 C 32 20, 68 20, 68 36 C 68 48, 50 52, 50 64"
                stroke="#F7F4EC"
                stroke-width="8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle id="q-dot" cx="50" cy="80" r="5.5" fill="#FF6A1A" />
            </svg>
          </div>
        </div>
      </section>

      <!-- Overlay 2: Category Label -->
      <section id="label-clip" class="clip" data-start="6.58" data-duration="4.26">
        <div id="label-card">
          <span id="label-accent"></span>
          <span class="label-text">TỔNG HỢP HÌNH PHẠT</span>
        </div>
      </section>

      <!-- Overlay 3: Verdict Punch Phrase -->
      <section id="punch-clip" class="clip" data-start="8.78" data-duration="2.06">
        <div id="punch-card">
          <span class="punch-text">
            <span class="punch-white">HÌNH PHẠT:</span>
            <span class="punch-orange">CHUNG THÂN</span>
          </span>
        </div>
      </section>

      <!-- Visual signature bottom orange bar -->
      <div id="brand-bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Progressive SVG path draw setup
      const qStroke = document.getElementById("q-stroke");
      if (qStroke) {
        const qLen = qStroke.getTotalLength();
        qStroke.style.strokeDasharray = qLen;
        qStroke.style.strokeDashoffset = qLen;
      }

      // Transition In: 3D flip entrance for the scene
      tl.fromTo(
        "#scene-flipper",
        { rotationY: -75, opacity: 0 },
        { rotationY: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
        0
      );

      // Camera motion: slow cinematic zoom-out (1.10x -> 1.02x)
      tl.fromTo(
        "#main-asset",
        { scale: 1.10 },
        { scale: 1.02, duration: 10.84, ease: "sine.out" },
        0
      );

      // Overlay 1: Question Icon entrance, draw, and exit
      tl.fromTo(
        "#icon-wrapper",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        2.18
      );
      tl.to(
        "#q-stroke",
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        2.35
      );
      tl.fromTo(
        "#q-dot",
        { scale: 0, transformOrigin: "50% 50%" },
        { scale: 1, duration: 0.25, ease: "back.out(1.5)" },
        2.65
      );
      tl.to(
        "#icon-wrapper",
        { scale: 0.85, opacity: 0, duration: 0.38, ease: "power2.in" },
        4.20
      );

      // Overlay 2: Label entrance
      tl.fromTo(
        "#label-card",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        6.58
      );
      tl.fromTo(
        "#label-accent",
        { scaleY: 0, transformOrigin: "50% 100%" },
        { scaleY: 1, duration: 0.4, ease: "power2.out" },
        6.70
      );

      // Overlay 3: Punch Phrase entrance
      tl.fromTo(
        "#punch-card",
        { scale: 0.88, y: 16, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "power4.out" },
        8.78
      );

      // Register root paused timeline
      window.__timelines["scene-s29"] = tl;
    </script>
  
    </template>
  </body>
</html>
