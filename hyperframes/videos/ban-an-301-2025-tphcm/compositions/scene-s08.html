<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      /* Contrast-safe utility classes (style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
      .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
      .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
      .hf-plate-paper { background-color: #F5F0E4; color: #141414; }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
        overflow: hidden;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* Visual layers */
      .photo-stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .bg-photo {
        position: absolute;
        width: 1350px;
        height: 2160px;
        top: -120px;
        left: -80px;
        object-fit: cover;
        will-change: transform;
      }

      .flow-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
      }

      /* Overlay Badges */
      .overlay-container {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 240px;
        height: auto;
        pointer-events: none;
        z-index: 10;
      }

      .badge-card {
        background-color: #141414;
        border-radius: 12px;
        border: 2px solid #FF6A1A;
        border-left: 12px solid #FF6A1A;
        padding: 24px 32px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
        will-change: transform, opacity;
      }

      .badge-tag {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 4px;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      .badge-title {
        margin: 0;
        font-size: 48px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: -0.5px;
      }

      /* Check overlay specific layout */
      .check-layout {
        display: flex;
        align-items: center;
        gap: 28px;
      }

      .check-svg-box {
        width: 88px;
        height: 88px;
        flex-shrink: 0;
      }

      .check-content {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      /* Bottom brand signature bar */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 10px;
        background-color: #FF6A1A;
        z-index: 100;
      }

      /* SVG dynamic markers */
      #arrow-head, #break-marks, #escape-beacon {
        transform-box: fill-box;
        transform-origin: center;
      }
    </style>

    <div id="root" data-composition-id="scene-s08" data-width="1080" data-height="1920" data-duration="7.29">
      <!-- Full Scene Background & Flow Diagram -->
      <div id="shot-bg" class="clip" data-start="0" data-duration="7.29" data-track-index="0">
        <div class="photo-stage">
          <img
            id="main-photo"
            class="bg-photo"
            src="assets/img-08-knife-chase-dark-alley.jpg"
            alt="Rượt đuổi trong ngõ hẻm"
            data-layout-allow-overflow="true"
          />

          <!-- Dynamic SVG Pursuit & Escape Flow Diagram -->
          <svg id="flow-layer" class="flow-layer" viewBox="0 0 1080 1920">
            <defs>
              <clipPath id="escape-clip">
                <rect id="escape-clip-rect" x="660" y="800" width="0" height="260" />
              </clipPath>
            </defs>

            <!-- Chase tracking vector from assailant to victim -->
            <path
              id="path-pursuit"
              d="M 230 1180 Q 420 1040 630 960"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="7"
              stroke-linecap="round"
            />
            <polygon id="arrow-head" points="630,948 646,960 628,974" fill="#FF6A1A" />

            <!-- Sharp break marks indicating chase termination -->
            <g id="break-marks">
              <line x1="646" y1="930" x2="660" y2="982" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round" />
              <line x1="660" y1="930" x2="674" y2="982" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round" />
            </g>

            <!-- Broken dashed trajectory leading to the escape opening -->
            <path
              id="path-escape"
              d="M 678 948 Q 780 910 880 840"
              fill="none"
              stroke="#F7F4EC"
              stroke-width="5"
              stroke-linecap="round"
              stroke-dasharray="14 10"
              clip-path="url(#escape-clip)"
            />

            <!-- Safe escape waypoint marker -->
            <g id="escape-beacon">
              <circle cx="880" cy="840" r="22" fill="none" stroke="#FF6A1A" stroke-width="5" />
              <circle cx="880" cy="840" r="10" fill="#FF6A1A" />
            </g>
          </svg>
        </div>
      </div>

      <!-- Overlay 1: Bị Cầm Dao Truy Đuổi (at 0.93s, duration 1.95s -> ends 2.88s) -->
      <div id="overlay-pursuit" class="clip" data-start="0.93" data-duration="1.95" data-track-index="1">
        <div class="overlay-container">
          <div id="card-pursuit" class="badge-card hf-plate-ink">
            <span class="badge-tag hf-hl-orange">DIỄN BIẾN VỤ ÁN</span>
            <h2 class="badge-title hf-text-light">BỊ CẦM DAO TRUY ĐUỔI</h2>
          </div>
        </div>
      </div>

      <!-- Overlay 2: Thoát Nạn An Toàn (at 3.03s, duration 1.85s -> ends 4.88s) -->
      <div id="overlay-escape" class="clip" data-start="3.03" data-duration="1.85" data-track-index="1">
        <div class="overlay-container">
          <div id="card-escape" class="badge-card hf-plate-ink">
            <span class="badge-tag hf-hl-orange">MỐC THỜI ĐIỂM</span>
            <h2 class="badge-title hf-text-light">THOÁT NẠN AN TOÀN</h2>
          </div>
        </div>
      </div>

      <!-- Overlay 3: Check Icon confirmation (at 4.93s, duration 2.36s -> ends 7.29s) -->
      <div id="overlay-check" class="clip" data-start="4.93" data-duration="2.36" data-track-index="1">
        <div class="overlay-container">
          <div id="card-check" class="badge-card check-layout hf-plate-ink">
            <svg class="check-svg-box" viewBox="0 0 100 100">
              <circle
                id="check-ring"
                cx="50"
                cy="50"
                r="40"
                fill="none"
                stroke="#FF6A1A"
                stroke-width="6"
                transform="rotate(-90 50 50)"
              />
              <path
                id="check-path"
                d="M 28 52 L 44 66 L 72 36"
                fill="none"
                stroke="#FF6A1A"
                stroke-width="7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <div id="check-text-group" class="check-content">
              <span class="badge-tag hf-hl-orange">XÁC NHẬN</span>
              <h2 class="badge-title hf-text-light">THOÁT THÂN THÀNH CÔNG</h2>
            </div>
          </div>
        </div>
      </div>

      <!-- Signature brand bottom bar -->
      <div class="bottom-brand-bar"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Synchronous SVG path measurement for seek-safe path drawing
      const pursuitPath = document.getElementById("path-pursuit");
      if (pursuitPath) {
        const pLen = pursuitPath.getTotalLength();
        pursuitPath.style.strokeDasharray = pLen;
        pursuitPath.style.strokeDashoffset = pLen;
      }

      const checkRing = document.getElementById("check-ring");
      if (checkRing) {
        const rLen = checkRing.getTotalLength();
        checkRing.style.strokeDasharray = rLen;
        checkRing.style.strokeDashoffset = rLen;
      }

      const checkPath = document.getElementById("check-path");
      if (checkPath) {
        const cLen = checkPath.getTotalLength();
        checkPath.style.strokeDasharray = cLen;
        checkPath.style.strokeDashoffset = cLen;
      }

      // 1. Scene Entrance & Dynamic Camera Motion (pan-right following Kiên)
      tl.fromTo(
        ".photo-stage",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0
      );

      // Camera pan right: slow tension setup, fast pan on escape, settling drift
      tl.fromTo(
        "#main-photo",
        { x: 0, y: 0, scale: 1.06 },
        { x: -35, y: -10, scale: 1.09, duration: 2.5, ease: "power1.out" },
        0
      );
      tl.to(
        "#main-photo",
        { x: -160, y: -20, scale: 1.18, duration: 2.3, ease: "power2.inOut" },
        2.5
      );
      tl.to(
        "#main-photo",
        { x: -185, y: -25, scale: 1.20, duration: 2.49, ease: "power1.out" },
        4.8
      );

      // 2. Beat 1: Chasing Arrow & Pursuit Badge (starts at 0.93s)
      tl.fromTo(
        "#card-pursuit",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.93
      );
      tl.to(
        "#path-pursuit",
        { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" },
        0.93
      );
      tl.fromTo(
        "#arrow-head",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.25, ease: "power2.out" },
        1.7
      );
      tl.to(
        "#card-pursuit",
        { y: -20, opacity: 0, duration: 0.3, ease: "power2.in" },
        2.55
      );

      // 3. Beat 2: Break marks, Dashed Escape Vector, Escape Badge (starts at 3.03s)
      tl.fromTo(
        "#break-marks",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" },
        2.85
      );
      tl.fromTo(
        "#card-escape",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        3.03
      );
      tl.to(
        "#escape-clip-rect",
        { width: 250, duration: 0.7, ease: "power2.out" },
        3.03
      );
      tl.fromTo(
        "#escape-beacon",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.4)" },
        3.55
      );
      tl.to(
        "#card-escape",
        { y: -20, opacity: 0, duration: 0.3, ease: "power2.in" },
        4.55
      );

      // 4. Beat 3: Check Icon confirmation badge & path drawing (starts at 4.93s)
      tl.to(
        "#flow-layer",
        { opacity: 0.35, duration: 0.5, ease: "power1.out" },
        4.93
      );
      tl.fromTo(
        "#card-check",
        { scale: 0.85, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        4.93
      );
      tl.to(
        "#check-ring",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        5.05
      );
      tl.to(
        "#check-path",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        5.3
      );
      tl.fromTo(
        "#check-text-group",
        { x: -18, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
        5.35
      );

      // Synchronous registration required by HyperFrames
      window.__timelines["scene-s08"] = tl;
    </script>
  
    </template>
  </body>
</html>
