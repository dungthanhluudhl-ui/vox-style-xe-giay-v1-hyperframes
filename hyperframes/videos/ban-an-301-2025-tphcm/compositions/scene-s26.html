<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      /* Safe color classes theo WCAG tokens */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
      .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
      .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
      .hf-plate-paper { background-color: #F5F0E4; color: #141414; }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      /* Chuẩn .clip theo quy ước HyperFrames: position:absolute; inset:0; */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Lớp ảnh nền chính toàn màn hình 1080x1920 */
      .bg-photo-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      #bg-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: center center;
      }

      /* Biến thể nền spotlight & lưới kỹ thuật Vox Style */
      .spotlight-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(20, 20, 20, 0.1) 25%, rgba(20, 20, 20, 0.6) 100%);
        pointer-events: none;
      }

      .vox-grid-overlay {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        pointer-events: none;
      }

      /* Hiệu ứng peel transition in nằm trong layer riêng biệt */
      #peel-sheet {
        position: absolute;
        top: -40px;
        left: -40px;
        width: 1160px;
        height: 2000px;
        background-color: #E7E3D9;
        border-bottom: 8px solid #FF6A1A;
        transform-origin: top right;
      }

      /* OVERLAY 1: Label KHOẢNG CÁCH THỜI GIAN (Y an toàn: 220px) */
      .label-zone {
        position: absolute;
        top: 220px;
        left: 60px;
        right: 60px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .label-badge-box {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 10px 22px 10px 14px;
        background-color: #141414;
        border-left: 6px solid #FF6A1A;
      }

      .label-tag {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 4px 12px;
        background-color: #FF6A1A;
        color: #141414;
      }

      .label-main-text {
        font-size: 38px;
        font-weight: 900;
        letter-spacing: 1.5px;
        color: #F7F4EC;
        text-transform: uppercase;
      }

      .timeline-metric-bar {
        display: flex;
        align-items: center;
        width: 100%;
        max-width: 680px;
        height: 38px;
        background-color: #141414;
        padding: 0 16px;
      }

      .metric-svg {
        width: 100%;
        height: 20px;
      }

      /* OVERLAY 2: Punch phrase THOÁT THÂN VS TRẢ ĐŨA (Y an toàn: 640px) */
      .punch-zone {
        position: absolute;
        top: 640px;
        left: 50px;
        right: 50px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .punch-lead-box {
        padding: 8px 24px;
        background-color: #141414;
        border: 2px solid #FF6A1A;
      }

      .punch-lead-text {
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 3px;
        color: #FF6A1A;
        text-transform: uppercase;
      }

      .split-card-container {
        display: flex;
        align-items: stretch;
        justify-content: center;
        width: 100%;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }

      .split-half {
        flex: 1;
        padding: 42px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .split-left {
        background-color: #F5F0E4;
        color: #141414;
        border-right: 2px solid rgba(20, 20, 20, 0.15);
      }

      .split-right {
        background-color: #141414;
        color: #F7F4EC;
        border-left: 2px solid rgba(255, 106, 26, 0.3);
      }

      .split-title {
        font-size: 58px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.5px;
        text-transform: uppercase;
      }

      .split-sub {
        margin-top: 14px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .split-left .split-sub {
        color: #141414;
      }

      .split-right .split-sub {
        color: #FF6A1A;
      }

      /* Định vị badge VS chính xác bằng inset/calc tránh xung đột GSAP transform */
      .split-divider-badge {
        position: absolute;
        top: calc(50% - 39px);
        left: calc(50% - 39px);
        width: 78px;
        height: 78px;
        background-color: #FF6A1A;
        border: 4px solid #141414;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }

      .split-divider-badge span {
        font-size: 32px;
        font-weight: 900;
        color: #141414;
      }

      /* OVERLAY 3: Icon Warning & Ranh giới pháp lý (Đặt tại top: 1140px, cao 126px, đáy 1266px < 1390px, tuyệt đối an toàn khỏi caption zone) */
      .warning-zone {
        position: absolute;
        top: 1140px;
        left: 60px;
        right: 60px;
        display: flex;
        justify-content: center;
      }

      .warning-plate {
        width: 100%;
        background-color: #141414;
        border: 3px solid #FF6A1A;
        padding: 24px 28px;
        display: flex;
        align-items: center;
        gap: 28px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }

      .warning-icon-box {
        flex-shrink: 0;
        width: 76px;
        height: 76px;
        background-color: #141414;
        border: 2px solid #FF6A1A;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .warning-svg {
        width: 60px;
        height: 60px;
      }

      .warning-text-box {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .warning-headline {
        font-size: 34px;
        font-weight: 900;
        color: #FF6A1A;
        text-transform: uppercase;
        letter-spacing: 1px;
        line-height: 1.2;
      }

      .warning-subline {
        font-size: 24px;
        font-weight: 700;
        color: #F7F4EC;
        letter-spacing: 0.5px;
        line-height: 1.3;
      }

      /* Thanh cam nhận diện thương hiệu cố định mép đáy */
      #brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s26"
      data-width="1080"
      data-height="1920"
      data-duration="11.2"
    >
      <!-- Shot S26-1: Nền ảnh phân tách và hiệu ứng máy quay parallax (z-index: 1) -->
      <section id="shot-visual" class="clip" data-start="0" data-duration="11.2" style="z-index: 1;">
        <div class="bg-photo-wrapper">
          <img
            id="bg-img"
            src="assets/img-20-escape-vs-retaliation-concept.jpg"
            alt="Đồ họa phân chia ranh giới thoát thân và trả đũa"
          />
        </div>
        <div class="vox-grid-overlay"></div>
        <div class="spotlight-overlay"></div>
      </section>

      <!-- Clip peel transition: z-index thấp (5), duration ngắn (0.85s) tự ẩn hoàn toàn sau khi bóc xong -->
      <div id="clip-peel" class="clip" data-start="0" data-duration="0.85" style="z-index: 5; overflow: hidden;">
        <div id="peel-sheet"></div>
      </div>

      <!-- OVERLAY 1: Label KHOẢNG CÁCH THỜI GIAN (z-index: 20) -->
      <div id="clip-label" class="clip" data-start="0.78" data-duration="3.2" style="z-index: 20;">
        <div id="label-wrapper" class="label-zone">
          <div class="label-badge-box">
            <span class="label-tag">RANH GIỚI</span>
            <span class="label-main-text">KHOẢNG CÁCH THỜI GIAN</span>
          </div>
          <div class="timeline-metric-bar">
            <svg class="metric-svg" viewBox="0 0 600 20">
              <line id="metric-rail" x1="10" y1="10" x2="590" y2="10" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round" />
              <line x1="10" y1="2" x2="10" y2="18" stroke="#FF6A1A" stroke-width="4" />
              <line x1="590" y1="2" x2="590" y2="18" stroke="#FF6A1A" stroke-width="4" />
              <circle cx="300" cy="10" r="5" fill="#F7F4EC" />
            </svg>
          </div>
        </div>
      </div>

      <!-- OVERLAY 2: Punch phrase THOÁT THÂN VS TRẢ ĐŨA (z-index: 25) -->
      <div id="clip-punch" class="clip" data-start="4.2" data-duration="3.8" style="z-index: 25;">
        <div id="punch-wrapper" class="punch-zone">
          <div class="punch-lead-box">
            <span class="punch-lead-text">HAI HÀNH VI KHÁC NHAU</span>
          </div>

          <div style="position: relative; width: 100%;">
            <div class="split-card-container">
              <div id="split-left-card" class="split-half split-left">
                <div class="split-title">THOÁT<br />THÂN</div>
                <div class="split-sub">TỰ VỆ CHÍNH ĐÁNG</div>
              </div>
              <div id="split-right-card" class="split-half split-right">
                <div class="split-title">TRẢ<br />ĐŨA</div>
                <div class="split-sub">HÀNH VI PHẠM TỘI</div>
              </div>
            </div>

            <div id="split-vs-badge" class="split-divider-badge">
              <span>VS</span>
            </div>
          </div>
        </div>
      </div>

      <!-- OVERLAY 3: Icon Warning & Đánh giá ranh giới pháp lý (z-index: 30) -->
      <div
        id="clip-warning"
        class="clip"
        data-start="8.4"
        data-duration="2.8"
        data-layout-allow-caption-zone="true"
        style="z-index: 30;"
      >
        <div id="warning-wrapper" class="warning-zone">
          <div class="warning-plate">
            <div class="warning-icon-box">
              <svg class="warning-svg" viewBox="0 0 100 100">
                <polygon
                  id="warn-tri"
                  points="50,14 90,86 10,86"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="7"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                />
                <line
                  id="warn-excl-line"
                  x1="50"
                  y1="40"
                  x2="50"
                  y2="62"
                  stroke="#FF6A1A"
                  stroke-width="7"
                  stroke-linecap="round"
                />
                <circle
                  id="warn-excl-dot"
                  cx="50"
                  cy="75"
                  r="4"
                  fill="#FF6A1A"
                />
              </svg>
            </div>
            <div class="warning-text-box">
              <div class="warning-headline">RANH GIỚI PHÁP LÝ</div>
              <div class="warning-subline">BẢN CHẤT CÁCH NHAU RẤT XA</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Dải thương hiệu cam luôn hiển thị ở mép đáy -->
      <div id="brand-bar"></div>
    </div>

    <script>
      // Đăng ký đúng 1 timeline paused theo contract HyperFrames
      const tl = gsap.timeline({ paused: true });

      // 1. Máy quay parallax cho ảnh nền chính (pan chậm theo lằn ranh đỏ giữa 2 thế giới)
      tl.fromTo(
        "#bg-img",
        { scale: 1.08, y: -35 },
        { scale: 1.15, y: 35, duration: 11.2, ease: "none" },
        0
      );

      // 2. Transition in: peel sheet bóc góc mở ra cảnh trong layer riêng
      tl.fromTo(
        "#peel-sheet",
        { x: 0, y: 0, rotation: 0 },
        { x: 1500, y: -900, rotation: 30, duration: 0.8, ease: "power2.inOut" },
        0
      );

      // 3. Chuẩn bị SVG đường đo và tam giác cảnh báo
      const railEl = document.getElementById("metric-rail");
      if (railEl && railEl.getTotalLength) {
        const railLen = railEl.getTotalLength();
        railEl.style.strokeDasharray = railLen;
        railEl.style.strokeDashoffset = railLen;
      }

      const triEl = document.getElementById("warn-tri");
      if (triEl && triEl.getTotalLength) {
        const triLen = triEl.getTotalLength();
        triEl.style.strokeDasharray = triLen;
        triEl.style.strokeDashoffset = triLen;
      }

      const exclLineEl = document.getElementById("warn-excl-line");
      if (exclLineEl && exclLineEl.getTotalLength) {
        const exclLen = exclLineEl.getTotalLength();
        exclLineEl.style.strokeDasharray = exclLen;
        exclLineEl.style.strokeDashoffset = exclLen;
      }

      // 4. Animation Overlay 1: KHOẢNG CÁCH THỜI GIAN (atMs ~0.78s)
      tl.fromTo(
        "#label-wrapper",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.8
      );
      tl.to(
        "#metric-rail",
        { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" },
        1.0
      );
      tl.to(
        "#label-wrapper",
        { y: -20, opacity: 0, duration: 0.35, ease: "power2.in" },
        3.6
      );

      // 5. Animation Overlay 2: Punch-phrase THOÁT THÂN VS TRẢ ĐŨA (atMs ~4.2s)
      tl.fromTo(
        "#punch-wrapper",
        { scale: 0.9, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        4.25
      );
      tl.fromTo(
        "#split-left-card",
        { x: -40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        4.4
      );
      tl.fromTo(
        "#split-right-card",
        { x: 40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        4.55
      );
      tl.fromTo(
        "#split-vs-badge",
        { scale: 0, rotation: -20, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        4.75
      );
      tl.to(
        "#punch-wrapper",
        { y: 30, opacity: 0, duration: 0.35, ease: "power2.in" },
        7.6
      );

      // 6. Animation Overlay 3: Icon Warning & Ranh giới sống còn (atMs ~8.4s)
      tl.fromTo(
        "#warning-wrapper",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        8.5
      );
      tl.to(
        "#warn-tri",
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        8.7
      );
      tl.to(
        "#warn-excl-line",
        { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
        9.0
      );
      tl.fromTo(
        "#warn-excl-dot",
        { scale: 0, transformOrigin: "50% 50%" },
        { scale: 1, duration: 0.2, ease: "power2.out" },
        9.2
      );

      // Đăng ký timeline vào global registry của HyperFrames
      window.__timelines["scene-s26"] = tl;
    </script>
  
    </template>
  </body>
</html>
