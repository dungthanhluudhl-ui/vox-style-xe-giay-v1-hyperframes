<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #0b0f14;
        font-family: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f14;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      .clip-flex {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      .photo-container {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      #bg-photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      /* Crowd Overlay Card */
      #crowd-card {
        background-color: #141414;
        border: 3px solid #ff6a1a;
        border-radius: 20px;
        padding: 32px 52px 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
        margin-bottom: 220px;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .crowd-badge {
        background-color: #ff6a1a;
        color: #141414;
        font-weight: 900;
        font-size: 24px;
        letter-spacing: 2px;
        padding: 6px 20px;
        border-radius: 6px;
        margin-bottom: 20px;
        text-transform: uppercase;
      }

      .crowd-svg {
        width: 240px;
        height: 160px;
        margin-bottom: 16px;
      }

      .draw-path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .crowd-label {
        color: #f7f4ec;
        font-weight: 900;
        font-size: 32px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        text-align: center;
      }

      /* Punch Phrase Overlay Card */
      #punch-card {
        background-color: #141414;
        border: 3px solid rgba(255, 106, 26, 0.5);
        border-left: 14px solid #ff6a1a;
        border-radius: 16px;
        padding: 44px 56px 48px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.9);
        margin-bottom: 160px;
        max-width: 920px;
        width: calc(100% - 120px);
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .punch-tag {
        color: #ff6a1a;
        font-weight: 900;
        font-size: 26px;
        letter-spacing: 2.5px;
        margin-bottom: 18px;
        text-transform: uppercase;
      }

      .punch-title-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 18px;
      }

      .punch-text-white {
        color: #f7f4ec;
        font-weight: 900;
        font-size: 68px;
        line-height: 1.25;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .punch-chip {
        background-color: #ff6a1a;
        color: #141414;
        font-weight: 900;
        font-size: 68px;
        line-height: 1.25;
        letter-spacing: 1px;
        padding: 4px 22px;
        border-radius: 10px;
        text-transform: uppercase;
        display: inline-block;
        transform-origin: 50% 50%;
      }

      .punch-rule {
        width: 100%;
        height: 4px;
        background-color: #ff6a1a;
        margin-top: 24px;
        transform-origin: left center;
      }

      #bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s11"
      data-width="1080"
      data-height="1920"
      data-duration="6.48"
    >
      <!-- Background Shot S11-1 -->
      <section id="scene-bg" class="clip" data-start="0" data-duration="6.48">
        <div class="photo-container">
          <img
            id="bg-photo"
            src="assets/img-18-youth-gang-weapons-night.jpg"
            alt="Đoàn xe máy chở hung khí"
          />
        </div>
      </section>

      <!-- Overlay 1: Crowd Icon + Label (1.0s to 3.4s) -->
      <section id="overlay-crowd" class="clip clip-flex" data-start="1.0" data-duration="2.4">
        <div id="crowd-card">
          <div class="crowd-badge">TỤ TẬP ĐÔNG NGƯỜI</div>
          <svg class="crowd-svg" viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg">
            <!-- Center Figure -->
            <circle
              id="crowd-head-mid"
              class="draw-path"
              cx="120"
              cy="52"
              r="22"
              stroke="#FF6A1A"
              stroke-width="5"
            />
            <path
              id="crowd-body-mid"
              class="draw-path"
              d="M 72 142 C 72 98, 168 98, 168 142"
              stroke="#FF6A1A"
              stroke-width="5"
            />

            <!-- Left Figure -->
            <circle
              id="crowd-head-left"
              class="draw-path"
              cx="58"
              cy="72"
              r="17"
              stroke="#F7F4EC"
              stroke-width="4.5"
            />
            <path
              id="crowd-body-left"
              class="draw-path"
              d="M 22 148 C 22 114, 94 114, 94 148"
              stroke="#F7F4EC"
              stroke-width="4.5"
            />

            <!-- Right Figure -->
            <circle
              id="crowd-head-right"
              class="draw-path"
              cx="182"
              cy="72"
              r="17"
              stroke="#F7F4EC"
              stroke-width="4.5"
            />
            <path
              id="crowd-body-right"
              class="draw-path"
              d="M 146 148 C 146 114, 218 114, 218 148"
              stroke="#F7F4EC"
              stroke-width="4.5"
            />

            <!-- Flanking Direction Arrows -->
            <path
              id="crowd-arrow-l"
              class="draw-path"
              d="M 12 46 L 36 46 M 26 36 L 36 46 L 26 56"
              stroke="#FF6A1A"
              stroke-width="4"
            />
            <path
              id="crowd-arrow-r"
              class="draw-path"
              d="M 228 46 L 204 46 M 214 36 L 204 46 L 214 56"
              stroke="#FF6A1A"
              stroke-width="4"
            />
          </svg>
          <div class="crowd-label">MANG THEO HUNG KHÍ</div>
        </div>
      </section>

      <!-- Overlay 2: Punch Phrase (4.0s to 6.48s) -->
      <section id="overlay-punch" class="clip clip-flex" data-start="4.0" data-duration="2.48">
        <div id="punch-card">
          <div class="punch-tag">BƯỚC NGOẶT HÀNH VI</div>
          <div class="punch-title-row">
            <span class="punch-text-white">BẢN CHẤT</span>
            <span class="punch-chip">THAY ĐỔI</span>
          </div>
          <div id="punch-rule" class="punch-rule"></div>
        </div>
      </section>

      <!-- Vox Style Fixed Bottom Accent Bar -->
      <div id="bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Setup SVG stroke lengths deterministically
      document.querySelectorAll(".draw-path").forEach((p) => {
        const len = p.getTotalLength ? p.getTotalLength() : 160;
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
      });

      // 2. Camera Motion & Transition In (Spiral settling into forward zoom)
      tl.fromTo(
        "#bg-photo",
        { scale: 1.18, rotation: -2.5 },
        { scale: 1.02, rotation: 0, duration: 1.0, ease: "power2.out" },
        0
      );
      tl.to(
        "#bg-photo",
        { scale: 1.14, duration: 5.48, ease: "none" },
        1.0
      );

      // 3. Crowd Icon Card Entrance & Self-drawing Paths (1.0s to 3.4s)
      tl.fromTo(
        "#crowd-card",
        { scale: 0.82, opacity: 0, y: 32 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.0
      );

      tl.to(
        "#crowd-head-mid",
        { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" },
        1.15
      );
      tl.to(
        "#crowd-body-mid",
        { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
        1.25
      );
      tl.to(
        "#crowd-head-left",
        { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
        1.38
      );
      tl.to(
        "#crowd-head-right",
        { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
        1.45
      );
      tl.to(
        "#crowd-body-left",
        { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" },
        1.48
      );
      tl.to(
        "#crowd-body-right",
        { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" },
        1.55
      );
      tl.to(
        ["#crowd-arrow-l", "#crowd-arrow-r"],
        { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
        1.68
      );

      // Card exit before punch phrase arrival
      tl.to(
        "#crowd-card",
        { scale: 0.94, opacity: 0, y: -24, duration: 0.32, ease: "power2.in" },
        3.05
      );

      // 4. Punch Phrase Entrance & Underline Reveal (4.0s to 6.48s)
      tl.fromTo(
        "#punch-card",
        { scale: 0.88, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.52, ease: "power3.out" },
        4.0
      );
      tl.fromTo(
        "#punch-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.48, ease: "power2.out" },
        4.25
      );
      tl.fromTo(
        ".punch-chip",
        { scale: 0.86, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.38, ease: "power3.out" },
        4.32
      );

      window.__timelines["scene-s11"] = tl;
    </script>
  
    </template>
  </body>
</html>
