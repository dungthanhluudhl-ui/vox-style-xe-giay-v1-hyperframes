  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #F5F0E4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #F5F0E4;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Card Container */
      #card-wrapper {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 220px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }

      #legal-card {
        position: relative;
        width: 100%;
        height: 100%;
        background-color: #E7E3D9;
        border: 4px solid #141414;
        box-shadow: 16px 16px 0px #141414;
        padding: 56px 48px;
        display: flex;
        flex-direction: column;
        transform-origin: 50% 10%;
      }

      /* Card Header */
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 3px solid #141414;
        padding-bottom: 24px;
      }
      .card-index {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #141414;
        text-transform: uppercase;
      }
      .card-status {
        background-color: #141414;
        color: #F7F4EC;
        font-size: 20px;
        font-weight: 900;
        padding: 8px 18px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      /* Punch Phrase */
      .punch-row {
        margin-top: 48px;
      }
      .punch-plate {
        display: inline-block;
        background-color: #FF6A1A;
        border: 4px solid #141414;
        box-shadow: 8px 8px 0px #141414;
        padding: 16px 32px;
      }
      .punch-title {
        margin: 0;
        font-size: 72px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -1px;
        color: #141414;
        text-transform: uppercase;
      }

      /* Legal Excerpt Text */
      .legal-body {
        margin-top: 44px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .legal-line-primary {
        font-size: 40px;
        font-weight: 900;
        line-height: 1.35;
        color: #141414;
        text-transform: uppercase;
      }
      .legal-line-secondary {
        font-size: 32px;
        font-weight: 700;
        line-height: 1.45;
        color: #141414;
      }

      /* Stamp */
      #stamp {
        position: absolute;
        right: 48px;
        bottom: 180px;
        background-color: #FF6A1A;
        border: 6px solid #141414;
        box-shadow: 0 0 0 4px #FF6A1A, 0 0 0 9px #141414;
        padding: 20px 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transform-origin: 50% 50%;
        z-index: 10;
      }
      .stamp-text {
        font-size: 52px;
        font-weight: 900;
        color: #141414;
        letter-spacing: 4px;
        text-transform: uppercase;
        line-height: 1;
      }
      .stamp-subtext {
        font-size: 20px;
        font-weight: 900;
        color: #141414;
        letter-spacing: 2px;
        text-transform: uppercase;
        line-height: 1;
      }

      /* Document Icon & Label Box */
      #doc-box {
        position: absolute;
        left: 48px;
        bottom: 48px;
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 16px 24px;
        background-color: #F5F0E4;
        border: 3px solid #141414;
      }
      .doc-label {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 1.5px;
        color: #141414;
        text-transform: uppercase;
      }

      /* Narrative Transition Prompt */
      #narrative-prompt {
        position: absolute;
        right: 48px;
        bottom: 48px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 1.5px;
        color: #141414;
        text-transform: uppercase;
      }

      /* Brand bar */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s07"
      data-width="1080"
      data-height="1920"
      data-duration="5.71"
    >
      <section id="shot-s07-1" class="clip" data-start="0" data-duration="5.71">
        <div id="card-wrapper">
          <div id="legal-card">
            <!-- Header -->
            <div class="card-header">
              <span class="card-index">TRÍCH LỤC THỦ TỤC</span>
              <span class="card-status">QUY ƯỚC</span>
            </div>

            <!-- Punch phrase -->
            <div class="punch-row">
              <div id="punch-plate" class="punch-plate">
                <h1 id="punch-text" class="punch-title">TÊN QUY ƯỚC</h1>
              </div>
            </div>

            <!-- Explanatory text -->
            <div class="legal-body">
              <div id="legal-line-1" class="legal-line-primary">
                ĐÂY CHỈ LÀ TÊN GIẢ ĐỊNH TÔI ĐẶT TRONG VIDEO
              </div>
              <div id="legal-line-2" class="legal-line-secondary">
                Không phải tên đầy đủ được công bố trong bản án.
              </div>
            </div>

            <!-- Stamp -->
            <div id="stamp">
              <span class="stamp-text">TÊN GIẢ ĐỊNH</span>
              <span class="stamp-subtext">[ ĐÃ ĐỔI TÊN ]</span>
            </div>

            <!-- SVG Doc Icon -->
            <div id="doc-box">
              <svg id="doc-svg" viewBox="0 0 100 120" width="60" height="72" fill="none" stroke="#141414" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                <path id="doc-outline" d="M 15 10 L 65 10 L 85 30 L 85 110 L 15 110 Z" />
                <path id="doc-fold" d="M 65 10 L 65 30 L 85 30" />
                <path class="doc-line" d="M 28 50 L 72 50" />
                <path class="doc-line" d="M 28 72 L 72 72" />
                <path class="doc-line" d="M 28 94 L 55 94" />
              </svg>
              <span class="doc-label">HỒ SƠ BẢN ÁN</span>
            </div>

            <!-- Narrative prompt -->
            <div id="narrative-prompt">
              <span>QUAY LẠI CÂU CHUYỆN</span>
              <span style="font-size: 28px;">&rarr;</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Fixed brand signature bar -->
      <div id="brand-bottom-bar"></div>
    </div>

    <script>
      // Setup SVG paths for progressive draw
      const docPaths = document.querySelectorAll("#doc-svg path");
      docPaths.forEach(function (path) {
        const len = path.getTotalLength();
        path.style.strokeDasharray = len + "px";
        path.style.strokeDashoffset = len + "px";
      });

      // Single paused timeline registered on window.__timelines["scene-s07"]
      const tl = gsap.timeline({ paused: true });

      // 1. Wobble-drop entrance for legal card (t = 0.05s)
      tl.fromTo(
        "#legal-card",
        { y: -100, opacity: 0, rotation: -2 },
        { y: 0, opacity: 1, rotation: 0, duration: 0.5, ease: "power3.out" },
        0.05
      );

      // 2. Punch phrase "TÊN QUY ƯỚC" entrance at 59000ms (0.44s)
      tl.fromTo(
        "#punch-plate",
        { scale: 0.85, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.44
      );

      // 3. Staggered reveal of legal explanation text
      tl.fromTo(
        "#legal-line-1",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        0.75
      );
      tl.fromTo(
        "#legal-line-2",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        0.95
      );

      // 4. Red-orange stamp slam-down ("TÊN GIẢ ĐỊNH")
      tl.fromTo(
        "#stamp",
        { scale: 2.2, opacity: 0, rotation: 14 },
        { scale: 1, opacity: 1, rotation: -8, duration: 0.28, ease: "power4.in" },
        1.25
      );

      // 5. Doc icon entrance at 61800ms (3.24s) + progressive SVG path drawing
      tl.fromTo(
        "#doc-box",
        { opacity: 0, scale: 0.85 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" },
        3.24
      );
      tl.to(
        "#doc-outline",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        3.35
      );
      tl.to(
        "#doc-fold",
        { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" },
        3.6
      );
      gsap.utils.toArray(".doc-line").forEach(function (line, index) {
        tl.to(
          line,
          { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
          3.75 + index * 0.1
        );
      });

      // 6. Narrative transition prompt reveals
      tl.fromTo(
        "#narrative-prompt",
        { opacity: 0, x: -16 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" },
        4.15
      );

      window.__timelines["scene-s07"] = tl;
    </script>
  
    </template>
  </body>
</html>
