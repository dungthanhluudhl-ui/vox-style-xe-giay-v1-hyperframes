        { backgroundColor: "#ff6a1a" },
        { backgroundColor: "#141414", duration: 0.3, ease: "power1.out" },

      // Chữ bên trong khối 1 năm fade out trước để tránh mọi va chạm che khuất
      tl.to(

        { opacity: 0, duration: 0.25, ease: "power2.in" },

      // Khối hình học 1 năm co nhỏ và bay sang sáp nhập vào cột Chung Thân

          x: -260,

          opacity: 0,

          ease: "power2.in"
