      <style>

      /* Style DNA safe colors */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }

      * {

      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }

      /* Clip convention according to HyperFrames spec */
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Background Photo Styling - Full canvas coverage, natural colors without tint */
      .bg-container {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background-color: #141414;
      }
      #bg-image {
        position: absolute;
        top: -5%;
        left: -12%;
        width: 124%;
        height: 110%;
        object-fit: cover;
        display: block;
        will-change: transform;
      }

      /* Fixed bottom orange branding bar */
      #bottom-accent-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 99;
      }

      /* Overlay Layers */
      .overlay-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Overlay 1: Tag Badge */
      .badge-container {
        position: absolute;
        top: 240px;
        left: 60px;
        display: inline-flex;
        align-items: center;
        background-color: #141414;
        border-left: 8px solid #ff6a1a;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65);
        padding: 18px 32px 18px 24px;
        border-radius: 6px;

      .badge-label {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 34px;
        line-height: 1.2;
        letter-spacing: 2px;
        color: #f7f4ec;
        text-transform: uppercase;
      }

      /* Overlay 2: Fall Icon Card */
      .icon-card {
        position: absolute;
        top: 360px;
        left: 60px;
        width: 170px;

        background-color: #141414;
        border: 2px solid rgba(255, 106, 26, 0.45);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7);
      }
      .icon-svg {
        width: 120px;
        height: 120px;
      }
      .icon-svg path,
      .icon-svg circle {
        fill: none;
      }

      /* Overlay 3: Punch Phrase Card */
      .punch-card {
        position: absolute;
        top: 1080px;
        left: 60px;
        right: 60px;

        border-left: 10px solid #ff6a1a;

        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .punch-text {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 60px;
        line-height: 1.34;
        letter-spacing: 1px;
        color: #f7f4ec;
        text-transform: uppercase;
      }
      .punch-arrow-icon {
        width: 56px;
        height: 56px;
        flex-shrink: 0;
        margin-left: 20px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s02"
      data-width="1080"
      data-height="1920"
      data-duration="6.54"
    >
      <!-- Base Background Photo Clip with Pan-Right Camera Motion -->
      <section id="scene-bg-clip" class="clip" data-start="0" data-duration="6.54">
        <div id="bg-container" class="bg-container">
          <img
            id="bg-image"
            src="assets/img-08-knife-chase-dark-alley.jpg"
            alt="Cảnh rượt đuổi trong hẻm tối"
            data-layout-allow-overflow="true"
          />
        </div>
      </section>

      <!-- Overlay 1: VỤ ÁN ĐIỂN HÌNH (0.26s -> 2.06s) -->
      <section id="overlay-1-clip" class="clip overlay-layer" data-start="0.26" data-duration="1.8">
        <div id="badge-case" class="hf-plate-ink badge-container">
          <span class="badge-label hf-text-light">VỤ ÁN ĐIỂN HÌNH</span>
        </div>
      </section>

      <!-- Overlay 2: Icon Vocabulary "fall" (2.66s -> 4.46s) -->
      <section id="overlay-2-clip" class="clip overlay-layer" data-start="2.66" data-duration="1.8">
        <div id="fall-icon-card" class="hf-plate-ink icon-card">
          <svg id="fall-icon-svg" class="icon-svg" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
            <!-- Falling/stumbling human silhouette in stroke draw -->
            <circle cx="70" cy="34" r="12" stroke="#F7F4EC" stroke-width="5" />
            <path d="M 68 46 L 52 82" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" />
            <path d="M 52 82 L 26 104" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" />
            <path d="M 52 82 L 66 114" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" />
            <path d="M 62 60 L 36 52" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" />
            <path d="M 62 60 L 88 74" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" />
            <!-- Kinetic plunge & impact curve in brand orange -->
            <path d="M 96 35 Q 112 68 86 104" stroke="#FF6A1A" stroke-width="5" stroke-linecap="round" />
            <path d="M 76 106 L 86 104 L 84 94" stroke="#FF6A1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 18 118 L 32 118" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round" />
            <path d="M 12 126 L 24 126" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round" />
          </svg>
        </div>
      </section>

      <!-- Overlay 3: Punch Phrase BỎ CHẠY THOÁT THÂN (4.66s -> 6.46s) -->
      <section id="overlay-3-clip" class="clip overlay-layer" data-start="4.66" data-duration="1.8">
        <div id="punch-card" class="hf-plate-ink punch-card">
          <div class="punch-text hf-text-light">BỎ CHẠY THOÁT THÂN</div>
          <svg class="punch-arrow-icon" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path id="escape-arrow" d="M 12 28 H 44 M 32 16 L 44 28 L 32 40" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
      </section>

      <!-- Fixed bottom orange brand indicator -->
      <div id="bottom-accent-bar"></div>
    </div>

    <script>
      // Setup self-drawing SVG paths for the "fall" icon
      const iconPaths = document.querySelectorAll("#fall-icon-svg path, #fall-icon-svg circle");
      iconPaths.forEach((p) => {
        try {
          const len = p.getTotalLength ? p.getTotalLength() : 110;
          p.style.strokeDasharray = `${len}`;
          p.style.strokeDashoffset = `${len}`;
        } catch (err) {
          p.style.strokeDasharray = "120";
          p.style.strokeDashoffset = "120";
        }
      });

      // Master seekable GSAP timeline registered to HyperFrames runtime
      const tl = gsap.timeline({ paused: true });

      // 1. Scene Rise Entrance & Continuous Pan-Right Camera Motion (0s -> 6.54s)
      tl.fromTo(
        "#bg-container",
        { y: 70, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
        0
      );

      tl.fromTo(
        "#bg-image",
        { x: 40, scale: 1.06 },
        { x: -50, scale: 1.14, duration: 6.54, ease: "none" },
        0
      );

      // 2. Overlay 1: VỤ ÁN ĐIỂN HÌNH (start: 0.26s, hold: 1.8s, out at 1.86s)
      tl.fromTo(
        "#badge-case",
        { x: -40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.26
      );

      tl.to(
        "#badge-case",
        { x: -20, opacity: 0, duration: 0.2, ease: "power2.in" },
        1.86
      );

      // 3. Overlay 2: "fall" Icon Card (start: 2.66s, hold: 1.8s, out at 4.26s)
      tl.fromTo(
        "#fall-icon-card",
        { scale: 0.8, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        2.66
      );

      tl.to(
        "#fall-icon-svg path, #fall-icon-svg circle",
        { strokeDashoffset: 0, duration: 0.65, stagger: 0.06, ease: "power2.out" },
        2.8
      );

      tl.to(
        "#fall-icon-card",
        { scale: 0.85, opacity: 0, duration: 0.2, ease: "power2.in" },
        4.26
      );

      // 4. Overlay 3: Punch Phrase "BỎ CHẠY THOÁT THÂN" (start: 4.66s, hold: 1.8s, out at 6.26s)
      tl.fromTo(
        "#punch-card",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        4.66
      );

      tl.fromTo(
        "#escape-arrow",
        { x: -16, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
        4.95
      );

      tl.to(
        "#punch-card",
        { y: 20, opacity: 0, duration: 0.2, ease: "power2.in" },
        6.26
      );

      // Register timeline on HyperFrames global registry
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s02"] = tl;
    </script>
  
    </template>
