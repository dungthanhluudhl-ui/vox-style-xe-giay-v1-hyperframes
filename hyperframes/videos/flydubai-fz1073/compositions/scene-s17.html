      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }

    /* Standard .clip contract */
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Safe color tokens */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
    .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
    .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
    .hf-plate-paper { background-color: #E7E3D9; color: #141414; }

    /* Bottom brand signature bar */
    #bottom-accent-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 14px;
      background-color: #FF6A1A;
      z-index: 100;
      pointer-events: none;
    }

    /* Photo Containers (within safe zone Y: 160-1390) */
    .photo-frame {
      position: absolute;
      top: 220px;
      left: 60px;
      width: 960px;
      height: 800px;
      border: 4px solid #141414;
      border-radius: 8px;
      overflow: hidden;
      background-color: #141414;
      box-shadow: 10px 14px 0 rgba(20, 20, 20, 0.28);
    }

    .photo-inner-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #shot-1-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 130%;
      height: 100%;
      max-width: none;
      object-fit: cover;
      display: block;
    }

    #shot-2-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform-origin: 50% 50%;
    }

    /* Corner registration marks on photo frame */
    .frame-corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: #FF6A1A;
      border-style: solid;
      pointer-events: none;
      z-index: 5;
    }
    .frame-corner-tl {
      top: 14px;
      left: 14px;
      border-width: 4px 0 0 4px;
    }
    .frame-corner-br {
      bottom: 14px;
      right: 14px;
      border-width: 0 4px 4px 0;
    }

    /* Overlay Cards */
    .overlay-card-wrapper {
      position: absolute;
      top: 1060px;
      left: 60px;
      width: 960px;
      height: auto;
    }

    .overlay-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 32px;
      padding: 28px 36px;
      background-color: #141414;
      border-radius: 8px;
      border: 2px solid rgba(255, 106, 26, 0.4);
      box-shadow: 8px 12px 0 rgba(20, 20, 20, 0.32);
    }

    .card-accent-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 10px;
      background-color: #FF6A1A;
      border-radius: 8px 0 0 8px;
    }

    .icon-box {
      flex-shrink: 0;
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(255, 106, 26, 0.12);
      border-radius: 6px;
      border: 1.5px solid rgba(255, 106, 26, 0.35);
    }

    .vox-icon {
      width: 68px;
      height: 68px;
      display: block;
    }

    .scale-stroke {
      fill: none;
      stroke: #FF6A1A;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #pin-outline {
      fill: none;
      stroke: #FF6A1A;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #pin-dot {
      fill: #FF6A1A;
      stroke: none;
      transform-origin: 50% 36px;
    }

    .text-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .overlay-headline {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: 0.5px;
      color: #F7F4EC;
      text-transform: uppercase;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s17"
    data-width="1080"
    data-height="1920"
    data-duration="10.91"
  >
    <!-- Permanent bottom brand signature bar -->
    <div id="bottom-accent-bar"></div>

    <!-- SHOT 1: Police escort & aftermath (img-16) -->
    <section id="shot-1" class="clip" data-start="0" data-duration="6.49">
      <div id="shot-1-frame" class="photo-frame">
        <div class="frame-corner frame-corner-tl"></div>
        <div class="frame-corner frame-corner-br"></div>
        <div class="photo-inner-wrapper">
          <img
            id="shot-1-img"
            src="assets/img-16-police-escort-injured-victim.jpg"
            alt="Police escort after incident"
          >
        </div>
      </div>
    </section>

    <!-- SHOT 1 OVERLAY: "QUÁN TÍNH CỰC ĐẠI" + scale icon -->
    <div id="shot-1-overlay-clip" class="clip" data-start="1.49" data-duration="4.80">
      <div id="shot-1-card-wrapper" class="overlay-card-wrapper">
        <div id="s1-card" class="overlay-card hf-plate-ink">
          <div class="card-accent-bar"></div>
          <div class="icon-box">
            <svg id="scale-icon" viewBox="0 0 100 100" class="vox-icon">
              <path class="scale-stroke scale-path" d="M 50 16 L 50 82" />
              <path class="scale-stroke scale-path" d="M 28 82 L 72 82" />
              <path class="scale-stroke scale-path" d="M 18 34 L 82 26" />
              <path class="scale-stroke scale-path" d="M 18 34 L 8 56 Q 18 66 28 56 Z" />
              <path class="scale-stroke scale-path" d="M 82 26 L 72 48 Q 82 58 92 48 Z" />
            </svg>
          </div>
          <div class="text-box">
            <h2 class="overlay-headline hf-text-light">QUÁN TÍNH CỰC ĐẠI</h2>
          </div>
        </div>
      </div>
    </div>

    <!-- SHOT 2: FedEx plane on runway (img-17) -->
    <section id="shot-2" class="clip" data-start="6.49" data-duration="4.42">
      <div id="shot-2-frame" class="photo-frame">
        <div class="frame-corner frame-corner-tl"></div>
        <div class="frame-corner frame-corner-br"></div>
        <div class="photo-inner-wrapper">
          <img
            id="shot-2-img"
            src="assets/img-17-fedex-cargo-plane-runway.jpg"
            alt="FedEx DC-10 cargo plane on runway"
          >
        </div>
      </div>
    </section>

    <!-- SHOT 2 OVERLAY: "ĐÁP XUỐNG MEMPHIS" + pin icon -->
    <div id="shot-2-overlay-clip" class="clip" data-start="8.49" data-duration="2.42">
      <div id="shot-2-card-wrapper" class="overlay-card-wrapper">
        <div id="s2-card" class="overlay-card hf-plate-ink">
          <div class="card-accent-bar"></div>
          <div class="icon-box">
            <svg id="pin-icon" viewBox="0 0 100 100" class="vox-icon">
              <path id="pin-outline" d="M 50 86 C 50 86 20 52 20 36 A 30 30 0 1 1 80 36 C 80 52 50 86 50 86 Z" />
              <circle id="pin-dot" cx="50" cy="36" r="9" />
            </svg>
          </div>
          <div class="text-box">
            <h2 class="overlay-headline hf-text-light">ĐÁP XUỐNG MEMPHIS</h2>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Prepare SVG path drawing lengths
    const scalePaths = document.querySelectorAll(".scale-path");
    scalePaths.forEach((path) => {
      const length = path.getTotalLength();
      path.style.strokeDasharray = length + "px";
      path.style.strokeDashoffset = length + "px";
    });

    const pinOutline = document.getElementById("pin-outline");
    if (pinOutline) {
      const length = pinOutline.getTotalLength();
      pinOutline.style.strokeDasharray = length + "px";
      pinOutline.style.strokeDashoffset = length + "px";
    }

    // Build deterministic master timeline
    const tl = gsap.timeline({ paused: true });

    // === SHOT 1 MOTION (0s - 6.49s) ===
    // Entrance: grow into view
    tl.fromTo(
      "#shot-1-frame",
      { scale: 0.92, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
      0
    );

    // Camera pan-right across image
    tl.fromTo(
      "#shot-1-img",
      { x: 50 },
      { x: -70, duration: 6.49, ease: "none" },
      0
    );

    // Shot 1 Overlay Entrance at 1.49s
    tl.fromTo(
      "#s1-card",
      { scale: 0.86, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      1.49
    );

    // Self-drawing scale icon paths
    tl.to(
      scalePaths,
      {
        strokeDashoffset: 0,
        duration: 0.55,
        stagger: 0.08,
        ease: "power2.out"
      },
      1.62
    );

    // Shot 1 Overlay Fade-out near cut
    tl.to(
      "#s1-card",
      { opacity: 0, y: -10, duration: 0.35, ease: "power2.in" },
      5.90
    );

    // === SHOT 2 MOTION (6.49s - 10.91s) ===
    // TransitionIn: cut at 6.49s (no entrance tween, visible immediately)
    // Camera motion: zoom-out creating safe landing feeling
    tl.fromTo(
      "#shot-2-img",
      { scale: 1.25 },
      { scale: 1.03, duration: 4.42, ease: "sine.out" },
      6.49
    );

    // Shot 2 Overlay Entrance at 8.49s (holdMs: 2200, hold to end of scene)
    tl.fromTo(
      "#s2-card",
      { scale: 0.86, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      8.49
    );

    // Self-drawing pin outline path
    tl.to(
      "#pin-outline",
      { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
      8.65
    );

    // Pop-in pin center dot
    tl.fromTo(
      "#pin-dot",
      { scale: 0 },
      { scale: 1, duration: 0.3, ease: "power3.out" },
      9.10
    );

    // Register paused timeline with HyperFrames runtime
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s17"] = tl;
  </script>

    </template>
  </body>
