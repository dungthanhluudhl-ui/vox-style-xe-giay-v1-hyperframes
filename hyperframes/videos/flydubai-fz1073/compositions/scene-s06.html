<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }

      /* Quy ước HyperFrames: clip full-frame qua inset: 0 */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Lưới nền ô vuông 84px đặc trưng Vox */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-size: 84px 84px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        z-index: 1;
      }

      /* Vùng camera & ảnh minh họa chính */
      .camera-viewport {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 2;
      }
      .camera-rig {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform-origin: 50% 45%;
      }
      .hero-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 30%;
        display: block;
      }

      /* Lớp phủ họa tiết kỹ thuật / HUD tối giản phong cách Vox */
      .hud-frame {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }
      .hud-corner {
        position: absolute;
        width: 36px;
        height: 36px;
        border: 4px solid #141414;
      }
      .hud-tl { top: 60px; left: 40px; border-right: none; border-bottom: none; }
      .hud-tr { top: 60px; right: 40px; border-left: none; border-bottom: none; }
      .hud-bl { bottom: 60px; left: 40px; border-right: none; border-top: none; }
      .hud-br { bottom: 60px; right: 40px; border-left: none; border-top: none; }

      /* Flow Diagram: Vách ngăn buồng lái và các mũi tên luồng lực */
      .flow-layer {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
      }
      .bulkhead-container {
        position: absolute;
        top: 520px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
      }
      .bulkhead-card {
        background-color: #141414;
        border: 3px solid #ff6a1a;
        border-radius: 8px;
        padding: 16px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      }
      .bulkhead-tag {
        background-color: #ff6a1a;
        color: #141414;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 2px;
        padding: 4px 14px;
        border-radius: 4px;
        text-transform: uppercase;
      }
      .bulkhead-title {
        color: #f7f4ec;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 1px;
        margin: 0;
        text-transform: uppercase;
      }
      .hazard-stripe {
        width: 100%;
        height: 10px;
        background: repeating-linear-gradient(
          -45deg,
          #ff6a1a,
          #ff6a1a 12px,
          #141414 12px,
          #141414 24px
        );
        border-radius: 2px;
      }

      /* SVG Flow Arrows */
      .flow-svg {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      .flow-arrow-path {
        fill: none;
        stroke: #ff6a1a;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .flow-head {
        fill: #ff6a1a;
      }

      /* Label 1: ÁP SÁT BUỒNG LÁI (Y: 220px, nằm trong safe zone [160, 1390]) */
      .label-container {
        position: absolute;
        top: 220px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        z-index: 10;
      }
      .label-card {
        background-color: #141414;
        border-left: 10px solid #ff6a1a;
        padding: 16px 32px;
        border-radius: 6px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      .label-badge {
        background-color: #ff6a1a;
        color: #141414;
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 1.5px;
        padding: 3px 10px;
        border-radius: 3px;
        text-transform: uppercase;
      }
      .label-text {
        color: #f7f4ec;
        font-size: 40px;
        font-weight: 900;
        letter-spacing: 1px;
        margin: 0;
        text-transform: uppercase;
      }

      /* Punch Phrase: LÀM SAO CAN THIỆP? (Y: 960px, cách đáy 720px > safe 530px) */
      .punch-container {
        position: absolute;
        top: 960px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        z-index: 20;
      }
      .punch-card {
        background-color: #141414;
        border: 4px solid #ff6a1a;
        border-radius: 16px;
        padding: 32px 40px;
        width: 920px;
        display: flex;
        align-items: center;
        gap: 28px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
      }
      .punch-icon-wrap {
        flex-shrink: 0;
        width: 90px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .punch-content {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .punch-badge {
        align-self: flex-start;
        background-color: #ff6a1a;
        color: #141414;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 2px;
        padding: 4px 14px;
        border-radius: 4px;
        text-transform: uppercase;
      }
      .punch-heading {
        color: #f7f4ec;
        font-size: 60px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: 0.5px;
        margin: 0;
        text-transform: uppercase;
      }

      /* Thanh cam thương hiệu cố định mép dưới cùng */
      .bottom-orange-bar {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s06"
      data-width="1080"
      data-height="1920"
      data-duration="7.5"
    >
      <!-- Nền lưới ô vuông đặc trưng Vox -->
      <div class="bg-grid"></div>

      <!-- Shot S06-1: Camera rig và ảnh nền minh họa -->
      <section id="clip-media" class="clip" data-start="0" data-duration="7.5">
        <div class="camera-viewport">
          <div id="camera-rig" class="camera-rig">
            <img
              id="hero-img"
              class="hero-image"
              src="assets/img-07-airplane-cockpit-breach-illustration.jpg"
              alt="Hành khách áp sát buồng lái"
            />
          </div>
        </div>

        <!-- Khung ngắm tài liệu Vox HUD -->
        <div class="hud-frame">
          <div class="hud-corner hud-tl"></div>
          <div class="hud-corner hud-tr"></div>
          <div class="hud-corner hud-bl"></div>
          <div class="hud-corner hud-br"></div>
        </div>

        <!-- Visual Language: Flow Graphic - luồng lực dồn dập bị chặn trước vách buồng lái -->
        <div class="flow-layer">
          <div class="bulkhead-container">
            <div id="bulkhead-card" class="bulkhead-card">
              <div class="bulkhead-tag">RÀO CHẮN THÉP</div>
              <h2 class="bulkhead-title">VÁCH NGĂN BUỒNG LÁI // KHÓA TỰ ĐỘNG</h2>
              <div class="hazard-stripe"></div>
            </div>
          </div>

          <svg class="flow-svg" viewBox="0 0 1080 1920">
            <!-- Luồng mũi tên 1: bên trái hướng vào vách ngăn -->
            <path
              id="flow-path-1"
              class="flow-arrow-path"
              d="M 260 840 L 380 660"
            />
            <polygon id="flow-head-1" class="flow-head" points="380,640 365,675 395,665" />

            <!-- Luồng mũi tên 2: trung tâm lao thẳng lên vách ngăn -->
            <path
              id="flow-path-2"
              class="flow-arrow-path"
              d="M 540 880 L 540 660"
            />
            <polygon id="flow-head-2" class="flow-head" points="540,640 525,675 555,675" />

            <!-- Luồng mũi tên 3: bên phải hướng vào vách ngăn -->
            <path
              id="flow-path-3"
              class="flow-arrow-path"
              d="M 820 840 L 700 660"
            />
            <polygon id="flow-head-3" class="flow-head" points="700,640 685,665 715,675" />
          </svg>
        </div>
      </section>

      <!-- Overlay 1: ÁP SÁT BUỒNG LÁI (start = 1.5s, duration = 2.2s, kết thúc ở 3.7s) -->
      <section id="clip-label" class="clip" data-start="1.5" data-duration="2.2">
        <div class="label-container">
          <div id="label-card" class="label-card">
            <div class="label-badge">TÌNH HÌNH KHOANG TRƯỚC</div>
            <h1 class="label-text">ÁP SÁT BUỒNG LÁI</h1>
          </div>
        </div>
      </section>

      <!-- Overlay 2: LÀM SAO CAN THIỆP? + Icon question (start = 5.1s, duration = 2.4s) -->
      <section id="clip-punch" class="clip" data-start="5.1" data-duration="2.4">
        <div class="punch-container">
          <div id="punch-card" class="punch-card">
            <div class="punch-icon-wrap">
              <!-- Icon question tự vẽ nét theo chuẩn Vox style -->
              <svg viewBox="0 0 100 140" width="80" height="112">
                <path
                  id="q-curve"
                  d="M 25 40 C 25 12, 75 12, 75 40 C 75 60, 50 68, 50 92"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="12"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <circle id="q-dot" cx="50" cy="118" r="8" fill="#FF6A1A" />
              </svg>
            </div>
            <div class="punch-content">
              <div class="punch-badge">CÂU HỎI BẾ TẮC</div>
              <h2 class="punch-heading">LÀM SAO CAN THIỆP?</h2>
            </div>
          </div>
        </div>
      </section>

      <!-- Thanh cam đáy cố định -->
      <div class="bottom-orange-bar"></div>
    </div>

    <script>
      // Khởi tạo và đăng ký GSAP Timeline duy nhất cho composition
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Thiết lập SVG path stroke cho các đường vẽ
      const pathsToPrepare = [
        document.getElementById("flow-path-1"),
        document.getElementById("flow-path-2"),
        document.getElementById("flow-path-3"),
        document.getElementById("q-curve"),
      ];

      pathsToPrepare.forEach((p) => {
        if (p) {
          const len = p.getTotalLength();
          p.style.strokeDasharray = len + "";
          p.style.strokeDashoffset = len + "";
        }
      });

      // 1. Chuyển động Camera: Transition In "zoom-through" từ 0s -> 0.8s
      // Cú đâm xuyên camera đưa người xem thẳng vào thế bế tắc trước cửa thép
      tl.fromTo(
        "#camera-rig",
        { scale: 1.45, opacity: 0.3 },
        { scale: 1.0, opacity: 1, duration: 0.8, ease: "power3.out" },
        0
      );

      // Zoom-in chậm tăng dần áp lực từ 0.8s tới hết scene (7.5s)
      tl.to(
        "#camera-rig",
        { scale: 1.15, duration: 6.7, ease: "none" },
        0.8
      );

      // 2. Visual Language: Flow diagram xuất hiện ở 0.6s
      tl.fromTo(
        "#bulkhead-card",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.6
      );

      // Các mũi tên luồng lực tự vẽ dần
      tl.to("#flow-path-1", { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 0.8);
      tl.to("#flow-path-2", { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 0.9);
      tl.to("#flow-path-3", { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 1.0);

      tl.fromTo(
        ["#flow-head-1", "#flow-head-2", "#flow-head-3"],
        { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, duration: 0.3, stagger: 0.1, ease: "power3.out" },
        1.1
      );

      // 3. Overlay 1: "ÁP SÁT BUỒNG LÁI" (từ 1.5s -> 3.7s)
      tl.fromTo(
        "#label-card",
        { y: 30, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        1.5
      );

      // Thoát êm trước khi hết clip ở 3.7s
      tl.to(
        "#label-card",
        { y: -20, opacity: 0, duration: 0.35, ease: "power2.in" },
        3.25
      );

      // 4. Overlay 2: "LÀM SAO CAN THIỆP?" + Icon question (từ 5.1s -> 7.5s)
      tl.fromTo(
        "#punch-card",
        { y: 40, scale: 0.92, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        5.1
      );

      // Tự vẽ dấu hỏi Vox style
      const qCurveEl = document.getElementById("q-curve");
      if (qCurveEl) {
        tl.to(
          "#q-curve",
          { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
          5.2
        );
      }
      tl.fromTo(
        "#q-dot",
        { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" },
        5.65
      );

      // Đăng ký timeline vào hệ thống HyperFrames
      window.__timelines["scene-s06"] = tl;
    </script>
  
    </template>
  </body>
</html>
