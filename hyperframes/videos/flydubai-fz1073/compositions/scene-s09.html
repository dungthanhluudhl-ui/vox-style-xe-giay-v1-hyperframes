  <div
    id="root"

  >
    <!-- Background Spotlight Grid -->
    <div class="bg-spotlight"></div>

    <!-- SHOT 1: Start 0s, Duration 4.78s -->
    <div id="shot-1" class="clip" data-start="0" data-duration="4.78">

  <script>
    // Prepare SVG stroke dash properties synchronously for seekable animations
    const docPaths = document.querySelectorAll(".doc-draw-path");
    docPaths.forEach(function (p) {
      const len = p.getTotalLength();
      p.style.strokeDasharray = len + "px";
      p.style.strokeDashoffset = len + "px";
    });

    const checkPath = document.querySelector("#check-draw-path");
    if (checkPath) {
      const checkLen = checkPath.getTotalLength();
      checkPath.style.strokeDasharray = checkLen + "px";
      checkPath.style.strokeDashoffset = checkLen + "px";
    }

    // Build the master deterministic GSAP timeline
    const tl = gsap.timeline({ paused: true });

    // ==========================================
    // SHOT 1 MOTION (0.00s - 4.78s)
    // ==========================================
    // Punch entrance for Shot 1 card
    tl.fromTo(
      "#shot-1-card",
      { scale: 0.86, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power4.out" },
      0.04
    );

    // Pan camera across split view from speaker (Netanyahu) to pilot
    tl.fromTo(
      "#shot-1-img",
      { x: 0 },
      { x: -380, duration: 4.5, ease: "sine.inOut" },
      0.15
    );

    // Overlay entrance at 1.08s (atMs: 74800 relative to 73720)
    tl.fromTo(
      "#shot-1-overlay",
      { y: 30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      1.08
    );

    // Self-drawing doc icon paths
    docPaths.forEach(function (p, idx) {
      tl.to(
        p,
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        1.14 + idx * 0.08
      );
    });

    // Dissolve out shot 1 wrapper right before cut
    tl.to(
      "#shot-1-content",
      { opacity: 0, duration: 0.22, ease: "power2.in" },
      4.56
    );

    // ==========================================
    // SHOT 2 MOTION (4.78s - 9.48s)
    // ==========================================
    // Dissolve in Shot 2 wrapper
    tl.fromTo(
      "#shot-2-content",
      { opacity: 0 },
      { opacity: 1, duration: 0.3, ease: "power2.out" },
      4.78
    );

    // Zoom-in camera motion into the emergency unlock switch & hand
    tl.fromTo(
      "#shot-2-img",
      { scale: 1.04 },
      { scale: 1.30, duration: 4.5, ease: "power1.out" },
      4.78
    );

    // Punch-phrase overlay arrival at 6.28s (atMs: 80000 relative to 73720)
    tl.fromTo(
      "#shot-2-overlay",
      { scale: 0.88, y: 28, opacity: 0 },
      { scale: 1, y: 0, opacity: 1, duration: 0.42, ease: "power4.out" },
      6.28
    );

    // Self-drawing check icon
    if (checkPath) {
      tl.to(
        checkPath,
        { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" },
        6.34
      );
    }

    // Register paused timeline with HyperFrames runtime
    window.__timelines["scene-s09"] = tl;
  </script>
