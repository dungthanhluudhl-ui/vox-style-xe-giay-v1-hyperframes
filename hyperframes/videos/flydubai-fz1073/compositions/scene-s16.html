            <g clip-path="url(#horizon-clip)">

  <script>
    // Build single paused timeline registered on window.__timelines["scene-s16"]
    const tl = gsap.timeline({ paused: true });

    // =========================================================================
    // SHOT 1 CHOREOGRAPHY (0.00s - 4.78s)
    // =========================================================================

    // 1. Wobble-drop entrance for main evidence card
    tl.fromTo(
      "#shot-1-card",
      { y: -140, rotation: 3.5, opacity: 0 },
      { y: 0, rotation: -0.5, opacity: 1, duration: 0.7, ease: "power3.out" },
      0.1
    );

    // 2. Warning badge entrance at 0.78s (atMs: 139500)
    tl.fromTo(
      "#shot-1-badge",
      { scale: 0.8, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.78
    );

    // SVG warning icon path drawing
    const triangle = document.getElementById("warning-triangle");
    if (triangle) {
      const len = triangle.getTotalLength();
      triangle.style.strokeDasharray = len;
      triangle.style.strokeDashoffset = len;
      tl.to(triangle, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 0.82);
    }

    // Subtle alive motion on Shot 1 card
    tl.to("#shot-1-card", { rotation: 0.4, duration: 2.8, ease: "sine.inOut" }, 1.5);

    // =========================================================================
    // SHOT 2 CHOREOGRAPHY (4.78s - 11.29s)
    // =========================================================================

    // 1. Cut arrival of Shot 2 elements at 4.78s
    tl.fromTo(
      "#shot-2-context-card",
      { y: -30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      4.78
    );

    tl.fromTo(
      "#attitude-instrument",
      { scale: 0.9, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      4.82
    );

    tl.fromTo(
      "#digital-gauge-box",
      { scale: 0.8, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      4.9
    );

    // Camera slow zoom across Shot 2
    tl.fromTo(
      "#shot-2-camera",
      { scale: 1 },
      { scale: 1.05, duration: 6.51, ease: "none" },
      4.78
    );

    // Setup and prep arc path for banking draw
    const angleArc = document.getElementById("angle-arc");
    if (angleArc) {
      const arcLen = angleArc.getTotalLength();
      angleArc.style.strokeDasharray = arcLen;
      angleArc.style.strokeDashoffset = arcLen;
    }

    // 2. THE 140-DEGREE ROLL MOTION (5.00s - 6.70s)
    // Horizon and aircraft rotate in unison around dial center (310, 310)
    gsap.set("#horizon-group", { transformOrigin: "310px 310px" });
    gsap.set("#dc10-group", { transformOrigin: "310px 310px" });

    tl.fromTo(
      "#horizon-group",
      { rotation: 0 },
      { rotation: 140, duration: 1.7, ease: "power2.inOut" },
      5.00
    );

    tl.fromTo(
      "#dc10-group",
      { rotation: 0 },
      { rotation: 140, duration: 1.7, ease: "power2.inOut" },
      5.00
    );

    if (angleArc) {
      tl.to(
        angleArc,
        { strokeDashoffset: 0, duration: 1.7, ease: "power2.inOut" },
        5.00
      );
    }

    // Dynamic digital readout counter from 0 to 140 deg
    const readoutObj = { val: 0 };
    tl.to(
      readoutObj,
      {
        val: 140,
        duration: 1.7,
        ease: "power2.inOut",
        onUpdate: function () {
          const el = document.getElementById("angle-readout");
          if (el) {
            el.textContent = Math.round(readoutObj.val) + "°";
          }
        }
      },
      5.00
    );

    // 3. Punch phrase "NGHIÊNG 140 ĐỘ" entrance at 5.78s (atMs: 144500)
    tl.fromTo(
      "#shot-2-punch",
      { y: 40, opacity: 0, scale: 0.95 },
      { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
      5.78
    );

    // Fall icon downward pulse
    tl.fromTo(
      "#fall-arrow",
      { y: -10, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
      5.85
    );

    // 4. Secondary label "LẬT NGƯỢC THÂN TÀU" entrance at 8.08s (atMs: 146800)
    tl.fromTo(
      "#shot-2-label",
      { y: 30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      8.08
    );

    // Subtle drift during hold
    tl.to("#attitude-instrument", { y: -6, duration: 2.8, ease: "sine.inOut" }, 7.0);

    // Register paused timeline to HyperFrames runtime
    window.__timelines["scene-s16"] = tl;
  </script>
