.hf-text-light { color: #F7F4EC; }

      /* Chart background variant rules: horizontal rules at 20%, 40%, 60%, 80% */

      .status-badge-text {

      /* Telemetry diagram overlay in Shot 1 */
      .telemetry-container {

      .telemetry-tag {

        background-color: #141414;

        font-size: 20px;

        letter-spacing: 1px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s05"
      data-width="1080"
      data-height="1920"
      data-duration="9.79"
      data-start="0"
    >
      <!-- Persistent Chart Background Variant -->
      <div id="bg-chart" class="clip" data-start="0" data-duration="9.79">
        <div class="chart-rule chart-rule-20"><div class="chart-tick"></div></div>
        <div class="chart-rule chart-rule-40"><div class="chart-tick"></div></div>
        <div class="chart-rule chart-rule-60"><div class="chart-tick"></div></div>
        <div class="chart-rule chart-rule-80"><div class="chart-tick"></div></div>
      </div>

      <!-- Persistent Visual Signature Bottom Bar -->
      <div id="brand-bottom-bar" class="clip" data-start="0" data-duration="9.79"></div>

      <!-- ========================================== -->
      <!-- SHOT 1 (S05-1): Plunging Airplane + Telemetry -->
      <!-- ========================================== -->
      <div id="shot-1" class="clip" data-start="0" data-duration="5.09" style="z-index: 10;">
        <div id="shot-1-cam" style="position: absolute; inset: 0;">
          <div id="shot-1-wobble" style="position: absolute; inset: 0;">
            <div class="collage-card">
              <img
                id="img-shot-1"
                src="assets/img-02-flydubai-rapid-altitude-loss.jpg"
                alt="Airplane plunging rapidly"
              />
            </div>

            <!-- Altitude Telemetry Graph Overlay -->
            <div class="telemetry-container">
              <div class="telemetry-tag" style="top: 24px; left: 24px; color: #F7F4EC;">
                ALT: 9.000M
              </div>
              <div class="telemetry-tag" style="bottom: 24px; right: 24px; color: #FF6A1A; border: 1.5px solid #FF6A1A;">
                DIP: 5.000M
              </div>
              <svg viewBox="0 0 972 420" width="972" height="420" fill="none" style="position: absolute; inset: 0;">
                <!-- Telemetry Guideline -->
                <path
                  d="M 60 50 L 260 50 L 420 340 L 520 230 L 640 370 L 760 290 L 890 370"

                  stroke-width="12"

                <!-- Animated Plunge Vector -->
                <path
                  id="telemetry-vector"
                  d="M 60 50 L 260 50 L 420 340 L 520 230 L 640 370 L 760 290 L 890 370"
                  stroke="#FF6A1A"
                  stroke-width="6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Shot 1 Overlay Badge (MẤT ĐỘ CAO GẮT) -->
      <div id="overlay-s05-1" class="clip status-badge-wrapper" data-start="0.59" data-duration="2.2" style="z-index: 70;">
        <div class="status-badge">
          <svg class="badge-icon" viewBox="0 0 48 48" fill="none">
            <path
              d="M 12 12 L 36 36 M 36 18 L 36 36 L 18 36"

            <path

      <!-- ========================================== -->
      <!-- SHOT 2 (S05-2): Panic Inside Cabin           -->
      <!-- ========================================== -->
      <div id="shot-2" class="clip" data-start="5.09" data-duration="4.70" style="z-index: 20;">
        <div id="shot-2-cam" style="position: absolute; inset: 0;">
          <div id="shot-2-shake" style="position: absolute; inset: 0;">
            <div class="collage-card">
              <img
                id="img-shot-2"
                src="assets/img-08-airplane-cabin-crash-panic.jpg"
                alt="Airplane cabin turbulence and panic"
              />
            </div>
          </div>
        </div>
      </div>

      <!-- Shot 2 Overlay Badge (RUNG LẮC DỮ DỘI) -->
      <div id="overlay-s05-2" class="clip status-badge-wrapper" data-start="6.59" data-duration="2.2" style="z-index: 70;">
        <div class="status-badge">
          <svg class="badge-icon" viewBox="0 0 48 48" fill="none">
            <path
              d="M 24 6 L 44 40 L 4 40 Z"
              stroke="#FF6A1A"
              stroke-width="4.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M 24 18 L 24 28"
              stroke="#F7F4EC"
              stroke-width="4.5"
              stroke-linecap="round"
            />
            <circle cx="24" cy="34" r="2.5" fill="#F7F4EC" />
          </svg>
          <span class="status-badge-text">RUNG LẮC DỮ DỘI</span>
        </div>

    <!-- GSAP Seekable Timeline Script -->
    <script>
      // Single paused master timeline registration
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Setup SVG Path Draw for Telemetry Vector
      const telemetryPath = document.querySelector("#telemetry-vector");
      if (telemetryPath) {
        const pathLength = telemetryPath.getTotalLength();
        telemetryPath.style.strokeDasharray = pathLength;
        telemetryPath.style.strokeDashoffset = pathLength;
      }

      // ==========================================
      // SHOT 1 CHOREOGRAPHY (0s - 5.09s)
      // ==========================================

      // Wobble-drop entrance for plane plunge
      tl.fromTo(
        "#shot-1-wobble",
        { y: -140, rotation: -6, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.8, ease: "power2.out" },
        0
      );

      // Camera motion: pan diagonal down-right along the fall trajectory
      tl.fromTo(
        "#shot-1-cam",
        { x: -25, y: -20, scale: 1.02 },
        { x: 35, y: 35, scale: 1.12, duration: 5.09, ease: "none" },
        0
      );

      // Subsequent turbulent dips and recovery motions (absolute seek-safe values)
      tl.to("#shot-1-wobble", { y: 24, rotation: 2.2, duration: 1.1, ease: "sine.inOut" }, 0.9);
      tl.to("#shot-1-wobble", { y: -10, rotation: -1.8, duration: 1.0, ease: "sine.inOut" }, 2.0);
      tl.to("#shot-1-wobble", { y: 28, rotation: 2.8, duration: 1.2, ease: "sine.inOut" }, 3.0);

      // Telemetry SVG curve draw
      if (telemetryPath) {
        tl.to(
          telemetryPath,
          { strokeDashoffset: 0, duration: 2.5, ease: "power2.out" },
          0.4
        );
      }

      // Overlay Badge 1 Entrance & Exit
      tl.fromTo(
        "#overlay-s05-1",
        { scale: 0.85, opacity: 0, y: -18 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        0.59
      );
      tl.to(
        "#overlay-s05-1",
        { opacity: 0, y: -14, duration: 0.3, ease: "power2.in" },
        2.49
      );

      // ==========================================
      // SHOT 2 CHOREOGRAPHY (5.09s - 9.79s)
      // ==========================================

      // Dissolve transition into the cabin panic shot
      tl.fromTo(
        "#shot-2",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power1.inOut" },
        5.09
      );

      // Camera motion: fast zoom-in creating psychological claustrophobia
      tl.fromTo(
        "#shot-2-cam",
        { scale: 1.02 },
        { scale: 1.22, duration: 4.70, ease: "power2.out" },
        5.09
      );

      // Deterministic Seek-Safe Violent Cabin Turbulence Shake
      const shakeOffsets = [
        { x: 9, y: -7, r: 0.8 },
        { x: -8, y: 7, r: -0.7 },
        { x: 8, y: -5, r: 0.6 },
        { x: -9, y: 8, r: -0.8 },
        { x: 7, y: -6, r: 0.6 },
        { x: -7, y: 6, r: -0.5 },
        { x: 8, y: -7, r: 0.7 },
        { x: -8, y: 7, r: -0.7 },
        { x: 6, y: -5, r: 0.5 },
        { x: -6, y: 6, r: -0.5 }
      ];

      let shakeTime = 5.2;
      let offsetIdx = 0;
      while (shakeTime < 9.5) {
        const step = shakeOffsets[offsetIdx % shakeOffsets.length];
        tl.to(
          "#shot-2-shake",
          { x: step.x, y: step.y, rotation: step.r, duration: 0.09, ease: "power1.inOut" },
          shakeTime
        );
        shakeTime = parseFloat((shakeTime + 0.1).toFixed(2));
        offsetIdx++;
      }
      tl.to("#shot-2-shake", { x: 0, y: 0, rotation: 0, duration: 0.15, ease: "power1.out" }, 9.55);

      // Overlay Badge 2 Entrance & Exit
      tl.fromTo(
        "#overlay-s05-2",
        { scale: 0.85, opacity: 0, y: -18 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        6.59
      );
      tl.to(
        "#overlay-s05-2",
        { opacity: 0, y: -14, duration: 0.3, ease: "power2.in" },
        8.49
      );

      // Register timeline for seekable headless render
      window.__timelines["scene-s05"] = tl;
    </script>
