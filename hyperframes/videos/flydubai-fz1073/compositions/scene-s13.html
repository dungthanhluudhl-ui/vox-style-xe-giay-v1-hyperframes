      .marker-2004 { left: 288px; }
      .marker-2015 { left: 568px; }

      }
      .photo-caption-text {
        font-size: 20px;
        font-weight: 900;
        color: #141414;
        letter-spacing: 0.5px;
      }
      .photo-meta-text {
        font-size: 17px;
        font-weight: 700;
        color: #141414;
        opacity: 0.8;
      }

      /* Overlay 1: Precedent Label + Clock Icon */
      .overlay-precedent-box {
        position: absolute;
        bottom: 140px;
        left: 0;
        height: 60px;
        background: #141414;
        border-radius: 30px;

        color: #f7f4ec;

      }

      /* Overlay 2: Punch-phrase */
      .overlay-punch-box {

        border-left: 12px solid #ff6a1a;
        border-radius: 12px;

        display: flex;

      }
      .punch-main-title {
        color: #ff6a1a;

        font-weight: 900;

      }

      /* Vox Trademark Bottom Orange Bar */
      .bottom-orange-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 14px;
        background: #ff6a1a;
        z-index: 999;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s13"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6.45"
    >
      <!-- Main Scene Clip -->
      <div id="scene-s13" class="clip" data-start="0" data-duration="6.45">
        <div class="safe-container">
          <!-- 1. Header Bar -->
          <div id="header-bar" class="header-bar">
            <div class="header-title">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="3" width="18" height="18" rx="2" stroke="#FF6A1A" stroke-width="2.5" />
                <path d="M7 8H17M7 12H17M7 16H13" stroke="#FF6A1A" stroke-width="2.5" stroke-linecap="round" />
              </svg>
              <span>HỒ SƠ TƯ LIỆU HÀNG KHÔNG</span>
            </div>
            <div class="header-tag">TƯ LIỆU GỐC</div>
          </div>

          <!-- 2. Timeline Module (Trượt ngược 32 năm về 1994) -->
          <div id="timeline-box" class="timeline-box">
            <div class="timeline-top-row">
              <div class="year-indicator-group">
                <span class="year-label">MỐC NĂM:</span>
                <span id="year-val" class="year-display">2026</span>
              </div>
              <div id="badge-past" class="badge-past">32 NĂM TRƯỚC</div>
            </div>

            <!-- Ruler Axis with ticks -->
            <div class="ruler-container">
              <div class="ruler-axis"></div>
              <div class="marker-tick marker-1994"></div>
              <div class="marker-tick marker-2004"></div>
              <div class="marker-tick marker-2015"></div>
              <div class="marker-tick marker-2026"></div>

              <div class="ruler-markers">
                <div class="marker-col"><span class="marker-label">1994</span></div>
                <div class="marker-col"><span class="marker-label">2004</span></div>
                <div class="marker-col"><span class="marker-label">2015</span></div>
                <div class="marker-col"><span class="marker-label">2026</span></div>
              </div>

              <!-- Sliding Pointer Needle -->
              <div id="needle-runner" class="needle-runner">
                <svg width="26" height="26" viewBox="0 0 24 24">
                  <polygon points="12,22 3,2 21,2" fill="#FF6A1A" stroke="#141414" stroke-width="2" />
                </svg>
              </div>
            </div>
          </div>

          <!-- 3. Photo Card (Unfold entrance + slow Ken Burns) -->
          <div class="photo-card-wrapper">
            <div id="photo-card" class="photo-card">
              <div class="photo-frame">
                <img
                  id="plane-img"
                  class="photo-img"
                  src="assets/img-17-fedex-cargo-plane-runway.jpg"
                  alt="FedEx DC-10"
                />
                <div class="photo-tag-badge">TƯ LIỆU ĐIỀU TRA</div>
              </div>
              <div class="photo-caption-row">
                <span class="photo-caption-text">MCDONNELL DOUGLAS DC-10</span>
                <span class="photo-meta-text">ĐƯỜNG LĂN SÂN BAY (1994)</span>
              </div>
            </div>
          </div>

          <!-- 4. Overlay 1: Precedent Label + Clock Icon (atMs: 119500 -> 3.14s) -->
          <div id="overlay-precedent" class="overlay-precedent-box">
            <svg id="clock-svg" width="30" height="30" viewBox="0 0 32 32">
              <circle cx="16" cy="16" r="13" fill="none" stroke="#FF6A1A" stroke-width="3" />
              <path
                id="clock-hand"
                d="M 16 16 L 16 7 M 16 16 L 23 16"
                stroke="#FF6A1A"
                stroke-width="3"
                stroke-linecap="round"
              />
            </svg>
            <span class="precedent-text">TIỀN LỆ NĂM 1994</span>
          </div>

          <!-- 5. Overlay 2: Punch-phrase (atMs: 120500 -> 4.14s) -->
          <div id="overlay-punch" class="overlay-punch-box">
            <h1 class="punch-main-title">CHUYẾN FEDEX 705</h1>
          </div>
        </div>

        <!-- Trademark Bottom Orange Bar -->
        <div class="bottom-orange-bar"></div>

    <!-- GSAP Seekable Orchestration -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Initial State & Header Appearance (0.00s - 0.45s)
      tl.fromTo(
        "#header-bar",
        { opacity: 0, y: -24 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        0.1
      );

      // 2. Timeline Box Entrance (0.25s)
      tl.fromTo(
        "#timeline-box",
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.25
      );

      // 3. Sliding needle runner & Year countdown from 2026 back to 1994 (0.45s - 1.95s)
      tl.fromTo(
        "#needle-runner",
        { x: 840 },
        { x: 0, duration: 1.5, ease: "power2.inOut" },
        0.45
      );

      const yearState = { year: 2026 };
      tl.fromTo(
        yearState,
        { year: 2026 },
        {
          year: 1994,
          duration: 1.5,
          ease: "power2.inOut",
          onUpdate: () => {
            const el = document.getElementById("year-val");
            if (el) {
              el.textContent = Math.round(yearState.year);
            }
          }
        },
        0.45
      );

      // 4. "32 NĂM TRƯỚC" badge pops when timeline reaches 1994 (1.95s)
      tl.fromTo(
        "#badge-past",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.95
      );

      // 5. Photo Card Unfold Entrance (0.65s - 1.75s)
      tl.fromTo(
        "#photo-card",
        { opacity: 0, rotationX: -75, y: -30 },
        { opacity: 1, rotationX: 0, y: 0, duration: 1.1, ease: "power3.out" },
        0.65
      );

      // 6. Ken Burns Slow Zoom (1.0x -> 1.10x) across entire presence (0.65s - 6.45s)
      tl.fromTo(
        "#plane-img",
        { scale: 1.0 },
        { scale: 1.1, duration: 5.8, ease: "none" },
        0.65
      );

      // 7. Overlay 1: Precedent Label + Clock Icon (atMs: 119500 -> 3.14s)
      tl.fromTo(
        "#overlay-precedent",
        { opacity: 0, y: 30, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
        3.14
      );

      // Reverse spin on clock hand simulating time winding backward
      tl.fromTo(
        "#clock-hand",
        { rotation: 0, transformOrigin: "16px 16px" },
        { rotation: -360, duration: 1.2, ease: "power2.out" },
        3.14
      );

      // 8. Overlay 2: Punch-phrase "CHUYẾN FEDEX 705" (atMs: 120500 -> 4.14s)
      tl.fromTo(
        "#overlay-punch",
        { opacity: 0, x: -40, scale: 0.96 },
        { opacity: 1, x: 0, scale: 1, duration: 0.55, ease: "power3.out" },
        4.14
      );

      // Register timeline to HyperFrames runtime
      window.__timelines["scene-s13"] = tl;
    </script>
  
    </template>
