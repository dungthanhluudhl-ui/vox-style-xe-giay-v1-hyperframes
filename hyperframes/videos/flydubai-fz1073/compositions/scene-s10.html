<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Standard HyperFrames clip contract */
    .clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* Style tokens & safe WCAG utility classes */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
    .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
    .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
    .hf-plate-paper { background-color: #E7E3D9; color: #141414; }

    /* Editorial Ivory Grid Background */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      z-index: 1;
    }

    /* Shot Media Framing */
    .shot-media-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      transform-origin: 50% 50%;
    }

    .shot-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform-origin: 50% 50%;
    }

    /* Editorial Overlays */
    .overlay-layer {
      pointer-events: none;
      z-index: 30;
    }

    .editorial-plate {
      position: absolute;
      top: 260px;
      left: 60px;
      width: 960px;
      height: auto;
      border-radius: 16px;
      border-left: 10px solid #FF6A1A;
      padding: 32px 40px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      transform-origin: 50% 50%;
    }

    .plate-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .badge-tag {
      font-weight: 900;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 6px 16px;
      border-radius: 6px;
      display: inline-block;
      line-height: 1.2;
    }

    .plate-icon-svg {
      display: block;
    }

    .plate-title {
      font-weight: 900;
      font-size: 60px;
      line-height: 1.18;
      letter-spacing: -0.5px;
      margin: 0;
      padding: 0;
      text-transform: uppercase;
    }

    .plate-subtitle {
      font-weight: 700;
      font-size: 27px;
      line-height: 1.35;
      color: #E7E3D9;
      margin-top: 10px;
      margin-bottom: 0;
    }

    /* Map Callout Beacon (Shot 2) */
    .map-callout {
      position: absolute;
      top: 1020px;
      left: 140px;
      display: flex;
      align-items: center;
      gap: 16px;
      transform-origin: 0% 50%;
    }

    .beacon-pulse-wrap {
      position: relative;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
    }

    .beacon-ring {
      position: absolute;
      inset: 0;
      border: 3px solid #FF6A1A;
      border-radius: 50%;
      transform-origin: center;
    }

    .beacon-center-dot {
      width: 18px;
      height: 18px;
      background-color: #FF6A1A;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 106, 26, 0.8);
    }

    .beacon-line {
      width: 36px;
      height: 3px;
      background-color: #FF6A1A;
    }

    .beacon-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 22px;
      border-radius: 10px;
      border: 1.5px solid #FF6A1A;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
    }

    .beacon-tag {
      font-weight: 900;
      font-size: 18px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 1px;
      line-height: 1.2;
    }

    .beacon-text {
      font-weight: 900;
      font-size: 26px;
      letter-spacing: 0.5px;
      line-height: 1.2;
      white-space: nowrap;
    }

    /* Signature bottom orange bar */
    .brand-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 14px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s10" data-width="1080" data-height="1920" data-duration="9.64">
    <!-- Editorial background grid pattern -->
    <div class="bg-grid"></div>

    <!-- SHOT S10-1: Cockpit takeover (0s - 5.3s) -->
    <section id="shot-1" class="clip" data-start="0" data-duration="5.3" style="z-index: 10;">
      <div id="shot-1-wrap" class="shot-media-wrap">
        <img id="shot-1-img" src="assets/img-10-airplane-cockpit-landing-pilots.jpg" alt="Cockpit Pilots" class="shot-image">
      </div>
    </section>

    <!-- SHOT S10-1 OVERLAY: "TIẾP QUẢN TAY LÁI" (3.3s - 5.2s) -->
    <div id="overlay-1" class="clip overlay-layer" data-start="3.3" data-duration="1.9" style="z-index: 30;">
      <div id="plate-1" class="editorial-plate hf-plate-ink">
        <div class="plate-top-row">
          <span class="badge-tag hf-hl-orange">BUỒNG LÁI</span>
          <svg class="plate-icon-svg" viewBox="0 0 48 48" width="46" height="46">
            <circle id="person-head" cx="24" cy="14" r="8" fill="none" stroke="#FF6A1A" stroke-width="3.5" stroke-linecap="round" />
            <path id="person-body" d="M10 40 C10 29 16 26 24 26 C32 26 38 29 38 40" fill="none" stroke="#FF6A1A" stroke-width="3.5" stroke-linecap="round" />
          </svg>
        </div>
        <h2 class="plate-title hf-text-light">TIẾP QUẢN TAY LÁI</h2>
        <p class="plate-subtitle">Hai phi công khác trên chuyến bay</p>
      </div>
    </div>

    <!-- SHOT S10-2: Flight route diversion to Tabuk (5.3s - 9.64s) -->
    <section id="shot-2" class="clip" data-start="5.3" data-duration="4.34" style="z-index: 20;">
      <div id="shot-2-wrap" class="shot-media-wrap">
        <img id="shot-2-img" src="assets/img-06-flight-route-map-infographic.jpg" alt="Flight Route Map" class="shot-image">
      </div>
    </section>

    <!-- SHOT S10-2 MAP BEACON: Target callout at Tabuk (5.8s - 9.64s) -->
    <div id="overlay-beacon" class="clip overlay-layer" data-start="5.8" data-duration="3.84" style="z-index: 35;">
      <div id="map-beacon" class="map-callout">
        <div class="beacon-pulse-wrap" data-layout-allow-overflow="true">
          <div id="beacon-ring" class="beacon-ring"></div>
          <div class="beacon-center-dot"></div>
        </div>
        <div class="beacon-line"></div>
        <div class="beacon-card hf-plate-ink">
          <span class="beacon-tag hf-hl-orange">ĐÍCH ĐẾN</span>
          <span class="beacon-text hf-text-light">TABUK (Ả RẬP XÊ ÚT)</span>
        </div>
      </div>
    </div>

    <!-- SHOT S10-2 OVERLAY: "HẠ CÁNH: TABUK" (6.6s - 8.8s) -->
    <div id="overlay-2" class="clip overlay-layer" data-start="6.6" data-duration="2.2" style="z-index: 40;">
      <div id="plate-2" class="editorial-plate hf-plate-ink">
        <div class="plate-top-row">
          <span class="badge-tag hf-hl-orange">CHUYỂN HƯỚNG</span>
          <svg class="plate-icon-svg" viewBox="0 0 48 48" width="46" height="46">
            <path id="pin-outline" d="M24 6 C16.5 6 11 11.5 11 19 C11 28 24 42 24 42 C24 42 37 28 37 19 C37 11.5 31.5 6 24 6 Z"
                  fill="none" stroke="#FF6A1A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
            <circle id="pin-center" cx="24" cy="19" r="4.5" fill="#FF6A1A" />
          </svg>
        </div>
        <h2 class="plate-title hf-text-light">HẠ CÁNH: TABUK</h2>
        <p class="plate-subtitle">Phi trường an toàn tại Ả Rập Xê Út</p>
      </div>
    </div>

    <!-- Persistent brand bottom signature bar -->
    <div class="brand-bottom-bar"></div>
  </div>

  <script>
    // Prepare SVG stroke lengths for deterministic path drawing
    const personHead = document.getElementById("person-head");
    const personBody = document.getElementById("person-body");
    const pinOutline = document.getElementById("pin-outline");

    let headLen = 60;
    let bodyLen = 60;
    let pinLen = 140;

    if (personHead && typeof personHead.getTotalLength === "function") {
      headLen = personHead.getTotalLength();
      personHead.style.strokeDasharray = headLen;
      personHead.style.strokeDashoffset = headLen;
    }
    if (personBody && typeof personBody.getTotalLength === "function") {
      bodyLen = personBody.getTotalLength();
      personBody.style.strokeDasharray = bodyLen;
      personBody.style.strokeDashoffset = bodyLen;
    }
    if (pinOutline && typeof pinOutline.getTotalLength === "function") {
      pinLen = pinOutline.getTotalLength();
      pinOutline.style.strokeDasharray = pinLen;
      pinOutline.style.strokeDashoffset = pinLen;
    }

    // Build single paused timeline registered to window.__timelines["scene-s10"]
    const tl = gsap.timeline({ paused: true });

    // -------------------------------------------------------------
    // SHOT 1 (0.00s - 5.30s): Grow transition & slow camera zoom-in
    // -------------------------------------------------------------
    tl.fromTo(
      "#shot-1-wrap",
      { scale: 0.88, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
      0
    );

    tl.fromTo(
      "#shot-1-img",
      { scale: 1.05 },
      { scale: 1.22, duration: 5.3, ease: "none" },
      0
    );

    // Shot 1 Overlay Card: Arrival at 3.3s
    tl.fromTo(
      "#plate-1",
      { scale: 0.86, opacity: 0, y: 35 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      3.3
    );

    // Self-drawing person icon
    tl.fromTo(
      "#person-head",
      { strokeDashoffset: headLen },
      { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
      3.45
    );

    tl.fromTo(
      "#person-body",
      { strokeDashoffset: bodyLen },
      { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
      3.55
    );

    // Shot 1 Overlay outro
    tl.to(
      "#plate-1",
      { opacity: 0, y: -16, duration: 0.3, ease: "power2.in" },
      4.9
    );

    // -------------------------------------------------------------
    // SHOT 2 (5.30s - 9.64s): Cut transition & camera pan-left
    // -------------------------------------------------------------
    tl.fromTo(
      "#shot-2-img",
      { x: 70, scale: 1.16 },
      { x: -70, scale: 1.16, duration: 4.34, ease: "sine.inOut" },
      5.3
    );

    // Map Beacon Callout: Entrance at 5.8s
    tl.fromTo(
      "#map-beacon",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.4)" },
      5.8
    );

    // Deterministic radar beacon pulse (finite repeat)
    tl.fromTo(
      "#beacon-ring",
      { scale: 0.6, opacity: 0.95 },
      { scale: 2.3, opacity: 0, duration: 1.15, repeat: 2, ease: "power1.out" },
      6.0
    );

    // Shot 2 Overlay Card: Arrival at 6.6s
    tl.fromTo(
      "#plate-2",
      { scale: 0.86, opacity: 0, y: 35 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      6.6
    );

    // Self-drawing pin icon
    tl.fromTo(
      "#pin-outline",
      { strokeDashoffset: pinLen },
      { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
      6.75
    );

    tl.fromTo(
      "#pin-center",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.5)" },
      7.1
    );

    // Shot 2 Overlay outro
    tl.to(
      "#plate-2",
      { opacity: 0, y: -16, duration: 0.3, ease: "power2.in" },
      8.45
    );

    // Register paused timeline with HyperFrames runtime
    window.__timelines["scene-s10"] = tl;
  </script>

    </template>
  </body>
</html>
