      const tl = gsap.timeline({ paused: true });

      // ==========================================
      // SETUP SVG STROKES CHO PATH DRAWING
      // ==========================================
      const clockCircle = document.getElementById("s1-clock-circle");
      const clockHands = document.getElementById("s1-clock-hands");
      if (clockCircle && clockHands) {
        const cLen = clockCircle.getTotalLength();
        clockCircle.style.strokeDasharray = cLen;
        clockCircle.style.strokeDashoffset = cLen;
        const hLen = clockHands.getTotalLength();
        clockHands.style.strokeDasharray = hLen;
        clockHands.style.strokeDashoffset = hLen;
      }

      const warnTriangle = document.getElementById("s2-warn-triangle");
      const warnExcl = document.getElementById("s2-warn-excl");
      if (warnTriangle && warnExcl) {
        const tLen = warnTriangle.getTotalLength();
        warnTriangle.style.strokeDasharray = tLen;
        warnTriangle.style.strokeDashoffset = tLen;
        const eLen = warnExcl.getTotalLength();
        warnExcl.style.strokeDasharray = eLen;
        warnExcl.style.strokeDashoffset = eLen;
      }

      const arrowLeft = document.getElementById("s1-arrow-left");
      const arrowRight = document.getElementById("s1-arrow-right");
      if (arrowLeft && arrowRight) {
        const alLen = arrowLeft.getTotalLength();
        arrowLeft.style.strokeDasharray = alLen;
        arrowLeft.style.strokeDashoffset = alLen;
        const arLen = arrowRight.getTotalLength();
        arrowRight.style.strokeDasharray = arLen;
        arrowRight.style.strokeDashoffset = arLen;
      }

      // ==========================================
      // SHOT 1 CHOREOGRAPHY (0.0s -> 5.08s)
      // ==========================================
      // 1. Entrance: Flip vào từ t = 0.1s
      tl.fromTo(
        "#shot-1-inner",
        { rotationY: 28, scale: 0.94, opacity: 0 },
        { rotationY: 0, scale: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.1
      );

      // 2. Hai thẻ split 1994 và 2026 nảy nhẹ vào vị trí
      tl.fromTo(
        "#s1-card-left",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.3
      );
      tl.fromTo(
        "#s1-card-right",
        { x: 50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.42
      );
      tl.fromTo(
        "#s1-divider",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.5
      );

      // 3. Header badge "1994 VÀ 2026" + Icon Clock xuất hiện lúc 0.88s (atMs: 161800)
      tl.fromTo(
        "#s1-header-badge",
        { y: -24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.88
      );
      if (clockCircle && clockHands) {
        tl.to(clockCircle, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 0.95);
        tl.to(clockHands, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.35);
      }

      // 4. Mũi tên hội tụ chạy nét lúc 2.6s
      if (arrowLeft && arrowRight) {
        tl.to(arrowLeft, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 2.6);
        tl.to(arrowRight, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 2.6);
      }

      // 5. Convergence Label "CÙNG MỘT LỖ HỔNG" nảy vào lúc 3.08s (atMs: 164000)
      tl.fromTo(
        "#s1-convergence-box",
        { scale: 0.65, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        3.08
      );

      // ==========================================
      // SHOT 2 CHOREOGRAPHY (5.08s -> 10.32s)
      // ==========================================
      // 1. Camera Motion: Zoom-in chậm xuyên suốt Shot 2
      tl.fromTo(
        "#s2-zoom-container",
        { scale: 1 },
        { scale: 1.07, duration: 5.24, ease: "none" },
        5.08
      );

      // 2. Cánh cửa bọc thép xuất hiện vững chắc lúc 5.15s

        ".door-frame",
        { scale: 0.94, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        5.15
      );

      // 3. Punch-phrase "NGƯỜI CÓ CHÌA KHÓA" + Icon Warning lúc 5.88s (atMs: 166800)
      tl.fromTo(
        "#s2-punch-box",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        5.88
      );
      if (warnTriangle && warnExcl) {
        tl.to(warnTriangle, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 5.95);
        tl.to(warnExcl, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 6.35);
      }

      // 4. Chiếc thẻ chìa khóa cắm xuyên vào ổ khóa từ bên trong lúc 6.2s
      tl.fromTo(
