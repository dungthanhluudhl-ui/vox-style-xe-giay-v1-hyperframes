  <script>
    // Prepare SVG path dash measurements
    const arrowLine = document.getElementById("arrow-line");
    if (arrowLine) {
      const arrowLength = arrowLine.getTotalLength();
      arrowLine.style.strokeDasharray = arrowLength;
      arrowLine.style.strokeDashoffset = arrowLength;
    }

    const billRect = document.getElementById("icon-bill-rect");
    if (billRect) {
      const rectLen = billRect.getTotalLength();
      billRect.style.strokeDasharray = rectLen;
      billRect.style.strokeDashoffset = rectLen;
    }

    const billCircle = document.getElementById("icon-bill-circle");
    if (billCircle) {
      const circLen = billCircle.getTotalLength();
      billCircle.style.strokeDasharray = circLen;
      billCircle.style.strokeDashoffset = circLen;
    }

    // Initialize Paused GSAP Timeline
    const tl = gsap.timeline({ paused: true });

    // 1. Initial State (deterministic fromTo setup)
    tl.set("#stage-wrapper", { opacity: 1 });

    // Phase 1: Strike Entrance of Document Card (t = 0.15s)
    tl.fromTo(
      "#case-tag",
      { y: -30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
      0.1
    );

    tl.fromTo(
      "#doc-card",
      { y: -80, scale: 1.06, rotation: -2, opacity: 0 },
      { y: 0, scale: 1, rotation: 0, opacity: 1, duration: 0.45, ease: "power4.out" },
      0.15
    );

    // Phase 2: Overlays at 1.20s (134000ms - 132800ms)
    // Label "TRỤC LỢI BẢO HIỂM" & Icon "money" slam into the document
    tl.fromTo(
      "#payout-stamp",
      { scale: 1.35, rotation: 6, opacity: 0 },
      { scale: 1, rotation: -1, opacity: 1, duration: 0.38, ease: "power3.out" },
      1.2
    );

    // Money SVG Icon self-drawing paths
    if (billRect) {
      tl.to("#icon-bill-rect", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 1.25);
    }
    if (billCircle) {
      tl.to("#icon-bill-circle", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 1.35);
    }
    tl.fromTo(
      "#icon-bill-dots",
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.25, ease: "back.out(1.5)" },
      1.45
    );

    // Connector Arrow & Tag Animation (t = 2.1s)
    if (arrowLine) {
      tl.to("#arrow-line", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 2.1);
    }
    tl.fromTo(
      "#arrow-head",
      { opacity: 0, y: -10 },
      { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" },
      2.4
    );
    tl.fromTo(
      "#connector-tag",
      { opacity: 0, x: -16 },
      { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" },
      2.3
    );

    // Conspiracy Action Card Entrance (t = 2.5s)
    tl.fromTo(
      "#conspiracy-card",
      { y: 40, scale: 0.96, opacity: 0 },
      { y: 0, scale: 1, opacity: 1, duration: 0.4, ease: "power4.out" },
      2.5
    );

    // Phase 3: Punch Phrase Banner at 3.70s (136500ms - 132800ms)
    // "ÂM MƯU TAI NẠN GIẢ" strikes with high impact, holds until 5.8s+
    tl.fromTo(
      "#punch-card",
      { scale: 0.82, y: 45, opacity: 0 },
      { scale: 1, y: 0, opacity: 1, duration: 0.42, ease: "power4.out" },
      3.7
    );

    // Micro camera/stage drift to keep frame organically alive without breaking determinism
    tl.to(
      "#stage-wrapper",
      { y: -6, duration: 2.1, ease: "sine.inOut" },
      3.8
    );

    // Register paused timeline on window.__timelines
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s15"] = tl;
  </script>
