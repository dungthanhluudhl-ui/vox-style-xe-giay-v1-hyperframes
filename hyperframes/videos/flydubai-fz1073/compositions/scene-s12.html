<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        background: #F5F0E4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #F5F0E4;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 12px;
        background: #FF6A1A;
        z-index: 999;
      }

      /* Card layouts */
      .card-scene {
        position: absolute;
        top: 180px;
        left: 60px;
        width: 960px;
        height: 1200px;
        display: flex;
        flex-direction: column;
      }

      .meta-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        width: 100%;
      }

      .tag-plate-ink {
        background: #141414;
        color: #F7F4EC;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 1.5px;
        padding: 10px 20px;
        border-radius: 6px;
        text-transform: uppercase;
      }

      .tag-plate-orange {
        background: #FF6A1A;
        color: #141414;
        font-weight: 900;
        font-size: 20px;
        letter-spacing: 1.5px;
        padding: 10px 18px;
        border-radius: 6px;
        text-transform: uppercase;
      }

      /* Frame Containers */
      .media-frame {
        width: 960px;
        border: 4px solid #141414;
        box-shadow: 12px 12px 0px #141414;
        background: #141414;
        position: relative;
        overflow: hidden;
      }

      .media-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: center center;
      }

      /* Floating Overlay Badges */
      .status-badge {
        position: absolute;
        background: #141414;
        border: 3px solid #FF6A1A;
        border-radius: 12px;
        padding: 14px 26px;
        display: inline-flex;
        align-items: center;
        gap: 16px;
        box-shadow: 0px 8px 24px rgba(20, 20, 20, 0.45);
        z-index: 50;
      }

      .status-badge-text {
        font-weight: 900;
        font-size: 30px;
        color: #F7F4EC;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      /* Stamps positioned clearly without overlapping any text */
      .stamp-badge {
        position: absolute;
        z-index: 60;
        background: #141414;
        border-radius: 8px;
        text-transform: uppercase;
        letter-spacing: 3px;
        font-weight: 900;
        box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.35);
        transform-origin: center center;
      }

      .stamp-investigating {
        border: 5px dashed #FF6A1A;
        color: #FF6A1A;
        font-size: 32px;
        padding: 12px 26px;
        bottom: 30px;
        right: 30px;
      }

      .stamp-legal {
        border: 5px solid #FF6A1A;
        color: #FF6A1A;
        font-size: 28px;
        padding: 10px 24px;
        bottom: 30px;
        right: 30px;
      }

      /* Shot 1 Split Boxes */
      .split-container {
        display: flex;
        justify-content: space-between;
        margin-top: 32px;
        width: 100%;
        position: relative;
      }

      .split-box {
        width: 462px;
        background: #141414;
        border: 4px solid #141414;
        border-radius: 10px;
        padding: 22px 24px;
        box-shadow: 8px 8px 0px rgba(20, 20, 20, 0.2);
      }

      .split-source {
        font-weight: 900;
        font-size: 22px;
        color: #FF6A1A;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      .split-body {
        font-weight: 700;
        font-size: 24px;
        color: #F7F4EC;
        line-height: 1.35;
        margin: 0;
      }

      /* Shot 2 Caution Box */
      .caution-card {
        margin-top: 32px;
        background: #141414;
        border: 4px solid #141414;
        border-radius: 12px;
        padding: 30px 34px;
        box-shadow: 10px 10px 0px #FF6A1A;
        position: relative;
      }

      .caution-headline {
        font-weight: 900;
        font-size: 40px;
        color: #F7F4EC;
        line-height: 1.25;
        margin: 0 0 16px 0;
        text-transform: uppercase;
      }

      .caution-highlight {
        background: #FF6A1A;
        color: #141414;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 1px;
        padding: 8px 16px;
        border-radius: 4px;
        display: inline-block;
        text-transform: uppercase;
      }

      .caution-text {
        margin: 18px 0 0 0;
        font-weight: 700;
        font-size: 24px;
        color: #F7F4EC;
        line-height: 1.4;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s12"
      data-width="1080"
      data-height="1920"
      data-duration="12.44"
    >
      <!-- Persistent Bottom Bar -->
      <div class="brand-bottom-bar"></div>

      <!-- SHOT 1: 0s to 6.08s -->
      <section id="shot-1" class="clip" data-start="0" data-duration="6.08">
        <div id="shot1-card" class="card-scene">
          <!-- Meta Header -->
          <div class="meta-header">
            <div class="tag-plate-ink">HỒ SƠ FLYDUBAI FZ1073</div>
            <div class="tag-plate-orange">ĐỐI CHIẾU SỰ THẬT</div>
          </div>

          <!-- Split Image Visual (img-13) -->
          <div class="media-frame" style="height: 710px">
            <img
              id="shot1-img"
              class="media-img"
              src="assets/img-13-pilot-arrested-vs-hero-headlines.jpg"
              alt="Phi công bị áp giải đối chiếu tít báo"
            />

            <!-- Top Left Status Overlay: HAI LUỒNG THÔNG TIN -->
            <div id="shot1-badge" class="status-badge" style="top: 30px; left: 30px">
              <svg
                id="shot1-scale-icon"
                viewBox="0 0 100 100"
                width="44"
                height="44"
                fill="none"
                stroke="#FF6A1A"
                stroke-width="6"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path class="draw-path" d="M 50 15 L 50 85" />
                <path class="draw-path" d="M 28 85 L 72 85" />
                <path class="draw-path" d="M 18 30 L 82 30" />
                <path class="draw-path" d="M 18 30 L 10 58" />
                <path class="draw-path" d="M 18 30 L 26 58" />
                <path class="draw-path" d="M 6 58 Q 18 66 30 58 Z" />
                <path class="draw-path" d="M 82 30 L 74 58" />
                <path class="draw-path" d="M 82 30 L 90 58" />
                <path class="draw-path" d="M 70 58 Q 82 66 94 58 Z" />
              </svg>
              <span class="status-badge-text">HAI LUỒNG THÔNG TIN</span>
            </div>

            <!-- Bottom Right Stamp: ĐANG ĐIỀU TRA (hoàn toàn không đè lên status badge) -->
            <div id="stamp-investigating" class="stamp-badge stamp-investigating">
              ĐANG ĐIỀU TRA
            </div>
          </div>

          <!-- Dual Column Split -->
          <div class="split-container">
            <div id="tag-israel" class="split-box">
              <div class="split-source">PHÍA ISRAEL</div>
              <p class="split-body">Cho rằng cơ phó có chủ đích làm rơi máy bay</p>
            </div>
            <div id="tag-flydubai" class="split-box">
              <div class="split-source">HÃNG FLYDUBAI</div>
              <p class="split-body">Thông cáo nguyên nhân và động cơ chưa xác định</p>
            </div>
          </div>
        </div>
      </section>

      <!-- SHOT 2: 6.08s to 12.44s -->
      <section id="shot-2" class="clip" data-start="6.08" data-duration="6.36">
        <div id="shot2-card" class="card-scene">
          <!-- Meta Header -->
          <div class="meta-header">
            <div class="tag-plate-ink">BẢO LƯU PHÁP LÝ</div>
            <div class="tag-plate-orange">XÁC MINH HIỆN TRƯỜNG</div>
          </div>

          <!-- Document / Evidence Image Visual (img-16) -->
          <div class="media-frame" style="height: 570px">
            <img
              id="shot2-img"
              class="media-img"
              src="assets/img-16-police-escort-injured-victim.jpg"
              alt="Cảnh sát hộ tống nạn nhân"
            />

            <!-- Top Left Status Overlay: CHỜ KẾT QUẢ ĐIỀU TRA -->
            <div id="shot2-badge" class="status-badge" style="top: 30px; left: 30px">
              <svg
                id="shot2-doc-icon"
                viewBox="0 0 100 100"
                width="44"
                height="44"
                fill="none"
                stroke="#FF6A1A"
                stroke-width="6"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path class="draw-path" d="M 25 15 L 62 15 L 75 28 L 75 85 L 25 85 Z" />
                <path class="draw-path" d="M 62 15 L 62 28 L 75 28" />
                <path class="draw-path" d="M 36 44 L 64 44" />
                <path class="draw-path" d="M 36 56 L 64 56" />
                <path class="draw-path" d="M 36 68 L 54 68" />
              </svg>
              <span class="status-badge-text">CHỜ KẾT QUẢ ĐIỀU TRA</span>
            </div>

            <!-- Bottom Right Stamp: CHƯA KẾT LUẬN -->
            <div id="stamp-legal" class="stamp-badge stamp-legal">
              CHƯA KẾT LUẬN
            </div>
          </div>

          <!-- Caution Callout Card -->
          <div id="shot2-punch" class="caution-card">
            <h2 class="caution-headline">CHƯA THỂ COI LÀ KẾT LUẬN CUỐI CÙNG</h2>
            <div class="caution-highlight">CẦN KẾT LUẬN BẰNG CHỨNG CỨ ĐỘC LẬP</div>
            <p class="caution-text">
              Những nhận định ban đầu từ các bên vẫn đang trong quá trình đối chất và điều tra chính thức.
            </p>
          </div>
        </div>
      </section>
    </div>

    <script>
      // Setup progressive SVG path draws
      document.querySelectorAll(".draw-path").forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
      });

      // Master Paused Timeline
      const tl = gsap.timeline({ paused: true });

      // ==========================================
      // SHOT 1 ANIMATION (0.00s - 6.08s)
      // ==========================================
      // Camera motion: pan-right across split image
      tl.fromTo(
        "#shot1-img",
        { x: -30, scale: 1.08 },
        { x: 30, scale: 1.08, duration: 6.08, ease: "none" },
        0
      );

      // Peel entrance for Shot 1 card
      tl.fromTo(
        "#shot1-card",
        { opacity: 0, y: 50, rotation: -2 },
        { opacity: 1, y: 0, rotation: 0, duration: 0.7, ease: "power3.out" },
        0.15
      );

      // Overlay at 1.08s (105000ms in master video): HAI LUỒNG THÔNG TIN badge
      tl.fromTo(
        "#shot1-badge",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.08
      );

      // Scale icon SVG path draw
      tl.to(
        "#shot1-scale-icon .draw-path",
        { strokeDashoffset: 0, duration: 0.7, ease: "power2.out", stagger: 0.05 },
        1.15
      );

      // Split information tags entry
      tl.fromTo(
        "#tag-israel",
        { x: -40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.5
      );
      tl.fromTo(
        "#tag-flydubai",
        { x: 40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.65
      );

      // Rubber stamp impact: ĐANG ĐIỀU TRA (đáp xuống góc dưới phải của khung ảnh)
      tl.fromTo(
        "#stamp-investigating",
        { scale: 1.8, opacity: 0, rotation: 15 },
        { scale: 1, opacity: 1, rotation: -6, duration: 0.35, ease: "power4.out" },
        2.4
      );

      // ==========================================
      // SHOT 2 ANIMATION (6.08s - 12.44s)
      // ==========================================
      // Camera motion: zoom-in slowly on victim escort photo
      tl.fromTo(
        "#shot2-img",
        { scale: 1.02 },
        { scale: 1.14, duration: 6.36, ease: "none" },
        6.08
      );

      // Card entrance (cut transition settle)
      tl.fromTo(
        "#shot2-card",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        6.08
      );

      // Overlay at 7.58s (111500ms in master video): CHỜ KẾT QUẢ ĐIỀU TRA badge
      tl.fromTo(
        "#shot2-badge",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        7.58
      );

      // Doc icon SVG path draw
      tl.to(
        "#shot2-doc-icon .draw-path",
        { strokeDashoffset: 0, duration: 0.7, ease: "power2.out", stagger: 0.06 },
        7.65
      );

      // Caution punch card reveal
      tl.fromTo(
        "#shot2-punch",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        8.2
      );

      // Stamp impact: CHƯA KẾT LUẬN (đáp xuống góc dưới phải của khung ảnh)
      tl.fromTo(
        "#stamp-legal",
        { scale: 1.7, opacity: 0, rotation: -16 },
        { scale: 1, opacity: 1, rotation: 6, duration: 0.35, ease: "power4.out" },
        8.9
      );

      // Register master timeline on window.__timelines
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s12"] = tl;
    </script>
  
    </template>
  </body>
</html>
