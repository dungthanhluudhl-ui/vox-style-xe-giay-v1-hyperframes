    <div
      id="root"
      data-composition-id="scene-s03"

    >
      <!-- Base Shot S03-1: Background photo with Ken Burns -->
      <section
        id="shot-s03-1"
        class="clip"
        data-start="0"
        data-duration="9.74"

      >
        <!-- Document Dossier Tag at Top Safe Zone -->

          <span class="doc-header-text">HỒ SƠ BÁO CHÍ // 30.09.2026</span>
        </div>

        <!-- Document Frame wrapping img-04 -->
        <div class="doc-card-frame" id="poster-frame">
          <div class="poster-viewport" id="poster-viewport">
            <img
              id="poster-img"
              class="poster-img"
              src="assets/img-04-flight-fz1073-missing-airplane-poster.jpg"
              alt="Flydubai FZ1073 Poster"
            />
          </div>
        </div>
      </section>

      <!-- Overlay 1: Label "HỒ SƠ FZ1073" (0.74s -> 3.44s) -->
      <div
        id="overlay-1"
        class="clip"
        data-start="0.74"
        data-duration="2.7"
        data-track-index="1"
      >
        <div class="overlay-dossier-wrap" id="dossier-card">
          <div class="dossier-box">
            <div class="dossier-badge">TÀI LIỆU SỰ CỐ</div>

      <div

                    id="route-line"

                  />
                  <path
                    d="M 150 10 L 168 18 L 150 26 Z"

                  />
                </svg>

      <!-- Overlay 3 & 4: Punch-phrase "170+ HÀNH KHÁCH" + Crowd Icon (7.74s -> 9.74s) -->
      <div
        id="overlay-3"
        class="clip"
        data-start="7.74"
        data-duration="2.0"
        data-track-index="3"

        <div class="overlay-passenger-wrap" id="passenger-wrap">
          <div class="passenger-card">
            <div class="passenger-info">
              <div class="passenger-badge">SINH MẠNG TRÊN KHOANG</div>
              <div class="passenger-count-row">
                <span class="passenger-num" id="counter-val">0</span>
                <span class="passenger-plus">+</span>
                <span class="passenger-label">HÀNH KHÁCH</span>
              </div>

            <div class="crowd-icon-box">
              <svg class="crowd-svg" viewBox="0 0 100 80">

                <path id="p1-body" d="M 32 68 C 32 46, 68 46, 68 68" />
                <!-- Person 2 (Left) -->
                <circle id="p2-head" cx="24" cy="28" r="8" />
                <path id="p2-body" d="M 10 70 C 10 52, 38 52, 38 70" />
                <!-- Person 3 (Right) -->
                <circle id="p3-head" cx="76" cy="28" r="8" />

      <div id="bottom-brand-bar"></div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Scene entrance: Peel effect on the poster frame
      tl.fromTo(
        "#poster-frame",
        {
          clipPath: "polygon(0 0, 0 0, 0 100%, 0 100%)",
          opacity: 0.9,
        },
        {
          clipPath: "polygon(0 0, 100% 0, 100% 100%, 0 100%)",
          opacity: 1,
          duration: 0.85,
          ease: "power2.out",
        },
        0.05
      );

      // Top meta tag fade in
      tl.fromTo(
        "#doc-meta-tag",
        { y: -20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.3
      );

      // Continuous Ken Burns zoom (1.0x -> 1.1x) across 9.74s
      tl.fromTo(
        "#poster-img",
        { scale: 1.0, y: 0 },
        { scale: 1.1, y: -24, duration: 9.74, ease: "none" },
        0
      );

      // 2. Overlay 1: "HỒ SƠ FZ1073" (appears at 0.74s, holds, leaves before 3.44s)
      tl.fromTo(
        "#dossier-card",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.74
      );
      tl.to(
        "#dossier-card",
        { y: -20, opacity: 0, duration: 0.35, ease: "power2.in" },
        3.05
      );

      // 3. Overlay 2: "DUBAI → TEL AVIV" (appears at 4.94s, holds, leaves before 7.34s)
      tl.fromTo(
        "#route-wrap",
        { scale: 0.92, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        4.94
      );
      tl.to(
        "#route-wrap",
        { opacity: 0, scale: 0.96, duration: 0.3, ease: "power2.in" },
        7.04
      );

      // 4. Overlay 3 & 4: "170+ HÀNH KHÁCH" + Crowd Icon (appears at 7.74s)
      tl.fromTo(
        "#passenger-wrap",
        { scale: 0.88, opacity: 0, y: 36 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        7.74
      );

      // Deterministic Counter animation: tween innerText directly with snap
      const counterEl = document.getElementById("counter-val");
      tl.to(
        counterEl,
        {
          innerText: 170,
          snap: { innerText: 1 },
          duration: 0.75,
          ease: "power2.out",
        },
        7.85
      );

      // Crowd icon stroke setup and self-drawing
      const crowdPaths = document.querySelectorAll(
        ".crowd-svg path, .crowd-svg circle"
      );
      crowdPaths.forEach((path) => {
        const len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
      });

      tl.to(
        crowdPaths,
        {
          strokeDashoffset: 0,
          duration: 0.65,
          stagger: 0.08,
          ease: "power2.out",
        },
        7.9
      );

      // Register master timeline
      window.__timelines["scene-s03"] = tl;
    </script>
