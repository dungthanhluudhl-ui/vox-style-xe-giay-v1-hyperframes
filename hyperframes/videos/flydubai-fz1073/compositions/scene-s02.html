<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #141414;
        overflow: hidden;
        font-family: "Be Vietnam Pro", sans-serif;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #141414;
      }
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Background video layer */
      #video-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 1;
        background-color: #141414;
      }
      #vid-cockpit {
        position: absolute;
        top: 0;
        left: 0;
        height: 1920px;
        width: 3416px;
        object-fit: cover;
      }

      /* Spotlight vignette overlay (Scene Plan backgroundVariant: spotlight) */
      #vignette-overlay {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: radial-gradient(circle at 50% 50%, rgba(20, 20, 20, 0.1) 30%, rgba(20, 20, 20, 0.78) 100%);
      }

      /* Signature Vox orange bottom bar */
      #vox-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 10px;
        background-color: #FF6A1A;
        z-index: 50;
        pointer-events: none;
      }

      /* Safe area positioner for punch card overlay */
      .card-positioner {
        position: absolute;
        top: 540px;
        left: 80px;
        right: 80px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
      }

      /* Solid punch card */
      .punch-plate {
        background-color: #141414;
        border: 4px solid #FF6A1A;
        border-radius: 24px;
        padding: 52px 40px;
        width: 100%;
        max-width: 860px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
      }
      .q-icon-wrap {
        display: flex;
        justify-content: center;
        margin-bottom: 24px;
      }
      .punch-heading {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .punch-line-1 {
        font-size: 68px;
        font-weight: 900;
        color: #F7F4EC;
        line-height: 1.15;
        letter-spacing: 0.5px;
      }
      .punch-line-2 {
        font-size: 92px;
        font-weight: 900;
        color: #FF6A1A;
        line-height: 1.1;
        letter-spacing: 1px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s02"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.18"
    >
      <!-- Background Video Layer (wrapper has no data-start) -->
      <div id="video-wrapper" data-layout-allow-overflow="true">
        <video
          id="vid-cockpit"
          src="assets/vid-01-airplane-cabin-cockpit-incident.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="7.18"
          data-media-start="15"
          data-track-index="0"
          data-layout-allow-overflow="true"
        ></video>
      </div>

      <!-- Spotlight Vignette Overlay -->
      <div id="vignette-overlay"></div>

      <!-- Punch Phrase & Question Icon (5.12s -> 7.18s) -->
      <section id="punch-clip" class="clip" data-start="5.12" data-duration="2.06" data-track-index="1">
        <div class="card-positioner">
          <div id="punch-box" class="punch-plate">
            <!-- Hand-drawn SVG Question Icon -->
            <div class="q-icon-wrap">
              <svg viewBox="0 0 120 120" width="104" height="104">
                <path
                  id="q-circle"
                  class="draw-path"
                  d="M 60 10 A 50 50 0 1 1 59.99 10"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="5"
                  stroke-linecap="round"
                />
                <path
                  id="q-hook"
                  class="draw-path"
                  d="M 44 42 C 44 26, 76 26, 76 44 C 76 56, 60 60, 60 72"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <circle id="q-dot" cx="60" cy="88" r="5.5" fill="#FF6A1A" />
              </svg>
            </div>

            <!-- Punch Phrase Text -->
            <div class="punch-heading">
              <div id="punch-l1" class="punch-line-1 hf-text-light">AI GIỮ</div>
              <div id="punch-l2" class="punch-line-2">TAY LÁI?</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Fixed Signature Bottom Bar -->
      <div id="vox-bottom-bar"></div>
    </div>

    <script>
      // Setup: prepare measured lengths for progressive SVG draw paths
      const qCircle = document.getElementById("q-circle");
      const qHook = document.getElementById("q-hook");
      const lenCircle = qCircle.getTotalLength();
      const lenHook = qHook.getTotalLength();

      qCircle.style.strokeDasharray = lenCircle + "";
      qCircle.style.strokeDashoffset = lenCircle + "";
      qHook.style.strokeDasharray = lenHook + "";
      qHook.style.strokeDashoffset = lenHook + "";

      // Master paused timeline for HyperFrames deterministic seeking
      const tl = gsap.timeline({ paused: true });

      // 1. Camera Motion & Punch entrance on Video
      // Punch entrance: fast settle from scale 1.06 to 1.0
      tl.fromTo(
        "#video-wrapper",
        { scale: 1.06 },
        { scale: 1.0, duration: 0.55, ease: "power3.out" },
        0
      );
      // Pan video gently to the right across the 7.18s scene duration
      tl.fromTo(
        "#vid-cockpit",
        { x: -1168 },
        { x: -1280, duration: 7.18, ease: "none" },
        0
      );

      // 2. Overlay: Punch Card Entrance (at 5.12s)
      tl.fromTo(
        "#punch-box",
        { scale: 0.82, opacity: 0, y: 32 },
        { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
        5.12
      );

      // Question icon progressive draw
      tl.fromTo(
        "#q-circle",
        { strokeDashoffset: lenCircle },
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        5.2
      );
      tl.fromTo(
        "#q-hook",
        { strokeDashoffset: lenHook },
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        5.35
      );
      tl.fromTo(
        "#q-dot",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.2, ease: "power2.out", transformOrigin: "60px 88px" },
        5.65
      );

      // Punch phrase text reveal
      tl.fromTo(
        "#punch-l1",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        5.25
      );
      tl.fromTo(
        "#punch-l2",
        { opacity: 0, scale: 0.9, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        5.4
      );

      // Register timeline to HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s02"] = tl;
    </script>
  
    </template>
  </body>
</html>
