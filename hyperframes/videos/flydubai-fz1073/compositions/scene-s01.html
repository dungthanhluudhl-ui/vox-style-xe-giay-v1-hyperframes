<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Safe contrast utility classes */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
      .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
      .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
      .hf-plate-paper { background-color: #E7E3D9; color: #141414; }

      /* Background Grid: 84px square cells */
      .grid-layer {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        pointer-events: none;
      }

      /* Signature bottom orange bar */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 8px;
        background-color: #FF6A1A;
        z-index: 50;
      }

      /* Hero Media Layer */
      #hero-photo-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #E7E3D9;
      }

      .hero-img-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 40%;
        display: block;
        transform-origin: 50% 40%;
      }

      .photo-frame-border {
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 100px rgba(20, 20, 20, 0.35);
        pointer-events: none;
      }

      /* Overlay Layout Wrappers */
      .overlay-clip-wrap {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
      }

      /* Overlay 1: "NỖI LO QUEN THUỘC" + Warning Icon */
      #worries-card {
        margin-top: 240px;
        background-color: #141414;
        border-top: 6px solid #FF6A1A;
        border-radius: 14px;
        padding: 22px 32px;
        box-shadow: 0 18px 46px rgba(0, 0, 0, 0.5), 0 4px 12px rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        gap: 22px;
        max-width: 920px;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .warning-icon-box {
        flex-shrink: 0;
        width: 76px;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .worries-text-box {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .worries-tag {
        display: inline-block;
        align-self: flex-start;
        background-color: #FF6A1A;
        color: #141414;
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 1.5px;
        padding: 3px 10px;
        border-radius: 4px;
        text-transform: uppercase;
      }

      .worries-headline {
        font-size: 48px;
        font-weight: 900;
        line-height: 1.15;
        color: #F7F4EC;
        margin: 0;
        letter-spacing: -0.5px;
        text-transform: uppercase;
      }

      /* Overlay 2: Ban Icon Stamp */
      #ban-card {
        margin-top: 260px;
        background-color: #141414;
        border: 4px solid #FF6A1A;
        border-radius: 20px;
        padding: 30px 44px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .ban-icon-box {
        width: 140px;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* SVG Icon Styles */
      .svg-icon {
        display: block;
        overflow: visible;
      }

      .draw-stroke-orange {
        fill: none;
        stroke: #FF6A1A;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .draw-dot-orange {
        fill: #FF6A1A;
        stroke: none;
        transform-origin: 38px 57px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s01"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="5.08"
    >
      <!-- Base Background & Media Clip -->
      <section id="shot-bg" class="clip" data-start="0" data-duration="5.08">
        <div class="grid-layer"></div>
        <div id="hero-photo-wrap">
          <div class="hero-img-container">
            <img
              id="hero-img"
              src="assets/img-01-safe-ascent-aviation-poster.jpg"
              alt="Safe Ascent Aviation Poster"
            />
            <div class="photo-frame-border"></div>
          </div>
        </div>
        <div class="bottom-brand-bar"></div>
      </section>

      <!-- Overlay 1 Clip: Label "NỖI LO QUEN THUỘC" & Icon "warning" (1.4s -> 3.5s) -->
      <section id="worries-clip" class="clip" data-start="1.4" data-duration="2.1">
        <div class="overlay-clip-wrap">
          <div id="worries-card">
            <div class="warning-icon-box">
              <svg class="svg-icon" viewBox="0 0 76 76" width="76" height="76">
                <!-- Triangle path -->
                <path
                  id="warning-triangle"
                  class="draw-stroke-orange"
                  stroke-width="6"
                  d="M 38 12 L 68 64 L 8 64 Z"
                />
                <!-- Exclamation vertical stroke -->
                <path
                  id="warning-bar"
                  class="draw-stroke-orange"
                  stroke-width="6"
                  d="M 38 28 L 38 48"
                />
                <!-- Exclamation dot -->
                <circle
                  id="warning-dot"
                  class="draw-dot-orange"
                  cx="38"
                  cy="57"
                  r="3.5"
                />
              </svg>
            </div>
            <div class="worries-text-box">
              <span class="worries-tag">KỊCH BẢN THƯỜNG THẤY</span>
              <h1 class="worries-headline">NỖI LO QUEN THUỘC</h1>
            </div>
          </div>
        </div>
      </section>

      <!-- Overlay 2 Clip: Icon "ban" (3.8s -> 5.08s) -->
      <section id="ban-clip" class="clip" data-start="3.8" data-duration="1.28">
        <div class="overlay-clip-wrap">
          <div id="ban-card">
            <div class="ban-icon-box">
              <svg class="svg-icon" viewBox="0 0 140 140" width="140" height="140">
                <!-- Circle outer ring -->
                <circle
                  id="ban-circle"
                  class="draw-stroke-orange"
                  stroke-width="12"
                  cx="70"
                  cy="70"
                  r="54"
                  style="transform-origin: 70px 70px; transform: rotate(-90deg);"
                />
                <!-- Diagonal slash -->
                <path
                  id="ban-slash"
                  class="draw-stroke-orange"
                  stroke-width="12"
                  d="M 32 32 L 108 108"
                />
              </svg>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      // 1. Prepare SVG stroke lengths for seek-deterministic path-draw
      const warningTriangle = document.getElementById("warning-triangle");
      const warningBar = document.getElementById("warning-bar");
      const banCircle = document.getElementById("ban-circle");
      const banSlash = document.getElementById("ban-slash");

      if (warningTriangle) {
        const len = (warningTriangle.getTotalLength && warningTriangle.getTotalLength()) || 185;
        warningTriangle.style.strokeDasharray = len + "";
        warningTriangle.style.strokeDashoffset = len + "";
      }
      if (warningBar) {
        const len = (warningBar.getTotalLength && warningBar.getTotalLength()) || 22;
        warningBar.style.strokeDasharray = len + "";
        warningBar.style.strokeDashoffset = len + "";
      }
      if (banCircle) {
        const len = (banCircle.getTotalLength && banCircle.getTotalLength()) || 340;
        banCircle.style.strokeDasharray = len + "";
        banCircle.style.strokeDashoffset = len + "";
      }
      if (banSlash) {
        const len = (banSlash.getTotalLength && banSlash.getTotalLength()) || 108;
        banSlash.style.strokeDasharray = len + "";
        banSlash.style.strokeDashoffset = len + "";
      }

      // 2. Build one master paused timeline
      const tl = gsap.timeline({ paused: true });

      // Shot 1 entrance: rise transition (0.0s -> 0.7s)
      tl.fromTo(
        "#hero-photo-wrap",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0
      );

      // Ken Burns slow zoom: 1.0x -> 1.08x toward aircraft ascent (0.0s -> 5.08s)
      tl.fromTo(
        "#hero-img",
        { scale: 1.0 },
        { scale: 1.08, duration: 5.08, ease: "none" },
        0
      );

      // Overlay 1: "NỖI LO QUEN THUỘC" spring-pop entrance at 1.4s
      tl.fromTo(
        "#worries-card",
        { scale: 0.88, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.4
      );

      // Warning icon SVG progressive draw
      tl.to(
        "#warning-triangle",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        1.45
      );
      tl.to(
        "#warning-bar",
        { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
        1.75
      );
      tl.fromTo(
        "#warning-dot",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.2, ease: "power3.out" },
        1.95
      );

      // Overlay 1 exit: smooth fade & lift before clip duration ends (3.25s)
      tl.to(
        "#worries-card",
        { opacity: 0, y: -25, scale: 0.95, duration: 0.25, ease: "power2.in" },
        3.25
      );

      // Overlay 2: "ban" stamp punch entrance at 3.8s
      tl.fromTo(
        "#ban-card",
        { scale: 1.3, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        3.8
      );

      // Ban icon SVG progressive draw
      tl.to(
        "#ban-circle",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        3.85
      );
      tl.to(
        "#ban-slash",
        { strokeDashoffset: 0, duration: 0.25, ease: "power3.out" },
        4.05
      );

      // 3. Register timeline for HyperFrames deterministic rendering
      window.__timelines["scene-s01"] = tl;
    </script>
  
    </template>
  </body>
</html>
