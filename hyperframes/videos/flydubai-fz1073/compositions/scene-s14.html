    <!-- GSAP seekable animation logic -->
    <script>
      // Prepare SVG path drawing strokeDasharray & strokeDashoffset synchronously
      document.querySelectorAll(".draw-path").forEach((path) => {
        const len = Math.ceil(path.getTotalLength()) + 4;
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
      });

      // Construct master paused timeline
      const tl = gsap.timeline({ paused: true });

      // ==========================================
      // SHOT 1 CHOREOGRAPHY (0.0s -> 5.69s)
      // ==========================================
      // 3D Flip entrance of dossier folder (hoàn tất tại 0.32s trước khi overlay xuất hiện)
      tl.fromTo(
        "#s1-folder",
        { rotationY: -45, opacity: 0, scale: 0.9 },
        { rotationY: 0, opacity: 1, scale: 1, duration: 0.32, ease: "power3.out" },
        0.0
      );

      // Photo cutout entrance
      tl.fromTo(
        "#s1-photo",
        { scale: 0.3, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        0.15
      );

      // Document detail rows stagger
      tl.fromTo(
        ".s1-row",
        { x: -25, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.35, stagger: 0.05, ease: "power2.out" },
        0.22
      );

      // Overlay 1: KỸ SƯ BAY CALLOWAY + doc icon (độc lập, at 0.39s = 123200ms)
