      .hf-text-light { color: #F7F4EC; }

      .conclusion-subline {

        font-size: 32px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-top: 14px;
      }

      /* SVG Icon Styles */
      .icon-box {
        margin-bottom: 16px;
      }
      .draw-path {
        fill: none;
        stroke: #FF6A1A;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s19"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="11.36"
    >
      <!-- Persistent Brand Bottom Strip -->
      <div class="bottom-brand-bar"></div>

      <!-- ================= SHOT 1 (0.00s - 5.76s) ================= -->

        <div class="poster-viewport" id="s1-viewport">

            </svg>

        </div>
      </div>

      <!-- Shot 1 - Overlay 2: MỞ CỬA → HỖ TRỢ (atMs 175300 -> rel: 4.06s, holdMs: 1600 -> 1.60s) -->
      <div id="s1-ov-2" class="clip overlay-clip" data-start="4.06" data-duration="1.60">

          <div class="card-tag">BẬC THANG CƠ HỘI • PHẦN 1</div>

    <script>
      // Single deterministic paused GSAP timeline
      const tl = gsap.timeline({ paused: true });

      // Path setup for SVG drawing animations
      document.querySelectorAll(".draw-path").forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = `${len}`;
        p.style.strokeDashoffset = `${len}`;
      });

      // ----------------- SHOT 1 MOTION (0.00s -> 5.76s) -----------------
      // Transition In: "rise"
      tl.fromTo(
        "#s1-viewport",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
        0
      );

      // Camera Motion: Slow cinematic zoom-in onto the crowd
      tl.fromTo(
        "#s1-img",
        { scale: 1.02 },
        { scale: 1.15, duration: 5.76, ease: "none" },
        0
      );

      // Overlay 1.1: PHẢN ỨNG TẬP THỂ (1.26s -> 3.46s)
      tl.fromTo(
        "#card-crowd",
        { scale: 0.88, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.26
      );
      tl.to(
        "#card-crowd .draw-path",
        { strokeDashoffset: 0, duration: 0.8, ease: "power2.out", stagger: 0.08 },
        1.34
      );
      tl.to(
        "#card-crowd",
        { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" },
        3.16
      );

      // Overlay 1.2: MỞ CỬA → HỖ TRỢ (4.06s -> 5.66s)
      tl.fromTo(
        "#card-flow-1",
        { scale: 0.88, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        4.06
      );
      tl.to(
        "#card-flow-1",
        { opacity: 0, duration: 0.25, ease: "power2.in" },
        5.40
      );

      // ----------------- SHOT 2 MOTION (5.76s -> 11.36s) -----------------
      // Transition In: "cut" (appears at 5.76s)
      // Camera Motion: Pan upward toward the airliner ascending into the sky
      tl.fromTo(
        "#s2-img",
        { scale: 1.12, x: 25, y: 30 },
        { scale: 1.24, x: -25, y: -45, duration: 5.60, ease: "none" },
        5.76
      );

      // Overlay 2.1: KHỐNG CHẾ → GIỮ LÁI (5.96s -> 7.96s)
      tl.fromTo(
        "#card-flow-2",
        { scale: 0.88, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        5.96
      );
      tl.to(
        "#card-flow-2",
        { opacity: 0, duration: 0.3, ease: "power2.in" },
        7.66
      );

      // Overlay 2.2: PUNCH PHRASE "MUA THÊM CƠ HỘI" + Icon rise (8.96s -> 11.16s)
      tl.fromTo(
        "#card-conclusion",
        { scale: 0.85, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        8.96
      );
      tl.to(
        "#rise-stair-path",
        { strokeDashoffset: 0, duration: 0.75, ease: "power2.out" },
        9.10
      );
      tl.to(
        "#rise-arrow-head",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        9.65
      );
      tl.to(
        "#card-conclusion",
        { opacity: 0, scale: 0.96, duration: 0.35, ease: "power2.in" },
        10.95
      );

      // Register the master timeline
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s19"] = tl;
    </script>
