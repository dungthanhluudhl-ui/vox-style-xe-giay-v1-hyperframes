<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * { box-sizing: border-box; }

      html, body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: #F5F0E4;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      .scene {
        background: #F5F0E4;
      }

      .header {
        position: absolute;
        top: 174px;
        left: 76px;
        right: 76px;
      }

      .eyebrow {
        display: inline-block;
        padding: 10px 17px;
        background: #141414;
        color: #F7F4EC;
        font-size: 23px;
        font-weight: 900;
        letter-spacing: 0.075em;
      }

      .header h1 {
        margin: 24px 0 0;
        font-size: 69px;
        font-weight: 900;
        line-height: 1.16;
        letter-spacing: -0.035em;
      }

      .photo-frame {
        position: absolute;
        top: 356px;
        left: 115px;
        width: 850px;
        height: 762px;
        overflow: hidden;
        background: #E7E3D9;
        border: 9px solid #141414;
      }

      .photo-frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 55%;
      }

      .photo-rule {
        position: absolute;
        top: 1137px;
        left: 115px;
        width: 850px;
        height: 8px;
        background: #FF6A1A;
      }

      .route-panel {
        position: absolute;
        top: 1170px;
        left: 76px;
        width: 928px;
        height: 210px;
        padding: 17px 22px;
        border: 3px solid #141414;
        background: #E7E3D9;
      }

      .route-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 32px;
      }

      .route-heading strong {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.06em;
      }

      .date {
        padding: 5px 10px;
        background: #FF6A1A;
        color: #141414;
        font-size: 19px;
        font-weight: 900;
      }

      .next-label {
        position: absolute;
        top: 15px;
        right: 300px;
        padding: 6px 12px;
        background: #141414;
        color: #F7F4EC;
        font-size: 19px;
        font-weight: 900;
        letter-spacing: 0.025em;
        opacity: 0;
      }

      .routes {
        display: block;
        width: 878px;
        height: 140px;
        margin-top: 9px;
        overflow: visible;
      }

      .road {
        stroke: rgba(20, 20, 20, 0.32);
        stroke-width: 2;
        fill: none;
      }

      .first-route {
        stroke: #141414;
        stroke-width: 9;
        stroke-linecap: round;
        fill: none;
      }

      .later-route {
        stroke: #141414;
        stroke-width: 7;
        stroke-linecap: round;
        fill: none;
      }

      .checkpoint {
        stroke: #141414;
        stroke-width: 4;
      }

      .stop {
        fill: #FF6A1A;
        stroke: #141414;
        stroke-width: 2;
        opacity: 0;
      }

      .ban-icon {
        position: absolute;
        top: 1210px;
        left: 492px;
        width: 90px;
        height: 90px;
        opacity: 0;
      }

      .ban-icon circle,
      .ban-icon path {
        fill: none;
        stroke: #141414;
        stroke-width: 8;
        stroke-linecap: round;
      }

      .bottom-bar {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 12px;
        background: #FF6A1A;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s03"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="9.76"
    >
      <section id="scene-s03" class="clip scene" data-start="0" data-duration="9.76" data-track-index="0">
        <header class="header">
          <span class="eyebrow">CHECKPOINT CHARLIE</span>
          <h1>MỘT LƯỢT ĐI QUA.</h1>
        </header>

        <div class="photo-frame" data-layout-allow-overflow>
          <img
            id="checkpoint-photo"
            src="assets/img-01-border-checkpoint-passport-inspection.jpg"
            alt=""
          />
        </div>
        <div class="photo-rule" aria-hidden="true"></div>

        <div class="route-panel">
          <div class="route-heading">
            <strong>ĐIỂM KIỂM SOÁT</strong>
            <span class="date" id="date">25.10.1961</span>
          </div>
          <div class="next-label" id="next-label">LƯỢT KẾ TIẾP</div>

          <svg class="routes" viewBox="0 0 878 140" aria-hidden="true">
            <path class="road" d="M 18 42 H 850" />
            <path class="road" d="M 18 76 H 850" />
            <path class="road" d="M 18 110 H 850" />
            <path class="checkpoint" d="M 482 17 V 132" />

            <path id="first-route" class="first-route" d="M 32 42 H 822" />
            <path id="later-route-1" class="later-route" d="M 32 42 H 460" />
            <path id="later-route-2" class="later-route" d="M 32 76 H 460" />
            <path id="later-route-3" class="later-route" d="M 32 110 H 460" />

            <rect id="stop-1" class="stop" x="452" y="31" width="18" height="22" />
            <rect id="stop-2" class="stop" x="452" y="65" width="18" height="22" />
            <rect id="stop-3" class="stop" x="452" y="99" width="18" height="22" />
          </svg>
        </div>

        <svg class="ban-icon" id="ban-icon" viewBox="0 0 100 100" aria-hidden="true">
          <circle id="ban-circle" cx="50" cy="50" r="38" />
          <path id="ban-slash" d="M 23 77 L 77 23" />
        </svg>
      </section>

      <div class="bottom-bar" aria-hidden="true"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      const firstRoute = document.getElementById("first-route");
      const laterRoutes = [
        document.getElementById("later-route-1"),
        document.getElementById("later-route-2"),
        document.getElementById("later-route-3")
      ];
      const banCircle = document.getElementById("ban-circle");
      const banSlash = document.getElementById("ban-slash");

      function preparePath(path) {
        const length = path.getTotalLength();
        path.style.strokeDasharray = String(length);
        path.style.strokeDashoffset = String(length);
        return length;
      }

      const firstLength = preparePath(firstRoute);
      const laterLengths = laterRoutes.map(preparePath);
      const circleLength = preparePath(banCircle);
      const slashLength = preparePath(banSlash);

      tl.fromTo(
        ".header",
        { y: 34, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0
      );
      tl.fromTo(
        ".photo-frame",
        { y: 65, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
        0.1
      );
      tl.fromTo(
        ".route-panel",
        { y: 32, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.45
      );

      tl.fromTo(
        "#checkpoint-photo",
        { x: 30, scale: 1.12 },
        { x: -30, scale: 1.12, duration: 9.76, ease: "none" },
        0
      );

      tl.fromTo(
        firstRoute,
        { strokeDashoffset: firstLength, opacity: 1 },
        { strokeDashoffset: 0, opacity: 1, duration: 1.12, ease: "power2.out" },
        1.28
      );
      tl.to(firstRoute, { opacity: 0, duration: 0.25, ease: "power1.out" }, 3.12);

      tl.fromTo(
        "#next-label",
        { y: 10, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" },
        3.59
      );
      tl.to("#next-label", { opacity: 0, duration: 0.25, ease: "power1.out" }, 5.39);

      [5.21, 6.37, 7.53].forEach((start, index) => {
        tl.fromTo(
          laterRoutes[index],
          { strokeDashoffset: laterLengths[index], opacity: 1 },
          { strokeDashoffset: 0, opacity: 1, duration: 0.88, ease: "power2.out" },
          start
        );
        tl.to(
          document.getElementById("stop-" + (index + 1)),
          { opacity: 1, duration: 0.16, ease: "power1.out" },
          start + 0.75
        );
      });

      tl.to("#ban-icon", { opacity: 1, duration: 0.12, ease: "power1.out" }, 9.11);
      tl.fromTo(
        banCircle,
        { strokeDashoffset: circleLength },
        { strokeDashoffset: 0, duration: 0.37, ease: "power2.out" },
        9.11
      );
      tl.fromTo(
        banSlash,
        { strokeDashoffset: slashLength },
        { strokeDashoffset: 0, duration: 0.24, ease: "power2.out" },
        9.43
      );

      window.__timelines["scene-s03"] = tl;
    </script>
  
    </template>
  </body>
</html>
