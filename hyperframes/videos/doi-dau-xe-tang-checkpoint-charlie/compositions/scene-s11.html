      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: #F7F4EC;
    }

    .clip { position: absolute; inset: 0; }

    .spotlight {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 70% 55% at 50% 46%,
        #68645b 0%,
        #383631 55%,
        #141414 100%
      );
    }

    .photo-stage {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 160px;
    }

    .photo {
      display: block;
      width: 760px;
      height: auto;
      max-height: 1362px;
      object-fit: contain;
      transform-origin: 50% 50%;
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.48);
    }

    .edge-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        ellipse 57% 45% at 50% 46%,
        transparent 0%,
        rgba(20, 20, 20, 0.10) 53%,
        rgba(20, 20, 20, 0.78) 100%
      );
    }

    .annotation {
      position: absolute;
      left: 160px;
      top: 160px;
      width: 760px;
      height: 1362px;
      pointer-events: none;
    }

    .annotation svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .gap-outline {
      fill: none;
      stroke: #FF6A1A;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 18 12;
    }

    .headline-wrap {
      position: absolute;
      top: 238px;
      left: 70px;
      right: 70px;
      display: flex;
      justify-content: center;
    }

    .headline {
      margin: 0;
      padding: 19px 30px 24px;
      background: #141414;
      color: #F7F4EC;
      font-size: 60px;
      font-weight: 900;
      line-height: 1.34;
      letter-spacing: -1.7px;
      text-align: center;
      white-space: nowrap;
      border-bottom: 8px solid #FF6A1A;
    }

    .warning-wrap {
      position: absolute;
      top: 1110px;
      right: 112px;
    }

    .warning-plate {
      display: grid;
      place-items: center;
      width: 112px;
      height: 112px;
      background: #141414;
      border: 3px solid #FF6A1A;
    }

    .warning-plate svg {
      width: 74px;
      height: 74px;
      overflow: visible;
    }

    .warning-path {
      fill: none;
      stroke: #FF6A1A;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .bottom-bar {
      position: absolute;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      background: #FF6A1A;
    }
  </style>

  <div id="root" data-composition-id="scene-s11" data-start="0" data-width="1080" data-height="1920" data-fps="30" data-duration="6.2">
    <div class="spotlight" aria-hidden="true"></div>

    <section id="standoff-shot" class="clip photo-stage" data-start="0" data-duration="6.2" data-track-index="0">
      <img
        id="standoff-photo"
        class="photo"
        src="assets/img-05-checkpoint-charlie-tank-standoff.jpg"
        alt="Hai xe tăng đối đầu tại Checkpoint Charlie, với khoảng trống giữa hai nòng pháo"
      />
    </section>

    <div id="closing-vignette" class="edge-vignette" aria-hidden="true"></div>

    <section id="gap-annotation" class="clip" data-start="0.79" data-duration="2.89" data-track-index="1">
      <div class="annotation" aria-hidden="true">
        <svg viewBox="0 0 760 1362" xmlns="http://www.w3.org/2000/svg">
          <ellipse id="gap-ring" class="gap-outline" cx="380" cy="672" rx="118" ry="89" />
        </svg>
      </div>
    </section>

    <section id="headline-overlay" class="clip" data-start="1.35" data-duration="4.85" data-track-index="2">
      <div class="headline-wrap">
        <h1 id="closing-headline" class="headline">KHÔNG TIẾNG SÚNG</h1>
      </div>
    </section>

    <section id="warning-overlay" class="clip" data-start="4.38" data-duration="1.82" data-track-index="3">
      <div class="warning-wrap">
        <div id="warning-icon" class="warning-plate" role="img" aria-label="Cảnh báo về ranh giới mong manh giữa hòa bình và chiến tranh">
          <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path id="warning-triangle" class="warning-path" d="M40 8 L74 69 H6 Z" />
            <path id="warning-mark" class="warning-path" d="M40 29 V48 M40 59 V61" />
          </svg>
        </div>
      </div>
    </section>

    <div class="bottom-bar" aria-hidden="true"></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo(
      "#standoff-photo",
      { y: 72, opacity: 0, scale: 1.045 },
      { y: 0, opacity: 1, scale: 1.02, duration: 0.8, ease: "power3.out" },
      0
    );
    tl.to(
      "#standoff-photo",
      { scale: 0.985, duration: 5.35, ease: "sine.inOut" },
      0.8
    );

    const ring = document.getElementById("gap-ring");
    const ringLength = ring.getTotalLength();
    ring.style.strokeDasharray = String(ringLength);
    ring.style.strokeDashoffset = String(ringLength);
    tl.to(
      ring,
      { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" },
      0.79
    );

    tl.fromTo(
      "#closing-headline",
      { y: 34, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
      1.35
    );

    const warningPaths = [
      document.getElementById("warning-triangle"),
      document.getElementById("warning-mark")
    ];
    warningPaths.forEach((path) => {
      const length = path.getTotalLength();
      path.style.strokeDasharray = String(length);
      path.style.strokeDashoffset = String(length);
    });

    tl.fromTo(
      "#warning-icon",
      { y: 24, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" },
      4.38
    );
    tl.to(
      "#warning-triangle",
      { strokeDashoffset: 0, duration: 0.58, ease: "power2.out" },
      4.43
    );
    tl.to(
      "#warning-mark",
      { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
      4.91
    );

    tl.fromTo(
      "#closing-vignette",
      { opacity: 0.38 },
      { opacity: 0.9, duration: 2.1, ease: "sine.inOut" },
      4.05
    );

    window.__timelines["scene-s11"] = tl;
  </script>
