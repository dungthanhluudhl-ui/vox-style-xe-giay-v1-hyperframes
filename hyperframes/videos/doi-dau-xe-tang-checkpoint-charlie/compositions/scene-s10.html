<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Be Vietnam Pro", sans-serif;
      color: #141414;
      background: #E7E3D9;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #E7E3D9;
    }

    .clip { position: absolute; inset: 0; }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(20,20,20,0.32) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(20,20,20,0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }

    .image-shot { z-index: 1; }

    .media-frame,
    .stage-video {
      position: absolute;
      left: 180px;
      top: 260px;
      width: 720px;
      height: 1260px;
      border: 7px solid #141414;
      background: #141414;
    }

    .media-frame { overflow: hidden; }

    .media-frame img,
    .stage-video {
      object-fit: cover;
      object-position: center;
    }

    .media-frame img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .stage-video {
      display: block;
      z-index: 1;
    }

    .flow-overlay,
    .check-overlay,
    .date-overlay,
    .withdrawal-overlay {
      pointer-events: none;
      z-index: 3;
    }

    .date-overlay {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .date-label {
      position: relative;
      top: 155px;
      display: block;
      width: max-content;
      max-width: 900px;
      padding: 14px 27px 17px;
      background: #141414;
      color: #F7F4EC;
      font-size: 55px;
      font-weight: 900;
      line-height: 1.2;
      white-space: nowrap;
    }

    .communication-route,
    .withdrawal-arrows {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: visible;
    }

    .route-path {
      fill: none;
      stroke: #141414;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .route-node {
      fill: #FF6A1A;
      stroke: #141414;
      stroke-width: 5;
    }

    .check-box {
      position: absolute;
      top: 568px;
      right: 86px;
      width: 108px;
      height: 108px;
      display: grid;
      place-items: center;
      background: #141414;
    }

    .check-box svg { width: 76px; height: 76px; }

    .check-path {
      fill: none;
      stroke: #FF6A1A;
      stroke-width: 11;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-outline,
    .arrow-orange {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-outline { stroke: #141414; stroke-width: 20; }
    .arrow-orange { stroke: #FF6A1A; stroke-width: 11; }

    .arrow-head {
      fill: none;
      stroke: #FF6A1A;
      stroke-width: 11;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(3px 3px 0 #141414);
    }

    .bottom-signature {
      position: absolute;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 0;
      height: 13px;
      background: #FF6A1A;
    }
  </style>

  <div id="root" data-composition-id="scene-s10" data-start="0" data-width="1080" data-height="1920" data-fps="30" data-duration="10.84">
    <div class="grid" aria-hidden="true" data-layout-ignore></div>

    <section id="still-shot" class="clip image-shot" data-start="0" data-duration="5.07">
      <div id="still-frame" class="media-frame">
        <img src="assets/img-05-checkpoint-charlie-tank-standoff.jpg" alt="Hai hàng xe tăng đối đầu tại Checkpoint Charlie">
      </div>
    </section>

    <video
      id="withdrawal-video"
      class="stage-video"
      src="assets/vid-02-tanks-standoff-cutout-animation.mp4"
      data-start="5.07"
      data-duration="5.77"
      data-media-start="0"
      muted
      playsinline
    ></video>

    <section id="communication" class="clip flow-overlay" data-start="0.44" data-duration="3.13">
      <svg class="communication-route" viewBox="0 0 1080 1920" aria-hidden="true" data-layout-ignore>
        <path id="route-path" class="route-path" d="M 146 700 L 146 232 L 934 232 L 934 700"></path>
        <circle id="route-left" class="route-node" cx="146" cy="700" r="14"></circle>
        <circle id="route-right" class="route-node" cx="934" cy="700" r="14"></circle>
      </svg>
    </section>

    <section id="resolved" class="clip check-overlay" data-start="2.64" data-duration="2.43">
      <div id="check-box" class="check-box" data-layout-ignore>
        <svg viewBox="0 0 76 76" aria-hidden="true">
          <path id="check-path" class="check-path" d="M 10 39 L 29 56 L 66 17"></path>
        </svg>
      </div>
    </section>

    <section id="date-card" class="clip date-overlay" data-start="5.07" data-duration="2.68">
      <div id="date-label" class="date-label">28/10/1961</div>
    </section>

    <section id="withdrawal-direction" class="clip withdrawal-overlay" data-start="7.56" data-duration="3.28">
      <svg class="withdrawal-arrows" viewBox="0 0 1080 1920" aria-hidden="true" data-layout-ignore>
        <path class="arrow-outline" d="M 515 1210 L 328 1210"></path>
        <path class="arrow-outline" d="M 565 1210 L 752 1210"></path>
        <path id="arrow-left" class="arrow-orange" d="M 515 1210 L 328 1210"></path>
        <path id="arrow-right" class="arrow-orange" d="M 565 1210 L 752 1210"></path>
        <path id="arrow-head-left" class="arrow-head" d="M 358 1182 L 327 1210 L 358 1238"></path>
        <path id="arrow-head-right" class="arrow-head" d="M 722 1182 L 753 1210 L 722 1238"></path>
      </svg>
    </section>

    <div class="bottom-signature" aria-hidden="true" data-layout-ignore></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    const route = document.getElementById("route-path");
    const check = document.getElementById("check-path");
    const leftArrow = document.getElementById("arrow-left");
    const rightArrow = document.getElementById("arrow-right");

    for (const path of [route, check, leftArrow, rightArrow]) {
      const length = path.getTotalLength();
      path.style.strokeDasharray = String(length);
      path.style.strokeDashoffset = String(length);
    }

    tl.fromTo(
      "#still-frame",
      { clipPath: "polygon(0 0, 100% 0, 100% 0, 0 0)" },
      { clipPath: "polygon(0 0, 100% 0, 100% 100%, 0 100%)", duration: 0.72, ease: "power3.out" },
      0
    );

    tl.fromTo(
      "#route-path",
      { strokeDashoffset: route.getTotalLength() },
      { strokeDashoffset: 0, duration: 1.58, ease: "power2.out" },
      0.58
    );
    tl.fromTo(
      "#route-left, #route-right",
      { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
      { scale: 1, opacity: 1, duration: 0.38, stagger: 0.12, ease: "power3.out" },
      1.55
    );

    tl.fromTo(
      "#check-box",
      { scale: 0.8, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      2.64
    );
    tl.fromTo(
      "#check-path",
      { strokeDashoffset: check.getTotalLength() },
      { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
      2.79
    );

    tl.fromTo(
      "#date-label",
      { y: -20, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.44, ease: "power3.out" },
      5.07
    );

    tl.fromTo(
      "#withdrawal-direction .arrow-outline",
      { opacity: 0 },
      { opacity: 1, duration: 0.3, ease: "power2.out" },
      7.56
    );
    tl.fromTo(
      "#arrow-left, #arrow-right",
      { strokeDashoffset: leftArrow.getTotalLength() },
      { strokeDashoffset: 0, duration: 0.86, ease: "power2.out" },
      7.64
    );
    tl.fromTo(
      "#arrow-head-left, #arrow-head-right",
      { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" },
      { opacity: 1, scale: 1, duration: 0.32, ease: "power3.out" },
      8.25
    );

    window.__timelines["scene-s10"] = tl;
  </script>

    </template>
  </body>
</html>
