<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      #scene {
        overflow: hidden;
        background:
          radial-gradient(
            ellipse 82% 59% at 50% 46%,
            rgba(20, 20, 20, 0) 30%,
            rgba(20, 20, 20, 0.28) 100%
          ),
          #e7e3d9;
      }

      #photo-frame {
        position: absolute;
        left: 115px;
        top: 205px;
        width: 850px;
        height: 1290px;
        overflow: hidden;
        background: #141414;
        border: 9px solid #f5f0e4;
        box-shadow: 0 22px 56px rgba(20, 20, 20, 0.27);
      }

      #photo {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 53%;
        transform-origin: 50% 50%;
      }

      .strike-mark {
        position: absolute;
        top: 43%;
        width: 7px;
        height: 114px;
        background: #ff6a1a;
        opacity: 0;
        pointer-events: none;
      }

      #strike-left { left: 0; }
      #strike-right { right: 0; }

      #date {
        inset: auto;
        left: 150px;
        top: 251px;
        width: max-content;
        height: auto;
        z-index: 3;
      }

      #date-inner {
        display: block;
        padding: 13px 25px 16px;
        background: #141414;
        color: #f7f4ec;
        font-size: 43px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: 0.015em;
      }

      #distance {
        inset: auto;
        left: 330px;
        top: 915px;
        width: 420px;
        height: 76px;
        z-index: 3;
      }

      #distance-inner {
        width: 420px;
        height: 76px;
        padding: 12px 20px;
        background: #141414;
      }

      #distance svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      #distance line {
        fill: none;
        stroke: #ff6a1a;
        stroke-width: 5;
        stroke-linecap: square;
      }

      #bottom-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 13px;
        z-index: 10;
        background: #ff6a1a;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s07"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-fps="30"
      data-duration="5.04"
    >
      <section id="scene" class="clip" data-start="0" data-duration="5.04">
        <div id="photo-frame" data-layout-allow-overflow>
          <img
            id="photo"
            src="assets/img-03-tank-standoff-checkpoint-cutout.jpg"
            alt="Minh họa hai hàng xe tăng đối đầu tại Checkpoint Charlie"
          />
          <div id="strike-left" class="strike-mark" aria-hidden="true"></div>
          <div id="strike-right" class="strike-mark" aria-hidden="true"></div>
        </div>

        <div id="date" class="clip" data-start="0.46" data-duration="2.45">
          <div id="date-inner">27/10/1961</div>
        </div>

        <div id="distance" class="clip" data-start="1.99" data-duration="3.05">
          <div id="distance-inner" aria-label="Đường đánh dấu khoảng trống giữa hai phía, không theo tỷ lệ thực địa">
            <svg viewBox="0 0 380 52" aria-hidden="true">
              <line id="measure-left" x1="25" y1="9" x2="25" y2="43"></line>
              <line id="measure-main" x1="25" y1="26" x2="355" y2="26"></line>
              <line id="measure-right" x1="355" y1="9" x2="355" y2="43"></line>
            </svg>
          </div>
        </div>
      </section>

      <div id="bottom-bar" aria-hidden="true"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "#photo",
        { scale: 1.01 },
        { scale: 1.085, duration: 5.04, ease: "sine.inOut" },
        0
      );

      // Hai nét khựng hướng vào khoảng trống: nhấn bố cục, không mô phỏng khai hỏa.
      tl.fromTo(
        "#strike-left",
        { x: -65, opacity: 0 },
        { x: 265, opacity: 1, duration: 0.38, ease: "power4.out" },
        0
      );
      tl.fromTo(
        "#strike-right",
        { x: 65, opacity: 0 },
        { x: -265, opacity: 1, duration: 0.38, ease: "power4.out" },
        0
      );
      tl.to(
        ["#strike-left", "#strike-right"],
        { opacity: 0, duration: 0.28, ease: "power2.in" },
        0.49
      );

      tl.fromTo(
        "#date-inner",
        { y: 22, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.38, ease: "power3.out" },
        0.46
      );
      tl.to("#date-inner", { opacity: 0, duration: 0.22, ease: "power1.in" }, 2.65);

      const measure = document.getElementById("measure-main");
      const measureLength = measure.getTotalLength();
      measure.style.strokeDasharray = String(measureLength);
      measure.style.strokeDashoffset = String(measureLength);

      tl.fromTo(
        "#distance-inner",
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" },
        1.99
      );
      tl.fromTo(
        "#measure-left",
        { opacity: 0 },
        { opacity: 1, duration: 0.18, ease: "power1.out" },
        2.12
      );
      tl.to(
        "#measure-main",
        { strokeDashoffset: 0, duration: 0.43, ease: "power2.out" },
        2.18
      );
      tl.fromTo(
        "#measure-right",
        { opacity: 0 },
        { opacity: 1, duration: 0.18, ease: "power1.out" },
        2.51
      );

      window.__timelines["scene-s07"] = tl;
    </script>
  
    </template>
  </body>
</html>
