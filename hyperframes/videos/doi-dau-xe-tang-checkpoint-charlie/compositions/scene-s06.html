  <div id="root" data-composition-id="scene-s06" data-start="0"

    <section id="graphics" class="clip" data-start="0" data-duration="5.43">
      <div class="chapter">CHECKPOINT CHARLIE</div>
      <h1 class="headline">THẾ ĐỐI ĐẦU</h1>
      <div class="rail">
        <div class="rail-heading">KÝ HIỆU LỰC LƯỢNG</div>
        <div id="total" class="total">≈30</div>
        <div id="marks" aria-hidden="true"></div>
        <div id="opposite-line" class="opposite-line"></div>
        <div id="opposite-label" class="opposite-label">TUYẾN ĐỐI DIỆN</div>

  <script>
    const marksContainer = document.getElementById("marks");
    const marks = [];

    // Thirty abstract data marks—not a depiction of thirty visible tanks.
    for (let i = 0; i < 30; i++) {
      const mark = document.createElement("div");
      mark.className = "mark";
      mark.id = "unit-mark-" + i;
      mark.style.left = (23 + (i % 5) * 46) + "px";
      mark.style.top = (395 + Math.floor(i / 5) * 48) + "px";
      marksContainer.appendChild(mark);
      marks.push(mark);
    }

    const tl = gsap.timeline({ paused: true });

    tl.fromTo("#footage",
      { scale: 0.92, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.52, ease: "power3.out" }, 0);
    tl.fromTo(".chapter",
      { y: 14, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 0.12);
    tl.fromTo(".headline",
      { y: 22, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.52, ease: "power3.out" }, 0.2);
    tl.fromTo(".rail-heading",
      { opacity: 0 }, { opacity: 1, duration: 0.35 }, 0.38);
    tl.fromTo("#total",
      { scale: 0.72, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.46, ease: "power3.out" }, 0.5);

    // All thirty marks finish arriving before 2.27 seconds (43,960 ms).
    tl.fromTo(marks,
      { scale: 0, opacity: 0 },
      {
        scale: 1, opacity: 1, duration: 0.32,
        stagger: 0.04, ease: "power3.out"
      }, 0.72);

    // Exactly ten marks leave the thirty-mark group and approach the opposing line.
    marks.slice(0, 10).forEach((mark, i) => {
      const originalX = 23 + (i % 5) * 46;
      const originalY = 395 + Math.floor(i / 5) * 48;
      const targetX = 49 + (i % 2) * 88;
      const targetY = 755 + Math.floor(i / 2) * 49;
      tl.to(mark, {
        x: targetX - originalX,
        y: targetY - originalY,
        backgroundColor: "#FF6A1A",
        duration: 0.82,
        ease: "power3.inOut"
      }, 3.23 + i * 0.035);
    });

    tl.fromTo("#opposite-line",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.52, ease: "power3.out" }, 3.28);
    tl.fromTo("#opposite-label",
      { y: 10, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.38, ease: "power2.out" }, 3.62);
    tl.fromTo("#ratio",
      { y: 18, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.48, ease: "power3.out" }, 3.23);

    window.__timelines["scene-s06"] = tl;
  </script>
