<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      .scene {
        overflow: hidden;
        background:
          radial-gradient(
            ellipse at 50% 44%,
            rgba(20, 20, 20, 0) 38%,
            rgba(20, 20, 20, 0.28) 100%
          ),
          #E7E3D9;
      }

      .image-frame {
        position: absolute;
        top: 160px;
        left: 160px;
        width: 760px;
        height: 1362px;
        overflow: hidden;
        background: #141414;
        transform-origin: center center;
      }

      .camera {
        position: absolute;
        inset: 0;
        transform-origin: center center;
      }

      .tank-image {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .first-side {
        clip-path: inset(0 50% 0 0);
      }

      .opposing-side {
        clip-path: inset(0 50% 0 50%);
      }

      .division {
        position: absolute;
        top: 0;
        left: calc(50% - 2px);
        width: 4px;
        height: 100%;
        background: #FF6A1A;
        transform-origin: center top;
      }

      .division-tick {
        position: absolute;
        top: calc(50% - 15px);
        left: calc(50% - 17px);
        width: 34px;
        height: 30px;
        background: #FF6A1A;
      }

      .standoff-line {
        position: absolute;
        top: calc(50% - 4px);
        left: 48px;
        width: 664px;
        height: 8px;
        background: #FF6A1A;
        transform-origin: center center;
      }

      .bottom-signature {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 12px;
        background: #FF6A1A;
        z-index: 10;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s05"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-fps="30"
      data-duration="5.53"
    >
      <section id="s05-scene" class="clip scene" data-start="0" data-duration="5.53">
        <div id="s05-frame" class="image-frame">
          <div id="s05-camera" class="camera">
            <img
              id="s05-first-side"
              class="tank-image first-side"
              src="assets/img-05-checkpoint-charlie-tank-standoff.jpg"
              alt=""
            />
            <img
              id="s05-opposing-side"
              class="tank-image opposing-side"
              src="assets/img-05-checkpoint-charlie-tank-standoff.jpg"
              alt=""
            />
            <div id="s05-division" class="division" aria-hidden="true"></div>
            <div id="s05-division-tick" class="division-tick" aria-hidden="true"></div>
            <div id="s05-standoff-line" class="standoff-line" aria-hidden="true"></div>
          </div>
        </div>
      </section>
      <div class="bottom-signature" aria-hidden="true"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Phía đầu tiên vào khung bằng một cú punch; phía đối diện vẫn bị che.
      tl.fromTo(
        "#s05-frame",
        { scale: 0.89, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power4.out" },
        0.08
      );

      // Zoom nhẹ xuyên suốt shot, không làm dịch chuyển thanh cam cố định.
      tl.fromTo(
        "#s05-camera",
        { scale: 1 },
        { scale: 1.045, duration: 5.35, ease: "sine.inOut" },
        0.1
      );

      // Vạch chia xuất hiện tại 36.990 s trên timeline tổng.
      tl.fromTo(
        "#s05-division",
        { scaleY: 0 },
        { scaleY: 1, duration: 0.48, ease: "power3.out" },
        0.83
      );

      tl.fromTo(
        "#s05-division-tick",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.28, ease: "power3.out" },
        2.55
      );

      // Chỉ từ 40.240 s mới mở phía đáp trả.
      tl.fromTo(
        "#s05-opposing-side",
        { clipPath: "inset(0 50% 0 50%)" },
        { clipPath: "inset(0 0% 0 50%)", duration: 0.48, ease: "power3.out" },
        4.08
      );

      // Nét nhấn cuối shot chốt lại thế đối đầu.
      tl.fromTo(
        "#s05-standoff-line",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.27, ease: "power4.out" },
        5.15
      );

      window.__timelines["scene-s05"] = tl;
    </script>
  
    </template>
  </body>
</html>
