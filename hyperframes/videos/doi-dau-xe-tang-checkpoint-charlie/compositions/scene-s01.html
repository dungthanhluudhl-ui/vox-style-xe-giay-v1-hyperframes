  <script>
    const tl = gsap.timeline({ paused: true });

    // A restrained zoom-through reveals one photograph through two aligned crops.
    tl.fromTo("#photo-halves",
      { scale: 1.13, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.72, ease: "power3.out" },
      0
    );
    tl.fromTo("#location",
      { y: -18, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
      0.22
    );

    // Opposing sides drift independently toward the central confrontation.
    tl.fromTo("#west-image",
      { x: -15 },
      { x: 15, duration: 5.8, ease: "sine.inOut" },
      0.72
    );
    tl.fromTo("#east-image",
      { x: 15 },
      { x: -15, duration: 5.8, ease: "sine.inOut" },
      0.72
    );

    tl.fromTo("#punch",
      { y: 26, scale: 0.94, opacity: 0 },
      { y: 0, scale: 1, opacity: 1, duration: 0.32, ease: "power4.out" },
      2.21
    );
    tl.to("#punch",
      { opacity: 0, y: -12, duration: 0.12, ease: "power2.in" },
      3.82
    );

    tl.fromTo("#label-west",
      { x: -36, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.43, ease: "power3.out" },
      3.85
    );
    tl.fromTo("#label-east",
      { x: 36, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.43, ease: "power3.out" },
      4.22
    );
    tl.fromTo("#split-marker",
      { scaleY: 0, opacity: 0 },
      { scaleY: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      4.48
    );

    // Two short strokes point inward; neither continues across the gap.
    tl.fromTo("#stroke-left",
      { scaleX: 0, opacity: 0 },
      { scaleX: 1, opacity: 1, duration: 0.42, ease: "power2.out" },
      5.96
    );
    tl.fromTo("#stroke-right",
      { scaleX: 0, opacity: 0 },
      { scaleX: 1, opacity: 1, duration: 0.42, ease: "power2.out" },
      6.12
    );

    window.__timelines["scene-s01"] = tl;
