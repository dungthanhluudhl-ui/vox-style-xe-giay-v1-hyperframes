    body {
      margin: 0;

      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    #root {

      height: 100%;
      overflow: hidden;
    }

    .clip {

      inset: 0;
    }

    .paper-grid {
      position: absolute;
      inset: 0;
      background-color: #e7e3d9;
      background-image:

    .photo-window {
      position: absolute;
      top: 348px;

      width: 832px;
      height: 1168px;
      overflow: hidden;
      border: 6px solid #141414;
      background: #141414;
    }

    .photo-reveal {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .photo {
      display: block;
      position: absolute;
      top: -188px;
      left: 0;
      width: 882px;

    .timeline {
      position: absolute;

      position: relative;
      flex: 1;
      height: 6px;
      background: #141414;

    .timeline-connector::after {
      content: "";

      right: -2px;

      width: 0;
      height: 0;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-left: 22px solid #141414;

    .document-badge svg {

      height: 84px;
      overflow: visible;
    }

    .document-badge path {
      fill: none;
      stroke: #ff6a1a;

      stroke-linejoin: round;

  <div
    id="root"

    data-fps="30"
  >

    <section id="checkpoint-shot" class="clip" data-start="0" data-duration="9.68" data-track-index="0">
      <div class="photo-window" data-layout-allow-overflow>
        <div id="photo-reveal" class="photo-reveal">
          <img
            id="checkpoint-photo"
            class="photo"
            src="assets/img-01-border-checkpoint-passport-inspection.jpg"
            alt="Tranh minh họa một người lái xe được kiểm tra giấy tờ tại trạm kiểm soát Berlin"
          />
        </div>

    </section>

    <section id="date-overlay" class="clip" data-start="0.63" data-duration="3.98" data-track-index="1">
      <div class="timeline" aria-label="Từ khi Bức tường Berlin được dựng đến ngày 22 tháng 10 năm 1961">
        <div id="wall-date" class="date-marker">BỨC TƯỜNG</div>
        <div id="date-connector" class="timeline-connector" aria-hidden="true"></div>
        <div id="october-date" class="date-marker final">22/10/1961</div>
      </div>
    </section>

    <section id="stop-overlay" class="clip" data-start="5.15" data-duration="3.4" data-track-index="2">
      <div id="stop-rule" class="stop-rule" aria-hidden="true"></div>

    <section id="document-overlay" class="clip" data-start="8.77" data-duration="0.91" data-track-index="3">
      <div id="document-badge" class="document-badge" aria-label="Biểu tượng giấy tờ">
        <svg viewBox="0 0 76 84" aria-hidden="true">
          <path id="doc-outline" d="M13 5 H48 L65 22 V78 H13 Z M48 5 V22 H65" />
          <path id="doc-line-one" d="M24 39 H53" />
          <path id="doc-line-two" d="M24 53 H53" />

    <div class="bottom-signature" aria-hidden="true"></div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Peel the illustration into view, then move the framing slowly toward the inspector.
    tl.fromTo(
      "#photo-reveal",
      { clipPath: "inset(0% 100% 0% 0%)" },
      { clipPath: "inset(0% 0% 0% 0%)", duration: 0.72, ease: "power3.out" },
      0
    );
    tl.fromTo(
      "#checkpoint-photo",
      { x: 0 },
      { x: -50, duration: 9.3, ease: "sine.inOut" },
      0.25
    );

    tl.fromTo(
      "#wall-date",
      { y: 18, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      0.63
    );
    tl.fromTo(
      "#date-connector",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.55, ease: "power3.out" },
      0.94
    );
    tl.fromTo(
      "#october-date",
      { y: 18, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      1.32
    );

    // A restrained stop mark punctuates the halted journey without covering the people.
    tl.fromTo(
      "#stop-rule",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.48, ease: "power3.out" },
      5.15
    );

    tl.fromTo(
      "#document-badge",
      { scale: 0.78, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.28, ease: "power3.out" },
      8.77
    );

    [
      ["doc-outline", 8.82, 0.48],
      ["doc-line-one", 9.05, 0.24],
      ["doc-line-two", 9.13, 0.24],
      ["doc-line-three", 9.21, 0.24]
    ].forEach(([id, start, duration]) => {
      const path = document.getElementById(id);
      const length = path.getTotalLength();
      path.style.strokeDasharray = String(length);
      tl.fromTo(
        path,
        { strokeDashoffset: length },
        { strokeDashoffset: 0, duration, ease: "power2.out" },
        start
      );
    });

    window.__timelines["scene-s02"] = tl;
  </script>
