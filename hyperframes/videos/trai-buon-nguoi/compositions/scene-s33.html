        background-color: #E7E3D9;

        line-height: 0;

      .image-frame img {
        width: 100%;
        height: auto;

      // 4. Dramatic pan down to Stage 3: Wall Explosion (Release)

        "#camera-rig",
        { y: -260, scale: 1.22, duration: 1.0, ease: "power3.inOut" },
