    <script>
      // 1. Setup SVG Path Drawing Geometry
      const triangle = document.getElementById("warning-triangle");
      const bar = document.getElementById("warning-bar");
      const triLen = triangle && triangle.getTotalLength ? triangle.getTotalLength() : 295;
      const barLen = bar && bar.getTotalLength ? bar.getTotalLength() : 28;

      if (triangle) {
        triangle.style.strokeDasharray = triLen;
        triangle.style.strokeDashoffset = triLen;
      }
      if (bar) {
        bar.style.strokeDasharray = barLen;
        bar.style.strokeDashoffset = barLen;
      }

      // 2. Build Single Paused Master Timeline
      const tl = gsap.timeline({ paused: true });

      // [0.0s - 8.31s] Ken Burns slow cinematic zoom into the scam call center operative

        "#hero-img",
        { scale: 1.0, y: 0 },
        { scale: 1.14, y: -36, duration: 8.31, ease: "none" },
        0
      );

      // [0.0s - 0.85s] Tactile paper peel entrance (diagonal unpeel with subtle 3D rotation)
      tl.fromTo(
        "#hero-paper-card",
        {
          clipPath: "polygon(0% 0%, 0% 0%, 0% 100%, 0% 100%)",
          transformPerspective: 1000,
          rotationY: -6,
          rotationX: 2,
          transformOrigin: "left center"
        },
        {
          clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)",
          rotationY: 0,
          rotationX: 0,
          duration: 0.85,
          ease: "power2.out"
        },
        0
      );

      // [0.28s - 0.83s] Overlay 1 Arrival ("CẠM BẪY VIỆC LÀM")
      tl.fromTo(
        "#label-card",
        { y: -38, opacity: 0, scale: 0.92 },
        { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        0.28
      );

      // [0.55s - 1.0s] Punch underline draw
      tl.fromTo(
        "#punch-bar",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power2.out" },
        0.55
      );

      // [2.6s - 3.0s] Overlay 1 Settle and Exit

        "#label-card",
        { y: -24, opacity: 0, scale: 0.96, duration: 0.4, ease: "power2.in" },
        2.6
      );

      // [4.56s - 5.06s] Overlay 2 Arrival (Warning Placard)
      tl.fromTo(
        "#warning-card",
        { scale: 0.65, opacity: 0, y: 32 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        4.56
      );

      // [4.75s - 5.35s] Progressive SVG stroke drawing of warning icon
      tl.to(
        "#warning-triangle",
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        4.75
      );
      tl.to(
        "#warning-bar",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        5.1
      );
      tl.fromTo(
        "#warning-dot",
        { scale: 0, opacity: 0, transformOrigin: "center center" },
        { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" },
        5.3
      );

      // [5.4s - 5.8s] Warning banner pop
      tl.fromTo(
        "#warning-banner",
        { scaleX: 0, opacity: 0, transformOrigin: "center center" },
        { scaleX: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        5.4

      // [7.3s - 7.7s] Overlay 2 Exit before clip boundary
      tl.to(
        "#warning-card",
        { scale: 0.92, opacity: 0, duration: 0.4, ease: "power2.in" },
        7.3
      );

      window.__timelines["scene-s07"] = tl;
