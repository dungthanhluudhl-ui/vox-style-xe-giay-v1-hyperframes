<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }

      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Color utility classes adhering to WCAG standards */
      .hf-text-ink {
        color: #141414;
      }
      .hf-text-light {
        color: #F7F4EC;
      }
      .hf-hl-orange {
        background-color: #FF6A1A;
        color: #141414;
      }
      .hf-plate-ink {
        background-color: #141414;
        color: #F7F4EC;
      }
      .hf-plate-ink-orange {
        background-color: #141414;
        color: #FF6A1A;
      }
      .hf-plate-paper {
        background-color: #E7E3D9;
        color: #141414;
      }

      /* Fixed Vox-style signature orange bar */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 100;
      }

      /* Hero Papercraft Card */
      #hero-wrapper {
        position: absolute;
        top: 275px;
        left: 0;
        width: 1080px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #hero-card {
        position: relative;
        width: 740px;
        height: 900px;
        background-color: #F5F0E4;
        border: 4px solid #141414;
        box-shadow: 12px 12px 0px #141414;
        transform-origin: 50% 60%;
        will-change: transform, opacity;
      }

      .card-inner {
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #F5F0E4;
      }

      #hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Realistic papercraft tape accents */
      .tape-accent {
        position: absolute;
        height: 36px;
        background-color: rgba(226, 216, 196, 0.95);
        border: 1px solid rgba(20, 20, 20, 0.35);
        z-index: 10;
      }

      .tape-top-left {
        width: 130px;
        top: -18px;
        left: 36px;
        transform: rotate(-7deg);
      }

      .tape-top-right {
        width: 120px;
        top: -16px;
        right: 42px;
        transform: rotate(5deg);
      }

      /* Overlay 1: Label Badge */
      .label-container {
        position: absolute;
        top: 185px;
        left: 0;
        width: 1080px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .label-box {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 32px;
        border: 3.5px solid #141414;
        box-shadow: 8px 8px 0px #141414;
        font-weight: 900;
        font-size: 38px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .label-text {
        color: #141414;
        line-height: 1.1;
      }

      /* Overlay 2: Punch Phrase Banner */
      .punch-container {
        position: absolute;
        top: 1215px;
        left: 0;
        width: 1080px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .punch-box {
        display: inline-flex;
        align-items: center;
        padding: 20px 44px;
        border: 4px solid #141414;
        box-shadow: 10px 10px 0px #141414;
        transform-origin: 50% 50%;
        gap: 20px;
        will-change: transform, opacity;
      }

      .punch-accent-bar {
        width: 12px;
        height: 48px;
        background-color: #FF6A1A;
        flex-shrink: 0;
      }

      .punch-text {
        color: #F7F4EC;
        font-size: 64px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.5px;
        text-transform: uppercase;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s02"
      data-width="1080"
      data-height="1920"
      data-duration="5.56"
    >
      <!-- Persistent Brand Signature Bottom Bar -->
      <div class="brand-bottom-bar"></div>

      <!-- Main Scene Layer: Collage Balance Scale Card -->
      <section id="scene-clip" class="clip" data-start="0" data-duration="5.56">
        <div id="hero-wrapper">
          <div id="hero-card">
            <div class="tape-accent tape-top-left"></div>
            <div class="tape-accent tape-top-right"></div>
            <div class="card-inner">
              <img
                id="hero-img"
                src="assets/img-02-papercraft-scale-evidence-comparison.jpg"
                alt="Mô hình cán cân đối lập"
              />
            </div>
          </div>
        </div>
      </section>

      <!-- Overlay 1: Label (DOANH THU ĐỐI LẬP) -->
      <section id="clip-label" class="clip" data-start="1.71" data-duration="2.1">
        <div class="label-container">
          <div id="label-card" class="hf-hl-orange label-box">
            <span class="label-text">DOANH THU ĐỐI LẬP</span>
          </div>
        </div>
      </section>

      <!-- Overlay 2: Punch Phrase (KẾT QUẢ ĐẢO CHIỀU) -->
      <section id="clip-punch" class="clip" data-start="4.15" data-duration="1.41">
        <div class="punch-container">
          <div id="punch-card" class="hf-plate-ink punch-box">
            <div class="punch-accent-bar"></div>
            <div class="punch-text">KẾT QUẢ ĐẢO CHIỀU</div>
          </div>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance of Hero Card: 3D flip reveal (t = 0.1s to 0.85s)
      tl.fromTo(
        "#hero-card",
        {
          rotationY: -75,
          rotationZ: -4,
          scale: 0.82,
          opacity: 0,
          transformPerspective: 1200,
          transformOrigin: "50% 50%",
        },
        {
          rotationY: 0,
          rotationZ: 0,
          scale: 1,
          opacity: 1,
          duration: 0.75,
          ease: "power3.out",
        },
        0.1
      );

      // 2. Physics tilt: Scale tipping down to the right as gold tickets outweigh negative reviews
      tl.to(
        "#hero-card",
        {
          rotationZ: 3.2,
          y: 12,
          duration: 1.4,
          ease: "power2.inOut",
        },
        1.1
      );

      // 3. Label "DOANH THU ĐỐI LẬP" (appears at 1.71s, holds, exits at 3.45s)
      tl.fromTo(
        "#label-card",
        {
          scale: 0.3,
          opacity: 0,
          rotation: 4,
        },
        {
          scale: 1,
          opacity: 1,
          rotation: -2,
          duration: 0.45,
          ease: "power3.out",
        },
        1.71
      );

      tl.to(
        "#label-card",
        {
          opacity: 0,
          y: -15,
          scale: 0.92,
          duration: 0.3,
          ease: "power2.in",
        },
        3.45
      );

      // 4. Punch Phrase "KẾT QUẢ ĐẢO CHIỀU" (enters at 4.15s, settles firmly until end)
      tl.fromTo(
        "#punch-card",
        {
          scale: 0.88,
          y: 35,
          opacity: 0,
        },
        {
          scale: 1,
          y: 0,
          opacity: 1,
          duration: 0.45,
          ease: "power3.out",
        },
        4.15
      );

      // Register deterministic timeline
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s02"] = tl;
    </script>
  
    </template>
  </body>
</html>
