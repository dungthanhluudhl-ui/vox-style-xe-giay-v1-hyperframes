<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink {
        color: #141414;
      }
      .hf-text-light {
        color: #f7f4ec;
      }
      .hf-hl-orange {
        color: #141414;
        background-color: #ff6a1a;
      }
      .hf-plate-ink {
        color: #f7f4ec;
        background-color: #141414;
      }
      .hf-plate-ink-orange {
        color: #ff6a1a;
        background-color: #141414;
      }
      .hf-plate-paper {
        color: #141414;
        background-color: #f5f0e4;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }

      /* Quy ước clip chuẩn của HyperFrames: inset 0, không đặt cứng px width/height */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Thanh cam nhận diện thương hiệu cố định mép dưới cùng */
      #signature-orange-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 50;
      }

      /* Khung chứa ảnh collage bánh đà ở giữa màn hình */
      #hero-container {
        position: absolute;
        left: 80px;
        top: 360px;
        width: 920px;
        height: 980px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 5;
      }

      .collage-frame {
        position: relative;
        width: 100%;
        height: 100%;
        background-color: #f5f0e4;
        border: 4px solid #141414;
        box-shadow: 18px 22px 0px rgba(20, 20, 20, 0.85);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .collage-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: center center;
      }

      /* Băng keo dán góc trang trí phong cách collage (không chứa text để tránh che khuất) */
      .corner-tape-left {
        position: absolute;
        top: -14px;
        left: 50px;
        width: 140px;
        height: 36px;
        background-color: rgba(231, 227, 217, 0.92);
        border: 2px solid rgba(20, 20, 20, 0.35);
        transform: rotate(-3deg);
        z-index: 10;
      }

      .corner-tape-right {
        position: absolute;
        top: -14px;
        right: 50px;
        width: 130px;
        height: 36px;
        background-color: rgba(231, 227, 217, 0.92);
        border: 2px solid rgba(20, 20, 20, 0.35);
        transform: rotate(3deg);
        z-index: 10;
      }

      /* OVERLAY 1: VÒNG LẶP BÁNH ĐÀ (từ 0.66s) */
      #overlay-label-1 {
        position: absolute;
        top: 180px;
        left: 80px;
        width: 920px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        z-index: 20;
      }

      .badge-category {
        padding: 8px 22px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 3px;
        border: 3px solid #141414;
        border-bottom: none;
        display: inline-block;
      }

      .badge-title-box {
        padding: 22px 34px;
        border: 4px solid #141414;
        box-shadow: 12px 14px 0px #ff6a1a;
      }

      .badge-title-box h1 {
        margin: 0;
        font-size: 58px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: 1px;
      }

      /* SƠ ĐỒ MẮT XÍCH CHU TRÌNH LIÊN HOÀN (1.5s - 5.4s) */
      #flow-diagram-wrapper {
        position: absolute;
        inset: 0;
        z-index: 15;
      }

      .flow-card {
        position: absolute;
        width: 320px;
        padding: 14px 18px;
        border: 3px solid #141414;
        box-shadow: 6px 8px 0px #141414;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .flow-card .num-bubble {
        width: 44px;
        height: 44px;
        min-width: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 900;
        border: 2px solid #141414;
      }

      .flow-card .flow-text {
        font-size: 25px;
        font-weight: 900;
        line-height: 1.2;
      }

      /* Tọa độ 4 mắt xích bao quanh các bánh răng */
      #node-1 {
        top: 400px;
        left: 40px;
      }
      #node-2 {
        top: 400px;
        right: 40px;
      }
      #node-3 {
        top: 1220px;
        right: 40px;
      }
      #node-4 {
        top: 1220px;
        left: 40px;
      }

      /* SVG liên kết đường đi chu trình */
      #flow-svg-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 12;
      }

      /* OVERLAY 2: HIỆU ỨNG FOMO (từ 5.5s) */
      #overlay-label-2 {
        position: absolute;
        bottom: 540px;
        left: 70px;
        width: 940px;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 25;
      }

      .fomo-header-tag {
        padding: 10px 28px;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 3px;
        border: 4px solid #141414;
        border-bottom: none;
      }

      .fomo-plate {
        width: 100%;
        padding: 28px 36px;
        border: 5px solid #141414;
        box-shadow: 14px 16px 0px #ff6a1a;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .fomo-plate .fomo-main-text {
        margin: 0;
        font-size: 72px;
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: 2px;
      }

      .fomo-sub-bar {
        margin-top: 6px;
        padding: 8px 24px;
        border: 2px solid #141414;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 2px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s24"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.61"
    >
      <!-- Thanh cam đáy cố định nhận diện phong cách Vox -->
      <div id="signature-orange-bar"></div>

      <!-- SHOT 1 CHÍNH: Cụm bánh răng liên hoàn & camera spiral zoom-in -->
      <div id="shot-main" class="clip" data-start="0" data-duration="7.61">
        <div id="hero-container">
          <div class="corner-tape-left"></div>
          <div class="corner-tape-right"></div>
          <div class="collage-frame">
            <img
              id="gear-img"
              src="assets/img-10-gear-feedback-loop-cycle-diagram.jpg"
              alt="Hệ thống bánh răng vòng lặp"
            />
          </div>
        </div>

        <!-- SVG vẽ đường vector liên kết chu trình diagram -->
        <svg id="flow-svg-layer" viewBox="0 0 1080 1920">
          <defs>
            <marker
              id="arrow-marker"
              viewBox="0 0 10 10"
              refX="6"
              refY="5"
              markerWidth="8"
              markerHeight="8"
              orient="auto-start-reverse"
            >
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#141414" />
            </marker>
          </defs>
          <path
            id="flow-path"
            d="M 360 435 L 720 435 M 880 480 L 880 1200 M 720 1255 L 360 1255 M 200 1200 L 200 480"
            fill="none"
            stroke="#141414"
            stroke-width="5"
            stroke-dasharray="14 10"
            marker-end="url(#arrow-marker)"
          />
        </svg>
      </div>

      <!-- OVERLAY CLIP 1: NHÃN VÒNG LẶP BÁNH ĐÀ (start 0.66s, duration 2.4s) -->
      <div id="clip-overlay-1" class="clip" data-start="0.66" data-duration="2.4">
        <div id="overlay-label-1">
          <div class="badge-category hf-hl-orange">CƠ CHẾ TÂM LÝ</div>
          <div class="badge-title-box hf-plate-ink">
            <h1>VÒNG LẶP BÁNH ĐÀ</h1>
          </div>
        </div>
      </div>

      <!-- FLOW NODES CLIP: 4 MẮT XÍCH CHU TRÌNH (start 1.5s, duration 3.9s) -->
      <div id="clip-diagram-flow" class="clip" data-start="1.5" data-duration="3.9">
        <div id="flow-diagram-wrapper">
          <div id="node-1" class="flow-card hf-plate-ink">
            <div class="num-bubble hf-hl-orange">1</div>
            <div class="flow-text hf-text-light">MUA VÉ</div>
          </div>
          <div id="node-2" class="flow-card hf-plate-ink">
            <div class="num-bubble hf-hl-orange">2</div>
            <div class="flow-text hf-text-light">ĐĂNG BÀI</div>
          </div>
          <div id="node-3" class="flow-card hf-plate-ink">
            <div class="num-bubble hf-hl-orange">3</div>
            <div class="flow-text hf-text-light">TẠO SÓNG</div>
          </div>
          <div id="node-4" class="flow-card hf-plate-ink">
            <div class="num-bubble hf-hl-orange">4</div>
            <div class="flow-text hf-text-light">NHẬP CUỘC</div>
          </div>
        </div>
      </div>

      <!-- OVERLAY CLIP 2: HIỆU ỨNG FOMO (start 5.5s, duration 2.11s) -->
      <div id="clip-overlay-2" class="clip" data-start="5.5" data-duration="2.11">
        <div id="overlay-label-2">
          <div class="fomo-header-tag hf-hl-orange">TÂM LÝ ĐÁM ĐÔNG</div>
          <div class="fomo-plate hf-plate-ink">
            <h1 class="fomo-main-text hf-plate-ink-orange">HIỆU ỨNG FOMO</h1>
            <div class="fomo-sub-bar hf-plate-paper">SỢ BỊ ĐỨNG NGOÀI CUỘC</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Đăng ký timeline gốc duy nhất ở trạng thái PAUSED cho composition
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance "spiral" cho khối bánh đà ở đầu cảnh (t = 0.05s -> 0.85s)
      tl.fromTo(
        "#hero-container",
        { scale: 0.84, rotation: -6, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.85, ease: "power3.out" },
        0.05,
      );

      // Camera motion: zoom-in chậm liên tục vào tâm bánh răng (0.85s -> 7.61s)
      tl.to(
        "#gear-img",
        { scale: 1.15, duration: 6.7, ease: "none" },
        0.85,
      );

      // 2. Nhãn 1: "VÒNG LẶP BÁNH ĐÀ" (atMs: 166620, tương đương t = 0.66s)
      tl.fromTo(
        "#overlay-label-1",
        { y: -35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.66,
      );
      // Giữ theo shotlist rồi fade mượt trước khi hết clip
      tl.to(
        "#overlay-label-1",
        { y: -20, opacity: 0, duration: 0.3, ease: "power2.in" },
        2.6,
      );

      // 3. Chuỗi mắt xích liên hoàn 4 bánh răng (t = 1.5s -> 5.2s)
      tl.fromTo(
        "#flow-svg-layer",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out" },
        1.55,
      );

      tl.fromTo(
        "#node-1",
        { scale: 0.7, opacity: 0, x: -20 },
        { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        1.65,
      );

      tl.fromTo(
        "#node-2",
        { scale: 0.7, opacity: 0, x: 20 },
        { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        2.25,
      );

      tl.fromTo(
        "#node-3",
        { scale: 0.7, opacity: 0, x: 20 },
        { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        2.85,
      );

      tl.fromTo(
        "#node-4",
        { scale: 0.7, opacity: 0, x: -20 },
        { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        3.45,
      );

      // Fade out nhẹ nhàng nhóm diagram trước khi sang nhãn FOMO
      tl.to(
        "#flow-diagram-wrapper",
        { opacity: 0, scale: 0.96, duration: 0.35, ease: "power2.in" },
        5.1,
      );
      tl.to(
        "#flow-svg-layer",
        { opacity: 0, duration: 0.3, ease: "power2.in" },
        5.1,
      );

      // 4. Nhãn 2: "HIỆU ỨNG FOMO" (atMs: 171600, tương đương t = 5.64s)
      tl.fromTo(
        "#overlay-label-2",
        { scale: 0.8, opacity: 0, y: 40 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        5.64,
      );

      // Gắn timeline vào registry HyperFrames
      window.__timelines["scene-s24"] = tl;
    </script>
  
    </template>
  </body>
</html>
