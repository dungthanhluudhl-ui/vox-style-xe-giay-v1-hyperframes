<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #f5f0e4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }

      /* Composition Root */
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f5f0e4;
      }

      /* Shared clip convention */
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Contract color utility classes */
      .hf-text-ink {
        color: #141414;
      }
      .hf-text-light {
        color: #f7f4ec;
      }
      .hf-hl-orange {
        background: #ff6a1a;
        color: #141414;
      }
      .hf-plate-ink {
        background: #141414;
        color: #f7f4ec;
      }
      .hf-plate-ink-orange {
        background: #141414;
        color: #ff6a1a;
      }
      .hf-plate-paper {
        background: #e7e3d9;
        color: #141414;
      }

      /* Signature bottom orange bar */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 10px;
        background: #ff6a1a;
        z-index: 100;
      }

      /* Mockup Frame & Image (Shot S20-1) */
      #mockup-frame {
        position: absolute;
        top: 310px;
        left: 80px;
        width: 920px;
        height: 1040px;
        background: #141414;
        border: 5px solid #141414;
        border-radius: 20px;
        box-shadow: 14px 14px 0px #141414;
        overflow: hidden;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      #image-zoom-target {
        width: 100%;
        height: 100%;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      #hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 40%;
        display: block;
      }

      /* Overlay 1: Punch Phrase */
      #punch-card {
        position: absolute;
        top: 170px;
        left: 80px;
        width: 920px;
        background: #141414;
        color: #f7f4ec;
        border-left: 10px solid #ff6a1a;
        border-radius: 16px;
        padding: 24px 36px;
        box-shadow: 12px 12px 0px rgba(20, 20, 20, 0.35);
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .punch-quote {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 56px;
        line-height: 1.25;
        letter-spacing: -0.5px;
        color: #f7f4ec;
        text-transform: uppercase;
        margin: 0;
      }

      /* Overlay 2: Label Badge */
      #label-card {
        position: absolute;
        top: 170px;
        left: 80px;
        display: inline-flex;
        align-items: center;
        gap: 16px;
        background: #ff6a1a;
        color: #141414;
        border: 4px solid #141414;
        border-radius: 14px;
        padding: 20px 36px;
        box-shadow: 10px 10px 0px #141414;
        transform-origin: 0% 50%;
        will-change: transform, opacity;
      }

      .label-dot {
        width: 16px;
        height: 16px;
        background: #141414;
        border-radius: 50%;
        display: inline-block;
        flex-shrink: 0;
      }

      .label-text {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 40px;
        line-height: 1.2;
        letter-spacing: 1px;
        color: #141414;
        text-transform: uppercase;
        margin: 0;
      }

      /* Overlay 3: Icon Badge (Crowd) */
      #icon-card {
        position: absolute;
        top: 170px;
        left: 80px;
        display: inline-flex;
        align-items: center;
        gap: 24px;
        background: #141414;
        border: 4px solid #ff6a1a;
        border-radius: 16px;
        padding: 16px 32px;
        box-shadow: 12px 12px 0px rgba(20, 20, 20, 0.35);
        transform-origin: 0% 50%;
        will-change: transform, opacity;
      }

      .crowd-stroke {
        fill: none;
        stroke: #ff6a1a;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .icon-label {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 40px;
        line-height: 1;
        letter-spacing: 2px;
        color: #f7f4ec;
        text-transform: uppercase;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s20"
      data-width="1080"
      data-height="1920"
      data-duration="10.09"
    >
      <!-- Base Shot 1: Mockup frame & image -->
      <div id="shot-1" class="clip" data-start="0" data-duration="10.09" data-track-index="0">
        <div id="mockup-frame">
          <div id="image-zoom-target">
            <img
              id="hero-img"
              src="assets/img-29-viral-text-message-drama.jpg"
              alt="Viral text message drama"
            />
          </div>
        </div>
      </div>

      <!-- Overlay 1: Punch phrase "“ĐI XEM, CĂNG LẮM!”" -->
      <div
        id="clip-punch"
        class="clip"
        data-start="0"
        data-duration="3.5"
        data-track-index="1"
      >
        <div id="punch-card" class="hf-plate-ink">
          <div class="punch-quote">“ĐI XEM, CĂNG LẮM!”</div>
        </div>
      </div>

      <!-- Overlay 2: Label "HIỆU ỨNG TRUYỀN MIỆNG" -->
      <div
        id="clip-label"
        class="clip"
        data-start="3.5"
        data-duration="4.9"
        data-track-index="2"
      >
        <div id="label-card" class="hf-hl-orange">
          <span class="label-dot"></span>
          <span class="label-text">HIỆU ỨNG TRUYỀN MIỆNG</span>
        </div>
      </div>

      <!-- Overlay 3: Icon "crowd" -->
      <div
        id="clip-icon"
        class="clip"
        data-start="8.5"
        data-duration="1.59"
        data-track-index="3"
      >
        <div id="icon-card" class="hf-plate-ink">
          <svg
            id="crowd-svg"
            class="crowd-icon-svg"
            viewBox="0 0 200 170"
            width="94"
            height="80"
          >
            <!-- Center Figure -->
            <path class="crowd-stroke" d="M 100 32 A 26 26 0 1 1 99.9 32 Z" />
            <path class="crowd-stroke" d="M 46 150 C 46 104, 154 104, 154 150" />
            <!-- Left Figure -->
            <path class="crowd-stroke" d="M 50 56 A 18 18 0 1 1 49.9 56 Z" />
            <path class="crowd-stroke" d="M 12 150 C 12 120, 78 120, 78 150" />
            <!-- Right Figure -->
            <path class="crowd-stroke" d="M 150 56 A 18 18 0 1 1 149.9 56 Z" />
            <path class="crowd-stroke" d="M 122 150 C 122 120, 188 120, 188 150" />
          </svg>
          <span class="icon-label">CROWD</span>
        </div>
      </div>

      <!-- Brand Signature Bottom Bar -->
      <div class="bottom-brand-bar"></div>
    </div>

    <script>
      // Single paused timeline registered on window.__timelines["scene-s20"]
      const tl = gsap.timeline({ paused: true });

      // 1. Mockup frame punch entrance at scene start
      tl.fromTo(
        "#mockup-frame",
        { scale: 0.9, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power4.out" },
        0.05
      );

      // 2. Slow continuous zoom-in on the message screen over scene duration
      tl.fromTo(
        "#image-zoom-target",
        { scale: 1.02, y: 0 },
        { scale: 1.16, y: -20, duration: 10.09, ease: "none" },
        0
      );

      // 3. Overlay 1: Punch phrase "“ĐI XEM, CĂNG LẮM!”"
      tl.fromTo(
        "#punch-card",
        { scale: 0.85, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power4.out" },
        0.15
      );
      tl.to(
        "#punch-card",
        { opacity: 0, y: -15, duration: 0.35, ease: "power2.in" },
        3.05
      );

      // 4. Overlay 2: Label "HIỆU ỨNG TRUYỀN MIỆNG" at 3.6s
      tl.fromTo(
        "#label-card",
        { scale: 0.9, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        3.6
      );
      tl.to(
        "#label-card",
        { opacity: 0, y: -15, duration: 0.35, ease: "power2.in" },
        7.95
      );

      // 5. Overlay 3: Icon "crowd" at 8.84s
      const crowdStrokes = document.querySelectorAll(".crowd-stroke");
      crowdStrokes.forEach((path) => {
        const len = path.getTotalLength();
        path.style.strokeDasharray = `${len}`;
        path.style.strokeDashoffset = `${len}`;
      });

      tl.fromTo(
        "#icon-card",
        { scale: 0.88, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        8.84
      );

      crowdStrokes.forEach((path, idx) => {
        const len = path.getTotalLength();
        tl.fromTo(
          path,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" },
          8.95 + idx * 0.07
        );
      });

      // Register timeline
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s20"] = tl;
    </script>
  
    </template>
  </body>
</html>
