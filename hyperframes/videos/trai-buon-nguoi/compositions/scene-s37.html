    <script>
      // Single paused timeline registered on window.__timelines["scene-s37"]
      const tl = gsap.timeline({ paused: true });

      // Setup SVG loop draw length
      const loopArrowPath = document.querySelector("#loop-arrow-path");
      if (loopArrowPath) {
        const pathLen = loopArrowPath.getTotalLength();
        loopArrowPath.style.strokeDasharray = `${pathLen}`;
        loopArrowPath.style.strokeDashoffset = `${pathLen}`;
      }

      // 1. Entrance animation ("rise" on hero card & top header)
      tl.fromTo(
        "#top-header",
        { y: -40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.1,
      );

      tl.fromTo(
        "#hero-card",
        { y: 100, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.15,
      );

      // 2. Progressive stroke draw on the formula loop rail
      if (loopArrowPath) {
        tl.to(
          loopArrowPath,
          { strokeDashoffset: 0, duration: 2.2, ease: "power2.out" },
          0.6,
        );
      }

      // 3. Camera Motion: Smooth zoom-out across the scene (1.08 -> 1.0)
      tl.fromTo(
        "#camera-stage",
        { scale: 1.08 },
        { scale: 1.0, duration: 9.01, ease: "none" },
        0,
      );

      // Subtle editorial organic sway on the hero card
      tl.fromTo(
        "#hero-card",
        { rotation: 0 },
        { rotation: 0.7, duration: 4.2, ease: "sine.inOut" },
        0.9,
      );
      tl.fromTo(
        "#hero-card",
        { rotation: 0.7 },
        { rotation: -0.5, duration: 3.9, ease: "sine.inOut" },
        5.1,
      );

      // 4. Overlay 1: "ĐỀ TÀI THU HÚT" (starts at 0.96s)

        "#badge-1",
        { scale: 0.7, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.96,
      );
      tl.to(
        "#badge-1",
        { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" },
        2.45,
      );

      // 5. Overlay 2: "TRẢI NGHIỆM GIỮ CHÂN" (starts at 3.26s)

        "#badge-2",
        { scale: 0.7, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        3.26,

        { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" },
        4.75,

      // 6. Overlay 3: Punch-phrase "4 MẮT XÍCH CHÍNH" (starts at 6.89s)

        "#punch-card",
        { scale: 0.85, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        6.89,

      tl.fromTo(
        "#punch-digit",
        { scale: 0.6, rotation: -8 },
        { scale: 1, rotation: 0, duration: 0.35, ease: "power3.out" },
        7.05,
      );

      // Register the paused timeline with HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s37"] = tl;
