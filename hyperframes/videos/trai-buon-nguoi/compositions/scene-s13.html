      <style>

.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }

      * {

        width: 100%;
        height: 100%;

      .clip {

        inset: 0;

      /* Mandatory safe color utility classes */
      .hf-text-ink {
        color: #141414;

      .hf-text-light {

        fill: none;
        stroke: #141414;

      .label-text-content {
        margin: 0;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 1.5px;
        line-height: 1.2;
        color: #F7F4EC;
        text-transform: uppercase;
      }

      /* Overlay 2: Punch-phrase "CƠ CHẾ LÒ XO" */
      .overlay-punch-pos {
        position: absolute;
        top: 1160px;
        left: 92px;
        right: 92px;

        flex-direction: column;
        align-items: center;

        letter-spacing: 2px;
        text-transform: uppercase;
        border-radius: 4px 4px 0 0;

      .punch-plate {

        padding: 24px 36px;
        border-radius: 0 8px 8px 8px;
        border-left: 12px solid #FF6A1A;
        box-shadow: 0 20px 48px rgba(20, 20, 20, 0.45);

      .punch-heading {

        font-size: 64px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: 3px;
        color: #F7F4EC;
        text-transform: uppercase;
        text-align: center;

    </style>

    <div
      id="root"
      data-composition-id="scene-s13"

    >

        <div class="bg-grid"></div>
        <div class="bg-spotlight"></div>

      <!-- Main Scene Clip -->

          <div id="hero-img-box">
            <!-- Full color AI collage asset, untouched per DNA exception -->
            <img

        <!-- Technical Diagram Overlays (Force vectors, Calipers, Brackets) -->
        <svg id="diagram-layer" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <!-- Left Caliper & Force Vectors -->
          <path id="caliper-left" class="svg-caliper-line svg-path" d="M 54 440 L 54 1160" />
          <path id="tick-l-1" class="svg-caliper-line svg-path" d="M 44 440 L 64 440" />
          <path id="tick-l-2" class="svg-caliper-line svg-path" d="M 44 800 L 64 800" />
          <path id="tick-l-3" class="svg-caliper-line svg-path" d="M 44 1160 L 64 1160" />
          <path id="arrow-down-l" class="svg-force-arrow svg-path" d="M 54 740 L 54 850 M 42 830 L 54 854 L 66 830" />

          <!-- Right Caliper & Force Vectors -->
          <path id="caliper-right" class="svg-caliper-line svg-path" d="M 1026 440 L 1026 1160" />
          <path id="tick-r-1" class="svg-caliper-line svg-path" d="M 1016 440 L 1036 440" />
          <path id="tick-r-2" class="svg-caliper-line svg-path" d="M 1016 800 L 1036 800" />
          <path id="tick-r-3" class="svg-caliper-line svg-path" d="M 1016 1160 L 1036 1160" />
          <path id="arrow-down-r" class="svg-force-arrow svg-path" d="M 1026 740 L 1026 850 M 1014 830 L 1026 854 L 1038 830" />

      <!-- Overlay 1 Clip: Label "CHUYỂN HÓA TRẢI NGHIỆM" (at 2.18s, duration 1.80s) -->

    <script>
      // Single seekable paused timeline registered on window.__timelines["scene-s13"]
      const tl = gsap.timeline({ paused: true });

      // Setup progressive SVG path drawing
      document.querySelectorAll(".svg-path").forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = `${len}`;
        p.style.strokeDashoffset = `${len}`;
      });

      // 1. Entrance Animation: "strike" (Impactful downward drop with instant settle)
      tl.fromTo(
        "#hero-strike-wrap",
        { y: -140, opacity: 0, scaleY: 1.08 },
        { y: 0, opacity: 1, scaleY: 1.0, duration: 0.42, ease: "power4.out" },
        0
      );

      // Micro-impact vibration on strike landing (t = 0.42s - 0.62s)
      tl.to("#hero-strike-wrap", { y: 8, duration: 0.08, ease: "power1.in" }, 0.42);
      tl.to("#hero-strike-wrap", { y: -3, duration: 0.06, ease: "power1.out" }, 0.50);
      tl.to("#hero-strike-wrap", { y: 0, duration: 0.06, ease: "power2.out" }, 0.56);

      // 2. Camera Motion: Continuous slow zoom-in focusing down into the spring compression
      tl.fromTo(
        "#hero-img-box",
        { scale: 1.0 },
        { scale: 1.10, duration: 7.52, ease: "none" },
        0
      );

      // 3. Technical HUD entrance
      tl.fromTo(
        "#hud-meta",
        { opacity: 0, x: -30 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
        0.5
      );

      // 4. Diagram force vector paths progressive draw
      tl.to("#caliper-left", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 0.6);
      tl.to("#caliper-right", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 0.6);
      tl.to("#bracket-top", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 0.8);
      tl.to("#bracket-bottom", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 0.8);
      tl.to("#tick-l-1", { strokeDashoffset: 0, duration: 0.25, ease: "none" }, 0.9);
      tl.to("#tick-l-2", { strokeDashoffset: 0, duration: 0.25, ease: "none" }, 1.0);
      tl.to("#tick-l-3", { strokeDashoffset: 0, duration: 0.25, ease: "none" }, 1.1);
      tl.to("#tick-r-1", { strokeDashoffset: 0, duration: 0.25, ease: "none" }, 0.9);
      tl.to("#tick-r-2", { strokeDashoffset: 0, duration: 0.25, ease: "none" }, 1.0);
      tl.to("#tick-r-3", { strokeDashoffset: 0, duration: 0.25, ease: "none" }, 1.1);
      tl.to("#arrow-down-l", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 1.15);
      tl.to("#arrow-down-r", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 1.15);

      // 5. Overlay 1 ("CHUYỂN HÓA TRẢI NGHIỆM") at 2.18s
      tl.fromTo(
        "#overlay-1-card",
        { opacity: 0, x: -50 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        2.18
      );
      // Exit fade before clip duration ends (at 3.65s)
      tl.to(
        "#overlay-1-card",
        { opacity: 0, y: -16, duration: 0.3, ease: "power2.in" },
        3.65
      );

      // 6. Overlay 2 ("CƠ CHẾ LÒ XO") at 6.41s
      tl.fromTo(
        "#overlay-2-card",
        { opacity: 0, y: 35, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1.0, duration: 0.42, ease: "power3.out" },
        6.41
      );

      // Bind timeline synchronously to HyperFrames runtime registry
      window.__timelines["scene-s13"] = tl;
    </script>
