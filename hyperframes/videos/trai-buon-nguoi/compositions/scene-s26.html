<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        font-family: "Be Vietnam Pro", sans-serif;
      }
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Photo container */
      .photo-card {
        position: absolute;
        left: 60px;
        top: 270px;
        width: 960px;
        height: 790px;
        background-color: #F5F0E4;
        border: 3px solid #141414;
        box-shadow: 10px 14px 0px rgba(20, 20, 20, 0.2);
        will-change: transform, opacity;
      }
      .photo-inner {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #photo-img {
        position: absolute;
        left: -120px;
        top: 0;
        width: 1220px;
        height: 100%;
        object-fit: cover;
        will-change: transform;
      }

      /* Collage tape accents */
      .tape-corner {
        position: absolute;
        width: 120px;
        height: 32px;
        background: rgba(247, 244, 236, 0.85);
        border: 1.5px solid rgba(20, 20, 20, 0.25);
        z-index: 5;
      }
      .tape-top-left {
        top: -14px;
        left: -20px;
        transform: rotate(-14deg);
      }
      .tape-bottom-right {
        bottom: -14px;
        right: -20px;
        transform: rotate(-10deg);
      }

      /* Overlay 1: Label Badge */
      .label-wrapper {
        position: absolute;
        left: 60px;
        top: 184px;
        width: 960px;
      }
      .label-badge {
        display: inline-block;
        background-color: #FF6A1A;
        padding: 14px 28px;
        border: 3px solid #141414;
        box-shadow: 6px 6px 0px #141414;
        will-change: transform, opacity;
      }
      .label-text {
        font-size: 38px;
        font-weight: 900;
        letter-spacing: 1.2px;
        line-height: 1.2;
        color: #141414;
      }

      /* Overlay 2: Punch Phrase Plate */
      .punch-wrapper {
        position: absolute;
        left: 60px;
        top: 1100px;
        width: 960px;
      }
      .punch-card {
        width: 960px;
        background-color: #141414;
        padding: 30px 36px;
        border-left: 12px solid #FF6A1A;
        border-top: 2px solid rgba(255, 106, 26, 0.35);
        border-right: 2px solid rgba(255, 106, 26, 0.35);
        border-bottom: 2px solid rgba(255, 106, 26, 0.35);
        box-shadow: 10px 14px 0px rgba(20, 20, 20, 0.25);
        will-change: transform, opacity;
      }
      .punch-content {
        display: flex;
        align-items: baseline;
        gap: 18px;
        flex-wrap: wrap;
      }
      .punch-prefix {
        font-size: 44px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 1px;
        line-height: 1;
      }
      .punch-num {
        font-size: 96px;
        font-weight: 900;
        color: #FF6A1A;
        line-height: 1;
        letter-spacing: 0px;
      }
      .punch-suffix {
        font-size: 52px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 1px;
        line-height: 1;
      }

      /* Bottom brand bar */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 99;
      }

      /* Safe contrast utility classes */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
      .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
    </style>

    <div
      id="root"
      data-composition-id="scene-s26"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6.04"
    >
      <!-- Shot 1: Image & Camera Pan -->
      <section id="shot-1" class="clip" data-start="0" data-duration="6.04">
        <div id="photo-container" class="photo-card">
          <div class="photo-inner">
            <img
              id="photo-img"
              src="assets/img-34-mass-escape-wire-fence.jpg"
              alt="Đại cảnh quần chúng tháo chạy"
            />
          </div>
          <div class="tape-corner tape-top-left"></div>
          <div class="tape-corner tape-bottom-right"></div>
        </div>
      </section>

      <!-- Overlay 1: Label Badge -->
      <section id="overlay-label" class="clip" data-start="1.12" data-duration="1.8">
        <div class="label-wrapper">
          <div id="label-badge" class="label-badge hf-hl-orange">
            <span class="label-text hf-text-ink">QUY MÔ ĐÁNG TIỀN</span>
          </div>
        </div>
      </section>

      <!-- Overlay 2: Punch Phrase -->
      <section id="overlay-punch" class="clip" data-start="3.34" data-duration="2.7">
        <div class="punch-wrapper">
          <div id="punch-card" class="punch-card hf-plate-ink">
            <div class="punch-content">
              <span class="punch-prefix hf-text-light">HƠN</span>
              <span id="data-counter" class="punch-num">0</span>
              <span class="punch-suffix hf-text-light">DIỄN VIÊN</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Vox signature fixed bottom orange bar -->
      <div class="bottom-brand-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance animation (grow/scale) cho photo card
      tl.fromTo(
        "#photo-container",
        { scale: 0.88, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.05
      );

      // 2. Camera motion: Pan ngang từ trái sang phải theo dòng người vượt rào
      tl.fromTo(
        "#photo-img",
        { x: -60, scale: 1.12 },
        { x: 40, scale: 1.12, duration: 6.04, ease: "none" },
        0
      );

      // 3. Overlay 1: Label "QUY MÔ ĐÁNG TIỀN" xuất hiện lúc 1.12s
      tl.fromTo(
        "#label-badge",
        { y: -24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.12
      );
      tl.to(
        "#label-badge",
        { y: -10, opacity: 0, duration: 0.25, ease: "power2.in" },
        2.67
      );

      // 4. Overlay 2: Punch-phrase "HƠN 700 DIỄN VIÊN" xuất hiện lúc 3.34s
      tl.fromTo(
        "#punch-card",
        { y: 35, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        3.34
      );

      // Numeric counter tăng từ 0 đến 700 theo ngôn ngữ data
      tl.fromTo(
        "#data-counter",
        { innerText: 0 },
        { innerText: 700, snap: { innerText: 1 }, duration: 0.95, ease: "power2.out" },
        3.42
      );

      // Đăng ký timeline cho HyperFrames seek
      window.__timelines["scene-s26"] = tl;
    </script>
  
    </template>
  </body>
</html>
