<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #F5F0E4;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #F5F0E4;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      /* Photo Card Container */
      .photo-card-wrap {
        position: absolute;
        top: 250px;
        left: 80px;
        width: 920px;
        height: 840px;
        background-color: #141414;
        border: 4px solid #141414;
        box-shadow: 16px 16px 0px rgba(20, 20, 20, 0.14);
        overflow: hidden;
        will-change: transform, opacity;
      }
      .photo-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: 50% 40%;
        will-change: transform;
      }

      /* Tag Overlay */
      .tag-inner {
        position: absolute;
        top: 170px;
        left: 80px;
        display: inline-flex;
        align-items: center;
        gap: 16px;
        background-color: #141414;
        padding: 14px 28px;
        border-radius: 4px;
        box-shadow: 8px 8px 0px rgba(20, 20, 20, 0.12);
        will-change: transform, opacity;
      }
      .tag-indicator {
        width: 10px;
        height: 24px;
        background-color: #FF6A1A;
        border-radius: 2px;
        flex-shrink: 0;
      }
      .tag-text {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 26px;
        letter-spacing: 2px;
        color: #F7F4EC;
        text-transform: uppercase;
        line-height: 1;
      }

      /* Punch Phrase Overlay */
      .punch-inner {
        position: absolute;
        top: 1130px;
        left: 80px;
        width: 920px;
        background-color: #141414;
        border: 4px solid #141414;
        box-shadow: 16px 16px 0px rgba(20, 20, 20, 0.14);
        padding: 36px 44px;
        display: flex;
        align-items: center;
        gap: 24px;
        box-sizing: border-box;
        will-change: transform, opacity;
      }
      .punch-accent-strip {
        width: 12px;
        height: 80px;
        background-color: #FF6A1A;
        flex-shrink: 0;
        transform-origin: top center;
        will-change: transform;
      }
      .punch-heading {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 62px;
        line-height: 1.25;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .punch-text-white {
        color: #F7F4EC;
      }
      .punch-text-orange {
        color: #FF6A1A;
      }

      /* Vox signature bottom bar */
      .vox-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 9999;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s17"
      data-width="1080"
      data-height="1920"
      data-duration="5.8"
    >
      <!-- Main Scene Layer: Background-photo card -->
      <section id="photo-clip" class="clip" data-start="0" data-duration="5.8">
        <div id="photo-card" class="photo-card-wrap">
          <img
            id="hero-img"
            class="photo-img"
            src="assets/img-23-human-trafficking-victims-crowd.jpg"
            alt="Đám đông nạn nhân nhìn từ trên cao"
          />
        </div>
      </section>

      <!-- Overlay 1: Label ĐIỆN ẢNH THƯƠNG MẠI -->
      <section id="label-clip" class="clip" data-start="0.57" data-duration="3.6">
        <div id="label-inner" class="tag-inner">
          <div class="tag-indicator"></div>
          <span class="tag-text">ĐIỆN ẢNH THƯƠNG MẠI</span>
        </div>
      </section>

      <!-- Overlay 2: Punch Phrase MUA CẢM GIÁC THẬT -->
      <section id="punch-clip" class="clip" data-start="4.68" data-duration="1.12">
        <div id="punch-inner" class="punch-inner">
          <div id="punch-strip" class="punch-accent-strip"></div>
          <h1 class="punch-heading">
            <span class="punch-text-white">MUA </span><span class="punch-text-orange">CẢM GIÁC THẬT</span>
          </h1>
        </div>
      </section>

      <!-- Persistent Brand Bottom Bar -->
      <div class="vox-bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance: Photo card rises into the card canvas
      tl.fromTo(
        "#photo-card",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
        0
      );

      // 2. Camera Motion: Slow continuous documentary zoom-in on the crowd
      tl.fromTo(
        "#hero-img",
        { scale: 1.08 },
        { scale: 1.22, duration: 5.8, ease: "none" },
        0
      );

      // 3. Label Entrance: "ĐIỆN ẢNH THƯƠNG MẠI" arrives at 0.57s
      tl.fromTo(
        "#label-inner",
        { y: -24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.57
      );

      // Label Exit: Fades out before the punch phrase beat
      tl.to(
        "#label-inner",
        { y: -16, opacity: 0, duration: 0.35, ease: "power2.in" },
        3.8
      );

      // 4. Punch Phrase Entrance: "MUA CẢM GIÁC THẬT" lands with firm settle at 4.68s
      tl.fromTo(
        "#punch-inner",
        { scale: 0.94, y: 30, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        4.68
      );

      tl.fromTo(
        "#punch-strip",
        { scaleY: 0 },
        { scaleY: 1, duration: 0.4, ease: "power2.out" },
        4.68
      );

      // Register master timeline
      window.__timelines["scene-s17"] = tl;
    </script>
  
    </template>
  </body>
</html>
