<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #E7E3D9;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Background chart variant: 4 ruled lines with left-edge orange ticks */
      .chart-background {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .chart-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: rgba(20, 20, 20, 0.28);
      }
      .line-20 { top: 20%; }
      .line-40 { top: 40%; }
      .line-60 { top: 60%; }
      .line-80 { top: 80%; }
      .chart-tick {
        position: absolute;
        left: 0;
        top: -3px;
        width: 28px;
        height: 8px;
        background: #FF6A1A;
      }

      /* Hero container inside safe zone (Y: 160px - 1390px) */
      .hero-stage {
        position: absolute;
        top: 210px;
        left: 140px;
        width: 800px;
        height: 1020px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hero-card {
        position: relative;
        width: 100%;
        height: 100%;
        background: #F5F0E4;
        border: 4px solid #141414;
        border-radius: 8px;
        box-shadow: 10px 14px 0px rgba(20, 20, 20, 0.85);
        overflow: hidden;
        transform-origin: 50% 50%;
      }
      .hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: 55% 35%;
      }

      /* Overlay 1: Punch phrase "3.000 ➔ 5.000 SUẤT" */
      .punch-wrapper {
        position: absolute;
        top: 270px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        pointer-events: none;
        z-index: 10;
      }
      .punch-plate {
        background: #141414;
        border-left: 10px solid #FF6A1A;
        border-radius: 6px;
        padding: 22px 38px;
        box-shadow: 0 16px 36px rgba(20, 20, 20, 0.45);
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .punch-num {
        color: #F7F4EC;
        font-size: 52px;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .punch-arrow {
        color: #FF6A1A;
        font-size: 46px;
        font-weight: 900;
      }
      .punch-target {
        color: #FF6A1A;
        font-size: 52px;
        font-weight: 900;
        letter-spacing: -0.5px;
      }

      /* Overlay 2: Stamp badge "TREO BẢNG HẾT VÉ" */
      .label-wrapper {
        position: absolute;
        top: 1140px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        pointer-events: none;
        z-index: 20;
      }
      .stamp-badge {
        background: #FF6A1A;
        color: #141414;
        font-size: 46px;
        font-weight: 900;
        padding: 18px 42px;
        border: 4px solid #141414;
        box-shadow: 8px 8px 0px #141414;
        text-transform: uppercase;
        letter-spacing: 2px;
        border-radius: 4px;
        transform-origin: 50% 50%;
      }

      /* Bottom brand bar */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 16px;
        background: #FF6A1A;
        z-index: 50;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s22"
      data-width="1080"
      data-height="1920"
      data-duration="7.99"
    >
      <section id="scene-s22" class="clip" data-start="0" data-duration="7.99">
        <!-- Background chart layout -->
        <div class="chart-background">
          <div class="chart-line line-20"><div class="chart-tick"></div></div>
          <div class="chart-line line-40"><div class="chart-tick"></div></div>
          <div class="chart-line line-60"><div class="chart-tick"></div></div>
          <div class="chart-line line-80"><div class="chart-tick"></div></div>
        </div>

        <!-- Hero graphic card -->
        <div class="hero-stage">
          <div id="hero-card" class="hero-card">
            <img
              id="hero-img"
              class="hero-img"
              src="assets/img-12-paper-cutout-growth-data-chart.jpg"
              alt="Biểu đồ tăng trưởng suất chiếu"
            />
          </div>
        </div>

        <!-- Punch phrase overlay -->
        <div class="punch-wrapper">
          <div id="overlay-punch" class="punch-plate">
            <span class="punch-num">3.000</span>
            <span class="punch-arrow">➔</span>
            <span class="punch-target">5.000 SUẤT</span>
          </div>
        </div>

        <!-- Label stamp overlay -->
        <div class="label-wrapper">
          <div id="overlay-label" class="stamp-badge">
            TREO BẢNG HẾT VÉ
          </div>
        </div>

        <!-- Visual signature bar -->
        <div class="bottom-brand-bar"></div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Initial visual states
      gsap.set("#hero-card", { scale: 0.88, opacity: 0, y: 30 });
      gsap.set("#overlay-punch", { scale: 0.75, opacity: 0, y: 24 });
      gsap.set("#overlay-label", { scale: 1.55, opacity: 0, rotation: -9 });

      // 1. Entrance punch for hero collage card
      tl.to(
        "#hero-card",
        { scale: 1.0, opacity: 1, y: 0, duration: 0.52, ease: "power3.out" },
        0
      );

      // 2. Slow focal camera zoom-in toward 5.000+ marker and arrow
      tl.to(
        "#hero-img",
        { scale: 1.15, duration: 7.47, ease: "none" },
        0.52
      );

      // 3. Punch-phrase entrance at relative 2.41s (151380ms)
      tl.to(
        "#overlay-punch",
        { scale: 1.0, opacity: 1, y: 0, duration: 0.44, ease: "power3.out" },
        2.41
      );

      // 4. Punch-phrase gentle exit after holding ~2.8s (well above 1.6s minimum)
      tl.to(
        "#overlay-punch",
        { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
        5.40
      );

      // 5. Warning stamp slam-in at relative 6.86s (155830ms)
      tl.to(
        "#overlay-label",
        { scale: 1.0, opacity: 1, rotation: -3, duration: 0.26, ease: "power4.out" },
        6.86
      );

      // Register master timeline
      window.__timelines["scene-s22"] = tl;
    </script>
  
    </template>
  </body>
</html>
