    .draw-stroke {

    .ink-stroke {

    .orange-stroke {

      stroke-width: 4;

    /* Signature bottom bar */
    .signature-bottom-bar {

  <div
    id="root"
    data-composition-id="scene-s08"

    data-height="1920"
    data-duration="7.27"
  >
    <!-- Background Card -->
    <div class="bg-card"></div>

    <!-- Main Visual Shot: Document Card -->
    <div id="shot-1" class="clip" data-start="0" data-duration="7.27" data-track-index="0">
      <div id="doc-card" class="doc-card">
        <div class="doc-img-container">
          <img
            src="assets/img-03-human-trafficking-warning-post.jpg"

      <div class="label-wrapper">
        <div id="label-plate" class="label-plate hf-plate-ink">
          <span class="label-dot"></span>
          <span class="label-tag hf-text-light">CẢNH BÁO BÁO CHÍ</span>

        <svg id="phone-svg" class="phone-svg" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">

  <script>
    // Measure and prepare SVG stroke dash offsets for deterministic self-drawing
    const drawStrokes = document.querySelectorAll(".draw-stroke");
    drawStrokes.forEach((p) => {
      if (p.getTotalLength) {
        const len = p.getTotalLength();
        p.style.strokeDasharray = len + "";
        p.style.strokeDashoffset = len + "";
      }
    });

    // Create the master paused timeline
    const tl = gsap.timeline({ paused: true });

    // 1. Document Card entrance (Punch snap at 0.05s)
    tl.fromTo(
      "#doc-card",
      { scale: 0.82, opacity: 0, y: 35 },
      { scale: 1.0, opacity: 1, y: 0, duration: 0.45, ease: "power4.out" },
      0.05
    );

    // Continuous subtle zoom-in across scene
    tl.to(
      "#doc-card",
      { scale: 1.06, y: -15, duration: 6.77, ease: "none" },
      0.5
    );

    // 2. Overlay 1: "CẢNH BÁO BÁO CHÍ" (at 0.81s, hold ~1.8s, fade before clip end)
    tl.fromTo(
      "#label-plate",
      { scale: 0.75, opacity: 0, y: -20 },
      { scale: 1.0, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
      0.81
    );
    tl.to(
      "#label-plate",
      { opacity: 0, y: -15, duration: 0.3, ease: "power2.in" },
      2.65
    );

    // 3. Highlighter marks sweep across key text lines
    tl.fromTo(
      "#hl-1",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.75, ease: "power2.out" },
      2.0
    );
    tl.fromTo(
      "#hl-2",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.7, ease: "power2.out" },
      3.1
    );
    tl.fromTo(
      "#hl-3",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.65, ease: "power2.out" },
      4.2
    );

    // 4. Overlay 2: Phone icon badge entrance at 5.51s
    tl.fromTo(
      "#phone-badge",
      { scale: 0, opacity: 0, rotation: -12 },
      { scale: 1.0, opacity: 1, rotation: 0, duration: 0.4, ease: "power3.out" },
      5.51
    );

    // Progressive self-drawing strokes for the phone icon
    tl.to("#phone-body", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 5.65);
    tl.to("#phone-screen", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 5.85);
    tl.to("#phone-speaker", { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, 6.0);
    tl.to("#phone-home", { strokeDashoffset: 0, duration: 0.15, ease: "power2.out" }, 6.1);
    tl.to("#phone-msg", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 6.2);

    // Register paused timeline on window.__timelines
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s08"] = tl;
  </script>
