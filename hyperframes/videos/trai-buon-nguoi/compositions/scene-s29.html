    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance "rise" cho khung ảnh collage và băng dính (từ 0.0s đến 0.85s)
      tl.fromTo(
        "#photo-card-wrap",
        { y: 110, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.85, ease: "power3.out" },
        0
      );
      tl.fromTo(
        "#tape-top",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.35

      tl.fromTo(

        { scale: 0, opacity: 0 },

        "#hero-photo",
        { scale: 1.1 },
        { scale: 1.25, duration: 8.07, ease: "none" },
        0

      // 3. Overlay 1 animation: Pop-in tại 4.61s và thu hồi trước khi hết clip

        "#label-anchor-inner",
        { scale: 0.88, opacity: 0, y: 22 },
        { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        4.61

      tl.fromTo(
        "#label-anchor-inner",
        { opacity: 1, y: 0 },
        { opacity: 0, y: -16, duration: 0.28, ease: "power2.in" },
        6.20
      );

      // 4. Overlay 2 animation: Punch-phrase strike mạnh mẽ tại 6.64s
      tl.fromTo(
        "#punch-anchor-inner",
        { scale: 1.12, opacity: 0, y: 28 },
        { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
        6.64
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s29"] = tl;
