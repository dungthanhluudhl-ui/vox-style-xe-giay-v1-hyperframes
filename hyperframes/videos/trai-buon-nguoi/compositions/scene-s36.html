        text-transform: uppercase;

    </style>

    <div
      id="root"
      data-composition-id="scene-s36"
      data-width="1080"
      data-height="1920"
      data-duration="5.26"
    >
      <!-- Shot 1: Khung hình chính chứa ảnh tư liệu và chuyển động camera -->
      <section id="shot-1" class="clip" data-start="0" data-duration="5.26">
        <div class="scene-header">
          <span class="header-tag">CƠ CHẾ // TÂM LÝ & LAN TRUYỀN</span>
          <div class="header-line"></div>

          <div class="tape-strip"></div>

      <!-- Overlay 1: Nhãn ĐÓNG GÓI NỖI SỢ (1.39s -> 3.19s) -->
      <div
        id="clip-overlay-1"
        class="clip"
        data-start="1.39"
        data-duration="1.8"
        style="pointer-events: none; z-index: 20;"
      >
        <div id="overlay-1-wrap">
          <div id="badge-1" class="hf-plate-ink">
            <span class="badge-kicker">CÔNG THỨC ĐIỆN ẢNH</span>

            <div id="badge-1-bar"></div>
          </div>
        </div>
      </div>

      <!-- Overlay 2: Biểu tượng đám đông self-drawing (3.88s -> 5.26s) -->
      <div
        id="clip-overlay-2"
        class="clip"
        data-start="3.88"
        data-duration="1.38"
        style="pointer-events: none; z-index: 20;"
      >
        <div id="overlay-2-wrap">
          <div id="badge-crowd" class="hf-plate-ink">
            <!-- Icon SVG crowd tự vẽ theo từ vựng Vox -->
            <svg
              class="crowd-svg"
              viewBox="0 0 80 60"
              xmlns="http://www.w3.org/2000/svg"
            >
              <!-- Người trung tâm -->
              <circle class="crowd-path" cx="40" cy="20" r="11" />
              <path class="crowd-path" d="M 20 54 C 20 38, 60 38, 60 54" />
              <!-- Người bên trái -->
              <circle class="crowd-path" cx="18" cy="25" r="8" />

              <!-- Người bên phải -->

            <div id="crowd-text-block" class="crowd-text-block">

    <script>
      // Chuẩn bị đường vẽ SVG Path cho icon crowd
      document.querySelectorAll(".crowd-path").forEach(function (path) {
        var len = path.getTotalLength ? path.getTotalLength() : 80;
        path.style.strokeDasharray = len + "";
        path.style.strokeDashoffset = len + "";
      });

      // Tạo timeline chính duy nhất, ở trạng thái paused
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance: Hiệu ứng unfold mở phẳng panel tranh cắt giấy
      tl.fromTo(
        "#panel-frame",
        {
          scaleY: 0.25,
          rotationX: -65,
          opacity: 0,
          y: -40,
        },
        {
          scaleY: 1,
          rotationX: 0,
          opacity: 1,
          y: 0,
          duration: 0.85,
          ease: "power3.out",
        },
        0.1
      );

      tl.fromTo(
        "#crease-overlay",
        { opacity: 0.5 },
        { opacity: 0, duration: 0.75, ease: "power2.out" },
        0.2
      );

      // 2. Camera Motion: Pan từ đám đông cửa Exit hướng lên bầu trời ngập biểu tượng chia sẻ
      tl.fromTo(
        "#hero-img",
        {
          y: -440,
          x: -30,
          scale: 1.06,
        },
        {
          y: -60,
          x: 20,
          scale: 1.18,
          duration: 4.4,
          ease: "sine.inOut",
        },
        0.5
      );

      // 3. Overlay 1: Nhãn ĐÓNG GÓI NỖI SỢ xuất hiện ở 1.39s và rút đi trước 3.19s
      tl.fromTo(
        "#badge-1",
        { scale: 0.85, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        1.39
      );

      tl.fromTo(
        "#badge-1-bar",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.35, ease: "power2.out" },
        1.55
      );

      tl.to(
        "#badge-1",
        { opacity: 0, y: -16, duration: 0.22, ease: "power2.in" },
        2.95
      );

      // 4. Overlay 2: Biểu tượng đám đông xuất hiện ở 3.88s và tự vẽ nét SVG
      tl.fromTo(
        "#badge-crowd",
        { scale: 0.85, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        3.88
      );

      tl.to(
        ".crowd-path",
        {
          strokeDashoffset: 0,
          duration: 0.55,
          ease: "power2.out",
          stagger: 0.06,
        },
        3.95
      );

      tl.fromTo(
        "#crowd-text-block",
        { opacity: 0, x: 15 },
        { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" },
        4.1
      );

      tl.to(
        "#badge-crowd",
        { opacity: 0, duration: 0.16, ease: "power2.in" },
        5.08
      );

      // BẮT BUỘC: Đăng ký timeline đã build xong vào registry
      window.__timelines["scene-s36"] = tl;
    </script>
