<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Style tokens: colors & background grid */
      .grid-bg {
        position: absolute;
        inset: 0;
        background-color: #e7e3d9;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        background-position: -1.5px -1.5px;
      }

      /* Bottom signature bar */
      .bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 100;
      }

      /* Mockup Window - Browser / Document Container */
      .mockup-wrapper {
        position: absolute;
        top: 240px;
        left: 70px;
        width: 940px;
        height: 870px;
        transform-origin: 0% 0%;
        perspective: 1200px;
      }

      .mockup-card {
        width: 100%;
        height: 100%;
        background: #f5f0e4;
        border: 4px solid #141414;
        border-radius: 12px;
        box-shadow: 14px 14px 0px #141414;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      /* Browser Header */
      .mockup-header {
        height: 58px;
        background: #141414;
        border-bottom: 3px solid #141414;
        display: flex;
        align-items: center;
        padding: 0 18px;
        gap: 12px;
        flex-shrink: 0;
      }

      .browser-dots {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ff6a1a;
      }
      .dot.gray {
        background: #e7e3d9;
      }
      .dot.dim {
        background: rgba(231, 227, 217, 0.4);
      }

      .browser-url-bar {
        flex: 1;
        height: 36px;
        background: #242424;
        border-radius: 6px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        color: #f7f4ec;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .browser-badge {
        background: #ff6a1a;
        color: #141414;
        font-size: 14px;
        font-weight: 900;
        padding: 4px 10px;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* Mockup Content Viewport */
      .mockup-body {
        position: relative;
        flex: 1;
        overflow: hidden;
        background: #0d0f12;
      }

      .media-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        transform-origin: 50% 30%;
        display: block;
      }

      /* Fiction vs Reality editorial label */
      .tape-tag {
        position: absolute;
        top: 20px;
        left: -10px;
        background: #f5f0e4;
        color: #141414;
        border: 3px solid #141414;
        box-shadow: 4px 4px 0px #141414;
        font-size: 20px;
        font-weight: 900;
        padding: 6px 18px;
        transform: rotate(-3deg);
        z-index: 10;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* Overlay 1: Stamp Label */
      .stamp-container {
        position: absolute;
        top: 500px;
        left: 90px;
        transform-origin: 50% 50%;
        z-index: 20;
        opacity: 0;
      }

      .stamp-badge {
        background: #ff6a1a;
        color: #141414;
        border: 4px solid #141414;
        box-shadow: 8px 8px 0px #141414;
        padding: 14px 28px;
        font-size: 38px;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
        display: inline-block;
        transform: rotate(-4deg);
      }

      /* Overlay 2: Punch Phrase Plate */
      .punch-wrapper {
        position: absolute;
        bottom: 560px;
        left: 70px;
        width: 940px;
        z-index: 30;
        opacity: 0;
      }

      .punch-plate {
        background: #141414;
        border: 4px solid #141414;
        border-radius: 10px;
        box-shadow: 12px 12px 0px #ff6a1a;
        padding: 28px 36px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .punch-label {
        color: #ff6a1a;
        font-size: 26px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }

      .punch-title {
        color: #f7f4ec;
        font-size: 68px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.5px;
        text-transform: uppercase;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s35"
      data-width="1080"
      data-height="1920"
      data-duration="11.51"
      data-start="0"
    >
      <section id="scene-s35" class="clip" data-start="0" data-duration="11.51">
        <!-- Visual background -->
        <div class="grid-bg"></div>

        <!-- Central Mockup Container -->
        <div class="mockup-wrapper" id="mockupWrapper">
          <div class="mockup-card" id="mockupCard">
            <!-- Browser Header -->
            <div class="mockup-header">
              <div class="browser-dots">
                <span class="dot"></span>
                <span class="dot gray"></span>
                <span class="dot dim"></span>
              </div>
              <div class="browser-url-bar">cinestar.com.vn/phim/trai-buon-nguoi</div>
              <div class="browser-badge">Rạp chiếu</div>
            </div>

            <!-- Browser Viewport with Media Image -->
            <div class="mockup-body">
              <div class="tape-tag">Hư cấu điện ảnh</div>
              <img
                id="mediaImage"
                class="media-img"
                src="assets/img-25-human-trafficking-movie-listing.jpg"
                alt="Human trafficking movie listing"
              />
            </div>
          </div>
        </div>

        <!-- Overlay 1: Stamp Label (atMs: 257110 -> 5.15s) -->
        <div class="stamp-container" id="stampOverlay">
          <div class="stamp-badge">KHÔNG PHẢI CHUYỆN MỚI</div>
        </div>

        <!-- Overlay 2: Punch Phrase (atMs: 261820 -> 9.86s) -->
        <div class="punch-wrapper" id="punchOverlay">
          <div class="punch-plate">
            <div class="punch-label">Hiện thực xã hội</div>
            <div class="punch-title">CÂU CHUYỆN QUEN THUỘC</div>
          </div>
        </div>

        <!-- Signature bottom bar -->
        <div class="bottom-bar"></div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance Animation: "peel" unfold of mockup card (0.0s - 0.85s)
      tl.fromTo(
        "#mockupWrapper",
        {
          opacity: 0,
          scale: 0.86,
          rotationY: 22,
          rotationZ: -4,
          y: 40,
        },
        {
          opacity: 1,
          scale: 1,
          rotationY: 0,
          rotationZ: 0,
          y: 0,
          duration: 0.85,
          ease: "power3.out",
        },
        0.1,
      );

      // 2. Camera motion: zoom-in & pan down across the 11.51s scene
      tl.fromTo(
        "#mediaImage",
        {
          scale: 1.08,
          y: 0,
        },
        {
          scale: 1.24,
          y: -170,
          duration: 11.51,
          ease: "none",
        },
        0,
      );

      // Subtle slow push on mockup container
      tl.to(
        "#mockupCard",
        {
          y: -10,
          duration: 11.51,
          ease: "sine.out",
        },
        0,
      );

      // 3. Overlay 1: Stamp Pop "KHÔNG PHẢI CHUYỆN MỚI"
      // Appears at 5.15s, holds for ~1.9s, fades before final punch phrase
      tl.fromTo(
        "#stampOverlay",
        {
          opacity: 0,
          scale: 1.7,
          rotation: -14,
        },
        {
          opacity: 1,
          scale: 1,
          rotation: -3,
          duration: 0.42,
          ease: "power4.out",
        },
        5.15,
      );

      tl.to(
        "#stampOverlay",
        {
          opacity: 0,
          scale: 0.95,
          y: -15,
          duration: 0.35,
          ease: "power2.in",
        },
        7.4,
      );

      // 4. Overlay 2: Punch Phrase "CÂU CHUYỆN QUEN THUỘC"
      // Appears at 9.86s, holds firmly until scene end (11.51s)
      tl.fromTo(
        "#punchOverlay",
        {
          opacity: 0,
          y: 50,
          scale: 0.96,
        },
        {
          opacity: 1,
          y: 0,
          scale: 1,
          duration: 0.5,
          ease: "power3.out",
        },
        9.86,
      );

      // Register master timeline
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s35"] = tl;
    </script>
  
    </template>
  </body>
</html>
