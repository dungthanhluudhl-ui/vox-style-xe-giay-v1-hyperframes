    <div id="video-wrapper">

  <script>
    // HyperFrames deterministic paused timeline setup
    const tl = gsap.timeline({ paused: true });

    // Camera motion: zoom-through entrance into slow pan-right
    // Settle from zoom-through at the beginning
    tl.fromTo(
      "#video-wrapper",
      { scale: 1.28, x: 20 },
      { scale: 1.12, x: 5, duration: 1.5, ease: "power2.out" },
      0
    );

    // Continuous slow drift panning across boiler room screens
    tl.to(
      "#video-wrapper",
      { scale: 1.2, x: -35, duration: 5.94, ease: "sine.inOut" },
      1.5
    );

    // Overlay 1: SÀO HUYỆT CÔNG NGHỆ
    // Entrance: smooth spring settle arrival at 1.75s
    tl.fromTo(
      "#card-1",
      { scale: 0.86, opacity: 0, y: 35 },
      { scale: 1, opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
      1.75
    );

    // Exit: clean fade out before clip boundary at 3.25s
    tl.to(
      "#card-1",
      { opacity: 0, y: -20, scale: 0.95, duration: 0.3, ease: "power2.in" },
      3.25
    );

    // Overlay 2: MẮC KẸT BÊN TRONG
    // Entrance: dramatic impact arrival at 6.28s
    tl.fromTo(
      "#card-2",
      { scale: 1.16, opacity: 0, y: 25 },
      { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power4.out" },
      6.28
    );

    // Register paused timeline to HyperFrames runtime
    window.__timelines["scene-s18"] = tl;
