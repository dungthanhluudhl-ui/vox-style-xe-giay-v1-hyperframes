<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Base composition clip layout */
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Vox Style Background: 84px grid pattern */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-color: #e7e3d9;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        z-index: 1;
      }

      /* Background Variant: Spotlight radial vignette for consequence/suffocating mood */
      .bg-spotlight {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 46%,
          rgba(20, 20, 20, 0.05) 30%,
          rgba(20, 20, 20, 0.38) 75%,
          rgba(20, 20, 20, 0.65) 100%
        );
        z-index: 2;
        pointer-events: none;
      }

      /* Mandatory brand signature: fixed orange bar at the bottom edge */
      .bottom-orange-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 10px;
        background-color: #ff6a1a;
        z-index: 100;
      }

      /* Photo container card (centered inside usable band Y: 160 -> 1390) */
      .photo-card {
        position: absolute;
        left: 60px;
        top: 190px;
        width: 960px;
        height: 1180px;
        background-color: #141414;
        border: 4px solid #141414;
        box-shadow: 0 24px 60px rgba(20, 20, 20, 0.38);
        overflow: hidden;
        z-index: 5;
        transform-origin: 50% 40%;
        will-change: transform, opacity;
      }

      .photo-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 25%;
        display: block;
        transform-origin: 50% 30%;
        will-change: transform;
      }

      /* Corner index crosshairs */
      .corner-mark {
        position: absolute;
        width: 22px;
        height: 22px;
        border-color: #ff6a1a;
        z-index: 8;
        pointer-events: none;
      }
      .mark-tl {
        top: 172px;
        left: 42px;
        border-top: 3px solid #ff6a1a;
        border-left: 3px solid #ff6a1a;
      }
      .mark-br {
        top: 1378px;
        left: 1016px;
        border-bottom: 3px solid #ff6a1a;
        border-right: 3px solid #ff6a1a;
      }

      /* Overlay Callout Plates (WCAG Safe, Solid Plates on Visual Media) */
      .overlay-clip {
        pointer-events: none;
        z-index: 20;
      }

      .callout-wrapper {
        position: absolute;
        height: auto;
        pointer-events: auto;
        will-change: transform, opacity;
      }

      .callout-top {
        top: 230px;
        left: 92px;
      }

      .callout-bottom {
        top: 1220px;
        left: 92px;
      }

      /* Plate 1: Solid ink plate (#141414) with pure onDarkText (#F7F4EC) - Contrast 16.8:1 */
      .plate-ink {
        display: flex;
        align-items: center;
        background-color: #141414;
        border-left: 8px solid #ff6a1a;
        padding: 16px 28px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      }

      .plate-text-primary {
        color: #f7f4ec;
        font-weight: 900;
        font-size: 42px;
        line-height: 1.2;
        letter-spacing: -0.5px;
        margin: 0;
        text-transform: uppercase;
      }

      /* Plate 2: Solid orange plate (#FF6A1A) with ink text (#141414) - Contrast 6.4:1 */
      .plate-orange {
        display: flex;
        align-items: center;
        background-color: #ff6a1a;
        border: 4px solid #141414;
        padding: 16px 28px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      }

      .plate-text-dark {
        color: #141414;
        font-weight: 900;
        font-size: 44px;
        line-height: 1.2;
        letter-spacing: -0.5px;
        margin: 0;
        text-transform: uppercase;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s15"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="5.04"
    >
      <!-- Base Background layer with 84px grid -->
      <div class="bg-grid"></div>

      <!-- Spotlight Vignette layer for warning / consequence tone -->
      <div class="bg-spotlight"></div>

      <!-- Main Visual Scene Clip (0.00s -> 5.04s) -->
      <section
        id="scene-s15"
        class="clip"
        data-start="0"
        data-duration="5.04"
        data-track-index="0"
      >
        <!-- Corner documentary markings -->
        <div class="corner-mark mark-tl"></div>
        <div class="corner-mark mark-br"></div>

        <!-- Photo Card Container (wobble-drop entrance) -->
        <div id="photo-card" class="photo-card">
          <img
            id="photo-img"
            class="photo-img"
            src="assets/img-31-injured-man-protecting-victim.jpg"
            alt="Người đàn ông che chở nạn nhân"
          />
        </div>
      </section>

      <!-- Overlay 1: PHẢN KHÁNG BỊ DẬP (atMs: 101840 -> 0.28s, holdMs: 1600 -> 1.60s) -->
      <aside
        id="clip-overlay-1"
        class="clip overlay-clip"
        data-start="0.28"
        data-duration="1.60"
        data-track-index="1"
      >
        <div id="badge-overlay-1" class="callout-wrapper callout-top">
          <div class="plate-ink">
            <span class="plate-text-primary">PHẢN KHÁNG BỊ DẬP</span>
          </div>
        </div>
      </aside>

      <!-- Overlay 2: BỨC BỐI GIA TĂNG (atMs: 104790 -> 3.23s, holdMs: 1700 -> 1.70s) -->
      <aside
        id="clip-overlay-2"
        class="clip overlay-clip"
        data-start="3.23"
        data-duration="1.70"
        data-track-index="1"
      >
        <div id="badge-overlay-2" class="callout-wrapper callout-bottom">
          <div class="plate-orange">
            <span class="plate-text-dark">BỨC BỐI GIA TĂNG</span>
          </div>
        </div>
      </aside>

      <!-- Vox Brand Bottom Orange Bar -->
      <div class="bottom-orange-bar"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1. Wobble-drop entrance for Photo Card (drop from top with organic settle)
      tl.fromTo(
        "#photo-card",
        { y: -180, rotation: -3.5, scale: 0.94, opacity: 0 },
        {
          y: 0,
          rotation: 0,
          scale: 1,
          opacity: 1,
          duration: 0.85,
          ease: "power2.out",
        },
        0.05
      );

      // Subtle organic sway after drop to keep visual breathing
      tl.to(
        "#photo-card",
        {
          rotation: 0.4,
          duration: 2.1,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 1,
        },
        0.9
      );

      // 2. Slow continuous zoom-in camera motion into the man's expression
      tl.fromTo(
        "#photo-img",
        { scale: 1.05, y: 0 },
        { scale: 1.18, y: -25, duration: 5.04, ease: "sine.out" },
        0
      );

      // 3. Overlay 1 Entrance & Exit ("PHẢN KHÁNG BỊ DẬP", visible 0.28s -> 1.88s)
      tl.fromTo(
        "#badge-overlay-1",
        { x: -40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.28
      );
      tl.to(
        "#badge-overlay-1",
        { opacity: 0, x: -20, duration: 0.2, ease: "power2.in" },
        1.65
      );

      // 4. Overlay 2 Entrance & Exit ("BỨC BỐI GIA TĂNG", visible 3.23s -> 4.93s)
      tl.fromTo(
        "#badge-overlay-2",
        { y: 32, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        3.23
      );
      tl.to(
        "#badge-overlay-2",
        { opacity: 0, y: 16, duration: 0.2, ease: "power2.in" },
        4.7
      );

      // Register master timeline on window.__timelines
      window.__timelines["scene-s15"] = tl;
    </script>
  
    </template>
  </body>
</html>
