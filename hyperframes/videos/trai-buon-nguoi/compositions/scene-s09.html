<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Quy ước clip của HyperFrames Core */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Nền lưới 84px chuẩn Vox DNA */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        background-position: 0 0;
      }

      /* Viewport Camera & Image Wrapper */
      #camera-viewport {
        position: absolute;
        inset: 0;
        transform-origin: 50% 20%;
      }

      #image-wrapper {
        position: absolute;
        top: -60px;
        left: -40px;
        width: 1160px;
        height: 2079px;
      }

      #main-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Băng keo dán góc phong cách Collage Paper */
      .tape {
        position: absolute;
        height: 38px;
        width: 140px;
        background: rgba(245, 240, 228, 0.88);
        border: 1px dashed rgba(20, 20, 20, 0.3);
        box-shadow: 2px 3px 6px rgba(0, 0, 0, 0.2);
        z-index: 5;
      }

      .tape-top-right {
        top: 240px;
        right: 40px;
        transform: rotate(18deg);
      }

      .tape-mid-left {
        top: 960px;
        left: 20px;
        transform: rotate(-12deg);
      }

      /* Technical Reticle / Diagram element */
      #diagram-reticle {
        position: absolute;
        top: 480px;
        left: 490px;
        width: 140px;
        height: 140px;
        transform-origin: center center;
        z-index: 6;
      }

      /* Top Editorial Ruler */
      .editorial-header {
        position: absolute;
        top: 60px;
        left: 60px;
        right: 60px;
        height: 52px;
        background: #141414;
        border: 2px solid #FF6A1A;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        z-index: 20;
      }

      .header-code {
        font-size: 20px;
        font-weight: 900;
        color: #FF6A1A;
        letter-spacing: 2px;
      }

      .header-ticks {
        font-size: 15px;
        color: #F7F4EC;
        letter-spacing: 5px;
        opacity: 0.6;
      }

      .header-status {
        font-size: 18px;
        font-weight: 700;
        color: #F7F4EC;
      }

      /* Overlay 1: Label "TÂM LÝ CÓ SẴN" - Usable band top (360px) */
      #overlay-label-container {
        position: absolute;
        top: 360px;
        left: 70px;
        width: 620px;
        z-index: 30;
      }

      .diagram-card {
        background: #141414;
        border-left: 10px solid #FF6A1A;
        box-shadow: 12px 14px 0px rgba(20, 20, 20, 0.7);
        padding: 28px 32px;
      }

      .card-kicker {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .kicker-dot {
        width: 10px;
        height: 10px;
        background: #FF6A1A;
      }

      .kicker-text {
        font-size: 20px;
        font-weight: 700;
        color: #FF6A1A;
        letter-spacing: 1.5px;
      }

      .card-title {
        margin: 0 0 16px 0;
        font-size: 58px;
        font-weight: 900;
        line-height: 1.15;
        color: #F7F4EC;
        letter-spacing: -0.5px;
      }

      .card-tags {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .tag-pill {
        background: #FF6A1A;
        color: #141414;
        font-size: 19px;
        font-weight: 900;
        padding: 6px 14px;
      }

      .tag-meta {
        color: #E7E3D9;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      /* Overlay 2: Warning Badge with Icon "ban"
         Định vị tại top: 1150px (usable band kết thúc tại 1390px; card cao ~160px => bottom kết thúc tại 1310px,
         hoàn toàn nằm TRÊN vùng caption band an toàn > 530px từ đáy) */
      #overlay-ban-container {
        position: absolute;
        top: 1150px;
        left: 70px;
        right: 70px;
        z-index: 35;
      }

      .warning-card {
        background: #141414;
        border: 4px solid #FF6A1A;
        box-shadow: 12px 14px 0px rgba(20, 20, 20, 0.75);
        padding: 24px 32px;
        display: flex;
        align-items: center;
        gap: 28px;
      }

      .svg-ban-box {
        width: 110px;
        height: 110px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
      }

      .warning-info {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .warning-status {
        font-size: 22px;
        font-weight: 700;
        color: #FF6A1A;
        letter-spacing: 2px;
      }

      .warning-headline {
        font-size: 46px;
        font-weight: 900;
        color: #F7F4EC;
        line-height: 1.2;
      }

      /* Visual Signature: Bottom Orange Bar */
      .bottom-orange-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 14px;
        background: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s09"
      data-width="1080"
      data-height="1920"
      data-duration="8.88"
      data-start="0"
    >
      <!-- Background Grid -->
      <div class="bg-grid"></div>

      <!-- Main Visual Scene Clip (0s - 8.88s) -->
      <section id="scene-clip" class="clip" data-start="0" data-duration="8.88">
        <div id="camera-viewport">
          <div id="image-wrapper">
            <img
              id="main-img"
              src="assets/img-22-scam-trap-movie-theater-collage.jpg"
              alt="Bẫy lừa đảo rạp chiếu phim collage"
            />
            <div class="tape tape-top-right"></div>
            <div class="tape tape-mid-left"></div>

            <!-- Target Reticle Overlay -->
            <div id="diagram-reticle">
              <svg width="140" height="140" viewBox="0 0 140 140" fill="none">
                <circle cx="70" cy="70" r="58" stroke="#FF6A1A" stroke-width="2.5" stroke-dasharray="8 6" />
                <circle cx="70" cy="70" r="28" stroke="#FF6A1A" stroke-width="1.5" stroke-opacity="0.8" />
                <line x1="70" y1="0" x2="70" y2="140" stroke="#FF6A1A" stroke-width="2" stroke-opacity="0.7" />
                <line x1="0" y1="70" x2="140" y2="70" stroke="#FF6A1A" stroke-width="2" stroke-opacity="0.7" />
              </svg>
            </div>
          </div>
        </div>

        <!-- Frame Header Ruler -->
        <div class="editorial-header">
          <span class="header-code">MECHANISM // S09</span>
          <span class="header-ticks">||||||||||||||||||||||||</span>
          <span class="header-status">ARCHIVE REF: FIG. 22</span>
        </div>
      </section>

      <!-- Overlay 1: Label "TÂM LÝ CÓ SẴN" (at 2.62s, hold 1.8s) -->
      <div id="clip-label" class="clip" data-start="2.62" data-duration="2.1">
        <div id="overlay-label-container">
          <div id="label-card-content" class="diagram-card">
            <div class="card-kicker">
              <div class="kicker-dot"></div>
              <span class="kicker-text">ĐỊNH HÌNH TÂM THẾ</span>
            </div>
            <h1 class="card-title">TÂM LÝ CÓ SẴN</h1>
            <div class="card-tags">
              <span class="tag-pill">CẢNH GIÁC TRƯỚC</span>
              <span class="tag-meta">[CONTEXT ARMED]</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Overlay 2: Icon "ban" + Warning Card (at 7.00s, hold 1.88s) -->
      <div id="clip-ban" class="clip" data-start="7.00" data-duration="1.88">
        <div id="overlay-ban-container">
          <div id="ban-card-content" class="warning-card">
            <div class="svg-ban-box">
              <svg width="100" height="100" viewBox="0 0 100 100" fill="none">
                <circle
                  id="ban-path-circle"
                  cx="50"
                  cy="50"
                  r="42"
                  stroke="#FF6A1A"
                  stroke-width="9"
                  stroke-linecap="round"
                />
                <line
                  id="ban-path-slash"
                  x1="20"
                  y1="20"
                  x2="80"
                  y2="80"
                  stroke="#FF6A1A"
                  stroke-width="9"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <div class="warning-info">
              <span class="warning-status">CẢNH BÁO SCAM TRAP</span>
              <span class="warning-headline">VIỆC NHẸ LƯƠNG CAO</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Fixed Signature Orange Bar -->
      <div class="bottom-orange-bar"></div>
    </div>

    <script>
      // Khởi tạo duy nhất một timeline paused cho HyperFrames seek
      const tl = gsap.timeline({ paused: true });

      // 1. Phục vụ SVG Path Draw: Chuẩn bị dasharray và dashoffset từ hình học thực tế
      const banCircle = document.getElementById("ban-path-circle");
      const banSlash = document.getElementById("ban-path-slash");
      if (banCircle && banSlash) {
        const circleLength = banCircle.getTotalLength();
        banCircle.style.strokeDasharray = circleLength;
        banCircle.style.strokeDashoffset = circleLength;

        const slashLength = banSlash.getTotalLength();
        banSlash.style.strokeDasharray = slashLength;
        banSlash.style.strokeDashoffset = slashLength;
      }

      // 2. Transition In: "wobble-drop" (rơi từ trên xuống, rung nhẹ góc rồi settle dứt khoát)
      tl.fromTo(
        "#camera-viewport",
        { y: -110, rotation: 2.4, scale: 1.05 },
        { y: 0, rotation: 0, scale: 1, duration: 0.72, ease: "power3.out" },
        0
      );

      // Diagram reticle xuất hiện và xoay chậm
      tl.fromTo(
        "#diagram-reticle",
        { opacity: 0, scale: 0.6 },
        { opacity: 0.9, scale: 1, duration: 0.6, ease: "power2.out" },
        0.3
      );
      tl.to("#diagram-reticle", { rotation: 75, duration: 8.0, ease: "none" }, 0.8);

      // 3. Camera Motion: Pan chậm từ cửa rạp phía trên xuống vùng SCAM TRAP phía dưới kết hợp pan-left
      tl.to(
        "#image-wrapper",
        { y: -175, x: -55, duration: 8.16, ease: "sine.inOut" },
        0.72
      );

      // 4. Overlay 1 Animation: "TÂM LÝ CÓ SẴN" (bắt đầu tại 2.62s)
      tl.fromTo(
        "#label-card-content",
        { x: -40, opacity: 0, scale: 0.95 },
        { x: 0, opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" },
        2.62
      );
      // Kết thúc hold sau 1.8s (tại 4.42s) -> fade out êm
      tl.to(
        "#label-card-content",
        { opacity: 0, y: -16, duration: 0.3, ease: "power2.in" },
        4.42
      );

      // 5. Overlay 2 Animation: Icon "ban" + Warning Card (bắt đầu tại 7.00s)
      tl.fromTo(
        "#ban-card-content",
        { y: 35, opacity: 0, scale: 0.92 },
        { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
        7.00
      );

      // SVG path draw cho icon "ban"
      if (banCircle && banSlash) {
        tl.to(
          banCircle,
          { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
          7.12
        );
        tl.to(
          banSlash,
          { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
          7.45
        );
      }

      // Đăng ký timeline cho render engine HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s09"] = tl;
    </script>
  
    </template>
  </body>
</html>
