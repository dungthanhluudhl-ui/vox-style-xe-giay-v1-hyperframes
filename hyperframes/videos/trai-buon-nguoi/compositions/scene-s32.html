<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    /* Reset & Canvas Contract */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Composition Root: sized via 100% per HyperFrames contract */
    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    /* Core Clip Contract: absolute inset 0 */
    .clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* Background: Paper texture with Vox 84px Grid */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      background-size: 84px 84px;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      z-index: 1;
    }

    /* Permanent Signature bottom accent bar */
    .bottom-accent-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 10px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Background narrative metaphor: Script cracks layer (pure SVG geometry, no occluded text) */
    .cracks-layer {
      position: absolute;
      top: 320px;
      left: 120px;
      width: 840px;
      height: 800px;
      z-index: 2;
      pointer-events: none;
    }

    .cracks-svg {
      width: 100%;
      height: 100%;
    }

    .crack-path {
      fill: none;
      stroke: #141414;
      stroke-width: 3.5;
      stroke-dasharray: 6 6;
      stroke-linecap: round;
      opacity: 0.8;
    }

    /* Camera motion container (steady zoom-in on hero content) */
    .camera-rig {
      position: absolute;
      inset: 0;
      transform-origin: 540px 720px;
      z-index: 5;
      will-change: transform;
    }

    /* Technical diagram brackets framing hero */
    .diagram-brackets {
      position: absolute;
      top: 280px;
      left: 150px;
      width: 780px;
      height: 880px;
      pointer-events: none;
      z-index: 6;
    }

    .diagram-svg {
      width: 100%;
      height: 100%;
    }

    .bracket-line {
      fill: none;
      stroke: #141414;
      stroke-width: 2.5;
    }

    /* Main Hero Frame: Mystery Box Cutout & Diagram */
    .hero-card {
      position: absolute;
      top: 320px;
      left: 190px;
      width: 700px;
      height: 800px;
      background-color: #F5F0E4;
      border: 4px solid #141414;
      box-shadow: 14px 14px 0px #141414;
      overflow: hidden;
      transform-origin: center center;
      z-index: 8;
      will-change: transform, opacity;
    }

    /* Inner cutout artwork */
    .hero-image {
      position: absolute;
      inset: 16px;
      width: calc(100% - 32px);
      height: calc(100% - 32px);
      object-fit: cover;
      display: block;
      border: 2px solid #141414;
    }

    /* Corner collage tape accent */
    .card-tape {
      position: absolute;
      top: -16px;
      right: 40px;
      width: 140px;
      height: 38px;
      background-color: #FF6A1A;
      border: 2px solid #141414;
      box-shadow: 2px 2px 0px #141414;
      transform: rotate(3deg);
      z-index: 10;
    }

    /* Overlay 1: Genre Label Badge */
    .badge-genre {
      position: absolute;
      top: 240px;
      left: 130px;
      background-color: #FF6A1A;
      color: #141414;
      border: 4px solid #141414;
      padding: 16px 28px;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 8px 8px 0px #141414;
      transform-origin: left center;
      will-change: transform, opacity;
    }

    /* Overlay 2: Punch Phrase Card (Safe-zone compliant: top 1190px, bottom 1338px < 1390px) */
    .punch-card {
      position: absolute;
      top: 1190px;
      left: 80px;
      width: 920px;
      background-color: #141414;
      color: #F7F4EC;
      border: 4px solid #FF6A1A;
      box-shadow: 12px 12px 0px rgba(20, 20, 20, 0.4);
      padding: 24px 36px;
      transform-origin: center bottom;
      will-change: transform, opacity;
    }

    .punch-accent-bar {
      width: 72px;
      height: 6px;
      background-color: #FF6A1A;
      margin-bottom: 14px;
    }

    .punch-headline {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.25;
      color: #F7F4EC;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>

  <!-- Root Composition (Duration = 7.89s derived from Shotlist S32-1) -->
  <div
    id="root"
    data-composition-id="scene-s32"
    data-width="1080"
    data-height="1920"
    data-duration="7.89"
  >
    <!-- Base Scene Layer (Track 0, duration 0s to 7.89s) -->
    <div id="scene-base" class="clip" data-start="0" data-duration="7.89" data-track-index="0">
      <!-- 1. Background Grid -->
      <div class="bg-grid"></div>

      <!-- 2. Underlying Narrative Metaphor: Script Cracks (SVG only) -->
      <div id="cracks-container" class="cracks-layer">
        <svg class="cracks-svg" viewBox="0 0 840 800">
          <path class="crack-path" d="M 120 180 L 290 320 L 410 270 L 580 430 L 710 390" />
          <path class="crack-path" d="M 290 320 L 320 540 L 480 610" />
          <path class="crack-path" d="M 410 270 L 510 160" />
        </svg>
      </div>

      <!-- 3. Camera Rig: Zoom-in Motion on Hero Content -->
      <div id="camera-rig" class="camera-rig">
        <!-- Technical Diagram Frame Brackets -->
        <div class="diagram-brackets">
          <svg class="diagram-svg" viewBox="0 0 780 880">
            <!-- Top-Left Bracket -->
            <path class="bracket-line" d="M 0 50 L 0 0 L 50 0" />
            <!-- Top-Right Bracket -->
            <path class="bracket-line" d="M 730 0 L 780 0 L 780 50" />
            <!-- Bottom-Left Bracket -->
            <path class="bracket-line" d="M 0 830 L 0 880 L 50 880" />
            <!-- Bottom-Right Bracket -->
            <path class="bracket-line" d="M 730 880 L 780 880 L 780 830" />
          </svg>
        </div>

        <!-- The Hero Mystery Box Cutout Card (Entrance: Grow) -->
        <div id="hero-card" class="hero-card">
          <div class="card-tape"></div>
          <img
            id="hero-image"
            class="hero-image"
            src="assets/img-04-survival-experience-mystery-box-cutout.jpg"
            alt="Kiện hàng trải nghiệm sinh tồn"
          >
        </div>
      </div>

      <!-- 4. Permanent Signature Bottom Accent Bar -->
      <div class="bottom-accent-bar"></div>
    </div>

    <!-- Overlay 1: Genre Label Badge Clip (Track 1, atMs: 227950 => 2.23s, holdMs: 1800 => 1.80s) -->
    <div
      id="clip-badge"
      class="clip"
      data-start="2.23"
      data-duration="1.80"
      data-track-index="1"
      style="z-index: 20;"
    >
      <div id="badge-genre" class="badge-genre hf-hl-orange">
        HÀNH ĐỘNG SINH TỒN
      </div>
    </div>

    <!-- Overlay 2: Punch Phrase Card Clip (Track 2, atMs: 232140 => 6.42s to end => 1.47s) -->
    <div
      id="clip-punch"
      class="clip"
      data-start="6.42"
      data-duration="1.47"
      data-track-index="2"
      style="z-index: 25;"
    >
      <div id="punch-card" class="punch-card hf-plate-ink">
        <div class="punch-accent-bar"></div>
        <h1 class="punch-headline">THỰC HIỆN LỜI HỨA</h1>
      </div>
    </div>
  </div>

  <!-- Seekable Deterministic GSAP Timeline Script -->
  <script>
    // HyperFrames Seekable Timeline Contract
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Setup SVG Path Geometry for progressive stroke reveals
    const bracketPaths = document.querySelectorAll(".bracket-line");
    bracketPaths.forEach((path) => {
      const len = path.getTotalLength();
      path.style.strokeDasharray = len + "";
      path.style.strokeDashoffset = len + "";
    });

    const crackPaths = document.querySelectorAll(".crack-path");
    crackPaths.forEach((path) => {
      const len = path.getTotalLength();
      path.style.strokeDasharray = len + "";
      path.style.strokeDashoffset = len + "";
    });

    // --- PHASE 1: Initial State & Script Cracks Reveal (0.05s - 0.4s) ---
    tl.fromTo(
      "#cracks-container",
      { opacity: 0 },
      { opacity: 0.8, duration: 0.3, ease: "power2.out" },
      0.05
    );

    tl.to(
      crackPaths,
      { strokeDashoffset: 0, duration: 0.35, ease: "power2.out", stagger: 0.08 },
      0.08
    );

    // --- PHASE 2: Entrance "Grow" of Hero Box (0.4s - 1.1s) ---
    // The survival box bursts forth and covers up the underlying script cracks
    tl.fromTo(
      "#hero-card",
      { scale: 0.15, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.68, ease: "power3.out" },
      0.4
    );

    // Dim the underlying cracks as the box overwhelms them
    tl.to(
      "#cracks-container",
      { opacity: 0.12, duration: 0.5, ease: "power2.out" },
      0.6
    );

    // Technical diagram brackets draw around the card
    tl.to(
      bracketPaths,
      { strokeDashoffset: 0, duration: 0.45, ease: "power2.out", stagger: 0.06 },
      0.65
    );

    // --- PHASE 3: Camera Motion: Steady Zoom-In (1.1s -> 7.89s) ---
    tl.fromTo(
      "#camera-rig",
      { scale: 1.0 },
      { scale: 1.07, duration: 6.79, ease: "sine.inOut" },
      1.1
    );

    // Subtle breathing / organic bobbing to keep cutout alive
    tl.fromTo(
      "#hero-card",
      { y: 0 },
      { y: -8, duration: 2.2, ease: "sine.inOut", yoyo: true, repeat: 2 },
      1.2
    );

    // --- PHASE 4: Overlay 1 - "HÀNH ĐỘNG SINH TỒN" (2.23s - 4.03s) ---
    tl.fromTo(
      "#badge-genre",
      { scale: 0.6, opacity: 0, y: 20 },
      { scale: 1.0, opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false },
      2.23
    );

    // --- PHASE 5: Overlay 2 - Punch Phrase "THỰC HIỆN LỜI HỨA" (6.42s -> 7.89s) ---
    tl.fromTo(
      "#punch-card",
      { y: 40, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power3.out", immediateRender: false },
      6.42
    );

    // Register paused timeline with HyperFrames Runtime
    window.__timelines["scene-s32"] = tl;
  </script>

    </template>
  </body>
</html>
