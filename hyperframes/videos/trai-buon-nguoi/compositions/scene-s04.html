<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #F5F0E4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #F5F0E4;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Style DNA Helper Classes */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
      .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
      .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
      .hf-plate-paper { background-color: #E7E3D9; color: #141414; }

      /* Visual Background: Dossier Card Theme */
      .dossier-bg-accent {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 180px;
        background: #E7E3D9;
        border-bottom: 3px solid #141414;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 0 60px 24px 60px;
      }
      .dossier-tag {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #141414;
        text-transform: uppercase;
      }
      .dossier-meta {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #141414;
      }

      /* Dossier Center Card Holding Image */
      .dossier-frame {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 220px;
        height: 1120px;
        background: #141414;
        border: 4px solid #141414;
        box-shadow: 14px 18px 0px rgba(20, 20, 20, 0.22);
        overflow: hidden;
        transform-origin: top center;
      }
      .dossier-tab-header {
        height: 54px;
        background: #141414;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
      }
      .dossier-label {
        font-size: 19px;
        font-weight: 900;
        letter-spacing: 1.5px;
        color: #F7F4EC;
        text-transform: uppercase;
      }
      .dossier-badge-pill {
        background: #FF6A1A;
        color: #141414;
        font-size: 15px;
        font-weight: 900;
        padding: 4px 12px;
        border-radius: 4px;
        letter-spacing: 0.5px;
      }
      .image-viewport {
        position: relative;
        width: 100%;
        height: calc(100% - 54px);
        overflow: hidden;
        background: #141414;
      }
      .evidence-photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
        transform-origin: 50% 50%;
      }

      /* Ruler / Annotation Markers on Image */
      .corner-tick {
        position: absolute;
        width: 24px;
        height: 24px;
        border-color: #FF6A1A;
        border-style: solid;
        pointer-events: none;
        z-index: 10;
      }
      .corner-tl { top: 16px; left: 16px; border-width: 4px 0 0 4px; }
      .corner-tr { top: 16px; right: 16px; border-width: 4px 0 4px 0; }
      .corner-bl { bottom: 16px; left: 16px; border-width: 0 0 4px 4px; }
      .corner-br { bottom: 16px; right: 16px; border-width: 0 4px 4px 0; }

      /* Overlay 1: Question Mark Stamp & Strike */
      .question-center-container {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 50;
      }
      .question-stamp-card {
        width: 580px;
        background: #141414;
        border: 4px solid #FF6A1A;
        box-shadow: 12px 14px 0px rgba(20, 20, 20, 0.4);
        padding: 36px 32px 32px 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        transform-origin: 50% 50%;
      }
      .question-badge-title {
        background: #FF6A1A;
        color: #141414;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 2px;
        padding: 6px 18px;
        text-transform: uppercase;
        margin-bottom: 20px;
      }
      .question-svg-wrap {
        width: 170px;
        height: 190px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .question-sub-title {
        font-size: 32px;
        font-weight: 900;
        color: #F7F4EC;
        margin-top: 18px;
        letter-spacing: 1px;
      }
      .strike-line-banner {
        position: absolute;
        top: 54%;
        left: -20px;
        right: -20px;
        height: 24px;
        background: #FF6A1A;
        border: 2px solid #141414;
        transform: rotate(-14deg);
        transform-origin: left center;
        z-index: 60;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);
      }

      /* Overlay 2: Giới Chuyên Môn Annotation Callout */
      .expert-callout-wrap {
        position: absolute;
        left: 80px;
        top: 960px;
        z-index: 70;
        display: flex;
        flex-direction: column;
        pointer-events: none;
      }
      .expert-pointer-svg {
        width: 440px;
        height: 90px;
        overflow: visible;
        margin-bottom: -10px;
        margin-left: 120px;
      }
      .expert-stamp-plate {
        background: #141414;
        border-left: 12px solid #FF6A1A;
        border-top: 3px solid #141414;
        border-right: 3px solid #141414;
        border-bottom: 3px solid #141414;
        padding: 22px 30px;
        box-shadow: 10px 12px 0px rgba(20, 20, 20, 0.35);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .expert-header-small {
        font-size: 18px;
        font-weight: 900;
        color: #FF6A1A;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .expert-title-punch {
        font-size: 48px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 1px;
        line-height: 1.15;
        margin: 0;
      }
      .expert-badge-note {
        display: inline-block;
        background: #F5F0E4;
        color: #141414;
        font-size: 19px;
        font-weight: 900;
        padding: 6px 14px;
        align-self: flex-start;
        margin-top: 4px;
      }

      /* Style DNA Signature Bottom Bar */
      .style-dna-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 10px;
        background-color: #FF6A1A;
        z-index: 999;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s04"
      data-width="1080"
      data-height="1920"
      data-duration="7.88"
    >
      <!-- Single Main Shot Clip for S04-1 (7.88s duration) -->
      <div id="shot-s04-1" class="clip" data-start="0" data-duration="7.88">
        
        <!-- Dossier Top Section -->
        <div class="dossier-bg-accent">
          <div class="dossier-tag">HỒ SƠ ĐIỀU TRA // VỤ ÁN</div>
          <div class="dossier-meta">MÃ TÀI LIỆU #04</div>
        </div>

        <!-- Dossier Card Framing img-09 -->
        <div id="dossier-card" class="dossier-frame">
          <div class="dossier-tab-header">
            <span class="dossier-label">EVIDENCE FILE: ANALYSIS</span>
            <span class="dossier-badge-pill">MỤC TIÊU MỔ XẺ</span>
          </div>

          <div class="image-viewport">
            <img
              id="evidence-img"
              class="evidence-photo"
              src="assets/img-09-evidence-analysis-cutout-scene.jpg"
              alt="Hồ sơ phân tích chứng cứ"
            />
            <!-- Visual Ruler Ticks -->
            <div class="corner-tick corner-tl"></div>
            <div class="corner-tick corner-tr"></div>
            <div class="corner-tick corner-bl"></div>
            <div class="corner-tick corner-br"></div>
          </div>
        </div>

        <!-- Overlay 1: Question Icon Stamp (appears at 0.92s, strikes at 1.9s, leaves at 2.72s) -->
        <div class="question-center-container">
          <div id="question-box" class="question-stamp-card">
            <div class="question-badge-title">NGHI VẤN ĐẶT RA</div>
            <div class="question-svg-wrap">
              <svg width="140" height="170" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Question mark outline drawn with pathLength for deterministic animation -->
                <path
                  id="question-curve"
                  d="M26 38 C 26 12, 74 12, 74 38 C 74 58, 50 64, 50 82"
                  stroke="#FF6A1A"
                  stroke-width="14"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  pathLength="100"
                  stroke-dasharray="100"
                  stroke-dashoffset="0"
                />
                <circle
                  id="question-dot"
                  cx="50"
                  cy="104"
                  r="8"
                  fill="#FF6A1A"
                />
              </svg>
            </div>
            <div class="question-sub-title">“VÌ PHIM HAY?”</div>
            <div id="strike-line" class="strike-line-banner"></div>
          </div>
        </div>

        <!-- Overlay 2: Giới Chuyên Môn Annotation Label (starts at 5.65s, holds through end) -->
        <div id="expert-tag-wrap" class="expert-callout-wrap">
          <svg class="expert-pointer-svg" viewBox="0 0 440 90" fill="none">
            <!-- Annotation arrow pointer targeting analysis desk -->
            <path
              id="pointer-line-path"
              d="M 20 80 L 160 20 L 380 20"
              stroke="#FF6A1A"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"
              pathLength="100"
              stroke-dasharray="100"
              stroke-dashoffset="0"
            />
            <circle cx="380" cy="20" r="7" fill="#FF6A1A" />
            <circle cx="20" cy="80" r="5" fill="#141414" stroke="#FF6A1A" stroke-width="3" />
          </svg>
          <div class="expert-stamp-plate">
            <div class="expert-header-small">ĐÁNH GIÁ THỰC TẾ</div>
            <h2 class="expert-title-punch">GIỚI CHUYÊN MÔN</h2>
            <div class="expert-badge-note">CHỈ RA NHIỀU ĐIỂM YẾU</div>
          </div>
        </div>

      </div>

      <!-- Signature Visual Identity: Bottom Orange Accent Bar -->
      <div class="style-dna-bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s04"] = tl;

      // 1. Initial State Setup
      gsap.set("#dossier-card", {
        scaleY: 0.1,
        opacity: 0,
        transformOrigin: "top center"
      });
      gsap.set("#evidence-img", {
        scale: 1.02
      });
      gsap.set("#question-box", {
        scale: 0,
        opacity: 0
      });
      gsap.set("#question-curve", {
        strokeDashoffset: 100
      });
      gsap.set("#question-dot", {
        scale: 0,
        transformOrigin: "50% 50%"
      });
      gsap.set("#strike-line", {
        scaleX: 0
      });
      gsap.set("#expert-tag-wrap", {
        x: -70,
        opacity: 0
      });
      gsap.set("#pointer-line-path", {
        strokeDashoffset: 100
      });

      // 2. Dossier Unfold Entrance (0.0s - 0.75s)
      tl.to(
        "#dossier-card",
        {
          scaleY: 1,
          opacity: 1,
          duration: 0.75,
          ease: "power3.out"
        },
        0.05
      );

      // Slow Continuous Zoom-In on Investigation Table (0.0s - 7.88s)
      tl.to(
        "#evidence-img",
        {
          scale: 1.15,
          duration: 7.88,
          ease: "none"
        },
        0
      );

      // 3. Question Icon Stamp Entrance (atMs: 20600 -> 0.92s relative to start)
      tl.to(
        "#question-box",
        {
          scale: 1,
          opacity: 1,
          duration: 0.45,
          ease: "power3.out"
        },
        0.92
      );

      // Draw question mark path
      tl.to(
        "#question-curve",
        {
          strokeDashoffset: 0,
          duration: 0.5,
          ease: "power2.out"
        },
        1.05
      );
      tl.to(
        "#question-dot",
        {
          scale: 1,
          duration: 0.2,
          ease: "back.out(1.5)"
        },
        1.45
      );

      // Strike-through line: Question challenged and rejected (at 1.90s)
      tl.to(
        "#strike-line",
        {
          scaleX: 1,
          duration: 0.28,
          ease: "power4.out"
        },
        1.9
      );

      // Question Stamp exits / dissolves to reveal the dossier analysis (at 2.72s)
      tl.to(
        "#question-box",
        {
          scale: 0.85,
          opacity: 0,
          duration: 0.35,
          ease: "power2.in"
        },
        2.72
      );

      // 4. Label "GIỚI CHUYÊN MÔN" Entrance (atMs: 25330 -> 5.65s relative to start)
      tl.to(
        "#expert-tag-wrap",
        {
          x: 0,
          opacity: 1,
          duration: 0.48,
          ease: "power3.out"
        },
        5.65
      );

      // Progressive draw of the pointer line
      tl.to(
        "#pointer-line-path",
        {
          strokeDashoffset: 0,
          duration: 0.45,
          ease: "power2.out"
        },
        5.8
      );
    </script>
  
    </template>
  </body>
</html>
