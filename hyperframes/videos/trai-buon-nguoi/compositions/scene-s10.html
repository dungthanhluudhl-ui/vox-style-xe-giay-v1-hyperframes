<!doctype html>

    <template>
      <link
      rel="stylesheet"

    />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f5f0e4;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* Nền phẳng card & thanh cam đáy nhận diện thương hiệu */
      .card-bg {
        position: absolute;
        inset: 0;
        background-color: #f5f0e4;
      }

      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 100;
      }

      /* Khung tranh phong cách collage thủ công */
      .hero-frame {
        position: absolute;
        top: 200px;
        left: 60px;
        width: 960px;
        height: 1140px;
        background-color: #e7e3d9;
        border: 4px solid #141414;
        border-radius: 12px;
        box-shadow: 18px 18px 0px #141414;
        overflow: hidden;
        will-change: transform, opacity;
      }

      .img-scaler {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #hero-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 55%;
        will-change: transform;
      }

      /* Punch-phrase box: Nền mực đen đặc, chữ kem, vạch cam */
      .punch-box {
        position: absolute;
        top: 1150px;
        left: 85px;
        width: 910px;
        height: 124px;
        background-color: #141414;
        border-radius: 8px;
        box-shadow: 10px 10px 0px #ff6a1a;
        display: flex;
        align-items: center;
        padding: 0 32px 0 0;
        overflow: hidden;
        z-index: 20;
        opacity: 0;
        will-change: transform, opacity;
      }

      .punch-stripe {
        width: 16px;
        height: 100%;
        background-color: #ff6a1a;
        margin-right: 28px;
        flex-shrink: 0;
      }

      .punch-text {
        font-weight: 900;
        font-size: 58px;
        line-height: 1.2;
        color: #f7f4ec;
        letter-spacing: 2px;
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* Label stamp: Nền cam đặc, chữ mực đen */
      .label-box {
        position: absolute;
        top: 235px;
        left: 95px;
        height: 72px;
        background-color: #ff6a1a;
        border: 3px solid #141414;
        border-radius: 6px;
        box-shadow: 8px 8px 0px #141414;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 28px;
        z-index: 30;
        opacity: 0;
        will-change: transform, opacity;
      }

      .label-text {
        font-weight: 900;
        font-size: 36px;
        line-height: 1;
        color: #141414;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        white-space: nowrap;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s10"
      data-width="1080"
      data-height="1920"
      data-duration="7.84"
    >
      <!-- Lớp nền và thanh cam thương hiệu -->
      <div class="card-bg"></div>
      <div class="bottom-brand-bar"></div>

      <!-- Shot S10-1 -->
      <div id="shot-s10" class="clip" data-start="0" data-duration="7.84">
        <!-- Khung ảnh chính chứa tranh cắt dán -->
        <div id="hero-card" class="hero-frame">
          <div class="img-scaler">
            <img
              id="hero-img"
              src="assets/img-27-paper-cutout-street-raincoat-seller.jpg"
              alt="Áo mưa ngày dông"
            />
          </div>
        </div>

        <!-- Punch phrase: ÁO MƯA NGÀY DÔNG -->
        <div id="punch-card" class="punch-box">
          <div class="punch-stripe"></div>
          <div class="punch-text">ÁO MƯA NGÀY DÔNG</div>
        </div>

        <!-- Label: NẮM BẮT THỜI ĐIỂM -->
        <div id="label-badge" class="label-box">
          <div class="label-text">NẮM BẮT THỜI ĐIỂM</div>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Chuyển động vào cảnh (transitionIn: rise)
      tl.fromTo(
        "#hero-card",
        { y: 80, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
        0
      );

      // 2. Chuyển động camera zoom-in chậm, tập trung vào áo mưa vàng giữa khung cảnh
      tl.fromTo(
        "#hero-img",
        { scale: 1.0 },
        { scale: 1.14, duration: 7.84, ease: "none" },
        0
      );

      // 3. Punch phrase "ÁO MƯA NGÀY DÔNG" xuất hiện tại t = 3.01s (atMs: 70450)
      tl.fromTo(
        "#punch-card",
        { scale: 0.9, opacity: 0, y: 30 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        3.01
      );

      // 4. Label "NẮM BẮT THỜI ĐIỂM" đóng dấu xuất hiện tại t = 6.35s (atMs: 73790)
      tl.fromTo(
        "#label-badge",
        { scale: 1.25, opacity: 0, rotation: -5 },
        { scale: 1.0, opacity: 1, rotation: -1.5, duration: 0.4, ease: "power3.out" },
        6.35
      );

      // Đăng ký timeline cho HyperFrames seek runtime
      window.__timelines["scene-s10"] = tl;
    </script>
  
    </template>
  </body>
