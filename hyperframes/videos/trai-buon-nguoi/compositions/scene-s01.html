<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #F5F0E4;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background-color: #F5F0E4;
        overflow: hidden;
        font-family: "Be Vietnam Pro", sans-serif;
      }
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Top Header Card (Y: 180px - 310px, Safe Zone [160, 1390]) */
      .header-card {
        position: absolute;
        top: 180px;
        left: 60px;
        right: 60px;
        height: auto;
        padding: 24px 32px;
        border-radius: 12px;
        border-left: 8px solid #FF6A1A;
        box-shadow: 0 16px 36px rgba(20, 20, 20, 0.18);
        z-index: 20;
        display: flex;
        flex-direction: column;
      }
      .header-tag {
        font-size: 22px;
        font-weight: 700;
        color: #FF6A1A;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 8px;
        line-height: 1.2;
      }
      .header-title {
        font-size: 54px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.5px;
      }

      /* Cinema Mockup Frame (Y: 340px - 1360px, Center 9:16) */
      .mockup-frame {
        position: absolute;
        top: 340px;
        left: 60px;
        width: 960px;
        height: 1020px;
        border-radius: 16px;
        overflow: hidden;
        background-color: #141414;
        box-shadow: 0 24px 60px rgba(20, 20, 20, 0.35);
        border: 3px solid #141414;
        z-index: 10;
        transform-origin: 50% 50%;
      }
      .mockup-inner {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .cinema-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
        transform-origin: 50% 50%;
      }
      .cinema-vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 90px rgba(10, 10, 10, 0.65);
      }

      /* Critique Cards: Strictly vertical flex-column with generous spacing */
      .critique-card {
        position: absolute;
        display: flex;
        flex-direction: column;
        height: auto;
        padding: 24px 30px;
        border-radius: 12px;
        border: 2px solid #FF6A1A;
        box-shadow: 0 20px 48px rgba(10, 10, 10, 0.5);
        transform-origin: 50% 50%;
      }
      .critique-card-1 {
        top: 540px;
        left: 80px;
        width: 540px;
        z-index: 30;
      }
      .critique-card-2 {
        top: 860px;
        right: 80px;
        width: 540px;
        z-index: 30;
      }
      .critique-meta {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .badge-pill {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 4px;
        font-size: 18px;
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .meta-label {
        font-size: 20px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: 1px;
        color: #FF6A1A;
        text-transform: uppercase;
      }
      .critique-text {
        font-size: 40px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: -0.5px;
        white-space: nowrap;
      }
      .strike-wrap {
        margin-top: 12px;
        width: 100%;
        height: 16px;
      }
      .critique-subnote {
        margin-top: 14px;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 10px;
        border-top: 1px dashed rgba(247, 244, 236, 0.25);
        padding-top: 10px;
      }
      .subnote-icon {
        font-size: 22px;
        font-weight: 900;
        color: #FF6A1A;
        line-height: 1;
      }
      .subnote-text {
        font-size: 20px;
        font-weight: 700;
        color: #F7F4EC;
        letter-spacing: 0.5px;
        line-height: 1.2;
      }

      /* Vox Style DNA Bottom Signature Bar */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s01"
      data-width="1080"
      data-height="1920"
      data-duration="7.36"
    >
      <!-- Base Mockup Cinema Scene (Duration: 7.36s) -->
      <section id="cinema-scene" class="clip" data-start="0" data-duration="7.36">
        <!-- Top Editorial Punch Phrase -->
        <div id="header-card" class="header-card hf-plate-ink">
          <div class="header-tag">BỘ PHIM HƠN HAI TIẾNG</div>
          <div class="header-title hf-text-light">ĐỀ TÀI KHÔNG MỚI</div>
        </div>

        <!-- Cinema Mockup Box -->
        <div id="mockup-frame" class="mockup-frame">
          <div class="mockup-inner">
            <img
              id="cinema-img"
              class="cinema-img"
              src="assets/img-05-human-trafficking-movie-reactions.jpg"
              alt="Màn chiếu rạp phim và phản ứng phê bình"
            />
            <div class="cinema-vignette"></div>
          </div>
        </div>
      </section>

      <!-- Overlay 1: KỊCH BẢN ÔM ĐỒM (atMs: 2400, holdMs: 1800 -> 2.4s to 4.2s) -->
      <div id="overlay-1" class="clip" data-start="2.4" data-duration="1.8">
        <div id="card-1" class="critique-card critique-card-1 hf-plate-ink">
          <div class="critique-meta">
            <span class="badge-pill hf-hl-orange">ĐÁNH GIÁ</span>
            <span class="meta-label">TRÁI CHIỀU</span>
          </div>
          <div class="critique-text hf-text-light">KỊCH BẢN ÔM ĐỒM</div>
          <div class="strike-wrap">
            <svg width="450" height="16" viewBox="0 0 450 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                id="strike-path-1"
                d="M 4 8 L 446 8"
                stroke="#FF6A1A"
                stroke-width="7"
                stroke-linecap="round"
                style="stroke-dasharray: 450; stroke-dashoffset: 450;"
              />
            </svg>
          </div>
        </div>
      </div>

      <!-- Overlay 2: PHẢN DIỆN MỘT MÀU (atMs: 5200, holdMs: 1900 -> 5.2s to 7.1s) -->
      <div id="overlay-2" class="clip" data-start="5.2" data-duration="1.9">
        <div id="card-2" class="critique-card critique-card-2 hf-plate-ink">
          <div class="critique-meta">
            <span class="badge-pill hf-hl-orange">PHÊ BÌNH</span>
            <span class="meta-label">NHÂN VẬT</span>
          </div>
          <div class="critique-text hf-text-light">PHẢN DIỆN MỘT MÀU</div>
          <div class="critique-subnote">
            <span class="subnote-icon">!</span>
            <span class="subnote-text">LA HÉT VÀ ĐÁNH NGƯỜI</span>
          </div>
        </div>
      </div>

      <!-- Fixed Signature Bottom Accent Bar -->
      <div class="bottom-brand-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance of cinema mockup box (grow animation)
      tl.fromTo(
        "#mockup-frame",
        { scale: 0.92, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.75, ease: "power3.out" },
        0.1
      );

      // 2. Slow Ken Burns zoom-in on cinema poster & audience
      tl.fromTo(
        "#cinema-img",
        { scale: 1.0 },
        { scale: 1.08, duration: 7.2, ease: "sine.inOut" },
        0.1
      );

      // 3. Header title card entrance
      tl.fromTo(
        "#header-card",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.25
      );

      // 4. Overlay 1 ("KỊCH BẢN ÔM ĐỒM") entrance at 2.4s (clean spring-pop without tilt)
      tl.fromTo(
        "#card-1",
        { scale: 0.85, opacity: 0, y: 16 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        2.4
      );

      // SVG strike line draws across under the critique text
      tl.fromTo(
        "#strike-path-1",
        { strokeDashoffset: 450 },
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        2.85
      );

      // Card 1 settle fade-out before clip window closes at 4.2s
      tl.to(
        "#card-1",
        { opacity: 0, y: -10, duration: 0.2, ease: "power2.in" },
        4.0
      );

      // 5. Overlay 2 ("PHẢN DIỆN MỘT MÀU") entrance at 5.2s (clean spring-pop without tilt)
      tl.fromTo(
        "#card-2",
        { scale: 0.85, opacity: 0, y: 16 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        5.2
      );

      // Card 2 settle fade-out before clip window closes at 7.1s
      tl.to(
        "#card-2",
        { opacity: 0, y: -10, duration: 0.2, ease: "power2.in" },
        6.9
      );

      // Register master timeline
      window.__timelines["scene-s01"] = tl;
    </script>
  
    </template>
  </body>
</html>
