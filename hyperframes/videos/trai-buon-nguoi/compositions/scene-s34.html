      .editorial-sub {
        font-size: 22px;

      .label-plate-spicy {

      /* Overlay 3: Label "ĐẠT ĐÚNG KỲ VỌNG" */
      .label-plate-promise {
        position: absolute;

        left: 70px;
        z-index: 36;
        background-color: #141414;
        color: #F7F4EC;
        border: 3px solid #FF6A1A;
        border-radius: 8px;
        padding: 16px 26px;
        box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.4);

        pointer-events: none;
      }
      .label-promise-text {
        font-size: 42px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 14px;

      .check-badge {
        color: #FF6A1A;
        font-size: 40px;
        line-height: 1;
      }

      /* Thanh cam nhận diện thương hiệu cố định mép đáy */
      #bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s34"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="10"
    >
      <!-- Scene Clip S34-1: 0s - 10s -->
      <section class="clip" data-start="0" data-duration="10">
        <!-- Nền phẳng biến thể card -->
        <div class="card-canvas"></div>

        <!-- Tag phân loại phía trên -->
        <div class="editorial-header">
          <span class="editorial-tag">CASE STUDY</span>
          <span class="editorial-sub">NGHỊCH LÝ ĐÒI HỎI</span>
        </div>

        <!-- Khung tranh collage giấy (img-08) -->
        <div class="hero-frame-wrapper" id="hero-wrapper">
          <div class="hero-card">
            <img
              id="hero-img"
              class="hero-image"
              src="assets/img-08-man-eating-spicy-noodles-cutout.jpg"
              alt="Chàng trai ăn tô bún bò cay"
            />
          </div>
        </div>

        <!-- Overlay 1: Punch phrase "ẨN DỤ QUÁN CAY" (242790ms -> +2200ms) -->
        <div class="punch-container" id="punch-overlay">
          <div class="punch-plate">
            <div class="punch-label">BÀI HỌC THỰC TẾ</div>
            <h1 class="punch-title">ẨN DỤ QUÁN CAY</h1>
          </div>
        </div>

        <!-- Overlay 2: Label "CAY CHẢY NƯỚC MẮT" (249170ms -> +1900ms) -->
        <div class="label-plate-spicy" id="label-spicy">
          <p class="label-spicy-text">
            <span>●</span>
            <span>CAY CHẢY NƯỚC MẮT</span>
          </p>

        <!-- Overlay 3: Label "ĐẠT ĐÚNG KỲ VỌNG" (250950ms -> +1800ms) -->
        <div class="label-plate-promise" id="label-promise">
          <p class="label-promise-text">
            <span class="check-badge">✓</span>
            <span>ĐẠT ĐÚNG KỲ VỌNG</span>
          </p>
        </div>

        <!-- Thanh cam nhận diện đáy khung hình -->
        <div id="bottom-brand-bar"></div>
      </section>
    </div>

    <script>
      // Đăng ký đúng 1 paused timeline trên window.__timelines["scene-s34"]
      const tl = gsap.timeline({ paused: true });
      window.__timelines["scene-s34"] = tl;

      // 1. Wobble-drop entrance cho hero collage (t = 0.0s đến ~0.75s)
      tl.fromTo(
        "#hero-wrapper",
        {
          y: -110,
          rotation: -2.8,
          scale: 0.94,
          opacity: 0,
        },
        {
          y: 0,
          rotation: 0,
          scale: 1.02,
          opacity: 1,
          duration: 0.75,
          ease: "power2.out",
        },
        0.0
      );

      // Hiệu ứng lắc lư nhẹ nhàng (wobble) để ổn định vị trí giấy
      tl.fromTo(
        "#hero-wrapper",
        { rotation: -2.8 },
        {
          rotation: 1.2,
          duration: 0.45,
          ease: "power1.inOut",
        },
        0.2
      );
      tl.to(
        "#hero-wrapper",
        {
          rotation: 0,
          duration: 0.35,
          ease: "power2.out",
        },
        0.65
      );

      // 2. Camera motion: zoom-in chậm vào tô bún cay và khuôn mặt toát mồ hôi (0.75s -> 10.0s)
      tl.fromTo(
        "#hero-img",
        { scale: 1.0, y: 0 },
        {
          scale: 1.12,
          y: -30,
          duration: 9.25,
          ease: "none",
        },
        0.75
      );

      // 3. Overlay 1: "ẨN DỤ QUÁN CAY" (t = 0.83s, hold ~2.2s -> fade out lúc 3.03s)
      tl.fromTo(
        "#punch-overlay",
        { y: 35, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" },
        0.83
      );
      tl.to(
        "#punch-overlay",
        { y: -20, opacity: 0, duration: 0.28, ease: "power2.in" },
        3.03
      );

      // 4. Overlay 2: "CAY CHẢY NƯỚC MẮT" (t = 7.21s, hold ~1.9s)
      tl.fromTo(
        "#label-spicy",
        { x: -35, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        7.21
      );

      // 5. Overlay 3: "ĐẠT ĐÚNG KỲ VỌNG" (t = 8.99s, xuất hiện liền kề bên dưới)
      tl.fromTo(
        "#label-promise",
        { x: -35, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        8.99
      );
    </script>
