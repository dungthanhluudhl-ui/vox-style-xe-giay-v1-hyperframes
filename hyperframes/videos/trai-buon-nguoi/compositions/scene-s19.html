<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Mandatory contrast utility classes */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
      .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
      .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
      .hf-plate-paper { background-color: #E7E3D9; color: #141414; }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        perspective: 1400px;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* Vox 84px Grid Background */
      .bg-grid {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Signature Vox Orange Bottom Bar */
      #bottom-brand-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 12px;
        background: #FF6A1A;
        z-index: 100;
      }

      /* Main Split Card Container */
      #scene-card {
        position: absolute;
        top: 180px;
        left: 60px;
        width: 960px;
        height: 1140px;
        border: 4px solid #141414;
        border-radius: 16px;
        background: #141414;
        overflow: hidden;
        box-shadow: 12px 12px 0px rgba(20, 20, 20, 0.22);
        transform-origin: 50% 50%;
        transform-style: preserve-3d;
      }

      /* Hero image placed for horizontal pan across the split */
      #hero-img {
        position: absolute;
        top: -950px;
        left: 0;
        width: 1700px;
        height: auto;
        max-width: none;
        display: block;
        transform-origin: 0% 50%;
      }

      /* Diagram Frame Accents */
      .corner-tick {
        position: absolute;
        width: 24px;
        height: 24px;
        z-index: 20;
        pointer-events: none;
      }
      .corner-tl { top: 16px; left: 16px; border-top: 3px solid #FF6A1A; border-left: 3px solid #FF6A1A; }
      .corner-tr { top: 16px; right: 16px; border-top: 3px solid #FF6A1A; border-right: 3px solid #FF6A1A; }
      .corner-bl { bottom: 16px; left: 16px; border-bottom: 3px solid #FF6A1A; border-left: 3px solid #FF6A1A; }
      .corner-br { bottom: 16px; right: 16px; border-bottom: 3px solid #FF6A1A; border-right: 3px solid #FF6A1A; }

      /* Technical diagram footer on card */
      .card-footer {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 48px;
        background: #141414;
        border-top: 2px solid #FF6A1A;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        z-index: 25;
      }
      .card-footer span {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      /* Overlay 1: BÁN TRẢI NGHIỆM */
      #badge-experience {
        position: absolute;
        top: 240px;
        left: 120px;
        right: 120px;
        background: #FF6A1A;
        border: 4px solid #141414;
        border-radius: 12px;
        padding: 16px 20px;
        text-align: center;
        box-shadow: 8px 8px 0px #141414;
        z-index: 40;
        transform-origin: 50% 50%;
      }
      .badge-title {
        font-size: 56px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -1px;
        margin: 0;
        color: #141414;
      }

      /* Overlay 2: Phone Icon Stamp */
      #icon-card {
        position: absolute;
        top: 1020px;
        left: 440px;
        width: 200px;
        height: 200px;
        background: #141414;
        border: 4px solid #FF6A1A;
        border-radius: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 10px 10px 0px rgba(20, 20, 20, 0.4);
        z-index: 50;
        transform-origin: 50% 50%;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s19"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6.96"
    >
      <!-- Background 84px Grid -->
      <svg class="bg-grid" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="grid-pattern" width="84" height="84" patternUnits="userSpaceOnUse">
            <path d="M 84 0 L 0 0 0 84" fill="none" stroke="rgba(20,20,20,0.32)" stroke-width="1.5" />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid-pattern)" />
      </svg>

      <!-- Signature Orange Bar at Bottom -->
      <div id="bottom-brand-bar"></div>

      <!-- Main Scene Clip -->
      <div id="main-clip" class="clip" data-start="0" data-duration="6.96">
        <!-- 3D Flip Container for Hero Split Visual -->
        <div id="scene-card">
          <!-- Scaled Image panning from Left (Newspaper/Info) to Right (Cockpit/Experience) -->
          <img
            id="hero-img"
            src="assets/img-16-split-information-versus-experience.jpg"
            alt="Đối chiếu bán thông tin vs bán trải nghiệm"
          />

          <!-- Diagram Corner Ticks -->
          <div class="corner-tick corner-tl"></div>
          <div class="corner-tick corner-tr"></div>
          <div class="corner-tick corner-bl"></div>
          <div class="corner-tick corner-br"></div>

          <!-- Diagram Footer Bar -->
          <div class="card-footer">
            <span class="hf-text-light">SPLIT // THÔNG TIN VS TRẢI NGHIỆM</span>
            <span class="hf-hl-orange" style="padding: 2px 10px; border-radius: 4px;">DIAGRAM</span>
          </div>
        </div>

        <!-- Overlay 1: BÁN TRẢI NGHIỆM Stamp -->
        <div
          id="badge-experience"
          class="hf-hl-orange"
          data-layout-allow-overlap="true"
          data-layout-allow-occlusion="true"
        >
          <h1 class="badge-title">BÁN TRẢI NGHIỆM</h1>
        </div>

        <!-- Overlay 2: Self-drawing Phone Icon Callout -->
        <div
          id="icon-card"
          class="hf-plate-ink"
          data-layout-allow-overlap="true"
          data-layout-allow-occlusion="true"
        >
          <svg
            id="phone-svg"
            viewBox="0 0 160 200"
            width="120"
            height="150"
            xmlns="http://www.w3.org/2000/svg"
          >
            <!-- Phone body -->
            <rect
              id="phone-body"
              x="35"
              y="20"
              width="90"
              height="160"
              rx="16"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <!-- Top Speaker -->
            <line
              id="phone-speaker"
              x1="68"
              y1="36"
              x2="92"
              y2="36"
              stroke="#F7F4EC"
              stroke-width="4"
              stroke-linecap="round"
            />
            <!-- Home Bar -->
            <line
              id="phone-home"
              x1="65"
              y1="166"
              x2="95"
              y2="166"
              stroke="#F7F4EC"
              stroke-width="4"
              stroke-linecap="round"
            />
            <!-- Chat Notification Bubble -->
            <path
              id="phone-bubble"
              d="M 55 75 C 55 65 105 65 105 75 C 105 85 95 85 90 90 L 80 102 L 82 90 C 55 90 55 85 55 75 Z"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <!-- Left Signal Wave -->
            <path
              id="phone-wave-left"
              d="M 20 70 Q 12 100 20 130"
              fill="none"
              stroke="#F7F4EC"
              stroke-width="4"
              stroke-linecap="round"
            />
            <!-- Right Signal Wave -->
            <path
              id="phone-wave-right"
              d="M 140 70 Q 148 100 140 130"
              fill="none"
              stroke="#F7F4EC"
              stroke-width="4"
              stroke-linecap="round"
            />
          </svg>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Setup SVG paths for progressive self-drawing
      const phoneElements = document.querySelectorAll(
        "#phone-svg path, #phone-svg rect, #phone-svg line"
      );
      phoneElements.forEach((el) => {
        const len = el.getTotalLength ? el.getTotalLength() : 200;
        el.style.strokeDasharray = `${len}`;
        el.style.strokeDashoffset = `${len}`;
      });

      // 1. Entrance: 3D Flip of the main card (t = 0.0s)
      tl.fromTo(
        "#scene-card",
        { rotationY: -65, scale: 0.88, opacity: 0 },
        { rotationY: 0, scale: 1, opacity: 1, duration: 0.85, ease: "power3.out" },
        0
      );

      // 2. Camera Pan: Pan from left newspaper half to right cockpit half (t = 0.9s to 3.2s)
      tl.to(
        "#hero-img",
        { x: -740, duration: 2.3, ease: "power2.inOut" },
        0.9
      );

      // 3. Overlay 1: BÁN TRẢI NGHIỆM punch badge arrival (t = 1.49s, matches 127530ms)
      tl.fromTo(
        "#badge-experience",
        { scale: 0, opacity: 0, y: 30, rotation: -3 },
        { scale: 1, opacity: 1, y: 0, rotation: -1, duration: 0.55, ease: "power3.out" },
        1.49
      );

      // Continuous subtle drift so scene stays alive (Vox DNA §5)
      tl.to(
        "#hero-img",
        { scale: 1.04, duration: 3.5, ease: "sine.out" },
        3.2
      );

      // 4. Overlay 2: Phone icon stamp arrival (t = 4.92s, matches 130960ms)
      tl.fromTo(
        "#icon-card",
        { scale: 0, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        4.92
      );

      // SVG path drawing sequence
      phoneElements.forEach((el, index) => {
        tl.to(
          el,
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
          4.95 + index * 0.08
        );
      });

      // Discrete phone notification vibration (deterministic finite repeat = 3)
      tl.to(
        "#icon-card",
        { rotation: -5, duration: 0.08, yoyo: true, repeat: 3, ease: "power1.inOut" },
        5.7
      );

      // Register master timeline
      window.__timelines["scene-s19"] = tl;
    </script>
  
    </template>
  </body>
</html>
