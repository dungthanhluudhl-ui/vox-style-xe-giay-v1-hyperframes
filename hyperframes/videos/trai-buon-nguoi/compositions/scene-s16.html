<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      width: 1080px;
      height: 1920px;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Chart Background Variant (decorative ruled lines & ticks, no text) */
    .chart-background {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .chart-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: rgba(20, 20, 20, 0.28);
    }

    .chart-tick {
      position: absolute;
      left: 0;
      top: -3px;
      width: 20px;
      height: 8px;
      background-color: #FF6A1A;
    }

    /* Hero Image Card (Vox Collage Framing) */
    .hero-container {
      position: absolute;
      top: 190px;
      left: 60px;
      width: 960px;
      height: 1160px;
      border: 5px solid #141414;
      background-color: #141414;
      box-shadow: 12px 12px 0 #FF6A1A;
      overflow: hidden;
      transform-origin: center center;
    }

    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform-origin: 50% 60%;
    }

    /* Diagram Flow Accent: Tension Release Meter */
    .tension-meter {
      position: absolute;
      top: 210px;
      right: 80px;
      background-color: #141414;
      border: 3px solid #141414;
      box-shadow: 6px 6px 0 #FF6A1A;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 25;
      transform-origin: top right;
    }

    .meter-badge {
      background-color: #FF6A1A;
      color: #141414;
      font-size: 15px;
      font-weight: 900;
      padding: 4px 8px;
      border-radius: 2px;
      letter-spacing: 0.5px;
    }

    .meter-text {
      color: #F7F4EC;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    /* Label 1: VÙNG LÊN PHẢN KHÁNG */
    .label-plate {
      position: absolute;
      top: 210px;
      left: 80px;
      background-color: #141414;
      border: 4px solid #141414;
      box-shadow: 8px 8px 0 #FF6A1A;
      padding: 16px 24px;
      z-index: 20;
      transform-origin: left center;
    }

    .label-tag {
      display: inline-block;
      background-color: #FF6A1A;
      color: #141414;
      font-size: 15px;
      font-weight: 900;
      padding: 4px 10px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .label-title {
      font-size: 34px;
      font-weight: 900;
      color: #F7F4EC;
      line-height: 1.2;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Punch-Phrase: KHOẢNH KHẮC GIẢI TỎA */
    .punch-plate {
      position: absolute;
      top: 980px;
      left: 80px;
      right: 80px;
      background-color: #141414;
      border: 5px solid #141414;
      box-shadow: 14px 14px 0 #FF6A1A;
      padding: 24px 32px;
      z-index: 30;
      transform-origin: center bottom;
    }

    .punch-tag {
      display: inline-block;
      background-color: #FF6A1A;
      color: #141414;
      font-size: 18px;
      font-weight: 900;
      padding: 6px 14px;
      margin-bottom: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .punch-title {
      font-size: 58px;
      font-weight: 900;
      color: #F7F4EC;
      line-height: 1.15;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .punch-line {
      display: block;
      width: 100%;
      height: 8px;
      background-color: #FF6A1A;
      margin-top: 14px;
      transform-origin: left center;
    }

    /* Shatter Shards Overlay */
    .shatter-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }

    .shard {
      position: absolute;
      transform-origin: center center;
    }

    /* Fixed Brand Signature Bottom Bar */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 14px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s16"
    data-width="1080"
    data-height="1920"
    data-duration="6.2"
  >
    <!-- Background variant: Chart & Hero visual -->
    <div id="scene-bg-clip" class="clip" data-start="0" data-duration="6.2" data-track-index="0">
      <!-- Ruled horizontal lines at 20%, 40%, 60%, 80% height + orange ticks -->
      <div class="chart-background" data-layout-ignore="true">
        <div class="chart-line" style="top: 384px;">
          <div class="chart-tick"></div>
        </div>
        <div class="chart-line" style="top: 768px;">
          <div class="chart-tick"></div>
        </div>
        <div class="chart-line" style="top: 1152px;">
          <div class="chart-tick"></div>
        </div>
        <div class="chart-line" style="top: 1536px;">
          <div class="chart-tick"></div>
        </div>
      </div>

      <!-- Main Visual Hero Container -->
      <div id="hero-card" class="hero-container" data-layout-allow-overflow="true">
        <img
          id="hero-img"
          class="hero-image"
          src="assets/img-21-protest-rebellion-great-burst.jpg"
          alt="Làn sóng công nhân vùng lên phá vỡ xiềng xích"
        >
      </div>
    </div>

    <!-- Shatter Transition Overlay (0s -> 0.8s) -->
    <div id="shatter-clip" class="clip shatter-container" data-start="0" data-duration="0.8" data-track-index="1" data-layout-ignore="true">
      <svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position: absolute; inset: 0;">
        <polygon id="shard-1" class="shard" points="200,250 480,210 380,480 120,410" fill="#141414" />
        <polygon id="shard-2" class="shard" points="520,180 860,240 780,510 460,420" fill="#FF6A1A" />
        <polygon id="shard-3" class="shard" points="150,520 460,480 390,820 110,750" fill="#E7E3D9" stroke="#141414" stroke-width="4" />
        <polygon id="shard-4" class="shard" points="620,490 980,540 920,860 580,780" fill="#141414" />
        <polygon id="shard-5" class="shard" points="180,890 520,840 450,1180 140,1120" fill="#FF6A1A" />
        <polygon id="shard-6" class="shard" points="560,860 920,890 850,1220 520,1160" fill="#E7E3D9" stroke="#141414" stroke-width="4" />
      </svg>
    </div>

    <!-- Tension Diagram Callout (0.4s -> 4.2s) -->
    <div id="meter-clip" class="clip" data-start="0.4" data-duration="3.8" data-track-index="2">
      <div id="tension-meter" class="tension-meter">
        <span class="meter-badge hf-hl-orange">LÒ XO</span>
        <span class="meter-text hf-text-light">BẬT TUNG</span>
      </div>
    </div>

    <!-- Overlay 1: Label "VÙNG LÊN PHẢN KHÁNG" (1.31s -> 3.21s) -->
    <div id="label-clip" class="clip" data-start="1.31" data-duration="1.9" data-track-index="3">
      <div id="label-banner" class="label-plate hf-plate-ink">
        <div class="label-tag hf-hl-orange">ĐẢO CHIỀU</div>
        <div class="label-title hf-text-light">VÙNG LÊN PHẢN KHÁNG</div>
      </div>
    </div>

    <!-- Overlay 2: Punch Phrase "KHOẢNH KHẮC GIẢI TỎA" (4.55s -> 6.2s) -->
    <div id="punch-clip" class="clip" data-start="4.55" data-duration="1.65" data-track-index="4">
      <div id="punch-banner" class="punch-plate hf-plate-ink">
        <div class="punch-tag hf-hl-orange">BẬT LÒ XO</div>
        <div class="punch-title hf-text-light">KHOẢNH KHẮC GIẢI TỎA</div>
        <div id="punch-bar" class="punch-line"></div>
      </div>
    </div>

    <!-- Signature Orange Bottom Bar -->
    <div class="bottom-bar"></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. Shatter transition: polygonal shards explode outwards away from center
    tl.fromTo("#shard-1", { x: 0, y: 0, rotation: 0, opacity: 1 }, { x: -380, y: -450, rotation: -35, opacity: 0, duration: 0.65, ease: "power3.out" }, 0);
    tl.fromTo("#shard-2", { x: 0, y: 0, rotation: 0, opacity: 1 }, { x: 420, y: -420, rotation: 30, opacity: 0, duration: 0.65, ease: "power3.out" }, 0);
    tl.fromTo("#shard-3", { x: 0, y: 0, rotation: 0, opacity: 1 }, { x: -480, y: 120, rotation: -40, opacity: 0, duration: 0.65, ease: "power3.out" }, 0.05);
    tl.fromTo("#shard-4", { x: 0, y: 0, rotation: 0, opacity: 1 }, { x: 460, y: 160, rotation: 35, opacity: 0, duration: 0.65, ease: "power3.out" }, 0.05);
    tl.fromTo("#shard-5", { x: 0, y: 0, rotation: 0, opacity: 1 }, { x: -360, y: 520, rotation: -25, opacity: 0, duration: 0.65, ease: "power3.out" }, 0.1);
    tl.fromTo("#shard-6", { x: 0, y: 0, rotation: 0, opacity: 1 }, { x: 380, y: 540, rotation: 28, opacity: 0, duration: 0.65, ease: "power3.out" }, 0.1);

    // 2. Hero card arrival punch
    tl.fromTo("#hero-card", { scale: 1.05, opacity: 0.8 }, { scale: 1.0, opacity: 1.0, duration: 0.7, ease: "power3.out" }, 0);

    // 3. Camera motion: zoom-out from the bursting crowd
    tl.fromTo("#hero-img", { scale: 1.4, y: 40 }, { scale: 1.05, y: 0, duration: 2.8, ease: "power2.out" }, 0);
    tl.to("#hero-img", { scale: 1.0, y: -10, duration: 3.4, ease: "sine.inOut" }, 2.8);

    // 4. Diagram Accent: Tension release meter entrance & exit
    tl.fromTo("#tension-meter", { scale: 0, opacity: 0, y: 0 }, { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.4);
    tl.fromTo("#tension-meter", { opacity: 1, y: 0 }, { opacity: 0, y: -20, duration: 0.35, ease: "power2.in", immediateRender: false }, 3.8);

    // 5. Overlay 1: Label "VÙNG LÊN PHẢN KHÁNG" entrance and exit
    tl.fromTo("#label-banner", { x: -50, opacity: 0, y: 0 }, { x: 0, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.31);
    tl.fromTo("#label-banner", { opacity: 1, y: 0 }, { opacity: 0, y: -20, duration: 0.35, ease: "power2.in", immediateRender: false }, 2.86);

    // 6. Overlay 2: Punch Phrase "KHOẢNH KHẮC GIẢI TỎA" entrance
    tl.fromTo("#punch-banner", { scale: 0.85, opacity: 0, y: 40 }, { scale: 1.0, opacity: 1.0, y: 0, duration: 0.5, ease: "power3.out" }, 4.55);
    tl.fromTo("#punch-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, 4.75);

    // Register single paused timeline for HyperFrames
    window.__timelines["scene-s16"] = tl;
  </script>

    </template>
  </body>
</html>
