<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #e7e3d9;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* Background spotlight variant */
      .bg-spotlight {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 48%,
          #f2efe6 0%,
          #e7e3d9 55%,
          #cfcac0 100%
        );
      }

      .bg-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        background-position: 0 0;
      }

      /* Hero container & Paper-collage card */
      .hero-wrapper {
        position: absolute;
        left: 60px;
        top: 180px;
        width: 960px;
        height: 1040px;
        transform-origin: 50% 20%;
      }

      .hero-card {
        position: absolute;
        inset: 0;
        background-color: #f5f0e4;
        border: 4px solid #141414;
        box-shadow: 14px 16px 0px #141414;
        overflow: hidden;
      }

      .hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 25%;
        display: block;
      }

      /* Decorative tape corner */
      .paper-tape {
        position: absolute;
        top: -14px;
        left: 40px;
        width: 140px;
        height: 34px;
        background-color: rgba(231, 227, 217, 0.95);
        border: 2px dashed rgba(20, 20, 20, 0.4);
        transform: rotate(-3deg);
        z-index: 4;
      }

      /* Overlay 1: Rise icon badge */
      .rise-badge-wrapper {
        position: absolute;
        left: 800px;
        top: 220px;
        width: 170px;
        height: 170px;
        transform-origin: 50% 50%;
      }

      .badge-rise {
        position: absolute;
        inset: 0;
        background-color: #141414;
        border: 4px solid #ff6a1a;
        box-shadow: 8px 10px 0px #141414;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
      }

      .rise-svg-wrap {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Overlay 2: Punch phrase label */
      .punch-badge-wrapper {
        position: absolute;
        left: 70px;
        top: 1250px;
        width: 940px;
        height: 116px;
        transform-origin: 50% 50%;
      }

      .badge-punch {
        position: absolute;
        inset: 0;
        background-color: #ff6a1a;
        border: 4px solid #141414;
        box-shadow: 10px 12px 0px #141414;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
      }

      .punch-text {
        font-size: 54px;
        font-weight: 900;
        color: #141414;
        text-transform: uppercase;
        letter-spacing: 1px;
        line-height: 1;
        margin: 0;
      }

      /* Permanent Vox signature orange bottom bar */
      .vox-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 50;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s25"
      data-width="1080"
      data-height="1920"
      data-duration="5.39"
    >
      <!-- Base Background layer -->
      <div class="bg-spotlight"></div>
      <div class="bg-grid"></div>

      <!-- Main Scene Visual Clip -->
      <section
        id="scene-s25"
        class="clip"
        data-start="0"
        data-duration="5.39"
      >
        <!-- Hero Photo with Wobble-Drop entrance -->
        <div id="hero-wrapper" class="hero-wrapper">
          <div class="paper-tape"></div>
          <div class="hero-card">
            <img
              id="hero-img"
              class="hero-img"
              src="assets/img-07-sold-out-ticket-crowd.jpg"
              alt="Sold out ticket crowd"
            />
          </div>
        </div>
      </section>

      <!-- Overlay 1: Rise Icon (direct child of #root, standalone timed clip) -->
      <div
        id="overlay-rise"
        class="clip"
        data-start="1.16"
        data-duration="1.8"
      >
        <div id="rise-badge-wrapper" class="rise-badge-wrapper">
          <div class="badge-rise">
            <div class="rise-svg-wrap">
              <svg
                id="rise-svg"
                viewBox="0 0 100 100"
                width="120"
                height="120"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <!-- Baseline axes -->
                <path
                  d="M 18 82 L 82 82"
                  stroke="#F7F4EC"
                  stroke-width="5"
                  stroke-linecap="round"
                />
                <!-- Progressive trend line -->
                <path
                  id="rise-path-trend"
                  d="M 24 72 L 44 54 L 56 62 L 76 26"
                  stroke="#FF6A1A"
                  stroke-width="8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <!-- Arrowhead pointing up -->
                <path
                  id="rise-path-arrow"
                  d="M 60 26 L 76 26 L 76 42"
                  stroke="#FF6A1A"
                  stroke-width="8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Overlay 2: Punch Phrase (direct child of #root, standalone timed clip) -->
      <div
        id="overlay-punch"
        class="clip"
        data-start="4.28"
        data-duration="1.11"
      >
        <div id="punch-badge-wrapper" class="punch-badge-wrapper">
          <div class="badge-punch">
            <span class="punch-text">TỰ QUAY NHANH DẦN</span>
          </div>
        </div>
      </div>

      <!-- Signature Orange Bar at bottom edge -->
      <div class="vox-bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Setup self-drawing SVG path lengths for the rise icon
      const trendPath = document.querySelector("#rise-path-trend");
      const arrowPath = document.querySelector("#rise-path-arrow");

      let trendLen = 120;
      let arrowLen = 40;

      if (trendPath && trendPath.getTotalLength) {
        trendLen = trendPath.getTotalLength();
        trendPath.style.strokeDasharray = trendLen;
        trendPath.style.strokeDashoffset = trendLen;
      }
      if (arrowPath && arrowPath.getTotalLength) {
        arrowLen = arrowPath.getTotalLength();
        arrowPath.style.strokeDasharray = arrowLen;
        arrowPath.style.strokeDashoffset = arrowLen;
      }

      // 1. Wobble-drop entrance for Hero Card (0.00s -> 0.70s)
      tl.fromTo(
        "#hero-wrapper",
        {
          y: -240,
          rotation: -4,
          scale: 0.94,
          opacity: 0,
        },
        {
          y: 0,
          rotation: 0,
          scale: 1,
          opacity: 1,
          duration: 0.68,
          ease: "power3.out",
        },
        0
      );

      // 2. Subtle camera drift / tilt across the crowd (0.70s -> 5.39s)
      tl.fromTo(
        "#hero-img",
        {
          scale: 1.0,
          y: 0,
        },
        {
          scale: 1.05,
          y: -24,
        },
        0.70
      );
      tl.to(
        "#hero-img",
        {
          duration: 4.69,
          ease: "none",
        },
        0.70
      );

      // 3. Overlay 1: Rise Badge Pop Arrival at 1.16s (tween child wrapper, not .clip)
      tl.fromTo(
        "#rise-badge-wrapper",
        {
          scale: 0.2,
          opacity: 0,
          y: 30,
        },
        {
          scale: 1,
          opacity: 1,
          y: 0,
          duration: 0.42,
          ease: "power3.out",
        },
        1.16
      );

      // SVG path progressive draw
      if (trendPath) {
        tl.fromTo(
          trendPath,
          { strokeDashoffset: trendLen },
          {
            strokeDashoffset: 0,
            duration: 0.48,
            ease: "power2.out",
          },
          1.28
        );
      }

      if (arrowPath) {
        tl.fromTo(
          arrowPath,
          { strokeDashoffset: arrowLen },
          {
            strokeDashoffset: 0,
            duration: 0.32,
            ease: "power2.out",
          },
          1.56
        );
      }

      // Exit fade for Rise Badge before it leaves visible slot at 2.96s
      tl.to(
        "#rise-badge-wrapper",
        {
          opacity: 0,
          scale: 0.88,
          duration: 0.22,
          ease: "power2.in",
        },
        2.74
      );

      // 4. Overlay 2: Punch Phrase Arrival at 4.28s (tween child wrapper, not .clip)
      tl.fromTo(
        "#punch-badge-wrapper",
        {
          scale: 0.75,
          opacity: 0,
          y: 40,
        },
        {
          scale: 1,
          opacity: 1,
          y: 0,
          duration: 0.44,
          ease: "power3.out",
        },
        4.28
      );

      // Register the master timeline
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s25"] = tl;
    </script>
  
    </template>
  </body>
</html>
