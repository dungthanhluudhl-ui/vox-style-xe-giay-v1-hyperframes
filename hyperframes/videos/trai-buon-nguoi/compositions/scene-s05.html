      <style>

.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }

        padding: 0;

        color: #141414;

      #root {

          linear-gradient(to bottom, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Vox Visual DNA & Safe color plates */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
      .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
      .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
      .hf-plate-paper { background-color: #E7E3D9; color: #141414; }

      /* Bottom orange signature bar */
      #bottom-orange-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 100;
      }

      /* Scene Layout */
      #scene-clip {
        z-index: 10;
      }

      #hero-mount {
        position: absolute;
        left: 230px;
        top: 240px;
        width: 620px;
        height: 1110px;
      }

      .hero-card {
        width: 100%;
        height: 100%;
        position: relative;
        border-radius: 6px;
        box-shadow: 12px 14px 0px #141414;
        border: 4px solid #141414;
        background-color: #F5F0E4;
        overflow: hidden;
      }

      #hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: 50% 15%;

      #overlay-label-clip {

        font-size: 44px;

      /* Overlay 2: Punch phrase clip */
      #overlay-punch-clip {

        display: flex;
        justify-content: center;

      <div

        class="clip"

        data-duration="2.79"

        class="clip"

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Scene Entrance (rise)
      tl.fromTo(
        "#hero-mount",
        { y: 150, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
        0.15
      );

      // 2. Camera Motion: Continuous slow zoom-out revealing the 4-tier list
      tl.fromTo(
        "#hero-img",
        { scale: 1.45, y: 70 },
        { scale: 1.0, y: 0, duration: 7.88, ease: "sine.out" },
        0
      );

      // 3. Overlay 1: Label "KHÔNG CẦN HOÀN HẢO"
      tl.fromTo(
        "#label-container",
        { scale: 0.88, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        3.01
      );
      tl.to(
        "#label-container",
        { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" },
        5.45
      );

      // 4. Overlay 2: Punch-phrase "4 ĐIỂM NHẠY CẢM"
      tl.fromTo(
        "#punch-container",
        { scale: 0.85, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        6.00
      );

      window.__timelines["scene-s05"] = tl;
