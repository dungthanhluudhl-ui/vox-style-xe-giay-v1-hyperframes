<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *, *::before, *::after {
        box-sizing: border-box;
      }
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #E7E3D9;
        overflow: hidden;
        font-family: "Be Vietnam Pro", sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Bảng màu chuẩn WCAG từ style-tokens.json */
      .hf-text-ink {
        color: #141414;
      }
      .hf-text-light {
        color: #F7F4EC;
      }
      .hf-hl-orange {
        background-color: #FF6A1A;
        color: #141414;
      }
      .hf-plate-ink {
        background-color: #141414;
        color: #F7F4EC;
      }
      .hf-plate-ink-orange {
        background-color: #141414;
        color: #FF6A1A;
      }
      .hf-plate-paper {
        background-color: #E7E3D9;
        color: #141414;
      }

      /* Lưới nền ô vuông 84px đặc trưng Vox */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-size: 84px 84px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px);
      }

      /* Biến thể spotlight: radial vignette tối ở mép khung hình */
      .bg-spotlight-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 46%, rgba(20, 20, 20, 0) 30%, rgba(20, 20, 20, 0.38) 75%, rgba(20, 20, 20, 0.65) 100%);
      }

      /* Khung ảnh hero collage */
      #photo-frame {
        position: absolute;
        left: 50px;
        top: 180px;
        width: 980px;
        height: 1200px;
        border: 4px solid #141414;
        background-color: #141414;
        box-shadow: 0 32px 70px rgba(20, 20, 20, 0.45);
        overflow: hidden;
        border-radius: 4px;
      }

      #photo-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
        transform-origin: 50% 50%;
      }

      /* Vệt nét vẽ tay lực đấm giáp lá cà (SVG overlay) */
      #impact-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: visible;
      }

      .impact-line {
        fill: none;
        stroke: #FF6A1A;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Thanh cam thương hiệu cố định ở mép dưới */
      #bottom-orange-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s27"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="5.96"
    >
      <!-- Nền giấy ngà + Lưới 84px + Biến thể spotlight -->
      <div id="scene-bg" style="position: absolute; inset: 0; z-index: 1;">
        <div class="bg-grid"></div>
        <div class="bg-spotlight-vignette"></div>
      </div>

      <!-- Shot 1: Tái hiện ẩu đả nhà kho bạo liệt (0s -> 5.96s) -->
      <section id="shot-1" class="clip" data-start="0" data-duration="5.96" style="z-index: 10;">
        <div id="camera-rig" style="position: absolute; inset: 0; transform-origin: 50% 46%;">
          <div id="photo-frame">
            <img
              id="photo-img"
              src="assets/img-17-warehouse-brawl-gang-fight.jpg"
              alt="Warehouse Brawl Fight Scene"
            />
            <!-- SVG đường nét vẽ tay biểu thị lực va chạm cận chiến -->
            <svg id="impact-svg" viewBox="0 0 980 1200">
              <g id="impact-lines-group">
                <path class="impact-line" d="M 410 560 L 270 480" />
                <path class="impact-line" d="M 570 540 L 710 450" />
                <path class="impact-line" d="M 590 650 L 740 730" />
                <path class="impact-line" d="M 390 660 L 250 750" />
                <path class="impact-line" d="M 490 510 L 490 380" />
                <path class="impact-line" d="M 470 720 L 460 840" />
              </g>
            </svg>
          </div>
        </div>
      </section>

      <!-- Overlay 1: Nhãn CẬN CHIẾN THÔ RÁP (2.23s -> 4.13s) -->
      <div
        id="overlay-label"
        class="clip"
        data-start="2.23"
        data-duration="1.90"
        style="z-index: 50; pointer-events: none;"
      >
        <div style="position: absolute; left: 0; right: 0; top: 1140px; display: flex; justify-content: center; align-items: center;">
          <div
            id="label-card"
            class="hf-plate-ink"
            style="display: flex; align-items: center; gap: 20px; padding: 22px 42px; border: 4px solid #FF6A1A; border-radius: 8px; box-shadow: 0 20px 45px rgba(20, 20, 20, 0.65);"
          >
            <div style="width: 10px; height: 54px; background-color: #FF6A1A; border-radius: 4px; flex-shrink: 0;"></div>
            <span
              class="hf-text-light"
              style="font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; font-size: 56px; line-height: 1.1; letter-spacing: 1.5px; text-transform: uppercase;"
            >
              CẬN CHIẾN THÔ RÁP
            </span>
          </div>
        </div>
      </div>

      <!-- Overlay 2: Biểu tượng ban - không múa võ màu mè (4.77s -> 5.96s) -->
      <div
        id="overlay-icon"
        class="clip"
        data-start="4.77"
        data-duration="1.19"
        style="z-index: 60; pointer-events: none;"
      >
        <div style="position: absolute; left: 0; right: 0; top: 1120px; display: flex; justify-content: center; align-items: center;">
          <div
            id="icon-badge"
            class="hf-plate-ink"
            style="width: 160px; height: 160px; border-radius: 50%; border: 5px solid #FF6A1A; box-shadow: 0 22px 50px rgba(20, 20, 20, 0.7); display: flex; justify-content: center; align-items: center;"
          >
            <svg id="icon-ban-svg" width="108" height="108" viewBox="0 0 108 108" style="overflow: visible;">
              <circle
                id="ban-circle"
                cx="54"
                cy="54"
                r="42"
                fill="none"
                stroke="#FF6A1A"
                stroke-width="11"
                stroke-linecap="round"
              />
              <line
                id="ban-slash"
                x1="24"
                y1="24"
                x2="84"
                y2="84"
                stroke="#FF6A1A"
                stroke-width="11"
                stroke-linecap="round"
              />
            </svg>
          </div>
        </div>
      </div>

      <!-- Thanh cam đáy cố định nhận diện phong cách Vox -->
      <div id="bottom-orange-bar"></div>
    </div>

    <script>
      // Setup timeline chính bị hoãn (paused) - contract bắt buộc của HyperFrames
      const tl = gsap.timeline({ paused: true });

      // Thiết lập vẽ nét tự-vẽ-dần (stroke-dasharray) cho đường lực va chạm
      const impactElements = document.querySelectorAll(".impact-line");
      impactElements.forEach((path) => {
        const len = path.getTotalLength();
        path.style.strokeDasharray = `${len}`;
        path.style.strokeDashoffset = `${len}`;
      });

      // Thiết lập vẽ nét tự-vẽ-dần cho biểu tượng ban
      const banCircle = document.getElementById("ban-circle");
      const banSlash = document.getElementById("ban-slash");
      if (banCircle && banSlash) {
        const circleLen = banCircle.getTotalLength();
        banCircle.style.strokeDasharray = `${circleLen}`;
        banCircle.style.strokeDashoffset = `${circleLen}`;

        const slashLen = banSlash.getTotalLength();
        banSlash.style.strokeDasharray = `${slashLen}`;
        banSlash.style.strokeDashoffset = `${slashLen}`;
      }

      // --- CHOREOGRAPHY TIMELINE ---

      // 1. Entrance "strike": Cú va chạm cận chiến bạo liệt tại t=0
      tl.fromTo(
        "#camera-rig",
        { scale: 1.16, opacity: 0 },
        { scale: 1.04, opacity: 1, duration: 0.12, ease: "power4.out" },
        0
      );

      // Rung va đập va chạm dồn trọng tâm (chuỗi dịch chuyển chốt mốc tuyệt đối, deterministic)
      tl.to("#camera-rig", { x: -18, y: 12, duration: 0.05, ease: "none" }, 0.12);
      tl.to("#camera-rig", { x: 16, y: -10, duration: 0.06, ease: "none" }, 0.17);
      tl.to("#camera-rig", { x: -10, y: 8, duration: 0.06, ease: "none" }, 0.23);
      tl.to("#camera-rig", { x: 6, y: -4, duration: 0.06, ease: "none" }, 0.29);
      tl.to("#camera-rig", { x: -2, y: 2, duration: 0.06, ease: "none" }, 0.35);
      tl.to("#camera-rig", { x: 0, y: 0, duration: 0.06, ease: "power1.out" }, 0.41);

      // Các vệt nét vẽ tay mô tả lực đấm phóng ra tức thì lúc va chạm
      impactElements.forEach((path) => {
        tl.to(path, { strokeDashoffset: 0, duration: 0.16, ease: "power2.out" }, 0.10);
      });
      tl.to("#impact-lines-group", { opacity: 0, duration: 0.22, ease: "power1.in" }, 0.34);

      // 2. Camera motion "zoom-in": Tiến dần vào trọng tâm vụ ẩu đả nhà kho
      tl.to(
        "#photo-img",
        { scale: 1.14, y: -18, duration: 5.50, ease: "none" },
        0.46
      );

      // 3. Overlay Label "CẬN CHIẾN THÔ RÁP" (xuất hiện tại 2.23s, ẩn trước khi hết clip 4.13s)
      tl.fromTo(
        "#label-card",
        { scale: 0.88, y: 35, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.32, ease: "power3.out" },
        2.23
      );
      tl.to(
        "#label-card",
        { opacity: 0, y: -15, duration: 0.24, ease: "power2.in" },
        3.86
      );

      // 4. Overlay Icon "ban" (xuất hiện tại 4.77s)
      tl.fromTo(
        "#icon-badge",
        { scale: 0.65, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.28, ease: "power3.out" },
        4.77
      );
      if (banCircle && banSlash) {
        tl.to(banCircle, { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" }, 4.88);
        tl.to(banSlash, { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" }, 5.08);
      }

      // Đăng ký timeline cho HyperFrames seek
      window.__timelines["scene-s27"] = tl;
    </script>
  
    </template>
  </body>
</html>
