<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      padding: 0;
      background: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: #E7E3D9;
      overflow: hidden;
      perspective: 1200px;
    }
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Background Variant: chart (4 horizontal lines + left-edge orange ticks) */
    .chart-background {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .chart-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(20, 20, 20, 0.32);
    }
    .chart-tick {
      position: absolute;
      left: 0;
      width: 24px;
      height: 4px;
      background: #FF6A1A;
      transform: translateY(-1px);
    }
    .chart-line-1 { top: 384px; }
    .chart-line-2 { top: 768px; }
    .chart-line-3 { top: 1152px; }
    .chart-line-4 { top: 1536px; }

    /* Media Wrapper for Zoom / Pan */
    .media-wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .scene-image {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
    }
    .lighting-overlay {
      position: absolute;
      inset: 0;
      background: #141414;
      pointer-events: none;
    }

    /* Stage / Shot */
    #shot-1 {
      position: absolute;
      inset: 0;
      z-index: 2;
      transform-origin: top center;
    }

    /* Overlay 1: Data badge (QUA 11:00 AM) */
    .data-badge-pos {
      position: absolute;
      top: 220px;
      left: 80px;
      z-index: 10;
    }
    .data-card {
      display: inline-flex;
      align-items: center;
      padding: 18px 36px;
      border-left: 10px solid #FF6A1A;
      border-radius: 8px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
    }
    .data-text {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 2px;
      white-space: nowrap;
      line-height: 1.2;
    }

    /* Overlay 2: Punch phrase (TẠM THỜI SỐNG SÓT) */
    .punch-phrase-pos {
      position: absolute;
      top: 1020px;
      left: 80px;
      right: 80px;
      display: flex;
      justify-content: center;
      z-index: 10;
    }
    .punch-card {
      padding: 24px 44px;
      border-radius: 12px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
      display: inline-block;
      text-align: center;
    }
    .punch-text {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 1px;
      white-space: nowrap;
      line-height: 1.2;
    }

    /* Fixed Brand Accent Bar */
    .brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      background: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s05" data-width="1080" data-height="1920" data-duration="6">
    <!-- Chart Background Variant -->
    <div class="chart-background">
      <div class="chart-line chart-line-1"><div class="chart-tick"></div></div>
      <div class="chart-line chart-line-2"><div class="chart-tick"></div></div>
      <div class="chart-line chart-line-3"><div class="chart-tick"></div></div>
      <div class="chart-line chart-line-4"><div class="chart-tick"></div></div>
    </div>

    <!-- Shot S05-1 -->
    <section id="shot-1" class="clip" data-start="0" data-duration="6">
      <div id="media-wrapper" class="media-wrapper">
        <img id="scene-img" class="clip scene-image" data-start="0" data-duration="6" src="assets/img-03-prison-morning-roll-call.jpg" alt="" />
        <div id="lighting-overlay" class="lighting-overlay"></div>
      </div>

      <!-- Overlay 1: Data badge -->
      <div class="data-badge-pos">
        <div id="data-card" class="data-card hf-plate-ink">
          <span class="data-text hf-text-light">QUA 11:00 AM</span>
        </div>
      </div>

      <!-- Overlay 2: Punch phrase -->
      <div class="punch-phrase-pos">
        <div id="punch-card" class="punch-card hf-hl-orange">
          <span class="punch-text hf-text-ink">TẠM THỜI SỐNG SÓT</span>
        </div>
      </div>
    </section>

    <!-- Brand Bar (Fixed Bottom) -->
    <div class="brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // TransitionIn: unfold for Shot 1
    tl.fromTo("#shot-1",
      { rotationX: -60, opacity: 0, transformPerspective: 1200 },
      { rotationX: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
      0
    );

    // Camera Motion: zoom-out on media wrapper
    tl.fromTo("#media-wrapper",
      { scale: 1.16 },
      { scale: 1.0, duration: 5.9, ease: "power1.out" },
      0
    );

    // Asset Treatment: Phòng giam dần bừng sáng
    tl.fromTo("#lighting-overlay",
      { opacity: 0.55 },
      { opacity: 0, duration: 1.6, ease: "power2.out" },
      0.1
    );

    // Overlay 1: "QUA 11:00 AM" (type: data, atMs: 30500 -> 0.26s, holdMs: 2700)
    tl.fromTo("#data-card",
      { scale: 0.8, opacity: 0, y: -24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.26
    );
    tl.fromTo("#data-card",
      { opacity: 1 },
      { opacity: 0, duration: 0.2, ease: "power2.in" },
      2.96
    );

    // Overlay 2: "TẠM THỜI SỐNG SÓT" (type: label, atMs: 33400 -> 3.16s, holdMs: 2700)
    tl.fromTo("#punch-card",
      { scale: 0.82, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
      3.16
    );
    tl.fromTo("#punch-card",
      { opacity: 1 },
      { opacity: 0, duration: 0.14, ease: "power2.in" },
      5.85
    );

    window.__timelines["scene-s05"] = tl;
  </script>

    </template>
  </body>
</html>
