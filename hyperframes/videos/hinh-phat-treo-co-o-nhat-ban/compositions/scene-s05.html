      const tl = gsap.timeline({ paused: true });

      // Measure SVG path for stroke animation
      const fallPath = document.getElementById("fall-path");

        fallPath.style.strokeDasharray = len;
        fallPath.style.strokeDashoffset = len;
      }

      // 1. Entrance: Unfold vertically (0.0s -> 0.65s)
      tl.fromTo(
        "#unfold-container",
        { scaleY: 0.1, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
        0,
      );

      // 2. Camera motion: subtle pan-right drift (0.0s -> 6.0s)
      tl.fromTo(
        "#camera-rig",
        { x: -16 },
        { x: 16, duration: 6.0, ease: "sine.inOut" },
        0,
      );

      // 3. Clock transition past 11:00 AM (0.75s -> 2.25s)
      tl.to(
        "#hand-minute",
        { rotation: 450, duration: 1.5, ease: "power2.inOut" },
        0.75,
      );
      tl.to(
        "#hand-hour",
        { rotation: 338, duration: 1.5, ease: "power2.inOut" },
        0.75,
      );

      // Digital time slot rolls from 10:55 to 11:15 at 1.45s
      tl.to(
        "#digital-slot",
        { y: -40, duration: 0.35, ease: "power2.inOut" },
        1.45,
      );

      // 4. Pressure meter drops sharply from 92% to 16% (0.9s -> 2.3s)
      tl.to(
        "#meter-fill",
        { scaleY: 0.16, duration: 1.4, ease: "power2.out" },
        0.9,
      );
      tl.to(
        "#pressure-num",
        {
          innerText: 16,
          snap: { innerText: 1 },
          duration: 1.4,
          ease: "power2.out",
        },
        0.9,
      );

      // 5. Overlay 1: "QUA GIỜ NGUY HIỂM" enters at relative 1.48s (atMs: 31720)
      tl.fromTo(
        "#overlay-1",
        { scale: 0.9, opacity: 0, y: 22 },
        { scale: 1, opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
        1.48,
      );

      // 6. Icon "fall" (Graph strip & path drawing) at relative 2.56s (atMs: 32800)
      tl.fromTo(
        "#fall-indicator-box",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        2.56,
      );
      if (fallPath) {
        tl.to(
          fallPath,
          { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
          2.68,
        );

        "#fall-arrow",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" },
        3.15,

        4.03,
