<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #141414;
      overflow: hidden;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    #video-wrapper {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      z-index: 1;
    }

    #video-scaler {
      width: 100%;
      height: 100%;
      transform-origin: 50% 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #vid-14 {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #spotlight-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(20, 20, 20, 0.15) 15%, rgba(20, 20, 20, 0.72) 65%, rgba(10, 10, 10, 0.95) 100%);
      pointer-events: none;
      z-index: 2;
    }

    #brand-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
      pointer-events: none;
    }

    #shot-1 {
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 250px 80px 580px 80px;
    }

    .overlay-row {
      display: flex;
      width: 100%;
    }

    .overlay-row.top-row {
      justify-content: flex-start;
    }

    .overlay-row.bottom-row {
      justify-content: flex-start;
    }

    /* Label Badge (Overlay 1) */
    .badge-card {
      display: inline-flex;
      align-items: center;
      padding: 22px 38px;
      border-radius: 12px;
      border-left: 12px solid #FF6A1A;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.6);
      will-change: transform, opacity;
    }

    .badge-text {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 52px;
      line-height: 1.25;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    /* Timer Counter Card (Overlay 2 - bộ đếm thời gian chớp nhanh) */
    .timer-card {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      border-radius: 14px;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.75);
      border: 3px solid rgba(255, 106, 26, 0.35);
      will-change: transform, opacity;
    }

    .timer-strobe-frame {
      position: absolute;
      inset: -4px;
      border: 4px solid #FF6A1A;
      border-radius: 16px;
      pointer-events: none;
      opacity: 0;
      box-shadow: 0 0 35px rgba(255, 106, 26, 0.85), inset 0 0 16px rgba(255, 106, 26, 0.45);
    }

    .timer-inner-box {
      display: flex;
      flex-direction: column;
      background-color: #141414;
      border-radius: 11px;
      padding: 16px 32px 18px 32px;
      gap: 12px;
    }

    .timer-bar-track {
      width: 100%;
      height: 8px;
      background-color: rgba(255, 255, 255, 0.16);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .timer-bar-fill {
      width: 100%;
      height: 100%;
      background-color: #FF6A1A;
      border-radius: 4px;
    }

    .timer-text {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 50px;
      line-height: 1.2;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }
  </style>

  <div id="root" data-composition-id="scene-s10" data-width="1080" data-height="1920" data-duration="7.65">
    <!-- Video Wrapper (không có data-start để tránh lint video_nested_in_timed_element) -->
    <div id="video-wrapper">
      <div id="video-scaler">
        <video
          id="vid-14"
          src="assets/vid-14-trapdoor-dark-pit-shadow-figures.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="7.65"
          data-media-start="0">
        </video>
      </div>
    </div>

    <!-- Spotlight Vignette cho biến thể nền spotlight -->
    <div id="spotlight-vignette"></div>

    <!-- Shot 1 Overlays Container -->
    <section id="shot-1" class="clip" data-start="0" data-duration="7.65">
      <div class="overlay-row top-row">
        <div id="label-badge" class="hf-plate-ink badge-card">
          <span class="hf-text-light badge-text">CỬA SẬP THỤT XUỐNG</span>
        </div>
      </div>

      <div class="overlay-row bottom-row">
        <!-- Bộ đếm thời gian chớp nhanh góc dưới màn hình -->
        <div id="timer-counter" class="hf-plate-ink timer-card">
          <div id="timer-strobe-border" class="timer-strobe-frame"></div>
          <div class="timer-inner-box">
            <div class="timer-bar-track">
              <div id="timer-progress-fill" class="timer-bar-fill"></div>
            </div>
            <span class="hf-text-light timer-text">CHƯA ĐẦY 1 PHÚT</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Thanh cam cố định mép đáy thương hiệu -->
    <div id="brand-bottom-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. TransitionIn: shatter entrance (0s - 0.45s)
    tl.fromTo(
      "#video-scaler",
      { scale: 1.28, rotation: -2.5 },
      { scale: 1.02, rotation: 0, duration: 0.45, ease: "power4.out" },
      0
    );

    // 2. CameraMotion: zoom-in tiếp diễn (0.45s - 7.60s)
    tl.fromTo(
      "#video-scaler",
      { scale: 1.02 },
      { scale: 1.15, duration: 7.15, ease: "power1.out" },
      0.45
    );

    // 3. Overlay 1: "CỬA SẬP THỤT XUỐNG" (atMs: 78000 -> 0.76s, holdMs: 3500 -> 4.26s)
    tl.fromTo(
      "#label-badge",
      { scale: 0.85, opacity: 0, y: 35 },
      { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
      0.76
    );
    tl.fromTo(
      "#label-badge",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -15, duration: 0.25, ease: "power2.in" },
      4.26
    );

    // 4. Overlay 2: "CHƯA ĐẦY 1 PHÚT" - Bộ đếm thời gian chớp nhanh (atMs: 82500 -> 5.26s, holdMs: 2200 -> 7.46s)
    // 4a. Xuất hiện thẻ bộ đếm với hiệu ứng giật nảy mạnh
    tl.fromTo(
      "#timer-counter",
      { scale: 0.84, opacity: 0, y: 25 },
      { scale: 1, opacity: 1, y: 0, duration: 0.32, ease: "power4.out" },
      5.26
    );

    // 4b. Thanh tiến trình đếm ngược co rút từ 100% về 0% trong 2.2 giây (data countdown timer bar)
    tl.fromTo(
      "#timer-progress-fill",
      { width: "100%" },
      { width: "0%", duration: 2.2, ease: "linear" },
      5.26
    );

    // 4c. Hiệu ứng chớp nhanh dồn dập (rapid flashing strobe) trên viền cảnh báo và nhịp giật của bộ đếm (8 nhịp)
    for (let i = 0; i < 8; i++) {
      const strobeTime = 5.35 + i * 0.24;

      // Chớp viền cam phát quang
      tl.fromTo(
        "#timer-strobe-border",
        { opacity: 0 },
        { opacity: 1, duration: 0.08, ease: "none" },
        strobeTime
      );
      tl.fromTo(
        "#timer-strobe-border",
        { opacity: 1 },
        { opacity: 0, duration: 0.14, ease: "none" },
        strobeTime + 0.08
      );

      // Micro-tick pulse giật nảy theo nhịp đồng hồ đếm ngược
      tl.fromTo(
        "#timer-counter",
        { scale: 1 },
        { scale: 1.035, duration: 0.08, ease: "power2.out" },
        strobeTime
      );
      tl.fromTo(
        "#timer-counter",
        { scale: 1.035 },
        { scale: 1, duration: 0.14, ease: "power2.in" },
        strobeTime + 0.08
      );
    }

    // 4d. Mờ dần ra khi hết thời lượng hiển thị (7.46s)
    tl.fromTo(
      "#timer-counter",
      { opacity: 1 },
      { opacity: 0, duration: 0.18, ease: "power2.in" },
      7.46
    );

    // Đăng ký timeline cho HyperFrames runtime
    window.__timelines["scene-s10"] = tl;
  </script>

    </template>
  </body>
</html>
