<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      padding: 0;
      background: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: #E7E3D9;
      overflow: hidden;
    }
    .clip {
      position: absolute;
      inset: 0;
    }
  </style>

  <div id="root" data-composition-id="scene-s45" data-width="1080" data-height="1920" data-duration="8.36">
    <!-- Nền chart: 4 đường kẻ ngang (20%, 40%, 60%, 80%) và vạch cam mép trái -->
    <div id="chart-bg" style="position: absolute; inset: 0; pointer-events: none;">
      <div style="position: absolute; top: 384px; left: 0; right: 0; height: 2px; background: rgba(20,20,20,0.32);">
        <div style="position: absolute; left: 0; top: -3px; width: 24px; height: 8px; background: #FF6A1A;"></div>
      </div>
      <div style="position: absolute; top: 768px; left: 0; right: 0; height: 2px; background: rgba(20,20,20,0.32);">
        <div style="position: absolute; left: 0; top: -3px; width: 24px; height: 8px; background: #FF6A1A;"></div>
      </div>
      <div style="position: absolute; top: 1152px; left: 0; right: 0; height: 2px; background: rgba(20,20,20,0.32);">
        <div style="position: absolute; left: 0; top: -3px; width: 24px; height: 8px; background: #FF6A1A;"></div>
      </div>
      <div style="position: absolute; top: 1536px; left: 0; right: 0; height: 2px; background: rgba(20,20,20,0.32);">
        <div style="position: absolute; left: 0; top: -3px; width: 24px; height: 8px; background: #FF6A1A;"></div>
      </div>
    </div>

    <!-- Shot 1: S45-1 -->
    <section id="shot-1" class="clip" data-start="0" data-duration="8.36">
      <div id="shot-content" style="position: absolute; inset: 0;">
        <!-- Khung ảnh căn phòng ngủ ký túc xá (img-11) -->
        <div id="media-frame" style="position: absolute; left: 90px; top: 220px; width: 900px; height: 940px; border: 3px solid #141414; background: #F5F0E4; box-shadow: 14px 14px 0px rgba(20,20,20,0.18); overflow: hidden; border-radius: 4px;">
          <img src="assets/img-11-depressed-man-sitting-bedroom.jpg" style="width: 100%; height: 100%; object-fit: cover; display: block;" alt="" />
        </div>

        <!-- Overlay 1: data (> 40% TỪNG CÓ TIỀN ÁN) - nằm ở nửa dưới khung ảnh -->
        <div id="overlay-1" class="hf-plate-ink" style="position: absolute; left: 110px; right: 110px; top: 880px; height: auto; padding: 26px 32px; border-left: 14px solid #FF6A1A; box-shadow: 0 16px 36px rgba(0,0,0,0.45); text-align: center; border-radius: 4px; opacity: 0; z-index: 10;">
          <span style="font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; font-size: 48px; line-height: 1.25; letter-spacing: -0.5px; color: #F7F4EC; display: block;">&gt; 40% TỪNG CÓ TIỀN ÁN</span>
        </div>

        <!-- Overlay 2: label (KÝ TÚC XÁ TẦNG TRÊN) - nằm bên dưới khung ảnh, tọa độ tách biệt tránh chồng lấn -->
        <div id="overlay-2" class="hf-plate-ink" style="position: absolute; left: 140px; right: 140px; top: 1200px; height: auto; padding: 22px 30px; border-left: 14px solid #FF6A1A; box-shadow: 0 14px 32px rgba(0,0,0,0.35); text-align: center; border-radius: 4px; opacity: 0; z-index: 11;">
          <span style="font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; font-size: 44px; line-height: 1.25; letter-spacing: -0.5px; color: #F7F4EC; display: block;">KÝ TÚC XÁ TẦNG TRÊN</span>
        </div>
      </div>
    </section>

    <!-- Thanh cam đáy 12px nhận diện thương hiệu cố định -->
    <div id="bottom-bar" style="position: absolute; bottom: 0; left: 0; right: 0; height: 12px; background: #FF6A1A; z-index: 999;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Shot 1 transitionIn: wobble-drop (rơi có độ lệch nhẹ và dừng êm)
    tl.fromTo("#shot-content",
      { y: -80, rotation: -2, opacity: 0 },
      { y: 0, rotation: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
      0
    );

    // Overlay 1: data "> 40% TỪNG CÓ TIỀN ÁN" (atMs: 359000 -> 0.76s; holdMs: 3500)
    tl.fromTo("#overlay-1",
      { scale: 0.88, opacity: 0, y: 25 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.76
    );
    tl.fromTo("#overlay-1",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -15, duration: 0.3, ease: "power2.in" },
      4.4
    );

    // Overlay 2: label "KÝ TÚC XÁ TẦNG TRÊN" (atMs: 363500 -> 5.26s; holdMs: 2800)
    tl.fromTo("#overlay-2",
      { scale: 0.88, opacity: 0, y: 25 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      5.26
    );
    tl.fromTo("#overlay-2",
      { opacity: 1 },
      { opacity: 0, duration: 0.2, ease: "power2.in" },
      8.12
    );

    window.__timelines["scene-s45"] = tl;
  </script>

    </template>
  </body>
</html>
