              <h1 class="scene-title">CƠ CẤU LAO ĐỘNG DOANH NGHIỆP</h1>

            <!-- Central Donut Diagram Area -->

    <script>
      // Single paused master timeline for HyperFrames deterministic rendering
      const tl = gsap.timeline({ paused: true });

      // Pre-measure SVG path lengths for crowd icon self-drawing
      const crowdElements = Array.from(document.querySelectorAll(".crowd-path"));
      const crowdLengths = crowdElements.map((path) => {
        const length = Math.ceil(path.getTotalLength ? path.getTotalLength() : 80);
        path.style.strokeDasharray = length + "";
        path.style.strokeDashoffset = length + "";
        return length;
      });

      // Measure leader connector lines once and reuse values
      const leaderOrange = document.getElementById("leader-path-orange");
      let orangeLeaderLen = 0;
      if (leaderOrange) {
        orangeLeaderLen = Math.ceil(leaderOrange.getTotalLength());
        leaderOrange.style.strokeDasharray = orangeLeaderLen + "";
        leaderOrange.style.strokeDashoffset = orangeLeaderLen + "";
      }

      const leaderOther = document.getElementById("leader-path-other");
      let otherLeaderLen = 0;
      if (leaderOther) {
        otherLeaderLen = Math.ceil(leaderOther.getTotalLength());
        leaderOther.style.strokeDasharray = otherLeaderLen + "";
        leaderOther.style.strokeDashoffset = otherLeaderLen + "";
      }

      // 1. Subtle camera zoom-in over 5 seconds (1.00 -> 1.04)
      tl.fromTo(
        "#camera-rig",
        { scale: 1.0 },
        { scale: 1.04, duration: 5.0, ease: "none" },
        0
      );

      // 2. Scene entrance: punch-in transition
      tl.fromTo(
        "#scene-content",
        { scale: 0.94, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.45, ease: "power4.out" },
        0.05
      );

      // 3. Ruled horizontal chart lines reveal
      tl.fromTo(
        ".chart-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, stagger: 0.06, ease: "power2.out" },
        0.1
      );
      tl.fromTo(
        ".chart-tick",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.3, stagger: 0.05, ease: "power2.out" },
        0.2
      );

      // 4. Header title slide-in
      tl.fromTo(
        "#header-block",
        { y: -24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.12
      );

      // 5. Donut slices animation
      // Other employees (58% slice) draws in first
      tl.fromTo(
        "#slice-other",
        { strokeDashoffset: 547 },
        { strokeDashoffset: 0, duration: 0.75, ease: "power3.out" },
        0.3
      );
      // Hero orange slice (42% special group) sweeps in
      tl.fromTo(
        "#slice-special",
        { strokeDashoffset: 396 },
        { strokeDashoffset: 0, duration: 0.85, ease: "power3.out" },
        0.42
      );

      // 6. Direct DOM innerText counter from 0 to 42 (deterministic seek)
      tl.fromTo(
        "#counter-num",
        { innerText: 0 },
        {
          innerText: 42,
          snap: { innerText: 1 },
          duration: 0.85,
          ease: "power2.out"
        },
        0.42
      );

      // 7. Leader lines draw using stored measurements
      if (leaderOrange) {
        tl.fromTo(
          leaderOrange,
          { strokeDashoffset: orangeLeaderLen },
          { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
          0.75
        );
      }
      if (leaderOther) {
        tl.fromTo(
          leaderOther,
          { strokeDashoffset: otherLeaderLen },
          { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
          0.85
        );
      }

      // 8. Callout annotation tags arrive
      tl.fromTo(
        "#callout-special",
        { scale: 0.82, opacity: 0, x: 20 },
        { scale: 1.0, opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        0.8
      );
      tl.fromTo(
        "#callout-other",
        { scale: 0.82, opacity: 0, x: -20 },
        { scale: 1.0, opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        0.9
      );

      // 9. OVERLAY 1: Punch phrase entrance (timed clip starts at 1.75s)
      tl.fromTo(
        "#punch-card",
        { scale: 0.84, opacity: 0, y: 24 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.45, ease: "power4.out" },
        1.75
      );

      // 10. OVERLAY 2: Crowd Icon Card entrance (timed clip starts at 3.51s)
      tl.fromTo(
        "#crowd-card",
        { scale: 0.86, opacity: 0, y: 20 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        3.51
      );
      // SVG paths self-drawing for the crowd icon with pre-measured lengths
      crowdElements.forEach((pathEl, idx) => {
        const pathLen = crowdLengths[idx];
        tl.fromTo(
          pathEl,
          { strokeDashoffset: pathLen },
          {
            strokeDashoffset: 0,
            duration: 0.5,
            ease: "power2.out"
          },
          3.55 + idx * 0.06
        );
      });

      // Register timeline for seekable HyperFrames frame rendering
      window.__timelines["scene-s45"] = tl;
    </script>
