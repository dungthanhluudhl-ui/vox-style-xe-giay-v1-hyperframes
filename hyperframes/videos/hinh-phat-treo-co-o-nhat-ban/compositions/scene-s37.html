<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #141414;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Video Viewport & Camera wrappers (không timed) */
    #video-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 10;
    }

    #video-camera {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      transform-origin: center center;
    }

    #vid-09 {
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      display: block;
    }

    /* Shot Overlays */
    #shot-1 {
      z-index: 20;
      pointer-events: none;
    }

    .overlay-card {
      position: absolute;
      height: auto;
      width: fit-content;
      max-width: 920px;
      padding: 16px 28px 16px 24px;
      border-left: 10px solid #FF6A1A;
      border-radius: 4px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
      opacity: 0;
      display: flex;
      align-items: center;
    }

    #overlay-1 {
      top: 280px;
      left: 70px;
    }

    #overlay-2 {
      top: 580px;
      left: 70px;
    }

    .overlay-text {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 42px;
      line-height: 1.25;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Dải cam nhận diện cố định ở đáy */
    #brand-bar {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s37" data-width="1080" data-height="1920" data-duration="8.8">
    <!-- Lớp Video (bọc trong wrapper không có data-start để zoom/pan/transition) -->
    <div id="video-viewport">
      <div id="video-camera">
        <video id="vid-09"
               src="assets/vid-09-inmate-rehabilitation-transitional-ward.mp4"
               muted
               playsinline
               data-start="0"
               data-duration="8.8"
               data-media-start="0"></video>
      </div>
    </div>

    <!-- Lớp Timed Overlays của Shot S37-1 -->
    <section id="shot-1" class="clip" data-start="0" data-duration="8.8">
      <div id="overlay-1" class="overlay-card hf-plate-ink">
        <span class="overlay-text hf-text-light">CHUẨN BỊ 2 TUẦN</span>
      </div>

      <div id="overlay-2" class="overlay-card hf-plate-ink">
        <span class="overlay-text hf-text-light">CỬA KHÔNG KHÓA</span>
      </div>
    </section>

    <!-- Thanh thương hiệu đáy -->
    <div id="brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // TransitionIn: grow cho shot đầu scene
    tl.fromTo("#video-viewport",
      { scale: 0.88, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
      0
    );

    // CameraMotion: zoom-out chậm xuyên suốt toàn shot
    tl.fromTo("#video-camera",
      { scale: 1.16 },
      { scale: 1.02, duration: 8.8, ease: "power1.out" },
      0
    );

    // Overlay 1: "CHUẨN BỊ 2 TUẦN" (atMs: 295000 -> 0.76s, holdMs: 2800 -> 2.8s)
    tl.fromTo("#overlay-1",
      { scale: 0.82, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.76
    );
    tl.fromTo("#overlay-1",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" },
      3.56
    );

    // Overlay 2: "CỬA KHÔNG KHÓA" (atMs: 299000 -> 4.76s, holdMs: 3800 -> 3.8s)
    tl.fromTo("#overlay-2",
      { scale: 0.82, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      4.76
    );
    tl.fromTo("#overlay-2",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -16, duration: 0.22, ease: "power2.in" },
      8.56
    );

    window.__timelines["scene-s37"] = tl;
  </script>

    </template>
  </body>
</html>
