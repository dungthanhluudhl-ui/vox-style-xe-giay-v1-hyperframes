        "#s1-clock-icon",
        { scale: 0, opacity: 0 },

        0.42

      tl.fromTo(
        "#s1-minute-hand",
        { rotation: -20 },
        { rotation: 0, duration: 0.5, ease: "power2.out" },
        0.45
      );

      // 4. Nháy dấu 2 chấm đồng hồ điện tử
      tl.fromTo(
        "#s1-digi-colon",
        { opacity: 0.2 },
        { opacity: 1, duration: 0.35, yoyo: true, repeat: 3, ease: "steps(1)" },
        0.3
      );

      // 5. Đèn hành lang: Chớp điện 2 nhịp rồi bừng sáng vàng ngà
      tl.to("#lamp-1, #lamp-2, #lamp-3", { backgroundColor: "#FFF2BD", duration: 0.08 }, 0.95);

      tl.to("#lamp-1, #lamp-2, #lamp-3", { backgroundColor: "#FFF6D4", duration: 0.1 }, 1.2);

        "#s1-label-badge",
