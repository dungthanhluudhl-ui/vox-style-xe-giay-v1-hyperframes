<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      font-family: 'Be Vietnam Pro', sans-serif;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
    }
    .clip {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #bg-grid {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }
    #punch-rig {
      position: absolute;
      inset: 0;
      overflow: hidden;
      transform-origin: center center;
    }
    #pan-rig {
      position: absolute;
      top: 0;
      left: 0;
      width: 1180px;
      height: 1920px;
    }
    #vid-s25-1 {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s25" data-width="1080" data-height="1920" data-duration="9.33">
    <!-- Nền grid mặc định theo đặc tả style DNA -->
    <div id="bg-grid"></div>

    <!-- Wrapper không timed bọc media để thực hiện punch entrance và pan-right camera motion -->
    <div id="punch-rig" data-layout-allow-overflow="true">
      <div id="pan-rig" data-layout-allow-overflow="true">
        <video
          id="vid-s25-1"
          src="assets/vid-12-prison-guard-inmates-hallway.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="9.33"
          data-media-start="0"
        ></video>
      </div>
    </div>

    <!-- Layer overlay timed của shot-1 -->
    <section id="shot-1" class="clip" data-start="0" data-duration="9.33">
      <!-- Overlay timeline: mốc thời gian 06:35 SÁNG -->
      <div id="time-container" style="position: absolute; top: 280px; left: 0; right: 0; display: flex; justify-content: center;">
        <div id="time-card" class="hf-plate-ink" style="display: inline-flex; align-items: center; padding: 20px 42px; border-radius: 14px; border-left: 8px solid #FF6A1A; box-shadow: 0 16px 40px rgba(0,0,0,0.5); opacity: 0;">
          <span class="hf-text-light" style="font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; font-size: 56px; letter-spacing: 2px; line-height: 1;">06:35 SÁNG</span>
        </div>
      </div>

      <!-- Overlay label: cụm nhấn BẮT ĐẦU NGÀY MỚI -->
      <div id="label-container" style="position: absolute; top: 1180px; left: 0; right: 0; display: flex; justify-content: center;">
        <div id="label-card" class="hf-hl-orange" style="display: inline-flex; align-items: center; padding: 18px 40px; border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,0.5); opacity: 0;">
          <span class="hf-text-ink" style="font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; font-size: 46px; letter-spacing: 1.5px; line-height: 1;">BẮT ĐẦU NGÀY MỚI</span>
        </div>
      </div>
    </section>

    <!-- Thanh cam thương hiệu nhận diện đáy khung hình -->
    <div id="brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // TransitionIn: punch đập vào ở đầu cảnh
    tl.fromTo("#punch-rig",
      { scale: 1.14 },
      { scale: 1.0, duration: 0.55, ease: "power4.out" },
      0
    );

    // Camera motion: pan-right (nội dung lia sang trái, x âm dần)
    tl.fromTo("#pan-rig",
      { x: 0 },
      { x: -80, duration: 9.33, ease: "none" },
      0
    );

    // Overlay 1: 06:35 SÁNG (xuất hiện tại 0.59s, giữ hơn 3.5s rồi fade-out)
    tl.fromTo("#time-card",
      { scale: 0.8, opacity: 0, y: -20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.59
    );
    tl.fromTo("#time-card",
      { opacity: 1, scale: 1 },
      { opacity: 0, scale: 0.95, duration: 0.3, ease: "power2.in" },
      4.2
    );

    // Overlay 2: BẮT ĐẦU NGÀY MỚI (xuất hiện tại 6.59s, giữ hơn 2.6s đến gần cuối shot)
    tl.fromTo("#label-card",
      { scale: 0.85, opacity: 0, y: 20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      6.59
    );
    tl.fromTo("#label-card",
      { opacity: 1 },
      { opacity: 0, duration: 0.15, ease: "power2.in" },
      9.15
    );

    window.__timelines["scene-s25"] = tl;
  </script>

    </template>
  </body>
</html>
