<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    #stage {
      position: absolute;
      inset: 0;
      opacity: 0;
    }

    #photo-container {
      position: absolute;
      left: 60px;
      top: 180px;
      width: 960px;
      height: 1140px;
      overflow: hidden;
      border-radius: 14px;
      border: 3px solid rgba(20, 20, 20, 0.35);
      background-color: #141414;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.32);
    }

    #photo-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 1160px;
      height: 100%;
      will-change: transform;
    }

    #hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    #photo-dimmer {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 35%, transparent 25%, rgba(10, 10, 10, 0.5) 100%);
      pointer-events: none;
    }

    #soft-dim {
      position: absolute;
      inset: 0;
      background-color: #141414;
      opacity: 0;
      pointer-events: none;
    }

    .card-positioner {
      position: absolute;
      left: 60px;
      right: 60px;
      top: 1160px;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .card-plate {
      background-color: #141414;
      border: 4px solid #FF6A1A;
      border-radius: 10px;
      padding: 22px 42px;
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.55);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      will-change: transform, opacity;
      opacity: 0;
    }

    .card-plate-sub {
      border: 3px solid #FF6A1A;
      padding: 20px 38px;
    }

    .card-text {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 48px;
      line-height: 1.25;
      letter-spacing: 2px;
      color: #F7F4EC;
      text-align: center;
      white-space: nowrap;
    }

    #brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s15" data-width="1080" data-height="1920" data-duration="7">
    <section id="shot-1" class="clip" data-start="0" data-duration="7">
      <div id="stage">
        <div id="photo-container">
          <div id="photo-wrapper">
            <img id="hero-img" src="assets/img-06-prison-hallway-guard-inmates.jpg" alt="Quản giáo trại giam" />
          </div>
          <div id="photo-dimmer"></div>
          <div id="soft-dim"></div>
        </div>
      </div>
    </section>

    <!-- Overlay 1: document card (stamp slam) -->
    <div id="card-1" class="clip" data-start="0.76" data-duration="3.3" style="z-index: 20;">
      <div class="card-positioner">
        <div id="card-1-content" class="card-plate">
          <span class="card-text">ÂN HUỆ CUỐI CÙNG</span>
        </div>
      </div>
    </div>

    <!-- Overlay 2: label card (pop entrance) -->
    <div id="card-2" class="clip" data-start="4.26" data-duration="2.7" style="z-index: 20;">
      <div class="card-positioner">
        <div id="card-2-content" class="card-plate card-plate-sub">
          <span class="card-text">TRƯỚC GIỜ BIỆT LY</span>
        </div>
      </div>
    </div>

    <div id="brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Shot 1 entrance: rise
    tl.fromTo("#stage", 
      { y: 50, opacity: 0 }, 
      { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 
      0
    );

    // Camera motion: pan-left (wrapper x increases smoothly across shot)
    tl.fromTo("#photo-wrapper", 
      { x: -140 }, 
      { x: -20, duration: 7.0, ease: "none" }, 
      0
    );

    // Soft dimming across shot as indicated in assetTreatment
    tl.fromTo("#soft-dim", 
      { opacity: 0 }, 
      { opacity: 0.35, duration: 6.2, ease: "power1.out" }, 
      0.5
    );

    // Overlay 1: "ÂN HUỆ CUỐI CÙNG" (document stamp slam at 0.76s, holds 3000ms)
    tl.fromTo("#card-1-content", 
      { opacity: 0, scale: 1.4, rotation: -10 }, 
      { opacity: 1, scale: 1, rotation: -2.5, duration: 0.28, ease: "power4.out" }, 
      0.76
    );

    tl.fromTo("#card-1-content", 
      { opacity: 1, scale: 1, rotation: -2.5 }, 
      { opacity: 0, scale: 0.95, rotation: 0, duration: 0.22, ease: "power2.in" }, 
      3.76
    );

    // Overlay 2: "TRƯỚC GIỜ BIỆT LY" (label pop entrance at 4.26s, holds 2600ms)
    tl.fromTo("#card-2-content", 
      { opacity: 0, scale: 0.85, y: 18 }, 
      { opacity: 1, scale: 1, y: 0, duration: 0.36, ease: "power3.out" }, 
      4.26
    );

    tl.fromTo("#card-2-content", 
      { opacity: 1 }, 
      { opacity: 0, duration: 0.18, ease: "power2.in" }, 
      6.66
    );

    window.__timelines["scene-s15"] = tl;
  </script>

    </template>
  </body>
</html>
