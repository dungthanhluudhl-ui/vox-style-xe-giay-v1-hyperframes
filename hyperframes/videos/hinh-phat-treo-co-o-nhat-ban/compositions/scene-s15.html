      /* Zone 4: Overlays (Hiệu ứng có thời gian cụ thể) */

      #doc-badge {
        position: absolute;

      #doc-svg {

      #doc-svg path {

        stroke-linejoin: round;
      }
      .doc-badge-texts {
        display: flex;
        flex-direction: column;
        gap: 4px;

      .doc-badge-title {
        font-size: 22px;

        letter-spacing: 1px;
        line-height: 1.2;
      }
      .doc-badge-sub {
        font-size: 15px;
        font-weight: 700;
        color: #f7f4ec;
        opacity: 0.9;
        letter-spacing: 1px;
        line-height: 1.2;
      }

      /* Overlay 2: Con dấu phê duyệt "ÂN HUỆ CUỐI" (Punch Phrase) (xuất hiện 4.52s) */
      #stamp-badge {
        position: absolute;
        top: 540px;
        right: 84px;
        z-index: 30;
        opacity: 0;
        transform-origin: 50% 50%;
      }
      .stamp-box {

        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .stamp-line {
        height: 3px;
        background-color: #ff6a1a;
        width: 100%;
      }
      .stamp-text {
        font-size: 56px;
        font-weight: 900;
        line-height: 1.15;
        color: #f7f4ec;
        letter-spacing: 3px;
        margin: 12px 0;
        text-align: center;
        white-space: nowrap;
      }

      /* Thanh cam nhận diện thương hiệu cố định mép đáy */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s15"
      data-width="1080"
      data-height="1920"
      data-duration="7"
    >
      <div id="scene-content">
        <!-- Zone 1: Header hồ sơ pháp lý -->
        <div class="dossier-header">
          <div class="dossier-tag">
            <span class="dossier-tag-dot"></span>
            <span>TẬP HỒ SƠ TỬ TÙ</span>
          </div>
          <div class="dossier-meta">ĐIỀU 18 • QUY CHẾ</div>
        </div>

        <!-- Zone 2: Document card bao bọc cảnh quay -->
        <div id="document-card">
          <div class="card-header">
            <div class="card-title">MẪU 12-B: ĐƠN THỈNH NGUYỆN TRƯỚC THI HÀNH</div>
            <div class="card-status">ĐÃ PHÊ DUYỆT NGUYỆN VỌNG</div>
          </div>

          <div class="video-viewport">
            <div id="video-wrapper">
              <!-- Video vid-11: người đàn ông run rẩy quỳ viết thư, trim từ 0.5s đến 7.5s (duration 7s) -->
              <video
                id="vid-11"
                src="assets/vid-11-trembling-man-writing-confession.mp4"
                muted
                playsinline
                data-start="0"
                data-duration="7"
                data-media-start="0.5"
                data-track-index="0"
              ></video>
            </div>
          </div>

          <div class="card-footer">
            <div class="footer-sub">
              <div class="footer-row">TÌNH TRẠNG: TỰ TỔNG KẾT &amp; DI THƯ</div>

            </div>
            <div class="barcode-strip">||| | ||||| || |||</div>
          </div>
        </div>

        <!-- Zone 3: Thẻ suy ngẫm kết cảnh (vị trí y=1140-1265px, hoàn toàn trên vùng caption y >= 1574px) -->
        <div id="closing-card">
          <div class="closing-label">QUAN SÁT TƯ PHÁP</div>
          <div class="closing-text">
            Ranh giới giữa kỷ luật nhà tù và lòng trắc ẩn tối thiểu của con người.
          </div>
        </div>

        <!-- Zone 4 - Overlay 1: Biểu tượng Doc + Nhãn đơn thỉnh cầu (xuất hiện 1.26s, ẩn đi 3.06s) -->
        <div id="doc-badge">
          <svg id="doc-svg" viewBox="0 0 48 48">
            <path class="doc-path" d="M12 6 h16 l10 10 v26 H12 Z"></path>
            <path class="doc-path" d="M28 6 v10 h10"></path>
            <path class="doc-path" d="M18 24 h14"></path>
            <path class="doc-path" d="M18 31 h14"></path>
            <path class="doc-path" d="M18 38 h8"></path>
          </svg>

        <div id="stamp-badge">

      <!-- Thanh cam đặc trưng thương hiệu ở đáy khung hình -->

    <script>
      // Thiết lập stroke-dasharray cho SVG path để vẽ nét tự động
      document.querySelectorAll(".doc-path").forEach((p) => {
        const len = p.getTotalLength ? p.getTotalLength() : 100;
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
      });

      // Tạo timeline GSAP tất định, paused: true theo HyperFrames contract
      const tl = gsap.timeline({ paused: true });

      // 1. Transition-in (rise): Toàn bộ nội dung trượt lên từ t=0
      tl.fromTo(
        "#scene-content",
        { y: 60, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
        0,
      );

      // 2. Camera motion (zoom-in): Video zoom nhẹ trong suốt 7s
      tl.fromTo(
        "#video-wrapper",
        { scale: 1.0 },
        { scale: 1.06, duration: 7.0, ease: "none" },
        0,
      );

      // 3. Overlay 1 (icon doc + nhãn đơn thỉnh cầu):
      // Xuất hiện lúc 1.26s (118500ms - 117240ms), giữ 1.8s
      tl.fromTo(
        "#doc-badge",
        { scale: 0.85, opacity: 0, x: 24 },
        { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        1.26,
      );
      // Nét vẽ icon doc
      tl.to(
        ".doc-path",
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out", stagger: 0.08 },
        1.36,
      );
      // Rút lui trước khi các yếu tố tiếp theo xuất hiện
      tl.to(
        "#doc-badge",
        { opacity: 0, y: -14, duration: 0.35, ease: "power2.in" },
        3.06,
      );

      // 4. Zone 3: Thẻ suy ngẫm kết cảnh xuất hiện lúc 3.2s
      tl.fromTo(
        "#closing-card",
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        3.2,
      );

      // 5. Overlay 2 (Con dấu phê duyệt 'ÂN HUỆ CUỐI' - Punch Phrase):
      // Đóng dấu lúc 4.52s (121760ms - 117240ms), giữ 2.2s
      tl.fromTo(
        "#stamp-badge",
        { scale: 1.7, opacity: 0, rotation: 5 },
        { scale: 1.0, opacity: 1, rotation: -2, duration: 0.3, ease: "power4.out" },
        4.52,
      );
      // Phản lực rung nhẹ của thẻ tài liệu khi con dấu đóng cộp xuống
      tl.fromTo(
        "#document-card",
        { y: -4 },
        { y: 0, duration: 0.16, ease: "power2.out" },
        4.54,
      );
      // Fade mượt con dấu ở cuối phân cảnh (sau 2.2s giữ)
      tl.to(
        "#stamp-badge",
        { opacity: 0, duration: 0.26, ease: "power2.in" },
        6.72,
      );

      // Đăng ký timeline chính thức vào runtime HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s15"] = tl;
    </script>
