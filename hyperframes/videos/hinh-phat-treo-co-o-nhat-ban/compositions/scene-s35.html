<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    .clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* Background Variant: chart (4 horizontal lines at 20/40/60/80% + left orange tick marks) */
    .chart-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .chart-line {
      position: absolute;
      left: 0;
      width: 1080px;
      height: 2px;
      background-color: rgba(20, 20, 20, 0.28);
      transform-origin: left center;
    }

    .chart-line-1 { top: 384px; }  /* 20% */
    .chart-line-2 { top: 768px; }  /* 40% */
    .chart-line-3 { top: 1152px; } /* 60% */
    .chart-line-4 { top: 1536px; } /* 80% */

    .chart-tick {
      position: absolute;
      left: 0;
      width: 24px;
      height: 12px;
      background-color: #FF6A1A;
      transform: translateY(-5px);
    }

    /* Content Layout Container (Safe zone Y: 160 to 1390) */
    .content-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Card 1: Data Overlay (atMs: 281800 -> 0.56s relative) */
    #card-data {
      position: absolute;
      top: 450px;
      left: 80px;
      width: 920px;
      background-color: #141414;
      border-left: 16px solid #FF6A1A;
      border-radius: 8px;
      padding: 36px 44px;
      box-shadow: 0 16px 36px rgba(20, 20, 20, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }

    #text-data {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 60px;
      line-height: 1.25;
      letter-spacing: -0.5px;
      color: #F7F4EC;
      text-align: center;
      margin: 0;
    }

    /* Visual Split Graphic (50% proportion representation) */
    #split-graphic {
      position: absolute;
      top: 640px;
      left: 80px;
      width: 920px;
      height: 220px;
      background-color: #F5F0E4;
      border: 4px solid #141414;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 8px 8px 0px #141414;
      transform-origin: center center;
    }

    #split-bar-left {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background-color: #141414;
      transform-origin: left center;
    }

    #split-accent-strip {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 14px;
      background-color: #FF6A1A;
      z-index: 4;
      transform-origin: left center;
    }

    #split-divider {
      position: absolute;
      top: 0;
      left: calc(50% - 4px);
      width: 8px;
      height: 100%;
      background-color: #FF6A1A;
      z-index: 5;
      transform-origin: center center;
    }

    /* Card 2: Split Overlay (atMs: 284200 -> 2.96s relative) */
    #card-split {
      position: absolute;
      top: 920px;
      left: 80px;
      width: 920px;
      background-color: #FF6A1A;
      border: 4px solid #141414;
      border-radius: 8px;
      padding: 32px 40px;
      box-shadow: 8px 8px 0px #141414;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }

    #text-split {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 58px;
      line-height: 1.25;
      letter-spacing: -0.5px;
      color: #141414;
      text-align: center;
      margin: 0;
    }

    /* Fixed Brand Bottom Bar */
    .brand-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s35" data-width="1080" data-height="1920" data-duration="5.16">
    <section id="shot-1" class="clip" data-start="0" data-duration="5.16">
      <!-- Background Variant: Chart -->
      <div class="chart-bg">
        <div class="chart-line chart-line-1"><div class="chart-tick"></div></div>
        <div class="chart-line chart-line-2"><div class="chart-tick"></div></div>
        <div class="chart-line chart-line-3"><div class="chart-tick"></div></div>
        <div class="chart-line chart-line-4"><div class="chart-tick"></div></div>
      </div>

      <!-- Content Stage -->
      <div class="content-container">
        <!-- Overlay 1: Data (50% recidivism rate) -->
        <div id="card-data">
          <p id="text-data">TỶ LỆ TÁI PHẠM 50%</p>
        </div>

        <!-- Visual Proportion Graphic (50/50 split) -->
        <div id="split-graphic">
          <div id="split-bar-left"></div>
          <div id="split-accent-strip"></div>
          <div id="split-divider"></div>
        </div>

        <!-- Overlay 2: Split punch phrase -->
        <div id="card-split">
          <p id="text-split">1 TRONG 2 QUAY LẠI</p>
        </div>
      </div>

      <!-- Brand signature bottom bar -->
      <div class="brand-bottom-bar"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Transition In: "strike" - rapid high-impact entry for chart baseline and framework
    tl.fromTo(".chart-line",
      { scaleX: 0, opacity: 0 },
      { scaleX: 1, opacity: 1, duration: 0.35, ease: "power4.out", stagger: 0.05 },
      0.0
    );

    tl.fromTo("#split-graphic",
      { opacity: 0, scale: 0.92, y: -20 },
      { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "power4.out" },
      0.15
    );

    // Overlay 1: "TỶ LỆ TÁI PHẠM 50%" (atMs: 281800 -> 0.56s relative, holdMs: 2200)
    tl.fromTo("#card-data",
      { opacity: 0, y: -50, scale: 0.94 },
      { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
      0.56
    );

    // Split bar animation to 50% position
    tl.fromTo("#split-bar-left",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.65, ease: "power3.out" },
      0.56
    );

    tl.fromTo("#split-divider",
      { scaleY: 0, opacity: 0 },
      { scaleY: 1, opacity: 1, duration: 0.35, ease: "power2.out" },
      0.75
    );

    // Overlay 2: "1 TRONG 2 QUAY LẠI" (atMs: 284200 -> 2.96s relative, holdMs: 2000)
    tl.fromTo("#card-split",
      { opacity: 0, y: 40, scale: 0.94 },
      { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "power4.out" },
      2.96
    );

    tl.fromTo("#split-accent-strip",
      { opacity: 0, scaleX: 0 },
      { opacity: 1, scaleX: 1, duration: 0.35, ease: "power2.out" },
      2.96
    );

    // Register paused root timeline
    window.__timelines["scene-s35"] = tl;
  </script>

    </template>
  </body>
</html>
