    *, *::before, *::after {

       ========================================================================== */

      pointer-events: none;
      z-index: 1;

      background: rgba(20, 20, 20, 0.24);
      border-bottom: 1px dashed rgba(20, 20, 20, 0.16);
    }

    .chart-ruled-line::before {
      content: "";
      position: absolute;
      left: 0;
      top: -3px;
      width: 28px;
      height: 8px;
      background: #FF6A1A;
    }

    .chart-line-1 { top: 20%; }
    .chart-line-2 { top: 40%; }
    .chart-line-3 { top: 60%; }
    .chart-line-4 { top: 80%; }

    .grid-vertical {

  <!-- GSAP ANIMATION RUNTIME SCRIPT -->
  <script>
    // Initialize single paused timeline for seekable deterministic frame rendering
    const tl = gsap.timeline({ paused: true });

    // -------------------------------------------------------------
    // PHASE 1: ZOOM-THROUGH ENTRANCE & CAMERA PUSH (0.0s -> 5.4s)
    // Camera zooms dynamically into Saga, centering it in view
    // -------------------------------------------------------------
    tl.fromTo(
      "#map-camera",
      { scale: 0.82, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.6, ease: "power2.out" },
      0.0
    );

    // Continuous broadcast push toward Saga (transform-origin 540px 800px)
    tl.to(
      "#map-camera",
      {
        scale: 1.50,
        duration: 4.8,
        ease: "power1.out"
      },
      0.6
    );

    // Target reticle inner group scales & rotates around 0,0
    tl.fromTo(
      "#crosshair-spin",
      { rotation: 0, opacity: 0, scale: 0.4 },
      { rotation: 60, opacity: 1, scale: 1, duration: 0.7, ease: "power2.out" },
      0.5
    );

    // -------------------------------------------------------------
    // PHASE 2: OVERLAY 1 - LOCATION BADGE (atMs: 189890 -> t = 0.65s)
    // -------------------------------------------------------------
    tl.fromTo(
      "#location-badge",
      { y: -30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.65
    );

    // -------------------------------------------------------------
    // PHASE 3: PIN DROP & RADAR EXPANSION (atMs: 190380 -> t = 1.14s)
    // -------------------------------------------------------------
    tl.fromTo(
      "#pin-group",
      { y: -80, scale: 0, opacity: 0 },
      { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      1.14
    );

    // Expanding radar waves
    tl.fromTo(
      "#radar-ring-1",
      { attr: { r: 10 }, opacity: 0.95 },
      { attr: { r: 110 }, opacity: 0, duration: 1.1, ease: "power2.out" },
      1.35
    );

    tl.fromTo(
      "#radar-ring-2",
      { attr: { r: 10 }, opacity: 0.95 },
      { attr: { r: 150 }, opacity: 0, duration: 1.2, ease: "power2.out" },
      1.65
    );

    // Highlight polygon opacity pulse (seek-safe numeric tween)
    tl.fromTo(
      "#saga-highlight-poly",
      { opacity: 0.25 },
      { opacity: 0.75, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" },
      1.2
    );

    // -------------------------------------------------------------
    // PHASE 4: OVERLAY 2 - PUNCH-PHRASE & COUNTER (atMs: 191250 -> t = 2.01s)
    // -------------------------------------------------------------
    tl.fromTo(
      "#punch-card",
      { y: 40, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      2.01
    );

    // Deterministic seek-safe counter using GSAP innerText with snap
    tl.fromTo(
      "#counter-val",
      { innerText: 0 },
      { innerText: 320, snap: { innerText: 1 }, duration: 1.35, ease: "power2.out" },
      2.15
    );

    // Capacity meter fill via compositor-cheap scaleX
    tl.fromTo(
      "#meter-progress-bar",
      { scaleX: 0 },
      { scaleX: 1, duration: 1.35, ease: "power2.out" },
      2.15
    );

    // Security level alert subtle pulse (finishes at 3.6 + 0.4*2 = 4.4s, well within 6.0s)
    tl.fromTo(
      "#security-badge",
      { opacity: 0.75 },
      { opacity: 1, duration: 0.4, yoyo: true, repeat: 1, ease: "power1.inOut" },
      3.6
    );

    // Register paused timeline on window.__timelines with composition root id
    window.__timelines["scene-s24"] = tl;
  </script>
