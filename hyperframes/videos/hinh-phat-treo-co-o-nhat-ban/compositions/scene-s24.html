<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Background Variant: chart (4 horizontal ruled lines + left-edge orange tick marks) */
    .chart-bg {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      z-index: 0;
      pointer-events: none;
    }

    .chart-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background-color: rgba(20, 20, 20, 0.32);
    }

    .chart-tick {
      position: absolute;
      left: 0;
      width: 16px;
      height: 6px;
      margin-top: -2px;
      background-color: #FF6A1A;
    }

    /* Shot layout */
    .shot-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 10;
    }

    .camera-wrap {
      position: absolute;
      top: 0;
      left: -90px;
      width: 1260px;
      height: 1920px;
    }

    .media-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Overlay 1: Label badge */
    .badge-saga {
      position: absolute;
      top: 220px;
      left: 80px;
      width: auto;
      height: auto;
      display: inline-flex;
      align-items: center;
      padding: 16px 28px 16px 20px;
      background-color: #141414;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      z-index: 20;
    }

    .badge-accent {
      width: 6px;
      height: 32px;
      background-color: #FF6A1A;
      border-radius: 3px;
      margin-right: 16px;
      flex-shrink: 0;
    }

    .badge-text {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 32px;
      line-height: 1.2;
      letter-spacing: 0.04em;
      color: #F7F4EC;
      white-space: nowrap;
    }

    /* Overlay 2: Data counter badge */
    .badge-data {
      position: absolute;
      top: 340px;
      right: 80px;
      width: auto;
      height: auto;
      padding: 20px 32px;
      background-color: #141414;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      z-index: 20;
    }

    .data-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .data-num {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 64px;
      line-height: 1;
      color: #FF6A1A;
    }

    .data-label {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 32px;
      line-height: 1;
      color: #F7F4EC;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .data-bar-track {
      margin-top: 14px;
      width: 100%;
      height: 6px;
      background-color: rgba(247, 244, 236, 0.2);
      border-radius: 3px;
      overflow: hidden;
    }

    .data-bar-fill {
      width: 0%;
      height: 100%;
      background-color: #FF6A1A;
      border-radius: 3px;
    }

    /* Fixed brand signature bar */
    .brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
      pointer-events: none;
    }
  </style>

  <div id="root" data-composition-id="scene-s24" data-width="1080" data-height="1920" data-duration="5.67">
    <!-- Background variant: chart -->
    <div id="chart-bg" class="chart-bg" aria-hidden="true">
      <div class="chart-line" style="top: 20%;"></div>
      <div class="chart-line" style="top: 40%;"></div>
      <div class="chart-line" style="top: 60%;"></div>
      <div class="chart-line" style="top: 80%;"></div>
      <div class="chart-tick" style="top: 20%;"></div>
      <div class="chart-tick" style="top: 40%;"></div>
      <div class="chart-tick" style="top: 60%;"></div>
      <div class="chart-tick" style="top: 80%;"></div>
    </div>

    <!-- Shot 1 -->
    <section id="shot-1" class="clip" data-start="0" data-duration="5.67">
      <div id="shot-stage" class="shot-stage">
        <div id="camera-wrap" class="camera-wrap" data-layout-allow-overflow="true">
          <img id="media-img" class="clip media-img" src="assets/img-03-prison-morning-roll-call.jpg" alt="" data-start="0" data-duration="5.67">
        </div>
      </div>

      <!-- Overlay 1: NHÀ TÙ SAGA • KYUSHU -->
      <div id="badge-saga" class="hf-plate-ink badge-saga">
        <div class="badge-accent"></div>
        <span class="badge-text hf-text-light">NHÀ TÙ SAGA • KYUSHU</span>
      </div>

      <!-- Overlay 2: 320 PHẠM NHÂN -->
      <div id="badge-data" class="hf-plate-ink badge-data">
        <div class="data-row">
          <span id="count-num" class="data-num hf-plate-ink-orange">320</span>
          <span class="data-label hf-text-light"> PHẠM NHÂN</span>
        </div>
        <div class="data-bar-track">
          <div id="data-bar-fill" class="data-bar-fill"></div>
        </div>
      </div>
    </section>

    <!-- Brand signature bottom bar -->
    <div id="brand-bar" class="brand-bar" aria-hidden="true"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Shot 1 entrance: grow transition
    tl.fromTo(
      "#shot-stage",
      { scale: 0.88, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      0
    );

    // Camera motion: pan-left (viewport moves left -> content moves right: x increases)
    tl.fromTo(
      "#camera-wrap",
      { x: -60 },
      { x: 60, duration: 5.5, ease: "none" },
      0
    );

    // Overlay 1: label "NHÀ TÙ SAGA • KYUSHU" (atMs: 189500 -> 0.26s, holdMs: 2500)
    tl.fromTo(
      "#badge-saga",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      0.26
    );

    tl.fromTo(
      "#badge-saga",
      { opacity: 1 },
      { opacity: 0, duration: 0.22, ease: "power2.in" },
      2.76
    );

    // Overlay 2: data "320 PHẠM NHÂN" (atMs: 192200 -> 2.96s, holdMs: 2600)
    tl.fromTo(
      "#badge-data",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      2.96
    );

    tl.fromTo(
      "#count-num",
      { innerText: 0 },
      { innerText: 320, snap: { innerText: 1 }, duration: 1.1, ease: "power2.out" },
      2.96
    );

    tl.fromTo(
      "#data-bar-fill",
      { width: "0%" },
      { width: "100%", duration: 1.1, ease: "power2.out" },
      2.96
    );

    window.__timelines["scene-s24"] = tl;
  </script>

    </template>
  </body>
</html>
