<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #F5F0E4;
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .clip {
      position: absolute;
      inset: 0;
    }
  </style>

  <div id="root" data-composition-id="scene-s14" data-width="1080" data-height="1920" data-duration="7.34" style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background-color: #F5F0E4;">
    <section id="shot-1" class="clip" data-start="0" data-duration="7.34" style="perspective: 1200px;">
      <div id="stage" style="position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: center center;">
        
        <!-- Khung ảnh media img-08 -->
        <div id="media-card" style="position: absolute; left: 80px; top: 180px; width: 920px; height: 860px; overflow: hidden; border-radius: 20px; background-color: #141414; box-shadow: 0 20px 48px rgba(20, 20, 20, 0.16);">
          <div id="media-scaler" style="position: relative; width: 100%; height: 100%; transform-origin: center center;">
            <img id="main-img" class="clip" src="assets/img-08-man-writing-confession-note.jpg" data-start="0" data-duration="7.34" style="width: 100%; height: 100%; object-fit: cover; object-position: center 25%; display: block;" alt="">
          </div>
        </div>

        <!-- Khối thẻ chữ đổi trạng thái theo nhịp lời thoại -->
        <div id="card-wrapper" style="position: absolute; left: 80px; top: 1080px; width: 920px; height: 220px;">
          <div id="text-pane" class="hf-plate-ink" style="position: relative; width: 100%; height: 100%; background-color: #141414; border-radius: 20px; border-left: 12px solid #FF6A1A; box-shadow: 0 20px 48px rgba(20, 20, 20, 0.16); overflow: hidden;">
            <div style="display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr; width: 100%; height: 100%; align-items: center; justify-items: center;">
              
              <!-- Trạng thái 1: Split overlay -->
              <div id="state-split" style="grid-column: 1; grid-row: 1; position: relative; width: 100%; text-align: center; padding: 20px 40px; opacity: 0;">
                <span class="hf-text-light" style="display: inline-block; font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; font-size: 58px; line-height: 1.25; letter-spacing: -0.5px; color: #F7F4EC;">NGUYỆN VỌNG CUỐI CÙNG</span>
              </div>

              <!-- Trạng thái 2: Label overlay -->
              <div id="state-label" style="grid-column: 1; grid-row: 1; position: relative; width: 100%; text-align: center; padding: 20px 40px; opacity: 0;">
                <span class="hf-text-light" style="display: inline-block; font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; font-size: 52px; line-height: 1.25; letter-spacing: 0.5px; color: #F7F4EC;">THIỀN • THUỐC • THƯ</span>
              </div>

            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- Thanh cam đáy cố định nhận diện thương hiệu -->
    <div id="bottom-bar" style="position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background-color: #FF6A1A; z-index: 1000;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Transition In: flip entrance cho cả shot S14-1
    tl.fromTo("#stage", 
      { rotationY: -55, opacity: 0 }, 
      { rotationY: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 
      0
    );

    // Camera Motion: zoom-out chậm trên wrapper của ảnh
    tl.fromTo("#media-scaler", 
      { scale: 1.15 }, 
      { scale: 1.0, duration: 7.25, ease: "power1.out" }, 
      0
    );

    // Overlay 1: "NGUYỆN VỌNG CUỐI CÙNG" (at 0.6s, hold >= 3000ms đến 4.35s)
    tl.fromTo("#state-split", 
      { opacity: 0, scale: 0.9 }, 
      { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 
      0.6
    );
    tl.fromTo("#state-split", 
      { opacity: 1, scale: 1 }, 
      { opacity: 0, scale: 0.95, duration: 0.25, ease: "power2.in" }, 
      4.35
    );

    // Overlay 2: "THIỀN • THUỐC • THƯ" (at 4.6s, hold 2600ms đến 7.2s)
    tl.fromTo("#state-label", 
      { opacity: 0, scale: 0.92 }, 
      { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 
      4.6
    );
    tl.fromTo("#state-label", 
      { opacity: 1 }, 
      { opacity: 0, duration: 0.1, ease: "none" }, 
      7.2
    );

    window.__timelines["scene-s14"] = tl;
  </script>

    </template>
  </body>
</html>
