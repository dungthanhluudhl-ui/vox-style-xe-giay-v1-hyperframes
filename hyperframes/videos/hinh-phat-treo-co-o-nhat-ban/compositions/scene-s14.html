<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #E7E3D9;
      }
      .clip {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 180px 80px 420px 80px;
      }

      /* Clean readable static header hierarchy */
      .scene-header {
        margin-bottom: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .scene-title {
        font-size: 60px;
        font-weight: 900;
        color: #141414;
        letter-spacing: -1px;
        line-height: 1.15;
        text-transform: uppercase;
        margin: 0 0 12px 0;
      }
      .scene-subtitle {
        font-size: 24px;
        font-weight: 700;
        color: #141414;
        margin: 0;
        letter-spacing: 0.5px;
      }

      /* Simple 3-row CSS grid in normal document flow */
      .cards-grid {
        display: grid;
        grid-template-rows: repeat(3, 1fr);
        gap: 32px;
        width: 100%;
        flex: 1;
      }

      /* Paper card rows */
      .paper-card {
        background: #FAF7F0;
        border: 3px solid #141414;
        border-radius: 16px;
        box-shadow: 6px 6px 0px #141414;
        display: flex;
        align-items: center;
        padding: 0 48px;
        gap: 40px;
      }

      /* Card icon slot */
      .card-icon {
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        background: #EAE5D8;
        border: 2px solid #141414;
        border-radius: 12px;
      }

      /* Card ink label */
      .card-label {
        font-size: 46px;
        font-weight: 900;
        color: #141414;
        text-transform: uppercase;
        letter-spacing: -0.5px;
        line-height: 1.2;
      }

      /* CSS-only Shape 1: Thiền định */
      .shape-zen {
        width: 72px;
        height: 72px;
        border: 7px solid #141414;
        border-top-color: #FF6A1A;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .zen-core {
        width: 22px;
        height: 22px;
        background: #FF6A1A;
        border-radius: 50%;
      }

      /* CSS-only Shape 2: Điếu thuốc & khói */
      .shape-smoke {
        width: 84px;
        height: 84px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .smoke-waft {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      .smoke-line {
        width: 4px;
        height: 20px;
        background: #141414;
        border-radius: 2px;
        opacity: 0.35;
      }
      .smoke-line.alt {
        height: 28px;
        background: #FF6A1A;
        opacity: 0.85;
      }
      .cigarette-tube {
        width: 76px;
        height: 18px;
        border: 2px solid #141414;
        border-radius: 3px;
        display: flex;
        overflow: hidden;
        background: #FAF7F0;
      }
      .cig-tip {
        width: 8px;
        height: 100%;
        background: #FF6A1A;
      }
      .cig-shaft {
        flex: 1;
        background: #FAF7F0;
        border-right: 2px solid #141414;
      }
      .cig-filter {
        width: 22px;
        height: 100%;
        background: #E5A96A;
      }

      /* CSS-only Shape 3: Trang thư tay */
      .shape-letter {
        width: 58px;
        height: 74px;
        background: #FAF7F0;
        border: 2.5px solid #141414;
        border-radius: 4px;
        padding: 12px 8px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: 2px 2px 0px #141414;
      }
      .letter-line {
        height: 3.5px;
        background: #141414;
        border-radius: 2px;
        width: 100%;
      }
      .letter-line.accent {
        background: #FF6A1A;
        width: 80%;
      }
      .letter-line.short {
        width: 50%;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s14"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.34"
    >
      <!-- Single full-duration clip scene -->
      <div id="scene-stage" class="clip" data-start="0" data-duration="7.34">
        <!-- Static header hierarchy -->
        <header class="scene-header">
          <h1 class="scene-title">NGUYỆN VỌNG CUỐI</h1>
          <p class="scene-subtitle">3 điều tù nhân được phép yêu cầu</p>
        </header>

        <!-- Three-row CSS grid in normal document flow -->
        <div class="cards-grid">
          <!-- Card 1: Ngồi thiền -->
          <div id="card-1" class="paper-card">
            <div class="card-icon">
              <div class="shape-zen">
                <div class="zen-core"></div>
              </div>
            </div>
            <div class="card-label">01 • NGỒI THIỀN</div>
          </div>

          <!-- Card 2: Hút thuốc -->
          <div id="card-2" class="paper-card">
            <div class="card-icon">
              <div class="shape-smoke">
                <div class="smoke-waft">
                  <span class="smoke-line"></span>
                  <span class="smoke-line alt"></span>
                  <span class="smoke-line"></span>
                </div>
                <div class="cigarette-tube">
                  <span class="cig-tip"></span>
                  <span class="cig-shaft"></span>
                  <span class="cig-filter"></span>
                </div>
              </div>
            </div>
            <div class="card-label">02 • HÚT THUỐC</div>
          </div>

          <!-- Card 3: Viết thư -->
          <div id="card-3" class="paper-card">
            <div class="card-icon">
              <div class="shape-letter">
                <span class="letter-line"></span>
                <span class="letter-line accent"></span>
                <span class="letter-line short"></span>
              </div>
            </div>
            <div class="card-label">03 • VIẾT THƯ VỀ NHÀ</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Header entrance
      tl.fromTo(
        ".scene-header",
        { opacity: 0, y: -24 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.2
      );

      // 2. Card 1 entrance (01 • NGỒI THIỀN)
      tl.fromTo(
        "#card-1",
        { opacity: 0, y: 40 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },

      tl.fromTo(

      tl.fromTo(
        "#card-3",
        { opacity: 0, y: 40 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        5.0
      );

      window.__timelines["scene-s14"] = tl;
    </script>
  
    </template>
  </body>
</html>
