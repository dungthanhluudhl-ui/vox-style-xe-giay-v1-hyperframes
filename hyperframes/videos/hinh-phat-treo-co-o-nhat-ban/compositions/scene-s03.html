<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #141414;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #F5F0E4;
      overflow: hidden;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    #shot-1 {
      perspective: 1200px;
    }

    .stage {
      position: absolute;
      inset: 0;
      transform-origin: center center;
      transform-style: preserve-3d;
    }

    .photo-frame {
      position: absolute;
      top: 210px;
      left: 80px;
      width: 920px;
      height: 1100px;
      border: 4px solid #141414;
      box-shadow: 10px 14px 0px #141414;
      background-color: #141414;
      overflow: hidden;
    }

    .camera-wrap {
      width: 100%;
      height: 100%;
      transform-origin: center center;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
      display: block;
    }

    .stamp-pos {
      position: absolute;
      top: 250px;
      right: 110px;
      z-index: 20;
    }

    .stamp-plate {
      display: inline-block;
      background-color: #141414;
      border: 3px solid #FF6A1A;
      padding: 14px 24px;
      box-shadow: 6px 6px 0px #141414;
    }

    .stamp-text {
      display: block;
      color: #FF6A1A;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .label-pos {
      position: absolute;
      top: 1210px;
      left: 0;
      width: 1080px;
      display: flex;
      justify-content: center;
      z-index: 30;
      pointer-events: none;
    }

    .punch-label {
      display: inline-block;
      background-color: #141414;
      border-left: 10px solid #FF6A1A;
      padding: 16px 36px;
      box-shadow: 8px 10px 0px #141414;
    }

    .punch-text {
      display: block;
      color: #F7F4EC;
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s03" data-width="1080" data-height="1920" data-duration="6">
    <section id="shot-1" class="clip" data-start="0" data-duration="6">
      <div id="stage" class="stage">
        <div class="photo-frame">
          <div id="camera-wrap" class="camera-wrap">
            <img id="hero-img" class="hero-img" src="assets/img-01-death-row-inmate-prison-guard.jpg" alt="">
          </div>
        </div>

        <div id="stamp-pos" class="stamp-pos">
          <div id="stamp" class="stamp-plate hf-plate-ink-orange">
            <span class="stamp-text">KHÔNG THÔNG BÁO TRƯỚC</span>
          </div>
        </div>

        <div id="label-pos" class="label-pos">
          <div id="label-2" class="punch-label hf-plate-ink">
            <span class="punch-text">BẤT NGỜ TỘT CÙNG</span>
          </div>
        </div>
      </div>
    </section>

    <div class="brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo(
      "#stage",
      { rotationY: -55, opacity: 0 },
      { rotationY: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
      0
    );

    tl.fromTo(
      "#camera-wrap",
      { scale: 1.0 },
      { scale: 1.12, duration: 6.0, ease: "none" },
      0
    );

    tl.fromTo(
      "#stamp",
      { opacity: 0, scale: 1.4, rotation: -12 },
      { opacity: 1, scale: 1, rotation: -3, duration: 0.28, ease: "power4.out" },
      0.26
    );

    tl.to(
      "#stamp",
      { opacity: 0, scale: 0.95, duration: 0.25, ease: "power2.in" },
      2.96
    );

    tl.fromTo(
      "#label-2",
      { scale: 0.8, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      3.26
    );

    tl.to(
      "#label-2",
      { opacity: 0, duration: 0.12, ease: "power2.in" },
      5.86
    );

    window.__timelines["scene-s03"] = tl;
  </script>

    </template>
  </body>
</html>
