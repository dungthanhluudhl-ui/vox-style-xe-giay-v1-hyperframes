<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
        /* Vox Grid Pattern 84px */
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.14) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.14) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      /* Signature Bottom Orange Bar */
      .bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }
      /* Scene Container */
      #scene-container {
        position: absolute;
        inset: 0;
        will-change: transform, opacity;
      }
      /* Header Area */
      .header-zone {
        position: absolute;
        top: 175px;
        left: 60px;
        width: 960px;
        height: 115px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .badge-label {
        background-color: #141414;
        color: #F7F4EC;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 3px;
        padding: 8px 26px;
        border-radius: 999px;
        text-transform: uppercase;
        box-shadow: 0 4px 12px rgba(20, 20, 20, 0.15);
        will-change: transform, opacity;
      }
      .section-title {
        font-size: 38px;
        font-weight: 900;
        color: #141414;
        margin: 12px 0 0 0;
        text-transform: uppercase;
        letter-spacing: -0.5px;
      }
      /* Main Diagram Card */
      #diagram-card {
        position: absolute;
        top: 310px;
        left: 60px;
        width: 960px;
        height: 980px;
        background-color: #F5F0E4;
        border: 4px solid #141414;
        border-radius: 8px;
        box-shadow: 12px 12px 0px #141414;
        overflow: hidden;
      }
      .card-header-bar {
        height: 58px;
        background-color: #141414;
        color: #F7F4EC;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .card-header-tag {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        font-weight: 900;
        color: #FF6A1A;
      }
      .card-header-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: #FF6A1A;
      }
      /* SVG Canvas inside Diagram Card */
      .svg-diagram {
        width: 100%;
        height: 922px;
        display: block;
      }
      /* Punch Phrase Hero Card */
      #punch-card {
        position: absolute;
        top: 1320px;
        left: 60px;
        width: 960px;
        height: 160px;
        background-color: #FF6A1A;
        border: 4px solid #141414;
        border-radius: 8px;
        box-shadow: 10px 10px 0px #141414;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 16px 24px;
        will-change: transform, opacity;
      }
      .punch-sub {
        font-size: 22px;
        font-weight: 700;
        color: #141414;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .punch-main {
        font-size: 64px;
        font-weight: 900;
        color: #141414;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        line-height: 1.1;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s51"
      data-width="1080"
      data-height="1920"
      data-duration="5"
      data-start="0"
    >
      <section id="scene-s51" class="clip" data-start="0" data-duration="5">
        <div id="scene-container">
          <!-- Header Area -->
          <div class="header-zone">
            <div id="label-prison" class="badge-label">TRONG NHÀ TÙ</div>
            <h1 class="section-title">KHUNG GIÁM SÁT HÀNH VI</h1>
          </div>

          <!-- Main Diagram Card -->
          <div id="diagram-card">
            <div class="card-header-bar">
              <span>HÀNG RÀO QUY TẮC NGHIÊM NGẶT</span>
              <div class="card-header-tag">
                <span class="card-header-dot"></span>
                <span>GIÁM SÁT 24/7</span>
              </div>
            </div>

            <svg
              class="svg-diagram"
              viewBox="0 0 960 920"
              xmlns="http://www.w3.org/2000/svg"
            >
              <defs>
                <!-- Diagonal Hatch Pattern for Boundary Rails -->
                <pattern
                  id="hatchPattern"
                  width="18"
                  height="18"
                  patternTransform="rotate(45 0 0)"
                  patternUnits="userSpaceOnUse"
                >
                  <line x1="0" y1="0" x2="0" y2="18" stroke="#141414" stroke-width="3" />
                </pattern>
              </defs>

              <!-- Left Disciplinary Rail -->
              <g class="rail-left">
                <rect x="90" y="50" width="56" height="740" fill="url(#hatchPattern)" stroke="#141414" stroke-width="3" />
                <text x="118" y="820" fill="#141414" font-size="16" font-weight="900" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">RÀO CHẮN</text>
              </g>

              <!-- Right Disciplinary Rail -->
              <g class="rail-right">
                <rect x="814" y="50" width="56" height="740" fill="url(#hatchPattern)" stroke="#141414" stroke-width="3" />
                <text x="842" y="820" fill="#141414" font-size="16" font-weight="900" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">RÀO CHẮN</text>
              </g>

              <!-- Center Behavioral Axis -->
              <g id="center-axis-group">
                <line x1="480" y1="60" x2="480" y2="780" stroke="rgba(20,20,20,0.3)" stroke-width="3" stroke-dasharray="10 8" />
                <rect x="400" y="740" width="160" height="34" rx="6" fill="#141414" />
                <text x="480" y="763" fill="#F7F4EC" font-size="15" font-weight="900" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">TRỤC ĐÚNG ĐẮN</text>
              </g>

              <!-- Path 1: Normal straight progress -->
              <path
                id="path-normal"
                d="M 480 720 L 480 530"
                fill="none"
                stroke="#141414"
                stroke-width="10"
                stroke-linecap="round"
              />

              <!-- Path 2: Deviation curve towards danger / left rail -->
              <path
                id="path-deviate"
                d="M 480 530 C 480 440, 310 440, 260 360"
                fill="none"
                stroke="#FF6A1A"
                stroke-width="10"
                stroke-linecap="round"
              />

              <!-- Deviation Warning Node -->
              <g id="node-warning">
                <circle cx="260" cy="360" r="26" fill="#141414" stroke="#F5F0E4" stroke-width="3" />
                <text x="260" y="370" fill="#FF6A1A" font-size="28" font-weight="900" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">!</text>
                <rect x="175" y="396" width="170" height="38" rx="6" fill="#141414" />
                <text x="260" y="421" fill="#F7F4EC" font-size="16" font-weight="900" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">HÀNH VI LỆCH</text>
              </g>

              <!-- Correction Force: Cai Ngục Uốn Nắn / Clamp -->
              <g id="correction-force">
                <!-- Mechanical guide arrow pushing rightwards -->
                <path d="M 154 300 L 290 300 M 270 282 L 290 300 L 270 318" fill="none" stroke="#FF6A1A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
                <rect x="150" y="228" width="280" height="52" rx="8" fill="#FF6A1A" stroke="#141414" stroke-width="4" />
                <text x="290" y="261" fill="#141414" font-size="19" font-weight="900" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">CAI NGỤC CHẤN CHỈNH</text>
              </g>

              <!-- Path 3: Corrected path bending smoothly back to center -->
              <path
                id="path-corrected"
                d="M 260 360 C 370 330, 480 260, 480 180"
                fill="none"
                stroke="#141414"
                stroke-width="10"
                stroke-linecap="round"
              />

              <!-- Target Corrected Node -->
              <g id="node-target">
                <circle cx="480" cy="180" r="38" fill="#FF6A1A" stroke="#141414" stroke-width="5" />
                <!-- Self-drawing checkmark icon -->
                <path
                  id="icon-check-path"
                  d="M 462 180 L 476 195 L 500 165"
                  fill="none"
                  stroke="#141414"
                  stroke-width="7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </g>

              <!-- Target status pill -->
              <g id="target-badge">
                <rect x="365" y="85" width="230" height="42" rx="6" fill="#141414" />
                <text x="480" y="112" fill="#F7F4EC" font-size="16" font-weight="900" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">VỀ ĐÚNG QUY ĐẠO</text>
              </g>
            </svg>
          </div>

          <!-- Hero Punch Phrase Card -->
          <div id="punch-card">
            <div class="punch-sub">CƠ CHẾ PHẢN HỒI TỨC THÌ</div>
            <div class="punch-main">UỐN NẮN KỊP THỜI</div>
          </div>
        </div>
      </section>

      <!-- Signature Orange Bar at Bottom -->
      <div class="bottom-bar"></div>
    </div>

    <!-- Animation Script -->
    <script>
      // Prepare SVG path draw setup deterministically
      const animatedPathIds = ["path-normal", "path-deviate", "path-corrected", "icon-check-path"];
      animatedPathIds.forEach(function (id) {
        const el = document.getElementById(id);
        if (el) {
          const len = Math.ceil(el.getTotalLength());
          el.style.strokeDasharray = len + " " + len;
          el.style.strokeDashoffset = len;
        }
      });

      // Construct Single Paused GSAP Timeline
      const tl = gsap.timeline({ paused: true });

      // Phase 1: Scene Entrance (0.0s - 0.7s) - Transition "rise"
      tl.fromTo(
        "#scene-container",
        { y: 80, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0
      );

      // Rails reveal from bottom to top (0.3s - 0.85s)
      tl.fromTo(
        [".rail-left", ".rail-right"],
        { scaleY: 0, transformOrigin: "bottom center" },
        { scaleY: 1, duration: 0.55, ease: "power2.out", stagger: 0.1 },
        0.3
      );

      // Center guide axis line fades in (0.5s - 0.9s)
      tl.fromTo(
        "#center-axis-group",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        0.5
      );

      // Initial straight path draws (0.9s - 1.5s)
      tl.to(
        "#path-normal",
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        0.9
      );

      // Phase 2: Label "TRONG NHÀ TÙ" appears (Shotlist atMs 402970 -> 1.73s)
      tl.fromTo(
        "#label-prison",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.73
      );

      // Phase 3: Deviation path curves left toward boundary (1.8s - 2.5s)
      tl.to(
        "#path-deviate",
        { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
        1.8
      );

      // Warning node appears at deviation point (2.4s - 2.8s)
      tl.fromTo(
        "#node-warning",
        { scale: 0, opacity: 0, transformOrigin: "260px 360px" },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        2.4
      );

      // Phase 4: Correction Force - Cai Ngục Chấn Chỉnh punches in (2.85s - 3.3s)
      tl.fromTo(
        "#correction-force",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power4.out" },
        2.85
      );

      // Corrected path bends back to center (3.1s - 3.65s)
      tl.to(
        "#path-corrected",
        { strokeDashoffset: 0, duration: 0.55, ease: "power3.out" },
        3.1
      );

      // Phase 5: Icon checkmark and target node reveal (Shotlist atMs 404850 -> 3.61s)
      tl.fromTo(
        "#node-target",
        { scale: 0, opacity: 0, transformOrigin: "480px 180px" },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        3.5
      );
      tl.to(
        "#icon-check-path",
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        3.61
      );
      tl.fromTo(
        "#target-badge",
        { opacity: 0, y: 15 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
        3.75
      );

      // Phase 6: Hero Punch Phrase "UỐN NẮN KỊP THỜI" punches in (Shotlist atMs 405450 -> 4.21s)
      tl.fromTo(
        "#punch-card",
        { y: 40, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        4.15
      );

      // Register master timeline
      window.__timelines["scene-s51"] = tl;
    </script>
  
    </template>
  </body>
</html>
