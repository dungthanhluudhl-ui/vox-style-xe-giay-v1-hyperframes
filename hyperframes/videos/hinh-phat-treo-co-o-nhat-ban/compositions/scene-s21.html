<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #E7E3D9;
      overflow: hidden;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Media stage and camera rigs */
    #media-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #stage-punch {
      position: absolute;
      inset: 0;
      transform-origin: 50% 45%;
    }

    #camera-rig {
      position: absolute;
      top: 0;
      left: -80px;
      width: 1240px;
      height: 1920px;
      transform-origin: 50% 50%;
    }

    #prison-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }

    /* Spotlight variant vignette overlay */
    .spotlight-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      background: radial-gradient(circle at 50% 40%, rgba(20, 20, 20, 0.15) 0%, rgba(20, 20, 20, 0.65) 75%, rgba(15, 15, 15, 0.92) 100%);
    }

    /* Dark veil rising per assetTreatment */
    #dark-veil {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background: linear-gradient(180deg, rgba(20, 20, 20, 0.25) 0%, rgba(20, 20, 20, 0.72) 42%, rgba(20, 20, 20, 0.96) 95%);
      opacity: 0;
    }

    /* Text overlays */
    .overlay-pane {
      position: absolute;
      pointer-events: none;
    }

    #overlay-annotated {
      top: 340px;
      left: 70px;
      z-index: 10;
      opacity: 0;
    }

    .annotated-badge {
      display: inline-block;
      background-color: #FF6A1A;
      color: #141414;
      font-weight: 900;
      font-size: 44px;
      line-height: 1.2;
      letter-spacing: 0.5px;
      padding: 18px 28px;
      border-radius: 4px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      text-transform: uppercase;
    }

    #overlay-punch {
      top: 760px;
      left: 70px;
      right: 70px;
      z-index: 20;
      opacity: 0;
    }

    .punch-card {
      display: inline-block;
      width: 100%;
      background-color: #141414;
      color: #F7F4EC;
      font-weight: 900;
      font-size: 58px;
      line-height: 1.25;
      letter-spacing: -0.5px;
      padding: 32px 36px;
      border-left: 14px solid #FF6A1A;
      border-radius: 4px;
      box-shadow: 0 24px 54px rgba(0, 0, 0, 0.65);
      text-transform: uppercase;
    }

    /* Brand visual signature: fixed bottom orange bar */
    #brand-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s21" data-width="1080" data-height="1920" data-duration="7.01">
    <section id="shot-1" class="clip" data-start="0" data-duration="7.01">
      <div id="media-viewport">
        <div id="stage-punch">
          <div id="camera-rig">
            <img
              id="prison-img"
              class="clip"
              data-start="0"
              data-duration="7.01"
              src="assets/img-06-prison-hallway-guard-inmates.jpg"
              alt=""
            />
          </div>
        </div>
      </div>

      <div class="spotlight-vignette"></div>
      <div id="dark-veil"></div>

      <div id="overlay-annotated" class="overlay-pane">
        <div class="annotated-badge hf-hl-orange">
          <span>KHÔNG MẤY SUÔN SẺ</span>
        </div>
      </div>

      <div id="overlay-punch" class="overlay-pane">
        <div class="punch-card hf-plate-ink">
          <span>MẤT MẠNG KHI CẢI TẠO</span>
        </div>
      </div>
    </section>

    <div id="brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Shot 1 punch entrance transition (0s - 0.45s)
    tl.fromTo("#stage-punch",
      { scale: 1.18, opacity: 0 },
      { scale: 1.05, opacity: 1, duration: 0.45, ease: "power4.out" },
      0
    );

    // Camera pan-right: viewport pan right means image shifts left (x decreases)
    tl.fromTo("#camera-rig",
      { x: 30 },
      { x: -130, duration: 7.0, ease: "power1.out" },
      0
    );

    // Overlay 1 (annotated): "KHÔNG MẤY SUÔN SẺ" at 0.55s (164500ms), hold for 3000ms
    tl.fromTo("#overlay-annotated",
      { scale: 0.85, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.55
    );
    tl.fromTo("#overlay-annotated",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -16, duration: 0.3, ease: "power2.in" },
      3.55
    );

    // Dark veil rises along with the analysis of harsh prison reality (3.6s - 4.4s)
    tl.fromTo("#dark-veil",
      { opacity: 0 },
      { opacity: 0.82, duration: 0.75, ease: "power2.out" },
      3.6
    );

    // Overlay 2 (punch-phrase): "MẤT MẠNG KHI CẢI TẠO" at 4.05s (168000ms), hold until end of shot
    tl.fromTo("#overlay-punch",
      { scale: 0.82, opacity: 0, y: 32 },
      { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
      4.05
    );

    window.__timelines["scene-s21"] = tl;
  </script>

    </template>
  </body>
</html>
