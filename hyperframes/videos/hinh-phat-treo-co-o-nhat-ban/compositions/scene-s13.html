<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    .clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* Nền lưới Vox kinh điển 84px */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      pointer-events: none;
      z-index: 1;
    }

    /* Thanh cam đáy cố định nhận diện thương hiệu Vox */
    .bottom-orange-bar {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1080px;
      height: 14px;
      background: #FF6A1A;
      z-index: 100;
    }

    /* Wrapper 1: Nhãn mực báo động hoảng loạn (Y: 180px - 314px) */
    #label-panic {
      position: absolute;
      top: 180px;
      left: 80px;
      width: 920px;
      background: #141414;
      border-radius: 8px;
      padding: 24px 36px;
      box-shadow: 10px 10px 0 rgba(20, 20, 20, 0.2);
      z-index: 10;
    }

    /* Wrapper 2: Khung ảnh cắt giấy trung tâm (Y: 360px - 1140px) */
    #hero-card {
      position: absolute;
      top: 360px;
      left: 160px;
      width: 760px;
      height: 780px;
      background: #141414;
      border: 4px solid #141414;
      box-shadow: 14px 14px 0 rgba(20, 20, 20, 0.25);
      border-radius: 4px;
      overflow: hidden;
      z-index: 10;
    }

    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
      display: block;
    }

    /* Wrapper 3: Nhãn mực cưỡng chế với điểm nhấn cam duy nhất (Y: 1190px - 1337px) */
    #label-restraint {
      position: absolute;
      top: 1190px;
      left: 80px;
      width: 920px;
      background: #141414;
      border-left: 12px solid #FF6A1A;
      border-radius: 8px;
      padding: 26px 36px;
      box-shadow: 10px 10px 0 rgba(20, 20, 20, 0.2);
      z-index: 10;
    }

    /* Kiểu chữ độ tương phản cao: chữ giấy ngà trên nền mực đen (>= 14:1) */
    .label-kicker {
      font-size: 18px;
      font-weight: 700;
      color: #E7E3D9;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .panic-title {
      font-size: 44px;
      font-weight: 900;
      color: #F7F4EC;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .restraint-title {
      font-size: 52px;
      font-weight: 900;
      color: #F7F4EC;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      line-height: 1.2;
    }
  </style>

  <div id="root" data-composition-id="scene-s13" data-width="1080" data-height="1920" data-duration="7.66">
    <div class="bg-grid"></div>
    <div class="bottom-orange-bar"></div>

    <section id="scene-s13" class="clip" data-start="0" data-duration="7.66" data-track-index="0">
      <!-- Wrapper 1: Nhãn mực biểu đạt trạng thái hoảng loạn -->
      <div id="label-panic">
        <div class="label-kicker">TRẠNG THÁI TÂM LÝ</div>
        <div class="panic-title">HOẢNG LOẠN TỘT CÙNG</div>
      </div>

      <!-- Wrapper 2: Khung hình trung tâm tử tù và cai ngục -->
      <div id="hero-card">
        <img src="assets/img-01-death-row-inmate-prison-guard.jpg" alt="Tử tù và cai ngục" class="hero-image">
      </div>

      <!-- Wrapper 3: Nhãn mực cưỡng chế chấm dứt chống đối cùng điểm nhấn viền cam -->
      <div id="label-restraint">
        <div class="label-kicker">BIỆN PHÁP AN NINH</div>
        <div class="restraint-title">CƯỠNG CHẾ ÁP TẢI</div>
      </div>
    </section>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Entrance 1: Khung hình trung tâm xuất hiện vững chãi (0.2s -> 0.7s)
    tl.fromTo(
      "#hero-card",
      { opacity: 0, y: 30 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      0.2
    );

    // Entrance 2: Nhãn hoảng loạn xuất hiện (1.3s -> 1.8s)
    tl.fromTo(
      "#label-panic",
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      1.3
    );

    // Entrance 3: Nhãn cưỡng chế áp tải kết thúc sự chống đối (5.5s -> 6.0s)
    tl.fromTo(
      "#label-restraint",
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      5.5
    );

    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s13"] = tl;
  </script>

    </template>
  </body>
</html>
