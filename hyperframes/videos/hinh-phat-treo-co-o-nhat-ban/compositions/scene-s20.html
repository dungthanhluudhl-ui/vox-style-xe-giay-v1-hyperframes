<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #141414;
      overflow: hidden;
      margin: 0;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }
    .clip {
      position: absolute;
      inset: 0;
    }
    .video-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .video-camera {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
    }
    #vid-15 {
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      display: block;
    }
    .ui-overlay-layer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 250px;
      pointer-events: none;
      z-index: 10;
    }
    .cards-stage {
      position: relative;
      width: 1000px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .overlay-card {
      position: absolute;
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      white-space: nowrap;
      opacity: 0;
    }
    #overlay-1 {
      font-size: 58px;
      padding: 18px 44px;
    }
    #overlay-2 {
      font-size: 46px;
      padding: 18px 40px;
    }
    #overlay-3 {
      font-size: 58px;
      padding: 18px 44px;
    }
    .bottom-brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s20" data-width="1080" data-height="1920" data-duration="10.71">
    <!-- Video container (không mang data-start để tránh lỗi video_nested_in_timed_element) -->
    <div id="video-wrapper" class="video-viewport">
      <div id="video-scaler" class="video-camera">
        <video id="vid-15"
               src="assets/vid-15-prisoner-release-day-gate.mp4"
               muted
               playsinline
               data-start="0"
               data-duration="10.71"
               data-media-start="0"></video>
      </div>
    </div>

    <!-- UI Overlay Layer bọc các punch phrases trong safe zone y160-1390 -->
    <section id="shot-1-ui" class="clip ui-overlay-layer" data-start="0" data-duration="10.71">
      <div class="cards-stage">
        <div id="overlay-1" class="hf-plate-ink overlay-card">0 ÁN TỬ HÌNH</div>
        <div id="overlay-2" class="hf-plate-ink overlay-card">VÀI NĂM → VÀI THẬP KỶ</div>
        <div id="overlay-3" class="hf-hl-orange overlay-card">MÃN HẠN TỰ DO</div>
      </div>
    </section>

    <!-- Thanh cam đáy nhận diện thương hiệu cố định -->
    <div class="bottom-brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. TransitionIn "rise" cho toàn bộ video wrapper vào đầu scene
    tl.fromTo("#video-wrapper",
      { y: 70, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0
    );

    // 2. CameraMotion "zoom-in" chậm đều xuyên suốt shot
    tl.fromTo("#video-scaler",
      { scale: 1.0 },
      { scale: 1.12, duration: 10.71, ease: "none" },
      0
    );

    // 3. Beat 1: Overlay data "0 ÁN TỬ HÌNH" (atMs: 154000 = 0.76s, holdMs: 2500)
    tl.fromTo("#overlay-1",
      { opacity: 0, scale: 0.8, y: 35 },
      { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.76
    );
    tl.fromTo("#overlay-1",
      { opacity: 1, scale: 1, y: 0 },
      { opacity: 0, scale: 0.95, y: -15, duration: 0.25, ease: "power2.in" },
      3.35
    );

    // 4. Beat 2: Overlay timeline "VÀI NĂM → VÀI THẬP KỶ" (atMs: 157000 = 3.76s, holdMs: 3000)
    tl.fromTo("#overlay-2",
      { opacity: 0, scale: 0.8, y: 35 },
      { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" },
      3.76
    );
    tl.fromTo("#overlay-2",
      { opacity: 1, scale: 1, y: 0 },
      { opacity: 0, scale: 0.95, y: -15, duration: 0.25, ease: "power2.in" },
      6.85
    );

    // 5. Beat 3: Overlay label "MÃN HẠN TỰ DO" (atMs: 160500 = 7.26s, holdMs: 3300)
    tl.fromTo("#overlay-3",
      { opacity: 0, scale: 0.8, y: 35 },
      { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" },
      7.26
    );
    tl.fromTo("#overlay-3",
      { opacity: 1 },
      { opacity: 0, duration: 0.12, ease: "power2.in" },
      10.56
    );

    // Đăng ký timeline paused vào HyperFrames runtime
    window.__timelines["scene-s20"] = tl;
  </script>

    </template>
  </body>
</html>
