    <script>
      const checkPath = document.getElementById("check-path");
      if (checkPath) {
        const len = checkPath.getTotalLength();
        checkPath.style.strokeDasharray = `${len}`;
        checkPath.style.strokeDashoffset = `${len}`;
      }

      const tl = gsap.timeline({ paused: true });

      // 1. Entrance Grow Animation (Transition In)
      tl.fromTo(
        "#scene-container",
        { scale: 0.94, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.8, ease: "power3.out" },
        0.05
      );

      // 2. Song sắt trại giam vươn lên
      tl.fromTo(
        "#jail-bars-group",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.35
      );

      // 3. Trục thời gian cam vươn dài từ trái sang phải
      tl.fromTo(
        "#timeline-rail-fill",
        { scaleX: 0 },
        { scaleX: 1, duration: 3.3, ease: "power2.inOut" },
        0.65
      );

      // 4. Các mốc thời gian lần lượt xuất hiện
      tl.fromTo(
        "#node-1",
        { scale: 0, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.95
      );

      tl.fromTo(
        "#node-2",
        { scale: 0, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.55
      );

      // 5. Overlay 1: Label ÁN TÙ CÓ THỜI HẠN (atMs: 158470 -> 1.92s)
      tl.fromTo(
        "#label-timed-sentence",
        { y: -30, opacity: 0, scale: 0.92 },
        { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        1.92
      );

      tl.fromTo(
        "#node-3",
        { scale: 0, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        2.35
      );

      // 6. Camera Motion: Pan nhẹ sang phải hướng về cánh cổng tự do
      tl.to(
        "#world",
        { x: -140, duration: 4.8, ease: "sine.inOut" },
        2.0
      );

      tl.fromTo(
        "#node-4",
        { scale: 0, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        3.15
      );

      // 7. Cánh cổng tự do mở hé và tỏa sáng ở cuối trục
      tl.fromTo(
        "#freedom-gate-group",
        { opacity: 0, scale: 0.88 },
        { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" },
        3.55
      );
      tl.fromTo(
        "#gate-door",
        { scaleX: 1 },
        { scaleX: 0.55, duration: 0.8, ease: "power2.out" },
        3.8
      );
      tl.fromTo(
        "#light-beam-glow",
        { opacity: 0, scaleX: 0.3 },
        { opacity: 1, scaleX: 1, duration: 0.9, ease: "power2.out" },
        3.9
      );
      tl.fromTo(
        "#gate-badge-label",
        { y: -16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        4.15
      );

      // 8. Overlay 2: Punch Phrase CƠ HỘI HOÀN LƯƠNG (atMs: 161260 -> 4.71s)
      tl.fromTo(
        "#punch-phrase-container",
        { y: 40, opacity: 0, scale: 0.92 },
        { y: 0, opacity: 1, scale: 1, duration: 0.65, ease: "power3.out" },
        4.71
      );

      // 9. Overlay 3: Icon Check (atMs: 163450 -> 6.90s)
      tl.fromTo(
        "#icon-check-badge",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        6.90
      );
      tl.to(
        "#check-path",
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        7.05
      );

      window.__timelines["scene-s20"] = tl;
