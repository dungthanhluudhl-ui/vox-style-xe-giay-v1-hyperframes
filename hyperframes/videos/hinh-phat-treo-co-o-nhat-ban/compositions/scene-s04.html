<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #141414;
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #E7E3D9;
      overflow: hidden;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Video stage and camera motion rig (untimed wrapper) */
    #stage-wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    #grow-stage {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
    }

    #video-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1080px;
      height: 1920px;
      margin-top: -960px;
      margin-left: -540px;
      transform-origin: 50% 50%;
    }

    #vid-12 {
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      display: block;
    }

    /* Spotlight backgroundVariant: dark radial vignette */
    #spotlight-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(20, 20, 20, 0) 30%, rgba(20, 20, 20, 0.45) 75%, rgba(20, 20, 20, 0.78) 100%);
      pointer-events: none;
      z-index: 3;
    }

    /* Overlay container anchored in lower content band (above subtitle safe zone) */
    .overlay-container {
      position: absolute;
      left: 0;
      right: 0;
      top: 1160px;
      height: 140px;
      pointer-events: none;
      z-index: 10;
    }

    .overlay-box {
      position: absolute;
      left: 0;
      right: 0;
      margin: 0 auto;
      width: fit-content;
      max-width: 920px;
      padding: 20px 40px;
      background-color: #141414;
      color: #F7F4EC;
      font-weight: 900;
      font-size: 46px;
      line-height: 1.25;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-left: 8px solid #FF6A1A;
      border-radius: 4px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65);
      opacity: 0;
    }

    /* Signature bottom brand bar */
    #bottom-bar {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 50;
    }
  </style>

  <div id="root" data-composition-id="scene-s04" data-width="1080" data-height="1920" data-duration="8">
    <!-- Media background stage with untimed wrappers for transitionIn and cameraMotion -->
    <div id="stage-wrapper">
      <div id="grow-stage">
        <div id="video-wrapper">
          <video
            id="vid-12"
            src="assets/vid-12-prison-guard-inmates-hallway.mp4"
            muted
            playsinline
            data-start="0"
            data-duration="8"
            data-media-start="0"
          ></video>
        </div>
      </div>
    </div>

    <!-- Spotlight vignette for consequence/hallway atmosphere -->
    <div id="spotlight-vignette"></div>

    <!-- Timed overlays layer -->
    <section id="shot-1" class="clip" data-start="0" data-duration="8">
      <div class="overlay-container">
        <div id="overlay-1" class="overlay-box hf-plate-ink" data-layout-allow-overlap="true" data-layout-allow-occlusion="true">
          LẮNG NGHE BƯỚC CHÂN
        </div>
        <div id="overlay-2" class="overlay-box hf-plate-ink" data-layout-allow-overlap="true" data-layout-allow-occlusion="true">
          DẤU HIỆU ÁN TỬ
        </div>
      </div>
    </section>

    <!-- Constant bottom brand accent -->
    <div id="bottom-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // TransitionIn: grow (scale settles from 0.92 to 1 in 0.5s)
    tl.fromTo(
      "#grow-stage",
      { scale: 0.92, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      0
    );

    // CameraMotion: pan-left (viewport pans left => content pans right => x increases from -50 to +50; dolly scale drift)
    tl.fromTo(
      "#video-wrapper",
      { x: -50, scale: 1.12 },
      { x: 50, scale: 1.16, duration: 8.0, ease: "none" },
      0
    );

    // Overlay 1: "LẮNG NGHE BƯỚC CHÂN" (atMs: 22500 -> 0.26s, holdMs: 3500)
    tl.fromTo(
      "#overlay-1",
      { opacity: 0, scale: 0.9, y: 30 },
      { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.26
    );
    tl.fromTo(
      "#overlay-1",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" },
      3.76
    );

    // Overlay 2: "DẤU HIỆU ÁN TỬ" (atMs: 26500 -> 4.26s, holdMs: 3500)
    tl.fromTo(
      "#overlay-2",
      { opacity: 0, scale: 0.9, y: 30 },
      { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" },
      4.26
    );
    tl.fromTo(
      "#overlay-2",
      { opacity: 1, scale: 1, y: 0 },
      { opacity: 0, scale: 0.96, y: -20, duration: 0.2, ease: "power2.in" },
      7.76
    );

    window.__timelines["scene-s04"] = tl;
  </script>

    </template>
  </body>
</html>
