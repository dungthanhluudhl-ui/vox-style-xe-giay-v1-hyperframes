    <!-- GSAP Animation Timeline Script -->
    <script>
      // 1. Đo đạc các path SVG trước khi tween
      const scribblePath = document.getElementById("jagged-scribble");
      const scribbleLen = scribblePath.getTotalLength();
      scribblePath.style.strokeDasharray = scribbleLen;
      scribblePath.style.strokeDashoffset = scribbleLen;

      const docOutline = document.getElementById("doc-outline-path");
      const docOutlineLen = docOutline.getTotalLength();
      docOutline.style.strokeDasharray = docOutlineLen;
      docOutline.style.strokeDashoffset = docOutlineLen;

      const docFold = document.getElementById("doc-fold-path");
      const docFoldLen = docFold.getTotalLength();
      docFold.style.strokeDasharray = docFoldLen;
      docFold.style.strokeDashoffset = docFoldLen;

      // 2. Khởi tạo timeline paused bắt buộc theo contract
      const tl = gsap.timeline({ paused: true });

      // Đặt trạng thái ban đầu tường minh
      gsap.set("#pen-nib", { opacity: 0, x: 80, y: 300, rotation: 0 });
      gsap.set("#ink-spill", { opacity: 0, scale: 0 });
      gsap.set("#overlay-tremor", { opacity: 0, scale: 0.85, y: 15 });
      gsap.set("#overlay-doc", { opacity: 0, scale: 0.9, y: 15 });
      gsap.set("#overlay-unfinished", { opacity: 0, scale: 0.85, y: 20 });

      // --- PHASE 1: t = 0.0s -> 0.85s: Wobble-Drop Entrance ---
      tl.fromTo(
        "#document-card",
        { y: -110, rotation: -3.5, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
        0.05
      );

      // Rung nhẹ khi chạm đất (wobble)
      tl.to("#document-card", { rotation: 1.2, duration: 0.12, ease: "power1.inOut" }, 0.65);
      tl.to("#document-card", { rotation: 0, duration: 0.18, ease: "power1.out" }, 0.77);

      tl.fromTo(
        "#scene-header",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" },
        0.15
      );

      // Các dòng chữ bức thư xuất hiện
      tl.fromTo(
        ["#text-line-1", "#text-line-2"],
        { opacity: 0, x: -20 },
        { opacity: 1, x: 0, duration: 0.45, stagger: 0.15, ease: "power2.out" },
        0.4
      );

      // --- PHASE 2: t = 0.9s -> 2.5s: Bút run rẩy & Nét cào xước méo mó ---
      tl.to("#pen-nib", { opacity: 1, duration: 0.2, ease: "power1.out" }, 0.9);

      // Nét mực run rẩy được vẽ dần bằng strokeDashoffset
      tl.to(
        "#jagged-scribble",
        { strokeDashoffset: 0, duration: 1.6, ease: "none" },
        0.95
      );

      // Chuyển động run rẩy (tremor) của cây bút sắt bám theo nét vẽ (giá trị tuyệt đối tất định)
      const tremorSteps = [
        { t: 0.95, x: 80,  y: 300, rot: -6 },
        { t: 1.05, x: 115, y: 285, rot: 5 },
        { t: 1.15, x: 140, y: 315, rot: -8 },
        { t: 1.25, x: 175, y: 275, rot: 6 },
        { t: 1.35, x: 210, y: 325, rot: -6 },
        { t: 1.45, x: 245, y: 270, rot: 7 },
        { t: 1.55, x: 285, y: 335, rot: -7 },
        { t: 1.65, x: 325, y: 260, rot: 9 },
        { t: 1.75, x: 370, y: 350, rot: -10 },
        { t: 1.85, x: 415, y: 255, rot: 11 },
        { t: 1.95, x: 465, y: 370, rot: -12 },
        { t: 2.05, x: 505, y: 240, rot: 13 },
        { t: 2.15, x: 560, y: 400, rot: -11 },
        { t: 2.25, x: 595, y: 230, rot: 14 },
        { t: 2.35, x: 660, y: 450, rot: -8 },
        { t: 2.45, x: 695, y: 530, rot: 16 },
        { t: 2.55, x: 705, y: 610, rot: 25 }
      ];

      tremorSteps.forEach((step) => {
        tl.to(
          "#pen-nib",
          { x: step.x, y: step.y, rotation: step.rot, duration: 0.09, ease: "power1.inOut" },
          step.t
        );
      });

      // --- PHASE 3: t = 2.04s -> Overlay 1 "TAY RUN BẤT LỰC" xuất hiện ---
      tl.fromTo(
        "#overlay-tremor",
        { opacity: 0, scale: 0.82, y: 20 },
        { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" },
        2.04
      );

      // --- PHASE 4: t = 2.55s -> 3.2s: Bút trượt ngã & Mực bắn tung tóe ---
      // Cây bút tuột khỏi tay, rơi xiên sang bên
      tl.to(
        "#pen-nib",
        { x: 760, y: 680, rotation: 48, duration: 0.45, ease: "power3.in" },
        2.58
      );

      // Giọt mực lớn bung ra nhòe nhoẹt trên mặt giấy
      tl.fromTo(
        "#ink-spill",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
