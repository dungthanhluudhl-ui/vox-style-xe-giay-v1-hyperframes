<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #141414;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: #E7E3D9 radial-gradient(circle at 50% 50%, #E7E3D9 30%, rgba(20, 20, 20, 0.28) 100%);
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    /* Video layers (non-timed wrappers to allow transform without nesting timed elements) */
    #video-wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 2;
      transform-origin: 50% 50%;
    }

    #video-zoom {
      position: absolute;
      inset: 0;
      transform-origin: 52% 54%;
    }

    #vid-11 {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      display: block;
    }

    /* Timed shot overlay container */
    .clip {
      position: absolute;
      inset: 0;
    }

    #shot-1 {
      z-index: 10;
      pointer-events: none;
    }

    /* Secondary layer: Plates on video */
    .overlay-card {
      position: absolute;
      width: fit-content;
      max-width: 920px;
      height: auto;
      padding: 18px 32px;
      border-left: 8px solid #FF6A1A;
      border-radius: 4px;
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 46px;
      line-height: 1.25;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: auto;
    }

    #overlay-1 {
      top: 500px;
      left: 80px;
    }

    #overlay-2 {
      top: 620px;
      left: 80px;
    }

    /* Fixed brand signature element */
    .brand-bottom-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s16" data-width="1080" data-height="1920" data-duration="6">
    <!-- Media wrapper without data-start to satisfy video nesting rules -->
    <div id="video-wrapper">
      <div id="video-zoom">
        <video
          id="vid-11"
          src="assets/vid-11-trembling-man-writing-confession.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="6"
          data-media-start="1"
        ></video>
      </div>
    </div>

    <!-- Timed clip container for overlays -->
    <section id="shot-1" class="clip" data-start="0" data-duration="6">
      <div id="overlay-1" class="overlay-card hf-plate-ink">TAY CHÂN RUN RẨY</div>
      <div id="overlay-2" class="overlay-card hf-plate-ink">KHÔNG VIẾT NỔI THƯ</div>
    </section>

    <!-- Brand signature bottom bar -->
    <div class="brand-bottom-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // TransitionIn: grow (scale + fade-in on shot start)
    tl.fromTo(
      "#video-wrapper",
      { scale: 0.85, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
      0
    );

    // CameraMotion: zoom-in towards the trembling hand and brush
    tl.fromTo(
      "#video-zoom",
      { scale: 1 },
      { scale: 1.18, duration: 6, ease: "none" },
      0
    );

    // Overlay 1: "TAY CHÂN RUN RẨY" (annotated)
    // Appears at 1.26s (125500 - 124240), holds for 2.5s (until 3.76s), then fades out
    tl.fromTo(
      "#overlay-1",
      { scale: 0.85, opacity: 0, y: 15 },
      { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
      1.26
    );
    tl.fromTo(
      "#overlay-1",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" },
      3.76
    );

    // Overlay 2: "KHÔNG VIẾT NỔI THƯ" (label)
    // Appears at 3.76s (128000 - 124240), holds for 2.1s (until 5.86s), fades out before scene end
    tl.fromTo(
      "#overlay-2",
      { scale: 0.85, opacity: 0, y: 15 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      3.76
    );
    tl.fromTo(
      "#overlay-2",
      { opacity: 1 },
      { opacity: 0, duration: 0.12, ease: "power2.in" },
      5.86
    );

    // Register paused timeline with HyperFrames runner
    window.__timelines["scene-s16"] = tl;
  </script>

    </template>
  </body>
</html>
