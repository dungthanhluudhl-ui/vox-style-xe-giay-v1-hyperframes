<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #141414;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #E7E3D9;
      overflow: hidden;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Spotlight background variant */
    #spotlight-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 48%, rgba(231, 227, 217, 0.2) 0%, rgba(20, 20, 20, 0.45) 65%, rgba(20, 20, 20, 0.85) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Entire stage wrapper for punch transition entrance */
    #shot-stage {
      position: absolute;
      inset: 0;
      transform-origin: center center;
      z-index: 2;
    }

    /* Hero media framing in safe zone (y: 160–1390) */
    #hero-frame {
      position: absolute;
      top: 210px;
      left: 120px;
      width: 840px;
      height: 1040px;
      overflow: hidden;
      border-radius: 8px;
      border: 3px solid #141414;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
      background-color: #141414;
    }

    #media-zoom {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: center 40%;
    }

    #media-zoom img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      display: block;
    }

    /* Dynamic darkening vignette inside/over the frame */
    #vignette-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(20, 20, 20, 0) 25%, rgba(14, 14, 14, 0.88) 100%);
      pointer-events: none;
      z-index: 3;
    }

    /* Overlay 1: Label container */
    #label-container {
      position: absolute;
      top: 250px;
      left: 0;
      width: 1080px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    #label-plate {
      display: inline-block;
      padding: 14px 28px;
      border-left: 6px solid #FF6A1A;
      font-weight: 700;
      font-size: 36px;
      line-height: 1.2;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    /* Overlay 2: Punch phrase container */
    #punch-container {
      position: absolute;
      top: 1140px;
      left: 0;
      width: 1080px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    #punch-plate {
      display: inline-block;
      padding: 20px 42px;
      border-bottom: 6px solid #FF6A1A;
      font-weight: 900;
      font-size: 64px;
      line-height: 1.25;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.55);
      border-radius: 4px;
    }

    /* Fixed brand bottom bar */
    #brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 50;
    }
  </style>

  <div id="root" data-composition-id="scene-s50" data-width="1080" data-height="1920" data-duration="5">
    <!-- Base Spotlight Background -->
    <div id="spotlight-bg"></div>

    <!-- Shot 1 -->
    <section id="shot-1" class="clip" data-start="0" data-duration="5">
      <div id="shot-stage">
        <!-- Hero Media Frame -->
        <div id="hero-frame">
          <div id="media-zoom">
            <img src="assets/img-13-dejected-man-walking-cutout-street.jpg" alt="Dejected man walking">
          </div>
          <div id="vignette-overlay"></div>
        </div>

        <!-- Overlay 1: Label -->
        <div id="label-container">
          <div id="label-plate" class="hf-plate-ink">SỢ PHẢI CHẠM MẶT</div>
        </div>

        <!-- Overlay 2: Punch phrase -->
        <div id="punch-container">
          <div id="punch-plate" class="hf-plate-ink">DẰN VẶT & HỔ THẸN</div>
        </div>
      </div>
    </section>

    <!-- Bottom brand accent line -->
    <div id="brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Initial entrance: punch transition for the shot
    tl.fromTo("#shot-stage", 
      { scale: 1.15, opacity: 0 }, 
      { scale: 1.0, opacity: 1, duration: 0.42, ease: "power4.out" }, 
      0
    );

    // Camera motion: continuous zoom-in on the hero asset
    tl.fromTo("#media-zoom", 
      { scale: 1.0 }, 
      { scale: 1.22, duration: 4.85, ease: "sine.inOut" }, 
      0
    );

    // Dynamic rising vignette: intensifies mood of isolation and dread
    tl.fromTo("#vignette-overlay", 
      { opacity: 0.35 }, 
      { opacity: 0.85, duration: 4.8, ease: "power2.inOut" }, 
      0.2
    );

    // Overlay 1: Label "SỢ PHẢI CHẠM MẶT" (atMs: 396500 -> 0.26s, holdMs: 2200 -> holds to 2.46s)
    tl.fromTo("#label-container", 
      { scale: 0.82, opacity: 0, y: -25 }, 
      { scale: 1.0, opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, 
      0.26
    );
    tl.fromTo("#label-container", 
      { opacity: 1, y: 0 }, 
      { opacity: 0, y: -15, duration: 0.15, ease: "power2.in" }, 
      2.46
    );

    // Overlay 2: Punch-phrase "DẰN VẶT & HỔ THẸN" (atMs: 398800 -> 2.56s, holdMs: 2300 -> holds to 4.86s)
    tl.fromTo("#punch-container", 
      { scale: 0.86, opacity: 0, y: 35 }, 
      { scale: 1.0, opacity: 1, y: 0, duration: 0.42, ease: "power4.out" }, 
      2.56
    );
    tl.fromTo("#punch-container", 
      { opacity: 1 }, 
      { opacity: 0, duration: 0.12, ease: "power2.in" }, 
      4.86
    );

    // Register paused timeline with HyperFrames runtime
    window.__timelines["scene-s50"] = tl;
  </script>

    </template>
  </body>
</html>
