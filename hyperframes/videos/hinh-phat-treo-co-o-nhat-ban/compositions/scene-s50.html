    <div

              <ellipse id="tension-circle-inner" cx="540" cy="1080" rx="190" ry="60" stroke="#141414" stroke-width="2.5" fill="none" />

              <path id="sightline-left-1" class="sightline-path" d="M 170 680 L 490 730" stroke="#141414" stroke-width="3" stroke-dasharray="6 6" />
              <path id="sightline-left-2" class="sightline-path" d="M 190 790 L 485 765" stroke="#FF6A1A" stroke-width="2.5" stroke-dasharray="6 6" />

                <circle cx="210" cy="740" r="28" fill="#141414" opacity="0.85" />

                  <!-- Bóng cam đặc (#ff7a1a) lệch 10px đúng DNA cutout người -->
                  <g transform="translate(10, 10)">

                    <path d="M 470 940 C 460 840, 480 780, 540 780 C 600 780, 620 840, 610 940 C 600 1010, 580 1050, 570 1070 L 510 1070 C 500 1050, 480 1010, 470 940 Z" fill="#ff7a1a" />
                    <path d="M 450 830 C 470 795, 520 790, 540 805 C 560 790, 610 795, 630 830 C 640 880, 625 930, 610 950 L 470 950 C 455 930, 440 880, 450 830 Z" fill="#ff7a1a" />
                  </g>

                  <!-- Silhouette chính màu mực đen #141414 -->

                    <path d="M 450 830 C 470 795, 520 790, 540 805 C 560 790, 610 795, 630 830 C 640 880, 625 930, 610 950 L 470 950 C 455 930, 440 880, 450 830 Z" fill="#141414" />

            <!-- Overlays: Icon Warning -->

                <path id="warning-triangle" d="M 32 8 L 58 54 L 6 54 Z" stroke="#FF6A1A" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />

        <!-- Meta Stamp cố định ở safe-zone trên (đạt chuẩn tương phản WCAG AA) -->

          <div class="top-tag">

            <span>HỒ SƠ TÂM LÝ // BƯỚC RA ĐƯỜNG</span>

        <!-- Thanh cam đáy cố định nhận diện thương hiệu -->

    </div>

    <script>
      // Khởi tạo GSAP Timeline paused duy nhất cho composition
      const tl = gsap.timeline({ paused: true });

      // Chuẩn bị các stroke paths để tự vẽ (SVG path draw)
      const tensionOuter = document.querySelector("#tension-circle-outer");
      const tensionInner = document.querySelector("#tension-circle-inner");
      const warningTriangle = document.querySelector("#warning-triangle");
      const warningBar = document.querySelector("#warning-bar");
      const sightlines = document.querySelectorAll(".sightline-path");

      [tensionOuter, tensionInner, warningTriangle, warningBar, ...sightlines].forEach((path) => {
        if (path && path.getTotalLength) {
          const len = path.getTotalLength();
          path.style.strokeDasharray = len;
          path.style.strokeDashoffset = len;
        }
      });

      // 1. Camera chuyển động zoom-in nhẹ từ từ (1.0 -> 1.05)
      tl.to("#camera", { scale: 1.05, duration: 5.0, ease: "none" }, 0);

      // 2. Wobble-drop entrance: Gộp các pha thành 1 tween duy nhất bằng GSAP keyframes (tránh multiple writers / overwrite desync)
      tl.fromTo(
        "#hero-group",
        { y: -160, rotation: -7, opacity: 0 },
        {
          keyframes: [
            { y: 0, rotation: 3, opacity: 1, duration: 0.5, ease: "power3.out" },
            { rotation: -1.5, duration: 0.25, ease: "sine.inOut" },
            { rotation: 0, duration: 0.25, ease: "power2.out" }
          ]
        },
        0.1
      );

      // 3. Đám đông silhouette hai bên xuất hiện bao vây
      tl.fromTo(
        "#crowd-left",
        { x: -80, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.65, ease: "power2.out" },
        0.25
      );
      tl.fromTo(
        "#crowd-right",
        { x: 80, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.65, ease: "power2.out" },
        0.3
      );

      // 4. Vòng tròn căng thẳng / radar dằn vặt dưới chân vẽ ra
      if (tensionOuter && tensionOuter.getTotalLength) {
        tl.to(tensionOuter, { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, 0.5);
      }
      if (tensionInner && tensionInner.getTotalLength) {
        tl.to(tensionInner, { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" }, 0.7);
      }

      // 5. Các đường ánh nhìn dò xét (sightlines) phóng tới nhân vật
      sightlines.forEach((line, idx) => {
        if (line && line.getTotalLength) {
          tl.to(line, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 0.7 + idx * 0.12);
        }
      });

      // Nhãn chữ chỉ hướng xuất hiện cùng ánh nhìn dò xét
      tl.fromTo(
        ".sightline-tag",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.4, stagger: 0.15, ease: "power2.out" },
        0.8
      );

      // 6. Label "NƠM NỚP LO SỢ" xuất hiện tại t = 1.06s (khớp 397300ms trong shotlist)
      tl.fromTo(
        "#fear-label",
        { scale: 0.75, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.06
      );

      // 7. Micro-motion: Người co ro lầm lũi (dao động nhẹ trên phần tử con #hero-body, hoàn thành trước punchline)
      tl.fromTo(
        "#hero-body",
        { y: 0 },
        { y: 6, duration: 1.25, ease: "sine.inOut", yoyo: true, repeat: 1 },
        1.4
      );

      // 8. Icon Warning xuất hiện tại t = 1.98s (khớp 398220ms trong shotlist)
      tl.fromTo(
        "#warning-box",
        { scale: 0, opacity: 0, rotation: -15 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "power3.out" },
        1.98
      );
      if (warningTriangle && warningTriangle.getTotalLength) {
        tl.to(warningTriangle, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 2.05);
      }
      // Tự vẽ nét gạch của warning bằng strokeDashoffset thay vì scale để tránh lỗi transformOrigin trên SVG
      if (warningBar && warningBar.getTotalLength) {
        tl.to(warningBar, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 2.3);
      }
      tl.fromTo(
        "#warning-dot",
        { opacity: 0 },
        { opacity: 1, duration: 0.2, ease: "power2.out" },
        2.45
      );

      // 9. Punch Phrase: "DẰN VẶT HỔ THẸN" xuất hiện tại t = 3.3s và giữ vững đến hết 5s
      tl.fromTo(
        "#punch-card",
        { y: 40, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        3.3
      );

      // Điểm nhấn đòn bẩy cam quét từ trái sang phải tại t = 4.16s (khớp mốc 400400ms trong shotlist)
      tl.fromTo(
        "#punch-underline",
        { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, duration: 0.35, ease: "power3.out" },
        4.16
      );

      // Giật nhẹ camera thể hiện cảm xúc tội lỗi nhói lên tại t = 4.16s (seek-safe với keyframes)
      tl.fromTo(
        "#camera-shake",
        { x: 0 },
        {
          keyframes: [
            { x: -5, duration: 0.08, ease: "power1.in" },
            { x: 4, duration: 0.08, ease: "power1.out" },
            { x: 0, duration: 0.12, ease: "power2.out" }
          ]
        },
        4.16
      );

      // Đăng ký timeline cho HyperFrames seek
      window.__timelines["scene-s50"] = tl;
    </script>
