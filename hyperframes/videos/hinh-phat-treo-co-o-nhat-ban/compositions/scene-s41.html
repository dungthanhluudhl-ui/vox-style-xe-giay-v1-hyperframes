      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #141414;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #141414;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Khung bao toàn scene nhận hiệu ứng transitionIn: grow */
      .scene-grow-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      /* Background photo img-12 với cameraMotion: zoom-in */
      .bg-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #141414;
      }

      .bg-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      /* Scrim gradient bảo vệ tương phản text overlay */
      .scrim-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(20, 20, 20, 0.78) 0%,
          rgba(20, 20, 20, 0.2) 30%,
          rgba(20, 20, 20, 0.3) 60%,
          rgba(20, 20, 20, 0.88) 100%
        );
        pointer-events: none;
      }

      /* Overlay 1: Label định danh nhân vật góc trái */
      .vox-label {
        position: absolute;
        top: 260px;
        left: 70px;
        display: inline-flex;
        align-items: center;
        gap: 16px;
        background: #141414;
        border: 3px solid #FF6A1A;
        box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.45);
        padding: 18px 30px;
        border-radius: 8px;
        z-index: 10;
        will-change: transform, opacity;
      }

      .label-dot {
        width: 16px;
        height: 16px;
        background: #FF6A1A;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .label-text {
        color: #F7F4EC;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* Overlay 2: Punch-phrase CÔNG NHÂN XÂY DỰNG */

        position: absolute;
        bottom: 440px;
        left: 60px;
        right: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
        will-change: transform, opacity;
      }

      .punch-box {
        background: #FF6A1A;
        border: 4px solid #141414;
        box-shadow: 8px 8px 0px #141414;
        padding: 24px 44px;
        border-radius: 8px;
        text-align: center;
      }

      .punch-text {
        color: #141414;
        font-size: 54px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        line-height: 1.2;
        white-space: nowrap;
      }

      /* Dải cam nhận diện thương hiệu mép đáy cố định */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;

        background: #FF6A1A;
        z-index: 100;

</html>
