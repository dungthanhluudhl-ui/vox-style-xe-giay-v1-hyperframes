<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Nền lưới ô vuông 84px chuẩn DNA Vox */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      pointer-events: none;
    }

    /* Khung stage chứa media và hiệu ứng punch vào cảnh */
    #shot-stage {
      position: absolute;
      inset: 0;
      transform-origin: center center;
    }

    /* Shadow offset tạo phong cách paper-collage */
    .media-card-shadow {
      position: absolute;
      left: 68px;
      top: 198px;
      width: 960px;
      height: 1160px;
      border-radius: 12px;
      background-color: #141414;
      pointer-events: none;
    }

    /* Khung giới hạn media chuẩn dải an toàn y160 - y1390 */
    .media-card {
      position: absolute;
      left: 60px;
      top: 190px;
      width: 960px;
      height: 1160px;
      border-radius: 12px;
      border: 3px solid #141414;
      background-color: #141414;
      overflow: hidden;
    }

    /* Wrapper bọc media không mang data-start để pan/zoom */
    #image-pan {
      position: absolute;
      left: 0;
      top: 0;
      width: 1140px;
      height: 100%;
      will-change: transform;
    }

    #image-pan img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Nhãn hồ sơ định danh nhân vật & bối cảnh (WCAG AAA: #F7F4EC trên nền #141414 = 16.8:1) */
    .profile-badge {
      position: absolute;
      z-index: 20;
      background-color: #141414;
      border-left: 8px solid #FF6A1A;
      border-radius: 8px;
      padding: 16px 28px;
      box-shadow: 0 12px 32px rgba(20, 20, 20, 0.4);
      opacity: 0;
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* Overlay 1: Nhãn hồ sơ nhân sự góc trên bên phải */
    #overlay-1 {
      top: 224px;
      right: 92px;
    }

    /* Overlay 2: Nhãn công ty xây dựng góc dưới bên trái (tách biệt hoàn toàn, không chồng lấn) */
    #overlay-2 {
      top: 1220px;
      left: 92px;
    }

    .badge-text {
      display: block;
      color: #F7F4EC;
      font-size: 34px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    /* Thanh cam nhận diện thương hiệu cố định ở đáy */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s41" data-width="1080" data-height="1920" data-duration="5.02">
    <div class="bg-grid"></div>

    <section id="shot-1" class="clip" data-start="0" data-duration="5.02">
      <div id="shot-stage">
        <div class="media-card-shadow"></div>
        <div class="media-card">
          <div id="image-pan">
            <img src="assets/img-12-prisoner-release-day-gate.jpg" alt="Hamaguchi bước ra cổng trại">
          </div>
        </div>

        <div id="overlay-1" class="profile-badge">
          <span class="badge-text">HAMAGUCHI (36 TUỔI)</span>
        </div>

        <div id="overlay-2" class="profile-badge">
          <span class="badge-text">CÔNG TY XÂY DỰNG</span>
        </div>
      </div>
    </section>

    <div class="bottom-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. Vào cảnh: transitionIn="punch"
    tl.fromTo(
      "#shot-stage",
      { scale: 1.12, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      0
    );

    // 2. Camera motion: pan-left (viewport lia sang trái = nội dung dịch sang phải = x tăng dần)
    tl.fromTo(
      "#image-pan",
      { x: -140 },
      { x: -20, duration: 5.0, ease: "power1.out" },
      0
    );

    // 3. Overlay 1: HAMAGUCHI (36 TUỔI) tại atMs=330500 (t=0.26s), holdMs=2500 (giữ đến 2.76s)
    tl.fromTo(
      "#overlay-1",
      { scale: 0.82, opacity: 0, y: -16 },
      { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
      0.26
    );
    tl.fromTo(
      "#overlay-1",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -12, duration: 0.2, ease: "power2.in" },
      2.76
    );

    // 4. Overlay 2: CÔNG TY XÂY DỰNG tại atMs=333200 (t=2.96s), holdMs=2000 (giữ đến 4.96s)
    tl.fromTo(
      "#overlay-2",
      { scale: 0.82, opacity: 0, y: 16 },
      { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
      2.96
    );
    tl.fromTo(
      "#overlay-2",
      { opacity: 1 },
      { opacity: 0, duration: 0.05, ease: "power1.in" },
      4.96
    );

    window.__timelines["scene-s41"] = tl;
  </script>

    </template>
  </body>
</html>
