<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background: #E7E3D9;
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    #video-wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    #video-rise-rig {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
    }

    #video-zoom-rig {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      transform-origin: 50% 50%;
    }

    #vid-s32-1 {
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      display: block;
    }

    #shot-overlays {
      z-index: 10;
      pointer-events: none;
    }

    .overlay-card {
      position: absolute;
      top: 220px;
      left: 70px;
      background-color: #141414;
      border-left: 12px solid #FF6A1A;
      border-radius: 8px;
      padding: 22px 34px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      display: inline-flex;
      align-items: center;
      transform-origin: 0% 50%;
      height: auto;
    }

    .overlay-text {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 52px;
      line-height: 1.15;
      letter-spacing: -0.5px;
      color: #F7F4EC;
      white-space: nowrap;
    }

    .counter-value {
      font-variant-numeric: tabular-nums;
    }

    #brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s32" data-width="1080" data-height="1920" data-duration="9">
    <div id="video-wrapper">
      <div id="video-rise-rig">
        <div id="video-zoom-rig">
          <video
            id="vid-s32-1"
            src="assets/vid-08-inmates-vocational-training-workshop.mp4"
            muted
            playsinline
            data-start="0"
            data-duration="9"
            data-media-start="0">
          </video>
        </div>
      </div>
    </div>

    <div id="shot-overlays" class="clip" data-start="0" data-duration="9">
      <div id="overlay-data" class="overlay-card hf-plate-ink">
        <span class="overlay-text hf-text-light"><span id="inmate-count" class="counter-value">1</span> PHẠM NHÂN</span>
      </div>

      <div id="overlay-label" class="overlay-card hf-plate-ink">
        <span class="overlay-text hf-text-light">LỚP NGHỀ LÀM TÓC</span>
      </div>
    </div>

    <div id="brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo(
      "#video-rise-rig",
      { y: 120, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
      0
    );

    tl.fromTo(
      "#video-zoom-rig",
      { scale: 1.10 },
      { scale: 1.0, duration: 8.9, ease: "power1.out" },
      0
    );

    tl.fromTo(
      "#overlay-data",
      { scale: 0.75, opacity: 0, y: -20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.76
    );

    tl.fromTo(
      "#inmate-count",
      { innerText: 1 },
      { innerText: 12, snap: { innerText: 1 }, duration: 1.25, ease: "power2.out" },
      0.76
    );

    tl.fromTo(
      "#overlay-data",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -15, duration: 0.28, ease: "power2.in" },
      4.5
    );

    tl.fromTo(
      "#overlay-label",
      { scale: 0.75, opacity: 0, y: -20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      5.26
    );

    tl.fromTo(
      "#overlay-label",
      { opacity: 1 },
      { opacity: 0, duration: 0.18, ease: "power1.in" },
      8.78
    );

    window.__timelines["scene-s32"] = tl;
  </script>

    </template>
  </body>
</html>
