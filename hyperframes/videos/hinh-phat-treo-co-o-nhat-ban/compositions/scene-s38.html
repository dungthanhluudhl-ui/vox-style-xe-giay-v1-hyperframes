<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #F5F0E4;
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #F5F0E4;
    }
    .clip {
      position: absolute;
      inset: 0;
    }
    #stage-card {
      position: absolute;
      top: 180px;
      left: 60px;
      width: 960px;
      height: 1120px;
      border-radius: 16px;
      overflow: hidden;
      background: #141414;
      border: 3px solid #141414;
      box-shadow: 0 20px 48px rgba(20, 20, 20, 0.16);
      z-index: 10;
    }
    #img-pan-wrapper {
      position: absolute;
      top: -20px;
      left: 0;
      width: 1240px;
      height: 1160px;
    }
    #hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .overlay-slot {
      position: absolute;
      left: 60px;
      width: 960px;
      top: 1140px;
      display: grid;
      place-items: center;
      z-index: 100;
      pointer-events: none;
    }
    .overlay-card {
      grid-area: 1 / 1;
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      text-align: center;
      padding: 20px 40px;
      border-radius: 12px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      box-sizing: border-box;
    }
    #quote-box {
      font-size: 52px;
      line-height: 1.3;
      border: 3px solid #141414;
      border-left: 12px solid #FF6A1A;
      box-shadow: 0 16px 36px rgba(20, 20, 20, 0.3);
      opacity: 0;
    }
    #punch-box {
      font-size: 56px;
      line-height: 1.3;
      border: 4px solid #141414;
      box-shadow: 8px 8px 0px #141414;
      opacity: 0;
    }
    #bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background: #FF6A1A;
      z-index: 999;
    }
  </style>

  <div id="root" data-composition-id="scene-s38" data-width="1080" data-height="1920" data-duration="10.2">
    <section id="shot-1" class="clip" data-start="0" data-duration="10.2">
      <div id="stage-card">
        <div id="img-pan-wrapper">
          <img id="hero-img" src="assets/img-05-transitional-ward-rehabilitation-inmates.jpg" alt="">
        </div>
      </div>
      <div class="overlay-slot">
        <div id="quote-box" class="hf-plate-ink overlay-card">QUẢN LÝ CỞI MỞ</div>
        <div id="punch-box" class="hf-hl-orange overlay-card">THÍCH NGHI VỚI TỰ DO</div>
      </div>
    </section>
    <div id="bottom-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // TransitionIn: unfold trên toàn bộ stage card
    tl.fromTo("#stage-card",
      { rotationX: -55, opacity: 0, transformPerspective: 1200, transformOrigin: "50% 0%" },
      { rotationX: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
      0
    );

    // Camera motion: pan-right (nội dung ảnh dịch dần sang trái)
    tl.fromTo("#img-pan-wrapper",
      { x: 0 },
      { x: -220, duration: 10.0, ease: "none" },
      0.2
    );

    // Overlay 1: quote "QUẢN LÝ CỞI MỞ" (atMs: 304000, holdMs: 3500)
    tl.fromTo("#quote-box",
      { scale: 0.85, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.96
    );
    tl.fromTo("#quote-box",
      { scale: 1, opacity: 1, y: 0 },
      { scale: 0.95, opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
      4.7
    );

    // Overlay 2: punch-phrase "THÍCH NGHI VỚI TỰ DO" (atMs: 309200, holdMs: 3800)
    tl.fromTo("#punch-box",
      { scale: 0.85, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
      6.16
    );

    window.__timelines["scene-s38"] = tl;
  </script>

    </template>
  </body>
</html>
