  <script>
    // Khởi tạo GSAP Timeline seekable chính xác cho HyperFrames
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // ĐO ĐẠC PATH CHO SVG TỰ VẼ (Icon Rise & Adaptation Arrow)
    const arrowPath = document.getElementById("adaptation-arrow");
    if (arrowPath) {
      const len = arrowPath.getTotalLength();
      arrowPath.style.strokeDasharray = len;
      arrowPath.style.strokeDashoffset = len;
    }

    const stepsPath = document.getElementById("rise-steps-path");
    if (stepsPath) {
      const lenSteps = stepsPath.getTotalLength();
      stepsPath.style.strokeDasharray = lenSteps;
      stepsPath.style.strokeDashoffset = lenSteps;
    }

    const riseArrow = document.getElementById("rise-arrow-path");
    if (riseArrow) {
      const lenRise = riseArrow.getTotalLength();
      riseArrow.style.strokeDasharray = lenRise;
      riseArrow.style.strokeDashoffset = lenRise;

    // ==========================================

    // Transition in của Shot 1: rise (trượt nhẹ từ y: 35 lên y: 0)
    tl.fromTo("#shot1-stage",
      { y: 35, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
      0
    );

    // Camera motion: zoom-in chậm từ 0s -> 5.61s (gắn riêng lên camera-rig)
    tl.fromTo("#shot1-camera", 
      { scale: 1.0 }, 
      { scale: 1.05, duration: 5.61, ease: "none" }, 
      0
    );

    // Cụm người đi dạo dịch chuyển nhẹ nhàng thể hiện sự sinh hoạt tự do
    tl.fromTo("#inmate-pair",
      { x: 230 },
      { x: 255, duration: 5.0, ease: "sine.inOut" },
      0.3
    );

    // Overlay 1: Label "QUẢN LÝ CỞI MỞ" xuất hiện lúc 1.76s (304800 ms), giữ 1.6s
    tl.fromTo("#overlay-label-1",
      { y: 24, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      1.76
    );
    // Ẩn nhãn trước khi punch-phrase xuất hiện để không tranh chấp thị giác
    tl.to("#overlay-label-1",
      { y: -10, opacity: 0, duration: 0.3, ease: "power2.in" },
      3.8
    );

    // Overlay 2: Punch phrase "SINH HOẠT TỰ CHỦ" xuất hiện lúc 4.42s (307460 ms), giữ đến hết shot

      { scale: 1.0, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      4.42

    // DIỄN HOẠT SHOT 2 (5.61s -> 10.2s)
    // ==========================================

    // Transition in của Shot 2: cut/fade-in nhanh
    tl.fromTo("#shot2-stage",
      { opacity: 0 },
      { opacity: 1, duration: 0.25, ease: "power1.out" },
      5.61
    );

    // Camera motion: pan-right nhẹ từ 5.61s -> 10.2s (gắn riêng lên camera-rig)
    tl.fromTo("#shot2-camera",
      { x: 0 },
      { x: -45, duration: 4.59, ease: "none" },
      5.61
    );

    // BỨC TƯỜNG NGĂN CÁCH MỜ DẦN THÀNH NÉT ĐỨT
    tl.to("#barrier-solid", 
      { opacity: 0.15, strokeWidth: 4, duration: 1.4, ease: "power2.inOut" }, 
      6.2
    );
    tl.to("#barrier-dashed", 
      { opacity: 1, duration: 1.2, ease: "power2.out" }, 
      6.4
    );

    // Vectơ thích nghi (Adaptation Arrow) tự vẽ từ khuôn viên xuyên qua bức tường sang đường phố
    tl.to("#adaptation-arrow",
      { strokeDashoffset: 0, duration: 1.3, ease: "power2.out" },
      6.6
    );
    tl.fromTo("#adaptation-arrowhead",
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.5)" },
      7.7
    );

    // Bóng người di chuyển dần qua phía tự do
    tl.fromTo("#walker-approaching",
      { x: 310 },
      { x: 350, duration: 3.5, ease: "sine.inOut" },
      5.8
    );
    tl.fromTo("#walker-reintegrated",
      { x: 630 },
      { x: 670, duration: 3.5, ease: "sine.inOut" },
      6.2
    );

    // Overlay Shot 2.1: Icon "rise" tự vẽ lúc 7.81s (310850 ms), giữ 1.5s
    tl.fromTo("#icon-rise-badge",
      { scale: 0.9, y: 20, opacity: 0 },
      { scale: 1.0, y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      7.81
    );
    // Tự vẽ các nét của Icon Rise
    tl.to("#rise-steps-path",
      { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
      7.9
    );
    tl.to("#rise-arrow-path",
      { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
      8.1
    );

    // Overlay Shot 2.2: Label "TẬP SỐNG TỰ DO" xuất hiện lúc 8.76s (311800 ms), giữ đến cuối scene
    tl.fromTo("#overlay-label-2",
      { y: 24, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      8.76
    );

    // Đăng ký timeline gốc vào window.__timelines theo contract HyperFrames
    window.__timelines["scene-s38"] = tl;
