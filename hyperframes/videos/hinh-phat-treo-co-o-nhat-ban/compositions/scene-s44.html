<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
    /* Reset & Viewport Contract */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #E7E3D9;
      color: #141414;
      font-family: 'Be Vietnam Pro', sans-serif;
      overflow: hidden;
      width: 1080px;
      height: 1920px;
    }
    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    /* Vox Grid Background */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      pointer-events: none;
      z-index: 1;
    }

    /* Spotlight Vignette Variant */
    .bg-spotlight {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, transparent 35%, rgba(20, 20, 20, 0.28) 75%, rgba(20, 20, 20, 0.55) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Visual Signature: Bottom Orange Bar */
    .bottom-orange-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Case Metadata Tag */
    .case-badge {
      position: absolute;
      top: 160px;
      left: 60px;
      z-index: 15;
      background-color: #F5F0E4;
      border: 2px solid #141414;
      padding: 8px 18px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #141414;
      box-shadow: 4px 6px 0px rgba(20, 20, 20, 0.85);
      text-transform: uppercase;
      opacity: 0;
      will-change: transform, opacity;
    }

    /* Punch Phrase Overlay (Elevated upper position: y = 228px - 348px) */
    .punch-box {
      position: absolute;
      top: 228px;
      left: 60px;
      right: 60px;
      z-index: 40;
      background-color: #141414;
      border: 3px solid #FF6A1A;
      box-shadow: 10px 12px 0px #FF6A1A;
      padding: 22px 32px;
      border-radius: 6px;
      text-align: center;
      opacity: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    .punch-title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.25;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .punch-orange {
      color: #FF6A1A;
    }

    .punch-light {
      color: #F7F4EC;
    }

    /* Hero Collage Card (y = 388px - 1288px; leaves lower frame completely clear for captions) */
    .hero-wrapper {
      position: absolute;
      top: 388px;
      left: 60px;
      width: 960px;
      height: 900px;
      z-index: 10;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    .hero-card {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #141414;
      border: 4px solid #141414;
      box-shadow: 14px 18px 0px rgba(20, 20, 20, 0.9);
      overflow: hidden;
    }

    .hero-video-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
      transform-origin: 50% 45%;
      will-change: transform;
    }

    .hero-video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Tape Accents for Collage Realism */
    .tape {
      position: absolute;
      height: 38px;
      background-color: rgba(245, 240, 228, 0.92);
      border: 1px dashed rgba(20, 20, 20, 0.35);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      z-index: 20;
      pointer-events: none;
    }
    .tape-left {
      top: -18px;
      left: 45px;
      width: 140px;
      transform: rotate(-3.5deg);
    }
    .tape-right {
      top: -18px;
      right: 45px;
      width: 140px;
      transform: rotate(4deg);
    }

    /* Annotation SVG Connector Layer */
    .annotation-svg-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 35;
    }

    /* Annotated Label Badge (y = 1140px - 1194px; well above the y >= 1431px caption band) */
    .annotation-badge {
      position: absolute;
      top: 1140px;
      left: 90px;
      z-index: 40;
      background-color: #141414;
      border: 2px solid #F7F4EC;
      box-shadow: 6px 8px 0px rgba(20, 20, 20, 0.85);
      padding: 12px 24px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: 0;
      transform-origin: 0% 50%;
      will-change: transform, opacity;
    }

    .annotation-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #FF6A1A;
      flex-shrink: 0;
    }

    .annotation-text {
      color: #F7F4EC;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s44"
    data-width="1080"
    data-height="1920"
    data-duration="9"
  >
    <!-- Backgrounds: Grid & Spotlight Vignette -->
    <div class="bg-grid"></div>
    <div class="bg-spotlight"></div>

    <!-- Case Archive Stamp -->
    <div id="case-badge" class="case-badge">
      HỒ SƠ #S44 // BƯỚC NGOẶT
    </div>

    <!-- Punch Phrase Headline Box (Moved upward as one coherent block) -->
    <div id="punch-box" class="punch-box">
      <div class="punch-title">
        <span class="punch-orange">BẬT KHÓC</span> <span class="punch-light">NGHẸN NGÀO</span>
      </div>
    </div>

    <!-- Hero Video Collage Frame -->
    <div id="hero-wrapper" class="hero-wrapper">
      <div class="tape tape-left"></div>
      <div class="tape tape-right"></div>
      <div class="hero-card">
        <div id="hero-video-zoom" class="hero-video-container">
          <video
            id="vid-hamaguchi"
            src="assets/vid-05-desperate-thief-crying-jail.mp4"
            data-start="0"
            data-duration="9"
            data-media-start="0"
            muted
            playsinline
          ></video>
        </div>
      </div>
    </div>

    <!-- SVG Connector Line for Annotation -->
    <svg class="annotation-svg-layer" viewBox="0 0 1080 1920">
      <path
        id="annotation-path"
        d="M 420 1167 L 560 1167 L 630 1090"
        fill="none"
        stroke="#FF6A1A"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle id="annotation-target" cx="630" cy="1090" r="7" fill="#FF6A1A" opacity="0" />
    </svg>

    <!-- Annotated Label Badge -->
    <div id="annotation-badge" class="annotation-badge">
      <div class="annotation-dot"></div>
      <div class="annotation-text">5 NĂM CÁCH BIỆT</div>
    </div>

    <!-- Visual Signature: Bottom Orange Bar -->
    <div class="bottom-orange-bar"></div>
  </div>

  <script>
    // Initialize GSAP Seekable Paused Timeline
    const tl = gsap.timeline({ paused: true });

    // Setup Path Geometry for Deterministic SVG Drawing
    const pathEl = document.getElementById("annotation-path");
    if (pathEl) {
      const pathLen = pathEl.getTotalLength();
      pathEl.style.strokeDasharray = pathLen;
      pathEl.style.strokeDashoffset = pathLen;
    }

    // 1. Entrance: "punch" at t = 0.05s
    tl.fromTo(
      "#hero-wrapper",
      { scale: 1.12, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power4.out" },
      0.05
    );

    tl.fromTo(
      "#case-badge",
      { y: -25, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      0.2
    );

    // 2. Camera Motion: Continuous subtle zoom-in on the hero video
    tl.fromTo(
      "#hero-video-zoom",
      { scale: 1.0 },
      { scale: 1.08, duration: 9.0, ease: "none" },
      0
    );

    // 3. Punch-phrase: "BẬT KHÓC NGHẸN NGÀO"
    // Coherent headline block in upper screen (y: 228px - 348px)
    // Starts at 3.28s, holds 2.50s, exits at 5.78s
    tl.fromTo(
      "#punch-box",
      { scale: 0.85, opacity: 0, y: 20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
      3.28
    );

    tl.to(
      "#punch-box",
      { opacity: 0, y: -15, duration: 0.32, ease: "power2.in" },
      5.78
    );

    // 4. Annotated Label: "5 NĂM CÁCH BIỆT"
    // Starts at 4.92s, holds 2.0s, ends at 6.92s (y: 1140px - 1194px, well clear of captions)
    if (pathEl) {
      tl.to(
        "#annotation-path",
        { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" },
        4.92
      );
    }

    tl.to(
      "#annotation-target",
      { opacity: 1, duration: 0.15, ease: "power1.out" },
      5.2
    );

    tl.fromTo(
      "#annotation-badge",
      { scale: 0.85, opacity: 0, x: -20 },
      { scale: 1, opacity: 1, x: 0, duration: 0.35, ease: "power3.out" },
      4.95
    );

    // Fade out annotation at 6.92s
    tl.to(
      ["#annotation-badge", "#annotation-path", "#annotation-target"],
      { opacity: 0, duration: 0.3, ease: "power2.in" },
      6.92
    );

    // Register Master Timeline Synchronously for HyperFrames Seeking
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s44"] = tl;
  </script>

    </template>
  </body>
</html>
