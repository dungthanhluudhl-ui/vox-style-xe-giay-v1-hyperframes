<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      width: 1080px;
      height: 1920px;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #141414;
      overflow: hidden;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Khung hình camera */
    #shot-rig {
      position: absolute;
      inset: 0;
      transform-origin: center center;
      will-change: transform, opacity;
    }

    #media-camera {
      position: absolute;
      inset: 0;
      transform-origin: center 45%;
      will-change: transform;
    }

    .media-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }

    /* Spotlight vignette theo backgroundVariant */
    .spotlight-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 48%, rgba(20, 20, 20, 0.25) 0%, rgba(20, 20, 20, 0.88) 85%);
      pointer-events: none;
    }

    /* Container chứa overlays trong vùng safe zone (y: 160-1390) */
    .overlay-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      pointer-events: none;
      z-index: 20;
    }

    /* Punch phrase: Nền mực đặc #141414, viền cam #FF6A1A, chữ kem sáng #F7F4EC (16.8:1 WCAG)
       Đặt ở Y: 460px - 595px (không giao cắt với Quote ở Y: 800px) */
    #overlay-punch {
      position: absolute;
      top: 460px;
      left: 80px;
      right: 80px;
      background-color: #141414;
      border-left: 12px solid #FF6A1A;
      border-radius: 8px;
      padding: 30px 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      opacity: 0;
      will-change: transform, opacity;
    }

    .punch-text {
      font-size: 60px;
      font-weight: 900;
      line-height: 1.25;
      color: #F7F4EC;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      text-align: center;
      white-space: nowrap;
    }

    /* Quote: Tấm nền cam đặc #FF6A1A, chữ mực đen #141414 (6.4:1 WCAG)
       Đặt ở Y: 800px - 940px (cách đáy Punch phrase hơn 200px, hoàn toàn độc lập) */
    #overlay-quote {
      position: absolute;
      top: 800px;
      left: 80px;
      right: 80px;
      background-color: #FF6A1A;
      border-radius: 12px;
      padding: 32px 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.75);
      opacity: 0;
      will-change: transform, opacity;
    }

    .quote-text {
      font-size: 62px;
      font-weight: 900;
      line-height: 1.2;
      color: #141414;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      text-align: center;
      white-space: nowrap;
    }

    /* Thanh cam đáy nhận diện thương hiệu Vox 12px */
    .brand-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
      pointer-events: none;
    }
  </style>

  <div id="root" data-composition-id="scene-s33" data-width="1080" data-height="1920" data-duration="10.0">
    <section id="shot-1" class="clip" data-start="0" data-duration="10.0">
      <!-- Rig điều khiển chuyển động shot và camera độc lập -->
      <div id="shot-rig">
        <div id="media-camera">
          <img class="media-photo" src="assets/img-06-prison-hallway-guard-inmates.jpg" alt="">
          <div class="spotlight-vignette"></div>
        </div>
      </div>

      <!-- Lớp chứa overlays căn trong vùng safe zone -->
      <div class="overlay-layer">
        <!-- Overlay 1: Punch phrase (atMs: 265000 -> 0.76s, holdMs: 3200ms) -->
        <div id="overlay-punch">
          <div class="punch-text">LAO ĐỘNG BẮT BUỘC</div>
        </div>

        <!-- Overlay 2: Quote (atMs: 269000 -> 4.76s, holdMs: 4500ms) -->
        <div id="overlay-quote">
          <div class="quote-text">KHÔNG CHỈ GIAM GIỮ</div>
        </div>
      </div>
    </section>

    <!-- Thanh cam cố định mép đáy -->
    <div class="brand-bottom-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. Transition in cho shot đầu scene: punch entrance
    tl.fromTo("#shot-rig", 
      { scale: 1.15, opacity: 0 }, 
      { scale: 1, opacity: 1, duration: 0.5, ease: "power4.out" }, 
      0
    );

    // 2. Camera motion: zoom-in liên tục trên wrapper độc lập
    tl.fromTo("#media-camera", 
      { scale: 1 }, 
      { scale: 1.14, duration: 9.8, ease: "none" }, 
      0
    );

    // 3. Overlay 1: punch-phrase "LAO ĐỘNG BẮT BUỘC" (0.76s -> giữ 3.39s -> fade out lúc 4.15s)
    tl.fromTo("#overlay-punch", 
      { scale: 0.85, opacity: 0, y: 30 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 
      0.76
    );
    tl.fromTo("#overlay-punch", 
      { opacity: 1, scale: 1 }, 
      { opacity: 0, scale: 0.95, duration: 0.3, ease: "power2.in" }, 
      4.15
    );

    // 4. Overlay 2: quote "KHÔNG CHỈ GIAM GIỮ" (4.76s -> giữ 4.54s -> fade out lúc 9.3s)
    tl.fromTo("#overlay-quote", 
      { scale: 1.15, opacity: 0, y: -20 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power4.out" }, 
      4.76
    );
    tl.fromTo("#overlay-quote", 
      { opacity: 1, scale: 1 }, 
      { opacity: 0, scale: 0.96, duration: 0.35, ease: "power2.in" }, 
      9.3
    );

    // Đăng ký timeline paused vào window.__timelines sau khi build xong
    window.__timelines["scene-s33"] = tl;
  </script>

    </template>
  </body>
</html>
