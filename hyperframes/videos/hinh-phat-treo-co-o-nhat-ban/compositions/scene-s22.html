<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      font-family: 'Be Vietnam Pro', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      perspective: 1000px;
      overflow: hidden;
    }
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Khung sân khấu chính chịu hiệu ứng Flip khi vào cảnh */
    #stage {
      position: absolute;
      inset: 0;
      transform-origin: center center;
    }

    /* Cột trái: Khối chữ so sánh nền kem */
    #left-card {
      position: absolute;
      left: 40px;
      top: 160px;
      width: 480px;
      height: 1230px;
      background-color: #F5F0E4;
      border: 2px solid rgba(20, 20, 20, 0.16);
      border-radius: 16px;
      padding: 56px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 10;
    }

    /* Khung chứa các trạng thái chữ thay thế nhau */
    #text-pane {
      position: relative;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      align-items: center;
    }

    .state-item {
      grid-column: 1;
      grid-row: 1;
      position: relative;
      width: 100%;
      opacity: 0;
    }

    .accent-bar {
      width: 64px;
      height: 8px;
      background-color: #FF6A1A;
      margin-bottom: 28px;
      border-radius: 2px;
    }

    .punch-text {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.28;
      color: #141414;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      word-break: break-word;
    }

    /* Cột phải: Video pane giữ cố định */
    #video-pane {
      position: absolute;
      left: 560px;
      top: 160px;
      width: 480px;
      height: 1230px;
      background-color: #141414;
      border: 2px solid rgba(20, 20, 20, 0.16);
      border-radius: 16px;
      overflow: hidden;
      z-index: 5;
    }

    #vid-12 {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Thanh cam đáy nhận diện thương hiệu */
    #bottom-brand-bar {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s22" data-width="1080" data-height="1920" data-duration="11.02">
    <!-- Toàn bộ sân khấu của shot được bọc trong #stage để xoay Flip entrance -->
    <div id="stage">
      <!-- Cột phải: Video không lồng trong timed element -->
      <div id="video-pane">
        <video
          id="vid-12"
          src="assets/vid-12-prison-guard-inmates-hallway.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="11.02"
          data-media-start="0"
        ></video>
      </div>

      <!-- Cột trái: Khối chữ nền kem chia đôi -->
      <section id="shot-1-overlay" class="clip" data-start="0" data-duration="11.02">
        <div id="left-card">
          <div id="text-pane">
            <!-- Trạng thái 1: Overlay split -->
            <div id="state-1" class="state-item">
              <div class="accent-bar"></div>
              <div class="punch-text hf-text-ink">PHƯƠNG TÂY: TỰ DO HƠN</div>
            </div>

            <!-- Trạng thái 2: Overlay label -->
            <div id="state-2" class="state-item">
              <div class="accent-bar"></div>
              <div class="punch-text hf-text-ink">CHỈ CẦN KHÔNG VƯỢT NGỤC</div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- Thanh viền cam đáy cố định -->
    <div id="bottom-brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. Transition In của shot đầu scene: Flip entrance trên toàn bộ #stage
    tl.fromTo("#stage",
      { rotationY: -55, opacity: 0 },
      { rotationY: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
      0
    );

    // 2. Trạng thái 1: "PHƯƠNG TÂY: TỰ DO HƠN" xuất hiện tại t = 0.54s
    tl.fromTo("#state-1",
      { opacity: 0, y: 24, scale: 0.96 },
      { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "power3.out" },
      0.54
    );

    // Fade-out trạng thái 1 trước khi đổi sang trạng thái 2 (đáp ứng đủ holdMs 3000ms: từ 0.54s đến 6.75s = 6.21s)
    tl.fromTo("#state-1",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" },
      6.75
    );

    // 3. Trạng thái 2: "CHỈ CẦN KHÔNG VƯỢT NGỤC" xuất hiện tại t = 7.04s và giữ tới cuối shot (holdMs 3800ms)
    tl.fromTo("#state-2",
      { opacity: 0, y: 24, scale: 0.96 },
      { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "power3.out" },
      7.04
    );

    window.__timelines["scene-s22"] = tl;
  </script>

    </template>
  </body>
</html>
