    const tl = gsap.timeline({ paused: true });

    // Setup SVG stroke drawing for checkmark path
    const checkPath = document.getElementById("check-path");
    if (checkPath) {
      const len = checkPath.getTotalLength() || 30;
      checkPath.style.strokeDasharray = len;
      checkPath.style.strokeDashoffset = len;
    }

    // Setup bridge paths
    const bridge1 = document.getElementById("bridge-path-1");
    const bridge2 = document.getElementById("bridge-path-2");
    const bridge3 = document.getElementById("bridge-path-3");

    [bridge1, bridge2, bridge3].forEach(p => {
      if (p) {
        const pLen = p.getTotalLength();
        p.style.strokeDasharray = pLen;
        p.style.strokeDashoffset = pLen;
      }
    });

    // 1. Pan-right camera motion across duration
    tl.fromTo("#camera-stage", 
      { x: 8 }, 
      { x: -8, duration: 7.0, ease: "none" }, 
      0
    );

    // Initial transition: punch into top nodes
    tl.fromTo("#node-origin", 
      { scale: 0.9, opacity: 0, y: -15 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 
      0.2
    );

    tl.fromTo("#danger-box", 
      { scale: 0.9, opacity: 0, y: -15 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 
      0.3
    );

    if (bridge1) {
      tl.to(bridge1, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 0.5);
    }

    // 2. Punch-phrase: "HÀNH TRANG TỰ DO" (Offset = 1.18s, atMs = 275420, holdMs = 1800)
    tl.fromTo("#punch-phrase", 
      { scale: 1.2, opacity: 0, y: 15 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power4.out" }, 
      1.18
    );

    tl.fromTo("#punch-underline", 
      { scaleX: 0 }, 
      { scaleX: 1, duration: 0.4, ease: "power2.out" },
