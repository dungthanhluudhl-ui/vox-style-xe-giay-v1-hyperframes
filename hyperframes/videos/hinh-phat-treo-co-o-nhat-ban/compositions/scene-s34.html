<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #E7E3D9;
      font-family: 'Be Vietnam Pro', sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      overflow: hidden;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    #shot-1 {
      perspective: 1000px;
    }

    #stage {
      position: absolute;
      inset: 0;
      transform-origin: center center;
    }

    /* Khung chứa ảnh hero trong dải y: 160-1390 */
    .media-viewport {
      position: absolute;
      left: 70px;
      top: 220px;
      width: 940px;
      height: 940px;
      overflow: hidden;
      border-radius: 16px;
      border: 4px solid #141414;
      background-color: #F5F0E4;
      box-shadow: 0 16px 36px rgba(20, 20, 20, 0.22);
    }

    .pan-wrapper {
      position: absolute;
      left: 0;
      top: 0;
      width: 1240px;
      height: 940px;
      will-change: transform;
    }

    .hero-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Vùng chứa chữ ổn định (y: 1205-1315) nằm gọn trước safe-line 1390 */
    .text-dock {
      position: absolute;
      left: 90px;
      top: 1205px;
      width: 900px;
      height: 110px;
    }

    .plate-card {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      border: 3px solid #FF6A1A;
      box-shadow: 0 12px 28px rgba(20, 20, 20, 0.28);
      opacity: 0;
    }

    #overlay-1 {
      background-color: #141414;
      color: #F7F4EC;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    .arrow-accent {
      color: #FF6A1A;
      margin: 0 16px;
    }

    #overlay-2 {
      background-color: #141414;
      color: #FF6A1A;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    /* Thanh cam đáy nhận diện thương hiệu cố định */
    .bottom-brand-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s34" data-width="1080" data-height="1920" data-duration="7.0">
    <section id="shot-1" class="clip" data-start="0" data-duration="7.0">
      <div id="stage">
        <div class="media-viewport">
          <div id="pan-wrapper" class="pan-wrapper">
            <img class="hero-media" src="assets/img-05-transitional-ward-rehabilitation-inmates.jpg" alt="">
          </div>
        </div>

        <div class="text-dock">
          <div id="overlay-1" class="plate-card" data-layout-allow-overlap="true">
            <span>DẠY NGHỀ <span class="arrow-accent">→</span> HOÀN LƯƠNG</span>
          </div>
          <div id="overlay-2" class="plate-card" data-layout-allow-overlap="true">
            <span>HẠN CHẾ TÁI PHẠM</span>
          </div>
        </div>
      </div>
    </section>

    <div class="bottom-brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. Flip entrance cho toàn bộ stage của shot
    tl.fromTo(
      "#stage",
      { rotationY: -55, opacity: 0 },
      { rotationY: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
      0
    );

    // 2. Camera motion: pan-right (nội dung ảnh dịch dần sang trái)
    tl.fromTo(
      "#pan-wrapper",
      { x: 0 },
      { x: -220, duration: 6.8, ease: "power1.out" },
      0
    );

    // 3. Overlay 1: timeline "DẠY NGHỀ → HOÀN LƯƠNG" xuất hiện lúc 0.76s (275000ms - 274240ms)
    tl.fromTo(
      "#overlay-1",
      { scale: 0.85, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
      0.76
    );

    // Giữ đủ holdMs (3000ms) rồi mờ dần lúc 3.85s (kết thúc ở 4.10s)
    tl.fromTo(
      "#overlay-1",
      { opacity: 1 },
      { opacity: 0, duration: 0.25, ease: "power2.in" },
      3.85
    );

    // 4. Overlay 2: label "HẠN CHẾ TÁI PHẠM" xuất hiện lúc 4.26s (278500ms - 274240ms)
    tl.fromTo(
      "#overlay-2",
      { scale: 0.85, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
      4.26
    );

    window.__timelines["scene-s34"] = tl;
  </script>

    </template>
  </body>
</html>
