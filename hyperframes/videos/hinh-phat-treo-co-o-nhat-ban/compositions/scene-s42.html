<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Nền spotlight vignette */
    #bg-spotlight {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      background-image: radial-gradient(circle at 50% 48%, rgba(231, 227, 217, 0) 35%, rgba(20, 20, 20, 0.28) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Video stage & camera wrapper (không mang data-start) */
    #video-stage {
      position: absolute;
      left: 110px;
      top: 170px;
      width: 860px;
      height: 1020px;
      z-index: 10;
      transform-origin: 50% 50%;
    }

    #video-camera {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      overflow: hidden;
      border: 3px solid #141414;
      box-shadow: 0 16px 40px rgba(20, 20, 20, 0.22);
      transform-origin: 50% 50%;
      background-color: #141414;
    }

    #hero-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Vùng hiển thị lộ trình / overlays */
    #route-container {
      position: absolute;
      left: 60px;
      right: 60px;
      top: 1230px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 20;
    }

    .route-badge {
      position: absolute;
      padding: 20px 42px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 42px;
      line-height: 1.2;
      text-align: center;
      letter-spacing: 0.5px;
      border-left: 8px solid #FF6A1A;
      box-shadow: 0 10px 24px rgba(20, 20, 20, 0.25);
      opacity: 0;
      transform-origin: 50% 50%;
    }

    /* Thanh cam thương hiệu cố định mép đáy */
    #bottom-brand-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s42" data-width="1080" data-height="1920" data-duration="7.98">
    <!-- Nền spotlight -->
    <div id="bg-spotlight"></div>

    <!-- Khung chứa video (không có data-start để tránh nested timed element) -->
    <div id="video-stage">
      <div id="video-camera">
        <video
          id="hero-video"
          src="assets/vid-04-prisoner-release-day-walkout.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="7.98"
          data-media-start="0"
        ></video>
      </div>
    </div>

    <!-- Shot section cho các lớp thông tin chữ -->
    <section id="shot-1" class="clip" data-start="0" data-duration="7.98">
      <div id="route-container">
        <div id="overlay-1" class="route-badge hf-plate-ink">CỔNG TRẠI → XE ĐÓN</div>
        <div id="overlay-2" class="route-badge hf-plate-ink">ĐẾN NƠI LÀM VIỆC</div>
      </div>
    </section>

    <!-- Thanh cam đáy cố định -->
    <div id="bottom-brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Transition In: rise cho toàn bộ khung video
    tl.fromTo(
      "#video-stage",
      { y: 110, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
      0.05
    );

    // Camera Motion: zoom-out chậm suốt thời lượng shot
    tl.fromTo(
      "#video-camera",
      { scale: 1.14 },
      { scale: 1.0, duration: 7.55, ease: "power1.out" },
      0.05
    );

    // Overlay 1: "CỔNG TRẠI → XE ĐÓN" (atMs: 336000 -> 0.74s, holdMs: 3200ms -> 3.94s)
    tl.fromTo(
      "#overlay-1",
      { scale: 0.75, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.74
    );
    tl.fromTo(
      "#overlay-1",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -20, duration: 0.28, ease: "power2.in" },
      3.94
    );

    // Overlay 2: "ĐẾN NƠI LÀM VIỆC" (atMs: 339800 -> 4.54s, holdMs: 3200ms -> 7.74s)
    tl.fromTo(
      "#overlay-2",
      { scale: 0.75, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      4.54
    );
    tl.fromTo(
      "#overlay-2",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -16, duration: 0.22, ease: "power2.in" },
      7.70
    );

    window.__timelines["scene-s42"] = tl;
  </script>

    </template>
  </body>
</html>
