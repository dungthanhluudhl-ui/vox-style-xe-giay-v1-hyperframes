<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #0b0f14;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }

      /* Lớp nền lưới giấy ngà 84px đặc trưng Vox Style DNA */
      .grid-layer {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        pointer-events: none;
        z-index: 1;
      }

      /* Video chính: con trực tiếp của #root mang data-start="0" data-duration="7.98" */
      #bg-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 5;
        will-change: transform, clip-path, opacity;
      }

      /* Lớp viền tối vignette phong cách phóng sự tài liệu */
      .video-vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 140px rgba(20, 20, 20, 0.55);
        z-index: 10;
      }

      /* Quy ước clip HyperFrames chuẩn: inset: 0 */
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* 1. Tag ghi chú tài liệu báo chí */
      .stamp-clip {
        z-index: 25;
        pointer-events: none;
      }

      .stamp-pill {
        position: absolute;
        top: 175px;
        left: 60px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background-color: #141414;
        color: #f7f4ec;
        padding: 8px 18px;
        border-radius: 4px;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 2px;
        text-transform: uppercase;
        box-shadow: 4px 4px 0px #ff6a1a;
        will-change: transform, opacity;
      }

      .stamp-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: #ff6a1a;
        display: inline-block;
      }

      .stamp-text {
        display: inline-block;
      }

      /* Khung bao chung cho các card overlay nằm trong safe-zone */
      .overlay-stage {
        z-index: 30;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 260px;
      }

      /* 2. Card Overlay 1: Label "CỔNG SẮT KHÉP LẠI" */
      .label-card {
        display: inline-flex;
        align-items: center;
        gap: 18px;
        background-color: #141414;
        border-left: 8px solid #ff6a1a;
        border-radius: 6px;
        padding: 16px 28px;
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45), 6px 6px 0px rgba(255, 106, 26, 0.9);
        will-change: transform, opacity;
      }

      .label-icon-box {
        width: 44px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 106, 26, 0.16);
        border-radius: 4px;
        flex-shrink: 0;
      }

      .label-icon-box svg {
        width: 26px;
        height: 26px;
        stroke: #ff6a1a;
        fill: none;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .label-text-box {
        display: inline-flex;
        flex-direction: column;
      }

      .label-kicker {
        font-size: 16px;
        font-weight: 700;
        color: #ff6a1a;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 2px;
        display: inline-block;
      }

      .label-heading {
        font-size: 38px;
        font-weight: 900;
        color: #f7f4ec;
        letter-spacing: 0.5px;
        line-height: 1.25;
        display: inline-block;
      }

      /* 3. Card Overlay 2: Punch-phrase "XE ĐÓN TẬN CỔNG" */
      .punch-stage {
        padding-top: 290px;
      }

      .punch-card {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        background-color: #f5f0e4;
        border: 4px solid #141414;
        border-radius: 12px;
        padding: 24px 44px;
        box-shadow: 10px 10px 0px #141414, 18px 18px 0px #ff6a1a;
        max-width: 840px;
        will-change: transform, opacity;
      }

      .punch-tag {
        background-color: #ff6a1a;
        color: #141414;
        font-size: 19px;
        font-weight: 900;
        letter-spacing: 2.5px;
        padding: 5px 16px;
        border-radius: 4px;
        text-transform: uppercase;
        margin-bottom: 12px;
        display: inline-block;
      }

      .punch-title {
        font-size: 64px;
        font-weight: 900;
        color: #141414;
        line-height: 1.2;
        text-align: center;
        letter-spacing: -0.5px;
        white-space: nowrap;
        display: inline-block;
      }

      /* Dải cam nhận diện thương hiệu cố định mép dưới */
      #brand-bottom-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 1000;
        pointer-events: none;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s42"
      data-width="1080"
      data-height="1920"
      data-duration="7.98"
    >
      <!-- Nền giấy lưới kẻ ô vuông chuẩn Vox Style DNA -->
      <div class="grid-layer"></div>

      <!-- Thẻ video nguồn có data-start và data-duration tường minh -->
      <video
        id="bg-video"
        data-start="0"
        data-duration="7.98"
        src="assets/vid-01-inmate-prison-release-day.mp4"
        muted
        playsinline
      ></video>

      <!-- Vignette tạo độ sâu điện ảnh cho khung hình -->
      <div class="video-vignette"></div>

      <!-- 1. Tag ghi chú tài liệu báo chí (0s -> 7.98s) -->
      <div
        id="stamp-clip"
        class="clip stamp-clip"
        data-start="0"
        data-duration="7.98"
      >
        <span id="stamp-pill" class="stamp-pill">
          <span class="stamp-dot"></span>
          <span class="stamp-text">BẰNG CHỨNG THỰC TẾ</span>
        </span>
      </div>

      <!-- 2. Overlay Label: "CỔNG SẮT KHÉP LẠI" (1.12s -> 2.72s) -->
      <div
        id="label-clip"
        class="clip overlay-stage"
        data-start="1.12"
        data-duration="1.6"
      >
        <span id="label-card" class="label-card">
          <span class="label-icon-box">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <line x1="8" y1="3" x2="8" y2="21" />
              <line x1="12" y1="3" x2="12" y2="21" />
              <line x1="16" y1="3" x2="16" y2="21" />
              <line x1="3" y1="12" x2="21" y2="12" />
            </svg>
          </span>
          <span class="label-text-box">
            <span class="label-kicker">ĐIỂM MỐC TỰ DO</span>
            <span class="label-heading">CỔNG SẮT KHÉP LẠI</span>
          </span>
        </span>
      </div>

      <!-- 3. Overlay Punch-phrase: "XE ĐÓN TẬN CỔNG" (4.55s -> 6.35s) -->
      <div
        id="punch-clip"
        class="clip overlay-stage punch-stage"
        data-start="4.55"
        data-duration="1.8"
      >
        <span id="punch-card" class="punch-card">
          <span class="punch-tag">TIẾP ĐÓN TRỰC TIẾP</span>
          <span class="punch-title">XE ĐÓN TẬN CỔNG</span>
        </span>
      </div>

      <!-- Dải cam chữ ký thương hiệu luôn cố định ở mép dưới cùng -->
      <div id="brand-bottom-bar"></div>
    </div>

    <script>
      // Khởi tạo GSAP timeline paused cho HyperFrames seek runtime
      const tl = gsap.timeline({ paused: true });

      // 1. Chuyển cảnh vào (transitionIn: "unfold"): mở bung khung hình từ nếp gấp trung tâm
      tl.fromTo(
        "#bg-video",
        {
          clipPath: "inset(50% 0% 50% 0%)",
          opacity: 0,
        },
        {
          clipPath: "inset(0% 0% 0% 0%)",
          opacity: 1,
          duration: 0.75,
          ease: "power3.out",
        },
        0
      );

      // 2. Chuyển động Ken Burns chậm pan-right theo hướng nhân vật bước ra ngoài xe
      tl.fromTo(
        "#bg-video",
        { x: -45, scale: 1.12 },
        { x: 45, scale: 1.12, duration: 7.98, ease: "none" },
        0
      );

      // 3. Nhãn chứng cứ đầu cảnh xuất hiện nhẹ nhàng
      tl.fromTo(
        "#stamp-pill",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
        0.3
      );

      // 4. Overlay 1: Label "CỔNG SẮT KHÉP LẠI" (start: 1.12s, duration: 1.6s)
      tl.fromTo(
        "#label-card",
        { y: 28, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
        1.12
      );
      tl.to(
        "#label-card",
        { y: -16, opacity: 0, duration: 0.24, ease: "power2.in" },
        2.46
      );

      // 5. Overlay 2: Punch-phrase "XE ĐÓN TẬN CỔNG" (start: 4.55s, duration: 1.8s)
      tl.fromTo(
        "#punch-card",
        { y: 35, opacity: 0, scale: 0.9 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        4.55
      );
      tl.to(
        "#punch-card",
        { y: -18, opacity: 0, duration: 0.25, ease: "power2.in" },
        6.05
      );

      // Đăng ký bắt buộc timeline gốc với window.__timelines["scene-s42"]
      window.__timelines["scene-s42"] = tl;
    </script>
  
    </template>
  </body>
</html>
