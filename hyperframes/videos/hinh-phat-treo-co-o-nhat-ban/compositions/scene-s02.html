<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    /* Nền lưới ô vuông 84px chuẩn phong cách Vox */
    #bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      pointer-events: none;
      z-index: 1;
    }

    /* Quy chuẩn clip của HyperFrames */
    .clip {
      position: absolute;
      inset: 0;
    }

    #shot-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 2;
    }

    #media-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* Wrapper bọc media điều khiển camera pan/zoom */
    #media-rig {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      transform-origin: center center;
      will-change: transform;
    }

    #hallway-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Vùng chứa overlays ổn định trong safe zone, xếp dọc không chồng lấn */
    #shot-overlays {
      position: absolute;
      top: 200px;
      left: 60px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
      pointer-events: none;
    }

    /* Thẻ timeline mốc thời gian buổi sáng */
    #card-time {
      padding: 16px 28px;
      border-radius: 6px;
      font-weight: 900;
      font-size: 40px;
      line-height: 1.2;
      letter-spacing: -0.5px;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform-origin: left center;
    }

    /* Thẻ label trạng thái không khí trại giam */
    #card-label {
      padding: 16px 28px 16px 24px;
      border-left: 8px solid #FF6A1A;
      border-radius: 6px;
      font-weight: 900;
      font-size: 40px;
      line-height: 1.2;
      letter-spacing: -0.5px;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform-origin: left center;
    }

    /* Thanh cam thương hiệu cố định ở đáy khung hình */
    #brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s02" data-width="1080" data-height="1920" data-duration="6.4">
    <!-- Nền lưới toạ độ -->
    <div id="bg-grid"></div>

    <!-- Shot 1 của Scene S02 -->
    <section id="shot-1" class="clip" data-start="0" data-duration="6.4">
      <div id="shot-stage">
        <div id="media-viewport">
          <div id="media-rig">
            <img
              id="hallway-img"
              src="assets/img-06-prison-hallway-guard-inmates.jpg"
              alt="Hành lang trại giam u ám"
            >
          </div>
        </div>
      </div>

      <!-- Lớp chữ đồ họa thứ hai (Overlays xếp theo thứ tự hiển thị) -->
      <div id="shot-overlays">
        <div id="card-time" class="hf-hl-orange">
          TRƯỚC 11:00 SÁNG
        </div>
        <div id="card-label" class="hf-plate-ink">
          IM LẶNG TUYỆT ĐỐI
        </div>
      </div>
    </section>

    <!-- Thanh dải màu cam thương hiệu đáy khung hình -->
    <div id="brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. Vào cảnh bằng hiệu ứng rise mượt mà
    tl.fromTo(
      "#shot-stage",
      { y: 60, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0
    );

    // 2. Camera pan-right: góc nhìn tiến sang phải, ảnh dịch sang trái (x giảm dần)
    tl.fromTo(
      "#media-rig",
      { x: 30, scale: 1.15 },
      { x: -40, scale: 1.15, duration: 6.38, ease: "none" },
      0
    );

    // 3. Overlay 1: "TRƯỚC 11:00 SÁNG" pop vào lúc 0.16s, giữ tối thiểu 3.0s
    tl.fromTo(
      "#card-time",
      { scale: 0.88, opacity: 0, x: -20 },
      { scale: 1, opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
      0.16
    );

    // 4. Overlay 2: "IM LẶNG TUYỆT ĐỐI" pop vào lúc 3.36s, giữ tối thiểu 2.9s
    tl.fromTo(
      "#card-label",
      { scale: 0.88, opacity: 0, x: -20 },
      { scale: 1, opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
      3.36
    );

    // 5. Fade out cụm overlays ở cuối shot (6.26s -> 6.38s)
    tl.fromTo(
      "#shot-overlays",
      { opacity: 1 },
      { opacity: 0, duration: 0.12, ease: "power2.in" },
      6.26
    );

    // Đăng ký timeline cho runtime HyperFrames render
    window.__timelines["scene-s02"] = tl;
  </script>

    </template>
  </body>
</html>
