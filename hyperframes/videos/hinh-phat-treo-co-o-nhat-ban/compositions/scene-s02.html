  <script>
    // HyperFrames Single Paused Timeline Contract
    const tl = gsap.timeline({ paused: true });

    // 1. Scene Entrance (Rise Transition & Continuous Camera Zoom)
    tl.fromTo(
      "#scene-content",
      { y: 60, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
      0.0
    );

    tl.fromTo(
      "#camera",
      { scale: 1.0 },
      { scale: 1.04, duration: 6.4, ease: "sine.inOut" },
      0.0
    );

    // 2. Chart lines & tick marks entrance
    tl.fromTo(
      ".chart-line",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.6, stagger: 0.08, ease: "power2.out" },
      0.1
    );
    tl.fromTo(
      ".chart-tick",
      { x: -30, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.4, stagger: 0.08, ease: "power2.out" },
      0.2
    );

    // 3. Header title entrance
    tl.fromTo(
      "#header-group",
      { y: 24, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
      0.25
    );

    // 4. Clock Diagram Reveal (0.52s = atMs 10360)
    tl.fromTo(
      "#clock-dial-path",
      { strokeDashoffset: 1200 },
      { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" },
      0.52
    );
    tl.fromTo(
      ".clock-mark",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, stagger: 0.02, ease: "power2.out", transformOrigin: "210px 210px" },
      0.65
    );
    tl.fromTo(
      "#clock-danger-sector",
      { opacity: 0 },
      { opacity: 1, duration: 0.6, ease: "power1.out" },
      0.8
    );
    tl.fromTo(
      "#countdown-card",
      { y: 20, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.7
    );

    // 5. Clock Hands Motion: From 6:00 (180deg) to 11:00 (330deg)
    // Symmetrical bounds prevent rotation center drift
    tl.fromTo(
      "#clock-hour-hand",
      { rotation: 180, transformOrigin: "210px 210px" },
      { rotation: 330, duration: 3.8, ease: "power1.inOut", transformOrigin: "210px 210px" },
      0.8
    );

    tl.fromTo(
      "#clock-min-hand",
      { rotation: 0, transformOrigin: "210px 210px" },
      { rotation: 1800, duration: 3.8, ease: "power1.inOut", transformOrigin: "210px 210px" },
      0.8
    );

    // Digital Time Counter (06:00 -> 11:00)
    const timeProgress = { minutes: 360 };
    const digitsElem = document.getElementById("time-digits");
    tl.to(
      timeProgress,
      {
        minutes: 660,
        duration: 3.8,
        ease: "power1.inOut",
        onUpdate: function () {
          if (!digitsElem) return;
          const total = Math.floor(timeProgress.minutes);
          const h = Math.floor(total / 60);
          const m = total % 60;
          const hStr = h < 10 ? "0" + h : "" + h;
          const mStr = m < 10 ? "0" + m : "" + m;
          digitsElem.textContent = hStr + ":" + mStr;
        }
      },
      0.8
    );

    // 6. Prison Cell & Silhouette entrance (0.9s - 1.2s)
    tl.fromTo(
      "#cell-container",
      { y: 40, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
      0.9
    );
    tl.fromTo(
      ".prison-bar",
      { scaleY: 0 },
      { scaleY: 1, duration: 0.5, stagger: 0.035, ease: "power2.out", transformOrigin: "center top" },
      1.05
    );
    tl.fromTo(
      "#prisoner-group",
      { scale: 0.9, opacity: 0, y: 20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.75, ease: "power3.out" },
      1.2
    );

    // 7. Overlay 1: GIỚI HẠN 11:00 SÁNG (2.4s = atMs 12240)
    tl.fromTo(
      "#badge-deadline",
      { scale: 0.88, opacity: 0, y: 20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      2.4
    );
    tl.fromTo(
      "#clock-11-ping",
      { scale: 0.5, opacity: 1 },
      { scale: 2.4, opacity: 0, duration: 0.85, ease: "power2.out", transformOrigin: "120px 54px" },
      2.45
    );

    // 8. Overlay 2: KHÔNG GIAN NÍN THỞ (4.37s = atMs 14210)
    tl.fromTo(
      "#badge-silence",
      { scale: 0.88, opacity: 0, y: 20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      4.37
    );
    tl.fromTo(
      "#sound-meter",
      { y: 20, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      4.45
    );
    tl.fromTo(
      "#flatline-path",
      { strokeDashoffset: 420 },
      { strokeDashoffset: 0, duration: 0.85, ease: "power1.inOut" },
      4.5
    );

    // Register single paused timeline
    window.__timelines["scene-s02"] = tl;
  </script>

    </template>
  </body>
</html>
