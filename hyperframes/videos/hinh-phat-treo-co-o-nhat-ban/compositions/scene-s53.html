<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #141414;
      margin: 0;
      padding: 0;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
    }
    .clip {
      position: absolute;
      inset: 0;
    }
    #video-wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }
    #vid-13 {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Spotlight vignette theo style DNA */
    #vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, rgba(20, 20, 20, 0) 35%, rgba(20, 20, 20, 0.42) 75%, rgba(20, 20, 20, 0.72) 100%);
      z-index: 5;
    }
    /* Thanh cam đáy cố định nhận diện thương hiệu */
    #bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 999;
    }
    /* Khung chứa các lớp chữ nằm trên video */
    .overlay-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }
    /* Tấm nền mực đặc bảo đảm tương phản WCAG 16.8:1 đè lên video */
    .text-card {
      position: absolute;
      background-color: #141414;
      color: #F7F4EC;
      font-weight: 900;
      font-size: 64px;
      line-height: 1.34;
      text-align: center;
      padding: 26px 48px;
      border-radius: 16px;
      border: 4px solid #FF6A1A;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      max-width: 920px;
      opacity: 0;
      transform-origin: center center;
    }
  </style>

  <div id="root" data-composition-id="scene-s53" data-width="1080" data-height="1920" data-duration="9.78">
    <!-- Wrapper bọc video để thực hiện transitionIn (grow) và cameraMotion (zoom-in) -->
    <div id="video-wrapper">
      <video
        id="vid-13"
        src="assets/vid-13-miniature-city-prison-bars.mp4"
        muted
        playsinline
        data-start="0"
        data-duration="9.78"
        data-media-start="0">
      </video>
    </div>

    <!-- Spotlight vignette đặc trưng của cảnh kết luận/hậu quả -->
    <div id="vignette"></div>

    <!-- Thanh cam đáy cố định 12px -->
    <div id="bottom-bar"></div>

    <!-- Section chứa overlay chữ của shot -->
    <section id="shot-1" class="clip" data-start="0" data-duration="9.78">
      <div class="overlay-stage">
        <div id="overlay-1" class="text-card">CÁI GIÁ SAU SONG SẮT</div>
        <div id="overlay-2" class="text-card">THƯỢNG TÔN PHÁP LUẬT</div>
      </div>
    </section>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // TransitionIn: grow (scale từ 0.88 lên 1.0 kèm fade in)
    tl.fromTo("#video-wrapper",
      { scale: 0.88, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.65, ease: "power3.out" },
      0
    );

    // CameraMotion: zoom-in tiếp diễn suốt thời lượng shot (từ 0.65s đến 9.78s)
    tl.fromTo("#video-wrapper",
      { scale: 1.0 },
      { scale: 1.12, duration: 9.13, ease: "none" },
      0.65
    );

    // Overlay 1: "CÁI GIÁ SAU SONG SẮT" (type: punch-phrase, atSec: 0.76s, holdMs: 3200ms -> kết thúc 3.96s)
    tl.fromTo("#overlay-1",
      { scale: 0.82, opacity: 0, y: 32 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.76
    );
    tl.fromTo("#overlay-1",
      { opacity: 1, y: 0, scale: 1 },
      { opacity: 0, y: -20, scale: 0.96, duration: 0.28, ease: "power2.in" },
      3.96
    );

    // Overlay 2: "THƯỢNG TÔN PHÁP LUẬT" (type: quote, atSec: 4.76s, holdMs: 4800ms -> kết thúc 9.56s)
    tl.fromTo("#overlay-2",
      { scale: 0.82, opacity: 0, y: 32 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      4.76
    );
    tl.fromTo("#overlay-2",
      { opacity: 1 },
      { opacity: 0, duration: 0.18, ease: "power2.in" },
      9.56
    );

    window.__timelines["scene-s53"] = tl;
  </script>

    </template>
  </body>
</html>
