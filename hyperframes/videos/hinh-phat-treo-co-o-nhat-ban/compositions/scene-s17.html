      <div id="punch-phrase-clip" class="clip" data-start="5.25" data-duration="1.75" data-track-index="3">
        <div class="punch-center-box">

    <script>
      // 1. Khởi tạo timeline paused duy nhất theo composition contract
      const tl = gsap.timeline({ paused: true });

      // 2. Thiết lập hình học nét vẽ SVG Enso (svg-path-draw)
      const ensoMain = document.getElementById("enso-main-stroke");
      const ensoTail = document.getElementById("enso-brush-tail");
      const ensoOuter = document.getElementById("enso-outer-ring");

      const lenMain = ensoMain && ensoMain.getTotalLength ? ensoMain.getTotalLength() : 1350;
      ensoMain.style.strokeDasharray = lenMain + " " + lenMain;
      ensoMain.style.strokeDashoffset = lenMain;

      const lenTail = ensoTail && ensoTail.getTotalLength ? ensoTail.getTotalLength() : 380;
      ensoTail.style.strokeDasharray = lenTail + " " + lenTail;
      ensoTail.style.strokeDashoffset = lenTail;

      const lenOuter = ensoOuter && ensoOuter.getTotalLength ? ensoOuter.getTotalLength() : 1600;
      ensoOuter.style.strokeDasharray = lenOuter + " " + lenOuter;
      ensoOuter.style.strokeDashoffset = lenOuter;

      // Các tia nứt rạn SVG Cracks
      const crackPaths = [
        document.getElementById("crack-1"),
        document.getElementById("crack-2"),
        document.getElementById("crack-3"),
        document.getElementById("crack-4")
      ];
      crackPaths.forEach((cp) => {
        if (cp) {
          const l = cp.getTotalLength ? cp.getTotalLength() : 300;
          cp.style.strokeDasharray = l + " " + l;
          cp.style.strokeDashoffset = l;
        }
      });

      // 3. Chuẩn bị toạ độ tất định cho 18 mảnh vỡ nổ tung (r = 215px từ tâm 540, 660)
      const shardData = [];
      for (let i = 0; i < 18; i++) {
        const el = document.getElementById("shard-" + i);
        if (el) {
          const angle = (i / 18) * Math.PI * 2;
          const radius = 215;
          const startX = Math.cos(angle) * radius;
          const startY = Math.sin(angle) * radius;
          shardData.push({
            el: el,
            startX: startX,
            startY: startY,
            angle: angle,
            spreadDist: 340 + ((i * 47) % 250),
            spinDeg: ((i * 71) % 540) - 270,
            scaleTarget: 0.25 + ((i * 11) % 4) * 0.15
          });
          gsap.set(el, { x: startX, y: startY, scale: 1, opacity: 0 });
        }
      }

      // 4. Xây dựng diễn tiến Timeline

      // (A) CAMERA MOTION: Zoom-in nhẹ tạo sức ép thời gian
      tl.fromTo(
        "#zen-camera-frame",
        { scale: 1.0 },
        { scale: 1.06, duration: 5.0, ease: "none" },
        0.0
      );

      // (B) GIAI ĐOẠN 1 (0.0s - 3.1s): Trạng thái thiền định tĩnh lặng
      tl.fromTo(
        "#context-tag",
        { y: -25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.2
      );

      tl.to(
        "#enso-outer-ring",
        { strokeDashoffset: 0, duration: 1.2, ease: "power2.out" },
        0.3
      );
      tl.to(
        "#enso-main-stroke",
        { strokeDashoffset: 0, duration: 1.4, ease: "power2.out" },
        0.4
      );
      tl.to(
        "#enso-brush-tail",
        { strokeDashoffset: 0, duration: 0.8, ease: "power1.out" },
        1.1
      );

      tl.fromTo(
        "#zen-core",
        { scale: 0.85, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.6
      );

      // Bộ đếm thời gian: chạy từ 00.00s đến 03.24s (chỉ vài giây ngắn ngủi)
      const timerState = { sec: 0.0 };
      const timerEl = document.getElementById("timer-display");
      tl.to(
        timerState,
        {
          sec: 3.24,
          duration: 2.8,
          ease: "power1.inOut",
          onUpdate: () => {
            if (timerEl) {
              const val = timerState.sec.toFixed(2);
              timerEl.textContent = (timerState.sec < 10 ? "0" : "") + val + "s";
            }
          }
        },
        0.6
      );

      tl.fromTo(
        "#pulse-path",
        { strokeDasharray: 300, strokeDashoffset: 300 },
        { strokeDashoffset: 0, duration: 1.4, ease: "power2.out" },
        0.8
      );

      // (C) GIAI ĐOẠN 2 (3.1s - 4.7s): Xuất hiện nhãn "VÀI GIÂY TĨNH LẶNG" & Rạn nứt
      tl.fromTo(
        "#overlay-label-card",
        { scale: 0.85, y: 30, opacity: 0 },
        { scale: 1.0, y: 0, opacity: 1, duration: 0.3, ease: "power3.out" },
        3.1
      );

      // Cảnh báo áp lực quá tải: phóng to timer và đổi trạng thái
      tl.to(
        "#timer-display",
        { scale: 1.1, duration: 0.35, ease: "power2.out" },
        3.4
      );
      tl.set(
        "#state-text",
        { textContent: "ÁP LỰC QUÁ TẢI" },
        3.4
      );
      tl.to(
        "#state-badge",
        { borderColor: "#FF6A1A", duration: 0.3 },
        3.4
      );

      // Các tia nứt cam rạch toác vành đai Enso
      tl.to("#crack-1", { strokeDashoffset: 0, duration: 0.45, ease: "power2.in" }, 3.5);
      tl.to("#crack-2", { strokeDashoffset: 0, duration: 0.5, ease: "power2.in" }, 3.7);
      tl.to("#crack-3", { strokeDashoffset: 0, duration: 0.45, ease: "power2.in" }, 3.9);
      tl.to("#crack-4", { strokeDashoffset: 0, duration: 0.5, ease: "power2.in" }, 4.1);

      // Rung rinh chấn động trước khi vỡ
      tl.to(
        "#zen-diagram",
        { x: -6, duration: 0.08, repeat: 5, yoyo: true, ease: "sine.inOut" },
        4.35
      );

      // Thu gọn nhãn label trước khi hết clip lúc 4.7s
      tl.to(
        "#overlay-label-card",
        { scale: 0.9, y: -25, opacity: 0, duration: 0.25, ease: "power2.in" },
        4.4
      );

      // (D) GIAI ĐOẠN 3 (5.0s - 7.0s): SHATTER FX & PUNCH PHRASE
      // Sóng chấn động shockwave cam bung nở từ tâm
      tl.fromTo(
        "#shockwave-ring",
        { r: 10, strokeWidth: 16, opacity: 1 },
        { r: 420, strokeWidth: 2, opacity: 0, duration: 0.55, ease: "power2.out" },
        5.0
      );

      // Rung chấn giật mạnh camera
      tl.to("#shatter-container", { x: -16, y: 12, duration: 0.05 }, 5.0);
      tl.to("#shatter-container", { x: 14, y: -10, duration: 0.05 }, 5.05);
      tl.to("#shatter-container", { x: -8, y: 6, duration: 0.05 }, 5.10);
      tl.to("#shatter-container", { x: 0, y: 0, duration: 0.08 }, 5.15);

      // 18 mảnh vỡ nổ tung tỏa ra các góc
      shardData.forEach((item) => {
        const destX = item.startX + Math.cos(item.angle) * item.spreadDist;
        const destY = item.startY + Math.sin(item.angle) * item.spreadDist;

        tl.set(item.el, { opacity: 1, x: item.startX, y: item.startY }, 5.0);
        tl.to(
          item.el,
          {
            x: destX,
            y: destY,
            rotation: item.spinDeg,
            scale: item.scaleTarget,
            opacity: 0,
            duration: 1.15,
            ease: "power3.out"
          },
          5.01
        );
      });

      // 5.25s: PUNCH PHRASE "THIỀN ĐỊNH SỤP ĐỔ" giáng xuống đanh thép
      tl.fromTo(
        "#punch-phrase-card",
        { scale: 1.25, opacity: 0, y: 30 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.5, ease: "power4.out" },
        5.25
      );

      // 5. Đăng ký timeline duy nhất cho HyperFrames runtime
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s17"] = tl;
    </script>
  
    </template>
  </body>
