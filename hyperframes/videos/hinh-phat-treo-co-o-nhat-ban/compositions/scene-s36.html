<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #F5F0E4;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #F5F0E4;
      overflow: hidden;
    }
    .clip {
      position: absolute;
      inset: 0;
    }
    #brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
    #shot-stage {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .media-card {
      position: absolute;
      left: 70px;
      top: 200px;
      width: 940px;
      height: 1140px;
      border-radius: 20px;
      border: 4px solid #141414;
      background-color: #141414;
      box-shadow: 0 20px 40px rgba(20, 20, 20, 0.14);
      overflow: hidden;
    }
    .media-wrapper {
      position: absolute;
      left: -60px;
      top: 0;
      width: 1060px;
      height: 100%;
      will-change: transform;
    }
    .media-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .doc-badge {
      position: absolute;
      top: 250px;
      left: 110px;
      z-index: 10;
      background-color: #141414;
      color: #F7F4EC;
      padding: 18px 28px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      will-change: transform, opacity;
    }
    .doc-badge span {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 42px;
      line-height: 1.2;
      letter-spacing: 1px;
      color: #F7F4EC;
    }
    .stamp-badge {
      position: absolute;
      top: 380px;
      left: 110px;
      z-index: 20;
      background-color: #FF6A1A;
      color: #141414;
      border: 5px solid #141414;
      border-radius: 8px;
      padding: 14px 28px;
      box-shadow: 0 12px 28px rgba(20, 20, 20, 0.25);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      will-change: transform, opacity;
    }
    .stamp-badge span {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 38px;
      line-height: 1.2;
      letter-spacing: 2px;
      color: #141414;
    }
  </style>

  <div id="root" data-composition-id="scene-s36" data-width="1080" data-height="1920" data-duration="7.84">
    <div id="brand-bar"></div>

    <section id="shot-1" class="clip" data-start="0" data-duration="7.84">
      <div id="shot-stage">
        <div class="media-card">
          <div id="media-wrapper" class="media-wrapper">
            <img src="assets/img-05-transitional-ward-rehabilitation-inmates.jpg" alt="Phạm nhân nghiên cứu tài liệu">
          </div>
        </div>

        <div id="overlay-doc" class="doc-badge">
          <span>TÂM LÝ TỘI PHẠM</span>
        </div>

        <div id="overlay-stamp" class="stamp-badge">
          <span>ĐỊNH HÌNH TƯ DUY</span>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Transition In (rise): shot stage slides up into position
    tl.fromTo("#shot-stage", 
      { y: 80, opacity: 0 }, 
      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 
      0
    );

    // Camera motion (pan-left): viewport pans left = image content shifts right (x increases)
    tl.fromTo("#media-wrapper", 
      { x: -80 }, 
      { x: 30, duration: 7.4, ease: "none" }, 
      0
    );

    // Overlay 1: Document card entrance at 1.1s (holdMs: 3000ms)
    tl.fromTo("#overlay-doc", 
      { scale: 0.88, opacity: 0, y: 20 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 
      1.1
    );

    // Overlay 2: Stamp slam entrance at 5.1s (holdMs: 2600ms)
    tl.fromTo("#overlay-stamp", 
      { opacity: 0, scale: 1.4, rotation: -12 }, 
      { opacity: 1, scale: 1, rotation: -3, duration: 0.28, ease: "power4.out" }, 
      5.1
    );

    window.__timelines["scene-s36"] = tl;
  </script>

    </template>
  </body>
</html>
