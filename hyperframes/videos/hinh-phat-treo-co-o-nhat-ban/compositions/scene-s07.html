<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #141414;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #E7E3D9;
      overflow: hidden;
    }

    /* Nền spotlight: vignette tối theo token DNA */
    .bg-spotlight {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, #F5F0E4 15%, #E7E3D9 48%, rgba(20, 20, 20, 0.38) 100%);
      pointer-events: none;
    }

    /* Thanh cam thương hiệu cố định ở đáy khung hình */
    .brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Timed clip tracks theo contract */
    .clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
      perspective: 1200px;
    }

    /* Khung card giới hạn trong safe zone y: 160–1390 */
    .card-frame {
      position: absolute;
      top: 190px;
      left: 60px;
      width: 960px;
      height: 1140px;
      border-radius: 14px;
      overflow: hidden;
      background-color: #141414;
      border: 2px solid rgba(20, 20, 20, 0.6);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.42), 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    /* Wrapper bọc media không mang data-start để GSAP animate camera zoom/pan */
    .media-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .media-wrapper-pan {
      position: absolute;
      top: 0;
      left: 0;
      width: 120%;
      height: 100%;
    }

    .scene-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Nhãn annotated trên tấm nền đặc .hf-plate-ink đảm bảo độ tương phản WCAG */
    .annotation-badge {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      padding: 16px 26px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
      pointer-events: none;
    }

    .badge-accent {
      width: 8px;
      height: 32px;
      background-color: #FF6A1A;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .badge-text {
      font-weight: 900;
      font-size: 34px;
      line-height: 1.1;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #F7F4EC;
      white-space: nowrap;
    }

    /* Vị trí neo cho từng nhãn trong vùng an toàn */
    #overlay-1 {
      position: absolute;
      left: 100px;
      top: 1210px;
      z-index: 10;
      opacity: 0;
    }

    #overlay-2 {
      position: absolute;
      left: 100px;
      top: 380px;
      z-index: 10;
      opacity: 0;
    }
  </style>

  <div id="root" data-composition-id="scene-s07" data-width="1080" data-height="1920" data-duration="11">
    <!-- Nền spotlight cảnh báo -->
    <div class="bg-spotlight" aria-hidden="true"></div>

    <!-- Shot 1: Cận cảnh cánh cửa sập ô vuông đỏ -->
    <section id="shot-1" class="clip" data-start="0" data-duration="7">
      <div id="shot-1-frame" class="card-frame">
        <div id="shot-1-media" class="media-wrapper">
          <img class="scene-media" src="assets/img-16-dark-trapdoor-cellar-cutout.jpg" alt="" />
        </div>
      </div>
      <div id="overlay-1" class="hf-plate-ink annotation-badge">
        <div class="badge-accent"></div>
        <span class="badge-text">Ô VUÔNG MÀU ĐỎ</span>
      </div>
    </section>

    <!-- Shot 2: Cận cảnh tử tù dưới dây thòng lọng -->
    <section id="shot-2" class="clip" data-start="7" data-duration="4">
      <div id="shot-2-frame" class="card-frame">
        <div id="shot-2-media" class="media-wrapper-pan">
          <img class="scene-media" src="assets/img-07-death-penalty-gallows-prisoner.jpg" alt="" />
        </div>
      </div>
      <div id="overlay-2" class="hf-plate-ink annotation-badge">
        <div class="badge-accent"></div>
        <span class="badge-text">DÂY THỪNG SIẾT CHẶT</span>
      </div>
    </section>

    <!-- Dải cam đáy thương hiệu cố định -->
    <div class="brand-bar" aria-hidden="true"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // === SHOT 1 (0.0s -> 7.0s) ===
    // Peel transition vào cảnh: lật nhẹ góc từ trái và zoom vào vị trí
    tl.fromTo(
      "#shot-1-frame",
      { rotationY: -16, rotationX: 8, scale: 0.94, opacity: 0, transformOrigin: "0% 50%" },
      { rotationY: 0, rotationX: 0, scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
      0
    );

    // Camera zoom-in chậm dẫn mắt vào tâm ô vuông đỏ dưới sàn hầm
    tl.fromTo(
      "#shot-1-media",
      { scale: 1.04, transformOrigin: "50% 68%" },
      { scale: 1.30, duration: 7.0, ease: "none" },
      0
    );

    // Overlay 1: "Ô VUÔNG MÀU ĐỎ" (xuất hiện tại 3.56s = atMs 51800 - 48240, giữ 3.2s)
    tl.fromTo(
      "#overlay-1",
      { scale: 0.85, opacity: 0, y: 15 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      3.56
    );
    tl.fromTo(
      "#overlay-1",
      { opacity: 1 },
      { opacity: 0, duration: 0.2, ease: "power2.in" },
      6.76
    );

    // === SHOT 2 (7.0s -> 11.0s) ===
    // Chuyển cảnh cut tự nhiên qua ranh giới clip; camera pan-right (nội dung dịch sang trái: x giảm dần)
    tl.fromTo(
      "#shot-2-media",
      { x: 0, scale: 1.15, transformOrigin: "50% 50%" },
      { x: -110, scale: 1.15, duration: 4.0, ease: "none" },
      7.0
    );

    // Overlay 2: "DÂY THỪNG SIẾT CHẶT" (xuất hiện tại 7.96s = atMs 56200 - 48240, giữ 2.9s)
    tl.fromTo(
      "#overlay-2",
      { scale: 0.85, opacity: 0, y: 15 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      7.96
    );
    tl.fromTo(
      "#overlay-2",
      { opacity: 1 },
      { opacity: 0, duration: 0.2, ease: "power2.in" },
      10.75
    );

    // Đăng ký timeline paused vào window.__timelines["scene-s07"]
    window.__timelines["scene-s07"] = tl;
  </script>

    </template>
  </body>
</html>
