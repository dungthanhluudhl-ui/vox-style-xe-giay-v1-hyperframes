<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      overflow: hidden;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Video container (non-timed wrappers for safe GSAP camera control) */
    #video-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 10;
    }

    #video-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    #video-pan {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
    }

    #main-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Overlay container */
    #overlay-layer {
      z-index: 20;
      pointer-events: none;
    }

    .overlay-center-box {
      position: absolute;
      top: 260px;
      left: 0;
      width: 1080px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .overlay-plate {
      position: absolute;
      background-color: #141414;
      border-radius: 14px;
      padding: 24px 44px 20px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      border-left: 6px solid #FF6A1A;
      opacity: 0;
      will-change: transform, opacity;
    }

    .overlay-title {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 50px;
      line-height: 1.25;
      letter-spacing: 0.03em;
      color: #F7F4EC;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background-color: rgba(247, 244, 236, 0.2);
      border-radius: 3px;
      margin-top: 16px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background-color: #FF6A1A;
      border-radius: 3px;
    }

    /* Persistent brand bottom bar */
    #brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s27" data-width="1080" data-height="1920" data-duration="5">
    <!-- Non-timed video viewport and camera wrapper hierarchy -->
    <div id="video-viewport">
      <div id="video-stage">
        <div id="video-pan">
          <video
            id="main-video"
            src="assets/vid-07-prison-inmates-roll-call.mp4"
            muted
            playsinline
            data-start="0"
            data-duration="5"
            data-media-start="1.5"
          ></video>
        </div>
      </div>
    </div>

    <!-- Timed overlays layer -->
    <div id="overlay-layer" class="clip" data-start="0" data-duration="5">
      <div class="overlay-center-box">
        <!-- Overlay 1: Timeline beat -->
        <div id="overlay-1" class="overlay-plate">
          <span class="overlay-title">5 PHÚT VỆ SINH</span>
          <div class="progress-track">
            <div id="progress-1" class="progress-fill"></div>
          </div>
        </div>

        <!-- Overlay 2: Label beat -->
        <div id="overlay-2" class="overlay-plate">
          <span class="overlay-title">QUỲ GỐI ĐIỂM DANH</span>
          <div class="progress-track">
            <div id="progress-2" class="progress-fill"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Fixed 12px bottom brand bar -->
    <div id="brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Transition In (rise): video stage enters smoothly
    tl.fromTo(
      "#video-stage",
      { y: 80, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
      0
    );

    // Camera motion (pan-left): viewport moves left -> footage translates rightward (positive x)
    tl.fromTo(
      "#video-pan",
      { x: -55, scale: 1.12 },
      { x: 55, scale: 1.12, duration: 5.0, ease: "none" },
      0
    );

    // Overlay 1: "5 PHÚT VỆ SINH" (atMs: 212500 -> 0.26s, holdMs: 2200ms -> ends at ~2.46s)
    tl.fromTo(
      "#overlay-1",
      { opacity: 0, scale: 0.86, y: 24 },
      { opacity: 1, scale: 1, y: 0, duration: 0.38, ease: "power3.out" },
      0.26
    );
    tl.to(
      "#progress-1",
      { width: "100%", duration: 1.95, ease: "none" },
      0.35
    );
    tl.fromTo(
      "#overlay-1",
      { opacity: 1, scale: 1, y: 0 },
      { opacity: 0, scale: 0.94, y: -12, duration: 0.20, ease: "power2.in" },
      2.30
    );

    // Overlay 2: "QUỲ GỐI ĐIỂM DANH" (atMs: 214800 -> 2.56s, holdMs: 2300ms -> ends at ~4.86s)
    tl.fromTo(
      "#overlay-2",
      { opacity: 0, scale: 0.86, y: 24 },
      { opacity: 1, scale: 1, y: 0, duration: 0.38, ease: "power3.out" },
      2.56
    );
    tl.to(
      "#progress-2",
      { width: "100%", duration: 2.05, ease: "none" },
      2.65
    );
    tl.fromTo(
      "#overlay-2",
      { opacity: 1, scale: 1, y: 0 },
      { opacity: 0, scale: 0.94, y: -12, duration: 0.20, ease: "power2.in" },
      4.70
    );

    // Register paused timeline to runtime
    window.__timelines["scene-s27"] = tl;
  </script>

    </template>
  </body>
</html>
