      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #E7E3D9;
      overflow: hidden;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Nền chart: 4 đường kẻ ngang tỉ lệ và vạch cam mép trái */
    .chart-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .chart-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background-color: rgba(20, 20, 20, 0.28);
    }

    .chart-line.line-1 { top: 384px; }
    .chart-line.line-2 { top: 768px; }
    .chart-line.line-3 { top: 1152px; }
    .chart-line.line-4 { top: 1536px; }

    .chart-tick {
      position: absolute;
      left: 0;
      width: 28px;
      height: 6px;
      background-color: #FF6A1A;
      transform: translateY(-2px);
    }

    /* Thanh cam thương hiệu cố định mép đáy */
    .brand-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Thẻ hồ sơ pháp đình (dossier card) */
    #dossier-card {
      position: absolute;
      left: 70px;
      right: 70px;
      top: 210px;
      height: 1120px;
      background-color: #F5F0E4;
      border: 4px solid #141414;
      box-shadow: 18px 18px 0px rgba(20, 20, 20, 0.15);
      padding: 50px 45px;
      display: flex;
      flex-direction: column;
      transform-origin: top left;
      z-index: 10;
    }

    /* Tem đóng dấu hồ sơ: TIÊU CHUẨN NAGAYAMA */
    #stamp-box {
      width: 100%;
      height: 120px;
      background-color: #FF6A1A;
      border: 4px solid #141414;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 8px 8px 0px #141414;
      transform-origin: center center;
      margin-bottom: 45px;
    }

    .stamp-text {
      font-size: 52px;
      font-weight: 900;
      color: #141414;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.2;
    }

    /* Danh sách 9 tiêu chí tượng trưng trên hồ sơ */
    #criteria-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
    }

    .criterion-row {
      display: flex;
      align-items: center;
      gap: 20px;
      height: 28px;
    }

    .marker-box {
      width: 26px;
      height: 26px;
      border: 3px solid #141414;
      background-color: transparent;
      flex-shrink: 0;
    }

    .criterion-bar-wrap {
      flex: 1;
      height: 14px;
      background-color: rgba(20, 20, 20, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .criterion-bar {
      width: 100%;
      height: 100%;
      background-color: rgba(20, 20, 20, 0.25);
    }

    /* Khối số liệu & thanh đo: 9 TIÊU CHÍ NGHIÊM NGẶT */
    #data-card {
      margin-top: auto;
      background-color: #141414;
      border: 4px solid #FF6A1A;
      box-shadow: 10px 10px 0px rgba(20, 20, 20, 0.2);
      padding: 34px 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      transform-origin: center center;
    }

    .data-text {
      font-size: 52px;
      font-weight: 900;
      color: #F7F4EC;
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .progress-track {
      width: 100%;
      height: 16px;
      background-color: rgba(247, 244, 236, 0.2);
      border: 2px solid #141414;
      overflow: hidden;
    }

    #progress-fill {
      width: 0%;
      height: 100%;
      background-color: #FF6A1A;
    }
  </style>

  <div id="root" data-composition-id="scene-s19" data-width="1080" data-height="1920" data-duration="7">
    <!-- Nền chart kẻ ngang có vạch cam mép trái -->
    <div class="chart-grid">
      <div class="chart-line line-1"><div class="chart-tick"></div></div>
      <div class="chart-line line-2"><div class="chart-tick"></div></div>
      <div class="chart-line line-3"><div class="chart-tick"></div></div>
      <div class="chart-line line-4"><div class="chart-tick"></div></div>
    </div>

    <!-- Shot S19-1 -->
    <section id="shot-1" class="clip" data-start="0" data-duration="7">
      <div id="dossier-card">
        <!-- Overlay 1: document -->
        <div id="stamp-box">
          <div class="stamp-text">TIÊU CHUẨN NAGAYAMA</div>
        </div>

        <!-- 9 vạch slot biểu thị danh sách tiêu chí khắt khe -->
        <div id="criteria-list">
          <div class="criterion-row">
            <div class="marker-box"></div>
            <div class="criterion-bar-wrap"><div class="criterion-bar" style="width: 85%;"></div></div>
          </div>
          <div class="criterion-row">
            <div class="marker-box"></div>
            <div class="criterion-bar-wrap"><div class="criterion-bar" style="width: 92%;"></div></div>
          </div>
          <div class="criterion-row">
            <div class="marker-box"></div>
            <div class="criterion-bar-wrap"><div class="criterion-bar" style="width: 78%;"></div></div>
          </div>
          <div class="criterion-row">
            <div class="marker-box"></div>
            <div class="criterion-bar-wrap"><div class="criterion-bar" style="width: 96%;"></div></div>
          </div>
          <div class="criterion-row">
            <div class="marker-box"></div>
            <div class="criterion-bar-wrap"><div class="criterion-bar" style="width: 70%;"></div></div>
          </div>
          <div class="criterion-row">
            <div class="marker-box"></div>
            <div class="criterion-bar-wrap"><div class="criterion-bar" style="width: 88%;"></div></div>
          </div>
          <div class="criterion-row">
            <div class="marker-box"></div>
            <div class="criterion-bar-wrap"><div class="criterion-bar" style="width: 82%;"></div></div>
          </div>
          <div class="criterion-row">
            <div class="marker-box"></div>
            <div class="criterion-bar-wrap"><div class="criterion-bar" style="width: 90%;"></div></div>
          </div>
          <div class="criterion-row">
            <div class="marker-box"></div>
            <div class="criterion-bar-wrap"><div class="criterion-bar" style="width: 74%;"></div></div>
          </div>
        </div>

        <!-- Overlay 2: data -->
        <div id="data-card">
          <div class="data-text">9 TIÊU CHÍ NGHIÊM NGẶT</div>
          <div class="progress-track">
            <div id="progress-fill"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Thanh cam đáy cố định nhận diện thương hiệu -->
    <div class="brand-bottom-bar"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. Vào cảnh: Peel transition bóc mở thẻ hồ sơ từ góc
    tl.fromTo(
      "#dossier-card",
      {
        clipPath: "polygon(0% 0%, 0% 0%, 0% 100%, 0% 100%)",
        rotation: -4,
        scale: 0.94,
        opacity: 0
      },
      {
        clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)",
        rotation: 0,
        scale: 1,
        opacity: 1,
        duration: 0.65,
        ease: "power3.out"
      },
      0.05
    );

    // 2. Overlay 1 (atMs: 147000 -> 0.76s): Stamp slam "TIÊU CHUẨN NAGAYAMA"
    tl.fromTo(
      "#stamp-box",
      {
        opacity: 0,
        scale: 1.45,
        rotation: -9
      },
      {
        opacity: 1,
        scale: 1,
        rotation: -1.5,
        duration: 0.32,
        ease: "power4.out"
      },
      0.76
    );

    // 3. Danh sách các tiêu chí hiện so le sau khi đóng dấu
    tl.fromTo(
      ".criterion-row",
      {
        opacity: 0,
        x: -24
      },
      {
        opacity: 1,
        x: 0,
        duration: 0.28,
        stagger: 0.05,
        ease: "power2.out"
      },
      1.1
    );

    // 4. Overlay 2 (atMs: 150500 -> 4.26s): Card dữ liệu "9 TIÊU CHÍ NGHIÊM NGẶT"
    tl.fromTo(
      "#data-card",
      {
        opacity: 0,
        scale: 0.88,
        y: 35
      },
      {
        opacity: 1,
        scale: 1,
        y: 0,
        duration: 0.45,
        ease: "power3.out"
      },
      4.26
    );

    // 5. Thanh tiến trình chạy đầy và kích hoạt từng tiêu chí
    tl.fromTo(
      "#progress-fill",
      { width: "0%" },
      {
        width: "100%",
        duration: 1.3,
        ease: "power2.out"
      },
      4.4
    );

    tl.fromTo(
      ".marker-box",
      { backgroundColor: "transparent", borderColor: "#141414" },
      {
        backgroundColor: "#FF6A1A",
        borderColor: "#FF6A1A",
        duration: 0.15,
        stagger: 0.12,
        ease: "power2.out"
      },
      4.4
    );

    tl.fromTo(
      ".criterion-bar",
      { backgroundColor: "rgba(20, 20, 20, 0.25)" },
      {
        backgroundColor: "#141414",
        duration: 0.15,
        stagger: 0.12,
        ease: "power2.out"
      },
      4.4
    );

    window.__timelines["scene-s19"] = tl;
  </script>
