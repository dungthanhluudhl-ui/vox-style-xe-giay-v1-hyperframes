<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Vùng chứa phối cảnh 3D cho hiệu ứng flip vào cảnh */
    #perspective-wrapper {
      position: absolute;
      inset: 0;
      perspective: 1200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #stage {
      position: absolute;
      top: 200px;
      left: 50px;
      width: 980px;
      height: 1160px;
      transform-origin: center center;
    }

    /* Bố cục chia đôi (Split layout) */
    .split-layout {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: stretch;
    }

    /* Pane trái: Khung chứa ảnh minh hoạ */
    .media-pane {
      position: relative;
      width: 475px;
      height: 100%;
      background-color: #141414;
      border: 4px solid #141414;
      border-radius: 12px;
      box-shadow: 10px 10px 0px #141414;
      overflow: hidden;
    }

    .media-zoom-box {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: center center;
    }

    .media-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
      display: block;
    }

    /* Pane phải: Khung chứa các thẻ nội dung */
    .content-pane {
      position: relative;
      width: 475px;
      height: 100%;
      background-color: #F5F0E4;
      border: 4px solid #141414;
      border-radius: 12px;
      box-shadow: 10px 10px 0px #141414;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 24px;
      gap: 36px;
    }

    /* Thẻ chữ trong pane phải - sử dụng nền mực đặc đảm bảo độ tương phản 16.8:1 */
    .state-card {
      width: 100%;
      background-color: #141414;
      border: 4px solid #141414;
      border-radius: 12px;
      box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.4);
      padding: 38px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    #state-2 {
      border-color: #FF6A1A;
    }

    .accent-bar-orange {
      width: 64px;
      height: 6px;
      background-color: #FF6A1A;
      border-radius: 3px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 38px;
      font-weight: 900;
      line-height: 1.28;
      color: #F7F4EC;
      text-align: center;
      word-break: keep-all;
    }

    /* Thanh cam nhận diện thương hiệu cố định mép đáy */
    #brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 999;
    }
  </style>

  <div id="root" data-composition-id="scene-s39" data-width="1080" data-height="1920" data-duration="9">
    <section id="shot-1" class="clip" data-start="0" data-duration="9">
      <div id="perspective-wrapper">
        <div id="stage">
          <div class="split-layout">
            <!-- Nửa bên trái: Khung media ảnh img-10 -->
            <div class="media-pane">
              <div id="media-zoom-box" class="media-zoom-box">
                <img
                  class="media-img"
                  src="assets/img-10-prison-interrogation-signing-document.jpg"
                  alt="Minh hoạ phỏng vấn và liên kết doanh nghiệp"
                >
              </div>
            </div>

            <!-- Nửa bên phải: Khối chữ gồm 2 nhãn xuất hiện tuần tự -->
            <div class="content-pane">
              <!-- Nhãn 1: LIÊN KẾT DOANH NGHIỆP -->
              <div id="state-1" class="state-card">
                <div class="accent-bar-orange"></div>
                <div class="card-title">LIÊN KẾT DOANH NGHIỆP</div>
              </div>

              <!-- Nhãn 2: PHỎNG VẤN TRỰC TIẾP -->
              <div id="state-2" class="state-card">
                <div class="accent-bar-orange"></div>
                <div class="card-title">PHỎNG VẤN TRỰC TIẾP</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Chữ ký thương hiệu: dải cam đáy 12px -->
    <div id="brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. Vào cảnh toàn bộ shot bằng hiệu ứng flip (transitionIn="flip")
    tl.fromTo("#stage",
      { rotationY: -45, opacity: 0 },
      { rotationY: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
      0
    );

    // 2. Chuyển động máy quay zoom-in chậm xuyên suốt shot trên wrapper media
    tl.fromTo("#media-zoom-box",
      { scale: 1.0 },
      { scale: 1.15, duration: 9.0, ease: "none" },
      0
    );

    // 3. Overlay 1: "LIÊN KẾT DOANH NGHIỆP" xuất hiện tại 0.76s (314000 - 313240 = 760ms)
    tl.fromTo("#state-1",
      { opacity: 0, scale: 0.85, y: 30 },
      { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.76
    );

    // 4. Overlay 2: "PHỎNG VẤN TRỰC TIẾP" xuất hiện tại 4.76s (318000 - 313240 = 4760ms)
    tl.fromTo("#state-2",
      { opacity: 0, scale: 0.85, y: 30 },
      { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" },
      4.76
    );

    // 5. Kết thúc hiển thị của cả hai nhãn tại 8.70s trước khi hết shot (9.0s)
    tl.fromTo(["#state-1", "#state-2"],
      { opacity: 1 },
      { opacity: 0, duration: 0.22, ease: "power2.in" },
      8.70
    );

    // Đăng ký timeline cho HyperFrames runtime
    window.__timelines["scene-s39"] = tl;
  </script>

    </template>
  </body>
</html>
