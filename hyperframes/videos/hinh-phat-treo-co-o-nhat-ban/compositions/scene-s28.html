    * {

      padding: 0;
    }
    body {
      background-color: #141414;
      display: flex;
      justify-content: center;

      min-height: 100vh;
      overflow: hidden;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #F5F0E4;
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
    }
    .clip {
      position: absolute;
      inset: 0;
    }
    .stage-container {
      position: absolute;
      inset: 0;
      transform-origin: center center;
    }
    .media-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .media-wrapper {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      transform-origin: center center;
    }
    .hero-image {

      object-position: center center;

    .overlay-badge-top {
      position: absolute;
      left: 0;
      right: 0;
      top: 260px;
      margin-left: auto;
      margin-right: auto;
      width: fit-content;
      max-width: 920px;
      padding: 18px 38px;
      border-radius: 8px;
      border-left: 8px solid #FF6A1A;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.42);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;

    }
    .overlay-badge-bottom {
      position: absolute;
      left: 0;

      margin-left: auto;
      margin-right: auto;
      width: fit-content;
      max-width: 920px;
      padding: 18px 38px;
      border-radius: 8px;
      border-left: 8px solid #FF6A1A;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.42);

  <div id="root" data-composition-id="scene-s28" data-width="1080" data-height="1920" data-duration="11">
    <section id="shot-1" class="clip" data-start="0" data-duration="11">
      <div id="shot-stage" class="stage-container">
        <div class="media-viewport">
          <div id="media-wrapper" class="media-wrapper">
            <img class="hero-image" src="assets/img-15-saga-prison-meal-tray.jpg" alt="Saga prison meal tray">
          </div>
        </div>

        <div id="overlay-1" class="overlay-badge-top hf-plate-ink">
          <span class="badge-text">KHẨU PHẦN ĐỒNG NHẤT</span>
        </div>

        <div id="overlay-2" class="overlay-badge-bottom hf-plate-ink">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Shot 1 entrance: wobble-drop transition (settles by t=0.5s)
    tl.fromTo(
      "#shot-stage",
      { y: -80, rotation: 1.5, opacity: 0 },
      { y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "back.out(1.2)" },
      0
    );

    // Camera motion: continuous zoom-out across the shot duration
    tl.fromTo(
      "#media-wrapper",
      { scale: 1.15 },
      { scale: 1.0, duration: 11, ease: "none" },
      0
    );

    // Overlay 1: "KHẨU PHẦN ĐỒNG NHẤT" (atMs: 218500 -> 1.26s, holdMs: 3500)
    tl.fromTo(
      "#overlay-1",
      { scale: 0.85, y: 20, opacity: 0 },
      { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      1.26
    );
    tl.fromTo(
      "#overlay-1",
      { opacity: 1, scale: 1, y: 0 },
      { opacity: 0, scale: 0.96, y: -10, duration: 0.28, ease: "power2.in" },
      4.85
    );

    // Overlay 2: "CƠM • SÚP • TRÀ" (atMs: 224500 -> 7.26s, holdMs: 3500)
    tl.fromTo(
      "#overlay-2",
      { scale: 0.85, y: 20, opacity: 0 },
      { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      7.26
    );
    tl.fromTo(
      "#overlay-2",
      { opacity: 1, scale: 1, y: 0 },
      { opacity: 0, scale: 0.96, y: -10, duration: 0.25, ease: "power2.in" },
      10.76
    );

    window.__timelines["scene-s28"] = tl;
  </script>
