  <script>
    // Chuẩn bị các nét vẽ SVG (dasharray/dashoffset)
    const crackPaths = [
      document.getElementById("crack-1"),
      document.getElementById("crack-2"),
      document.getElementById("crack-3")
    ];
    crackPaths.forEach(p => {
      if (p) {
        const len = p.getTotalLength();
        p.style.strokeDasharray = len + "";
        p.style.strokeDashoffset = len + "";
      }
    });

    const strike1 = document.getElementById("strike-line-1");
    const strike2 = document.getElementById("strike-line-2");
    [strike1, strike2].forEach(line => {
      if (line) {
        const len = line.getTotalLength();
        line.style.strokeDasharray = len + "";
        line.style.strokeDashoffset = len + "";
      }
    });

    // Tạo Timeline Pause duy nhất theo đúng hợp đồng HyperFrames
    const tl = gsap.timeline({ paused: true });

    // ==========================================
    // SHOT 1: 0.00s -> 5.78s
    // ==========================================

    // Camera zoom-in nhẹ tạo cảm giác áp lực dồn nén
    tl.fromTo("#s1-stage", 
      { scale: 1 }, 
      { scale: 1.05, duration: 5.78, ease: "none" }, 
      0
    );

    // Entrance Grow animation mở màn Shot 1 (chuẩn smooth settle)
    tl.fromTo("#s1-badge", 
      { scale: 0.7, opacity: 0, y: -20 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 
      0.1
    );

    tl.fromTo("#s1-clock-card", 
      { scale: 0.8, opacity: 0, y: 30 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 
      0.2
    );

    tl.fromTo("#s1-figure", 
      { scale: 0.85, opacity: 0 }, 
      { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, 
      0.3
    );

    // Cát chảy qua clipPath: buồng trên hạ xuống, buồng dưới dâng lên
    tl.to("#top-clip-rect", {
      attr: { y: 66, height: 0 },
      duration: 1.9,
      ease: "power2.inOut"
    }, 0.5);

    tl.fromTo("#bot-clip-rect", {
      attr: { y: 130, height: 0 }
    }, {
      attr: { y: 74, height: 56 },
      duration: 1.9,
      ease: "power2.inOut"
    }, 0.5);

    tl.fromTo("#sand-stream", 
      { opacity: 0 }, 
      { opacity: 1, duration: 0.2 }, 
      0.5
    );
    tl.to("#sand-stream", 
      { opacity: 0, duration: 0.2 }, 
      2.3
    );

    // Đếm số lùi trực tiếp trên DOM text innerText tất định (seek-safe), snap số nguyên
    tl.fromTo("#countdown-val", 
      { innerText: 24 }, 
      { innerText: 0, snap: { innerText: 1 }, duration: 1.9, ease: "power2.inOut" }, 
      0.5
    );

    tl.fromTo("#s1-bar-fill", 
      { scaleX: 1 }, 
      { scaleX: 0, duration: 1.9, ease: "power2.inOut" }, 
      0.5
    );

    // Người gục xuống khi số chạm mức 0 (t = 1.9s -> 2.5s)
    tl.to("#s1-figure", {
      y: 18,
      scale: 0.96,
      duration: 0.6,
      ease: "power2.out"
    }, 1.9);

    // Vết nứt vỡ thực tế hiện ra (t = 2.4s)
    crackPaths.forEach(p => {
      if (p) {
        tl.to(p, {
          strokeDashoffset: 0,
          duration: 0.35,
          ease: "power2.out"
        }, 2.4);
      }
    });

    // Overlay Label 1: "ÁP LỰC ĐỘT NGỘT" tại atMs 94830 (2.59s trong scene) - dùng power3.out mượt mà
    tl.fromTo("#overlay-pressure", 
      { scale: 0.85, opacity: 0, y: 24 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 
      2.59
    );

    // Overlay Icon 2: Warning tại atMs 96450 (4.21s trong scene) - dùng power3.out mượt mà
    tl.fromTo("#overlay-warning", 
      { scale: 0.85, opacity: 0, y: 20 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 
      4.21
    );

    // Nhấp nháy nhẹ badge warning bằng fromTo tường minh endpoints
    tl.fromTo("#overlay-warning", 
      { scale: 1 }, 
      { scale: 1.04, yoyo: true, repeat: 3, duration: 0.25, ease: "power1.inOut" }, 
      4.65
    );


    // ==========================================
    // SHOT 2: 5.78s -> 10.00s (Transition: CUT)
    // ==========================================

    // Entrance Shot 2: Thước đo xuất hiện
    tl.fromTo("#s2-ruler-card", 
      { opacity: 0, y: -25 }, 
      { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 
      5.85
    );

    // Thanh đo rút sạch về 0
    tl.fromTo("#s2-ruler-fill", 
      { scaleX: 1 }, 
      { scaleX: 0, duration: 0.5, ease: "power3.in" }, 
      6.0
    );

    // Dấu X gạch chéo xuất hiện xóa sạch thanh đo
    if (strike1 && strike2) {
      tl.to(strike1, { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, 6.35);
      tl.to(strike2, { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, 6.45);
    }

    // "0 GIỜ" nảy vào cực mạnh (punch pop)
    tl.fromTo("#s2-zero-box", 
      { scale: 1.3, opacity: 0 }, 
      { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out" }, 
      6.55
    );

    // Nhấp nháy số 0 GIỜ tạo hiệu ứng báo động khẩn cấp
    tl.to("#s2-zero-number", { opacity: 0.4, duration: 0.12, yoyo: true, repeat: 5, ease: "steps(1)" }, 6.8);

    // Overlay Punch Phrase: "KHÔNG THỜI GIAN CHUẨN BỊ" tại atMs 99440 (7.20s trong scene)
    tl.fromTo("#s2-punch-card", 
      { y: 50, opacity: 0, scale: 0.95 }, 
      { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 
      7.20
    );

    // Đăng ký timeline paused vào window.__timelines["scene-s12"]
    window.__timelines["scene-s12"] = tl;
  </script>
