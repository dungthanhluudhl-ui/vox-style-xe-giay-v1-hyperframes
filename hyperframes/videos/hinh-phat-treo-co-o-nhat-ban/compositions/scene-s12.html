<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      font-family: 'Be Vietnam Pro', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Nền spotlight vignette tối mép ngoài theo style tokens */
    .bg-spotlight {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      background-image: radial-gradient(circle at 50% 45%, #F0ECE2 20%, #E7E3D9 55%, rgba(20, 20, 20, 0.28) 100%);
    }

    /* Thanh cam thương hiệu mép đáy cố định */
    .brand-bar {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Stage chứa toàn bộ shot để áp dụng transitionIn "grow" */
    .stage {
      position: absolute;
      inset: 0;
      transform-origin: center center;
    }

    /* Khung media ảnh tử tù: nằm trong dải y: 180–1060px (usable band 160–1390) */
    .media-frame {
      position: absolute;
      top: 180px;
      left: 120px;
      width: 840px;
      height: 880px;
      overflow: hidden;
      border-radius: 16px;
      border: 3px solid rgba(20, 20, 20, 0.2);
      box-shadow: 0 24px 50px rgba(20, 20, 20, 0.35);
      background-color: #141414;
    }

    .media-inner {
      position: absolute;
      inset: 0;
      transform-origin: center center;
    }

    .media-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
      display: block;
    }

    /* Định dạng chung cho 2 hộp overlay chữ */
    .overlay-box {
      position: absolute;
      left: 80px;
      width: 920px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 24px;
      border-radius: 12px;
      opacity: 0;
      z-index: 50;
    }

    .overlay-text {
      font-family: 'Be Vietnam Pro', sans-serif;
      font-weight: 900;
      font-size: 52px;
      line-height: 1.25;
      letter-spacing: 0.5px;
      text-align: center;
    }

    /* Overlay 1 (punch-phrase): top 1095px, nền kem, viền cam, chữ mực đen (16.8:1 WCAG AAA) */
    .plate-punch {
      top: 1095px;
      background-color: #F7F4EC;
      color: #141414;
      border: 4px solid #FF6A1A;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
    }

    /* Overlay 2 (quote): top 1235px (tách biệt Y, không đè lên overlay 1), nền mực đặc, viền cam, chữ kem sáng (16.8:1 WCAG AAA) */
    .plate-quote {
      top: 1235px;
      background-color: #141414;
      color: #F7F4EC;
      border: 4px solid #FF6A1A;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
    }
  </style>

  <div id="root" data-composition-id="scene-s12" data-width="1080" data-height="1920" data-duration="10">
    <!-- Nền cảnh spotlight -->
    <div class="bg-spotlight"></div>

    <!-- Shot S12-1 (10s) -->
    <section id="shot-1" class="clip" data-start="0" data-duration="10">
      <div id="stage" class="stage">
        <!-- Khung ảnh trung tâm -->
        <div class="media-frame">
          <div id="media-inner" class="media-inner">
            <img src="assets/img-01-death-row-inmate-prison-guard.jpg" alt="Tử tù suy sụp trước buồng giam">
          </div>
        </div>

        <!-- Overlay 1: Punch phrase (94500ms -> 2.26s) -->
        <div id="overlay-punch" class="overlay-box plate-punch">
          <span class="overlay-text">KHÔNG THỂ CHẤP NHẬN</span>
        </div>

        <!-- Overlay 2: Quote (98500ms -> 6.26s) -->
        <div id="overlay-quote" class="overlay-box plate-quote">
          <span class="overlay-text">KHÔNG KỊP CHUẨN BỊ</span>
        </div>
      </div>
    </section>

    <!-- Thanh cam thương hiệu mép đáy -->
    <div class="brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. TransitionIn "grow" cho toàn bộ stage lúc vào cảnh
    tl.fromTo("#stage",
      { scale: 0.9, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
      0
    );

    // 2. CameraMotion "zoom-in" nhẹ nhàng xuyên suốt 10 giây
    tl.fromTo("#media-inner",
      { scale: 1.0 },
      { scale: 1.15, duration: 10.0, ease: "none" },
      0
    );

    // 3. Overlay 1 (punch-phrase): xuất hiện tại 2.26s, giữ đủ 3.5s rồi fade-out trước khi overlay 2 xuất hiện
    tl.fromTo("#overlay-punch",
      { scale: 0.75, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      2.26
    );
    tl.fromTo("#overlay-punch",
      { scale: 1, opacity: 1, y: 0 },
      { scale: 0.95, opacity: 0, y: -10, duration: 0.25, ease: "power2.in" },
      5.76
    );

    // 4. Overlay 2 (quote): xuất hiện tại 6.26s, giữ đủ 3.5s rồi ẩn trước khi hết shot
    tl.fromTo("#overlay-quote",
      { scale: 0.75, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      6.26
    );
    tl.fromTo("#overlay-quote",
      { scale: 1, opacity: 1, y: 0 },
      { scale: 0.95, opacity: 0, y: -10, duration: 0.2, ease: "power2.in" },
      9.76
    );

    // Đăng ký timeline cho runtime HyperFrames
    window.__timelines["scene-s12"] = tl;
  </script>

    </template>
  </body>
</html>
