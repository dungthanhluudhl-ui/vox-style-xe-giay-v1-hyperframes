  <script>
    // Xây dựng Timeline GSAP duy nhất, seek-safe và deterministic
    const tl = gsap.timeline({ paused: true });

    // ==============================================================
    // SHOT 1 CHOREOGRAPHY (0.0s -> 5.0s)
    // ==============================================================

    // Setup ban đầu cho SVG Wires
    const wires = ["#wire-1", "#wire-2", "#wire-3", "#wire-4", "#wire-5"];
    wires.forEach(selector => {
      const el = document.querySelector(selector);
      if (el) {
        const len = el.getTotalLength() || 600;
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
      }
    });

    // 0.0s - 0.7s: Header và Hub trung tâm mở ra (unfold entrance)
    tl.fromTo("#s1-header", 
      { y: -40, opacity: 0 }, 
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 
      0.1
    );

    tl.fromTo("#hub-core", 
      { scale: 0, opacity: 0 }, 
      { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 
      0.2
    );

    // 0.5s - 1.2s: Dây nối SVG tỏa ra từ hub
    wires.forEach((selector, idx) => {
      tl.to(selector, { 
        strokeDashoffset: 0, 
        duration: 0.6, 
        ease: "power2.out" 
      }, 0.45 + idx * 0.08);
    });

    // 0.7s - 1.6s: 5 Nodes nghề nghiệp bung ra theo thứ tự
    const nodes = ["#c-node-1", "#c-node-2", "#c-node-3", "#c-node-4", "#c-node-5"];
    nodes.forEach((selector, idx) => {
      tl.fromTo(selector, 
        { scale: 0.2, opacity: 0, y: 25 }, 
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 
        0.7 + idx * 0.1
      );
    });

    // 1.90s: Callout 1 xuất hiện "CƠ KHÍ - TIN HỌC"
    tl.fromTo("#s1-callout-1", 
      { scale: 0.8, opacity: 0, y: 15 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 
      1.90
    );

    // Highlight nhẹ Node 1 & Node 2
    tl.to(["#c-node-1", "#c-node-2"], { 
      borderColor: "#FF6A1A", 
      duration: 0.35, 
      ease: "power2.out" 
    }, 1.90);

    // 3.40s: Ẩn Callout 1
    tl.to("#s1-callout-1", { opacity: 0, scale: 0.8, duration: 0.25, ease: "power2.in" }, 3.40);

    // 3.70s: Callout 2 xuất hiện "CẮT TÓC - MAY MẶC"
    tl.fromTo("#s1-callout-2", 
      { scale: 0.8, opacity: 0, y: 15 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 
      3.70
    );

    // Highlight Node 3 & Node 4
    tl.to(["#c-node-3", "#c-node-4"], { 
      borderColor: "#FF6A1A", 
      duration: 0.35, 
      ease: "power2.out" 
    }, 3.70);

    // Camera pan-right cảm giác di chuyển toàn diagram từ 2.0s -> 4.8s
    tl.to("#s1-diagram", { 
      x: 15, 
      duration: 2.8, 
      ease: "sine.inOut" 
    }, 2.0);

    // 4.7s - 5.0s: Transition chuyển shot (Shot 1 lùi lại và mờ dần)
    tl.to("#shot-1", { opacity: 0, scale: 0.96, duration: 0.3, ease: "power2.inOut" }, 4.7);

    // ==============================================================
    // SHOT 2 CHOREOGRAPHY (5.0s -> 9.0s)
    // ==============================================================

    // 5.0s: Dissolve vào Shot 2
    tl.to("#shot-2", { opacity: 1, duration: 0.3, ease: "power2.out" }, 5.0);

    // Dossier Card trượt lên
    tl.fromTo("#s2-dossier", 
      { y: 60, opacity: 0 }, 
      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 
      5.05
    );

    // Icon "doc" nhảy pop vào vị trí
    tl.fromTo("#s2-doc-badge", 
      { scale: 0, rotation: -15 }, 
      { scale: 1, rotation: 0, duration: 0.45, ease: "power3.out" }, 
      5.25
    );

    // Tiến độ thanh đo năng lực chạy dần lên
    tl.to("#bar-fill-1", { width: "92%", duration: 0.7, ease: "power2.out" }, 5.4);
    tl.to("#bar-fill-2", { width: "88%", duration: 0.7, ease: "power2.out" }, 5.6);

    // Checkbox nguyện vọng tích V tuần tự
    tl.fromTo("#chk-1", { scale: 0 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 5.85);
    tl.fromTo("#chk-2", { scale: 0 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 6.05);

    // Khu vực kết quả và con dấu "KHỚP NỐI 100%"
    tl.fromTo("#s2-result-zone", 
      { opacity: 0, y: 15 }, 
      { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 
      6.15
    );

    tl.fromTo("#s2-stamp", 
      { scale: 2.0, opacity: 0, rotation: 10 }, 
      { scale: 1, opacity: 1, rotation: -3, duration: 0.35, ease: "power4.out" }, 
      6.4
    );

    // 7.20s: Punch-phrase banner xuất hiện mạnh mẽ (hold tới hết scene 9.0s = 1.8s)
    tl.fromTo("#s2-punch", 
      { scale: 0.7, opacity: 0, y: 25 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 
      7.20
    );

    // Gắn timeline vào registry HyperFrames theo đúng contract
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s30"] = tl;
  </script>
