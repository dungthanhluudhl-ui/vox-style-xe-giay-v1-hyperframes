    <!-- Script điều khiển hoạt họa GSAP chính xác theo frame -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Chuyển cảnh vào (Transition In: Strike) - Cú nện gót giáng mạnh dứt khoát
      tl.fromTo(
        "#hero-stage",
        { y: -120, opacity: 0, scale: 1.04 },
        { y: 0, opacity: 1, scale: 1, duration: 0.44, ease: "power4.out" },
        0
      );
      // Hiệu ứng chấn động phản lực (Impact bounce dứt khoát của cú dậm gót)
      tl.to("#hero-stage", { y: 6, duration: 0.06, ease: "power2.in" }, 0.44);
      tl.to("#hero-stage", { y: -2, duration: 0.06, ease: "power2.out" }, 0.5);
      tl.to("#hero-stage", { y: 0, duration: 0.08, ease: "power2.out" }, 0.56);

      // 2. Camera Motion: Pan nhẹ sang phải theo bước tiến của hàng tù nhân (pan-right)
      tl.fromTo(
        "#camera-rig",
        { x: -30 },
        { x: 30, duration: 9.4, ease: "none" },
        0.6
      );

      // 3. Diagram HUD Reveal (Vẽ các đường phân tích kỹ thuật)
      tl.fromTo(
        "#cadence-axis",
        { y: 15, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.8
      );
      tl.fromTo(
        "#arm-protractor",
        { scale: 0.8, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.1
      );

      // 4. Schedule Badge xuất hiện nhẹ nhàng ở tầng trên
      tl.fromTo(
        "#schedule-badge-bar",
        { opacity: 0, y: 15 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.5
      );

      // 5. Nhịp Metronome Pulse Cursor nhảy đều qua các mốc bước chân (cadence pacing)
      tl.to("#pulse-cursor", { attr: { cx: 280 }, duration: 0.35, ease: "power2.out" }, 1.8);
      tl.to("#pulse-cursor", { attr: { cx: 480 }, duration: 0.35, ease: "power2.out" }, 3.2);
      tl.to("#pulse-cursor", { attr: { cx: 680 }, duration: 0.35, ease: "power2.out" }, 4.6);
      tl.to("#pulse-cursor", { attr: { cx: 280 }, duration: 0.35, ease: "power2.out" }, 6.0);
      tl.to("#pulse-cursor", { attr: { cx: 480 }, duration: 0.35, ease: "power2.out" }, 7.4);
      tl.to("#pulse-cursor", { attr: { cx: 680 }, duration: 0.35, ease: "power2.out" }, 8.8);

      // 6. Label Card: "BƯỚC ĐỀU NỐI HÀNG" (atMs: 234590 -> 6.35s, hold 2.1s -> 8.45s)
      tl.fromTo(
        "#label-card",
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        6.35
      );
      tl.to(
        "#label-card",
        { y: -10, opacity: 0, duration: 0.2, ease: "power2.in" },
        8.25
      );

      // 7. Punch-phrase Card: "NHỊP ĐIỆU TUYỆT ĐỐI" (atMs: 236760 -> 8.52s, hold đến 10.00s)
      tl.fromTo(
        "#punch-card",
        { scale: 0.92, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power4.out" },
        8.52
      );

      // Đăng ký timeline chính thức vào HyperFrames runtime
      window.__timelines["scene-s29"] = tl;
    </script>
