<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #141414;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    /* Nền grid 84px chuẩn Vox-style */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      z-index: 1;
    }

    /* Thanh cam đáy cố định 12px */
    .bottom-orange-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Khung video giới hạn trong safe zone y160-1390 */
    .video-viewport {
      position: absolute;
      top: 220px;
      left: 60px;
      width: 960px;
      height: 1120px;
      overflow: hidden;
      background-color: #141414;
      border: 4px solid #141414;
      box-shadow: 14px 14px 0px #141414;
      z-index: 10;
      transform-origin: center center;
    }

    /* Wrapper hỗ trợ camera pan-right không timed */
    .video-pan-track {
      position: absolute;
      top: 0;
      left: -40px;
      width: 1040px;
      height: 1120px;
    }

    .video-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Lớp timed overlay cho shot */
    .clip {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    /* Overlay 1: GIỜ LAO ĐỘNG BẮT BUỘC */
    .label-work-container {
      position: absolute;
      top: 172px;
      left: 60px;
      background-color: #FF6A1A;
      color: #141414;
      padding: 14px 28px;
      box-shadow: 6px 6px 0px #141414;
      transform-origin: left center;
      z-index: 30;
    }

    .label-work-text {
      display: block;
      font-weight: 900;
      font-size: 32px;
      line-height: 1.2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* Overlay 2: BƯỚC ĐỀU THEO NHỊP */
    .quote-rhythm-container {
      position: absolute;
      top: 1220px;
      left: 100px;
      right: 100px;
      background-color: #141414;
      color: #F7F4EC;
      padding: 20px 32px;
      border-left: 8px solid #FF6A1A;
      box-shadow: 10px 10px 0px rgba(20, 20, 20, 0.45);
      text-align: center;
      transform-origin: center center;
      z-index: 30;
    }

    .quote-rhythm-text {
      display: block;
      font-weight: 900;
      font-size: 42px;
      line-height: 1.3;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>

  <div id="root" data-composition-id="scene-s29" data-width="1080" data-height="1920" data-duration="10">
    <!-- Nền grid ô vuông 84px -->
    <div class="bg-grid"></div>

    <!-- Thanh cam nhận diện cố định ở mép đáy -->
    <div class="bottom-orange-bar"></div>

    <!-- Khung chứa video (wrapper không mang data-start để tránh lint video_nested_in_timed_element) -->
    <div id="video-frame" class="video-viewport">
      <div id="video-pan" class="video-pan-track">
        <video
          id="vid-inmates"
          src="assets/vid-08-inmates-vocational-training-workshop.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="10"
          data-media-start="0"
          class="video-media"
        ></video>
      </div>
    </div>

    <!-- Lớp shot overlay (timed element) -->
    <section id="shot-s29-1" class="clip" data-start="0" data-duration="10">
      <div id="label-work" class="label-work-container">
        <span class="label-work-text">GIỜ LAO ĐỘNG BẮT BUỘC</span>
      </div>

      <div id="quote-rhythm" class="quote-rhythm-container">
        <span class="quote-rhythm-text">BƯỚC ĐỀU THEO NHỊP</span>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Transition In "grow" cho khung video tại đầu scene
    tl.fromTo("#video-frame", 
      { scale: 0.88, opacity: 0 }, 
      { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 
      0
    );

    // Camera Motion "pan-right" (nội dung di chuyển sang trái: x giảm dần từ 30 về -30)
    tl.fromTo("#video-pan", 
      { x: 30 }, 
      { x: -30, duration: 8.0, ease: "none" }, 
      0
    );

    // Điểm nhấn thị giác lúc giữ khung cuối từ 8s đến 10s (zoom nhẹ khung chứa không-timed)
    tl.fromTo("#video-frame", 
      { scale: 1 }, 
      { scale: 1.035, duration: 1.85, ease: "power2.out" }, 
      8.0
    );

    // Overlay 1: "GIỜ LAO ĐỘNG BẮT BUỘC" (atMs: 229500 -> relative 1.26s, holdMs: 3500)
    tl.fromTo("#label-work", 
      { scale: 0, opacity: 0 }, 
      { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" }, 
      1.26
    );
    tl.fromTo("#label-work", 
      { opacity: 1 }, 
      { opacity: 0, duration: 0.25, ease: "power2.in" }, 
      5.20
    );

    // Overlay 2: "BƯỚC ĐỀU THEO NHỊP" (atMs: 234500 -> relative 6.26s, holdMs: 3500)
    tl.fromTo("#quote-rhythm", 
      { y: 32, opacity: 0 }, 
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 
      6.26
    );
    tl.fromTo("#quote-rhythm", 
      { opacity: 1 }, 
      { opacity: 0, duration: 0.15, ease: "power2.in" }, 
      9.80
    );

    // Đăng ký timeline chính thức cho HyperFrames runtime
    window.__timelines["scene-s29"] = tl;
  </script>

    </template>
  </body>
</html>
