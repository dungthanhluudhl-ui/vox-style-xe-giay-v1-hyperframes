<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #E7E3D9 30%, rgba(20, 20, 20, 0.32) 100%), #E7E3D9;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    #stage {
      position: absolute;
      inset: 0;
    }

    #media-frame {
      position: absolute;
      top: 220px;
      left: 80px;
      width: 920px;
      height: 880px;
      overflow: hidden;
      background-color: #141414;
      border: 4px solid #141414;
      box-shadow: 14px 14px 0px #141414;
    }

    #media-scaler {
      width: 100%;
      height: 100%;
      transform-origin: center center;
    }

    #media-scaler img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #overlays-group {
      position: absolute;
      top: 1140px;
      left: 0;
      width: 1080px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      z-index: 50;
      pointer-events: none;
    }

    #split-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .split-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .split-card {
      font-weight: 900;
      font-size: 40px;
      line-height: 1.2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 16px 30px;
      border: 3px solid #141414;
      box-shadow: 8px 8px 0px #141414;
      white-space: nowrap;
      opacity: 0;
    }

    .split-divider {
      font-weight: 900;
      font-size: 36px;
      line-height: 1;
      padding: 14px 20px;
      border: 3px solid #141414;
      box-shadow: 6px 6px 0px #141414;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    #warning-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .plate-warning {
      padding: 16px 42px;
      font-weight: 900;
      font-size: 48px;
      line-height: 1.2;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
      border: 3px solid #141414;
      box-shadow: 8px 8px 0px #141414;
      opacity: 0;
    }

    .bottom-brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s52" data-width="1080" data-height="1920" data-duration="7">
    <section id="shot-1" class="clip" data-start="0" data-duration="7">
      <div id="stage">
        <div id="media-frame">
          <div id="media-scaler">
            <img src="assets/img-14-prison-shadow-city-crosswalk.jpg" alt="Song sắt và ngã tư">
          </div>
        </div>

        <div id="overlays-group">
          <div id="split-wrapper">
            <div id="overlay-split" class="split-container">
              <div id="split-left" class="split-card hf-plate-paper">THIỆN</div>
              <div id="split-mid" class="split-divider hf-hl-orange">↔</div>
              <div id="split-right" class="split-card hf-plate-ink">ÁC MONG MANH</div>
            </div>
          </div>
          <div id="warning-wrapper">
            <div id="overlay-warning" class="plate-warning hf-hl-orange">SỢ LẠI SA NGÃ</div>
          </div>
        </div>
      </div>
    </section>

    <div class="bottom-brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // TransitionIn: Shatter entrance cho cả shot tại t = 0
    tl.fromTo(
      "#stage",
      { scale: 1.15, rotation: -2, opacity: 0 },
      { scale: 1, rotation: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      0
    );

    // CameraMotion: Zoom-out chậm đều suốt shot
    tl.fromTo(
      "#media-scaler",
      { scale: 1.15 },
      { scale: 1.0, duration: 6.8, ease: "none" },
      0
    );

    // Overlay 1: Split "THIỆN ↔ ÁC MONG MANH" phân chia 2 khối chữ (atMs: 407500 -> 1.26s, holdMs: 3000 -> 4.26s)
    tl.fromTo(
      "#split-left",
      { x: -50, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      1.26
    );
    tl.fromTo(
      "#split-mid",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.5)" },
      1.36
    );
    tl.fromTo(
      "#split-right",
      { x: 50, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      1.42
    );

    // Fade out toàn bộ cấu trúc split trước khi overlay thứ hai xuất hiện
    tl.fromTo(
      "#overlay-split",
      { opacity: 1, scale: 1 },
      { opacity: 0, scale: 0.95, duration: 0.22, ease: "power2.in" },
      4.08
    );

    // Overlay 2: Label "SỢ LẠI SA NGÃ" (atMs: 410600 -> 4.36s, holdMs: 2500 -> 6.86s)
    tl.fromTo(
      "#overlay-warning",
      { scale: 0.84, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
      4.36
    );
    tl.fromTo(
      "#overlay-warning",
      { opacity: 1 },
      { opacity: 0, duration: 0.22, ease: "power2.in" },
      6.72
    );

    window.__timelines["scene-s52"] = tl;
  </script>

    </template>
  </body>
</html>
