      // Single paused master timeline for HyperFrames

      const checkLength = checkPath.getTotalLength();
      checkPath.style.strokeDasharray = checkLength;
      checkPath.style.strokeDashoffset = checkLength;

      const creaseV2 = document.getElementById("crease-v2");

        }
      });

      // -------------------------------------------------------------
      // TIMELINE CHOREOGRAPHY (Total 8.0s)
      // -------------------------------------------------------------

      // 1. Initial Scene Entrance (t = 0.1s - 0.6s)
      tl.fromTo(
        "#diagram-stage",
        { scale: 0.92, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.1
      );

      // 2. Overlay 1: Label / Timer Badge "QUY ĐỊNH: 10 PHÚT" (Start: 0.46s = 460ms)

        "#timer-badge",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.46
      );

      // Clock rotation & countdown representation
      tl.fromTo(
        "#clock-hands",
        { rotation: 0, transformOrigin: "12px 12px" },
        { rotation: 720, duration: 5.0, ease: "power1.inOut" },
        0.5
      );

      // Stepped Countdown text representation
      tl.set("#timer-text", { textContent: "10:00" }, 0);
      tl.set("#timer-text", { textContent: "08:45" }, 1.2);
      tl.set("#timer-text", { textContent: "05:30" }, 2.4);
      tl.set("#timer-text", { textContent: "02:15" }, 3.6);
      tl.set("#timer-text", { textContent: "00:00" }, 4.77);

      // 3. Phase 1: Flat Folding Guide (t = 0.5s - 2.5s)
      tl.fromTo(
        "#flat-sheet",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        0.5
      );

      tl.fromTo(
        "#fold-arrow-left",
        { x: -30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
        0.8
      );
      tl.fromTo(
        "#fold-arrow-right",
        { x: 30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
        1.1
      );
      tl.fromTo(
        "#fold-arrow-center",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
        1.4
      );

      // Transition from Flat Sheet to 3D Tofu Cube (t = 2.2s - 2.8s)
      tl.to(
        "#flat-sheet",
        { opacity: 0, scale: 0.85, duration: 0.4, ease: "power2.in" },
        2.2
      );

      // 4. Phase 2: Isometric Tofu Blanket 3D Cube Reveal (t = 2.4s)
      tl.fromTo(
        "#cube-diagram",
        { opacity: 0, scale: 0.82 },
        { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" },
        2.4
      );

      // Faces pop with precise micro-stagger
      tl.fromTo(
        "#cube-face-top",
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        2.5
      );
      tl.fromTo(
        "#cube-face-left",
        { opacity: 0, x: -20 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" },
        2.6
      );
      tl.fromTo(
        "#cube-face-right",
        { opacity: 0, x: 20 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" },
        2.7
      );

      // Angle indicator lines highlight
      tl.fromTo(
        ["#angle-1", "#angle-2"],
        { opacity: 0, scale: 0.5, transformOrigin: "center center" },
        { opacity: 1, scale: 1, duration: 0.4, stagger: 0.1, ease: "back.out(1.7)" },
        2.9
      );

      // Measurement Callout Badges
      tl.fromTo(
        "#badge-angle",
        { opacity: 0, y: 15 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        3.1
      );
      tl.fromTo(
        "#badge-height",
        { opacity: 0, x: -15 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
        3.3

      tl.fromTo(
        "#badge-plane",
        { opacity: 0, y: -15 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        3.5

      tl.to(
        ["#dimension-top", "#dimension-vertical"],
        { opacity: 0.7, duration: 0.4, ease: "power1.out" },
        3.6

      // 5. Overlay 2: Check Icon & Inspection Stamp (Start: 4.77s = 4770ms)

        "#stamp-badge",
        { opacity: 0, scale: 0.5, rotation: -12 },
        { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.5)" },
        4.77

      // Animate checkmark path drawing
      tl.to(
        "#stamp-check-path",
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        5.0

        { y: 40, opacity: 0, scale: 0.95 },

        { y: -6, duration: 1.8, ease: "sine.inOut" },
        6.2
      );

      // Register timeline strictly on window.__timelines["scene-s26"]
      window.__timelines["scene-s26"] = tl;
