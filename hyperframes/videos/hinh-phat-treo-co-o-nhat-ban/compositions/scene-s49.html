<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      overflow: hidden;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    #stage {
      position: absolute;
      inset: 0;
    }

    /* Khung giới hạn media trong dải an toàn y: 160 - 1390 */
    .card-frame {
      position: absolute;
      top: 190px;
      left: 80px;
      width: 920px;
      height: 1160px;
      background-color: #141414;
      border: 3px solid #141414;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(20, 20, 20, 0.22);
    }

    .media-pan-wrapper {
      position: absolute;
      top: 0;
      left: -60px;
      width: 1080px;
      height: 100%;
    }

    .media-pan-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Nhãn định danh đặt trên tấm nền mực đặc, tách biệt vị trí không chồng lấn */
    .overlay-badge {
      position: absolute;
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 36px;
      line-height: 1.25;
      padding: 16px 28px;
      border-radius: 10px;
      letter-spacing: 0.5px;
      opacity: 0;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      z-index: 10;
      border-left: 8px solid #FF6A1A;
    }

    #badge-1 {
      top: 240px;
      left: 120px;
    }

    #badge-2 {
      top: 350px;
      left: 120px;
    }

    /* Thanh cam đáy thương hiệu cố định */
    #bottom-accent-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 99;
    }
  </style>

  <div id="root" data-composition-id="scene-s49" data-width="1080" data-height="1920" data-duration="5">
    <section id="shot-1" class="clip" data-start="0" data-duration="5">
      <div id="stage">
        <div class="card-frame">
          <div id="media-wrapper" class="media-pan-wrapper">
            <img src="assets/img-13-dejected-man-walking-cutout-street.jpg" alt="Người đàn ông bước đi trong con ngõ khu dân cư">
          </div>
        </div>
        <div id="badge-1" class="overlay-badge hf-plate-ink">NƠI LÀM VIỆC MỚI</div>
        <div id="badge-2" class="overlay-badge hf-plate-ink-orange">QUÁ GẦN NHÀ CŨ</div>
      </div>
    </section>

    <!-- Thanh cam đáy thương hiệu cố định -->
    <div id="bottom-accent-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // TransitionIn: rise cho toàn bộ stage
    tl.fromTo(
      "#stage",
      { y: 80, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
      0
    );

    // Camera motion: pan-right (wrapper di chuyển sang trái để viewport lia sang phải)
    tl.fromTo(
      "#media-wrapper",
      { x: 30 },
      { x: -70, duration: 5.0, ease: "none" },
      0
    );

    // Overlay 1: NƠI LÀM VIỆC MỚI (atMs: 391500 -> 0.26s, holdMs: 2200 -> 2.46s)
    tl.fromTo(
      "#badge-1",
      { scale: 0.85, opacity: 0, y: 15 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      0.26
    );
    tl.fromTo(
      "#badge-1",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -10, duration: 0.22, ease: "power2.in" },
      2.46
    );

    // Overlay 2: QUÁ GẦN NHÀ CŨ (atMs: 394000 -> 2.76s, holdMs: 2100 -> 4.86s)
    tl.fromTo(
      "#badge-2",
      { scale: 0.85, opacity: 0, y: 15 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      2.76
    );
    tl.fromTo(
      "#badge-2",
      { opacity: 1 },
      { opacity: 0, duration: 0.18, ease: "power2.in" },
      4.70
    );

    window.__timelines["scene-s49"] = tl;
  </script>

    </template>
  </body>
</html>
