    <script>

      // Document & Silhouettes Entrance
      tl.fromTo("#doc-container", 
        { y: 50, opacity: 0 }, 
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 
        0.1

      tl.fromTo("#sil-husband", 
        { x: -50, opacity: 0 },

        { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" },

      // Label: TIN SỐC BỊ BẮT
      tl.fromTo("#s1-tag",

        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.4)" },

      // SHATTER & TEAR ANIMATION (~1.15s)
      tl.to("#tear-path", {
        strokeDashoffset: 0,
        duration: 0.4,
        ease: "power2.inOut"

      tl.to("#doc-left", {
        x: -45,
        rotation: -2.5,
        duration: 0.55,
        ease: "power3.out"
      }, 1.35);

      tl.to("#doc-right", {
        x: 45,
        rotation: 2.5,
        duration: 0.55,
        ease: "power3.out"
      }, 1.35);

      tl.to("#sil-husband", {
        x: -40,
        duration: 0.55,
        ease: "power2.out"
      }, 1.35);

      tl.to("#sil-wife", {
        x: 40,
        duration: 0.55,
        ease: "power2.out"
      }, 1.35);

      // Label fade out before punch phrase arrives
      tl.to("#s1-tag", {
        opacity: 0,
        duration: 0.2,
        ease: "power2.in"

      // Punch Phrase: ĐƠN LY HÔN (starts at ~2.01s)

        opacity: 0,
        duration: 0.2,
        ease: "power2.in"

      // ==========================================

      tl.fromTo("#shot-2-fade", 
        { opacity: 0 }, 
        { opacity: 1, duration: 0.45, ease: "power2.out" }, 
        2.6

      // Camera pan-right across map viewport (strictly one tween on x property)
      tl.fromTo("#map-viewport", 
        { x: 0 }, 
        { x: -150, duration: 5.0, ease: "none" }, 
        2.6
      );

      // Map Nodes Appear
      tl.fromTo("#node-company", 
        { scale: 0.65, opacity: 0, y: 24 }, 
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },

        3.72

      // Distance Metric Badge Pop
      tl.fromTo("#distance-metric-badge", 
        { scale: 0, opacity: 0 }, 
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 
        4.1
      );

      // Pulse Rings Loop (finite repeats)

        { scale: 0.8, opacity: 0.8 }, 
        { scale: 1.8, opacity: 0, duration: 1.1, repeat: 2, ease: "power1.out" }, 
        3.9

      tl.fromTo("#pulse-target", 
        { scale: 0.8, opacity: 0.8 }, 
        { scale: 1.8, opacity: 0, duration: 1.1, repeat: 2, ease: "power1.out" },

      // Punch Phrase S2: KHOẢNG CÁCH QUÁ GẦN
      tl.fromTo("#s2-punch-card", 
        { y: -35, opacity: 0, scale: 0.95 }, 
        { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power4.out" }, 
        5.24
      );

      // Register master timeline
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s49"] = tl;
    </script>
