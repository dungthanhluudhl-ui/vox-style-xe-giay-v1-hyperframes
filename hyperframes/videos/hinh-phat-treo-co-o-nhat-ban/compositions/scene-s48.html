<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #F5F0E4;
      font-family: "Be Vietnam Pro", sans-serif;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #F5F0E4;
      overflow: hidden;
    }

    /* Base clip style following framework contract */
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Fixed brand indicator line at the bottom */
    #brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 50;
    }

    /* Video stage wrapper without data-start for peel transition & pan */
    #video-wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }
    #video-pan-container {
      position: absolute;
      top: 0;
      left: -120px;
      width: 1240px;
      height: 1920px;
    }
    #vid-06 {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Overlay container keeping all text safely inside Y: 160-1200 (well above caption zone) */
    .overlay-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: 260px;
      padding-bottom: 740px;
      padding-left: 80px;
      padding-right: 80px;
      z-index: 10;
    }

    .overlay-top-row {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .overlay-bottom-row {
      display: flex;
      justify-content: flex-end;
      width: 100%;
    }

    /* Overlay 1: Punch phrase label */
    .label-box {
      display: inline-block;
      padding: 18px 36px;
      border-radius: 8px;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-left: 10px solid #FF6A1A;
      box-shadow: 0 16px 36px rgba(20, 20, 20, 0.45);
      line-height: 1.34;
    }

    /* Overlay 2: Document stamp */
    .stamp-box {
      display: inline-block;
      padding: 22px 38px;
      border-radius: 6px;
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 6px solid #FF6A1A;
      box-shadow: 0 20px 42px rgba(20, 20, 20, 0.5);
      line-height: 1.34;
      transform-origin: center center;
    }
  </style>

  <div id="root" data-composition-id="scene-s48" data-width="1080" data-height="1920" data-duration="10.17">
    <!-- Brand identity accent bar -->
    <div id="brand-bar"></div>

    <!-- Video layer: wrapper without data-start enables peel entrance and pan motion -->
    <div id="video-wrapper">
      <div id="video-pan-container">
        <video
          id="vid-06"
          src="assets/vid-06-sad-man-leaving-family.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="10.17"
          data-media-start="0"
        ></video>
      </div>
    </div>

    <!-- Shot 1 Overlays -->
    <section id="shot-1" class="clip" data-start="0" data-duration="10.17">
      <div class="overlay-container">
        <div class="overlay-top-row">
          <div id="label-family" class="hf-plate-ink label-box">VỢ VÀ 5 CON NHỎ</div>
        </div>
        <div class="overlay-bottom-row">
          <div id="doc-stamp" class="hf-plate-paper stamp-box">ĐƠN XIN LY HÔN</div>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Shot 1 entrance: Peel transition revealing the scene
    tl.fromTo(
      "#video-wrapper",
      { transformOrigin: "top right", rotation: -5, x: -50, opacity: 0 },
      { rotation: 0, x: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
      0
    );

    // Camera motion: pan-left across shot duration (ends before 10.17s boundary)
    tl.fromTo(
      "#video-pan-container",
      { x: -40 },
      { x: 80, duration: 10.15, ease: "none" },
      0
    );

    // Overlay 1 (label): Pop entrance at 0.43s (atMs: 381500)
    tl.fromTo(
      "#label-family",
      { scale: 0.8, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.43
    );

    // Overlay 1: Exit fade out after holdMs: 3000ms (at 3.43s)
    tl.fromTo(
      "#label-family",
      { scale: 1, opacity: 1, y: 0 },
      { scale: 0.96, opacity: 0, y: -16, duration: 0.25, ease: "power2.in" },
      3.43
    );

    // Overlay 2 (document): Stamp slam entrance at 7.73s (atMs: 388800)
    tl.fromTo(
      "#doc-stamp",
      { opacity: 0, scale: 1.4, rotation: -12 },
      { opacity: 1, scale: 1, rotation: -3, duration: 0.28, ease: "power4.out" },
      7.73
    );

    // Register paused master timeline
    window.__timelines["scene-s48"] = tl;
  </script>

    </template>
  </body>
</html>
