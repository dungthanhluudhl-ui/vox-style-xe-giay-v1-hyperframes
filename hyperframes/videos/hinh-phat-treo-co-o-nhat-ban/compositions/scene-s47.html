    <script>
      const tl = gsap.timeline({ paused: true });

      // Cài đặt SVG stroke-dashoffset cho Icon Warning
      const tri = document.getElementById("warning-triangle");
      const stem = document.getElementById("warning-stem");
      if (tri) {
        const len = tri.getTotalLength();
        tri.style.strokeDasharray = `${len}`;
        tri.style.strokeDashoffset = `${len}`;
      }
      if (stem) {
        const len = stem.getTotalLength();
        stem.style.strokeDasharray = `${len}`;
        stem.style.strokeDashoffset = `${len}`;
      }

      // SHOT 1 (0.0s -> 4.10s)
      tl.fromTo("#shot1-stage", { x: 0 }, { x: -30, duration: 4.1, ease: "none" }, 0);
      tl.fromTo("#label-cell", { x: -50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.37);

      // Hiệu ứng Peel dùng transform x hoàn toàn (x: 540 -> x: 0)

      tl.to("#label-cell", { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, 1.8);
      tl.to("#peel-seam", { opacity: 0, duration: 0.3, ease: "power1.out" }, 2.9);

      // Punch Phrase Shot 1
      tl.fromTo("#punch-paradise", { scale: 0.85, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.3);
      // Fade out trên phần tử con #shot1-stage (KHÔNG tween trực tiếp trên .clip)
      tl.to("#shot1-stage", { opacity: 0, duration: 0.3, ease: "power1.in" }, 3.8);

      // SHOT 2 (3.95s -> 9.38s)
      tl.fromTo("#shot2-fade", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out" }, 3.95);
      tl.fromTo("#shot2-camera", { scale: 1.0 }, { scale: 1.08, duration: 5.43, ease: "none" }, 3.95);
      tl.fromTo("#hamaguchi-figure", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 4.1);

      // Mây lo âu xuất hiện
      tl.fromTo("#cloud-bottom", { scale: 0.5, y: 120, opacity: 0 }, { scale: 1.0, y: 0, opacity: 1, duration: 1.6, ease: "power2.out" }, 4.5);
      tl.fromTo("#cloud-left", { scale: 0.2, rotation: -40, opacity: 0 }, { scale: 1.05, rotation: 0, opacity: 1, duration: 1.5, ease: "power3.out" }, 4.8);
      tl.fromTo("#cloud-right", { scale: 0.2, rotation: 40, opacity: 0 }, { scale: 1.08, rotation: 0, opacity: 1, duration: 1.5, ease: "power3.out" }, 5.1);

      // Dao động nhẹ sau khi mây đã nở (không chồng lấn tween trước đó: cloud-left nở xong 6.3s, cloud-right nở xong 6.6s)
      tl.to("#cloud-left", { y: -16, rotation: 5, duration: 2.0, ease: "sine.inOut" }, 6.4);
      tl.to("#cloud-right", { y: -20, rotation: -6, duration: 2.0, ease: "sine.inOut" }, 6.8);

      // Icon Warning tự vẽ
      tl.fromTo("#icon-warning", { scale: 0.7, opacity: 0 }, { scale: 1.0, opacity: 1, duration: 0.35, ease: "power3.out" }, 6.7);
      if (tri) tl.to(tri, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 6.75);
      if (stem) tl.to(stem, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 7.0);
      tl.fromTo("#warning-dot", { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" }, 7.25);

      // Punch Phrase Shot 2
      tl.fromTo("#punch-anxiety", { scale: 0.9, opacity: 0, y: 30 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 7.5);

      window.__timelines["scene-s47"] = tl;
