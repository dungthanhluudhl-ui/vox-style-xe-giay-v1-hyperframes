  <script>
    const tl = gsap.timeline({ paused: true });

    // TransitionIn: Peel entrance cho whole stage
    tl.fromTo("#stage",
      { rotation: -4, x: -30, y: 40, opacity: 0 },
      { rotation: 0, x: 0, y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },

      { scale: 0.88, y: 30, opacity: 0 },
      { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      0.76
    );

    // Overlay 2: CHỨNG CHỈ HÀNH NGHỀ (atMs 251500 -> 4.26s) - stamp slam
    tl.fromTo("#card-document",
      { scale: 1.35, rotation: -6, opacity: 0 },
      { scale: 1, rotation: 0, opacity: 1, duration: 0.28, ease: "power4.out" },
      4.26
    );

    // Outro fade trước khi shot kết thúc ở 8.0s
    tl.fromTo("#stage",
      { opacity: 1 },
      { opacity: 0, duration: 0.22, ease: "power2.in" },
      7.75
    );

    window.__timelines["scene-s31"] = tl;
