<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #F5F0E4;
      font-family: "Be Vietnam Pro", sans-serif;
      color: #141414;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #F5F0E4;
      overflow: hidden;
    }

    /* Chuẩn contract HyperFrames cho clip */
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Thanh cam đáy nhận diện thương hiệu 12px */
    .bottom-brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Stage chứa toàn bộ shot */
    #shot-stage {
      position: absolute;
      inset: 0;
      transform-origin: 540px 960px;
    }

    /* Khu vực hiển thị chữ/overlay ổn định ở phía trên */
    #overlay-container {
      position: absolute;
      top: 180px;
      left: 60px;
      width: 960px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      pointer-events: none;
    }

    .data-plate {
      position: absolute;
      width: auto;
      height: auto;
      background-color: #141414;
      border-radius: 14px;
      padding: 18px 36px;
      box-shadow: 0 10px 24px rgba(20, 20, 20, 0.2), 0 4px 0 rgba(20, 20, 20, 0.35);
      border: 2px solid rgba(255, 106, 26, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.85);
    }

    .plate-text {
      font-size: 46px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Chữ sáng trên nền mực đen: 16.8:1 */
    .plate-text-light {
      color: #F7F4EC;
    }

    /* Chữ cam nhấn trên nền mực đen: 6.4:1 */
    .plate-text-orange {
      color: #FF6A1A;
    }

    /* Khung giới hạn chứa hình ảnh Hero cận cảnh */
    #media-card {
      position: absolute;
      top: 330px;
      left: 60px;
      width: 960px;
      height: 1040px;
      background-color: #141414;
      border: 4px solid #141414;
      border-radius: 20px;
      box-shadow: 0 16px 36px rgba(20, 20, 20, 0.16), 0 6px 0 #141414;
      overflow: hidden;
      z-index: 10;
    }

    #media-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 14px;
    }

    /* Wrapper di chuyển camera pan-left */
    #media-mover {
      position: absolute;
      top: -5%;
      left: -15%;
      width: 130%;
      height: 110%;
      will-change: transform;
    }

    #hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      display: block;
    }
  </style>

  <div id="root" data-composition-id="scene-s08" data-width="1080" data-height="1920" data-duration="9.0">
    <!-- Thanh cam đáy cố định suốt scene -->
    <div class="bottom-brand-bar"></div>

    <!-- Shot S08-1 (duration 9.0s) -->
    <section id="shot-1" class="clip" data-start="0" data-duration="9.0">
      <div id="shot-stage">
        
        <!-- Vùng nhãn dữ liệu cố định phía trên -->
        <div id="overlay-container">
          <!-- Overlay 1: atMs 61400 (relative 2.16s), holdMs 3000 -->
          <div id="overlay-1" class="data-plate">
            <span class="plate-text plate-text-light">3 CÔNG TẮC ĐỒNG DẠNG</span>
          </div>

          <!-- Overlay 2: atMs 66200 (relative 6.96s), holdMs 2000 -->
          <div id="overlay-2" class="data-plate">
            <span class="plate-text plate-text-orange">CHỈ 1 NÚT HOẠT ĐỘNG</span>
          </div>
        </div>

        <!-- Khung giới hạn hiển thị ảnh bảng điều khiển -->
        <div id="media-card">
          <div id="media-viewport">
            <div id="media-mover" data-layout-allow-overflow="true">
              <img
                id="hero-img"
                class="clip"
                src="assets/img-02-execution-chamber-control-buttons.jpg"
                alt="Execution chamber control buttons"
                data-start="0"
                data-duration="9.0"
              >
            </div>
          </div>
        </div>

      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. Vào cảnh Shot S08-1: transitionIn = wobble-drop (rơi và ổn định nhanh)
    tl.fromTo(
      "#shot-stage",
      { y: -140, rotation: -2, opacity: 0 },
      { y: 0, rotation: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
      0
    );

    // 2. Camera pan-left: viewport lia sang trái = nội dung dịch sang phải (x tăng dần)
    tl.fromTo(
      "#media-mover",
      { x: -90, y: 0 },
      { x: 70, y: -10, duration: 8.8, ease: "power1.inOut" },
      0
    );

    // 3. Overlay 1: "3 CÔNG TẮC ĐỒNG DẠNG" xuất hiện tại 2.16s, giữ đến 5.5s (hold >= 3000ms)
    tl.fromTo(
      "#overlay-1",
      { scale: 0.82, opacity: 0, y: -12 },
      { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
      2.16
    );
    tl.fromTo(
      "#overlay-1",
      { opacity: 1, scale: 1 },
      { opacity: 0, scale: 0.94, duration: 0.28, ease: "power2.in" },
      5.5
    );

    // 4. Overlay 2: "CHỈ 1 NÚT HOẠT ĐỘNG" xuất hiện tại 6.96s, giữ đến 8.9s (hold >= 2000ms)
    tl.fromTo(
      "#overlay-2",
      { scale: 0.82, opacity: 0, y: -12 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      6.96
    );

    window.__timelines["scene-s08"] = tl;
  </script>

    </template>
  </body>
</html>
