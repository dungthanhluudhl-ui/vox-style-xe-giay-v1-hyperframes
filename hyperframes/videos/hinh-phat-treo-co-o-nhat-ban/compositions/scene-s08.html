    <script>
      const tl = gsap.timeline({ paused: true });

      // ==========================================
      // SHOT 1: 0s -> 4.2s
      // ==========================================

      // 0.1s - 0.7s: Hiệu ứng Peel mở màn cho Shot 1
      tl.fromTo(
        "#shot1-stage",
        { clipPath: "polygon(0 0, 0 0, 0 100%, 0 100%)", opacity: 0 },
        {
          clipPath: "polygon(0 0, 100% 0, 100% 100%, 0 100%)",
          opacity: 1,
          duration: 0.65,
          ease: "power3.out",
        },
        0.1
      );

      // 0.35s - 0.75s: 3 nút bấm cam nảy vào tuần tự
      tl.fromTo(
        "#sw-btn-1",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.35
      );
      tl.fromTo(
        "#sw-btn-2",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.48
      );
      tl.fromTo(
        "#sw-btn-3",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.62
      );

      // 1.13s (atMs: 60370): Nhãn "PHÒNG ĐIỀU KHIỂN" xuất hiện tại HUD
      tl.fromTo(
        "#hud-card-1",
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        1.13
      );

      // 2.35s: Nhãn 1 mờ dần
      tl.to(
        "#hud-card-1",
        { opacity: 0, duration: 0.2, ease: "power2.out" },
        2.35
      );

      // 2.55s (atMs: 61790): Nhãn "3 NÚT BẤM SONG SONG" xuất hiện tại HUD
      tl.fromTo(
        "#hud-card-2",
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        2.55
      );

      // 3.8s: Nhãn 2 mờ dần
      tl.to(
        "#hud-card-2",
        { opacity: 0, duration: 0.2, ease: "power2.out" },
        3.8
      );

      // 3.9s - 4.15s: Shot 1 dissolve
      tl.to(
        "#shot-1",
        { opacity: 0, duration: 0.25, ease: "power2.inOut" },
        3.9
      );

      // ==========================================
      // SHOT 2: 4.1s -> 9.0s
      // ==========================================

      // Thiết lập đo chiều dài SVG paths cho nét vẽ stroke
      const pathWire1 = document.querySelector("#wire-1");
      const pathWire2 = document.querySelector("#wire-2");
      const pathWire3 = document.querySelector("#wire-3");
      const pathPulse = document.querySelector("#wire-2-pulse");

      const lenWire1 = pathWire1 ? Math.ceil(pathWire1.getTotalLength()) : 130;
      const lenWire2 = pathWire2 ? Math.ceil(pathWire2.getTotalLength()) : 750;
      const lenWire3 = pathWire3 ? Math.ceil(pathWire3.getTotalLength()) : 130;

      if (pathWire1) {
        pathWire1.style.strokeDasharray = lenWire1;
        pathWire1.style.strokeDashoffset = lenWire1;
      }
      if (pathWire3) {
        pathWire3.style.strokeDasharray = lenWire3;
        pathWire3.style.strokeDashoffset = lenWire3;
      }
      if (pathWire2) {
        pathWire2.style.strokeDasharray = lenWire2;
        pathWire2.style.strokeDashoffset = lenWire2;
      }
      if (pathPulse) {
        pathPulse.style.strokeDasharray = "50 150";
        pathPulse.style.strokeDashoffset = lenWire2;
      }

      // 4.1s: Shot 2 xuất hiện (Dissolve In)
      tl.fromTo(
        "#shot-2",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power2.inOut" },
        4.1
      );

      // 4.3s - 4.8s: Các đường dây ngắt mạch vẽ ra từ nút 1 và 3
      tl.to(
        "#wire-1",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        4.3
      );
      tl.to(
        "#wire-3",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        4.35
      );

      // 4.75s: Thẻ báo "NGẮT MẠCH"
      tl.fromTo(
        "#tag-cut-1",
        { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" },
        4.75
      );
      tl.fromTo(
        "#tag-cut-3",
        { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" },
        4.8
      );

      // 4.5s - 5.2s: Dây 2 màu cam vẽ xuyên vách ngăn nối thẳng vào Solenoid
      tl.to(
        "#wire-2",
        { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" },
        4.5
      );

      // 4.91s (atMs: 64150): Card Icon Cán Cân (Scale) xuất hiện
      tl.fromTo(
        "#scale-card",
        { y: -20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        4.91
      );

      // 5.25s: Solenoid nảy rung báo hiệu nhận tín hiệu kích hoạt
      tl.fromTo(
        "#solenoid-device",
        { scale: 1.0 },
        { scale: 1.04, duration: 0.15, yoyo: true, repeat: 3, ease: "power2.out" },
        5.25
      );

      // 5.3s - 6.8s: Xung điện phát sáng chạy dọc Dây 2
      tl.set("#wire-2-pulse", { opacity: 1 }, 5.3);
      tl.fromTo(
        "#wire-2-pulse",
        { strokeDashoffset: lenWire2 },
        { strokeDashoffset: 0, duration: 0.5, ease: "none", repeat: 2 },
        5.3
      );

      // 7.18s (atMs: 66420): Punch-phrase "CHỈ 1 NÚT KÍCH HOẠT" xuất hiện
      // Giữ chắc từ 7.18s đến 9.0s (1.82s > 1.6s)

        { scale: 0.88, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        7.18
      );

      // Đăng ký timeline cho runtime HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s08"] = tl;
    </script>
