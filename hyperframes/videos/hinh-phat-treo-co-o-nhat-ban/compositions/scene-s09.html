<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #E7E3D9;
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #E7E3D9;
      overflow: hidden;
    }
    .clip {
      position: absolute;
      inset: 0;
    }
    .video-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .video-strike-layer {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
    }
    .video-camera-layer {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
    }
    .spotlight-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(20, 20, 20, 0) 35%, rgba(20, 20, 20, 0.45) 100%);
      z-index: 5;
    }
    .brand-accent-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 50;
    }
    .overlay-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }
    .overlay-pos-top {
      position: absolute;
      top: 300px;
      left: 0;
      width: 1080px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .plate-anonymous {
      background-color: #141414;
      padding: 16px 36px;
      border-left: 8px solid #FF6A1A;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      opacity: 0;
      transform-origin: 50% 50%;
    }
    .text-anonymous {
      font-weight: 900;
      font-size: 42px;
      line-height: 1.2;
      color: #F7F4EC;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: block;
    }
    .overlay-pos-center {
      position: absolute;
      top: 740px;
      left: 0;
      width: 1080px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .plate-punch {
      background-color: #FF6A1A;
      padding: 24px 48px;
      border: 4px solid #141414;
      box-shadow: 10px 10px 0px #141414;
      opacity: 0;
      transform-origin: 50% 50%;
    }
    .text-punch {
      font-weight: 900;
      font-size: 64px;
      line-height: 1.2;
      color: #141414;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: block;
    }
  </style>

  <div id="root" data-composition-id="scene-s09" data-width="1080" data-height="1920" data-duration="9">
    <!-- Lớp video và camera motion bọc ngoài thẻ video không-timed -->
    <div class="video-viewport">
      <div id="video-strike-wrapper" class="video-strike-layer">
        <div id="video-camera-wrapper" class="video-camera-layer">
          <video
            id="vid-hero"
            src="assets/vid-02-execution-chamber-officers-buttons.mp4"
            muted
            playsinline
            data-start="0"
            data-duration="9"
            data-media-start="0"
            style="width: 100%; height: 100%; object-fit: cover;"
          ></video>
        </div>
      </div>
    </div>

    <!-- Spotlight vignette nền cảnh tối cho con-sequence beat -->
    <div class="spotlight-vignette"></div>

    <!-- Section timed bọc các lớp chữ overlays của shot S09-1 -->
    <section id="shot-1" class="clip" data-start="0" data-duration="9">
      <div class="overlay-container">
        <!-- Overlay 1: ẨN DANH NGƯỜI BẤM (atMs: 69000 -> 0.76s, holdMs: 3000) -->
        <div class="overlay-pos-top">
          <div id="plate-anonymous" class="plate-anonymous">
            <span class="text-anonymous">ẨN DANH NGƯỜI BẤM</span>
          </div>
        </div>

        <!-- Overlay 2: ẤN NÚT ĐỒNG THỜI (atMs: 74200 -> 5.96s, holdMs: 2900) -->
        <div class="overlay-pos-center">
          <div id="plate-punch" class="plate-punch">
            <span class="text-punch">ẤN NÚT ĐỒNG THỜI</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Thanh cam đáy cố định nhận diện thương hiệu -->
    <div class="brand-accent-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. TransitionIn "strike" dập mạnh vào đầu cảnh (t = 0.0s -> 0.35s)
    tl.fromTo(
      "#video-strike-wrapper",
      { scale: 1.24, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power4.out" },
      0
    );

    // 2. CameraMotion "zoom-in" chậm đều dẫn mắt người xem vào hành động (t = 0.0s -> 8.95s)
    tl.fromTo(
      "#video-camera-wrapper",
      { scale: 1 },
      { scale: 1.14, duration: 8.95, ease: "sine.inOut" },
      0
    );

    // 3. Overlay 1: "ẨN DANH NGƯỜI BẤM" (bắt đầu tại 0.76s, giữ > 3.0s, fade out tại 4.2s)
    tl.fromTo(
      "#plate-anonymous",
      { scale: 0.8, opacity: 0, y: -24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
      0.76
    );
    tl.fromTo(
      "#plate-anonymous",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -16, duration: 0.28, ease: "power2.in" },
      4.2
    );

    // 4. Overlay 2: "ẤN NÚT ĐỒNG THỜI" (dập mạnh tại 5.96s, giữ trọn vẹn tới hết cảnh)
    tl.fromTo(
      "#plate-punch",
      { scale: 1.7, opacity: 0, rotation: -3 },
      { scale: 1, opacity: 1, rotation: 0, duration: 0.35, ease: "power4.out" },
      5.96
    );

    window.__timelines["scene-s09"] = tl;
  </script>

    </template>
  </body>
</html>
