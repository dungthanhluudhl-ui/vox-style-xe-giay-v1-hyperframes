      tl.to("#overlay-diffusion-label", { opacity: 0, y: -16, duration: 0.3, ease: "power2.in" }, 2.85);

      // 3 trạm cai ngục & bục sập xuất hiện

      tl.set(".guard-hand-wrapper", { y: -25 }, 2.0);
      tl.fromTo("#trapdoor-station", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 2.4);

      // Khi tất cả trạm đã xuất hiện, bật sơ đồ dây kết nối (tránh lỗi connector_orphan)
      tl.to("#circuit-svg", { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.7);

      // Hiệu lệnh tay của quản giáo (3.6s - 4.4s)
      tl.to("#warden-signal-arm", { rotation: -24, duration: 0.35, ease: "power2.out" }, 3.6);
      tl.to("#warden-signal-arm", { rotation: 16, duration: 0.25, ease: "power3.in" }, 3.95);
      tl.to("#warden-signal-arm", { rotation: 0, duration: 0.3, ease: "power2.out" }, 4.2);

      tl.fromTo(".signal-spark", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1.2, duration: 0.25, ease: "power2.out" }, 3.95);
      tl.to(".signal-spark", { opacity: 0, duration: 0.3 }, 4.3);

      // Tín hiệu truyền tỏa xuống 3 trạm

      tl.to("#signal-wire-1, #signal-wire-2, #signal-wire-3", { stroke: "#141414", strokeWidth: 4, duration: 0.5 }, 5.0);

      // Bàn tay 3 cai ngục áp sát chuẩn bị dập

      // Overlay 2: "person" icon badge (atMs: 74430 -> 6.19s, hold: 1.4s đến 7.59s)
