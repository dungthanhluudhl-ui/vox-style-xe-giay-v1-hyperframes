    body {
      margin: 0;
      padding: 0;
      background-color: #141414;
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      background-image: 
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }
    .clip {
      position: absolute;
      inset: 0;

    #media-card {
      position: absolute;
      top: 220px;

      width: 940px;
      height: 1080px;
      overflow: hidden;
      background-color: #F5F0E4;
      border: 4px solid #141414;
      box-shadow: 12px 12px 0px #141414;
      border-radius: 4px;
      z-index: 10;
    }
    #pan-wrapper {
      position: relative;
      width: 1200px;
      height: 1080px;
    }
    #media-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .overlay-badge {
      position: absolute;
      height: auto;
      padding: 18px 32px;
      font-size: 40px;
      font-weight: 900;

      letter-spacing: 0.04em;
      border-radius: 6px;
      border: 3px solid #141414;
      box-shadow: 8px 8px 0px #141414;

      top: 1160px;

  <div id="root" data-composition-id="scene-s43" data-width="1080" data-height="1920" data-duration="6">
    <section id="shot-1" class="clip" data-start="0" data-duration="6">
      <div id="media-card">
        <div id="pan-wrapper">
          <img id="media-img" src="assets/img-09-crying-hungry-man-prison-contrast.jpg" alt="">
        </div>
      </div>
      <div id="overlay-1" class="overlay-badge hf-plate-ink">CỬA HÀNG TIỆN LỢI</div>
      <div id="overlay-2" class="overlay-badge hf-hl-orange">MUA NHU YẾU PHẨM</div>
    </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // TransitionIn (grow) cho media card
    tl.fromTo("#media-card", 
      { scale: 0.75, opacity: 0 }, 
      { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 
      0
    );

    // Camera motion (pan-right: viewport sang phải, ảnh dịch sang trái)
    tl.fromTo("#pan-wrapper", 
      { x: 0 }, 
      { x: -200, duration: 6.0, ease: "none" }, 
      0
    );

    // Overlay 1: CỬA HÀNG TIỆN LỢI (xuất hiện tại 0.76s, giữ 2.5s, fade out lúc 3.26s)
    tl.fromTo("#overlay-1", 
      { scale: 0.7, opacity: 0, y: -20 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 
      0.76
    );
    tl.fromTo("#overlay-1", 
      { opacity: 1 }, 
      { opacity: 0, duration: 0.25, ease: "power2.in" }, 
      3.26
    );

    // Overlay 2: MUA NHU YẾU PHẨM (xuất hiện tại 3.56s, giữ 2.3s, fade out lúc 5.86s)
    tl.fromTo("#overlay-2", 
      { scale: 0.7, opacity: 0, y: 20 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 
      3.56
    );
    tl.fromTo("#overlay-2", 
      { opacity: 1 }, 
      { opacity: 0, duration: 0.12, ease: "power2.in" }, 
      5.86
    );

    window.__timelines["scene-s43"] = tl;
  </script>
