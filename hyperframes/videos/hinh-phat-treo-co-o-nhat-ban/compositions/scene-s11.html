    <script>
      const tl = gsap.timeline({ paused: true });

      // Measure SVG path lengths deterministically
      const ecgLine = document.getElementById("ecg-line");
      const ecgLength = ecgLine ? ecgLine.getTotalLength() : 280;
      if (ecgLine) {
        ecgLine.style.strokeDasharray = ecgLength;
        ecgLine.style.strokeDashoffset = ecgLength;
      }

      const spineActive = document.getElementById("spine-active");
      const spineLength = 720;
      if (spineActive) {
        spineActive.style.strokeDasharray = spineLength;
        spineActive.style.strokeDashoffset = spineLength;
      }

      // Initial Scene Rise Entrance (0.0s - 0.6s)
      tl.fromTo(
        "#stage",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0
      );

      // Camera pan-right: subtle, controlled drift to the left over entire duration
      tl.fromTo(
        "#stage",
        { x: 15 },
        { x: -15, duration: 7.35, ease: "sine.inOut" },
        0
      );

      // --- PHASE 1: Step 1 (Xác nhận tử vong / Kiểm tra y tế) ---
      // Row 1 arrives
      tl.fromTo(
        "#row-step-1",
        { y: 25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.3
      );
      tl.add(() => {
        const n1 = document.getElementById("node-1");
        if (n1) n1.classList.add("active-node");
      }, 0.5);

      // Spine begins connecting downwards
      tl.fromTo(
        "#spine-active",
        { strokeDashoffset: spineLength },
        { strokeDashoffset: spineLength - 120, duration: 0.6, ease: "power2.out" },
        0.4
      );

      // ECG heartbeat trace draws across screen and flatlines
      tl.to(
        "#ecg-line",
        { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" },
        0.6
      );

      // Overlay 1: Check icon appears at 86190ms (1.30s), holds 1500ms
      tl.fromTo(
        "#overlay-check",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        1.30
      );
      tl.to(
        "#overlay-check",
        { opacity: 0, scale: 0.9, duration: 0.3, ease: "power2.in" },
        2.80
      );

      // Overlay 2: Label "KIỂM TRA Y TẾ" appears at 87530ms (2.64s), holds 1600ms (until 4.24s)
      tl.fromTo(
        "#overlay-label-medical",
        { y: 10, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        2.64
      );
      tl.to(
        "#overlay-label-medical",
        { opacity: 0, y: -6, duration: 0.3, ease: "power2.in" },
        4.24
      );

      // --- PHASE 2: Step 2 (Tắm rửa tẩy trần / Yu-kan) ---
      // Spine draws to Node 2
      tl.to(
        "#spine-active",
        { strokeDashoffset: spineLength - 340, duration: 0.6, ease: "power2.out" },
        2.2
      );

      tl.fromTo(
        "#row-step-2",
        { y: 25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        2.4
      );
      tl.add(() => {
        const n2 = document.getElementById("node-2");
        if (n2) n2.classList.add("active-node");
      }, 2.55);

      // Water droplet falls into the basin
      tl.fromTo(
        "#water-droplet",
        { y: -16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power2.in" },
        2.7
      );

      // --- PHASE 3: Step 3 (Thay y phục trắng) ---
      // Spine draws to Node 3
      tl.to(
        "#spine-active",
        { strokeDashoffset: spineLength - 570, duration: 0.6, ease: "power2.out" },
        3.6
      );

      tl.fromTo(
        "#row-step-3",
        { y: 25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        3.8
      );
      tl.add(() => {
        const n3 = document.getElementById("node-3");
        if (n3) n3.classList.add("active-node");
      }, 3.95);

      tl.fromTo(
        "#shroud-svg",
        { scale: 0.92, opacity: 0.5 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        3.9
      );

      // --- PHASE 4: Step 4 (Nhập quan tài gỗ & Niêm phong) ---
      // Spine completes connection to Node 4
      tl.to(
        "#spine-active",
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        4.8
      );

      tl.fromTo(
        "#row-step-4",
        { y: 25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        5.0
      );
      tl.add(() => {
        const n4 = document.getElementById("node-4");
        if (n4) n4.classList.add("active-node");
      }, 5.15);

      // Coffin lid slides/lowers firmly onto the casket
      tl.fromTo(
        "#coffin-lid",
        { y: -24, opacity: 0.7 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.inOut" },
        5.30
      );

      // Overlay 3: Label "NGHI THỨC KHẢM LIỆM" appears at 90650ms (5.76s), holds until end
      tl.fromTo(
        "#overlay-label-burial",
        { scale: 0.85, opacity: 0, y: 8 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        5.76
      );

      // Judicial seal stamps down firmly over the casket
      tl.fromTo(
        "#coffin-seal",
        { scale: 2.2, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        6.15
      );

      // Register timeline to HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s11"] = tl;
    </script>
  
    </template>
