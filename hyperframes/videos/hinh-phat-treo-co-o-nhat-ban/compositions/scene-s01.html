    <div

                <line x1="22" y1="78" x2="78" y2="22" stroke="#FF6A1A" stroke-width="12" stroke-linecap="round"/>

            <!-- Label ngữ cảnh phương Tây -->

          </div>
        </div>

      <!-- SHOT 2: Thòng lọng treo cổ kinh hoàng (5.22s - 9.84s) -->
      <section id="shot-2" class="clip" data-start="5.22" data-duration="4.62">
        <div id="shot-2-camera" class="camera-viewport">
          <div id="shot-2-content" style="position: absolute; inset: 0;">
            <!-- Cụm thòng lọng dây thừng tự vẽ hạ từ trần -->
            <div id="noose-rig" class="noose-rig">
              <div id="noose-swing" class="noose-swing-group">

                  <path d="M 536 0 L 536 480" stroke="#FF6A1A" stroke-width="5" stroke-linecap="square"/>

                  <!-- Các vạch vân xoắn trên dây thừng trục đứng -->
                  <line x1="530" y1="80" x2="550" y2="95" stroke="#F5F0E4" stroke-width="4"/>
                  <line x1="530" y1="140" x2="550" y2="155" stroke="#F5F0E4" stroke-width="4"/>
                  <line x1="530" y1="200" x2="550" y2="215" stroke="#F5F0E4" stroke-width="4"/>
                  <line x1="530" y1="260" x2="550" y2="275" stroke="#F5F0E4" stroke-width="4"/>
                  <line x1="530" y1="320" x2="550" y2="335" stroke="#F5F0E4" stroke-width="4"/>
                  <line x1="530" y1="380" x2="550" y2="395" stroke="#F5F0E4" stroke-width="4"/>
                  <line x1="530" y1="440" x2="550" y2="455" stroke="#F5F0E4" stroke-width="4"/>

                  <!-- Nút thắt cuộn dây thừng nhiều vòng (Hangman's knot) -->
                  <g id="noose-knot">
                    <!-- Khối nút thắt trung tâm -->
                    <rect x="510" y="480" width="60" height="150" rx="10" fill="#141414" stroke="#FF6A1A" stroke-width="4"/>
                    <!-- Các cuộn vòng thừng quấn ngang -->
                    <line x1="512" y1="505" x2="568" y2="505" stroke="#F5F0E4" stroke-width="6"/>
                    <line x1="512" y1="530" x2="568" y2="530" stroke="#F5F0E4" stroke-width="6"/>
                    <line x1="512" y1="555" x2="568" y2="555" stroke="#F5F0E4" stroke-width="6"/>
                    <line x1="512" y1="580" x2="568" y2="580" stroke="#F5F0E4" stroke-width="6"/>
                    <line x1="512" y1="605" x2="568" y2="605" stroke="#F5F0E4" stroke-width="6"/>

                  <!-- Đoạn dây thừa thắt nút chỉa ra bên cạnh -->
                  <path d="M 565 620 C 585 640, 595 670, 580 700" stroke="#141414" stroke-width="14" stroke-linecap="round"/>
                  <path d="M 565 620 C 585 640, 595 670, 580 700" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round"/>

                  <!-- Vòng thòng lọng chính thả thòng xuống -->
                  <path

            </div>

            <!-- Punch phrase của cảnh: HÌNH PHẠT TREO CỔ -->
            <div id="punch-phrase-wrapper" class="punch-phrase-card">
              <!-- Icon cảnh báo gắn nổi trên đầu thẻ -->
              <div id="icon-warning" class="warning-badge-wrap">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 3L2 21H22L12 3Z" fill="#141414" stroke="#141414" stroke-width="2" stroke-linejoin="round"/>
                  <line x1="12" y1="9" x2="12" y2="14" stroke="#FF6A1A" stroke-width="2.5" stroke-linecap="round"/>

    </div>

    <script>
      // Khởi tạo Timeline HyperFrames chính duy nhất
      const tl = gsap.timeline({ paused: true });

      // ==========================================
      // SHOT 1: 0.00s -> 5.22s
      // ==========================================

      // 1. Cú nảy Punch dứt khoát mở đầu cho Ống tiêm (t=0.15s)
      tl.fromTo(
        "#syringe-wrapper",
        { scale: 0.2, opacity: 0, rotation: -15 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.65, ease: "power4.out" },
        0.15
      );

      // 2. Camera zoom-in chậm rãi tạo kịch tính trong suốt Shot 1
      tl.fromTo(
        "#shot-1-camera",
        { scale: 0.96 },
        { scale: 1.07, duration: 5.0, ease: "none" },
        0.15
      );

      // 3. Label "PHƯƠNG TÂY: TIÊM THUỐC" trồi lên ở 2.98s
      tl.fromTo(
        "#label-west",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        2.98
      );

      // 4. Vạch gạch chéo cam quất mạnh phủ định tiêm thuốc ở 4.06s
      tl.fromTo(
        "#cross-strike",
        { strokeDashoffset: 600 },
        { strokeDashoffset: 0, duration: 0.3, ease: "power4.out" },
        4.06
      );

      // 5. Icon Ban đập dứt khoát cùng lúc vạch gạch chéo xuất hiện (nghiêm trang, không cartoon)
      tl.fromTo(
        "#icon-ban",
        { scale: 0.2, opacity: 0, rotation: -25 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.35, ease: "expo.out" },
        4.06
      );

      // Ống tiêm mờ đi sau khi bị phủ định
      tl.to(
        "#syringe-group",
        { opacity: 0.25, duration: 0.35, ease: "power2.out" },
        4.15
      );

      // Chuẩn bị kết thúc Shot 1 mượt mà (fade nhẹ trước điểm cắt)
      tl.to(
        "#shot-1-content",
        { opacity: 0, duration: 0.22, ease: "power2.in" },
        4.98
      );

      // ==========================================
      // SHOT 2: 5.22s -> 9.84s
      // ==========================================

      // 1. Thòng lọng hạ từ đỉnh khung hình xuống giữa vùng spotlight (5.22s)
      tl.fromTo(
        "#noose-rig",
        { y: -650, opacity: 0 },
        { y: 0, opacity: 1, duration: 1.45, ease: "power3.out" },
        5.22
      );

      // 2. Chuyển động camera pan sang phải nhẹ & trôi chậm
      tl.fromTo(
        "#shot-2-camera",
        { x: 30, scale: 0.98 },
        { x: -20, scale: 1.05, duration: 4.6, ease: "sine.out" },
        5.22
      );

      // 3. Chuỗi đung đưa pendulum tất định, giảm dần biên độ và dừng hẳn ở góc 0
      tl.fromTo(
        "#noose-swing",
        { rotation: -3 },
        { rotation: 2.2, duration: 1.1, ease: "sine.inOut" },
        6.67
      );
      tl.to(
        "#noose-swing",
        { rotation: -1.2, duration: 0.9, ease: "sine.inOut" },
        7.77
      );
      tl.to(
        "#noose-swing",
        { rotation: 0.5, duration: 0.7, ease: "sine.inOut" },
        8.67
      );
      tl.to(
        "#noose-swing",
        { rotation: 0, duration: 0.5, ease: "sine.out" },
        9.37
      );

      // 4. Punch phrase "HÌNH PHẠT TREO CỔ" xuất hiện ở 6.77s (giữ hơn 3s)
      tl.fromTo(
        "#punch-phrase-wrapper",
        { scale: 0.85, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.65, ease: "power3.out" },
        6.77
      );

      // 5. Icon Warning hạ cánh vững vàng ở đỉnh thẻ chữ tại 8.55s (trọng lực, không nảy cợt nhả)
      tl.fromTo(
        "#icon-warning",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        8.55
      );

      // Đăng ký timeline cho HyperFrames
      window.__timelines["scene-s01"] = tl;
    </script>
