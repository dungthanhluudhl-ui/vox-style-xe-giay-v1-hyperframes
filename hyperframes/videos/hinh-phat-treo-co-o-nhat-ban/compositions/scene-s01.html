<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
    }
    .clip {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .bg-spotlight {
      position: absolute;
      inset: 0;
      background-color: #0f0f0f;
      background-image: radial-gradient(circle at 50% 45%, rgba(35, 33, 30, 0.8) 10%, rgba(15, 15, 15, 1) 100%);
      z-index: 1;
    }
    #stage-wrapper {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      z-index: 2;
    }

    /* Bố cục chia đôi đối lập 50/50 (Split Layout) */
    .split-pane {
      position: absolute;
      top: 0;
      width: 540px;
      height: 1920px;
      overflow: hidden;
    }

    /* Pane trái: Hình ảnh đối lập - Tiêm thuốc độc bị loại */
    #pane-left {
      left: 0;
      background-color: #161514;
      background-image: radial-gradient(circle at 50% 45%, rgba(35, 32, 28, 0.95) 0%, rgba(18, 17, 16, 1) 100%);
      z-index: 3;
    }
    .left-content-wrapper {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .toxic-card {
      position: relative;
      width: 480px;
      background-color: #141414;
      border: 4px solid #FF6A1A;
      border-radius: 16px;
      padding: 26px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toxic-label {
      color: #F7F4EC;
      font-size: 36px;
      font-weight: 900;
      line-height: 1.3;
      text-align: center;
      letter-spacing: 0.5px;
      white-space: normal;
      word-break: keep-all;
    }
    .toxic-strike-line {
      position: absolute;
      left: -14px;
      right: -14px;
      top: 50%;
      height: 10px;
      background-color: #FF6A1A;
      transform: translateY(-50%) rotate(-8deg);
      border-radius: 5px;
      box-shadow: 0 4px 14px rgba(255, 106, 26, 0.65);
    }

    /* Pane phải: Án treo cổ Nhật Bản - Video thòng lọng đung đưa */
    #pane-right {
      left: 540px;
      background-color: #0d0d0d;
      z-index: 3;
    }
    #video-camera-wrapper {
      position: absolute;
      left: -270px;
      top: 0;
      width: 1080px;
      height: 1920px;
      transform-origin: 50% 35%;
    }
    #vid-10 {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Vạch phân cách chia đôi màu cam ở giữa */
    #split-divider {
      position: absolute;
      left: 537px;
      top: 0;
      width: 6px;
      height: 1920px;
      background-color: #FF6A1A;
      box-shadow: 0 0 20px rgba(255, 106, 26, 0.8), 0 0 40px rgba(255, 106, 26, 0.4);
      z-index: 10;
    }

    /* Punch phrase trên pane phải */
    #shot-1-overlays {
      z-index: 20;
    }
    .punch-container {
      position: absolute;
      left: 540px;
      top: 980px;
      width: 540px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
    }
    .punch-plate {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 22px 28px;
      background-color: #141414;
      border-radius: 14px;
      border-left: 10px solid #FF6A1A;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      max-width: 500px;
    }
    .punch-text {
      color: #F7F4EC;
      font-size: 42px;
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: 0.5px;
      text-align: center;
      white-space: normal;
      word-break: keep-all;
    }

    /* Thanh cam nhận diện cố định ở mép dưới */
    .bottom-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s01" data-width="1080" data-height="1920" data-duration="9.84">
    <div class="bg-spotlight"></div>

    <div id="stage-wrapper">
      <!-- Bố cục chia đôi hình ảnh đối lập (Split screen) -->
      <div id="pane-left" class="split-pane">
        <div class="left-content-wrapper">
          <div id="toxic-card" class="toxic-card">
            <span class="toxic-label">TIÊM THUỐC ĐỘC [LOẠI]</span>
            <div id="toxic-strike" class="toxic-strike-line"></div>
          </div>
        </div>
      </div>

      <div id="pane-right" class="split-pane">
        <div id="video-camera-wrapper">
          <video id="vid-10"
                 src="assets/vid-10-death-penalty-execution-cutout.mp4"
                 muted
                 playsinline
                 data-start="0"
                 data-duration="9.84"
                 data-media-start="0">
          </video>
        </div>
      </div>

      <div id="split-divider"></div>
    </div>

    <section id="shot-1-overlays" class="clip" data-start="0" data-duration="9.84">
      <div class="punch-container">
        <div id="punch-plate" class="punch-plate">
          <span class="punch-text">TREO CỔ NHẬT BẢN</span>
        </div>
      </div>
    </section>

    <div class="bottom-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Transition In (zoom-through): Toàn bộ khung cảnh lao xuyên qua bục gỗ u ám
    tl.fromTo("#stage-wrapper",
      { scale: 2.2, opacity: 0, transformOrigin: "50% 45%" },
      { scale: 1.0, opacity: 1, duration: 0.65, ease: "power3.out" },
      0
    );

    // Vạch chia cam phân tách 2 thế giới đối lập xuất hiện
    tl.fromTo("#split-divider",
      { scaleY: 0, transformOrigin: "top center" },
      { scaleY: 1, duration: 0.45, ease: "power2.out" },
      0.25
    );

    // Camera lia sát vào sợi dây thòng lọng đung đưa ở pane phải
    tl.fromTo("#video-camera-wrapper",
      { scale: 1.0, y: 0 },
      { scale: 1.25, y: -80, duration: 9.19, ease: "none" },
      0.65
    );

    // Bên trái: dán khối chữ 'TIÊM THUỐC ĐỘC [LOẠI]' lúc 2.8s
    tl.fromTo("#toxic-card",
      { scale: 0.6, opacity: 0, y: 30 },
      { scale: 1.0, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      2.8
    );

    // Vạch gạch chéo cam dứt khoát gạch bỏ phương án tiêm thuốc độc
    tl.fromTo("#toxic-strike",
      { scaleX: 0, transformOrigin: "left center" },
      { scaleX: 1, duration: 0.25, ease: "power4.out" },
      3.2
    );

    // Giữ đủ 3400ms hold rồi hạ độ tương phản để nhường sự chú ý cho phương án án treo cổ
    tl.fromTo("#toxic-card",
      { opacity: 1 },
      { opacity: 0.35, duration: 0.3, ease: "power2.out" },
      6.2
    );

    // Bên phải: xuất hiện punch-phrase 'TREO CỔ NHẬT BẢN' lúc 6.5s
    tl.fromTo("#punch-plate",
      { scale: 0.65, opacity: 0, y: 30 },
      { scale: 1.0, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      6.5
    );

    // Kết thúc trước biên duration của shot
    tl.fromTo("#punch-plate",
      { opacity: 1 },
      { opacity: 0, duration: 0.12, ease: "none" },
      9.7
    );

    window.__timelines["scene-s01"] = tl;
  </script>

    </template>
  </body>
</html>
