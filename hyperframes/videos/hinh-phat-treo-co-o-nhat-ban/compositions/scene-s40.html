      const tl = gsap.timeline({ paused: true });

      const sigPath = document.getElementById("live-sig-path");
      if (sigPath) {
        const sigLen = sigPath.getTotalLength();
        sigPath.style.strokeDasharray = sigLen;
        sigPath.style.strokeDashoffset = sigLen;
      }

      const checkPath = document.getElementById("svg-check-tick");
      if (checkPath) {
        const checkLen = checkPath.getTotalLength();
        checkPath.style.strokeDasharray = checkLen;
        checkPath.style.strokeDashoffset = checkLen;
      }

      // ==========================================
      // SHOT 1 CHOREOGRAPHY (0.0s -> 3.65s)
      // ==========================================

      // 1. Entrance: Document 3D flip into scene
      tl.fromTo(
        "#contract-sheet",
        { rotationX: 25, y: 70, opacity: 0 },
        { rotationX: 0, y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.1
      );

      // 2. Icon doc badge pop in
      tl.fromTo(
        "#icon-doc-badge",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.93
      );

      // 3. Orange Signature Stroke Draw & Pen movement
      tl.fromTo(
        "#pen-tool",
        { opacity: 0, x: 20, y: 35 },
        { opacity: 1, x: 30, y: 35, duration: 0.15, ease: "power2.out" },
        1.05
      );

      tl.to(
        "#live-sig-path",
        { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" },
        1.2
      );

      tl.to(
        "#pen-tool",
        { x: 310, y: 20, duration: 0.8, ease: "power2.out" },
        1.2
      );
