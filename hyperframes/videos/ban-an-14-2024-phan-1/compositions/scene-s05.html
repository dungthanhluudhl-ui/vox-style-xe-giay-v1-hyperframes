<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Quy ước layout chuẩn HyperFrames */
    .clip {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Lớp màu an toàn WCAG chuẩn style tokens */
    .hf-text-ink {
      color: #141414;
    }

    .hf-text-light {
      color: #F7F4EC;
    }

    .hf-hl-orange {
      background-color: #FF6A1A;
      color: #141414;
    }

    .hf-plate-ink {
      background-color: #141414;
      color: #F7F4EC;
    }

    .hf-plate-ink-orange {
      background-color: #141414;
      color: #FF6A1A;
    }

    .hf-plate-paper {
      background-color: #E7E3D9;
      color: #141414;
    }

    /* Nền thẻ phẳng phong cách card */
    #card-bg {
      position: absolute;
      inset: 0;
      background: #F5F0E4;
      z-index: 1;
    }

    /* Container video không mang data-start để tránh lỗi lint video_nested_in_timed_element */
    #video-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 2;
    }

    #video-scaler {
      width: 100%;
      height: 100%;
      transform-origin: 50% 55%;
    }

    #court-video {
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      display: block;
    }

    /* Lớp overlay chứa các nhãn hồ sơ pháp đình */
    #shot-overlay {
      z-index: 10;
    }

    /* 1. Header hồ sơ vụ án */
    #dossier-bar {
      position: absolute;
      top: 180px;
      left: 60px;
      right: 60px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 16px;
      border-radius: 8px;
      border-left: 6px solid #FF6A1A;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .dossier-tag {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1.5px;
      padding: 4px 12px;
      border-radius: 4px;
      text-transform: uppercase;
      line-height: 1;
    }

    .dossier-text {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 2. Con dấu pháp đình và biểu tượng cán cân công lý */
    #scale-badge {
      position: absolute;
      top: 252px;
      left: 60px;
      width: 136px;
      height: 136px;
      border-radius: 12px;
      border: 3px solid #FF6A1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .scale-path {
      fill: none;
      stroke: #FF6A1A;
      stroke-width: 3.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .scale-caption {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* 3. Nhãn trạng thái tố tụng */
    #label-badge {
      position: absolute;
      top: 408px;
      left: 60px;
      padding: 12px 24px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .label-text {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1;
      display: block;
    }

    /* 4. Thẻ tiêu đề chính (punch-phrase) */
    #punch-card {
      position: absolute;
      top: 488px;
      left: 60px;
      right: 60px;
      padding: 24px 32px;
      border-radius: 12px;
      border-left: 12px solid #FF6A1A;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

    .punch-sub {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
      line-height: 1;
    }

    .punch-title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.15;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Thanh thương hiệu cam cố định ở chân khung hình */
    #bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 12px;
      background: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s05"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="6.25"
  >
    <!-- Nền phong cách card -->
    <div id="card-bg"></div>

    <!-- Wrapper cho video: không chứa data-start để đáp ứng hợp đồng video HyperFrames -->
    <div id="video-viewport">
      <div id="video-scaler">
        <video
          id="court-video"
          src="assets/vid-01-defendant-standing-courtroom-trial.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="6.25"
          data-media-start="0.8"
        ></video>
      </div>
    </div>

    <!-- Lớp đồ họa thông tin và tài liệu tòa án -->
    <section id="shot-overlay" class="clip" data-start="0" data-duration="6.25">
      <!-- Hồ sơ tố tụng -->
      <div id="dossier-bar" class="hf-plate-ink">
        <span class="dossier-tag hf-hl-orange">HỒ SƠ TỐ TỤNG</span>
        <span class="dossier-text hf-text-light">TÒA ÁN NHÂN DÂN TỈNH HÒA BÌNH</span>
      </div>

      <!-- Icon cán cân công lý (scale) tự vẽ dạng vector -->
      <div id="scale-badge" class="hf-plate-ink">
        <svg id="scale-svg" viewBox="0 0 100 100" width="76" height="76">
          <path class="scale-path" d="M 28 86 L 72 86" />
          <path class="scale-path" d="M 50 86 L 50 18" />
          <path class="scale-path" d="M 18 28 L 82 28" />
          <path class="scale-path" d="M 18 28 L 8 52 L 28 52 Z" />
          <path class="scale-path" d="M 82 28 L 72 52 L 92 52 Z" />
        </svg>
        <span class="scale-caption hf-text-light">CÁN CÂN CÔNG LÝ</span>
      </div>

      <!-- Nhãn trạng thái phiên tòa -->
      <div id="label-badge" class="hf-hl-orange">
        <span class="label-text hf-text-ink">XÉT XỬ SƠ THẨM</span>
      </div>

      <!-- Tiêu đề điểm nhấn xác thực vụ án -->
      <div id="punch-card" class="hf-plate-ink">
        <div class="punch-sub hf-plate-ink-orange">VỤ ÁN HÌNH SỰ CÓ THẬT</div>
        <div class="punch-title hf-text-light">TÒA ÁN HÒA BÌNH</div>
      </div>
    </section>

    <!-- Thanh cam đáy khung hình nhận diện thương hiệu Vox -->
    <div id="bottom-bar"></div>
  </div>

  <script>
    // Khởi tạo trạng thái đường nét cho biểu tượng SVG
    const scalePaths = document.querySelectorAll(".scale-path");
    scalePaths.forEach((path) => {
      const len = path.getTotalLength();
      path.style.strokeDasharray = `${len}`;
      path.style.strokeDashoffset = `${len}`;
    });

    // Tạo GSAP timeline chính bị tạm dừng theo hợp đồng tìm kiếm khung hình tất định
    const tl = gsap.timeline({ paused: true });

    // 1. Chuyển động vào cảnh (transitionIn: rise) đưa phòng xử án lên trang nghiêm
    tl.fromTo(
      "#video-viewport",
      { y: 70, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
      0
    );

    // 2. Camera zoom chậm rãi vào biểu cảm lo âu của bị cáo trước bục khai báo
    tl.fromTo(
      "#video-scaler",
      { scale: 1.0 },
      { scale: 1.08, duration: 6.25, ease: "none" },
      0
    );

    // 3. Thanh hồ sơ tố tụng trượt xuống xác lập bối cảnh biên bản pháp lý
    tl.fromTo(
      "#dossier-bar",
      { y: -24, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.4
    );

    // 4. Biểu tượng cán cân công lý (scale) xuất hiện lúc 2.285s (atMs: 27360)
    tl.fromTo(
      "#scale-badge",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      2.285
    );

    // Hiệu ứng tự vẽ nét cho cán cân công lý
    scalePaths.forEach((path, idx) => {
      tl.to(
        path,
        {
          strokeDashoffset: 0,
          duration: 0.45,
          ease: "power2.out"
        },
        2.38 + idx * 0.06
      );
    });

    // Cán cân hoàn thành vai trò xác thực và mờ dần lúc 4.285s (holdMs: 2000)
    tl.to(
      "#scale-badge",
      {
        scale: 0.85,
        opacity: 0,
        duration: 0.35,
        ease: "power2.in"
      },
      4.285
    );

    // 5. Nhãn XÉT XỬ SƠ THẨM xuất hiện lúc 3.605s (atMs: 28680)
    tl.fromTo(
      "#label-badge",
      { x: -36, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      3.605
    );

    // 6. Punch-phrase TÒA ÁN HÒA BÌNH xuất hiện dứt khoát lúc 4.515s (atMs: 29590)
    tl.fromTo(
      "#punch-card",
      { y: 32, opacity: 0, scale: 0.94 },
      { y: 0, opacity: 1, scale: 1.0, duration: 0.5, ease: "power3.out" },
      4.515
    );

    // Đăng ký timeline cho HyperFrames runtime
    window.__timelines["scene-s05"] = tl;
  </script>

    </template>
  </body>
</html>
