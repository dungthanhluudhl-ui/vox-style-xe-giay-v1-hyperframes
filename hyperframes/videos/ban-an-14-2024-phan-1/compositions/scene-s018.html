    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1. Measure SVG paths for deterministic progressive draw
      const warnTriangle = document.getElementById("warn-triangle");
      const warnBar = document.getElementById("warn-bar");

      if (warnTriangle) {
        const lenTriangle = warnTriangle.getTotalLength();
        warnTriangle.style.strokeDasharray = lenTriangle;
        warnTriangle.style.strokeDashoffset = lenTriangle;
      }

      if (warnBar) {
        const lenBar = warnBar.getTotalLength();
        warnBar.style.strokeDasharray = lenBar;
        warnBar.style.strokeDashoffset = lenBar;
      }

      // 2. Camera pan-right across full duration (from attacker H on left to victim Th on right)
      tl.fromTo(
        "#camera-rig",
        { x: 50 },
        { x: -70, duration: 6.32, ease: "none" },
        0
      );

      // 3. Wobble-drop entrance for hero image (sudden destabilizing arrival)
      tl.fromTo(
        "#image-card",
        { y: -160, rotation: -3.5, scale: 1.12, opacity: 0 },
        { y: 0, rotation: 0, scale: 1.05, opacity: 1, duration: 0.65, ease: "power3.out" },
        0
      );

      // 4. Punch phrase card entrance at 1.75s, followed by smooth exit before clip window ends
      tl.fromTo(
        "#punch-card",
        { scale: 0.86, y: -25, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.75
      );
      tl.to(
        "#punch-card",
        { opacity: 0, y: -16, duration: 0.22, ease: "power2.in" },
        3.92
      );

      // 5. Warning icon badge entrance at 3.62s + self-drawing SVG sequence
      tl.fromTo(
        "#warning-badge",
        { scale: 0, opacity: 0, rotation: -15 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.35, ease: "power3.out" },
        3.62
      );
      tl.to(
        "#warn-triangle",
        { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
        3.75
      );
      tl.to(
        "#warn-bar",
        { strokeDashoffset: 0, duration: 0.24, ease: "power2.out" },
        3.94
      );
      tl.fromTo(
        "#warn-dot",
        { scale: 0, transformOrigin: "50% 50%" },
        { scale: 1, duration: 0.18, ease: "back.out(2)" },
        4.08
      );
      tl.to(
        "#warning-badge",
        { opacity: 0, scale: 0.85, duration: 0.2, ease: "power2.in" },
        5.4
      );

      // 6. Reaction Status Label entrance at 4.36s (holds through scene end)
      tl.fromTo(
        "#label-card",
        { y: 28, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        4.36
      );

      // Bind root paused timeline to HyperFrames runtime
      window.__timelines["scene-s018"] = tl;
