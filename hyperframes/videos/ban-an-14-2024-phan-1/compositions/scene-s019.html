  <div

  <script>
    // Initialize SVG path stroke metrics for deterministic draw
    const slashes = ["#slash-1", "#slash-2", "#slash-3"];
    slashes.forEach(function(selector) {
      const el = document.querySelector(selector);
      if (el) {
        const len = el.getTotalLength();
        el.style.strokeDasharray = len + 10;
        el.style.strokeDashoffset = len + 10;
      }

    // Create single paused master timeline
    const tl = gsap.timeline({ paused: true });

    // 1. Camera Motion: Subtle continuous zoom-in on untimed video wrapper

      "#video-wrapper",
      { scale: 1 },
      { scale: 1.08, duration: 9.645, ease: "none" },
      0

    // 2. Shatter Entrance Animation (t = 0.0s -> 0.6s)

    tl.to("#shard-2", { x: 420, y: -320, rotation: 24, opacity: 0, duration: 0.55, ease: "power3.out" }, 0.04);

    tl.to("#shard-6", { x: 380, y: 440, rotation: 20, opacity: 0, duration: 0.55, ease: "power3.out" }, 0.04);

    // 3. Beat 1: Warning Badge & Title Entrance (0.91s & 1.68s)

      "#attack-badge-row",
      { y: -24, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      0.91

    tl.fromTo(

      { y: 35, opacity: 0 },

    // 4. Strike Sequence (Diagram + Slashes)

    tl.to(

    );
    tl.to(
      "#strike-box-1",
      { scale: 1.0, duration: 0.2, ease: "power2.out" },
      2.12
    );

    // Strike 2 (2.40s)

      2.40
    );
    tl.to(

      { opacity: 0, duration: 0.35, ease: "power1.out" },
      2.58
    );
    tl.to(
      "#strike-box-2",
      { backgroundColor: "#FF6A1A", scale: 1.05, duration: 0.18, ease: "power3.out" },

    tl.to(

    tl.to(

    tl.to(
