    <div

    <script>
      // Single paused master timeline for HyperFrames
      const tl = gsap.timeline({ paused: true });

      // Path length measurements for stroke-draw SVGs
      const checkCircle = document.getElementById("check-circle");
      const checkTick = document.getElementById("check-tick");
      const banCircle = document.getElementById("ban-circle");
      const banSlash = document.getElementById("ban-slash");

      const checkCircleLen = checkCircle.getTotalLength();
      checkCircle.style.strokeDasharray = `${checkCircleLen}`;
      checkCircle.style.strokeDashoffset = `${checkCircleLen}`;

      const checkTickLen = checkTick.getTotalLength();
      checkTick.style.strokeDasharray = `${checkTickLen}`;
      checkTick.style.strokeDashoffset = `${checkTickLen}`;

      const banCircleLen = banCircle.getTotalLength();
      banCircle.style.strokeDasharray = `${banCircleLen}`;
      banCircle.style.strokeDashoffset = `${banCircleLen}`;

      const banSlashLen = banSlash.getTotalLength();
      banSlash.style.strokeDasharray = `${banSlashLen}`;
      banSlash.style.strokeDashoffset = `${banSlashLen}`;

      // ----------------------------------------------------
      // PHASE 1: ENTRANCE UNFOLD (t = 0.0s -> 0.9s)
      // ----------------------------------------------------
      // Top meta bar slide down
      tl.fromTo(
        "#header-meta",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.05
      );

      // Top card unfolds from center seam upwards
      tl.fromTo(
        "#card-sober",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.1
      );

      // Bottom card unfolds from center seam downwards
      tl.fromTo(
        "#card-alcohol",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.22
      );

      // Tension seam reveals
      tl.fromTo(
        "#tension-seam",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.4, ease: "power2.out" },
        0.3
      );

      // Diagram nodes in top card appear
      tl.fromTo(
        "#node-a",
        { x: -30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
        0.42
      );
      tl.fromTo(
        "#link-sober",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power2.out" },
        0.52
      );
      tl.fromTo(
        "#node-b",
        { x: 30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
        0.62
      );

      // Bottom metric label enters
      tl.fromTo(
        "#alcohol-metric",
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.7
      );

      // ----------------------------------------------------
      // PHASE 2: CHECK ICON & LABEL "NHƯỜNG NHAU LÀ ẤM"
      // (Check atMs: 103760 => 1.04s, Label atMs: 104380 => 1.66s)
      // ----------------------------------------------------
      tl.fromTo(
        "#check-icon-wrap",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        1.04
      );
      tl.to(
        "#check-circle",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        1.08
      );
      tl.to(
        "#check-tick",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        1.32
      );

      // Label "NHƯỜNG NHAU LÀ ẤM" entrance
      tl.fromTo(
        "#label-peace-plate",
        { scale: 0.85, y: 16, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.66
      );

      // ----------------------------------------------------
      // PHASE 3: PARADOX SHIFT - MEN RƯỢU DÂNG LÊN (t = 3.4s - 4.0s)
      // ----------------------------------------------------
      // Rising vapor animation in alcohol card
      tl.fromTo(
        "#vapor-path-1",
        { strokeDasharray: 800, strokeDashoffset: 800 },
        { strokeDashoffset: 0, duration: 1.2, ease: "power1.out" },
        3.4
      );
      tl.fromTo(
        "#vapor-path-2",
        { strokeDasharray: 800, strokeDashoffset: 800 },
        { strokeDashoffset: 0, duration: 1.2, ease: "power1.out" },
        3.5
      );
      tl.fromTo(
        "#vapor-path-3",
        { strokeDasharray: 800, strokeDashoffset: 800 },
        { strokeDashoffset: 0, duration: 1.2, ease: "power1.out" },
        3.6
      );

      // Tension seam pulses to orange alert
      tl.to(
        "#tension-seam",
        { scale: 1.04, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 },
        3.7
      );

      // ----------------------------------------------------
      // PHASE 4: BAN ICON & PUNCH PHRASE "MỜ HẾT LÝ TRÍ"
      // (Ban atMs: 106740 => 4.02s, Punch atMs: 107180 => 4.46s)
      // ----------------------------------------------------
      tl.fromTo(
        "#ban-icon-wrap",
        { scale: 0, opacity: 0, rotation: -45 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: "power3.out" },
        4.02
      );
      tl.to(
        "#ban-circle",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        4.06
      );
      tl.to(
        "#ban-slash",
        { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
        4.24
      );

      // Punch Phrase Slam: "MỜ HẾT LÝ TRÍ"
      tl.fromTo(
        "#punch-hero",
        { scale: 0.85, y: 32, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.46, ease: "power4.out" },
        4.46
      );

      // Register master timeline with composition-id "scene-s016"
      window.__timelines["scene-s016"] = tl;
    </script>
