  <div

  >
    <!-- Background textures -->
    <div class="bg-grid"></div>
    <div class="bg-spotlight"></div>

    <!-- Main Visual Scene Clip (duration = 8.96s) -->
    <section id="scene-s013" class="clip" data-start="0" data-duration="8.96">
      <div id="scene-content">
        <!-- Top Header Badge -->
        <div id="header-badge" class="header-badge">
          <div class="header-badge-dot"></div>
          <div class="header-badge-text">SƠ ĐỒ VA CHẠM TÂM LÝ</div>
        </div>

        <!-- Card 1: Nguồn phát động (Anh Th1) -->
        <div id="card-source" class="card-source">
          <div class="card-meta">
            <span class="tag-author">ANH TH-1 (ĐỒI BẠN)</span>
            <span class="tag-action">TÁC NHÂN KÍCH ĐỘNG</span>
          </div>

          <!-- Overlay 1: Label "BẮT PHẢI RÓT RƯỢU" -->
          <div id="label-pour-wine" class="label-pour-wine">
            BẮT PHẢI RÓT RƯỢU
          </div>

          <div class="quote-detail">
            "Không uống hết chén thì ông phải rót rượu cho tôi!"
          </div>
        </div>

        <!-- Flow Connector SVG: Mũi tên áp lực đâm xuống -->
        <svg class="flow-connector-layer" viewBox="0 0 920 290" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Trục đo áp lực biên trái -->
          <line x1="80" y1="20" x2="80" y2="260" stroke="#141414" stroke-width="3" stroke-dasharray="8 8" />
          <text x="100" y="145" fill="#141414" font-family="Be Vietnam Pro" font-size="20" font-weight="900" letter-spacing="1">ÁP LỰC ÉP BUỘC CỰC ĐẠI</text>

            stroke-linecap="round"
          />
          <polygon
            id="pressure-arrow-head"
            points="420,200 500,200 460,260"

          <text x="740" y="145" fill="#141414" font-family="Be Vietnam Pro" font-size="20" font-weight="900" text-anchor="end" letter-spacing="1">CHẠM NỌC TỰ ÁI</text>

  <script>
    // 1. Chuẩn bị hiệu ứng stroke cho SVG paths
    const pressureBeam = document.querySelector("#pressure-beam");
    const beamLength = pressureBeam.getTotalLength();
    pressureBeam.style.strokeDasharray = beamLength;
    pressureBeam.style.strokeDashoffset = beamLength;

    const warningPath = document.querySelector("#warning-path");
    const warningLen = warningPath.getTotalLength();
    warningPath.style.strokeDasharray = warningLen;
    warningPath.style.strokeDashoffset = warningLen;

    // 2. Xây dựng paused timeline duy nhất cho composition
    const tl = gsap.timeline({ paused: true });

    // --- PHASE 1: STRIKE ENTRANCE (t = 0.0s -> 1.5s) ---
    // Hiệu ứng "strike" giáng mạnh vào màn hình
    tl.fromTo(
      "#scene-content",
      { scale: 1.15, y: -50, opacity: 0 },
      { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "power4.out" },
      0.0
    );

    // Header badge xuất hiện
    tl.fromTo(
      "#header-badge",
      { y: -30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
      0.15
    );

    // Card 1 (Nguồn kích động) đáp xuống
    tl.fromTo(
      "#card-source",
      { y: 40, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      0.25
    );

    // --- PHASE 2: OVERLAY 1 - LABEL "BẮT PHẢI RÓT RƯỢU" & PRESSURE ARROW (t = 1.6s -> 5.5s) ---
    // Overlay 1 tại đúng atMs = 81360ms (rel: 1.6s)
    tl.fromTo(
      "#label-pour-wine",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      1.6
    );

    // Mũi tên áp lực đâm xuống
    tl.to(
      "#pressure-beam",
      { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" },
      1.85
    );
    tl.fromTo(
      "#pressure-arrow-head",
      { scale: 0, opacity: 0, transformOrigin: "50% 0%" },
      { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.5)" },
      2.35
    );

    // Card 2 (Khối tự ái của người say) đón nhận va chạm
    tl.fromTo(
      "#card-target",
      { y: 50, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      2.5
    );

    // Rung nhẹ phản ứng khi mũi tên cắm vào Card 2 (dao động nhỏ ±6px, không làm lệch khỏi layout)
    tl.to(
      "#card-target",
      { y: 6, duration: 0.05, yoyo: true, repeat: 3, ease: "power1.inOut" },
      2.7
    );

    // --- PHASE 3: OVERLAY 2 - ICON WARNING (t = 5.71s -> 7.2s) ---
    // Overlay 2 tại đúng atMs = 85470ms (rel: 5.71s)
    tl.fromTo(
      "#icon-warning-wrapper",
      { scale: 0, opacity: 0, rotation: -15, transformOrigin: "50% 50%" },
      { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: "power3.out" },
      5.71
    );

    // Tự vẽ nét tam giác cảnh báo
    tl.to(
      "#warning-path",
      { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
      5.85
    );
    tl.fromTo(
      ["#warning-line", "#warning-dot"],
      { opacity: 0, scale: 0, transformOrigin: "50% 50%" },
      { opacity: 1, scale: 1, duration: 0.25, stagger: 0.08, ease: "power2.out" },
      6.15
    );

    // Cảnh báo nhấp nháy / rung hồi hộp trước khi bùng nổ
    tl.to(
      "#icon-warning-wrapper",
      { scale: 1.08, duration: 0.12, yoyo: true, repeat: 5, ease: "sine.inOut" },
      6.4
    );

    // --- PHASE 4: OVERLAY 3 - PUNCH PHRASE "TỰ ÁI BÙNG NỔ" (t = 7.22s -> 8.96s) ---
    // Overlay 3 tại đúng atMs = 86980ms (rel: 7.22s)
    tl.fromTo(
      "#punch-wrapper",
      { scale: 1.35, y: -40, opacity: 0 },
      { scale: 1, y: 0, opacity: 1, duration: 0.38, ease: "power4.out" },
      7.22
    );

    // Các tia xung kích (shock rays) bung ra
    tl.fromTo(
      ".shock-ray",
      { strokeDasharray: "20 40", strokeDashoffset: 60, opacity: 0 },
      { strokeDashoffset: 0, opacity: 1, duration: 0.35, stagger: 0.04, ease: "power2.out" },
      7.3
    );

    // Camera thud chấn động toàn cảnh khi tự ái nổ tung
    tl.to(
      "#scene-content",
      { y: 8, duration: 0.06, yoyo: true, repeat: 3, ease: "power1.inOut" },
      7.26
    );

    // 3. Đăng ký timeline cho HyperFrames runtime
    window.__timelines["scene-s013"] = tl;
  </script>
