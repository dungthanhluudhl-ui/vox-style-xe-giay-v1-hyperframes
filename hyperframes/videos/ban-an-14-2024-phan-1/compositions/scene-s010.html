      <style>

      /* Header tư liệu phía trên */
      #header-bar {

      /* Overlay 1: Nhãn "ĐỐI ẨM HAI NGƯỜI" */

      .label-dot {

        text-transform: uppercase;
      }

      /* Overlay 2 & 3: Thẻ đồng hồ + Punch-phrase "HƠN 1 TIẾNG ĐỒNG HỒ" */
      #punch-card {

        border-left: 10px solid #FF6A1A;

      #clock-wrapper {

      .punch-main {
        font-size: 54px;

        text-transform: uppercase;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s010"
      data-width="1080"
      data-height="1920"
      data-duration="5.5"
    >
      <!-- Base Shot 1: Nền lưới, ảnh tư liệu hai người ngồi chiếu, header -->
      <section id="scene-base" class="clip" data-start="0" data-duration="5.5">
        <div id="bg-grid"></div>

        <div id="header-bar">
          <div class="header-pill">HỒ SƠ VỤ ÁN // TƯ LIỆU HIỆN TRƯỜNG</div>
          <div class="header-timestamp">01:02.48</div>
        </div>

        <div id="photo-card">
          <div id="photo-zoom-wrap">
            <img
              id="hero-img"
              src="assets/img-09-two-men-drinking-rural-hut.jpg"
              alt="Hai người ngồi uống rượu trên chiếu vách đất"
            />
          </div>
          <div id="photo-caption-strip">
            <span class="caption-tag">MÂM RƯỢU ĐỐI ẨM // GIAN NHÀ VÁCH ĐẤT</span>
          </div>
        </div>

        <div id="bottom-brand-bar"></div>
      </section>

      <!-- Overlay 1: Nhãn "ĐỐI ẨM HAI NGƯỜI" (atMs: 63770 -> 1.29s, hold: 2.2s) -->
      <section id="clip-label" class="clip" data-start="1.29" data-duration="2.2">
        <div id="label-box">
          <span class="label-dot"></span>
          <span class="label-text">ĐỐI ẨM HAI NGƯỜI</span>
        </div>
      </section>

      <!-- Overlay 2 & 3: Clock Icon + Punch-phrase (atMs: 66030 -> 3.55s, hold: 1.95s) -->
      <section id="clip-punch" class="clip" data-start="3.55" data-duration="1.95">
        <div id="punch-card">
          <div id="clock-wrapper">
            <svg id="clock-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <!-- Mặt đồng hồ -->
              <circle cx="50" cy="50" r="46" fill="#141414" stroke="#333333" stroke-width="2" />
              <!-- Vòng progress cam viền ngoài (bán kính 43, chu vi ~270) -->
              <circle
                id="clock-progress"
                cx="50"
                cy="50"
                r="43"
                fill="none"
                stroke="#FF6A1A"
                stroke-width="4.5"
                stroke-linecap="round"
                stroke-dasharray="270"
                stroke-dashoffset="270"
                transform="rotate(-90 50 50)"
              />
              <!-- Các vạch giờ chính -->
              <line x1="50" y1="12" x2="50" y2="18" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
              <line x1="88" y1="50" x2="82" y2="50" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
              <line x1="50" y1="88" x2="50" y2="82" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
              <line x1="12" y1="50" x2="18" y2="50" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
              <!-- Kim giờ -->
              <line
                id="clock-hour-hand"
                x1="50"
                y1="50"
                x2="50"
                y2="30"
                stroke="#FF6A1A"
                stroke-width="4"
                stroke-linecap="round"
              />
              <!-- Kim phút -->
              <line
                id="clock-minute-hand"
                x1="50"
                y1="50"
                x2="50"
                y2="17"
                stroke="#F7F4EC"
                stroke-width="3"
                stroke-linecap="round"
              />
              <!-- Trục giữa -->
              <circle cx="50" cy="50" r="4.5" fill="#FF6A1A" />
            </svg>
          </div>

          <div id="punch-text-col">
            <div class="punch-sub">THỜI LƯỢNG CUỘC NHẬU</div>
            <div class="punch-main">HƠN 1 TIẾNG ĐỒNG HỒ</div>
          </div>

    </div>

    <script>
      // Setup GSAP seekable timeline cho HyperFrames
      const tl = gsap.timeline({ paused: true });

      // 1. Giai đoạn mở đầu (0.0s): Transition In "rise" và Camera Zoom-in nhẹ
      tl.fromTo(
        "#photo-card",
        { y: 80, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
        0
      );

      tl.fromTo(
        "#header-bar",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" },
        0.15
      );

      // Camera motion: zoom-in chậm vào mâm rượu đối ẩm suốt 5.5s
      tl.fromTo(
        "#photo-zoom-wrap",
        { scale: 1 },
        { scale: 1.075, duration: 5.5, ease: "sine.inOut" },
        0
      );

      // 2. Giai đoạn Overlay 1: Label "ĐỐI ẨM HAI NGƯỜI" (bắt đầu lúc 1.29s)
      tl.fromTo(
        "#label-box",
        { scale: 0.85, opacity: 0, y: -15 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.29
      );

      // Label nhẹ nhàng biến mất trước khi clip kết thúc lúc 3.49s
      tl.to(
        "#label-box",
        { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" },
        3.24
      );

      // 3. Giai đoạn Overlay 2 & 3: Clock icon + Punch-phrase (bắt đầu lúc 3.55s)
      tl.fromTo(
        "#punch-card",
        { scale: 0.92, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        3.55
      );

      // Hiệu ứng kim đồng hồ quay nhanh biểu thị thời gian trôi hơn 1 tiếng
      tl.fromTo(
        "#clock-minute-hand",
        { rotation: 0 },
        { rotation: 420, duration: 1.6, ease: "power2.out", transformOrigin: "50px 50px" },
        3.6
      );

      tl.fromTo(
        "#clock-hour-hand",
        { rotation: 0 },
        { rotation: 38, duration: 1.6, ease: "power2.out", transformOrigin: "50px 50px" },
        3.6
      );

      // Vòng tròn stroke dash quay quanh đồng hồ
      tl.fromTo(
        "#clock-progress",
        { strokeDashoffset: 270 },
        { strokeDashoffset: 0, duration: 1.6, ease: "power2.out" },
        3.6
      );

      // Chữ punchline xuất hiện dứt khoát tại 3.83s
      tl.fromTo(
        ".punch-sub",
        { opacity: 0, x: -15 },
        { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" },
        3.75
      );

      tl.fromTo(
        ".punch-main",
        { opacity: 0, y: 15 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        3.83
      );

      // Đăng ký timeline cho HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s010"] = tl;
    </script>
  
    </template>
