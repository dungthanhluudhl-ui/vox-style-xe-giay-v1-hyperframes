<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      background-color: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
      background-image: 
        linear-gradient(to right, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }

    .clip {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Brand signature bottom bar */
    .bottom-orange-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 16px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Contract WCAG safe classes */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
    .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
    .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
    .hf-plate-paper { background-color: #E7E3D9; color: #141414; }

    /* Scene Top Dossier Tags */
    .scene-tag {
      position: absolute;
      top: 110px;
      left: 50px;
      padding: 8px 18px;
      background-color: #141414;
      color: #F7F4EC;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 2px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 4px 4px 0px rgba(20, 20, 20, 0.2);
    }

    .scene-tag-dot {
      width: 10px;
      height: 10px;
      background-color: #FF6A1A;
      border-radius: 50%;
    }

    .scene-code {
      position: absolute;
      top: 118px;
      right: 50px;
      font-size: 18px;
      font-weight: 700;
      color: #141414;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Main Photo Box - Vox Collage Style */
    .photo-container {
      position: absolute;
      top: 170px;
      left: 50px;
      width: 980px;
      height: 1320px;
      border: 4px solid #141414;
      background-color: #141414;
      box-shadow: 16px 16px 0px #141414;
      overflow: hidden;
      transform-origin: 50% 50%;
    }

    .photo-inner {
      position: absolute;
      inset: -40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform-origin: 50% 50%;
    }

    .photo-caption-strip {
      position: absolute;
      bottom: 24px;
      right: 24px;
      padding: 8px 18px;
      background-color: #141414;
      color: #F7F4EC;
      font-size: 18px;
      font-weight: 700;
      border: 2px solid #FF6A1A;
      border-radius: 2px;
      letter-spacing: 1px;
      text-transform: uppercase;
      z-index: 5;
    }

    /* Overlay 1: Action Badge "MUA MỒI MỜI RƯỢU" */
    .badge-card {
      position: absolute;
      top: 260px;
      left: 90px;
      background-color: #FF6A1A;
      border: 4px solid #141414;
      box-shadow: 10px 10px 0px #141414;
      padding: 24px 36px;
      display: inline-flex;
      flex-direction: column;
      gap: 6px;
      max-width: 820px;
      transform-origin: 0% 50%;
    }

    .badge-sub {
      font-size: 22px;
      font-weight: 700;
      color: #141414;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .badge-title {
      font-size: 56px;
      font-weight: 900;
      color: #141414;
      line-height: 1.15;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    /* Overlay 2 & 3: Neighbor Character Annotation */
    .annotation-cluster {
      position: absolute;
      top: 940px;
      left: 90px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .pin-graphic {
      width: 80px;
      height: 40px;
      display: flex;
      align-items: center;
    }

    .person-card {
      background-color: #141414;
      border: 3px solid #FF6A1A;
      box-shadow: 10px 10px 0px rgba(20, 20, 20, 0.4);
      padding: 20px 28px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      gap: 24px;
      transform-origin: 0% 50%;
    }

    .person-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .person-role {
      font-size: 20px;
      font-weight: 700;
      color: #FF6A1A;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .person-name {
      font-size: 40px;
      font-weight: 900;
      color: #F7F4EC;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .icon-box {
      width: 72px;
      height: 72px;
      background-color: #212121;
      border: 2px solid #FF6A1A;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .svg-icon {
      width: 52px;
      height: 52px;
    }
  </style>

  <div id="root" data-composition-id="scene-s09" data-width="1080" data-height="1920" data-duration="7.08">
    
    <!-- Background persistent element -->
    <div class="bottom-orange-bar"></div>

    <!-- Clip 1: Main Photo Scene (0s -> 7.08s) -->
    <div id="clip-photo" class="clip" data-start="0" data-duration="7.08">
      
      <!-- Editorial Scene Tag -->
      <div id="scene-tag-box" class="scene-tag">
        <span class="scene-tag-dot"></span>
        <span>BỐI CẢNH // LÁNG GIỀNG GẶP GỠ</span>
      </div>
      
      <div id="scene-code-label" class="scene-code">
        HỒ SƠ VỤ ÁN #14
      </div>

      <!-- Main Photo Frame with Camera Pan -->
      <div id="photo-box" class="photo-container">
        <div class="photo-inner">
          <img 
            id="photo-img" 
            class="photo-img" 
            src="assets/img-05-handshake-rural-house-meeting.jpg" 
            alt="Hai người đàn ông bắt tay trước hiên nhà nông thôn"
          >
        </div>
        <div class="photo-caption-strip">
          TỈNH YÊN BÁI • ĐỊA BÀN NÔNG THÔN
        </div>
      </div>

    </div>

    <!-- Clip 2: Action Label Overlay (0.96s -> 3.16s) -->
    <div id="clip-badge" class="clip" data-start="0.96" data-duration="2.20">
      <div id="badge-box" class="badge-card">
        <div class="badge-sub">LỜI MỜI SANG CHƠI</div>
        <div class="badge-title">MUA MỒI MỜI RƯỢU</div>
      </div>
    </div>

    <!-- Clip 3: Annotated Neighbor Person Overlay (4.16s -> 7.08s) -->
    <div id="clip-person" class="clip" data-start="4.16" data-duration="2.92">
      <div id="person-cluster" class="annotation-cluster">
        
        <!-- Connecting pointer graphic -->
        <svg class="pin-graphic" viewBox="0 0 80 40">
          <circle id="pin-anchor" cx="16" cy="20" r="8" fill="#FF6A1A" stroke="#141414" stroke-width="3" />
          <line id="pin-line" x1="24" y1="20" x2="78" y2="20" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round" />
        </svg>

        <!-- Information Card -->
        <div id="person-card" class="person-card">
          <div class="person-meta">
            <span class="person-role">NGƯỜI HÀNG XÓM</span>
            <span class="person-name">NGUYỄN KHẮC TH 1</span>
          </div>

          <!-- Progressive Self-drawing Person Icon -->
          <div class="icon-box">
            <svg class="svg-icon" viewBox="0 0 64 64">
              <circle 
                id="icon-person-head" 
                cx="32" 
                cy="20" 
                r="11" 
                fill="none" 
                stroke="#FF6A1A" 
                stroke-width="4.5" 
                stroke-linecap="round" 
              />
              <path 
                id="icon-person-body" 
                d="M 14 54 C 14 38, 50 38, 50 54" 
                fill="none" 
                stroke="#FF6A1A" 
                stroke-width="4.5" 
                stroke-linecap="round" 
              />
            </svg>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    // Prepare SVG path lengths for deterministic progressive drawing
    const headCircle = document.getElementById("icon-person-head");
    const bodyPath = document.getElementById("icon-person-body");
    const pinLine = document.getElementById("pin-line");

    if (headCircle) {
      const lenHead = headCircle.getTotalLength();
      headCircle.style.strokeDasharray = lenHead;
      headCircle.style.strokeDashoffset = lenHead;
    }

    if (bodyPath) {
      const lenBody = bodyPath.getTotalLength();
      bodyPath.style.strokeDasharray = lenBody;
      bodyPath.style.strokeDashoffset = lenBody;
    }

    if (pinLine) {
      pinLine.style.strokeDasharray = "60";
      pinLine.style.strokeDashoffset = "60";
    }

    // Single paused timeline registered to window.__timelines
    const tl = gsap.timeline({ paused: true });

    // 0.00s: Grow Entrance for Photo Card
    tl.fromTo(
      "#photo-box",
      { scale: 0.92, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
      0.0
    );

    tl.fromTo(
      "#scene-tag-box",
      { y: -24, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
      0.15
    );

    tl.fromTo(
      "#scene-code-label",
      { opacity: 0 },
      { opacity: 1, duration: 0.4, ease: "power2.out" },
      0.25
    );

    // 0.00s -> 7.08s: Slow Pan Right Camera Motion
    tl.fromTo(
      "#photo-img",
      { scale: 1.15, x: -35 },
      { scale: 1.15, x: 35, duration: 7.08, ease: "none" },
      0.0
    );

    // 0.96s: Overlay 1 "MUA MỒI MỜI RƯỢU" Spring-Pop Entrance
    tl.fromTo(
      "#badge-box",
      { scale: 0.85, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.96
    );

    // 2.80s: Badge Exit before clip expiration at 3.16s
    tl.to(
      "#badge-box",
      { opacity: 0, y: -20, duration: 0.32, ease: "power2.in" },
      2.80
    );

    // 4.16s: Overlay 2 "NGUYỄN KHẮC TH 1" Arrival
    tl.fromTo(
      "#person-card",
      { scale: 0.85, opacity: 0, x: -25 },
      { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
      4.16
    );

    tl.fromTo(
      "#pin-anchor",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
      4.16
    );

    tl.to(
      "#pin-line",
      { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
      4.30
    );

    // 5.20s: Overlay 3 Icon "person" Progressive Draw
    tl.to(
      "#icon-person-head",
      { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
      5.20
    );

    tl.to(
      "#icon-person-body",
      { strokeDashoffset: 0, duration: 0.50, ease: "power2.out" },
      5.45
    );

    // Register paused timeline with HyperFrames seek runtime
    window.__timelines["scene-s09"] = tl;
  </script>

    </template>
  </body>
</html>
