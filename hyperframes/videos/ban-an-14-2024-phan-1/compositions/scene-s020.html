<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #f5f0e4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f5f0e4;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Safe text/plate utility classes */
      .hf-text-ink {
        color: #141414;
      }
      .hf-text-light {
        color: #f7f4ec;
      }
      .hf-hl-orange {
        background-color: #ff6a1a;
        color: #141414;
      }
      .hf-plate-ink {
        background-color: #141414;
        color: #f7f4ec;
      }
      .hf-plate-ink-orange {
        background-color: #141414;
        color: #ff6a1a;
      }
      .hf-plate-paper {
        background-color: #e7e3d9;
        color: #141414;
      }

      /* Camera rig & background asset */
      #camera-rig {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: 50% 50%;
      }
      #shot-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: 50% 50%;
      }

      /* Fixed bottom branding bar */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 10px;
        background-color: #ff6a1a;
        z-index: 100;
      }

      /* Overlay 1: Label */
      .label-wrapper {
        position: absolute;
        top: 240px;
        left: 60px;
        right: 60px;
        display: flex;
        justify-content: center;
        pointer-events: none;
      }
      .label-plate {
        background-color: #141414;
        border-left: 8px solid #ff6a1a;
        padding: 18px 32px;
        border-radius: 4px;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .label-tag {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 700;
        font-size: 20px;
        color: #ff6a1a;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .label-text {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 42px;
        color: #f7f4ec;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        line-height: 1.25;
      }

      /* Overlay 2: Ban Icon Badge */
      .ban-wrapper {
        position: absolute;
        top: 960px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
      }
      .ban-badge {
        width: 124px;
        height: 124px;
        border-radius: 50%;
        background-color: #141414;
        border: 4px solid #ff6a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55);
        transform-origin: 50% 50%;
      }

      /* Overlay 3: Punch Phrase Card */
      .punch-wrapper {
        position: absolute;
        top: 1120px;
        left: 60px;
        right: 60px;
        display: flex;
        justify-content: center;
        pointer-events: none;
      }
      .punch-card {
        width: 100%;
        max-width: 960px;
        background-color: #141414;
        border-top: 8px solid #ff6a1a;
        border-radius: 6px;
        padding: 30px 36px;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        transform-origin: 50% 50%;
      }
      .punch-kicker {
        display: inline-block;
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 3px;
        padding: 6px 18px;
        border-radius: 4px;
        margin-bottom: 14px;
        text-transform: uppercase;
      }
      .punch-headline {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 64px;
        line-height: 1.24;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .punch-sub {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #ff6a1a;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s020"
      data-width="1080"
      data-height="1920"
      data-duration="9.345"
    >
      <!-- Background Shot 1 with slow zoom-in -->
      <section id="shot-1" class="clip" data-start="0" data-duration="9.345" data-track-index="0">
        <div id="camera-rig">
          <img
            id="shot-image"
            src="assets/img-06-crime-scene-paper-cutout.jpg"
            alt="Hiện trường hung thủ nhìn nạn nhân"
          />
        </div>
        <div id="brand-bottom-bar"></div>
      </section>

      <!-- Overlay 1: Label "LẠNH GÁY VÔ THỨC" -->
      <div id="overlay-label-clip" class="clip" data-start="2.395" data-duration="2.2" data-track-index="1">
        <div id="label-wrapper" class="label-wrapper">
          <div class="label-plate hf-plate-ink">
            <div class="label-tag">TÂM LÝ TỘI PHẠM</div>
            <div class="label-text hf-text-light">LẠNH GÁY VÔ THỨC</div>
          </div>
        </div>
      </div>

      <!-- Overlay 2: Prohibition "ban" icon -->
      <div id="overlay-ban-clip" class="clip" data-start="7.025" data-duration="2.32" data-track-index="2">
        <div id="ban-wrapper" class="ban-wrapper">
          <div id="ban-badge" class="ban-badge">
            <svg id="ban-svg" width="84" height="84" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle id="ban-circle" cx="50" cy="50" r="38" stroke="#FF6A1A" stroke-width="8" stroke-linecap="round" />
              <line id="ban-slash" x1="23" y1="23" x2="77" y2="77" stroke="#FF6A1A" stroke-width="8" stroke-linecap="round" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Overlay 3: Punch-phrase "KHÔNG GỌI CẤP CỨU" -->
      <div id="overlay-punch-clip" class="clip" data-start="7.505" data-duration="1.84" data-track-index="3">
        <div id="punch-wrapper" class="punch-wrapper">
          <div id="punch-card" class="punch-card hf-plate-ink">
            <div class="punch-kicker hf-hl-orange">NGHỊCH LÝ MA MEN</div>
            <div class="punch-headline hf-text-light">KHÔNG GỌI CẤP CỨU</div>
            <div class="punch-sub">VÀ KHÔNG HỀ BỎ TRỐN</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Camera Motion: continuous slow zoom from 1.0x to 1.07x across the scene
      tl.fromTo(
        "#camera-rig",
        { scale: 1.0 },
        { scale: 1.07, duration: 9.345, ease: "none" },
        0
      );

      // 2. Transition In: Grow entrance for scene opening
      tl.fromTo(
        "#shot-image",
        { scale: 0.88, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0
      );

      // 3. Overlay 1: Label entrance & exit
      tl.fromTo(
        "#label-wrapper",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        2.395
      );
      tl.to(
        "#label-wrapper",
        { y: -20, opacity: 0, duration: 0.3, ease: "power2.in" },
        4.25
      );

      // 4. Overlay 2: "ban" icon self-drawing animation
      const banCircle = document.getElementById("ban-circle");
      const banSlash = document.getElementById("ban-slash");
      if (banCircle && banSlash) {
        const circleLength = banCircle.getTotalLength();
        banCircle.style.strokeDasharray = `${circleLength}`;
        banCircle.style.strokeDashoffset = `${circleLength}`;

        const slashLength = banSlash.getTotalLength();
        banSlash.style.strokeDasharray = `${slashLength}`;
        banSlash.style.strokeDashoffset = `${slashLength}`;

        tl.fromTo(
          "#ban-badge",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
          7.025
        );
        tl.to(
          banCircle,
          { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
          7.05
        );
        tl.to(
          banSlash,
          { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
          7.28
        );
      }

      // 5. Overlay 3: Punch-phrase card entrance
      tl.fromTo(
        "#punch-card",
        { scale: 0.88, y: 32, opacity: 0 },
        { scale: 1.0, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        7.505
      );

      window.__timelines["scene-s020"] = tl;
    </script>
  
    </template>
  </body>
</html>
