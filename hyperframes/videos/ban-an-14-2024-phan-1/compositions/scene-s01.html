<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #F5F0E4;
      }

      /* Base layout for clips: full frame without hardcoded px */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Contrast safe classes */
      .hf-text-ink {
        color: #141414;
      }
      .hf-text-light {
        color: #F7F4EC;
      }
      .hf-hl-orange {
        background-color: #FF6A1A;
        color: #141414;
      }
      .hf-plate-ink {
        background-color: #141414;
        color: #F7F4EC;
      }
      .hf-plate-paper {
        background-color: #E7E3D9;
        color: #141414;
      }

      /* Video background container (untimed wrapper for camera transform) */
      #video-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }
      #video-wrapper video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Overlay 1: Label ("QUY LUẬT BÀN NHẬU") */
      .label-layout {
        position: absolute;
        top: 260px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .label-plate {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 16px 32px;
        background-color: #141414;
        border: 2px solid #141414;
        box-shadow: 6px 6px 0px #FF6A1A;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }
      .label-accent-line {
        width: 8px;
        height: 34px;
        background-color: #FF6A1A;
        flex-shrink: 0;
      }
      .label-title {
        font-size: 38px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #F7F4EC;
        line-height: 1.2;
      }

      /* Overlay 2: Punch phrase ("RƯỢU VÀO LỜI RA") */
      .punch-layout {
        position: absolute;
        top: 720px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .punch-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 36px 52px;
        background-color: #141414;
        box-shadow: 10px 10px 0px #FF6A1A;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }
      .punch-row {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .punch-text-light {
        font-size: 78px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: 1px;
        color: #F7F4EC;
        text-transform: uppercase;
      }
      .punch-hl-box {
        display: inline-block;
        padding: 8px 24px;
        background-color: #FF6A1A;
        box-shadow: 4px 4px 0px #F7F4EC;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }
      .punch-text-ink {
        font-size: 78px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: 1px;
        color: #141414;
        text-transform: uppercase;
      }

      /* Vox visual signature: permanent bottom orange bar */
      #bottom-signature-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s01"
      data-width="1080"
      data-height="1920"
      data-duration="6.24"
    >
      <!-- Background Video Layer (inside non-timed wrapper for smooth camera motion) -->
      <div id="video-wrapper">
        <video
          id="vid-07"
          src="assets/vid-07-two-men-drinking-alcohol.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="6.24"
          data-media-start="0.8"
        ></video>
      </div>

      <!-- Overlay 1: Label "QUY LUẬT BÀN NHẬU" (2.23s - 4.23s) -->
      <section id="overlay-label-clip" class="clip" data-start="2.23" data-duration="2.0">
        <div class="label-layout">
          <div id="label-card" class="label-plate hf-plate-ink">
            <div class="label-accent-line"></div>
            <span class="label-title hf-text-light">QUY LUẬT BÀN NHẬU</span>
          </div>
        </div>
      </section>

      <!-- Overlay 2: Punch Phrase "RƯỢU VÀO LỜI RA" (4.60s - 6.24s) -->
      <section id="overlay-punch-clip" class="clip" data-start="4.60" data-duration="1.64">
        <div class="punch-layout">
          <div id="punch-card" class="punch-card hf-plate-ink">
            <div class="punch-row">
              <span class="punch-text-light hf-text-light">RƯỢU VÀO</span>
            </div>
            <div class="punch-row">
              <div id="punch-hl-box" class="punch-hl-box hf-hl-orange">
                <span class="punch-text-ink hf-text-ink">LỜI RA</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Signature bottom orange accent bar -->
      <div id="bottom-signature-bar"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1. Camera / Video Entrance and Push:
      // Smooth grow entrance into 1.05x, followed by continuous subtle zoom-in
      tl.fromTo(
        "#video-wrapper",
        { scale: 0.98, opacity: 0 },
        { scale: 1.05, opacity: 1, duration: 0.6, ease: "power2.out" },
        0
      );
      tl.to(
        "#video-wrapper",
        { scale: 1.14, duration: 5.64, ease: "sine.out" },
        0.6
      );

      // 2. Overlay 1: Context Label ("QUY LUẬT BÀN NHẬU")
      tl.fromTo(
        "#label-card",
        { scale: 0.85, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        2.23
      );
      tl.to(
        "#label-card",
        { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" },
        3.95
      );

      // 3. Overlay 2: Punch Phrase ("RƯỢU VÀO LỜI RA")
      tl.fromTo(
        "#punch-card",
        { scale: 0.84, opacity: 0, y: 40 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        4.60
      );
      tl.fromTo(
        "#punch-hl-box",
        { scale: 0.88, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power2.out" },
        4.78
      );

      window.__timelines["scene-s01"] = tl;
    </script>
  
    </template>
  </body>
