<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #E7E3D9;
      color: #141414;
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Root container: exactly 1080x1920 portrait canvas */
    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    /* Standard clip convention */
    .clip {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Video Viewport & Container (Wrapper without data-start for zoom/pan/wobble) */
    #video-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 5;
    }

    #video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: 50% 45%;
      will-change: transform, opacity;
    }

    #vid-quarrel {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Spotlight variant vignette overlay (consequence/warning tone) */
    .spotlight-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(20, 20, 20, 0.12) 30%, rgba(20, 20, 20, 0.72) 100%);
      pointer-events: none;
      z-index: 10;
    }

    /* Subtle Vox texture grid overlay */
    .vox-grid-overlay {
      position: absolute;
      inset: 0;
      background-size: 84px 84px;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.18) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.18) 1.5px, transparent 1.5px);
      pointer-events: none;
      opacity: 0.35;
      z-index: 11;
    }

    /* Persistent Vox bottom brand orange bar */
    .bottom-orange-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 14px;
      background-color: #FF6A1A;
      z-index: 90;
      pointer-events: none;
    }

    /* =========================================================
       OVERLAY PLATES & BADGES (100% OPAQUE FOR SAFE WCAG)
       ========================================================= */

    /* Safe plate styles */
    .hf-plate-ink {
      background-color: #141414;
      color: #F7F4EC;
    }

    /* 1. Label Overlay (HƠI MEN NGẤM DẦN) */
    .label-wrapper {
      position: absolute;
      top: 260px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 30;
      pointer-events: none;
    }

    #label-plate {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      border: 3px solid #FF6A1A;
      border-radius: 12px;
      padding: 14px 28px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
      will-change: transform, opacity;
    }

    .label-accent-tag {
      background-color: #FF6A1A;
      color: #141414;
      font-weight: 900;
      font-size: 24px;
      line-height: 1;
      letter-spacing: 1.5px;
      padding: 8px 14px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .label-text {
      color: #F7F4EC;
      font-weight: 900;
      font-size: 38px;
      line-height: 1;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* 2. Warning Icon Overlay */
    .warning-wrapper {
      position: absolute;
      top: 670px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 35;
      pointer-events: none;
    }

    #warning-badge {
      display: inline-flex;
      align-items: center;
      gap: 22px;
      border-left: 10px solid #FF6A1A;
      border-top: 2px solid #282828;
      border-right: 2px solid #282828;
      border-bottom: 2px solid #282828;
      border-radius: 14px;
      padding: 20px 34px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.65);
      will-change: transform, opacity;
    }

    .warning-svg {
      display: block;
      flex-shrink: 0;
    }

    .warning-text-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .warning-tag {
      color: #FF6A1A;
      font-weight: 900;
      font-size: 22px;
      line-height: 1;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .warning-desc {
      color: #F7F4EC;
      font-weight: 900;
      font-size: 36px;
      line-height: 1.1;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* 3. Punch Phrase Overlay (BƯỚC NGOẶT BẤT HÒA) */
    .punch-wrapper {
      position: absolute;
      top: 940px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 40;
      pointer-events: none;
    }

    #punch-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 4px solid #FF6A1A;
      border-radius: 18px;
      padding: 26px 44px;
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.75);
      will-change: transform, opacity;
    }

    .punch-kicker {
      color: #FF6A1A;
      font-weight: 900;
      font-size: 24px;
      line-height: 1;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .punch-title-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .punch-plain {
      color: #F7F4EC;
      font-weight: 900;
      font-size: 58px;
      line-height: 1.1;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .punch-hl-box {
      display: inline-block;
      background-color: #FF6A1A;
      border-radius: 8px;
      padding: 4px 16px;
    }

    .punch-hl {
      display: block;
      color: #141414;
      font-weight: 900;
      font-size: 58px;
      line-height: 1.1;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s011"
    data-width="1080"
    data-height="1920"
    data-duration="5.68"
  >
    <!-- Background Video: placed in non-timed wrapper to allow camera motion without resizing video element -->
    <div id="video-viewport">
      <div id="video-container">
        <video
          id="vid-quarrel"
          src="assets/vid-02-drinking-table-heated-quarrel.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="5.68"
          data-media-start="1"
        ></video>
      </div>
    </div>

    <!-- Spotlight gradient vignette overlay -->
    <div class="spotlight-vignette"></div>

    <!-- Subtle texture grid -->
    <div class="vox-grid-overlay"></div>

    <!-- Persistent bottom brand accent bar -->
    <div class="bottom-orange-bar"></div>

    <!-- Clip 1: Label "HƠI MEN NGẤM DẦN" (1.88s - 3.88s) -->
    <section id="clip-label" class="clip" data-start="1.88" data-duration="2.0">
      <div class="label-wrapper">
        <div id="label-plate" class="hf-plate-ink">
          <span class="label-accent-tag">THỜI ĐIỂM</span>
          <span class="label-text">HƠI MEN NGẤM DẦN</span>
        </div>
      </div>
    </section>

    <!-- Clip 2: Icon Warning "DẤU HIỆU NGUY CƠ" (3.22s - 5.68s) -->
    <section id="clip-warning" class="clip" data-start="3.22" data-duration="2.46">
      <div class="warning-wrapper">
        <div id="warning-badge" class="hf-plate-ink">
          <svg class="warning-svg" viewBox="0 0 100 100" width="80" height="80">
            <polygon
              id="warning-path"
              points="50,14 90,84 10,84"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <line
              id="warning-line"
              x1="50"
              y1="38"
              x2="50"
              y2="58"
              stroke="#FF6A1A"
              stroke-width="8"
              stroke-linecap="round"
            />
            <circle id="warning-dot" cx="50" cy="72" r="4.5" fill="#FF6A1A" />
          </svg>
          <div class="warning-text-group">
            <span class="warning-tag">DẤU HIỆU NGUY CƠ</span>
            <span class="warning-desc">XUNG ĐỘT BỘC PHÁT</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Clip 3: Punch Phrase "BƯỚC NGOẶT BẤT HÒA" (3.92s - 5.68s) -->
    <section id="clip-punch" class="clip" data-start="3.92" data-duration="1.76">
      <div class="punch-wrapper">
        <div id="punch-card" class="hf-plate-ink">
          <div class="punch-kicker">CĂNG THẲNG LEO THANG</div>
          <div class="punch-title-row">
            <span class="punch-plain">BƯỚC NGOẶT</span>
            <span class="punch-hl-box"><span class="punch-hl">BẤT HÒA</span></span>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    // Initialize stroke-dash properties deterministically before timeline build
    const warningPath = document.getElementById("warning-path");
    if (warningPath) {
      const lenPath = warningPath.getTotalLength();
      warningPath.style.strokeDasharray = lenPath;
      warningPath.style.strokeDashoffset = lenPath;
    }

    const warningLine = document.getElementById("warning-line");
    if (warningLine) {
      const lenLine = warningLine.getTotalLength();
      warningLine.style.strokeDasharray = lenLine;
      warningLine.style.strokeDashoffset = lenLine;
    }

    // Build seekable paused GSAP timeline
    const tl = gsap.timeline({ paused: true });

    /* -------------------------------------------------------------
       1. TransitionIn: wobble-drop entrance & camera motion zoom-in
       ------------------------------------------------------------- */
    // Initial drop and drunken wobble
    tl.fromTo(
      "#video-container",
      {
        y: -320,
        rotation: -4,
        scale: 1.15,
        opacity: 0,
      },
      {
        y: 0,
        rotation: 0,
        scale: 1.1,
        opacity: 1,
        duration: 0.85,
        ease: "power2.out",
      },
      0
    );

    // Secondary wobble swing to simulate drunken destabilization
    tl.to(
      "#video-container",
      {
        rotation: 1.4,
        duration: 0.55,
        ease: "sine.inOut",
      },
      0.85
    );
    tl.to(
      "#video-container",
      {
        rotation: 0,
        duration: 0.55,
        ease: "sine.inOut",
      },
      1.4
    );

    // Continuous camera zoom-in intensifying the confrontation
    tl.to(
      "#video-container",
      {
        scale: 1.25,
        duration: 4.83,
        ease: "none",
      },
      0.85
    );

    /* -------------------------------------------------------------
       2. Label Entrance & Exit (at 1.88s, hold until 3.88s)
       ------------------------------------------------------------- */
    tl.fromTo(
      "#label-plate",
      {
        y: -30,
        opacity: 0,
        scale: 0.92,
      },
      {
        y: 0,
        opacity: 1,
        scale: 1,
        duration: 0.45,
        ease: "power3.out",
      },
      1.88
    );

    tl.to(
      "#label-plate",
      {
        y: -20,
        opacity: 0,
        duration: 0.22,
        ease: "power2.in",
      },
      3.66
    );

    /* -------------------------------------------------------------
       3. Icon Warning Entrance & SVG Path Draw (at 3.22s)
       ------------------------------------------------------------- */
    tl.fromTo(
      "#warning-badge",
      {
        scale: 0.3,
        opacity: 0,
        rotation: -10,
      },
      {
        scale: 1,
        opacity: 1,
        rotation: 0,
        duration: 0.5,
        ease: "power3.out",
      },
      3.22
    );

    tl.to(
      "#warning-path",
      {
        strokeDashoffset: 0,
        duration: 0.55,
        ease: "power2.out",
      },
      3.25
    );

    tl.to(
      "#warning-line",
      {
        strokeDashoffset: 0,
        duration: 0.35,
        ease: "power2.out",
      },
      3.45
    );

    tl.fromTo(
      "#warning-dot",
      {
        scale: 0,
        opacity: 0,
        transformOrigin: "50% 50%",
      },
      {
        scale: 1,
        opacity: 1,
        duration: 0.25,
        ease: "power3.out",
      },
      3.6
    );

    /* -------------------------------------------------------------
       4. Punch Phrase Entrance (at 3.92s)
       ------------------------------------------------------------- */
    tl.fromTo(
      "#punch-card",
      {
        y: 40,
        opacity: 0,
        scale: 0.9,
      },
      {
        y: 0,
        opacity: 1,
        scale: 1,
        duration: 0.45,
        ease: "power3.out",
      },
      3.92
    );

    tl.fromTo(
      ".punch-hl-box",
      {
        scaleX: 0,
        transformOrigin: "left center",
      },
      {
        scaleX: 1,
        duration: 0.35,
        ease: "power2.out",
      },
      4.12
    );

    // Register paused timeline on window.__timelines exactly for "scene-s011"
    window.__timelines["scene-s011"] = tl;
  </script>

    </template>
  </body>
</html>
