<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #141414;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #F5F0E4;
      overflow: hidden;
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Brand Accent Bar */
    .brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Shot 1 Stage & 3D Perspective */
    .s1-perspective-wrapper {
      position: absolute;
      inset: 0;
      perspective: 1200px;
    }

    #s1-stage {
      position: absolute;
      inset: 0;
      transform-origin: center center;
    }

    /* Media Frames */
    .s1-media-frame {
      position: absolute;
      top: 220px;
      left: 140px;
      width: 800px;
      height: 860px;
      border-radius: 20px;
      overflow: hidden;
      background-color: #E7E3D9;
      border: 3px solid #141414;
      box-shadow: 0 20px 40px rgba(20, 20, 20, 0.15);
    }

    .s2-media-frame {
      position: absolute;
      top: 180px;
      left: 110px;
      width: 860px;
      height: 1040px;
      border-radius: 24px;
      overflow: hidden;
      background-color: #E7E3D9;
      border: 3px solid #141414;
      box-shadow: 0 20px 40px rgba(20, 20, 20, 0.15);
    }

    .media-wrap {
      width: 100%;
      height: 100%;
      will-change: transform;
    }

    .media-img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .s1-img {
      object-fit: cover;
      object-position: center 22%;
    }

    .s2-img {
      object-fit: cover;
      object-position: center center;
    }

    /* Quote Overlay (Shot 1) */
    .quote-container {
      position: absolute;
      top: 960px;
      left: 0;
      width: 1080px;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }

    .quote-card {
      background-color: #141414;
      padding: 24px 44px;
      border-radius: 16px;
      border-left: 8px solid #FF6A1A;
      box-shadow: 0 16px 36px rgba(20, 20, 20, 0.3);
      will-change: transform, opacity;
    }

    .quote-text {
      font-size: 60px;
      font-weight: 900;
      color: #F7F4EC;
      letter-spacing: -0.5px;
      line-height: 1.25;
      white-space: nowrap;
    }

    /* Label Overlay (Shot 2) */
    .label-container {
      position: absolute;
      top: 1140px;
      left: 0;
      width: 1080px;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }

    .label-card {
      background-color: #FF6A1A;
      padding: 20px 48px;
      border-radius: 14px;
      box-shadow: 0 14px 32px rgba(20, 20, 20, 0.25);
      will-change: transform, opacity;
    }

    .label-text {
      font-size: 54px;
      font-weight: 900;
      color: #141414;
      letter-spacing: 0.5px;
      line-height: 1.2;
      white-space: nowrap;
    }
  </style>

  <div id="root" data-composition-id="scene-s06" data-width="1080" data-height="1920" data-duration="7.06">
    <!-- Shot 1: S06-1 (0s -> 3.76s) -->
    <section id="shot-1" class="clip" data-start="0" data-duration="3.76">
      <div class="s1-perspective-wrapper">
        <div id="s1-stage">
          <div class="s1-media-frame">
            <div id="s1-img-wrap" class="media-wrap">
              <img src="assets/img-03-elderly-panic-hypertension-cutout.jpg" alt="" class="media-img s1-img">
            </div>
          </div>
          <div class="quote-container">
            <div id="s1-quote-box" class="quote-card">
              <span class="quote-text">“GIỐNG NHƯ BỊ CÚM”</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Shot 2: S06-2 (3.76s -> 7.06s) -->
    <section id="shot-2" class="clip" data-start="3.76" data-duration="3.3">
      <div class="s2-media-frame">
        <div id="s2-img-wrap" class="media-wrap">
          <img src="assets/img-05-gold-body-paint-cutout.jpg" alt="" class="media-img s2-img">
        </div>
      </div>
      <div class="label-container">
        <div id="s2-label-box" class="label-card">
          <span class="label-text">MẤT CÂN BẰNG NHIỆT</span>
        </div>
      </div>
    </section>

    <!-- Fixed Bottom Accent Bar -->
    <div class="brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // === Shot 1 (0.0s - 3.76s) ===
    // Transition in: flip entrance toàn shot
    tl.fromTo(
      "#s1-stage",
      { rotationY: -55, opacity: 0 },
      { rotationY: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
      0
    );

    // Camera motion: zoom-in
    tl.fromTo(
      "#s1-img-wrap",
      { scale: 1 },
      { scale: 1.14, duration: 3.76, ease: "none" },
      0
    );

    // Overlay Quote: “GIỐNG NHƯ BỊ CÚM” (atMs 44060 -> 1.02s, hold 2.5s)
    tl.fromTo(
      "#s1-quote-box",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      1.02
    );

    tl.fromTo(
      "#s1-quote-box",
      { opacity: 1 },
      { opacity: 0, duration: 0.2, ease: "power2.in" },
      3.54
    );

    // === Shot 2 (3.76s - 7.06s) ===
    // Transition in: cut (tự nhiên tại mốc bắt đầu 3.76s)
    // Camera motion: zoom-out
    tl.fromTo(
      "#s2-img-wrap",
      { scale: 1.14 },
      { scale: 1.0, duration: 3.3, ease: "power1.out" },
      3.76
    );

    // Overlay Label: MẤT CÂN BẰNG NHIỆT (pop entrance tại 3.8s, hold 2.4s)
    tl.fromTo(
      "#s2-label-box",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      3.8
    );

    tl.fromTo(
      "#s2-label-box",
      { opacity: 1 },
      { opacity: 0, duration: 0.2, ease: "power2.in" },
      6.8
    );

    // Đăng ký timeline chính thức cho HyperFrames runtime
    window.__timelines["scene-s06"] = tl;
  </script>

    </template>
  </body>
</html>
