      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */

.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      background: #141414;
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
    }
    #root {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      background: #E7E3D9;
    }
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Nền chart: 4 đường ngang tỉ lệ + vạch cam mép trái */
    .chart-background {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .chart-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(20, 20, 20, 0.32);
    }
    .chart-line-1 { top: 384px; }   /* 20% */
    .chart-line-2 { top: 768px; }   /* 40% */
    .chart-line-3 { top: 1152px; }  /* 60% */
    .chart-line-4 { top: 1536px; }  /* 80% */

    .chart-tick {
      position: absolute;
      left: 0;
      width: 28px;
      height: 6px;
      background: #FF6A1A;
      transform: translateY(-2px);
    }
    .chart-tick-1 { top: 384px; }
    .chart-tick-2 { top: 768px; }
    .chart-tick-3 { top: 1152px; }
    .chart-tick-4 { top: 1536px; }

    /* Thanh cam đáy cố định nhận diện thương hiệu */

      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      background: #FF6A1A;
      z-index: 90;
    }

    /* Shot 1 media wrapper (không mang data-start) */
    #shot-1-media-wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 10;
      transform-origin: center center;
    }
    #vid-07 {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Shot 2 media stage & wrapper pan (không mang data-start) */
    #shot-2-media-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 15;
    }
    #shot-2-pan-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: center center;
    }
    #img-01 {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Khung chứa stamp căn giữa vùng an toàn (y: 160-1390) */

      position: absolute;

    .stamp-plate {

  <div id="root" data-composition-id="scene-s08" data-width="1080" data-height="1920" data-duration="10.87">

      <div class="chart-line chart-line-2"></div>
      <div class="chart-line chart-line-3"></div>

    <!-- Shot 1: Video đối chiếu cơ chế hô hấp và sốc nhiệt (start: 0s, duration: 5.4s) -->

      <video id="vid-07"
             src="assets/vid-07-heatstroke-thermoregulation-anatomy-diag.mp4"
             muted
             playsinline
             data-start="0"
             data-duration="5.4"
             data-media-start="0"></video>

    <!-- Shot 2: Sơ đồ giải phẫu pháp y toàn diện (start: 5.4s, duration: 5.47s) -->

      <div id="shot-2-pan-wrapper">
        <img id="img-01"
             class="clip"
             src="assets/img-01-thermoregulation-anatomy-forensic-diagra.jpg"
             alt=""
             data-start="5.4"
             data-duration="5.47">

    <section id="shot-2" class="clip" data-start="5.4" data-duration="5.47" style="z-index: 35;">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // === SHOT 1 (0.0s -> 5.4s) ===
    // TransitionIn: grow
    tl.fromTo("#shot-1-media-wrapper",
      { scale: 0.88, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0
    );

    // CameraMotion: zoom-in
    tl.fromTo("#shot-1-media-wrapper",
      { scale: 1.0 },
      { scale: 1.08, duration: 4.8, ease: "none" },
      0.5
    );

    // Overlay: document (stamp slam: 60200ms -> atSec: 2.0s, holdMs: 2500ms -> đến 4.5s+)
    tl.fromTo("#stamp-1",
      { opacity: 0, scale: 1.45, rotation: -12 },
      { opacity: 1, scale: 1, rotation: -3, duration: 0.28, ease: "power4.out" },
      2.0
    );
    tl.fromTo("#stamp-1",
      { opacity: 1 },
      { opacity: 0, duration: 0.22, ease: "power2.in" },
      4.9
    );

    // === SHOT 2 (5.4s -> 10.87s) ===
    // CameraMotion: pan-right kết hợp lia dọc từ phổi xuống vùng sốc nhiệt
    tl.fromTo("#shot-2-pan-wrapper",
      { x: 40, y: 0, scale: 1.12 },
      { x: -50, y: -65, scale: 1.12, duration: 5.35, ease: "none" },
      5.4
    );

    // Overlay: document (stamp slam: 66300ms -> atSec: 8.1s, holdMs: 2500ms -> đến 10.6s+)
    tl.fromTo("#stamp-2",
      { opacity: 0, scale: 1.45, rotation: 10 },
      { opacity: 1, scale: 1, rotation: 2, duration: 0.28, ease: "power4.out" },
      8.1
    );
    tl.fromTo("#stamp-2",
      { opacity: 1 },
      { opacity: 0, duration: 0.12, ease: "power2.in" },
      10.7
    );

    // Đăng ký timeline cho runtime HyperFrames
    window.__timelines["scene-s08"] = tl;
  </script>
