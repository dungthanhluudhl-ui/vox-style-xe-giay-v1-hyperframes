<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #141414;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #F5F0E4;
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Shot 1 media wrapper (không timed) */
    #shot-1-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    #shot-1-camera {
      position: absolute;
      inset: 0;
      transform-origin: 50% 45%;
    }

    #vid-s03-1 {
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      display: block;
    }

    /* UI Overlay cho Shot 1 */
    #shot-1-ui {
      z-index: 10;
      pointer-events: none;
    }

    .badge-card {
      position: absolute;
      border-left: 10px solid #FF6A1A;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
      border-radius: 4px;
      transform-origin: left center;
    }

    .badge-text {
      display: block;
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 42px;
      line-height: 1.25;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #F7F4EC;
    }

    /* Shot 2 container */
    #shot-2 {
      background-color: #F5F0E4;
      z-index: 20;
      overflow: hidden;
    }

    #shot-2-frame {
      position: absolute;
      top: 200px;
      left: 60px;
      width: 960px;
      height: 980px;
      border-radius: 14px;
      border: 2px solid rgba(20, 20, 20, 0.12);
      background-color: #E7E3D9;
      box-shadow: 0 20px 48px rgba(20, 20, 20, 0.1);
      overflow: hidden;
    }

    #shot-2-media-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #img-s03-2 {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 20%;
      transform: scale(1.32);
      transform-origin: 50% 20%;
      display: block;
    }

    /* Thanh thương hiệu cố định mép đáy */
    #brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s03" data-width="1080" data-height="1920" data-duration="8.0">
    <!-- SHOT 1: Video A-roll toàn khung bọc trong camera wrapper không timed -->
    <div id="shot-1-viewport">
      <div id="shot-1-camera">
        <video
          id="vid-s03-1"
          src="assets/vid-05-paper-cutout-safety-mandate-violation.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="4.22"
          data-media-start="0.5"
        ></video>
      </div>
    </div>

    <!-- SHOT 1: Overlay Label -->
    <section id="shot-1-ui" class="clip" data-start="0" data-duration="4.22">
      <div id="badge-shot-1" class="hf-plate-ink badge-card" style="top: 320px; left: 60px; padding: 22px 38px; opacity: 0;">
        <span class="badge-text">SƠN LATEX TOÀN THÂN</span>
      </div>
    </section>

    <!-- SHOT 2: Hình ảnh minh hoạ cắt dán giấy crop chặt vào sơ đồ an toàn -->
    <section id="shot-2" class="clip" data-start="4.22" data-duration="3.78">
      <div id="shot-2-frame">
        <div id="shot-2-media-wrap">
          <img
            id="img-s03-2"
            src="assets/img-05-gold-body-paint-cutout.jpg"
            alt="Minh hoạ mảng hở an toàn"
          />
        </div>
      </div>

      <div id="badge-shot-2" class="hf-plate-ink badge-card" style="top: 1220px; left: 60px; padding: 22px 38px; opacity: 0;">
        <span class="badge-text">MẢNG HỞ AN TOÀN</span>
      </div>
    </section>

    <!-- Thanh cam cố định nhận diện thương hiệu -->
    <div id="brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Shot 1: Hiệu ứng mở cảnh unfold (0s -> 0.65s)
    tl.fromTo(
      "#shot-1-viewport",
      { clipPath: "polygon(0% 50%, 100% 50%, 100% 50%, 0% 50%)" },
      { clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)", duration: 0.65, ease: "power3.out" },
      0
    );

    // Shot 1: Camera zoom-in nhẹ vào bề mặt da suốt thời lượng shot (0s -> 4.20s)
    tl.fromTo(
      "#shot-1-camera",
      { scale: 1.0 },
      { scale: 1.12, duration: 4.20, ease: "none" },
      0
    );

    // Shot 1 Overlay: "SƠN LATEX TOÀN THÂN" xuất hiện tại t = 2.06s (19340ms - 17280ms)
    tl.fromTo(
      "#badge-shot-1",
      { scale: 0.85, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      2.06
    );

    // Shot 2 Overlay: "MẢNG HỞ AN TOÀN" xuất hiện tại t = 5.34s (22620ms - 17280ms)
    tl.fromTo(
      "#badge-shot-2",
      { scale: 0.85, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      5.34
    );

    // Đăng ký timeline chính thức cho HyperFrames runtime
    window.__timelines["scene-s03"] = tl;
  </script>

    </template>
  </body>
</html>
