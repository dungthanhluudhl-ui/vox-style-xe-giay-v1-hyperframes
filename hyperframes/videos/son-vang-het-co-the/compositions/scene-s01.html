<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #E7E3D9 30%, #202020 100%);
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Thanh cam thương hiệu cố định ở đáy khung hình */
    .brand-bar {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Media Containers: không timed, dùng để animate cameraMotion (zoom/pan) */
    .media-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    #shot-1-media-wrap {
      z-index: 10;
      width: 1080px;
      height: 1920px;
      transform-origin: 50% 50%;
    }

    #vid-1 {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #shot-2-media-wrap {
      z-index: 20;
      width: 1200px;
      height: 1920px;
      left: -60px;
      top: 0;
      transform-origin: 50% 50%;
    }

    #img-2 {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* UI Layers cho từng shot */
    #shot-1-ui {
      z-index: 15;
      pointer-events: none;
    }

    #shot-2-ui {
      z-index: 25;
      pointer-events: none;
    }

    /* Shot 1: Punch Phrase Box */
    .punch-container {
      position: absolute;
      top: 720px;
      left: 0;
      width: 1080px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .punch-card {
      background-color: #141414;
      border: 4px solid #FF6A1A;
      border-radius: 12px;
      padding: 24px 44px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      transform-origin: 50% 50%;
    }

    .punch-text {
      color: #F7F4EC;
      font-size: 58px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
    }

    /* Shot 2: Document Stamp Box */
    .stamp-container {
      position: absolute;
      top: 260px;
      left: 80px;
      transform-origin: 20% 50%;
    }

    .stamp-card {
      background-color: #FF6A1A;
      border: 6px solid #141414;
      border-radius: 8px;
      padding: 22px 36px;
      box-shadow: 8px 12px 0px #141414;
      transform-origin: 50% 50%;
    }

    .stamp-text {
      color: #141414;
      font-size: 48px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>

  <div id="root" data-composition-id="scene-s01" data-width="1080" data-height="1920" data-duration="9.04">
    <!-- Cố định thanh cam đáy nhận diện thương hiệu -->
    <div class="brand-bar"></div>

    <!-- SHOT 1: Media (0s - 5.2s) -->
    <div id="shot-1-media-wrap" class="media-layer">
      <video id="vid-1"
             src="assets/vid-08-cutout-human-silhouette-investigation.mp4"
             muted
             playsinline
             data-start="0"
             data-duration="5.2"
             data-media-start="0"></video>
    </div>

    <!-- SHOT 1: UI / Punch Phrase (0s - 5.2s) -->
    <section id="shot-1-ui" class="clip" data-start="0" data-duration="5.2">
      <div class="punch-container">
        <div id="punch-1" class="punch-card hf-plate-ink">
          <div class="punch-text">HUYỀN THOẠI GOLDFINGER</div>
        </div>
      </div>
    </section>

    <!-- SHOT 2: Media (5.2s - 9.04s) -->
    <div id="shot-2-media-wrap" class="media-layer">
      <img id="img-2"
           class="clip"
           src="assets/img-02-skin-cannot-breathe-cutout.jpg"
           data-start="5.2"
           data-duration="3.84"
           alt="" />
    </div>

    <!-- SHOT 2: UI / Document Stamp (5.2s - 9.04s) -->
    <section id="shot-2-ui" class="clip" data-start="5.2" data-duration="3.84">
      <div class="stamp-container">
        <div id="doc-stamp" class="stamp-card hf-hl-orange">
          <div class="stamp-text">GIẢ THUYẾT: DA THỞ?</div>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // === SHOT 1 (0s -> 5.2s) ===
    // TransitionIn: zoom-through (lao nhanh từ 1.5 về 1.0 trong 0.5s)
    tl.fromTo(
      "#shot-1-media-wrap",
      { scale: 1.5, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0
    );

    // CameraMotion: zoom-in từ từ từ 0.5s đến 5.2s
    tl.fromTo(
      "#shot-1-media-wrap",
      { scale: 1.0 },
      { scale: 1.15, duration: 4.7, ease: "none" },
      0.5
    );

    // Overlay: punch-phrase "HUYỀN THOẠI GOLDFINGER" xuất hiện lúc 2.44s
    tl.fromTo(
      "#punch-1",
      { scale: 0.8, opacity: 0, y: 30 },
      { scale: 1.0, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      2.44
    );

    // Giữ đủ 2.4s (holdMs: 2400) đến 4.84s rồi fade out biến mất trước khi hết shot
    tl.fromTo(
      "#punch-1",
      { opacity: 1 },
      { opacity: 0, duration: 0.25, ease: "power2.in" },
      4.84
    );

    // === SHOT 2 (5.2s -> 9.04s) ===
    // TransitionIn: cut dứt khoát tại 5.2s
    // CameraMotion: pan-right (nội dung dịch sang trái = x giảm từ 50px xuống -70px)
    tl.fromTo(
      "#shot-2-media-wrap",
      { x: 50, scale: 1.1 },
      { x: -70, scale: 1.1, duration: 3.84, ease: "none" },
      5.2
    );

    // Overlay: document stamp slam "GIẢ THUYẾT: DA THỞ?" tại 6.59s (atMs: 6590)
    tl.fromTo(
      "#doc-stamp",
      { opacity: 0, scale: 1.45, rotation: -12 },
      { opacity: 1, scale: 1.0, rotation: -3, duration: 0.28, ease: "power4.out" },
      6.59
    );

    // Đăng ký timeline paused vào runtime
    window.__timelines["scene-s01"] = tl;
  </script>

    </template>
  </body>
</html>
