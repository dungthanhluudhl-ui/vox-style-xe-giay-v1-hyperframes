<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #141414;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #E7E3D9;
      overflow: hidden;
    }
    .clip {
      position: absolute;
      inset: 0;
    }
  </style>


<div id="root" data-composition-id="scene-s04" data-width="1080" data-height="1920" data-duration="8.8">

  <!-- NỀN CẢNH VARIANT: CHART (4 đường ngang tỉ lệ + vạch cam mép trái) -->
  <div id="bg-chart" style="position: absolute; inset: 0; pointer-events: none; z-index: 1;">
    <!-- 4 đường kẻ ngang đậm -->
    <div style="position: absolute; top: 384px; left: 0; right: 0; height: 2px; background: rgba(20,20,20,0.32);"></div>
    <div style="position: absolute; top: 768px; left: 0; right: 0; height: 2px; background: rgba(20,20,20,0.32);"></div>
    <div style="position: absolute; top: 1152px; left: 0; right: 0; height: 2px; background: rgba(20,20,20,0.32);"></div>
    <div style="position: absolute; top: 1536px; left: 0; right: 0; height: 2px; background: rgba(20,20,20,0.32);"></div>

    <!-- Vạch cam mép trái (tick marks) -->
    <div style="position: absolute; top: 378px; left: 0; width: 28px; height: 14px; background: #FF6A1A;"></div>
    <div style="position: absolute; top: 762px; left: 0; width: 28px; height: 14px; background: #FF6A1A;"></div>
    <div style="position: absolute; top: 1146px; left: 0; width: 28px; height: 14px; background: #FF6A1A;"></div>
    <div style="position: absolute; top: 1530px; left: 0; width: 28px; height: 14px; background: #FF6A1A;"></div>
  </div>

  <!-- SHOT 1: VIDEO (Wrapper KHÔNG timed để pan/zoom/punch, video mang data-start độc lập) -->
  <div id="video-wrapper" style="position: absolute; inset: 0; overflow: hidden; z-index: 5;">
    <video id="vid-04"
           src="assets/vid-04-cutout-elderly-patient-monitor.mp4"
           muted
           playsinline
           data-start="0"
           data-duration="4.52"
           data-media-start="0"
           style="width: 100%; height: 100%; object-fit: cover; display: block;"></video>
  </div>

  <!-- SHOT 1 OVERLAY -->
  <section id="shot-1-ui" class="clip" data-start="0" data-duration="4.52" style="z-index: 20; pointer-events: none;">
    <div id="label-shot-1"
         class="hf-plate-ink"
         style="position: absolute; left: 80px; top: 280px; padding: 20px 36px; border-left: 8px solid #FF6A1A; font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; font-size: 52px; letter-spacing: 0.5px; opacity: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.35);">
      PHỦ KÍN TOÀN BỘ
    </div>
  </section>

  <!-- SHOT 2: ẢNH TĨNH MINH HOẠ NGUYÊN MÀU TRÊN NỀN CHART KẺ NGANG + OVERLAY DATA -->
  <section id="shot-2" class="clip" data-start="4.52" data-duration="4.28" style="z-index: 10;">
    <!-- Khung giới hạn để lộ nền chart xung quanh -->
    <div id="shot-2-frame" style="position: absolute; left: 80px; top: 220px; width: 920px; height: 1060px; overflow: hidden; border-radius: 8px; box-shadow: 0 20px 50px rgba(20,20,20,0.25); background: #141414;">
      <div id="shot-2-cam" style="position: absolute; inset: -40px; will-change: transform;">
        <img id="img-04-media"
             src="assets/img-04-man-medical-heart-monitor.jpg"
             alt=""
             style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 32%; display: block;" />
      </div>
    </div>

    <!-- Overlay dạng data: NHỊP TIM: 72 BPM -->
    <div id="data-shot-2"
         class="hf-plate-ink"
         style="position: absolute; left: 110px; top: 1160px; padding: 22px 38px; border-left: 8px solid #FF6A1A; font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; font-size: 54px; letter-spacing: 1px; opacity: 0; box-shadow: 0 12px 32px rgba(0,0,0,0.4);">
      NHỊP TIM: 72 BPM
    </div>
  </section>

  <!-- THANH CAM ĐÁY THƯƠNG HIỆU CỐ ĐỊNH 12PX -->
  <div id="bottom-brand-bar" style="position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: #FF6A1A; z-index: 100;"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });

  // SHOT 1: Transition "punch" dứt khoát vào cảnh tại t = 0
  tl.fromTo("#video-wrapper",
    { scale: 1.25, opacity: 0 },
    { scale: 1, opacity: 1, duration: 0.45, ease: "power4.out" },
    0
  );

  // SHOT 1: Pop entrance nhãn "PHỦ KÍN TOÀN BỘ" tại 2.34s, giữ 2.1s rồi ẩn trước cut
  tl.fromTo("#label-shot-1",
    { scale: 0.82, opacity: 0 },
    { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
    2.34
  );
  tl.fromTo("#label-shot-1",
    { opacity: 1 },
    { opacity: 0, duration: 0.12, ease: "power2.in" },
    4.40
  );

  // SHOT 2: Camera zoom-out trên ảnh y tế từ 4.52s đến hết shot
  tl.fromTo("#shot-2-cam",
    { scale: 1.18 },
    { scale: 1.0, duration: 4.20, ease: "power2.out" },
    4.52
  );

  // SHOT 2: Pop entrance cho dữ liệu "NHỊP TIM: 72 BPM" tại 4.62s
  tl.fromTo("#data-shot-2",
    { scale: 0.85, opacity: 0 },
    { scale: 1, opacity: 1, duration: 0.38, ease: "power3.out" },
    4.62
  );
  tl.fromTo("#data-shot-2",
    { opacity: 1 },
    { opacity: 0, duration: 0.12, ease: "power2.in" },
    8.66
  );

  window.__timelines["scene-s04"] = tl;
</script>

    </template>
  </body>
</html>
