<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #141414;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #E7E3D9 30%, rgba(20, 20, 20, 0.28) 100%), #E7E3D9;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Shot 1 media wrapper - un-timed wrapper for motion and transition */
    #vid-wrapper-1 {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
      transform-origin: center center;
    }

    #vid-pan-wrap {
      position: absolute;
      inset: -5%;
      width: 110%;
      height: 110%;
      transform-origin: center center;
    }

    #video-s05-1 {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Shot 1 Overlay Container */
    #shot-1-overlays {
      z-index: 10;
      pointer-events: none;
    }

    #overlay-s05-1 {
      position: absolute;
      left: 70px;
      top: 300px;
      padding: 18px 32px;
      border-left: 10px solid #FF6A1A;
      border-radius: 8px;
      font-weight: 900;
      font-size: 52px;
      line-height: 1.25;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.42);
      transform-origin: left center;
    }

    /* Shot 2 */
    #shot-2 {
      z-index: 20;
      overflow: hidden;
      background: #E7E3D9;
    }

    #shot-2-img-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: center center;
    }

    #img-s05-2 {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #overlay-s05-2 {
      position: absolute;
      left: 70px;
      top: 320px;
      padding: 18px 32px;
      border-left: 10px solid #FF6A1A;
      border-radius: 8px;
      font-weight: 900;
      font-size: 52px;
      line-height: 1.25;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.42);
      transform-origin: left center;
      z-index: 25;
    }

    /* Brand Accent Bar */
    #bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
      pointer-events: none;
    }
  </style>

  <div id="root" data-composition-id="scene-s05" data-width="1080" data-height="1920" data-duration="8.96">
    <!-- Shot 1: Video media container (not timed, preserves video isolation rule) -->
    <div id="vid-wrapper-1">
      <div id="vid-pan-wrap">
        <video
          id="video-s05-1"
          src="assets/vid-02-panic-attack-health-crisis-cutout.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="4.42"
          data-media-start="1">
        </video>
      </div>
    </div>

    <!-- Shot 1: Overlays layer -->
    <section id="shot-1-overlays" class="clip" data-start="0" data-duration="4.42">
      <div id="overlay-s05-1" class="hf-plate-ink">
        HUYẾT ÁP TĂNG VỌT
      </div>
    </section>

    <!-- Shot 2: Image and Overlay -->
    <section id="shot-2" class="clip" data-start="4.42" data-duration="4.54">
      <div id="shot-2-img-wrap">
        <img
          id="img-s05-2"
          src="assets/img-03-elderly-panic-hypertension-cutout.jpg"
          alt="Triệu chứng nhiệt độ Jamie"
        />
      </div>
      <div id="overlay-s05-2" class="hf-plate-ink">
        NỬA LẠNH NỬA NÓNG
      </div>
    </section>

    <!-- Permanent brand signature bottom bar -->
    <div id="bottom-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // --- SHOT 1 (0s -> 4.42s) ---
    // TransitionIn: wobble-drop entry on video wrapper
    tl.fromTo("#vid-wrapper-1",
      { y: -260, rotation: -6, opacity: 0 },
      { y: 0, rotation: 1.5, opacity: 1, duration: 0.35, ease: "power2.out" },
      0
    );
    tl.fromTo("#vid-wrapper-1",
      { rotation: 1.5 },
      { rotation: 0, duration: 0.2, ease: "power2.out" },
      0.35
    );

    // Camera Motion: pan-right (wrapper moves left)
    tl.fromTo("#vid-pan-wrap",
      { x: 0, y: 0, scale: 1.05 },
      { x: -70, y: -35, scale: 1.12, duration: 4.42, ease: "none" },
      0
    );

    // Overlay 1: HUYẾT ÁP TĂNG VỌT (atMs: 35060 -> 0.98s, holdMs: 2200ms)
    tl.fromTo("#overlay-s05-1",
      { scale: 0.8, opacity: 0, y: 25 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      0.98
    );
    tl.fromTo("#overlay-s05-1",
      { opacity: 1 },
      { opacity: 0, duration: 0.25, ease: "power2.in" },
      3.75
    );

    // --- SHOT 2 (4.42s -> 8.96s) ---
    // TransitionIn: cut (instant switch at 4.42s)
    // Camera Motion: zoom-in
    tl.fromTo("#shot-2-img-wrap",
      { scale: 1.0 },
      { scale: 1.12, duration: 4.54, ease: "none" },
      4.42
    );

    // Overlay 2: NỬA LẠNH NỬA NÓNG (atMs: 40180 -> 6.1s, holdMs: 2400ms)
    tl.fromTo("#overlay-s05-2",
      { scale: 0.8, opacity: 0, y: 25 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      6.1
    );
    tl.fromTo("#overlay-s05-2",
      { opacity: 1 },
      { opacity: 0, duration: 0.25, ease: "power2.in" },
      8.55
    );

    // Register paused timeline with HyperFrames runtime
    window.__timelines["scene-s05"] = tl;
  </script>

    </template>
  </body>
</html>
