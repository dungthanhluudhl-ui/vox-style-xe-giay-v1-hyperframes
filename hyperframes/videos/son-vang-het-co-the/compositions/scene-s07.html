<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      background-image: radial-gradient(circle at 50% 50%, #E7E3D9 40%, rgba(20, 20, 20, 0.32) 100%);
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    .media-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .media-inner {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      transform-origin: center center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    img.media-asset {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .timeline-card {
      position: absolute;
      inset: auto;
      bottom: auto;
      right: auto;
      left: 60px;
      height: auto;
      width: max-content;
      max-width: 960px;
      opacity: 0;
      background-color: #141414;
      color: #F7F4EC;
      border-left: 6px solid #FF6A1A;
      padding: 16px 28px;
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 34px;
      line-height: 1.25;
      letter-spacing: 0.5px;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transform-origin: left center;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    #overlay-1,
    #overlay-2,
    #overlay-3,
    #overlay-4 {
      opacity: 0;
    }

    #overlay-1 {
      top: 220px;
      z-index: 110;
    }

    #overlay-2 {
      top: 220px;
      z-index: 120;
    }

    #overlay-3 {
      top: 316px;
      z-index: 130;
    }

    #overlay-4 {
      top: 412px;
      z-index: 140;
    }

    #brand-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 999;
      pointer-events: none;
    }
  </style>

  <div id="root" data-composition-id="scene-s07" data-width="1080" data-height="1920" data-duration="8.1">
    <!-- Shot 1: Video can thiệp khẩn cấp (vid-01) -->
    <div id="shot-1-media-wrap" class="media-layer" style="z-index: 10;">
      <video id="vid-01" src="assets/vid-01-stop-experiment-lab-panic.mp4" muted playsinline data-start="0" data-duration="2.1" data-media-start="0"></video>
    </div>

    <!-- Shot 2: Ảnh dừng thí nghiệm (img-08) -->
    <div id="shot-2" class="clip" data-start="2.1" data-duration="2.0" style="z-index: 20;">
      <div id="shot-2-media-wrap" class="media-inner">
        <img src="assets/img-08-stop-experiment-lab-accident.jpg" class="media-asset" alt="Stop experiment lab accident">
      </div>
    </div>

    <!-- Shot 3: Video lau rửa vết thương (vid-06) -->
    <div id="shot-3-media-wrap" class="media-layer" style="z-index: 30;">
      <video id="vid-06" src="assets/vid-06-injured-victim-medical-treatment.mp4" muted playsinline data-start="4.1" data-duration="2.1" data-media-start="0.5"></video>
    </div>

    <!-- Shot 4: Ảnh hồi phục chỉ số ổn định (img-06) -->
    <div id="shot-4" class="clip" data-start="6.2" data-duration="1.9" style="z-index: 40;">
      <div id="shot-4-media-wrap" class="media-inner">
        <img src="assets/img-06-burn-victim-medical-treatment.jpg" class="media-asset" alt="Burn victim recovery treatment">
      </div>
    </div>

    <!-- Overlays: Timeline các mốc can thiệp y tế -->
    <div id="overlay-1" class="clip timeline-card hf-plate-ink" data-start="1.0" data-duration="1.65" style="opacity: 0;">
      <span class="hf-text-light">CAN THIỆP Y TẾ</span>
    </div>

    <div id="overlay-2" class="clip timeline-card hf-plate-ink" data-start="3.66" data-duration="4.44" style="opacity: 0;">
      <span class="hf-text-light">1. DỪNG THÍ NGHIỆM</span>
    </div>

    <div id="overlay-3" class="clip timeline-card hf-plate-ink" data-start="4.40" data-duration="3.70" style="opacity: 0;">
      <span class="hf-text-light">2. TẨY RỬA KHẨN CẤP</span>
    </div>

    <div id="overlay-4" class="clip timeline-card hf-plate-ink" data-start="6.90" data-duration="1.20" style="opacity: 0;">
      <span class="hf-text-light">3. HỒI PHỤC ỔN ĐỊNH</span>
    </div>

    <!-- Thanh cam đáy cố định nhận diện thương hiệu -->
    <div id="brand-bottom-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    gsap.set(["#overlay-1", "#overlay-2", "#overlay-3", "#overlay-4"], { opacity: 0 });

    const tl = gsap.timeline({ paused: true });

    // Shot 1 (0.0s - 2.1s): transition strike va đập mạnh mẽ, camera zoom-out giật lùi
    tl.fromTo(
      "#shot-1-media-wrap",
      { scale: 1.35, y: -60, opacity: 0 },
      { scale: 1.10, y: 0, opacity: 1, duration: 0.25, ease: "power4.out" },
      0
    );
    tl.fromTo(
      "#shot-1-media-wrap",
      { scale: 1.10, y: 0 },
      { scale: 1.02, y: 0, duration: 1.8, ease: "power1.out" },
      0.25
    );

    // Overlay 1: "CAN THIỆP Y TẾ" (atMs: 51100 -> t=1.0s, holdMs: 1600 -> t=2.6s)
    tl.fromTo(
      "#overlay-1",
      { scale: 0.88, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      1.0
    );
    tl.fromTo(
      "#overlay-1",
      { opacity: 1 },
      { opacity: 0, duration: 0.22, ease: "power2.in" },
      2.4
    );

    // Shot 2 (2.1s - 4.1s): camera zoom-in
    tl.fromTo(
      "#shot-2-media-wrap",
      { scale: 1.0 },
      { scale: 1.12, duration: 1.95, ease: "power1.out" },
      2.1
    );

    // Overlay 2: "1. DỪNG THÍ NGHIỆM" (atMs: 53760 -> t=3.66s, holdMs: 1800)
    tl.fromTo(
      "#overlay-2",
      { scale: 0.88, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      3.66
    );
    tl.fromTo(
      "#overlay-2",
      { opacity: 1 },
      { opacity: 0, duration: 0.2, ease: "power2.in" },
      7.85
    );

    // Shot 3 (4.1s - 6.2s): camera static (video hoạt họa tự diễn tiến)

    // Overlay 3: "2. TẨY RỬA KHẨN CẤP" (atMs: 54500 -> t=4.40s, holdMs: 1800)
    tl.fromTo(
      "#overlay-3",
      { scale: 0.88, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      4.40
    );
    tl.fromTo(
      "#overlay-3",
      { opacity: 1 },
      { opacity: 0, duration: 0.2, ease: "power2.in" },
      7.85
    );

    // Shot 4 (6.2s - 8.1s): camera zoom-out
    tl.fromTo(
      "#shot-4-media-wrap",
      { scale: 1.12 },
      { scale: 1.0, duration: 1.85, ease: "power1.out" },
      6.2
    );

    // Overlay 4: "3. HỒI PHỤC ỔN ĐỊNH" (atMs: 57000 -> t=6.90s, holdMs: 1800)
    tl.fromTo(
      "#overlay-4",
      { scale: 0.88, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.30, ease: "power3.out" },
      6.90
    );
    tl.fromTo(
      "#overlay-4",
      { opacity: 1 },
      { opacity: 0, duration: 0.2, ease: "power2.in" },
      7.85
    );

    window.__timelines["scene-s07"] = tl;
  </script>

    </template>
  </body>
</html>
