<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #E7E3D9;
      overflow: hidden;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
    }
    .clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #brand-bar {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 999;
    }
    #vid-container {
      position: absolute;
      inset: 0;
      z-index: 10;
      overflow: hidden;
    }
    #vid-peel-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #vid-pan-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: center center;
    }
    #vid-lab {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #shot-1 {
      z-index: 20;
      pointer-events: none;
    }
    #label-wrap {
      position: absolute;
      top: 1180px;
      left: 0;
      width: 1080px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }
    #label-badge {
      background: #141414;
      border-left: 8px solid #FF6A1A;
      padding: 18px 36px;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transform-origin: center center;
    }
    #label-badge span {
      color: #F7F4EC;
      font-weight: 900;
      font-size: 44px;
      letter-spacing: 2px;
      line-height: 1.2;
      white-space: nowrap;
    }
    #shot-2 {
      z-index: 30;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }
    #jamie-card {
      position: absolute;
      top: 220px;
      left: 80px;
      width: 920px;
      height: 740px;
      background-color: #F5F0E4;
      border: 5px solid #141414;
      border-radius: 8px;
      box-shadow: 12px 14px 0px #141414;
      overflow: hidden;
    }
    #jamie-img-pan {
      width: 100%;
      height: 100%;
      transform-origin: center center;
    }
    #jamie-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
      display: block;
    }
    #stamp-wrap {
      position: absolute;
      top: 1040px;
      left: 0;
      width: 1080px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }
    #stamp-badge {
      background: #FF6A1A;
      border: 4px solid #141414;
      padding: 18px 40px;
      border-radius: 8px;
      box-shadow: 6px 8px 0px #141414;
      transform-origin: center center;
    }
    #stamp-badge span {
      color: #141414;
      font-weight: 900;
      font-size: 42px;
      letter-spacing: 2px;
      line-height: 1.2;
      white-space: nowrap;
    }
  </style>

  <div id="root" data-composition-id="scene-s02" data-width="1080" data-height="1920" data-duration="8.24">
    <!-- Fixed brand bar -->
    <div id="brand-bar"></div>

    <!-- Untimed wrapper for Video (Shot 1) -->
    <div id="vid-container">
      <div id="vid-peel-wrap">
        <div id="vid-pan-wrap">
          <video
            id="vid-lab"
            src="assets/vid-03-forensic-analyst-lab-animation.mp4"
            muted
            playsinline
            data-start="0"
            data-duration="4.46"
            data-media-start="1"
          ></video>
        </div>
      </div>
    </div>

    <!-- Timed overlay for Shot 1 -->
    <section id="shot-1" class="clip" data-start="0" data-duration="4.46">
      <div id="label-wrap">
        <div id="label-badge">
          <span>KIỂM CHỨNG KHOA HỌC</span>
        </div>
      </div>
    </section>

    <!-- Shot 2: Split layout on grid with document overlay -->
    <section id="shot-2" class="clip" data-start="4.46" data-duration="3.78">
      <div id="jamie-card">
        <div id="jamie-img-pan">
          <img
            id="jamie-img"
            src="assets/img-07-forensic-expert-lab-cutout.jpg"
            alt="Jamie Hyneman"
          >
        </div>
      </div>
      <div id="stamp-wrap">
        <div id="stamp-badge">
          <span>TÌNH NGUYỆN VIÊN: JAMIE</span>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Shot 1: Peel entrance transition
    tl.fromTo(
      "#vid-peel-wrap",
      { clipPath: "polygon(0% 0%, 0% 0%, 0% 100%, 0% 100%)" },
      { clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)", duration: 0.65, ease: "power2.out" },
      0
    );

    // Shot 1: Camera pan-right (wrapper moves left)
    tl.fromTo(
      "#vid-pan-wrap",
      { scale: 1.15, x: 60 },
      { scale: 1.15, x: -80, duration: 4.46, ease: "none" },
      0
    );

    // Shot 1 Overlay: "KIỂM CHỨNG KHOA HỌC" pop entrance and exit
    tl.fromTo(
      "#label-badge",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      1.37
    );
    tl.fromTo(
      "#label-badge",
      { opacity: 1 },
      { opacity: 0, duration: 0.25, ease: "power2.in" },
      3.57
    );

    // Shot 2: Camera zoom-in on Jamie card
    tl.fromTo(
      "#jamie-img-pan",
      { scale: 1.0 },
      { scale: 1.10, duration: 3.78, ease: "none" },
      4.46
    );

    // Shot 2 Overlay: "TÌNH NGUYỆN VIÊN: JAMIE" stamp slam
    tl.fromTo(
      "#stamp-badge",
      { opacity: 0, scale: 1.4, rotation: -12 },
      { opacity: 1, scale: 1, rotation: -3, duration: 0.28, ease: "power4.out" },
      7.04
    );

    window.__timelines["scene-s02"] = tl;
  </script>

    </template>
  </body>
</html>
