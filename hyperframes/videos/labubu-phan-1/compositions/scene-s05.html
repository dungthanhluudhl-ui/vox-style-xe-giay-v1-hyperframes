<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        background-color: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }

      /* Base clip rule conforming to HyperFrames contract */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Decoupled Camera & Motion Rigs */
      #camera-zoom {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      #camera-pan {
        position: absolute;
        inset: 0;
        will-change: transform;
      }

      #shake-rig {
        position: absolute;
        inset: 0;
        will-change: transform;
      }

      /* Scene Video (vid-06: market volatility rush) - clean display without darkening blend */
      .scene-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }

      /* Chart Background Variant (STYLE_DNA: 4 ruled lines at 20/40/60/80% + left orange tick marks) */
      .chart-grid-layer {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }

      .chart-grid-subtle {
        position: absolute;
        inset: 0;
        background-size: 84px 84px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px);
      }

      .chart-rule {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background-color: rgba(20, 20, 20, 0.48);
        box-shadow: 0 1px 0 rgba(247, 244, 236, 0.35);
      }

      .chart-rule::before {
        content: "";
        position: absolute;
        left: 0;
        top: -6px;
        width: 26px;
        height: 14px;
        background-color: #FF6A1A;
      }

      /* Rule lines at exact 20%, 40%, 60%, 80% */
      .rule-20 { top: 384px; }
      .rule-40 { top: 768px; }
      .rule-60 { top: 1152px; }
      .rule-80 { top: 1536px; }

      /* Volatility Sine Wave Diagram Overlay */
      #diagram-overlay {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
      }

      .volatility-curve {
        fill: none;
        stroke: #FF6A1A;
        stroke-width: 6.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 4px 10px rgba(20, 20, 20, 0.5));
      }

      .diagram-marker {
        transform-origin: center;
      }

      /* Punch Phrase Card (Phase 2) */
      .punch-container {
        position: absolute;
        top: 220px;
        left: 60px;
        right: 60px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        will-change: transform, opacity;
      }

      .punch-badge {
        display: inline-flex;
        align-items: center;
        background-color: #FF6A1A;
        color: #141414;
        padding: 8px 18px;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 6px;
        box-shadow: 4px 4px 0 #141414;
      }

      .punch-main-card {
        background-color: #141414;
        border-left: 10px solid #FF6A1A;
        padding: 24px 34px;
        box-shadow: 8px 10px 0 rgba(20, 20, 20, 0.35);
        max-width: 960px;
      }

      .punch-title {
        margin: 0;
        font-size: 68px;
        font-weight: 900;
        line-height: 1.15;
        color: #F7F4EC;
        letter-spacing: -0.5px;
        text-transform: uppercase;
      }

      .punch-sub {
        margin-top: 10px;
        font-size: 22px;
        font-weight: 700;
        color: #FF6A1A;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }

      /* Measurement Amplitude Label & Scale Icon Card (Phase 3) */
      .metric-container {
        position: absolute;
        top: 820px;
        left: 60px;
        right: 60px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 24px;
        background-color: rgba(20, 20, 20, 0.94);
        border: 2px solid #FF6A1A;
        padding: 24px 30px;
        box-shadow: 6px 8px 0 #FF6A1A;
        will-change: transform, opacity;
      }

      .scale-icon-box {
        width: 92px;
        height: 92px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        background: #141414;
        border: 2px solid rgba(255, 106, 26, 0.45);
      }

      .scale-svg {
        width: 74px;
        height: 74px;
      }

      .scale-path {
        fill: none;
        stroke: #FF6A1A;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .metric-content {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .metric-tag {
        font-size: 19px;
        font-weight: 700;
        color: #FF6A1A;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .metric-title {
        margin: 0;
        font-size: 46px;
        font-weight: 900;
        line-height: 1.15;
        color: #F7F4EC;
        text-transform: uppercase;
        letter-spacing: -0.5px;
      }

      .metric-caliper {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 10px;
      }

      .caliper-bar {
        display: block;
        height: 6px;
        flex: 1;
        background: repeating-linear-gradient(
          to right,
          #FF6A1A,
          #FF6A1A 12px,
          transparent 12px,
          transparent 18px
        );
      }

      .caliper-label {
        font-size: 18px;
        font-weight: 700;
        color: #F7F4EC;
        letter-spacing: 1px;
      }

      /* Fixed Signature Orange Bar at Bottom */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 100;
      }

      /* Subtle Vignette Layer */
      #grain-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        background: radial-gradient(
          circle at 50% 50%,
          transparent 65%,
          rgba(20, 20, 20, 0.16) 100%
        );
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s05"
      data-width="1080"
      data-height="1920"
      data-duration="5.84"
    >
      <!-- Camera Zoom Rig for Punch Impact -->
      <div id="camera-zoom" data-layout-allow-overflow="true">
        <!-- Camera Pan Rig for Lateral Tracking -->
        <div id="camera-pan">
          <!-- Shake Rig for Impact Tremor -->
          <div id="shake-rig">
            <!-- Scene Video (vid-06: market volatility rush) -->
            <video
              id="vid-06"
              class="scene-video"
              data-start="0"
              data-duration="5.84"
              data-media-start="1.2"
              muted
              playsinline
              src="assets/vid-06-market-hype-volatility-rush.mp4"
            ></video>

            <!-- Chart Background Lines (STYLE_DNA: Chart Variant) -->
            <div class="chart-grid-layer">
              <div class="chart-grid-subtle"></div>
              <div class="chart-rule rule-20"></div>
              <div class="chart-rule rule-40"></div>
              <div class="chart-rule rule-60"></div>
              <div class="chart-rule rule-80"></div>
            </div>

            <!-- Soft Vignette Layer -->
            <div id="grain-overlay"></div>

            <!-- Volatility Sine Wave Diagram Overlay -->
            <div id="diagram-overlay">
              <svg
                viewBox="0 0 1080 1920"
                width="1080"
                height="1920"
                style="position: absolute; inset: 0; width: 100%; height: 100%;"
              >
                <!-- Volatility Sine Curve -->
                <path
                  id="volatility-curve"
                  class="volatility-curve draw-path"
                  d="M -20 1152 C 180 1152, 280 480, 480 480 C 680 480, 680 1480, 800 1480 C 920 1480, 980 1152, 1100 1152"
                />

                <!-- Peak indicator marker at (480, 480) -->
                <g id="peak-marker" class="diagram-marker">
                  <circle cx="480" cy="480" r="16" fill="#FF6A1A" />
                  <circle cx="480" cy="480" r="6" fill="#141414" />
                  <circle cx="480" cy="480" r="28" fill="none" stroke="#FF6A1A" stroke-width="2" stroke-dasharray="4 4" />
                </g>

                <!-- Trough indicator marker at (800, 1480) -->
                <g id="trough-marker" class="diagram-marker">
                  <circle cx="800" cy="1480" r="16" fill="#FF6A1A" />
                  <circle cx="800" cy="1480" r="6" fill="#141414" />
                  <circle cx="800" cy="1480" r="28" fill="none" stroke="#FF6A1A" stroke-width="2" stroke-dasharray="4 4" />
                </g>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Punch Phrase Timed Visual Clip (0.41s -> 2.41s) -->
      <div id="punch-clip" class="clip" data-start="0.41" data-duration="2.0">
        <div class="punch-container">
          <div class="punch-badge">CHU KỲ BIẾN ĐỘNG</div>
          <div class="punch-main-card">
            <h1 class="punch-title">BÁN LẺ TOÀN CẦU</h1>
            <div class="punch-sub">GIAI ĐOẠN ĐẢO CHIỀU CỰC ĐẠI</div>
          </div>
        </div>
      </div>

      <!-- Amplitude Label & Scale Icon Timed Visual Clip (3.80s -> 5.84s) -->
      <div id="label-clip" class="clip" data-start="3.8" data-duration="2.04">
        <div class="metric-container">
          <div class="scale-icon-box">
            <!-- Icon "scale" (Self-drawing SVG path vocabulary) -->
            <svg class="scale-svg" viewBox="0 0 100 100">
              <!-- Pillar & Base -->
              <path class="scale-path draw-path" d="M 50 18 L 50 82 M 32 82 L 68 82" />
              <!-- Balance Beam -->
              <path class="scale-path draw-path" d="M 18 30 L 82 30" />
              <!-- Left Pan -->
              <path class="scale-path draw-path" d="M 18 30 L 8 58 L 28 58 Z" />
              <!-- Right Pan -->
              <path class="scale-path draw-path" d="M 82 30 L 72 58 L 92 58 Z" />
            </svg>
          </div>

          <div class="metric-content">
            <div class="metric-tag">ĐO LƯỜNG DAO ĐỘNG</div>
            <h2 class="metric-title">BIÊN ĐỘ DAO ĐỘNG</h2>
            <div class="metric-caliper">
              <div class="caliper-bar"></div>
              <span class="caliper-label">±85% ĐỈNH - ĐÁY</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Signature Orange Bar at the very bottom -->
      <div id="brand-bottom-bar"></div>
    </div>

    <!-- GSAP Seekable Timeline Script -->
    <script>
      // 1. Measure and prepare all SVG self-drawing paths
      const drawPaths = document.querySelectorAll(".draw-path");
      drawPaths.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = length;
        path.style.strokeDashoffset = length;
      });

      // Initial state for diagram markers
      gsap.set("#peak-marker", { scale: 0, opacity: 0, transformOrigin: "480px 480px" });
      gsap.set("#trough-marker", { scale: 0, opacity: 0, transformOrigin: "800px 1480px" });

      // 2. Initialize Paused GSAP Timeline
      const tl = gsap.timeline({ paused: true });

      // === PHASE 1: TRANSITION IN ("punch" impact + screen shake) ===
      // Punch zoom-in snap decelerating into scale 1.04 on #camera-zoom
      tl.fromTo(
        "#camera-zoom",
        { scale: 1.18 },
        { scale: 1.04, duration: 0.44, ease: "power4.out" },
        0
      );

      // Camera pan-left motion across the whole shot on #camera-pan
      tl.fromTo(
        "#camera-pan",
        { x: 30 },
        { x: -30, duration: 5.4, ease: "none" },
        0.44
      );

      // Punch impact tremor on #shake-rig (deterministic fromTo sequence)
      const shakeSegments = [
        { t: 0.00, dur: 0.07, fromX: 0, fromY: 0, toX: -8, toY: 14 },
        { t: 0.07, dur: 0.07, fromX: -8, fromY: 14, toX: 10, toY: -10 },
        { t: 0.14, dur: 0.07, fromX: 10, fromY: -10, toX: -6, toY: 8 },
        { t: 0.21, dur: 0.07, fromX: -6, fromY: 8, toX: 4, toY: -4 },
        { t: 0.28, dur: 0.10, fromX: 4, fromY: -4, toX: 0, toY: 0 }
      ];

      shakeSegments.forEach((seg, i) => {
        tl.fromTo(
          "#shake-rig",
          { x: seg.fromX, y: seg.fromY },
          {
            x: seg.toX,
            y: seg.toY,
            duration: seg.dur,
            ease: "power1.inOut",
            immediateRender: i === 0
          },
          seg.t
        );
      });

      // === PHASE 2: PUNCH PHRASE & VOLATILITY CURVE ===
      // Volatility Sine Curve drawing progressively
      const volCurve = document.getElementById("volatility-curve");
      const volCurveLen = volCurve ? volCurve.getTotalLength() : 1800;
      tl.fromTo(
        "#volatility-curve",
        { strokeDashoffset: volCurveLen },
        { strokeDashoffset: 0, duration: 1.5, ease: "power2.out", immediateRender: false },
        0.7
      );

      // Peak & Trough markers appear as the wave hits crest and trough
      tl.fromTo(
        "#peak-marker",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out", immediateRender: false },
        1.35
      );
      tl.fromTo(
        "#trough-marker",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out", immediateRender: false },
        1.9
      );

      // Punch Phrase Entrance (atMs: 30770 -> 0.41s)
      tl.fromTo(
        "#punch-clip .punch-container",
        { scale: 0.84, y: 36, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.44, ease: "power3.out" },
        0.41
      );

      // Punch Phrase Exit (deterministic fromTo)
      tl.fromTo(
        "#punch-clip .punch-container",
        { scale: 1, y: 0, opacity: 1 },
        { scale: 0.96, y: -24, opacity: 0, duration: 0.32, ease: "power2.in", immediateRender: false },
        2.05
      );

      // === PHASE 3: METRIC LABEL & SCALE ICON ===
      // Label card entrance (atMs: 34160 -> 3.80s)
      tl.fromTo(
        "#label-clip .metric-container",
        { scale: 0.88, y: 30, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.44, ease: "power3.out", immediateRender: false },
        3.8
      );

      // Caliper bar expanding
      tl.fromTo(
        "#label-clip .caliper-bar",
        { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, duration: 0.45, ease: "power2.out", immediateRender: false },
        4.05
      );

      // Icon "scale" stroke drawing (atMs: 34800 -> 4.44s)
      const scalePaths = document.querySelectorAll(".scale-path");
      scalePaths.forEach((sp, idx) => {
        const spLen = sp.getTotalLength();
        tl.fromTo(
          sp,
          { strokeDashoffset: spLen },
          { strokeDashoffset: 0, duration: 0.38, ease: "power2.out", immediateRender: false },
          4.44 + idx * 0.08
        );
      });

      // 3. Register Root Timeline to HyperFrames
      window.__timelines["scene-s05"] = tl;
    </script>
  
    </template>
  </body>
</html>
