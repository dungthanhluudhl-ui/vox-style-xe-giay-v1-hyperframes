    <script>
      const tl = gsap.timeline({ paused: true });

      // Deterministic stroke preparation
      ["arrow-1", "arrow-2", "arrow-3"].forEach((id) => {
        const el = document.getElementById(id);
        if (el) {
          const len = el.getTotalLength();
          el.style.strokeDasharray = len;
          el.style.strokeDashoffset = len;
        }
      });

      const moneyElements = ["money-rect", "money-circle", "money-line-1", "money-line-2"]
        .map((id) => document.getElementById(id))
        .filter(Boolean);

      moneyElements.forEach((el) => {
        const len = el.getTotalLength ? el.getTotalLength() : 80;
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
      });

      // 1. Mockup entrance: single smooth wobble-drop (0.05s)
      tl.fromTo(
        "#mockup",
        { y: -450, opacity: 0, rotation: -3 },
        { y: 0, opacity: 1, rotation: 0, duration: 0.75, ease: "power3.out" },
        0.05
      );

      tl.fromTo(
        "#play-btn",
        { scale: 0.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.35
      );

      tl.fromTo(
        "#badge-suggested",
        { scale: 0.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.57
      );

      tl.to("#progress-fill", { width: "55%", duration: 5.5, ease: "none" }, 0.6);

      // 2. Flow Card Entrance (0.95s)
      tl.fromTo(
        "#flow-card",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.95
      );

      tl.fromTo(
        "#node-1",
        { scale: 0, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        1.3
      );

      tl.to("#arrow-1", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 1.7);

      tl.fromTo(
        "#node-2",
        { scale: 0, opacity: 0, x: 20 },
        { scale: 1, opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
        2.22
      );

      tl.to(
        moneyElements,
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out", stagger: 0.08 },
        2.3
      );

      tl.to("#arrow-2", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 2.8);

      tl.fromTo(
        "#node-3",
        { scale: 0, opacity: 0, x: -20 },
        { scale: 1, opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
        3.25
      );

      tl.to("#arrow-3", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 3.65);

      tl.fromTo(
        "#center-badge",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        4.1
      );

      // 3. Punch phrase "BẪY TÂM LÝ DOPAMINE" (4.45s)
      tl.fromTo(
        "#punch-phrase",
        { scale: 0.85, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        4.45
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s08"] = tl;
    </script>
