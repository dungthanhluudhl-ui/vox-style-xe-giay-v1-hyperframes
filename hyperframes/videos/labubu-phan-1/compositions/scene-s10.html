      .canvas-bg {

        inset: 0;
        pointer-events: none;
        z-index: 1;
      }
      .grid-pattern {
        position: absolute;
        inset: 0;

          linear-gradient(to right, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px),

      /* Signature Vox Orange Bottom Bar */
      .brand-bottom-bar {

      /* ---------------- SHOT 1 ELEMENTS ---------------- */

        flex-direction: column;
      }
      .rise-num {
        color: #FF6A1A;
        font-size: 34px;
        font-weight: 900;
        line-height: 1;

      .rise-caption {
        color: #F7F4EC;

      }
      .hero-image {
        width: 100%;
        height: 100%;

      }
      .card-tape {
        position: absolute;
        top: -14px;

        height: 36px;

        border: 1px dashed rgba(20, 20, 20, 0.4);

      }
      .card-stamp {

        font-weight: 700;
        letter-spacing: 1px;

        border-radius: 3px;
        z-index: 10;
      }

      /* Overlay: Icon Warning (Shot 2) */
      .warning-card {
        position: absolute;
        top: 1140px;
        right: 80px;
        background: #141414;
        border: 3px solid #FF6A1A;
        border-radius: 8px;
        padding: 12px 20px;
        box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        gap: 14px;
        z-index: 60;
        will-change: transform, opacity;
      }
      .warning-svg {
        width: 58px;
        height: 58px;
      }
      .warning-text {
        color: #F7F4EC;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 0.5px;
      }

      /* Overlay: Punch Phrase (Shot 2) */
      .punch-container {
        position: absolute;
        top: 1240px;
        left: 60px;
        width: 960px;
        background: #141414;
        border-left: 14px solid #FF6A1A;
        border-radius: 4px;
        padding: 22px 34px;
        box-shadow: 12px 12px 0px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
        gap: 6px;
        z-index: 60;
        will-change: transform, opacity;
      }
      .punch-label {
        color: #FF6A1A;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 2px;
      }
      .punch-heading {
        margin: 0;
        color: #F7F4EC;
        font-size: 64px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: -1px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s10"
      data-width="1080"
      data-height="1920"
      data-duration="5.79"
      data-start="0"
    >
      <!-- Base Spotlight & Grid Layer -->
      <div class="canvas-bg">
        <div class="grid-pattern"></div>
        <div class="spotlight-vignette"></div>
      </div>

      <!-- Top Archive Stamp -->
      <div class="doc-header-tag">
        <span class="doc-pill">HỒ SƠ ĐẦU CƠ</span>
        <span class="doc-sub">POP MART // CASE LABUBU</span>
      </div>

      <!-- ================= SHOT 1 CLIPS (0.00s - 3.19s) ================= -->
      <!-- Hero Video Clip: Top-level timed element with owned media lifecycle -->
      <video
        id="vid-01-media"
        class="clip hero-video"
        src="assets/vid-01-labubu-speculative-market-frenzy.mp4"
        data-start="0"
        data-duration="3.19"
        data-media-start="1.2"
        muted
        playsinline
      ></video>

      <!-- Strike Gavel Graphic -->
      <div id="gavel-strike" class="clip gavel-graphic" data-start="0" data-duration="0.8">
        <svg viewBox="0 0 300 300" width="300" height="300" fill="none">
          <!-- Shadow gavel -->
          <g transform="translate(14, 14)">
            <rect x="135" y="110" width="30" height="150" rx="6" fill="#ff7a1a" />
            <rect x="65" y="60" width="170" height="60" rx="8" fill="#ff7a1a" />
          </g>
          <!-- Main gavel -->
          <rect x="135" y="110" width="30" height="150" rx="6" fill="#141414" stroke="#FF6A1A" stroke-width="4" />
          <rect x="65" y="60" width="170" height="60" rx="8" fill="#141414" stroke="#FF6A1A" stroke-width="6" />
          <rect x="85" y="60" width="14" height="60" fill="#FF6A1A" />
          <rect x="200" y="60" width="14" height="60" fill="#FF6A1A" />
        </svg>
      </div>

      <!-- Strike Flash Overlay -->
      <div id="strike-flash" class="clip strike-flash" data-start="0" data-duration="0.5"></div>

      <!-- Overlay: Label (at 0.63s, hold 1.8s -> ends at 2.43s) -->
      <div id="label-inflation" class="clip badge-inflation" data-start="0.63" data-duration="1.8">
        <span class="badge-tag">PHÂN TÍCH TÀI SẢN</span>
        <span class="badge-title">CÔNG CỤ THỔI GIÁ</span>
      </div>

      <!-- Overlay: Icon Rise (at 1.68s, hold 1.5s -> ends at 3.18s) -->
      <div id="icon-rise-box" class="clip rise-card" data-start="1.68" data-duration="1.5">
        <svg class="rise-svg" viewBox="0 0 100 100" fill="none">
          <path
            id="rise-arrow-path"
            d="M 12 78 L 40 50 L 58 64 L 88 20"
            stroke="#FF6A1A"
            stroke-width="8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <polygon points="72,18 92,18 90,38" fill="#FF6A1A" />
        </svg>
        <div class="rise-info">
          <span class="rise-num">+800%</span>
          <span class="rise-caption">CƠN SỐT ẢO</span>
        </div>
      </div>

      <!-- ================= SHOT 2 CLIPS (3.19s - 5.79s) ================= -->
      <!-- Hero Cutout Photo Card -->
      <div id="shot-2-card" class="clip editorial-card" data-start="3.19" data-duration="2.6">
        <div class="card-tape"></div>
        <img
          id="img-02-media"
          class="hero-image"
          src="assets/img-02-labubu-speculative-market-craze.jpeg"
          alt="Labubu Speculative Market Craze"
        />
        <div class="card-stamp">CHỨNG CỨ SỐ 02 // TOÀ ÁN</div>
      </div>

      <!-- Overlay: Icon Warning (at 4.34s, hold 1.4s -> ends at 5.74s) -->
      <div id="icon-warning-box" class="clip warning-card" data-start="4.34" data-duration="1.4">
        <svg class="warning-svg" viewBox="0 0 100 100" fill="none">
          <path
            id="warning-triangle-path"
            d="M 50 14 L 90 82 L 10 82 Z"
            fill="#141414"
            stroke="#FF6A1A"
            stroke-width="7"
            stroke-linejoin="round"
          />
          <line x1="50" y1="38" x2="50" y2="60" stroke="#F7F4EC" stroke-width="7" stroke-linecap="round" />
          <circle cx="50" cy="72" r="4.5" fill="#F7F4EC" />

        <span class="warning-text">RỦI RO PHÁP LÝ</span>
      </div>

      <!-- Overlay: Punch Phrase (at 3.74s, hold 1.85s -> ends at 5.59s) -->
      <div id="punch-phrase-box" class="clip punch-container" data-start="3.74" data-duration="1.85">
        <span class="punch-label">KẾT LUẬN ĐIỀU TRA</span>
        <h1 class="punch-heading">ĐẾ CHẾ POP MART</h1>
      </div>

      <!-- Signature Orange Bar -->
      <div class="brand-bottom-bar"></div>
    </div>

    <script>
      // 1. Initialize Paused Root Timeline
      const tl = gsap.timeline({ paused: true });

      // Measure SVG path lengths for deterministic progressive drawing
      const risePath = document.getElementById("rise-arrow-path");
      if (risePath && typeof risePath.getTotalLength === "function") {
        const len = risePath.getTotalLength();
        risePath.style.strokeDasharray = len;
        risePath.style.strokeDashoffset = len;
      }
      const warnPath = document.getElementById("warning-triangle-path");
      if (warnPath && typeof warnPath.getTotalLength === "function") {
        const len = warnPath.getTotalLength();
        warnPath.style.strokeDasharray = len;
        warnPath.style.strokeDashoffset = len;
      }

      // ================= SHOT 1 CHOREOGRAPHY (0.00s - 3.19s) =================
      // Continuous Subtle Camera Zoom-in on the video element
      tl.set("#vid-01-media", { scale: 1.0, y: 0 }, 0);
      tl.to(
        "#vid-01-media",
        { scale: 1.06, duration: 3.19, ease: "none" },
        0
      );

      // Strike Transition: Gavel Strike Down + Flash
      tl.fromTo(
        "#gavel-strike",
        { y: -360, rotation: -42, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.22, ease: "power4.in" },
        0
      );
      tl.fromTo(
        "#strike-flash",
        { opacity: 0.85 },
        { opacity: 0, duration: 0.24, ease: "power2.out" },
        0.22
      );

      // Camera shake upon impact using single-target sequential to() calls (deterministic, no repeated fromTo baseline issues)
      tl.to("#vid-01-media", { y: -14, duration: 0.05, ease: "power1.in" }, 0.22);
      tl.to("#vid-01-media", { y: 10, duration: 0.05, ease: "power1.out" }, 0.27);
      tl.to("#vid-01-media", { y: -4, duration: 0.05, ease: "power1.in" }, 0.32);
      tl.to("#vid-01-media", { y: 0, duration: 0.06, ease: "power1.out" }, 0.37);

      // Gavel dissolves into the investigative video
      tl.to(
        "#gavel-strike",
        { opacity: 0, scale: 0.9, duration: 0.26, ease: "power2.out" },
        0.52
      );

      // Overlay 1: Label "CÔNG CỤ THỔI GIÁ" (at 0.63s, hold 1.8s -> ends at 2.43s)
      tl.fromTo(
        "#label-inflation",
        { y: 36, opacity: 0, scale: 0.92 },
        { y: 0, opacity: 1, scale: 1.0, duration: 0.38, ease: "power3.out" },
        0.63
      );
      tl.to(
        "#label-inflation",
        { y: -20, opacity: 0, duration: 0.28, ease: "power2.in" },
        2.43
      );

      // Overlay 2: Icon "rise" (at 1.68s, hold 1.5s -> ends at 3.18s)
      tl.fromTo(
        "#icon-rise-box",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.32, ease: "power3.out" },
        1.68
      );
      if (risePath && typeof risePath.getTotalLength === "function") {
        const rLen = risePath.getTotalLength();
        tl.fromTo(
          "#rise-arrow-path",
          { strokeDashoffset: rLen },
          { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
          1.74
        );
      }
      tl.to(
        "#icon-rise-box",
        { opacity: 0, scale: 0.94, duration: 0.24, ease: "power2.in" },
        2.94
      );

      // ================= SHOT 2 CHOREOGRAPHY (3.19s - 5.79s) =================
      // Punch Transition In at 3.19s on the editorial card
      tl.fromTo(
        "#shot-2-card",
        { scale: 1.08, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.34, ease: "power4.out" },
        3.19
      );

      // Overlay 1: Punch Phrase "ĐẾ CHẾ POP MART" (at 3.74s, hold 1.85s -> ends at 5.59s)
      tl.fromTo(
        "#punch-phrase-box",
        { scale: 1.22, opacity: 0, y: 30 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.36, ease: "power4.out" },
        3.74
      );
      tl.to(
        "#punch-phrase-box",
        { opacity: 0, y: -15, duration: 0.2, ease: "power2.in" },
        5.59
      );

      // Overlay 2: Icon "warning" (at 4.34s, hold 1.4s -> ends at 5.74s)
      // Smooth power3.out entrance consistent with investigative/serious tone
      tl.fromTo(
        "#icon-warning-box",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.32, ease: "power3.out" },
        4.34
      );
      if (warnPath && typeof warnPath.getTotalLength === "function") {
        const wLen = warnPath.getTotalLength();
        tl.fromTo(
          "#warning-triangle-path",
          { strokeDashoffset: wLen },
          { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
          4.40
        );
      }
      tl.to(
        "#icon-warning-box",
        { opacity: 0, scale: 0.95, duration: 0.18, ease: "power2.in" },
        5.61
      );

      // 2. Register Master Timeline
      window.__timelines["scene-s10"] = tl;
    </script>
  
    </template>
  </body>
