      /* Shot Container Layout (plain full-frame wrappers, timing driven by GSAP & timed media) */
      .shot-container {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      #shot-1 {
        z-index: 10;
      }

        border-radius: 10px;

      .tag-orange {

      /* Shot 2 Typography & Viral Explosion Overlays */
      .s2-top-block {

        margin-bottom: 12px;
        will-change: transform, opacity;
      }
      .s2-headline-banner {
        display: block;
        will-change: transform, opacity;
      }
      .s2-headline-text {
        margin: 0;
        font-size: 64px;
        font-weight: 900;
        line-height: 1.15;
        color: #141414;
        text-transform: uppercase;
        letter-spacing: -0.5px;
      }
      .s2-headline-accent {
        display: inline-block;
        background-color: #141414;
        color: #F7F4EC;
        padding: 4px 18px;
        border-radius: 8px;
        margin-left: 10px;
      }

      /* Viral Surge Pills on Shot 2 */
      #s2-bubble-1 {
        top: 1040px;
        left: 90px;
      }
      #s2-bubble-2 {
        top: 1120px;
        right: 90px;
      }
      #s2-bubble-3 {
        top: 1200px;
        left: 90px;
      }
      #s2-bubble-4 {
        top: 1280px;
        right: 90px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s09"
      data-width="1080"
      data-height="1920"
      data-duration="6.81"
    >
      <!-- Base Background Card Tone -->
      <div class="scene-bg" aria-hidden="true"></div>

      <!-- Procedural Film Grain Overlay -->
      <svg class="grain-overlay" aria-hidden="true" width="100%" height="100%">
        <filter id="noiseFilter">
          <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" />
          <feColorMatrix type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.08  0 0 0 0 0.08  0 0 0 0 0.18 0" />
        </filter>
        <rect width="100%" height="100%" filter="url(#noiseFilter)" style="mix-blend-mode: multiply;" />
      </svg>

      <!-- Permanent Bottom Orange Brand Bar -->
      <div class="bottom-orange-bar" aria-hidden="true"></div>

      <!-- ========================================================
           SHOT 1: S09-1 (0.0s -> 3.6s, duration: 3.6s)
           Asset: vid-07 (Key trend video, trim 1.0s to 4.6s)
           Plain container div without timing attributes (timing is owned
           directly by the <video data-start="0" data-duration="3.6"> element).
           Camera: Zoom-in. TransitionIn: Grow.
           ======================================================== -->
      <div id="shot-1" class="shot-container">
        <!-- Top Overlay Header -->
        <div class="s1-header-bar">
          <div id="s1-punch-phrase" class="s1-punch-badge">
            <h1 class="s1-punch-text">GIAI ĐOẠN 2023 - 2025</h1>
          </div>

          <div id="s1-clock-badge" class="s1-clock-card">
            <svg id="s1-clock-svg" width="44" height="44" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle id="clock-rim" cx="24" cy="24" r="20" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round" />
              <line id="clock-hour" x1="24" y1="24" x2="24" y2="13" stroke="#141414" stroke-width="4" stroke-linecap="round" />
              <line id="clock-minute" x1="24" y1="24" x2="33" y2="24" stroke="#141414" stroke-width="3.5" stroke-linecap="round" />

            <span class="clock-label">CAO TRÀO</span>
          </div>
        </div>

        <!-- Video Card Frame -->
        <div id="shot1-card" class="media-card">
          <div class="tape-accent" aria-hidden="true" data-layout-allow-overflow="true"></div>
          <div class="media-viewport" data-layout-allow-overflow="true">
            <video
              id="shot1-video"
              class="shot-media"
              src="assets/vid-07-viral-trend-keychain-hype.mp4"
              data-start="0"
              data-duration="3.6"
              data-media-start="1"
              data-layout-allow-overflow="true"
              muted
              playsinline
            ></video>
          </div>
        </div>

        <!-- Trend Stickers inside Shot 1 -->
        <div id="s1-tag-1" class="tag-badge tag-dark" style="top: 1230px; left: 90px;">

        </div>
        <div id="s1-tag-2" class="tag-badge tag-orange" style="top: 1310px; left: 90px;">

        </div>
      </div>

      <!-- ========================================================
           SHOT 2: S09-2 (3.6s -> 6.81s, duration: 3.21s)

           Plain container div without timing attributes (controlled via GSAP).
           Camera: Pan-right. TransitionIn: Punch.
           ======================================================== -->
      <div id="shot-2" class="shot-container">
        <!-- Top Editorial Titles -->
        <div class="s2-top-block">
          <div id="s2-label" class="s2-editorial-label">
            VƯỢT XA GIẢI TRÍ
          </div>
          <div id="s2-punch-phrase" class="s2-headline-banner">

        <!-- Hero Image Card Frame -->
        <div id="shot2-card" class="media-card" style="top: 360px; height: 1050px;">

          <div class="media-viewport" data-layout-allow-overflow="true">
            <img
              id="shot2-img"

              data-layout-allow-overflow="true"

          </div>

        <!-- Viral Explosion Hashtags & Bubbles -->
        <div id="s2-bubble-1" class="tag-badge tag-dark">
          #LÀN_SÓNG_MẠNG_XÃ_HỘI
        </div>
        <div id="s2-bubble-2" class="tag-badge tag-orange">

        </div>
        <div id="s2-bubble-3" class="tag-badge tag-cream">

    <!-- GSAP Seekable Deterministic Orchestration -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // Setup SVG Clock Stroke Geometry
      const clockRim = document.getElementById("clock-rim");
      const clockHour = document.getElementById("clock-hour");
      const clockMinute = document.getElementById("clock-minute");
      if (clockRim && clockHour && clockMinute) {
        const rimLength = clockRim.getTotalLength();
        clockRim.style.strokeDasharray = rimLength;
        clockRim.style.strokeDashoffset = rimLength;

        const hourLength = clockHour.getTotalLength();
        clockHour.style.strokeDasharray = hourLength;
        clockHour.style.strokeDashoffset = hourLength;

        const minuteLength = clockMinute.getTotalLength();
        clockMinute.style.strokeDasharray = minuteLength;
        clockMinute.style.strokeDashoffset = minuteLength;
      }

      /* ========================================================
         SHOT 1 ANIMATIONS (0.0s - 3.6s)
         ======================================================== */
      // Card TransitionIn: Grow from 0.65 to 1.0 with smooth settle
      tl.fromTo(
        "#shot1-card",
        { scale: 0.65, opacity: 0, y: 40 },
        { scale: 1, opacity: 1, y: 0, duration: 0.65, ease: "power3.out" },
        0.05
      );

      // Camera motion: Continuous zoom-in on video
      tl.fromTo(
        "#shot1-video",
        { scale: 1.0 },
        { scale: 1.12, duration: 3.5, ease: "sine.inOut" },
        0.05
      );

      // Punch Phrase: GIAI ĐOẠN 2023 - 2025 (atMs: 58840 -> offset 0.64s, holdMs: 1800)
      tl.fromTo(
        "#s1-punch-phrase",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.64
      );
      tl.to(
        "#s1-punch-phrase",
        { opacity: 0, duration: 0.35, ease: "power2.in" },
        2.44
      );

      // Icon Clock: (atMs: 59480 -> offset 1.28s, holdMs: 1500)
      tl.fromTo(
        "#s1-clock-badge",
        { scale: 0.7, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        1.28
      );
      if (clockRim && clockHour && clockMinute) {
        tl.to("#clock-rim", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 1.35);
        tl.to("#clock-hour", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 1.55);
        tl.to("#clock-minute", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 1.65);
      }
      tl.to(
        "#s1-clock-badge",
        { opacity: 0, duration: 0.3, ease: "power2.in" },
        2.78
      );

      // Shot 1 Trend Stickers Entrance
      tl.fromTo(
        "#s1-tag-1",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        1.1
      );
      tl.fromTo(
        "#s1-tag-2",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        1.5
      );

      // Shot 1 Child Elements Outro Fade (before 3.6s scene transition)
      tl.to(
        ["#shot1-card", "#s1-tag-1", "#s1-tag-2"],
        { opacity: 0, duration: 0.25, ease: "power2.in" },
        3.35
      );

      /* ========================================================
         SHOT 1 -> SHOT 2 TRANSITION AT 3.6s
         ======================================================== */
      tl.set("#shot-1", { opacity: 0 }, 3.6);
      tl.set("#shot-2", { opacity: 1 }, 3.6);

      /* ========================================================
         SHOT 2 ANIMATIONS (3.6s - 6.81s)
         ======================================================== */
      // TransitionIn: Punch (sudden slam entrance 1.14 -> 1.0)
      tl.fromTo(
        "#shot2-card",
        { scale: 1.14, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power4.out" },
        3.6
      );

      // Camera motion: pan-right + subtle drift on hero image
      tl.fromTo(
        "#shot2-img",
        { x: -30, scale: 1.06 },
        { x: 25, scale: 1.06, duration: 3.2, ease: "sine.inOut" },
        3.6
      );

      // Label: VƯỢT XA GIẢI TRÍ (starts at 4.0s, exits at 4.85s -> completely gone by 5.1s before punch phrase enters)
      tl.fromTo(
        "#s2-label",
        { x: -40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.38, ease: "power3.out" },
        4.0
      );
      tl.to(
        "#s2-label",
        { opacity: 0, duration: 0.25, ease: "power2.in" },
        4.85
      );

      // Punch Phrase: LÀN SÓNG VĂN HÓA (atMs: 63410 -> offset 5.21s)
      tl.fromTo(
        "#s2-punch-phrase",
        { scale: 0.88, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        5.21
      );

      // Viral Surge Bubbles: Multiplying outward to visualize the cultural wave
      tl.fromTo(
        "#s2-bubble-1",
        { scale: 0, opacity: 0, x: -30 },
        { scale: 1, opacity: 1, x: 0, duration: 0.42, ease: "power3.out" },
        4.25
      );
      tl.fromTo(
        "#s2-bubble-2",
        { scale: 0, opacity: 0, x: 30 },
        { scale: 1, opacity: 1, x: 0, duration: 0.42, ease: "power3.out" },
        4.60
      );
      tl.fromTo(
        "#s2-bubble-3",
        { scale: 0, opacity: 0, x: -30 },
        { scale: 1, opacity: 1, x: 0, duration: 0.42, ease: "power3.out" },
        4.95
      );
      tl.fromTo(
        "#s2-bubble-4",
        { scale: 0, opacity: 0, x: 30 },
        { scale: 1, opacity: 1, x: 0, duration: 0.42, ease: "power3.out" },
        5.30
      );

      // Register the seekable paused timeline with HyperFrames
      window.__timelines["scene-s09"] = tl;
    </script>
  
    </template>
  </body>
