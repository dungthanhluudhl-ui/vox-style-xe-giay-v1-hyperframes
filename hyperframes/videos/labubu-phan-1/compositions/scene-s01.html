<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Base layout convention - inset: 0 without rigid px override */
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Global Background Elements */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-color: #e7e3d9;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        z-index: 1;
      }

      .bg-grain {
        position: absolute;
        inset: 0;
        opacity: 0.18;
        mix-blend-mode: multiply;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        z-index: 50;
      }

      /* Fixed Signature Bottom Orange Bar */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 16px;
        background: #ff6a1a;
        z-index: 100;
      }

      /* Video Element (no .clip class, sized directly via CSS) */
      #vid-04 {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        z-index: 2;
        transform-origin: 50% 50%;
      }

      /* Shot 1 UI Overlays Layer */
      #shot-1-ui {
        z-index: 10;
        pointer-events: none;
      }

      .shot-overlay-card {
        position: absolute;
        top: 240px;
        left: 80px;
        background: #141414;
        border-radius: 14px;
        border-left: 8px solid #ff6a1a;
        padding: 18px 30px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
      }

      .badge-tag {
        font-size: 20px;
        font-weight: 900;
        color: #ff6a1a;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .badge-title {
        font-size: 40px;
        font-weight: 900;
        color: #f7f4ec;
        text-transform: uppercase;
        letter-spacing: 1px;
        line-height: 1.2;
      }

      .shot-overlay-icon {
        position: absolute;
        top: 240px;
        left: 560px;
        width: 92px;
        height: 92px;
        background: #141414;
        border-radius: 14px;
        border: 2px solid rgba(255, 106, 26, 0.6);
        display: grid;
        place-items: center;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
      }

      .svg-fall {
        width: 56px;
        height: 56px;
      }

      /* Shot 2 Structure */
      #shot-2 {
        z-index: 3;
      }

      .shot-2-cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }

      .hero-cutout-wrap {
        position: absolute;
        top: 250px;
        left: 120px;
        width: 840px;
        height: 960px;
        display: flex;
        justify-content: center;
        align-items: center;
        transform-origin: 50% 50%;
        z-index: 5;
      }

      .hero-cutout-inner {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        transform-origin: 50% 80%;
      }

      .hero-img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
        filter: drop-shadow(0 20px 30px rgba(20, 20, 20, 0.3));
      }

      /* Punch Phrase Container */
      .punch-box {
        position: absolute;
        bottom: 440px;
        left: 80px;
        right: 80px;
        background: #141414;
        border-radius: 18px;
        border: 3px solid #ff6a1a;
        padding: 26px 36px;
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5);
        z-index: 20;
        transform-origin: 50% 50%;
      }

      .punch-eyebrow {
        font-size: 24px;
        font-weight: 900;
        color: #ff6a1a;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .punch-text-row {
        display: flex;
        align-items: baseline;
        gap: 16px;
        flex-wrap: wrap;
      }

      .punch-primary {
        font-size: 64px;
        font-weight: 900;
        color: #f7f4ec;
        letter-spacing: 1px;
        line-height: 1.15;
      }

      .punch-accent {
        font-size: 72px;
        font-weight: 900;
        color: #ff6a1a;
        letter-spacing: 2px;
        line-height: 1.15;
      }

      .question-badge {
        position: absolute;
        top: 24px;
        right: 32px;
        width: 64px;
        height: 80px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s01"
      data-width="1080"
      data-height="1920"
      data-duration="7.12"
    >
      <!-- Persistent Canvas Grid & Paper Grain -->
      <div class="bg-grid"></div>
      <div class="bg-grain"></div>

      <!-- Shot 1: Video clip (no data-start on root, avoiding nested timed element) -->
      <video
        id="vid-04"
        src="assets/vid-04-victim-fomo-luxury-cutout.mp4"
        data-start="0"
        data-duration="3.6"
        data-media-start="0.5"
        muted
        playsinline
      ></video>

      <!-- Shot 1: Overlays UI layer (0.0s to 3.6s) -->
      <div id="shot-1-ui" class="clip" data-start="0" data-duration="3.6">
        <!-- Label Overlay -->
        <div id="shot-1-label" class="shot-overlay-card">
          <div class="badge-tag">CHỦ ĐỀ</div>
          <div class="badge-title">HÀNG HIỆU SA SÚT</div>
        </div>

        <!-- Self-drawing Fall Icon -->
        <div id="shot-1-icon" class="shot-overlay-icon">
          <svg viewBox="0 0 80 80" class="svg-fall">
            <path
              id="path-fall-line"
              d="M 14 20 L 38 44 L 48 34 L 66 58"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              id="path-fall-arrow1"
              d="M 50 58 L 66 58"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="6"
              stroke-linecap="round"
            />
            <path
              id="path-fall-arrow2"
              d="M 66 42 L 66 58"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="6"
              stroke-linecap="round"
            />
          </svg>
        </div>
      </div>

      <!-- Shot 2: Hero cutout collage (3.6s to 7.12s) -->
      <section id="shot-2" class="clip" data-start="3.6" data-duration="3.52">
        <div id="shot-2-cam" class="shot-2-cam">
          <div id="hero-cutout-wrap" class="hero-cutout-wrap">
            <div id="hero-cutout-inner" class="hero-cutout-inner">
              <img
                id="img-04"
                src="assets/img-04-fomo-luxury-goods-cutout-concept.jpeg"
                alt="FOMO Luxury Goods Cutout"
                class="hero-img"
              />
            </div>
          </div>

          <!-- Punch Phrase Container -->
          <div id="punch-container" class="punch-box">
            <div class="punch-eyebrow">HIỆU ỨNG ĐÁM ĐÔNG</div>
            <div class="punch-text-row">
              <span class="punch-primary">BẪY TÂM LÝ</span>
              <span class="punch-accent">FOMO</span>
            </div>

            <!-- Self-drawing Question Mark Icon -->
            <div id="question-icon" class="question-badge">
              <svg viewBox="0 0 64 80" width="64" height="80">
                <path
                  id="path-question-hook"
                  d="M 14 26 C 14 10, 48 10, 48 26 C 48 38, 32 44, 32 54"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="7"
                  stroke-linecap="round"
                />
                <circle id="dot-question" cx="32" cy="70" r="5" fill="#FF6A1A" />
              </svg>
            </div>
          </div>
        </div>
      </section>

      <!-- Fixed Signature Bottom Orange Bar -->
      <div id="brand-bottom-bar"></div>
    </div>

    <script>
      // Prepare SVG path lengths for deterministic progressive stroke draw
      const pathFallLine = document.querySelector("#path-fall-line");
      const pathFallArrow1 = document.querySelector("#path-fall-arrow1");
      const pathFallArrow2 = document.querySelector("#path-fall-arrow2");
      const pathQuestionHook = document.querySelector("#path-question-hook");

      [pathFallLine, pathFallArrow1, pathFallArrow2, pathQuestionHook].forEach((p) => {
        if (p) {
          const len = p.getTotalLength();
          p.style.strokeDasharray = len + "";
          p.style.strokeDashoffset = len + "";
        }
      });

      // Construct single paused timeline registered to data-composition-id
      const tl = gsap.timeline({ paused: true });

      // ==========================================
      // SHOT 1 CHOREOGRAPHY (0.0s - 3.6s)
      // ==========================================

      // Entrance: rise transition for video
      tl.fromTo(
        "#vid-04",
        { y: 50, opacity: 0, scale: 1.0 },
        { y: 0, opacity: 1, scale: 1.02, duration: 0.55, ease: "power3.out" },
        0
      );

      // Continuous subtle camera zoom-in across Shot 1
      tl.to("#vid-04", { scale: 1.08, duration: 3.05, ease: "none" }, 0.55);

      // Label: "HÀNG HIỆU SA SÚT" appears at 0.84s, holds 1.8s (fades at 2.64s)
      tl.fromTo(
        "#shot-1-label",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        0.84
      );
      tl.to("#shot-1-label", { y: -15, opacity: 0, duration: 0.25, ease: "power2.in" }, 2.64);

      // Icon: "fall" draws at 1.20s, holds 1.6s (fades at 2.80s)
      tl.fromTo(
        "#shot-1-icon",
        { scale: 0.8, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.25, ease: "power3.out" },
        1.15
      );
      tl.to("#path-fall-line", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.2);
      tl.to(
        ["#path-fall-arrow1", "#path-fall-arrow2"],
        { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
        1.5
      );
      tl.to("#shot-1-icon", { opacity: 0, duration: 0.25, ease: "power2.in" }, 2.8);

      // ==========================================
      // SHOT 2 CHOREOGRAPHY (3.6s - 7.12s)
      // ==========================================

      // Transition In: punch snap at 3.6s
      tl.fromTo(
        "#shot-2-cam",
        { scale: 1.12, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.42, ease: "power4.out" },
        3.6
      );

      // Ken Burns slow zoom on hero cutout
      tl.fromTo(
        "#hero-cutout-wrap",
        { scale: 1.0 },
        { scale: 1.06, duration: 3.52, ease: "none" },
        3.6
      );

      // Deterministic, continuous idle sway (starts at 0, tilts smoothly, returns cleanly to 0)
      tl.to("#hero-cutout-inner", { rotation: 1.5, duration: 0.88, ease: "sine.inOut" }, 3.6);
      tl.to("#hero-cutout-inner", { rotation: -1.5, duration: 1.76, ease: "sine.inOut" }, 4.48);
      tl.to("#hero-cutout-inner", { rotation: 0, duration: 0.88, ease: "sine.inOut" }, 6.24);

      // Punch Phrase: "BẪY TÂM LÝ FOMO" pops at 5.2s, holds to end of scene
      tl.fromTo(
        "#punch-container",
        { scale: 0.86, opacity: 0, y: 35 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        5.2
      );

      // Icon: "question" hook draw + centered dot pop at 5.6s
      tl.to("#path-question-hook", { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" }, 5.6);
      tl.fromTo(
        "#dot-question",
        { scale: 0, opacity: 0, transformOrigin: "32px 70px" },
        { scale: 1.0, opacity: 1, duration: 0.2, ease: "power3.out" },
        5.9
      );

      // Register timeline for seekable deterministic rendering
      window.__timelines["scene-s01"] = tl;
    </script>
  
    </template>
  </body>
</html>
