<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Fixed Brand Signature Bottom Bar */
    #bottom-accent-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Media Layer: Toàn khung, phân tách rõ ràng các rig chuyển động */
    #media-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
    }

    /* Rig 1: Continuous slow camera zoom-in */
    #camera-rig {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    /* Rig 2: Entrance Punch snap */
    #punch-rig {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    /* Rig 3: Hiệu ứng rung dập con dấu đỏ dứt khoát */
    #stamp-rig {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    #hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Overlay 1: Icon "doc" (vẽ nét SVG theo chuẩn Style DNA) */
    #doc-clip {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
    }

    #doc-badge {
      position: absolute;
      top: 240px;
      left: 80px;
      width: 96px;
      height: 96px;
      border-radius: 12px;
      border: 3.5px solid #141414;
      box-shadow: 6px 8px 0px rgba(20, 20, 20, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform, opacity;
    }

    .doc-icon-svg {
      width: 52px;
      height: 52px;
      display: block;
    }

    .doc-icon-svg path {
      fill: none;
      stroke: #141414;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Overlay 2: Punch-phrase "KÝ DUYỆT 83 BỘ" */
    #punch-clip {
      position: absolute;
      inset: 0;
      z-index: 50;
      pointer-events: none;
    }

    #punch-container {
      position: absolute;
      top: 920px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      will-change: transform, opacity;
    }

    .punch-plate {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 22px 44px;
      border-radius: 10px;
      border: 4px solid #141414;
      box-shadow: 10px 14px 0px rgba(20, 20, 20, 0.95);
      white-space: nowrap;
    }

    .punch-prefix {
      font-size: 62px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
    }

    .punch-highlight {
      font-size: 62px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
      padding: 10px 24px;
      border-radius: 6px;
      display: inline-block;
      will-change: transform;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s28"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="9.16"
  >
    <!-- Background Media: Hiển thị full khung, phân cấp zoom camera, punch entrance và lực dập dấu -->
    <div
      id="media-layer"
      class="clip"
      data-start="0"
      data-duration="9.16"
    >
      <div id="camera-rig">
        <div id="punch-rig">
          <div id="stamp-rig">
            <img
              id="hero-image"
              src="assets/img-11-corrupt-official-rubber-stamping.jpg"
              alt="Cán bộ ngồi dập dấu phê duyệt hồ sơ"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Overlay 1: Icon "doc" (atMs: 250480 -> relative 1.64s, holdMs: 2200 -> 2.2s) -->
    <div
      id="doc-clip"
      class="clip"
      data-start="1.64"
      data-duration="2.2"
    >
      <div id="doc-badge" class="hf-plate-paper">
        <svg class="doc-icon-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <path class="doc-path" d="M16 8 H38 L48 18 V56 H16 Z" />
          <path class="doc-path" d="M38 8 V18 H48" />
          <path class="doc-path" d="M24 28 H40" />
          <path class="doc-path" d="M24 36 H40" />
          <path class="doc-path" d="M24 44 H34" />
        </svg>
      </div>
    </div>

    <!-- Overlay 2: Punch-phrase "KÝ DUYỆT 83 BỘ" (atMs: 253390 -> relative 4.55s, holdMs: 3200 -> 3.2s) -->
    <div
      id="punch-clip"
      class="clip"
      data-start="4.55"
      data-duration="3.2"
    >
      <div id="punch-container">
        <div class="punch-plate hf-plate-ink">
          <span class="punch-prefix hf-text-light">KÝ DUYỆT</span>
          <span class="punch-highlight hf-hl-orange">83 BỘ</span>
        </div>
      </div>
    </div>

    <!-- Fixed Brand Signature Accent Bar -->
    <div id="bottom-accent-bar" data-layout-ignore="true"></div>
  </div>

  <script>
    // Chuẩn bị stroke-dasharray/offset để tự vẽ nét icon document SVG
    const docPaths = document.querySelectorAll(".doc-path");
    docPaths.forEach((path) => {
      const len = path.getTotalLength();
      path.style.strokeDasharray = (len + 1) + "";
      path.style.strokeDashoffset = (len + 1) + "";
    });

    // Root paused timeline (Hợp đồng HyperFrames bắt buộc)
    const tl = gsap.timeline({ paused: true });

    // 1. Photo Punch entrance (t = 0)
    tl.fromTo(
      "#punch-rig",
      { scale: 1.15, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.45, ease: "power4.out" },
      0
    );

    // Continuous slow camera zoom-in qua toàn cảnh (scale 1.05 -> 1.12)
    tl.fromTo(
      "#camera-rig",
      { scale: 1.05 },
      { scale: 1.12, duration: 9.16, ease: "none" },
      0
    );

    // 2. Stamp Rig: Hiệu ứng lực dập con dấu đỏ dứt khoát trên xấp tài liệu (thump impacts tất định)
    const stampTimes = [0.9, 1.8, 2.7, 4.2, 5.5, 6.8, 8.0];
    stampTimes.forEach((t) => {
      tl.fromTo("#stamp-rig", { y: 0 }, { y: 12, duration: 0.05, ease: "power2.out" }, t);
      tl.fromTo("#stamp-rig", { y: 12 }, { y: 0, duration: 0.12, ease: "power3.out" }, t + 0.05);
    });

    // 3. Overlay 1: Icon "doc" entrance (t = 1.64s)
    tl.fromTo(
      "#doc-badge",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      1.64
    );

    // Tự vẽ nét icon document SVG
    docPaths.forEach((path, idx) => {
      const len = path.getTotalLength();
      tl.fromTo(
        path,
        { strokeDashoffset: len + 1 },
        { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" },
        1.75 + idx * 0.06
      );
    });

    // Icon doc fade-out êm ái trước khi clip kết thúc tại 3.84s
    tl.fromTo(
      "#doc-badge",
      { opacity: 1, scale: 1 },
      { opacity: 0, scale: 0.85, duration: 0.25, ease: "power2.in" },
      3.55
    );

    // 4. Overlay 2: Punch Phrase entrance "KÝ DUYỆT 83 BỘ" (t = 4.55s)
    tl.fromTo(
      "#punch-container",
      { scale: 0.75, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power4.out" },
      4.55
    );

    // Nhấn mạnh cụm highlight "83 BỘ" bằng scale pulse tất định
    tl.fromTo(
      ".punch-highlight",
      { scale: 1 },
      { scale: 1.1, duration: 0.16, ease: "power2.out" },
      4.95
    );
    tl.fromTo(
      ".punch-highlight",
      { scale: 1.1 },
      { scale: 1, duration: 0.16, ease: "power2.in" },
      5.11
    );

    // Punch phrase fade-out êm ái trước khi clip kết thúc tại 7.75s
    tl.fromTo(
      "#punch-container",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -15, duration: 0.25, ease: "power2.in" },
      7.45
    );

    // Đăng ký timeline chính thức cho HyperFrames
    window.__timelines["scene-s28"] = tl;
  </script>

    </template>
  </body>
</html>
