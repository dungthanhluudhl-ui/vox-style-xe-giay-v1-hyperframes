<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      h1, h2, h3, p {
        margin: 0;
      }
      body {
        margin: 0;
        padding: 0;
        background: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }

      /* Quy ước clip full-frame chuẩn HyperFrames (inset: 0, không set width/height px) */
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Nền lưới 84px chuẩn Style DNA đặt phía dưới ảnh */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        pointer-events: none;
        z-index: 0;
      }

      /* Khung chứa ảnh tư liệu phiên toà - Giữ nguyên màu gốc không áp filter hay vignette */
      .photo-wrapper {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
      }
      .court-photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Dải nhận diện chữ ký thương hiệu cố định mép dưới */
      #bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 12px;
        background: #FF6A1A;
        z-index: 100;
      }

      /* Nhãn sự kiện phiên toà (Top safe band: Y = 200px) */
      .header-badge {
        position: absolute;
        top: 200px;
        left: 60px;
        z-index: 10;
        display: flex;
        align-items: center;
        background: #141414;
        border-left: 8px solid #FF6A1A;
        padding: 16px 28px;
        border-radius: 4px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      .header-badge-text {
        font-size: 30px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #F7F4EC;
        margin: 0;
      }

      /* Thẻ phán quyết punch-phrase thống nhất một khối (Mid-lower band: Y = 1140px, cách caption zone > 260px) */
      .verdict-card {
        position: absolute;
        top: 1140px;
        left: 60px;
        width: 960px;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #141414;
        border-left: 10px solid #FF6A1A;
        border-radius: 8px;
        padding: 24px 32px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      }
      .verdict-text {
        font-size: 64px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: 2px;
        color: #F7F4EC;
        text-transform: uppercase;
        margin: 0;
        text-align: center;
        white-space: nowrap;
      }
      .verdict-orange {
        color: #FF6A1A;
      }

      /* Badge biểu tượng cán cân công lý (Shot 2) - Căn giữa chuẩn bằng left: 380px, width: 320px */
      .scale-badge {
        position: absolute;
        top: 180px;
        left: 380px;
        width: 320px;
        z-index: 10;
        background: #141414;
        border: 4px solid #FF6A1A;
        border-radius: 12px;
        padding: 18px 16px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      }
      .scale-badge-label {
        margin-top: 10px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #F7F4EC;
      }
    </style>

    <!-- Composition Root: 1080x1920 @ 30fps, Scene S37 tổng thời lượng 11 giây -->
    <div
      id="root"
      data-composition-id="scene-s37"
      data-width="1080"
      data-height="1920"
      data-duration="11"
    >
      <!-- Nền lưới toạ độ đặt phía sau ảnh -->
      <div class="bg-grid"></div>

      <!-- SHOT 1: Tuyên án sơ thẩm Minh Hùng (0.00s -> 5.27s) -->
      <section id="shot-1" class="clip" data-start="0" data-duration="5.27">
        <!-- Khung ảnh zoom cận bục xét xử bên trái - Nguyên màu gốc -->
        <div class="photo-wrapper">
          <img
            id="photo-s37-1"
            class="court-photo"
            src="assets/img-13-courtroom-sentencing-defendants-verdict.jpg"
            alt="Phiên toà xét xử sơ thẩm - Minh Hùng"
            data-layout-allow-overflow="true"
          />
        </div>

        <!-- Nhãn sự kiện: XÉT XỬ SƠ THẨM 2023 (xuất hiện tại 2.46s) -->
        <div id="label-s37-1" class="header-badge" style="opacity: 0;">
          <h2 class="header-badge-text">XÉT XỬ SƠ THẨM 2023</h2>
        </div>

        <!-- Punch phrase chuẩn theo shotlist: MINH HÙNG: 7 NĂM TÙ (xuất hiện tại 3.60s) -->
        <div id="verdict-card-1" class="verdict-card" style="opacity: 0;">
          <h1 class="verdict-text">MINH HÙNG: <span class="verdict-orange">7 NĂM TÙ</span></h1>
        </div>
      </section>

      <!-- SHOT 2: Tuyên án Phó phòng tín dụng Hồng Hải (5.27s -> 11.00s) -->
      <section id="shot-2" class="clip" data-start="5.27" data-duration="5.73">
        <!-- Khung ảnh chuyển pan sang bục xét xử bên phải - Nguyên màu gốc -->
        <div class="photo-wrapper">
          <img
            id="photo-s37-2"
            class="court-photo"
            src="assets/img-13-courtroom-sentencing-defendants-verdict.jpg"
            alt="Phiên toà xét xử sơ thẩm - Hồng Hải"
            data-layout-allow-overflow="true"
          />
        </div>

        <!-- Biểu tượng cán cân công lý tự vẽ (Scale Icon) tại 7.44s -->
        <div id="scale-badge" class="scale-badge" style="opacity: 0;">
          <svg id="scale-icon" viewBox="0 0 160 130" width="160" height="130" fill="none">
            <!-- Trụ đứng và chân đế -->
            <line class="scale-stroke" x1="45" y1="122" x2="115" y2="122" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" />
            <line class="scale-stroke" x1="80" y1="18" x2="80" y2="122" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" />
            <circle cx="80" cy="18" r="5" fill="#FF6A1A" />
            <!-- Cụm đòn cân và 2 đĩa cân -->
            <g id="scale-beam-group">
              <line class="scale-stroke" x1="22" y1="32" x2="138" y2="32" stroke="#FF6A1A" stroke-width="5" stroke-linecap="round" />
              <!-- Đĩa cân trái -->
              <path class="scale-stroke" d="M 32 32 L 20 70 M 32 32 L 44 70" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
              <path class="scale-stroke" d="M 14 70 Q 32 86 50 70 Z" stroke="#FF6A1A" stroke-width="3" fill="#141414" stroke-linejoin="round" />
              <!-- Đĩa cân phải -->
              <path class="scale-stroke" d="M 128 32 L 116 70 M 128 32 L 140 70" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
              <path class="scale-stroke" d="M 110 70 Q 128 86 146 70 Z" stroke="#FF6A1A" stroke-width="3" fill="#141414" stroke-linejoin="round" />
              <!-- Tâm xoay cán cân -->
              <circle cx="80" cy="32" r="5" fill="#F7F4EC" />
            </g>
          </svg>
          <div class="scale-badge-label">CÁN CÂN CÔNG LÝ</div>
        </div>

        <!-- Punch phrase chuẩn theo shotlist: HỒNG HẢI: 3 NĂM TÙ (xuất hiện tại 5.42s) -->
        <div id="verdict-card-2" class="verdict-card" style="opacity: 0;">
          <h1 class="verdict-text">HỒNG HẢI: <span class="verdict-orange">3 NĂM TÙ</span></h1>
        </div>
      </section>

      <!-- Dải cam đáy khung hình - Chữ ký thị giác nhận diện xuyên suốt -->
      <div id="bottom-brand-bar"></div>
    </div>

    <!-- GSAP Animation Choreography -->
    <script>
      // 1. Chuẩn bị hiệu ứng nét vẽ SVG tự vẽ dần cho icon Scale
      const scaleStrokes = document.querySelectorAll(".scale-stroke");
      scaleStrokes.forEach((el) => {
        let len = 120;
        try {
          if (el.getTotalLength) {
            const measured = el.getTotalLength();
            if (measured > 0) len = measured;
          }
        } catch (e) {}
        el.style.strokeDasharray = `${Math.ceil(len)}`;
        el.style.strokeDashoffset = `${Math.ceil(len)}`;
      });

      // 2. Thiết lập transformOrigin trên GSAP (tránh xung đột với CSS inline)
      gsap.set("#photo-s37-1", { transformOrigin: "28% 45%" });
      gsap.set("#photo-s37-2", { transformOrigin: "72% 45%" });

      // 3. Khởi tạo duy nhất 1 paused timeline trên window.__timelines["scene-s37"]
      const tl = gsap.timeline({ paused: true });

      // ================= SHOT 1 (0.00s -> 5.27s) =================
      // Entrance "strike" tác động dứt khoát của phiên toà sơ thẩm
      tl.fromTo(
        "#photo-s37-1",
        { scale: 1.40, y: -20 },
        { scale: 1.25, y: 0, duration: 0.45, ease: "power4.out" },
        0
      );
      // Zoom-in chậm rãi tiếp tục trong Shot 1
      tl.to(
        "#photo-s37-1",
        { scale: 1.33, duration: 4.82, ease: "none" },
        0.45
      );

      // Label "XÉT XỬ SƠ THẨM 2023" xuất hiện lúc 2.46s (324460ms)
      tl.fromTo(
        "#label-s37-1",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        2.46
      );

      // Punch phrase "MINH HÙNG: 7 NĂM TÙ" giáng xuống lúc 3.60s (giữ vững đến hết Shot 1 = 1.67s)
      tl.fromTo(
        "#verdict-card-1",
        { scale: 1.18, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power4.out" },
        3.60
      );

      // ================= SHOT 2 (5.27s -> 11.00s) =================
      // Cú cut sang góc nhìn bị cáo thứ hai (Hồng Hải) lúc 5.27s
      // Pan-right chậm và tinh tế
      tl.fromTo(
        "#photo-s37-2",
        { scale: 1.26, x: -15 },
        { scale: 1.33, x: 15, duration: 5.73, ease: "sine.out", immediateRender: false },
        5.27
      );

      // Punch phrase "HỒNG HẢI: 3 NĂM TÙ" giáng xuống lúc 5.42s (327420ms)
      tl.fromTo(
        "#verdict-card-2",
        { scale: 1.18, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power4.out", immediateRender: false },
        5.42
      );

      // Biểu tượng cán cân công lý (Scale Icon) xuất hiện lúc 7.44s (329440ms)
      tl.fromTo(
        "#scale-badge",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out", immediateRender: false },
        7.44
      );

      // Từng nét của cán cân công lý tự vẽ dần
      tl.to(
        ".scale-stroke",
        { strokeDashoffset: 0, duration: 0.75, stagger: 0.08, ease: "power2.out" },
        7.55
      );

      // Cán cân nghiêng nhẹ thể hiện sức nặng của phán quyết bản án
      tl.to(
        "#scale-beam-group",
        { rotation: -5, transformOrigin: "80px 32px", duration: 0.6, ease: "power2.out" },
        8.35
      );

      // Đăng ký timeline cho HyperFrames runtime seek frame-by-frame
      window.__timelines["scene-s37"] = tl;
    </script>
  
    </template>
  </body>
</html>
