<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      width: 1080px;
      height: 1920px;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Quy ước layout chuẩn của HyperFrames */
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Lưới toạ độ nền Vox: ô 84px, nét kẻ rgba(20,20,20,0.32) */
    .grid-background {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      z-index: 1;
    }

    /* Lớp hình ảnh nền toàn khung: img-19 không đóng khung, không đổ bóng giả */
    .bg-photo-wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 2;
    }

    #photo-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform-origin: 50% 50%;
    }

    /* Thanh cam nhận diện thương hiệu cố định mép đáy */
    .brand-bottom-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 14px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Punch phrase overlay đặt trên tấm nền mực đặc */
    .punch-container {
      position: absolute;
      top: 180px;
      left: 0;
      width: 1080px;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 30;
    }

    #punch-plate {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #141414;
      padding: 16px 40px 22px;
      border-radius: 6px;
      border: 2px solid #141414;
      box-shadow: 8px 8px 0px #FF6A1A;
      opacity: 0;
    }

    .punch-badge {
      background-color: #FF6A1A;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 2px;
      padding: 4px 14px;
      border-radius: 4px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .punch-text {
      color: #F7F4EC;
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 64px;
      line-height: 1.25;
      letter-spacing: -1px;
      text-align: center;
      white-space: nowrap;
    }

    /* Warning callout overlay đặt phía trên vùng an toàn phụ đề */
    .warning-container {
      position: absolute;
      top: 1200px;
      left: 0;
      width: 1080px;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 40;
    }

    #warning-badge {
      display: flex;
      align-items: center;
      gap: 16px;
      background-color: #141414;
      padding: 14px 28px;
      border-radius: 8px;
      border: 2px solid #FF6A1A;
      box-shadow: 8px 8px 0px #141414;
      opacity: 0;
    }

    .warning-icon {
      display: block;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .warning-label {
      color: #F7F4EC;
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s11"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="7.87"
  >
    <!-- Clip chính bao trọn thời lượng phân cảnh S11 -->
    <div id="shot-s11" class="clip" data-start="0" data-duration="7.87">
      <!-- Nền lưới toạ độ Vox -->
      <div class="grid-background"></div>

      <!-- Lớp ảnh nền toàn khung không đổ bóng giả -->
      <div id="bg-photo-layer" class="bg-photo-wrapper">
        <img
          id="photo-img"
          src="assets/img-19-canceled-motorbike-auction-asset.jpg"
          alt="Xe máy cub bị dán nhãn bán đấu giá"
        />
      </div>

      <!-- Punch phrase: BÁN XE GỬI NHỜ -->
      <div class="punch-container">
        <div id="punch-plate">
          <div class="punch-badge">PHÉP ẨN DỤ</div>
          <div class="punch-text">BÁN XE GỬI NHỜ</div>
        </div>
      </div>

      <!-- Warning callout: Biểu tượng cảnh báo vẽ nét -->
      <div class="warning-container">
        <div id="warning-badge">
          <svg class="warning-icon" viewBox="0 0 48 48">
            <path
              id="warn-triangle"
              d="M 24 6 L 44 40 L 4 40 Z"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <line
              id="warn-line"
              x1="24"
              y1="18"
              x2="24"
              y2="28"
              stroke="#FF6A1A"
              stroke-width="4"
              stroke-linecap="round"
            />
            <circle
              id="warn-dot"
              cx="24"
              cy="34"
              r="2.5"
              fill="#FF6A1A"
            />
          </svg>
          <span class="warning-label">CẢNH BÁO RỦI RO</span>
        </div>
      </div>

      <!-- Thanh cam đáy cố định -->
      <div class="brand-bottom-bar"></div>
    </div>
  </div>

  <script>
    // Chuẩn bị đường vẽ SVG Path cho icon warning theo quy tắc tất định
    const warnPath = document.querySelector("#warn-triangle");
    if (warnPath) {
      const len = warnPath.getTotalLength();
      warnPath.style.strokeDasharray = len + "";
      warnPath.style.strokeDashoffset = len + "";
    }

    // Tạo GSAP timeline paused theo hợp đồng HyperFrames
    const tl = gsap.timeline({ paused: true });

    // 1. Entrance animation & Camera motion Ken Burns nhẹ (scale 1.0 -> 1.05) trên ảnh nền toàn khung
    tl.fromTo(
      "#bg-photo-layer",
      { opacity: 0 },
      { opacity: 1, duration: 0.45, ease: "power2.out" },
      0
    );

    tl.fromTo(
      "#photo-img",
      { scale: 1 },
      { scale: 1.05, duration: 7.87, ease: "none" },
      0
    );

    // 2. Punch phrase "BÁN XE GỬI NHỜ" xuất hiện tại 1.16s (atMs: 89290 - 88130)
    tl.fromTo(
      "#punch-plate",
      { scale: 0.85, opacity: 0, y: 25 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      1.16
    );

    // Giữ punch phrase tối thiểu 2.6s, sau đó fade out nhẹ trước khi kết thúc cảnh
    tl.to(
      "#punch-plate",
      { opacity: 0, y: -15, duration: 0.35, ease: "power2.in" },
      7.2
    );

    // 3. Warning overlay xuất hiện tại 4.92s (atMs: 93050 - 88130)
    tl.fromTo(
      "#warning-badge",
      { scale: 0.82, opacity: 0, y: 20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      4.92
    );

    // Vẽ nét tam giác cảnh báo
    tl.to(
      "#warn-triangle",
      { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
      4.98
    );

    // Dấu chấm than hiện sau khi nét tam giác vẽ xong
    tl.fromTo(
      "#warn-line",
      { opacity: 0, scaleY: 0, transformOrigin: "24px 23px" },
      { opacity: 1, scaleY: 1, duration: 0.2, ease: "power2.out" },
      5.2
    );

    tl.fromTo(
      "#warn-dot",
      { opacity: 0, scale: 0, transformOrigin: "24px 34px" },
      { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" },
      5.32
    );

    // Đăng ký timeline chính lên window.__timelines
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s11"] = tl;
  </script>

    </template>
  </body>
</html>
