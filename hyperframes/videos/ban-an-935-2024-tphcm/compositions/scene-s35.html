<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* 84px Grid Background */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        z-index: 1;
      }

      /* Main Scene Layout - Full Frame Media */
      .shot-main {
        z-index: 10;
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .hero-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        will-change: transform, opacity;
      }

      .hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
        display: block;
        will-change: transform;
      }

      /* Overlay Tracks */
      .overlay-track-center {
        z-index: 30;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        pointer-events: none;
      }

      .overlay-track-icon {
        z-index: 40;
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
        pointer-events: none;
      }

      /* Label Overlay Card */
      .label-card {
        margin-top: 230px;
        max-width: 920px;
        padding: 24px 36px;
        border-radius: 12px;
        border: 3px solid #141414;
        border-left: 14px solid #FF6A1A;
        box-shadow: 12px 12px 0px #141414;
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        will-change: transform, opacity;
      }

      .label-bar {
        width: 56px;
        height: 5px;
        background-color: #FF6A1A;
        border-radius: 3px;
        margin-bottom: 12px;
      }

      .label-title {
        font-size: 52px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: -0.5px;
        text-transform: uppercase;
        margin: 0;
      }

      .label-part-white {
        color: #F7F4EC;
      }

      .label-part-orange {
        color: #FF6A1A;
      }

      /* Fall Icon Card */
      .icon-card {
        margin-top: 1040px;
        margin-right: 80px;
        width: 280px;
        padding: 18px 22px;
        border-radius: 14px;
        border: 3px solid #141414;
        border-top: 6px solid #FF6A1A;
        box-shadow: 10px 10px 0px #141414;
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        will-change: transform, opacity;
      }

      .icon-header {
        width: 100%;
        display: flex;
        justify-content: flex-start;
      }

      .icon-tag {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        padding: 4px 12px;
        border-radius: 6px;
      }

      .fall-svg {
        width: 220px;
        height: 110px;
        overflow: visible;
        display: block;
      }

      .fall-path {
        fill: none;
        stroke: #FF6A1A;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .icon-subtext {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin: 0;
        width: 100%;
        text-align: center;
      }

      /* Fixed Brand Signature Bottom Bar */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s35"
      data-width="1080"
      data-height="1920"
      data-duration="8.36"
      data-fps="30"
    >
      <!-- Background Grid Pattern -->
      <div class="bg-grid"></div>

      <!-- Shot S35-1 Main Visual Track (Full-Bleed Media) -->
      <div id="shot-main" class="clip shot-main" data-start="0" data-duration="8.36" data-track-index="0">
        <div id="hero-wrap" class="hero-wrap" data-layout-allow-overflow="true">
          <img
            id="hero-img"
            class="hero-img"
            src="assets/img-18-sweeping-debt-under-rug.jpg"
            data-layout-allow-overflow="true"
            alt="Quét rác giấu dưới thảm sập sàn ngập nợ cũ"
          />
        </div>
      </div>

      <!-- Overlay Track 1: Label NỢ MỚI XỬ LÝ NỢ CŨ -->
      <div
        id="overlay-label-track"
        class="clip overlay-track-center"
        data-start="3.26"
        data-duration="2.5"
        data-track-index="1"
      >
        <div id="label-card" class="label-card hf-plate-ink">
          <div class="label-bar"></div>
          <div class="label-title">
            <span class="label-part-white">NỢ MỚI XỬ LÝ </span><span class="label-part-orange">NỢ CŨ</span>
          </div>
        </div>
      </div>

      <!-- Overlay Track 2: Icon Fall (Sụp đổ) -->
      <div
        id="overlay-icon-track"
        class="clip overlay-track-icon"
        data-start="5.49"
        data-duration="2.0"
        data-track-index="2"
      >
        <div id="icon-card" class="icon-card hf-plate-ink">
          <div class="icon-header">
            <span class="icon-tag hf-hl-orange">SỤP ĐỔ</span>
          </div>
          <svg class="fall-svg" viewBox="0 0 180 120" xmlns="http://www.w3.org/2000/svg">
            <line x1="20" y1="35" x2="160" y2="35" stroke="#E7E3D9" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.35" />
            <path id="fall-path-main" class="fall-path" d="M 20 35 L 65 35 L 90 70 L 115 65 L 150 110" />
            <path id="fall-path-arrow" class="fall-path" d="M 125 110 L 150 110 L 150 85" />
          </svg>
          <div class="icon-subtext hf-text-light">ĐỔ VỠ CẤU TRÚC</div>
        </div>
      </div>

      <!-- Persistent Brand Bottom Orange Bar -->
      <div class="brand-bottom-bar"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      // Initialize SVG stroke dash geometry for progressive self-drawing
      const fallPaths = document.querySelectorAll(".fall-path");
      fallPaths.forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = `${len}`;
        p.style.strokeDashoffset = `${len}`;
      });

      // Master paused Seekable GSAP Timeline
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance: rise into frame
      tl.fromTo(
        "#hero-wrap",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0
      );

      // 2. Camera Motion: Ken Burns zoom-in & slow drift downward to reveal collapsing floor
      tl.fromTo(
        "#hero-img",
        { scale: 1.04, y: 0 },
        { scale: 1.18, y: -120, duration: 8.36, ease: "none" },
        0
      );

      // 3. Overlay 1: "NỢ MỚI XỬ LÝ NỢ CŨ" punch-phrase
      tl.fromTo(
        "#label-card",
        { y: -30, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
        3.26
      );

      tl.to(
        "#label-card",
        { y: -15, opacity: 0, duration: 0.35, ease: "power2.in" },
        5.35
      );

      // 4. Overlay 2: "fall" icon badge & progressive stroke drawing
      tl.fromTo(
        "#icon-card",
        { scale: 0.8, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        5.49
      );

      tl.to(
        "#fall-path-main",
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        5.55
      );

      tl.to(
        "#fall-path-arrow",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        5.85
      );

      tl.to(
        "#icon-card",
        { scale: 0.92, opacity: 0, y: 10, duration: 0.32, ease: "power2.in" },
        7.10
      );

      // Register timeline strictly to root data-composition-id
      window.__timelines["scene-s35"] = tl;
    </script>
  
    </template>
  </body>
</html>
