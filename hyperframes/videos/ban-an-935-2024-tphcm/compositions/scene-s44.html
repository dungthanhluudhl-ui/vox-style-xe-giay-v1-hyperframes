      * {

        inset: 0;
        background-size: 84px 84px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        pointer-events: none;
        z-index: 1;
      }

      /* Thanh cam nhận diện cố định ở mép dưới */
      .bottom-brand-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 99;
      }

      /* Clip quy chuẩn HyperFrames */
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Nền ảnh toàn khung theo chuẩn Style DNA (không viền khung hay bóng đổ giả) */
      .bg-photo-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background-color: #141414;
        z-index: 2;
      }

      .scene-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      #shot1-img {
        object-position: center 75%;
      }

      #shot2-img {
        object-position: center 30%;
      }

      /* Lớp overlay chứa badge và punch phrase */
      .overlay-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      /* Badge icon tiền tệ */
      .money-badge-wrapper {
        position: absolute;
        top: 800px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
      }

      .money-badge {
        background-color: #FF6A1A;
        padding: 14px 28px;
        border-radius: 50px;
        border: 3px solid #141414;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .money-icon-svg {
        display: block;
      }

      .cash-draw {
        fill: none;
        stroke: #141414;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Card punch-phrase nổi bật */
      .punch-card {
        position: absolute;
        top: 910px;
        left: 60px;
        right: 60px;
        background-color: #141414;
        border-radius: 8px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
        overflow: hidden;

      .punch-card-accent {
        height: 8px;
        background-color: #FF6A1A;
        width: 100%;

      .punch-card-content {
        padding: 24px 32px;
        text-align: center;

      .punch-title {
        font-size: 58px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: -0.5px;

      /* Nhãn Shot 2 - Tình tiết giảm nhẹ */
      .evidence-tag {

        top: 360px;
        left: 60px;
        display: inline-flex;
        align-items: center;
        background-color: #141414;
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
        border: 2px solid rgba(255, 255, 255, 0.12);
        z-index: 10;
      }

      .evidence-tag-bar {
        width: 12px;
        align-self: stretch;
        background-color: #FF6A1A;
      }

      .evidence-tag-text {
        padding: 18px 30px;
        font-size: 42px;
        font-weight: 900;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

      /* Nhãn Shot 2 - Phụ thuộc cấp trên */
      .highlight-tag {
        position: absolute;
        top: 1100px;
        left: 60px;
        display: inline-flex;
        align-items: center;
        background-color: #FF6A1A;
        border-radius: 6px;
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.55);
        border: 3px solid #141414;
        z-index: 10;
      }

      .highlight-tag-text {
        padding: 18px 32px;
        font-size: 42px;
        font-weight: 900;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s44"
      data-width="1080"
      data-height="1920"
      data-duration="10.69"
      data-start="0"
    >
      <!-- Nền lưới toạ độ Vox -->
      <div class="bg-grid"></div>

      <!-- SHOT 1: Cắt cận biên lai nộp tiền khắc phục hậu quả 213 triệu (0s - 5.01s) -->
      <section id="shot-1" class="clip" data-start="0" data-duration="5.01">
        <div id="shot1-bg-wrap" class="bg-photo-wrap">
          <img
            id="shot1-img"
            class="scene-img"
            src="assets/img-08-court-appeal-reduced-sentence.jpg"
            alt="Biên lai nộp tiền khắc phục hậu quả"
          />
        </div>

        <div id="shot1-overlays" class="overlay-layer">
          <!-- Icon Money tự vẽ (atMs: 390870 -> 0.88s) -->
          <div class="money-badge-wrapper">
            <div id="money-badge" class="money-badge">
              <svg class="money-icon-svg" viewBox="0 0 100 64" width="70" height="45">
                <rect class="cash-draw" x="4" y="4" width="92" height="56" rx="6" />
                <circle class="cash-draw" cx="50" cy="32" r="14" />
                <line class="cash-draw" x1="18" y1="14" x2="18" y2="50" />
                <line class="cash-draw" x1="82" y1="14" x2="82" y2="50" />
              </svg>
            </div>
          </div>

          <!-- Punch phrase (atMs: 391330 -> 1.34s) -->
          <div id="punch-card" class="punch-card">
            <div class="punch-card-accent"></div>
            <div class="punch-card-content">
              <div class="punch-title hf-text-light">NỘP 213 TRIỆU ĐỒNG</div>

      <!-- SHOT 2: Pan mở rộng lên hai bị cáo cúi đầu trước HĐXX (5.01s - 10.69s) -->
      <section id="shot-2" class="clip" data-start="5.01" data-duration="5.68">
        <div id="shot2-bg-wrap" class="bg-photo-wrap">
          <img
            id="shot2-img"
            class="scene-img"
            src="assets/img-08-court-appeal-reduced-sentence.jpg"
            alt="Hai bị cáo trước toà phúc thẩm"
          />
        </div>

        <div class="overlay-layer">
          <!-- Label 1: Tình tiết giảm nhẹ (atMs: 395450 -> 5.46s) -->
          <div id="label-giam-nhe" class="evidence-tag">
            <div class="evidence-tag-bar"></div>
            <div class="evidence-tag-text hf-text-light">TÌNH TIẾT GIẢM NHẸ</div>
          </div>

          <!-- Label 2: Phụ thuộc cấp trên (atMs: 398650 -> 8.66s) -->
          <div id="label-phu-thuoc" class="highlight-tag">

          </div>

      <!-- Dải cam thương hiệu đáy khung hình -->
      <div class="bottom-brand-bar"></div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Thiết lập nét vẽ SVG path tự vẽ cho icon tiền tệ
      const cashElements = document.querySelectorAll(".cash-draw");
      cashElements.forEach(function (el) {
        if (el.getTotalLength) {
          const len = el.getTotalLength();
          el.style.strokeDasharray = len;
          el.style.strokeDashoffset = len;
        }
      });

      // ================= SHOT 1 CHOREOGRAPHY (0.00s - 5.01s) =================
      // Vào cảnh kiểu "rise"
      tl.fromTo(
        "#shot1-bg-wrap",
        { y: 60, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.0,
      );

      // Camera motion: zoom-in cận biên lai
      tl.fromTo(
        "#shot1-img",
        { scale: 1.05 },
        { scale: 1.18, duration: 5.01, ease: "none" },
        0.0,
      );

      // Icon money xuất hiện (atMs: 390870 -> 0.88s)
      tl.fromTo(
        "#money-badge",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.88,
      );

      // Nét vẽ icon tiền tự vẽ dần
      tl.to(
        ".cash-draw",
        { strokeDashoffset: 0, duration: 0.45, stagger: 0.08, ease: "power2.out" },
        0.95,
      );

      // Punch-phrase: "NỘP 213 TRIỆU ĐỒNG" (atMs: 391330 -> 1.34s)
      tl.fromTo(
        "#punch-card",
        { y: 35, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        1.34,
      );

      // Fade nhẹ overlay trước khi chuyển cảnh
      tl.to(
        "#shot1-overlays",
        { opacity: 0, duration: 0.3, ease: "power2.in" },
        4.7,
      );

      // ================= SHOT 2 CHOREOGRAPHY (5.01s - 10.69s) =================
      // Camera motion: pan-left mở rộng góc nhìn lên hai bị cáo
      tl.fromTo(
        "#shot2-img",
        { scale: 1.08, x: 30 },
        { x: -30, duration: 5.68, ease: "sine.inOut" },
        5.01,
      );

      // Label 1: "TÌNH TIẾT GIẢM NHẸ" (atMs: 395450 -> 5.46s)
      tl.fromTo(
        "#label-giam-nhe",
        { x: -40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        5.46,
      );

      // Label 1 fade out sau khi kết thúc thời gian giữ (holdMs: 2200 -> ~7.66s)
      tl.to(
        "#label-giam-nhe",
        { opacity: 0, x: -20, duration: 0.35, ease: "power2.in" },
        7.7,
      );

      // Label 2: "PHỤ THUỘC CẤP TRÊN" (atMs: 398650 -> 8.66s)
      tl.fromTo(
        "#label-phu-thuoc",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        8.66,
      );

      // Đăng ký timeline chính lên window.__timelines
      window.__timelines["scene-s44"] = tl;
    </script>
