<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Base clip layout */
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Full-frame Hero Image Container (Style DNA: toàn khung, không viền, không đổ bóng giả) */
      .hero-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        transform-origin: center center;
      }

      .hero-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: center 50%;
      }

      /* Spotlight vignette overlay (variant spotlight từ Scene Plan) */
      .spotlight-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at 50% 45%, transparent 35%, rgba(20, 20, 20, 0.42) 100%);
      }

      /* Bottom permanent brand bar */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }

      /* Overlay layout container */
      .overlay-center {
        position: absolute;
        top: 220px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
      }

      /* Label Card (Overlay 1) */
      .label-card {
        padding: 22px 48px;
        background-color: #141414;
        border: 4px solid #FF6A1A;
        border-radius: 14px;
        box-shadow: 0 14px 36px rgba(20, 20, 20, 0.4);
        transform-origin: center center;
      }

      .label-text {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 58px;
        line-height: 1.25;
        letter-spacing: 2px;
        color: #F7F4EC;
        text-transform: uppercase;
        display: block;
        margin: 0;
        white-space: nowrap;
      }

      /* Warning Icon Badge (Overlay 2) */
      .warning-badge {
        width: 140px;
        height: 140px;
        background-color: #141414;
        border: 4px solid #FF6A1A;
        border-radius: 24px;
        box-shadow: 0 14px 36px rgba(20, 20, 20, 0.4);
        display: flex;
        justify-content: center;
        align-items: center;
        transform-origin: center center;
      }

      .warning-svg {
        width: 96px;
        height: 96px;
      }

      #warning-triangle-path {
        fill: none;
        stroke: #FF6A1A;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      #warning-excl-path {
        fill: none;
        stroke: #F7F4EC;
        stroke-width: 7;
        stroke-linecap: round;
      }

      #warning-dot {
        fill: #F7F4EC;
        transform-origin: 50px 70px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s03"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="8.41"
    >
      <!-- Base Scene Shot S03-1 -->
      <div id="shot-s03-1" class="clip" data-start="0" data-duration="8.41">
        <!-- Hero Asset: Full-frame photo img-03 (toàn khung, không viền, không đổ bóng giả) -->
        <div id="hero-wrap" class="hero-wrap">
          <img
            id="hero-img"
            class="hero-img"
            src="assets/img-03-fraud-loan-dossier-frozen-assets.jpg"
            alt="Hồ sơ vay vốn niêm phong"
          />
        </div>

        <!-- Spotlight Vignette Overlay -->
        <div class="spotlight-overlay"></div>

        <!-- Fixed Bottom Orange Signature Bar -->
        <div class="bottom-brand-bar"></div>
      </div>

      <!-- Overlay 1: Label "BẪY XE CHỞ TIỀN" (atMs: 25480, holdMs: 2800 -> start: 1.89s, dur: 2.80s) -->
      <div id="label-clip" class="clip" data-start="1.89" data-duration="2.80">
        <div class="overlay-center">
          <div id="label-card" class="label-card hf-plate-ink">
            <span class="label-text hf-text-light">BẪY XE CHỞ TIỀN</span>
          </div>
        </div>
      </div>

      <!-- Overlay 2: Warning Icon (atMs: 28500, holdMs: 2200 -> start: 4.91s, dur: 2.20s) -->
      <div id="warning-clip" class="clip" data-start="4.91" data-duration="2.20">
        <div class="overlay-center">
          <div id="warning-badge" class="warning-badge hf-plate-ink">
            <svg class="warning-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <path id="warning-triangle-path" d="M 50 16 L 86 78 L 14 78 Z" />
              <path id="warning-excl-path" d="M 50 36 L 50 58" />
              <circle id="warning-dot" cx="50" cy="70" r="4" />
            </svg>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Single paused GSAP timeline
      const tl = gsap.timeline({ paused: true });

      // Progressive SVG path preparation for warning icon
      const warningTriangle = document.getElementById("warning-triangle-path");
      const warningExcl = document.getElementById("warning-excl-path");

      let triLen = 220;
      let exclLen = 24;

      if (warningTriangle) {
        triLen = warningTriangle.getTotalLength();
        warningTriangle.style.strokeDasharray = triLen;
        warningTriangle.style.strokeDashoffset = triLen;
      }

      if (warningExcl) {
        exclLen = warningExcl.getTotalLength();
        warningExcl.style.strokeDasharray = exclLen;
        warningExcl.style.strokeDashoffset = exclLen;
      }

      // --- Shot S03-1: Hero entrance fade & continuous Ken Burns zoom-in (1.0 -> 1.08) ---
      tl.fromTo(
        "#hero-wrap",
        { opacity: 0 },
        { opacity: 1, duration: 0.6, ease: "power2.out" },
        0
      );

      // Ken Burns: scale 1.0 -> 1.08 phóng to nhẹ vào tập hồ sơ bị niêm phong
      tl.fromTo(
        "#hero-img",
        { scale: 1.0, y: 0 },
        { scale: 1.08, y: -24, duration: 8.41, ease: "none" },
        0
      );

      // --- Overlay 1: Label "BẪY XE CHỞ TIỀN" (data-start 1.89s, ends 4.69s) ---
      tl.fromTo(
        "#label-card",
        { scale: 0.86, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.95
      );

      tl.to(
        "#label-card",
        { opacity: 0, y: -16, duration: 0.35, ease: "power2.in" },
        4.25
      );

      // --- Overlay 2: Warning Icon (data-start 4.91s, ends 7.11s) ---
      tl.fromTo(
        "#warning-badge",
        { scale: 0.8, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        4.95
      );

      tl.fromTo(
        "#warning-triangle-path",
        { strokeDashoffset: triLen },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        5.05
      );

      tl.fromTo(
        "#warning-excl-path",
        { strokeDashoffset: exclLen },
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        5.35
      );

      tl.fromTo(
        "#warning-dot",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" },
        5.55
      );

      tl.to(
        "#warning-badge",
        { opacity: 0, scale: 0.9, duration: 0.35, ease: "power2.in" },
        6.70
      );

      // Register timeline on window.__timelines
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s03"] = tl;
    </script>
  
    </template>
  </body>
</html>
