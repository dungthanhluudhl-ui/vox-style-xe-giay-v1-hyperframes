<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #f7f4ec;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #141414;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Camera chuyển động zoom-in nhẹ */
      #camera {
        position: absolute;
        inset: 0;
        transform-origin: 50% 45%;
        will-change: transform;
      }

      /* Nền spotlight tối với lưới đồ họa Vox */
      #spotlight-bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle 680px at 50% 45%,
          #22201e 0%,
          #161514 65%,
          #0d0d0d 100%
        );
      }
      #grid-overlay {
        position: absolute;
        inset: 0;
        background-size: 84px 84px;
        background-image: linear-gradient(
            to right,
            rgba(247, 244, 236, 0.05) 1.5px,
            transparent 1.5px
          ),
          linear-gradient(
            to bottom,
            rgba(247, 244, 236, 0.05) 1.5px,
            transparent 1.5px
          );
        pointer-events: none;
      }

      /* Vùng nội dung chính (Safe zone Y: 180px - 1380px) */
      #content-stage {
        position: absolute;
        top: 180px;
        left: 40px;
        right: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Top Header Tag */
      #top-tag {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 8px 24px;
        background-color: #141414;
        border: 2px solid #ff6a1a;
        border-radius: 4px;
        margin-bottom: 28px;
      }
      #top-tag .dot {
        width: 10px;
        height: 10px;
        background-color: #ff6a1a;
        border-radius: 50%;
      }
      #top-tag span {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #ff6a1a;
        text-transform: uppercase;
      }

      /* Khối Diagram Kỹ thuật */
      #diagram-box {
        position: relative;
        width: 960px;
        height: 480px;
        background-color: #141414;
        border: 2px solid rgba(247, 244, 236, 0.2);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
        margin-bottom: 34px;
      }

      /* Dấu crosshair ở 4 góc */
      .crosshair {
        position: absolute;
        width: 16px;
        height: 16px;
      }
      .ch-tl {
        top: -8px;
        left: -8px;
        border-top: 2px solid #ff6a1a;
        border-left: 2px solid #ff6a1a;
      }
      .ch-tr {
        top: -8px;
        right: -8px;
        border-top: 2px solid #ff6a1a;
        border-right: 2px solid #ff6a1a;
      }
      .ch-bl {
        bottom: -8px;
        left: -8px;
        border-bottom: 2px solid #ff6a1a;
        border-left: 2px solid #ff6a1a;
      }
      .ch-br {
        bottom: -8px;
        right: -8px;
        border-bottom: 2px solid #ff6a1a;
        border-right: 2px solid #ff6a1a;
      }

      /* SVG vector layer cho Diagram */
      #diagram-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* Nút thắt tâm điểm - Tọa độ tuyệt đối trong khung 960x480 */
      #center-hub {
        position: absolute;
        top: 185px;
        left: 310px;
        width: 340px;
        height: 110px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #ff6a1a;
        color: #141414;
        border-radius: 6px;
        text-align: center;
        box-shadow: 0 10px 24px rgba(255, 106, 26, 0.35);
        z-index: 10;
        transform-origin: 50% 50%;
      }
      #center-hub .hub-sub {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 4px;
        color: #141414;
      }
      #center-hub .hub-title {
        font-size: 30px;
        font-weight: 900;
        line-height: 1.15;
        color: #141414;
        letter-spacing: 1px;
      }

      /* Các nút áp lực vây quanh - Định vị tọa độ tuyệt đối không dùng translate */
      .pressure-node {
        position: absolute;
        padding: 10px 18px;
        background-color: #141414;
        border: 1.5px solid #ff6a1a;
        border-radius: 4px;
        font-size: 18px;
        font-weight: 700;
        color: #f7f4ec;
        z-index: 5;
        white-space: nowrap;
        text-align: center;
        transform-origin: 50% 50%;
      }
      #node-top {
        top: 30px;
        left: 350px;
        width: 260px;
      }
      #node-left {
        top: 216px;
        left: 30px;
        width: 260px;
      }
      #node-right {
        top: 216px;
        right: 30px;
        width: 260px;
      }

      /* Khối PUNCH-PHRASE (atMs: 65430 -> 1.33s) */
      #punch-card {
        position: relative;
        width: 960px;
        background-color: #e7e3d9;
        color: #141414;
        border: 4px solid #141414;
        box-shadow: 14px 14px 0px #ff6a1a;
        padding: 34px 40px 30px;
        text-align: center;
        margin-bottom: 34px;
        transform-origin: 50% 50%;
        opacity: 0;
      }
      #punch-sub {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 2.5px;
        color: #141414;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      #punch-text {
        font-size: 68px;
        font-weight: 900;
        line-height: 1.25;
        color: #141414;
        text-transform: uppercase;
        margin: 0;
      }
      #punch-underline {
        width: 220px;
        height: 8px;
        background-color: #ff6a1a;
        margin: 18px auto 0;
        transform-origin: 0% 50%;
        transform: scaleX(0);
      }

      /* Khối CẢNH BÁO / WARNING ICON (atMs: 67420 -> 3.32s) */
      #warning-badge {
        position: relative;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 16px 36px;
        background-color: #141414;
        border: 2px solid #ff6a1a;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        opacity: 0;
        transform-origin: 50% 50%;
      }
      .warning-svg {
        width: 58px;
        height: 52px;
        flex-shrink: 0;
      }
      #warning-badge span {
        font-size: 28px;
        font-weight: 900;
        color: #f7f4ec;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      /* Thanh cam nhận diện cố định ở đáy khung hình */
      #bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 999;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s08"
      data-width="1080"
      data-height="1920"
      data-duration="5.42"
      data-fps="30"
    >
      <!-- Shot S08-1 toàn cảnh -->
      <section
        id="shot-s08-1"
        class="clip"
        data-start="0"
        data-duration="5.42"
      >
        <!-- Camera layer phục vụ zoom nhẹ -->
        <div id="camera">
          <!-- Background spotlight -->
          <div id="spotlight-bg"></div>
          <div id="grid-overlay"></div>

          <!-- Khu vực nội dung trong safe-zone -->
          <div id="content-stage">
            <!-- Header Tag -->
            <div id="top-tag">
              <div class="dot"></div>
              <span>BAN LÃNH ĐẠO // ĐIỂM NGHẼN ĐIỀU HÀNH</span>
            </div>

            <!-- Khung Diagram Áp Lực -->
            <div id="diagram-box">
              <div class="crosshair ch-tl"></div>
              <div class="crosshair ch-tr"></div>
              <div class="crosshair ch-bl"></div>
              <div class="crosshair ch-br"></div>

              <!-- SVG đường đo & mũi tên hội tụ -->
              <svg id="diagram-svg" viewBox="0 0 960 480">
                <defs>
                  <marker
                    id="arrow-top"
                    viewBox="0 0 10 10"
                    refX="5"
                    refY="5"
                    markerWidth="6"
                    markerHeight="6"
                    orient="auto-start-reverse"
                  >
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF6A1A" />
                  </marker>
                  <marker
                    id="arrow-side"
                    viewBox="0 0 10 10"
                    refX="5"
                    refY="5"
                    markerWidth="6"
                    markerHeight="6"
                    orient="auto-start-reverse"
                  >
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF6A1A" />
                  </marker>
                </defs>

                <!-- Vòng tròn kỹ thuật bao tâm -->
                <circle
                  class="draw-path"
                  cx="480"
                  cy="240"
                  r="190"
                  fill="none"
                  stroke="rgba(247,244,236,0.15)"
                  stroke-width="1.5"
                  stroke-dasharray="6,6"
                />

                <!-- Trục ép trên xuống -->
                <line
                  class="draw-path vector-line"
                  x1="480"
                  y1="85"
                  x2="480"
                  y2="175"
                  stroke="#FF6A1A"
                  stroke-width="3"
                  marker-end="url(#arrow-top)"
                />

                <!-- Trục ép trái sang -->
                <line
                  class="draw-path vector-line"
                  x1="295"
                  y1="240"
                  x2="305"
                  y2="240"
                  stroke="#FF6A1A"
                  stroke-width="3"
                  marker-end="url(#arrow-side)"
                />

                <!-- Trục ép phải sang -->
                <line
                  class="draw-path vector-line"
                  x1="665"
                  y1="240"
                  x2="655"
                  y2="240"
                  stroke="#FF6A1A"
                  stroke-width="3"
                  marker-end="url(#arrow-side)"
                />
              </svg>

              <!-- Các nút áp lực -->
              <div id="node-top" class="pressure-node">
                ÁP LỰC NỢ XẤU
              </div>
              <div id="node-left" class="pressure-node">
                ĐIỂM NGHẼN THANH KHOẢN
              </div>
              <div id="node-right" class="pressure-node">
                NGUY CƠ MẤT VỐN
              </div>

              <!-- Nút thắt tâm điểm: Quỹ tín dụng -->
              <div id="center-hub">
                <div class="hub-sub">TÂM ĐIỂM ÁP LỰC</div>
                <div class="hub-title">QUỸ TÍN DỤNG</div>
              </div>
            </div>

            <!-- Khối PUNCH-PHRASE (atMs: 65430 -> 1.33s) -->
            <div id="punch-card">
              <div id="punch-sub">GỌNG KÌM TÀI CHÍNH</div>
              <h1 id="punch-text">BÀI TOÁN NAN GIẢI</h1>
              <div id="punch-underline"></div>
            </div>

            <!-- Khối CẢNH BÁO (atMs: 67420 -> 3.32s) -->
            <div id="warning-badge">
              <svg
                class="warning-svg"
                viewBox="0 0 60 54"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  id="warn-tri"
                  class="draw-path"
                  d="M 30 6 L 56 48 L 4 48 Z"
                  stroke="#FF6A1A"
                  stroke-width="4.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  id="warn-bar"
                  class="draw-path"
                  d="M 30 20 L 30 34"
                  stroke="#FF6A1A"
                  stroke-width="4.5"
                  stroke-linecap="round"
                />
                <circle
                  id="warn-dot"
                  cx="30"
                  cy="42"
                  r="2.5"
                  fill="#FF6A1A"
                />
              </svg>
              <span>ĐIỂM NGHẼN HỆ THỐNG</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Thanh cam đáy cố định không ảnh hưởng bởi camera pan/zoom -->
      <div id="bottom-brand-bar"></div>
    </div>

    <script>
      // Khởi tạo Timeline GSAP seekable theo đúng hợp đồng HyperFrames
      const tl = gsap.timeline({ paused: true });

      // Cài đặt trước stroke-dasharray & stroke-dashoffset cho mọi SVG path vẽ tay
      const drawPaths = document.querySelectorAll(".draw-path");
      drawPaths.forEach(function (path) {
        const length = path.getTotalLength();
        path.style.strokeDasharray = length;
        path.style.strokeDashoffset = length;
      });

      // 1. Camera chuyển động zoom-in nhẹ toàn scene (0s -> 5.42s)
      tl.to(
        "#camera",
        {
          scale: 1.05,
          duration: 5.42,
          ease: "none",
        },
        0
      );

      // 2. Entrance Diagram & Khung kỹ thuật (0.1s -> 1.0s)
      tl.fromTo(
        "#diagram-box",
        { opacity: 0, scale: 0.95 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" },
        0.1
      );

      // Vẽ các nét vector & vòng tròn diagram
      tl.to(
        "#diagram-svg .draw-path",
        {
          strokeDashoffset: 0,
          duration: 0.7,
          stagger: 0.1,
          ease: "power2.out",
        },
        0.2
      );

      // Nút thắt tâm điểm bật mở
      tl.fromTo(
        "#center-hub",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.35
      );

      // Các nút áp lực 3 phía tiến vào
      tl.fromTo(
        ".pressure-node",
        { opacity: 0, scale: 0.85 },
        {
          opacity: 1,
          scale: 1,
          duration: 0.45,
          stagger: 0.1,
          ease: "power3.out",
        },
        0.55
      );

      // 3. PUNCH-PHRASE: "BÀI TOÁN NAN GIẢI" (atMs: 65430 -> 1.33s)
      // Transition entrance kiểu 'strike' (dứt khoát, scale lớn về 1 với ease mạnh)
      tl.fromTo(
        "#punch-card",
        {
          scale: 1.25,
          opacity: 0,
          rotation: -1.5,
        },
        {
          scale: 1,
          opacity: 1,
          rotation: 0,
          duration: 0.4,
          ease: "power4.out",
        },
        1.33
      );

      // Thanh gạch chân cam mở rộng ngay sau khi punch-card hạ cánh
      tl.fromTo(
        "#punch-underline",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.35, ease: "power2.out" },
        1.65
      );

      // 4. ICON WARNING & CẢNH BÁO (atMs: 67420 -> 3.32s)
      // Xuất hiện khối badge
      tl.fromTo(
        "#warning-badge",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        3.32
      );

      // Tự vẽ tam giác warning
      tl.to(
        "#warn-tri",
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        3.35
      );

      // Vẽ thanh dấu than
      tl.to(
        "#warn-bar",
        { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
        3.65
      );

      // Pop dấu chấm than tròn
      tl.fromTo(
        "#warn-dot",
        { scale: 0, transformOrigin: "50% 50%" },
        { scale: 1, duration: 0.2, ease: "power3.out" },
        3.8
      );

      // Đăng ký timeline cho HyperFrames seek runtime
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s08"] = tl;
    </script>
  
    </template>
  </body>
</html>
