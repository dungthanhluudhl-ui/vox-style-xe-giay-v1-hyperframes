<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      width: 1080px;
      height: 1920px;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* .clip contract: inset 0, no fixed px width/height */
    .clip {
      position: absolute;
      inset: 0;
    }

    /* WCAG Color Plate Classes */
    .hf-text-ink {
      color: #141414;
    }

    .hf-text-light {
      color: #F7F4EC;
    }

    .hf-hl-orange {
      background-color: #FF6A1A;
      color: #141414;
    }

    .hf-plate-ink {
      background-color: #141414;
      color: #F7F4EC;
    }

    /* Global Vox Background: Grid 84px on paper */
    .canvas-bg {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      z-index: 1;
    }

    /* Visual signature: bottom orange bar */
    .bottom-orange-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 14px;
      background-color: #FF6A1A;
      z-index: 999;
    }

    /* Decorative Corner Target Marks (safe graphic element) */
    .target-marker {
      position: absolute;
      width: 20px;
      height: 20px;
      z-index: 5;
    }

    .marker-tl {
      top: 190px;
      left: 50px;
      border-top: 3px solid #141414;
      border-left: 3px solid #141414;
    }

    .marker-tr {
      top: 190px;
      right: 50px;
      border-top: 3px solid #141414;
      border-right: 3px solid #141414;
    }

    /* Photo Frame Container (positioned inside safeZone [160, 1390]) */
    .photo-frame {
      position: absolute;
      top: 220px;
      left: 50px;
      width: 980px;
      height: 1140px;
      background-color: #141414;
      border: 4px solid #141414;
      box-shadow: 12px 12px 0px rgba(20, 20, 20, 0.35);
      overflow: hidden;
      z-index: 10;
    }

    /* Inner wrapper for image motion */
    .photo-inner {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* Images */
    .shot-image {
      position: absolute;
      top: -380px;
      height: 2200px;
      width: auto;
      max-width: none;
      display: block;
      will-change: transform;
    }

    #shot1-img {
      left: -80px;
    }

    #shot2-img {
      left: -420px;
    }

    /* Shot 1 Overlay: Punch Phrase "ĂN MỘT TÍNH BỐN" */
    .punch-container {
      position: absolute;
      bottom: 50px;
      left: 40px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 14px;
      z-index: 30;
      will-change: transform, opacity;
    }

    .punch-pill {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.15;
      padding: 18px 28px;
      border-radius: 6px;
      border: 3px solid #141414;
      box-shadow: 6px 6px 0px #141414;
      white-space: nowrap;
    }

    /* Shot 2 Overlay: Icon "fall" + Label "BA BÁT MANG ĐI" */
    .shot2-callout {
      position: absolute;
      bottom: 50px;
      left: 40px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      z-index: 30;
    }

    .icon-badge {
      width: 90px;
      height: 90px;
      border-radius: 8px;
      border: 3px solid #141414;
      box-shadow: 6px 6px 0px #141414;
      display: grid;
      place-items: center;
      will-change: transform, opacity;
    }

    .icon-fall-svg {
      width: 64px;
      height: 64px;
      display: block;
    }

    .label-badge {
      font-size: 50px;
      font-weight: 900;
      line-height: 1.15;
      padding: 18px 30px;
      border-radius: 8px;
      border: 3px solid #141414;
      box-shadow: 6px 6px 0px #141414;
      white-space: nowrap;
      will-change: transform, opacity;
    }
  </style>

  <div id="root" data-composition-id="scene-s18" data-width="1080" data-height="1920" data-duration="8.97">
    <!-- Static Background Elements -->
    <div class="canvas-bg"></div>
    <div class="target-marker marker-tl"></div>
    <div class="target-marker marker-tr"></div>
    <div class="bottom-orange-bar"></div>

    <!-- SHOT 1: 0.0s -> 4.49s (Duration 4.49s) -->
    <section id="shot-1" class="clip" data-start="0" data-duration="4.49">
      <div id="shot1-frame" class="photo-frame">
        <div class="photo-inner">
          <img
            id="shot1-img"
            class="shot-image"
            src="assets/img-12-cash-bribe-street-stall.jpg"
            alt="Người đàn ông ăn phở"
            data-layout-allow-overflow="true"
          />
        </div>
        <!-- Punch Phrase Overlay -->
        <div id="punch-container" class="punch-container">
          <div class="punch-pill hf-plate-ink">
            <span class="hf-text-light">ĂN MỘT</span>
          </div>
          <div class="punch-pill hf-hl-orange">
            <span class="hf-text-ink">TÍNH BỐN</span>
          </div>
        </div>
      </div>
    </section>

    <!-- SHOT 2: 4.49s -> 8.97s (Duration 4.48s) -->
    <section id="shot-2" class="clip" data-start="4.49" data-duration="4.48">
      <div id="shot2-frame" class="photo-frame">
        <div class="photo-inner">
          <img
            id="shot2-img"
            class="shot-image"
            src="assets/img-12-cash-bribe-street-stall.jpg"
            alt="Thanh niên rút tiền rời bàn"
            data-layout-allow-overflow="true"
          />
        </div>
        <!-- Overlays: Icon "fall" + Label "BA BÁT MANG ĐI" -->
        <div class="shot2-callout">
          <div id="icon-badge" class="icon-badge hf-plate-ink">
            <svg class="icon-fall-svg" viewBox="0 0 100 100">
              <path
                id="fall-path"
                d="M 18 26 L 44 26 L 76 74"
                fill="none"
                stroke="#FF6A1A"
                stroke-width="9"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                id="fall-arrow"
                d="M 50 74 L 76 74 L 76 48"
                fill="none"
                stroke="#FF6A1A"
                stroke-width="9"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div id="label-badge" class="label-badge hf-hl-orange">
            <span class="hf-text-ink">BA BÁT MANG ĐI</span>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    // Prepare SVG path lengths deterministically
    const fallPath = document.getElementById("fall-path");
    const fallArrow = document.getElementById("fall-arrow");
    if (fallPath && fallArrow) {
      const lenPath = fallPath.getTotalLength();
      fallPath.style.strokeDasharray = lenPath + " " + lenPath;
      fallPath.style.strokeDashoffset = lenPath;

      const lenArrow = fallArrow.getTotalLength();
      fallArrow.style.strokeDasharray = lenArrow + " " + lenArrow;
      fallArrow.style.strokeDashoffset = lenArrow;
    }

    // Initialize Paused Timeline
    const tl = gsap.timeline({ paused: true });

    // ==========================================
    // SHOT 1 CHOREOGRAPHY (t: 0.0s -> 4.49s)
    // ==========================================
    // Entrance: Rise animation for Shot 1 photo card
    tl.fromTo(
      "#shot1-frame",
      { y: 50, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
      0.0
    );

    // Camera pan-left on customer eating pho (scale 1.05 -> 1.08, steady pan)
    tl.fromTo(
      "#shot1-img",
      { x: 0, scale: 1.05 },
      { x: -75, scale: 1.08, duration: 4.49, ease: "none" },
      0.0
    );

    // Punch Phrase Entrance ("ĂN MỘT TÍNH BỐN") at 1.03s (atMs: 144060)
    tl.fromTo(
      "#punch-container",
      { scale: 0.8, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      1.03
    );

    // ==========================================
    // SHOT 2 CHOREOGRAPHY (t: 4.49s -> 8.97s)
    // ==========================================
    // TransitionIn: Cut at 4.49s (147520ms)
    // Camera pan-right tracking the man leaving with cash/bowls (scale 1.07 -> 1.11)
    tl.fromTo(
      "#shot2-img",
      { x: 0, scale: 1.07 },
      { x: -65, scale: 1.11, duration: 4.48, ease: "none" },
      4.49
    );

    // Icon "fall" badge entrance at 6.65s (atMs: 149680)
    tl.fromTo(
      "#icon-badge",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      6.65
    );

    // SVG progressive path drawing for "fall" icon
    tl.to(
      "#fall-path",
      { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
      6.8
    );
    tl.to(
      "#fall-arrow",
      { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
      7.05
    );

    // Label "BA BÁT MANG ĐI" entrance at 6.97s (atMs: 150000)
    tl.fromTo(
      "#label-badge",
      { x: -30, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      6.97
    );

    // Register paused timeline on window.__timelines with key "scene-s18"
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s18"] = tl;
  </script>

    </template>
  </body>
</html>
