    <script>
      // Single paused timeline registered on window.__timelines["scene-s07"]
      const tl = gsap.timeline({ paused: true });

      // SVG path length setup for progressive draw
      const paths = ["conn-stem", "conn-branch-1", "conn-branch-2", "icon-person-head", "icon-person-body"];
      paths.forEach((id) => {
        const el = document.getElementById(id);
        if (el) {
          const len = el.getTotalLength();
          el.style.strokeDasharray = len;
          el.style.strokeDashoffset = len;
        }
      });

      // 1. Camera subtle pan-right drift (toàn bộ 9.64s)
      tl.fromTo("#camera-rig", { x: 18 }, { x: -18, duration: 9.64, ease: "none" }, 0);

      // 2. Unfold entrance cho Header & Cấp trên (Giám đốc chi nhánh)
      tl.fromTo(
        "#header-block",
        { y: -24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.1
      );

      tl.fromTo(
        "#node-top",
        { scaleY: 0, opacity: 0, transformOrigin: "50% 0%" },
        { scaleY: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.25
      );

      // 3. Connector vẽ phân nhánh sang 2 bên
      tl.to("#conn-stem", { strokeDashoffset: 0, duration: 0.25, ease: "none" }, 0.45);
      tl.to("#conn-branch-1", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 0.65);
      tl.to("#conn-branch-2", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 0.65);

      // 4. 2 Nhánh lãnh đạo cùng mở ra (t = 0.9s)
      tl.fromTo(
        "#branch-node-1",
        { scaleY: 0, opacity: 0, transformOrigin: "50% 0%" },
        { scaleY: 1, opacity: 1, duration: 0.48, ease: "power3.out" },
        0.88
      );

      tl.fromTo(
        "#branch-node-2",
        { scaleY: 0, opacity: 0, transformOrigin: "50% 0%" },
        { scaleY: 1, opacity: 1, duration: 0.52, ease: "power3.out" },
        0.92
      );

      // 5. Overlay 1: "PHÓ PHÒNG TÍN DỤNG" pop in (atMs: 55590 -> t = 1.23s)
      tl.fromTo(
        "#badge-role",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        1.23
      );

      tl.fromTo(
        "#name-official",
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.38, ease: "power3.out" },
        1.36
      );

      // 6. Overlay 2: Icon "person" vẽ nét (atMs: 57650 -> t = 3.29s)
      tl.fromTo(
        "#person-icon-box",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.32, ease: "power3.out" },
        3.29
      );

      tl.to(
        "#icon-person-head",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        3.35
      );

      tl.to(
        "#icon-person-body",
        { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
        3.5
      );

      // 7. Overlay 3: "TÊN GỌI: HỒNG HẢI" xuất hiện trong khối quy ước (atMs: 59770 -> t = 5.41s)
      tl.fromTo(
        "#alias-card",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        5.1
      );

      tl.fromTo(
        "#alias-box",
        { scale: 0.8, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        5.41
      );

      // Register timeline
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s07"] = tl;
    </script>
