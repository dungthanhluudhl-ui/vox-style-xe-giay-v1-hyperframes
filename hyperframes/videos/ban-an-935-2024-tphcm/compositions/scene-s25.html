    <div

    <!-- Animation Runtime Script -->
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1. Setup progressive stroke drawing for Money SVG icon
      const svgPaths = document.querySelectorAll(".money-svg-path");
      svgPaths.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = length + "px";
        path.style.strokeDashoffset = length + "px";
      });

      // 2. Shot 1 Choreography (0.00s -> 4.42s)
      // Transition in: Strike entrance
      tl.fromTo(
        "#hero-img-1",
        { scale: 1.18, opacity: 0 },
        { scale: 1.05, opacity: 1, duration: 0.5, ease: "power4.out" },
        0
      );

      // Camera pan-left across Shot 1
      tl.fromTo(
        "#hero-img-1",
        { x: 30 },
        { x: -30, duration: 4.42, ease: "none" },
        0
      );

      // Overlay: Label "83 HỘ DÂN NHẬN" at 0.34s
      tl.fromTo(
        "#s1-label",
        { x: -70, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.34
      );

      // Overlay: Punch phrase "11,335 TỶ ĐỒNG" at 2.33s
      tl.fromTo(
        "#s1-punch",
        { scale: 0.8, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        2.33
      );

      // 3. Shot 2 Choreography (4.42s -> 9.42s)
      // Transition in: Hard cut at 4.42s, camera pan-right across Shot 2
      tl.fromTo(
        "#hero-img-2",
        { x: -35, scale: 1.08 },
        { x: 35, scale: 1.15, duration: 5.0, ease: "none" },
        4.42
      );

      // Overlay: Money icon container appearance at 4.78s
      tl.fromTo(
        "#s2-icon-wrap",
        { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        4.78
      );

      // Progressive SVG path draw for money icon
      tl.to(
        ".money-svg-path",
        { strokeDashoffset: 0, duration: 0.65, stagger: 0.08, ease: "power2.out" },
        4.85
      );

      // Overlay: Punch phrase "28,355 TỶ VÀO TÚI" at 6.95s
      tl.fromTo(
        "#s2-punch",
        { scale: 0.75, opacity: 0, y: 40 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power4.out" },
        6.95
      );

      // Register master timeline
      window.__timelines["scene-s25"] = tl;
    </script>
