    // Chuẩn bị đường vẽ SVG icon cán cân (SVG path drawing)
    const scalePaths = document.querySelectorAll("#scale-icon-svg path, #scale-icon-svg line");
    scalePaths.forEach((p) => {
      const len = p.getTotalLength ? p.getTotalLength() : 80;
      p.style.strokeDasharray = len + "";
      p.style.strokeDashoffset = len + "";
    });

    // BẮT BUỘC: Khởi tạo duy nhất 1 GSAP timeline paused và gán vào window.__timelines["scene-s45"]
    const tl = gsap.timeline({ paused: true });

    // 0.0s - 8.32s: Camera zoom-out tinh tế theo shotlist ("cameraMotion": "zoom-out")
    tl.fromTo(
      "#camera-stage",
      { scale: 1.04 },
      { scale: 1.0, duration: 8.32, ease: "none" },
      0
    );

    // 0.0s - 0.7s: Scene transitionIn: "grow"
    tl.fromTo(
      "#main-diagram-card",
      { scale: 0.9, opacity: 0, y: 30 },
      { scale: 1.0, opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
      0.1
    );
    tl.fromTo(
      "#header-group",
      { opacity: 0, y: -20 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
      0.2
    );

    // 0.61s: Overlay 1 - PHÚC THẨM 26/09/2024 xuất hiện dứt khoát
