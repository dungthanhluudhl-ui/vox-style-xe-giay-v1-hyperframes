<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #f7f4ec; }
      .hf-hl-orange { color: #141414; background-color: #ff6a1a; }
      .hf-plate-ink { color: #f7f4ec; background-color: #141414; }
      .hf-plate-ink-orange { color: #ff6a1a; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #f5f0e4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #e7e3d9;
        font-family: "Be Vietnam Pro", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Base layout convention: clips take full-canvas inset */
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Background grid: ivory paper + 84px square grid */
      #bg-grid {
        position: absolute;
        inset: 0;
        background-color: #e7e3d9;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        z-index: 1;
      }

      /* Shot main: full-frame 9:16 background photo, no borders or fake shadows */
      #shot-main {
        z-index: 2;
      }
      #hero-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        will-change: transform, opacity;
      }
      #hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        will-change: transform;
      }

      /* Overlay clips: centered flex container for badges */
      .overlay-clip {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        pointer-events: none;
        z-index: 10;
      }

      /* Overlay 1: Punch phrase badge */
      #punch-card {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 200px;
        padding: 18px 42px;
        background-color: #141414;
        border-radius: 8px;
        border-bottom: 6px solid #ff6a1a;
        will-change: transform, opacity;
      }
      .punch-text {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 62px;
        line-height: 1.25;
        color: #f7f4ec;
        letter-spacing: -0.5px;
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* Overlay 2: Doc icon self-drawing card */
      #doc-card {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 200px;
        width: 140px;
        height: 140px;
        background-color: #141414;
        border: 3px solid #ff6a1a;
        border-radius: 10px;
        will-change: transform, opacity;
      }
      #doc-svg {
        display: block;
      }
      #doc-svg path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #doc-body {
        stroke: #f7f4ec;
        stroke-width: 5;
      }
      #doc-fold {
        stroke: #ff6a1a;
        stroke-width: 4;
      }
      .doc-line {
        stroke: #ff6a1a;
        stroke-width: 4.5;
      }

      /* Overlay 3: Label badge */
      #label-card {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin-top: 200px;
        padding: 16px 38px 16px 26px;
        background-color: #141414;
        border-radius: 8px;
        border-left: 8px solid #ff6a1a;
        will-change: transform, opacity;
      }
      .label-text {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 56px;
        line-height: 1.25;
        color: #f7f4ec;
        letter-spacing: -0.5px;
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* Signature Vox bottom orange bar */
      #bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 99;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s01"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="11.04"
    >
      <!-- Background grid layer -->
      <div id="bg-grid"></div>

      <!-- Main shot clip: full-frame 9:16 background photo -->
      <div id="shot-main" class="clip" data-start="0" data-duration="11.04">
        <div id="hero-container">
          <img
            id="hero-img"
            src="assets/img-07-bank-loan-fraud-flow.jpg"
            alt="Sơ đồ dòng tiền 40 tỷ phân nhánh"
          />
        </div>
      </div>

      <!-- Overlay 1: Punch phrase (atMs: 580 -> 0.52s, holdMs: 3200 -> 3.2s) -->
      <div id="clip-punch" class="clip overlay-clip" data-start="0.52" data-duration="3.2">
        <div id="punch-card" class="hf-plate-ink">
          <span class="punch-text">HỒ SƠ BỊ ĐỘI GIÁ</span>
        </div>
      </div>

      <!-- Overlay 2: Self-drawing doc icon (atMs: 4650 -> 4.59s, holdMs: 2000 -> 2.0s) -->
      <div id="clip-icon" class="clip overlay-clip" data-start="4.59" data-duration="2.0">
        <div id="doc-card" class="hf-plate-ink">
          <svg
            id="doc-svg"
            viewBox="0 0 100 120"
            width="85"
            height="102"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path id="doc-body" d="M 20 10 L 68 10 L 85 27 L 85 110 L 20 110 Z" />
            <path id="doc-fold" d="M 68 10 L 68 27 L 85 27" />
            <path id="doc-line-1" class="doc-line" d="M 32 46 L 73 46" />
            <path id="doc-line-2" class="doc-line" d="M 32 66 L 73 66" />
            <path id="doc-line-3" class="doc-line" d="M 32 86 L 58 86" />
          </svg>
        </div>
      </div>

      <!-- Overlay 3: Label (atMs: 7170 -> 7.11s, holdMs: 3500 -> 3.5s) -->
      <div id="clip-label" class="clip overlay-clip" data-start="7.11" data-duration="3.5">
        <div id="label-card" class="hf-plate-ink">
          <span class="label-text">DÒNG TIỀN RẼ NHÁNH</span>
        </div>
      </div>

      <!-- Persistent Vox signature bottom bar -->
      <div id="bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Transition-in punch arrival at t = 0
      tl.fromTo(
        "#hero-container",
        { scale: 1.05, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0
      );

      // 2. Continuous slow Ken Burns zoom (1.0 -> 1.06) over entire 11.04s duration
      tl.fromTo(
        "#hero-img",
        { scale: 1.0 },
        { scale: 1.06, duration: 11.04, ease: "none" },
        0
      );

      // 3. Overlay 1: Punch phrase entrance and exit
      tl.fromTo(
        "#punch-card",
        { scale: 0.86, opacity: 0, y: -20 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.52
      );
      tl.to(
        "#punch-card",
        { opacity: 0, y: -15, duration: 0.28, ease: "power2.in" },
        3.44
      );

      // 4. Overlay 2: Doc icon card and progressive vector stroke draws
      const docPathItems = [
        { id: "doc-body", fallback: 322, start: 4.75, dur: 0.4 },
        { id: "doc-fold", fallback: 36, start: 4.95, dur: 0.22 },
        { id: "doc-line-1", fallback: 42, start: 5.12, dur: 0.2 },
        { id: "doc-line-2", fallback: 42, start: 5.26, dur: 0.2 },
        { id: "doc-line-3", fallback: 28, start: 5.4, dur: 0.18 }
      ];

      tl.fromTo(
        "#doc-card",
        { scale: 0.8, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.35, ease: "power3.out" },
        4.59
      );

      docPathItems.forEach((item) => {
        const el = document.getElementById(item.id);
        if (el) {
          let len = 0;
          try {
            len = el.getTotalLength();
          } catch (e) {}
          if (!len || len <= 0) len = item.fallback;
          el.style.strokeDasharray = len + "px";
          el.style.strokeDashoffset = len + "px";

          tl.fromTo(
            el,
            { strokeDashoffset: len },
            { strokeDashoffset: 0, duration: item.dur, ease: "power2.out" },
            item.start
          );
        }
      });

      tl.to(
        "#doc-card",
        { opacity: 0, scale: 0.9, duration: 0.2, ease: "power2.in" },
        6.35
      );

      // 5. Overlay 3: Label entrance and exit
      tl.fromTo(
        "#label-card",
        { scale: 0.88, opacity: 0, y: -20 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        7.11
      );
      tl.to(
        "#label-card",
        { opacity: 0, y: -15, duration: 0.3, ease: "power2.in" },
        10.28
      );

      // Deterministic registration
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s01"] = tl;
    </script>
  
    </template>
  </body>
</html>
