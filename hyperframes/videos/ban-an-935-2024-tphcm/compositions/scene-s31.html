<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    /* Quy ước bắt buộc: .clip inset: 0, không đặt width/height cứng */
    .clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* Nền lưới 84px chuẩn Vox */
    .vox-grid-bg {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      z-index: 1;
    }

    /* Container cho ảnh tư liệu và hiệu ứng wobble-drop */
    #photo-wrapper {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #photo-inner {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }

    #hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Khung ngắm Viewfinder brackets (annotated visual language) */
    .target-brackets {
      position: absolute;
      top: 260px;
      left: 120px;
      width: 840px;
      height: 720px;
      pointer-events: none;
    }

    .bracket {
      position: absolute;
      width: 48px;
      height: 48px;
      border-color: #FF6A1A;
      border-style: solid;
    }

    .bracket-tl { top: 0; left: 0; border-width: 6px 0 0 6px; }
    .bracket-tr { top: 0; right: 0; border-width: 6px 6px 0 0; }
    .bracket-bl { bottom: 0; left: 0; border-width: 0 0 6px 6px; }
    .bracket-br { bottom: 0; right: 0; border-width: 0 6px 6px 0; }

    /* Overlay 1: Nhãn PHÓ PHÒNG HỒNG HẢI */
    .label-honghai-container {
      position: absolute;
      top: 380px;
      left: 80px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 10;
    }

    .honghai-plate {
      background-color: #141414;
      padding: 18px 36px;
      border-left: 10px solid #FF6A1A;
      box-shadow: 8px 8px 0px #FF6A1A;
      display: inline-block;
    }

    .honghai-text {
      color: #F7F4EC;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.2;
    }

    /* Overlay 2: Icon doc tự vẽ (SVG progressive path draw) */
    .doc-callout-container {
      position: absolute;
      top: 800px;
      left: 420px;
      z-index: 15;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .doc-badge-plate {
      background-color: #141414;
      width: 240px;
      height: 240px;
      border: 4px solid #FF6A1A;
      box-shadow: 8px 8px 0px #FF6A1A;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .doc-svg {
      width: 140px;
      height: 160px;
    }

    .doc-draw-path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Overlay 3: Punch card DÍNH 10 HỒ SƠ */
    .punch-dinh10-container {
      position: absolute;
      top: 1160px;
      left: 80px;
      right: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    .dinh10-plate {
      background-color: #141414;
      padding: 24px 44px;
      border: 4px solid #FF6A1A;
      box-shadow: 12px 12px 0px #FF6A1A;
      text-align: center;
      display: inline-block;
    }

    .dinh10-badge {
      background-color: #FF6A1A;
      color: #141414;
      padding: 12px 32px;
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.2;
      display: inline-block;
    }

    /* Thanh cam nhận diện cố định ở đáy khung hình */
    #bottom-signature-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 999;
    }
  </style>

  <div id="root"
       data-composition-id="scene-s31"
       data-width="1080"
       data-height="1920"
       data-duration="7.57">

    <!-- Lưới kẻ ngà chuẩn Vox làm nền -->
    <div class="vox-grid-bg"></div>

    <!-- Clip 1: Ảnh tư liệu điều tra (Ken Burns + Wobble-drop entrance) -->
    <section id="clip-bg-photo" class="clip" data-start="0" data-duration="7.57">
      <div id="photo-wrapper">
        <div id="photo-inner">
          <img id="hero-img" src="assets/img-01-accounting-fraud-office-investigation.jpg" alt="Investigation">
          
          <!-- Viewfinder ngắm hai đối tượng -->
          <div id="viewfinder" class="target-brackets">
            <div class="bracket bracket-tl"></div>
            <div class="bracket bracket-tr"></div>
            <div class="bracket bracket-bl"></div>
            <div class="bracket bracket-br"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Clip 2: Overlay Label 1 - PHÓ PHÒNG HỒNG HẢI (0.66s -> 3.76s) -->
    <section id="clip-overlay-honghai" class="clip" data-start="0.66" data-duration="3.10">
      <div id="label-honghai-node" class="label-honghai-container">
        <div class="honghai-plate">
          <div class="honghai-text">PHÓ PHÒNG HỒNG HẢI</div>
        </div>
      </div>
    </section>

    <!-- Clip 3: Overlay Icon doc tự vẽ (3.90s -> 6.30s) -->
    <section id="clip-overlay-doc" class="clip" data-start="3.90" data-duration="2.40">
      <div id="doc-badge-node" class="doc-callout-container">
        <div class="doc-badge-plate">
          <svg class="doc-svg" viewBox="0 0 100 120">
            <!-- Thân tài liệu có góc gập -->
            <path class="doc-draw-path" d="M 20 10 L 65 10 L 85 30 L 85 110 L 20 110 Z" stroke="#FF6A1A" stroke-width="6"/>
            <!-- Nếp gấp góc phải -->
            <path class="doc-draw-path" d="M 65 10 L 65 30 L 85 30" stroke="#FF6A1A" stroke-width="6"/>
            <!-- Các dòng chữ nội dung hồ sơ -->
            <path class="doc-draw-path" d="M 32 48 L 72 48" stroke="#F7F4EC" stroke-width="5"/>
            <path class="doc-draw-path" d="M 32 68 L 72 68" stroke="#F7F4EC" stroke-width="5"/>
            <path class="doc-draw-path" d="M 32 88 L 56 88" stroke="#F7F4EC" stroke-width="5"/>
          </svg>
        </div>
      </div>
    </section>

    <!-- Clip 4: Overlay Label 2 - DÍNH 10 HỒ SƠ (6.58s -> 7.57s) -->
    <section id="clip-overlay-dinh10" class="clip" data-start="6.58" data-duration="0.99">
      <div id="punch-dinh10-node" class="punch-dinh10-container">
        <div class="dinh10-plate">
          <div class="dinh10-badge">DÍNH 10 HỒ SƠ</div>
        </div>
      </div>
    </section>

    <!-- Chữ ký thị giác: thanh cam cố định mép đáy -->
    <div id="bottom-signature-bar"></div>

  </div>

  <script>
    // Setup progressive stroke draw cho SVG icon doc
    const docPaths = document.querySelectorAll(".doc-draw-path");
    docPaths.forEach(function(path) {
      const len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = len;
    });

    // Tạo đúng 1 timeline paused theo contract HyperFrames
    const tl = gsap.timeline({ paused: true });

    // 1. Ken Burns camera zoom-in chạy chậm liên tục suốt scene
    gsap.set("#hero-img", { scale: 1.05, y: 0, transformOrigin: "50% 38%" });
    tl.to("#hero-img", {
      scale: 1.16,
      y: -32,
      duration: 7.57,
      ease: "none"
    }, 0);

    // 2. Transition-in: Wobble-drop cho ảnh tư liệu lúc t = 0
    tl.fromTo("#photo-wrapper", 
      { y: -90, rotation: 1.5, opacity: 0 },
      { y: 0, rotation: 0, opacity: 1, duration: 0.68, ease: "power3.out" },
      0
    );

    // Viewfinder hiện ngay sau khi ảnh tiếp đất
    tl.fromTo("#viewfinder",
      { scale: 1.08, opacity: 0 },
      { scale: 1, opacity: 0.9, duration: 0.45, ease: "power2.out" },
      0.35
    );

    // 3. Overlay 1: PHÓ PHÒNG HỒNG HẢI (atMs = 274710 -> 0.66s, duration 3.1s)
    tl.fromTo("#label-honghai-node",
      { x: -50, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.48, ease: "power3.out" },
      0.66
    );
    tl.to("#label-honghai-node",
      { x: -20, opacity: 0, duration: 0.32, ease: "power2.in" },
      3.40
    );

    // 4. Overlay 2: Icon "doc" tự vẽ (atMs = 277950 -> 3.90s, duration 2.4s)
    tl.fromTo("#doc-badge-node",
      { scale: 0.4, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      3.90
    );
    // Vẽ dần các nét của icon doc
    docPaths.forEach(function(path, index) {
      tl.to(path, {
        strokeDashoffset: 0,
        duration: 0.45,
        ease: "power2.out"
      }, 4.05 + index * 0.08);
    });
    // Thu gọn icon trước khi phán quyết xuất hiện
    tl.to("#doc-badge-node",
      { scale: 0.8, opacity: 0, duration: 0.28, ease: "power2.in" },
      6.02
    );

    // 5. Overlay 3: DÍNH 10 HỒ SƠ (atMs = 280630 -> 6.58s)
    // Đóng dấu phán quyết mạnh mẽ (Slam / Punch)
    tl.fromTo("#punch-dinh10-node",
      { scale: 1.35, rotation: -2.5, opacity: 0 },
      { scale: 1, rotation: 0, opacity: 1, duration: 0.32, ease: "power4.out" },
      6.58
    );

    // Đăng ký timeline gốc vào window.__timelines
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s31"] = tl;
  </script>

    </template>
  </body>
</html>
