  <script>
    // BẮT BUỘC: Khởi tạo timeline chính ở trạng thái paused
    const tl = gsap.timeline({ paused: true });

    // Thiết lập độ dài nét vẽ SVG check
    const checkPath = document.getElementById("check-path-element");
    if (checkPath) {
      const pathLength = checkPath.getTotalLength();
      checkPath.style.strokeDasharray = pathLength;
      checkPath.style.strokeDashoffset = pathLength;
    }

    // Gán trạng thái khởi tạo chính xác tuyệt đối (seek-safe)
    gsap.set("#kicker-badge", { x: -30, opacity: 0 });
    gsap.set("#seal-icon", { scale: 0, opacity: 0 });
    gsap.set("#header-label", { y: -25, opacity: 0 });
    gsap.set("#fortress-roof", { scaleY: 0, opacity: 0 });
    gsap.set("#fortress-foundation", { scaleY: 0, opacity: 0 });
    gsap.set(".pillar-col", { scaleY: 0, opacity: 0 });
    gsap.set("#barrier-shield", { scaleX: 0, opacity: 0 });
    gsap.set("#flow-warning", { y: 25, opacity: 0 });
    gsap.set("#punch-phrase-box", { scale: 0.9, y: 30, opacity: 0 });

    // ==========================================
    // DIỄN HOẠ CHUYỂN ĐỘNG (0.0s -> 10.0s)
    // ==========================================

    // 1. Camera Motion: Pan nhẹ sang trái toàn cảnh
    tl.fromTo("#stage-camera", 
      { x: 20 }, 
      { x: -15, duration: 10, ease: "none" }, 
      0
    );

    // 2. Kicker mở đầu (0.2s)
    tl.to("#kicker-badge", { 
      x: 0, 
      opacity: 1, 
      duration: 0.5, 
      ease: "power3.out" 
    }, 0.2);

    // 3. Unfold Kiến trúc nóc & Móng thành trì (0.4s - 0.9s)
    tl.to("#fortress-roof", { 
      scaleY: 1, 
      opacity: 1, 
      duration: 0.5, 
      ease: "power2.out" 
    }, 0.4);

    tl.to("#fortress-foundation", { 
      scaleY: 1, 
      opacity: 1, 
      duration: 0.5, 
      ease: "power2.out" 
    }, 0.5);

    // 4. Mọc 4 trụ cột móng phòng thủ (0.65s - 1.4s, stagger)
    tl.to(".pillar-col", { 
      scaleY: 1, 
      opacity: 1, 
      duration: 0.6, 
      stagger: 0.12, 
      ease: "power3.out" 
    }, 0.65);

    // 5. Icon check xuất hiện tại 1.15s (shotlist atMs: 365150 - 364000 = 1.15s)
    tl.to("#seal-icon", { 
      scale: 1, 
      opacity: 1, 
      duration: 0.45, 
      ease: "back.out(1.5)" 
    }, 1.15);

    // Nét check vẽ dần
    tl.to("#check-path-element", { 
      strokeDashoffset: 0, 
      duration: 0.45, 
      ease: "power2.out" 
    }, 1.35);

    // 6. Label "4 TRỤ CỘT BẢO VỆ" xuất hiện tại 2.01s (shotlist atMs: 366010 - 364000 = 2.01s)
    tl.to("#header-label", { 
      y: 0, 
      opacity: 1, 
      duration: 0.5, 
      ease: "power3.out" 
    }, 2.01);

    // 7. Rào chắn phòng vệ củng cố giăng ngang (3.0s)
    tl.to("#barrier-shield", { 
      scaleX: 1, 
      opacity: 1, 
      duration: 0.6, 
      ease: "power3.out" 
    }, 3.0);

    // 8. Box mô tả luồng ngăn chặn hành vi rút ruột (4.2s)
    tl.to("#flow-warning", { 
      y: 0, 
      opacity: 1, 
      duration: 0.5, 
      ease: "power2.out" 
    }, 4.2);

    // 9. PUNCH-PHRASE: "CHẶN LẤY TIỀN VÁ LỖ" tại 7.17s (shotlist atMs: 371170 - 364000 = 7.17s)
    tl.to("#punch-phrase-box", { 
      scale: 1, 
      y: 0, 
      opacity: 1, 
      duration: 0.55, 
      ease: "power3.out" 
    }, 7.17);

    // Nhấn nhẹ dứt khoát khi chốt hạ luận điểm
    tl.to("#punch-phrase-box", { 
      scale: 1.02, 
      duration: 0.12, 
      yoyo: true, 
      repeat: 1, 
      ease: "power1.inOut" 
    }, 7.72);

    // BẮT BUỘC: Đăng ký timeline chính lên window.__timelines
    window.__timelines["scene-s41"] = tl;
  </script>
