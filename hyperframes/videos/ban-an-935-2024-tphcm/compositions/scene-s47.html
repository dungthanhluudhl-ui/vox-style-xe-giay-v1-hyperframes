    <script>
      // Single paused master timeline for HyperFrames
      const tl = gsap.timeline({ paused: true });

      // Measure SVG path lengths for clean progressive draw
      const docPaths = document.querySelectorAll(".doc-path");
      docPaths.forEach((path) => {
        const len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
      });

      // 1. Initial State Setup
      gsap.set("#terminal-mockup", { scale: 0.88, opacity: 0, y: 35 });
      gsap.set("#terminal-amount", { opacity: 0, scale: 0.95 });
      gsap.set("#doc-badge", { opacity: 0, scale: 0.8 });
      gsap.set("#label-badge", { scale: 0.8, opacity: 0, y: 12 });
      gsap.set(
        ["#layer-card-1", "#layer-card-2", "#layer-card-3", "#layer-card-4"],
        { opacity: 0, y: 28 }
      );
      gsap.set("#punch-container", { scale: 0.9, opacity: 0, y: 32 });

      // 2. Phase 1: Entrance "zoom-through" into computer terminal (0.0s -> 0.6s)
      tl.to(
        "#terminal-mockup",
        {
          scale: 1,
          opacity: 1,
          y: 0,
          duration: 0.58,
          ease: "power3.out",
        },
        0.05
      );

      // Gõ số tiền vào máy tính (0.35s)
      tl.to(
        "#terminal-amount",
        {
          opacity: 1,
          scale: 1,
          duration: 0.35,
          ease: "power2.out",
        },
        0.35
      );

      // Icon doc reveal at 0.68s (Shotlist: overlay icon 'doc' atMs: 423680 -> 0.68s)
      tl.to(
        "#doc-badge",
        {
          opacity: 1,
          scale: 1,
          duration: 0.32,
          ease: "power3.out",
        },
        0.68
      );
      tl.to(
        docPaths,
        {
          strokeDashoffset: 0,
          duration: 0.45,
          stagger: 0.08,
          ease: "power2.out",
        },
        0.72
      );

      // 3. Phase 2: Overlay Label "KHÔNG CHỈ LÀ CON SỐ" at 1.28s (atMs: 424280 -> 1.28s)
      tl.to(
        "#label-badge",
        {
          scale: 1,
          opacity: 1,
          y: 0,
          duration: 0.45,
          ease: "power3.out",
        },
        1.28
      );

      // Phía sau bung ra 4 lớp ràng buộc pháp lý (Staggered arrival)
      // Layer 1: Tài sản thế chấp (1.85s)
      tl.to(
        "#layer-card-1",
        {
          opacity: 1,
          y: 0,
          duration: 0.42,
          ease: "power3.out",
        },
        1.85
      );

      // Layer 2: Khả năng trả nợ (2.35s)
      tl.to(
        "#layer-card-2",
        {
          opacity: 1,
          y: 0,
          duration: 0.42,
          ease: "power3.out",
        },
        2.35
      );

      // Layer 3: Người chịu trách nhiệm (2.85s)
      tl.to(
        "#layer-card-3",
        {
          opacity: 1,
          y: 0,
          duration: 0.42,
          ease: "power3.out",
        },
        2.85
      );

      // Layer 4: Tiền thật của tổ chức tín dụng (3.35s)
      tl.to(
        "#layer-card-4",
        {
          opacity: 1,
          y: 0,
          duration: 0.45,
          ease: "power3.out",
        },
        3.35
      );

      // 4. Phase 3: Punch Phrase "TIỀN THẬT - TRÁCH NHIỆM" at 4.98s (atMs: 427980 -> 4.98s)
      tl.to(
        "#punch-container",
        {
          scale: 1,
          opacity: 1,
          y: 0,
          duration: 0.58,
          ease: "power3.out",
        },
        4.98
      );

      // Settle hold until 8.04s (total scene length)
      window.__timelines["scene-s47"] = tl;
    </script>
