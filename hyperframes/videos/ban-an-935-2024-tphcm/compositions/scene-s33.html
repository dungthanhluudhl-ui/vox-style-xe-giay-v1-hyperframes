<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Nền toàn khung: Ảnh hồ sơ quyết định truy nã giữ nguyên màu gốc theo Style DNA */
      .bg-media-container {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 1;
        transform-origin: 50% 35%;
      }
      .bg-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 50% 35%;
      }

      /* Overlay 1: Biểu tượng Cảnh báo (Warning Icon Badge) */
      .warning-overlay-container {
        position: absolute;
        top: 240px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
      }
      .warning-badge-box {
        background-color: #141414;
        border: 3px solid #ff6a1a;
        border-radius: 12px;
        padding: 16px 32px;
        display: flex;
        align-items: center;
        gap: 16px;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.65);
        transform-origin: 50% 50%;
      }
      .warning-svg {
        display: block;
      }
      .warning-label {
        color: #f7f4ec;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 2px;
        margin: 0;
        line-height: 1;
      }

      /* Overlay 2: Punch Phrase Card "TRUY NÃ ĐỐI TƯỢNG" */
      .punch-overlay-container {
        position: absolute;
        top: 1220px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 15;
      }
      .punch-plate {
        background-color: #141414;
        border-left: 12px solid #ff6a1a;
        border-radius: 8px;
        padding: 24px 44px;
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: 50% 50%;
      }
      .punch-title {
        margin: 0;
        font-size: 68px;
        font-weight: 900;
        line-height: 1.25;
        color: #f7f4ec;
        letter-spacing: 1.5px;
        text-align: center;
        white-space: nowrap;
      }

      /* Dải cam cố định ở mép đáy khung hình - Chữ ký thị giác Vox */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 10px;
        background-color: #ff6a1a;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s33"
      data-width="1080"
      data-height="1920"
      data-duration="5.9"
    >
      <!-- Shot 1: Nền toàn khung ảnh lệnh truy nã (0.0s -> 5.9s) -->
      <section id="shot-s33-main" class="clip" data-start="0" data-duration="5.9">
        <div id="bg-media" class="bg-media-container">
          <img
            id="wanted-img"
            class="bg-image"
            src="assets/img-20-wanted-notice-economic-crime-loss.jpg"
            alt="Quyết định truy nã đối tượng"
          />
        </div>

        <div class="bottom-brand-bar"></div>
      </section>

      <!-- Overlay 1: Biểu tượng Cảnh báo tự vẽ (atMs 292350 -> 1.25s, holdMs 2000 -> 2.0s) -->
      <div id="warning-clip" class="clip" data-start="1.25" data-duration="2.0">
        <div class="warning-overlay-container">
          <div id="warning-box" class="warning-badge-box">
            <svg class="warning-svg" width="56" height="56" viewBox="0 0 64 64" fill="none">
              <path
                id="warn-triangle"
                d="M32 6 L60 56 H4 Z"
                stroke="#FF6A1A"
                stroke-width="5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                id="warn-excl-line"
                d="M32 23 V37"
                stroke="#FF6A1A"
                stroke-width="5"
                stroke-linecap="round"
              />
              <circle id="warn-excl-dot" cx="32" cy="47" r="3" fill="#FF6A1A" />
            </svg>
            <span class="warning-label">CẢNH BÁO</span>
          </div>
        </div>
      </div>

      <!-- Overlay 2: Punch-phrase "TRUY NÃ ĐỐI TƯỢNG" (atMs 295550 -> 4.30s, giữ đến hết cảnh 5.9s) -->
      <div id="punch-clip" class="clip" data-start="4.3" data-duration="1.6">
        <div class="punch-overlay-container">
          <div id="punch-box" class="punch-plate">
            <h1 class="punch-title">TRUY NÃ ĐỐI TƯỢNG</h1>
          </div>
        </div>
      </div>
    </div>

    <script>
      // 1. Chuẩn bị hiệu ứng vẽ đường nét SVG cho Warning Icon
      const trianglePath = document.getElementById("warn-triangle");
      const exclLinePath = document.getElementById("warn-excl-line");
      const triLen = trianglePath ? trianglePath.getTotalLength() : 180;
      const lineLen = exclLinePath ? exclLinePath.getTotalLength() : 20;

      if (trianglePath) {
        trianglePath.style.strokeDasharray = triLen.toString();
        trianglePath.style.strokeDashoffset = triLen.toString();
      }
      if (exclLinePath) {
        exclLinePath.style.strokeDasharray = lineLen.toString();
        exclLinePath.style.strokeDashoffset = lineLen.toString();
      }

      // 2. Xây dựng GSAP Timeline (paused: true)
      const tl = gsap.timeline({ paused: true });

      // Giai đoạn 1: Zoom-through chuyển cảnh vào văn bản tài liệu nền toàn khung
      tl.fromTo(
        "#bg-media",
        { scale: 1.35, opacity: 0 },
        { scale: 1.05, opacity: 1, duration: 0.8, ease: "power3.out" },
        0
      );

      // Camera motion: Zoom-in liên tục hướng vào con dấu quyết định truy nã
      tl.to(
        "#wanted-img",
        { scale: 1.25, y: -30, duration: 5.1, ease: "sine.inOut" },
        0.8
      );

      // Giai đoạn 2: Warning Badge xuất hiện tại 1.25s
      tl.fromTo(
        "#warning-box",
        { scale: 0.7, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.25
      );

      // Vẽ stroke cho biểu tượng tam giác và dấu chấm than
      tl.to(
        "#warn-triangle",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        1.35
      );
      tl.to(
        "#warn-excl-line",
        { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
        1.55
      );
      tl.fromTo(
        "#warn-excl-dot",
        { scale: 0, opacity: 0, transformOrigin: "32px 47px" },
        { scale: 1, opacity: 1, duration: 0.2, ease: "power3.out" },
        1.65
      );

      // Warning Badge thu nhỏ biến mất trước khi kết thúc thời lượng clip của nó (tại 3.0s)
      tl.to(
        "#warning-box",
        { opacity: 0, scale: 0.85, duration: 0.25, ease: "power2.in" },
        3.0
      );

      // Giai đoạn 3: Punch Phrase "TRUY NÃ ĐỐI TƯỢNG" xuất hiện tại 4.30s
      tl.fromTo(
        "#punch-box",
        { scale: 0.85, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        4.3
      );

      // 3. Đăng ký timeline cho HyperFrames seek
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s33"] = tl;
    </script>
  
    </template>
  </body>
</html>
