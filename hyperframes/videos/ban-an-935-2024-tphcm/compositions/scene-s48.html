    <!-- SCRIPT CHÍNH ĐIỀU KHIỂN TIMELINE TẤT ĐỊNH -->
    <script>
      // 1. Chuẩn bị hiệu ứng vẽ SVG path cho doc icon theo quy tắc svg-path-draw.md
      const docPaths = document.querySelectorAll(".doc-icon-svg path");
      docPaths.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = length;
        path.style.strokeDashoffset = length;
      });

      // 2. Tạo paused timeline chính của HyperFrames
      const tl = gsap.timeline({ paused: true });

      // [Camera Motion: pan-left nhẹ nhàng xuyên suốt 11.2s]
      tl.fromTo("#camera-rig", { x: 25 }, { x: -25, duration: 11.2, ease: "none" }, 0);

      // [0.15s -> 1.1s]: Hiệu ứng PEEL - Bìa trước mở lật ra để lộ ruột hồ sơ
      tl.fromTo(
        "#folder-front-cover",
        { rotateY: 0, x: 0 },
        { rotateY: -115, x: -50, duration: 0.95, ease: "power3.out" },
        0.15
      );

      // [0.8s -> 1.8s]: Phân chia tiền - box người đứng tên & người giấu mặt pop vào
      tl.fromTo(
        "#split-nominee",
        { scale: 0.85, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.8
      );
      tl.fromTo(
        "#split-mastermind",
        { scale: 0.85, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        1.1
      );

      // [4.4s -> 6.6s]: OVERLAY 1 - Icon doc vẽ tay xuất hiện
      // Relative atMs = (435440 - 431040)/1000 = 4.4s, holdMs = 2200 (kéo dài đến 6.6s)
      tl.fromTo(
        "#overlay-doc-icon",
        { scale: 0.6, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        4.4
      );

      // Progressive draw các nét SVG của doc icon
