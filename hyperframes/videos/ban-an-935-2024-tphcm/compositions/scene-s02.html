    .brand-bottom-bar {
      position: absolute;

      pointer-events: none;

    .shot-bg-wrapper {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      z-index: 2;

    .full-frame-img {
      position: absolute;

      will-change: transform;

      object-position: center top;

    #shot-2-img {

    /* Punch-Phrase & Editorial Headline Plates */
    .headline-plate {
      position: absolute;

      display: flex;
      align-items: center;

      gap: 20px;

      background-color: #141414;
      border: 4px solid #FF6A1A;
      border-radius: 16px;
      box-shadow: 10px 10px 0 rgba(20, 20, 20, 0.95);
      z-index: 20;
      opacity: 0;
    }

    #shot-1-label {
      top: 170px;
    }

    #shot-2-label {
      top: 1140px;
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;

    .headline-title {

    /* Hand-Drawn SVG Vector Icon Badges */
    .icon-badge {
      position: absolute;
      width: 160px;

      background-color: #141414;
      border: 4px solid #FF6A1A;
      border-radius: 20px;
      box-shadow: 10px 10px 0 rgba(20, 20, 20, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;

    #shot-1-money-badge {

    svg {

  <div
    id="root"
    data-composition-id="scene-s02"
    data-start="0"

  >
    <!-- Background Grid & Bottom Brand Bar -->
    <div id="bg-grid" class="bg-grid"></div>
    <div id="brand-bar" class="brand-bottom-bar"></div>

    <!-- SHOT 1 (S02-1: 0s to 4.97s) -->
    <section id="shot-1" class="clip" data-start="0" data-duration="4.97">
      <!-- Full-bleed background focusing on top half: Bank Loan Cash Truck -->
      <div id="shot-1-bg-wrap" class="shot-bg-wrapper" data-layout-allow-overflow="true">
        <img
          id="shot-1-img"
          class="full-frame-img"
          src="assets/img-02-bank-loan-land-title-fraud.jpg"
          alt="Xe chở tiền ngân hàng"

        />

      <!-- Overlay Label: 28 TỶ CHUYỂN HƯỚNG -->
      <div id="shot-1-label" class="hf-plate-ink headline-plate">
        <span class="tag-pill">28 TỶ</span>
        <span class="headline-title">CHUYỂN HƯỚNG</span>
      </div>

      <!-- Overlay Icon: Hand-Drawn Money Badge -->
      <div id="shot-1-money-badge" class="icon-badge">
        <svg id="money-svg" viewBox="0 0 160 160" width="160" height="160">
          <path
            id="money-outline"
            d="M 24 44 L 136 44 A 8 8 0 0 1 144 52 L 144 108 A 8 8 0 0 1 136 116 L 24 116 A 8 8 0 0 1 16 108 L 16 52 A 8 8 0 0 1 24 44 Z"

            stroke="#FF6A1A"

          />
          <circle
            id="money-circle"

          <path

          <path

          />
        </svg>
      </div>

    <!-- SHOT 2 (S02-2: 4.97s to 12.28s) -->
    <section id="shot-2" class="clip" data-start="4.97" data-duration="7.31">
      <!-- Full-bleed background focusing on bottom half: Rural Citizen Holding Land Title (Sổ Đỏ) -->
      <div id="shot-2-bg-wrap" class="shot-bg-wrapper" data-layout-allow-overflow="true">
        <img
          id="shot-2-img"
          class="full-frame-img"
          src="assets/img-02-bank-loan-land-title-fraud.jpg"
          alt="Người nông dân cầm sổ đỏ"
          data-layout-allow-overflow="true"

      <!-- Overlay Icon: Hand-Drawn Question Badge -->
      <div id="shot-2-question-badge" class="icon-badge">
        <svg id="question-svg" viewBox="0 0 160 160" width="160" height="160">
          <path
            id="q-curve"
            d="M 52 54 C 52 28, 108 28, 108 56 C 108 78, 80 82, 80 102"
            fill="none"
            stroke="#FF6A1A"

          <circle
            id="q-dot"
            cx="80"
            cy="122"
            r="6"
            fill="#F7F4EC"
            stroke="#F7F4EC"
            stroke-width="4"
          />
        </svg>
      </div>

      <!-- Overlay Label: MƯỢN DANH VAY HỘ? -->
      <div id="shot-2-label" class="hf-plate-ink headline-plate">
        <span class="tag-pill">MƯỢN DANH</span>
        <span class="headline-title">VAY HỘ?</span>
      </div>
    </section>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Measure SVG Path Lengths for Deterministic Self-Drawing Vectors
    const moneyOutline = document.getElementById("money-outline");
    const moneyCircle = document.getElementById("money-circle");
    const moneyLine = document.getElementById("money-line");
    const moneyCurve = document.getElementById("money-curve");

    if (moneyOutline && moneyCircle && moneyLine && moneyCurve) {
      const lenOutline = moneyOutline.getTotalLength();
      const lenCircle = moneyCircle.getTotalLength();
      const lenLine = moneyLine.getTotalLength();
      const lenCurve = moneyCurve.getTotalLength();

      moneyOutline.style.strokeDasharray = `${lenOutline}`;
      moneyOutline.style.strokeDashoffset = `${lenOutline}`;
      moneyCircle.style.strokeDasharray = `${lenCircle}`;
      moneyCircle.style.strokeDashoffset = `${lenCircle}`;
      moneyLine.style.strokeDasharray = `${lenLine}`;
      moneyLine.style.strokeDashoffset = `${lenLine}`;
      moneyCurve.style.strokeDasharray = `${lenCurve}`;
      moneyCurve.style.strokeDashoffset = `${lenCurve}`;

      // Staggered Progressive Path Draws
      tl.fromTo(moneyOutline, { strokeDashoffset: lenOutline }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 1.45);
      tl.fromTo(moneyCircle, { strokeDashoffset: lenCircle }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.60);
      tl.fromTo(moneyLine, { strokeDashoffset: lenLine }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 1.75);
      tl.fromTo(moneyCurve, { strokeDashoffset: lenCurve }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.85);
    }

    const qCurve = document.getElementById("q-curve");
    if (qCurve) {
      const lenQ = qCurve.getTotalLength();
      qCurve.style.strokeDasharray = `${lenQ}`;
      qCurve.style.strokeDashoffset = `${lenQ}`;
      tl.fromTo(qCurve, { strokeDashoffset: lenQ }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 5.05);
    }

    const qDot = document.getElementById("q-dot");
    if (qDot) {
      tl.fromTo(qDot, { scale: 0, opacity: 0, transformOrigin: "80px 122px" }, { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" }, 5.50);
    }

    /* ========================================================
       SHOT 1 (0.0s - 4.97s): RÚT TIỀN 28 TỶ CHUYỂN HƯỚNG
       ======================================================== */
    // Full-frame Camera Motion: Scale 2.0x focused on top half (cash truck) with cinematic pan-right
    tl.fromTo(
      "#shot-1-img",
      { scale: 2.0, x: -50, transformOrigin: "50% 0%" },
      { scale: 2.08, x: 50, duration: 4.97, ease: "none" },
      0.0
    );

    // Overlay 1: "28 TỶ CHUYỂN HƯỚNG" (atMs: 11310 -> local 0.07s, holdMs: 2500 -> until 2.57s)
    tl.fromTo("#shot-1-label", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.07);
    tl.to("#shot-1-label", { y: -20, opacity: 0, duration: 0.3, ease: "power2.in" }, 2.57);

    // Overlay 2: Money Icon (atMs: 12600 -> local 1.36s, holdMs: 2000 -> until 3.36s)
    tl.fromTo("#shot-1-money-badge", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 1.36);
    tl.to("#shot-1-money-badge", { scale: 0.85, opacity: 0, duration: 0.3, ease: "power2.in" }, 3.36);

    /* ========================================================
       SHOT 2 (4.97s - 12.28s): MƯỢN DANH VAY HỘ?
       ======================================================== */
    // Full-frame Camera Motion: Scale 2.08x focused on bottom half (farmer with land title) with cinematic pan-left
    tl.fromTo(
      "#shot-2-img",
      { scale: 2.08, x: 50, transformOrigin: "50% 100%" },
      { scale: 2.14, x: -50, duration: 7.31, ease: "none" },
      4.97
    );

    // Overlay 1: Question Icon (atMs: 16210 -> local 4.97s, holdMs: 2200 -> until 7.17s)
    tl.fromTo("#shot-2-question-badge", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 4.97);
    tl.to("#shot-2-question-badge", { scale: 0.85, opacity: 0, duration: 0.3, ease: "power2.in" }, 7.17);

    // Overlay 2: "MƯỢN DANH VAY HỘ?" (atMs: 18570 -> local 7.33s, holdMs: 3000 -> until 10.33s)
    tl.fromTo("#shot-2-label", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 7.33);
    tl.to("#shot-2-label", { y: 20, opacity: 0, duration: 0.35, ease: "power2.in" }, 10.33);

    // Register Single Master Paused Timeline on HyperFrames Runtime
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s02"] = tl;
  </script>
