    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Standard HyperFrames clip full-frame container */
    .clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* Background grid pattern */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      background-image: 
        linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      background-position: -1px -1px;
      z-index: 1;
    }

    /* Camera viewports */
    .camera-frame {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: 50% 50%;
    }
    .camera-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Style tokens & contrast safe plates */
    .hf-plate-ink {
      background-color: #141414;
      border-radius: 12px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }

    /* Overlay containers */
    .overlay-layer {
      pointer-events: none;
      z-index: 20;
    }

    /* Editorial badge overlay */
    .badge-plate {
      position: absolute;
      top: 220px;
      left: 60px;
      padding: 20px 30px;
      max-width: 820px;
      border-left: 8px solid #FF6A1A;
      transform-origin: left center;
    }
    .badge-tag {
      background-color: #FF6A1A;
      color: #141414;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 12px;
    }
    .badge-title {
      color: #F7F4EC;
      font-weight: 900;
      font-size: 52px;
      line-height: 1.25;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    /* Icon badge plate */
    .icon-plate {
      position: absolute;
      top: 400px;
      left: 60px;
      padding: 14px 24px;
      display: inline-flex;
      align-items: center;
      gap: 16px;
      transform-origin: left center;
    }
    .vox-svg-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }
    .icon-caption {
      color: #F7F4EC;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Signature bottom brand bar */
    #brand-bottom-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s20" data-width="1080" data-height="1920" data-duration="13">
    <!-- Visual background grid -->

    <!-- SHOT 1: Thu gom sổ đỏ nông thôn (0.00s -> 6.95s) -->

      <div id="badge-1" class="badge-plate hf-plate-ink">
        <div class="badge-tag">HỒ SƠ NÔNG THÔN</div>
        <div class="badge-title">MÔI GIỚI THU GOM</div>
      </div>
    </div>

    <!-- Shot 1 - Overlay Icon: crowd (2.13s -> 4.33s) -->
    <div id="overlay-icon-1" class="clip overlay-layer" data-start="2.13" data-duration="2.2">
      <div id="icon-box-1" class="icon-plate hf-plate-ink">
        <svg class="vox-svg-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="20" r="8" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round"/>
          <path d="M18 48C18 40.268 24.268 34 32 34C39.732 34 46 40.268 46 48" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round"/>
          <circle cx="16" cy="24" r="6" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round"/>
          <path d="M6 48C6 42.477 10.477 38 16 38C19.345 38 22.288 39.645 24.084 42.17" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round"/>
          <circle cx="48" cy="24" r="6" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round"/>
          <path d="M39.916 42.17C41.712 39.645 44.655 38 48 38C53.523 38 58 42.477 58 48" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span class="icon-caption">TẬP TRUNG HỘ DÂN</span>
      </div>
    </div>

    <!-- SHOT 2: Chuyển cán bộ lập hợp đồng thế chấp (6.95s -> 13.00s) -->
    <div id="shot-2" class="clip" data-start="6.95" data-duration="6.05" style="z-index: 6;">
      <div id="camera-2" class="camera-frame" data-layout-allow-overflow="true" style="transform-origin: 50% 65%;">
        <img id="img-shot-2" src="assets/img-15-rural-land-deed-fraud.jpg" alt="Chuyển hồ sơ cán bộ tín dụng" data-layout-allow-overflow="true" />
      </div>
    </div>

    <!-- Shot 2 - Overlay Label: CHUYỂN CÁN BỘ TÍN DỤNG (7.56s -> 9.96s) -->
    <div id="overlay-label-2" class="clip overlay-layer" data-start="7.56" data-duration="2.4">
      <div id="badge-2" class="badge-plate hf-plate-ink">
        <div class="badge-tag">QUY TRÌNH HỢP THỨC HÓA</div>

        <svg class="vox-svg-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">

    <!-- Signature persistent orange bottom bar -->

  <script>
    const tl = gsap.timeline({ paused: true });

    // === SHOT 1 MOTION (0.00s -> 6.95s) ===
    // Wobble-drop entrance for Shot 1
    tl.fromTo("#camera-1",
      { y: -90, rotation: -2.2, opacity: 0 },
      { y: 0, rotation: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
      0
    );

    // Pan-left camera motion (pan from couple to documents)
    tl.fromTo("#img-shot-1",
      { x: 30, scale: 1.04 },
      { x: -35, scale: 1.08, duration: 6.25, ease: "sine.inOut" },
      0.7
    );

    // Overlay 1 - Label: MÔI GIỚI THU GOM (0.83s -> 3.33s)
    tl.fromTo("#badge-1",
      { x: -45, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      0.83
    );
    tl.to("#badge-1",
      { opacity: 0, x: -25, duration: 0.35, ease: "power2.in" },
      2.95
    );

    // Overlay 1 - Icon: crowd (2.13s -> 4.33s)
    tl.fromTo("#icon-box-1",
      { scale: 0.85, opacity: 0, y: 15 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      2.13
    );
    tl.to("#icon-box-1",
      { opacity: 0, y: -10, duration: 0.3, ease: "power2.in" },
      4.0
    );

    // === SHOT 2 MOTION (6.95s -> 13.00s) ===
    // Hard cut transition at 6.95s + Zoom-in camera motion focusing on contracts
    tl.fromTo("#img-shot-2",
      { scale: 1.08, y: 0 },
      { scale: 1.18, y: -30, duration: 6.05, ease: "sine.inOut" },
      6.95
    );

    // Overlay 2 - Label: CHUYỂN CÁN BỘ TÍN DỤNG (7.56s -> 9.96s)
    tl.fromTo("#badge-2",
      { x: -45, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      7.56
    );
    tl.to("#badge-2",
      { opacity: 0, x: -25, duration: 0.35, ease: "power2.in" },
      9.60
    );

    // Overlay 2 - Icon: doc (10.30s -> 12.30s)
    tl.fromTo("#icon-box-2",
      { scale: 0.85, opacity: 0, y: 15 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      10.3
    );
    tl.to("#icon-box-2",
      { opacity: 0, y: -10, duration: 0.3, ease: "power2.in" },
      12.0
    );

    // Register seekable timeline with HyperFrames
    window.__timelines["scene-s20"] = tl;
  </script>
