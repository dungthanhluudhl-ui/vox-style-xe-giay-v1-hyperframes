    <!-- Animation Orchestration GSAP -->
    <script>
      // Đảm bảo window.__timelines tồn tại
      window.__timelines = window.__timelines || {};

      // Setup đường vẽ SVG cho đồng hồ và sông
      const dial = document.getElementById("clock-dial");
      if (dial) {
        const dialLen = dial.getTotalLength();
        dial.style.strokeDasharray = dialLen;
        dial.style.strokeDashoffset = dialLen;
      }
      const river = document.getElementById("river-path");
      if (river) {
        const riverLen = river.getTotalLength();
        river.style.strokeDasharray = riverLen;
        river.style.strokeDashoffset = riverLen;
      }

      // Tạo timeline chính PAUSED
      const tl = gsap.timeline({ paused: true });

      // 1. Camera pan-left chuyển động nhẹ toàn cảnh (cameraMotion: pan-left)
      tl.fromTo(
        "#camera-frame",
        { x: 30 },
        { x: -30, duration: 7.26, ease: "none" },
        0
      );

      // 2. Entrance transition: flip thẻ hồ sơ (transitionIn: flip)
      tl.fromTo(
        "#archive-header",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.1
      );

      tl.fromTo(
        "#timeline-card",
        { rotationY: -75, opacity: 0, scale: 0.94, transformPerspective: 1200 },
        { rotationY: 0, opacity: 1, scale: 1, duration: 0.75, ease: "power3.out" },
        0.2
      );

      // 3. Clock overlay xuất hiện (atMs: 40700 -> 0.96s)
      // Vòng đồng hồ tự vẽ stroke + kim quay ngược thời gian
      tl.to(
        "#clock-dial",
        { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" },
        0.96
      );

      // Đặt tâm xoay kim đồng hồ tại trục (50px, 50px)
      gsap.set("#hour-hand, #minute-hand", {
        transformOrigin: "50px 50px"
      });

      tl.fromTo(
        "#minute-hand",
        { rotation: 0 },
        { rotation: -1080, duration: 2.2, ease: "power2.inOut" },
        0.96
      );

      tl.fromTo(
        "#hour-hand",
        { rotation: 0 },
        { rotation: -360, duration: 2.2, ease: "power2.inOut" },
        0.96
      );

      // Dòng chữ 2003-2004 xuất hiện đồng bộ
      tl.fromTo(
        "#year-headline",
        { scale: 0.85, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        1.1
      );

      tl.fromTo(
        "#rewind-badge",
        { x: -20, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.35
      );

      // Thước timeline hiển thị giai đoạn 2003 - 2004
      tl.fromTo(
        "#ruler-2003, #ruler-2004",
        { scale: 0.8, opacity: 0 },
        { scale: 1, opacity: 1, stagger: 0.2, duration: 0.5, ease: "power3.out" },
        1.5
      );
      tl.fromTo(
        "#ruler-segment",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.55, ease: "power2.out" },
        1.6
      );

      // 4. Card bản đồ xuất hiện từ phía dưới
      tl.fromTo(
        "#map-card",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        2.8
      );

      // Tuyến sông Sài Gòn tự vẽ dần
      tl.to(
        "#river-path",
        { strokeDashoffset: 0, duration: 1.1, ease: "power2.out" },
        3.0
      );

      // 5. Overlay Label: "TP. HỒ CHÍ MINH" (atMs: 43240 -> 3.50s)

        "#map-banner",
        { x: -40, opacity: 0, scale: 0.95 },
        { x: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        3.50

      // 6. Overlay Icon: "pin" ghim vị trí (atMs: 45500 -> 5.76s)

        "#pin-target",
        { y: -50, scale: 0, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        5.76
      );

      // Sóng radar lan tỏa từ mũi ghim

        "#pin-ripple",
        { scale: 0.2, opacity: 1 },
        { scale: 3, opacity: 0, duration: 0.85, ease: "power2.out" },
        5.95
      );

      // Đăng ký timeline cho HyperFrames
      window.__timelines["scene-s05"] = tl;
    </script>
