        riseStem.style.strokeDashoffset = stemLen;

        riseHead.style.strokeDasharray = headLen;
        riseHead.style.strokeDashoffset = headLen;

        2.99

      tl.fromTo(

        { scaleX: 0 },

      // 5. Label "+400 TRIỆU ĐỒNG" xuất hiện với lực đập dứt khoát tại t = 4.56s (203260ms)

        "#impact-card",
        { scale: 0.86, opacity: 0, y: 35 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
