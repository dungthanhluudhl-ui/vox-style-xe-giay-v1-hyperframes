    <script>
      /* 1. BUILD DETERMINISTIC DOM STRUCTURES BEFORE TIMELINE REGISTRATION */

      // A. Generate 40-slice donut pie paths
      const cx = 350;
      const cy = 350;
      const rIn = 126;
      const rOut = 296;
      const group12 = document.getElementById("slices-12");
      const group28 = document.getElementById("slices-28");

      for (let i = 0; i < 40; i++) {
        // Angles rotated -90 deg so slice 0 starts at 12 o'clock
        const a0 = ((i * 9 + 0.9) - 90) * Math.PI / 180;
        const a1 = (((i + 1) * 9 - 0.9) - 90) * Math.PI / 180;

        const x0In = (cx + rIn * Math.cos(a0)).toFixed(2);
        const y0In = (cy + rIn * Math.sin(a0)).toFixed(2);
        const x0Out = (cx + rOut * Math.cos(a0)).toFixed(2);
        const y0Out = (cy + rOut * Math.sin(a0)).toFixed(2);
        const x1Out = (cx + rOut * Math.cos(a1)).toFixed(2);
        const y1Out = (cy + rOut * Math.sin(a1)).toFixed(2);
        const x1In = (cx + rIn * Math.cos(a1)).toFixed(2);
        const y1In = (cy + rIn * Math.sin(a1)).toFixed(2);

        const d = "M " + x0In + " " + y0In + " L " + x0Out + " " + y0Out + " A " + rOut + " " + rOut + " 0 0 1 " + x1Out + " " + y1Out + " L " + x1In + " " + y1In + " A " + rIn + " " + rIn + " 0 0 0 " + x0In + " " + y0In + " Z";

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("class", "slice-item " + (i < 12 ? "slice-borrower" : "slice-other"));

        if (i < 12) {
          path.setAttribute("fill", "#FF6A1A");
          path.setAttribute("stroke", "#141414");
          path.setAttribute("stroke-width", "2.5");
          group12.appendChild(path);
        } else {
          path.setAttribute("fill", "#141414");
          path.setAttribute("stroke", "#E7E3D9");
          path.setAttribute("stroke-width", "2");
          group28.appendChild(path);
        }
      }

      // B. Generate 28 token bricks for Shot 2
      const tokenGrid = document.getElementById("token-grid-28");
      for (let j = 0; j < 28; j++) {
        const item = document.createElement("div");
        item.className = "token-item";
        item.textContent = String(j + 1);
        tokenGrid.appendChild(item);
      }

      // C. Pre-measure SVG dash patterns for draw reveals
      const warningTri = document.getElementById("warning-tri");
      warningTri.style.strokeDasharray = "320";
      warningTri.style.strokeDashoffset = "320";

      const flowPaths = document.querySelectorAll(".flow-arrow-path");
      flowPaths.forEach(function (p) {
        p.style.strokeDasharray = "140";
        p.style.strokeDashoffset = "140";
      });

      /* 2. COMPOSE DETERMINISTIC GSAP TIMELINE */
      const tl = gsap.timeline({ paused: true });

      // ==========================================
      // SHOT 1 CHOREOGRAPHY (t: 0s -> 6.11s)
      // ==========================================

      // Subtle documentary zoom on shot 1 stage
      tl.fromTo("#shot1-stage", { scale: 1 }, { scale: 1.05, duration: 6.11, ease: "none" }, 0);

      // Peel entrance of the 40-slice pie
      tl.fromTo(
        "#pie-container",
        { scale: 0.15, opacity: 0, rotation: -12 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.75, ease: "power3.out" },
        0.15
      );

      // Top category badge entrance
      tl.fromTo(
        "#shot1-top-tag",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.25
      );

      // Radial stagger reveal of the 40 slices
      tl.fromTo(
        ".slice-item",
        { scale: 0.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, stagger: 0.015, ease: "power2.out" },
        0.35
      );

      // Donut center counter pops in
      tl.fromTo(
        ".pie-center-content",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.95
      );

      // OVERLAY 1: Punch phrase "CHIẾC BÁNH 40 MIẾNG" (atMs: 226260 -> 2.22s)
      tl.fromTo(
        "#punch-shot1",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        2.22
      );
      tl.fromTo(
        "#punch-shot1 .punch-accent-bar",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "power2.out" },
        2.45
      );

      // OVERLAY 2: "DÂN ĂN CHƯA TỚI 12" & 12 slices separate outward (atMs: 228880 -> 4.84s)
