.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #F5F0E4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #F5F0E4;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Layout containers */
      #main-stage {
        position: absolute;
        top: 180px;
        left: 60px;
        right: 60px;
        bottom: 540px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
      }

      /* Top Warning Pill */
      #top-pill {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 10px 24px;
        background: #141414;
        border-radius: 8px;
        transform-origin: center center;
      }
      #top-pill-indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #FF6A1A;
      }
      #top-pill-text {
        font-size: 20px;
        font-weight: 700;
        color: #F7F4EC;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      /* Quote Card */
      #quote-card {
        position: relative;
        width: 100%;
        background: #E7E3D9;
        border: 3.5px solid #141414;
        border-radius: 16px;
        box-shadow: 8px 8px 0px #141414;
        padding: 44px 36px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transform-origin: center center;
      }
      #quote-card-header {
        font-size: 20px;
        font-weight: 700;
        color: #141414;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      #quote-content {
        position: relative;
        display: inline-block;
        padding: 8px 24px;
      }
      #quote-text {
        margin: 0;
        font-size: 86px;
        font-weight: 900;
        line-height: 1.15;
        color: #141414;
        text-align: center;
        letter-spacing: 2px;
        white-space: nowrap;
      }

      /* Strikethrough diagonal slash bar */
      #ban-slash {
        position: absolute;
        top: 50%;
        left: -16px;
        right: -16px;
        height: 14px;
        background: #FF6A1A;
        border: 2px solid #141414;
        border-radius: 4px;
        transform: translateY(-50%) rotate(-6deg);
        transform-origin: left center;
        pointer-events: none;
        box-shadow: 0 4px 0 #141414;
      }

      /* Ban Icon Badge */
      #ban-badge {
        position: absolute;
        top: -30px;
        right: -24px;
        width: 104px;
        height: 104px;
        background: #141414;
        border: 3.5px solid #FF6A1A;
        border-radius: 50%;
        box-shadow: 4px 4px 0px #141414;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: center center;
      }
      #ban-svg {
        width: 68px;
        height: 68px;
      }

      /* Punch Phrase Hero Card */
      #punch-card {
        width: 100%;
        background: #141414;
        border: 3.5px solid #FF6A1A;
        border-radius: 18px;
        box-shadow: 8px 8px 0px #FF6A1A;
        padding: 38px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transform-origin: center center;
      }
      #punch-subtext {
        font-size: 22px;
        font-weight: 700;
        color: #FF6A1A;
        letter-spacing: 3px;
        text-transform: uppercase;
      }
      #punch-text {
        margin: 0;
        font-size: 78px;
        font-weight: 900;
        line-height: 1.15;
        color: #F7F4EC;
        text-align: center;
        letter-spacing: 1px;
        white-space: nowrap;
        transform-origin: center center;
      }

      /* Label Badge */
      #label-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #FF6A1A;
        border: 3px solid #141414;
        border-radius: 999px;
        box-shadow: 5px 5px 0px #141414;
        padding: 16px 44px;
        transform-origin: center center;
      }
      #label-text {
        margin: 0;
        font-size: 30px;
        font-weight: 900;
        color: #141414;
        letter-spacing: 2px;
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* Fixed bottom orange signature bar */
      #bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s04"
      data-width="1080"
      data-height="1920"
      data-duration="7.69"
    >
      <section id="scene-s04" class="clip" data-start="0" data-duration="7.69">
        <div id="main-stage">
          <!-- Top Warning Tag -->
          <div id="top-pill">
            <span id="top-pill-indicator"></span>
            <span id="top-pill-text">CẢNH BÁO RỦI RO</span>
          </div>

          <!-- Quote Card with Wobble-Drop Entrance & Strikethrough -->
          <div id="quote-card">
            <div id="quote-card-header">LỜI HỨA CỬA MIỆNG</div>
            <div id="quote-content">
              <h2 id="quote-text">“YÊN TÂM ĐI”</h2>
              <div id="ban-slash"></div>
            </div>

            <!-- Self-Drawing Ban Icon Badge -->
            <div id="ban-badge">
              <svg id="ban-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle
                  id="ban-circle"
                  cx="50"
                  cy="50"
                  r="36"
                  stroke="#FF6A1A"
                  stroke-width="9"
                />
                <line
                  id="ban-line"
                  x1="25"
                  y1="25"
                  x2="75"
                  y2="75"
                  stroke="#FF6A1A"
                  stroke-width="9"
                  stroke-linecap="round"
                />
              </svg>
            </div>
          </div>

          <!-- Punch-Phrase Hero Card -->
          <div id="punch-card">
            <span id="punch-subtext">HÀNH ĐỘNG CẦN NHỚ</span>
            <h1 id="punch-text">ĐỪNG KÝ HỘ VAY</h1>
          </div>

          <!-- Supporting Label Badge -->
          <div id="label-badge">
            <span id="label-text">BẪY LỜI HỨA SUÔNG</span>
          </div>
        </div>

        <!-- Vox Style Bottom Bar -->
        <div id="bottom-bar"></div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Measure SVG path lengths for self-drawing ban icon
      const banCircle = document.getElementById("ban-circle");
      const banLine = document.getElementById("ban-line");
      const circleLen = banCircle.getTotalLength();
      const lineLen = banLine.getTotalLength();

      banCircle.style.strokeDasharray = circleLen;
      banCircle.style.strokeDashoffset = circleLen;
      banLine.style.strokeDasharray = lineLen;
      banLine.style.strokeDashoffset = lineLen;

      // Phase 1: Scene Entrance & Wobble-Drop for Quote Card (t = 0.20s - 1.10s)
      tl.fromTo(
        "#top-pill",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.20
      );

      tl.fromTo(
        "#quote-card",
        { y: -240, rotation: -6, opacity: 0, scale: 0.92 },
        { y: 0, rotation: 0, opacity: 1, scale: 1, duration: 0.65, ease: "power3.out" },
        0.30
      );

      // Wobble settle on the card
      tl.to("#quote-card", { rotation: 2, duration: 0.18, ease: "power1.inOut" }, 0.95);
      tl.to("#quote-card", { rotation: 0, duration: 0.22, ease: "power2.out" }, 1.13);

      // Phase 2: Ban Icon & Strikethrough Slash (Overlay 1: ban at 1.44s)
      tl.fromTo(
        "#ban-badge",
        { scale: 0, rotation: -60, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.42, ease: "power3.out" },
        1.44
      );

      // SVG path progressive drawing
      tl.to(
        banCircle,
        { strokeDashoffset: 0, duration: 0.40, ease: "power2.out" },
        1.48
      );
      tl.to(
        banLine,
        { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" },
        1.70
      );

      // Strikethrough bar slashes across "YÊN TÂM ĐI"
      tl.fromTo(
        "#ban-slash",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.35, ease: "power4.out" },
        1.62
      );

      // Quote card impact shake on strike
      tl.to("#quote-card", { x: -6, duration: 0.05, ease: "power1.inOut" }, 1.66);
      tl.to("#quote-card", { x: 6, duration: 0.05, ease: "power1.inOut" }, 1.71);
      tl.to("#quote-card", { x: -3, duration: 0.05, ease: "power1.inOut" }, 1.76);
      tl.to("#quote-card", { x: 0, duration: 0.06, ease: "power2.out" }, 1.81);

      // Phase 3: Punch-Phrase Arrival (Overlay 2: punch-phrase at 2.35s)
      tl.fromTo(
        "#punch-card",
        { y: 80, scale: 0.85, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.58, ease: "power3.out" },
        2.35
      );

      tl.fromTo(
        "#punch-text",
        { scale: 0.94 },
        { scale: 1, duration: 0.32, ease: "power2.out" },
        2.52
      );

      // Phase 4: Supporting Label Arrival (Overlay 3: label at 5.60s)
      tl.fromTo(
        "#label-badge",
        { y: 36, scale: 0.88, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.48, ease: "power3.out" },
        5.60
      );

      // Hold all elements cleanly until scene end (7.69s)
      window.__timelines["scene-s04"] = tl;
    </script>
  
    </template>
