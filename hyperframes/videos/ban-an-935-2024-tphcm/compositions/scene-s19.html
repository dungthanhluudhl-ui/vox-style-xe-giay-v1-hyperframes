    <!-- GSAP Choreography Script -->
    <script>
      // Khởi tạo timeline GSAP duy nhất theo HyperFrames contract
      const tl = gsap.timeline({ paused: true });

      // Đăng ký đúng key "scene-s19" trùng khớp data-composition-id
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s19"] = tl;

      // 1. TRANSITION IN: "strike" (0.0s - 0.3s)
      tl.fromTo(
        "#strike-overlay",
        { opacity: 0.85 },
        { opacity: 0, duration: 0.28, ease: "power2.out" },
        0
      );

      // Camera motion: Zoom-in nhẹ nhàng xuyên suốt 9.9s tăng độ kịch tính
      tl.fromTo(
        "#camera-container",
        { scale: 0.98, y: 12 },
        { scale: 1.04, y: -8, duration: 9.9, ease: "none" },
        0
      );

      // Header xuất hiện sắc bén
      tl.fromTo(
        "#header-badge",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.15
      );

      // Trụ cán cân hạ cánh vững chắc
      tl.fromTo(
        "#scale-base",
        { scaleY: 0, transformOrigin: "480px 750px", opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.55, ease: "power4.out" },
        0.15
      );

      // Thanh đòn cân xòe ra cân bằng ban đầu
      tl.fromTo(
        "#beam",
        { scaleX: 0, transformOrigin: "480px 440px", opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.3
      );

      // Hai đĩa cân rơi vào vị trí cân bằng
      tl.fromTo(
        "#left-pan",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.45
      );
      tl.fromTo(
        "#right-pan",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.45
      );

      // Ẩn ban đầu các thành phần overlay chưa tới mốc thời gian
      tl.set("#label-cash-flow", { opacity: 0, scale: 0.88, x: -30 }, 0);
      tl.set("#cash-flow-arrow", { opacity: 0 }, 0);
      tl.set("#punch-card", { opacity: 0, y: 40, scale: 0.94 }, 0);
      tl.set("#downward-force", { opacity: 0, scaleY: 0 }, 0);

      // 2. SCALE TILT (atMs: 154460 -> 2.36s): Cán cân nghiêng mạnh!
      // Clockwise rotation (+14 deg):
      // - Bên trái (Tiền) nhẹ bẫng vọt lên (y giảm 78px, x tăng 10px)
      // - Bên phải (Đất đai) đè nặng chìm xuống (y tăng 78px, x giảm 10px)
      tl.to(
        "#beam",
        {
          rotation: 14,
          transformOrigin: "480px 440px",
          duration: 1.25,
          ease: "power2.inOut",
        },
        2.36
      );

      tl.to(
        "#left-pan",
        {
          y: -78,
          x: 10,
          duration: 1.25,
          ease: "power2.inOut",
        },
        2.36
      );

      tl.to(
        "#right-pan",
        {
          y: 78,
          x: -10,
          duration: 1.25,
          ease: "power2.inOut",
        },
        2.36
      );

      // 3. LABEL XUẤT HIỆN (atMs: 156310 -> 4.21s): "RÚT TIỀN NGÂN HÀNG"
      // Mũi tên cam bay vút hướng về phía badge
      tl.to(
        "#cash-flow-arrow",
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        4.05
      );

      tl.fromTo(
        "#label-cash-flow",
        { opacity: 0, x: -30, scale: 0.88 },
        { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "power3.out" },
        4.21
      );

      // Rung nhẹ cọc tiền khi luồng tiền bị rút đi
      tl.fromTo(
        "#cash-bundle",
        { y: 0 },
        { y: -10, duration: 0.5, repeat: 1, yoyo: true, ease: "sine.inOut" },
        4.35
      );

      // 4. PUNCH PHRASE (atMs: 159030 -> 6.93s): "DÂN GÁNH ĐẤT ĐAI"
      // Cú đè quyết định: Cán cân nghiêng tối đa (+18 deg)
      tl.to(
        "#beam",
        {
          rotation: 18,
          transformOrigin: "480px 440px",
          duration: 0.35,
          ease: "power4.out",
        },
        6.85
      );
      tl.to(
        "#left-pan",
        {
          y: -100,
          x: 15,
          duration: 0.35,
          ease: "power4.out",
        },
        6.85
      );
      tl.to(
        "#right-pan",
        {
          y: 100,
          x: -15,
          duration: 0.35,
          ease: "power4.out",
        },
        6.85
      );

      // Mũi tên đè nặng xuất hiện dứt khoát
      tl.fromTo(
        "#downward-force",
        { opacity: 0, scaleY: 0, transformOrigin: "800px 640px" },
        { opacity: 1, scaleY: 1, duration: 0.3, ease: "power2.out" },
        6.88
      );

      // Thẻ Punch-phrase giáng xuống dứt khoát
      tl.fromTo(
        "#punch-card",
        { opacity: 0, y: 40, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
        6.93
      );

      // Rung nhẹ thẻ đất đai nhấn mạnh trọng lượng gánh nợ
      tl.fromTo(
        "#land-deed",
        { scale: 1 },
        { scale: 1.04, duration: 0.15, repeat: 1, yoyo: true, ease: "power2.out" },
        6.95
      );
    </script>
