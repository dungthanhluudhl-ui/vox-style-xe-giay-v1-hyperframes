  <script>
    // Chuẩn bị đường vẽ SVG icon rise
    const stem = document.getElementById("rise-arrow-stem");
    const head = document.getElementById("rise-arrow-head");
    if (stem && head) {
      const stemLen = stem.getTotalLength();
      const headLen = head.getTotalLength();
      stem.style.strokeDasharray = stemLen;
      stem.style.strokeDashoffset = stemLen;
      head.style.strokeDasharray = headLen;
      head.style.strokeDashoffset = headLen;
    }

    // Khởi tạo Timeline GSAP tất định, paused: true
    const tl = gsap.timeline({ paused: true });

    // Camera motion: pan-left nhẹ xuyên suốt cảnh (từ 0s đến 8.43s)
    tl.fromTo(
      "#camera-stage",
      { x: 20 },
      { x: -20, duration: 8.43, ease: "none" },
      0
    );

    // Transition In (unfold) - Cảnh mở ra từ trục tâm
    tl.fromTo(
      "#mechanism-tag",
      { opacity: 0, scaleX: 0.8 },
      { opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.out" },
      0.1
    );

    tl.fromTo(
      "#tag-line",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.5, ease: "power2.out" },
      0.25
    );

    // Cả 2 header cột xuất hiện đồng bộ ở đỉnh
    tl.fromTo(
      ".col-header",
      { opacity: 0, y: -20 },
      { opacity: 1, y: 0, duration: 0.5, stagger: 0.15, ease: "power3.out" },
      0.35
    );

    // Cột 1 và Chân cột 2 dựng lên từ đáy sàn
    tl.fromTo(
      "#pillar-left-body",
      { scaleY: 0, opacity: 0 },
      { scaleY: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
      0.5
    );

    tl.fromTo(
      "#inflated-base",
      { scaleY: 0, opacity: 0 },
      { scaleY: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
      0.6
    );

    // Đường dóng mốc giá trị tài sản thực tế và nhãn kẻ ngang sang
    tl.fromTo(
      "#benchmark-line",
      { scaleX: 0, opacity: 0 },
      { scaleX: 1, opacity: 1, duration: 0.55, ease: "power2.out" },
      1.0
    );

    tl.fromTo(
      "#benchmark-badge",
      { opacity: 0, y: 15 },
      { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      1.15
    );

    // TRỌNG TÂM: atMs: 124000 (tương đương 1.81s) -> Icon rise & Đội khống cột nợ
    // Khối hạn mức ảo vút mọc lên từ đỉnh cột đế, vượt qua mốc giá trị tài sản thực tế
    tl.fromTo(
      "#inflated-top",
      { scaleY: 0, opacity: 0 },
      { scaleY: 1, opacity: 1, duration: 0.85, ease: "power3.out" },
      1.81
    );

    // Icon rise xuất hiện và vẽ nét
    tl.fromTo(
      "#rise-icon",
      { scale: 0, opacity: 0, y: 25 },
      { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
      1.81
    );

    if (stem && head) {
      tl.to(
        "#rise-arrow-stem",
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        2.0
      );
      tl.to(
        "#rise-arrow-head",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        2.2
      );
    }

    // Nhịp nảy nhẹ báo hiệu sự kéo căng của hạn mức
    tl.to(
      "#rise-icon",
      { y: -12, duration: 0.35, ease: "power2.out" },
      2.4
    );
    tl.to(
      "#rise-icon",
      { y: 0, duration: 0.4, ease: "power2.inOut" },
      2.75
    );

    // TRỌNG TÂM: atMs: 127680 (tương đương 5.49s) -> Punch phrase "ĐỘI KHỐNG HẠN MỨC"
    tl.fromTo(
      "#punch-container",
      { scale: 0.8, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
      5.49
    );

    // Đăng ký timeline cho HyperFrames seek
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s15"] = tl;
  </script>
