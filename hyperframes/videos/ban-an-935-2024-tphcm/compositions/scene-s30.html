  <script>
    // GSAP Paused Timeline theo đúng chuẩn HyperFrames
    const tl = gsap.timeline({ paused: true });

    // Đăng ký timeline cho composition ID "scene-s30"
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s30"] = tl;

    // Thiết lập trạng thái ban đầu deterministic bằng gsap.set (không dùng relative values)
    gsap.set("#camera-rig", { scale: 1.06 });
    gsap.set("#top-badge", { y: -50, opacity: 0 });
    gsap.set("#flow-tag", { x: -60, opacity: 0 });
    gsap.set("#punch-box-top", { scale: 0, opacity: 0, y: -20 });
    gsap.set("#punch-box-bottom", { scale: 0, opacity: 0, y: 20 });
    gsap.set("#gate-lock", { scale: 1, opacity: 1 });
    gsap.set("#gate-left", { x: 0 });
    gsap.set("#gate-right", { x: 0 });
    gsap.set("#icon-ban-overlay", { scale: 0, opacity: 0 });

    // Hai cọc tiền ban đầu chờ sẵn ở vị trí trên cao
    gsap.set("#bundle-left", { y: -70, opacity: 0 });
    gsap.set("#bundle-right", { y: -70, opacity: 0 });

    // 1. GIAI ĐOẠN 0.0s - 0.7s: Transition in (Grow/Zoom-out) & Ổn định cảnh quan
    tl.to("#camera-rig", {
      scale: 1.0,
      duration: 6.0,
      ease: "sine.inOut"
    }, 0);

    tl.to("#top-badge", {
      y: 0,
      opacity: 1,
      duration: 0.45,
      ease: "power3.out"
    }, 0.15);

    tl.to("#flow-tag", {
      x: 0,
      opacity: 1,
      duration: 0.45,
      ease: "power3.out"
    }, 0.25);

    // Hai cọc tiền xuất hiện ở vị trí chờ (Y: 520px / 550px)
    tl.to("#bundle-left", {
      y: 0,
      opacity: 1,
      duration: 0.5,
      ease: "power2.out"
    }, 0.3);

    tl.to("#bundle-right", {
      y: 0,
      opacity: 1,
      duration: 0.5,
      ease: "power2.out"
    }, 0.4);

    // 2. GIAI ĐOẠN 0.7s - 1.4s: HÀNG RÀO BỊ BUNG MỞ TOANG (Narrative reversal)
    // Phá vỡ chốt khóa trung tâm
    tl.to("#gate-lock", {
      scale: 1.5,
      opacity: 0,
      duration: 0.25,
      ease: "power4.in"
    }, 0.7);

    // Cánh cổng mở toác sang 2 bên biên mép màn hình (dạt xa khỏi luồng di chuyển của tiền)
    tl.to("#gate-left", {
      x: -380,
      duration: 0.65,
      ease: "power3.out"
    }, 0.75);

    tl.to("#gate-right", {
      x: 380,
      duration: 0.65,
      ease: "power3.out"
    }, 0.75);

    // 3. GIAI ĐOẠN 1.04s - 3.24s: OVERLAY 1 - ICON "BAN" XUẤT HIỆN (atMs: 269040, hold: 2200ms)
    tl.to("#icon-ban-overlay", {
      scale: 1.0,
      opacity: 1,
      duration: 0.38,
      ease: "power3.out"
    }, 1.04);

    // Rung cảnh báo nhẹ
    tl.to("#icon-ban-overlay", {
      rotation: -5,
      duration: 0.12,
      ease: "sine.inOut"
    }, 1.42);
    tl.to("#icon-ban-overlay", {
      rotation: 5,
      duration: 0.12,
      ease: "sine.inOut"
    }, 1.54);
    tl.to("#icon-ban-overlay", {
      rotation: 0,
      duration: 0.12,
      ease: "sine.inOut"
    }, 1.66);

    // Dòng tiền ồ ạt chảy qua rào chắn đã mở toang (Xuống vùng an toàn: y: 860px & 930px)
    // Hoàn toàn nằm ngoài tầm che khuất của cánh cổng đã dạt sang hai bên
    tl.to("#bundle-left", {
      y: 340,
      duration: 1.4,
      ease: "power2.inOut"
    }, 0.95);

    tl.to("#bundle-right", {
      y: 380,
      duration: 1.5,
      ease: "power2.inOut"
    }, 1.05);

    // 4. GIAI ĐOẠN 2.11s: OVERLAY 2 - PUNCH-PHRASE "MỞ TOANG RÀO CẢN" (atMs: 270110, hold: 2800ms)

      scale: 1.0,
      opacity: 1,
      y: 0,
      duration: 0.42,
      ease: "power4.out"
    }, 2.11);

    tl.to("#punch-box-bottom", {
      scale: 1.0,
      opacity: 1,
      y: 0,
      duration: 0.45,
      ease: "power4.out"
    }, 2.23);

    // Icon BAN kết thúc hiển thị lúc 3.24s (1.04s + 2.2s)
    tl.to("#icon-ban-overlay", {
      scale: 0.7,
      opacity: 0,
      duration: 0.32,
      ease: "power2.in"
    }, 3.24);

    // 5. GIAI ĐOẠN 3.3s - 5.5s: Nhịp thở sống động (Breathing)
    tl.to("#bundle-left", {
      y: 355,
      duration: 1.6,
      ease: "sine.out"
    }, 3.2);

    tl.to("#bundle-right", {
      y: 395,
      duration: 1.6,
      ease: "sine.out"

    // 6. GIAI ĐOẠN 5.0s - 6.0s: Giữ yên tĩnh trước khi chuyển cảnh
