  <script>
    // 1. Build the 83 Shell Icons dynamically into the SVG grid
    const svgGrid = document.getElementById("matrix-svg");
    const cols = 10;
    const totalShells = 83;
    const colStep = 89;
    const rowStep = 22;

    let nodesHtml = "";
    for (let i = 0; i < totalShells; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = 8 + col * colStep;
      const y = 8 + row * rowStep;

      // Stylized dossier folder icon (outline + dark top tab + orange line)
      nodesHtml += `
        <g class="shell-node" id="sn-${i}" transform="translate(${x}, ${y})">
          <rect x="0" y="3" width="76" height="18" rx="3" fill="#E7E3D9" stroke="#141414" stroke-width="1.8" />
          <path d="M 0 3 L 0 0 L 22 0 L 26 3 Z" fill="#141414" />
          <line x1="30" y1="9" x2="68" y2="9" stroke="#FF6A1A" stroke-width="2" />
          <line x1="30" y1="14" x2="56" y2="14" stroke="rgba(20,20,20,0.4)" stroke-width="1.5" />
        </g>
      `;
    }
    svgGrid.innerHTML = nodesHtml;

    // Setup crowd icon path lengths for stroke-draw animation
    document.querySelectorAll(".crowd-path").forEach((p) => {
      const len = p.getTotalLength();
      p.style.strokeDasharray = `${len}`;
      p.style.strokeDashoffset = `${len}`;
    });

    // 2. Build the Main Paused GSAP Timeline (Seek-Safe & Deterministic)
    const tl = gsap.timeline({ paused: true });

    // Phase 1: Punch Entrance of Scene (0.0s - 0.45s)
    tl.fromTo(
      "#scene-content",
      { scale: 1.08, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.45, ease: "power4.out" },
      0
    );

    // Subtle documentary camera zoom-in during the shot
    tl.to(
      "#scene-content",
      { scale: 1.03, duration: 7.0, ease: "sine.inOut" },
      0.8
    );

    // Chart grid rules draw in
    tl.fromTo(
      ".chart-rule",
      { scaleX: 0, transformOrigin: "0% 50%" },
      { scaleX: 1, duration: 0.5, stagger: 0.08, ease: "power2.out" },
      0.15
    );
    tl.fromTo(
      ".chart-tick",
      { scaleX: 0, transformOrigin: "0% 50%" },
      { scaleX: 1, duration: 0.3, stagger: 0.06, ease: "power2.out" },
      0.3
    );

    // Case Tag reveals
    tl.fromTo(
      "#case-tag",
      { y: -25, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      0.35
    );

    // Counter block arrives
    tl.fromTo(
      "#counter-group",
      { x: -30, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      0.55
    );

    // Overlay 1: Crowd Icon reveals atMs: 443220 (offset: 0.98s)
    tl.fromTo(
      "#crowd-icon-box",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      0.98
    );
    tl.to(
      ".crowd-path",
      { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
      1.05
    );

    // Matrix panel frame arrives
    tl.fromTo(
      "#matrix-panel",
      { y: 30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      1.0
    );

    // Staggered population of 83 Shell Nodes (1.15s .. 1.75s)
    tl.fromTo(
      ".shell-node",
      { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
      { scale: 1, opacity: 1, duration: 0.18, stagger: 0.007, ease: "power2.out" },
      1.15
    );

    // Overlay 2: Label "83 CHIẾC VỎ BỌC" stamp punches in atMs: 444150 (offset: 1.91s)
    tl.fromTo(
      "#stamp-label",
      { scale: 1.35, opacity: 0, rotation: -4 },
      { scale: 1, opacity: 1, rotation: 0, duration: 0.35, ease: "power4.out" },
      1.91
    );

    // Phase 2: Conduit & Pipeline activates (2.4s .. 3.5s)
    tl.fromTo(
      "#conduit-box",
      { opacity: 0, y: 15 },
      { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      2.4
    );
    tl.fromTo(
      "#conduit-badge",
      { scale: 0.8, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      2.65
    );
    tl.fromTo(
      ".cash-node",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.3, stagger: 0.15, ease: "power3.out" },
      2.85
    );

    // Continuous seek-safe liquid stream pulse along the conduit (deterministic single tween)
    tl.fromTo(
      ".pipe-stream",
      { strokeDashoffset: 200 },
      { strokeDashoffset: -400, duration: 5.0, ease: "none" },
      2.8
    );

    // Phase 3: Climax Punch-Phrase "28 TỶ CHẢY SAI NGƯỜI" atMs: 446980 (offset: 4.74s)
    tl.fromTo(
      "#punch-card",
      { scale: 0.92, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power4.out" },
      4.74
    );

    tl.fromTo(
      "#punch-badge",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
      5.05
    );

    // 3. Register Timeline to HyperFrames Runtime
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s49"] = tl;
  </script>
