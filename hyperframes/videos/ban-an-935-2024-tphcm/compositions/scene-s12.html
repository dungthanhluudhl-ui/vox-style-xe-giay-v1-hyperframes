        slashEl.style.strokeDashoffset = `${sLen}`;

      // Khởi tạo GSAP Timeline chính (seekable, paused)
      const tl = gsap.timeline({ paused: true });

      // 1. Camera Motion: zoom-out chậm xuyên suốt 9.46s

        "#camera-rig",
        { scale: 1.05 },
        { scale: 1.0, duration: 9.46, ease: "none" },
        0
      );

      // 2. Transition In "strike": Hồ sơ phát mại dập mạnh từ trên xuống

        "#document-card",
        { y: -160, scale: 1.1, opacity: 0 },

      );

      // 3. Overlay Icon Ban (atMs: 97730 -> rel 1.63s)

        "#ban-badge",
        { scale: 0, opacity: 0, rotation: -40 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.35, ease: "power3.out" },
        1.63

      // Nét vẽ đường tròn & gạch chéo của icon ban
      tl.to(
        "#ban-circle",
        { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" },
        1.85
      );
      tl.to(
        "#ban-slash",
        { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" },
        2.08
      );

        { scale: 2.2, opacity: 0, rotation: -20 },
        { scale: 1, opacity: 1, rotation: -6, duration: 0.22, ease: "power4.in" },
        2.30

        { scale: 0.6, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.32, ease: "power3.out" },
        3.77

      tl.fromTo(

        { scale: 2.2, opacity: 0, rotation: 20 },
