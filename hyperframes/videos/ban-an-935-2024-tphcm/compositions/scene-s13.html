      const tl = gsap.timeline({ paused: true });

      // Measure all SVG paths to prepare stroke-draw animation

        p.style.strokeDashoffset = len;

        riseLine.style.strokeDashoffset = rLen;

      // Camera slow zoom-in

        ".camera-frame",

        { scale: 1.05, duration: 5.47, ease: "none" },
        0

      // Header block entrance

        "#header-block",
        { opacity: 0, y: -24 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        0.1
      );

      // Wobble-drop entrance for root card (0.15s - 0.75s)
      tl.fromTo(
        "#root-card",
        { y: -180, scale: 0.85, opacity: 0, rotation: -6 },
        { y: 0, scale: 1, opacity: 1, rotation: 0, duration: 0.55, ease: "power3.out" },
        0.15
      );
      // Subtle organic settle wobble
      tl.to("#root-card", { rotation: 2.5, duration: 0.12, ease: "sine.inOut" }, 0.55);
      tl.to("#root-card", { rotation: 0, duration: 0.18, ease: "sine.out" }, 0.67);

      // Primary branch lines self-draw (0.65s - 1.25s)

      tl.to("#path-center", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 0.72);
      tl.to("#path-right", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 0.78);

      // Level 2 branch cards pop in (0.95s - 1.35s)
      tl.fromTo(
        ".branch-node",
        { scale: 0, opacity: 0, y: -16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, stagger: 0.1, ease: "power3.out" },
        0.95
      );

      // Sub-connectors self-draw down to matrix card (1.2s - 1.6s)
      tl.to("#path-sub-left", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.2);
      tl.to("#path-sub-center", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 1.25);
      tl.to("#path-sub-right", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.3);

      // Level 3 Matrix card appearance (1.35s)

        "#matrix-card",
        { opacity: 0, y: 25 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.35
      );

      // Overlay 1: Icon "rise" entrance (specified at 106930ms -> 1.37s)
      tl.fromTo(
        "#icon-rise-wrapper",
        { scale: 0, opacity: 0, rotation: -12 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: "power3.out" },
        1.37
      );
      tl.to(
        "#rise-line",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        1.55
      );
      tl.fromTo(
        "#rise-head",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.2, ease: "power2.out" },
        1.85
      );

      // Matrix items stagger pop (1.55s)
      tl.fromTo(
        ".matrix-item",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.3, stagger: 0.08, ease: "power2.out" },

      );

      tl.fromTo(
