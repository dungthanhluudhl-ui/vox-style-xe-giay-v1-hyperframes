    // Build single seekable, deterministic paused GSAP timeline
    const tl = gsap.timeline({ paused: true });

    // 1. Initial State Setup
    gsap.set("#camera-rig", { scale: 1.05 });
    gsap.set("#hero-document", { scale: 1.15, opacity: 0, y: -40, rotation: 0 });
    gsap.set("#stamp-mark", { scale: 2.4, opacity: 0, rotation: -24 });
    gsap.set("#punch-card", { scale: 0.82, opacity: 0, y: 35 });

    // 2. Entrance Animation: Strike down the legal document (0.1s -> 0.5s)
    tl.to("#hero-document", {
      scale: 1,
      opacity: 1,
      y: 0,
      duration: 0.42,
      ease: "power3.out"
    }, 0.1);

    // 3. Continuous Camera zoom-out (0s -> 5.56s)
    tl.to("#camera-rig", {
      scale: 1.0,
      duration: 5.56,
      ease: "sine.out"
    }, 0);

    // 4. Strike down the "BÁC KHÁNG CÁO" stamp at atMs: 385500 (offset: 1.07s)
    tl.to("#stamp-mark", {
      scale: 1,
      opacity: 1,
      rotation: -8,
      duration: 0.22,
      ease: "power4.in"
    }, 1.07);

    // Document shake/recoil impact immediately on stamp strike (1.29s -> 1.5s)
    tl.to("#hero-document", {
      y: 12,
      rotation: 0.6,
      duration: 0.08,
      ease: "power2.out"
    }, 1.29);
    tl.to("#hero-document", {
      y: 0,
      rotation: 0,
      duration: 0.18,
      ease: "power2.inOut"
    }, 1.37);

    // 5. Punch phrase reveal: "Y ÁN 7 NĂM TÙ" at atMs: 387600 (offset: 3.17s)
    tl.to("#punch-card", {
      scale: 1,
      opacity: 1,
      y: 0,
      duration: 0.38,
      ease: "power3.out"
    }, 3.17);

    // 6. Subtle secondary ambient breathing from 1.6s to 5.56s (finite loop)
    tl.to("#hero-document", {
      rotation: -0.4,
      duration: 1.9,
      ease: "sine.inOut",
      yoyo: true,
      repeat: 1
    }, 1.6);
