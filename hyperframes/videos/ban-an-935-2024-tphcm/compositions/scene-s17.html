<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Base typography helper classes */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
      .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
      .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
      .hf-plate-paper { background-color: #E7E3D9; color: #141414; }

      /* Chart Background Variant (STYLE_DNA.md) */
      .chart-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .chart-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: rgba(20, 20, 20, 0.22);
      }
      .chart-tick {
        position: absolute;
        left: 0;
        width: 24px;
        height: 5px;
        background: #FF6A1A;
      }

      /* Signature bottom orange bar */
      .bottom-brand-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 100;
      }

      /* Camera pan container */
      #camera-stage {
        position: absolute;
        inset: 0;
        will-change: transform;
      }

      /* Entrance peel wrapper */
      #peel-wrapper {
        position: absolute;
        inset: 0;
        transform-origin: top left;
        will-change: transform, clip-path;
      }

      /* 1. Header Box - 400 Triệu */
      .source-node {
        position: absolute;
        top: 210px;
        left: 140px;
        width: 800px;
        background: #141414;
        border: 4px solid #141414;
        border-radius: 8px;
        padding: 24px 32px;
        box-shadow: 10px 10px 0px rgba(20, 20, 20, 0.2);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 20;
        transform-origin: 50% 50%;
      }
      .source-badge {
        display: inline-block;
        background: #FF6A1A;
        color: #141414;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 2px;
        padding: 6px 18px;
        border-radius: 4px;
        margin-bottom: 12px;
        text-transform: uppercase;
      }
      .source-title {
        color: #F7F4EC;
        font-size: 30px;
        font-weight: 700;
        margin: 0;
        line-height: 1.2;
      }
      .source-amount {
        color: #FF6A1A;
        font-size: 76px;
        font-weight: 900;
        margin: 4px 0 0 0;
        line-height: 1.1;
        letter-spacing: -1px;
      }

      /* 2. SVG Flow Lines */
      .flow-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        z-index: 10;
        pointer-events: none;
      }
      .flow-path-trunk {
        fill: none;
        stroke: #141414;
        stroke-width: 44;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .flow-path-citizen {
        fill: none;
        stroke: #141414;
        stroke-width: 16;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .flow-path-divert {
        fill: none;
        stroke: #FF6A1A;
        stroke-width: 42;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .flow-dash-divert {
        fill: none;
        stroke: #141414;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-dasharray: 20 28;
      }

      /* 3. Icon Money Badge */
      #money-icon-badge {
        position: absolute;
        top: 555px;
        left: 540px;
        width: 104px;
        height: 104px;
        margin-left: -52px;
        margin-top: -52px;
        background: #FF6A1A;
        border: 5px solid #141414;
        border-radius: 50%;
        display: grid;
        place-items: center;
        box-shadow: 6px 6px 0px #141414;
        z-index: 30;
        transform-origin: 50% 50%;
      }
      .pulse-ring {
        position: absolute;
        inset: -14px;
        border: 4px solid #FF6A1A;
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
      }

      /* 4. Destination Cards */
      /* Branch Citizen: 100 Triệu */
      #card-citizen {
        position: absolute;
        top: 760px;
        left: 60px;
        width: 440px;
        background: #F5F0E4;
        border: 5px solid #141414;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 8px 8px 0px #141414;
        z-index: 25;
        transform-origin: 50% 50%;
      }
      .card-tag-citizen {
        display: inline-block;
        background: #141414;
        color: #F7F4EC;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 1.5px;
        padding: 6px 14px;
        border-radius: 4px;
        margin-bottom: 14px;
        text-transform: uppercase;
      }
      .card-title-citizen {
        color: #141414;
        font-size: 32px;
        font-weight: 700;
        margin: 0;
        line-height: 1.2;
      }
      .card-val-citizen {
        color: #141414;
        font-size: 64px;
        font-weight: 900;
        margin: 8px 0;
        line-height: 1;
        letter-spacing: -1px;
      }
      .card-note-citizen {
        color: #141414;
        font-size: 22px;
        font-weight: 700;
        margin-top: 10px;
        line-height: 1.3;
      }

      /* Branch Diverted: 300 Triệu */
      #card-divert {
        position: absolute;
        top: 760px;
        left: 540px;
        width: 480px;
        background: #141414;
        border: 5px solid #FF6A1A;
        border-radius: 8px;
        padding: 26px;
        box-shadow: 10px 10px 0px #FF6A1A;
        z-index: 25;
        transform-origin: 50% 50%;
      }
      .card-tag-divert {
        display: inline-block;
        background: #FF6A1A;
        color: #141414;
        font-weight: 900;
        font-size: 20px;
        letter-spacing: 1.5px;
        padding: 6px 14px;
        border-radius: 4px;
        margin-bottom: 14px;
        text-transform: uppercase;
      }
      .card-title-divert {
        color: #F7F4EC;
        font-size: 32px;
        font-weight: 900;
        margin: 0;
        line-height: 1.2;
      }
      .card-val-divert {
        color: #FF6A1A;
        font-size: 72px;
        font-weight: 900;
        margin: 8px 0;
        line-height: 1;
        letter-spacing: -1px;
      }
      .card-pill-divert {
        display: inline-block;
        background: #FF6A1A;
        color: #141414;
        font-weight: 900;
        font-size: 22px;
        padding: 6px 14px;
        border-radius: 4px;
        margin-top: 12px;
      }

      /* 5. Bar Scale Comparison (Safe zone safe) */
      #ratio-bar-container {
        position: absolute;
        top: 1210px;
        left: 60px;
        width: 960px;
        height: 84px;
        background: #E7E3D9;
        border: 4px solid #141414;
        border-radius: 6px;
        display: flex;
        overflow: hidden;
        box-shadow: 6px 6px 0px #141414;
        z-index: 20;
        transform-origin: left center;
      }
      .ratio-segment-citizen {
        width: 25%;
        height: 100%;
        background: #141414;
        color: #F7F4EC;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 0.5px;
        border-right: 4px solid #E7E3D9;
      }
      .ratio-segment-divert {
        width: 75%;
        height: 100%;
        background: #FF6A1A;
        color: #141414;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 26px;
        letter-spacing: 1px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s17"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="5.69"
    >
      <!-- Single primary scene clip -->
      <div id="scene-s17" class="clip" data-start="0" data-duration="5.69">

        <!-- Chart background lines & ticks -->
        <div class="chart-bg">
          <div class="chart-line" style="top: 384px;"></div>
          <div class="chart-tick" style="top: 382px;"></div>

          <div class="chart-line" style="top: 768px;"></div>
          <div class="chart-tick" style="top: 766px;"></div>

          <div class="chart-line" style="top: 1152px;"></div>
          <div class="chart-tick" style="top: 1150px;"></div>

          <div class="chart-line" style="top: 1536px;"></div>
          <div class="chart-tick" style="top: 1534px;"></div>
        </div>

        <!-- Camera Stage for subtle Pan-Right motion -->
        <div id="camera-stage">
          <!-- Entrance Peel Wrapper -->
          <div id="peel-wrapper">

            <!-- Source Node: 400 Triệu -->
            <div id="source-box" class="source-node">
              <div class="source-badge">KHOẢN VAY ĐỨNG TÊN</div>
              <p class="source-title">TỔNG GIẢI NGÂN</p>
              <h1 class="source-amount">400 TRIỆU</h1>
            </div>

            <!-- SVG Flow lines -->
            <svg class="flow-canvas" viewBox="0 0 1080 1920">
              <!-- Trunk path: 400tr down to split fork -->
              <path id="path-trunk" class="flow-path-trunk" d="M 540 420 L 540 550" />

              <!-- Branch Left: 100tr to Citizen -->
              <path id="path-citizen" class="flow-path-citizen" d="M 540 550 C 540 640, 280 640, 280 750" />

              <!-- Branch Right: 300tr Diverted -->
              <path id="path-divert" class="flow-path-divert" d="M 540 550 C 540 650, 780 640, 780 750" />
              <!-- Divert flow animation dashes -->
              <path id="path-divert-dash" class="flow-dash-divert" d="M 540 550 C 540 650, 780 640, 780 750" />
            </svg>

            <!-- Money Icon Badge at Fork Center -->
            <div id="money-icon-badge">
              <div id="pulse-ring-el" class="pulse-ring"></div>
              <svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Vox icon vocabulary: money -->
                <rect x="6" y="14" width="48" height="32" rx="3" fill="#141414" stroke="#141414" stroke-width="2" />
                <rect x="10" y="18" width="40" height="24" rx="2" fill="#FF6A1A" />
                <circle cx="30" cy="30" r="7" stroke="#141414" stroke-width="4" fill="none" />
                <path d="M 16 30 L 20 30 M 40 30 L 44 30" stroke="#141414" stroke-width="3" stroke-linecap="round" />
              </svg>
            </div>

            <!-- Left Destination: DÂN NHẬN 100 TRIỆU -->
            <div id="card-citizen">
              <span class="card-tag-citizen">NGƯỜI ĐỨNG TÊN</span>
              <p class="card-title-citizen">DÂN NHẬN</p>
              <h2 class="card-val-citizen">100 TRIỆU</h2>
              <div class="card-note-citizen">Đúng số tiền họ cần</div>
            </div>

            <!-- Right Destination: CHÊNH LỆCH 300 TRIỆU -->
            <div id="card-divert">
              <span class="card-tag-divert">KHOẢN BỊ CHIẾM DỤNG</span>
              <p class="card-title-divert">CHÊNH LỆCH</p>
              <h2 class="card-val-divert">300 TRIỆU</h2>
              <div class="card-pill-divert">CHẠY SANG TAY KẺ KHÁC</div>
            </div>

            <!-- Visual Bar Scale: 100 Triệu vs 300 Triệu -->
            <div id="ratio-bar-container">
              <div class="ratio-segment-citizen">100 TRIỆU</div>
              <div class="ratio-segment-divert">300 TRIỆU CHÊNH LỆCH</div>
            </div>

          </div>
        </div>

        <!-- Fixed bottom brand bar (never panned) -->
        <div class="bottom-brand-bar"></div>
      </div>
    </div>

    <script>
      // 1. Initialize stroke lengths deterministically
      const trunkPath = document.getElementById("path-trunk");
      const citizenPath = document.getElementById("path-citizen");
      const divertPath = document.getElementById("path-divert");
      const divertDashPath = document.getElementById("path-divert-dash");

      const trunkLen = trunkPath.getTotalLength();
      const citizenLen = citizenPath.getTotalLength();
      const divertLen = divertPath.getTotalLength();

      trunkPath.style.strokeDasharray = trunkLen;
      trunkPath.style.strokeDashoffset = trunkLen;

      citizenPath.style.strokeDasharray = citizenLen;
      citizenPath.style.strokeDashoffset = citizenLen;

      divertPath.style.strokeDasharray = divertLen;
      divertPath.style.strokeDashoffset = divertLen;

      // 2. Setup GSAP Paused Timeline
      const tl = gsap.timeline({ paused: true });

      // Camera motion: pan-right across shot (from x: 15 to x: -20)
      tl.fromTo(
        "#camera-stage",
        { x: 15 },
        { x: -20, duration: 5.69, ease: "none" },
        0
      );

      // Entrance animation: "peel" (curl unmask + subtle paper drop)
      tl.fromTo(
        "#peel-wrapper",
        {
          clipPath: "polygon(0% 0%, 100% 0%, 100% 0%, 0% 0%)",
          rotation: -1.5,
          y: -30,
          opacity: 0.2
        },
        {
          clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)",
          rotation: 0,
          y: 0,
          opacity: 1,
          duration: 0.65,
          ease: "power3.out"
        },
        0
      );

      // Source Box entrance (at 0.15s)
      tl.fromTo(
        "#source-box",
        { scale: 0.8, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.15
      );

      // Draw Trunk line down to fork node
      tl.to(
        trunkPath,
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        0.35
      );

      // Shotlist Overlay 1: "DÂN NHẬN 100 TRIỆU" atMs: 137390 (t = 0.79s)
      // Branch draws to left
      tl.to(
        citizenPath,
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        0.7
      );
      // Card "DÂN NHẬN 100 TRIỆU" pops in at exactly 0.79s
      tl.fromTo(
        "#card-citizen",
        { scale: 0.75, opacity: 0, x: -35 },
        { scale: 1, opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
        0.79
      );

      // Shotlist Overlay 2: icon "money" atMs: 139290 (t = 2.69s)
      // Pop icon at split node
      tl.fromTo(
        "#money-icon-badge",
        { scale: 0, opacity: 0, rotation: -60 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "back.out(1.6)" },
        2.69
      );
      // Pulse ring expansion
      tl.fromTo(
        "#pulse-ring-el",
        { scale: 0.8, opacity: 0.9 },
        { scale: 1.5, opacity: 0, duration: 0.6, ease: "power2.out" },
        2.85
      );

      // Shotlist Overlay 3: "CHÊNH LỆCH 300 TRIỆU" atMs: 140420 (t = 3.82s)
      // Main divert flow path draws with thick energetic stroke
      tl.to(
        divertPath,
        { strokeDashoffset: 0, duration: 0.45, ease: "power3.out" },
        3.5
      );
      // Card "CHÊNH LỆCH 300 TRIỆU" strikes down firmly at 3.82s
      tl.fromTo(
        "#card-divert",
        { scale: 0.8, opacity: 0, x: 45 },
        { scale: 1, opacity: 1, x: 0, duration: 0.48, ease: "power4.out" },
        3.82
      );

      // Divert dash flow movement
      tl.fromTo(
        divertDashPath,
        { strokeDashoffset: 60, opacity: 0 },
        { strokeDashoffset: 0, opacity: 1, duration: 1.2, ease: "none" },
        3.82
      );

      // Ratio bar reveal at the bottom
      tl.fromTo(
        "#ratio-bar-container",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        4.0
      );

      // Continuous subtle attention pulse on the 300tr box toward scene end
      tl.to(
        "#card-divert",
        { boxShadow: "14px 14px 0px #FF6A1A", duration: 0.6, ease: "sine.inOut" },
        4.4
      );

      // Register the paused timeline with HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s17"] = tl;
    </script>
  
    </template>
  </body>
</html>
