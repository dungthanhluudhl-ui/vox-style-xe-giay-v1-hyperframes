<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Viewport root */
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }

      /* Timed clip conventions */
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Helper contrast plates */
      .hf-plate-ink {
        background-color: #141414;
        color: #f7f4ec;
      }
      .hf-text-ink {
        color: #141414;
      }
      .hf-text-light {
        color: #f7f4ec;
      }
      .hf-hl-orange {
        background-color: #ff6a1a;
        color: #141414;
      }

      /* Persistent Brand Bottom Bar */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 100;
      }

      /* Scene archival tag */
      .scene-kicker-tag {
        position: absolute;
        top: 172px;
        left: 60px;
        height: 42px;
        padding: 0 18px;
        display: flex;
        align-items: center;
        background-color: #141414;
        color: #f7f4ec;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        border-left: 6px solid #ff6a1a;
        z-index: 50;
      }

      /* Central Hero Photo Frame */
      .photo-frame {
        position: absolute;
        top: 240px;
        left: 60px;
        width: 960px;
        height: 1040px;
        background-color: #141414;
        border: 4px solid #141414;
        overflow: hidden;
        box-shadow: 0 24px 48px rgba(20, 20, 20, 0.28);
      }

      .photo-frame img {
        display: block;
        position: absolute;
        width: 960px;
        height: 1720px;
        object-fit: cover;
      }

      /* Corner archival brackets */
      .corner-bracket {
        position: absolute;
        width: 24px;
        height: 24px;
        z-index: 20;
        pointer-events: none;
      }
      .cb-top-left {
        top: 12px;
        left: 12px;
        border-top: 4px solid #ff6a1a;
        border-left: 4px solid #ff6a1a;
      }
      .cb-top-right {
        top: 12px;
        right: 12px;
        border-top: 4px solid #ff6a1a;
        border-right: 4px solid #ff6a1a;
      }
      .cb-bottom-left {
        bottom: 12px;
        left: 12px;
        border-bottom: 4px solid #ff6a1a;
        border-left: 4px solid #ff6a1a;
      }
      .cb-bottom-right {
        bottom: 12px;
        right: 12px;
        border-bottom: 4px solid #ff6a1a;
        border-right: 4px solid #ff6a1a;
      }

      /* Shot 1: Ban Icon Badge */
      #shot1-ban-badge {
        position: absolute;
        top: 580px;
        left: 390px;
        width: 300px;
        height: 300px;
        background-color: #141414;
        border: 5px solid #ff6a1a;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 30;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      }

      /* Shot 1: Punch Phrase Box */
      #shot1-punch {
        position: absolute;
        top: 960px;
        left: 80px;
        width: 920px;
        padding: 30px 40px;
        background-color: #141414;
        border-left: 14px solid #ff6a1a;
        border-radius: 4px;
        z-index: 40;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      .punch-line-1 {
        font-size: 52px;
        font-weight: 900;
        line-height: 1.15;
        color: #f7f4ec;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .punch-line-2 {
        font-size: 76px;
        font-weight: 900;
        line-height: 1.1;
        color: #ff6a1a;
        text-transform: uppercase;
        letter-spacing: 3px;
        margin-top: 4px;
      }

      /* Shot 2: Label Box */
      #shot2-label {
        position: absolute;
        top: 980px;
        left: 80px;
        width: 920px;
        padding: 32px 36px;
        background-color: #141414;
        border: 4px solid #ff6a1a;
        border-radius: 4px;
        z-index: 40;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
        text-align: center;
      }

      .label-kicker {
        font-size: 22px;
        font-weight: 700;
        color: #f7f4ec;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 8px;
        opacity: 0.9;
      }

      .label-heading {
        font-size: 60px;
        font-weight: 900;
        line-height: 1.2;
        color: #ff6a1a;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s40"
      data-width="1080"
      data-height="1920"
      data-duration="12"
    >
      <!-- Persistent Archival Header Tag -->
      <div class="scene-kicker-tag">TRANH TỤNG / BẢN ÁN 935</div>

      <!-- Persistent Bottom Brand Bar -->
      <div id="brand-bottom-bar"></div>

      <!-- ================= SHOT 1 (0s -> 6s) ================= -->
      <section id="shot-1" class="clip" data-start="0" data-duration="6">
        <!-- Photo Frame -->
        <div id="shot1-card" class="photo-frame">
          <img
            id="shot1-img"
            src="assets/img-05-patching-financial-leak-cutout.jpg"
            alt="Bàn tay nhét tiền vá nứt"
            style="top: 0; left: 0;"
          />
          <div class="corner-bracket cb-top-left"></div>
          <div class="corner-bracket cb-top-right"></div>
          <div class="corner-bracket cb-bottom-left"></div>
          <div class="corner-bracket cb-bottom-right"></div>
        </div>

        <!-- Self-drawing Ban Icon Badge -->
        <div id="shot1-ban-badge">
          <svg
            id="ban-svg"
            width="200"
            height="200"
            viewBox="0 0 200 200"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle
              id="ban-circle"
              cx="100"
              cy="100"
              r="76"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="16"
              stroke-linecap="round"
            />
            <line
              id="ban-slash"
              x1="46"
              y1="46"
              x2="154"
              y2="154"
              stroke="#FF6A1A"
              stroke-width="16"
              stroke-linecap="round"
            />
          </svg>
        </div>

        <!-- Punch Phrase: KHÔNG PHẢI NỘI BỘ -->
        <div id="shot1-punch">
          <div class="punch-line-1">KHÔNG PHẢI</div>
          <div class="punch-line-2">NỘI BỘ</div>
        </div>
      </section>

      <!-- ================= SHOT 2 (6s -> 12s) ================= -->
      <section id="shot-2" class="clip" data-start="6" data-duration="6">
        <!-- Photo Frame (focus on lower drowning section) -->
        <div id="shot2-card" class="photo-frame">
          <img
            id="shot2-img"
            src="assets/img-05-patching-financial-leak-cutout.jpg"
            alt="Hồ sơ và nhân vật bị ngập lụt"
            style="top: -680px; left: 0;"
          />
          <div class="corner-bracket cb-top-left"></div>
          <div class="corner-bracket cb-top-right"></div>
          <div class="corner-bracket cb-bottom-left"></div>
          <div class="corner-bracket cb-bottom-right"></div>
        </div>

        <!-- Label: VỐN TỔ CHỨC TÍN DỤNG -->
        <div id="shot2-label">
          <div class="label-kicker">RANH GIỚI PHÁP LÝ</div>
          <div class="label-heading">VỐN TỔ CHỨC TÍN DỤNG</div>
        </div>
      </section>
    </div>

    <!-- GSAP seekable animation timeline -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // SVG path length setup for Ban Icon
      const banCircle = document.getElementById("ban-circle");
      const banSlash = document.getElementById("ban-slash");

      if (banCircle && banSlash) {
        const circleLen = banCircle.getTotalLength();
        const slashLen = banSlash.getTotalLength();

        banCircle.style.strokeDasharray = circleLen + "px";
        banCircle.style.strokeDashoffset = circleLen + "px";
        banSlash.style.strokeDasharray = slashLen + "px";
        banSlash.style.strokeDashoffset = slashLen + "px";
      }

      // ================= SHOT 1 MOTION (0.0s -> 6.0s) =================
      // Wobble-drop entrance for Shot 1 card
      tl.fromTo(
        "#shot1-card",
        { y: -120, rotation: -2.5, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.1
      );

      // Camera motion: slow zoom-in on upper hand patching the crack
      tl.fromTo(
        "#shot1-img",
        { scale: 1.05, transformOrigin: "50% 25%" },
        { scale: 1.18, duration: 5.9, ease: "none" },
        0.1
      );

      // Ban Icon Overlay at 1.58s (353580 ms), holds for 2.0s until 3.58s
      tl.fromTo(
        "#shot1-ban-badge",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        1.58
      );

      tl.to(
        "#ban-circle",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        1.7
      );

      tl.to(
        "#ban-slash",
        { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
        2.05
      );

      tl.to(
        "#shot1-ban-badge",
        { scale: 0.9, opacity: 0, duration: 0.2, ease: "power2.in" },
        3.38
      );

      // Punch Phrase Overlay: KHÔNG PHẢI NỘI BỘ at 4.0s (356000 ms)
      tl.fromTo(
        "#shot1-punch",
        { y: 35, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        4.0
      );

      // ================= SHOT 2 MOTION (6.0s -> 12.0s) =================
      // Instant cut entrance at 6.0s. Card is rock solid at y=0.
      tl.set("#shot2-card", { y: 0, opacity: 1 }, 6.0);

      // Camera motion: slow pan-left on drowning files & figures
      tl.fromTo(
        "#shot2-img",
        { x: 40, scale: 1.08, transformOrigin: "50% 85%" },
        { x: -40, scale: 1.15, duration: 6.0, ease: "none" },
        6.0
      );

      // Label Overlay: VỐN TỔ CHỨC TÍN DỤNG at 9.99s (361990 ms)
      tl.fromTo(
        "#shot2-label",
        { y: 35, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
        9.99
      );

      // Register the paused timeline with exact root composition ID
      window.__timelines["scene-s40"] = tl;
    </script>
  
    </template>
  </body>
</html>
