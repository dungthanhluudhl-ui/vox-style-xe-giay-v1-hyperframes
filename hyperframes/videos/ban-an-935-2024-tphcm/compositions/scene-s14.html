    <!-- Root composition: 1080x1920 portrait, duration 11.0s (111030ms to 122030ms) -->
    <div

      data-composition-id="scene-s14"

      data-duration="11"
    >
      <!-- Permanent bottom orange branding line -->
      <div class="bottom-orange-bar"></div>

      <!-- ==================== SHOT 1 (0.00s to 5.15s) ==================== -->
      <section id="shot-1" class="clip" data-start="0" data-duration="5.15">
        <!-- Background photo full-frame (img-10) -->
        <div class="bg-photo-wrap">
          <img
            id="shot1-photo-img"
            class="bg-photo"
            src="assets/img-10-financial-scam-persuasion-victim.jpg"
            alt="Tuấn tiếp cận ban lãnh đạo Quỹ"
            style="object-position: center 25%"
          />
        </div>

        <!-- Date overlay badge: "ĐẦU NĂM 2003" -->
        <div id="shot1-date-badge" class="header-badge">
          <span class="header-badge-text">ĐẦU NĂM 2003</span>
        </div>

        <!-- Annotated callout for Tuấn with self-drawing SVG person icon -->
        <div id="shot1-person-badge" class="annotated-callout">

              <!-- Head circle -->
              <circle
                id="person-head"

              <!-- Torso outline -->
              <path

        <div class="bg-photo-wrap">
          <img
            id="shot2-photo-img"
            class="bg-photo"
            src="assets/img-10-financial-scam-persuasion-victim.jpg"
            alt="Tập hồ sơ và bàn đàm phán"
            style="object-position: center 68%"

    <!-- GSAP Seeking & Animation Logic -->
    <script>
      // Single paused master timeline registration
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Setup self-drawing SVG geometry for person icon
      const headElem = document.getElementById("person-head");
      const bodyElem = document.getElementById("person-body");
      const headLen = headElem ? headElem.getTotalLength() : 50.3;
      const bodyLen = bodyElem ? bodyElem.getTotalLength() : 75.0;

      if (headElem && bodyElem) {
        headElem.style.strokeDasharray = headLen;
        headElem.style.strokeDashoffset = headLen;
        bodyElem.style.strokeDasharray = bodyLen;
        bodyElem.style.strokeDashoffset = bodyLen;
      }

      // Initial state of Shot 2 cards (to avoid seek-time flashing)
      gsap.set("#shot2-card-exchange", { opacity: 0, scale: 0.94 });
      gsap.set("#shot2-card-borrow", { opacity: 0, scale: 0.94 });

      // ----------------------------------------------------
      // SHOT 1 CHOREOGRAPHY (t = 0.00s to 5.15s)
      // ----------------------------------------------------

      // Punch transition entrance on Shot 1 image
      tl.fromTo(
        "#shot1-photo-img",
        { scale: 1.15 },
        { scale: 1.04, duration: 0.6, ease: "power4.out" },
        0
      );

      // Camera motion: continuous subtle zoom-in across Shot 1 (1.04 -> 1.09)
      tl.to(
        "#shot1-photo-img",
        { scale: 1.09, duration: 4.55, ease: "none" },
        0.6
      );

      // Overlay 1: "ĐẦU NĂM 2003" at 0.06s, holds ~2.2s
      tl.fromTo(
        "#shot1-date-badge",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.06
      );
      tl.to(
        "#shot1-date-badge",
        { opacity: 0, y: -15, duration: 0.35, ease: "power2.in" },
        2.26
      );

      // Overlay 2: "person" icon badge at 1.53s, holds ~1.8s
      tl.fromTo(
        "#shot1-person-badge",
        { scale: 0.85, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.53
      );

      // Progressive SVG path draw for person icon
      tl.fromTo(
        "#person-head",
        { strokeDashoffset: headLen },
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        1.62
      );
      tl.fromTo(
        "#person-body",
        { strokeDashoffset: bodyLen },
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        1.76
      );

      // Exit for person badge at 3.33s
      tl.to(
        "#shot1-person-badge",
        { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
        3.33
      );

      // ----------------------------------------------------
      // SHOT 2 CHOREOGRAPHY (t = 5.15s to 11.00s)
      // ----------------------------------------------------

      // Camera motion: continuous zoom on close-up image (scale 1.05 -> 1.11)
      tl.fromTo(
        "#shot2-photo-img",
        { scale: 1.05 },
        { scale: 1.11, duration: 5.85, ease: "none" },
        5.15
      );

      // Section category tag glides in
      tl.fromTo(
        "#shot2-header-badge",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        5.2
      );

      // Overlay 1: "ĐIỀU KIỆN TRAO ĐỔI" at 5.39s (116420ms), holds 2.4s (until 7.79s)
      tl.fromTo(
        "#shot2-card-exchange",
        { y: 35, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1.0, duration: 0.48, ease: "power3.out" },
        5.39
      );
      tl.to(
        "#shot2-card-exchange",
        { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
        7.79
      );

      // Overlay 2: "MƯỢN HỒ SƠ DÂN" at 8.37s (119400ms), holds 2.5s (until 10.87s)
      tl.fromTo(
        "#shot2-card-borrow",
        { y: 35, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1.0, duration: 0.48, ease: "power3.out" },
        8.37
      );
      tl.to(
        "#shot2-card-borrow",
        { opacity: 0, y: -15, duration: 0.13, ease: "power2.in" },
        10.86
      );

      // Register master timeline to HyperFrames runtime
      window.__timelines["scene-s14"] = tl;
    </script>
