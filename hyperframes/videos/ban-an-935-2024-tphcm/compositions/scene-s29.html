<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      /* Reset & Box Model */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #0b0f14;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Composition Root */
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }

      /* Vox Grid Background */
      .vox-grid-bg {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        pointer-events: none;
        z-index: 1;
      }

      /* Fixed Bottom Orange Accent Bar */
      .vox-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 999;
      }

      /* Base Clip Styling */
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Full-bleed 9:16 Photo Wrapper (Background-Photo Visual Language) */
      .full-bleed-media {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        z-index: 5;
      }

      .full-photo {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: center center;
      }

      /* Layout Containers */
      .header-badge {
        position: absolute;
        top: 172px;
        left: 60px;
        padding: 8px 18px;
        border-radius: 4px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        z-index: 20;
      }

      .header-badge::before {
        content: "";
        display: inline-block;
        width: 10px;
        height: 10px;
        background-color: #ff6a1a;
        border-radius: 2px;
      }

      /* Information Cards on Solid Opaque Plates */
      .info-card {
        position: absolute;
        top: 1210px;
        left: 60px;
        width: 960px;
        padding: 28px 36px;
        border-radius: 4px;
        border-left: 8px solid #ff6a1a;
        z-index: 30;
      }

      .card-tag {
        display: inline-block;
        font-size: 20px;
        font-weight: 900;
        padding: 4px 12px;
        margin-bottom: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        border-radius: 2px;
      }

      .card-heading {
        font-size: 64px;
        font-weight: 900;
        line-height: 1.24;
        letter-spacing: -0.5px;
        text-transform: uppercase;
        margin: 0;
      }

      /* Warning Card Layout */
      .warning-card-inner {
        display: flex;
        align-items: center;
        gap: 32px;
      }

      .warning-icon-wrapper {
        flex-shrink: 0;
        width: 86px;
        height: 86px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>

    <!-- Composition Root (1080x1920, 10 seconds total) -->
    <div
      id="root"
      data-composition-id="scene-s29"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="10"
    >
      <!-- Background Grid -->
      <div class="vox-grid-bg"></div>

      <!-- Bottom Orange Signature Line -->
      <div class="vox-bottom-bar"></div>

      <!-- ================= SHOT S29-1 (0s -> 4.98s) ================= -->
      <section id="shot-1" class="clip" data-start="0" data-duration="4.98">
        <!-- Full-bleed 9:16 Background Photo with Unfold Entrance -->
        <div id="s1-media-wrap" class="full-bleed-media">
          <img
            id="s1-img"
            class="full-photo"
            src="assets/img-09-corrupt-official-prison-money.jpg"
            alt="Vault key handover"
            style="object-position: center 30%"
          />
        </div>

        <!-- Top Metadata Label -->
        <div id="s1-header" class="header-badge hf-plate-ink">
          <span>QUY TRÌNH TÍN DỤNG // 01</span>
        </div>

        <!-- Punch-phrase Card: GIAO CHÌA KHÓA KÉT (appears at 2.5s) -->
        <div id="s1-punch" class="info-card hf-plate-ink" style="opacity: 0">
          <div class="card-tag hf-hl-orange">CƠ CHẾ VI PHẠM</div>
          <h1 class="card-heading hf-text-light">GIAO CHÌA KHÓA KÉT</h1>
        </div>
      </section>

      <!-- ================= SHOT S29-2 (4.98s -> 10s) ================= -->
      <section id="shot-2" class="clip" data-start="4.98" data-duration="5.02">
        <!-- Full-bleed 9:16 Background Photo Panned to Money Influx -->
        <div id="s2-media-wrap" class="full-bleed-media">
          <img
            id="s2-img"
            class="full-photo"
            src="assets/img-09-corrupt-official-prison-money.jpg"
            alt="Money pouring from vault"
            style="object-position: center 65%"
          />
        </div>

        <!-- Top Metadata Label -->
        <div id="s2-header" class="header-badge hf-plate-ink">
          <span>HẬU QUẢ BỎ THẨM ĐỊNH // 02</span>
        </div>

        <!-- Warning Icon Overlay (Active from 5.6s to 7.55s) -->
        <div
          id="s2-warning-card"
          class="info-card hf-plate-ink"
          style="opacity: 0"
        >
          <div class="warning-card-inner">
            <div class="warning-icon-wrapper">
              <svg
                id="warning-svg"
                viewBox="0 0 100 100"
                width="84"
                height="84"
                style="overflow: visible"
              >
                <path
                  id="warning-triangle"
                  d="M 50 14 L 88 84 L 12 84 Z"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <line
                  id="warning-bar"
                  x1="50"
                  y1="38"
                  x2="50"
                  y2="60"
                  stroke="#FF6A1A"
                  stroke-width="8"
                  stroke-linecap="round"
                />
                <circle
                  id="warning-dot"
                  cx="50"
                  cy="74"
                  r="4.5"
                  fill="#FF6A1A"
                />
              </svg>
            </div>
            <div>
              <div class="card-tag hf-hl-orange">CẢNH BÁO RỦI RO</div>
              <h2
                class="hf-text-light"
                style="font-size: 38px; font-weight: 900; line-height: 1.2"
              >
                MẤT KIỂM SOÁT KÉT TIỀN
              </h2>
            </div>
          </div>
        </div>

        <!-- Label Card: BỎ QUA THẨM ĐỊNH (appears at 7.74s) -->
        <div
          id="s2-label-card"
          class="info-card hf-plate-ink"
          style="opacity: 0"
        >
          <div class="card-tag hf-hl-orange">LỖI HỆ THỐNG</div>
          <h1 class="card-heading hf-text-light">BỎ QUA THẨM ĐỊNH</h1>
        </div>
      </section>
    </div>

    <!-- GSAP Seekable Timeline Construction -->
    <script>
      // Single paused timeline registered on window.__timelines
      const tl = gsap.timeline({ paused: true });

      // Initialize SVG stroke dash geometry
      const warningTri = document.getElementById("warning-triangle");
      const warningBar = document.getElementById("warning-bar");
      if (warningTri) {
        const lenTri = warningTri.getTotalLength();
        warningTri.style.strokeDasharray = lenTri;
        warningTri.style.strokeDashoffset = lenTri;
      }
      if (warningBar) {
        const lenBar = warningBar.getTotalLength();
        warningBar.style.strokeDasharray = lenBar;
        warningBar.style.strokeDashoffset = lenBar;
      }

      // -----------------------------------------------------------
      // SHOT S29-1 CHOREOGRAPHY (Global time: 0.0s -> 4.98s)
      // -----------------------------------------------------------

      // Unfold entrance: paper unfold motion from top of screen
      tl.fromTo(
        "#s1-media-wrap",
        { scaleY: 0, opacity: 0, transformOrigin: "50% 0%" },
        { scaleY: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
        0.1,
      );

      // Header badge drop
      tl.fromTo(
        "#s1-header",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.2,
      );

      // Camera motion: slow zoom-in on the handover detail
      tl.fromTo(
        "#s1-img",
        { scale: 1.05 },
        { scale: 1.16, duration: 4.88, ease: "none" },
        0.1,
      );

      // Punch-phrase overlay arrival at 2.5s (260500 ms)
      tl.fromTo(
        "#s1-punch",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        2.5,
      );

      // -----------------------------------------------------------
      // SHOT S29-2 CHOREOGRAPHY (Global time: 4.98s -> 10.0s)
      // -----------------------------------------------------------

      // Header badge for shot 2
      tl.fromTo(
        "#s2-header",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
        5.0,
      );

      // Camera motion: pan-left and gentle zoom on the pouring money detail
      tl.fromTo(
        "#s2-img",
        { x: 35, scale: 1.08 },
        { x: -35, scale: 1.15, duration: 5.02, ease: "none" },
        4.98,
      );

      // Warning Icon Card entrance at 5.6s (263600 ms)
      tl.fromTo(
        "#s2-warning-card",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        5.6,
      );

      // SVG warning icon progressive self-drawing
      tl.to(
        "#warning-triangle",
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        5.7,
      );
      tl.to(
        "#warning-bar",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        5.95,
      );
      tl.fromTo(
        "#warning-dot",
        { scale: 0, opacity: 0, transformOrigin: "center center" },
        { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" },
        6.15,
      );

      // Warning card exit at 7.55s before label card appears
      tl.to(
        "#s2-warning-card",
        { opacity: 0, y: -20, duration: 0.16, ease: "power2.in" },
        7.55,
      );

      // Label card arrival at 7.74s (265740 ms) - holds to 10.0s
      tl.fromTo(
        "#s2-label-card",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        7.74,
      );

      // Register timeline for seekable rendering
      window.__timelines["scene-s29"] = tl;
    </script>
  
    </template>
  </body>
</html>
