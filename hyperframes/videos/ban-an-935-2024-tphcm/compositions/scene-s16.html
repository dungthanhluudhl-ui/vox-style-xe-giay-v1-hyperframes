<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }

      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Lớp ảnh nền toàn khung (full-bleed background photo theo Style DNA) */
      .photo-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 1;
        background-color: #E7E3D9;
      }

      .contract-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        display: block;
        transform-origin: 50% 50%;
      }

      /* Overlay 1: Nhu cầu vay ban đầu */
      .overlay-demand {
        position: absolute;
        left: 90px;
        top: 200px;
        width: 900px;
        height: auto;
        background-color: #141414;
        border: 3px solid #141414;
        box-shadow: 10px 10px 0px rgba(20, 20, 20, 0.6);
        border-radius: 10px;
        padding: 16px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 5;
        transform-origin: 50% 50%;
      }

      .tag-demand {
        background-color: #F5F0E4;
        color: #141414;
        font-size: 30px;
        font-weight: 900;
        letter-spacing: 1px;
        padding: 10px 22px;
        border-radius: 6px;
        text-transform: uppercase;
        display: inline-block;
      }

      .val-demand {
        color: #F7F4EC;
        font-size: 48px;
        font-weight: 900;
        letter-spacing: 1.5px;
        display: inline-block;
      }

      /* Overlay 2: Badge hồ sơ tài liệu vẽ tay (Doc Icon) */
      .badge-doc {
        position: absolute;
        right: 90px;
        top: 330px;
        width: 140px;
        height: 140px;
        background-color: #141414;
        border: 4px solid #FF6A1A;
        box-shadow: 8px 8px 0px rgba(20, 20, 20, 0.6);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        transform-origin: 50% 50%;
      }

      .badge-doc svg {
        display: block;
      }

      /* Overlay 3: Lập khống con số vay */
      .overlay-fraud {
        position: absolute;
        left: 90px;
        top: 1240px;
        width: 900px;
        height: auto;
        background-color: #141414;
        border: 4px solid #FF6A1A;
        box-shadow: 12px 12px 0px #FF6A1A;
        border-radius: 12px;
        padding: 20px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 5;
        transform-origin: 50% 50%;
      }

      .tag-fraud {
        background-color: #FF6A1A;
        color: #141414;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 1.5px;
        padding: 12px 24px;
        border-radius: 8px;
        text-transform: uppercase;
        display: inline-block;
      }

      .val-fraud {
        color: #FF6A1A;
        font-size: 54px;
        font-weight: 900;
        letter-spacing: 2px;
        display: inline-block;
      }

      /* Thanh nhận diện thương hiệu cố định mép đáy */
      .bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s16"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="5.42"
    >
      <section id="shot-1" class="clip" data-start="0" data-duration="5.42">
        <!-- Lớp ảnh nền toàn khung (background-photo) giữ nguyên ảnh theo Style DNA -->
        <div id="photo-layer" class="photo-layer" data-layout-allow-overflow="true">
          <img
            id="contract-img"
            class="contract-img"
            src="assets/img-17-loan-contract-money-discrepancy.jpg"
            alt="Hợp đồng vay vốn bị sửa đổi"
          />
        </div>

        <!-- Overlay 1: Nhu cầu vay ban đầu (đúng nhãn có dấu hai chấm) -->
        <div id="overlay-demand" class="overlay-demand" aria-label="NHU CẦU: 100 TRIỆU">
          <span class="tag-demand">NHU CẦU:</span>
          <span class="val-demand">100 TRIỆU</span>
        </div>

        <!-- Overlay 2: Biểu tượng hồ sơ doc tự vẽ trên nền huy hiệu điều tra -->
        <div id="badge-doc" class="badge-doc">
          <svg viewBox="0 0 100 120" width="72" height="86">
            <!-- Thân tài liệu với góc gập -->
            <path
              id="doc-path-outline"
              d="M 20 10 L 65 10 L 85 30 L 85 110 L 20 110 Z"
              fill="none"
              stroke="#F7F4EC"
              stroke-width="7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              id="doc-path-fold"
              d="M 65 10 L 65 30 L 85 30"
              fill="none"
              stroke="#F7F4EC"
              stroke-width="7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <!-- Các dòng chữ trong hồ sơ -->
            <path
              id="doc-path-line1"
              d="M 34 52 L 72 52"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="7"
              stroke-linecap="round"
            />
            <path
              id="doc-path-line2"
              d="M 34 72 L 72 72"
              fill="none"
              stroke="#F7F4EC"
              stroke-width="7"
              stroke-linecap="round"
            />
            <path
              id="doc-path-line3"
              d="M 34 92 L 56 92"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="7"
              stroke-linecap="round"
            />
          </svg>
        </div>

        <!-- Overlay 3: Số tiền bị lập khống (đúng nhãn có dấu hai chấm) -->
        <div id="overlay-fraud" class="overlay-fraud" aria-label="LẬP KHỐNG: 400 TRIỆU">
          <span class="tag-fraud">LẬP KHỐNG:</span>
          <span class="val-fraud">400 TRIỆU</span>
        </div>

        <!-- Chữ ký thị giác: thanh cam mép đáy -->
        <div class="bottom-bar"></div>
      </section>
    </div>

    <script>
      // Khởi tạo GSAP Timeline tất định
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1. Chuẩn bị đường vẽ SVG cho icon tài liệu (doc)
      const docPaths = [
        document.getElementById("doc-path-outline"),
        document.getElementById("doc-path-fold"),
        document.getElementById("doc-path-line1"),
        document.getElementById("doc-path-line2"),
        document.getElementById("doc-path-line3")
      ];

      docPaths.forEach((path) => {
        if (path) {
          const len = path.getTotalLength();
          path.style.strokeDasharray = len;
          path.style.strokeDashoffset = len;
        }
      });

      // 2. Chuyển động vào cảnh (grow/fade) và Ken Burns đẩy vào mảnh giấy 400 triệu dán đè
      tl.fromTo(
        "#photo-layer",
        { opacity: 0 },
        { opacity: 1, duration: 0.45, ease: "power2.out" },
        0
      );

      tl.fromTo(
        "#contract-img",
        { scale: 1.05, x: 0, y: 0 },
        { scale: 1.22, x: -24, y: 18, duration: 5.42, ease: "none" },
        0
      );

      // 3. Overlay 1: "NHU CẦU: 100 TRIỆU" (tương ứng atMs: 132420, holdMs: 2200)
      tl.fromTo(
        "#overlay-demand",
        { opacity: 0, y: 30, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
        1.38
      );

      tl.to(
        "#overlay-demand",
        { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
        3.58
      );

      // 4. Overlay 2: Icon "doc" tự vẽ (tương ứng atMs: 133890, holdMs: 1800)
      tl.fromTo(
        "#badge-doc",
        { scale: 0, opacity: 0, rotation: -12 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: "power3.out" },
        2.85
      );

      tl.to(
        "#doc-path-outline",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        2.95
      );

      tl.to(
        "#doc-path-fold",
        { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" },
        3.28
      );

      tl.to(
        "#doc-path-line1",
        { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" },
        3.42
      );

      tl.to(
        "#doc-path-line2",
        { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" },
        3.52
      );

      tl.to(
        "#doc-path-line3",
        { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" },
        3.62
      );

      tl.to(
        "#badge-doc",
        { opacity: 0, scale: 0.88, duration: 0.3, ease: "power2.in" },
        4.65
      );

      // 5. Overlay 3: "LẬP KHỐNG: 400 TRIỆU" (tương ứng atMs: 135210, giữ đến hết cảnh)
      tl.fromTo(
        "#overlay-fraud",
        { scale: 0.75, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        4.17
      );

      // 6. Đăng ký timeline cho HyperFrames runtime
      window.__timelines["scene-s16"] = tl;
    </script>
  
    </template>
  </body>
</html>
