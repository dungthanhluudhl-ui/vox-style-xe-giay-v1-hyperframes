      // Setup SVG progressive drawing initial stroke offsets
      const docPaths = document.querySelectorAll(".doc-path");
      docPaths.forEach((path) => {
        const len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;

      const sigStroke = document.getElementById("sig-stroke");
      if (sigStroke) {

        sigStroke.style.strokeDasharray = sigLen;
        sigStroke.style.strokeDashoffset = sigLen;
      }

      // Build single paused GSAP Timeline for HyperFrames seek engine
      const tl = gsap.timeline({ paused: true });

      // Camera motion: slow, tense push-in documentary effect across the whole 10.37s
      tl.to("#camera", {
        scale: 1.055,
        duration: 10.37,
        ease: "sine.out"
      }, 0);

      // 0.0s: TransitionIn "punch" - Document slams onto screen
      tl.fromTo(
        "#doc-card",
        { scale: 1.15, opacity: 0, y: -24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power4.out" },
        0.1

        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        0.35

      tl.fromTo(
        "#meta-rows",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        0.55

      // Overlay 1: "VAI TRÒ CHỦ MƯU CHÍNH" at 2.24s (376300ms - 374060ms)

        "#stamp-wrapper",
        { opacity: 0, scale: 2.2, rotation: 16 },
        { opacity: 1, scale: 1, rotation: -4, duration: 0.35, ease: "power4.in" },
        2.24

        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        4.73
      );

      // Self-drawing doc icon paths
      tl.to(
        ".doc-path",
        {
          strokeDashoffset: 0,
          duration: 0.6,
          stagger: 0.08,
          ease: "power2.out"
        },
        4.95

      // Rapid signature trace
      tl.to(

        { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power4.out" },
        7.66

      // Underline highlight bar expansion

        "#punch-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power3.out" },
        7.95
      );

      // Hold through scene completion (10.37s)

      // Register root timeline on window.__timelines
      window.__timelines = window.__timelines || {};
