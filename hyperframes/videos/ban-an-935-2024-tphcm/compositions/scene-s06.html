    <script>
      // Initialize GSAP Timeline in paused state per HyperFrames contract
      const tl = gsap.timeline({ paused: true });

      // Measure SVG path lengths for self-drawing person icon
      const headCircle = document.getElementById("person-head");
      const bodyPath = document.getElementById("person-body");

      const headLen = headCircle ? headCircle.getTotalLength() : 113.1;
      const bodyLen = bodyPath ? bodyPath.getTotalLength() : 98.4;

      if (headCircle) {
        headCircle.style.strokeDasharray = headLen + "";
        headCircle.style.strokeDashoffset = headLen + "";
      }
      if (bodyPath) {
        bodyPath.style.strokeDasharray = bodyLen + "";
        bodyPath.style.strokeDashoffset = bodyLen + "";
      }

      // 0.0s - 7.27s: Continuous subtle camera zoom-in (cameraMotion: zoom-in)
      tl.to("#camera-stage", { scale: 1.045, duration: 7.27, ease: "none" }, 0);

      // 0.05s - 0.75s: Transition-in "peel" for the main dossier card
      tl.fromTo(
        "#card-dossier",
        { opacity: 0, scale: 0.94, rotation: -2.5, y: 40 },
        { opacity: 1, scale: 1, rotation: 0, y: 0, duration: 0.7, ease: "power3.out" },
        0.05
      );

      // Top Tag Bar Entrance
      tl.fromTo(
        ".top-tag-container",
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0.15

      // 0.30s: Overlay 1 - QUYỀN GIÁM ĐỐC (atMs: 47390 -> 0.30s)

        "#badge-role",
        { scale: 0, opacity: 0, x: -30 },
        { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        0.30
      );

      // 0.55s: Card Titles reveal
      tl.fromTo(
        "#card-title",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.55
      );
      tl.fromTo(
        "#card-subtitle",
        { opacity: 0, y: 15 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        0.75
      );

      // 0.95s: Mid identity section cards reveal
      tl.fromTo(
        "#portrait-box",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        0.95
      );
      tl.fromTo(
        "#coded-box",
        { opacity: 0, x: 30 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
        1.10
      );

      // 1.69s: Overlay 2 - Person Icon self-drawing (atMs: 48780 -> 1.69s)
      tl.to(
        "#person-head",
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        1.69
      );
      tl.to(
        "#person-body",
        { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
        1.95
      );
      // Person shadow accent reveal
      tl.to(
        "#portrait-shadow",
        { opacity: 0.8, duration: 0.4, ease: "power2.out" },
        2.35
      );

      // 2.70s: Masked tag pulse & explanation beat
      tl.fromTo(
        "#masked-tag",
        { scale: 0.95 },
        { scale: 1.05, repeat: 1, yoyo: true, duration: 0.35, ease: "power2.inOut" },
        2.70
      );

      // 3.80s: Connector line and label drawing
      tl.fromTo(
        "#connector-strip",
        { opacity: 0, scaleX: 0.8 },
        { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.out" },
        3.80
      );

      // 4.30s: Initial preview of convention plate
      tl.fromTo(
        "#convention-box",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        4.30
      );

      // 5.48s: Overlay 3 - QUY ƯỚC: MINH HÙNG (atMs: 52570 -> 5.48s)
      tl.fromTo(
        "#convention-badge",
        { scale: 0, opacity: 0, rotation: -4 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "power3.out" },
        5.48
      );
      tl.fromTo(
        "#convention-name",
        { scale: 0.88, opacity: 0, color: "#ff6a1a" },
        { scale: 1, opacity: 1, color: "#f7f4ec", duration: 0.55, ease: "power3.out" },
        5.65
      );

      // 5.80s: Bottom summary card entrance

        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },

      );
