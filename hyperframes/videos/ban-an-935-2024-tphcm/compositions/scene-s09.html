      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }

    /* Quy ước layout chuẩn HyperFrames */
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Lưới nền phong cách Vox */
    #bg-grid {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      z-index: 0;
    }

    /* Khung media hiển thị tranh collage */
    .media-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #shot1-img {
      transform-origin: 50% 60%;
    }

    #shot2-img {
      transform-origin: 68% 26%;
    }

    /* Lớp overlay chứa badge/thẻ thông tin */
    .overlay-layer {
      pointer-events: none;
    }

    /* Thẻ thông tin nền mực đặc #141414 bảo đảm độ tương phản chuẩn WCAG AAA */
    .card-plate {
      position: absolute;
      left: 80px;
      right: 80px;
      background-color: #141414;
      border-radius: 16px;
      padding: 26px 34px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
      border: 2px solid rgba(255, 106, 26, 0.35);
      display: flex;
      align-items: center;
      gap: 24px;
      z-index: 40;
    }

    #card-land {
      top: 260px;
    }

    #card-doc {
      top: 800px;
    }

    #card-us {
      top: 980px;
    }

    .card-accent-bar {
      width: 8px;
      align-self: stretch;
      background-color: #FF6A1A;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .card-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-tag {
      color: #FF6A1A;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .card-headline {
      color: #F7F4EC;
      font-weight: 900;
      font-size: 54px;
      line-height: 1.22;
    }

    .card-subtext {
      color: #E7E3D9;
      font-weight: 700;
      font-size: 28px;
      margin-top: 4px;
    }

    /* Hộp chứa icon SVG tự vẽ dần */
    .icon-box {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: rgba(255, 106, 26, 0.14);
      border-radius: 14px;
      border: 1.5px solid rgba(255, 106, 26, 0.45);
    }

    /* Thanh cam thương hiệu cố định ở đáy khung hình */
    #bottom-brand-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 16px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Class an toàn WCAG chuẩn style tokens */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
    .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
    .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
    .hf-plate-paper { background-color: #E7E3D9; color: #141414; }
  </style>

  <div
    id="root"
    data-composition-id="scene-s09"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="11.48"
  >
    <!-- Lớp nền ô vuông Vox -->
    <div id="bg-grid"></div>

    <!-- SHOT 1: Căn chỉnh két sắt chứa giấy chứng nhận 19.600m² -->

      <div class="media-container">
        <img
          id="shot1-img"
          src="assets/img-06-sealed-land-collateral-escape.jpg"
          alt="Két sắt niêm phong sổ đỏ"
        />
      </div>
    </div>

    <!-- OVERLAY SHOT 1.1: Nhãn "LÔ ĐẤT 19.600 M²" -->
    <div id="clip-overlay-land" class="clip overlay-layer" data-start="2.88" data-duration="2.60" style="z-index: 30;">
      <div id="card-land" class="hf-plate-ink card-plate">
        <div class="card-accent-bar"></div>
        <div class="card-content">
          <div class="card-tag">TÀI SẢN THẾ CHẤP</div>
          <div class="card-headline hf-text-light">LÔ ĐẤT 19.600 M²</div>
        </div>
      </div>
    </div>

    <!-- OVERLAY SHOT 1.2: Icon SVG "doc" tự vẽ dần minh họa giấy chứng nhận -->
    <div id="clip-overlay-doc" class="clip overlay-layer" data-start="5.10" data-duration="1.80" style="z-index: 35;">
      <div id="card-doc" class="hf-plate-ink card-plate">
        <div class="icon-box">
          <svg class="doc-svg" viewBox="0 0 120 140" width="70" height="82" xmlns="http://www.w3.org/2000/svg">
            <path id="doc-outline" d="M 20 10 L 80 10 L 105 35 L 105 130 L 20 130 Z" fill="none" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
            <path id="doc-fold" d="M 80 10 L 80 35 L 105 35" fill="none" stroke="#FF6A1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
            <path id="doc-line1" d="M 35 58 L 90 58" fill="none" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" />
            <path id="doc-line2" d="M 35 80 L 90 80" fill="none" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" />
            <path id="doc-line3" d="M 35 102 L 72 102" fill="none" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" />
          </svg>
        </div>
        <div class="card-content">
          <div class="card-tag">NIÊM PHONG TẠI QUỸ</div>
          <div class="card-headline hf-text-light" style="font-size: 46px;">GIẤY CHỨNG NHẬN</div>
        </div>
      </div>
    </div>

    <!-- SHOT 2: Pan camera hướng lên góc trên theo vệt máy bay rời cảnh -->
    <div id="shot-2" class="clip" data-start="5.71" data-duration="5.77" style="z-index: 10;">
      <div class="media-container">
        <img
          id="shot2-img"
          src="assets/img-06-sealed-land-collateral-escape.jpg"
          alt="Chủ đất xuất cảnh đi Mỹ"
        />
      </div>
    </div>

    <!-- OVERLAY SHOT 2: Nhãn "CHỦ ĐẤT XUẤT CẢNH" -->
    <div id="clip-overlay-us" class="clip overlay-layer" data-start="9.19" data-duration="2.20" style="z-index: 30;">
      <div id="card-us" class="hf-plate-ink card-plate">
        <div class="card-accent-bar"></div>
        <div class="card-content">
          <div class="card-tag">XUẤT CẢNH ĐI MỸ</div>
          <div class="card-headline hf-text-light">CHỦ ĐẤT XUẤT CẢNH</div>
          <div class="card-subtext">CHƯA LẤY LẠI SỔ ĐỎ</div>
        </div>

    <!-- Thanh cam đáy cố định -->
    <div id="bottom-brand-bar"></div>

  <script>
    // Chuẩn bị các nét vẽ SVG của icon doc theo đúng quy tắc svg-path-draw
    const docOutline = document.getElementById("doc-outline");
    const docFold = document.getElementById("doc-fold");
    const docLine1 = document.getElementById("doc-line1");
    const docLine2 = document.getElementById("doc-line2");
    const docLine3 = document.getElementById("doc-line3");

    [docOutline, docFold, docLine1, docLine2, docLine3].forEach(function (pathEl) {
      if (pathEl) {
        const len = Math.ceil(pathEl.getTotalLength()) + 2;
        pathEl.style.strokeDasharray = len + "px";
        pathEl.style.strokeDashoffset = len + "px";
      }
    });

    // Khởi tạo duy nhất 1 GSAP timeline ở trạng thái paused
    const tl = gsap.timeline({ paused: true });

    // ==========================================
    // SHOT 1 CHOREOGRAPHY (0.00s - 5.71s)
    // ==========================================
    // Hiệu ứng zoom-through mở đầu cảnh
    tl.fromTo(
      "#shot1-img",
      { scale: 1.35, opacity: 0 },
      { scale: 1.05, opacity: 1, duration: 0.6, ease: "power3.out" },
      0
    );

    // Chuyển động zoom-in camera nhẹ nhàng
    tl.to(
      "#shot1-img",
      { scale: 1.15, y: -25, duration: 5.11, ease: "none" },
      0.6
    );

    // Overlay 1: "LÔ ĐẤT 19.600 M²" xuất hiện lúc 2.88s (72400ms)
    tl.fromTo(
      "#card-land",
      { y: 50, opacity: 0, scale: 0.94 },
      { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
      2.88
    );
    tl.to(
      "#card-land",
      { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
      5.10
    );

    // Overlay 2: Icon "doc" xuất hiện lúc 5.10s (74620ms)
    tl.fromTo(
      "#card-doc",
      { y: 40, opacity: 0, scale: 0.94 },
      { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
      5.10
    );

    // Vẽ dần các nét icon SVG
    if (docOutline) {
      tl.to("#doc-outline", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 5.20);
    }
    if (docFold) {
      tl.to("#doc-fold", { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, 5.35);
    }
    if (docLine1) {
      tl.to("#doc-line1", { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, 5.45);
    }
    if (docLine2) {
      tl.to("#doc-line2", { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, 5.55);
    }
    if (docLine3) {
      tl.to("#doc-line3", { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, 5.65);
    }

    tl.to(
      "#card-doc",
      { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" },
      6.55
    );

    // ==========================================
    // SHOT 2 CHOREOGRAPHY (5.71s - 11.48s)
    // ==========================================
    // Cut vào shot 2 và pan camera theo vệt máy bay đi Mỹ
    tl.fromTo(
      "#shot2-img",
      { scale: 1.08, x: -30, y: 20 },
      { scale: 1.18, x: 40, y: -35, duration: 5.77, ease: "sine.inOut" },
      5.71
    );

    // Overlay 3: "CHỦ ĐẤT XUẤT CẢNH" xuất hiện lúc 9.19s (78710ms)
    tl.fromTo(
      "#card-us",
      { y: 50, opacity: 0, scale: 0.94 },
      { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
      9.19
    );
    tl.to(
      "#card-us",
      { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" },
      11.05
    );

    // Đăng ký timeline cho HyperFrames runtime
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s09"] = tl;
  </script>
