        const destination = copyDestinations[index];

        tl.fromTo(
          copy,
          {
            x: 0,
            y: 0,
            rotation: index % 2 === 0 ? -2 : 2,
            scale: 0.42,
            opacity: 0,

            ease: "power4.out",

          copy,

            rotation: destination.rotation + (index % 2 === 0 ? -0.8 : 0.8),
