    <script>
      const tl = gsap.timeline({ paused: true });

      // Path length measurements for stroke-draw animation
      const qmPathLeft = document.getElementById("qm-path-left");
      const qmPathRight = document.getElementById("qm-path-right");

      const lenL = qmPathLeft ? qmPathLeft.getTotalLength() : 380;
      const lenR = qmPathRight ? qmPathRight.getTotalLength() : 380;

      if (qmPathLeft) {
        qmPathLeft.style.strokeDasharray = lenL;
        qmPathLeft.style.strokeDashoffset = lenL;
      }
      if (qmPathRight) {
        qmPathRight.style.strokeDasharray = lenR;
        qmPathRight.style.strokeDashoffset = lenR;
      }

      // 1. Scene Entrance (0.0s - 1.1s)
      tl.fromTo(
        "#header-badge",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.1
      );

      tl.fromTo(
        "#math-frame",
        { scale: 0.95, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "power2.out" },
        0.15
      );

      // Wobble-drop entrance for Left Question Mark
      tl.fromTo(
        "#qm-left-wrap",
        { y: -120, rotation: -12, opacity: 0, scale: 0.7 },
        { y: 0, rotation: 0, opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" },
        0.25
      );
      tl.fromTo(
        "#qm-path-left",
        { strokeDashoffset: lenL },
        { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
        0.25
      );
      tl.fromTo(
        "#qm-dot-left",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(2)" },
        0.65
      );

      // Wobble-drop entrance for Right Question Mark

        "#qm-right-wrap",
        { y: -120, rotation: 12, opacity: 0, scale: 0.7 },
        { y: 0, rotation: 0, opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" },
        0.35
      );
      tl.fromTo(
        "#qm-path-right",
        { strokeDashoffset: lenR },
        { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
        0.35
      );
      tl.fromTo(
        "#qm-dot-right",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(2)" },
        0.75
      );

      // Operator cards drop in between
      tl.fromTo(
        "#op-plus",
        { y: -80, scale: 0.4, opacity: 0, rotation: -6 },
        { y: 0, scale: 1, opacity: 1, rotation: 0, duration: 0.6, ease: "power3.out" },
        0.45

      tl.fromTo(
        "#op-minus",
        { y: -80, scale: 0.4, opacity: 0, rotation: 6 },
        { y: 0, scale: 1, opacity: 1, rotation: 0, duration: 0.6, ease: "power3.out" },
        0.55
      );

      // 2. Rung lắc & Diagram Label (1.2s - 3.5s)
      tl.fromTo(
        "#diagram-tag",
        { y: 24, opacity: 0, scale: 0.92 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        1.48
      );

      // Subtle deterministic wobble oscillation between [+] and [−]
      tl.to("#op-plus", { y: -8, rotation: -3, duration: 0.4, ease: "sine.inOut" }, 1.3);
      tl.to("#op-plus", { y: 6, rotation: 2, duration: 0.45, ease: "sine.inOut" }, 1.7);
      tl.to("#op-plus", { y: -5, rotation: -2, duration: 0.45, ease: "sine.inOut" }, 2.15);
      tl.to("#op-plus", { y: 0, rotation: 0, duration: 0.4, ease: "sine.out" }, 2.6);

      tl.to("#op-minus", { y: 8, rotation: 3, duration: 0.4, ease: "sine.inOut" }, 1.3);
      tl.to("#op-minus", { y: -6, rotation: -2, duration: 0.45, ease: "sine.inOut" }, 1.7);
      tl.to("#op-minus", { y: 5, rotation: 2, duration: 0.45, ease: "sine.inOut" }, 2.15);
      tl.to("#op-minus", { y: 0, rotation: 0, duration: 0.4, ease: "sine.out" }, 2.6);

      // Gentle counter-float for the question marks
      tl.to("#qm-left-wrap", { y: -6, rotation: -2, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.4);
      tl.to("#qm-right-wrap", { y: -6, rotation: 2, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.5);
