      <style>

      *,

      body {

        background-color: #e7e3d9;

        z-index: 2;

        height: 1920px;
        object-fit: cover;
        object-position: center;

        transform-origin: 50% 50%;

      /* Background variant: chart overlay */
      .chart-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }

      .chart-rule {
        position: absolute;
        left: 0;

        background-color: rgba(20, 20, 20, 0.32);

      .chart-tick {
        position: absolute;
        left: 0;
        top: -5px;
        width: 16px;

        background-color: #ff6a1a;
      }

      /* Header block (Safe zone: y: 170px) */
      .header-block {
        position: absolute;
        top: 170px;
        left: 60px;
        right: 60px;
        z-index: 20;
      }

      .header-tag-row {

      .header-pill-ink {
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 1px;

        border-radius: 4px;
        border: 2px solid #141414;
      }

      .headline-plate {
        display: inline-block;

        border-radius: 8px;
        border: 3px solid #141414;
        box-shadow: 4px 4px 0px #ff6a1a;
        margin-top: 14px;
        background-color: #141414;
      }

      .scene-headline {
        margin: 0;
        font-size: 42px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: -0.5px;
      }

      /* Diagram Callout Badges */
      .diagram-callout {
        position: absolute;
        display: flex;
        align-items: stretch;
        border: 3px solid #141414;
        border-radius: 8px;
        box-shadow: 6px 6px 0px #141414;
        overflow: hidden;
        background-color: #141414;
        z-index: 20;
      }

      .callout-badge-a {
        top: 480px;
        left: 60px;
        width: 440px;
      }

      .callout-badge-b {
        top: 480px;
        right: 60px;
        width: 440px;
      }

      .callout-badge-signal {
        top: 1060px;
        left: 140px;
        right: 140px;
      }

      .badge-marker {
        width: 60px;
        display: grid;
        place-items: center;
        font-size: 28px;
        font-weight: 900;
        border-right: 2px solid #141414;
      }

      .badge-content {
        flex: 1;
        padding: 10px 16px;
      }

      .badge-sub {
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 1.5px;
      }

      .badge-title {
        font-size: 22px;
        font-weight: 900;
        margin-top: 2px;
        letter-spacing: -0.2px;
      }

      /* Lower Mechanism Strip (Safe zone: y: 1210px to 1310px) */
      .footer-strip {
        position: absolute;
        top: 1210px;
        left: 60px;
        right: 60px;
        height: 100px;
        border: 3px solid #141414;
        border-radius: 10px;
        box-shadow: 6px 6px 0px #141414;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 32px;
        z-index: 20;
      }

      .mech-step {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .mech-step-num {
        width: 38px;
        height: 38px;
        border-radius: 6px;
        border: 2px solid #141414;
        display: grid;
        place-items: center;
        font-size: 20px;
        font-weight: 900;
      }

      .mech-step-label {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.5px;
      }

      .mech-arrow {
        font-size: 28px;
        font-weight: 900;
      }

      /* Signature persistent bottom orange bar */
      .bottom-orange-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 16px;
        background-color: #ff6a1a;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s33"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.64"
    >
      <section id="scene-s33" class="clip" data-start="0" data-duration="7.64">
        <!-- Full-frame background image: img-02 with vertical 9:16 crop and Ken Burns zoom -->
        <div id="bg-image-wrapper" class="bg-image-wrapper" data-layout-allow-overflow="true">
          <img
            id="hero-bg-image"
            src="assets/img-02-turing-test-identity-verification.jpg"
            alt="Mô hình phép thử Turing"
            data-layout-allow-overflow="true"
          />
        </div>

        <!-- Chart variant ruled lines and tick accents -->
        <div class="chart-overlay">
          <div class="chart-rule" style="top: 20%;">
            <div class="chart-tick"></div>
          </div>
          <div class="chart-rule" style="top: 40%;">
            <div class="chart-tick"></div>
          </div>
          <div class="chart-rule" style="top: 60%;">
            <div class="chart-tick"></div>
          </div>
          <div class="chart-rule" style="top: 80%;">
            <div class="chart-tick"></div>
          </div>
        </div>

        <!-- Header Information (y: 170px) with solid high-contrast backing plate -->
        <div id="header-block" class="header-block">
          <div class="header-tag-row">
            <span class="header-pill-orange hf-hl-orange">MÔ HÌNH</span>
            <span class="header-pill-ink hf-plate-ink">CƠ CHẾ PHÉP THỬ TURING</span>
          </div>
          <div class="headline-plate hf-plate-ink">
            <h1 class="scene-headline hf-text-light">HAI CĂN PHÒNG BỊ CÁCH LY</h1>
          </div>
        </div>

        <!-- Animated SVG Signal Connectors across full 1080x1920 frame -->
        <svg
          id="signal-svg"
          width="1080"
          height="1920"
          viewBox="0 0 1080 1920"
          style="position: absolute; inset: 0; pointer-events: none; z-index: 15;"
        >
          <!-- Signal wire from interrogator to Room A -->
          <path
            id="signal-path-a"
            d="M 540 1060 C 500 850, 320 720, 280 570"
            fill="none"
            stroke="#FF6A1A"
            stroke-width="6"
            stroke-linecap="round"
          />
          <!-- Signal wire from interrogator to Room B -->
          <path
            id="signal-path-b"
            d="M 540 1060 C 580 850, 760 720, 800 570"
            fill="none"
            stroke="#FF6A1A"
            stroke-width="6"
            stroke-linecap="round"
          />
        </svg>

        <!-- Diagram Overlays -->
        <!-- Overlay 1: ROOM A: CON NGƯỜI (atMs: 261130 -> 0.81s) -->
        <div id="callout-room-a" class="diagram-callout callout-badge-a">
          <div class="badge-marker hf-hl-orange">A</div>
          <div class="badge-content hf-plate-ink">
            <div class="badge-sub hf-plate-ink-orange">ĐỐI TƯỢNG 1</div>
            <div class="badge-title hf-text-light">ROOM A: CON NGƯỜI</div>
          </div>
        </div>

        <!-- Overlay 2: ROOM B: CỖ MÁY (atMs: 262650 -> 2.33s) -->
        <div id="callout-room-b" class="diagram-callout callout-badge-b">
          <div class="badge-marker hf-hl-orange">B</div>
          <div class="badge-content hf-plate-ink">
            <div class="badge-sub hf-plate-ink-orange">ĐỐI TƯỢNG 2</div>
            <div class="badge-title hf-text-light">ROOM B: CỖ MÁY</div>
          </div>
        </div>

        <!-- Overlay 3: TÍN HIỆU THẨM VẤN MÙ (atMs: 265870 -> 5.55s) -->
        <div id="callout-signal" class="diagram-callout callout-badge-signal">
          <div class="badge-marker hf-hl-orange">
            <svg
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#141414"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
          </div>
          <div class="badge-content hf-plate-ink">
            <div class="badge-sub hf-plate-ink-orange">KẾT NỐI QUA BÀN PHÍM</div>
            <div class="badge-title hf-text-light">TÍN HIỆU THẨM VẤN MÙ</div>
          </div>
        </div>

        <!-- Lower Mechanism Flow Strip (y: 1210px to 1310px) -->
        <div id="footer-strip" class="footer-strip hf-plate-paper">
          <div class="mech-step">
            <div class="mech-step-num hf-hl-orange">1</div>
            <div class="mech-step-label hf-text-ink">NGƯỜI THẨM VẤN</div>
          </div>
          <div class="mech-arrow hf-text-ink">➔</div>
          <div class="mech-step">
            <div class="mech-step-num hf-hl-orange">2</div>
            <div class="mech-step-label hf-text-ink">GÕ BÀN PHÍM</div>
          </div>
          <div class="mech-arrow hf-text-ink">➔</div>
          <div class="mech-step">
            <div class="mech-step-num hf-hl-orange">3</div>
            <div class="mech-step-label hf-text-ink">ĐỐI CHIẾU PHẢN HỒI</div>

        </div>
      </section>

      <!-- Signature persistent bottom orange bar -->
      <div class="bottom-orange-bar" data-layout-allow-caption-zone="true"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Measure SVG path lengths for deterministic draw animation
      const pathA = document.getElementById("signal-path-a");
      const pathB = document.getElementById("signal-path-b");
      const lenA = pathA ? pathA.getTotalLength() : 700;
      const lenB = pathB ? pathB.getTotalLength() : 700;

      if (pathA) {
        pathA.style.strokeDasharray = `${lenA}`;
        pathA.style.strokeDashoffset = `${lenA}`;
      }
      if (pathB) {
        pathB.style.strokeDasharray = `${lenB}`;
        pathB.style.strokeDashoffset = `${lenB}`;
      }

      // 1. Full-frame Ken Burns continuous camera motion (0s to 7.64s, 1.0 -> 1.07)
      tl.fromTo(
        "#hero-bg-image",
        { scale: 1.0 },
        { scale: 1.07, duration: 7.64, ease: "none" },
        0
      );

      // 2. Scene entrance: Rise animation
      tl.fromTo(
        "#header-block",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.15
      );

      tl.fromTo(
        "#footer-strip",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.35
      );

      // 3. Overlay 1: ROOM A: CON NGƯỜI (atMs: 261130 -> 0.81s)
      tl.fromTo(
        "#callout-room-a",
        { scale: 0.85, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.81
      );

      // 4. Overlay 2: ROOM B: CỖ MÁY (atMs: 262650 -> 2.33s)
      tl.fromTo(
        "#callout-room-b",
        { scale: 0.85, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        2.33
      );

      // 5. Overlay 3: TÍN HIỆU THẨM VẤN MÙ (atMs: 265870 -> 5.55s)
      tl.fromTo(
        "#callout-signal",
        { scale: 0.85, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        5.55
      );

      // 6. SVG signal paths draw from interrogator keyboard out to Room A and Room B
      if (pathA && pathB) {
        tl.fromTo(
          pathA,
          { strokeDashoffset: lenA, opacity: 0 },
          { strokeDashoffset: 0, opacity: 1, duration: 0.8, ease: "power2.out" },
          5.65
        );
        tl.fromTo(
          pathB,
          { strokeDashoffset: lenB, opacity: 0 },
          { strokeDashoffset: 0, opacity: 1, duration: 0.8, ease: "power2.out" },
          5.75
        );
      }

      // Register the master timeline
      window.__timelines["scene-s33"] = tl;
    </script>
  
    </template>
  </body>
