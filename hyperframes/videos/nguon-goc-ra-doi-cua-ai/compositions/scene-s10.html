    <!-- Composition Root với duration 10.94s đúng shotlist -->
    <div
      id="root"
      data-composition-id="scene-s10"
      data-start="0"

    >
      <!-- Nền lưới chuẩn Vox -->
      <div class="grid-layer"></div>

      <!-- Clip duy nhất chứa toàn bộ diễn biến đồ họa -->
      <section id="scene-s10" class="clip" data-start="0" data-duration="10.94">
        <div class="scene-content">
          <!-- 1. Punch phrase xuất hiện lúc 1.07s -->
          <div id="punch-card" class="punch-card-wrapper">
            <div class="punch-tag-row">
              <div class="punch-badge">BƯỚC NGOẶT LỊCH SỬ</div>
              <div class="punch-subtag">KỶ NGUYÊN ĐẠI SỐ LOGIC</div>

          <!-- 2. Diagram Timeline nối từ 1651 tới 1854 -->
          <div class="timeline-section">

            <div id="milestone-1651" class="milestone-box-1651">
              <div class="milestone-year-light">NĂM 1651</div>
              <div class="milestone-label-ink">THỜI ĐIỂM HOBBES ĐẶT CÂU HỎI</div>
            </div>

            <!-- SVG Thước đo và trục đường nét đứt cam -->
            <svg class="timeline-ruler-svg" viewBox="0 0 520 430" fill="none">
              <!-- Trục dọc kỹ thuật -->
              <path
                id="timeline-main-path"
                d="M 60 70 L 60 220 L 60 370"
                stroke="#141414"
                stroke-width="5"
                stroke-linecap="round"

              <path
                id="timeline-accent-path"

              <!-- Thước đo bracket rẽ nhánh sang nhãn -->

              <!-- Điểm neo (ticks) dọc trục -->

              <circle cx="60" cy="220" r="6" fill="#FF6A1A" />

    <!-- Animation Runtime GSAP -->
    <script>
      // 1. Tạo duy nhất 1 paused timeline
      const tl = gsap.timeline({ paused: true });

      // 2. Thiết lập trạng thái hình học SVG ban đầu
      const mainPath = document.querySelector("#timeline-main-path");
      const accentPath = document.querySelector("#timeline-accent-path");
      const bracketPath = document.querySelector("#bracket-path");
      const checkRing = document.querySelector("#svg-check-ring");
      const checkStem = document.querySelector("#svg-check-stem");

      const mainLen = mainPath.getTotalLength();
      const accentLen = accentPath.getTotalLength();
      const bracketLen = bracketPath.getTotalLength();
      const ringLen = checkRing.getTotalLength();
      const stemLen = checkStem.getTotalLength();

      mainPath.style.strokeDasharray = mainLen;
      mainPath.style.strokeDashoffset = mainLen;

      accentPath.style.strokeDasharray = "14 10";
      accentPath.style.strokeDashoffset = accentLen;

      bracketPath.style.strokeDasharray = bracketLen;
      bracketPath.style.strokeDashoffset = bracketLen;

      checkRing.style.strokeDasharray = ringLen;
      checkRing.style.strokeDashoffset = ringLen;

      checkStem.style.strokeDasharray = stemLen;
      checkStem.style.strokeDashoffset = stemLen;

      // 3. Khởi tạo vị trí ban đầu (t=0 an toàn với seek)
      tl.set("#punch-card", { opacity: 0, y: -40, scale: 0.96 }, 0);
      tl.set("#milestone-1651", { opacity: 0, x: -30 }, 0);
      tl.set("#jump-badge", { opacity: 0, scale: 0.85, x: 20 }, 0);
      tl.set("#milestone-1854", { opacity: 0, scale: 0.8 }, 0);
      tl.set("#boole-card", { opacity: 0, y: 70, scale: 0.94 }, 0);

      // --- 4. BIÊN ĐẠO CHUYỂN ĐỘNG THEO TỪNG BEAT ---

      // [0.2s - 0.8s]: Cột mốc khởi đầu 1651 xuất hiện nhẹ nhàng
      tl.to(
        "#milestone-1651",
        { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" },
        0.2
      );

      // [1.07s - 1.8s]: Overlay 1 - Punch-phrase "MỐC NĂM 1854" xuất hiện (t = 72710ms)
      tl.to(
        "#punch-card",
        { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" },
        1.07
      );

      // [1.9s - 3.2s]: Trục timeline vọt dài nối 1651 tới 1854
      tl.to(
        mainPath,
        { strokeDashoffset: 0, duration: 1.1, ease: "power2.inOut" },
        1.9
      );
      tl.to(
        accentPath,
        { strokeDashoffset: 0, duration: 1.1, ease: "power2.inOut" },
        1.9
      );

      // [2.7s]: Mốc 1854 nở ra ở điểm kết thúc trục
      tl.to(
        "#milestone-1854",
        { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.4)" },
        2.7
      );

      // [3.3s]: Nét gạch nhánh bracket sang phải
      tl.to(
        bracketPath,
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        3.3
      );

      // [3.64s - 4.4s]: Overlay 2 - Diagram "BƯỚC NHẢY +203 NĂM" xuất hiện (t = 75280ms)
      tl.to(
        "#jump-badge",
        { opacity: 1, scale: 1, x: 0, duration: 0.6, ease: "power3.out" },
        3.64
      );

      // [4.5s - 7.0s]: Camera / Motion lướt nhẹ tạo sức sống cho biểu đồ
      tl.to(
        ".timeline-section",
        { y: -8, duration: 2.5, ease: "sine.inOut" },
        4.5
      );

      // [7.31s - 8.2s]: Overlay 3 - Thẻ hồ sơ "GEORGE BOOLE" đáp xuống mạnh mẽ (t = 78950ms)
      tl.to(
        "#boole-card",
        { opacity: 1, y: 0, scale: 1, duration: 0.75, ease: "power3.out" },
        7.31
      );

      // [9.32s - 10.3s]: Overlay 4 - Icon "check" tự vẽ SVG xác nhận giải pháp (t = 80960ms)
      tl.to(
        checkRing,
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        9.32
      );
      tl.to(
        checkStem,
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        9.6
      );

      // Rung nhẹ xác nhận hoàn tất giải quyết câu hỏi
      tl.fromTo(
        ".check-circle-plate",
        { scale: 0.9 },
        { scale: 1, duration: 0.4, ease: "back.out(1.8)" },
        9.55
      );

      // 5. Đăng ký timeline duy nhất vào HyperFrames runtime
      window.__timelines["scene-s10"] = tl;
    </script>
