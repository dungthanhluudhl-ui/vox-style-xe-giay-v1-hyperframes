  <script>
    // Build single seekable paused GSAP timeline
    const tl = gsap.timeline({ paused: true });

    // Path draw setup for SVG question mark
    const qPath = document.getElementById("q-mark-path");
    if (qPath) {
      const qLen = qPath.getTotalLength();
      qPath.style.strokeDasharray = qLen;
      qPath.style.strokeDashoffset = qLen;
    }

    // ----------------------------------------------------
    // PHASE 1: ENTRANCE (0.0s - 1.5s) - "strike" transition
    // Cả hai phòng xuất hiện hoàn toàn ẩn danh (Đối tượng X & Y)
    // ----------------------------------------------------
    tl.fromTo(
      "#main-content",
      { y: -24, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.0
    );

    tl.fromTo(
      "#header-bar",
      { opacity: 0, y: -15 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
      0.15
    );

    tl.fromTo(
      "#room-a",
      { scale: 0.9, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      0.2
    );

    tl.fromTo(
      "#room-b",
      { scale: 0.9, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      0.3
    );

    tl.fromTo(
      "#divider-barrier",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.4, ease: "power2.out" },
      0.4
    );

    tl.fromTo(
      "#interrogator-room",
      { y: 30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.45
    );

    // Initial state of question badge
    tl.set("#question-badge", { scale: 0, opacity: 0 }, 0);

    // ----------------------------------------------------
    // PHASE 2: HOÁN ĐỔI VỊ TRÍ & DẤU HỎI LỚN (1.62s - 4.0s)
    // Overlay 1: question icon atMs 269580 -> local 1.62s
    // Hai căn phòng hoán đổi vị trí và xáo trộn danh tính
    // ----------------------------------------------------
    tl.fromTo(
      "#question-badge",
      { scale: 0, opacity: 0, rotation: -40 },
      { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: "back.out(1.8)" },
      1.62
    );

    if (qPath) {
      tl.to(
        qPath,
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        1.65
      );
    }

    tl.fromTo(
      "#q-mark-dot",
      { scale: 0 },
      { scale: 1, duration: 0.2, ease: "back.out(2)" },
      1.9
    );

    // Hoán đổi vị trí vật lý giữa Phòng A và Phòng B (khoảng cách tâm = 498px)
    tl.to("#room-a", { x: 498, duration: 0.65, ease: "power2.inOut" }, 1.65);
    tl.to("#room-b", { x: -498, duration: 0.65, ease: "power2.inOut" }, 1.65);

    // Chuyển thẻ định danh sang trạng thái nghi vấn "Ai là máy? Ai là người?"
