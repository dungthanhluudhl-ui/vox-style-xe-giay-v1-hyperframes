      // Create paused GSAP timeline
      const tl = gsap.timeline({ paused: true });

      // 1. Initial State Settings (tất định, seek-safe)

      // 2. Camera entrance & continuous slow zoom (0s - 11.68s)
      tl.fromTo(
        "#scene-content",
        { scale: 0.94, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 1.1, ease: "power3.out" },
        0
      );
      tl.to(
        "#camera-rig",
        { scale: 1.04, y: -16, duration: 11.68, ease: "none" },
        0
      );

      // 3. Document card entrance (0.3s)
      tl.fromTo(
        "#doc-card",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.9, ease: "power3.out" },
        0.3
      );

      // 4. Overlay 1: BÀI BÁO NĂM 1950 (atMs 279940 -> 2.38s)
      tl.to(
        "#badge-1950",
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        2.38
      );

      // 5. Magnifying Glass moves over the key note (3.2s)
      tl.to(
        "#magnifier-wrapper",
        { opacity: 1, scale: 1.0, x: 0, y: 0, duration: 1.1, ease: "power3.out" },
        3.2
      );

      // 6. Overlay 2: Pin marker "ĐIỂM THEN CHỐT" (atMs 283350 -> 5.79s)
      tl.to(
        "#pin-marker",
        { opacity: 1, scale: 1.0, y: 0, duration: 0.5, ease: "power3.out" },
        5.79
      );

      // Nhấn viền cam ở hộp ghi chú khi nhắc tới ý niệm
      tl.to(
        "#key-note",
        { borderColor: "#FF6A1A", duration: 0.4, ease: "power2.out" },
        6.1
      );

      // 7. Overlay 3: Punch-phrase "Ý NIỆM VƯỢT THỜI GIAN" (atMs 286420 -> 8.86s)

        "#punch-container",
        { opacity: 1, scale: 1.0, y: 0, duration: 0.65, ease: "power3.out" },
        8.86

        "#connector-line",
        { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" },
        9.5

      // 9. Overlay 4: Diagram "KẾT NỐI MÁY HIỆN ĐẠI" with smartphone (atMs 287770 -> 10.21s)

        "#modern-device",
        { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" },
        10.21

        { scale: 0.9, opacity: 0.9 },
        { scale: 1.25, opacity: 0, duration: 0.8, ease: "power2.out" },
        10.45
