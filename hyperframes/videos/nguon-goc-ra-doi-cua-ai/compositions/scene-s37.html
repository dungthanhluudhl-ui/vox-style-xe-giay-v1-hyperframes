<!doctype html>

  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #141414;
        color: #f7f4ec;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #141414;
      }
      /* Quy ước bắt buộc: .clip dùng inset: 0, không đặt width/height cứng */
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Các lớp màu tương phản WCAG an toàn */
      .hf-text-ink {
        color: #141414;
      }
      .hf-text-light {
        color: #f7f4ec;
      }
      .hf-hl-orange {
        background-color: #ff6a1a;
        color: #141414;
      }
      .hf-plate-ink {
        background-color: #141414;
        color: #f7f4ec;
      }
      .hf-plate-ink-orange {
        background-color: #141414;
        color: #ff6a1a;
      }
      .hf-plate-paper {
        background-color: #e7e3d9;
        color: #141414;
      }

      /* Camera & visual container */
      #camera-rig {
        position: absolute;
        inset: 0;
        transform-origin: 50% 45%;
        will-change: transform;
      }
      #bg-wrapper {
        position: absolute;
        inset: 0;
        transform-origin: 50% 45%;
        will-change: transform, opacity;
      }
      #hero-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
      }

      /* Biến thể nền spotlight: vignette tối che mờ viền theo phong cách Vox */
      .spotlight-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 42%,
          rgba(20, 20, 20, 0.05) 25%,
          rgba(20, 20, 20, 0.6) 65%,
          rgba(20, 20, 20, 0.95) 100%
        );
        pointer-events: none;
      }

      /* Lưới tọa độ đồ họa kỹ thuật mờ */
      .grid-lines {
        position: absolute;
        inset: 0;
        background-size: 84px 84px;
        background-image:
          linear-gradient(to right, rgba(247, 244, 236, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(247, 244, 236, 0.04) 1px, transparent 1px);
        pointer-events: none;
      }

      /* Thanh cam nhận diện thương hiệu cố định đáy khung hình */
      #bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 14px;
        background: #ff6a1a;
        z-index: 99;
      }

      /* Container căn giữa flexbox an toàn, không xung đột transform GSAP */
      .flex-center-top {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        pointer-events: none;
      }
      .flex-center-bottom {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        pointer-events: none;
      }

      /* Overlay 1: Question badge */
      #question-box {
        margin-top: 220px;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 18px 36px;
        background: #141414;
        border: 3px solid #ff6a1a;
        border-radius: 14px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
        will-change: transform, opacity;
      }
      .question-text {
        font-size: 38px;
        font-weight: 900;
        color: #f7f4ec;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin: 0;
      }

      /* Overlay 2 & 3: Punch-phrase cards */
      .punch-card {
        margin-bottom: 580px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        will-change: transform, opacity;
      }
      .punch-tag {
        font-size: 22px;
        font-weight: 900;
        padding: 6px 18px;
        border-radius: 6px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .punch-main-plate {
        background: #141414;
        padding: 18px 42px;
        border-radius: 14px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        border: 2px solid rgba(255, 106, 26, 0.4);
      }
      .punch-title {
        margin: 0;
        font-size: 58px;
        font-weight: 900;
        line-height: 1.3;
        text-align: center;
        letter-spacing: -0.5px;
      }
    </style>

    <!-- Root composition: portrait 1080x1920, duration 8.256s -->
    <div
      id="root"
      data-composition-id="scene-s37"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="8.256"
    >
      <!-- Thanh cam đặc trưng Vox ở mép dưới cùng -->
      <div id="bottom-brand-bar"></div>

      <!-- Layer 1: Shot chính & Background Photo với chuyển động Ken Burns -->
      <div id="camera-rig" class="clip" data-start="0" data-duration="8.256">
        <div id="bg-wrapper">
          <img
            id="hero-image"
            src="assets/img-01-brain-neural-network-cutout.jpg"
            alt="Mô hình đầu người bằng giấy xé mở để lộ mạng nơ-ron và vi mạch số"
          />
          <div class="spotlight-vignette"></div>
          <div class="grid-lines"></div>
        </div>
      </div>

      <!-- Layer 2: Diagram HUD kết nối mạng nơ-ron sinh học & số hóa -->
      <div id="diagram-layer" class="clip" data-start="0.6" data-duration="7.656">
        <svg
          id="diagram-svg"
          viewBox="0 0 1080 1920"
          style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none"
        >
          <!-- Khung định vị (reticles) vùng đầu não -->
          <g id="reticle-group" stroke="#ff6a1a" stroke-width="3" fill="none" opacity="0.85">
            <path d="M 340 680 L 300 680 L 300 720" />
            <path d="M 740 680 L 780 680 L 780 720" />
            <path d="M 300 860 L 300 900 L 340 900" />
            <path d="M 780 860 L 780 900 L 740 900" />
          </g>

          <!-- Đường dẫn nơ-ron kỹ thuật số hướng tới Callout 1 (Top-Right) -->
          <path
            id="neural-path-1"
            d="M 540 760 L 640 560 L 720 560 L 720 440"
            fill="none"
            stroke="#ff6a1a"
            stroke-width="3"
            stroke-linecap="round"
          />
          <circle id="node-point-1" cx="540" cy="760" r="6" fill="#ff6a1a" />

          <!-- Khối chú thích số liệu kỹ thuật (Callout 1) -->
          <g id="callout-1" opacity="0">
            <rect
              x="620"
              y="340"
              width="380"
              height="94"
              rx="10"
              fill="#141414"
              stroke="#ff6a1a"
              stroke-width="2.5"
            />
            <text
              x="644"
              y="374"
              fill="#ff6a1a"
              font-family="'Be Vietnam Pro', sans-serif"
              font-size="16"
              font-weight="900"
              letter-spacing="1.5"
            >
              SYNAPTIC PATHWAY
            </text>
            <text
              x="644"
              y="412"
              fill="#f7f4ec"
              font-family="'Be Vietnam Pro', sans-serif"
              font-size="24"
              font-weight="900"
            >
              10¹⁴ LIÊN KẾT NƠ-RON
            </text>
          </g>

          <!-- Đường dẫn nơ-ron sinh học hướng tới Callout 2 (Bottom-Left) -->
          <path
            id="neural-path-2"
            d="M 460 840 L 320 940 L 160 940 L 160 1010"
            fill="none"
            stroke="#ff6a1a"
            stroke-width="3"
            stroke-linecap="round"
          />
          <circle id="node-point-2" cx="460" cy="840" r="6" fill="#ff6a1a" />

          <!-- Khối chú thích phân lớp sinh học (Callout 2) -->
          <g id="callout-2" opacity="0">
            <rect
              x="80"
              y="1010"
              width="390"
              height="92"
              rx="10"
              fill="#141414"
              stroke="#ff6a1a"
              stroke-width="2.5"
            />
            <text
              x="104"
              y="1044"
              fill="#ff6a1a"
              font-family="'Be Vietnam Pro', sans-serif"
              font-size="16"
              font-weight="900"
              letter-spacing="1.5"
            >
              NEURAL SUBSTRATE
            </text>
            <text
              x="104"
              y="1082"
              fill="#f7f4ec"
              font-family="'Be Vietnam Pro', sans-serif"
              font-size="24"
              font-weight="900"
            >
              CƠ CHẾ SINH HỌC
            </text>
          </g>
        </svg>
      </div>

      <!-- Layer 3: Overlay Icon "question" (atMs: 300630 -> 1.47s, holdMs: 1800 -> 1.8s) -->
      <div
        id="clip-question"
        class="clip flex-center-top"
        data-start="1.47"
        data-duration="1.8"
      >
        <div id="question-box">
          <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
            <path
              id="svg-q-curve"
              d="M 14 16 C 14 10, 30 10, 30 18 C 30 24, 22 25, 22 31"
              stroke="#ff6a1a"
              stroke-width="4.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle id="svg-q-dot" cx="22" cy="38" r="2.8" fill="#ff6a1a" />
          </svg>
          <h2 class="question-text">HỌC BẰNG CÁCH NÀO?</h2>
        </div>
      </div>

      <!-- Layer 4: Overlay Punch-phrase 1 "MÔ PHỎNG NÃO NGƯỜI" (atMs: 303620 -> 4.46s, holdMs: 2000 -> 2.0s) -->
      <div
        id="clip-punch-1"
        class="clip flex-center-bottom"
        data-start="4.46"
        data-duration="2.0"
      >
        <div id="punch-card-1" class="punch-card">
          <div id="punch-tag-1" class="punch-tag hf-hl-orange">CƠ CHẾ CỐT LÕI</div>
          <div class="punch-main-plate">
            <h1 class="punch-title hf-text-light">MÔ PHỎNG NÃO NGƯỜI</h1>
          </div>
        </div>

      <!-- Layer 5: Overlay Punch-phrase 2 "MẠNG NƠ-RON (AI)" (atMs: 306480 -> 7.32s, còn lại 0.936s đến hết scene) -->
      <div
        id="clip-punch-2"
        class="clip flex-center-bottom"
        data-start="7.32"
        data-duration="0.936"
      >
        <div id="punch-card-2" class="punch-card">
          <div id="punch-tag-2" class="punch-tag hf-hl-orange">BƯỚC NGOẶT LỊCH SỬ</div>
          <div class="punch-main-plate" style="border-color: #ff6a1a">

    </div>

    <!-- GSAP seekable timeline logic -->
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1. Đo độ dài thực tế của các đường vector SVG để vẽ nét động (stroke-dasharray)
      const qCurve = document.getElementById("svg-q-curve");
      const path1 = document.getElementById("neural-path-1");
      const path2 = document.getElementById("neural-path-2");

      const qLen = qCurve ? qCurve.getTotalLength() : 80;
      const len1 = path1 ? path1.getTotalLength() : 380;
      const len2 = path2 ? path2.getTotalLength() : 380;

      if (qCurve) {
        qCurve.style.strokeDasharray = qLen;
        qCurve.style.strokeDashoffset = qLen;
      }
      if (path1) {
        path1.style.strokeDasharray = len1;
        path1.style.strokeDashoffset = len1;
      }
      if (path2) {
        path2.style.strokeDasharray = len2;
        path2.style.strokeDashoffset = len2;
      }

      // 2. Chuyển động vào cảnh: transitionIn "zoom-through" từ scale 1.25 -> 1.0 (0.0s - 0.85s)
      tl.fromTo(
        "#bg-wrapper",
        { scale: 1.25, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.85, ease: "power3.out" },
        0
      );

      // 3. Ken Burns zoom chậm toàn cảnh từ 1.0 đến 1.08 theo kịch bản (0.85s -> 8.256s)
      tl.to("#camera-rig", { scale: 1.08, duration: 7.4, ease: "none" }, 0.85);

      // 4. Diagram reveal: Khung định vị và các đường nơ-ron phát sáng vẽ dần (bắt đầu từ 0.65s)
      tl.fromTo(
        "#reticle-group",
        { scale: 0.85, opacity: 0, transformOrigin: "540px 780px" },
        { scale: 1.0, opacity: 0.85, duration: 0.6, ease: "power3.out" },
        0.65
      );
      tl.to("#neural-path-1", { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" }, 0.75);
      tl.fromTo(
        "#callout-1",
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.1
      );
      tl.to("#neural-path-2", { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" }, 1.3);
      tl.fromTo(
        "#callout-2",
        { y: -20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.65
      );

      // 5. Overlay 1: Biểu tượng Question vẽ dần & xuất hiện (1.47s - 3.27s)
      tl.fromTo(
        "#question-box",
        { y: -35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        1.47
      );
      if (qCurve) {
        tl.to("#svg-q-curve", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.55);
      }
      tl.fromTo(
        "#svg-q-dot",
        { scale: 0, transformOrigin: "22px 38px" },
        { scale: 1, duration: 0.2, ease: "back.out(2)" },
        1.85
      );
      // Fade out Overlay 1 trước khi clip kết thúc tại 3.27s
      tl.to("#question-box", { y: -25, opacity: 0, duration: 0.25, ease: "power2.in" }, 3.02);

      // 6. Overlay 2: Punch-phrase "MÔ PHỎNG NÃO NGƯỜI" (4.46s - 6.46s)
      tl.fromTo(
        "#punch-card-1",
        { scale: 0.88, y: 35, opacity: 0 },
        { scale: 1.0, y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        4.46
      );
      tl.fromTo(
        "#punch-tag-1",
        { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1.0, opacity: 1, duration: 0.35, ease: "power3.out" },
        4.6
      );
      // Fade out Overlay 2 trước khi clip kết thúc tại 6.46s
      tl.to("#punch-card-1", { y: -20, opacity: 0, duration: 0.25, ease: "power2.in" }, 6.21);

      // 7. Overlay 3: Punch-phrase "MẠNG NƠ-RON (AI)" (7.32s - 8.256s) - chốt lại hành trình
      tl.fromTo(
        "#punch-card-2",
        { scale: 0.88, y: 35, opacity: 0 },
        { scale: 1.0, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        7.32
      );
      tl.fromTo(
        "#punch-tag-2",
        { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1.0, opacity: 1, duration: 0.3, ease: "power3.out" },
        7.45
      );

      // Đăng ký timeline cho HyperFrames seek
      window.__timelines["scene-s37"] = tl;
    </script>
  
    </template>
