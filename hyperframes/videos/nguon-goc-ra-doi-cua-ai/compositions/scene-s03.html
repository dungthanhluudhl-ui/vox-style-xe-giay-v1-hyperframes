<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f5f0e4;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Scene Content Layer */
      #scene-content {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      /* Background Photo & Ken Burns Container */
      .bg-container {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .bg-image {
        position: absolute;
        top: -40px;
        left: -40px;
        width: 1160px;
        height: 2000px;
        object-fit: cover;
        display: block;
        transform-origin: 50% 60%;
      }

      /* Overlays & Editorial Plates */
      .overlay-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
      }

      .editorial-plate {
        position: absolute;
        left: 80px;
        width: 920px;
        background: #141414;
        border-radius: 14px;
        border-left: 10px solid #ff6a1a;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.42);
        box-sizing: border-box;
      }

      /* Overlay 1: Thomas Hobbes Label */
      #label-hobbes {
        top: 200px;
        padding: 26px 36px;
      }
      .plate-tag-row {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
      }
      .plate-tag {
        background: #ff6a1a;
        color: #141414;
        font-size: 22px;
        font-weight: 900;
        padding: 5px 14px;
        border-radius: 4px;
        letter-spacing: 1.5px;
        display: inline-block;
      }
      .plate-title {
        color: #f7f4ec;
        font-size: 46px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: -0.5px;
        margin: 0;
      }

      /* Overlay 2: Punch Phrase 1651 */
      #punch-1651 {
        top: 450px;
        padding: 30px 36px;
      }
      .punch-badge-row {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
      }
      .punch-badge {
        background: #ff6a1a;
        color: #141414;
        font-size: 22px;
        font-weight: 900;
        padding: 5px 14px;
        border-radius: 4px;
        letter-spacing: 1.5px;
        display: inline-block;
      }
      .punch-year {
        color: #f7f4ec;
        font-size: 76px;
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: -1.5px;
        margin: 4px 0 0 0;
      }
      .punch-desc {
        color: #ff6a1a;
        font-size: 32px;
        font-weight: 900;
        margin-top: 10px;
        letter-spacing: 0.5px;
      }

      /* Overlay 3: Document SVG Badge */
      #doc-badge {
        top: 720px;
        padding: 22px 32px;
        display: flex;
        align-items: center;
        gap: 26px;
      }
      .doc-icon-wrap {
        width: 80px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .doc-text-wrap {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .doc-title {
        color: #f7f4ec;
        font-size: 34px;
        font-weight: 900;
        line-height: 1.2;
      }
      .doc-subtitle {
        color: #ff6a1a;
        font-size: 24px;
        font-weight: 700;
        margin-top: 4px;
        letter-spacing: 0.5px;
      }

      /* Progressively Drawn SVG */
      .draw-path {
        fill: none;
        stroke: #ff6a1a;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Style DNA Signature Bottom Orange Bar */
      #bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 10px;
        background: #ff6a1a;
        z-index: 999;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s03"
      data-width="1080"
      data-height="1920"
      data-duration="8.01"
    >
      <!-- Shot S03-1: 0s to 8.01s -->
      <div id="shot-s03-1" class="clip" data-start="0" data-duration="8.01">
        <div id="scene-content">
          <!-- Background Scholar Illustration (kept natural without code vignette or color filter) -->
          <div class="bg-container">
            <img
              id="bg-img"
              class="bg-image"
              src="assets/img-11-scholar-writing-paper-cutout.jpg"
              alt="Học giả Thomas Hobbes viết sách"
            />
          </div>

          <!-- Editorial Overlays -->
          <div class="overlay-container">
            <!-- Overlay 1: Thomas Hobbes Label (Starts at 1.06s) -->
            <div id="label-hobbes" class="editorial-plate">
              <div class="plate-tag-row">
                <span class="plate-tag">TRIẾT HỌC ANH</span>
              </div>
              <div class="plate-title">THOMAS HOBBES (1588-1679)</div>
            </div>

            <!-- Overlay 2: Punch Phrase MỐC NĂM 1651 (Starts at 4.78s) -->
            <div id="punch-1651" class="editorial-plate">
              <div class="punch-badge-row">
                <span class="punch-badge">XUẤT BẢN LEVIATHAN</span>
              </div>
              <div class="punch-year">MỐC NĂM 1651</div>
              <div class="punch-desc">ĐẶT NỀN TẢNG LUẬN ĐIỂM</div>
            </div>

            <!-- Overlay 3: Document Icon Badge (Starts at 7.30s) -->
            <div id="doc-badge" class="editorial-plate">
              <div class="doc-icon-wrap">
                <svg id="doc-svg" viewBox="0 0 100 100" width="76" height="76">
                  <path id="doc-outline" class="draw-path" d="M 24 14 L 60 14 L 76 30 L 76 86 L 24 86 Z" />
                  <path id="doc-fold" class="draw-path" d="M 60 14 L 60 30 L 76 30" />
                  <path id="doc-l1" class="draw-path" d="M 36 46 L 64 46" />
                  <path id="doc-l2" class="draw-path" d="M 36 58 L 64 58" />
                  <path id="doc-l3" class="draw-path" d="M 36 70 L 52 70" />
                </svg>
              </div>
              <div class="doc-text-wrap">
                <div class="doc-title">TÁC PHẨM ĐẶT NỀN MÓNG</div>
                <div class="doc-subtitle">ĐỒNG NGUYÊN TƯ DUY VỚI TÍNH TOÁN</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Static Signature Bottom Orange Line -->
      <div id="bottom-bar"></div>
    </div>

    <script>
      // Setup self-drawing SVG paths before timeline runs
      const paths = document.querySelectorAll(".draw-path");
      paths.forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
      });

      // Construct master seekable GSAP timeline
      const tl = gsap.timeline({ paused: true });

      // Scene entrance (rise animation) at t=0s
      tl.fromTo(
        "#scene-content",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
        0
      );

      // Ken Burns subtle camera motion (pan right + zoom in scale 1.02 -> 1.08)
      tl.fromTo(
        "#bg-img",
        { scale: 1.02, x: -20, y: 0 },
        { scale: 1.08, x: 20, y: -12, duration: 8.01, ease: "none" },
        0
      );

      // Overlay 1: Thomas Hobbes Label (atMs: 18900 -> relative 1.06s)
      tl.fromTo(
        "#label-hobbes",
        { x: -70, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        1.06
      );

      // Overlay 1 gentle fade out at t=3.46s (holdMs: 2400)
      tl.to(
        "#label-hobbes",
        { x: -30, opacity: 0, duration: 0.45, ease: "power2.in" },
        3.46
      );

      // Overlay 2: Punch Phrase MỐC NĂM 1651 (atMs: 22620 -> relative 4.78s)
      tl.fromTo(
        "#punch-1651",
        { y: 35, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" },
        4.78
      );

      // Overlay 3: Document Badge (atMs: 25140 -> relative 7.30s)
      tl.fromTo(
        "#doc-badge",
        { y: 25, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        7.3
      );

      // Self-drawing SVG Document paths trace progressively
      tl.to(
        ".draw-path",
        { strokeDashoffset: 0, duration: 0.45, stagger: 0.07, ease: "power2.out" },
        7.38
      );

      // Register timeline on global registry for HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s03"] = tl;
    </script>
  
    </template>
  </body>
</html>
