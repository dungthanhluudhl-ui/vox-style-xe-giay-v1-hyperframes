  <script>
    // HyperFrames Seekable GSAP Timeline Registration
    const tl = gsap.timeline({ paused: true });

    // Initial setup states (strictly deterministic)
    tl.set("#header-meta", { opacity: 0, y: -20 });
    tl.set("#debate-panel", { opacity: 0, y: 30 });
    tl.set("#stamp-debate", { opacity: 0, scale: 0.6 });
    tl.set("#strike-divider", { scaleX: 0 });
    tl.set("#algebra-hero", { opacity: 0, y: 40, scale: 0.95 });
    tl.set("#op-plus-card", { opacity: 0, x: -30 });
    tl.set("#op-minus-card", { opacity: 0, x: 30 });
    tl.set("#diagram-badge-wrap", { opacity: 0, y: 20 });

    // --- PHASE 1: Entrance (Strike in establishing the 2000-year philosophical debate) ---
    // t = 0.2s: Header and debate panel appear
    tl.to("#header-meta", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.2);
    tl.to("#debate-panel", { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);

    // --- PHASE 2: Overlay 1 ("2.000 NĂM TRANH BIỆN" at 1.42s) ---
    // 144180ms - 142760ms = 1420ms = 1.42s
    tl.to("#stamp-debate", {
      opacity: 1,
      scale: 1,
      duration: 0.45,
      ease: "power3.out"
    }, 1.42);

    // Divider strike cut launches
    tl.to("#strike-divider", { scaleX: 1, duration: 0.45, ease: "expo.out" }, 3.2);

    // --- PHASE 3: Compression of Debate Panel & Arrival of Algebraic Punch Phrase ---
    // Upper debate panel shrinks slightly to yield focus to mathematical logic
    tl.to("#debate-panel", {
      scale: 0.94,
      opacity: 0.75,
      duration: 0.6,
      ease: "power2.inOut"
    }, 4.2);

    // Overlay 2: Punch-phrase "LOGIC -> ĐẠI SỐ" at 4.88s
    // 147640ms - 142760ms = 4880ms = 4.88s
    tl.to("#algebra-hero", {
      opacity: 1,
      y: 0,
      scale: 1,
      duration: 0.6,
      ease: "power3.out"
    }, 4.88);

    // Arrow pulse emphasis
    tl.fromTo(".hero-arrow", 
      { scale: 0.9 }, 
      { scale: 1.2, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out" }, 
      5.35
    );

    // --- PHASE 4: Overlay 3 - Diagram "ĐÓNG KHUNG BẰNG [+] VÀ [−]" at 6.84s ---
    // 149600ms - 142760ms = 6840ms = 6.84s
    tl.to("#op-plus-card", {
      opacity: 1,
      x: 0,
      duration: 0.35,
      ease: "power3.out"
    }, 6.4);

    tl.to("#op-minus-card", {
      opacity: 1,
      x: 0,
      duration: 0.35,
      ease: "power3.out"
    }, 6.55);

    tl.to("#diagram-badge-wrap", {
      opacity: 1,
      y: 0,
      duration: 0.45,
      ease: "power3.out"
    }, 6.84);

    // Register paused timeline with HyperFrames runtime
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s19"] = tl;
  </script>
