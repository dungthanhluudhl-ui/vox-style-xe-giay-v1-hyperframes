    <!-- GSAP Seekable Timeline Script -->
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Setup SVG stroke dash for question path
      const qPath = document.getElementById("question-path");
      if (qPath) {
        const len = qPath.getTotalLength();
        qPath.style.strokeDasharray = len;
        qPath.style.strokeDashoffset = len;
      }
      const qDot = document.getElementById("question-dot");
      if (qDot) {
        gsap.set(qDot, { scale: 0, opacity: 0, transformOrigin: "center center" });
      }

      // 1. Scene Entrance (Punch transition) at t = 0
      tl.fromTo(
        "#hero-frame",
        { scale: 0.88, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.45, ease: "power4.out" },
        0
      );

      // Header bar subtle slide-down
      tl.fromTo(
        "#header-bar",
        { y: -20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.1
      );

      // Continuous Ken Burns zoom-in (1.0 to 1.08 over 11.82s)
      tl.fromTo(
        "#hero-img",
        { scale: 1.0 },
        { scale: 1.08, duration: 11.82, ease: "none" },
        0
      );

      // 2. Overlay 1: Question Icon & Label (1.30s -> 3.10s)
      tl.fromTo(
        "#card-overlay-1",
        { scale: 0.85, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        1.30
      );
      if (qPath) {
        tl.to(
          "#question-path",
          { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
          1.40
        );
      }
      if (qDot) {
        tl.to(
          "#question-dot",
          { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(1.7)" },
          1.85
        );
      }
      // Exit fade before clip boundary
      tl.to(
        "#card-overlay-1",
        { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" },
        2.85
      );

      // 3. Overlay 2: Punch-phrase "CỘT MỐC 1854" (4.15s -> 6.15s)

        "#card-overlay-2",
        { scale: 0.88, opacity: 0, y: 36 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power4.out" },
        4.15

        "#phrase-1854",
        { scale: 1.1 },
        { scale: 1, duration: 0.35, ease: "power3.out" },
        4.25
      );
      tl.to(
        "#card-overlay-2",
        { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" },
        5.85

      // 4. Overlay 3: Diagram "KIỆT TÁC LOGIC" (6.81s -> 9.01s)

        { scale: 0.9, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        6.81
      );
      tl.fromTo(
        "#diagram-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "power2.out" },
        7.05
      );
      tl.to(
        "#card-overlay-3",
        { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" },
        8.75
      );

      // 5. Overlay 4: Label "THAM VỌNG KHAI PHÁ" (10.40s -> 11.82s)

        10.40
      );
