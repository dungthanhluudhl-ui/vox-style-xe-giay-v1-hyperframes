    <script>
      // Initialize seekable GSAP timeline
      const tl = gsap.timeline({ paused: true });

      // Pre-configure SVG clock stroke properties for deterministic drawing
      const clockRim = document.getElementById("clock-rim");
      const rimLength = 2 * Math.PI * 22; // ~138.23px
      clockRim.style.strokeDasharray = rimLength.toString();
      clockRim.style.strokeDashoffset = rimLength.toString();

      // Initial visual states
      gsap.set("#stamp-mark", { opacity: 0, scale: 1.8, rotation: -24 });
      gsap.set("#stamp-shockwave", { opacity: 0, scale: 0.85 });
      gsap.set("#timeline-badge", { opacity: 0, y: 30, scale: 0.96 });
      gsap.set("#punch-card", { opacity: 0, y: -40, scale: 0.96 });
      gsap.set("#punch-badge", { scale: 0 });

      // 1. Scene Entrance: Wobble-Drop of Boole's Manuscript (0.05s -> 0.75s)
      tl.fromTo(
        "#manuscript-wrapper",
        { y: -160, scale: 0.92, rotation: -4, opacity: 0 },
        { y: 0, scale: 1, rotation: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.05,
      );
      // Secondary settle
      tl.to("#manuscript-wrapper", { rotation: 1.2, duration: 0.2, ease: "sine.inOut" }, 0.45);
      tl.to("#manuscript-wrapper", { rotation: 0, duration: 0.25, ease: "power2.out" }, 0.65);

      // Subtle slow documentary camera zoom (0.0s -> 6.56s)
      tl.to(
        "#camera-stage",
        { scale: 1.04, transformOrigin: "50% 35%", duration: 6.56, ease: "none" },
        0,
      );

      // 2. Punch Phrase Entrance: "70 NĂM LÃNG QUÊN" (atMs: 159190 = 0.55s)
      tl.to(
        "#punch-card",
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        0.55,
      );
      tl.to(
        "#punch-badge",
        { scale: 1, duration: 0.32, ease: "back.out(1.5)" },
        0.72,
      );

      // 3. Decades Accumulation: Dust Layer & Shadow fade in (1.2s -> 4.5s)
      tl.to("#dust-layer", { opacity: 0.5, duration: 3.2, ease: "power1.inOut" }, 1.2);
      tl.to("#shelf-shadow", { opacity: 0.6, duration: 3.2, ease: "power1.inOut" }, 1.2);

      // 4. Timeline & Clock Reveal (atMs: 162190 = 3.55s)
      tl.to(
        "#timeline-badge",
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        3.55,
      );
      tl.to(
        clockRim,
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        3.65,
      );
      tl.fromTo(
        "#clock-minute-hand",
        { rotation: 0 },
        { rotation: 720, transformOrigin: "26px 26px", duration: 1.3, ease: "power2.inOut" },
        3.65,
      );
      tl.fromTo(
        "#clock-hour-hand",
        { rotation: 0 },
        { rotation: 210, transformOrigin: "26px 26px", duration: 1.3, ease: "power2.inOut" },
        3.65,
      );

      // Counter animation: 1854 -> 1924 (70 years timeline)
      const yearCounterEl = document.getElementById("year-counter");
      const yearState = { val: 1854 };
      tl.to(
        yearState,
        {
          val: 1924,
          duration: 1.1,
          ease: "power2.out",
          onUpdate: () => {
            yearCounterEl.textContent = Math.round(yearState.val).toString();
          },
        },
        3.75,
      );

      // 5. Climax Diagram: Heavy Rejection Stamp [ VÔ DỤNG ] (atMs: 164300 = 5.66s)
      tl.to(
        "#stamp-mark",
        { scale: 1, opacity: 1, rotation: -8, duration: 0.22, ease: "power4.in" },
        5.66,
      );

      // Physical impact shockwave & page shudder (5.88s)
      tl.fromTo(
        "#stamp-shockwave",
        { scale: 0.85, opacity: 0.85 },
        { scale: 1.3, opacity: 0, duration: 0.3, ease: "power2.out" },
        5.88,
      );
      tl.to("#manuscript", { y: 6, duration: 0.04, ease: "power1.in" }, 5.88);
      tl.to("#manuscript", { y: -2, duration: 0.06, ease: "power1.out" }, 5.92);
      tl.to("#manuscript", { y: 0, duration: 0.1, ease: "power2.out" }, 5.98);

      // Register the completed timeline to HyperFrames runtime
      window.__timelines["scene-s21"] = tl;
    </script>
