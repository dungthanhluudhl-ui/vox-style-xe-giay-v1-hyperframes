      // Strike transition entrance (t=0.0s)

        { scale: 1.0, opacity: 1, y: 0, duration: 0.45, ease: "power4.out" },
        0.37

      tl.fromTo(
        "#punch-accent-bar",
        { scaleX: 0 },
        { scaleX: 1.0, duration: 0.45, ease: "power2.out" },
        0.55

      // Overlay 2: "rise" icon and podium ascent at t=3.24s
