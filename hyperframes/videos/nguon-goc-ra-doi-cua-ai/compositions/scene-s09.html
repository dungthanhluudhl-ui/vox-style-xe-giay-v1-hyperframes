<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Lớp nền lưới Vox đặc trưng 84px */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-size: 84px 84px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px);
        pointer-events: none;
        z-index: 1;
      }

      /* Biến thể Spotlight: vignette tập trung sự chú ý, tạo cảm giác bế tắc */
      .spotlight-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 46%, rgba(20, 20, 20, 0.05) 30%, rgba(20, 20, 20, 0.65) 100%);
        pointer-events: none;
        z-index: 4;
      }

      /* Khung chứa ảnh đồng hồ cát */
      .hero-viewport {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
        overflow: hidden;
      }
      .hero-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 50% 48%;
        will-change: transform;
      }

      /* Lớp Peel Transition bóc giấy lúc mở cảnh */
      .peel-mask {
        position: absolute;
        inset: 0;
        background-color: #e7e3d9;
        z-index: 6;
        pointer-events: none;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }
      .peel-edge {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 18px;
        background: #ff6a1a;
        box-shadow: 0 0 24px rgba(20, 20, 20, 0.5);
      }

      /* Thanh cam nhận diện cố định ở đáy khung hình */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 16px;
        background-color: #ff6a1a;
        z-index: 50;
      }

      /* Bảng màu chuẩn WCAG từ style-tokens */
      .hf-plate-ink {
        background-color: #141414;
        color: #f7f4ec;
      }
      .hf-hl-orange {
        background-color: #ff6a1a;
        color: #141414;
      }

      /* Overlay 1: Icon Ban (Cấm / Bế tắc) */
      .icon-overlay-clip {
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
        pointer-events: none;
      }
      .icon-card {
        position: absolute;
        top: 340px;
        width: 150px;
        height: 150px;
        border-radius: 24px;
        border: 4px solid #ff6a1a;
        box-shadow: 12px 14px 0px #141414;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: center center;
      }
      .icon-svg {
        width: 90px;
        height: 90px;
      }

      /* Overlay 2: Punch-phrase 200 NĂM BẾ TẮC */
      .punch-overlay-clip {
        display: flex;
        justify-content: center;
        z-index: 25;
        pointer-events: none;
      }
      .punch-card {
        position: absolute;
        top: 960px;
        width: 920px;
        padding: 38px 44px;
        border-radius: 20px;
        box-shadow: 16px 18px 0px rgba(20, 20, 20, 0.95);
        display: flex;
        flex-direction: column;
        gap: 18px;
        transform-origin: center center;
      }
      .punch-kicker-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .punch-kicker-tag {
        display: inline-block;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 6px 16px;
        border-radius: 6px;
      }
      .punch-kicker-line {
        flex: 1;
        height: 3px;
        background-color: #ff6a1a;
      }
      .punch-heading {
        display: flex;
        align-items: baseline;
        gap: 20px;
        margin: 0;
        line-height: 1.15;
      }
      .punch-badge {
        font-size: 72px;
        font-weight: 900;
        padding: 4px 20px;
        border-radius: 10px;
        letter-spacing: -1px;
      }
      .punch-main-text {
        font-size: 72px;
        font-weight: 900;
        letter-spacing: -1px;
      }

      /* Overlay 3: Label Bài toán bỏ ngỏ */
      .label-overlay-clip {
        display: flex;
        justify-content: center;
        z-index: 25;
        pointer-events: none;
      }
      .label-pill {
        position: absolute;
        top: 1040px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 22px 38px;
        border-radius: 999px;
        border: 3px solid #ff6a1a;
        box-shadow: 10px 12px 0px #141414;
        transform-origin: center center;
      }
      .label-dot {
        width: 18px;
        height: 18px;
        background-color: #ff6a1a;
        border-radius: 50%;
      }
      .label-text {
        font-size: 38px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s09"
      data-width="1080"
      data-height="1920"
      data-duration="6.61"
    >
      <!-- Nền lưới toạ độ Vox -->
      <div class="bg-grid"></div>

      <!-- Hero Viewport chứa ảnh đồng hồ cát cổ -->
      <div class="hero-viewport">
        <img
          id="hero-img"
          class="hero-image"
          src="assets/img-03-hourglass-unsolved-timeline-mystery.jpg"
          alt="Đồng hồ cát bế tắc"
        />
      </div>

      <!-- Spotlight vignette cho mood nghịch lý / bế tắc -->
      <div class="spotlight-vignette"></div>

      <!-- Lớp giấy bóc Peel mở cảnh (0s -> 0.75s) -->
      <div id="peel-wrapper" class="clip" data-start="0" data-duration="0.95">
        <div id="peel-bg" class="peel-mask"></div>
      </div>

      <!-- Overlay 1: Icon Ban (xuất hiện tại 0.84s, giữ 1.8s) -->
      <div
        id="icon-ban-clip"
        class="clip icon-overlay-clip"
        data-start="0.84"
        data-duration="1.8"
      >
        <div id="ban-card" class="icon-card hf-plate-ink">
          <svg class="icon-svg" viewBox="0 0 100 100" fill="none">
            <circle
              id="ban-circle"
              cx="50"
              cy="50"
              r="36"
              stroke="#FF6A1A"
              stroke-width="8"
            />
            <line
              id="ban-slash"
              x1="26"
              y1="26"
              x2="74"
              y2="74"
              stroke="#F7F4EC"
              stroke-width="8"
              stroke-linecap="round"
            />
          </svg>
        </div>
      </div>

      <!-- Overlay 2: Punch-phrase 200 NĂM BẾ TẮC (từ 3.11s đến 5.25s) -->
      <div
        id="punch-phrase-clip"
        class="clip punch-overlay-clip"
        data-start="3.11"
        data-duration="2.14"
      >
        <div id="punch-card-box" class="punch-card hf-plate-ink">
          <div class="punch-kicker-row">
            <span class="punch-kicker-tag hf-hl-orange">NGHỊCH LÝ LỊCH SỬ</span>
            <div class="punch-kicker-line"></div>
          </div>
          <div class="punch-heading">
            <span class="punch-badge hf-hl-orange">200 NĂM</span>
            <span class="punch-main-text">BẾ TẮC</span>
          </div>
        </div>
      </div>

      <!-- Overlay 3: Label BÀI TOÁN BỎ NGỎ (từ 5.25s đến 6.61s) -->
      <div
        id="label-clip"
        class="clip label-overlay-clip"
        data-start="5.25"
        data-duration="1.36"
      >
        <div id="label-box" class="label-pill hf-plate-ink">
          <div class="label-dot"></div>
          <span class="label-text">BÀI TOÁN BỎ NGỎ</span>
        </div>
      </div>

      <!-- Chữ ký thị giác: Thanh cam đáy khung hình -->
      <div class="bottom-brand-bar"></div>
    </div>

    <script>
      // 1. Chuẩn bị đường stroke SVG cho Icon Ban
      const circleEl = document.getElementById("ban-circle");
      const slashEl = document.getElementById("ban-slash");
      if (circleEl && slashEl) {
        const circleLen = circleEl.getTotalLength();
        const slashLen = slashEl.getTotalLength();

        circleEl.style.strokeDasharray = circleLen;
        circleEl.style.strokeDashoffset = circleLen;

        slashEl.style.strokeDasharray = slashLen;
        slashEl.style.strokeDashoffset = slashLen;
      }

      // 2. Khởi tạo timeline chính duy nhất ở trạng thái paused
      const tl = gsap.timeline({ paused: true });

      // Đăng ký đúng vào registry của HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s09"] = tl;

      // ----------------------------------------------------
      // A. KEN BURNS CAMERA MOTION (0.00s -> 6.61s)
      // Zoom-in chậm rãi từ scale 1.0 đến 1.06 đúng đặc tả shotlist
      // ----------------------------------------------------
      tl.fromTo(
        "#hero-img",
        { scale: 1.0, y: 0 },
        { scale: 1.06, y: -24, duration: 6.61, ease: "none" },
        0
      );

      // ----------------------------------------------------
      // B. PEEL ENTRANCE REVEAL (0.00s -> 0.75s)
      // Lật mở lớp giấy phủ ngà hé lộ bức tranh đồng hồ cát
      // ----------------------------------------------------
      tl.fromTo(
        "#peel-bg",
        { clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)" },
        {
          clipPath: "polygon(100% 0%, 100% 0%, 100% 100%, 100% 100%)",
          duration: 0.75,
          ease: "power2.inOut",
        },
        0
      );

      // ----------------------------------------------------
      // C. OVERLAY 1: ICON BAN (Tại mốc 0.84s, giữ 1.8s)
      // "Thì ông Hobbes không trả lời được"
      // ----------------------------------------------------
      tl.fromTo(
        "#ban-card",
        { scale: 0, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        0.84
      );

      // Stroke tự vẽ vòng tròn và gạch chéo
      tl.to(
        "#ban-circle",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        0.98
      );
      tl.to(
        "#ban-slash",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        1.25
      );

      // Fade out nhẹ trước khi hết thời lượng clip ở 2.64s
      tl.to(
        "#ban-card",
        { opacity: 0, scale: 0.9, duration: 0.25, ease: "power2.in" },
        2.39
      );

      // ----------------------------------------------------
      // D. OVERLAY 2: PUNCH-PHRASE (Tại mốc 3.11s, giữ 2.14s)
      // "Suốt 200 năm sau đó cũng không ai trả lời được"
      // ----------------------------------------------------
      tl.fromTo(
        "#punch-card-box",
        { y: 60, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1.0, duration: 0.48, ease: "power3.out" },
        3.11
      );

      // Nhấn nhẹ badge "200 NĂM"
      tl.fromTo(
        ".punch-badge",
        { scale: 0.88 },
        { scale: 1.0, duration: 0.35, ease: "back.out(1.4)" },
        3.28
      );

      // Fade out êm dịu trước khi nhường chỗ cho kết luận
      tl.to(
        "#punch-card-box",
        { opacity: 0, y: -20, duration: 0.24, ease: "power2.in" },
        5.01
      );

      // ----------------------------------------------------
      // E. OVERLAY 3: LABEL "BÀI TOÁN BỎ NGỎ" (5.25s -> 6.61s)
      // ----------------------------------------------------
      tl.fromTo(
        "#label-box",
        { scale: 0.85, opacity: 0, y: 25 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        5.25
      );

      // Điểm sáng cam đập nhẹ xác nhận kết thúc
      tl.fromTo(
        ".label-dot",
        { scale: 0 },
        { scale: 1, duration: 0.25, ease: "back.out(1.8)" },
        5.45
      );
    </script>
  
    </template>
  </body>
</html>
