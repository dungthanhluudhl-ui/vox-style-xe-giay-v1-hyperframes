    .sticky-note {

      color: #141414;

    /* Đặt vị trí sticky-note-2 tại y=1100px, nằm trong usable band và cách xa caption zone */

      <!-- Nền Spotlight -->
      <div class="bg-spotlight"></div>

      <!-- Mẩu giấy ghi chú 1 góc trên bên trái -->
      <div id="sticky-1" class="sticky-note sticky-note-1">
        <div class="tape"></div>
        <span class="q-mark">?</span>
      </div>

      <!-- Mẩu giấy ghi chú 2 góc phải ngang hông, nằm an toàn trên caption band -->
      <div id="sticky-2" class="sticky-note sticky-note-2" data-layout-allow-caption-zone="true">
        <div class="tape"></div>
        <span class="q-mark">?</span>
      </div>

      <!-- Khung tài liệu chính (Document Card) -->
      <div id="doc-card" class="doc-container">
        <!-- Header tài liệu -->
        <div class="doc-header">
          <div class="doc-meta">BẢN THẢO NGHIÊN CỨU // DỰ ÁN TURING</div>

        </div>

        <!-- Tiêu đề mệnh đề -->
        <div class="doc-prompt">MỆNH ĐỀ ĐẦU TIÊN</div>

        <!-- Hộp trích dẫn cụm từ bị gạch bỏ -->
        <div class="quote-box">
          <div class="punch-phrase">

  <script>
    // Thiết lập strokeDasharray & strokeDashoffset cho các đường vẽ SVG
    const paths = document.querySelectorAll(".anim-path");
    paths.forEach((p) => {
      const len = p.getTotalLength();
      p.style.strokeDasharray = `${len}`;
      p.style.strokeDashoffset = `${len}`;
    });

    // Tạo đúng 1 timeline gốc paused
    const tl = gsap.timeline({ paused: true });

    // 1. Entrance "peel": Tài liệu bóc lật vào trang phẳng dứt khoát (0.05s -> 0.75s)
    tl.fromTo(
      "#doc-card",
      {
        opacity: 0,
        y: 70,
        scale: 0.94,
        rotationZ: -3,
      },
      {
        opacity: 1,
        y: 0,
        scale: 1,
        rotationZ: 0,
        duration: 0.7,
        ease: "power3.out",
      },
      0.05
    );

    // 2. Các mẩu sticky note xuất hiện lệch pha
    tl.fromTo(
      "#sticky-1",
      { opacity: 0, scale: 0.4, rotation: -22 },
      { opacity: 1, scale: 1, rotation: -8, duration: 0.45, ease: "power3.out" },
      0.35
    );
    tl.fromTo(
      "#sticky-2",
      { opacity: 0, scale: 0.4, rotation: 20 },
      { opacity: 1, scale: 1, rotation: 7, duration: 0.45, ease: "power3.out" },
      0.5
    );

    // 3. Vạch mực cam gạch bỏ liên tiếp đè lên "ĐỊNH NGHĨA SUY NGHĨ" (1.25s -> 1.85s)
    tl.to(
      "#strike-p1",
      { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" },
      1.25
    );
    tl.to(
      "#strike-p2",
      { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" },
      1.44
    );
    tl.to(
      "#strike-p3",
      { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" },
      1.65
    );

    // Rung nhẹ khi nét gạch kết thúc dứt khoát
    tl.fromTo(
      "#doc-card",
      { rotationZ: 0.5, y: -3 },
      { rotationZ: 0, y: 0, duration: 0.25, ease: "power2.out" },
      1.7
    );

    // 4. Overlay 1: Tem đóng dấu "KHÁI NIỆM BẤT KHẢ" tại 2.23s (atMs: 251270)
    tl.fromTo(
      "#stamp-box",
      {
        opacity: 0,
        scale: 1.5,
        rotation: 12,
      },
      {
        opacity: 1,
        scale: 1,
        rotation: -5,
        duration: 0.28,
        ease: "power4.out",
      },
      2.23
    );

    // 5. Overlay 2: Huy hiệu Icon Ban tại 4.49s (atMs: 253530)
    tl.fromTo(
      "#ban-overlay",
      {
        opacity: 0,
        scale: 0.8,
        y: 20,
      },
      {
        opacity: 1,
        scale: 1,
        y: 0,
        duration: 0.3,
        ease: "power3.out",
      },
      4.49
    );
    tl.to(
      "#ban-circle",
      { strokeDashoffset: 0, duration: 0.36, ease: "power2.out" },
      4.55
    );
    tl.to(
      "#ban-slash",
      { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" },
      4.78
    );

    // Chuyển động thở nhẹ nền
    tl.to(
      "#doc-card",
      {
        y: -5,
        duration: 1.8,
        ease: "sine.inOut",
        yoyo: true,
        repeat: 1,
      },
      2.5
    );

    // Đăng ký timeline cho HyperFrames runtime
    window.__timelines["scene-s31"] = tl;
  </script>
