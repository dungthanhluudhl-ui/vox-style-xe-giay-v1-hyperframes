    <!-- GSAP Animation Orchestration -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // SVG path lengths setup
      const wire1 = document.getElementById("wire-1-active");
      const wire2 = document.getElementById("wire-2-active");
      const wire3 = document.getElementById("wire-3-active");

      const len1 = wire1.getTotalLength ? wire1.getTotalLength() : 180;
      const len2 = wire2.getTotalLength ? wire2.getTotalLength() : 180;
      const len3 = wire3.getTotalLength ? wire3.getTotalLength() : 90;

      wire1.style.strokeDasharray = len1;
      wire1.style.strokeDashoffset = len1;

      wire2.style.strokeDasharray = len2;
      wire2.style.strokeDashoffset = len2;

      wire3.style.strokeDasharray = len3;
      wire3.style.strokeDashoffset = len3;

      // -------------------------------------------------------------
      // ACT 1: Scene Entrance (0.0s - 2.5s)
      // Transition: zoom-through feel
      // -------------------------------------------------------------
      tl.fromTo(
        "#scene-camera",
        { scale: 0.94, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
        0
      );

      // Camera Motion: subtle pan-right drift throughout scene
      tl.fromTo(
        "#scene-camera",
        { x: 16 },
        { x: -16, duration: 9.54, ease: "none" },
        0.7
      );

      // Header entrance
      tl.fromTo(
        "#header-block",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.2
      );

      // 3 Operator Cards stagger entrance (spring-pop)
      tl.fromTo(
        ".op-card",
        { y: 40, opacity: 0, scale: 0.92 },
        {
          y: 0,
          opacity: 1,
          scale: 1,
          duration: 0.55,
          stagger: 0.12,
          ease: "power3.out",
        },
        0.4
      );

      // Schematic board entrance
      tl.fromTo(
        "#schematic-card",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.85
      );

      // Nodes entrance inside schematic
      tl.fromTo(
        [".input-node", "#gate-node", "#output-node"],
        { scale: 0.92, opacity: 0 },
        {
          scale: 1,
          opacity: 1,
          duration: 0.45,
          stagger: 0.08,
          ease: "power2.out",
        },
        1.15
      );

      // -------------------------------------------------------------
      // ACT 2: 3 Operators Focus & Overlay 1 (2.67s - 4.87s)
      // Overlay: "3 TOÁN TỬ: AND - OR - NOT" (Hold 2200ms)
      // -------------------------------------------------------------
      tl.fromTo(
        "#overlay-1",
        { scale: 0.88, opacity: 0, y: 15 },
        { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        2.67
      );

      // Card highlight pulse sequence
      tl.to(
        "#card-and",
        { borderColor: "#FF6A1A", duration: 0.22, yoyo: true, repeat: 1 },
        2.85
      );
      tl.to(
        "#card-or",
        { borderColor: "#FF6A1A", duration: 0.22, yoyo: true, repeat: 1 },
        3.4
      );
      tl.to(
        "#card-not",
        { borderColor: "#FF6A1A", duration: 0.22, yoyo: true, repeat: 1 },
        3.95
      );

      // Overlay 1 dismiss
      tl.to(
        "#overlay-1",
        { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" },
        4.62
      );

      // Transition to Circuit: Dim OR/NOT cards, emphasize AND card
      tl.to(
        ["#card-or", "#card-not"],
        { opacity: 0.35, duration: 0.4, ease: "power2.out" },
        4.85
      );
      tl.to(
        "#card-and",
        {
          borderColor: "#FF6A1A",
          scale: 1.04,
          duration: 0.4,
          ease: "power2.out",
        },
        4.85
      );

      // -------------------------------------------------------------
      // ACT 3: Example Evaluation & Overlay 2 (5.16s - 7.36s)
      // Overlay: "MƯA (1) ∧ CÓ Ô (1)" (Hold 2200ms)
      // -------------------------------------------------------------
      tl.fromTo(
        "#overlay-2",
        { scale: 0.88, opacity: 0, y: 15 },
        { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        5.16
      );

      // Condition 1: Trời mưa activates (status 1 turns bright orange)
      tl.to(
        "#node-rain",
        { borderColor: "#FF6A1A", duration: 0.3, ease: "power2.out" },
        5.2
      );
      tl.to(
        "#state-rain",
        {
          backgroundColor: "#FF6A1A",
          color: "#141414",
          scale: 1.08,
          duration: 0.22,
          yoyo: true,
          repeat: 1,
        },
        5.28
      );

      // Condition 2: Tôi có ô activates
      tl.to(
        "#node-umbrella",
        { borderColor: "#FF6A1A", duration: 0.3, ease: "power2.out" },
        5.5
      );
      tl.to(
        "#state-umbrella",
        {
          backgroundColor: "#FF6A1A",
          color: "#141414",
          scale: 1.08,
          duration: 0.22,
          yoyo: true,
          repeat: 1,
        },
        5.58
      );

      // Conduct logic signals along Wire 1 and Wire 2 into AND Gate
      tl.to(
        wire1,
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        5.8
      );
      tl.to(
        wire2,
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        5.9
      );

      // Overlay 2 dismiss
      tl.to(
        "#overlay-2",
        { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" },
        7.11
      );

      // -------------------------------------------------------------
      // ACT 4: Gate Activation, Output Stamp & Overlay 3 (7.5s - 10.24s)
      // Overlay: "KẾT QUẢ: ĐÚNG (1)" (Hold 2000ms)
      // -------------------------------------------------------------
      // AND Gate triggers & evaluates
      tl.to(
        "#gate-node",
        {
          scale: 1.08,
          borderColor: "#FF6A1A",
          duration: 0.22,
          yoyo: true,
          repeat: 1,
          ease: "power2.inOut",
        },
        7.42
      );

      // Wire 3 conducts output signal to result node
      tl.to(
        wire3,
        { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" },
        7.58
      );

      // Output node activates
      tl.to(
        "#output-node",
        { borderColor: "#FF6A1A", duration: 0.3, ease: "power2.out" },
        7.75
      );

      // Overlay 3 (Punch Phrase) pops into place
      tl.fromTo(
        "#overlay-3",
        { scale: 1.25, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power4.out" },
        7.8
      );

      // Physical stamp effect on result badge inside output box
      tl.fromTo(
        "#result-stamp",
        { scale: 0, opacity: 0, rotation: -10 },
        {
          scale: 1,
          opacity: 1,
          rotation: 0,
          duration: 0.45,
          ease: "back.out(1.6)",
        },
        7.85
      );

      // Register the paused timeline on window.__timelines
      window.__timelines["scene-s18"] = tl;
    </script>
