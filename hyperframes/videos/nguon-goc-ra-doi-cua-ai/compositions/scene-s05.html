      tl.set("#impact-burst", { opacity: 0 });

        { scale: 0.35, opacity: 0 },

        1.29

      tl.fromTo(
        "#strike-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.28, ease: "power3.inOut" },
        3.85
      );

      // Overlay 2: Diagram banner appears at 4.10s (36700ms - 32600ms)
      tl.to(
        "#diagram-label",
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        4.10

      // STRIKE ACTION: The two massive [+] and [−] blocks slam down directly ON TOP of the quote card!

        { y: -1300, rotation: -8, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.36, ease: "power4.in" },
        4.10

        { y: -1300, rotation: 8, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.36, ease: "power4.in" },
        4.12
      );

      // DIRECT IMPACT AT 4.46s: Quote card is physically crushed flat under the slamming blocks!
      tl.to(
        "#quote-card",
        { scaleY: 0.04, opacity: 0, duration: 0.12, ease: "power4.in" },

      tl.to(
        "#quote-body",

        4.46
      );

      // Impact shockwave burst fires outward
      tl.fromTo(
        "#impact-burst",
        { scale: 0.3, opacity: 1 },
        { scale: 1.5, opacity: 0, duration: 0.4, ease: "power2.out" },
        4.46

      // Central connector pops in at moment of contact
      tl.to(
        "#op-link",
        { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" },
        4.48
      );

      // Compression and physical rebound of operator blocks on landing
      tl.to(
        ["#block-plus", "#block-minus"],
        { scaleY: 0.92, scaleX: 1.06, duration: 0.08, ease: "power2.out" },
        4.46
      );
      tl.to(
        ["#block-plus", "#block-minus"],
        { scaleY: 1, scaleX: 1, duration: 0.22, ease: "power3.out" },
        4.54
      );

      // Violent physical camera shudder from the strike
      tl.to("#stage", { y: 22, duration: 0.05, ease: "power2.out" }, 4.46);
      tl.to("#stage", { y: -14, duration: 0.05, ease: "power2.out" }, 4.51);
      tl.to("#stage", { y: 8, duration: 0.05, ease: "power2.out" }, 4.56);

      tl.to("#stage", { y: 0, duration: 0.05, ease: "power2.out" }, 4.66);
