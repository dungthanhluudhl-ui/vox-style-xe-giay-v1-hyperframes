<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #f5f0e4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f5f0e4;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Hero Visual Layer */
      .hero-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        display: block;
        transform-origin: 50% 45%;
      }

      /* Bottom Brand Signature Bar */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 50;
      }

      /* Editorial Card Plates - Solid Opaque Backgrounds for Strict Contrast */
      .editorial-plate {
        position: absolute;
        background-color: #141414;
        padding: 24px 30px;
        border-radius: 4px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
        will-change: transform, opacity;
      }

      /* Overlay 1: Milestone 1950 */
      #milestone-card {
        top: 200px;
        left: 60px;
        width: 580px;
        border-left: 8px solid #ff6a1a;
      }
      .milestone-sub {
        color: #ff6a1a;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .milestone-title {
        color: #f7f4ec;
        font-size: 54px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: 0.5px;
      }

      /* Overlay 2: Alan Turing Bio */
      #turing-card {
        top: 368px;
        left: 60px;
        width: 620px;
      }
      .turing-badge {
        display: inline-block;
        background-color: #ff6a1a;
        color: #141414;
        font-size: 20px;
        font-weight: 900;
        padding: 4px 14px;
        border-radius: 2px;
        letter-spacing: 1px;
        margin-bottom: 10px;
      }
      .turing-name {
        color: #f7f4ec;
        font-size: 38px;
        font-weight: 900;
        line-height: 1.25;
      }

      /* Overlay 3: Enigma Diagram */
      #enigma-card {
        top: 220px;
        left: 60px;
        width: 640px;
      }
      .enigma-tag {
        display: inline-block;
        background-color: #ff6a1a;
        color: #141414;
        font-size: 20px;
        font-weight: 900;
        padding: 4px 14px;
        border-radius: 2px;
        letter-spacing: 1.5px;
        margin-bottom: 10px;
      }
      .enigma-title {
        color: #f7f4ec;
        font-size: 50px;
        font-weight: 900;
        line-height: 1.15;
      }
      .enigma-desc {
        color: #e7e3d9;
        font-size: 24px;
        font-weight: 700;
        margin-top: 6px;
      }
      .enigma-svg-wrap {
        margin-top: 16px;
        display: block;
      }

      /* Overlay 4: Climax Historical Quote */
      #quote-card {
        top: 440px;
        left: 60px;
        right: 60px;
        border-left: 10px solid #ff6a1a;
        padding: 36px 40px;
      }
      .quote-header-tag {
        color: #ff6a1a;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 12px;
      }
      .quote-headline {
        color: #f7f4ec;
        font-size: 64px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: -0.5px;
        margin-bottom: 22px;
      }
      .quote-vi-badge {
        display: inline-block;
        background-color: #ff6a1a;
        color: #141414;
        font-size: 28px;
        font-weight: 900;
        padding: 10px 20px;
        border-radius: 4px;
        line-height: 1.3;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s30"
      data-width="1080"
      data-height="1920"
      data-duration="13.36"
    >
      <!-- Fixed Signature Bottom Accent -->
      <div class="brand-bottom-bar"></div>

      <!-- Main Visual Layer: Cutout Art & Slow Ken Burns Zoom-In -->
      <section class="clip" id="shot-hero" data-start="0" data-duration="13.36">
        <div class="hero-wrap">
          <img
            id="hero-img"
            src="assets/img-06-alan-turing-can-machines-think.jpg"
            alt="Alan Turing with Enigma machine"
          />
        </div>
      </section>

      <!-- Overlay 1: Milestone 1950 (at 0.61s, hold 2.2s -> ends at 2.81s) -->
      <section class="clip" id="clip-milestone" data-start="0.61" data-duration="2.2">
        <div id="milestone-card" class="editorial-plate">
          <div class="milestone-sub">Kỷ nguyên trí tuệ nhân tạo</div>
          <div class="milestone-title">MỐC NĂM 1950</div>
        </div>
      </section>

      <!-- Overlay 2: Alan Turing Bio (at 1.78s, hold 2.2s -> ends at 3.98s) -->
      <section class="clip" id="clip-turing" data-start="1.78" data-duration="2.2">
        <div id="turing-card" class="editorial-plate">
          <div class="turing-badge">NHÀ TOÁN HỌC ANH</div>
          <div class="turing-name">ALAN TURING (1912-1954)</div>
        </div>
      </section>

      <!-- Overlay 3: Giải mã Enigma (at 6.53s, hold 2.2s -> ends at 8.73s) -->
      <section class="clip" id="clip-enigma" data-start="6.53" data-duration="2.2">
        <div id="enigma-card" class="editorial-plate">
          <div class="enigma-tag">CHIẾN CÔNG MẬT MÃ</div>
          <div class="enigma-title">GIẢI MÃ ENIGMA</div>
          <div class="enigma-desc">CỖ MÁY HUYỀN THOẠI CỦA ĐỨC</div>
          <svg class="enigma-svg-wrap" width="320" height="28" viewBox="0 0 320 28" fill="none">
            <path
              id="enigma-path"
              d="M 0 14 L 60 14 L 75 2 L 90 26 L 105 14 L 180 14 L 195 2 L 210 26 L 225 14 L 320 14"
              stroke="#FF6A1A"
              stroke-width="3.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </section>

      <!-- Overlay 4: Historical Climax Quote (at 11.33s, hold 2.03s -> ends at 13.36s) -->
      <section class="clip" id="clip-quote" data-start="11.33" data-duration="2.03">
        <div id="quote-card" class="editorial-plate">
          <div class="quote-header-tag">BÀI BÁO LỊCH SỬ • 1950</div>
          <div class="quote-headline">“CAN MACHINES THINK?”</div>
          <div class="quote-vi-badge">MÁY MÓC CÓ SUY NGHĨ ĐƯỢC KHÔNG?</div>
        </div>
      </section>
    </div>

    <script>
      // Initialize single paused GSAP timeline
      const tl = gsap.timeline({ paused: true });

      // Camera motion: slow Ken Burns zoom-in (1.0 -> 1.09) across entire scene
      tl.fromTo(
        "#hero-img",
        { scale: 1.0 },
        { scale: 1.09, duration: 13.36, ease: "none" },
        0
      );

      // Overlay 1: Milestone 1950 entrance & exit
      tl.fromTo(
        "#milestone-card",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.61
      );
      tl.to(
        "#milestone-card",
        { x: -20, opacity: 0, duration: 0.3, ease: "power2.in" },
        2.51
      );

      // Overlay 2: Alan Turing Bio entrance & exit
      tl.fromTo(
        "#turing-card",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.78
      );
      tl.to(
        "#turing-card",
        { y: -15, opacity: 0, duration: 0.3, ease: "power2.in" },
        3.68
      );

      // Overlay 3: Enigma Diagram entrance & SVG progressive draw
      tl.fromTo(
        "#enigma-card",
        { scale: 0.94, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.45, ease: "power3.out" },
        6.53
      );

      const enigmaPath = document.getElementById("enigma-path");
      if (enigmaPath) {
        const pathLen = enigmaPath.getTotalLength();
        enigmaPath.style.strokeDasharray = pathLen;
        enigmaPath.style.strokeDashoffset = pathLen;
        tl.to(
          "#enigma-path",
          { strokeDashoffset: 0, duration: 0.75, ease: "power2.out" },
          6.75
        );
      }

      tl.to(
        "#enigma-card",
        { y: -20, opacity: 0, duration: 0.3, ease: "power2.in" },
        8.43
      );

      // Overlay 4: Historical Climax Question entrance (holds firmly to scene end)
      tl.fromTo(
        "#quote-card",
        { scale: 0.9, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.5, ease: "power3.out" },
        11.33
      );

      // Register timeline on HyperFrames registry
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s30"] = tl;
    </script>
  
    </template>
  </body>
</html>
