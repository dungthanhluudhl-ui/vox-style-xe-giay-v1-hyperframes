    <script>
      // Setup progressive path drawing on scale SVG
      const scaleStrokes = document.querySelectorAll(".scale-stroke");
      scaleStrokes.forEach(function (path) {
        const len = path.getTotalLength ? path.getTotalLength() : 200;
        path.style.strokeDasharray = len + "px";
        path.style.strokeDashoffset = len + "px";
      });

      // Master Paused Timeline
      const tl = gsap.timeline({ paused: true });

      // 1. Camera Motion: Subtle continuous zoom-in throughout the 6.75s shot
      tl.to("#camera-rig", {
        scale: 1.04,
        duration: 6.75,
        ease: "none"
      }, 0);

      // 2. Entrance Animation ("grow"): Whole scene enters smoothly
      tl.fromTo("#scene-content",
        { scale: 0.95, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.1
      );

      // 3. Background Chart Lines Reveal
      tl.fromTo(".chart-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.6, stagger: 0.08, ease: "power2.out" },
        0.15
      );
      tl.fromTo(".chart-tick",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.35, stagger: 0.06, ease: "power2.out" },
        0.3
      );

      // 4. Hobbes Quote Card Arrival
      tl.fromTo("#quote-card",
        { y: 25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.25
      );

      // 5. Overlay 1 (atMs: 26650 -> offset 0.80s): Diagram TIMELINE: 1651 -> 1950
      tl.fromTo("#timeline-container",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.8
      );
      tl.fromTo("#milestone-1651",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.95
      );
      tl.fromTo("#timeline-axis",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.7, ease: "power2.inOut" },
        1.1
      );
      tl.fromTo("#milestone-1950",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.6
      );

      // 6. Overlay 2 (atMs: 28300 -> offset 2.45s): Punch phrase "KHOẢNG CÁCH 300 NĂM"
      tl.fromTo("#weight-card",
        { y: -40, scale: 1.08, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.65, ease: "power4.out" },
        2.45
      );
      // Timeline & Quote slight physical resonance upon impact
      tl.fromTo("#quote-card",
        { y: 0 },
        { y: 6, duration: 0.1, yoyo: true, repeat: 1, ease: "power1.inOut" },
        2.5
      );
      // Punch badge pop
      tl.fromTo("#punch-badge",
        { scale: 0.85, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        2.7
      );

      // 7. Overlay 3 (atMs: 31420 -> offset 5.57s): Icon "scale" self-drawing & weighing
      tl.fromTo("#scale-section",
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        5.57
      );
      // Trace scale outline
      tl.to(".scale-stroke",
        { strokeDashoffset: 0, duration: 0.6, stagger: 0.04, ease: "power2.out" },
        5.65
      );
      // Scale tilts under weight
      tl.to("#scale-beam-group",
        { rotation: -7, transformOrigin: "100px 38px", duration: 0.45, ease: "power2.out" },
        6.1
      );
      tl.to("#scale-left-pan",
        { y: -5, duration: 0.45, ease: "power2.out" },
        6.1
      );
      tl.to("#scale-right-pan",
        { y: 5, duration: 0.45, ease: "power2.out" },
        6.1
      );

      // Register seekable timeline
      window.__timelines["scene-s04"] = tl;
    </script>
