    <script>
      // Prepare SVG path dash lengths deterministically
      const paths = document.querySelectorAll(".circuit-path");
      paths.forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
      });

      const checkPath = document.getElementById("check-path");
      if (checkPath) {
        const cLen = checkPath.getTotalLength();
        checkPath.style.strokeDasharray = cLen;
        checkPath.style.strokeDashoffset = cLen;
      }

      // Initial visual states for seek-safe animation
      gsap.set("#thesis-doc", { scale: 0.88, opacity: 0, y: 35 });
      gsap.set("#overlay-label", { scale: 0.85, opacity: 0, y: -20 });
      gsap.set(".node-badge", { scale: 0, opacity: 0 });
      gsap.set("#overlay-punch", { y: 40, opacity: 0, scale: 0.96 });
      gsap.set("#stamp-overlay", { scale: 1.35, opacity: 0, rotation: 5 });
      gsap.set("#check-seal", { scale: 0, opacity: 0, rotation: -25 });

      // Build Master Paused Timeline
      const tl = gsap.timeline({ paused: true });

      // 0.0s - Continuous gentle camera documentary push
      tl.to("#camera-rig", { scale: 1.05, duration: 12.6, ease: "none" }, 0);

      // 0.2s - Thesis Document Entrance (Grow transition)
      tl.to(
        "#thesis-doc",
        { scale: 1, opacity: 1, y: 0, duration: 0.85, ease: "power3.out" },
        0.2
      );

      // 1.95s - Overlay 1: LUẬN VĂN THẠC SĨ MIT (Shotlist atMs: 216550)
      tl.to(
        "#overlay-label",
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.95
      );

      // 4.0s - Circuit branches start tracing outward to modern electronics
      tl.to(
        ".circuit-path",
        { strokeDashoffset: 0, duration: 1.8, ease: "power2.out", stagger: 0.12 },
        4.0
      );
      tl.to(
        ".node-badge",
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out", stagger: 0.1 },
        4.4
      );

      // 6.35s - Overlay 2: ĐỈNH CAO THẾ KỶ 20 (Shotlist atMs: 220950)
      tl.to(
        "#overlay-punch",
        { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        6.35
      );

      // 9.17s - Overlay 3: KIẾN TRÚC MÁY TÍNH / BẢN THIẾT KẾ CỦA MỌI MÁY TÍNH (Shotlist atMs: 223770)
      tl.to(
        "#stamp-overlay",
        { scale: 1, opacity: 1, rotation: -1, duration: 0.38, ease: "power4.out" },
        9.17
      );
      // Subtle documentary impact shudder on stamp hit
      tl.to(
        "#thesis-doc",
        { y: 3, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" },
        9.22
      );

      // 11.35s - Overlay 4: Check Icon Badge (Shotlist atMs: 225950)
      tl.to(
        "#check-seal",
        { scale: 1, opacity: 1, rotation: 0, duration: 0.35, ease: "power3.out" },
        11.35
      );
      if (checkPath) {
        tl.to(
          checkPath,
          { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
          11.5
        );
      }

      // Register timeline on HyperFrames global registry
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s28"] = tl;
    </script>
