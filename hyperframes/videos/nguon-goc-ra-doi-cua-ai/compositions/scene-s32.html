<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Editorial cards & containers */
      .editorial-card {
        background: #F5F0E4;
        border: 4px solid #141414;
        box-shadow: 8px 8px 0px #141414;
      }
      .sub-card {
        background: #E7E3D9;
        border: 3px solid #141414;
      }
      .hatch-pattern {
        background: repeating-linear-gradient(
          -45deg,
          #141414,
          #141414 4px,
          #FF6A1A 4px,
          #FF6A1A 10px
        );
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s32"
      data-width="1080"
      data-height="1920"
      data-duration="5.52"
    >
      <section id="scene-s32" class="clip" data-start="0" data-duration="5.52">
        <div id="camera-rig" style="position: absolute; inset: 0; transform-origin: 540px 800px;">

          <!-- Top Context Tracker Header -->
          <div
            id="header-tracker"
            style="position: absolute; top: 170px; left: 80px; width: 920px; height: 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #141414; padding-bottom: 10px;"
          >
            <div style="display: flex; align-items: center; gap: 12px;">
              <span style="display: inline-block; width: 14px; height: 14px; background: #FF6A1A; border: 2px solid #141414;"></span>
              <span class="hf-text-ink" style="font-size: 20px; font-weight: 900; letter-spacing: 1px;">CHUYỂN HƯỚNG CHIẾN LƯỢC // 1950</span>
            </div>
            <div class="hf-text-ink" style="font-size: 18px; font-weight: 700; letter-spacing: 0.5px;">ALAN TURING</div>
          </div>

          <!-- Act 1: The Old Philosophical Deadlock Card (0.0s - 1.85s) -->
          <div
            id="card-debate"
            class="editorial-card"
            style="position: absolute; top: 250px; left: 80px; width: 920px; padding: 36px 40px; display: flex; flex-direction: column;"
          >
            <!-- Top row inside card: Category on Left, Overlay 1 (THAY ĐỔI CHIẾN LƯỢC) on Right in its own slot -->
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed rgba(20, 20, 20, 0.35); padding-bottom: 16px;">
              <div style="display: flex; align-items: center; gap: 10px;">
                <span class="hf-plate-ink" style="font-size: 16px; font-weight: 900; padding: 4px 12px; border-radius: 4px; letter-spacing: 1px;">BẾ TẮC CŨ</span>
                <span class="hf-text-ink" style="font-size: 18px; font-weight: 700;">TRANH LUẬN TRIẾT HỌC</span>
              </div>

              <!-- Overlay 1: THAY ĐỔI CHIẾN LƯỢC (at 0.60s / 255400 ms) -->
              <div
                id="stamp-strategy"
                class="hf-hl-orange"
                style="opacity: 0; border: 3px solid #141414; box-shadow: 4px 4px 0 #141414; font-weight: 900; font-size: 22px; padding: 8px 18px; letter-spacing: 0.5px; transform-origin: 50% 50%;"
              >
                THAY ĐỔI CHIẾN LƯỢC
              </div>
            </div>

            <!-- The Question Block (in natural block flow, never occluded) -->
            <div style="margin-top: 26px;">
              <div class="hf-text-ink" style="font-size: 18px; font-weight: 700; opacity: 0.75; text-transform: uppercase; letter-spacing: 1px;">
                CÂU HỎI KINH ĐIỂN KHÔNG CÓ LỜI GIẢI:
              </div>
              <div
                id="debate-question"
                class="hf-text-ink"
                style="font-size: 46px; font-weight: 900; line-height: 1.22; margin-top: 10px; text-transform: uppercase;"
              >
                "MÁY MÓC CÓ THỂ SUY NGHĨ KHÔNG?"
              </div>
            </div>

            <!-- Reversal Verdict Banner (appears at 1.15s cleanly BELOW question, no overlap) -->
            <div
              id="debate-verdict"
              class="hf-plate-ink"
              style="opacity: 0; margin-top: 24px; padding: 18px 24px; border: 3px solid #141414; border-radius: 4px; display: flex; align-items: center; gap: 18px;"
            >
              <div style="flex-shrink: 0; width: 44px; height: 44px; background: #FF6A1A; color: #141414; font-weight: 900; font-size: 24px; display: flex; align-items: center; justify-content: center; border: 2px solid #141414;">
                ✕
              </div>
              <div>
                <div style="color: #FF6A1A; font-size: 18px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;">
                  DỪNG TRANH CÃI ĐỊNH NGHĨA
                </div>
                <div style="color: #F7F4EC; font-size: 20px; font-weight: 700; margin-top: 4px; line-height: 1.3;">
                  "Suy nghĩ" là khái niệm chủ quan — không thể kiểm chứng bằng khoa học.
                </div>
              </div>
            </div>
          </div>

          <!-- Act 2 & 3: The Behavioral Game Board Interface (1.85s - 5.52s) -->
          <div
            id="card-game"
            class="editorial-card"
            style="opacity: 0; position: absolute; top: 250px; left: 80px; width: 920px; padding: 32px 36px; display: flex; flex-direction: column;"
          >
            <!-- Game Board Header -->
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed rgba(20, 20, 20, 0.4); padding-bottom: 14px;">
              <div style="display: flex; align-items: center; gap: 10px;">
                <span class="hf-plate-ink" style="font-size: 16px; font-weight: 900; padding: 4px 12px; border-radius: 4px;">THIẾT LẬP THỰC NGHIỆM</span>
                <span class="hf-text-ink" style="font-size: 20px; font-weight: 900;">KIỂM CHỨNG HÀNH VI</span>
              </div>
              <div class="hf-text-ink" style="font-size: 16px; font-weight: 700;">HỆ THỐNG PHÒNG CÁCH LY</div>
            </div>

            <!-- Two Isolated Chambers (Room A & Room B) -->
            <div style="display: flex; justify-content: space-between; align-items: stretch; margin-top: 22px;">
              <!-- Room A -->
              <div id="room-a" class="sub-card chamber-box" style="width: 388px; height: 156px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <span class="hf-plate-paper hf-text-ink" style="font-size: 15px; font-weight: 900; border: 1.5px solid #141414; padding: 2px 8px;">PHÒNG A</span>
                  <span class="hf-text-ink" style="font-size: 14px; font-weight: 700;">ĐỐI TƯỢNG 1</span>
                </div>
                <div class="hf-text-ink" style="font-size: 34px; font-weight: 900; letter-spacing: -0.5px;">CON NGƯỜI</div>
                <div class="hf-text-ink" style="font-size: 15px; font-weight: 700; opacity: 0.8;">Tư duy sinh học tự nhiên</div>
              </div>

              <!-- Isolation Dividing Wall -->
              <div id="divider-barrier" class="divider-wall hatch-pattern" style="width: 32px; height: 156px; border: 3px solid #141414;" data-layout-ignore="true"></div>

              <!-- Room B -->
              <div id="room-b" class="sub-card chamber-box" style="width: 388px; height: 156px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <span class="hf-plate-paper hf-text-ink" style="font-size: 15px; font-weight: 900; border: 1.5px solid #141414; padding: 2px 8px;">PHÒNG B</span>
                  <span class="hf-text-ink" style="font-size: 14px; font-weight: 700;">ĐỐI TƯỢNG 2</span>
                </div>
                <div class="hf-text-ink" style="font-size: 34px; font-weight: 900; letter-spacing: -0.5px;">MÁY TÍNH</div>
                <div class="hf-text-ink" style="font-size: 15px; font-weight: 700; opacity: 0.8;">Thuật toán mô phỏng</div>
              </div>
            </div>

            <!-- Signal Conduit Connectors (SVG Drawing) -->
            <div style="width: 100%; height: 74px; position: relative;">
              <svg viewBox="0 0 848 74" style="width: 100%; height: 100%; display: block;" data-layout-ignore="true">
                <!-- Conduit A to C -->
                <path id="wire-a" class="signal-line" d="M 194 0 L 194 37 L 360 74" fill="none" stroke="#141414" stroke-width="4" stroke-linecap="round" />
                <!-- Conduit B to C -->
                <path id="wire-b" class="signal-line" d="M 654 0 L 654 37 L 488 74" fill="none" stroke="#141414" stroke-width="4" stroke-linecap="round" />
                <!-- Indicator nodes -->
                <circle cx="194" cy="4" r="5" fill="#FF6A1A" stroke="#141414" stroke-width="2" />
                <circle cx="654" cy="4" r="5" fill="#FF6A1A" stroke="#141414" stroke-width="2" />
              </svg>
            </div>

            <!-- Room C: The Interrogator -->
            <div id="room-c" class="sub-card" style="width: 100%; height: 110px; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center;">
              <div>
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span class="hf-plate-paper hf-text-ink" style="font-size: 15px; font-weight: 900; border: 1.5px solid #141414; padding: 2px 8px;">PHÒNG C</span>
                  <span class="hf-text-ink" style="font-size: 26px; font-weight: 900;">NGƯỜI THẨM VẤN</span>
                </div>
                <div class="hf-text-ink" style="font-size: 15px; font-weight: 700; margin-top: 4px; opacity: 0.85;">
                  Đặt câu hỏi gián tiếp qua bản in teletype (không thấy mặt, không nghe giọng)
                </div>
              </div>
              <div class="hf-plate-ink" style="font-size: 15px; font-weight: 900; padding: 8px 14px; border-radius: 4px; text-align: center; line-height: 1.2;">
                PHÁN ĐOÁN<br />AI LÀ MÁY?
              </div>
            </div>

            <!-- Act 3 Hero Climax Box: Overlays 2 & 3 (4.39s & 5.06s) -->
            <div
              id="hero-punch-box"
              class="hf-hl-orange"
              style="opacity: 0; margin-top: 26px; width: 100%; border: 4px solid #141414; box-shadow: 8px 8px 0 #141414; padding: 32px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;"
            >
              <div class="hf-text-ink" style="font-size: 20px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;">
                QUY TẮC THỰC NGHIỆM MỚI
              </div>

              <!-- Overlay 2: Punch Phrase "TRÒ CHƠI BẮT CHƯỚC" at 4.39s (259190 ms) -->
              <div
                id="punch-title"
                class="hf-text-ink"
                style="font-size: 60px; font-weight: 900; line-height: 1.15; letter-spacing: -1px; text-transform: uppercase; margin-top: 12px;"
              >
                TRÒ CHƠI BẮT CHƯỚC
              </div>

              <!-- Overlay 3: Label "THE IMITATION GAME" at 5.06s (259860 ms) -->
              <div
                id="punch-sub"
                class="hf-plate-ink"
                style="opacity: 0; margin-top: 18px; font-size: 28px; font-weight: 900; padding: 8px 28px; border-radius: 6px; letter-spacing: 2.5px; text-transform: uppercase; border: 2px solid #141414;"
              >
                THE IMITATION GAME
              </div>
            </div>
          </div>

        </div>

        <!-- Trademark Fixed Bottom Orange Bar (Brand Signature) -->
        <div id="brand-bottom-bar" style="position: absolute; bottom: 0; left: 0; width: 1080px; height: 16px; background: #FF6A1A; z-index: 9999;" data-layout-ignore="true"></div>
      </section>
    </div>

    <script>
      // Single deterministic paused timeline
      const tl = gsap.timeline({ paused: true });

      // Path length measurement for SVG conduits
      document.querySelectorAll(".signal-line").forEach((p) => {
        const len = p.getTotalLength ? p.getTotalLength() : 250;
        p.style.strokeDasharray = len + "";
        p.style.strokeDashoffset = len + "";
      });

      // 0.0s - 5.52s: Continuous subtle camera push-in
      tl.to("#camera-rig", { scale: 1.05, duration: 5.52, ease: "none" }, 0);

      // 0.05s: Context tracker header reveals
      tl.fromTo(
        "#header-tracker",
        { y: -25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
        0.05
      );

      // 0.10s: Act 1 Debate Card unfolds into view
      tl.fromTo(
        "#card-debate",
        { scaleY: 0, opacity: 0, transformOrigin: "50% 0%" },
        { scaleY: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.10
      );

      // 0.60s (255400 ms): Overlay 1 - "THAY ĐỔI CHIẾN LƯỢC" arrives firmly in its top-right slot
      tl.fromTo(
        "#stamp-strategy",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        0.60
      );

      // 1.15s: Reversal verdict banner arrives cleanly below the question
      tl.fromTo(
        "#debate-verdict",
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        1.15
      );

      // 1.60s: Act 1 cleanly slides away to clear space for the game interface
      tl.to(
        "#card-debate",
        { y: -40, opacity: 0, duration: 0.25, ease: "power2.in" },
        1.60
      );
      tl.set("#card-debate", { autoAlpha: 0 }, 1.85);

      // 1.85s: Act 2 Game Board unfolds into center view
      tl.fromTo(
        "#card-game",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.85
      );

      // 2.05s: Chambers A & B and the barrier reveal
      tl.fromTo(
        [".chamber-box", ".divider-wall"],
        { scale: 0.92, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, stagger: 0.08, ease: "power2.out" },
        2.05
      );

      // 2.30s: Signal lines draw between rooms and the interrogator
      tl.to(
        "#wire-a",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        2.30
      );
      tl.to(
        "#wire-b",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        2.42
      );

      // 2.60s: Room C (Interrogator) pops in
      tl.fromTo(
        "#room-c",
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
        2.60
      );

      // 4.39s (259190 ms): Overlay 2 - Punch Phrase "TRÒ CHƠI BẮT CHƯỚC" slams into the center
      tl.fromTo(
        "#hero-punch-box",
        { scale: 0.88, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        4.39
      );
      tl.fromTo(
        "#punch-title",
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        4.45
      );

      // 5.06s (259860 ms): Overlay 3 - Sub-label "THE IMITATION GAME" locks into place
      tl.fromTo(
        "#punch-sub",
        { scale: 0.82, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
        5.06
      );

      // Register the master timeline strictly at window.__timelines["scene-s32"]
      window.__timelines["scene-s32"] = tl;
    </script>
  
    </template>
  </body>
</html>
