      <script>
        const pages = Array.from(document.querySelectorAll(".caption-page"));
        const words = Array.from(document.querySelectorAll(".word"));

        const tl = gsap.timeline({ paused: true });

        // Driver tuyến tính DUY NHẤT cho toàn bộ track (khuyến nghị của
        // hyperframes-animation/rules/asr-keyword-glow.md: "one driver looping all words",
        // không tạo 1 tween/từ). Port đúng logic isActive của Captions.tsx: token.fromMs <=
        // absoluteTimeMs && token.toMs > absoluteTimeMs.
        const driver = { ms: 0 };
        tl.to(
          driver,
          {
            ms: 307416,
            duration: 307.416000,
            ease: "none",
            onUpdate: () => {
              for (const w of words) {
                const fromMs = Number(w.dataset.fromMs);
                const toMs = Number(w.dataset.toMs);
                const isActive = fromMs <= driver.ms && toMs > driver.ms;
                w.classList.toggle("active", isActive);
              }
            },
          },
          0,
        );

        // Entrance mỗi page: opacity+translate 0->1 / 12px->0 trong 5 frame đầu (Captions.tsx),
        // dùng "expo.out" của GSAP để khớp cubic-bezier(0.16,1,0.3,1) gốc — đã đối chiếu bằng
        // vision agent thật ở Checkpoint A.
      tl.fromTo(pages[0].querySelector(".caption-card"), {opacity: 0, y: 12}, {opacity: 1, y: 0, duration: 0.166667, ease: "expo.out", immediateRender: false}, 0.040000);
      tl.fromTo(pages[1].querySelector(".caption-card"), {opacity: 0, y: 12}, {opacity: 1, y: 0, duration: 0.166667, ease: "expo.out", immediateRender: false}, 1.290000);
      tl.fromTo(pages[2].querySelector(".caption-card"), {opacity: 0, y: 12}, {opacity: 1, y: 0, duration: 0.166667, ease: "expo.out", immediateRender: false}, 2.440000);
      tl.fromTo(pages[3].querySelector(".caption-card"), {opacity: 0, y: 12}, {opacity: 1, y: 0, duration: 0.166667, ease: "expo.out", immediateRender: false}, 3.020000);
      tl.fromTo(pages[4].querySelector(".caption-card"), {opacity: 0, y: 12}, {opacity: 1, y: 0, duration: 0.166667, ease: "expo.out", immediateRender: false}, 4.150000);
      tl.fromTo(pages[5].querySelector(".caption-card"), {opacity: 0, y: 12}, {opacity: 1, y: 0, duration: 0.166667, ease: "expo.out", immediateRender: false}, 5.200000);
