    <!-- GSAP Master Timeline Script -->
    <script>
      // 1. Khởi tạo duy nhất 1 timeline gốc paused theo hợp đồng HyperFrames
      const tl = gsap.timeline({ paused: true });

      // 2. Thiết lập độ dài nét vẽ cho các đường SVG của icon fall
      const fallSvgElements = document.querySelectorAll(
        "#fall-icon-svg path, #fall-icon-svg circle"
      );
      fallSvgElements.forEach((el) => {
        const len = el.getTotalLength();
        el.style.strokeDasharray = `${len}`;
        el.style.strokeDashoffset = `${len}`;
      });

      // 3. Xây dựng diễn hoạt theo kịch bản và thời gian shotlist

      // --- Shot S20-1: Peel transition in + Pan chậm ảnh toàn khung sang trái ---
      // Peel entrance: mép giấy gập mở từ góc trên-phải trong 0.65s
      tl.fromTo(
        "#peel-cover",
        { scaleX: 1, scaleY: 1, opacity: 1 },
        { scaleX: 0, scaleY: 0, opacity: 0, duration: 0.65, ease: "power2.inOut" },
        0
      );

      // Camera Pan-left: dịch chuyển ảnh toàn khung từ người đàn ông (trái) sang kệ sách (phải)
      tl.fromTo(
        "#photo-img",
        { x: 0 },
        { x: -340, duration: 8.16, ease: "none" },
        0
      );

      // --- Overlay 1: Punch-phrase "NĂM 1864: BI KỊCH" (1.13s -> 3.13s) ---
      tl.fromTo(
        "#punch-card",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.13
      );
      tl.to(
        "#punch-card",
        { x: 30, opacity: 0, duration: 0.28, ease: "power2.in" },
        2.85
      );

      // --- Overlay 2: Diagram "3 DẶM DƯỚI MƯA" (3.13s -> 5.78s) ---
      tl.fromTo(
        "#diagram-card",
        { scale: 0.88, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        3.13
      );

      // Thước đo nét đứt cam tự vẽ nối dài từ điểm xuất phát (x2: 30 -> 838)
      tl.fromTo(
        "#ruler-active",
        { attr: { x2: 30 } },
        { attr: { x2: 838 }, duration: 0.75, ease: "power2.out" },
        3.25
      );

      // Rời màn hình trước khi icon fall xuất hiện
      tl.to(
        "#diagram-card",
        { opacity: 0, y: 16, duration: 0.3, ease: "power2.in" },
        5.48
      );

      // --- Overlay 3: Icon "fall" + Thẻ hậu quả (6.70s -> 8.16s) ---
      tl.fromTo(
        "#fall-card",
        { scale: 0.86, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        6.70
      );

      // Từng nét của icon fall tự vẽ liên tục
      fallSvgElements.forEach((el, index) => {
        tl.to(
          el,
          { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" },
          6.78 + index * 0.07
        );
      });

      // 4. Đăng ký timeline chính lên window.__timelines
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s20"] = tl;
    </script>
