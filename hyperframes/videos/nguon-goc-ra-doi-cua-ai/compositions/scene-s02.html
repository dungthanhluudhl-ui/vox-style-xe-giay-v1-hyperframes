    <script>
      // Khởi tạo timeline paused bắt buộc theo chuẩn HyperFrames
      const tl = gsap.timeline({ paused: true });

      // Thiết lập đo đạc hình học chính xác cho đường dây nối SVG
      const cableOrange = document.getElementById("cable-orange");
      const cableCore = document.getElementById("cable-core");

      const orangeLen = cableOrange.getTotalLength();
      const coreLen = cableCore.getTotalLength();

      cableOrange.style.strokeDasharray = orangeLen;
      cableOrange.style.strokeDashoffset = orangeLen;

      cableCore.style.strokeDasharray = coreLen;
      cableCore.style.strokeDashoffset = coreLen;

      // 1. Giai đoạn 0.0s - 0.8s: Unfold & Vào cảnh (Entrance Phase)
      tl.fromTo(
        "#header-block",
        { y: -25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.1
      );

      // Thẻ Triết học vào từ góc trái
      tl.fromTo(
        "#card-philosophy",
        { scale: 0.9, opacity: 0, x: -30 },
        { scale: 1, opacity: 1, x: 0, duration: 0.7, ease: "power3.out" },
        0.25
      );

      // Thẻ Chip bán dẫn vào từ góc phải
      tl.fromTo(
        "#card-technology",
        { scale: 0.9, opacity: 0, x: 30 },
        { scale: 1, opacity: 1, x: 0, duration: 0.7, ease: "power3.out" },
        0.4
      );

      // Điểm chốt terminal xuất hiện
      tl.fromTo(
        ["#node-left", "#node-right"],
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, stagger: 0.15, ease: "back.out(1.5)" },
        0.65
      );

      // 2. Giai đoạn 0.89s - 3.1s: Overlay 1 - "KHOẢNG CÁCH NGHỊCH LÝ" (atMs 9450 -> 0.89s)
      tl.fromTo(
        "#overlay-gap",
        { scale: 0.75, opacity: 0, y: -15 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.89
      );

      // 3. Giai đoạn 1.4s - 2.8s: Dây cam tự vẽ đâm xuyên khoảng cách
      tl.to(
        cableOrange,
        { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" },
        1.4
      );
      tl.to(
        cableCore,
        { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" },
        1.4
      );

      // Khi dây cắm vào chip (2.8s), mạch chip chớp sáng rực rỡ
      tl.fromTo(
        "#chip-circuit-lines",
        { stroke: "#141414", strokeWidth: 2 },
        { stroke: "#FF6A1A", strokeWidth: 5, duration: 0.35, yoyo: true, repeat: 1, ease: "power1.inOut" },
        2.8
      );

      // Kết thúc hiển thị Overlay 1: Fade out hoàn toàn về opacity 0
      tl.to(
        "#overlay-gap",
        { opacity: 0, scale: 0.8, duration: 0.25, ease: "power2.in" },
        3.1
      );

      // 4. Giai đoạn 4.12s - 5.95s: Overlay 2 - Icon "pin" & Mối nối (atMs 12680 -> 4.12s)
      tl.fromTo(
        "#pin-group",
        { y: -50, scale: 1.4, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        4.12
      );

      // Sóng chấn động lan tỏa từ điểm cắm ghim
      tl.fromTo(
        "#shockwave",
        { scale: 0.3, opacity: 1 },
        { scale: 2.5, opacity: 0, duration: 0.6, ease: "power2.out" },
        4.2
      );

      // Kết thúc hiển thị Overlay 2: Fade out hoàn toàn trước khi Overlay 3 xuất hiện
      tl.to(
        "#pin-group",
        { opacity: 0, scale: 0.85, duration: 0.25, ease: "power2.in" },
        5.95
      );

      // 5. Giai đoạn 5.2s - 6.4s: Siết chặt hai cực đối lập lại gần nhau
      tl.to(
        "#card-philosophy",
        { x: 30, duration: 0.9, ease: "power2.inOut" },
        5.2
      );
      tl.to(
        "#card-technology",
        { x: -30, duration: 0.9, ease: "power2.inOut" },
        5.2
      );
      tl.to(
        "#scene-stage",
        { x: -20, duration: 2.5, ease: "sine.inOut" },
        5.2
      );

      // 6. Giai đoạn 6.73s: Overlay 3 - Punch-phrase "MỐI NỐI VÔ HÌNH" (atMs 15290 -> 6.73s)
      tl.fromTo(
        "#punch-plate",
        { y: 40, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        6.73
      );

      // Nhấn thêm đổ bóng cam nổi bật cho punch plate

        "#punch-plate",
        { boxShadow: "14px 14px 0px #FF6A1A", duration: 0.4, ease: "power2.out" },
        7.3
      );

      // 7. Ambient drift nhẹ nhàng cuối cảnh
      tl.to(
        "#card-philosophy",
        { y: -6, duration: 1.3, yoyo: true, repeat: 1, ease: "sine.inOut" },
        6.6
      );
      tl.to(
