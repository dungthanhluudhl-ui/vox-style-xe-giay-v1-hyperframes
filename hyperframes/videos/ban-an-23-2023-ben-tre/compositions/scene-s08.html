<!doctype html>
<html>
  <head>

  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      :root {
        --paper: #F5F0E4;
        --ink: #141414;
        --orange: #FF6A1A;
        --light: #F7F4EC;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: "Be Vietnam Pro", sans-serif;
      }

      body {
        background: var(--paper);
        color: var(--ink);
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      .diagram {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .branch {
        fill: none;
        stroke: var(--ink);
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .branch-selected {
        stroke: var(--orange);
        stroke-width: 12;
      }

      .junction {
        fill: var(--ink);
      }

      .dark-zone {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .dark-zone-fill {
        position: absolute;
        inset: 0 0 0 65%;
        background: var(--ink);
        opacity: 0;
      }

      .dark-zone-fill::before {
        content: "";
        position: absolute;
        top: 0;
        left: -2px;
        width: 4px;
        height: 100%;
        background: var(--orange);
      }

      .overlay {
        position: absolute;
        left: 80px;
        right: 80px;
        display: flex;
        justify-content: center;
        pointer-events: none;
        height: auto;
      }

      .overlay-top {
        top: 310px;
      }

      .overlay-lower {
        top: 1020px;
      }

      .label {
        max-width: 900px;
        margin: 0;
        padding: 22px 30px;
        background: var(--paper);
        color: var(--ink);
        font-size: 42px;
        font-weight: 900;
        line-height: 1.25;
        text-align: center;
      }

      .question-mark {
        position: absolute;
        left: 470px;
        top: 1140px;
        display: block;
        width: 140px;
        height: 140px;
      }

      .question-mark path,
      .question-mark circle {
        fill: none;
        stroke: var(--orange);
        stroke-width: 12;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .bottom-bar {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .bottom-bar-fill {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 18px;
        background: var(--orange);
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s08"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.11"
      data-fps="30"
    >
      <div class="clip" id="dark-zone" data-start="0" data-duration="7.11">
        <div class="dark-zone-fill" id="dark-zone-fill"></div>
      </div>

      <svg
        class="clip diagram"
        viewBox="0 0 1080 1920"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
        data-start="0"
        data-duration="7.11"
      >
        <path id="branch-upper" class="branch" d="M 540 960 C 490 790 390 660 250 560" />
        <path id="branch-left" class="branch" d="M 540 960 C 410 930 300 900 180 860" />
        <path id="branch-lower" class="branch" d="M 540 960 C 480 1110 390 1220 250 1330" />
        <path id="branch-selected" class="branch branch-selected" d="M 540 960 C 700 900 820 800 940 690" />
        <circle class="junction" cx="540" cy="960" r="18" />
      </svg>

      <div class="clip" id="overlay-open-clip" data-start="1.96" data-duration="4.1">
        <div class="overlay overlay-top" id="overlay-open">
          <p class="label">Nhiều nhánh mở từ điểm mâu thuẫn</p>
        </div>
      </div>

      <div class="clip" id="question-icon" data-start="4.17" data-duration="2.9">
        <svg class="question-mark" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" aria-label="question">
          <path id="question-curve" d="M 40 48 C 40 20 64 12 83 20 C 107 30 104 55 88 69 C 76 80 69 87 69 101" />
          <circle id="question-dot" cx="69" cy="122" r="2" />
        </svg>
      </div>

      <div class="clip" id="overlay-choice-clip" data-start="6.39" data-duration="0.72">
        <div class="overlay overlay-lower" id="overlay-choice">
          <p class="label">Một nhánh đi vào vùng tối; các nhánh khác khép lại</p>
        </div>
      </div>

      <div class="clip bottom-bar" id="bottom-bar" data-start="0" data-duration="7.11">
        <div class="bottom-bar-fill"></div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      const paths = [
        "#branch-upper",
        "#branch-left",
        "#branch-lower",
        "#branch-selected",
      ];

      paths.forEach((selector) => {
        const path = document.querySelector(selector);
        const length = path.getTotalLength();
        path.style.strokeDasharray = String(length);
        path.style.strokeDashoffset = String(length);
      });

      tl.to("#branch-upper", { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 0.18);
      tl.to("#branch-left", { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 0.32);
      tl.to("#branch-lower", { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 0.46);
      tl.to("#branch-selected", { strokeDashoffset: 0, duration: 0.75, ease: "power3.out" }, 0.62);

      tl.fromTo(
        "#overlay-open",
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.96,
      );

      const questionCurve = document.querySelector("#question-curve");
      const questionCurveLength = questionCurve.getTotalLength();
      questionCurve.style.strokeDasharray = String(questionCurveLength);
      questionCurve.style.strokeDashoffset = String(questionCurveLength);

      tl.fromTo(
        "#question-curve",
        { strokeDashoffset: questionCurveLength },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        4.17,
      );
      tl.fromTo(
        "#question-dot",
        { scale: 0, transformOrigin: "50% 50%" },
        { scale: 1, duration: 0.25, ease: "power3.out" },
        4.62,
      );

      tl.to("#branch-upper, #branch-left, #branch-lower", { opacity: 0.18, duration: 0.32, ease: "power2.in" }, 5.82);
      tl.to("#dark-zone-fill", { opacity: 1, duration: 0.35, ease: "power3.out" }, 5.85);
      tl.fromTo(
        "#overlay-choice",
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.32, ease: "power3.out" },
        6.39,
      );

      window.__timelines["scene-s08"] = tl;
    </script>
  
    </template>
  </body>
</html>
