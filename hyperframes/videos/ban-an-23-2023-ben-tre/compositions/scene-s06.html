<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #E7E3D9;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      .chart-field {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background:
          repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent calc(20% - 2px),
            rgba(20, 20, 20, 0.32) calc(20% - 2px),
            rgba(20, 20, 20, 0.32) 20%
          ),
          #E7E3D9;
      }

      .chart-field::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 24px;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 19.45%,
          #FF6A1A 19.45%,
          #FF6A1A 20%
        );
      }

      .scene {
        position: absolute;
        inset: 0;
        z-index: 2;
      }

      .sum-area {
        position: absolute;
        top: 490px;
        left: 92px;
        width: 896px;
        height: 690px;
      }

      .incoming {
        position: absolute;
        left: 22px;
        width: 360px;
        height: 10px;
        display: block;
        transform-origin: left center;
        background: #141414;
      }

      .incoming::after {
        content: "";
        position: absolute;
        right: -2px;
        top: -7px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #FF6A1A;
        border: 4px solid #141414;
      }

      .incoming.one { top: 112px; }
      .incoming.two { top: 246px; }
      .incoming.three { top: 380px; }
      .incoming.four { top: 514px; }

      .sum-box {
        position: absolute;
        right: 10px;
        top: 200px;
        width: 390px;
        height: 220px;
        display: grid;
        place-items: center;
        border: 6px solid #141414;
        background: #F5F0E4;
      }

      .sum-box::before {
        content: "";
        position: absolute;
        left: -126px;
        top: 50%;
        width: 120px;
        height: 8px;
        background: #141414;
      }

      .sum-box::after {
        content: "";
        position: absolute;
        left: -138px;
        top: calc(50% - 12px);
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #FF6A1A;
        border: 4px solid #141414;
      }

      .total {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        width: 100%;
        margin: 0;
        text-align: center;
        font-size: 70px;
        line-height: 1.2;
        font-weight: 900;
        color: #141414;
        white-space: nowrap;
      }

      .schedule {
        position: absolute;
        left: 124px;
        right: 124px;
        top: 1310px;
        height: 180px;
      }

      .schedule-rail {
        position: absolute;
        left: 0;
        right: 0;
        top: 46px;
        height: 8px;
        transform-origin: left center;
        background: #141414;
      }

      .schedule-node {
        position: absolute;
        top: 25px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 6px solid #141414;
        background: #E7E3D9;
      }

      .schedule-node.first {
        left: 0;
        background: #FF6A1A;
      }

      .schedule-node.next {
        right: 0;
      }

      .stop-mark {
        position: absolute;
        top: -11px;
        right: 90px;
        width: 14px;
        height: 70px;
        background: #141414;
      }

      .stop-mark::before,
      .stop-mark::after {
        content: "";
        position: absolute;
        left: -16px;
        top: 18px;
        width: 46px;
        height: 8px;
        background: #FF6A1A;
      }

      .stop-mark::before { transform: rotate(45deg); }
      .stop-mark::after { transform: rotate(-45deg); }

      .ban-mark {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 118px;
        height: 118px;
        transform: translate(-50%, -50%);
      }

      .ban-mark circle,
      .ban-mark line {
        fill: none;
        stroke: #141414;
        stroke-width: 10;
        stroke-linecap: round;
      }

      .ban-mark line {
        stroke: #FF6A1A;
        stroke-width: 14;
      }

      .bottom-bar {
        position: absolute;
        z-index: 10;
        left: 0;
        right: 0;
        bottom: 0;
        height: 18px;
        background: #FF6A1A;
      }

      .total-clip,
      .schedule-clip,
      .ban-clip {
        position: absolute;
        inset: 0;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s06"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6.53"
      data-fps="30"
    >
      <div class="chart-field" data-layout-ignore="true"></div>

      <section class="clip scene" data-start="0" data-duration="6.53" data-track-index="0">
        <div class="sum-area" data-layout-ignore="true">
          <span class="incoming one"></span>
          <span class="incoming two"></span>
          <span class="incoming three"></span>
          <span class="incoming four"></span>
          <div class="sum-box"></div>
        </div>

        <div class="clip total-clip" data-start="2.89" data-duration="1.88" data-track-index="1">
          <h1 class="total">25 TRIỆU ĐỒNG</h1>
        </div>

        <div class="clip schedule-clip" data-start="4.83" data-duration="1.70" data-track-index="2">
          <div class="schedule" data-layout-ignore="true">
            <div class="schedule-rail"></div>
            <div class="schedule-node first"></div>
            <div class="schedule-node next"></div>
            <div class="stop-mark"></div>
          </div>
        </div>

        <div class="clip ban-clip" data-start="5.96" data-duration="0.56" data-track-index="3">
          <svg class="ban-mark" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ban-circle" cx="60" cy="60" r="45"></circle>
            <line class="ban-slash" x1="28" y1="92" x2="92" y2="28"></line>
          </svg>
        </div>
      </section>

      <div class="bottom-bar" data-layout-ignore="true"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        ".incoming.one",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.48, ease: "power3.out" },
        0.33
      );
      tl.fromTo(
        ".incoming.two",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.48, ease: "power3.out" },
        0.58
      );
      tl.fromTo(
        ".incoming.three",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.48, ease: "power3.out" },
        0.83
      );
      tl.fromTo(
        ".incoming.four",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.48, ease: "power3.out" },
        1.08
      );

      tl.fromTo(
        ".sum-box",
        { scale: 0.92, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        1.43
      );

      tl.fromTo(
        ".total",
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" },
        2.89
      );

      tl.fromTo(
        ".schedule-rail",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.55, ease: "power3.out" },
        4.88
      );
      tl.fromTo(
        ".schedule-node.first",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.32, ease: "power3.out" },
        4.94
      );
      tl.fromTo(
        ".schedule-node.next",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.32, ease: "power3.out" },
        5.17
      );
      tl.fromTo(
        ".stop-mark",
        { scaleY: 0, transformOrigin: "center center" },
        { scaleY: 1, duration: 0.28, ease: "power4.out" },
        5.42
      );

      const banCircle = document.querySelector(".ban-circle");
      const banSlash = document.querySelector(".ban-slash");
      const circleLength = banCircle.getTotalLength();
      const slashLength = banSlash.getTotalLength();
      banCircle.style.strokeDasharray = String(circleLength);
      banCircle.style.strokeDashoffset = String(circleLength);
      banSlash.style.strokeDasharray = String(slashLength);
      banSlash.style.strokeDashoffset = String(slashLength);

      tl.to(".ban-circle", { strokeDashoffset: 0, duration: 0.30, ease: "power2.out" }, 5.99);
      tl.to(".ban-slash", { strokeDashoffset: 0, duration: 0.24, ease: "power2.out" }, 6.18);

      window.__timelines["scene-s06"] = tl;
    </script>
  
    </template>
  </body>
</html>
