<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      :root {
        --paper: #E7E3D9;
        --ink: #141414;
        --orange: #FF6A1A;
        --light: #F7F4EC;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        font-family: "Be Vietnam Pro", sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      #scene-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 55% 50%;
        display: block;
      }

      .spotlight {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: radial-gradient(
          ellipse 72% 58% at 52% 46%,
          rgba(20, 20, 20, 0.02) 0%,
          rgba(20, 20, 20, 0.12) 56%,
          rgba(20, 20, 20, 0.52) 100%
        );
      }

      .bottom-bar {
        position: absolute;
        z-index: 20;
        left: 0;
        right: 0;
        bottom: 0;
        height: 16px;
        background: var(--orange);
      }

      .overlay {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }

      .label-plate {
        position: absolute;
        left: 70px;
        top: 250px;
        max-width: 860px;
        padding: 16px 24px;
        background: var(--ink);
        color: var(--light);
        font-size: 38px;
        line-height: 1.25;
        font-weight: 900;
        letter-spacing: -0.5px;
      }

      .label-plate.orange-edge {
        border-left: 12px solid var(--orange);
      }

      .sweep {
        position: absolute;
        left: 130px;
        top: 510px;
        width: 670px;
        height: 400px;
        overflow: visible;
      }

      .sweep path {
        fill: none;
        stroke: var(--orange);
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .icon-wrap {
        position: absolute;
        left: 760px;
        top: 720px;
        width: 150px;
        height: 150px;
        display: grid;
        place-items: center;
        background: var(--ink);
        border: 6px solid var(--orange);
        border-radius: 50%;
      }

      .icon-wrap svg {
        width: 84px;
        height: 84px;
        display: block;
      }

      .icon-wrap path,
      .icon-wrap circle,
      .icon-wrap line {
        fill: none;
        stroke: var(--light);
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .distance-line {
        position: absolute;
        left: 170px;
        top: 1120px;
        width: 740px;
        height: 170px;
      }

      .distance-line path {
        fill: none;
        stroke: var(--orange);
        stroke-width: 10;
        stroke-linecap: round;
      }

      .distance-line circle {
        fill: var(--ink);
        stroke: var(--orange);
        stroke-width: 8;
      }

      .ban-icon {
        position: absolute;
        right: 82px;
        bottom: 610px;
        width: 108px;
        height: 108px;
        display: grid;
        place-items: center;
        background: var(--ink);
        border: 5px solid var(--orange);
        border-radius: 50%;
      }

      .ban-icon svg {
        width: 66px;
        height: 66px;
        display: block;
      }

      .ban-icon circle,
      .ban-icon line {
        fill: none;
        stroke: var(--light);
        stroke-width: 7;
        stroke-linecap: round;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s17"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="8.74"
      data-fps="30"
    >
      <img
        id="scene-image"
        class="clip"
        src="assets/img-12-rural-dock-river-boat.jpg"
        alt=""
        data-start="0"
        data-duration="8.74"
        data-track-index="0"
      />

      <div class="spotlight" aria-hidden="true"></div>
      <div class="bottom-bar" aria-hidden="true"></div>

      <section
        id="sweep-overlay"
        class="clip overlay"
        data-start="0.52"
        data-duration="2.55"
        data-track-index="1"
      >
        <div id="sweep-label" class="label-plate orange-edge">Vệt quan sát quét lối vào trống</div>
        <svg class="sweep" viewBox="0 0 670 400" aria-hidden="true">
          <path id="sweep-path" d="M 38 320 C 170 104, 390 42, 610 118" />
        </svg>
      </section>

      <section
        id="person-overlay"
        class="clip overlay"
        data-start="3.48"
        data-duration="1.88"
        data-track-index="2"
      >
        <div id="person-icon" class="icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <circle id="person-head" cx="50" cy="25" r="13" />
            <path id="person-body" d="M 25 82 C 27 58, 36 48, 50 48 C 64 48, 73 58, 75 82" />
          </svg>
        </div>
      </section>

      <section
        id="distance-overlay"
        class="clip overlay"
        data-start="4.6"
        data-duration="2.68"
        data-track-index="3"
      >
        <div id="distance-label" class="label-plate orange-edge">Khoảng cách giữa hai vị trí thu hẹp sau nhịp quan sát</div>
        <svg class="distance-line" viewBox="0 0 740 170" aria-hidden="true">
          <circle cx="70" cy="90" r="24" />
          <circle cx="670" cy="90" r="24" />
          <path id="distance-path" d="M 108 90 L 632 90" />
        </svg>
      </section>

      <section
        id="ban-overlay"
        class="clip overlay"
        data-start="8.02"
        data-duration="0.71"
        data-track-index="4"
      >
        <div id="ban-icon" class="ban-icon" aria-hidden="true">
          <svg viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="29" />
            <line x1="20" y1="60" x2="60" y2="20" />
          </svg>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "#scene-image",
        { scale: 1.34, x: 46, transformOrigin: "50% 50%" },
        { scale: 1.08, x: 40, duration: 0.72, ease: "expo.out" },
        0
      );

      tl.fromTo(
        "#scene-image",
        { scale: 1.08, x: 40 },
        { scale: 1.0, x: -26, duration: 8.02, ease: "sine.inOut" },
        0.72
      );

      tl.fromTo(
        "#sweep-label",
        { x: -34, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.38, ease: "power3.out" },
        0.52
      );

      const sweepPath = document.querySelector("#sweep-path");
      const sweepLength = sweepPath.getTotalLength();
      sweepPath.style.strokeDasharray = String(sweepLength);
      sweepPath.style.strokeDashoffset = String(sweepLength);
      tl.to("#sweep-path", { strokeDashoffset: 0, duration: 1.25, ease: "power2.out" }, 0.7);

      tl.fromTo(
        "#person-icon",
        { scale: 0.72, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        3.48
      );

      ["#person-head", "#person-body"].forEach((selector, index) => {
        const shape = document.querySelector(selector);
        const length = shape.getTotalLength();
        shape.style.strokeDasharray = String(length);
        shape.style.strokeDashoffset = String(length);
        tl.to(shape, { strokeDashoffset: 0, duration: 0.48, ease: "power2.out" }, 3.62 + index * 0.12);
      });

      tl.fromTo(
        "#distance-label",
        { x: -30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        4.6
      );

      const distancePath = document.querySelector("#distance-path");
      const distanceLength = distancePath.getTotalLength();
      distancePath.style.strokeDasharray = String(distanceLength);
      distancePath.style.strokeDashoffset = String(distanceLength);
      tl.to("#distance-path", { strokeDashoffset: 0, duration: 1.25, ease: "power2.out" }, 4.85);

      tl.fromTo(
        "#ban-icon",
        { scale: 0.72, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.38, ease: "power3.out" },
        8.02
      );

      window.__timelines["scene-s17"] = tl;
    </script>
  
    </template>
  </body>
</html>
