        width: 2160px;

      document.querySelectorAll(".route path").forEach((path) => {
        const length = path.getTotalLength();

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "#scene-image",
        { x: -540, y: 0, scale: 1.035, opacity: 0 },
        { x: -540, y: 0, scale: 1, opacity: 1, duration: 0.72, ease: "power3.out" },

        duration: 3.1,
        ease: "sine.inOut"
      }, 1.1);

      tl.fromTo(
        "#ban-mark-inner",
        { scale: 0.72, opacity: 0, rotation: -12 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.48, ease: "power3.out" },

        { opacity: 0 },

        { strokeDashoffset: 0, duration: 0.72, ease: "power2.out" },

      tl.fromTo(

        { strokeDashoffset: 0, duration: 0.62, ease: "power2.out" },

      tl.fromTo(
