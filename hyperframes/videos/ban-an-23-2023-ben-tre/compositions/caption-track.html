      <script>
        const pages = Array.from(document.querySelectorAll(".caption-page"));
        const words = Array.from(document.querySelectorAll(".word"));

        const tl = gsap.timeline({ paused: true });

        // Driver tuyến tính DUY NHẤT cho toàn bộ track (khuyến nghị của
        // hyperframes-animation/rules/asr-keyword-glow.md: "one driver looping all words",
        // không tạo 1 tween/từ). Port đúng logic isActive của Captions.tsx: token.fromMs <=
        // absoluteTimeMs && token.toMs > absoluteTimeMs.
        const driver = { ms: 0 };
        tl.to(
          driver,
          {
            ms: 293680,
            duration: 293.680000,
            ease: "none",
            onUpdate: () => {
              for (const w of words) {
                const fromMs = Number(w.dataset.fromMs);
                const toMs = Number(w.dataset.toMs);

        );

        // vision agent thật ở Checkpoint A.
      tl.fromTo(pages[0].querySelector(".caption-card"), {opacity: 0, y: 12}, {opacity: 1, y: 0, duration: 0.166667, ease: "expo.out", immediateRender: false}, 0.070000);

      tl.fromTo(pages[7].querySelector(".caption-card"), {opacity: 0, y: 12}, {opacity: 1, y: 0, duration: 0.166667, ease: "expo.out", immediateRender: false}, 7.070000);
      tl.fromTo(pages[8].querySelector(".caption-card"), {opacity: 0, y: 12}, {opacity: 1, y: 0, duration: 0.166667, ease: "expo.out", immediateRender: false}, 7.520000);
