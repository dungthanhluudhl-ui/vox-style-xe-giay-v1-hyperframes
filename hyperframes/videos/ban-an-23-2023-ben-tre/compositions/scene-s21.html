<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      :root {
        --paper: #F5F0E4;
        --ink: #141414;
        --orange: #FF6A1A;
        --grid: rgba(20, 20, 20, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: "Be Vietnam Pro", sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
      }

      .card-background {
        position: absolute;
        inset: 0;
        background-color: var(--paper);
        background-image:
          linear-gradient(to right, var(--grid) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, var(--grid) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }

      .bottom-bar {
        position: absolute;
        z-index: 10;
        left: 0;
        right: 0;
        bottom: 0;
        height: 18px;
        background: var(--orange);
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      .scene-content {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 160px 72px 530px;
      }

      .summary-card {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .eyebrow {
        display: inline-block;
        margin: 0 0 54px;
        padding: 16px 26px;
        background: var(--orange);
        color: var(--ink);
        font-size: 29px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: 0.02em;
      }

      .comparison {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
      }

      .fact-box {
        min-height: 360px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 34px 24px;
        border: 3px solid var(--ink);
        background: var(--paper);
        text-align: center;
      }

      .fact-box.result {
        border-color: var(--orange);
        background: var(--ink);
        color: var(--paper);
      }

      .fact-label {
        margin: 0 0 22px;
        font-size: 22px;
        font-weight: 700;
        line-height: 1.35;
      }

      .fact-name {
        margin: 0;
        font-size: 38px;
        font-weight: 900;
        line-height: 1.22;
      }

      .result .fact-name {
        color: var(--orange);
      }

      .timeline-strip {
        width: 100%;
        margin-top: 42px;
        padding: 22px 26px;
        border-left: 10px solid var(--orange);
        background: var(--ink);
        color: var(--paper);
        font-size: 25px;
        font-weight: 700;
        line-height: 1.45;
      }

      .timeline-strip strong {
        color: var(--orange);
        font-weight: 900;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s21"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="8.89"
      data-fps="30"
    >
      <div class="card-background" aria-hidden="true"></div>

      <section class="clip scene-content" data-start="0" data-duration="8.89">
        <div class="summary-card">
          <div class="eyebrow" id="summary-label">TÓM TẮT LỜI KỂ</div>

          <div class="comparison">
            <div class="fact-box result" id="water-box">
              <p class="fact-label">NGUYÊN NHÂN TỬ VONG</p>
              <p class="fact-name">NGẠT NƯỚC</p>
            </div>
            <div class="fact-box" id="electric-box">
              <p class="fact-label">ĐIỆN GIẬT</p>
              <p class="fact-name">Không ghi là nguyên nhân tử vong</p>
            </div>
          </div>

          <div class="timeline-strip" id="timeline-strip">
            Ô điện giật rời vị trí nguyên nhân tử vong, vẫn còn trên <strong>dải diễn biến</strong>
          </div>
        </div>
      </section>

      <div class="bottom-bar" aria-hidden="true"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "#summary-label",
        { scaleY: 0, opacity: 0, transformOrigin: "50% 0%" },
        { scaleY: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        0.79
      );

      tl.fromTo(
        "#water-box",
        { scaleY: 0, opacity: 0, transformOrigin: "50% 100%" },
        { scaleY: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.18
      );

      tl.fromTo(
        "#electric-box",
        { scaleY: 0, opacity: 0, transformOrigin: "50% 0%" },
        { scaleY: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.38
      );

      tl.fromTo(
        "#timeline-strip",
        { y: 28, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.42, ease: "power2.out" },
        5.95
      );

      window.__timelines["scene-s21"] = tl;
    </script>
  
    </template>
  </body>
</html>
