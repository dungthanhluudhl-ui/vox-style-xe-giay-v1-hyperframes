<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      /* hf-safe-colors */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #141414;
      }

      body {
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #141414;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      .scene {
        padding: 170px 64px 550px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 38px;
      }

      .spotlight {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, #38352f 0%, #22211e 48%, #141414 100%);
      }

      .panel {
        position: relative;
        width: 100%;
        min-height: 400px;
        padding: 38px 42px;
        border: 2px solid rgba(231, 227, 217, 0.5);
        background: #E7E3D9;
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow: hidden;
      }

      .panel-header {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 30px;
      }

      .panel-kicker {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 0.12em;
      }

      .status-light {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #141414;
        flex: 0 0 auto;
      }

      .house-symbol {
        position: relative;
        width: 112px;
        height: 92px;
        margin: 0 auto 22px;
      }

      .house-roof {
        position: absolute;
        left: 16px;
        top: 0;
        width: 80px;
        height: 80px;
        border-top: 10px solid #141414;
        border-left: 10px solid #141414;
        transform: rotate(45deg);
      }

      .house-body {
        position: absolute;
        left: 20px;
        bottom: 0;
        width: 72px;
        height: 62px;
        border: 10px solid #141414;
        background: #E7E3D9;
      }

      .house-door {
        position: absolute;
        left: 47px;
        bottom: 0;
        width: 18px;
        height: 36px;
        background: #141414;
      }

      .panel-copy {
        max-width: 780px;
        margin: 0 auto;
        text-align: center;
        font-size: 39px;
        line-height: 1.25;
        font-weight: 900;
      }

      .orange-rule {
        display: block;
        width: 100%;
        height: 8px;
        margin-top: 30px;
        background: #FF6A1A;
        transform-origin: left center;
      }

      .ditch {
        position: relative;
        height: 230px;
        border: 2px solid rgba(231, 227, 217, 0.5);
        background: #E7E3D9;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .ditch-channel {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 58px;
        margin-top: -29px;
        background: #141414;
      }

      .ditch-channel::before,
      .ditch-channel::after {
        content: "";
        position: absolute;
        top: -28px;
        width: 100%;
        height: 28px;
        border-top: 4px solid #141414;
      }

      .ditch-channel::after {
        top: auto;
        bottom: -28px;
        border-top: 0;
        border-bottom: 4px solid #141414;
      }

      .warning-mark {
        position: relative;
        z-index: 5;
        width: 98px;
        height: 90px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FF6A1A;
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
        color: #141414;
        font-size: 50px;
        font-weight: 900;
        padding-top: 22px;
      }

      .flow-line {
        position: absolute;
        left: 10%;
        top: 50%;
        width: 80%;
        height: 8px;
        margin-top: -4px;
        background: #FF6A1A;
        transform: scaleX(0);
        transform-origin: left center;
        z-index: 3;
      }

      .flow-dot {
        position: absolute;
        left: calc(90% - 12px);
        top: 50%;
        width: 24px;
        height: 24px;
        margin-top: -12px;
        border-radius: 50%;
        background: #FF6A1A;
        transform: scale(0);
        z-index: 4;
      }

      .punch {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 610px;
        min-height: 132px;
        height: auto;
        padding: 24px 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FF6A1A;
        color: #141414;
        text-align: center;
        font-size: 52px;
        line-height: 1.15;
        font-weight: 900;
        opacity: 0;
        z-index: 10;
      }

      .bottom-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 16px;
        background: #FF6A1A;
        z-index: 20;
      }

      .stage-label {
        position: absolute;
        left: 64px;
        top: 155px;
        color: #F7F4EC;
        font-size: 24px;
        line-height: 1.2;
        font-weight: 900;
        letter-spacing: 0.16em;
      }
    </style>

    <div
      id="root"

      data-width="1080"
      data-height="1920"
      data-duration="7.16"
    >
      <div class="spotlight"></div>
      <div class="stage-label">TRẠNG THÁI ĐỒNG THỜI</div>

      <section id="comparison" class="clip scene" data-start="0" data-duration="7.16">
        <div id="house-panel" class="panel">
          <div class="panel-header">
            <span class="status-light"></span>
            <span class="panel-kicker">TRONG NHÀ</span>
          </div>
          <div class="house-symbol" aria-hidden="true">
            <div class="house-roof"></div>
            <div class="house-body"></div>
            <div class="house-door"></div>
          </div>
          <div class="panel-copy">Điện hoạt động bình thường</div>
          <span id="house-rule" class="orange-rule"></span>
        </div>

        <div id="ditch-panel" class="ditch">
          <div class="ditch-channel"></div>
          <div id="flow-line" class="flow-line"></div>
          <div id="flow-dot" class="flow-dot"></div>
          <div id="warning-mark" class="warning-mark" aria-label="Cảnh báo">!</div>
        </div>
      </section>

      <div id="punch" class="punch">
        KHÔNG CÒN BỘC PHÁT
      </div>

      <div class="bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(

      window.__timelines["scene-s14"] = tl;
