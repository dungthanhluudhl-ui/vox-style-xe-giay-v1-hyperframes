      // Single paused timeline strictly attached to window.__timelines["scene-s04"]

      tl.fromTo(
        "#content-wrapper",
        { scale: 0.9, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
        0
      );

      // Dossier header slide down
      tl.fromTo(
        "#dossier-header",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.15
      );

      // Initial map elements appearance
      tl.fromTo(
        "#province-boundary",
        { opacity: 0, scale: 0.95 },
        { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" },
        0.2
      );

      tl.fromTo(
        "#river-hong",
        { opacity: 0 },
        { opacity: 1, duration: 0.6, ease: "power1.out" },
        0.4
      );

      // Timeline container pop in
      tl.fromTo(
        "#timeline-container",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.35
      );

      // 2. Timeline slider animation: slides tape smoothly into position (0.65s - 1.75s)
      tl.fromTo(
        "#timeline-tape",
        { x: 340 },
        { x: -526, duration: 1.1, ease: "power2.out" },
        0.65
      );

      // Needle appearance with explicit transformOrigin and no conflicting CSS transform
      tl.fromTo(
        "#timeline-needle",
        { scaleY: 0, transformOrigin: "top center" },
        { scaleY: 1, duration: 0.35, ease: "power3.out" },
        1.35
      );

      // 3. OVERLAY 1 Entrance (exact cue atMs: 27460 -> local 1.73s)
      tl.fromTo(
        "#overlay-1-card",
        { scale: 0.8, opacity: 0, y: 15 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.73
      );

      // 4. Map Camera Motion: 'zoom-in' targeting Xuân Trường (2.4s - 4.2s)
      tl.to(
        "#map-camera",
        {
          scale: 2.1,
          x: -180,
          y: 60,
          duration: 1.8,
          ease: "power2.inOut"
        },
        2.4
      );

      // Fade out general district labels as we zoom into Xuan Truong
      tl.to(
        "#map-labels",
        { opacity: 0.15, duration: 0.8, ease: "power1.out" },
        2.6
      );

      // Radar rings expanding at Xuan Truong (Single deterministic tween per element)
      tl.fromTo(
        "#radar-ring-1",
        { scale: 0.4, opacity: 0 },
        { scale: 1.25, opacity: 0.7, duration: 1.8, ease: "power2.out" },
        3.1
      );
      tl.fromTo(
        "#radar-ring-2",
        { scale: 0.4, opacity: 0 },
        { scale: 1.45, opacity: 0.5, duration: 2.0, ease: "power2.out" },
        3.3
      );

      // Pin drops onto target (3.6s) with house smooth settle
      tl.fromTo(
        "#map-pin",
        { y: -60, scale: 0, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        3.6
      );

        { scale: 0.8, opacity: 0, x: -20 },
        { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        3.93
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s04"] = tl;
    </script>
