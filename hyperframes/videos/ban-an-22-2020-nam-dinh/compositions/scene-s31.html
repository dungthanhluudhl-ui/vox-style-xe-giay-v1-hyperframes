    <!-- GSAP Seekable Timeline Script -->
    <script>
      // Khởi tạo Timeline Paused theo hợp đồng bắt buộc của HyperFrames
      const tl = gsap.timeline({ paused: true });

      // 1. Camera Motion: zoom-in chậm, liên tục xuyên suốt 5.5s của scene
      tl.to("#camera-rig", {
        scale: 1.07,
        duration: 5.5,
        ease: "sine.inOut"
      }, 0);

      // 2. TransitionIn "strike": Cánh cửa sắt va đập mạnh từ ngoài vào, giật nảy và dừng sững ở góc hé 10 độ
      // Bắt đầu từ góc mở sâu -50 độ
      tl.fromTo("#door-leaf",
        { rotateY: -50 },
        { rotateY: 0, duration: 0.35, ease: "power4.in" },
        0
      );

      // Khoảnh khắc va chạm (strike) ở t = 0.35s: nảy ngược lại và cố định ở góc -10 độ
      tl.to("#door-leaf", {
        rotateY: -10,
        duration: 0.45,
        ease: "power2.out"
      }, 0.35);

      // Rung chấn camera khi cánh cửa va vào chốt hãm
      tl.fromTo("#camera-rig",
        { y: -10 },
        { y: 0, duration: 0.22, ease: "power2.out" },
        0.35
      );

      // 3. Tia sáng cam bùng lên rọi qua khe cửa ngay tại khoảnh khắc va chạm
      tl.fromTo("#light-beam-group",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power3.out" },
        0.35
      );

      // Ánh sáng cam thở nhẹ (ambient pulsation) cảnh báo trạng thái treo
      tl.to("#light-beam-group", {
        opacity: 0.75,
        duration: 1.2,
        yoyo: true,
        repeat: 3,
        ease: "sine.inOut"
      }, 0.7);

      // 4. Overlay 1: "CỬA TÙ CHƯA ĐÓNG HẲN" xuất hiện tại t = 0.6s
      tl.fromTo("#overlay-1-wrap",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.6
      );

      // Diagram annotations (cung đo góc và nhãn chốt) hiển thị đồng bộ
      tl.fromTo("#angle-measure-group",
        { scale: 0.8, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power2.out" },
        0.8
      );

      tl.fromTo("#latch-callout-group",
        { x: 25, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
        0.95
      );

      // Overlay 1 thu hồi êm ái trước khi sang nhịp tiếp theo (t = 2.7s)
      tl.to("#overlay-1-wrap", {
        y: -15,
        opacity: 0,
        duration: 0.3,
        ease: "power2.in"
      }, 2.7);

      // 5. Overlay 2: "TRẠNG THÁI CHỜ MỞ" + warning icon xuất hiện dứt khoát tại t = 4.05s
      tl.fromTo("#overlay-2-wrap",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        4.05
      );

      // Icon cảnh báo nảy vào vị trí
      tl.fromTo(".warning-icon-svg",
        { scale: 0.3, rotation: -18 },
        { scale: 1, rotation: 0, duration: 0.4, ease: "power3.out" },
        4.1
      );

      // Đăng ký timeline chính duy nhất cho composition root "scene-s31"
      window.__timelines["scene-s31"] = tl;
    </script>
