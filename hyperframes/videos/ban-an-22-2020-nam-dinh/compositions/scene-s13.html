<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
    }
    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
    }
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Bottom Brand Anchor */
    #vox-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 14px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Camera Viewport */
    #camera-rig {
      position: absolute;
      inset: 0;
      overflow: hidden;
      transform-origin: 50% 50%;
      will-change: transform;
    }
    #bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Background Variant: Spotlight */
    #spotlight-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 48%, rgba(20, 20, 20, 0.05) 25%, rgba(20, 20, 20, 0.42) 75%, rgba(20, 20, 20, 0.72) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Subdued Technical Grid */
    #grid-layer {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      pointer-events: none;
      z-index: 3;
    }

    /* SVG Technical Annotation Canvas */
    #annotation-canvas {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      z-index: 10;
      pointer-events: none;
    }

    /* Overlay Cards Container */
    .overlay-card {
      position: absolute;
      z-index: 25;
      pointer-events: none;
      height: auto;
    }

    /* Card 1: Cự ly nửa mét */
    #card-distance {
      top: 260px;
      left: 60px;
      max-width: 600px;
    }

    /* Card 2: Trúng vùng mặt */
    #card-impact {
      top: 680px;
      right: 60px;
      max-width: 640px;
    }

    /* Card 3: Nạn nhân gục xuống */
    #card-victim-down {
      top: 1160px;
      left: 60px;
      max-width: 640px;
    }

    .headline-panel {
      padding: 20px 32px;
      font-size: 52px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -0.5px;
      border-radius: 6px;
      border-left: 8px solid #FF6A1A;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      display: inline-flex;
      align-items: center;
      gap: 18px;
      white-space: nowrap;
    }

    /* Impact Marker */
    #impact-burst {
      position: absolute;
      top: 790px;
      left: 550px;
      width: 140px;
      height: 140px;
      z-index: 12;
      pointer-events: none;
    }

    .warning-icon {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s13"
    data-width="1080"
    data-height="1920"
    data-duration="10.21"
  >
    <!-- Master Scene Clip S13-1 -->
    <section id="scene-s13" class="clip" data-start="0" data-duration="10.21">
      
      <!-- Camera Rig for Zoom/Strike Motion -->
      <div id="camera-rig">
        <img
          id="bg-image"
          src="assets/img-09-tuan-throwing-brick-reconstruction.jpg"
          alt="Tái hiện hành vi ném gạch qua tường rào"
        >
        <div id="spotlight-vignette"></div>
        <div id="grid-layer"></div>

        <!-- Technical Drawing & Trajectory Overlay -->
        <svg id="annotation-canvas" viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg" data-layout-allow-overflow="true">
          <!-- Distance Dimension Line (0.5m) -->
          <g id="dimension-group" opacity="0">
            <!-- Left stop tick -->
            <line x1="280" y1="910" x2="280" y2="990" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round" />
            <!-- Dimension baseline -->
            <path id="dimension-line" d="M 280 950 L 470 950" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round" />
            <!-- Right stop tick -->
            <line x1="470" y1="910" x2="470" y2="990" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round" />
          </g>

          <!-- Brick Flight Trajectory Arc -->
          <g id="trajectory-group" opacity="0">
            <!-- Dashed Arc from Thrower over Fence to Victim -->
            <path
              id="brick-arc"
              d="M 310 930 Q 480 620 620 860"
              stroke="#FF6A1A"
              stroke-width="8"
              stroke-linecap="round"
              stroke-dasharray="16 12"
            />
            <!-- Directional arrowhead -->
            <polygon id="arc-arrow" points="620,860 600,845 612,835" fill="#FF6A1A" opacity="0" />
          </g>

          <!-- Impact Reticle -->
          <g id="impact-crosshair" opacity="0">
            <circle cx="620" cy="860" r="32" stroke="#FF6A1A" stroke-width="6" fill="none" />
            <circle cx="620" cy="860" r="8" fill="#FF6A1A" />
            <line x1="565" y1="860" x2="675" y2="860" stroke="#FF6A1A" stroke-width="4" />
            <line x1="620" y1="805" x2="620" y2="915" stroke="#FF6A1A" stroke-width="4" />
          </g>

          <!-- Victim Fall Vector -->
          <g id="down-vector-group" opacity="0">
            <path id="down-vector-path" d="M 620 940 L 620 1140" stroke="#FF6A1A" stroke-width="8" stroke-linecap="round" />
            <polygon id="down-arrow" points="620,1165 602,1130 638,1130" fill="#FF6A1A" opacity="0" />
          </g>
        </svg>

        <!-- Impact Shockwave Burst -->
        <div id="impact-burst" style="opacity: 0;">
          <svg viewBox="0 0 140 140" width="140" height="140" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="70" cy="70" r="50" stroke="#FF6A1A" stroke-width="12" fill="none" />
          </svg>
        </div>
      </div>

      <!-- Overlay 1: CỰ LY NỬA MÉT (atMs: 108760 -> 1.45s, hold: 2.0s) -->
      <div id="card-distance" class="overlay-card" style="opacity: 0;">
        <div class="headline-panel hf-plate-ink">
          <span>CỰ LY NỬA MÉT</span>
        </div>
      </div>

      <!-- Overlay 2: TRÚNG VÙNG MẶT (atMs: 114730 -> 7.42s, hold: 2.2s) -->
      <div id="card-impact" class="overlay-card" style="opacity: 0;">
        <div class="headline-panel hf-plate-ink-orange">
          <svg class="warning-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3L2 21H22L12 3Z" stroke="#FF6A1A" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M12 9V14" stroke="#FF6A1A" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="12" cy="18" r="1.25" fill="#FF6A1A"/>
          </svg>
          <span>TRÚNG VÙNG MẶT</span>
        </div>
      </div>

      <!-- Overlay 3: NẠN NHÂN GỤC XUỐNG (atMs: 116310 -> 9.00s, hold: 1.6s) -->
      <div id="card-victim-down" class="overlay-card" style="opacity: 0;">
        <div class="headline-panel hf-plate-ink">
          <span>NẠN NHÂN GỤC XUỐNG</span>
        </div>
      </div>

      <!-- Bottom Orange Bar (Brand Anchor) -->
      <div id="vox-bottom-bar"></div>
    </section>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Setup initial SVG Dash geometry using measured lengths
    const brickArc = document.getElementById("brick-arc");
    if (brickArc) {
      const arcLen = brickArc.getTotalLength();
      brickArc.style.strokeDasharray = arcLen;
      brickArc.style.strokeDashoffset = arcLen;
    }

    const dimLine = document.getElementById("dimension-line");
    if (dimLine) {
      const lineLen = dimLine.getTotalLength();
      dimLine.style.strokeDasharray = lineLen;
      dimLine.style.strokeDashoffset = lineLen;
    }

    const downPath = document.getElementById("down-vector-path");
    if (downPath) {
      const downLen = downPath.getTotalLength();
      downPath.style.strokeDasharray = downLen;
      downPath.style.strokeDashoffset = downLen;
    }

    // ==========================================
    // PHASE 1: TRANSITION IN "STRIKE" (0.0s - 1.45s)
    // ==========================================
    tl.fromTo(
      "#camera-rig",
      { scale: 1.15, x: 0, y: 0 },
      { scale: 1.05, duration: 0.8, ease: "power4.out" },
      0
    );

    // Establishing camera drift
    tl.to(
      "#camera-rig",
      { scale: 1.08, duration: 6.55, ease: "none" },
      0.8
    );

    // ==========================================
    // PHASE 2: CỰ LY NỬA MÉT (1.45s - 3.45s)
    // Shotlist atMs: 108760 (1.45s), hold: 2000ms
    // ==========================================
    tl.to("#dimension-group", { opacity: 1, duration: 0.15, ease: "power1.out" }, 1.45);
    tl.to(
      "#dimension-line",
      { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
      1.5
    );

    tl.fromTo(
      "#card-distance",
      { opacity: 0, y: 25 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      1.55
    );

    // Fade out distance callout
    tl.to("#dimension-group", { opacity: 0.25, duration: 0.4, ease: "power2.inOut" }, 3.45);
    tl.to("#card-distance", { opacity: 0, y: -15, duration: 0.35, ease: "power2.in" }, 3.45);

    // ==========================================
    // PHASE 3: ĐƯỜNG BAY VIÊN GẠCH (4.2s - 6.8s)
    // ==========================================
    tl.to("#trajectory-group", { opacity: 1, duration: 0.15 }, 4.2);
    tl.to(
      "#brick-arc",
      { strokeDashoffset: 0, duration: 1.8, ease: "power1.inOut" },
      4.3
    );
    tl.fromTo(
      "#arc-arrow",
      { opacity: 0 },
      { opacity: 1, duration: 0.25, ease: "power2.out" },
      6.0
    );

    // ==========================================
    // PHASE 4: VA CHẠM - TRÚNG VÙNG MẶT (7.42s - 9.62s)
    // Shotlist atMs: 114730 (7.42s), hold: 2200ms
    // ==========================================
    // Camera zoom-in nhanh lúc va chạm
    tl.to(
      "#camera-rig",
      {
        scale: 1.25,
        x: -80,
        y: -40,
        duration: 0.32,
        ease: "power4.out"
      },
      7.35
    );

    // Impact Reticle & Shockwave Burst
    tl.to("#impact-crosshair", { opacity: 1, duration: 0.15 }, 7.42);
    tl.fromTo(
      "#impact-burst",
      { opacity: 1, scale: 0.2, transformOrigin: "50% 50%" },
      { opacity: 0, scale: 2.2, duration: 0.45, ease: "power3.out" },
      7.42
    );

    // Impact micro-shake
    tl.to("#camera-rig", { x: -76, y: -44, duration: 0.05, ease: "none" }, 7.42);
    tl.to("#camera-rig", { x: -84, y: -36, duration: 0.05, ease: "none" }, 7.47);
    tl.to("#camera-rig", { x: -80, y: -40, duration: 0.06, ease: "none" }, 7.52);

    // Label: TRÚNG VÙNG MẶT
    tl.fromTo(
      "#card-impact",
      { opacity: 0, x: 30 },
      { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" },
      7.42
    );

    // Fade out impact label before next beat
    tl.to("#card-impact", { opacity: 0, duration: 0.35, ease: "power2.in" }, 9.0);

    // ==========================================
    // PHASE 5: NẠN NHÂN GỤC XUỐNG (9.00s - 10.21s)
    // Shotlist atMs: 116310 (9.00s), hold: 1600ms
    // ==========================================
    tl.to("#down-vector-group", { opacity: 1, duration: 0.15 }, 9.0);
    tl.to(
      "#down-vector-path",
      { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
      9.05
    );
    tl.fromTo(
      "#down-arrow",
      { opacity: 0 },
      { opacity: 1, duration: 0.2, ease: "power2.out" },
      9.35
    );

    tl.fromTo(
      "#card-victim-down",
      { opacity: 0, y: 25 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      9.05
    );

    // Smooth drift to hold visual tension until cut
    tl.to(
      "#camera-rig",
      { scale: 1.28, duration: 1.2, ease: "none" },
      9.0
    );

    // Register paused timeline with HyperFrames runtime
    window.__timelines["scene-s13"] = tl;
  </script>

    </template>
  </body>
</html>
