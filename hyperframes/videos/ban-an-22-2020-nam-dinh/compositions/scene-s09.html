      .meter-labels {

      /* Card Overlay 2: ĐÁM ĐÔNG TĂNG VỌT */
      #card-overlay-2 {

      .icon-box-ink {

        align-items: center;

      .icon-box-ink svg {

        font-weight: 700;
        padding: 4px 12px;
        border-radius: 6px;
        width: fit-content;
      }
    </style>

    <!-- Standalone HyperFrames Composition Root (S09: 10.36s) -->
    <div
      id="root"
      data-composition-id="scene-s09"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="10.36"
    >
      <!-- Fixed signature bottom orange bar -->
      <div id="bottom-accent-bar"></div>

      <!-- MAIN SHOT S09-1 (0s -> 10.36s) -->
      <section id="shot-s09-1" class="clip" data-start="0" data-duration="10.36">
        <!-- Top Editorial Category Bar -->
        <header id="scene-header">
          <span class="header-title">Vụ Án Nam Định // Diễn Biến Xung Đột</span>
          <span class="header-badge">HỖN CHIẾN</span>
        </header>

        <!-- Paper-collage Alley Brawl Hero Card -->
        <div id="hero-card">
          <div id="hero-img-wrap">
            <img
              id="hero-img"
              src="assets/img-17-paper-cutout-alley-chaos-fight.jpg"
              alt="Hỗn chiến trong ngõ"
              data-layout-allow-overflow="true"
            />
          </div>
          <div id="photo-tag">NGÕ HẺM // ĐỐI ĐẦU</div>
        </div>
      </section>

      <!-- TIMED OVERLAY 1: HAI BÊN KÉO RA (1.52s -> 4.72s, hold = 3.2s) -->
      <div id="clip-overlay-1" class="clip" data-start="1.52" data-duration="3.2">
        <div id="card-overlay-1" class="overlay-stage-card">
          <div class="icon-box-orange">
            <!-- Crowd icon (SVG path) -->
            <svg viewBox="0 0 48 48">
              <path id="crowd-path-1" d="M16 16 A6 6 0 1 0 16 4 A6 6 0 1 0 16 16 Z" />
              <path id="crowd-path-2" d="M32 18 A5 5 0 1 0 32 8 A5 5 0 1 0 32 18 Z" />
              <path id="crowd-path-3" d="M6 40 C6 30 11 26 21 26 C31 26 36 30 36 40" />
              <path id="crowd-path-4" d="M26 26 C28 24 33 24 37 26 C41 28 43 32 43 40" />
            </svg>
          </div>
          <div class="overlay-content-col">
            <h2 class="punch-phrase-light">HAI BÊN KÉO RA</h2>
            <p class="sub-phrase-paper">Người nhà hai bên ùa ra dồn dập</p>
          </div>
        </div>
      </div>

      <!-- MID-SCENE DATA VISUALIZATION: DENSITY METER (4.80s -> 8.00s, hold = 3.2s) -->
      <div id="clip-meter" class="clip" data-start="4.8" data-duration="3.2">
        <div id="card-meter" class="overlay-stage-card">
          <div class="meter-header">
            <span class="meter-title">THANH ĐO MẬT ĐỘ NGÕ HẺM</span>

      <!-- TIMED OVERLAY 2: ĐÁM ĐÔNG TĂNG VỌT (8.09s -> 10.36s, hold = 2.27s) -->
      <div id="clip-overlay-2" class="clip" data-start="8.09" data-duration="2.27">
        <div id="card-overlay-2" class="overlay-stage-card">
          <div class="icon-box-ink">
            <!-- Rise icon (SVG jagged arrow) -->
            <svg viewBox="0 0 48 48">
              <path id="rise-arrow-path" d="M 8 36 L 20 24 L 28 30 L 40 12" />
              <polyline points="28,12 40,12 40,24" />
            </svg>

    <!-- GSAP Seekable Choreography -->
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1. BEAT 0 (0.0s - 1.2s): Wobble-drop entrance of collage card & header
      tl.fromTo(
        "#hero-card",
        { y: -70, rotation: -2.5, scale: 0.94, opacity: 0 },
        { y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
        0.1
      );

      tl.fromTo(
        "#scene-header",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.2
      );

      // 2. Slow Zoom-out Camera Motion across the entire shot (10.36s)
      tl.fromTo(
        "#hero-img",
        { scale: 1.18 },
        { scale: 1.0, duration: 10.36, ease: "none" },
        0
      );

      // 3. BEAT 1 (1.52s): Overlay 1 "HAI BÊN KÉO RA" arrives
      tl.fromTo(
        "#card-overlay-1",
        { scale: 0.85, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.52
      );

      // SVG path draws on crowd icon
      tl.fromTo(
        "#crowd-path-1, #crowd-path-2, #crowd-path-3, #crowd-path-4",
        { strokeDasharray: 90, strokeDashoffset: 90 },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out", stagger: 0.08 },
        1.62
      );

      // Overlay 1 smooth exit
      tl.to(
        "#card-overlay-1",
        { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
        4.35
      );

      // 4. BEAT 2 (4.80s): Mid-scene Data Density Meter arrives
      tl.fromTo(
        "#card-meter",
        { scale: 0.88, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        4.8
      );

      // Meter bar progressive surge
      tl.fromTo(
        "#meter-fill",
        { width: "15%" },
        { width: "95%", duration: 2.1, ease: "power2.inOut" },
        5.1
      );

      // Tag pulse on escalation
      tl.fromTo(
        "#meter-status-tag",
        { scale: 0.85, opacity: 0.7 },
        { scale: 1.05, opacity: 1, duration: 0.4, ease: "power2.out" },
        5.8
      );

      // Meter card exit
      tl.to(
        "#card-meter",
        { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
        7.65
      );

      // 5. BEAT 3 (8.09s): Climax Overlay 2 "ĐÁM ĐÔNG TĂNG VỌT" punches in
      tl.fromTo(
        "#card-overlay-2",
        { scale: 0.82, opacity: 0, y: 40 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power4.out" },
        8.09
      );

      // Rise arrow draw
      tl.fromTo(
        "#rise-arrow-path",
        { strokeDasharray: 90, strokeDashoffset: 90 },
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        8.2
      );

      // Register the paused timeline with exact composition ID
      window.__timelines["scene-s09"] = tl;
    </script>
