/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* Background & Pan Layer */
      #pan-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 1220px;
        height: 1920px;
        will-change: transform;
      }

      #bg-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Subtle tactile grid overlay */
      #grid-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.08) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.08) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        z-index: 4;
      }

      /* Peel transition card */
      #peel-wipe {
        position: absolute;
        inset: 0;
        background-color: #e7e3d9;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        z-index: 8;
        will-change: clip-path;
      }

      /* SVG Annotations Layer */
      .annotations-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 12;
      }

      #pin-1-target,
      #pin-2-target {
        opacity: 0;
      }

      /* Overlay Callout Containers */
      .card-inner {
        position: absolute;
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        z-index: 15;
        will-change: transform, opacity;
      }

      #tuan-card-inner {
        top: 360px;
        left: 80px;
        width: 440px;
      }

      #khang-card-inner {
        top: 500px;
        left: 560px;
        width: 440px;
      }

      /* High-contrast solid plate cards */
      .card-box {
        width: 100%;
        background-color: #141414;
        border: 3px solid #ff6a1a;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
        padding: 20px 24px;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .role-badge {
        align-self: flex-start;
        background-color: #ff6a1a;
        color: #141414;
        font-weight: 900;
        font-size: 19px;
        letter-spacing: 1.5px;
        padding: 5px 14px;
        border-radius: 3px;
        line-height: 1.2;
        margin-bottom: 2px;
      }

      .legal-name {
        color: #f7f4ec;
        font-weight: 900;
        font-size: 34px;
        line-height: 1.25;
        letter-spacing: 0.5px;
      }

      .alias-pill {
        align-self: flex-start;
        background-color: #ff6a1a;
        color: #141414;
        font-weight: 900;
        font-size: 24px;
        line-height: 1.2;
        padding: 6px 14px;
        border-radius: 3px;
        opacity: 0;
        will-change: transform, opacity;
      }

      #tuan-alias,
      #khang-alias {
        opacity: 0;
      }

      /* Signature Brand Bottom Bar */
      #bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 30;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s05"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="9.5"
    >
      <!-- Shot 1: Background photo with slow camera pan -->
      <section id="bg-shot" class="clip" data-start="0" data-duration="9.5">
        <div id="pan-container" data-layout-allow-overflow="true">
          <img
            id="bg-img"
            src="assets/img-12-alley-three-characters-introduction.jpg"
            alt="Ba nhân vật trong con ngõ nhỏ"
          />
        </div>
        <div id="grid-overlay"></div>
        <div id="peel-wipe"></div>
      </section>

      <!-- Overlay 1: Bùi Xuân T. (Tuấn) - Bị cáo -->
      <div id="overlay-tuan" class="clip" data-start="1.04" data-duration="8.46">
        <svg class="annotations-svg" viewBox="0 0 1080 1920">
          <path
            id="pin-1-path"
            d="M 300 520 L 300 700 L 260 880"
            fill="none"
            stroke="#FF6A1A"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <g id="pin-1-target">
            <circle cx="260" cy="880" r="18" fill="none" stroke="#FF6A1A" stroke-width="3" />
            <circle cx="260" cy="880" r="6" fill="#FF6A1A" />
            <line x1="260" y1="854" x2="260" y2="866" stroke="#FF6A1A" stroke-width="2.5" />
            <line x1="260" y1="894" x2="260" y2="906" stroke="#FF6A1A" stroke-width="2.5" />
            <line x1="234" y1="880" x2="246" y2="880" stroke="#FF6A1A" stroke-width="2.5" />
            <line x1="274" y1="880" x2="286" y2="880" stroke="#FF6A1A" stroke-width="2.5" />
          </g>
        </svg>

        <div class="card-inner" id="tuan-card-inner">
          <div class="card-box">
            <div class="role-badge">BỊ CÁO</div>
            <div class="legal-name">BÙI XUÂN T.</div>
            <div class="alias-pill" id="tuan-alias">(TUẤN)</div>
          </div>
        </div>
      </div>

      <!-- Overlay 2: Ngô Minh K. (Khang) - Bị hại -->
      <div id="overlay-khang" class="clip" data-start="7.32" data-duration="2.18">
        <svg class="annotations-svg" viewBox="0 0 1080 1920">
          <path
            id="pin-2-path"
            d="M 780 660 L 780 780 L 820 900"
            fill="none"
            stroke="#FF6A1A"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <g id="pin-2-target">
            <circle cx="820" cy="900" r="18" fill="none" stroke="#FF6A1A" stroke-width="3" />
            <circle cx="820" cy="900" r="6" fill="#FF6A1A" />
            <line x1="820" y1="874" x2="820" y2="886" stroke="#FF6A1A" stroke-width="2.5" />
            <line x1="820" y1="914" x2="820" y2="926" stroke="#FF6A1A" stroke-width="2.5" />
            <line x1="794" y1="900" x2="806" y2="900" stroke="#FF6A1A" stroke-width="2.5" />
            <line x1="834" y1="900" x2="846" y2="900" stroke="#FF6A1A" stroke-width="2.5" />
          </g>
        </svg>

        <div class="card-inner" id="khang-card-inner">
          <div class="card-box">
            <div class="role-badge">BỊ HẠI</div>
            <div class="legal-name">NGÔ MINH K.</div>
            <div class="alias-pill" id="khang-alias">(KHANG)</div>
          </div>
        </div>
      </div>

      <!-- Bottom Brand Signature Line -->
      <div id="bottom-bar"></div>
    </div>

    <script>
      const p1 = document.getElementById("pin-1-path");
      const pin1Len = p1.getTotalLength();
      p1.style.strokeDasharray = pin1Len;
      p1.style.strokeDashoffset = pin1Len;

      const p2 = document.getElementById("pin-2-path");
      const pin2Len = p2.getTotalLength();
      p2.style.strokeDasharray = pin2Len;
      p2.style.strokeDashoffset = pin2Len;

      const tl = gsap.timeline({ paused: true });

      // 0.0s - 0.7s: Paper peel transition entrance
      tl.fromTo(
        "#peel-wipe",
        { clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)" },
        {
          clipPath: "polygon(100% 0%, 100% 0%, 100% 100%, 100% 100%)",
          duration: 0.7,
          ease: "power2.inOut",
        },
        0,
      );

      // 0.0s - 9.5s: Cinematic camera pan-right across the three characters
      tl.fromTo(
        "#pan-container",
        { x: 30, scale: 1.04 },
        { x: -90, scale: 1.08, duration: 9.5, ease: "none" },
        0,
      );

      // 1.04s: Annotation 1 (Tuấn) starts
      tl.fromTo(
        "#pin-1-path",
        { strokeDashoffset: pin1Len },
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        1.04,
      );

      tl.fromTo(
        "#pin-1-target",
        { scale: 0, opacity: 0, transformOrigin: "260px 880px" },
        { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.5)" },
        1.15,
      );

      tl.fromTo(
        "#tuan-card-inner",
        { scale: 0.75, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.22,
      );

      // 3.8s: Narration emphasizes nickname "(TUẤN)" - alias reveals on verbal cue
      tl.fromTo(
        "#tuan-alias",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        3.8,
      );

      tl.fromTo(
        "#pin-1-target",
        { scale: 1, transformOrigin: "260px 880px" },
        { scale: 1.3, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" },
        3.8,
      );

      // 7.32s: Annotation 2 (Khang) starts
      tl.fromTo(
        "#pin-2-path",
        { strokeDashoffset: pin2Len },
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        7.32,
      );

      tl.fromTo(
        "#pin-2-target",
        { scale: 0, opacity: 0, transformOrigin: "820px 900px" },
        { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.5)" },
        7.42,
      );

      tl.fromTo(
        "#khang-card-inner",
        { scale: 0.75, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        7.5,
      );

      tl.fromTo(
        "#khang-alias",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        7.72,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s05"] = tl;
    </script>
  
    </template>
