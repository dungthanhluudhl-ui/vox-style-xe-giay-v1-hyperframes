    <script>
      // 1. Chuẩn bị SVG đường dẫn stroke
      const pathGoma = document.getElementById("path-goma");
      const pathXoang = document.getElementById("path-xoang");
      if (pathGoma) {
        const lenGoma = pathGoma.getTotalLength();
        pathGoma.style.strokeDasharray = lenGoma;
        pathGoma.style.strokeDashoffset = lenGoma;
      }
      if (pathXoang) {
        const lenXoang = pathXoang.getTotalLength();
        pathXoang.style.strokeDasharray = lenXoang;
        pathXoang.style.strokeDashoffset = lenXoang;
      }

      // 2. Khởi tạo GSAP Timeline (paused: true)
      const tl = gsap.timeline({ paused: true });

      // === SHOT 1 (0.0s -> 3.8s) ===
      // Shatter transition-in cho hero wrapper
      tl.fromTo(
        "#hero-wrapper",
        { scale: 0.85, opacity: 0, rotation: -3 },
        { scale: 1.0, opacity: 1, rotation: 0, duration: 0.7, ease: "power3.out" },
        0.05,
      );

      // Camera motion: zoom-in nhẹ từ 0.0s đến 3.8s
      tl.fromTo(
        "#hero-img",
        { scale: 1.0 },
        { scale: 1.08, duration: 3.8, ease: "sine.inOut" },
        0,
      );

      // Overlay Shot 1 "CẤP CỨU ĐIỀU TRỊ" (startMs: 1.08s, hold 2.4s)
      tl.fromTo(
        "#overlay-s1",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.08,
      );
      tl.to(
        "#overlay-s1",
        { y: -15, opacity: 0, duration: 0.3, ease: "power2.in" },
        3.18,
      );

      // === SHOT 2 (3.8s -> 14.31s) ===
      // Chuyển cảnh transitionIn: "punch" lúc 3.8s
      tl.fromTo(
        "#hero-card",
        { scale: 1.0 },
        { scale: 1.03, duration: 0.16, ease: "power2.out" },
        3.8,
      );
      tl.to(
        "#hero-card",
        { scale: 1.0, duration: 0.3, ease: "power2.inOut" },
        3.96,
      );

      // Khởi tạo ẩn các điểm chấn thương ban đầu
      gsap.set(["#dot-goma", "#dot-xoang"], { scale: 0, opacity: 0 });

      // --- Label 1: GÃY GÒ MÁ, SỐNG MŨI (startMs: 7.44s) ---
      // Điểm chấn thương gò má bừng sáng
      tl.fromTo(
        "#dot-goma",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" },
        7.44,
      );
      // Vẽ đường dẫn SVG
      if (pathGoma) {
        tl.to(
          pathGoma,
          { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
          7.5,
        );
      }
      // Tag thông tin gò má xuất hiện
      tl.fromTo(
        "#label-goma",
        { x: -30, opacity: 0, scale: 0.9 },
        { x: 0, opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
        7.55,
      );
      // Ẩn khi hết thời gian hold
      tl.to(
        ["#label-goma", "#dot-goma"],
        { opacity: 0, duration: 0.25, ease: "power2.in" },
        9.59,
      );
      if (pathGoma) {
        tl.to(
          pathGoma,
          { opacity: 0, duration: 0.25, ease: "power2.in" },
          9.59,
        );
      }

      // --- Label 2: VỠ XOANG HÀM (startMs: 9.95s) ---
      // Điểm chấn thương xoang hàm bừng sáng
      tl.fromTo(
        "#dot-xoang",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" },
        9.95,
      );
      // Vẽ đường dẫn SVG
      if (pathXoang) {
        tl.to(
          pathXoang,
          { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
          10.0,
        );
      }
      // Tag thông tin xoang hàm xuất hiện
      tl.fromTo(
        "#label-xoang",
        { x: 30, opacity: 0, scale: 0.9 },
        { x: 0, opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
        10.05,

      // Ẩn khi hết thời gian hold
      tl.to(

        { opacity: 0, duration: 0.25, ease: "power2.in" },
        11.9,

      if (pathXoang) {

          pathXoang,
          { opacity: 0, duration: 0.25, ease: "power2.in" },
          11.9,

      // --- Punch Phrase: TỔN THƯƠNG 30% (startMs: 13.35s đến hết scene) ---

        "#punch-box",
        { scale: 0.85, opacity: 0, y: 30 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.32, ease: "power4.out" },
        13.35,
      );

      // Bộ đếm nhảy từ 0% lên 30% đúng tinh thần visual relationship
      const counterState = { val: 0 };
      const counterEl = document.getElementById("percent-val");
      tl.to(
        counterState,
        {
          val: 30,
          duration: 0.45,
          ease: "power2.out",
          onUpdate: () => {
            if (counterEl) {
              counterEl.textContent = Math.round(counterState.val) + "%";
            }
          },
        },
        13.35,
      );

      // 3. Đăng ký timeline cho HyperFrames seek
      window.__timelines["scene-s14"] = tl;
    </script>
