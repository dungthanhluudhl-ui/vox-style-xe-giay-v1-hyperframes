    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ==================== SHOT 1 GSAP CHOREOGRAPHY ====================
      // Camera zoom-in toàn cảnh Shot 1 (tách riêng trên #shot-1-camera)
      tl.fromTo(
        "#shot-1-camera",
        { scale: 1.0 },
        { scale: 1.03, duration: 8.29, ease: "none" },
        0.0
      );

      // Punch entrance & exit fade trên #shot-1-content
      tl.fromTo(
        "#shot-1-content",
        { scale: 0.95, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.0
      );

      tl.to(
        "#shot-1-content",
        { opacity: 0, duration: 0.29, ease: "power2.in" },
        8.0
      );

      // Thanh cam dâng lên từ 0.4s đến 2.2s
      tl.fromTo(
        "#gauge-bar-fill",
        { scaleY: 0 },
        { scaleY: 1, duration: 1.8, ease: "power2.out" },
        0.4
      );

      // Đồng hồ đếm số 0% -> 30% đồng bộ với thanh cam
      const counterState = { val: 0 };
      tl.to(
        counterState,
        {
          val: 30,
          duration: 1.8,
          ease: "power2.out",
          onUpdate: function () {
            const el = document.getElementById("counter-val");
            if (el) {
              el.textContent = Math.round(counterState.val) + "%";
            }
          },
        },
        0.4
      );

      // 2.53s: Overlay 1 ("MỐC 30% THƯƠNG TÍCH") punch entrance
      tl.fromTo(
        "#badge-s1-1",
        { scale: 0.88, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        2.53
      );

      // 6.56s: Overlay 2 ("NGƯỠNG DƯỚI 31%") punch entrance
      tl.fromTo(
        "#badge-s1-2",
        { scale: 0.88, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        6.56
      );

      // 6.56s: Nhấn mạnh vạch 31% bằng scale pulse (không đổi opacity giữ độ tương phản 100%)
      tl.fromTo(
        "#threshold-badge-31",
        { scale: 1.18 },
        { scale: 1, duration: 0.4, ease: "back.out(1.5)", immediateRender: false },
        6.56
      );

      // ==================== SHOT 2 GSAP CHOREOGRAPHY ====================
      // Setup vẽ đường SVG
      const pathLeft = document.getElementById("branch-path-left");
      const pathRight = document.getElementById("branch-path-right");

      if (pathLeft && pathRight) {
        const lenLeft = pathLeft.getTotalLength();
        const lenRight = pathRight.getTotalLength();
