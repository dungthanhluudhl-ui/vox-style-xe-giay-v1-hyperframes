    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Hiệu ứng vào cảnh Peel Transition (bóc/mở giấy hé lộ khung so sánh)
      tl.fromTo(
        "#split-card",
        {
          clipPath: "polygon(0% 0%, 0% 0%, 0% 100%, 0% 100%)",
        },
        {
          clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)",
          duration: 0.85,
          ease: "power3.out",
        },
        0.05
      );

      // Thay thế hoàn toàn "left" bằng transform sub-pixel "x" để tránh lỗi layout snap
      tl.fromTo(
        "#peel-shadow",
        { x: 0, opacity: 0.8 },
        { x: 930, opacity: 0, duration: 0.85, ease: "power2.out" },
        0.05
      );

      // 2. Tiêu đề cảnh trượt vào dứt khoát
      tl.fromTo(
        "#header-block",
        { y: -50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.15
      );

      // 3. Vạch phân đôi & huy hiệu VS xuất hiện
      tl.fromTo(
        "#split-seam",
        { scaleY: 0, transformOrigin: "top center" },
        { scaleY: 1, duration: 0.5, ease: "power2.out" },
        0.5
      );

      tl.fromTo(
        "#split-vs",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.65
      );

      // 4. Nhãn phân loại hai nhánh xuất hiện
      tl.fromTo(
        ".split-tag-left",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.4
      );

      tl.fromTo(
        ".split-tag-right",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.52
      );

      // 5. Chuyển động máy quay Pan-Right nhẹ nhàng xuyên suốt cảnh
      tl.fromTo(
        "#hero-img",
        { x: 30, scale: 1.10 },
        { x: -50, scale: 1.15, duration: 7.71, ease: "none" },
        0
      );

      // 6. Overlay 1: "CHƯA ĐỦ CẤU THÀNH" (atMs: 309300 -> 2.77s)
      tl.fromTo(
        "#card-overlay-1",
        { y: 40, scale: 0.92, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.48, ease: "power3.out" },
        2.77
      );

      // Rút Overlay 1 trước khi clip kết thúc (dùng fromTo với endpoint rõ ràng)
      tl.fromTo(
        "#card-overlay-1",
        { y: 0, opacity: 1 },
        { y: -20, opacity: 0, duration: 0.35, ease: "power2.in" },
        4.95
      );

      // 7. Nhịp nhấn thị giác giữa cảnh (5.3s): nhấn mạnh nhánh xử phạt hành chính
      tl.fromTo(
        ".split-tag-left",
        { scale: 1 },
        { scale: 1.08, duration: 0.2, ease: "power2.out" },
        5.3
      );
      tl.fromTo(
        ".split-tag-left",
        { scale: 1.08 },
        { scale: 1, duration: 0.2, ease: "power2.in" },
        5.5
      );

      // 8. Cấu hình tự vẽ đường nét SVG cho icon văn bản (deterministic stroke draw)
      const setupSvgStroke = (selector, len, dur, at) => {
        const el = document.querySelector(selector);
        if (el) {
          el.style.strokeDasharray = len;
          el.style.strokeDashoffset = len;
          tl.fromTo(
            el,
            { strokeDashoffset: len },
            { strokeDashoffset: 0, duration: dur, ease: "power2.out" },
            at
          );
        }
      };

      setupSvgStroke("#doc-outline", 260, 0.35, 6.25);
      setupSvgStroke("#doc-fold", 45, 0.20, 6.45);
      setupSvgStroke("#doc-line-1", 40, 0.15, 6.55);
      setupSvgStroke("#doc-line-2", 40, 0.15, 6.65);
      setupSvgStroke("#doc-line-3", 25, 0.15, 6.75);
      setupSvgStroke("#doc-stamp", 60, 0.25, 6.85);

      // 9. Overlay 2: "PHẠT TIỀN HÀNH CHÍNH" (atMs: 312660 -> 6.13s)
      tl.fromTo(
        "#card-overlay-2",
        { y: 40, scale: 0.92, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        6.13
      );

      // Đăng ký timeline duy nhất cho composition
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s33"] = tl;
    </script>
