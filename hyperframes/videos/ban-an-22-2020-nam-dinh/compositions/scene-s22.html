    <!-- Composition Root với đầy đủ data attributes, không bọc template -->

    <!-- GSAP Animation Engine: Deterministic Seekable Timeline -->
    <script>
      // Đăng ký đúng 1 paused timeline vào window.__timelines["scene-s22"]
      const tl = gsap.timeline({ paused: true });

      /* =========================================================================
         CHOREOGRAPHY SHOT 1 (0.0s -> 6.71s): doc-04 Evidence Reveal
         ========================================================================= */
      // 1. Flip entrance cho thẻ tài liệu bản án
      tl.fromTo(
        "#doc-card",
        { rotationX: 75, opacity: 0, y: 50 },
        { rotationX: 0, opacity: 1, y: 0, duration: 0.65, ease: "power3.out" },
        0.15
      );

      // 2. Chuyển động camera zoom-in rất nhẹ 2.5% giữ nhịp thị giác liên tục
      tl.fromTo(
        "#doc-card-wrapper",
        { scale: 1 },
        { scale: 1.025, duration: 6.4, ease: "none" },
        0.15
      );

      // 3. Overlay 1.1: CỐ Ý GÂY THƯƠNG TÍCH (at 1.88s, hold 2.2s -> 4.08s)
      tl.fromTo(
        "#s1-overlay-1",
        { scale: 0.85, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        1.88
      );
      tl.to(
        "#s1-overlay-1",
        { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" },
        4.08
      );

      // 4. Overlay 1.2: ĐIỂM Đ KHOẢN 2 ĐIỀU 134 (at 3.68s, hold 2.4s -> 6.08s)
      tl.fromTo(
        "#s1-overlay-2",
        { scale: 0.85, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        3.68
      );
      tl.to(
        "#s1-overlay-2",
        { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" },
        6.08
      );

      // 5. Kết thúc Shot 1 mượt mà trước khi chuyển cảnh
      tl.to(
        "#shot-1-content",
        { opacity: 0, scale: 0.97, duration: 0.28, ease: "power2.in" },
        6.43
      );

      /* =========================================================================
         CHOREOGRAPHY SHOT 2 (6.71s -> 13.62s): img-16 Analysis & Punch
         ========================================================================= */
      // 1. Punch entrance cho card đồ hoạ phân tích Điều 134
      tl.fromTo(
        "#diagram-card-wrapper",
        { scale: 1.08, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power4.out" },
        6.71
      );

      // 2. Chuyển động zoom-in chậm của hình ảnh bên trong khung
      tl.fromTo(
        "#img-16-el",
        { scale: 1 },
        { scale: 1.05, duration: 6.9, ease: "none" },
        6.71
      );

      // 3. Overlay 2.1: 30% + HUNG KHÍ (at 7.97s, hold 2.4s -> 10.37s)
      tl.fromTo(
        "#s2-overlay-1",
        { scale: 0.85, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        7.97
      );
      tl.to(
        "#s2-overlay-1",
        { opacity: 0, y: -20, duration: 0.32, ease: "power2.in" },
        10.37
      );

      // 4. Overlay 2.2: CẤU THÀNH TĂNG NẶNG (at 12.76s -> giữ đến 13.62s)
      tl.fromTo(
        "#s2-overlay-2",
        { scale: 0.88, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        12.76
      );

      // Gắn timeline gốc vào window.__timelines
      window.__timelines["scene-s22"] = tl;
    </script>
