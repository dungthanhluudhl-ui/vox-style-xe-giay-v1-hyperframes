    <script>
      // Đăng ký đúng 1 GSAP timeline paused cho composition root
      const tl = gsap.timeline({ paused: true });

      // 1. Camera zoom-in vi mô xuyên suốt 9.89s (chuyển động nền sống động, không dead-air)
      tl.fromTo(
        ".camera-viewport",
        { scale: 1 },
        { scale: 1.04, duration: 9.89, ease: "none" },
        0
      );

      // 2. Chuyển động vào cảnh "rise" cho khung sân khấu tổng
      tl.fromTo(
        ".scene-stage",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0
      );

      // 3. Category Pill vào cảnh
      tl.fromTo(
        "#cat-pill",
        { y: -20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.2
      );

      // 4. Trục thời gian đứng lớn dần từ trên xuống
      tl.fromTo(
        "#timeline-spine",
        { scaleY: 0 },
        { scaleY: 1, duration: 8.5, ease: "none" },
        0.5
      );

      // 5. Mốc 1.53s: Nhãn "NGUYÊN NHÂN RẤT NHỎ" (atMs 338880 -> 1.53s)
      tl.fromTo(
        "#punch-title",
        { scale: 0.82, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        1.53
      );

      // Node 1 xuất hiện đồng bộ cùng luận điểm mở đầu
      tl.fromTo(
        "#marker-1",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        1.53
      );
      tl.fromTo(
        "#card-1",
        { x: -30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.65
      );

      // 6. Mắt xích 2: Lời qua tiếng lại (xuất hiện ở 2.9s)
      tl.fromTo(
        "#marker-2",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        2.9
      );
      tl.fromTo(
        "#card-2",
        { x: -30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        3.02
      );

      // 7. Mắt xích 3 chuẩn bị xuất hiện trước mốc xô vữa
      tl.fromTo(
        "#marker-3",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        5.2
      );
      tl.fromTo(
        "#card-3",
        { x: -30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        5.32
      );

      // Mốc 6.07s: Nhãn "MỘT XÔ VỮA ĐỔ" đập mạnh vào mắt người xem (atMs 343420 -> 6.07s)
      tl.fromTo(
        "#stamp-mortar",
        { scale: 1.8, opacity: 0, rotation: -6 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "power3.out" },
        6.07
      );

      // 8. Mắt xích 4: Cuộc đuổi đánh (xuất hiện ở 7.15s)
      tl.fromTo(
        "#marker-4",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        7.15
      );
      tl.fromTo(
        "#card-4",
        { x: -30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        7.27
      );

      // 9. Mốc 8.16s: Nhãn "HỖN CHIẾN BÙNG NỔ" + Icon Crowd (atMs 345510 -> 8.16s)
      tl.fromTo(
        "#marker-5",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        8.16
      );
      tl.fromTo(
        "#card-5",
        { scale: 0.9, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },

      tl.fromTo(

        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        8.45
      );

      // Gán timeline duy nhất vào window.__timelines
      window.__timelines["scene-s36"] = tl;
