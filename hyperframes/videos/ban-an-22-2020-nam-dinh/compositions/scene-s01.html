      /* Contrast-safe color utility classes */

    <script>
      const tl = gsap.timeline({ paused: true });

      // ==========================================
      // SHOT 1 (0.00s -> 2.76s)
      // ==========================================
      // Transition in: "rise" (trượt nhẹ và làm rõ toàn bộ background wrap)
      tl.fromTo(
        "#s1-bg-wrap",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        0
      );

      // Camera motion: zoom-in chậm từ 1.0 đến 1.04
      tl.fromTo(
        "#s1-img",
        { scale: 1.0 },
        { scale: 1.04, duration: 2.76, ease: "none" },
        0
      );

      // Overlay: "HỒ SƠ VỤ ÁN" (xuất hiện tại 640ms = 0.64s, giữ 1.8s đến 2.44s)
      tl.fromTo(
        "#s1-label",
        { scale: 0.82, opacity: 0, y: 16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        0.64
      );
      tl.to(
        "#s1-label",
        { opacity: 0, y: -10, duration: 0.22, ease: "power2.in" },
        2.44
      );

      // ==========================================
      // SHOT 2 (2.76s -> 6.60s)
      // ==========================================
      // Nền card phẳng xuất hiện mượt mà
      tl.fromTo(
        "#s2-bg",
        { opacity: 0 },
        { opacity: 1, duration: 0.25, ease: "none" },
        2.76
      );

      // Transition in: "punch" cho tài liệu bản án
      tl.fromTo(
        "#s2-doc-card-container",
        { scale: 0.92, opacity: 0, y: 22 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        2.76
      );

      // Camera motion: zoom-in rất nhẹ 3% cho thẻ tài liệu (1.00 -> 1.03)
      tl.fromTo(
        "#s2-doc-card",
        { scale: 1.0 },
        { scale: 1.03, duration: 3.84, ease: "none" },
        2.76
      );

      // Overlay 1: "BẢN ÁN SƠ THẨM" (xuất hiện tại 2800ms = 2.80s, giữ 1.8s đến 4.60s)
      tl.fromTo(
        "#s2-label1",
        { scale: 0.84, opacity: 0, y: 14 },
        { scale: 1, opacity: 1, y: 0, duration: 0.36, ease: "power3.out" },
        2.80
      );
      tl.to(
        "#s2-label1",
        { opacity: 0, y: -10, duration: 0.22, ease: "power2.in" },
        4.60
      );

      // Overlay 2: "TAND XUÂN TRƯỜNG" (xuất hiện tại 4420ms = 4.42s, giữ 1.8s đến 6.22s)
      tl.fromTo(
        "#s2-label2",
        { scale: 0.84, opacity: 0, y: 14 },
        { scale: 1, opacity: 1, y: 0, duration: 0.36, ease: "power3.out" },
        4.42
      );
      tl.to(
        "#s2-label2",
        { opacity: 0, y: -10, duration: 0.22, ease: "power2.in" },
        6.22
      );

      // Đăng ký timeline cho HyperFrames runtime
      window.__timelines["scene-s01"] = tl;
    </script>
