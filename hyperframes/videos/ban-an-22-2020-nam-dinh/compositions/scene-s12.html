<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        perspective: 1200px;
      }
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Full-bleed Grid Background layer */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        z-index: 1;
      }

      /* Safe Zone Header Container */
      .header-container {
        position: absolute;
        top: 170px;
        left: 80px;
        z-index: 30;
      }
      .tag-plate {
        display: inline-flex;
        align-items: center;
        background-color: #141414;
        color: #F7F4EC;
        padding: 10px 24px;
        border-radius: 4px;
        box-shadow: 4px 4px 0px rgba(20, 20, 20, 0.25);
      }
      .tag-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background-color: #FF6A1A;
        margin-right: 14px;
      }
      .tag-text {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      /* Hero Photo Framing (Collage Card) */
      .hero-card-wrapper {
        position: absolute;
        top: 250px;
        left: 80px;
        width: 920px;
        height: 1100px;
        z-index: 10;
        transform-origin: 0% 50%;
      }
      .hero-card {
        width: 100%;
        height: 100%;
        background-color: #F5F0E4;
        border: 3.5px solid #141414;
        box-shadow: 12px 14px 0px rgba(20, 20, 20, 0.9);
        padding: 14px;
        display: flex;
        flex-direction: column;
      }
      .hero-photo-viewport {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border: 2px solid #141414;
        background-color: #141414;
      }
      .hero-photo {
        position: absolute;
        top: -5%;
        left: -10%;
        width: 120%;
        height: 110%;
        object-fit: cover;
        object-position: center 30%;
        display: block;
      }

      /* Overlay 1: Nhìn qua hàng rào */
      .overlay-1-container {
        position: absolute;
        top: 360px;
        right: 110px;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }
      .badge-category {
        background-color: #FF6A1A;
        color: #141414;
        font-size: 20px;
        font-weight: 900;
        padding: 6px 14px;
        border: 2px solid #141414;
        border-bottom: none;
        letter-spacing: 1.5px;
        display: inline-block;
      }
      .badge-main {
        background-color: #141414;
        color: #F7F4EC;
        font-size: 38px;
        font-weight: 900;
        padding: 16px 28px;
        border: 2px solid #141414;
        border-left: 8px solid #FF6A1A;
        box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.35);
        letter-spacing: 1px;
      }
      .sight-reticle {
        position: absolute;
        top: 480px;
        left: 240px;
        width: 90px;
        height: 90px;
        z-index: 35;
      }

      /* Overlay 2: Nhặt viên gạch */
      .overlay-2-container {
        position: absolute;
        top: 1120px;
        left: 120px;
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brick-callout {
        background-color: #FF6A1A;
        color: #141414;
        font-size: 42px;
        font-weight: 900;
        padding: 18px 32px;
        border: 3.5px solid #141414;
        box-shadow: 8px 8px 0px #141414;
        letter-spacing: 1.5px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brick-icon {
        width: 32px;
        height: 32px;
      }

      /* Persistent Brand Signature Bar */
      .bottom-signature-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s12"
      data-width="1080"
      data-height="1920"
      data-duration="8.55"
    >
      <!-- Base Shot Clip: Duration 8.55s -->
      <section id="scene-base" class="clip" data-start="0" data-duration="8.55">
        <div class="bg-grid"></div>

        <!-- Scene Location / Category Tracker -->
        <div id="scene-tag" class="header-container">
          <div class="tag-plate">
            <span class="tag-dot"></span>
            <span class="tag-text">ĐƯỜNG LIÊN XÓM // DIỄN BIẾN</span>
          </div>
        </div>

        <!-- Hero Paper-Collage Photo Card -->
        <div id="hero-card" class="hero-card-wrapper">
          <div class="hero-card">
            <div class="hero-photo-viewport">
              <img
                id="hero-img"
                class="hero-photo"
                src="assets/img-08-man-picking-up-brick.jpg"
                alt="Tuấn nhặt viên gạch bên hàng rào"
              />
            </div>
          </div>
        </div>
      </section>

      <!-- Overlay 1 Clip: NHÌN QUA HÀNG RÀO (2.39s - 4.59s, dur: 2.20s) -->
      <div id="overlay-1-clip" class="clip" data-start="2.39" data-duration="2.20">
        <!-- Visual Annotation Reticle -->
        <svg id="overlay-1-reticle" class="sight-reticle" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="38" fill="none" stroke="#FF6A1A" stroke-width="4" stroke-dasharray="6 4" />
          <circle cx="50" cy="50" r="6" fill="#141414" stroke="#FF6A1A" stroke-width="2" />
          <line x1="50" y1="6" x2="50" y2="28" stroke="#FF6A1A" stroke-width="3" stroke-linecap="round" />
          <line x1="50" y1="72" x2="50" y2="94" stroke="#FF6A1A" stroke-width="3" stroke-linecap="round" />
          <line x1="6" y1="50" x2="28" y2="50" stroke="#FF6A1A" stroke-width="3" stroke-linecap="round" />
          <line x1="72" y1="50" x2="94" y2="50" stroke="#FF6A1A" stroke-width="3" stroke-linecap="round" />
        </svg>

        <div id="overlay-1-box" class="overlay-1-container">
          <span class="badge-category">GÓC QUAN SÁT</span>
          <div class="badge-main">NHÌN QUA HÀNG RÀO</div>
        </div>
      </div>

      <!-- Overlay 2 Clip: NHẶT VIÊN GẠCH (7.44s - 8.55s, dur: 1.11s) -->
      <div id="overlay-2-clip" class="clip" data-start="7.44" data-duration="1.11">
        <div id="overlay-2-box" class="overlay-2-container">
          <div class="brick-callout">
            <svg class="brick-icon" viewBox="0 0 24 24" fill="none">
              <path d="M12 4V20M12 20L6 14M12 20L18 14" stroke="#141414" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>NHẶT VIÊN GẠCH</span>
          </div>
        </div>
      </div>

      <!-- Brand Signature Bottom Accent Bar -->
      <div class="bottom-signature-bar" data-layout-allow-caption-zone="true"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Scene Entrance: Peel / Unfold paper card entrance
      tl.fromTo(
        "#hero-card",
        { opacity: 0, scale: 0.94, rotationY: -14, rotationX: 4 },
        { opacity: 1, scale: 1, rotationY: 0, rotationX: 0, duration: 0.75, ease: "power3.out" },
        0.1
      );

      // Header Tag entrance
      tl.fromTo(
        "#scene-tag",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.25
      );

      // 2. Camera Motion: Slow pan-left across scene duration
      tl.fromTo(
        "#hero-img",
        { x: 30, scale: 1.05 },
        { x: -45, scale: 1.10, duration: 8.55, ease: "none" },
        0
      );

      // 3. Overlay 1: "NHÌN QUA HÀNG RÀO" (rel: 2.39s, exit before 4.59s)
      tl.fromTo(
        "#overlay-1-box",
        { scale: 0.85, opacity: 0, y: 15 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        2.39
      );
      tl.fromTo(
        "#overlay-1-reticle",
        { opacity: 0, scale: 0.6, rotation: -25 },
        { opacity: 1, scale: 1, rotation: 0, duration: 0.4, ease: "power2.out" },
        2.42
      );
      tl.to(
        "#overlay-1-box",
        { opacity: 0, y: -12, duration: 0.2, ease: "power2.in" },
        4.35
      );
      tl.to(
        "#overlay-1-reticle",
        { opacity: 0, y: -12, duration: 0.2, ease: "power2.in" },
        4.35
      );

      // 4. Overlay 2: "NHẶT VIÊN GẠCH" (rel: 7.44s to scene end)
      tl.fromTo(
        "#overlay-2-box",
        { scale: 0.82, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        7.44
      );

      window.__timelines["scene-s12"] = tl;
    </script>
  
    </template>
  </body>
</html>
