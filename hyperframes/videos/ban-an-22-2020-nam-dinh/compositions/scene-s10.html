    // Master paused timeline for HyperFrames deterministic engine
    const tl = gsap.timeline({ paused: true });

    // ============================================================
    // SHOT 1 CHOREOGRAPHY (Global time: 0.0s -> 6.02s)
    // ============================================================

    // Subtle camera zoom-in across Shot 1
    tl.fromTo(
      "#s1-camera",
      { scale: 1.0 },
      { scale: 1.05, duration: 6.02, ease: "none" },
      0
    );

    // Initial appearance of Shot 1 header and parties
    tl.fromTo(
      "#s1-header",
      { y: -30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.15
    );

    tl.fromTo(
      "#s1-party-left",
      { x: -80, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
      0.3
    );

    tl.fromTo(
      "#s1-party-right",
      { x: 80, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
      0.4
    );

    // Central "CAN NGĂN" Hub springs into view
    tl.fromTo(
      "#s1-intervene-hub",
      { scale: 0.7, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
      0.55
    );

    // SVG Guide lines drawing towards center
    const guideL = document.getElementById("s1-guide-left");
    const guideR = document.getElementById("s1-guide-right");
    if (guideL && guideR) {
      const lenL = guideL.getTotalLength();
      const lenR = guideR.getTotalLength();
      guideL.style.strokeDasharray = lenL;
      guideL.style.strokeDashoffset = lenL;
      guideR.style.strokeDasharray = lenR;
      guideR.style.strokeDashoffset = lenR;

      tl.to(guideL, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 0.6);
      tl.to(guideR, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 0.7);
    }

    // BREAKDOWN BEAT: Can ngăn begins to fail & fracture (t = 2.4s)
    tl.to("#s1-fracture-lines", { opacity: 1, duration: 0.2 }, 2.3);
    tl.fromTo(
      "#s1-intervene-hub",
      { rotation: 0 },
      { rotation: -2, y: 8, duration: 0.2, yoyo: true, repeat: 3, ease: "power1.inOut" },
      2.3
    );
    tl.to("#s1-intervene-hub", { opacity: 0.35, scale: 0.95, duration: 0.4 }, 2.8);

    // AGGRESSIVE CONFLICT: Clash Arrows punch inward (t = 2.7s)
    tl.to("#s1-collision-arrows", { opacity: 1, duration: 0.2 }, 2.7);
    tl.fromTo(
      "#s1-collision-arrows",
      { scale: 0.4, transformOrigin: "480px 580px" },
      { scale: 1, duration: 0.5, ease: "power4.out" },
      2.7
    );
