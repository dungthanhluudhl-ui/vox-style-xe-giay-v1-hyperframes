  <div
    id="root"
    data-composition-id="scene-s28"
    data-width="1080"
    data-height="1920"
    data-duration="11.49"
  >
    <!-- Lớp lưới nền giấy đặc trưng Vox -->
    <div class="grid-canvas"></div>

    <!-- Cảnh 1: Hiển thị ảnh chàng trai với hiệu ứng unfold & pan-left (0s -> 11.49s) -->
    <section id="scene-bg" class="clip" data-start="0" data-duration="11.49">
      <div class="stage-container">
        <div id="photo-frame-target" class="photo-frame">
          <div class="washi-tape-top-left"></div>
          <div class="washi-tape-bottom-right"></div>
          <div class="editorial-stamp">ÁN TREO</div>

          <div class="photo-pan-viewport">
            <img
              id="photo-pan-target"
              class="photo-asset"
              src="assets/img-10-probation-period-suspended-sentence.jpg"
              alt="Người chấp hành án treo ngoài cộng đồng"
            >
          </div>
        </div>
      </div>
    </section>

    <!-- Overlay 1: Label CHƯA CẦN VÀO TRẠI (3.52s -> 5.92s, duration 2.4s) -->
    <section id="scene-label" class="clip" data-start="3.52" data-duration="2.4">
      <div class="overlay-wrapper">
        <div id="label-target" class="label-container">
          <div class="label-badge">TÒA NHẬN ĐỊNH</div>
          <div class="label-card">
            <div class="label-headline">CHƯA CẦN VÀO TRẠI</div>
            <div class="label-subline">HƯỞNG ÁN TREO TẠI ĐỊA PHƯƠNG</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Overlay 2: Punch-phrase 60 THÁNG THỬ THÁCH (10.68s -> 11.49s, duration 0.81s) -->
    <section id="scene-punch" class="clip" data-start="10.68" data-duration="0.81">
      <div class="overlay-wrapper">
        <div id="punch-target" class="punch-container">
          <div class="punch-card">
            <div class="punch-header">
              <!-- SVG icon clock tự vẽ nét phong cách đồ họa Vox -->
              <svg class="clock-icon-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle id="clock-rim" cx="32" cy="32" r="26" stroke="#FF6A1A" stroke-width="5" stroke-linecap="round" />
                <path id="clock-hands" d="M32 18 V32 L42 38" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <div class="punch-tagline">THỜI GIAN THỬ THÁCH</div>
            </div>

            <div class="punch-banner-orange">
              <div class="punch-banner-text">60 THÁNG</div>

          </div>
        </div>

    <!-- Thanh cam cố định mép đáy nhận diện thương hiệu -->
    <div id="brand-bar-bottom"></div>

  <script>
    // Chuẩn bị các stroke của icon SVG để sẵn sàng draw animation
    const clockRim = document.getElementById("clock-rim");
    const clockHands = document.getElementById("clock-hands");
    if (clockRim && clockHands) {
      const rimLen = clockRim.getTotalLength();
      clockRim.style.strokeDasharray = rimLen;
      clockRim.style.strokeDashoffset = rimLen;

      const handsLen = clockHands.getTotalLength();
      clockHands.style.strokeDasharray = handsLen;
      clockHands.style.strokeDashoffset = handsLen;
    }

    // Khởi tạo GSAP Timeline chính và duy nhất (seekable & paused)
    const tl = gsap.timeline({ paused: true });

    // 1. Phối cảnh Unfold cho khung ảnh ở t = 0s
    tl.fromTo(
      "#photo-frame-target",
      {
        scale: 0.86,
        rotationX: 18,
        opacity: 0,
        transformOrigin: "50% 50%"
      },
      {
        scale: 1,
        rotationX: 0,
        opacity: 1,
        duration: 1.1,
        ease: "power3.out"
      },
      0
    );

    // 2. Camera Motion: Pan chậm sang trái toàn cảnh từ t = 0s đến 11.49s
    tl.fromTo(
      "#photo-pan-target",
      {
        x: 60,
        scale: 1.08
      },
      {
        x: -80,
        scale: 1.15,
        duration: 11.49,
        ease: "none"
      },
      0
    );

    // 3. Overlay 1: Entrance cho Label "CHƯA CẦN VÀO TRẠI" tại 3.52s
    tl.fromTo(
      "#label-target",
      {
        y: 60,
        opacity: 0,
        scale: 0.94
      },
      {
        y: 0,
        opacity: 1,
        scale: 1,
        duration: 0.55,
        ease: "power3.out"
      },
      3.52
    );

    // Exit mượt mà cho Label trước khi hết thời hạn hold (5.52s -> 5.87s)
    tl.to(
      "#label-target",
      {
        y: -30,
        opacity: 0,
        duration: 0.35,
        ease: "power2.in"
      },
      5.52
    );

    // 4. Overlay 2: Entrance cho Punch-phrase "60 THÁNG THỬ THÁCH" tại 10.68s
    tl.fromTo(
      "#punch-target",
      {
        scale: 0.88,
        y: 45,
        opacity: 0
      },
      {
        scale: 1,
        y: 0,
        opacity: 1,
        duration: 0.45,
        ease: "power3.out"
      },
      10.68
    );

    // Vẽ kim và viền đồng hồ bằng hiệu ứng stroke draw
    if (clockRim && clockHands) {
      tl.to(
        "#clock-rim",
        {
          strokeDashoffset: 0,
          duration: 0.45,
          ease: "power2.out"
        },
        10.72
      );
      tl.to(
        "#clock-hands",
        {
          strokeDashoffset: 0,
          duration: 0.4,
          ease: "power2.out"
        },
        10.82
      );
    }

    // Đăng ký timeline chính lên window theo hợp đồng HyperFrames
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s28"] = tl;
  </script>
