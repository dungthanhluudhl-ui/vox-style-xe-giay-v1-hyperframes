<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #E7E3D9;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      .content-wrapper {
        position: absolute;
        top: 175px;
        left: 50px;
        width: 980px;
        display: flex;
        flex-direction: column;
        perspective: 1200px;
      }

      #header-block {
        display: flex;
        flex-direction: column;
        transform-origin: top center;
        will-change: transform, opacity;
      }

      .header-pill {
        align-self: flex-start;
        background: #FF6A1A;
        color: #141414;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1px;
        padding: 6px 18px;
        border-radius: 4px;
      }

      .header-title {
        margin: 14px 0 0;
        color: #141414;
        font-size: 58px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.5px;
        white-space: nowrap;
      }

      .header-ticker-bar {
        display: flex;
        align-items: center;
        gap: 16px;
        width: fit-content;
        margin-top: 14px;
        padding: 10px 20px;
        border-radius: 8px;
        background: #141414;
      }

      .ticker-label {
        color: #F7F4EC;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .ticker-val {
        color: #FF6A1A;
        font-family: monospace;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 1px;
      }

      .cards-stack {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 24px;
      }

      .data-card {
        display: flex;
        align-items: center;
        height: 280px;
        padding: 22px 24px;
        border-radius: 16px;
        transform-origin: top center;
        will-change: transform, opacity;
      }

      .card-hospital,
      .card-admin {
        background: #F5F0E4;
        border: 3px solid #141414;
        box-shadow: 6px 6px 0 #141414;
      }

      .card-criminal {
        background: #141414;
        border: 3px solid #FF6A1A;
        box-shadow: 6px 6px 0 #FF6A1A;
      }

      .card-stat-box {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
        width: 190px;
        height: 236px;
        border-radius: 12px;
        transform-origin: center center;
        will-change: transform, opacity;
      }

      .stat-box-ink {
        background: #141414;
      }

      .stat-box-orange {
        background: #FF6A1A;
      }

      .stat-large {
        font-size: 64px;
        font-weight: 900;
        line-height: 1;
      }

      .stat-medium {
        font-size: 42px;
        font-weight: 900;
        line-height: 1;
      }

      .stat-caption {
        margin-top: 6px;
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 1px;
      }

      .on-ink-orange {
        color: #FF6A1A;
      }

      .on-ink-light {
        color: #F7F4EC;
      }

      .on-orange-ink {
        color: #141414;
      }

      .card-info {
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin-left: 24px;
      }

      .card-tag {
        align-self: flex-start;
        padding: 4px 12px;
        border-radius: 4px;
        background: #FF6A1A;
        color: #141414;
        font-size: 15px;
        font-weight: 900;
        letter-spacing: 0.5px;
      }

      .card-title {
        margin: 10px 0 6px;
        font-size: 34px;
        font-weight: 900;
        line-height: 1.2;
      }

      .card-desc {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 700;
      }

      .card-note {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      .ink-text {
        color: #141414;
      }

      .light-text {
        color: #F7F4EC;
      }

      .paper-text {
        color: #E7E3D9;
      }

      .orange-on-ink {
        color: #FF6A1A;
      }

      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 16px;
        background: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s37"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7"
    >
      <!-- Chart background: ruled lines and ticks only. No background text
           intersects the cards or the reserved caption band. -->
      <svg
        id="bg-chart-svg"
        aria-hidden="true"
        style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;"
        viewBox="0 0 1080 1920"
      >
        <line x1="180" y1="0" x2="180" y2="1920" stroke="rgba(20,20,20,0.06)" stroke-width="1.5" />
        <line x1="360" y1="0" x2="360" y2="1920" stroke="rgba(20,20,20,0.06)" stroke-width="1.5" />
        <line x1="540" y1="0" x2="540" y2="1920" stroke="rgba(20,20,20,0.06)" stroke-width="1.5" />
        <line x1="720" y1="0" x2="720" y2="1920" stroke="rgba(20,20,20,0.06)" stroke-width="1.5" />
        <line x1="900" y1="0" x2="900" y2="1920" stroke="rgba(20,20,20,0.06)" stroke-width="1.5" />

        <line x1="0" y1="384" x2="1080" y2="384" stroke="rgba(20,20,20,0.28)" stroke-width="2" />
        <rect x="0" y="378" width="24" height="12" fill="#FF6A1A" />
        <line x1="0" y1="768" x2="1080" y2="768" stroke="rgba(20,20,20,0.28)" stroke-width="2" />
        <rect x="0" y="762" width="24" height="12" fill="#FF6A1A" />
        <line x1="0" y1="1152" x2="1080" y2="1152" stroke="rgba(20,20,20,0.28)" stroke-width="2" />
        <rect x="0" y="1146" width="24" height="12" fill="#FF6A1A" />
        <line x1="0" y1="1536" x2="1080" y2="1536" stroke="rgba(20,20,20,0.28)" stroke-width="2" />
        <rect x="0" y="1530" width="24" height="12" fill="#FF6A1A" />
      </svg>

      <div id="scene-s37" class="clip" data-start="0" data-duration="7">
        <div class="content-wrapper">
          <div id="header-block">
            <div class="header-pill">HẬU QUẢ PHÁP LÝ</div>
            <h1 class="header-title">SAU 15 PHÚT BỘC ĐỒNG</h1>
            <div class="header-ticker-bar">
              <svg width="28" height="28" viewBox="0 0 48 48" fill="none" aria-hidden="true">
                <circle cx="24" cy="24" r="20" stroke="#FF6A1A" stroke-width="4" />
                <circle cx="24" cy="24" r="3" fill="#FF6A1A" />
                <line
                  id="clock-minute-hand"
                  x1="24"
                  y1="24"
                  x2="24"
                  y2="8"
                  stroke="#FF6A1A"
                  stroke-width="4"
                  stroke-linecap="round"
                />
                <line x1="24" y1="24" x2="32" y2="24" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round" />
              </svg>
              <span class="ticker-label">THỜI GIAN BÙNG PHÁT:</span>
              <span id="ticker-time" class="ticker-val">00:00</span>
            </div>
          </div>

          <div class="cards-stack">
            <div id="card-1" class="data-card card-hospital">
              <div id="card-1-stat" class="card-stat-box stat-box-ink">
                <span class="stat-large on-ink-orange">30%</span>
                <span class="stat-caption on-ink-light">THƯƠNG TÍCH</span>
                <svg width="80" height="24" viewBox="0 0 80 24" style="margin-top: 14px;" aria-hidden="true">
                  <path
                    id="pulse-path"
                    d="M 4 12 L 20 12 L 28 4 L 38 20 L 46 8 L 54 14 L 76 12"
                    fill="none"
                    stroke="#FF6A1A"
                    stroke-width="3"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
              <div class="card-info">
                <div class="card-tag">BỆNH VIỆN</div>
                <div class="card-title ink-text">1 NGƯỜI NHẬP VIỆN 30%</div>
                <p class="card-desc ink-text">Một người phải vào viện</p>
              </div>
            </div>

            <div id="card-2" class="data-card card-criminal">
              <div id="card-2-stat" class="card-stat-box stat-box-orange">
                <span class="stat-large on-orange-ink">30</span>
                <span class="stat-caption on-orange-ink">THÁNG TÙ</span>
                <svg width="60" height="24" viewBox="0 0 40 20" style="margin-top: 10px;" aria-hidden="true">
                  <path
                    d="M 6 16 L 34 16 M 20 4 L 20 16 M 10 7 L 30 7"
                    fill="none"
                    stroke="#141414"
                    stroke-width="2.5"
                    stroke-linecap="round"
                  />
                </svg>
              </div>
              <div class="card-info">
                <div class="card-tag">TRÁCH NHIỆM HÌNH SỰ</div>
                <div class="card-title light-text">1 ÁN HÌNH SỰ</div>
                <p class="card-desc paper-text">Bản án: 30 tháng tù</p>
              </div>
            </div>

            <div id="card-3" class="data-card card-admin">
              <div id="card-3-stat" class="card-stat-box stat-box-ink">
                <span class="stat-medium on-ink-light">NHIỀU</span>
                <span class="stat-caption on-ink-orange">NGƯỜI KHÁC</span>
                <svg width="40" height="24" viewBox="0 0 32 24" style="margin-top: 14px;" aria-hidden="true">
                  <path
                    d="M 6 4 L 20 4 L 26 10 L 26 22 L 6 22 Z"
                    fill="none"
                    stroke="#FF6A1A"
                    stroke-width="2.5"
                    stroke-linejoin="round"
                  />
                  <line x1="11" y1="12" x2="21" y2="12" stroke="#FF6A1A" stroke-width="2" stroke-linecap="round" />
                  <line x1="11" y1="16" x2="18" y2="16" stroke="#FF6A1A" stroke-width="2" stroke-linecap="round" />
                </svg>
              </div>
              <div class="card-info">
                <div class="card-tag">BIÊN BẢN XỬ PHẠT</div>
                <div class="card-title ink-text">PHẠT HÀNH CHÍNH</div>
                <p class="card-desc ink-text">Nhiều người khác bị xử phạt</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="brand-bottom-bar" aria-hidden="true"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      const pulsePath = document.getElementById("pulse-path");
      const pulseLen = pulsePath.getTotalLength();
      pulsePath.style.strokeDasharray = String(pulseLen);
      pulsePath.style.strokeDashoffset = String(pulseLen);

      tl.fromTo(
        "#header-block",
        { opacity: 0, rotationX: -70, y: -40, transformOrigin: "top center" },
        { opacity: 1, rotationX: 0, y: 0, duration: 0.65, ease: "power3.out" },
        0.44
      );

      tl.fromTo(
        "#clock-minute-hand",
        { rotation: 0, transformOrigin: "24px 24px" },
        { rotation: 360, duration: 1, ease: "power2.inOut" },
        0.6
      );

      const timeObj = { val: 0 };
      const tickerTime = document.getElementById("ticker-time");
      tl.fromTo(
        timeObj,
        { val: 0 },
        {
          val: 15,
          duration: 1,
          ease: "power2.inOut",
          onUpdate: function () {
            const minutes = Math.round(timeObj.val);
            tickerTime.textContent = String(minutes).padStart(2, "0") + ":00";
          }
        },
        0.6
      );

      tl.fromTo(
        "#card-1",
        { opacity: 0, rotationX: -65, y: -40, transformOrigin: "top center" },
        { opacity: 1, rotationX: 0, y: 0, duration: 0.6, ease: "power3.out" },
        2.4
      );
      tl.fromTo(
        "#card-1-stat",
        { scale: 0.75, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        2.55
      );
      tl.fromTo(
        pulsePath,
        { strokeDashoffset: pulseLen },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        2.65
      );

      tl.fromTo(
        "#card-2",
        { opacity: 0, rotationX: -65, y: -40, transformOrigin: "top center" },
        { opacity: 1, rotationX: 0, y: 0, duration: 0.6, ease: "power3.out" },
        3.9
      );
      tl.fromTo(
        "#card-2-stat",
        { scale: 0.75, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        4.05
      );

      tl.fromTo(
        "#card-3",
        { opacity: 0, rotationX: -65, y: -40, transformOrigin: "top center" },
        { opacity: 1, rotationX: 0, y: 0, duration: 0.6, ease: "power3.out" },
        5.1
      );
      tl.fromTo(
        "#card-3-stat",
        { scale: 0.75, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        5.25
      );

      window.__timelines["scene-s37"] = tl;
    </script>
  
    </template>
  </body>
</html>
