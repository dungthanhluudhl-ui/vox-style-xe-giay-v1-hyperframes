<!doctype html>

  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }

    /* Standard HyperFrames Clip Contract */
    .clip {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Fixed Brand Signature Bottom Bar */
    #bottom-accent-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 16px;
      background-color: #FF6A1A;
      z-index: 50;
    }

    /* Safe-zone Bounded Hero Container (Y: 210 to 1370 -> Height: 1160px) */
    #hero-frame {
      position: absolute;
      left: 60px;
      top: 210px;
      width: 960px;
      height: 1160px;
      background-color: #141414;
      border: 4px solid #141414;
      box-shadow: 14px 14px 0px rgba(20, 20, 20, 0.85);
      overflow: hidden;
      transform-origin: 50% 50%;
    }

    /* Shatter Split Halves */
    .split-half {
      position: absolute;
      top: 0;
      width: 480px;
      height: 1160px;
      overflow: hidden;
    }

    #card-left {
      left: 0;
      transform-origin: 100% 50%;
    }

    #card-right {
      left: 480px;
      transform-origin: 0% 50%;
    }

    .split-img {
      position: absolute;
      top: 0;
      width: 960px;
      height: 1160px;
      object-fit: cover;
      display: block;
    }

    #img-left {
      left: 0;
    }

    #img-right {
      left: -480px;
    }

    /* Central Impact Seam */
    #shatter-seam {
      position: absolute;
      left: 478px;
      top: 0;
      width: 4px;
      height: 100%;
      background-color: #FF6A1A;
      transform-origin: 50% 50%;
      z-index: 10;
      opacity: 0;
    }

    /* General SVG Icon Styles */
    .vox-icon {
      flex-shrink: 0;
      stroke: #FF6A1A;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Overlay 1: CHƯA ĐẦY 1 GIÂY */
    #ov1-card {
      position: absolute;
      left: 80px;
      top: 250px;
      display: flex;
      align-items: center;
      gap: 20px;
      background-color: #141414;
      border: 3px solid #FF6A1A;
      box-shadow: 10px 10px 0px #FF6A1A;
      padding: 18px 30px;
      z-index: 30;
      transform-origin: 50% 50%;
    }

    .ov1-text {
      color: #F7F4EC;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.2;
      white-space: nowrap;
    }

    /* Overlay 2: Punch Phrase 60 THÁNG THỬ THÁCH */
    #ov2-card {
      position: absolute;
      left: 80px;
      right: 80px;
      top: 960px;
      display: flex;
      align-items: center;
      gap: 24px;
      background-color: #141414;
      border-left: 14px solid #FF6A1A;
      box-shadow: 14px 14px 0px #FF6A1A;
      padding: 26px 36px;
      z-index: 30;
      transform-origin: 50% 50%;
    }

    .ov2-text {
      color: #F7F4EC;
      font-size: 64px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Overlay 3: Takeaway BÀI HỌC KIỀM CHẾ */
    #ov3-card {
      position: absolute;
      left: 100px;
      right: 100px;
      top: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background-color: #141414;
      border: 4px solid #FF6A1A;
      box-shadow: 12px 12px 0px #FF6A1A;
      padding: 22px 32px;
      z-index: 35;
      transform-origin: 50% 50%;
    }

    .ov3-text {
      color: #F7F4EC;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      line-height: 1.2;
      white-space: nowrap;
    }
  </style>

  <div id="root" data-composition-id="scene-s40" data-width="1080" data-height="1920" data-duration="8.62">
    
    <!-- Permanent Brand Element -->
    <div id="bottom-accent-bar"></div>

    <!-- Main Visual Shot: Split Image with Shatter Entrance & Slow Zoom -->
    <div id="shot-main" class="clip" data-start="0" data-duration="8.62">
      <div id="hero-frame">
        <div id="card-left" class="split-half">
          <img id="img-left" class="split-img" src="assets/img-14-impulsive-act-consequence-split.jpg" alt="1 giây ném gạch">
        </div>
        <div id="card-right" class="split-half">
          <img id="img-right" class="split-img" src="assets/img-14-impulsive-act-consequence-split.jpg" alt="60 tháng thử thách">
        </div>
        <div id="shatter-seam"></div>
      </div>
    </div>

    <!-- Overlay 1: CHƯA ĐẦY 1 GIÂY (atMs: 373810, rel: 1.57s, hold: 2.20s) -->
    <div id="overlay-1" class="clip" data-start="1.57" data-duration="2.20">
      <div id="ov1-card">
        <svg class="vox-icon" viewBox="0 0 48 48" width="52" height="52" stroke-width="4.5">
          <circle cx="24" cy="24" r="18" class="draw-path"></circle>
          <polyline points="24 14 24 24 32 28" class="draw-path"></polyline>
        </svg>
        <span class="ov1-text">CHƯA ĐẦY 1 GIÂY</span>
      </div>
    </div>

    <!-- Overlay 2: 60 THÁNG THỬ THÁCH (atMs: 376890, rel: 4.65s, hold: 2.60s) -->
    <div id="overlay-2" class="clip" data-start="4.65" data-duration="2.60">
      <div id="ov2-card">
        <svg class="vox-icon" viewBox="0 0 48 48" width="60" height="60" stroke-width="4.8">
          <circle cx="24" cy="24" r="18" class="draw-path"></circle>
          <polyline points="24 14 24 24 32 28" class="draw-path"></polyline>
        </svg>
        <span class="ov2-text">60 THÁNG THỬ THÁCH</span>
      </div>
    </div>

    <!-- Overlay 3: BÀI HỌC KIỀM CHẾ (atMs: 379590, rel: 7.35s, hold: 1.27s) -->
    <div id="overlay-3" class="clip" data-start="7.35" data-duration="1.27">
      <div id="ov3-card">
        <svg class="vox-icon" viewBox="0 0 48 48" width="56" height="56" stroke-width="4.5">
          <path d="M24 6 L42 40 L6 40 Z" class="draw-path"></path>
          <line x1="24" y1="18" x2="24" y2="28" class="draw-path"></line>
          <circle cx="24" cy="34" r="1.8" fill="#FF6A1A" stroke="none"></circle>
        </svg>
        <span class="ov3-text">BÀI HỌC KIỀM CHẾ</span>
      </div>
    </div>

  </div>

  <script>
    // Setup self-drawing SVG paths deterministically
    document.querySelectorAll(".draw-path").forEach((p) => {
      const len = p.getTotalLength();
      p.style.strokeDasharray = len + "";
      p.style.strokeDashoffset = len + "";
    });

    const tl = gsap.timeline({ paused: true });

    // 1. Entrance Shatter Effect: Left and right panels slam together on impact
    tl.fromTo("#card-left",
      { x: -40, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.5, ease: "power4.out" },
      0.05
    );
    tl.fromTo("#card-right",
      { x: 40, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.5, ease: "power4.out" },
      0.05
    );

    // Seam flash on collision
    tl.fromTo("#shatter-seam",
      { opacity: 0, scaleY: 0 },
      { opacity: 1, scaleY: 1, duration: 0.15, ease: "power2.out" },
      0.50
    );
    tl.to("#shatter-seam",
      { opacity: 0, duration: 0.35, ease: "power2.in" },
      0.65
    );

    // Camera Motion: Continuous slow zoom-in across scene duration
    tl.fromTo("#hero-frame",
      { scale: 1.0 },
      { scale: 1.05, duration: 8.62, ease: "none" },
      0
    );

    // 2. Overlay 1: "CHƯA ĐẦY 1 GIÂY" (1.57s -> 3.77s)
    tl.fromTo("#ov1-card",
      { scale: 0.88, y: -24, opacity: 0 },
      { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      1.57
    );
    tl.to("#overlay-1 .draw-path",
      { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
      1.65
    );
    tl.to("#ov1-card",
      { y: -16, opacity: 0, duration: 0.28, ease: "power2.in" },
      3.45
    );

    // 3. Overlay 2: "60 THÁNG THỬ THÁCH" (4.65s -> 7.25s)
    tl.fromTo("#ov2-card",
      { scale: 0.90, y: 32, opacity: 0 },
      { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "power4.out" },
      4.65
    );
    tl.to("#overlay-2 .draw-path",
      { strokeDashoffset: 0, duration: 0.60, ease: "power2.out" },
      4.75
    );
    tl.to("#ov2-card",
      { scale: 0.96, opacity: 0, duration: 0.28, ease: "power2.in" },
      6.93
    );

    // 4. Overlay 3: "BÀI HỌC KIỀM CHẾ" (7.35s -> 8.62s)
    tl.fromTo("#ov3-card",
      { scale: 1.08, y: 16, opacity: 0 },
      { scale: 1, y: 0, opacity: 1, duration: 0.38, ease: "power4.out" },
      7.35
    );
    tl.to("#overlay-3 .draw-path",
      { strokeDashoffset: 0, duration: 0.50, ease: "power2.out" },
      7.45
    );

    // Register paused timeline on window.__timelines with key matching root data-composition-id
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s40"] = tl;
  </script>

    </template>
  </body>
