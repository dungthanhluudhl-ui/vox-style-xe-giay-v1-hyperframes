    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance: Strike motion for photo card & header (0.0s - 0.5s)
      tl.fromTo(
        "#header-bar",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        0.05
      );

      tl.fromTo(
        "#hero-card",
        { scale: 1.08, y: -24, opacity: 0 },
        { scale: 1.0, y: 0, opacity: 1, duration: 0.45, ease: "power4.out" },
        0.08
      );

      // 2. Camera Motion: continuous zoom-in on the image
      tl.fromTo(
        "#hero-img",
        { scale: 1.0 },
        { scale: 1.12, duration: 6.26, ease: "sine.out" },
        0.08
      );

      // 3. Trajectory line drawing: aligns with mortar throw action at 1.8s
      const trajPath = document.getElementById("trajectory-path");
      const pathLength = trajPath ? trajPath.getTotalLength() : 500;
      if (trajPath) {
        trajPath.style.strokeDasharray = pathLength + " " + pathLength;
        trajPath.style.strokeDashoffset = pathLength;
      }

      tl.set("#trajectory-path", { opacity: 1 }, 1.8);
      tl.fromTo(
        "#trajectory-path",
        { strokeDashoffset: pathLength },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        1.8
      );

      tl.fromTo(
        "#splash-marker",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.5)" },
        2.25
      );

      tl.to(
        ["#trajectory-path", "#splash-marker"],
        { opacity: 0, duration: 0.25, ease: "power1.in" },
        3.35
      );

      // 4. Overlay 1: HẤT XÔ VỮA entrance and exit within clip (1.8s - 3.6s)

        "#label-mortar-plate",
        { scale: 0.92, y: 20, opacity: 0 },
        { scale: 1.0, y: 0, opacity: 1, duration: 0.32, ease: "power3.out" },
        1.8
      );

      tl.to(
        "#label-mortar-plate",
        { opacity: 0, y: -10, duration: 0.22, ease: "power2.in" },
        3.38
      );

        { scale: 1.0, y: 0, opacity: 1, duration: 0.35, ease: "power4.out" },
        5.1
      );
