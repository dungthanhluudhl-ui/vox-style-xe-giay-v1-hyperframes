<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    /* Lưới ô vuông 84px chuẩn Vox Style */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      pointer-events: none;
      z-index: 1;
    }

    /* Dải cam mép đáy cố định */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Hợp đồng layout .clip */
    .clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 10;
    }

    /* Bộ class màu tương phản an toàn WCAG */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
    .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
    .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
    .hf-plate-paper { background-color: #E7E3D9; color: #141414; }

    /* ============================================================
       SHOT 1: DẤU HỎI TRUNG TÂM & PUNCH-PHRASE NGHỊCH LÝ ÁN TREO
       ============================================================ */
    #shot-1 {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 240px;
    }

    .shot1-container {
      width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
      transform-origin: center center;
    }

    /* Tag trên đầu */
    .meta-tag {
      padding: 10px 24px;
      background-color: #FF6A1A;
      color: #141414;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 6px;
    }

    /* Khối chứa icon dấu hỏi chấm lớn */
    .question-circle {
      width: 240px;
      height: 240px;
      background-color: #141414;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 36px rgba(20, 20, 20, 0.25);
      border: 4px solid #FF6A1A;
    }

    .question-svg {
      width: 140px;
      height: 170px;
    }

    /* Thẻ punch-phrase chính */
    .punch-card {
      width: 940px;
      background-color: #141414;
      border-radius: 16px;
      padding: 40px 36px;
      text-align: center;
      box-shadow: 0 20px 48px rgba(20, 20, 20, 0.35);
      border-left: 10px solid #FF6A1A;
    }

    .punch-title {
      font-size: 74px;
      font-weight: 900;
      line-height: 1.25;
      color: #F7F4EC;
      text-transform: uppercase;
      letter-spacing: -1px;
    }

    .punch-title-accent {
      color: #FF6A1A;
    }

    /* Hàng so sánh nghịch lý 30% thương tích vs Án treo */
    .comparison-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      margin-top: 10px;
    }

    .comp-pill {
      flex: 1;
      padding: 24px 20px;
      border-radius: 12px;
      text-align: center;
    }

    .comp-pill.left {
      background-color: #141414;
      border: 3px solid #FF6A1A;
      color: #FF6A1A;
      font-size: 34px;
      font-weight: 900;
    }

    .comp-vs {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background-color: #FF6A1A;
      color: #141414;
      font-weight: 900;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .comp-pill.right {
      background-color: #FF6A1A;
      color: #141414;
      font-size: 34px;
      font-weight: 900;
    }

    /* ============================================================
       SHOT 2: DIAGRAM 2 NHÁNH CÂU HỎI TÁCH ĐÔI SANG HAI BÊN
       ============================================================ */
    #shot-2 {
      padding-top: 180px;
    }

    .shot2-wrapper {
      position: relative;
      width: 1080px;
      height: 1200px;
      transform-origin: center 500px;
    }

    /* Node trung tâm trên cùng */
    .tree-root {
      position: absolute;
      top: 20px;
      left: 70px;
      width: 940px;
      background-color: #141414;
      border-radius: 14px;
      padding: 28px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      border-bottom: 6px solid #FF6A1A;
      box-shadow: 0 16px 36px rgba(20, 20, 20, 0.2);
      z-index: 5;
    }

    .tree-root-tag {
      font-size: 22px;
      font-weight: 900;
      color: #FF6A1A;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .tree-root-heading {
      font-size: 42px;
      font-weight: 900;
      color: #F7F4EC;
      text-transform: uppercase;
      text-align: center;
    }

    /* Đường dẫn cam nối giữa root và 2 card */
    .wires-layer {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1200px;
      pointer-events: none;
      z-index: 2;
    }

    /* Card nhánh 1: BẢN CHẤT HUNG KHÍ */
    .branch-card {
      position: absolute;
      width: 940px;
      background-color: #141414;
      border-radius: 16px;
      padding: 34px 40px;
      box-shadow: 0 18px 40px rgba(20, 20, 20, 0.28);
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #card-1 {
      top: 270px;
      left: 70px;
      border-left: 10px solid #FF6A1A;
    }

    #card-2 {
      top: 670px;
      left: 70px;
      border-left: 10px solid #FF6A1A;
    }

    .branch-badge {
      align-self: flex-start;
      padding: 8px 20px;
      background-color: #FF6A1A;
      color: #141414;
      font-size: 22px;
      font-weight: 900;
      border-radius: 6px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .branch-title {
      font-size: 60px;
      font-weight: 900;
      color: #F7F4EC;
      line-height: 1.25;
      text-transform: uppercase;
    }

    .branch-desc {
      font-size: 32px;
      font-weight: 700;
      color: #FF6A1A;
      line-height: 1.35;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s03"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="10.23"
  >
    <!-- Nền lưới ô vuông dùng chung xuyên suốt scene -->
    <div class="bg-grid"></div>

    <!-- Thanh cam chữ ký nhận diện ở mép dưới -->
    <div class="bottom-bar"></div>

    <!-- ==========================================
         SHOT 1 (0.00s -> 4.50s): NGHỊCH LÝ ÁN TREO?
         ========================================== -->
    <section id="shot-1" class="clip" data-start="0" data-duration="4.5">
      <div id="shot1-content" class="shot1-container">
        <!-- Tag chủ đề -->
        <div class="meta-tag">Tranh tụng hình sự</div>

        <!-- Biểu tượng dấu hỏi lớn tự vẽ viền -->
        <div class="question-circle">
          <svg class="question-svg" viewBox="0 0 140 170" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              id="q-path"
              d="M 32 54 C 32 18, 108 18, 108 58 C 108 88, 70 96, 70 120"
              stroke="#FF6A1A"
              stroke-width="18"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle id="q-dot" cx="70" cy="154" r="10" fill="#FF6A1A" />
          </svg>
        </div>

        <!-- Punch phrase: NGHỊCH LÝ ÁN TREO? -->
        <div class="punch-card">
          <h1 id="shot1-punch" class="punch-title">
            NGHỊCH LÝ <span class="punch-title-accent">ÁN TREO?</span>
          </h1>
        </div>

        <!-- Cặp thẻ đối lập trực quan -->
        <div class="comparison-row">
          <div id="chip-left" class="comp-pill left">30% THƯƠNG TÍCH</div>
          <div id="chip-center" class="comp-vs">VS</div>
          <div id="chip-right" class="comp-pill right">ÁN TREO</div>
        </div>
      </div>
    </section>

    <!-- ========================================================
         SHOT 2 (4.50s -> 10.23s): DIAGRAM 2 NHÁNH CÂU HỎI PHÁP LÝ
         ======================================================== -->
    <section id="shot-2" class="clip" data-start="4.5" data-duration="5.73">
      <div id="shot2-container" class="shot2-wrapper">
        <!-- Đường dây cam kết nối diagram -->
        <svg class="wires-layer" viewBox="0 0 1080 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Nhánh nối tới Card 1 -->
          <path
            id="wire-1"
            d="M 540 160 L 540 215 Q 540 250 490 250 L 120 250 Q 70 250 70 290 L 70 330"
            stroke="#FF6A1A"
            stroke-width="8"
            stroke-linecap="round"
          />
          <!-- Nhánh nối tới Card 2 -->
          <path
            id="wire-2"
            d="M 540 160 L 540 590 Q 540 640 490 640 L 120 640 Q 70 640 70 680 L 70 720"
            stroke="#FF6A1A"
            stroke-width="8"
            stroke-linecap="round"
          />
        </svg>

        <!-- Node gốc ở trung tâm trên -->
        <div id="tree-root-node" class="tree-root">
          <div class="tree-root-tag">Vấn đề cốt lõi</div>
          <div class="tree-root-heading">HAI CÂU HỎI PHÁP LÝ LỚN</div>
        </div>

        <!-- Nhánh 1: BẢN CHẤT HUNG KHÍ? -->
        <div id="card-1" class="branch-card">
          <div class="branch-badge">Câu hỏi 01 • Vật chứng</div>
          <h2 class="branch-title">BẢN CHẤT HUNG KHÍ?</h2>
          <p class="branch-desc">Viên gạch được pháp luật nhìn nhận thế nào?</p>
        </div>

        <!-- Nhánh 2: CĂN CỨ NGOÀI XÃ HỘI? -->
        <div id="card-2" class="branch-card">
          <div class="branch-badge">Câu hỏi 02 • Quyết định hình phạt</div>
          <h2 class="branch-title">CĂN CỨ NGOÀI XÃ HỘI?</h2>
          <p class="branch-desc">Vì sao phạm tội nhưng vẫn được tại ngoại?</p>
        </div>
      </div>
    </section>
  </div>

  <script>
    // Chuẩn bị các stroke SVG đo đạc hình học chính xác
    const qPath = document.getElementById("q-path");
    const qLen = qPath ? qPath.getTotalLength() : 200;
    if (qPath) {
      qPath.style.strokeDasharray = qLen;
      qPath.style.strokeDashoffset = qLen;
    }

    const wire1 = document.getElementById("wire-1");
    const wire1Len = wire1 ? wire1.getTotalLength() : 700;
    if (wire1) {
      wire1.style.strokeDasharray = wire1Len;
      wire1.style.strokeDashoffset = wire1Len;
    }

    const wire2 = document.getElementById("wire-2");
    const wire2Len = wire2 ? wire2.getTotalLength() : 1100;
    if (wire2) {
      wire2.style.strokeDasharray = wire2Len;
      wire2.style.strokeDashoffset = wire2Len;
    }

    // Khởi tạo Timeline paused duy nhất cho composition
    const tl = gsap.timeline({ paused: true });

    // ------------------------------------------------------------------------
    // SHOT 1: wobble-drop entrance & punch-phrase xuất hiện
    // ------------------------------------------------------------------------
    // Entrance cụm Shot 1: wobble-drop (rơi xuống dứt khoát, hơi xoay nhẹ rồi ổn định)
    tl.fromTo(
      "#shot1-content",
      { y: -90, rotation: -3, scale: 0.94, opacity: 0 },
      { y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
      0.08
    );

    // Dấu hỏi SVG tự vẽ viền
    tl.fromTo(
      "#q-path",
      { strokeDashoffset: qLen },
      { strokeDashoffset: 0, duration: 0.52, ease: "power2.out" },
      0.22
    );

    tl.fromTo(
      "#q-dot",
      { scale: 0, transformOrigin: "50% 50%" },
      { scale: 1, duration: 0.22, ease: "power3.out" },
      0.65
    );

    // Punch phrase bung nét tại 0.18s theo shotlist (atMs: 15680 - 15500 = 180ms)
    tl.fromTo(
      "#shot1-punch",
      { y: 35, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      0.18
    );

    // Hai chip đối lập mở rộng sang hai bên
    tl.fromTo(
      "#chip-left",
      { x: -50, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      0.82
    );

    tl.fromTo(
      "#chip-center",
      { scale: 0, transformOrigin: "50% 50%" },
      { scale: 1, duration: 0.28, ease: "power3.out" },
      0.95
    );

    tl.fromTo(
      "#chip-right",
      { x: 50, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      1.05
    );

    // ------------------------------------------------------------------------
    // SHOT 2: unfold diagram & vẽ hai nhánh câu hỏi
    // ------------------------------------------------------------------------
    // Camera motion nhẹ (zoom-in) từ 4.5s tới 10.23s
    tl.fromTo(
      "#shot2-container",
      { scale: 1 },
      { scale: 1.05, duration: 5.73, ease: "none" },
      4.5
    );

    // Node gốc unfold vào cảnh ở đầu Shot 2 (4.5s)
    tl.fromTo(
      "#tree-root-node",
      { scaleY: 0.2, opacity: 0, y: -20, transformOrigin: "center top" },
      { scaleY: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      4.5
    );

    // Nhánh 1: dây cam tự vẽ dần hướng về Card 1
    tl.fromTo(
      "#wire-1",
      { strokeDashoffset: wire1Len },
      { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" },
      4.65
    );

    // Card 1 xuất hiện đúng 5.03s theo shotlist (atMs: 20530 - 15500 = 5030ms)
    tl.fromTo(
      "#card-1",
      { x: -40, opacity: 0, scale: 0.95 },
      { x: 0, opacity: 1, scale: 1, duration: 0.48, ease: "power3.out" },
      5.03
    );

    // Nhánh 2: dây cam tự vẽ dần hướng về Card 2
    tl.fromTo(
      "#wire-2",
      { strokeDashoffset: wire2Len },
      { strokeDashoffset: 0, duration: 0.44, ease: "power2.out" },
      7.7
    );

    // Card 2 xuất hiện đúng 8.14s theo shotlist (atMs: 23640 - 15500 = 8140ms)
    tl.fromTo(
      "#card-2",
      { x: 40, opacity: 0, scale: 0.95 },
      { x: 0, opacity: 1, scale: 1, duration: 0.48, ease: "power3.out" },
      8.14
    );

    // Đăng ký timeline cho HyperFrames runtime
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s03"] = tl;
  </script>

    </template>
