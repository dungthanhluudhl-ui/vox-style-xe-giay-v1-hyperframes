    <script>
      const tl = gsap.timeline({ paused: true });

      // Measure SVG path lengths for clean stroke draws
      const clashPaths = [
        document.getElementById("path-clash-1"),
        document.getElementById("path-clash-2"),
        document.getElementById("path-clash-3"),
        document.getElementById("path-clash-4"),
      ];

      clashPaths.forEach((p) => {
        if (p) {
          const len = p.getTotalLength();
          p.style.strokeDasharray = len + "";
          p.style.strokeDashoffset = len + "";
        }
      });

      // 1. Entrance (Transition In: grow, duration: 0.55s)
      tl.fromTo(
        "#scene-stage",
        { scale: 0.94, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.05
      );

      tl.fromTo(
        "#header-box",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.1
      );

      // Hero Node "TUẤN" enters first (t = 0.2s)
      tl.fromTo(
        "#node-tuan",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.2
      );

      // 2. Camera Motion: Zoom-out (revealing that Tuấn is just one participant among many)
      // Carrier starts zoomed in on Tuấn (scale 1.35) and pulls out to 1.0
      tl.fromTo(
        "#camera-carrier",
        { scale: 1.35 },
        { scale: 1.0, duration: 1.35, ease: "power2.inOut" },
        0.8
      );

      // As camera zooms out, zone perimeters pop in
      tl.fromTo(
        ["#zone-box-a", "#zone-box-b"],
        { opacity: 0, scale: 0.96 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" },
        1.05
      );

      // Staggered arrival of crowd participants on Side A
      tl.fromTo(
        ["#node-a1", "#node-a2", "#node-a3"],
        { scale: 0, autoAlpha: 0, y: 15 },
        {
          scale: 1,
          autoAlpha: 1,
          y: 0,
          duration: 0.45,
          stagger: 0.12,
          ease: "power3.out",
        },
        1.2
      );

      // Staggered arrival of opposing participants on Side B
      tl.fromTo(
        ["#node-b1", "#node-b2", "#node-b3", "#node-b4"],
        { scale: 0, autoAlpha: 0, y: 15 },
        {
          scale: 1,
          autoAlpha: 1,
          y: 0,
          duration: 0.45,
          stagger: 0.12,
          ease: "power3.out",
        },
        1.4
      );

      // Clash Core burst pop at center
      tl.fromTo(
        "#clash-center",
        { scale: 0, autoAlpha: 0, rotation: -45 },
        { scale: 1, autoAlpha: 1, rotation: 0, duration: 0.5, ease: "power3.out" },
        1.75
      );

      // SVG Clash paths trace across the opposing sides
      clashPaths.forEach((p, idx) => {
        if (p) {
          tl.to(
            p,
            { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
            1.85 + idx * 0.1
          );
        }
      });

      // 3. Overlay 1: "ẨU ĐẢ NHIỀU NGƯỜI" (atMs: 300460 -> 2.11s, holdMs: 2200 -> ends ~4.31s)
      tl.fromTo(
        "#overlay-1",
        { y: 35, autoAlpha: 0, scale: 0.95 },
        { y: 0, autoAlpha: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        2.11
      );

      // Exit Overlay 1 cleanly before Overlay 2
      tl.to(
        "#overlay-1",
        { y: -20, autoAlpha: 0, duration: 0.35, ease: "power2.in" },
        4.31
      );

      // Mid-scene visual reinforcement: dynamic pulses on mutual aggression vectors
      tl.to(
        "#clash-center",
        { scale: 1.15, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" },
        4.8
      );

      tl.fromTo(
        ["#node-a1", "#node-a2", "#node-a3", "#node-b1", "#node-b2", "#node-b3", "#node-b4"],
        { borderColor: "#141414" },
        {
          borderColor: "#ff6a1a",
          duration: 0.3,
          stagger: 0.06,
          repeat: 1,
          yoyo: true,
          ease: "power1.out",
        },
        5.1
      );

      // 4. Overlay 2: "CẢ HAI BÊN THAM GIA" (atMs: 304430 -> 6.08s, holdMs: 2000 -> holds to 8.08s)
      tl.fromTo(
        "#overlay-2",
        { y: 35, autoAlpha: 0, scale: 0.95 },
        { y: 0, autoAlpha: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        6.08
      );

      // Subtle outward pulse on both zone panels when Overlay 2 confirms bilateral participation
      tl.fromTo(
        ["#zone-box-a", "#zone-box-b"],
        { backgroundColor: "rgba(231, 227, 217, 0.45)" },
        {
          backgroundColor: "rgba(255, 106, 26, 0.16)",
          duration: 0.4,
          ease: "power2.out",
        },
        6.3
      );

      // Register the master timeline on the required window registry
      window.__timelines["scene-s32"] = tl;
    </script>
