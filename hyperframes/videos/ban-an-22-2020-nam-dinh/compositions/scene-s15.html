    <script>
      // Timeline độc lập duy nhất, khởi tạo paused theo HyperFrames contract
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance Card: Hiệu ứng Flip 3D (0.0s -> 0.85s)
      tl.fromTo(
        "#main-card",
        {
          rotationY: -75,
          opacity: 0,
          scale: 0.88,
          transformPerspective: 1400
        },
        {
          rotationY: 0,
          opacity: 1,
          scale: 1,
          duration: 0.85,
          ease: "power3.out"
        },
        0.1
      );

      // 2. Nội dung sơ đồ ban đầu xuất hiện tuần tự
      tl.fromTo(
        "#panel-fact",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.5
      );

      // Chuẩn bị đường nét vẽ quỹ đạo viên gạch
      const trajectory = document.getElementById("brick-trajectory");
      if (trajectory) {
        const trajLen = trajectory.getTotalLength();
        trajectory.style.strokeDasharray = trajLen + " " + trajLen;
        trajectory.style.strokeDashoffset = trajLen;

        tl.to(
          trajectory,
          {
            strokeDashoffset: 0,
            duration: 0.8,
            ease: "power2.out"
          },
          0.8
        );
      }

      tl.fromTo(
        "#brick-icon",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.5)" },
        1.25
      );

      tl.fromTo(
        "#panel-versus",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.4, ease: "power2.out" },
        1.45
      );

      tl.fromTo(
        "#panel-charge",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        1.7
      );

      // 3. OVERLAY 1: BÀI TOÁN PHÁP LÝ (startMs = 134550 -> t = 2.72s)
      tl.fromTo(
        "#legal-problem-pill",
        { scale: 0.75, opacity: 0, x: -24 },
        { scale: 1, opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
        2.72
      );

      // Nhấn nhẹ khung đối chiếu để giữ nhịp mắt người xem
      tl.to(
        "#panel-fact",
        { borderColor: "#FF6A1A", duration: 0.4, ease: "power2.out" },
        3.8
      );
      tl.to(
        "#panel-fact",
        { borderColor: "#141414", duration: 0.4, ease: "power2.out" },
        4.6
      );

      // 4. OVERLAY 2: PUNCH-PHRASE VÌ SAO KHUNG NẶNG? (startMs = 138210 -> t = 6.38s)
      tl.fromTo(
        "#punch-phrase-card",
        {
          y: 40,
          scale: 0.9,
          opacity: 0
        },
        {
          y: 0,
          scale: 1,
          opacity: 1,
          duration: 0.6,
          ease: "power3.out"
        },
        6.38
      );

      // Nhấn dao động đòn cân công lý khi câu hỏi bật ra
      tl.fromTo(
        "#scale-beam",
        { rotation: -12, transformOrigin: "32px 22px" },
        { rotation: 0, duration: 0.5, ease: "power2.out" },
        6.6
      );

      // Đăng ký timeline cho HyperFrames runtime seek
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s15"] = tl;
    </script>
