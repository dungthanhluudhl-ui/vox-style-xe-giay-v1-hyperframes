<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    /* CSS Reset & Thiết lập khung hình 1080x1920 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      background-color: #F5F0E4; /* Biến thể background: card (kem phẳng) */
      font-family: "Be Vietnam Pro", sans-serif;
      color: #141414;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F5F0E4;
    }

    /* Quy ước bắt buộc: .clip dùng inset: 0, không đặt width/height cứng bằng px */
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Họa tiết góc & Header điều tra */
    .case-file-tag {
      position: absolute;
      top: 70px;
      left: 60px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #141414;
    }

    .case-file-tag .badge-num {
      background-color: #141414;
      color: #F7F4EC;
      padding: 6px 16px;
      border-radius: 6px;
    }

    .case-file-tag .case-id {
      opacity: 0.65;
    }

    /* Container chính: Card trung tâm nằm hoàn toàn trong safe zone (Y: 160 -> 1390) */
    .main-card {
      position: absolute;
      top: 170px;
      left: 60px;
      width: 960px;
      height: 1140px;
      background-color: #FFFFFF;
      border: 3.5px solid #141414;
      border-radius: 20px;
      box-shadow: 14px 14px 0px #141414;
      padding: 44px 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Phần đầu của Card */
    .card-header {
      width: 100%;
      border-bottom: 2px dashed rgba(20, 20, 20, 0.25);
      padding-bottom: 26px;
    }

    .card-kicker {
      display: inline-block;
      background-color: #FF6A1A;
      color: #141414;
      font-weight: 900;
      font-size: 26px;
      padding: 6px 18px;
      border-radius: 6px;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .card-title {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.25;
      color: #141414;
      letter-spacing: -0.5px;
    }

    /* Khối Diagram đối chiếu 2 vế (30% Thương tật vs Án treo) */
    .diagram-stage {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    /* Cột bên trái: 30% Thương tật */
    .stat-card {
      flex: 1;
      background-color: #F5F0E4;
      border: 2.5px solid #141414;
      border-radius: 14px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 6px 6px 0px #141414;
      transform-origin: center center;
    }

    .stat-card-title {
      font-size: 22px;
      font-weight: 700;
      color: #141414;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .stat-number {
      font-size: 110px;
      font-weight: 900;
      line-height: 1;
      color: #141414;
      margin-bottom: 12px;
    }

    .stat-pill {
      display: inline-block;
      background-color: #FF6A1A;
      color: #141414;
      font-size: 22px;
      font-weight: 900;
      padding: 8px 18px;
      border-radius: 8px;
      border: 2px solid #141414;
    }

    /* Thanh đo tỷ lệ 30% */
    .meter-container {
      margin-top: 18px;
      height: 14px;
      background-color: rgba(20, 20, 20, 0.15);
      border-radius: 7px;
      overflow: hidden;
      border: 1.5px solid #141414;
    }

    .meter-fill {
      width: 30%;
      height: 100%;
      background-color: #FF6A1A;
      transform-origin: left center;
    }

    /* Nút liên kết ở giữa */
    .connector {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 90px;
    }

    .connector-circle {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background-color: #141414;
      color: #F7F4EC;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      border: 3px solid #FF6A1A;
      box-shadow: 4px 4px 0px rgba(20, 20, 20, 0.4);
    }

    .connector-arrow-svg {
      width: 60px;
      height: 32px;
      margin-top: 8px;
    }

    /* Cột bên phải: Án treo & Cửa trại giam mở hé */
    .prison-card {
      flex: 1;
      background-color: #F5F0E4;
      border: 2.5px solid #141414;
      border-radius: 14px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 6px 6px 0px #141414;
      transform-origin: center center;
    }

    .prison-card-title {
      font-size: 22px;
      font-weight: 700;
      color: #141414;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .prison-visual {
      width: 140px;
      height: 120px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .prison-pill {
      display: inline-block;
      background-color: #141414;
      color: #F7F4EC;
      font-size: 22px;
      font-weight: 900;
      padding: 8px 18px;
      border-radius: 8px;
    }

    .sub-status {
      margin-top: 14px;
      font-size: 19px;
      font-weight: 700;
      color: #141414;
      opacity: 0.85;
    }

    /* Khối Punch-phrase Banner (Xuất hiện lúc ~4.57s) */
    .punch-banner {
      width: 100%;
      background-color: #141414;
      border-radius: 14px;
      padding: 26px 30px;
      display: flex;
      align-items: center;
      gap: 24px;
      border: 3px solid #FF6A1A;
      box-shadow: 8px 8px 0px rgba(255, 106, 26, 0.4);
      transform-origin: center bottom;
    }

    .punch-icon-wrap {
      width: 76px;
      height: 76px;
      background-color: #FF6A1A;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .punch-content {
      flex: 1;
    }

    .punch-text {
      font-size: 50px;
      font-weight: 900;
      color: #F7F4EC;
      line-height: 1.15;
      letter-spacing: -0.5px;
    }

    .punch-text .hl-word {
      color: #FF6A1A; /* Chữ cam trên nền mực đặc #141414: contrast 6.4:1 hoàn toàn hợp lệ */
    }

    .punch-sub {
      font-size: 23px;
      font-weight: 700;
      color: #E7E3D9;
      margin-top: 6px;
      opacity: 0.9;
    }

    /* Thanh cam đáy khung hình - Signature của toàn bộ Vox-style DNA */
    .brand-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 14px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s16"
    data-width="1080"
    data-height="1920"
    data-start="0"
    data-duration="7.44"
  >
    <!-- Scene Clip chính chiếm toàn màn hình -->
    <div id="scene-clip" class="clip" data-start="0" data-duration="7.44">
      
      <!-- Nhãn hồ sơ phía trên ngoài Card -->
      <div id="case-tag" class="case-file-tag">
        <span class="badge-num">VẤN ĐỀ 02</span>
        <span class="case-id">ĐỐI CHIẾU PHÁP LÝ</span>
      </div>

      <!-- Main Card Container -->
      <div id="main-card" class="main-card">
        
        <!-- Header trong Card -->
        <div id="card-header" class="card-header">
          <div class="card-kicker">CÂU HỎI MẤU CHỐT</div>
          <h1 class="card-title">Tại sao thương tật nặng nhưng vẫn được hưởng án treo?</h1>
        </div>

        <!-- Diagram so sánh giữa 30% Thương tật và Án treo -->
        <div class="diagram-stage">
          
          <!-- Box Trái: 30% Thương tật -->
          <div id="stat-box" class="stat-card">
            <div class="stat-card-title">Mức độ tổn hại</div>
            <div id="stat-num" class="stat-number">30%</div>
            <div id="stat-label-wrap">
              <span class="stat-pill">THƯƠNG TẬT</span>
            </div>
            <div class="meter-container">
              <div id="gauge-fill" class="meter-fill"></div>
            </div>
          </div>

          <!-- Connector ở giữa -->
          <div id="connector" class="connector">
            <div class="connector-circle">?</div>
            <svg class="connector-arrow-svg" viewBox="0 0 60 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 16H52M52 16L38 6M52 16L38 26" stroke="#141414" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>

          <!-- Box Phải: Cửa giam mở & Án treo -->
          <div id="prison-box" class="prison-card">
            <div class="prison-card-title">Phán quyết tòa án</div>
            <div class="prison-visual">
              <!-- SVG Cửa buồng giam hé mở -->
              <svg width="120" height="110" viewBox="0 0 120 110" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Khung cửa giam -->
                <rect x="10" y="10" width="100" height="90" rx="4" stroke="#141414" stroke-width="5" fill="#E7E3D9"/>
                <!-- Song sắt cố định bên trái -->
                <line x1="28" y1="10" x2="28" y2="100" stroke="#141414" stroke-width="4.5"/>
                <line x1="46" y1="10" x2="46" y2="100" stroke="#141414" stroke-width="4.5"/>
                <!-- Cánh cửa mở hé bên phải -->
                <g id="prison-gate">
                  <line x1="64" y1="10" x2="64" y2="100" stroke="#FF6A1A" stroke-width="5"/>
                  <line x1="82" y1="14" x2="94" y2="96" stroke="#FF6A1A" stroke-width="4.5"/>
                  <line x1="98" y1="20" x2="114" y2="92" stroke="#FF6A1A" stroke-width="4.5"/>
                  <!-- Khóa mở -->
                  <circle cx="86" cy="55" r="5" fill="#141414"/>
                </g>
              </svg>
            </div>
            <div class="prison-pill">HƯỞNG ÁN TREO</div>
            <div class="sub-status">Không bị giam giữ</div>
          </div>

        </div>

        <!-- Khối Punch-phrase Banner (Overlay lúc ~4.57s) -->
        <div id="punch-banner" class="punch-banner">
          <div class="punch-icon-wrap">
            <!-- Icon question vẽ tay -->
            <svg width="46" height="46" viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                id="question-svg-path"
                d="M14 16C14 10.5 18 7 23 7C28 7 32 10.5 32 15C32 19 28.5 21.5 25 24C23.5 25 23 26.5 23 29"
                stroke="#141414"
                stroke-width="5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle id="question-svg-dot" cx="23" cy="37" r="3.5" fill="#141414" />
            </svg>
          </div>
          <div class="punch-content">
            <div class="punch-text">VẪN ĐƯỢC <span class="hl-word">ÁN TREO?</span></div>
            <div class="punch-sub">Căn cứ pháp lý nào cho phép điều này?</div>
          </div>
        </div>

      </div>

      <!-- Thanh cam đặc trưng thương hiệu ở đáy khung hình -->
      <div class="brand-bottom-bar"></div>

    </div>
  </div>

  <script>
    // Thiết lập stroke cho SVG Path Draw đúng chuẩn determinism
    const qPath = document.getElementById("question-svg-path");
    if (qPath) {
      const len = qPath.getTotalLength ? qPath.getTotalLength() : 70;
      qPath.style.strokeDasharray = String(len);
      qPath.style.strokeDashoffset = String(len);
    }

    // Bắt buộc: Đúng 1 timeline GSAP paused, gán vào window.__timelines["scene-s16"]
    const tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s16"] = tl;

    // --- TIMELINE ORCHESTRATION ---
    // Scene duration: 7.44s

    // Phase 1: Card entrance (kiểu "rise" theo SCENE PLAN) (0.0s -> 0.7s)
    tl.fromTo(
      "#main-card",
      { y: 90, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
      0.1
    );

    tl.fromTo(
      "#case-tag",
      { y: -20, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
      0.2
    );

    tl.fromTo(
      "#card-header",
      { opacity: 0, y: 15 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
      0.4
    );

    // Phase 2: Overlay 1 - "30% THƯƠNG TẬT" xuất hiện tại 1.78s (142060ms - 140280ms)
    // Box trái phóng vào dứt khoát
    tl.fromTo(
      "#stat-box",
      { scale: 0.85, opacity: 0, y: 25 },
      { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
      1.78
    );

    // Thanh đo thương tật 30% vẽ đầy
    tl.fromTo(
      "#gauge-fill",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.45, ease: "power2.out" },
      1.95
    );

    // Dấu liên kết ở giữa xuất hiện
    tl.fromTo(
      "#connector",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.7)" },
      2.3
    );

    // Box Phải (Án treo & Buồng giam) xuất hiện
    tl.fromTo(
      "#prison-box",
      { scale: 0.85, opacity: 0, y: 25 },
      { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
      2.65
    );

    // Cánh cửa giam xoay hé mở (dùng GSAP alias `rotation` và `transformOrigin`, tránh gán chuỗi transform làm lỗi attribute trên <g>)
    tl.fromTo(
      "#prison-gate",
      { rotation: 0, transformOrigin: "64px 55px" },
      { rotation: -24, duration: 0.7, ease: "power2.inOut" },
      3.05
    );

    // Phase 3: Overlay 2 - Punch-phrase "VẪN ĐƯỢC ÁN TREO?" tại 4.57s (144850ms - 140280ms)
    tl.fromTo(
      "#punch-banner",
      { scale: 0.92, opacity: 0, y: 35 },
      { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
      4.57
    );

    // Vẽ nét dấu chấm hỏi (stroke-dashoffset -> 0)
    if (qPath) {
      tl.to(
        "#question-svg-path",
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        4.75
      );
    }

    // Dấu chấm của dấu hỏi nảy ra
    tl.fromTo(
      "#question-svg-dot",
      { scale: 0, opacity: 0, transformOrigin: "center center" },
      { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(2)" },
      5.15
    );

    // Giữ nguyên trạng thái rõ ràng, vững vàng tới hết scene (7.44s)
  </script>

    </template>
  </body>
</html>
