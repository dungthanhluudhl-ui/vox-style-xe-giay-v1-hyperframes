<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }

      /* Lưới nền Vox 84px */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        pointer-events: none;
        z-index: 1;
      }

      /* Quy ước clip của HyperFrames */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Khung ảnh collage trung tâm */
      .hero-container {
        position: absolute;
        top: 200px;
        left: 60px;
        width: 960px;
        height: 1160px;
        border: 5px solid #141414;
        background-color: #141414;
        overflow: hidden;
        box-shadow: 16px 16px 0px rgba(20, 20, 20, 0.22);
        z-index: 2;
        transform-origin: 50% 50%;
      }

      .hero-img-wrapper {
        position: absolute;
        inset: -20px;
        overflow: hidden;
      }

      .hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 25%;
        display: block;
        transform-origin: 50% 50%;
      }

      /* Lớp overlay chứa các plate chữ */
      .overlay-layer {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }

      /* Plate 1: CÓ TỘI ≠ CÁCH LY */
      .plate-centered {
        position: absolute;
        top: 250px;
        left: 50%;
        transform: translate(-50%, 0);
        display: flex;
        justify-content: center;
        width: 100%;
      }

      .plate-banner {
        background-color: #141414;
        padding: 22px 36px;
        border-radius: 6px;
        border-left: 10px solid #FF6A1A;
        box-shadow: 0 18px 40px rgba(20, 20, 20, 0.45);
        display: flex;
        align-items: center;
        gap: 14px;
        white-space: nowrap;
      }

      .plate-text-white {
        color: #F7F4EC;
        font-size: 54px;
        font-weight: 900;
        letter-spacing: 0.5px;
        line-height: 1.1;
      }

      .plate-text-orange {
        color: #FF6A1A;
        font-size: 60px;
        font-weight: 900;
        line-height: 1;
        margin: 0 4px;
      }

      /* Plate 2: THÀNH KHẨN KHAI BÁO */
      .plate-left-wrap {
        position: absolute;
        top: 1050px;
        left: 90px;
      }

      .plate-card-left {
        background-color: #141414;
        padding: 18px 30px;
        border-radius: 6px;
        border-left: 8px solid #FF6A1A;
        box-shadow: 0 14px 30px rgba(20, 20, 20, 0.4);
        display: flex;
        align-items: center;
        gap: 18px;
        white-space: nowrap;
      }

      .icon-check-svg {
        width: 44px;
        height: 44px;
        flex-shrink: 0;
      }

      .plate-label-text {
        color: #F7F4EC;
        font-size: 40px;
        font-weight: 900;
        letter-spacing: 0.8px;
        line-height: 1.2;
      }

      /* Plate 3: ĂN NĂN HỐI CẢI */
      .plate-right-wrap {
        position: absolute;
        top: 1190px;
        right: 90px;
      }

      .plate-card-right {
        background-color: #141414;
        padding: 18px 32px;
        border-radius: 6px;
        border-left: 8px solid #FF6A1A;
        box-shadow: 0 14px 30px rgba(20, 20, 20, 0.4);
        display: flex;
        align-items: center;
        gap: 16px;
        white-space: nowrap;
      }

      /* Dải cam nhận diện đáy khung hình */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s24"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="9.7"
    >
      <!-- Lưới nền giấy ngà Vox -->
      <div class="bg-grid"></div>

      <!-- Shot S24-1: Hình ảnh bục khai báo phiên toà -->
      <section id="shot-s24-1" class="clip" data-start="0" data-duration="9.7">
        <div id="hero-frame" class="hero-container">
          <div class="hero-img-wrapper">
            <img
              id="hero-img"
              class="hero-img"
              src="assets/img-07-courtroom-defendant-trial-vietnam.jpg"
              alt="Bị cáo Tuấn trước bục khai báo"
            />
          </div>
        </div>
      </section>

      <!-- Overlay 1: CÓ TỘI ≠ CÁCH LY (0.75s - 3.15s) -->
      <div id="clip-overlay-1" class="clip" data-start="0.75" data-duration="2.4">
        <div class="overlay-layer">
          <div class="plate-centered">
            <div id="plate-1" class="plate-banner">
              <span class="plate-text-white">CÓ TỘI</span>
              <span class="plate-text-orange">≠</span>
              <span class="plate-text-white">CÁCH LY</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Overlay 2: THÀNH KHẨN KHAI BÁO (6.5s - 8.7s) -->
      <div id="clip-overlay-2" class="clip" data-start="6.5" data-duration="2.2">
        <div class="overlay-layer">
          <div class="plate-left-wrap">
            <div id="plate-2" class="plate-card-left">
              <svg class="icon-check-svg" viewBox="0 0 44 44" fill="none">
                <circle cx="22" cy="22" r="19" stroke="#FF6A1A" stroke-width="3.5" />
                <path
                  id="check-path"
                  d="M13 22.5 L19.5 29 L31.5 16"
                  stroke="#FF6A1A"
                  stroke-width="4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="plate-label-text">THÀNH KHẨN KHAI BÁO</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Overlay 3: ĂN NĂN HỐI CẢI (8.85s - 9.7s) -->
      <div id="clip-overlay-3" class="clip" data-start="8.85" data-duration="0.85">
        <div class="overlay-layer">
          <div class="plate-right-wrap">
            <div id="plate-3" class="plate-card-right">
              <span class="plate-label-text">ĂN NĂN HỐI CẢI</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Dải cam đáy màn hình -->
      <div class="brand-bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance animation cho ảnh chính: TransitionIn "grow" kết hợp zoom-in nhẹ
      tl.fromTo(
        "#hero-frame",
        { scale: 0.88, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.8, ease: "power3.out" },
        0
      );

      // Camera motion: zoom-in nhẹ từ 1.0 đến 1.06 trong toàn cảnh
      tl.fromTo(
        "#hero-img",
        { scale: 1.0 },
        { scale: 1.06, duration: 9.7, ease: "none" },
        0
      );

      // 2. Overlay 1: "CÓ TỘI ≠ CÁCH LY" (bắt đầu ở 0.75s, giữ 2.4s)
      tl.fromTo(
        "#plate-1",
        { scale: 0.85, opacity: 0, y: -24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.75
      );
      // Kết thúc êm trước khi hết clip overlay 1
      tl.to(
        "#plate-1",
        { opacity: 0, y: -12, duration: 0.25, ease: "power2.in" },
        2.9
      );

      // 3. Overlay 2: "THÀNH KHẨN KHAI BÁO" + icon check (bắt đầu ở 6.5s, giữ 2.2s)
      tl.fromTo(
        "#plate-2",
        { x: -36, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        6.5
      );

      // Hiệu ứng self-drawing SVG path cho icon check
      const checkPath = document.getElementById("check-path");
      if (checkPath) {
        const pathLen = checkPath.getTotalLength();
        checkPath.style.strokeDasharray = pathLen;
        checkPath.style.strokeDashoffset = pathLen;
        tl.fromTo(
          checkPath,
          { strokeDashoffset: pathLen },
          { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
          6.75
        );
      }

      // Exit fade out nhẹ trước khi hết clip overlay 2
      tl.to(
        "#plate-2",
        { opacity: 0, x: -16, duration: 0.25, ease: "power2.in" },
        8.45
      );

      // 4. Overlay 3: "ĂN NĂN HỐI CẢI" (bắt đầu ở 8.85s đến hết scene)
      tl.fromTo(
        "#plate-3",
        { scale: 0.9, opacity: 0, y: 16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        8.85
      );

      // Đăng ký timeline cho HyperFrames seek
      window.__timelines["scene-s24"] = tl;
    </script>
  
    </template>
  </body>
</html>
