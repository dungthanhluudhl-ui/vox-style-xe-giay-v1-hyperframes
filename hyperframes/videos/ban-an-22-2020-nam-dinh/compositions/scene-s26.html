      // Khởi tạo trạng thái ban đầu của các thành phần

      tl.to(
        "#dossier-card",

          rotation: 0,
          opacity: 1,
          duration: 0.75,
          ease: "power3.out",

        "#item-row-1",
        {
          x: 0,
          opacity: 1,
          duration: 0.4,
          ease: "power3.out",
        },
        1.23,
      );

      tl.to(

          backgroundColor: "#ff6a1a",
          duration: 0.25,
          ease: "power2.out",

      tl.fromTo(
