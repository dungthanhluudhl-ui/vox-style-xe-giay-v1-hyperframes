    <script>
      const tl = gsap.timeline({ paused: true });

      // Phase 1 (0.0s - 0.8s): Strike Entrance of the entire scene
      tl.fromTo(
        "#header-box",
        { y: -80, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.1
      );

      tl.fromTo(
        "#divider-stroke",
        { scaleY: 0 },
        { scaleY: 1, duration: 0.7, ease: "power2.out" },
        0.2
      );

      tl.fromTo(
        "#divider-mark",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.8)" },
        0.35
      );

      tl.fromTo(
        "#left-panel",
        { x: -100, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.25
      );

      tl.fromTo(
        "#right-panel",
        { x: 100 },
        { x: 0, duration: 0.65, ease: "power3.out" },
        0.35
      );

      // Argue characters pop in left panel
      tl.fromTo(
        "#figure-a",
        { scale: 0.8, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.5
      );
      tl.fromTo(
        "#figure-b",
        { scale: 0.8, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.65
      );
      tl.fromTo(
        "#bubble-a",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" },
        0.8
      );

      // Phase 2 (2.47s - Shotlist Overlay 1: "TRƯỚC NÉM: DÂN SỰ", atMs: 366520)
      tl.fromTo(
        "#badge-civil-box",
        { scale: 0.8, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        2.47
      );

      // Pulse warning on the resting brick right before throwing action
      tl.to(
        "#brick-pulse",
        { opacity: 1, r: 45, duration: 0.6, ease: "power1.out" },
        3.6
      );
      tl.to(
        "#brick-pulse",
        { opacity: 0, duration: 0.3 },
        4.1
      );

      // Phase 3 (4.3s - 5.15s): Brick gets thrown across the boundary!
      tl.set("#resting-brick", { opacity: 0 }, 4.3);
      tl.set("#air-brick", { opacity: 1 }, 4.3);
      tl.set("#flight-path", { opacity: 0.85 }, 4.3);

      tl.fromTo(
        "#flight-path",
        { strokeDashoffset: 500, strokeDasharray: "10 10" },
        { strokeDashoffset: 0, duration: 0.8, ease: "power1.inOut" },
        4.3
      );

      tl.fromTo(
        "#air-brick",
        { x: 0, y: 0, rotation: 0 },
        { x: 450, y: -80, rotation: 380, duration: 0.85, ease: "power1.inOut" },
        4.3
      );

      // Phase 4 (5.15s): Landing on right side -> Impact & Panel State Activation!
      tl.to(
        "#impact-ring",
        { opacity: 1, r: 60, strokeWidth: 1, duration: 0.45, ease: "power2.out" },
        5.15
      );
      tl.to(
        "#impact-ring",
        { opacity: 0, duration: 0.2 },
        5.6
      );

      // Right panel border turns bright orange with shadow
      tl.to(
        "#right-panel",
        { boxShadow: "8px 12px 0px #FF6A1A", borderColor: "#FF6A1A", duration: 0.4, ease: "power2.out" },
