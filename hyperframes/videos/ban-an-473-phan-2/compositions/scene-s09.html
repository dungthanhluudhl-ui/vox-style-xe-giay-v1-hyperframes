      // Single paused GSAP master timeline for the composition
      const tl = gsap.timeline({ paused: true });

      // 1. Transition In: Wobble-Drop entrance (starts at t = 0.1s)

        "#sceneWrap",
        { y: -75, rotation: 1.5, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.1,
      );

      // Camera motion: pan-right drift throughout the scene on diagramLayer
      tl.fromTo(
        "#diagramLayer",
        { x: -18 },
        { x: 18, duration: 5.81, ease: "none" },
        0,
      );

      // 2. Header elements entrance (t = 0.25s to 0.45s)
      tl.fromTo(
        "#headerPill",
        { y: -16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
        0.25,
      );
      tl.fromTo(
        "#headerTitle",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.35,
      );
      tl.fromTo(
        "#headerLine",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "power2.out" },
        0.45,
      );

      // 3. Person cards reveal: entrance transform (x, rotation, opacity) on outer card
      tl.fromTo(
        "#cardTien",
        { x: -60, opacity: 0, rotation: -2 },
        { x: 0, opacity: 1, rotation: 0, duration: 0.55, ease: "power3.out" },
        0.55,
      );
      tl.fromTo(
        "#cardSon",
        { x: 60, opacity: 0, rotation: 2 },
        { x: 0, opacity: 1, rotation: 0, duration: 0.55, ease: "power3.out" },
        0.7,
      );

      // 4. Diagram connection & central hub
      // Progressive draw line with measured stroke-dasharray/dashoffset = 240px
      tl.fromTo(
        "#flowLine",
        { strokeDashoffset: 240 },
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        1.1,
      );
      tl.fromTo(
        "#hubBadge",
        { scale: 0, rotation: -30, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.35,
      );

      // 5. Transfer flow: formula document pop and slide across to Sơn
      // Phase 5a: Smooth pop entrance (power3.out, no bouncy back.out)
      tl.fromTo(
        "#formulaDoc",
        { x: 0, scale: 0, opacity: 0 },
        { x: 0, scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        1.8,
      );

      // Phase 5b: Slide across without overlapping previous tween, explicit fromTo endpoints
      tl.fromTo(
        "#formulaDoc",
        { x: 0 },
        { x: 250, duration: 1.15, ease: "power2.inOut" },
        2.25,
      );

      // Lock status transition at midpoint of transfer
      tl.to(
        "#lockClosed",
        { opacity: 0, scale: 0.7, duration: 0.25, ease: "power2.in" },
        2.35,
      );
      tl.fromTo(
        "#lockOpen",
        { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" },
        2.35,
      );

      // 6. Status verification badge entrance
      tl.fromTo(
        "#verificationLabel",
