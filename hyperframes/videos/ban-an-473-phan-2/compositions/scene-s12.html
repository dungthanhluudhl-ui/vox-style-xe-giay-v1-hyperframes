    <script>
      // 1. Initial State Setup: explicit compositing without CSS transform collisions
      gsap.set("#header-badge", { y: -30, opacity: 0 });
      gsap.set("#media-frame", { scale: 0.94, opacity: 0, y: 20 });
      gsap.set("#evidence-video", { x: 20 });
      gsap.set("#crowd-icon", { scale: 0, opacity: 0, rotation: -20 });
      gsap.set("#card-group-1", { y: 40, opacity: 0 });
      gsap.set("#card-group-2", { y: 40, opacity: 0 });
      gsap.set("#meter-fill-1", { scaleX: 0 });
      gsap.set("#meter-fill-2", { scaleX: 0 });
      gsap.set("#punch-phrase-banner", { y: 30, opacity: 0, scale: 0.95 });

      // SVG Path Draw setup for Crowd Icon
      const crowdPaths = document.querySelectorAll(".crowd-svg path, .crowd-svg circle");
      crowdPaths.forEach((path) => {
        const len = path.getTotalLength ? path.getTotalLength() : 50;
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
      });

      // 2. Create the Paused GSAP Timeline
      const tl = gsap.timeline({ paused: true });

      // Entrance Animation: Punch (0s - 0.6s)
      tl.to(
        "#header-badge",
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.05
      );
      tl.to(
        "#media-frame",
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        0.15
      );

      // Continuous Pan-Left for the Video Inside Mockup Frame (5.9s duration)
      tl.to(
        "#evidence-video",
        { x: -20, duration: 5.75, ease: "none" },
        0.15
      );

      // Overlay Icon: Crowd (at 0.76s = 77300ms - 76540ms)
      tl.to(
        "#crowd-icon",
        { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "power3.out" },
        0.76
      );
      crowdPaths.forEach((path, idx) => {
        tl.to(
          path,
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
          0.85 + idx * 0.06
        );
      });

      // Group 1 Arrival & Counter (at 1.93s = 78470ms - 76540ms)
      tl.to(
        "#card-group-1",
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.93
      );
      tl.fromTo(
        "#meter-fill-1",
        { scaleX: 0 },
        { scaleX: 0.403, duration: 0.85, ease: "power2.out" },
        2.05
      );

      // Numeric counter for Group 1 (0 -> 403)
      const countObj1 = { val: 0 };
      const counterEl1 = document.getElementById("counter-1");
      tl.fromTo(
        countObj1,
        { val: 0 },
        {
          val: 403,
          duration: 0.85,
          ease: "power2.out",
          onUpdate: () => {
            counterEl1.innerText = Math.round(countObj1.val);
          }
        },
        2.05
      );

      // Group 2 Arrival early build-up at 3.3s
      tl.to(
        "#card-group-2",
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        3.3
      );
      tl.fromTo(
        "#meter-fill-2",
        { scaleX: 0 },
        { scaleX: 0.45, duration: 0.8, ease: "power2.out" },
        3.4
      );

      const countObj2 = { val: 0 };
      const counterEl2 = document.getElementById("counter-2");
      tl.fromTo(
        countObj2,
        { val: 0 },
        {
          val: 450,
          duration: 0.8,
          ease: "power2.out",
          onUpdate: () => {
            counterEl2.innerText = Math.round(countObj2.val);
          }
        },
        3.4
      );

      // Punch Phrase & Surge: NHÓM 2 CÁN MỐC 908 NGƯỜI (at 4.70s = 81240ms - 76540ms)
      // Explicit endpoints with fromTo to ensure deterministic render across any seek position
      tl.fromTo(
        countObj2,
        { val: 450 },
        {
          val: 908,
          duration: 0.7,
          ease: "power3.out",
          onUpdate: () => {
            counterEl2.innerText = Math.round(countObj2.val);
          }
        },
        4.7
      );
      tl.fromTo(
        "#meter-fill-2",
        { scaleX: 0.45 },
        { scaleX: 0.908, duration: 0.7, ease: "power3.out" },
        4.7
      );
      tl.fromTo(
        "#card-group-2",
        { scale: 1 },
        { scale: 1.04, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out" },
        4.7
      );
      tl.to(
        "#punch-phrase-banner",
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        4.7
      );

      // Register the master timeline
      window.__timelines["scene-s12"] = tl;
    </script>
