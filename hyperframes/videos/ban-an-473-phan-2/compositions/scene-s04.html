    </style>

    <!-- Kịch bản GSAP Timeline -->
    <script>
      // 1. Khởi tạo thuộc tính SVG Stroke để vẽ tự nhiên (svg-path-draw)
      const trendLine = document.getElementById("trend-line");
      const trendLen = trendLine.getTotalLength();
      trendLine.style.strokeDasharray = trendLen;
      trendLine.style.strokeDashoffset = trendLen;

      const crowdStrokes = document.querySelectorAll("#crowd-icon path, #crowd-icon circle");
      crowdStrokes.forEach((el) => {
        const len = el.getTotalLength ? el.getTotalLength() : 120;
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
      });

      // 2. Thiết lập trạng thái ẩn ban đầu ngoài timeline để Seek frame 0 luôn đúng
      gsap.set("#trend-peak", { scale: 0, opacity: 0, transformOrigin: "50% 50%" });
      gsap.set("#punch-banner", { scale: 0.85, opacity: 0, y: 18 });
      gsap.set("#sticker-label", { scale: 0, opacity: 0, rotation: -14 });
      gsap.set("#icon-group", { scale: 0.85, opacity: 0 });

      // 3. Khởi tạo Timeline Paused duy nhất theo contract của HyperFrames
      const tl = gsap.timeline({ paused: true });

      // 4. Camera Motion: Pan-left nhẹ nhàng trên ảnh trong suốt shot (0.0s -> 5.45s)
      tl.fromTo(
        "#hero-img",
        { x: 35 },
        { x: -35, duration: 5.45, ease: "none" },
        0
      );

      // 5. Transition In: "grow" nảy nhẹ card Hero (0.15s)
      tl.fromTo(
        "#hero-card",
        { scale: 0.85, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.15
      );

      // 6. Date badge xuất hiện phía trên
      tl.fromTo(
        "#date-badge",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.35
      );

      // 7. Khối Data Panel trượt lên nhẹ nhàng
      tl.fromTo(
        "#data-panel",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.5
      );

      // 8. Overlay 1 (1.07s / 22810ms): Label "QUY MÔ BÙNG NỔ" nảy spring-pop vào vị trí
      tl.fromTo(
        "#sticker-label",
        { scale: 0, opacity: 0, rotation: -14 },
        { scale: 1, opacity: 1, rotation: -3, duration: 0.5, ease: "power3.out" },
        1.07
      );

      // 9. Đồ thị trendline bắt đầu vẽ nét từ 1.25s đến 2.85s
      tl.to(
        "#trend-line",
        { strokeDashoffset: 0, duration: 1.6, ease: "power2.out" },
        1.25
      );

      // 10. Counter số nhảy vọt từ 0 lên 900 (1.25s -> 3.05s)
      tl.to(
        "#counter-num",
        { innerText: 900, snap: { innerText: 1 }, duration: 1.8, ease: "power2.out" },
        1.25
      );

      // Điểm peak của đồ thị hiện rõ khi đường trendline chạm đỉnh (2.8s)
      tl.fromTo(
        "#trend-peak",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        2.8
      );

      // 11. Overlay 2 (3.52s / 25260ms): Biểu tượng "crowd" vẽ tự động các nét
      tl.fromTo(
        "#icon-group",
        { scale: 0.85, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        3.52
      );
      tl.to(
        crowdStrokes,
        { strokeDashoffset: 0, duration: 0.6, stagger: 0.08, ease: "power2.out" },
        3.52
      );

      // 12. Overlay 3 (4.14s / 25880ms): Punch Phrase "900 THÀNH VIÊN" xuất hiện dứt khoát
      tl.fromTo(
        "#punch-banner",
        { scale: 0.85, opacity: 0, y: 18 },
        { scale: 1, opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
        4.14
      );

      // Đăng ký timeline paused vào window.__timelines["scene-s04"]
      window.__timelines["scene-s04"] = tl;
    </script>
