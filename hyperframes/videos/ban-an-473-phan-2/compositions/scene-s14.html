      const tl = gsap.timeline({ paused: true });

      // 1. Initial State Setup

      gsap.set("#badge-record", { y: -24, opacity: 0 });

      // Prep SVG self-drawing paths
      const docPath = document.getElementById("doc-icon-path");
      const docFold = document.getElementById("doc-icon-fold");
      const penArc = document.getElementById("pen-arc");

      [docPath, docFold, penArc].forEach((p) => {
        if (p && p.getTotalLength) {
          const len = p.getTotalLength();
          p.style.strokeDasharray = len;
          p.style.strokeDashoffset = len;
        }
      });

      // 2. Camera slow drift zoom-in on document
      tl.to("#stage-container", { scale: 1.05, duration: 6.79, ease: "none" }, 0);

      // 3. Document Entrance (Entrance animation: grow)
      tl.to("#document-card", { scale: 1, opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.2);

      // 4. Label Overlay ("HỒ SƠ BẢN ÁN" at 90260 ms -> rel 0.86s, hold ~1.9s)
      tl.to("#badge-record", { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.86);
      tl.to("#badge-record", { y: -16, opacity: 0, duration: 0.35, ease: "power2.in" }, 2.76);

      // 5. Doc Icon SVG reveal at 91930 ms -> rel 2.53s, hold ~1.8s
      tl.to("#doc-icon-container", { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.4)" }, 2.53);
      if (docPath) {
        tl.to(docPath, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 2.55);
      }
      if (docFold) {
        tl.to(docFold, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 2.85);
      }
      tl.to("#doc-icon-container", { opacity: 0, duration: 0.35, ease: "power2.in" }, 4.33);

      // 6. Highlighter sweeps across "ĐINH DOÃN ĐỨC H."

      tl.to("#name-suffix", { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 3.8);
