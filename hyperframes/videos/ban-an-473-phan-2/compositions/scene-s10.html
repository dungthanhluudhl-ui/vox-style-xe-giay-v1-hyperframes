    <script>
      const branchMain = document.getElementById("branch-main");
      const lenMain = branchMain && branchMain.getTotalLength ? branchMain.getTotalLength() : 55;
      if (branchMain) {
        branchMain.style.strokeDasharray = lenMain;
        branchMain.style.strokeDashoffset = lenMain;
      }

      const branchUpper = document.getElementById("branch-upper");
      const lenUpper = branchUpper && branchUpper.getTotalLength ? branchUpper.getTotalLength() : 50;
      if (branchUpper) {
        branchUpper.style.strokeDasharray = lenUpper;
        branchUpper.style.strokeDashoffset = lenUpper;
      }

      const branchLower = document.getElementById("branch-lower");
      const lenLower = branchLower && branchLower.getTotalLength ? branchLower.getTotalLength() : 50;
      if (branchLower) {
        branchLower.style.strokeDasharray = lenLower;
        branchLower.style.strokeDashoffset = lenLower;
      }

      const moneyStrokes = document.querySelectorAll(".money-stroke");
      moneyStrokes.forEach((p) => {
        const len = p.getTotalLength ? p.getTotalLength() : 100;
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
      });

      const tl = gsap.timeline({ paused: true });

      // 1. Scene entrance: rise
      tl.fromTo("#scene-container", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.05);

      // 2. Camera motion: zoom-in tuyệt đối từ 1.0 đến 1.08
      tl.fromTo("#video-inner", { scale: 1.0 }, { scale: 1.08, duration: 7.09, ease: "none" }, 0);

      // 3. Main branch path draws (tuyệt đối từ len đến 0)
      tl.fromTo(branchMain, { strokeDashoffset: lenMain }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 1.8);

      // 4. Overlay 1 (2.66s): "GIÁ NHẬP: 250K"
      tl.fromTo("#card-import", { scale: 0.85, opacity: 0, y: 24 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.66);

      // 5. Overlay 2 (2.76s): Icon Money entrance & self-draw
      tl.fromTo("#icon-money-wrap", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 2.76);
      tl.fromTo(".money-stroke", { strokeDashoffset: (i, target) => (target.getTotalLength ? target.getTotalLength() : 100) }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out", stagger: 0.08 }, 2.85);

      // 6. Branching paths to retail prices
      tl.fromTo(branchUpper, { strokeDashoffset: lenUpper }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 3.7);
      tl.fromTo(branchLower, { strokeDashoffset: lenLower }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 3.9);
      tl.fromTo(".arrow-marker", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 4.3);

      // 7. Overlay 3 (4.67s): Punch-phrase "BÁN: 300K - 350K"
      tl.fromTo("#card-retail", { scale: 0.85, opacity: 0, y: 24 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 4.67);

      // 8. Profit badge reveal
      tl.fromTo("#profit-badge", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 5.15);

      // 9. Margin callout
      tl.fromTo("#margin-callout", { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 5.55);

      // 10. Emphasize punch-phrase bằng fromTo tường minh + immediateRender: false để tránh desync
      tl.fromTo(
        "#card-retail",
        { scale: 1 },
        { scale: 1.03, yoyo: true, repeat: 1, duration: 0.25, ease: "sine.inOut", immediateRender: false },
        6.1
      );

      window.__timelines["scene-s10"] = tl;
    </script>
