    // Master GSAP seekable timeline contract
    const tl = gsap.timeline({ paused: true });

    // 1. Prepare SVG stroke draw paths deterministically
    const warnTriangle = document.getElementById("warn-triangle");
    const warnLine = document.getElementById("warn-line");
    const warnDot = document.getElementById("warn-dot");

    if (warnTriangle && warnLine) {
      const lenTri = warnTriangle.getTotalLength();
      const lenLine = warnLine.getTotalLength();
      warnTriangle.style.strokeDasharray = lenTri.toString();
      warnTriangle.style.strokeDashoffset = lenTri.toString();
      warnLine.style.strokeDasharray = lenLine.toString();
      warnLine.style.strokeDashoffset = lenLine.toString();
    }

    const crowdPaths = document.querySelectorAll(".crowd-path");
    crowdPaths.forEach(function(path) {
      const len = path.getTotalLength();
      path.style.strokeDasharray = len.toString();
      path.style.strokeDashoffset = len.toString();
    });

    // 2. Camera Stage entrance ("zoom-through" transition in on child wrapper, never .clip)
    tl.fromTo("#camera-stage",
      { scale: 0.88, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.6, ease: "power3.out" },
      0.0
    );

    // Continuous camera motion: subtle push-in across the whole scene
    tl.to("#camera-stage",
      { scale: 1.04, duration: 11.51, ease: "none" },
      0.6
    );

    // Explicit fromTo for seek-safe ambient organic float on central card
    tl.fromTo("#infographic-card",
      { y: 0 },
      { y: -6, duration: 2.5, yoyo: true, repeat: 3, ease: "sine.inOut" },
      0.6
    );

    // Dynamic spotlight intensity adjustment toward the climax
    tl.to("#spotlight-layer",
      { opacity: 0.85, duration: 3.0, ease: "power2.inOut" },
      7.5
    );

    // --- Overlay Timing sequence as specified in Shotlist ---

    // Overlay 1: "1. LẬP NHÓM ZALO" at 0.22s
    tl.fromTo("#step-1",
      { y: 30, opacity: 0, scale: 0.92 },
      { y: 0, opacity: 1, scale: 1.0, duration: 0.5, ease: "power3.out" },
      0.22
    );

    // Overlay 2: "2. NỘI DUNG KHIÊU DÂM" at 2.21s
    tl.fromTo("#step-2",
      { y: 30, opacity: 0, scale: 0.92 },
      { y: 0, opacity: 1, scale: 1.0, duration: 0.5, ease: "power3.out" },
      2.21
    );

    // Overlay 3: Icon "warning" at 2.77s
    tl.fromTo("#overlay-warning",
      { scale: 0, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.45, ease: "power3.out" },
      2.77
    );

    if (warnTriangle && warnLine && warnDot) {
      tl.to(warnTriangle, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 2.85);
      tl.to(warnLine, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 3.05);
      tl.fromTo(warnDot, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 3.25);
    }

    // Overlay 4: "3. MỒI CHÀI MUA HÀNG" at 5.90s
    tl.fromTo("#step-3",
      { y: 30, opacity: 0, scale: 0.92 },
      { y: 0, opacity: 1, scale: 1.0, duration: 0.5, ease: "power3.out" },
      5.90
    );

    // Overlay 5: Icon "crowd" at 9.73s
    tl.fromTo("#overlay-crowd",
      { scale: 0, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.45, ease: "power3.out" },
      9.73
