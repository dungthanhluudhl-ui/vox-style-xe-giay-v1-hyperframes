      <script>
        const pages = Array.from(document.querySelectorAll(".caption-page"));
        const words = Array.from(document.querySelectorAll(".word"));

        // hyperframes-animation/rules/asr-keyword-glow.md: "one driver looping all words",
        // không tạo 1 tween/từ). Port đúng logic isActive của Captions.tsx: token.fromMs <=
        // absoluteTimeMs && token.toMs > absoluteTimeMs.
        const driver = { ms: 0 };
        tl.to(
          driver,
          {
            ms: 131600,
            duration: 131.600000,
            ease: "none",
            onUpdate: () => {
              for (const w of words) {
                const fromMs = Number(w.dataset.fromMs);
                const toMs = Number(w.dataset.toMs);
                const isActive = fromMs <= driver.ms && toMs > driver.ms;
                w.classList.toggle("active", isActive);

            },
          },
          0,
        );

        // vision agent thật ở Checkpoint A.
      tl.fromTo(pages[0].querySelector(".caption-card"), {opacity: 0, y: 12}, {opacity: 1, y: 0, duration: 0.166667, ease: "expo.out", immediateRender: false}, 0.000000);
      tl.fromTo(pages[1].querySelector(".caption-card"), {opacity: 0, y: 12}, {opacity: 1, y: 0, duration: 0.166667, ease: "expo.out", immediateRender: false}, 0.750000);

      tl.fromTo(pages[3].querySelector(".caption-card"), {opacity: 0, y: 12}, {opacity: 1, y: 0, duration: 0.166667, ease: "expo.out", immediateRender: false}, 2.800000);
      tl.fromTo(pages[4].querySelector(".caption-card"), {opacity: 0, y: 12}, {opacity: 1, y: 0, duration: 0.166667, ease: "expo.out", immediateRender: false}, 3.540000);
      tl.fromTo(pages[5].querySelector(".caption-card"), {opacity: 0, y: 12}, {opacity: 1, y: 0, duration: 0.166667, ease: "expo.out", immediateRender: false}, 4.430000);

      tl.fromTo(pages[7].querySelector(".caption-card"), {opacity: 0, y: 12}, {opacity: 1, y: 0, duration: 0.166667, ease: "expo.out", immediateRender: false}, 6.840000);
