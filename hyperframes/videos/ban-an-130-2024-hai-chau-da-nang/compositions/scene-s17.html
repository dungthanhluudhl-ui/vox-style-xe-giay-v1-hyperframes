<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #141414;
      color: #F7F4EC;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #141414;
    }

    .clip {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Background and Camera Zoom */
    #scene-bg {
      overflow: hidden;
      z-index: 10;
    }

    #bg-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Fixed brand bottom bar */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 14px;
      background: #FF6A1A;
      z-index: 100;
    }

    /* Overlay Layers */
    .overlay-layer {
      z-index: 40;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Overlay 1: Label "LỖI GIAO THÔNG" */
    #overlay-label {
      align-items: flex-start;
      padding-top: 360px;
    }

    .plate-box {
      display: flex;
      align-items: center;
      background: #141414;
      border: 4px solid #FF6A1A;
      border-radius: 18px;
      padding: 24px 44px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.75);
      gap: 22px;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    .plate-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #FF6A1A;
      flex-shrink: 0;
    }

    .label-text {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 56px;
      line-height: 1.2;
      letter-spacing: 3px;
      color: #F7F4EC;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Overlay 2: Warning Icon Badge */
    #overlay-warning {
      align-items: center;
      padding-top: 60px;
    }

    .warning-badge {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 250px;
      height: 250px;
      background: #141414;
      border: 5px solid #FF6A1A;
      border-radius: 44px;
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.85);
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    .warning-svg {
      overflow: visible;
    }

    /* Overlay 3: Punch-phrase "BƯỚC SANG ĐIỀU 330" */
    #overlay-punch {
      align-items: center;
      padding-top: 140px;
    }

    .punch-stamp {
      background: #141414;
      border: 6px solid #FF6A1A;
      border-radius: 26px;
      padding: 44px 64px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), inset 0 0 0 4px #141414, inset 0 0 0 7px rgba(255, 106, 26, 0.4);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    .stamp-sub {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 46px;
      line-height: 1.2;
      letter-spacing: 4px;
      color: #F7F4EC;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .stamp-main {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 90px;
      line-height: 1.1;
      letter-spacing: 6px;
      color: #FF6A1A;
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s17"
    data-width="1080"
    data-height="1920"
    data-duration="11.66"
  >
    <!-- Background Photo (giữ nguyên màu gốc của asset, không thêm vignette hay filter) -->
    <div id="scene-bg" class="clip" data-start="0" data-duration="11.66">
      <div id="bg-container" data-layout-allow-overflow="true">
        <img
          class="bg-img"
          data-layout-allow-overflow="true"
          src="assets/img-16-traffic-violation-penal-code-330.jpg"
          alt="Ranh giới giữa lỗi giao thông và Điều 330 BLHS"
        >
      </div>
    </div>

    <!-- Overlay 1: Lỗi Giao Thông (3.09s -> 5.89s) -->
    <div id="overlay-label" class="clip overlay-layer" data-start="3.09" data-duration="2.80">
      <div id="label-card" class="plate-box">
        <div class="plate-dot"></div>
        <span class="label-text">LỖI GIAO THÔNG</span>
      </div>
    </div>

    <!-- Overlay 2: Icon Warning (7.58s -> 10.18s) -->
    <div id="overlay-warning" class="clip overlay-layer" data-start="7.58" data-duration="2.60">
      <div id="warning-card" class="warning-badge">
        <svg class="warning-svg" viewBox="0 0 160 160" width="160" height="160">
          <path
            id="warning-triangle"
            d="M 80 18 L 146 136 A 6 6 0 0 1 140 146 L 20 146 A 6 6 0 0 1 14 136 Z"
            fill="none"
            stroke="#FF6A1A"
            stroke-width="12"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
          <line
            id="warning-bar"
            x1="80"
            y1="56"
            x2="80"
            y2="102"
            stroke="#F7F4EC"
            stroke-width="12"
            stroke-linecap="round"
          />
          <circle
            id="warning-dot"
            cx="80"
            cy="124"
            r="6"
            fill="#F7F4EC"
          />
        </svg>
      </div>
    </div>

    <!-- Overlay 3: Punch-phrase "BƯỚC SANG ĐIỀU 330" (10.28s -> 11.66s) -->
    <div id="overlay-punch" class="clip overlay-layer" data-start="10.28" data-duration="1.38">
      <div id="punch-card" class="punch-stamp">
        <div class="stamp-sub">BƯỚC SANG</div>
        <div class="stamp-main">ĐIỀU 330</div>
      </div>
    </div>

    <!-- Signature fixed bottom accent bar -->
    <div class="bottom-bar"></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Setup SVG path length for deterministic progressive draw
    const trianglePath = document.getElementById("warning-triangle");
    const triangleLength = trianglePath ? trianglePath.getTotalLength() : 386;
    if (trianglePath) {
      trianglePath.style.strokeDasharray = triangleLength;
      trianglePath.style.strokeDashoffset = triangleLength;
    }

    // 0.0s - 0.6s: Transition In "strike" on hero background
    tl.fromTo(
      "#bg-container",
      { scale: 1.15, opacity: 0 },
      { scale: 1.05, opacity: 1, duration: 0.6, ease: "power4.out" },
      0
    );

    // 0.6s - 3.0s: Slow camera drift focusing on the traffic violation side
    tl.to(
      "#bg-container",
      { scale: 1.08, x: -14, y: 0, duration: 2.4, ease: "sine.inOut" },
      0.6
    );

    // 3.09s - 5.89s: Overlay 1 ("LỖI GIAO THÔNG")
    tl.fromTo(
      "#label-card",
      { scale: 0.85, opacity: 0, y: 28 },
      { scale: 1.0, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      3.09
    );

    tl.to(
      "#bg-container",
      { scale: 1.12, x: -24, y: -10, duration: 2.9, ease: "sine.inOut" },
      3.0
    );

    tl.to(
      "#label-card",
      { opacity: 0, y: -18, duration: 0.35, ease: "power2.in" },
      5.45
    );

    // 6.0s - 9.0s: Camera motion transitions toward legal boundary & Điều 330
    tl.to(
      "#bg-container",
      { scale: 1.18, x: 26, y: -25, duration: 3.0, ease: "sine.inOut" },
      6.0
    );

    // 7.58s - 10.18s: Overlay 2 (Warning Icon)
    tl.fromTo(
      "#warning-card",
      { scale: 0, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.4, ease: "power3.out" },
      7.58
    );

    if (trianglePath) {
      tl.fromTo(
        "#warning-triangle",
        { strokeDashoffset: triangleLength },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        7.68
      );
    }

    tl.fromTo(
      "#warning-bar",
      { scaleY: 0, opacity: 0, transformOrigin: "50% 100%" },
      { scaleY: 1.0, opacity: 1, duration: 0.28, ease: "power3.out" },
      7.95
    );

    tl.fromTo(
      "#warning-dot",
      { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
      { scale: 1.0, opacity: 1, duration: 0.24, ease: "power3.out" },
      8.10
    );

    // Subtle alert pulse
    tl.to(
      "#warning-card",
      { scale: 1.08, duration: 0.14, yoyo: true, repeat: 1, ease: "power1.inOut" },
      8.60
    );

    tl.to(
      "#warning-card",
      { scale: 0.85, opacity: 0, duration: 0.35, ease: "power2.in" },
      9.75
    );

    // 9.0s - 11.66s: Final deep zoom into the justice gavel and legal boundary
    tl.to(
      "#bg-container",
      { scale: 1.25, x: 44, y: -38, duration: 2.66, ease: "power2.out" },
      9.0
    );

    // 10.28s - 11.66s: Overlay 3 ("BƯỚC SANG ĐIỀU 330") - Gavel Strike entrance
    tl.fromTo(
      "#punch-card",
      { scale: 1.65, opacity: 0, rotation: -3 },
      { scale: 1.0, opacity: 1, rotation: 0, duration: 0.36, ease: "power4.out" },
      10.28
    );

    tl.to(
      "#punch-card",
      { scale: 1.03, duration: 0.12, ease: "power1.out" },
      10.64
    );

    tl.to(
      "#punch-card",
      { scale: 1.0, duration: 0.2, ease: "power2.out" },
      10.76
    );

    // Register single paused master timeline
    window.__timelines["scene-s17"] = tl;
  </script>

    </template>
  </body>
</html>
