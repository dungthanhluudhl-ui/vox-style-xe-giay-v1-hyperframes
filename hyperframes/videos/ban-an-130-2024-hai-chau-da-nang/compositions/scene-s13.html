<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Background Photo: Full frame coverage */
      #bg-photo-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #bg-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 30%;
      }

      /* Background Variant "chart": 4 ruled horizontal lines + left orange ticks */
      .chart-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .chart-rule {
        position: absolute;
        left: 0;
        right: 0;
        height: 1.5px;
        background: rgba(20, 20, 20, 0.22);
      }
      .chart-tick {
        position: absolute;
        left: 0;
        width: 20px;
        height: 4px;
        background-color: #FF6A1A;
      }

      /* Content container for choreography and camera recoil */
      #scene-content {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Header container */
      #header-container {
        position: absolute;
        top: 180px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
      }
      .header-title {
        background-color: #141414;
        color: #F7F4EC;
        font-size: 40px;
        font-weight: 900;
        letter-spacing: 1.5px;
        padding: 14px 32px;
        border-radius: 8px;
        border-bottom: 4px solid #FF6A1A;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }

      /* SVG Diagram Annotations */
      #annotations-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 15;
      }
      .pointer-line {
        fill: none;
        stroke: #FF6A1A;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .target-marker {
        fill: #FF6A1A;
        stroke: #141414;
        stroke-width: 3;
      }

      /* Callout Badges */
      .callout-badge {
        position: absolute;
        background-color: #141414;
        padding: 16px 24px;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        z-index: 20;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
      .callout-tag {
        font-size: 19px;
        font-weight: 700;
        color: #FF6A1A;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      .callout-text {
        font-size: 38px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 1px;
      }

      /* Callout 1: Chấn động não */
      #callout-head {
        top: 420px;
        left: 60px;
        border-left: 6px solid #FF6A1A;
      }

      /* Callout 2: Xây xát khớp */
      #callout-joints {
        top: 700px;
        right: 60px;
        border-right: 6px solid #FF6A1A;
        align-items: flex-end;
      }

      /* Forensic Verdict Stamp Container (Punch-phrase) */
      #stamp-wrapper {
        position: absolute;
        top: 980px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 30;
      }
      #verdict-stamp {
        width: 740px;
        background-color: #141414;
        border: 6px solid #FF6A1A;
        outline: 3px dashed #FF6A1A;
        outline-offset: -14px;
        border-radius: 14px;
        padding: 28px 36px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
      }
      .stamp-badge {
        font-size: 24px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .stamp-punch-phrase {
        font-size: 78px;
        font-weight: 900;
        line-height: 1.1;
        color: #FF6A1A;
        letter-spacing: 2px;
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* Stamp impact burst ring */
      #stamp-impact {
        position: absolute;
        width: 800px;
        height: 260px;
        border: 4px solid #FF6A1A;
        border-radius: 20px;
        pointer-events: none;
        opacity: 0;
      }

      /* Signature Orange Bottom Bar */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 10px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s13"
      data-width="1080"
      data-height="1920"
      data-duration="11.64"
    >
      <div id="shot-clip" class="clip" data-start="0" data-duration="11.64">
        <!-- Main Background Image -->
        <div id="bg-photo-wrapper">
          <img
            id="bg-img"
            src="assets/img-04-forensic-injury-evaluation-diagram.jpg"
            alt="Sơ đồ giám định tổn thương"
          />
        </div>

        <!-- Ruled chart background variant elements -->
        <div class="chart-overlay">
          <div class="chart-rule" style="top: 384px;"></div>
          <div class="chart-tick" style="top: 383px;"></div>

          <div class="chart-rule" style="top: 768px;"></div>
          <div class="chart-tick" style="top: 767px;"></div>

          <div class="chart-rule" style="top: 1152px;"></div>
          <div class="chart-tick" style="top: 1151px;"></div>

          <div class="chart-rule" style="top: 1536px;"></div>
          <div class="chart-tick" style="top: 1535px;"></div>
        </div>

        <!-- Layered Content with GSAP Choreography -->
        <div id="scene-content">
          <!-- Document Header -->
          <div id="header-container">
            <div class="header-title">KẾT QUẢ GIÁM ĐỊNH PHÁP Y</div>
          </div>

          <!-- SVG Lines pointing to anatomical marks -->
          <svg id="annotations-svg" viewBox="0 0 1080 1920">
            <!-- Line to Head (Chấn động não) -->
            <path id="line-head" class="pointer-line" d="M 450 475 L 525 475" />
            <circle id="dot-head" class="target-marker" cx="530" cy="475" r="7" />

            <!-- Line to Joint/Elbow (Xây xát khớp) -->
            <path id="line-joints" class="pointer-line" d="M 630 755 L 555 755" />
            <circle id="dot-joints" class="target-marker" cx="550" cy="755" r="7" />
          </svg>

          <!-- Callout 1: Chấn động não -->
          <div id="callout-head" class="callout-badge">
            <span class="callout-tag">VÙNG SỌ NÃO</span>
            <span class="callout-text">CHẤN ĐỘNG NÃO</span>
          </div>

          <!-- Callout 2: Xây xát khớp -->
          <div id="callout-joints" class="callout-badge">
            <span class="callout-tag">CÁC VÙNG KHỚP</span>
            <span class="callout-text">XÂY XÁT KHỚP</span>
          </div>

          <!-- Stamp: Punch-phrase TỔN THƯƠNG 4% -->
          <div id="stamp-wrapper">
            <div id="stamp-impact"></div>
            <div id="verdict-stamp">
              <span class="stamp-badge">KẾT LUẬN PHÁP Y</span>
              <span class="stamp-punch-phrase">TỔN THƯƠNG 4%</span>
            </div>
          </div>
        </div>

        <!-- Constant Brand Accent Bottom Bar -->
        <div id="brand-bottom-bar"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1. Initial State Preparation
      gsap.set(["#callout-head", "#callout-joints", "#verdict-stamp", "#stamp-impact"], {
        opacity: 0
      });
      gsap.set(["#dot-head", "#dot-joints"], {
        scale: 0,
        transformOrigin: "50% 50%"
      });

      // Prepare SVG path drawing stroke lengths
      const lineHead = document.getElementById("line-head");
      const lineJoints = document.getElementById("line-joints");

      const lenHead = lineHead && lineHead.getTotalLength ? lineHead.getTotalLength() : 75;
      if (lineHead) {
        lineHead.style.strokeDasharray = lenHead;
        lineHead.style.strokeDashoffset = lenHead;
      }

      const lenJoints = lineJoints && lineJoints.getTotalLength ? lineJoints.getTotalLength() : 75;
      if (lineJoints) {
        lineJoints.style.strokeDasharray = lenJoints;
        lineJoints.style.strokeDashoffset = lenJoints;
      }

      // 2. Camera Motion: Subtle punch entrance then slow cinematic zoom
      tl.fromTo(
        "#bg-photo-wrapper",
        { scale: 1.05, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0
      );

      tl.fromTo(
        "#bg-img",
        { scale: 1.0 },
        { scale: 1.07, duration: 11.64, ease: "none" },
        0
      );

      // 3. Header reveal
      tl.fromTo(
        "#header-container",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.25
      );

      // 4. Overlay 1 (1.63s): CHẤN ĐỘNG NÃO
      tl.fromTo(
        "#callout-head",
        { x: -40, opacity: 0, scale: 0.92 },
        { x: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        1.63
      );

      if (lineHead) {
        tl.to(
          lineHead,
          { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
          1.75
        );
      }
      tl.fromTo(
        "#dot-head",
        { scale: 0 },
        { scale: 1, duration: 0.25, ease: "power3.out" },
        1.9
      );

      // 5. Overlay 2 (4.42s): XÂY XÁT KHỚP
      tl.fromTo(
        "#callout-joints",
        { x: 40, opacity: 0, scale: 0.92 },
        { x: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        4.42
      );

      if (lineJoints) {
        tl.to(
          lineJoints,
          { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
          4.55
        );
      }
      tl.fromTo(
        "#dot-joints",
        { scale: 0 },
        { scale: 1, duration: 0.25, ease: "power3.out" },
        4.7
      );

      // 6. Overlay 3 (6.82s): Punch-phrase "TỔN THƯƠNG 4%" (Forensic Stamp punch-down)
      tl.fromTo(
        "#verdict-stamp",
        { scale: 2.2, opacity: 0, rotation: -6 },
        { scale: 1, opacity: 1, rotation: -2, duration: 0.35, ease: "power4.in" },
        6.82
      );

      // Impact burst and micro camera recoil on stamp landing
      tl.fromTo(
        "#stamp-impact",
        { scale: 0.85, opacity: 0.95 },
        { scale: 1.25, opacity: 0, duration: 0.45, ease: "power2.out" },
        7.17
      );
      tl.fromTo(
        "#scene-content",
        { y: -8 },
        { y: 0, duration: 0.2, ease: "power2.out" },
        7.17
      );

      // Register paused master timeline to HyperFrames
      window.__timelines["scene-s13"] = tl;
    </script>
  
    </template>
  </body>
</html>
