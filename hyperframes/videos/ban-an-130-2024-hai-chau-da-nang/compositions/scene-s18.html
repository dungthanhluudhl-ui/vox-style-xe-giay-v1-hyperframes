      .skeleton-lines-group {

        transform: rotate(-3deg);

      /* Khung chứa Overlay 2: Punch Phrase "CỐ Ý CẢN TRỞ" (y: 1140px, an toàn trong usable band 160-1390px) */
      .punch-phrase-stage {
        position: absolute;
        top: 1140px;

        width: 960px;

        width: 960px;

        width: 12px;

        font-size: 70px;

    <div
      id="root"
      data-composition-id="scene-s18"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="9"
    >
      <!-- Shot S18-1: Trích lục Cáo trạng -->
      <div id="shot-s18-1" class="clip" data-start="0" data-duration="9">
        <!-- Vùng văn bản Cáo trạng -->
        <div class="document-stage">
          <div id="document-sheet" class="document-sheet">
            <!-- Header thể thức văn bản tố tụng -->
            <div class="doc-header">
              <div>
                <div class="agency-title">Viện kiểm sát nhân dân</div>
                <div class="agency-sub">Hồ sơ vụ án hình sự</div>
              </div>
              <div class="state-title">
                <div class="state-name">Cộng hòa Xã hội Chủ nghĩa Việt Nam</div>
                <div class="state-motto">Độc lập - Tự do - Hạnh phúc</div>
                <div class="state-divider"></div>
              </div>
            </div>

            <!-- Tiêu đề Cáo trạng -->
            <div class="doc-title-block">
              <h1 class="doc-main-title">CÁO TRẠNG</h1>
              <div class="doc-sub-title">Căn cứ khởi tố & Điều luật áp dụng</div>
            </div>

            <!-- Phần trích lục điều luật thuần đồ họa -->
            <div class="law-citation-card">
              <!-- Vị trí hiển thị Overlay 1: KHOẢN 1 ĐIỀU 330 -->
              <div class="citation-target-slot">
                <div id="label-clause-tag" class="clause-label-badge">
                  KHOẢN 1 ĐIỀU 330
                </div>
              </div>

              <!-- Dải đường kẻ đồ họa mô phỏng văn bản pháp lý, không bịa text luật -->
              <div class="skeleton-lines-group">
                <div class="doc-line doc-line-w95"></div>
                <div class="doc-line doc-line-w90"></div>
                <div class="doc-line doc-line-w80"></div>
                <div class="doc-line doc-line-w65"></div>
              </div>

              <div class="stamp-footer">
                <div class="doc-stamp">ĐÃ TRÍCH LỤC</div>
              </div>

          </div>
        </div>

        <!-- Khung Overlay 2: Punch Phrase "CỐ Ý CẢN TRỞ" -->
        <div class="punch-phrase-stage">
          <div id="punch-card-box" class="punch-card">
            <div id="punch-pillar" class="punch-pillar-bar"></div>
            <div class="punch-text-col">

      <!-- Thanh cam nhận diện cố định mép đáy -->
      <div class="bottom-orange-bar"></div>

    <script>
      // Đăng ký timeline duy nhất và PAUSED trên window.__timelines["scene-s18"]
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s18"] = tl;

      // 1. Trạng thái khởi tạo explicit (tránh hiển thị trước khi tween kích hoạt)
      gsap.set("#label-clause-tag", { opacity: 0, scale: 0.85 });
      gsap.set("#punch-card-box", { opacity: 0, y: 30, scale: 0.94 });
      gsap.set("#punch-pillar", { scaleY: 0 });

      // 2. Transition In: Hiệu ứng "Peel" bóc dán trang văn bản Cáo trạng (0.05s -> 0.9s)
      tl.fromTo(
        "#document-sheet",
        {
          opacity: 0,
          y: -110,
          rotationX: 20,
          rotationZ: -2,
          scale: 0.94
        },
        {
          opacity: 1,
          y: 0,
          rotationX: 0,
          rotationZ: 0,
          scale: 1,
          duration: 0.85,
          ease: "power3.out"
        },
        0.05
      );

      // Chuyển động nhẹ liên tục để tài liệu sống động chống tĩnh (0.9s -> 9.0s)
      tl.to(
        "#document-sheet",
        {
          scale: 1.012,
          y: 6,
          duration: 8.1,
          ease: "sine.inOut"
        },
        0.9
      );

      // 3. Overlay 1: "KHOẢN 1 ĐIỀU 330" tại 2.41s, holdMs = 3000ms -> ẩn lúc 5.41s
      tl.to(
        "#label-clause-tag",
        {
          opacity: 1,
          scale: 1,
          duration: 0.4,
          ease: "power3.out"
        },
        2.41
      );

      tl.to(
        "#label-clause-tag",
        {
          opacity: 0,
          duration: 0.3,
          ease: "power2.in"
        },
        5.41
      );

      // 4. Overlay 2: Punch Phrase "CỐ Ý CẢN TRỞ" tại 5.97s, holdMs = 2600ms -> ẩn lúc 8.57s
      tl.to(
        "#punch-card-box",
        {
          opacity: 1,
          y: 0,
          scale: 1,
          duration: 0.45,
          ease: "power3.out"
        },
        5.97
      );

      tl.to(
        "#punch-pillar",
        {
          scaleY: 1,
          duration: 0.35,
          ease: "power2.out"
        },
        6.15
      );

      tl.to(
        "#punch-card-box",
        {
          opacity: 0,
          y: -15,
          duration: 0.3,
          ease: "power2.in"
        },
        8.57
      );
    </script>
