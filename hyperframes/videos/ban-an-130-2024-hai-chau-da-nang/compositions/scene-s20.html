    <script>
      const tl = gsap.timeline({ paused: true });

      // SVG path length setup for Ban Icon
      const banCircle = document.getElementById("ban-circle");
      const banSlash = document.getElementById("ban-slash");
      const circleLen = banCircle.getTotalLength();
      const slashLen = banSlash.getTotalLength();

      banCircle.style.strokeDasharray = circleLen;
      banCircle.style.strokeDashoffset = circleLen;
      banSlash.style.strokeDasharray = slashLen;
      banSlash.style.strokeDashoffset = slashLen;

      // 1. Subtle camera zoom-out throughout scene
      tl.fromTo(
        "#scene-camera",
        { scale: 1.05 },
        { scale: 1.0, duration: 11.92, ease: "none" },
        0
      );

      // 2. Initial Entrance (Punch arrival at T = 0.1s - 0.6s)
      tl.fromTo(
        "#header-block",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.1
      );

      tl.fromTo(
        "#col-left",
        { scale: 0.86, opacity: 0, x: -25 },
        { scale: 1, opacity: 1, x: 0, duration: 0.6, ease: "power3.out" },
        0.25
      );

      tl.fromTo(
        "#col-right",
        { scale: 0.86, opacity: 0, x: 25 },
        { scale: 1, opacity: 1, x: 0, duration: 0.6, ease: "power3.out" },
        0.38
      );

      tl.fromTo(
        "#vs-badge",
        { scale: 0, opacity: 0, rotation: -90 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "power3.out" },
        0.58
      );

      // Hide overlays initially
      tl.set("#ban-visual-area", { opacity: 0 }, 0);
      tl.set("#label-banner", { opacity: 0 }, 0);
      tl.set("#punch-card", { opacity: 0 }, 0);

      // 3. Overlay Icon BAN (T = 1.27s / 180550ms)
      tl.set("#ban-visual-area", { opacity: 1 }, 1.27);
      tl.fromTo(
        banCircle,
        { strokeDashoffset: circleLen },
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        1.27
      );
      tl.fromTo(
        banSlash,
        { strokeDashoffset: slashLen },
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        1.45
      );
      tl.fromTo(
        "#ban-stamp",
        { scale: 0, opacity: 0, rotation: 12 },
        { scale: 1, opacity: 1, rotation: -5, duration: 0.4, ease: "power3.out" },
        1.55
      );
      tl.to(
        "#col-right",
        { x: 6, duration: 0.04, yoyo: true, repeat: 3, ease: "power1.inOut" },
        1.6
      );

      // 4. Overlay Label: KHÔNG ĐÁNH ĐỒNG (T = 6.18s / 185460ms)
      tl.fromTo(
        "#label-banner",
        { y: 30, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        6.18
      );

      // 5. Overlay Punch-Phrase: CẢN TRỞ LÀ TRỌNG TÂM (T = 9.98s / 189260ms)
      tl.fromTo(
        "#punch-card",
        { y: 35, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" },
        9.98
      );
      tl.fromTo(
        "#punch-tag",
        { scale: 0.8, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "power2.out" },
        10.15
      );

      window.__timelines["scene-s20"] = tl;
    </script>
