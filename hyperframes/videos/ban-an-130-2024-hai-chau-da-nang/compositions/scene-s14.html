<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Permanent Brand Signature Bar */
      .bottom-accent-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 8px;
        background-color: #ff6a1a;
        z-index: 100;
      }

      /* 3D Viewport & Split Photo Background */
      .scene-viewport {
        position: absolute;
        inset: 0;
        perspective: 1400px;
        background-color: #f5f0e4;
      }
      .bg-photo-wrapper {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        transform-style: preserve-3d;
        will-change: transform, opacity;
      }
      .bg-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Overlay 1: Label VI PHẠM HÀNH CHÍNH? */
      .label-clip {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 360px;
        pointer-events: none;
        z-index: 20;
      }
      .label-card {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        background-color: #141414;
        border: 3px solid #ff6a1a;
        border-radius: 14px;
        padding: 16px 32px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
        will-change: transform, opacity;
      }
      .label-dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background-color: #ff6a1a;
        flex-shrink: 0;
      }
      .label-title {
        font-size: 46px;
        font-weight: 900;
        letter-spacing: 1px;
        line-height: 1.2;
        color: #f7f4ec;
        margin: 0;
        white-space: nowrap;
      }

      /* Overlay 2: Punch-phrase SAO THÀNH HÌNH SỰ? */
      .punch-clip {
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
        z-index: 30;
      }
      .punch-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #141414;
        border: 4px solid #ff6a1a;
        border-radius: 18px;
        padding: 32px 52px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
        max-width: 940px;
        will-change: transform, opacity;
      }
      .punch-lead {
        font-size: 58px;
        font-weight: 900;
        color: #f7f4ec;
        line-height: 1.2;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 12px;
        text-align: center;
      }
      .punch-highlight {
        display: inline-block;
        background-color: #ff6a1a;
        color: #141414;
        font-size: 70px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: 2px;
        padding: 10px 28px;
        border-radius: 8px;
        text-transform: uppercase;
        text-align: center;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s14"
      data-width="1080"
      data-height="1920"
      data-duration="6.76"
    >
      <!-- Shot S14-1: Background Split Image (img-15) -->
      <section id="shot-bg" class="clip" data-start="0" data-duration="6.76">
        <div class="scene-viewport">
          <div id="bgPhotoWrapper" class="bg-photo-wrapper">
            <img
              class="bg-photo"
              src="assets/img-15-traffic-violation-vs-penal-code.jpg"
              alt="Biên bản vi phạm giao thông đối chiếu Bộ luật Hình sự"
            />
          </div>
        </div>
      </section>

      <!-- Overlay 1: Label VI PHẠM HÀNH CHÍNH? (at 1.70s, hold 2.50s) -->
      <section
        id="shot-label"
        class="clip label-clip"
        data-start="1.7"
        data-duration="2.5"
      >
        <div id="labelCard" class="label-card">
          <span class="label-dot"></span>
          <h2 class="label-title">VI PHẠM HÀNH CHÍNH?</h2>
        </div>
      </section>

      <!-- Overlay 2: Punch-phrase SAO THÀNH HÌNH SỰ? (at 5.76s to 6.76s) -->
      <section
        id="shot-punch"
        class="clip punch-clip"
        data-start="5.76"
        data-duration="1.0"
      >
        <div id="punchContainer" class="punch-container">
          <div class="punch-lead">SAO THÀNH</div>
          <div class="punch-highlight">HÌNH SỰ?</div>
        </div>
      </section>

      <!-- Permanent Bottom Accent Bar -->
      <div class="bottom-accent-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // S14-1 Entrance: 3D Flip revealing the split between traffic ticket and penal code
      tl.fromTo(
        "#bgPhotoWrapper",
        { rotationY: -45, scale: 0.88, opacity: 0 },
        { rotationY: 0, scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
        0
      );

      // Overlay 1: "VI PHẠM HÀNH CHÍNH?" entrance at 1.70s and graceful exit before 4.20s
      tl.fromTo(
        "#labelCard",
        { y: 35, scale: 0.9, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.7
      );
      tl.to(
        "#labelCard",
        { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" },
        3.95
      );

      // Overlay 2: "SAO THÀNH HÌNH SỰ?" authoritative punch entrance at 5.76s
      tl.fromTo(
        "#punchContainer",
        { scale: 1.25, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power4.out" },
        5.76
      );

      window.__timelines["scene-s14"] = tl;
    </script>
  
    </template>
  </body>
</html>
