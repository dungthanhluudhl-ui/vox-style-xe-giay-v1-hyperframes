    /* Lower Section: Resolution & Punch Phrase (Y: 940px -> 1340px) */

    .punch-eyebrow {

    /* Shotlist Overlay 3: Punch Phrase */

      letter-spacing: 2px;
      color: #FF6A1A;

    .punch-desc {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.35;
      max-width: 900px;
    }
  </style>

  <div id="root" data-composition-id="scene-s24" data-start="0" data-width="1080" data-height="1920" data-duration="10">
    <section id="scene-s24" class="clip" data-start="0" data-duration="10">

      <!-- Chart Background: ruled lines at 20, 40, 60, 80% with orange tick marks -->
      <div class="chart-background">
        <div class="chart-line" style="top: 384px;"><div class="chart-tick"></div></div>
        <div class="chart-line" style="top: 768px;"><div class="chart-tick"></div></div>
        <div class="chart-line" style="top: 1152px;"><div class="chart-tick"></div></div>
        <div class="chart-line" style="top: 1536px;"><div class="chart-tick"></div></div>
      </div>

      <!-- Camera Rig for slow zoom-in -->
      <div id="camera-rig">
        <div id="scene-content">

          <!-- Header Section -->
          <div id="header-block">
            <div class="header-tag">
              <span class="tag-dot"></span>
              <span class="hf-text-ink">ĐỊNH HƯỚNG TƯ PHÁP NGƯỜI DƯỚI 18 TUỔI</span>
            </div>
            <h1 class="main-title hf-text-ink">CÁN CÂN TƯ PHÁP NGƯỜI CHƯA THÀNH NIÊN</h1>
            <div class="sub-title hf-text-ink">CÂN BẰNG TÍNH NGHIÊM MINH VÀ TÍNH NHÂN ĐẠO</div>
          </div>

          <!-- Hero Diagram: The Judicial Scale -->
          <div id="scale-wrapper">
            <!-- Fulcrum Stand -->
            <div id="fulcrum-base"></div>
            <div id="fulcrum-post"></div>
            <div id="fulcrum-apex">
              <div class="fulcrum-pin"></div>
            </div>

            <!-- Dynamic Beam -->
            <div id="scale-beam">
              <!-- Left Pan Assembly (Accountability) -->
              <div id="left-pan-hanger" class="pan-assembly">
                <svg class="pan-cables-svg" viewBox="0 0 280 120">
                  <line x1="140" y1="0" x2="30" y2="118" stroke="#141414" stroke-width="2.5" stroke-dasharray="5 3" />
                  <line x1="140" y1="0" x2="250" y2="118" stroke="#141414" stroke-width="2.5" stroke-dasharray="5 3" />
                </svg>
                <div class="pan-tray-base"></div>
                <div id="left-pan-card" class="pan-card">
                  <span class="card-header-label hf-text-ink">TRÁCH NHIỆM HÌNH SỰ</span>
                  <!-- Shotlist Overlay 1: Label -->
                  <div id="badge-punishment" class="hf-hl-orange">VẪN BỊ XỬ LÝ</div>
                  <span class="card-footer-note hf-text-ink">Không mặc định miễn trừ</span>
                </div>
              </div>

              <!-- Right Pan Assembly (Education & Reformation) -->
              <div id="right-pan-hanger" class="pan-assembly">
                <svg class="pan-cables-svg" viewBox="0 0 280 120">
                  <line x1="140" y1="0" x2="30" y2="118" stroke="#141414" stroke-width="2.5" stroke-dasharray="5 3" />
                  <line x1="140" y1="0" x2="250" y2="118" stroke="#141414" stroke-width="2.5" stroke-dasharray="5 3" />
                </svg>
                <div class="pan-tray-base"></div>
                <div id="right-pan-card" class="pan-card">

                  <div id="factor-1" class="factor-pill">ĐỘ TUỔI & TÂM LÝ</div>
                  <div id="factor-2" class="factor-pill">KHẢ NĂNG GIÁO DỤC</div>
                  <div id="factor-3" class="factor-pill factor-lead">HƯỚNG THIỆN PHỤC HỒI</div>

              <!-- Shotlist Overlay 2: Icon scale -->
              <div id="scale-icon-wrap">
                <svg id="scale-icon-svg" viewBox="0 0 100 100" width="56" height="56">
                  <line class="draw-path" x1="20" y1="88" x2="80" y2="88" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round"/>
                  <line class="draw-path" x1="50" y1="20" x2="50" y2="88" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round"/>
                  <line class="draw-path" x1="18" y1="36" x2="82" y2="44" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round"/>
                  <path class="draw-path" d="M 18 36 L 8 62 L 34 62 Z" fill="none" stroke="#FF6A1A" stroke-width="3" stroke-linejoin="round"/>
                  <path class="draw-path" d="M 82 44 L 66 74 L 94 74 Z" fill="none" stroke="#FF6A1A" stroke-width="3" stroke-linejoin="round"/>

              Hình phạt kết hợp chặt chẽ với giáo dục, cải tạo và mở ra lộ trình làm lại cuộc đời cho người chưa thành niên.

      <!-- Persistent Brand Bottom Bar -->

  <script>
    // 1. Initialize Paused GSAP Master Timeline
    const tl = gsap.timeline({ paused: true });

    // 2. Prepare SVG Icon Path Draw
    document.querySelectorAll("#scale-icon-svg .draw-path").forEach((p) => {
      const len = p.getTotalLength ? p.getTotalLength() : 120;
      p.style.strokeDasharray = len + "px";
      p.style.strokeDashoffset = len + "px";
    });

    // 3. Camera slow zoom-in across 10 seconds
    tl.to("#camera-rig", {
      scale: 1.05,
      duration: 10.0,
      ease: "none"
    }, 0);

    // 4. Entrance animation: grow
    tl.fromTo("#scene-content",
      { scale: 0.95, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
      0
    );

    // Header reveal
    tl.fromTo("#header-block",
      { y: -20, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.1
    );

    // Scale structure entrance
    tl.fromTo("#scale-wrapper",
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
      0.2
    );

    // 5. SHOTLIST OVERLAY 1: Label "VẪN BỊ XỬ LÝ" at 0.83s
    tl.fromTo("#badge-punishment",
      { scale: 1.8, opacity: 0, rotation: 6 },
      { scale: 1, opacity: 1, rotation: -2, duration: 0.45, ease: "power3.out" },
      0.83
    );

    // Left pan dips slightly to reflect initial accountability enforcement
    tl.to("#scale-beam", { rotation: -4.5, duration: 0.6, ease: "power2.out" }, 1.0);
    tl.to("#left-pan-hanger", { rotation: 4.5, duration: 0.6, ease: "power2.out" }, 1.0);
    tl.to("#right-pan-hanger", { rotation: 4.5, duration: 0.6, ease: "power2.out" }, 1.0);

    // 6. Right side factors arrive progressively
    tl.fromTo("#factor-1",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      4.2
    );

    tl.fromTo("#factor-2",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      4.9
    );

    tl.fromTo("#factor-3",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      5.6
    );

    // 7. Visual Relationship Shift: The scale tilts decisively toward reformation & education
    tl.to("#scale-beam", { rotation: 8.5, duration: 1.4, ease: "power3.inOut" }, 6.2);
    tl.to("#left-pan-hanger", { rotation: -8.5, duration: 1.4, ease: "power3.inOut" }, 6.2);
    tl.to("#right-pan-hanger", { rotation: -8.5, duration: 1.4, ease: "power3.inOut" }, 6.2);

    // 8. Lower Resolution Card entrance (t = 7.6s)
    tl.fromTo("#resolution-card",
      { y: 30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      7.6
    );

    // 9. SHOTLIST OVERLAY 2: Icon "scale" drawing at 8.29s
    tl.to("#scale-icon-svg .draw-path", {
      strokeDashoffset: 0,
      duration: 0.5,
      stagger: 0.06,
      ease: "power2.out"
    }, 8.29);

    // 10. SHOTLIST OVERLAY 3: Punch Phrase "CƠ HỘI SỬA SAI" arrives with high impact
    tl.fromTo("#punch-title",
      { scale: 0.9, opacity: 0, y: 15 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      8.8
    );

    tl.fromTo("#punch-desc",
      { opacity: 0, y: 10 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
      9.1
    );

    // 11. Register composition timeline on window.__timelines
    window.__timelines["scene-s24"] = tl;
  </script>
