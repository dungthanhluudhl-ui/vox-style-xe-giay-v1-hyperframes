<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #141414;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Background image & camera rig */
    #camera-rig {
      position: absolute;
      inset: 0;
      transform-origin: 50% 30%;
      will-change: transform;
    }

    #bg-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Overlay 1: Label ("LỄ HỘI PHÁO HOA") */
    .label-wrapper {
      position: absolute;
      top: 240px;
      left: 60px;
      display: flex;
      align-items: center;
      z-index: 10;
    }

    .label-card {
      background-color: #141414;
      padding: 16px 28px 16px 22px;
      display: inline-flex;
      align-items: center;
      gap: 16px;
      border-radius: 4px;
      border-left: 8px solid #FF6A1A;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    .label-dot {
      width: 14px;
      height: 14px;
      background-color: #FF6A1A;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .label-text {
      color: #F7F4EC;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.2;
    }

    /* Overlay 2: Punch phrase ("ĐÊM SÔNG HÀN") */
    .punch-wrapper {
      position: absolute;
      top: 360px;
      left: 60px;
      right: 60px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      z-index: 20;
    }

    .punch-card {
      position: relative;
      background-color: #141414;
      padding: 24px 42px 24px 30px;
      display: inline-flex;
      align-items: center;
      gap: 22px;
      border-radius: 4px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
      transform-origin: 0% 50%;
    }

    .punch-bar {
      width: 12px;
      height: 72px;
      background-color: #FF6A1A;
      flex-shrink: 0;
      transform-origin: 50% 100%;
    }

    .punch-text {
      color: #F7F4EC;
      font-size: 68px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Fixed bottom signature brand bar */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background-color: #FF6A1A;
      z-index: 100;
      pointer-events: none;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s01"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="5.26"
  >
    <!-- Background Photo Shot S01-1 (Full frame 1080x1920) -->
    <div id="shot-bg" class="clip" data-start="0" data-duration="5.26">
      <div id="camera-rig" data-layout-allow-overflow="true">
        <img
          id="bg-photo"
          src="assets/img-13-night-traffic-fireworks-city.jpg"
          alt="Đêm pháo hoa Đà Nẵng"
          data-layout-allow-overflow="true"
        />
      </div>
    </div>

    <!-- Overlay 1: Label "LỄ HỘI PHÁO HOA" (atMs: 500, holdMs: 2500) -->
    <div id="clip-label" class="clip" data-start="0.5" data-duration="2.5" style="pointer-events: none;">
      <div class="label-wrapper">
        <div id="label-card" class="label-card hf-plate-ink">
          <span class="label-dot"></span>
          <span class="label-text">LỄ HỘI PHÁO HOA</span>
        </div>
      </div>
    </div>

    <!-- Overlay 2: Punch Phrase "ĐÊM SÔNG HÀN" (atMs: 3200, holdMs: 1800) -->
    <div id="clip-punch" class="clip" data-start="3.2" data-duration="1.8" style="pointer-events: none;">
      <div class="punch-wrapper">
        <div id="punch-card" class="punch-card hf-plate-ink">
          <div class="punch-bar"></div>
          <span class="punch-text">ĐÊM SÔNG HÀN</span>
        </div>
      </div>
    </div>

    <!-- Fixed Style DNA Signature Bottom Bar -->
    <div id="clip-bottom-bar" class="clip" data-start="0" data-duration="5.26" style="pointer-events: none;">
      <div class="bottom-bar"></div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. Camera Motion: Zoom-through entrance into slow drift towards fireworks
    tl.fromTo(
      "#camera-rig",
      { scale: 1.18, opacity: 0.75 },
      { scale: 1.02, opacity: 1, duration: 0.7, ease: "power2.out" },
      0
    );
    tl.to(
      "#camera-rig",
      { scale: 1.08, duration: 4.56, ease: "none" },
      0.7
    );

    // 2. Overlay Label Entrance & Exit ("LỄ HỘI PHÁO HOA": 0.5s - 3.0s)
    tl.fromTo(
      "#label-card",
      { x: -36, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      0.5
    );
    tl.to(
      "#label-card",
      { x: -16, opacity: 0, duration: 0.35, ease: "power2.in" },
      2.65
    );

    // 3. Punch Phrase Entrance & Exit ("ĐÊM SÔNG HÀN": 3.2s - 5.0s)
    tl.fromTo(
      "#punch-card",
      { scale: 0.88, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      3.2
    );
    tl.fromTo(
      ".punch-bar",
      { scaleY: 0 },
      { scaleY: 1, duration: 0.35, ease: "power2.out" },
      3.3
    );
    tl.to(
      "#punch-card",
      { opacity: 0, y: 12, duration: 0.35, ease: "power2.in" },
      4.65
    );

    // Single paused timeline registered under composition ID
    window.__timelines["scene-s01"] = tl;
  </script>

    </template>
  </body>
</html>
