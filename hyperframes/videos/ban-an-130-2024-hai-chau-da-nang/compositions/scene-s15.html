<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    /* Grid nền phong cách Vox DNA */
    .vox-grid-bg {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      background-image: 
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      z-index: 1;
    }

    /* Quy ước .clip của HyperFrames */
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Container ảnh nền full-frame */
    .photo-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 2;
    }
    .bg-photo-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      will-change: transform;
    }

    /* Dải màu cam thương hiệu mép dưới */
    .bottom-brand-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 10px;
      background-color: #FF6A1A;
      z-index: 99;
    }

    /* Overlay 1: Nhãn hồ sơ "HÀNH VI TRƯỚC ĐÓ" */
    .overlay-label-container {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      padding-top: 240px;
      padding-left: 60px;
      z-index: 20;
      pointer-events: none;
    }
    .label-plate {
      display: inline-flex;
      align-items: center;
      background-color: #141414;
      border-left: 10px solid #FF6A1A;
      padding: 18px 36px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      will-change: transform, opacity;
    }
    .label-title {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #F7F4EC;
      text-transform: uppercase;
      line-height: 1.2;
    }

    /* Overlay 2: Biểu tượng cán bộ "person" tự vẽ */
    .overlay-icon-container {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 25;
      pointer-events: none;
    }
    .icon-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #141414;
      border: 4px solid #FF6A1A;
      border-radius: 28px;
      padding: 32px 40px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.5);
      will-change: transform, opacity;
    }
    .icon-svg {
      width: 160px;
      height: 160px;
      display: block;
    }

    /* Overlay 3: Punch-phrase "ĐANG THI HÀNH CÔNG VỤ" */
    .overlay-punch-container {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 600px;
      z-index: 30;
      pointer-events: none;
    }
    .punch-card {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      background-color: #FF6A1A;
      padding: 24px 44px;
      border-radius: 12px;
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.55);
      will-change: transform, opacity;
    }
    .punch-text {
      font-size: 58px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #141414;
      text-transform: uppercase;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s15"
    data-width="1080"
    data-height="1920"
    data-duration="12.2"
  >
    <!-- Lớp lưới nền tiêu chuẩn Vox -->
    <div class="vox-grid-bg"></div>

    <!-- Shot S15-1: Ảnh nền minh họa full-frame -->
    <div id="shot-s15-1" class="clip" data-start="0" data-duration="12.2">
      <div id="photo-frame" class="photo-viewport">
        <img
          id="bg-photo-img"
          class="bg-photo-img"
          src="assets/img-05-police-patrol-duty-assignment.jpg"
          alt="Chiến sĩ công an và phân công nhiệm vụ"
        />
      </div>
    </div>

    <!-- Overlay 1: Nhãn "HÀNH VI TRƯỚC ĐÓ" (3.24s - 6.04s) -->
    <div id="clip-overlay-label" class="clip overlay-label-container" data-start="3.24" data-duration="2.8">
      <div id="label-plate" class="label-plate hf-plate-ink">
        <span class="label-title hf-text-light">HÀNH VI TRƯỚC ĐÓ</span>
      </div>
    </div>

    <!-- Overlay 2: Icon "person" tự vẽ theo chuẩn SVG Vox (8.4s - 10.8s) -->
    <div id="clip-overlay-icon" class="clip overlay-icon-container" data-start="8.4" data-duration="2.4">
      <div id="icon-badge" class="icon-badge hf-plate-ink">
        <svg class="icon-svg" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Đầu nhân vật -->
          <circle
            id="icon-head-path"
            cx="80"
            cy="52"
            r="24"
            stroke="#FF6A1A"
            stroke-width="10"
            stroke-linecap="round"
          />
          <!-- Thân nhân vật -->
          <path
            id="icon-body-path"
            d="M 36 134 C 36 102, 58 92, 80 92 C 102 92, 124 102, 124 134"
            stroke="#F7F4EC"
            stroke-width="10"
            stroke-linecap="round"
          />
        </svg>
      </div>
    </div>

    <!-- Overlay 3: Punch-phrase "ĐANG THI HÀNH CÔNG VỤ" (10.8s - 12.2s) -->
    <div id="clip-overlay-punch" class="clip overlay-punch-container" data-start="10.8" data-duration="1.4">
      <div id="punch-card" class="punch-card hf-hl-orange">
        <span class="punch-text hf-text-ink">ĐANG THI HÀNH CÔNG VỤ</span>
      </div>
    </div>

    <!-- Thanh cam cố định mép đáy -->
    <div class="bottom-brand-bar"></div>
  </div>

  <script>
    // Khởi tạo timeline paused bắt buộc theo chuẩn HyperFrames
    const tl = gsap.timeline({ paused: true });

    // 1. Setup hiệu ứng tự vẽ SVG cho icon Person
    const headPath = document.getElementById("icon-head-path");
    const bodyPath = document.getElementById("icon-body-path");
    let headLen = 151;
    let bodyLen = 140;

    if (headPath && bodyPath) {
      headLen = Math.ceil(headPath.getTotalLength());
      bodyLen = Math.ceil(bodyPath.getTotalLength());
      headPath.style.strokeDasharray = headLen + "px";
      headPath.style.strokeDashoffset = headLen + "px";
      bodyPath.style.strokeDasharray = bodyLen + "px";
      bodyPath.style.strokeDashoffset = bodyLen + "px";
    }

    // 2. Entrance "unfold" cho ảnh nền và chuyển động Camera Pan/Zoom
    // Mở ra dạng unfold từ trên xuống dưới
    tl.fromTo(
      "#photo-frame",
      { clipPath: "polygon(0 0, 100% 0, 100% 0, 0 0)", opacity: 0 },
      { clipPath: "polygon(0 0, 100% 0, 100% 100%, 0 100%)", opacity: 1, duration: 0.85, ease: "power3.out" },
      0
    );

    // Zoom chậm từ góc trên (huy hiệu) sang quyết định phân công nhiệm vụ (hạ góc nhìn)
    tl.fromTo(
      "#bg-photo-img",
      { scale: 1.05, x: 0, y: 0 },
      { scale: 1.22, x: -35, y: -80, duration: 12.2, ease: "none" },
      0
    );

    // 3. Overlay 1: Nhãn "HÀNH VI TRƯỚC ĐÓ" (3.24s -> 6.04s)
    tl.fromTo(
      "#label-plate",
      { x: -60, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      3.24
    );
    tl.to(
      "#label-plate",
      { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
      5.65
    );

    // 4. Overlay 2: Icon "person" tự vẽ (8.4s -> 10.8s)
    tl.fromTo(
      "#icon-badge",
      { scale: 0.7, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      8.4
    );
    tl.fromTo(
      "#icon-head-path",
      { strokeDashoffset: headLen },
      { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
      8.5
    );
    tl.fromTo(
      "#icon-body-path",
      { strokeDashoffset: bodyLen },
      { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
      8.7
    );
    tl.to(
      "#icon-badge",
      { opacity: 0, scale: 0.9, duration: 0.3, ease: "power2.in" },
      10.45
    );

    // 5. Overlay 3: Punch-phrase "ĐANG THI HÀNH CÔNG VỤ" (10.8s -> 12.2s)
    tl.fromTo(
      "#punch-card",
      { scale: 0.85, opacity: 0, y: 35 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      10.8
    );

    // Đăng ký timeline vào hệ thống HyperFrames
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s15"] = tl;
  </script>

    </template>
  </body>
</html>
