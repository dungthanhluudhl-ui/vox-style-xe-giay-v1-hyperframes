      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }

    *, *::before, *::after {

    }

    body {

      font-weight: 700;
      line-height: 1.3;

      top: 14px;

      font-weight: 900;
      letter-spacing: 1.5px;

      padding: 6px 14px;

    }

      background-color: #E7E3D9;
      color: #141414;
    }

    .tag-warning {
      background-color: #FF6A1A;
      color: #141414;
    }

    /* High-Impact Final Step (Step 3) */
    .step-card.step-card-punch {
      background-color: #141414;
      border: 4px solid #141414;
      box-shadow: 10px 10px 0px #FF6A1A;
      height: 240px;
    }

    .step-card-punch .card-number-col {
      border-right: 3px solid rgba(247, 244, 236, 0.25);
    }

    .step-card-punch .step-num-large {
      color: #FF6A1A;

    .step-card-punch .card-content-col {
      max-width: 520px;
    }

    .step-card-punch .card-heading {
      font-size: 48px;
      color: #FF6A1A;
      margin-bottom: 8px;
    }

    .step-card-punch .card-detail {
      font-size: 28px;
      color: #F7F4EC;
    }

    /* Stamp Indicator on Final Card */
    .conclusion-stamp {
      position: absolute;
      right: 24px;
      bottom: 20px;
      background-color: #FF6A1A;
      color: #141414;
      padding: 10px 18px;
      border: 3px solid #141414;
      font-size: 22px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      box-shadow: 4px 4px 0px #141414;
      transform: rotate(-3deg);
      transform-origin: center center;
    }

    /* Vector Connectors */
    .connector-svg {
      width: 980px;
      height: 64px;
      display: block;
      margin: -2px 0;
      z-index: 5;
    }

    .connector-line {
      stroke: #141414;
      stroke-width: 6;
      stroke-linecap: square;
    }

    .connector-head {
      fill: #141414;
    }

    .connector-line-accent {
      stroke: #FF6A1A;
      stroke-width: 8;
      stroke-linecap: square;
    }

    .connector-head-accent {
      fill: #FF6A1A;
    }
  </style>

  <div id="root" data-composition-id="scene-s16" data-width="1080" data-height="1920" data-duration="7.34">
    <!-- Top-level Scene Clip -->
    <section id="scene-s16" class="clip" data-start="0" data-duration="7.34">
      <div id="scene-container">
        <!-- Header Panel -->
        <header class="header-panel" id="header-panel">
          <div class="meta-tag-row">
            <span class="badge-doc">HỒ SƠ TỐ TỤNG</span>
            <span class="badge-accent">CƠ CHẾ HÀNH VI</span>
          </div>
          <h1 class="main-title">CHUỖI HÀNH VI LEO THANG</h1>
          <div class="subtitle-row">
            <div class="sub-rule-line"></div>
            <p class="subtitle-text">Xác định căn cứ cấu thành yếu tố lỗi cố ý</p>
          </div>
        </header>

        <!-- Stepper Flow -->
        <div class="flow-stepper" id="flow-stepper">
          <!-- Step 1: Lệnh đi thẳng -->

            <div class="status-tag tag-neutral">GIAI ĐOẠN 01</div>
            <div class="card-number-col">
              <span class="step-badge badge-ink">BƯỚC</span>

            </div>
            <div class="card-content-col">

          <svg class="connector-svg" viewBox="0 0 980 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line id="conn-line-1" class="connector-line" x1="490" y1="2" x2="490" y2="44" />
            <polygon id="conn-arrow-1" class="connector-head" points="476,42 490,60 504,42" />
          </svg>

          <!-- Step 2: Lệnh dừng xe -->
          <article class="step-card" id="card-step-2">
            <div class="status-tag tag-warning">CẢNH BÁO</div>

  <script>
    // Initialize deterministic, seekable GSAP timeline
    const tl = gsap.timeline({ paused: true });

    // Setup SVG Connector Dash Arrays
    const line1 = document.getElementById("conn-line-1");
    const line2 = document.getElementById("conn-line-2");
    const len1 = line1.getTotalLength ? line1.getTotalLength() : 42;
    const len2 = line2.getTotalLength ? line2.getTotalLength() : 42;

    line1.style.strokeDasharray = len1;
    line1.style.strokeDashoffset = len1;
    line2.style.strokeDasharray = len2;
    line2.style.strokeDashoffset = len2;

    // Phase 0: Initial Establishment (0.0s - 0.69s)
    // Scene Entrance: Grow animation on header
    tl.fromTo("#header-panel",
      { scale: 0.88, opacity: 0, y: -20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
      0.15
    );

    // Phase 1: Step 1 Arrival (atMs: 145890 -> relative: 0.69s)
    tl.fromTo("#card-step-1",
      { scale: 0.85, opacity: 0, y: 35 },
      { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
      0.69
    );

    // Phase 2: Flow Progression 1 -> 2
    // Connector 1 drawing
    tl.to(line1,
      { strokeDashoffset: 0, duration: 0.38, ease: "power2.inOut" },
      2.45
    );
    tl.fromTo("#conn-arrow-1",
      { scale: 0, opacity: 0, transformOrigin: "center center" },
      { scale: 1, opacity: 1, duration: 0.18, ease: "power2.out" },
      2.75
    );

    // Step 2 Arrival (atMs: 148130 -> relative: 2.93s)
    tl.fromTo("#card-step-2",
      { scale: 0.88, opacity: 0, y: 35 },
      { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
      2.93
    );

    // Phase 3: Flow Escalation 2 -> 3 (atMs: 149790 -> relative: 4.59s)
    // Connector 2 drawing with urgency
    tl.to(line2,
      { strokeDashoffset: 0, duration: 0.35, ease: "power2.inOut" },
      4.15
    );
    tl.fromTo("#conn-arrow-2",
      { scale: 0, opacity: 0, transformOrigin: "center center" },
      { scale: 1, opacity: 1, duration: 0.16, ease: "power2.out" },
      4.42
    );

    // Step 3 (Punch-phrase Card) Punch-in strike
    tl.fromTo("#card-step-3",
      { scale: 0.82, opacity: 0, y: 45 },
      { scale: 1, opacity: 1, y: 0, duration: 0.58, ease: "power4.out" },
      4.59
    );

    // Camera/Container subtle shift downwards to focus on climax
    tl.to("#scene-container",
      { y: -18, duration: 0.6, ease: "power2.out" },
      4.7
    );

    // Conclusion Stamp Slam
    tl.fromTo("#stamp-consequence",
      { scale: 2.4, opacity: 0, rotation: 12 },
      { scale: 1, opacity: 1, rotation: -3, duration: 0.42, ease: "power3.out" },
      5.3
    );

    // Register paused timeline with HyperFrames runtime
    window.__timelines["scene-s16"] = tl;
  </script>
