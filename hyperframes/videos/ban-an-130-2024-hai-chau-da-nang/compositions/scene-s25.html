        const len = p.getTotalLength();
        p.style.strokeDasharray = `${len}`;
        p.style.strokeDashoffset = `${len}`;

      // 2. Khởi tạo GSAP Timeline chính thức (seekable, paused)

        "#verdict-card",

          scale: 0.94,
          rotationX: -16,
          rotationY: 7,
          rotationZ: -3,
          y: -40,

          duration: 0.48,

      // Thẻ phân loại và khung minh họa

        { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" },
        1.05,

      tl.fromTo(
        "#middle-visual",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
        1.25,

      // Giai đoạn 1.78s: Overlay icon "doc" xuất hiện
      tl.to(
        ".doc-draw-path",
        {
          strokeDashoffset: 0,
          duration: 0.65,
          ease: "power2.out",
          stagger: 0.1,

        2.4,

      tl.to(

      tl.to(

      // Giai đoạn 3.57s: Overlay Punch-phrase "KHÔNG CẦN CÁCH LY" đập vào mạnh mẽ
