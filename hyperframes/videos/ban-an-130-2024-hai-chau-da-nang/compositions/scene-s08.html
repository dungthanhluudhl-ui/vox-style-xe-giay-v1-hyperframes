    <script>
      // Prepare SVG path lengths for clean progressive draw
      const roadPaths = document.querySelectorAll(".road-draw");
      roadPaths.forEach((path) => {
        const len = path.getTotalLength();
        path.style.strokeDasharray = `${len}`;
        path.style.strokeDashoffset = `${len}`;
      });

      // Prepare perimeter rescue circle
      const rescueCircle = document.getElementById("radius-cuunan");
      if (rescueCircle) {
        const circleLen = 2 * Math.PI * 64;
        rescueCircle.style.strokeDasharray = `${circleLen}`;
        rescueCircle.style.strokeDashoffset = `${circleLen}`;
      }

      // Initialize single paused timeline
      const tl = gsap.timeline({ paused: true });

      // 0.0s - 1.2s: Scene Entrance ("grow" transitionIn)
      tl.fromTo(
        "#header-card",
        { y: -45, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.15,
      );

      tl.fromTo(
        "#map-container",
        { scale: 0.9, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
        0.2,
      );

      tl.fromTo(
        "#legend-bar",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
