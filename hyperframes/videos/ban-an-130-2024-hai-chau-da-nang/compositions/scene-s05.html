    // Khởi tạo Timeline GSAP tạm dừng (paused: true) cho việc seek tất định
    const tl = gsap.timeline({ paused: true });

    // 1. Vào cảnh: Xoay Spiral Rewind & Camera Zoom-Out (0.0s - 1.0s)
    tl.fromTo(
      "#camera-rig",
      { scale: 1.22, rotation: -16, opacity: 0 },
      { scale: 1.04, rotation: 0, opacity: 1, duration: 1.0, ease: "power3.out" },
      0
    );

    // Chuyển động zoom-out nhẹ liên tục xuyên suốt cảnh (1.0s - 5.0s)
    tl.to(
      "#camera-rig",
      { scale: 1.0, duration: 4.0, ease: "sine.out" },
      1.0
    );

    // 2. Xuất hiện Header và Thẻ Trục thời gian (0.15s - 0.75s)
    tl.fromTo(
      ".header-bar",
      { y: -20, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      0.15
    );

    tl.fromTo(
      "#timeline-ruler-card",
      { y: -20, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      0.3
    );

    // Tua ngược con trỏ scrubber & thanh tiến trình bằng transform GPU (x & scaleX) không gây snap layout
    tl.fromTo(
      "#ruler-scrubber",
      { x: 740 },
      { x: 0, duration: 1.4, ease: "power2.inOut" },
      0.5
    );
    tl.fromTo(
      "#ruler-progress",
      { scaleX: 0.95 },
      { scaleX: 0.15, duration: 1.4, ease: "power2.inOut" },
      0.5
    );

    // 3. Xuất hiện Icon Đồng hồ (Overlay 1: clock, đúng mốc atMs: 36360 -> tương ứng 1.96s)
    tl.fromTo(
      "#clock-svg",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      1.96
    );

    tl.fromTo(
      "#vortex-svg",
      { scale: 0.7, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power2.out" },
      1.96
    );

    // Vòng xoáy tua ngược quay liên tục từ lúc đồng hồ xuất hiện
    tl.fromTo(
      "#vortex-group",
      { rotation: 180 },
      { rotation: -180, duration: 2.8, ease: "linear" },
      1.96
    );

    // Kim phút quay ngược nhanh nhiều vòng và dừng chính xác tại vị trí 12h (góc 0 độ) tại 2.98s
    tl.fromTo(
      "#minute-hand",
      { rotation: 1440 },
      { rotation: 0, duration: 0.98, ease: "power3.out" },
      2.0
    );

    // Kim giờ quay ngược nhanh và dừng chính xác tại vị trí 22h (góc 300 độ) tại 2.98s
    tl.fromTo(
      "#hour-hand",
      { rotation: 1380 },
      { rotation: 300, duration: 0.98, ease: "power3.out" },
      2.0
    );

    // 4. Xuất hiện Thẻ Punch Phrase đích (Overlay 2: punch-phrase, đúng mốc atMs: 37380 -> 2.98s)
    // Hiệu ứng phản hồi khóa mốc thời gian trên viền mặt đồng hồ

      "#clock-dial-border",
      { stroke: "#FF6A1A", strokeWidth: 10 },
      { stroke: "#141414", strokeWidth: 6, duration: 0.35, ease: "power2.out" },
      2.98
    );

    tl.fromTo(
      "#clock-center-hub",
      { scale: 1.5 },
      { scale: 1.0, duration: 0.3, ease: "power3.out" },
      2.98
    );

    // Thẻ Punch Phrase xuất hiện dứt khoát
    tl.fromTo(
      "#punch-phrase-card",
      { scale: 0.85, opacity: 0, y: -15 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      2.98
    );

    // Nhịp xung tín hiệu trạng thái đã khóa (hữu hạn, 3 chu kỳ tất định)
    tl.fromTo(
      ".tag-status",
      { opacity: 0.3 },
      { opacity: 1.0, duration: 0.25, repeat: 2, yoyo: true, ease: "sine.inOut" },
      3.4
    );

    // Đăng ký timeline đồng bộ với trình seek của HyperFrames
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s05"] = tl;
  </script>
