<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        background: #F5F0E4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #F5F0E4;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Photo Background Layer */
      .photo-bg-layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .photo-bg-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        transform-origin: center center;
        will-change: transform;
      }

      /* Top Header */
      .docket-container {
        position: absolute;
        top: 180px;
        left: 60px;
        right: 60px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 14px 22px;
        border-radius: 8px;
        background-color: #141414;
        border-left: 6px solid #FF6A1A;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
        z-index: 20;
      }
      .docket-badge {
        background-color: #FF6A1A;
        color: #141414;
        font-weight: 900;
        font-size: 22px;
        padding: 6px 14px;
        border-radius: 4px;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }
      .docket-title {
        color: #F7F4EC;
        font-weight: 700;
        font-size: 24px;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

      /* Overlay 1: Stamp Warning Card */
      .stamp-card {
        position: absolute;
        top: 380px;
        left: 60px;
        right: 60px;
        padding: 30px 34px;
        border-radius: 12px;
        background-color: #141414;
        border: 3px solid #FF6A1A;
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-shadow: 0 16px 44px rgba(0, 0, 0, 0.5);
        z-index: 25;
      }
      .stamp-pill {
        display: inline-block;
        align-self: flex-start;
        background-color: #FF6A1A;
        color: #141414;
        font-weight: 900;
        font-size: 22px;
        padding: 6px 16px;
        border-radius: 4px;
      }
      .stamp-main-text {
        color: #FF6A1A;
        font-weight: 900;
        font-size: 58px;
        line-height: 1.15;
        letter-spacing: -0.5px;
      }
      .stamp-sub-text {
        color: #F7F4EC;
        font-weight: 700;
        font-size: 26px;
        line-height: 1.35;
      }

      /* Mid-scene Note */
      .doc-action-card {
        position: absolute;
        top: 720px;
        left: 60px;
        right: 60px;
        padding: 26px 32px;
        border-radius: 12px;
        background-color: #141414;
        border-left: 6px solid #FF6A1A;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        z-index: 25;
      }
      .doc-action-tag {
        color: #FF6A1A;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 0.5px;
      }
      .doc-action-text {
        color: #F7F4EC;
        font-weight: 900;
        font-size: 38px;
        line-height: 1.25;
      }

      /* Punch Phrase Card */
      .punch-card {
        position: absolute;
        top: 960px;
        left: 60px;
        right: 60px;
        padding: 34px 38px;
        border-radius: 14px;
        background-color: #141414;
        border: 3px solid #FF6A1A;
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
        z-index: 30;
      }
      .punch-badge {
        display: inline-block;
        align-self: flex-start;
        background-color: #FF6A1A;
        color: #141414;
        font-weight: 900;
        font-size: 22px;
        padding: 6px 18px;
        border-radius: 4px;
      }
      .punch-main-text {
        color: #F7F4EC;
        font-weight: 900;
        font-size: 64px;
        line-height: 1.18;
        letter-spacing: -0.5px;
      }
      .punch-sub-text {
        color: #FF6A1A;
        font-weight: 700;
        font-size: 28px;
        line-height: 1.3;
      }

      /* Vox DNA Signature Bottom Orange Bar */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 10px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s27"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="10.04"
    >
      <section id="scene-clip" class="clip" data-start="0" data-duration="10.04">
        <!-- Main Full-Bleed Background Photo Layer -->
        <div id="image-wrapper" class="photo-bg-layer">
          <img
            id="hero-img"
            class="photo-bg-img"
            src="assets/img-17-minor-probation-motorcycle-keys.jpg"
            alt="Giám sát tại địa phương"
          />
        </div>

        <!-- Official Header -->
        <div id="docket-header" class="docket-container">
          <div class="docket-badge">HỒ SƠ THI HÀNH</div>
          <div class="docket-title">GIÁM SÁT TẠI ĐỊA PHƯƠNG</div>
        </div>

        <!-- Overlay 1: Label at 0.69s (atMs: 240890) -->
        <div id="card-overlay-1" class="stamp-card">
          <div class="stamp-pill">THÔNG TIN BẢN ÁN</div>
          <div class="stamp-main-text">KHÔNG XÓA ÁN TÍCH</div>
          <div class="stamp-sub-text">BẢN ÁN VẪN ĐANG CÓ HIỆU LỰC PHÁP LUẬT</div>
        </div>

        <!-- Mid-scene Transition: Pacing Bridge at 4.0s -->
        <div id="mid-scene-note" class="doc-action-card">
          <div class="doc-action-tag">CƠ CHẾ THI HÀNH</div>
          <div class="doc-action-text">GIÁM SÁT VÀ GIÁO DỤC TẠI NƠI CƯ TRÚ</div>
        </div>

        <!-- Overlay 2: Punch Phrase at 8.08s (atMs: 248280) -->
        <div id="card-punch-phrase" class="punch-card">
          <div class="punch-badge">HỒ SƠ THI HÀNH</div>
          <div class="punch-main-text">ĐỊA PHƯƠNG GIÁM SÁT</div>
          <div class="punch-sub-text">CHÍNH QUYỀN ĐỊA PHƯƠNG GIÁO DỤC</div>
        </div>

        <!-- Signature Brand Bar -->
        <div class="bottom-brand-bar"></div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Entrance: Scene slide-up (rise)
      tl.fromTo(
        "#image-wrapper",
        { y: 70, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0
      );

      // Camera Motion: Subtle pan-left from mother to decision document
      tl.fromTo(
        "#hero-img",
        { x: 70, scale: 1.18 },
        { x: -70, scale: 1.18, duration: 10.04, ease: "none" },
        0
      );

      // Top Docket Tag entrance
      tl.fromTo(
        "#docket-header",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.3
      );

      // Overlay 1: "KHÔNG XÓA ÁN TÍCH" at 0.69s (atMs: 240890, holdMs: 2600)
      tl.fromTo(
        "#card-overlay-1",
        { scale: 0.88, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.69
      );
      tl.fromTo(
        "#card-overlay-1",
        { opacity: 1, y: 0 },
        { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
        3.29
      );

      // Mid-Scene Inspection Tag at 4.0s (bridges dead-air gap before punch-phrase)
      tl.fromTo(
        "#mid-scene-note",
        { scale: 0.9, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        4.0
      );
      tl.fromTo(
        "#mid-scene-note",
        { opacity: 1, y: 0 },
        { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
        7.4
      );

      // Punch Phrase: "ĐỊA PHƯƠNG GIÁM SÁT" at 8.08s (atMs: 248280, holdMs: 3000)
      tl.fromTo(
        "#card-punch-phrase",
        { scale: 0.88, opacity: 0, y: 40 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        8.08
      );

      window.__timelines["scene-s27"] = tl;
    </script>
  
    </template>
  </body>
</html>
