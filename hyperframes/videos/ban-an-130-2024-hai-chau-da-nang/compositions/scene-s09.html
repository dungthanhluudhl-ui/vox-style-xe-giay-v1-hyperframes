    <div

    <!-- Animation Runtime: One Paused Deterministic GSAP Timeline -->
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Calculate path lengths synchronously for SVG stroke reveals
      const turnPath = document.getElementById("turn-curve-path");
      if (turnPath) {
        const len = turnPath.getTotalLength();
        turnPath.style.strokeDasharray = len;
        turnPath.style.strokeDashoffset = len;
      }

      const warningPath = document.getElementById("warning-triangle");
      if (warningPath) {
        const wLen = warningPath.getTotalLength();
        warningPath.style.strokeDasharray = wLen;
        warningPath.style.strokeDashoffset = wLen;
      }

      // --- PHASE 1: Shot Entrance & Camera Zoom (0.0s - 11.93s) ---
      // Strike entrance: high impact slam landing
      tl.fromTo(
        "#hero-image",
        { scale: 1.14, opacity: 0.8 },
        { scale: 1.02, opacity: 1, duration: 0.28, ease: "power4.out" },
        0
      );

      // Continuous subtle push-in focusing on officer's whistle and baton (1.02x -> 1.08x)
      tl.to(
        "#hero-image",
        { scale: 1.08, duration: 11.65, ease: "sine.out" },
        0.28
      );

      // Tag reveal
      tl.fromTo(
        "#corner-tag",
        { x: -30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.3
      );

      // --- PHASE 2: Overlay 1 - "RẼ TRÁI QUAY ĐẦU" (at 2.53s) ---
      // SVG path draws smoothly
      tl.to(
        "#turn-curve-path",
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        2.53
      );

      // Arrowhead pops at completion of trajectory
      tl.to(
        "#turn-head",
        { opacity: 1, duration: 0.15, ease: "power1.out" },
        3.0
      );

      // Label plate spring-pop entrance
      tl.fromTo(
        "#turn-card",
        { scale: 0.85, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        2.75
      );

      // Graceful exit before clip duration boundary
      tl.to(
        "#turn-wrap",
        { opacity: 0, scale: 0.96, duration: 0.28, ease: "power2.in" },
        5.2
      );

      // --- PHASE 3: Overlay 2 - Warning Icon & Stop Barrier (at 8.39s) ---
      // Barrier hazard line scales out rapidly
      tl.fromTo(
        "#barrier-line",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        8.39
      );

      // Warning card pop
      tl.fromTo(
        "#warning-card",
        { scale: 0.8, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        8.45
      );

      // Warning triangle SVG stroke trace
      tl.to(
        "#warning-triangle",
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        8.5
      );

      // Exclamation elements appear
      tl.fromTo(
        ["#warning-excl-line", "#warning-excl-dot"],
        { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, duration: 0.25, stagger: 0.08, ease: "back.out(1.5)" },
        8.7
      );

      // Outro for warning section before next punch phrase
      tl.to(
        "#warning-wrap",
        { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" },
        10.45
      );

      // --- PHASE 4: Overlay 3 - Punch Phrase "LỆNH: ĐI THẲNG" (at 10.74s) ---
      // Decisive strike entrance
      tl.fromTo(
        "#command-card",
        { scale: 1.15, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power4.out" },
        10.74
      );

      // Forward arrow nudge
      tl.fromTo(
        ".command-arrow-icon",
        { y: 15, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" },
        10.95
      );

      // Register timeline for seekable HyperFrames engine
      window.__timelines["scene-s09"] = tl;
    </script>
