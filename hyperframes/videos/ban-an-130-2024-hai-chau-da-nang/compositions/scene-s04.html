<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        background: #F5F0E4;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #F5F0E4;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* Base safe color utility classes */
      .hf-text-ink {
        color: #141414;
      }
      .hf-text-light {
        color: #F7F4EC;
      }
      .hf-hl-orange {
        background: #FF6A1A;
        color: #141414;
      }
      .hf-plate-ink {
        background: #141414;
        color: #F7F4EC;
      }
      .hf-plate-paper {
        background: #E7E3D9;
        color: #141414;
      }

      /* Full-bleed background wrapper */
      #unfold-wrapper {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      #hero-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      /* Signature bottom orange bar */
      #brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 12px;
        background: #FF6A1A;
        z-index: 100;
      }

      /* Branch Question Cards */
      .branch-card {
        position: absolute;
        left: 80px;
        right: 80px;
        padding: 30px 40px;
        background: #141414;
        border-left: 14px solid #FF6A1A;
        border-radius: 4px;
        will-change: transform, opacity;
        pointer-events: none;
      }

      #card-1 {
        top: 360px;
      }

      #card-2 {
        top: 550px;
      }

      #card-3 {
        top: 740px;
      }

      .branch-badge {
        display: inline-block;
        background: #FF6A1A;
        color: #141414;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 2px;
        padding: 4px 14px;
        border-radius: 4px;
        margin-bottom: 12px;
      }

      .branch-title {
        color: #F7F4EC;
        font-size: 50px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: -0.5px;
      }

      /* Punch Phrase Hero Card */
      .punch-card {
        position: absolute;
        top: 520px;
        left: 80px;
        right: 80px;
        padding: 46px 44px;
        background: #141414;
        border: 4px solid #FF6A1A;
        border-radius: 6px;
        will-change: transform, opacity;
        pointer-events: none;
      }

      .punch-badge {
        display: inline-block;
        background: #FF6A1A;
        color: #141414;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 3px;
        padding: 6px 18px;
        border-radius: 4px;
        margin-bottom: 18px;
      }

      .punch-title {
        color: #F7F4EC;
        font-size: 72px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: -1px;
      }

      .punch-accent-bar {
        height: 8px;
        width: 100%;
        background: #FF6A1A;
        margin-top: 24px;
        transform-origin: left center;
        will-change: transform;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s04"
      data-width="1080"
      data-height="1920"
      data-duration="10"
    >
      <!-- Shot 1: Main background photo & brand bar -->
      <section id="shot-1" class="clip" data-start="0" data-duration="10">
        <div id="unfold-wrapper">
          <img
            id="hero-img"
            src="assets/img-14-traffic-violation-charge-questioning.jpg"
            alt="Bàn tay siết ga xe máy và tranh cãi pháp lý"
          />
        </div>
        <div id="brand-bar"></div>
      </section>

      <!-- Overlay 1: TAI NẠN ĐƠN THUẦN? -->
      <section id="overlay-branch-1" class="clip" data-start="1.48" data-duration="2.2">
        <div id="card-1" class="branch-card hf-plate-ink">
          <div class="branch-badge">NHÁNH 01</div>
          <div class="branch-title">TAI NẠN ĐƠN THUẦN?</div>
        </div>
      </section>

      <!-- Overlay 2: CỐ Ý GÂY THƯƠNG TÍCH? -->
      <section id="overlay-branch-2" class="clip" data-start="2.62" data-duration="2.2">
        <div id="card-2" class="branch-card hf-plate-ink">
          <div class="branch-badge">NHÁNH 02</div>
          <div class="branch-title">CỐ Ý GÂY THƯƠNG TÍCH?</div>
        </div>
      </section>

      <!-- Overlay 3: CHỐNG ĐỐI CÔNG VỤ? -->
      <section id="overlay-branch-3" class="clip" data-start="4.15" data-duration="2.5">
        <div id="card-3" class="branch-card hf-plate-ink">
          <div class="branch-badge">NHÁNH 03</div>
          <div class="branch-title">CHỐNG ĐỐI CÔNG VỤ?</div>
        </div>
      </section>

      <!-- Overlay 4: TỰ DO TẠI TÒA? (Punch phrase) -->
      <section id="overlay-punch" class="clip" data-start="8.0" data-duration="2.0">
        <div id="punch-card" class="punch-card hf-plate-ink">
          <div class="punch-badge">CÂU HỎI PHÁP LÝ</div>
          <div class="punch-title">TỰ DO TẠI TÒA?</div>
          <div id="punch-accent-bar" class="punch-accent-bar"></div>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Unfold entrance for the whole scene container (0 -> 0.8s)
      tl.fromTo(
        "#unfold-wrapper",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.8, ease: "power3.out" },
        0
      );

      // 2. Subtle camera scale settle on hero image (0 -> 1.2s)
      tl.fromTo(
        "#hero-img",
        { scale: 1.14 },
        { scale: 1.05, duration: 1.2, ease: "power2.out" },
        0
      );

      // 3. Tension tremble (deterministic micro-motion) between 0.8s and 9.8s
      const trembleTl = gsap.timeline({ repeat: 10 });
      trembleTl
        .to("#hero-img", { x: 2.5, y: -1.5, rotation: 0.2, duration: 0.1, ease: "sine.inOut" })
        .to("#hero-img", { x: -2, y: 2, rotation: -0.25, duration: 0.12, ease: "sine.inOut" })
        .to("#hero-img", { x: 1.8, y: 1.2, rotation: 0.15, duration: 0.09, ease: "sine.inOut" })
        .to("#hero-img", { x: -1.2, y: -2.2, rotation: -0.18, duration: 0.11, ease: "sine.inOut" })
        .to("#hero-img", { x: 2.2, y: 0.8, rotation: 0.22, duration: 0.1, ease: "sine.inOut" })
        .to("#hero-img", { x: -1.8, y: -1.2, rotation: -0.12, duration: 0.13, ease: "sine.inOut" })
        .to("#hero-img", { x: 0, y: 0, rotation: 0, duration: 0.15, ease: "sine.inOut" });
      tl.add(trembleTl, 0.8);

      // 4. Branch 1: "TAI NẠN ĐƠN THUẦN?" (visible: 1.48s -> 3.68s)
      tl.fromTo(
        "#card-1",
        { scale: 0.88, x: -50, opacity: 0 },
        { scale: 1, x: 0, opacity: 1, duration: 0.38, ease: "power3.out" },
        1.48
      );
      tl.to(
        "#card-1",
        { opacity: 0, x: 30, duration: 0.22, ease: "power2.in" },
        3.42
      );

      // 5. Branch 2: "CỐ Ý GÂY THƯƠNG TÍCH?" (visible: 2.62s -> 4.82s)
      tl.fromTo(
        "#card-2",
        { scale: 0.88, x: -50, opacity: 0 },
        { scale: 1, x: 0, opacity: 1, duration: 0.38, ease: "power3.out" },
        2.62
      );
      tl.to(
        "#card-2",
        { opacity: 0, x: 30, duration: 0.22, ease: "power2.in" },
        4.56
      );

      // 6. Branch 3: "CHỐNG ĐỐI CÔNG VỤ?" (visible: 4.15s -> 6.65s)
      tl.fromTo(
        "#card-3",
        { scale: 0.88, x: -50, opacity: 0 },
        { scale: 1, x: 0, opacity: 1, duration: 0.38, ease: "power3.out" },
        4.15
      );
      tl.to(
        "#card-3",
        { opacity: 0, x: 30, duration: 0.22, ease: "power2.in" },
        6.38
      );

      // 7. Punch phrase: "TỰ DO TẠI TÒA?" (visible: 8.0s -> 10.0s)
      tl.fromTo(
        "#punch-card",
        { scale: 0.9, y: 40, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        8.00
      );
      tl.fromTo(
        "#punch-accent-bar",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power2.out" },
        8.25
      );

      // Register root timeline on window.__timelines
      window.__timelines["scene-s04"] = tl;
    </script>
  
    </template>
  </body>
</html>
