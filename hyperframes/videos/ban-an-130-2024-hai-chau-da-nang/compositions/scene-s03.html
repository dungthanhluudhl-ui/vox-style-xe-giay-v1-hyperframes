<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }

      /* Chuẩn .clip của HyperFrames: không set width/height cứng bằng px */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Lớp camera rig chứa ảnh nền và chart overlay để zoom/pan đồng bộ */
      #camera-rig {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      /* Ảnh nền background-photo phủ trọn 1080x1920, giữ nguyên màu gốc */
      .hero-image {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        display: block;
      }

      /* Biến thể nền "chart": 4 đường ngang tại 20%, 40%, 60%, 80% kèm tick cam bên trái */
      .chart-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .chart-grid-line {
        position: absolute;
        left: 0;
        width: 100%;
        height: 2px;
        background-color: rgba(20, 20, 20, 0.28);
      }

      .chart-grid-line::before {
        content: "";
        position: absolute;
        left: 0;
        top: -7px;
        width: 18px;
        height: 16px;
        background-color: #ff6a1a;
      }

      /* Thanh cam nhận diện thương hiệu luôn cố định ở mép đáy khung hình */
      .vox-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 90;
      }

      /* Các lớp màu tương phản an toàn theo chuẩn WCAG */
      .hf-plate-ink {
        background-color: #141414;
        color: #f7f4ec;
      }

      .hf-hl-orange {
        background-color: #ff6a1a;
        color: #141414;
      }

      .hf-text-light {
        color: #f7f4ec;
      }

      .hf-text-orange {
        color: #ff6a1a;
      }

      /* Khối chứa UI / Card overlays căn giữa theo chiều ngang trong dải an toàn (safe-zone) */
      .overlay-center-container {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 360px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      /* Card phong cách tài liệu pháp lý / hồ sơ giám định */
      .forensic-card {
        width: 960px;
        border: 4px solid #141414;
        padding: 40px 48px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .card-tag {
        font-weight: 900;
        font-size: 26px;
        letter-spacing: 3px;
        padding: 8px 24px;
        text-transform: uppercase;
        margin-bottom: 24px;
        display: inline-block;
      }

      .card-subtext {
        font-weight: 700;
        font-size: 32px;
        letter-spacing: 2px;
        margin-top: 16px;
        opacity: 0.9;
        text-transform: uppercase;
      }

      /* Nhóm hiển thị số liệu thương tích 4% */
      .injury-metric-row {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 24px;
        margin-top: 10px;
      }

      .injury-label-lead {
        font-weight: 900;
        font-size: 58px;
        letter-spacing: 2px;
        line-height: 1.1;
      }

      .injury-digit {
        font-weight: 900;
        font-size: 140px;
        line-height: 1;
        letter-spacing: -2px;
        display: inline-block;
        transform-origin: 50% 50%;
      }

      /* Card điều luật tố tụng */
      .charge-card {
        width: 960px;
        border: 4px solid #141414;
        border-left: 20px solid #ff6a1a;
        padding: 44px 48px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .charge-headline {
        font-weight: 900;
        font-size: 76px;
        line-height: 1.15;
        letter-spacing: 1px;
        margin: 12px 0;
      }

      /* Card phán quyết án treo - Punch phrase */
      .verdict-card {
        width: 960px;
        border: 5px solid #ff6a1a;
        padding: 48px 48px;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .verdict-headline {
        font-weight: 900;
        font-size: 78px;
        line-height: 1.2;
        letter-spacing: 2px;
        margin-top: 16px;
        text-transform: uppercase;
      }

      .verdict-ruler {
        width: 100%;
        height: 4px;
        background-color: #ff6a1a;
        margin: 20px 0;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s03"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="9.5"
    >
      <!-- Shot 1: Nền chính (background-photo) và Chart lines -->
      <section id="shot-background" class="clip" data-start="0" data-duration="9.5" data-track-index="0">
        <div id="camera-rig">
          <img
            id="hero-photo"
            class="hero-image"
            src="assets/img-02-injury-rate-suspended-sentence-verdict.jpg"
            alt="Thương tích 4% và bản án 6 tháng tù treo"
          />

          <!-- 4 đường thước kẻ ngang đặc trưng của biến thể 'chart' -->
          <div class="chart-overlay">
            <div class="chart-grid-line" style="top: 20%;"></div>
            <div class="chart-grid-line" style="top: 40%;"></div>
            <div class="chart-grid-line" style="top: 60%;"></div>
            <div class="chart-grid-line" style="top: 80%;"></div>
          </div>
        </div>

        <!-- Chữ ký thương hiệu Vox: thanh cam đáy cố định -->
        <div class="vox-brand-bar"></div>
      </section>

      <!-- Overlay 1: THƯƠNG TÍCH 4% (atMs: 16910 -> 2.01s, holdMs: 2500 -> duration: 2.5s) -->
      <section id="clip-injury" class="clip" data-start="2.01" data-duration="2.5" data-track-index="1">
        <div class="overlay-center-container">
          <div id="card-injury-target" class="forensic-card hf-plate-ink">
            <span class="card-tag hf-hl-orange">GIÁM ĐỊNH PHÁP Y</span>
            <div class="injury-metric-row">
              <span class="injury-label-lead hf-text-light">THƯƠNG TÍCH</span>
              <span id="injury-digit-target" class="injury-digit hf-text-orange">4%</span>
            </div>
            <span class="card-subtext hf-text-light">TỶ LỆ TỔN THƯƠNG RẤT NHỎ</span>
          </div>
        </div>
      </section>

      <!-- Overlay 2: ĐIỀU 330 BLHS (atMs: 19440 -> 4.54s, holdMs: 2800 -> duration: 2.8s) -->
      <section id="clip-charge" class="clip" data-start="4.54" data-duration="2.8" data-track-index="2">
        <div class="overlay-center-container" style="top: 420px;">
          <div id="card-charge-target" class="charge-card hf-plate-ink">
            <span class="card-tag hf-hl-orange">CÁO TRẠNG TRUY TỐ</span>
            <div class="charge-headline hf-text-orange">ĐIỀU 330 BLHS</div>
            <div class="card-subtext hf-text-light">CHỐNG NGƯỜI THI HÀNH CÔNG VỤ</div>
          </div>
        </div>
      </section>

      <!-- Overlay 3: 6 THÁNG ÁN TREO (atMs: 22350 -> 7.45s, holdMs: 2000 -> duration: 2.0s) -->
      <section id="clip-verdict" class="clip" data-start="7.45" data-duration="2.0" data-track-index="3">
        <div class="overlay-center-container" style="top: 400px;">
          <div id="card-verdict-target" class="verdict-card hf-plate-ink">
            <span class="card-tag hf-hl-orange">QUYẾT ĐỊNH CỦA TÒA ÁN</span>
            <div class="verdict-ruler"></div>
            <div class="verdict-headline hf-text-light">6 THÁNG ÁN TREO</div>
          </div>
        </div>
      </section>
    </div>

    <script>
      // Đăng ký đúng 1 paused timeline trên window.__timelines["scene-s03"]
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1. Scene Transition-in "punch" và Camera Motion Zoom-in
      // Bắt đầu bằng một cú giật nảy đáp dứt khoát (punch) thể hiện sự nghịch lý
      tl.fromTo(
        "#camera-rig",
        { scale: 1.15, opacity: 0.9 },
        { scale: 1.0, opacity: 1, duration: 0.55, ease: "power4.out" },
        0
      );

      // Camera drift chậm zoom-in hướng tới cụm búa và phán quyết án treo
      tl.to(
        "#camera-rig",
        { scale: 1.08, duration: 8.95, ease: "sine.inOut" },
        0.55
      );

      // 2. Chuyển động Overlay 1: THƯƠNG TÍCH 4% (Bắt đầu tại thời điểm local 2.01s)
      tl.fromTo(
        "#card-injury-target",
        { scale: 0.85, opacity: 0, y: 30 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        2.01
      );

      // Con số 4% nảy bật lên tạo điểm nhấn số liệu đập mạnh vào mắt người xem
      tl.fromTo(
        "#injury-digit-target",
        { scale: 0.6, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.4, ease: "back.out(1.5)" },
        2.16
      );

      // Thu hồi card trước khi clip kết thúc tại 4.51s
      tl.to(
        "#card-injury-target",
        { opacity: 0, y: -24, duration: 0.25, ease: "power2.in" },
        4.24
      );

      // 3. Chuyển động Overlay 2: ĐIỀU 330 BLHS (Bắt đầu tại thời điểm local 4.54s)
      tl.fromTo(
        "#card-charge-target",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        4.54
      );

      // Thu hồi card trước khi clip kết thúc tại 7.34s
      tl.to(
        "#card-charge-target",
        { opacity: 0, y: -24, duration: 0.25, ease: "power2.in" },
        7.05
      );

      // 4. Chuyển động Overlay 3: 6 THÁNG ÁN TREO (Punch-phrase tại 7.45s)
      // Cú đáp dứt khoát như tiếng đập búa của thẩm phán
      tl.fromTo(
        "#card-verdict-target",
        { scale: 1.28, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.35, ease: "power4.out" },
        7.45
      );

      // Rung nhẹ camera tạo xung lực kết án đanh thép
      tl.fromTo(
        "#camera-rig",
        { y: 8 },
        { y: 0, duration: 0.25, ease: "power3.out" },
        7.5
      );

      window.__timelines["scene-s03"] = tl;
    </script>
  
    </template>
  </body>
</html>
