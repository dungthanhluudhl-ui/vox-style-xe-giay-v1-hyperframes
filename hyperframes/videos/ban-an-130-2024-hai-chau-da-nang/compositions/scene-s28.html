  <script>
    // HyperFrames deterministic timeline setup
    const tl = gsap.timeline({ paused: true });

    // Path geometry preparation for connectors
    const line1 = document.getElementById("path-line-1");
    const len1 = line1 ? line1.getTotalLength() : 80;
    if (line1) {
      line1.style.strokeDasharray = len1 + " " + len1;
      line1.style.strokeDashoffset = len1;
    }

    const line2 = document.getElementById("path-line-2");
    const len2 = line2 ? line2.getTotalLength() : 70;
    if (line2) {
      line2.style.strokeDasharray = len2 + " " + len2;
      line2.style.strokeDashoffset = len2;
    }

    // 0.0s - 0.7s: Scene entrance & establishing state
    // Zoom-through initial entrance on the rig
    tl.fromTo(
      "#camera-rig",
      { scale: 0.88, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.7, ease: "power3.out" },
      0.0
    );

    // Subtle continuous camera zoom-in after entrance to avoid tween conflicts
    tl.to(
      "#camera-rig",
      { scale: 1.035, duration: 6.26, ease: "none" },
      0.7
    );

    // Header entry
    tl.fromTo(
      "#header-group",
      { y: -30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.15
    );

    // Node 1 entry: HƯỞNG ÁN TREO
    tl.fromTo(
      "#card-root",
      { y: 30, opacity: 0, scale: 0.96 },
      { y: 0, opacity: 1, scale: 1.0, duration: 0.55, ease: "power3.out" },
      0.3
    );

    // Connector 1 draws down
    tl.to(
      "#path-line-1",
      { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
      0.75
    );
    tl.fromTo(
      "#path-arrow-1",
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.5)" },
      1.1
    );

    // 1.3s - 2.56s: Setup branch & Node 2 emergence
    tl.fromTo(
      "#card-condition",
      { y: 40, opacity: 0, scale: 0.95 },
      { y: 0, opacity: 1, scale: 1.0, duration: 0.55, ease: "power3.out" },
      1.3
    );

    // Violation step 1 activates
    tl.fromTo(
      "#step-1",
      { scale: 0.9, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.35, ease: "power2.out" },
      1.8
    );

    // Overlay 1 cue at 2.56s (shotlist atMs: 252800): "VI PHẠM NGHĨA VỤ ≥2 LẦN"
    tl.fromTo(
      "#condition-plate",
      { scale: 0.85, opacity: 0 },
      { scale: 1.05, opacity: 1, duration: 0.35, ease: "power3.out" },
      2.56
    );
    tl.to(
      "#condition-plate",
      { scale: 1.0, duration: 0.2, ease: "power1.out" },
      2.91
    );

    // Violation step 2 flashes to active orange at threshold
    tl.fromTo(
      "#step-2",
      { scale: 0.9, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.4, ease: "power3.out" },
      2.95
    );

    // Connector 2 draws down rapidly
    tl.to(
      "#path-line-2",
      { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
      3.8
    );
    tl.fromTo(
      "#path-arrow-2",
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(1.5)" },
      4.15
    );

    // Overlay 2 cue at 4.64s (shotlist atMs: 254880): "BẮT ĐI TÙ GIAM"
    // Node 3 slams down forcefully
    tl.fromTo(
      "#card-consequence",
      { scale: 1.18, opacity: 0, y: 30 },
      { scale: 1.0, opacity: 1, y: 0, duration: 0.55, ease: "power4.out" },
      4.64
    );

    // Stamp "HỦY ÁN TREO" rotates and stamps down
    tl.fromTo(
      "#stamp-consequence",
      { scale: 1.8, opacity: 0, rotation: -12 },
      { scale: 1.0, opacity: 1, rotation: -2, duration: 0.35, ease: "power3.out" },
      4.95
    );

    // Handcuffs lock together (cuffs move inwards and snap)
    tl.fromTo(
      "#cuff-left",
      { x: -16 },
      { x: 0, duration: 0.4, ease: "back.out(2)" },
      5.1
    );
    tl.fromTo(
      "#cuff-right",
      { x: 16 },
      { x: 0, duration: 0.4, ease: "back.out(2)" },
      5.1
    );

    // Register paused timeline with exact composition-id
    window.__timelines["scene-s28"] = tl;
  </script>
