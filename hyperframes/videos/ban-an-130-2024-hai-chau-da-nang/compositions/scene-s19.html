      /* Persistent Brand Accent Bar at Bottom */

    <script>
      const tl = gsap.timeline({ paused: true });

      // Phase 1: Wobble-Drop arrival of the legal scale visual
      tl.fromTo(
        "#hero-wrapper",
        { y: -75, rotation: -2.2, scale: 1.05, opacity: 0 },
        { y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
        0
      );

      // Phase 2: Gentle continuous idle sway representing balance tilt
      tl.to(
        "#hero-sway",
        { rotation: 0.7, duration: 2.3, ease: "sine.inOut", yoyo: true, repeat: 1 },
        0.75
      );

      // Scene header badge slide-in
      tl.fromTo(
        "#scene-header",
        { x: -40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.15
      );

      // Chart guidelines & tick marks stagger reveal
      tl.fromTo(
        ".chart-line",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.55, ease: "power2.out", stagger: 0.07 },
        0.2
      );
      tl.fromTo(
        ".chart-tick",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out", stagger: 0.07 },
        0.32
      );

      // Phase 3: Overlay 1 entrance at 0.53s (atMs: 173730)
      tl.fromTo(
        "#overlay-card-1",
        { y: 28, scale: 0.94, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.53
      );
      tl.fromTo(
        "#badge-tag-1",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
        0.7
      );
      // Clean exit fade before clip unmounts at 3.03s
      tl.to(
        "#overlay-card-1",
        { y: -16, opacity: 0, duration: 0.32, ease: "power2.in" },
        2.7
      );

      // Phase 4: Overlay 2 Punch-Phrase entrance at 4.39s (atMs: 177590)
      tl.fromTo(
        "#overlay-card-2",
        { y: 36, scale: 0.94, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.48, ease: "power3.out" },
        4.39
      );
      tl.fromTo(
        "#punch-bar",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.42, ease: "power3.out" },
        4.58
      );

      // Register timeline for seek-driven frame render
      window.__timelines["scene-s19"] = tl;
    </script>
