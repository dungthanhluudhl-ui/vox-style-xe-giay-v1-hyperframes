<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #141414;
        color: #F7F4EC;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #141414;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Camera motion container */
      .bg-camera {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      /* Background Photo: Full-frame cover */
      .bg-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Spotlight variant: dark radial vignette */
      .spotlight-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 80% 70% at 50% 48%,
          rgba(20, 20, 20, 0.05) 0%,
          rgba(20, 20, 20, 0.4) 55%,
          rgba(20, 20, 20, 0.8) 100%
        );
        pointer-events: none;
      }

      /* Constant signature bottom orange bar */
      .bottom-orange-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 50;
      }

      /* Overlay clips */
      .overlay-clip {
        pointer-events: none;
        z-index: 30;
      }

      /* Overlay 1: Label ("ĐƯỜNG CÓ THỂ QUAY") */
      #overlay-label-inner {
        position: absolute;
        top: 260px;
        left: 60px;
        right: 60px;
        height: auto;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 22px 32px;
        border-radius: 8px;
        border-left: 10px solid #FF6A1A;
        will-change: transform, opacity;
      }
      .label-indicator {
        width: 14px;
        height: 14px;
        background-color: #FF6A1A;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .label-text {
        font-size: 38px;
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin: 0;
      }

      /* Overlay 2: Punch phrase ("KHÔNG THỂ QUAY ĐẦU") */
      #overlay-punch-inner {
        position: absolute;
        top: 880px;
        left: 60px;
        right: 60px;
        height: auto;
        padding: 44px 44px;
        border-radius: 12px;
        border: 2px solid rgba(255, 106, 26, 0.45);
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }
      .punch-line-top {
        font-size: 68px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      .punch-highlight-box {
        display: inline-block;
        background-color: #FF6A1A;
        padding: 6px 24px;
        border-radius: 6px;
        transform-origin: 0% 50%;
        will-change: transform;
      }
      .punch-line-bottom {
        font-size: 74px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #141414;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s32"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6"
    >
      <!-- Shot S32-1 Main Visual Clip -->
      <section id="shot-s32-1-bg" class="clip" data-start="0" data-duration="6">
        <div id="bg-camera" class="bg-camera">
          <img
            id="bg-image"
            class="bg-image"
            src="assets/img-07-torn-road-uturn-justice-scale.jpg"
            alt="Con đường rách toạc làm đứt đoạn mũi tên quay đầu xe trước cán cân công lý"
          />
          <div class="spotlight-vignette"></div>
        </div>
        <div class="bottom-orange-bar"></div>
      </section>

      <!-- Overlay 1 Clip: Label (at 0.99s, hold 2.50s) -->
      <section id="overlay-label-clip" class="clip overlay-clip" data-start="0.99" data-duration="2.5">
        <div id="overlay-label-inner" class="hf-plate-ink">
          <div class="label-indicator"></div>
          <div class="label-text hf-text-light">ĐƯỜNG CÓ THỂ QUAY</div>
        </div>
      </section>

      <!-- Overlay 2 Clip: Punch Phrase (at 3.21s, hold to end) -->
      <section id="overlay-punch-clip" class="clip overlay-clip" data-start="3.21" data-duration="2.79">
        <div id="overlay-punch-inner" class="hf-plate-ink">
          <div class="punch-line-top hf-text-light">KHÔNG THỂ</div>
          <div id="punch-highlight-box" class="punch-highlight-box">
            <span class="punch-line-bottom">QUAY ĐẦU</span>
          </div>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Strike entrance on visual background: high-impact slam at t = 0
      tl.fromTo(
        "#bg-camera",
        { scale: 1.15, y: -45, opacity: 0 },
        { scale: 1.0, y: 0, opacity: 1, duration: 0.35, ease: "power4.out" },
        0
      );

      // Micro-shake impact vibration
      tl.to("#bg-camera", { y: 12, duration: 0.05, ease: "power1.inOut" }, 0.35);
      tl.to("#bg-camera", { y: -8, duration: 0.05, ease: "power1.inOut" }, 0.40);
      tl.to("#bg-camera", { y: 4, duration: 0.05, ease: "power1.inOut" }, 0.45);
      tl.to("#bg-camera", { y: 0, duration: 0.05, ease: "power1.out" }, 0.50);

      // Continuous cinematic camera zoom-in focusing on the torn road and justice scale
      tl.fromTo(
        "#bg-camera",
        { scale: 1.0 },
        { scale: 1.08, duration: 5.5, ease: "none" },
        0.50
      );

      // 2. Overlay 1 (Label: "ĐƯỜNG CÓ THỂ QUAY") entrance at 0.99s
      tl.fromTo(
        "#overlay-label-inner",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.99
      );
      // Exit fade-out before label clip ends
      tl.to(
        "#overlay-label-inner",
        { y: -15, opacity: 0, duration: 0.28, ease: "power2.in" },
        3.20
      );

      // 3. Overlay 2 (Punch-phrase: "KHÔNG THỂ QUAY ĐẦU") strike entrance at 3.21s
      tl.fromTo(
        "#overlay-punch-inner",
        { scale: 1.15, opacity: 0, y: 25 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.45, ease: "power4.out" },
        3.21
      );
      // Dynamic expansion of the orange highlight tag
      tl.fromTo(
        "#punch-highlight-box",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.35, ease: "power3.out" },
        3.40
      );

      // Register root paused timeline
      window.__timelines["scene-s32"] = tl;
    </script>
  
    </template>
  </body>
</html>
