<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #F5F0E4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Màu sắc chuẩn quy ước */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
      .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
      .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
      .hf-plate-paper { background-color: #E7E3D9; color: #141414; }

      /* Khối chứa ảnh toàn cảnh để pan */
      .photo-viewport {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background-color: #F5F0E4;
      }
      .bg-photo {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 1280px;
        max-width: none;
        object-fit: cover;
        object-position: left center;
        display: block;
        transform-origin: 50% 50%;
      }

      /* Header văn bản tố tụng / hiện trường (y=190px an toàn) */
      .doc-header-card {
        position: absolute;
        top: 190px;
        left: 60px;
        width: 960px;
        background-color: #141414;
        border-left: 8px solid #FF6A1A;
        padding: 22px 28px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
        z-index: 20;
      }
      .doc-badge-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 8px;
      }
      .doc-pill {
        display: inline-block;
        background-color: #FF6A1A;
        color: #141414;
        font-weight: 900;
        font-size: 20px;
        line-height: 1;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 8px 14px;
        border-radius: 4px;
      }
      .doc-ref {
        font-size: 22px;
        font-weight: 700;
        color: #F7F4EC;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .doc-title {
        margin: 0;
        font-size: 38px;
        font-weight: 900;
        line-height: 1.28;
        color: #F7F4EC;
        letter-spacing: -0.01em;
      }

      /* Badge Overlay 1: BẮT QUẢ TANG */
      .badge-container-1 {
        position: absolute;
        top: 880px;
        left: 60px;
        width: 580px;
        z-index: 30;
      }
      .badge-card {
        background-color: #141414;
        border-left: 8px solid #FF6A1A;
        padding: 24px 28px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
        transform-origin: 0% 50%;
      }
      .badge-tag {
        display: inline-block;
        background-color: #FF6A1A;
        color: #141414;
        font-size: 20px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 6px 14px;
        border-radius: 4px;
        margin-bottom: 12px;
      }
      .badge-headline {
        margin: 0 0 8px 0;
        font-size: 64px;
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: 0.02em;
        color: #FF6A1A;
      }
      .badge-sub {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        color: #F7F4EC;
        letter-spacing: 0.02em;
      }

      /* Badge Overlay 2: CẤP CỨU VIỆN */
      .badge-container-2 {
        position: absolute;
        top: 1080px;
        left: 440px;
        width: 580px;
        z-index: 30;
      }

      /* Dải cam thương hiệu cố định mép đáy */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s12"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.2"
    >
      <!-- Shot S12-1: Trượt lên và pan ngang cảnh khống chế sang xe cứu thương -->
      <section id="shot-s12" class="clip" data-start="0" data-duration="7.2">
        <div id="scene-wrapper" class="clip">
          <!-- Ảnh nền fit chiều cao 1920px và pan-right chậm -->
          <div class="photo-viewport" data-layout-allow-overflow="true">
            <img
              id="bg-photo"
              class="bg-photo"
              src="assets/img-10-police-arresting-young-suspect.jpg"
              alt="Hiện trường khống chế đối tượng và xe cứu thương"
            />
          </div>

          <!-- Header hồ sơ tài liệu pháp lý (Visual language: document) -->
          <div id="doc-header" class="doc-header-card">
            <div class="doc-badge-row">
              <span class="doc-pill">BIÊN BẢN TỐ TỤNG</span>
              <span class="doc-ref">HIỆN TRƯỜNG VỤ ÁN</span>
            </div>
            <h1 class="doc-title">KHỐNG CHẾ ĐỐI TƯỢNG // CẤP CỨU NẠN NHÂN</h1>
          </div>
        </div>
      </section>

      <!-- Overlay 1: BẮT QUẢ TANG (tương ứng atMs: 110960, holdMs: 2600) -->
      <section
        id="clip-overlay-1"
        class="clip"
        data-start="3.56"
        data-duration="2.6"
      >
        <div class="badge-container-1">
          <div id="card-overlay-1" class="badge-card">
            <div class="badge-tag">HÀNH VI PHẠM TỘI</div>
            <div class="badge-headline">BẮT QUẢ TANG</div>
            <p class="badge-sub">LẬP BIÊN BẢN TẠI CHỖ</p>
          </div>
        </div>
      </section>

      <!-- Overlay 2: CẤP CỨU VIỆN (tương ứng atMs: 113420, holdMs: 2000 -> đến hết scene) -->
      <section
        id="clip-overlay-2"
        class="clip"
        data-start="6.02"
        data-duration="1.18"
      >
        <div class="badge-container-2">
          <div id="card-overlay-2" class="badge-card">
            <div class="badge-tag">XE CỨU THƯƠNG</div>
            <div class="badge-headline">CẤP CỨU VIỆN</div>
            <p class="badge-sub">CHUYỂN VIỆN KHẨN CẤP</p>
          </div>
        </div>
      </section>

      <!-- Thanh màu cam đặc trưng phong cách Vox cố định đáy -->
      <div id="brand-bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance animation: rise (trượt thẳng lên từ dưới vào đầu scene)
      tl.fromTo(
        "#scene-wrapper",
        { y: 160, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
        0
      );

      // 2. Header thẻ tài liệu xuất hiện ngay sau cú trượt
      tl.fromTo(
        "#doc-header",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.35
      );

      // 3. Camera motion: pan-right chậm từ đối tượng bị khống chế sang xe cứu thương
      tl.fromTo(
        "#bg-photo",
        { x: 0, scale: 1.16 },
        { x: -160, scale: 1.16, duration: 6.4, ease: "sine.inOut" },
        0.8
      );

      // 4. Overlay 1 xuất hiện vững chãi (BẮT QUẢ TANG)
      tl.fromTo(
        "#card-overlay-1",
        { scale: 0.75, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        3.56
      );

      // 5. Overlay 2 xuất hiện ở khu vực xe cứu thương (CẤP CỨU VIỆN)
      tl.fromTo(
        "#card-overlay-2",
        { scale: 0.75, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        6.02
      );

      // Đăng ký timeline gốc vào HyperFrames runtime
      window.__timelines["scene-s12"] = tl;
    </script>
  
    </template>
  </body>
</html>
