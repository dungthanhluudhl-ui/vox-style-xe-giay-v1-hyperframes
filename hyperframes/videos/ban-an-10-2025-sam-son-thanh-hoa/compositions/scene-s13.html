      // Khởi tạo GSAP Timeline chính (bắt buộc paused: true)
      const tl = gsap.timeline({ paused: true });

      // Chuẩn bị đường vẽ SVG (stroke-dashoffset)
      const slope1 = document.getElementById("slope-line-1");
      if (slope1) {
        const len1 = slope1.getTotalLength();
        slope1.style.strokeDasharray = len1;
        slope1.style.strokeDashoffset = len1;
      }

      const slope2 = document.getElementById("slope-line-2");
      if (slope2) {
        const len2 = slope2.getTotalLength();
        slope2.style.strokeDasharray = len2;

      // 0.0s - 0.9s: Hiệu ứng vào cảnh spiral (xoay nhẹ và bung nở)
      tl.fromTo(
        "#diagram-stage",
        { scale: 0.88, rotation: -3.5, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.9, ease: "power3.out" },
        0
      );

      // Header trượt xuống
      tl.fromTo(
        "#header-group",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" },
        0.2
      );

      // 0.8s - 1.6s: BẬC 1 xuất hiện
      tl.fromTo(
        "#step-1",
        { x: -70, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.8
      );

      // OVERLAY 1: "BAN ĐẦU: LỖI GIAO THÔNG" xuất hiện đúng 1.6s

        "#label-1",
        { scale: 0.9, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.6
      );

      // 3.2s - 4.0s: Mũi tên dốc trượt 1 bắt đầu vẽ và rơi xuống
      tl.fromTo(
        "#slope-tag-1",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        3.2
      );
      tl.to(
        "#slope-line-1",
        { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" },
        3.3
      );

      // BẬC 2 trượt vào vị trí
      tl.fromTo(
        "#step-2",
        { x: 80, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        3.9

      // OVERLAY 2: "KHÔNG CHỊU DỪNG LẠI" xuất hiện đúng 4.46s

        "#label-2",
        { scale: 0.9, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        4.46
      );

      // 5.8s - 6.6s: Mũi tên rơi xuống vực thẳm 2
      tl.fromTo(
        "#slope-tag-2",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        5.8
      );
      tl.to(
        "#slope-line-2",
        { strokeDashoffset: 0, duration: 0.65, ease: "power2.in" },
        5.9
      );

      // BẬC 3 (Hố sâu hình sự) dập mạnh từ dưới lên
      tl.fromTo(
        "#step-3",
        { y: 60, scale: 0.95, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
        6.5

      // Còng số 8 khép lại

        "#handcuffs-svg",
        { scale: 0.4, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        6.8
      );

      // OVERLAY 3: PUNCH-PHRASE "TỰ HÓA THÀNH HÌNH SỰ" dập mạnh đúng 7.13s
      tl.fromTo(
        "#punch-box",
        { scale: 1.25, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power4.out" },
        7.13
      );

      // Dòng mô tả bản chất xuất hiện theo sau

        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        7.4
      );
