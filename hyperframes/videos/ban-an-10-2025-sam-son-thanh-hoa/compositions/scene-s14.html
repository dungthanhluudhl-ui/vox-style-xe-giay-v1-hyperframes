<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #F5F0E4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #F5F0E4;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Base layout & camera containers */
      #scene-flip {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        will-change: transform, opacity;
      }
      #camera-rig {
        position: absolute;
        inset: 0;
        will-change: transform;
      }
      .bg-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Style DNA safe plates & typography */
      .hf-plate-ink {
        background: #141414;
        color: #F7F4EC;
      }
      .hf-hl-orange {
        background: #FF6A1A;
        color: #141414;
      }

      /* Overlay 1: Administrative fine question */
      #clip-overlay-1 {
        pointer-events: none;
        z-index: 10;
      }
      .plate-box {
        position: absolute;
        top: 300px;
        left: 60px;
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 16px 28px;
        border-left: 8px solid #FF6A1A;
        border-radius: 4px;
        will-change: transform, opacity;
      }
      .label-text {
        font-size: 44px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: 0.5px;
        color: #F7F4EC;
        text-transform: uppercase;
        margin: 0;
      }

      /* Overlay 2: Criminal prosecution punch phrase */
      #clip-overlay-2 {
        pointer-events: none;
        z-index: 20;
      }
      .punch-box {
        position: absolute;
        top: 430px;
        left: 60px;
        display: inline-flex;
        align-items: center;
        padding: 18px 32px;
        border-radius: 4px;
        will-change: transform, opacity;
      }
      .punch-text {
        font-size: 64px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: -0.5px;
        color: #141414;
        text-transform: uppercase;
        margin: 0;
      }

      /* Signature bottom orange bar */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 10px;
        background: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s14"
      data-width="1080"
      data-height="1920"
      data-duration="5.48"
    >
      <!-- Background photo with camera pan and entrance flip -->
      <section id="shot-bg" class="clip" data-start="0" data-duration="5.48">
        <div id="scene-flip">
          <div id="camera-rig">
            <img
              class="bg-image"
              src="assets/img-09-admin-fine-vs-criminal-code.jpg"
              alt="Biên bản xử phạt hành chính đối đầu Bộ luật Hình sự"
            />
          </div>
        </div>
      </section>

      <!-- Overlay 1: Label question (Phạt hành chính thôi?) -->
      <div id="clip-overlay-1" class="clip" data-start="2.6" data-duration="2.88">
        <div class="plate-box hf-plate-ink">
          <h2 class="label-text">PHẠT HÀNH CHÍNH THÔI?</h2>
        </div>
      </div>

      <!-- Overlay 2: Punch phrase (Sao lại truy tố?) -->
      <div id="clip-overlay-2" class="clip" data-start="4.12" data-duration="1.36">
        <div class="punch-box hf-hl-orange">
          <h1 class="punch-text">SAO LẠI TRUY TỐ?</h1>
        </div>
      </div>

      <!-- Bottom bar brand signature -->
      <div id="brand-bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance flip transition on scene container
      tl.fromTo(
        "#scene-flip",
        { rotationY: -14, transformPerspective: 1200, opacity: 0 },
        { rotationY: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0
      );

      // 2. Camera motion: Pan right from administrative fine side to criminal code side
      tl.fromTo(
        "#camera-rig",
        { scale: 1.15, x: 65, y: 0 },
        { scale: 1.15, x: -65, y: 0, duration: 5.48, ease: "none" },
        0
      );

      // 3. Overlay 1 entrance at 2.6s (atMs: 123720)
      tl.fromTo(
        ".plate-box",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        2.6
      );

      // 4. Overlay 2 punch phrase entrance at 4.12s (atMs: 125240)
      tl.fromTo(
        ".punch-box",
        { scale: 0.85, y: 30, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        4.12
      );

      window.__timelines["scene-s14"] = tl;
    </script>
  
    </template>
  </body>
</html>
