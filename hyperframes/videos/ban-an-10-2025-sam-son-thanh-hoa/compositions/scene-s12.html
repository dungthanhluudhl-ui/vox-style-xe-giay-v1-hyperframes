<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #E7E3D9;
      }

      /* Base clip convention */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Background Photo: Full-bleed 1080x1920 */
      #bg-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 1;
      }
      #bg-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 50% 65%;
      }

      /* Chart Background Variant Grid Overlay */
      #chart-overlay {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }
      .chart-rule {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: rgba(20, 20, 20, 0.28);
      }
      .chart-tick {
        position: absolute;
        left: 0;
        top: -4px;
        width: 18px;
        height: 10px;
        background: #FF6A1A;
      }

      /* Shared Plate & Typography Classes */
      .hf-plate-ink {
        background: #141414;
        opacity: 1;
      }
      .hf-text-light {
        color: #F7F4EC;
      }
      .hf-text-orange {
        color: #FF6A1A;
      }

      /* Overlay 1: ÁP GIẢI VỀ TRỤ SỞ */
      #overlay-1 {
        z-index: 20;
      }
      .label-card {
        position: absolute;
        top: 220px;
        left: 60px;
        right: 60px;
        height: auto;
        padding: 24px 32px;
        border-radius: 12px;
        border-left: 10px solid #FF6A1A;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .label-header {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .status-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #FF6A1A;
        display: inline-block;
      }
      .label-text {
        font-weight: 900;
        font-size: 50px;
        line-height: 1.25;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin: 0;
      }

      /* Overlay 2: ĐO NỒNG ĐỘ CỒN */
      #overlay-2 {
        z-index: 20;
      }
      .meter-card {
        position: absolute;
        top: 220px;
        left: 60px;
        right: 60px;
        height: auto;
        padding: 24px 32px;
        border-radius: 12px;
        border-left: 10px solid #FF6A1A;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .meter-track {
        width: 100%;
        height: 10px;
        background: rgba(247, 244, 236, 0.2);
        border-radius: 5px;
        overflow: hidden;
      }
      .meter-fill {
        width: 100%;
        height: 100%;
        background: #FF6A1A;
        transform-origin: left center;
        transform: scaleX(0);
      }

      /* Overlay 3: Punch-phrase 0.50 MG/L KHÍ THỞ */
      #overlay-3 {
        z-index: 30;
      }
      .punch-card {
        position: absolute;
        top: 660px;
        left: 60px;
        right: 60px;
        height: auto;
        padding: 40px 36px;
        border-radius: 16px;
        border: 4px solid #FF6A1A;
        box-shadow: 0 24px 56px rgba(0, 0, 0, 0.65);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .punch-data-row {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 16px;
      }
      .punch-number {
        font-weight: 900;
        font-size: 130px;
        line-height: 1;
        letter-spacing: -2px;
        color: #FF6A1A;
      }
      .punch-unit {
        font-weight: 900;
        font-size: 54px;
        line-height: 1;
        color: #F7F4EC;
        letter-spacing: 1px;
      }
      .punch-divider {
        width: 120px;
        height: 6px;
        background: #FF6A1A;
        margin: 20px 0 16px 0;
      }
      .punch-subtitle {
        font-weight: 900;
        font-size: 46px;
        line-height: 1.2;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #F7F4EC;
      }

      /* Fixed Signature Orange Bottom Bar */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s12"
      data-width="1080"
      data-height="1920"
      data-duration="9.04"
    >
      <!-- Background Photo with slow zoom-in -->
      <div id="bg-wrapper" class="clip" data-start="0" data-duration="9.04" data-layout-allow-overflow>
        <img
          id="bg-img"
          src="assets/img-08-breathalyzer-test-suspect-investigation.jpg"
          alt="Kiểm tra nồng độ cồn tại trụ sở"
        />
      </div>

      <!-- Chart variant lines (20%, 40%, 60%, 80%) -->
      <div id="chart-overlay" class="clip" data-start="0" data-duration="9.04" aria-hidden="true">
        <div class="chart-rule" style="top: 20%;"><span class="chart-tick"></span></div>
        <div class="chart-rule" style="top: 40%;"><span class="chart-tick"></span></div>
        <div class="chart-rule" style="top: 60%;"><span class="chart-tick"></span></div>
        <div class="chart-rule" style="top: 80%;"><span class="chart-tick"></span></div>
      </div>

      <!-- Overlay 1: ÁP GIẢI VỀ TRỤ SỞ (105160ms -> 1.52s, hold 2.0s) -->
      <div id="overlay-1" class="clip" data-start="1.52" data-duration="2.40">
        <div id="overlay-1-box" class="label-card hf-plate-ink">
          <div class="label-header">
            <span class="status-dot"></span>
            <span class="label-text hf-text-light">ÁP GIẢI VỀ TRỤ SỞ</span>
          </div>
        </div>
      </div>

      <!-- Overlay 2: ĐO NỒNG ĐỘ CỒN (108120ms -> 4.48s, hold 2.0s) -->
      <div id="overlay-2" class="clip" data-start="4.48" data-duration="2.50">
        <div id="overlay-2-box" class="meter-card hf-plate-ink">
          <div class="label-header">
            <span class="status-dot"></span>
            <span class="label-text hf-text-light">ĐO NỒNG ĐỘ CỒN</span>
          </div>
          <div class="meter-track">
            <div id="meter-fill" class="meter-fill"></div>
          </div>
        </div>
      </div>

      <!-- Overlay 3: Punch-phrase 0.50 MG/L KHÍ THỞ (111180ms -> 7.54s, hold 1.5s to end) -->
      <div id="overlay-3" class="clip" data-start="7.54" data-duration="1.50">
        <div id="punch-box" class="punch-card hf-plate-ink">
          <div class="punch-data-row">
            <span id="counter-val" class="punch-number">0.50</span>
            <span class="punch-unit">MG/L</span>
          </div>
          <div class="punch-divider"></div>
          <div class="punch-subtitle">KHÍ THỞ</div>
        </div>
      </div>

      <!-- Brand Signature Bottom Orange Bar -->
      <div id="brand-bottom-bar"></div>
    </div>

    <script>
      // Single paused master timeline for HyperFrames
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s12"] = tl;

      // 1. Camera Motion: Punch entrance at t=0, followed by slow push-in focusing on breathalyzer
      tl.fromTo(
        "#bg-img",
        { scale: 1.08, y: 0 },
        { scale: 1.0, y: 0, duration: 0.6, ease: "power3.out" },
        0
      );
      tl.to(
        "#bg-img",
        { scale: 1.15, y: -35, duration: 8.44, ease: "none" },
        0.6
      );

      // 2. Overlay 1 ("ÁP GIẢI VỀ TRỤ SỞ") at 1.52s
      tl.fromTo(
        "#overlay-1-box",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        1.52
      );
      tl.to(
        "#overlay-1-box",
        { y: -20, opacity: 0, duration: 0.3, ease: "power2.in" },
        3.60
      );

      // 3. Overlay 2 ("ĐO NỒNG ĐỘ CỒN") at 4.48s with progress fill
      tl.fromTo(
        "#overlay-2-box",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        4.48
      );
      tl.fromTo(
        "#meter-fill",
        { scaleX: 0 },
        { scaleX: 1, duration: 1.4, ease: "power2.inOut" },
        4.75
      );
      tl.to(
        "#overlay-2-box",
        { y: -20, opacity: 0, duration: 0.3, ease: "power2.in" },
        6.65
      );

      // 4. Overlay 3 Punch Climax ("0.50 MG/L KHÍ THỞ") at 7.54s
      tl.fromTo(
        "#punch-box",
        { scale: 0.84, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power4.out" },
        7.54
      );

      // Digital counter jumping from 0.00 to 0.50
      const counterTarget = { val: 0 };
      const counterEl = document.getElementById("counter-val");
      tl.fromTo(
        counterTarget,
        { val: 0 },
        {
          val: 0.5,
          duration: 0.38,
          ease: "power2.out",
          onUpdate: function () {
            if (counterEl) {
              counterEl.textContent = counterTarget.val.toFixed(2);
            }
          }
        },
        7.54
      );
    </script>
  
    </template>
  </body>
</html>
