<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        background-color: #141414;
        color: #F7F4EC;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #141414;
      }

      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Style DNA tokens & safe contrast utility classes */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
      .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
      .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
      .hf-plate-paper { background-color: #F5F0E4; color: #141414; }

      /* Signature bottom orange bar (Style DNA) */
      #bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 8px;
        background-color: #FF6A1A;
        z-index: 999;
      }

      /* Background Photo Layer (giữ nguyên màu gốc ảnh AI Flow, không filter/blend-mode) */
      #bg-photo-wrapper {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      #bg-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Overlay 1: Stamp TUYÊN 9 THÁNG TÙ (tại 1.22s) */
      .overlay-container-stamp {
        position: absolute;
        top: 260px;
        left: 60px;
        right: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
      }

      #stamp-card {
        background-color: #141414;
        border: 4px solid #FF6A1A;
        border-radius: 16px;
        padding: 30px 44px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .stamp-badge {
        background-color: #FF6A1A;
        color: #141414;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 2px;
        padding: 6px 20px;
        border-radius: 6px;
        text-transform: uppercase;
      }

      .stamp-title {
        color: #F7F4EC;
        font-size: 64px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -1px;
      }

      .stamp-sub {
        color: #FF6A1A;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      /* Legal Arrow SVG Layer (tại 3.24s) */
      #legal-svg-layer {
        position: absolute;
        inset: 0;
        z-index: 12;
      }

      /* Overlay 2: Punch Phrase VẪN ĐƯỢC VỀ NHÀ? (tại 3.24s) */
      .overlay-container-punch {
        position: absolute;
        top: 480px;
        left: 60px;
        right: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 20;
      }

      #punch-card {
        background-color: #141414;
        border-left: 14px solid #FF6A1A;
        border-radius: 20px;
        padding: 38px 46px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
        width: 100%;
        max-width: 960px;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .punch-badge {
        background-color: #FF6A1A;
        color: #141414;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 2px;
        padding: 8px 24px;
        border-radius: 6px;
        text-transform: uppercase;
      }

      .punch-headline {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .punch-text-top {
        color: #F7F4EC;
        font-size: 68px;
        font-weight: 900;
        line-height: 1.15;
      }

      .punch-text-bottom {
        color: #FF6A1A;
        font-size: 84px;
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: -1px;
      }

      .punch-tagline {
        background-color: #F5F0E4;
        color: #141414;
        font-size: 26px;
        font-weight: 700;
        padding: 8px 26px;
        border-radius: 8px;
        letter-spacing: 1px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s03"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="5.8"
    >
      <!-- Background Photo Shot S03-1 (Full frame 9:16) -->
      <section id="shot-bg" class="clip" data-start="0" data-duration="5.8">
        <div id="bg-photo-wrapper">
          <img
            id="bg-photo"
            src="assets/img-01-suspended-sentence-vs-prison.jpg"
            alt="Mâu thuẫn giữa 9 tháng tù và được về nhà"
          />
        </div>
      </section>

      <!-- Overlay 1: Stamp Label (atMs: 18820 -> 1.22s, holdMs: 1800 -> 1.80s) -->
      <section id="shot-stamp" class="clip" data-start="1.22" data-duration="1.80">
        <div class="overlay-container-stamp">
          <div id="stamp-card">
            <div class="stamp-badge">QUYẾT ĐỊNH TOÀ ÁN</div>
            <div class="stamp-title">TUYÊN 9 THÁNG TÙ</div>
            <div class="stamp-sub">HỘI ĐỒNG XÉT XỬ</div>
          </div>
        </div>
      </section>

      <!-- Legal Arrow SVG: Mũi tên pháp lý rẽ nhánh (atMs: 20840 -> 3.24s) -->
      <section id="shot-arrow" class="clip" data-start="3.24" data-duration="2.56">
        <svg id="legal-svg-layer" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <!-- Start anchor dot at prison side -->
          <circle id="arrow-dot-start" cx="260" cy="1160" r="14" fill="#FF6A1A" />
          <!-- Branching arc curving towards home side -->
          <path
            id="branch-path"
            d="M 260 1160 Q 540 920 800 1120"
            fill="none"
            stroke="#FF6A1A"
            stroke-width="10"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <!-- Arrow head pointing to home side -->
          <polygon
            id="arrow-head"
            points="780,1085 830,1125 775,1150"
            fill="#FF6A1A"
          />
        </svg>
      </section>

      <!-- Overlay 2: Punch-phrase VẪN ĐƯỢC VỀ NHÀ? (atMs: 20840 -> 3.24s, holdMs: 2400) -->
      <section id="shot-punch" class="clip" data-start="3.24" data-duration="2.56">
        <div class="overlay-container-punch">
          <div id="punch-card">
            <div class="punch-badge">NGHỊCH LÝ PHÁP LÝ</div>
            <div class="punch-headline">
              <span class="punch-text-top">VẪN ĐƯỢC</span>
              <span class="punch-text-bottom">VỀ NHÀ?</span>
            </div>
            <div class="punch-tagline">ÁP DỤNG ÁN TREO</div>
          </div>
        </div>
      </section>

      <!-- Signature Orange Bar at the very bottom -->
      <div id="bottom-bar"></div>
    </div>

    <script>
      // Single paused GSAP timeline bound strictly to window.__timelines["scene-s03"]
      const tl = gsap.timeline({ paused: true });

      // 1. Camera Motion: Punch entrance (1.08 -> 1.0) then continuous slow zoom (1.0 -> 1.055)
      tl.fromTo(
        "#bg-photo-wrapper",
        { scale: 1.08 },
        { scale: 1.0, duration: 0.35, ease: "power3.out" },
        0
      );
      tl.fromTo(
        "#bg-photo-wrapper",
        { scale: 1.0 },
        { scale: 1.055, duration: 5.45, ease: "none" },
        0.35
      );

      // 2. Overlay 1: Stamp "TUYÊN 9 THÁNG TÙ" entrance and exit
      tl.fromTo(
        "#stamp-card",
        { scale: 1.4, opacity: 0, rotation: 6 },
        { scale: 1.0, opacity: 1, rotation: -2, duration: 0.35, ease: "power4.out" },
        1.22
      );
      tl.fromTo(
        "#stamp-card",
        { opacity: 1, scale: 1.0 },
        { opacity: 0, scale: 0.95, duration: 0.2, ease: "power2.in" },
        2.80
      );

      // 3. SVG Arrow Path Draw (mũi tên rẽ nhánh từ tù sang nhà)
      const branchPath = document.getElementById("branch-path");
      const pathLength = branchPath ? branchPath.getTotalLength() : 620;
      if (branchPath) {
        branchPath.style.strokeDasharray = pathLength;
        branchPath.style.strokeDashoffset = pathLength;
      }

      tl.fromTo(
        "#arrow-dot-start",
        { scale: 0, opacity: 0, transformOrigin: "260px 1160px" },
        { scale: 1, opacity: 1, duration: 0.2, ease: "power2.out" },
        3.24
      );

      tl.fromTo(
        "#branch-path",
        { strokeDashoffset: pathLength },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        3.30
      );

      tl.fromTo(
        "#arrow-head",
        { scale: 0, opacity: 0, transformOrigin: "800px 1120px" },
        { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" },
        3.80
      );

      // 4. Overlay 2: Punch Phrase "VẪN ĐƯỢC VỀ NHÀ?" entrance (punch at 3.24s)
      tl.fromTo(
        "#punch-card",
        { scale: 0.85, opacity: 0, y: 35 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.45, ease: "power4.out" },
        3.30
      );

      // Register timeline
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s03"] = tl;
    </script>
  
    </template>
  </body>
</html>
