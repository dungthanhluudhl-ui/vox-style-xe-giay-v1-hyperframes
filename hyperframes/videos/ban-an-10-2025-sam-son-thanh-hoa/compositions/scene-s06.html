      gsap.set("#court-stamp", { opacity: 0, scale: 2.2, rotation: 35 });

          rotationX: 14,

          transformOrigin: "50% 100%",

        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        0.35
      );

      // 1.05s: Thanh đen mã hóa quét qua che dòng tên 1
      tl.fromTo(

        { scaleX: 0 },
        { scaleX: 1, duration: 0.35, ease: "power2.out" },
        1.05
      );

      // 1.45s: Thanh đen mã hóa quét qua che dòng tên 2
      tl.fromTo(

      tl.fromTo(

        { opacity: 0, scale: 2.2, rotation: 35 },
        { opacity: 1, scale: 1, rotation: -8, duration: 0.45, ease: "power3.out" },
        1.80
      );

      // 2.55s: Overlay 1 mờ dần kết thúc thời gian hiển thị (hold 2.2s)
      tl.to(
        "#overlay-1",
        { opacity: 0, y: -16, duration: 0.30, ease: "power2.in" },

        { opacity: 0, scale: 0.92, y: 20 },
        { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" },

        4.10
      );

      // 6.30s: Overlay 2 mờ dần kết thúc thời gian hiển thị (hold 2.4s)
      tl.to(

        { opacity: 0, y: -16, duration: 0.30, ease: "power2.in" },

        { borderColor: "rgba(20, 20, 20, 0.15)", duration: 0.4, ease: "power2.out" },

      );

      );
