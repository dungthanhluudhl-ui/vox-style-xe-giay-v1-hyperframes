<!doctype html>
<html>
  <head>

  </head>

      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Lớp camera & hình ảnh hiện trường */
    .camera-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .bg-evidence-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }

    /* Hiệu ứng bóc tách tài liệu (Peel transition) */
    .peel-surface {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      background-image: 
        linear-gradient(rgba(20, 20, 20, 0.15) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(20, 20, 20, 0.15) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      will-change: clip-path;
    }

    /* Thẻ thông tin giám định (Forensic Cards) */
    .overlay-card {
      position: absolute;
      left: 60px;
      right: 60px;
      padding: 30px 36px;
      border-radius: 16px;
      border-left: 12px solid #FF6A1A;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      opacity: 0;
    }

    .card-1-pos {
      top: 200px;
    }

    .card-2-pos {
      top: 420px;
    }

    .card-3-pos {
      top: 320px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .meta-tag {
      font-size: 20px;
      font-weight: 900;
      padding: 4px 14px;
      border-radius: 6px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -0.5px;
    }

    .card-status-row {
      margin-top: 18px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      border-radius: 8px;
    }

    .status-icon {
      width: 24px;
      height: 24px;
      display: block;
    }

    .status-text {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    /* Thẻ kết luận nguyên tắc chứng cứ (Punch Phrase) */
    .punch-card {
      position: absolute;
      top: 540px;
      left: 60px;
      right: 60px;
      padding: 44px 40px;
      border-radius: 20px;
      border: 4px solid #FF6A1A;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      opacity: 0;
    }

    .punch-header {
      margin-bottom: 20px;
    }

    .punch-pill {
      display: inline-block;
      font-size: 24px;
      font-weight: 900;
      padding: 6px 18px;
      border-radius: 6px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .punch-title {
      font-size: 76px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -1.5px;
      margin-bottom: 16px;
    }

    .punch-sub {
      font-size: 34px;
      font-weight: 900;
      line-height: 1.35;
      letter-spacing: 0.5px;
    }

    /* Thanh thương hiệu cố định mép dưới */
    #bottom-brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 14px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s18"
    data-width="1080"
    data-height="1920"
    data-duration="12.48"
    data-start="0"
  >
    <!-- Lớp hình ảnh nền: Bảng ghim giám định kỹ thuật hình sự (img-02), giữ nguyên màu ảnh gốc -->
    <section id="clip-bg" class="clip" data-start="0" data-duration="12.48" data-track-index="0">
      <div id="camera-viewport" class="camera-viewport">
        <img
          id="bg-evidence-img"
          class="bg-evidence-img"
          src="assets/img-02-forensic-evidence-board-fight-analysis.jpg"
          alt="Bảng phân tích chứng cứ điện tử"
          data-layout-allow-overflow
        />
      </div>
    </section>

    <!-- Lớp hiệu ứng lật mở tài liệu (Peel in) -->
    <div id="clip-peel" class="clip" data-start="0" data-duration="0.9" data-track-index="1" style="z-index: 20; pointer-events: none;">
      <div id="peel-surface" class="peel-surface"></div>
    </div>

    <!-- Overlay 1: THU GIỮ 3 VIDEO (1.57s -> 3.57s) -->
    <div id="clip-overlay-1" class="clip" data-start="1.57" data-duration="2.0" data-track-index="2" style="z-index: 30; pointer-events: none;">
      <div id="card-1" class="overlay-card hf-plate-ink card-1-pos">
        <div class="card-meta">
          <span class="meta-tag hf-hl-orange">CHỨNG CỨ ĐIỆN TỬ</span>
        </div>
        <div class="card-title hf-text-light">THU GIỮ 3 VIDEO</div>
      </div>
    </div>

    <!-- Overlay 2: 2 VIDEO: KHÔNG CẮT GHÉP (3.16s -> 6.56s) -->
    <div id="clip-overlay-2" class="clip" data-start="3.16" data-duration="3.4" data-track-index="3" style="z-index: 31; pointer-events: none;">
      <div id="card-2" class="overlay-card hf-plate-ink card-2-pos">
        <div class="card-meta">
          <span class="meta-tag hf-hl-orange">KỸ THUẬT HÌNH SỰ</span>
        </div>
        <div class="card-title hf-text-light">2 VIDEO: KHÔNG CẮT GHÉP</div>
        <div class="card-status-row">
          <div class="status-pill hf-plate-paper">
            <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span class="status-text hf-text-ink">KHÔNG PHÁT HIỆN CẮT GHÉP</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Overlay 3: 1 VIDEO: BỊ GIÁN ĐOẠN (6.70s -> 9.40s) -->
    <div id="clip-overlay-3" class="clip" data-start="6.70" data-duration="2.7" data-track-index="4" style="z-index: 32; pointer-events: none;">
      <div id="card-3" class="overlay-card hf-plate-ink card-3-pos">
        <div class="card-meta">
          <span class="meta-tag hf-hl-orange">KỸ THUẬT HÌNH SỰ</span>
        </div>
        <div class="card-title hf-text-light">1 VIDEO: BỊ GIÁN ĐOẠN</div>
        <div class="card-status-row">
          <div class="status-pill hf-hl-orange">
            <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span class="status-text hf-text-ink">KHÔNG XÁC ĐỊNH ĐƯỢC</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Overlay 4: Punch-phrase PHẢI ĐỦ CĂN CỨ (9.57s -> 12.48s) -->
    <div id="clip-overlay-4" class="clip" data-start="9.57" data-duration="2.91" data-track-index="5" style="z-index: 33; pointer-events: none;">
      <div id="card-4" class="punch-card hf-plate-ink">
        <div class="punch-header">
          <span class="punch-pill hf-hl-orange">ĐÁNH GIÁ CHỨNG CỨ</span>
        </div>
        <div class="punch-title hf-text-light">PHẢI ĐỦ CĂN CỨ</div>
        <div class="punch-sub hf-plate-ink-orange">KHÔNG TỰ ĐỘNG CHỨNG MINH</div>
      </div>
    </div>

    <!-- Dải nhận diện thương hiệu cố định mép đáy -->
    <div id="bottom-brand-bar"></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. Camera pan chậm duyệt qua bảng phân tích chứng cứ điện tử
    tl.fromTo(
      "#bg-evidence-img",
      { scale: 1.14, y: -45, x: 20 },
      { scale: 1.05, y: 35, x: -20, duration: 12.48, ease: "none" },
      0
    );

    // 2. Chuyển cảnh bóc tách hồ sơ (Peel)
    tl.fromTo(
      "#peel-surface",
      { clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)" },
      { clipPath: "polygon(100% 0%, 100% 0%, 100% 100%, 100% 100%)", duration: 0.75, ease: "power2.inOut" },
      0.05
    );

    // 3. Card 1: THU GIỮ 3 VIDEO (at 1.57s, giữ đến 3.25s rồi fade ra trước 3.57s)
    tl.fromTo(
      "#card-1",
      { y: -30, opacity: 0, scale: 0.96 },
      { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
      1.57
    );
    tl.to(
      "#card-1",
      { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" },
      3.25
    );

    // 4. Card 2: 2 VIDEO: KHÔNG CẮT GHÉP (at 3.16s, giữ đến 6.15s rồi fade ra trước 6.56s)
    tl.fromTo(
      "#card-2",
      { y: -30, opacity: 0, scale: 0.96 },
      { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
      3.16
    );
    tl.to(
      "#card-2",
      { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
      6.15
    );

    // 5. Card 3: 1 VIDEO: BỊ GIÁN ĐOẠN (at 6.70s, giữ đến 9.00s rồi fade ra trước 9.40s)
    tl.fromTo(
      "#card-3",
      { y: -30, opacity: 0, scale: 0.96 },
      { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
      6.70
    );
    tl.to(
      "#card-3",
      { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
      9.00
    );

    // 6. Card 4: Punch-phrase PHẢI ĐỦ CĂN CỨ (at 9.57s, giữ chắc đến hết cảnh)
    tl.fromTo(
      "#card-4",
      { scale: 0.88, opacity: 0, y: 35 },
      { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
      9.57
    );

    // Đăng ký timeline paused vào window.__timelines
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s18"] = tl;
  </script>

  </body>
