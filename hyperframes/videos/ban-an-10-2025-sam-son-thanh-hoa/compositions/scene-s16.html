    <script>
      // Setup progressive SVG stroke paths
      const checkPath = document.getElementById("check-path");

        checkPath.style.strokeDasharray = len + "";
        checkPath.style.strokeDashoffset = len + "";

      const banSlash = document.getElementById("ban-slash");
      if (banSlash) {
        const len = banSlash.getTotalLength();
        banSlash.style.strokeDasharray = len + "";
        banSlash.style.strokeDashoffset = len + "";
      }

      // Main paused GSAP Timeline for S16
      const tl = gsap.timeline({ paused: true });

      // Phase 1: Scene Entrance (rise transition: 0.1s - 0.9s)
      tl.fromTo(
        "#header-area",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.1,
      );

      tl.fromTo(
        "#col-left",
        { y: 80, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.2,
      );

      tl.fromTo(
        "#col-right",
        { y: 80, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.32,

      tl.fromTo(
        "#divider-vs",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.45,
      );

      // Phase 2: Drawing lines of left document (0.6s - 1.4s)
      tl.fromTo(
        ".doc-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.35, stagger: 0.1, ease: "power2.out" },
        0.65,
      );

      // Subtle ambient life (bobbing / floating)
      tl.to(
        "#doc-svg",
        {
          y: -8,
          duration: 2.2,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 2,
        },
        1.1,
      );

      // Phase 3: Overlay 1 - Label "GIẢI THÍCH / KHIẾU NẠI" (at 2.94s = (140300 - 137360)/1000)
      tl.fromTo(
        "#label-lawful",
        { y: 30, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        2.94,
      );

      // Phase 3b: Overlay 2 - Check Icon (at 3.14s = (140500 - 137360)/1000)
      tl.fromTo(
        "#badge-check",
        { scale: 0, opacity: 0, rotation: -20 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: "power3.out" },
        3.14,
      );

      if (checkPath) {
        tl.to(
          "#check-path",
          { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
          3.25,
        );
      }

      // Phase 4: Overlay 3 - Punch-phrase "XÔ NGƯỜI VƯỢT CHỐT" (at 4.77s = (142130 - 137360)/1000)
      tl.fromTo(
        "#punch-unlawful",
        { scale: 0.85, y: -20, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "power4.out" },
        4.77,
      );

      // Barricade recoil reaction upon punch phrase entry
      tl.fromTo(
        "#breach-arrow",
        { x: -30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        4.77,
      );

      tl.fromTo(
        "#barrier-svg",
        { x: -8, rotation: -2 },
        { x: 0, rotation: 0, duration: 0.35, ease: "power2.out" },
        4.82,
      );

      // Phase 5: Overlay 4 - Ban Icon (at 6.23s = (143590 - 137360)/1000)
      tl.fromTo(
        "#badge-ban",
        { scale: 2.2, opacity: 0, rotation: 25 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: "power4.out" },
        6.23,
      );

      if (banSlash) {

          "#ban-slash",
          { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
          6.35,
        );
      }
