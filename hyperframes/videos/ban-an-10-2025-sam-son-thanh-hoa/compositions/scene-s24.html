<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #141414;
        color: #f7f4ec;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      #scene-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
        will-change: transform, opacity;
      }
      #photo-container {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #hero-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        will-change: transform;
      }
      .overlay-container {
        position: absolute;
        left: 60px;
        right: 60px;
        z-index: 20;
        will-change: transform, opacity;
      }
      .overlay-top {
        top: 260px;
      }
      .overlay-middle {
        top: 860px;
      }
      .plate-ink {
        background: #141414;
        border-radius: 4px;
      }
      .plate-row {
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 24px 32px;
        border-left: 8px solid #ff6a1a;
      }
      .lock-icon-box {
        flex-shrink: 0;
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .overlay-title-1 {
        font-size: 50px;
        font-weight: 900;
        color: #f7f4ec;
        letter-spacing: -0.5px;
        line-height: 1.15;
      }
      .punch-plate {
        padding: 36px 40px;
        border-left: 10px solid #ff6a1a;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .punch-line-1 {
        font-size: 60px;
        font-weight: 900;
        color: #f7f4ec;
        letter-spacing: -0.5px;
        line-height: 1.2;
      }
      .punch-line-2 {
        display: flex;
        align-items: center;
      }
      .highlight-orange {
        background: #ff6a1a;
        color: #141414;
        font-size: 70px;
        font-weight: 900;
        line-height: 1;
        padding: 8px 24px;
        border-radius: 4px;
        letter-spacing: 0.5px;
        display: inline-block;
      }
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 10px;
        background: #ff6a1a;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s24"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.04"
    >
      <section
        id="scene-clip"
        class="clip"
        data-start="0"
        data-duration="7.04"
      >
        <div id="scene-wrapper">
          <div id="photo-container">
            <img
              id="hero-img"
              src="assets/img-16-probation-conditions-calendar-shadow.jpg"
              alt="Thanh niên chấp hành thời gian thử thách án treo"
            />
          </div>

          <div id="overlay-1" class="overlay-container overlay-top">
            <div class="plate-ink plate-row">
              <div class="lock-icon-box">
                <svg
                  width="48"
                  height="48"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <rect
                    x="5"
                    y="11"
                    width="14"
                    height="10"
                    rx="2"
                    stroke="#FF6A1A"
                    stroke-width="2.2"
                    fill="#141414"
                  />
                  <path
                    id="lock-shackle"
                    d="M8 11V7a4 4 0 0 1 8 0v1"
                    stroke="#FF6A1A"
                    stroke-width="2.2"
                    stroke-linecap="round"
                    fill="none"
                  />
                  <circle cx="12" cy="16" r="1.5" fill="#FF6A1A" />
                </svg>
              </div>
              <div class="overlay-title-1">CHƯA PHẢI ĐI TRẠI</div>
            </div>
          </div>

          <div id="overlay-2" class="overlay-container overlay-middle">
            <div class="plate-ink punch-plate">
              <div class="punch-line-1">KHÔNG ĐỒNG NGHĨA</div>
              <div class="punch-line-2">
                <span id="punch-highlight" class="highlight-orange">VÔ TỘI</span>
              </div>
            </div>
          </div>

          <div id="brand-bar" class="brand-bottom-bar"></div>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      const shackle = document.getElementById("lock-shackle");
      let shackleLen = 20;
      if (shackle) {
        shackleLen = shackle.getTotalLength();
        shackle.style.strokeDasharray = shackleLen;
        shackle.style.strokeDashoffset = shackleLen;
      }

      tl.fromTo(
        "#scene-wrapper",
        { y: -70, rotation: -1.8, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
        0
      );

      tl.fromTo(
        "#hero-img",
        { scale: 1.1, x: -20, y: -30 },
        { scale: 1.18, x: 25, y: 30, duration: 7.04, ease: "none" },
        0
      );

      tl.fromTo(
        "#overlay-1",
        { scale: 0.88, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        1.45
      );

      if (shackle) {
        tl.fromTo(
          "#lock-shackle",
          { strokeDashoffset: shackleLen },
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
          1.65
        );
      }

      tl.to(
        "#overlay-1",
        { opacity: 0, y: -20, scale: 0.94, duration: 0.45, ease: "power2.in" },
        3.65
      );

      tl.fromTo(
        "#overlay-2",
        { scale: 0.88, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        5.35
      );

      tl.fromTo(
        "#punch-highlight",
        { scaleX: 0, transformOrigin: "left center" },
        { scaleX: 1, duration: 0.4, ease: "power3.out" },
        5.55
      );

      window.__timelines["scene-s24"] = tl;
    </script>
  
    </template>
  </body>
</html>
