<!doctype html>
<html>
  <head>

  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
      color: #141414;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }
    .clip {
      position: absolute;
      inset: 0;
    }
    /* Brand signature bottom bar */
    #brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
    /* Camera Stage container */
    #camera-stage {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
    }
    /* Top Context Tag */
    .context-tag {
      position: absolute;
      top: 190px;
      left: 290px;
      width: 500px;
      background: #141414;
      color: #F7F4EC;
      padding: 12px 24px;
      border-radius: 4px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      box-shadow: 5px 5px 0px #FF6A1A;
      z-index: 25;
      white-space: nowrap;
    }
    /* SVG diagram layer */
    #diagram-svg {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      z-index: 10;
      pointer-events: none;
    }
    /* Road base line & lane markers */
    .road-axis {
      stroke: #141414;
      stroke-width: 12;
      stroke-linecap: round;
      fill: none;
    }
    .road-axis-orange {
      stroke: #FF6A1A;
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    /* Starting point node */
    #start-node {
      position: absolute;
      top: 1290px;
      left: 420px;
      width: 240px;
      background: #141414;
      color: #F7F4EC;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 20px;
      font-weight: 900;
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 4px 4px 0px rgba(20, 20, 20, 0.2);
      z-index: 20;
    }
    /* Right Checkpoint / Lề đường flag */
    #checkpoint-flag {
      position: absolute;
      top: 910px;
      left: 740px;
      background: #F5F0E4;
      border: 3px solid #141414;
      padding: 8px 16px;
      font-size: 18px;
      font-weight: 900;
      color: #141414;
      box-shadow: 4px 4px 0px #141414;
      z-index: 20;
      white-space: nowrap;
    }
    /* Overlay 1: Card "HỢP TÁC KIỂM TRA" */
    #card-cooperate {
      position: absolute;
      top: 750px;
      left: 560px;
      width: 450px;
      background: #141414;
      color: #F7F4EC;
      padding: 22px 26px;
      border-radius: 6px;
      border-left: 8px solid #FF6A1A;
      box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.25);
      z-index: 30;
    }
    .card-cooperate-title {
      font-size: 32px;
      font-weight: 900;
      line-height: 1.25;
      color: #F7F4EC;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .card-cooperate-sub {
      font-size: 20px;
      font-weight: 700;
      color: #E7E3D9;
      letter-spacing: 0.5px;
    }
    /* Overlay 2: Warning Icon */
    #warning-badge {
      position: absolute;
      top: 550px;
      left: 230px;
      width: 140px;
      height: 130px;
      z-index: 40;
    }
    /* Overlay 3: Punch Phrase "CHỌN LỐI NGƯỢC LẠI" */
    #punch-card {
      position: absolute;
      top: 350px;
      left: 80px;
      width: 920px;
      background: #FF6A1A;
      border: 4px solid #141414;
      box-shadow: 10px 10px 0px #141414;
      padding: 34px 36px;
      z-index: 50;
      text-align: center;
    }
    .punch-text {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.22;
      color: #141414;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s01"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="6.88"
  >
    <!-- Brand Signature Bar -->
    <div id="brand-bar"></div>

    <!-- Main Visual Scene Clip -->
    <div id="scene-s01" class="clip" data-start="0" data-duration="6.88">
      <div id="camera-stage">
        <!-- Context Header -->
        <div class="context-tag">SƠ ĐỒ HÀNH VI</div>

        <!-- Starting location tag -->
        <div id="start-node">VỊ TRÍ TIẾP CẬN</div>

        <!-- Checkpoint Flag on Roadside -->
        <div id="checkpoint-flag">CHỐT LỀ ĐƯỜNG</div>

        <!-- Vector Diagram of Roads -->
        <svg id="diagram-svg" viewBox="0 0 1080 1920">
          <!-- Main approach trunk -->
          <path id="path-trunk" class="road-axis" d="M 540 1280 L 540 1060" />

          <!-- Branch 1 (Safe roadside path) -->
          <path id="path-right" class="road-axis" d="M 540 1060 C 540 960, 660 930, 750 900" />
          <circle id="node-right" cx="750" cy="900" r="14" fill="#141414" />

          <!-- Branch 2 (Sharp rogue turn, counter-traffic) -->
          <path id="path-left" class="road-axis-orange" d="M 540 1060 C 540 970, 300 980, 300 850 L 300 680" />
          <polygon id="arrow-left" points="280,700 300,650 320,700" fill="#FF6A1A" stroke="#141414" stroke-width="3" />
        </svg>

        <!-- Overlay 1: Label "HỢP TÁC KIỂM TRA" -->
        <div id="card-cooperate">
          <div class="card-cooperate-title">HỢP TÁC KIỂM TRA</div>
          <div class="card-cooperate-sub">ÊM THẤM • ĐÚNG PHÁP LUẬT</div>
        </div>

        <!-- Overlay 2: Warning Icon -->
        <div id="warning-badge">
          <svg width="140" height="130" viewBox="0 0 140 130">
            <!-- Solid offset drop-shadow for collage aesthetic -->
            <polygon points="70,16 128,118 12,118" fill="#141414" />
            <!-- Main Warning Triangle (Orange) -->
            <polygon points="66,10 124,112 8,112" fill="#FF6A1A" stroke="#141414" stroke-width="4" stroke-linejoin="round" />
            <!-- Inner Exclamation mark (Ink on Orange - 6.4:1 contrast) -->
            <line x1="66" y1="46" x2="66" y2="78" stroke="#141414" stroke-width="9" stroke-linecap="round" />
            <circle cx="66" cy="95" r="5.5" fill="#141414" />
          </svg>
        </div>

        <!-- Overlay 3: Punch Phrase "CHỌN LỐI NGƯỢC LẠI" -->
        <div id="punch-card">
          <div class="punch-text">CHỌN LỐI NGƯỢC LẠI</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Path geometry measurement
    const trunk = document.querySelector("#path-trunk");
    const rightPath = document.querySelector("#path-right");
    const leftPath = document.querySelector("#path-left");

    const lenTrunk = trunk.getTotalLength();
    const lenRight = rightPath.getTotalLength();
    const lenLeft = leftPath.getTotalLength();

    trunk.style.strokeDasharray = lenTrunk;
    trunk.style.strokeDashoffset = lenTrunk;
    rightPath.style.strokeDasharray = lenRight;
    rightPath.style.strokeDashoffset = lenRight;
    leftPath.style.strokeDasharray = lenLeft;
    leftPath.style.strokeDashoffset = lenLeft;

    // 0. Camera Pan-Right subtle movement across full duration (6.88s)
    tl.fromTo(
      "#camera-stage",
      { x: 25 },
      { x: -25, duration: 6.88, ease: "none" },
      0
    );

    // 1. Entrance Animation ("rise"): Context Tag & Approach Point
    tl.fromTo(
      ".context-tag",
      { opacity: 0, y: -30 },
      { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
      0.1
    );
    tl.fromTo(
      "#start-node",
      { opacity: 0, scale: 0.7, y: 30 },
      { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" },
      0.2
    );

    // 2. Trunk path draws progressively
    tl.fromTo(
      trunk,
      { strokeDashoffset: lenTrunk },
      { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
      0.35
    );

    // 3. Right branch (Safe route) draws
    tl.fromTo(
      rightPath,
      { strokeDashoffset: lenRight },
      { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
      0.85
    );
    tl.fromTo(
      "#node-right",
      { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
      { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" },
      1.3
    );
    tl.fromTo(
      "#checkpoint-flag",
      { opacity: 0, y: 15 },
      { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
      1.35
    );

    // 4. Overlay 1: "HỢP TÁC KIỂM TRA" (atMs: 1450 -> 1.45s)
    tl.fromTo(
      "#card-cooperate",
      { opacity: 0, x: 40 },
      { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
      1.45
    );

    // 5. Left branch (Rogue turn) draws sharply on narration turn
    tl.fromTo(
      leftPath,
      { strokeDashoffset: lenLeft },
      { strokeDashoffset: 0, duration: 0.85, ease: "power2.inOut" },
      3.6
    );
    tl.fromTo(
      "#arrow-left",
      { opacity: 0, scale: 0, transformOrigin: "300px 675px" },
      { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" },
      4.4
    );

    // 6. Overlay 2: Warning Icon (atMs: 4830 -> 4.83s)
    tl.fromTo(
      "#warning-badge",
      { opacity: 0, scale: 0, y: 24, transformOrigin: "50% 50%" },
      { opacity: 1, scale: 1, y: 0, duration: 0.38, ease: "power3.out" },
      4.83
    );

    // 7. Overlay 3: Punch Phrase "CHỌN LỐI NGƯỢC LẠI" (atMs: 5230 -> 5.23s)
    tl.fromTo(
      "#punch-card",
      { opacity: 0, scale: 1.15, y: -25 },
      { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power4.out" },
      5.23
    );

    // Register paused timeline with exact composition id
    window.__timelines["scene-s01"] = tl;
  </script>

    </template>
  </body>
</html>
