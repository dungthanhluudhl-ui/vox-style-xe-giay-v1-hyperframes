    <script>
      // Khởi tạo timeline paused bắt buộc theo chuẩn HyperFrames
      const tl = gsap.timeline({ paused: true });

      // Thiết lập vẽ đường path SVG uốn cong bằng strokeDashoffset thực tế
      const transferPath = document.getElementById("transfer-path");
      if (transferPath) {
        const pathLen = transferPath.getTotalLength() || 680;
        transferPath.style.strokeDasharray = pathLen;
        transferPath.style.strokeDashoffset = pathLen;
      }

      // 1. BEAT 1: ENTRANCE "UNFOLD" (0.0s -> 1.5s)
      // Card môi trường cách ly mở gập ra từ phía trên
      tl.fromTo(
        "#module-prison",
        { y: -50, scaleY: 0.85, opacity: 0, transformOrigin: "50% 0%" },
        { y: 0, scaleY: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.2,
      );

      // Cánh cổng sắt bên phải xoay mở hờ (thể hiện "cánh cổng khép lại nhưng không khóa")
      tl.fromTo(
        "#gate-right-panel",
        { rotation: 0 },
        { rotation: 26, duration: 0.8, ease: "power2.out" },
        0.8,
      );

      // Huy hiệu "KHÔNG KHÓA CỨNG" xuất hiện
      tl.fromTo(
        "#badge-unlocked",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        1.1,
      );

      // 2. BEAT 2: OVERLAY 1 "CHƯA CẦN CÁCH LY" (1.7s = 207380ms)
      tl.fromTo(
        "#overlay-label-1",
        { x: 30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.7,
      );

      // 3. BEAT 3: THE FLOW VECTOR (2.4s -> 3.6s)
      // Mũi tên uốn cong vẽ dần từ cổng xuống địa phương
      if (transferPath) {
        const pathLen = transferPath.getTotalLength() || 680;
        tl.fromTo(
          transferPath,
          { strokeDashoffset: pathLen },
          { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" },
          2.4,
        );
      }

      // Đầu mũi tên và điểm neo đối tượng xuất hiện theo hành trình
      tl.fromTo(
        "#path-arrow-head",
        { scale: 0, opacity: 0, transformOrigin: "480px 330px" },
        { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
        3.2,
      );

      tl.fromTo(
        "#transfer-marker",
        { scale: 0, opacity: 0, transformOrigin: "480px 230px" },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        2.7,
      );

      tl.fromTo(
        "#transfer-tag",
        { y: -15, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        2.9,
      );

      // 4. BEAT 4: TRỤ SỞ ĐỊA PHƯƠNG & VÒNG TRÒN BẢO HỘ (3.4s -> 4.7s)
      // Khối địa phương mở gập vào vị trí
      tl.fromTo(
        "#module-community",
        { y: 50, scaleY: 0.9, opacity: 0, transformOrigin: "50% 100%" },
        { y: 0, scaleY: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
        3.4,
      );

      // Hai vòng bảo hộ đồng tâm mở rộng bao bọc trụ sở
