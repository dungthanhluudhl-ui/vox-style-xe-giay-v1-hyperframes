  <script>
    // HyperFrames Seek-Safe Deterministic Animation Setup
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    gsap.set("#stamp-2", { opacity: 0, scale: 1.35, rotation: -6 });

    // 1. Entrance: Dossier rises into frame (transitionIn: rise)

      { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
      0.15

    // 2. Camera Motion: Subtle continuous zoom-in throughout shot
    tl.fromTo(
      "#dossier-card",
      { scale: 0.985 },
      { scale: 1.025, duration: 6.88, ease: "none" },
      0
    );

    // 3. Stamp 1: "THÀNH KHẨN KHAI BÁO" slams onto dossier at t = 1.79s (190110ms)
    tl.fromTo(
      "#stamp-1",
      { scale: 1.35, opacity: 0, rotation: 6 },
      { scale: 1.0, opacity: 1, rotation: -1.5, duration: 0.28, ease: "power4.out" },
