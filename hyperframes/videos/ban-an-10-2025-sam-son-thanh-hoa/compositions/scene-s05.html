      will-change: transform, opacity;

      inset: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      display: block;

      height: 10px;

      { y: 0, opacity: 1, scale: 1.0, duration: 0.45, ease: "power3.out" },
