    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1. Initial State Sets

      gsap.set("#visual-card", {
        scale: 0.94,
        opacity: 0,
        y: 35,
        rotationX: 8,
      });
      gsap.set("#main-asset", { scale: 1.0, y: 0 });
      gsap.set("#callout-overflow", { scale: 0, opacity: 0 });
      gsap.set("#callout-sponge", { scale: 0, opacity: 0 });
      gsap.set("#old-card", { y: 20, opacity: 0 });
      gsap.set("#strike-line", { scaleX: 0 });
      gsap.set("#ban-tag", { scale: 0, opacity: 0 });
      gsap.set("#label-change", { y: 16, opacity: 0 });
      gsap.set("#punch-card", { y: 28, opacity: 0, scale: 0.96 });
      gsap.set("#punch-sub", { opacity: 0, x: -14 });

      // 2. Scene Entrance (t = 0.05s to 0.8s) - Paper peel & board settle
      tl.to(
        "#top-tag",
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.05,
      );

      tl.to(
        "#visual-card",
        {
          scale: 1,
          opacity: 1,
          y: 0,
          rotationX: 0,
          duration: 0.75,
          ease: "power3.out",
        },
        0.1,
      );

      // Continuous subtle camera zoom on the sponge city diagram (t = 0s to 6.88s)
      tl.to(
        "#main-asset",
        {
          scale: 1.1,
          y: -24,
          duration: 6.88,
          ease: "none",
        },
        0,
      );

      // Diagram indicators reveal
      tl.to(
        "#callout-overflow",
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.4,
      );
      tl.to(
        "#callout-sponge",
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.7,
      );

      // 3. Old Mindset appears (t = 0.6s)
      tl.to(
        "#old-card",
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.6,
      );

      // 4. Strike-through slash across "ĐUỔI NƯỚC" (t = 1.6s to 1.9s)
      tl.to(
        "#strike-line",
        { scaleX: 1, duration: 0.35, ease: "power2.inOut" },
        1.6,
      );
      tl.to(
        "#ban-tag",
        { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
        1.75,
      );

      // 5. Shotlist Overlay: "THAY ĐỔI TƯ DUY" (atMs: 281500 -> rel 2.3s)
      tl.to(
        "#label-change",
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        2.3,
      );

      // 6. Shotlist Punch Phrase: "QUẢN LÝ NƯỚC" (atMs: 283800 -> rel 4.6s)
      // Bold authoritative Vox landing
      tl.to(
        "#punch-card",
        {
          y: 0,
          opacity: 1,
          scale: 1,
          duration: 0.55,
          ease: "power3.out",
        },
        4.6,
      );

      tl.to(
        "#punch-sub",
        {
          opacity: 1,
          x: 0,
          duration: 0.45,
          ease: "power2.out",
        },
        4.85,
      );

      // Register the paused timeline for seek-safe rendering
      window.__timelines["scene-s36"] = tl;
