  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background: #141414;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* Base Style DNA Classes */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background: #FF6A1A; color: #141414; }
      .hf-plate-ink { background: #141414; color: #F7F4EC; }
      .hf-plate-ink-orange { background: #141414; color: #FF6A1A; }
      .hf-plate-paper { background: #E7E3D9; color: #141414; }

      /* Background: Spotlight Variant (Paper #E7E3D9 + 84px Grid + Dark Radial Vignette) */
      .spotlight-bg {
        position: absolute;
        inset: 0;
        background-color: #E7E3D9;
        z-index: 1;
      }

      .grid-layer {
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }

      .vignette-layer {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(20, 20, 20, 0) 30%,
          rgba(20, 20, 20, 0.35) 70%,
          rgba(20, 20, 20, 0.65) 100%
        );
        pointer-events: none;
      }

      /* Hero Diagram Placement in Usable Band (Y: 160px to 1390px, Center: 775px) */
      .scene-perspective {
        position: absolute;
        top: 195px;
        left: 216px;
        width: 648px;
        height: 1160px;
        perspective: 1200px;
        z-index: 2;
      }

      .hero-flipper {
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .hero-zoomer {
        width: 100%;
        height: 100%;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      .diagram-frame {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 16px;
        overflow: hidden;
        border: 2px solid rgba(20, 20, 20, 0.45);
        box-shadow: 
          0 24px 60px rgba(0, 0, 0, 0.4),
          0 6px 18px rgba(20, 20, 20, 0.25);
        background: #E7E3D9;
      }

      .diagram-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Flow Badges (Top & Bottom Overlays) */
      .flow-overlay-container {
        pointer-events: none;
        z-index: 10;
        display: flex;
        justify-content: center;
      }

      .top-flow {
        align-items: flex-start;
        padding-top: 235px;
      }

      .bottom-flow {
        align-items: flex-start;
        padding-top: 1250px;
      }

      .flow-badge {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 16px 28px;
        background: #141414;
        border: 3px solid #FF6A1A;
        border-radius: 14px;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
        will-change: transform, opacity;
      }

      .badge-text {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 32px;
        line-height: 1.2;
        letter-spacing: 0.04em;
        color: #F7F4EC;
        white-space: nowrap;
      }

      .flow-arrow-icon {
        display: block;
        flex-shrink: 0;
      }

      /* Overlay 3: BAN Icon Stamp */
      .ban-overlay-container {
        pointer-events: none;
        z-index: 20;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 685px;
      }

      .ban-stamp-box {
        width: 180px;
        height: 180px;
        background: #141414;
        border: 4px solid #FF6A1A;
        border-radius: 50%;
        display: grid;
        place-items: center;
        box-shadow: 
          0 18px 50px rgba(0, 0, 0, 0.6),
          0 0 0 8px rgba(255, 106, 26, 0.25);
        will-change: transform, opacity;
      }

      .ban-icon-svg {
        display: block;
      }

      /* Style DNA Signature: Bottom Orange Bar */
      .bottom-signature-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 8px;
        background: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s08"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="8.92"
    >
      <!-- Base Spotlight Background (Untimed) -->
      <div class="spotlight-bg">
        <div class="grid-layer"></div>
        <div class="vignette-layer"></div>
      </div>

      <!-- Shot S08-1: Hero Diagram Card -->
      <section id="shot-s08-1" class="clip" data-start="0" data-duration="8.92">
        <div class="scene-perspective">
          <div id="hero-flipper" class="hero-flipper">
            <div id="hero-zoomer" class="hero-zoomer">
              <div class="diagram-frame">
                <img
                  src="assets/img-11-hcmc-river-tidal-diagram.jpg"
                  class="diagram-img"
                  alt="Sơ đồ đối đầu dòng chảy TP.HCM"
                />
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Overlay 1: THƯỢNG LƯU ĐỔ VỀ (51200ms -> 1.16s, hold 2.0s) -->
      <div id="overlay-flow-top" class="clip flow-overlay-container top-flow" data-start="1.16" data-duration="2.0">
        <div id="badge-flow-top" class="flow-badge">
          <div class="badge-text">THƯỢNG LƯU ĐỔ VỀ</div>
          <svg class="flow-arrow-icon" id="arrow-down-svg" viewBox="0 0 28 28" width="28" height="28">
            <path
              d="M14 3 L14 23 M6 15 L14 23 L22 15"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>

      <!-- Overlay 2: TRIỀU BIỂN DÂNG LÊN (53200ms -> 3.16s, hold 2.0s) -->
      <div id="overlay-flow-bottom" class="clip flow-overlay-container bottom-flow" data-start="3.16" data-duration="2.0">
        <div id="badge-flow-bottom" class="flow-badge">
          <svg class="flow-arrow-icon" id="arrow-up-svg" viewBox="0 0 28 28" width="28" height="28">
            <path
              d="M14 25 L14 5 M6 13 L14 5 L22 13"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <div class="badge-text">TRIỀU BIỂN DÂNG LÊN</div>
        </div>
      </div>

      <!-- Overlay 3: BAN Icon (56800ms -> 6.76s, hold 2.1s -> ends with scene at 8.92s) -->
      <div id="overlay-ban" class="clip ban-overlay-container" data-start="6.76" data-duration="2.16">
        <div id="ban-badge" class="ban-stamp-box">
          <svg class="ban-icon-svg" viewBox="0 0 160 160" width="136" height="136">
            <circle
              id="ban-circle"
              cx="80"
              cy="80"
              r="62"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="14"
              stroke-linecap="round"
              style="stroke-dasharray: 390; stroke-dashoffset: 390;"
            />
            <line
              id="ban-slash"
              x1="36"
              y1="36"
              x2="124"
              y2="124"
              stroke="#FF6A1A"
              stroke-width="14"
              stroke-linecap="round"
              style="stroke-dasharray: 125; stroke-dashoffset: 125;"
            />
          </svg>
        </div>
      </div>

      <!-- Fixed Signature Bottom Bar -->
      <div class="bottom-signature-bar"></div>
    </div>

    <script>
      // 1. Prepare SVG path measurements for deterministic drawing
      const banCircle = document.getElementById("ban-circle");
      const banSlash = document.getElementById("ban-slash");
      if (banCircle && banSlash) {
        const circleLen = banCircle.getTotalLength();
        banCircle.style.strokeDasharray = String(circleLen);
        banCircle.style.strokeDashoffset = String(circleLen);

        const slashLen = banSlash.getTotalLength();
        banSlash.style.strokeDasharray = String(slashLen);
        banSlash.style.strokeDashoffset = String(slashLen);
      }

      // 2. Build the master paused GSAP timeline
      const tl = gsap.timeline({ paused: true });

      // Phase 1: Scene Entrance - 3D Flip in of Hero Diagram Card (0.05s - 0.70s)
      tl.fromTo(
        "#hero-flipper",
        { rotationY: -45, scale: 0.88, opacity: 0 },
        { rotationY: 0, scale: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.05
      );

      // Phase 2: Ken Burns Continuous Zoom (1.0x to 1.06x over 8.92s)
      tl.fromTo(
        "#hero-zoomer",
        { scale: 1.0 },
        { scale: 1.06, duration: 8.92, ease: "none" },
        0
      );

      // Phase 3: Overlay 1 - THƯỢNG LƯU ĐỔ VỀ (1.16s - 3.16s)
      tl.fromTo(
        "#badge-flow-top",
        { y: -30, opacity: 0, scale: 0.9 },
        { y: 0, opacity: 1, scale: 1, duration: 0.38, ease: "power3.out" },
        1.16
      );

      tl.fromTo(
        "#arrow-down-svg",
        { y: -5 },
        { y: 5, duration: 0.45, ease: "sine.inOut", repeat: 2, yoyo: true },
        1.45
      );

      tl.to(
        "#badge-flow-top",
        { opacity: 0, y: -16, duration: 0.2, ease: "power2.in" },
        2.96
      );

      // Phase 4: Overlay 2 - TRIỀU BIỂN DÂNG LÊN (3.16s - 5.16s)
      tl.fromTo(
        "#badge-flow-bottom",
        { y: 30, opacity: 0, scale: 0.9 },
        { y: 0, opacity: 1, scale: 1, duration: 0.38, ease: "power3.out" },
        3.16
      );

      tl.fromTo(
        "#arrow-up-svg",
        { y: 5 },
        { y: -5, duration: 0.45, ease: "sine.inOut", repeat: 2, yoyo: true },
        3.45
      );

      tl.to(
        "#badge-flow-bottom",
        { opacity: 0, y: 16, duration: 0.2, ease: "power2.in" },
        4.96
      );

      // Phase 5: Overlay 3 - Progressive Self-Drawing BAN Icon Stamp (6.76s - 8.92s)
      tl.fromTo(
        "#ban-badge",
        { scale: 0.4, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        6.76
      );

      tl.to(
        "#ban-circle",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        6.88
      );

      tl.to(
        "#ban-slash",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        7.18
      );

      // Register timeline after all tweens are constructed
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s08"] = tl;
    </script>
  
    </template>
  </body>
