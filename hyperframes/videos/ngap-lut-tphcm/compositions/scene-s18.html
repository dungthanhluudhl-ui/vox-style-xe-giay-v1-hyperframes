    <!-- SCRIPT CHÍNH ĐIỀU KHIỂN GSAP TIMELINE (SEEK-SAFE, DETERMINISTIC) -->
    <script>
      // Đăng ký timeline gốc paused duy nhất theo hợp đồng HyperFrames
      const tl = gsap.timeline({ paused: true });

      // 1. BEAT 0s: Entrance peel mở khung tranh + Ken Burns zoom nhẹ 1.0x -> 1.07x
      tl.fromTo(
        "#scene-header",
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.1
      );

      // Peel effect: cuộn mở từ trên xuống
      tl.fromTo(
        "#image-card",
        { scaleY: 0.15, opacity: 0, transformOrigin: "top center" },
        { scaleY: 1, opacity: 1, duration: 0.85, ease: "power3.out" },
        0.05
      );

      // Ken Burns zoom-in tinh tế xuyên suốt thời lượng scene
      tl.fromTo(
        "#hero-img",
        { scale: 1.0, transformOrigin: "48% 60%" },
        { scale: 1.07, duration: 8.97, ease: "none" },
        0
      );

      // 2. BEAT 1.3s: Label "ĐẤT TỤT THẤP" xuất hiện kèm mũi tên chỉ xuống
      tl.fromTo(
        "#badge-land",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.3
      );
      tl.fromTo(
        "#indicator-land-box",
        { y: -16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
        1.5
      );

      // 3. BEAT 3.3s: Label "SÔNG DÂNG CAO" xuất hiện kèm mũi tên chỉ lên
      tl.fromTo(
        "#badge-river",
        { x: 50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        3.3
      );
      tl.fromTo(
        "#indicator-river-box",
        { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
        3.5
      );

      // 4. BEAT 4.8s: Chỉ báo khoảng chênh cao thu hẹp
      tl.fromTo(
        "#slope-box",
        { scale: 0.9, opacity: 0, y: 15 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        4.8
      );

      // 5. BEAT 6.8s: Punch phrase "MẤT ĐỘ DỐC THOÁT" landing dứt khoát
      tl.fromTo(
        "#punch-card-wrap",
        { scale: 0.88, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        6.8
      );
      tl.fromTo(
        "#punch-stripe",
        { scaleX: 0, transformOrigin: "left center" },
        { scaleX: 1, duration: 0.4, ease: "power2.out" },
        7.1
      );

      // Gắn timeline vào window.__timelines với key chính xác "scene-s18"
      window.__timelines["scene-s18"] = tl;
    </script>
