        border-radius: 2px;

    <div

          <div class="card-header">

    <!-- GSAP Seekable Timeline Script -->
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance "spiral" cho thẻ sơ đồ (TransitionIn: spiral)
      // Xoay nhẹ từ -22 độ, scale từ 0.35 lên 1.0 với ease power3 mượt mà
      tl.fromTo(
        "#diagram-card",
        {
          scale: 0.35,
          rotation: -22,
          opacity: 0,
        },
        {
          scale: 1,
          rotation: 0,
          opacity: 1,
          duration: 0.8,
          ease: "power3.out",
        },
        0.1
      );

      // 2. OVERLAY 1: Punch-phrase "CƠ CHẾ ỐNG HÚT"
      // Xuất hiện lúc 1.53s (78800ms trong tổng timeline)
      tl.fromTo(
        "#punch-plate",
        {
          y: 40,
          scale: 0.95,
          opacity: 0,
        },
        {
          y: 0,
          scale: 1,
          opacity: 1,
          duration: 0.45,
          ease: "power3.out",
        },
        1.53
      );

      // Thoát nhẹ trước khi clip kết thúc (giữ trọn 2.2s sau khi xuất hiện)
      tl.to(
        "#punch-plate",
        {
          y: -24,
          opacity: 0,
          duration: 0.35,
          ease: "power2.in",
        },
        3.80
      );

      // 3. OVERLAY 2: Label "ĐẦU XẢ KẸT NƯỚC"
      // Xuất hiện lúc 5.23s (82500ms trong tổng timeline)
      tl.fromTo(
        "#label-plate",
        {
          y: 35,
          scale: 0.92,
          opacity: 0,
        },
        {
          y: 0,
          scale: 1,
          opacity: 1,
          duration: 0.45,
          ease: "power3.out",
        },
        5.23
      );

      // Đăng ký timeline gốc vào HyperFrames runtime
      window.__timelines["scene-s11"] = tl;
    </script>
