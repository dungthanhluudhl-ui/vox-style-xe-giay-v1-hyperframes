<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #e7e3d9;
        font-family: "Be Vietnam Pro", sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Base clip layout */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Editorial Grid Background */
      .grid-canvas {
        position: absolute;
        inset: 0;
        background-color: #e7e3d9;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        background-position: -1px -1px;
      }

      /* Permanent Brand Signature: Orange bottom bar */
      #bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 500;
      }

      /* Hero Diagram Container */
      .hero-wrap {
        position: absolute;
        top: 220px;
        left: 60px;
        width: 960px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        transform-origin: 50% 20%;
      }

      .hero-card {
        width: 100%;
        height: 100%;
        background-color: #f5f0e4;
        border: 4px solid #141414;
        box-shadow: 14px 14px 0px #141414;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      .card-header {
        height: 52px;
        background-color: #141414;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        flex-shrink: 0;
      }

      .card-header-title {
        color: #f7f4ec;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 2.5px;
        text-transform: uppercase;
      }

      .card-header-badge {
        background-color: #ff6a1a;
        color: #141414;
        font-size: 16px;
        font-weight: 900;
        padding: 4px 12px;
        letter-spacing: 1px;
      }

      .image-viewport {
        position: relative;
        width: 100%;
        flex: 1;
        overflow: hidden;
        background-color: #e7e3d9;
      }

      .diagram-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 68% 50%;
        transform-origin: 65% 55%;
        display: block;
      }

      /* Target crosshair aesthetic at outlet */
      .target-marker {
        position: absolute;
        top: 48%;
        left: 60%;
        width: 120px;
        height: 120px;
        border: 2px dashed #ff6a1a;
        border-radius: 50%;
        pointer-events: none;
      }

      /* Overlay 1: Label Badge */
      .label-badge-box {
        position: absolute;
        top: 305px;
        left: 95px;
        background-color: #ff6a1a;
        border: 3px solid #141414;
        box-shadow: 8px 8px 0px #141414;
        padding: 18px 32px;
        transform-origin: 0% 50%;
      }

      .label-badge-text {
        color: #141414;
        font-size: 42px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin: 0;
        line-height: 1;
      }

      /* Overlay 2: Punch Phrase Plate */
      .punch-plate-box {
        position: absolute;
        top: 1060px;
        left: 95px;
        width: 890px;
        background-color: #141414;
        border-left: 14px solid #ff6a1a;
        border-top: 3px solid #141414;
        border-right: 3px solid #141414;
        border-bottom: 3px solid #141414;
        box-shadow: 10px 10px 0px rgba(20, 20, 20, 0.4);
        padding: 28px 36px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        transform-origin: 50% 50%;
      }

      .punch-plate-text {
        color: #f7f4ec;
        font-size: 64px;
        font-weight: 900;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        line-height: 1.1;
        margin: 0;
      }

      /* Overlay 3: Ban Icon Stamp */
      .icon-stamp-box {
        position: absolute;
        top: 1010px;
        right: 120px;
        width: 140px;
        height: 140px;
        background-color: #141414;
        border: 4px solid #ff6a1a;
        border-radius: 50%;
        box-shadow: 6px 6px 0px #ff6a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: 50% 50%;
      }

      .ban-svg {
        width: 90px;
        height: 90px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s35"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.92"
    >
      <!-- Base Grid Background -->
      <div id="scene-bg" class="clip" data-start="0" data-duration="7.92">
        <div class="grid-canvas"></div>
      </div>

      <!-- Hero Diagram Card with wobble-drop entrance & slow zoom -->
      <div id="hero-card-clip" class="clip" data-start="0" data-duration="7.92">
        <div class="hero-wrap" id="hero-box">
          <div class="hero-card">
            <div class="card-header">
              <span class="card-header-title">SƠ ĐỒ CẮT LỚP // CỬA XẢ TRIỀU</span>
              <span class="card-header-badge">IMG-15</span>
            </div>
            <div class="image-viewport">
              <img
                id="diagram-img"
                class="diagram-img"
                src="assets/img-15-drainage-tide-cross-section-diagram.jpg"
                alt="Sơ đồ triều cường miệng xả"
              />
              <div class="target-marker"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Overlay 1: Label "CỐNG TO CHƯA ĐỦ" (1.52s -> 3.72s) -->
      <div id="overlay-label-clip" class="clip" data-start="1.52" data-duration="2.2">
        <div class="label-badge-box" id="overlay-label">
          <h2 class="label-badge-text">CỐNG TO CHƯA ĐỦ</h2>
        </div>
      </div>

      <!-- Overlay 2: Punch Phrase "CỬA XẢ BỊ KHÓA" (5.22s -> 7.92s) -->
      <div id="overlay-punch-clip" class="clip" data-start="5.22" data-duration="2.7">
        <div class="punch-plate-box" id="overlay-punch">
          <h1 class="punch-plate-text">CỬA XẢ BỊ KHÓA</h1>
        </div>
      </div>

      <!-- Overlay 3: Icon "ban" (6.52s -> 7.92s) -->
      <div id="overlay-icon-clip" class="clip" data-start="6.52" data-duration="1.4">
        <div class="icon-stamp-box" id="overlay-icon">
          <svg class="ban-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle
              id="ban-circle"
              cx="50"
              cy="50"
              r="40"
              stroke="#FF6A1A"
              stroke-width="10"
            />
            <line
              id="ban-slash"
              x1="22"
              y1="22"
              x2="78"
              y2="78"
              stroke="#FF6A1A"
              stroke-width="10"
              stroke-linecap="round"
            />
          </svg>
        </div>
      </div>

      <!-- Permanent Visual Signature: Bottom Orange Bar -->
      <div id="bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Hero Wobble-Drop entrance (starts t=0, settles around t=0.65s)
      tl.fromTo(
        "#hero-box",
        { y: -180, rotation: -4, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.65, ease: "power2.out" },
        0
      );

      // 2. Camera zoom-in towards the submerged drainage outlet (0s to 7.92s)
      tl.fromTo(
        "#diagram-img",
        { scale: 1.05, x: 0, y: 0 },
        { scale: 1.32, x: -45, y: -25, duration: 7.92, ease: "none" },
        0
      );

      // 3. Label "CỐNG TO CHƯA ĐỦ" entrance and exit within its 2.2s window
      tl.fromTo(
        "#overlay-label",
        { scale: 0, opacity: 0, y: -24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.52
      );
      tl.to(
        "#overlay-label",
        { opacity: 0, y: -16, duration: 0.32, ease: "power2.in" },
        3.38
      );

      // 4. Punch phrase "CỬA XẢ BỊ KHÓA" entrance (5.22s)
      tl.fromTo(
        "#overlay-punch",
        { scale: 0.86, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
        5.22
      );

      // 5. Icon "ban" slam arrival (6.52s)
      tl.fromTo(
        "#overlay-icon",
        { scale: 2.2, opacity: 0, rotation: -20 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.38, ease: "back.out(1.5)" },
        6.52
      );

      // Self-drawing slash for ban icon
      const slash = document.getElementById("ban-slash");
      if (slash) {
        const slashLen = slash.getTotalLength();
        slash.style.strokeDasharray = slashLen;
        slash.style.strokeDashoffset = slashLen;
        tl.fromTo(
          slash,
          { strokeDashoffset: slashLen },
          { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" },
          6.68
        );
      }

      window.__timelines["scene-s35"] = tl;
    </script>
  
    </template>
  </body>
</html>
