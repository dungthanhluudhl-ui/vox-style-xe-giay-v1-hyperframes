    <div

    >
      <!-- Lớp nền đồ họa dạng lưới kẻ Vox -->

          <div class="punch-phrase-box">

        <div id="icon-fall" class="icon-fall-wrapper">
          <div class="icon-fall-box">
            <div class="icon-fall-svg-wrapper">
              <!-- Fall/Subsidence icon path -->
              <svg class="icon-fall-svg" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">

    <script>
      // Setup GSAP seekable timeline
      const tl = gsap.timeline({ paused: true });

      // Đăng ký timeline cho HyperFrames seek
      window.__timelines["scene-s05"] = tl;

      // Chuẩn bị path đo đạc cho icon tự vẽ
      const fallArrow = document.getElementById("path-fall-arrow");
      if (fallArrow) {
        const arrowLen = fallArrow.getTotalLength();
        fallArrow.style.strokeDasharray = arrowLen;
        fallArrow.style.strokeDashoffset = arrowLen;
      }

      // ==========================================
      // 1. ENTRANCE & CAMERA MOTION (0.0s -> 7.64s)
      // ==========================================

      // Header badge entrance
      tl.fromTo(
        "#header-badge",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.1
      );

      // Card entrance (grow style - phóng to từ trung tâm)
      tl.fromTo(
        "#diagram-card",
        { scale: 0.88, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.75, ease: "power3.out" },
        0.15
      );

      // Camera pan dọc & zoom-in chậm xuyên suốt shot (pan từ trên xuống theo 3 nhánh sơ đồ)
      tl.fromTo(
        "#diagram-img",
        { y: 0, scale: 1.0 },
        { y: -180, scale: 1.14, duration: 7.64, ease: "none" },
        0.0
      );

      // ==========================================
      // 2. OVERLAY: PUNCH-PHRASE (atMs: 26200 -> t = 1.36s)
      // ==========================================
      // Xuất hiện lúc 1.36s, giữ trong 2.0s, fade out lúc 3.5s
      tl.fromTo(
        "#punch-phrase",
        { y: 40, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        1.36
      );

      tl.to(
        "#punch-phrase",
        { y: -15, opacity: 0, duration: 0.35, ease: "power2.in" },
        3.50
      );

      // ==========================================
      // 3. OVERLAY: LABEL "CỬA XẢ NGHẼN LẠI" (atMs: 28800 -> t = 3.96s)
      // ==========================================
      // Xuất hiện lúc 3.96s, giữ trong 1.8s, fade out lúc 5.9s
      tl.fromTo(
        "#label-drain",
        { x: 40, opacity: 0, scale: 0.92 },
        { x: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        3.96
      );

      tl.to(
        "#label-drain",
        { opacity: 0, scale: 0.95, duration: 0.3, ease: "power2.in" },
        5.90
      );

      // ==========================================
      // 4. OVERLAY: ICON "FALL" (atMs: 31200 -> t = 6.36s)
      // ==========================================
      // Xuất hiện lúc 6.36s, giữ vững đến hết scene
      tl.fromTo(
        "#icon-fall",
        { y: 35, opacity: 0, scale: 0.9 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        6.36
      );

      // Animate nét vẽ mũi tên fall
      if (fallArrow) {
        tl.to(
          "#path-fall-arrow",
          { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
          6.50
        );
      }
