    <div
      id="root"
      data-composition-id="scene-s33"
      data-width="1080"

      data-duration="7.99"
    >
      <!-- Dải cam đáy thương hiệu -->
      <div id="bottom-brand-bar"></div>

      <!-- Header cố định suốt scene -->
      <header class="header-kicker">

        <div class="header-sub">HỒ SƠ ĐÔ THỊ // VẤN ĐỀ 01</div>
      </header>

      <!-- Clip 1: Nền sơ đồ Infographic với chuyển động unfold và camera zoom-in -->
      <section
        id="scene-stage"
        class="clip"
        data-start="0"
        data-duration="7.99"
        data-track-index="1"
      >
        <div id="diagram-container" class="diagram-stage">
          <div class="diagram-image-wrapper">
            <img
              id="diagram-media"
              class="diagram-img"
              src="assets/img-08-flood-subsidence-causes-diagram.jpg"
              alt="Sơ đồ nguyên nhân sụt lún ngập lụt"

          </div>

      <section

        data-track-index="2"
      >
        <div class="punch-wrapper">
          <div id="punch-card" class="punch-card">
            <div class="punch-pill">CÂU HỎI LỚN</div>

      <section

        class="clip"

      >

            <p class="callout-desc">NỀN ĐẤT TRŨNG VỐN CÓ</p>
          </div>

      <!-- Clip 4: Biểu tượng Icon "fall" sụt lún (hiển thị 6.3s -> 7.99s) -->
      <section
        id="icon-section"
        class="clip"
        data-start="6.3"
        data-duration="1.69"
        data-track-index="4"

            <div class="icon-box">
              <svg
                id="icon-fall-svg"
                class="fall-svg"
                viewBox="0 0 160 160"
                width="130"
                height="130"
                xmlns="http://www.w3.org/2000/svg"
              >
                <!-- Mặt đất tầng cao ban đầu -->
                <path class="fall-path fall-line" d="M 25 50 L 65 50" />
                <!-- Đứt gãy hạ thấp nền đất -->
                <path class="fall-path fall-line" d="M 65 50 L 65 95" />
                <!-- Mặt đất trũng thấp sau khi lún -->
                <path class="fall-path fall-line" d="M 65 95 L 135 95" />
                <!-- Mũi tên tụt dốc màu cam -->
                <path class="fall-path fall-accent" d="M 100 35 L 100 80" />
                <path class="fall-path fall-accent" d="M 86 66 L 100 80 L 114 66" />

    <script>
      // Khởi tạo timeline chính ở trạng thái paused
      const tl = gsap.timeline({ paused: true });

      // Setup chuẩn bị cho SVG Icon vẽ dần
      const fallPaths = document.querySelectorAll(".fall-path");
      fallPaths.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      // 1. Phút 0.1s: Hiệu ứng UNFOLD mở tấm card sơ đồ ra
      tl.fromTo(
        "#diagram-container",
        { scaleY: 0.2, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
        0.1
      );

      // Camera motion: Zoom chậm liên tục vào sơ đồ (0s -> 7.99s)
      tl.fromTo(
        "#diagram-media",
        { scale: 1, y: 0 },
        { scale: 1.15, y: 20, duration: 7.99, ease: "none" },
        0
      );

      // 2. Phút 1.0s: Punch Phrase "VÌ SAO CỨ NGẬP?" xuất hiện
      tl.fromTo(
        "#punch-card",
        { scale: 0.85, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.0
      );

      // Phút 3.15s: Punch Phrase rời đi nhường chỗ cho luận điểm tiếp theo
      tl.to(
        "#punch-card",
        { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" },
        3.15
      );

      // 3. Phút 4.8s: Thẻ luận điểm "01. ĐẤT THẤP LÚN" rơi xuống vững chãi
      tl.fromTo(
        "#callout-card",
        { y: -50, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" },
        4.8
      );

      // 4. Phút 6.3s: Thẻ Icon sụt lún xuất hiện
      tl.fromTo(
        "#icon-card",
        { scale: 0.8, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        6.3
      );

      // Phút 6.45s: Biểu tượng Icon "fall" (sụt lún) vẽ nét từng bước
      fallPaths.forEach((path, idx) => {
        tl.to(
          path,
          { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
          6.45 + idx * 0.1
        );
      });

      // Đăng ký timeline chính với HyperFrames
      window.__timelines["scene-s33"] = tl;
    </script>
