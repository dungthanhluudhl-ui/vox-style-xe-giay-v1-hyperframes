<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
      color: #141414;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    /* Vox style signature grid background */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.18) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.18) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      z-index: 1;
    }

    /* Core clip layout contract: inset 0 */
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Photo collage frame */
    .photo-frame {
      position: absolute;
      left: 45px;
      top: 60px;
      width: 990px;
      height: 1780px;
      border: 5px solid #141414;
      background-color: #141414;
      box-shadow: 14px 18px 0px #141414;
      overflow: hidden;
      z-index: 10;
    }

    .photo-viewport {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* Hero image: anchored cleanly at left: 0; spatial camera pan driven via GSAP transform x */
    #hero-img {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      max-width: none;
      display: block;
      will-change: transform;
    }

    /* Collage paper tape elements */
    .tape-strip {
      position: absolute;
      width: 140px;
      height: 38px;
      background-color: rgba(245, 240, 228, 0.92);
      border: 1px solid rgba(20, 20, 20, 0.25);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.18);
      z-index: 15;
    }

    .tape-top-right {
      top: -14px;
      right: 48px;
      transform: rotate(7deg);
    }

    .tape-bottom-left {
      bottom: -14px;
      left: 48px;
      transform: rotate(-5deg);
    }

    /* Overlay Cards */
    .overlay-clip {
      z-index: 40;
      pointer-events: none;
    }

    .overlay-card {
      position: absolute;
      left: 85px;
      top: 320px;
      width: 910px;
      height: auto;
      display: flex;
      flex-direction: row;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 10px 14px 0px #141414;
      border: 3px solid #141414;
      will-change: transform, opacity;
    }

    /* Contrast-safe solid ink plate */
    .hf-plate-ink {
      background-color: #141414;
    }

    .card-accent-bar {
      width: 14px;
      background-color: #FF6A1A;
      flex-shrink: 0;
    }

    .card-body {
      padding: 32px 38px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-grow: 1;
    }

    /* Tag badge: orange plate with ink text (6.4:1 contrast) */
    .tag-badge {
      align-self: flex-start;
      padding: 6px 16px;
      border-radius: 2px;
      background-color: #FF6A1A;
    }

    .tag-text {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #141414;
    }

    /* Main punch phrase: onDarkText on ink plate (16.8:1 contrast) */
    .punch-phrase {
      margin: 0;
      font-size: 58px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      color: #F7F4EC;
    }

    .title-with-icon {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .title-with-icon .punch-phrase {
      font-size: 50px;
    }

    /* Self-drawing Rise Icon Box */
    .icon-rise-box {
      width: 92px;
      height: 92px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(255, 106, 26, 0.12);
      border: 2px solid #FF6A1A;
      border-radius: 8px;
      will-change: transform, opacity;
    }

    .icon-rise-svg {
      width: 74px;
      height: 74px;
      overflow: visible;
    }

    .draw-path {
      fill: none;
    }

    /* Vox style signature bottom orange bar */
    .brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 14px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s02"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="5.92"
  >
    <!-- Background Paper Grid -->
    <div class="bg-grid"></div>

    <!-- Main Scene Container -->
    <section id="scene-s02" class="clip" data-start="0" data-duration="5.92">
      <!-- Photo Collage Card Frame -->
      <div id="photo-frame" class="photo-frame">
        <!-- Collage tape strips -->
        <div class="tape-strip tape-top-right"></div>
        <div class="tape-strip tape-bottom-left"></div>

        <!-- Inner photo container with camera pan -->
        <div class="photo-viewport">
          <img
            id="hero-img"
            src="assets/img-20-urban-flooding-water-pump-street.jpg"
            alt="Cậu bé ngồi bơm nước chống ngập tràn vào nhà mùa triều cường"
            data-layout-allow-overflow="true"
          >
        </div>
      </div>
    </section>

    <!-- Overlay 1: "KHÔNG MƯA VẪN NGẬP" (t = 1.88s -> 3.85s) -->
    <div id="clip-overlay-1" class="clip overlay-clip" data-start="1.88" data-duration="1.97">
      <div id="card-overlay-1" class="overlay-card hf-plate-ink">
        <div class="card-accent-bar"></div>
        <div class="card-body">
          <div class="tag-badge">
            <span class="tag-text">NGHỊCH LÝ ĐÔ THỊ</span>
          </div>
          <h2 class="punch-phrase">KHÔNG MƯA VẪN NGẬP</h2>
        </div>
      </div>
    </div>

    <!-- Overlay 2: "TRIỀU CƯỜNG DÂNG CAO" + Rise Icon (t = 3.88s -> 5.85s) -->
    <div id="clip-overlay-2" class="clip overlay-clip" data-start="3.88" data-duration="1.97">
      <div id="card-overlay-2" class="overlay-card hf-plate-ink">
        <div class="card-accent-bar"></div>
        <div class="card-body">
          <div class="tag-badge">
            <span class="tag-text">NGUYÊN NHÂN THỰC TẾ</span>
          </div>
          <div class="title-with-icon">
            <h2 class="punch-phrase">TRIỀU CƯỜNG DÂNG CAO</h2>
            <div id="icon-rise-box" class="icon-rise-box">
              <svg class="icon-rise-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Sóng nước triều dâng -->
                <path class="draw-path" d="M10 82 C 30 72, 45 92, 65 82 C 80 74, 90 85, 95 82" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round"/>
                <path class="draw-path" d="M12 64 C 32 54, 48 74, 68 64 C 82 56, 92 68, 95 64" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round"/>
                <!-- Mũi tên dâng lên -->
                <path class="draw-path" d="M52 60 L 52 18" stroke="#FF6A1A" stroke-width="7" stroke-linecap="round"/>
                <path class="draw-path" d="M36 34 L 52 16 L 68 34" stroke="#FF6A1A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Signature Bottom Orange Bar -->
    <div class="brand-bar"></div>
  </div>

  <script>
    // Prepare SVG path drawing for the rise icon
    const drawPaths = document.querySelectorAll(".draw-path");
    drawPaths.forEach(function (path) {
      const len = path.getTotalLength();
      path.style.strokeDasharray = len + "";
      path.style.strokeDashoffset = len + "";
    });

    // Create seekable, paused GSAP timeline
    const tl = gsap.timeline({ paused: true });

    // Scene transition in: "rise" entrance
    tl.fromTo(
      "#photo-frame",
      { y: 70, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
      0
    );

    // Camera motion: slow pan-right following water flow across street
    // Single source of truth for horizontal positioning: starts at x: 0 (left edge / boy), pans to x: -280
    tl.fromTo(
      "#hero-img",
      { x: 0, scale: 1.0 },
      { x: -280, scale: 1.05, duration: 5.92, ease: "none" },
      0
    );

    // Overlay 1: "KHÔNG MƯA VẪN NGẬP" (entrance at 1.88s, exit at 3.55s -> completes at 3.80s)
    tl.fromTo(
      "#card-overlay-1",
      { y: 40, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      1.88
    );
    tl.to(
      "#card-overlay-1",
      { y: -20, opacity: 0, duration: 0.25, ease: "power2.in" },
      3.55
    );

    // Overlay 2: "TRIỀU CƯỜNG DÂNG CAO" (entrance at 3.88s, exit at 5.55s -> completes at 5.80s)
    tl.fromTo(
      "#card-overlay-2",
      { y: 40, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      3.88
    );

    // Icon Rise: arrives at 4.78s with self-drawing strokes
    tl.fromTo(
      "#icon-rise-box",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      4.78
    );

    drawPaths.forEach(function (path, index) {
      tl.to(
        path,
        { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" },
        4.88 + index * 0.08
      );
    });

    tl.to(
      "#card-overlay-2",
      { y: -20, opacity: 0, duration: 0.25, ease: "power2.in" },
      5.55
    );

    // Register paused timeline with HyperFrames runtime
    window.__timelines["scene-s02"] = tl;
  </script>

    </template>
  </body>
</html>
