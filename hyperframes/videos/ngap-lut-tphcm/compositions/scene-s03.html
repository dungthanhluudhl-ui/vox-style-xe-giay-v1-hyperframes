<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      background-color: #F5F0E4;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
    }
    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F5F0E4;
    }
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Brand Signature Bottom Bar */
    #brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 16px;
      background-color: #FF6A1A;
      z-index: 999;
    }

    /* Scene Content Container */
    #scene-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Punch-phrase badge (Ink plate, onDarkText, orange accent) */
    #punch-badge {
      position: absolute;
      top: 180px;
      left: 80px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      background-color: #141414;
      border-left: 12px solid #FF6A1A;
      padding: 18px 32px 18px 24px;
      border-radius: 4px;
      box-shadow: 0 16px 36px rgba(20, 20, 20, 0.22);
      transform-origin: left center;
    }
    #punch-text {
      margin: 0;
      font-size: 58px;
      font-weight: 900;
      line-height: 1.1;
      color: #F7F4EC;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Unfolding Paper Card for Infographic */
    #card-unfold-wrapper {
      position: absolute;
      top: 290px;
      left: 80px;
      width: 920px;
      height: 1020px;
      perspective: 1200px;
      z-index: 10;
    }
    #card-frame {
      width: 100%;
      height: 100%;
      position: relative;
      background-color: #E7E3D9;
      border: 3px solid rgba(20, 20, 20, 0.4);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 50px rgba(20, 20, 20, 0.16);
      transform-origin: top center;
    }
    #hero-img {
      position: absolute;
      inset: -12px;
      width: calc(100% + 24px);
      height: calc(100% + 24px);
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Decorative Paper Tape on Top Edge of the Card */
    .paper-tape {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 26px;
      background-color: rgba(231, 227, 217, 0.92);
      border: 1px dashed rgba(20, 20, 20, 0.35);
      z-index: 20;
    }

    /* Ban Icon Callout (pointing at the blocked bathtub drain) */
    #ban-callout {
      position: absolute;
      left: 710px;
      top: 960px;
      width: 150px;
      height: 150px;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }
    .ban-backing {
      position: absolute;
      inset: 0;
      background-color: #141414;
      border-radius: 50%;
      border: 4px solid #FF6A1A;
      box-shadow: 0 12px 30px rgba(20, 20, 20, 0.38);
    }
    .ban-svg {
      position: relative;
      width: 110px;
      height: 110px;
      z-index: 2;
    }
    .ban-stroke {
      fill: none;
      stroke: #FF6A1A;
      stroke-width: 12;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s03"
    data-width="1080"
    data-height="1920"
    data-duration="5.16"
  >
    <!-- Scene S03 Clip (0s to 5.16s) -->
    <div id="scene-s03" class="clip" data-start="0" data-duration="5.16">
      <div id="scene-container">
        <!-- Punch phrase badge -->
        <div id="punch-badge">
          <span id="punch-text">ẨN DỤ BỒN TẮM</span>
        </div>

        <!-- Card with 3D paper unfold transition -->
        <div id="card-unfold-wrapper">
          <div class="paper-tape"></div>
          <div id="card-frame">
            <img
              id="hero-img"
              src="assets/img-05-hcmc-flooding-bathtub-metaphor.jpg"
              alt="Mô hình ẩn dụ bồn tắm ngập lụt"
            >
          </div>
        </div>

        <!-- Ban icon callout highlighting blocked drain -->
        <div id="ban-callout">
          <div class="ban-backing"></div>
          <svg class="ban-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <path id="ban-ring" class="ban-stroke" d="M 60 14 A 46 46 0 1 0 60.1 14 Z" />
            <path id="ban-bar" class="ban-stroke" d="M 28 28 L 92 92" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Permanent Brand Bottom Bar -->
    <div id="brand-bar"></div>
  </div>

  <script>
    // Prepare SVG path measurements for deterministic drawing
    const ringPath = document.getElementById("ban-ring");
    const barPath = document.getElementById("ban-bar");
    const ringLen = ringPath.getTotalLength();
    const barLen = barPath.getTotalLength();

    ringPath.style.strokeDasharray = ringLen;
    ringPath.style.strokeDashoffset = ringLen;
    barPath.style.strokeDasharray = barLen;
    barPath.style.strokeDashoffset = barLen;

    // Build the master timeline (single paused instance)
    const tl = gsap.timeline({ paused: true });

    // 1. Ken Burns camera zoom-in toward the blocked drain (0s -> 5.16s)
    tl.fromTo(
      "#hero-img",
      { scale: 1.0, transformOrigin: "65% 65%" },
      { scale: 1.06, duration: 5.16, ease: "none" },
      0
    );

    // 2. Unfold transition entrance for the paper card (0.08s -> 0.88s)
    tl.fromTo(
      "#card-frame",
      { rotationX: -85, opacity: 0 },
      { rotationX: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
      0.08
    );

    // Subtle continuous ambient float for the card
    tl.to(
      "#card-unfold-wrapper",
      { y: -10, duration: 4.2, ease: "sine.inOut" },
      0.88
    );

    // 3. Punch-phrase badge entrance at 1.56s (13400ms - 11840ms = 1560ms)
    tl.fromTo(
      "#punch-badge",
      { scale: 0.85, opacity: 0, y: -24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      1.56
    );

    // 4. Ban icon callout arrival at 3.76s (15600ms - 11840ms = 3760ms)
    tl.fromTo(
      "#ban-callout",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.34, ease: "power3.out" },
      3.76
    );

    // 5. Progressive self-drawing of the Ban icon SVG strokes
    tl.to(
      ringPath,
      { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
      3.95
    );
    tl.to(
      barPath,
      { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
      4.25
    );

    // Register paused timeline with HyperFrames runtime
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s03"] = tl;
  </script>

    </template>
  </body>
</html>
