          <div class="header-left">
            <div class="header-pip"></div>
            <span class="header-title">PHÂN TÍCH HIỆN TRƯỜNG // ĐỊA ĐIỂM</span>

  <script>
    // Setup SVG Path Drawing Geometry
    const s1 = document.getElementById("strike-line-1");
    const s2 = document.getElementById("strike-line-2");
    if (s1 && s2) {
      const len1 = s1.getTotalLength();
      s1.style.strokeDasharray = len1 + "";
      s1.style.strokeDashoffset = len1 + "";

      const len2 = s2.getTotalLength();
      s2.style.strokeDasharray = len2 + "";
      s2.style.strokeDashoffset = len2 + "";
    }

    // Single Master Paused Timeline
    const tl = gsap.timeline({ paused: true });

    // 0.15s: Hero Card Rise Entrance
    tl.fromTo(
      "#hero-card",
      { y: 70, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
      0.15
    );

    // 0s - 7.59s: Camera Pan-Right across the Satellite Collage
    tl.fromTo(
      "#map-img",
      { x: -50, scale: 1.12 },
      { x: 45, scale: 1.12, duration: 7.59, ease: "none" },
      0
    );

    // 0.95s: Diagram Strike Lines Draw Progressively
    tl.to(
      "#strike-line-1",
      { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
      0.95
    );
    tl.to(
      "#strike-line-2",
      { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
      1.15
    );

    // 1.25s: Diagram Callout Tag Pops In
    tl.fromTo(
      "#basin-tag",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      1.25
    );

    // 1.47s: Overlay 1 (Punch Phrase: MẤT KHO CHỨA NƯỚC) Enters
    tl.fromTo(
      "#punch-box",
      { scale: 0.92, y: 28, opacity: 0 },
      { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      1.47
    );

    // 4.25s: Overlay 1 Fades Out Before Next Beat
    tl.to(
      "#punch-box",
      { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
      4.25
    );

    // 5.67s: Overlay 2 (Label: TƯ DUY ĐẨY NHANH) Enters
    tl.fromTo(
      "#label-box",
      { scale: 0.92, y: 32, opacity: 0 },
      { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      5.67
    );

    // Register Timeline to HyperFrames Runtime
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s25"] = tl;
  </script>
