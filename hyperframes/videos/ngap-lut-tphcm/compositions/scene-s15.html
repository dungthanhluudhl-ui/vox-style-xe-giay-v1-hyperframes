<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (chuẩn WCAG AA từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }

      /* Quy ước clip HyperFrames: position absolute inset 0 */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Thanh cam nhận diện Vox cố định mép đáy */
      .bottom-orange-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 14px;
        background: #FF6A1A;
        z-index: 100;
      }

      /* Background variant chart: các đường kẻ ngang đậm 20%, 40%, 60%, 80% + tick cam mép trái (thuần đồ hoạ) */
      .chart-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }
      .chart-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: rgba(20, 20, 20, 0.22);
      }
      .chart-tick {
        position: absolute;
        left: 0;
        width: 28px;
        height: 6px;
        background: #FF6A1A;
      }

      /* HEADER: y = 160px đến 280px (nằm trong safe zone y: 160 - 1390) */
      .header-wrapper {
        position: absolute;
        top: 160px;
        left: 60px;
        right: 60px;
        z-index: 20;
      }
      .badge-category {
        display: inline-block;
        background: #FF6A1A;
        color: #141414;
        font-size: 20px;
        font-weight: 900;
        padding: 6px 18px;
        border: 2px solid #141414;
        letter-spacing: 1.5px;
        margin-bottom: 12px;
      }
      .header-title {
        margin: 0;
        font-size: 52px;
        font-weight: 900;
        line-height: 1.25;
        color: #141414;
        text-transform: uppercase;
        letter-spacing: -0.5px;
      }

      /* KHUNG DIAGRAM: y = 300px đến 1060px (cao 760px) */
      .diagram-card-container {
        position: absolute;
        top: 300px;
        left: 60px;
        width: 960px;
        height: 760px;
        z-index: 10;
      }
      .diagram-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        background: #F5F0E4;
        border: 4px solid #141414;
        box-shadow: 12px 12px 0px #141414;
        overflow: hidden;
      }
      .diagram-image-viewport {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .diagram-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 30%;
        display: block;
      }

      /* Góc crosshair kỹ thuật */
      .crosshair {
        position: absolute;
        width: 20px;
        height: 20px;
        pointer-events: none;
        z-index: 5;
      }
      .crosshair::before, .crosshair::after {
        content: "";
        position: absolute;
        background: #FF6A1A;
      }
      .crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
      .crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
      .ch-tl { top: 12px; left: 12px; }
      .ch-tr { top: 12px; right: 12px; }
      .ch-bl { bottom: 12px; left: 12px; }
      .ch-br { bottom: 12px; right: 12px; }

      /* Nhãn kỹ thuật trên nền mực đặc để đạt chuẩn tương phản */
      .diagram-tag {
        position: absolute;
        top: 18px;
        left: 20px;
        background: #141414;
        color: #F7F4EC;
        font-size: 20px;
        font-weight: 900;
        padding: 6px 16px;
        letter-spacing: 1px;
        border: 1px solid #FF6A1A;
        z-index: 6;
      }

      /* Vạch đo sụt lún động trên sơ đồ */
      .ruler-pointer {
        position: absolute;
        right: 40px;
        top: 80px;
        bottom: 80px;
        width: 80px;
        border-right: 3px dashed #141414;
        z-index: 6;
        pointer-events: none;
      }
      .subsidence-beam {
        position: absolute;
        right: 0;
        width: 60px;
        border-top: 4px solid #141414;
      }

      /* KHỐI DỮ LIỆU ĐỘNG: y = 1090px đến 1340px (cao 250px, an toàn dưới mốc 1390px của safe-zone) */
      .data-overlay-wrapper {
        position: absolute;
        top: 1090px;
        left: 60px;
        width: 960px;
        height: 250px;
        z-index: 30;
      }

      .stat-card {
        position: relative;
        width: 100%;
        height: 100%;
        background: #141414;
        border: 4px solid #FF6A1A;
        box-shadow: 10px 10px 0px #141414;
        padding: 24px 36px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .stat-card-alert {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }

      .stat-content-col {
        flex: 1;
        max-width: 740px;
      }

      .stat-top-row {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 8px;
      }
      .stat-badge-tag {
        display: inline-block;
        background: #FF6A1A;
        color: #141414;
        font-size: 20px;
        font-weight: 900;
        padding: 4px 14px;
        letter-spacing: 1px;
      }
      .stat-subtitle {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .stat-main-val {
        font-size: 64px;
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: -1px;
        margin: 0;
      }

      .stat-footer-text {
        margin-top: 10px;
        font-size: 22px;
        font-weight: 700;
      }

      /* Warning Icon Box tích hợp ngang hàng, không dùng CSS transform tránh xung đột GSAP */
      .warning-icon-box {
        width: 110px;
        height: 110px;
        background: #141414;
        border: 3px solid #FF6A1A;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-left: 20px;
      }
      .warning-svg {
        width: 76px;
        height: 76px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s15"
      data-width="1080"
      data-height="1920"
      data-duration="8.08"
    >
      <!-- Background Chart Variant: Kẻ ngang 20%, 40%, 60%, 80% + Tick cam -->
      <div class="chart-bg">
        <div class="chart-line" style="top: 384px;"></div>
        <div class="chart-tick" style="top: 381px;"></div>

        <div class="chart-line" style="top: 768px;"></div>
        <div class="chart-tick" style="top: 765px;"></div>

        <div class="chart-line" style="top: 1152px;"></div>
        <div class="chart-tick" style="top: 1149px;"></div>

        <div class="chart-line" style="top: 1536px;"></div>
        <div class="chart-tick" style="top: 1533px;"></div>
      </div>

      <!-- SHOT S15-1: Căn cứ toàn cảnh & diagram mặt cắt địa chất (0s - 8.08s) -->
      <section id="shot-s15-1" class="clip" data-start="0" data-duration="8.08">
        <!-- Header thông tin -->
        <div id="header-group" class="header-wrapper">
          <div class="badge-category hf-hl-orange">SỐ LIỆU ĐỊA CHẤT</div>
          <h1 class="header-title hf-text-ink">MẶT CẮT SỤT LÚN KHU NAM</h1>
        </div>

        <!-- Khung chứa ảnh Diagram mặt cắt (Khai thác chi tiết img-02) -->
        <div class="diagram-card-container">
          <div id="diagram-card" class="diagram-card-inner">
            <!-- 4 góc crosshair kỹ thuật -->
            <div class="crosshair ch-tl"></div>
            <div class="crosshair ch-tr"></div>
            <div class="crosshair ch-bl"></div>
            <div class="crosshair ch-br"></div>

            <div class="diagram-image-viewport">
              <img
                id="diagram-img"
                class="diagram-image"
                src="assets/img-02-land-subsidence-geology-diagram.jpg"
                alt="Sơ đồ mặt cắt địa chất lún đất"
              />
            </div>

            <!-- Nhãn định danh kỹ thuật -->
            <div class="diagram-tag hf-plate-ink">KHU VỰC VEN SÔNG & KHU NAM</div>

            <!-- Vạch đo lún trên sơ đồ -->
            <div class="ruler-pointer">
              <div id="gauge-beam-1" class="subsidence-beam" style="top: 180px;"></div>
              <div id="gauge-beam-2" class="subsidence-beam" style="top: 320px; border-color: #FF6A1A; border-top-width: 6px;"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- OVERLAY 1: "LÚN 2 - 5 CM/NĂM" (atMs 109500 -> 3.18s, duration 2.7s) -->
      <section id="clip-stat-1" class="clip" data-start="3.18" data-duration="2.7">
        <div class="data-overlay-wrapper">
          <div id="stat-card-1" class="stat-card">
            <div class="stat-top-row">
              <span class="stat-badge-tag hf-hl-orange">MỨC PHỔ BIẾN</span>
              <span class="stat-subtitle hf-text-light">KHU NAM & VEN SÔNG</span>
            </div>
            <div class="stat-main-val hf-text-light">LÚN 2 - 5 CM/NĂM</div>
            <div class="stat-footer-text hf-text-light">Tốc độ sụt lún bề mặt đo đạc định kỳ liên tục</div>
          </div>
        </div>
      </section>

      <!-- OVERLAY 2: "ĐIỂM NÓNG 7 - 8 CM" + ICON WARNING (atMs 112500 -> 6.18s, duration 1.9s) -->
      <section id="clip-stat-2" class="clip" data-start="6.18" data-duration="1.9">
        <div class="data-overlay-wrapper">
          <div id="stat-card-2" class="stat-card stat-card-alert">
            <div class="stat-content-col">
              <div class="stat-top-row">
                <span class="stat-badge-tag hf-hl-orange">MỨC BÁO ĐỘNG</span>
                <span class="stat-subtitle hf-plate-ink-orange" style="background: transparent;">CÁC KHU VỰC TRỌNG ĐIỂM</span>
              </div>
              <div class="stat-main-val hf-plate-ink-orange" style="background: transparent;">ĐIỂM NÓNG 7 - 8 CM</div>
              <div class="stat-footer-text hf-text-light">Tốc độ sụt lún nguy hiểm tại các khu vực trọng điểm</div>
            </div>

            <!-- Icon Warning xuất hiện đồng bộ ở atMs 113000 (6.68s) -->
            <div id="warn-box" class="warning-icon-box">
              <svg class="warning-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  id="warn-path-tri"
                  d="M 50 14 L 88 82 L 12 82 Z"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="7"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                />
                <line
                  id="warn-path-line"
                  x1="50"
                  y1="38"
                  x2="50"
                  y2="58"
                  stroke="#FF6A1A"
                  stroke-width="7"
                  stroke-linecap="round"
                />
                <circle
                  id="warn-path-dot"
                  cx="50"
                  cy="72"
                  r="4.5"
                  fill="#FF6A1A"
                />
              </svg>
            </div>
          </div>
        </div>
      </section>

      <!-- Thanh cam đáy cố định nhận diện Vox -->
      <div class="bottom-orange-bar"></div>
    </div>

    <script>
      // Khởi tạo GSAP timeline paused theo đúng chuẩn HyperFrames
      const tl = gsap.timeline({ paused: true });

      // 1. Phục vụ rule svg-path-draw: chuẩn bị dash pattern cho SVG icon warning
      const warnTri = document.querySelector("#warn-path-tri");
      const warnLine = document.querySelector("#warn-path-line");
      let lenTri = 240;
      let lenLine = 22;
      if (warnTri && typeof warnTri.getTotalLength === "function") {
        const measured = warnTri.getTotalLength();
        lenTri = measured > 0 ? measured : 240;
        warnTri.style.strokeDasharray = `${lenTri}`;
        warnTri.style.strokeDashoffset = `${lenTri}`;
      }
      if (warnLine && typeof warnLine.getTotalLength === "function") {
        const measured = warnLine.getTotalLength();
        lenLine = measured > 0 ? measured : 22;
        warnLine.style.strokeDasharray = `${lenLine}`;
        warnLine.style.strokeDashoffset = `${lenLine}`;
      }

      // 2. Entrance Animation: 'grow' cho khung diagram + header trượt nhẹ
      tl.fromTo(
        "#header-group",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.1
      );

      tl.fromTo(
        "#diagram-card",
        { scale: 0.88, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
        0.2
      );

      // Camera motion: Zoom-in 1.1x liên tục xuyên suốt 8.08s
      tl.fromTo(
        "#diagram-img",
        { scale: 1 },
        { scale: 1.12, duration: 8.08, ease: "none" },
        0
      );

      // 3. Vạch đo sụt lún số 1 hạ vào vị trí (3.0s)
      tl.fromTo(
        "#gauge-beam-1",
        { opacity: 0, x: 20 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" },
        3.0
      );

      // 4. OVERLAY 1: "LÚN 2 - 5 CM/NĂM" (data-start: 3.18s, dur: 2.7s)
      tl.fromTo(
        "#stat-card-1",
        { scale: 0.85, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        3.18
      );

      // Card 1 rút êm trước khi hết clip
      tl.to(
        "#stat-card-1",
        { opacity: 0, y: -15, duration: 0.35, ease: "power2.in" },
        5.4
      );

      // 5. Vạch đo sụt lún số 2 chạm mốc cảnh báo đỏ cam (6.0s)
      tl.fromTo(
        "#gauge-beam-2",
        { opacity: 0, x: 30 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" },
        6.0
      );

      // 6. OVERLAY 2: "ĐIỂM NÓNG 7 - 8 CM" (data-start: 6.18s, dur: 1.9s)
      tl.fromTo(
        "#stat-card-2",
        { scale: 0.85, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        6.18
      );

      // 7. OVERLAY 3: Warning Icon (atMs 113000 -> 6.68s)
      tl.fromTo(
        "#warn-box",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        6.68
      );

      // SVG path vẽ nét dần theo rule svg-path-draw
      if (warnTri) {
        tl.fromTo(
          warnTri,
          { strokeDashoffset: lenTri },
          { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
          6.75
        );
      }
      if (warnLine) {
        tl.fromTo(
          warnLine,
          { strokeDashoffset: lenLine },
          { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
          6.95
        );
      }
      tl.fromTo(
        "#warn-path-dot",
        { opacity: 0, scale: 0, transformOrigin: "50px 72px" },
        { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" },
        7.1
      );

      // Đăng ký timeline chính thức vào registry của HyperFrames
      window.__timelines["scene-s15"] = tl;
    </script>
  
    </template>
  </body>
</html>
