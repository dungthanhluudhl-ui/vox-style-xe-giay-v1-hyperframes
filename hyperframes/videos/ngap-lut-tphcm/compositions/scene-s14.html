<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        background-color: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }

      /* Mandatory .clip contract: inset:0, layout full-frame */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Permanent signature bottom accent bar */
      #bottom-signature-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 10px;
        background: #FF6A1A;
        z-index: 100;
      }

      /* Base Shot Container - positioned to give dedicated top space for chapter label */
      #shot-card-wrap {
        position: absolute;
        top: 245px;
        left: 100px;
        width: 880px;
        height: 1080px;
        z-index: 10;
        perspective: 1200px;
      }

      /* Central geological diagram card */
      #diagram-card {
        position: relative;
        width: 100%;
        height: 100%;
        background: #F5F0E4;
        border: 4px solid #141414;
        box-shadow: 14px 14px 0px #141414;
        border-radius: 6px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transform-origin: top center;
      }

      /* Diagram header bar (y: 245px -> 297px) */
      .card-header {
        height: 52px;
        background: #141414;
        color: #F7F4EC;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1.5px;
        border-bottom: 3px solid #141414;
        flex-shrink: 0;
      }
      .card-header-tag {
        color: #FF6A1A;
      }

      /* Diagram image viewport */
      #diagram-viewport {
        position: relative;
        width: 100%;
        height: 1022px;
        overflow: hidden;
        background: #E7E3D9;
      }

      #diagram-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 880px;
        height: 1540px;
        object-fit: cover;
        display: block;
      }

      /* Technical depth markers inside viewport */
      .depth-tag {
        position: absolute;
        right: 24px;
        padding: 6px 14px;
        border-radius: 4px;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 1px;
        border: 2px solid #141414;
        box-shadow: 3px 3px 0px #141414;
        z-index: 5;
      }

      /* Overlay 1: Label "VẤN ĐỀ THỨ HAI" - dedicated top band (y: 175px -> 225px), 0% occlusion */
      #clip-label {
        z-index: 30;
      }
      #badge-issue {
        position: absolute;
        top: 175px;
        left: 100px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 10px 22px;
        border-radius: 4px;
        border: 3px solid #141414;
        box-shadow: 6px 6px 0px #141414;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 2px;
      }
      .badge-index {
        background: #141414;
        color: #F7F4EC;
        padding: 2px 10px;
        border-radius: 2px;
        font-size: 18px;
      }

      /* Overlay 3: Icon "fall" (y: 980px -> 1080px) */
      #clip-icon {
        z-index: 45;
      }
      #fall-icon-badge {
        position: absolute;
        top: 980px;
        left: 490px;
        width: 100px;
        height: 100px;
        border-radius: 8px;
        border: 3px solid #141414;
        box-shadow: 6px 6px 0px #FF6A1A;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Overlay 2: Punch Phrase "MẶT ĐẤT SỤT LÚN" (y: 1120px -> 1215px) */
      #clip-punch {
        z-index: 40;
      }
      #punch-card {
        position: absolute;
        top: 1120px;
        left: 120px;
        width: 840px;
        padding: 20px 24px;
        border-radius: 6px;
        border: 4px solid #141414;
        box-shadow: 8px 8px 0px #FF6A1A;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .punch-headline {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 58px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: 1px;
      }
      .punch-white {
        color: #F7F4EC;
      }
      .punch-chip {
        padding: 4px 18px;
        border-radius: 4px;
        border: 3px solid #141414;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s14"
      data-width="1080"
      data-height="1920"
      data-duration="7.36"
      data-start="0"
    >
      <!-- Base Shot S14-1: Unfold entrance and slow geological pan (0s -> 7.36s) -->
      <section id="shot-s14-1" class="clip" data-start="0" data-duration="7.36">
        <div id="shot-card-wrap">
          <div id="diagram-card">
            <div class="card-header">
              <span>● MẶT CẮT ĐỊA CHẤT ĐÔ THỊ</span>
              <span class="card-header-tag">FIG. 14 / TẦNG TRẦM TÍCH</span>
            </div>
            <div id="diagram-viewport">
              <img
                id="diagram-img"
                src="assets/img-02-land-subsidence-geology-diagram.jpg"
                alt="Sơ đồ địa chất sụt lún ngầm TP.HCM"
              />
              <div id="depth-0" class="depth-tag hf-plate-ink" style="top: 60px;">
                <span>0m: BỀ MẶT ĐÔ THỊ</span>
              </div>
              <div id="depth-25" class="depth-tag hf-plate-ink-orange" style="top: 500px;">
                <span>-25m: BÙN SÉT YẾU</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Overlay 1: Label "VẤN ĐỀ THỨ HAI" (atMs: 101500 -> 2.54s, holdMs: 2200 -> 2.20s) -->
      <div id="clip-label" class="clip" data-start="2.54" data-duration="2.20">
        <div id="badge-issue" class="hf-hl-orange">
          <span class="badge-index">02</span>
          <span>VẤN ĐỀ THỨ HAI</span>
        </div>
      </div>

      <!-- Overlay 3: Icon "fall" (atMs: 105500 -> 6.54s, holdMs: 800 -> 0.82s) -->
      <div id="clip-icon" class="clip" data-start="6.54" data-duration="0.82">
        <div id="fall-icon-badge" class="hf-plate-ink">
          <svg id="fall-svg" width="70" height="70" viewBox="0 0 100 100" fill="none">
            <path
              id="fall-ground"
              d="M 15 35 L 45 35 L 55 65 L 85 65"
              stroke="#F7F4EC"
              stroke-width="6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              id="fall-arrow"
              d="M 50 18 L 50 78 M 38 66 L 50 78 L 62 66"
              stroke="#FF6A1A"
              stroke-width="7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>

      <!-- Overlay 2: Punch Phrase "MẶT ĐẤT SỤT LÚN" (atMs: 104500 -> 5.54s, holdMs: 1800 -> 1.82s) -->
      <div id="clip-punch" class="clip" data-start="5.54" data-duration="1.82">
        <div id="punch-card" class="hf-plate-ink">
          <h1 class="punch-headline">
            <span class="punch-white">MẶT ĐẤT</span>
            <span class="punch-chip hf-hl-orange">SỤT LÚN</span>
          </h1>
        </div>
      </div>

      <!-- Permanent signature bottom bar -->
      <div id="bottom-signature-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Unfold Entrance for Diagram Card (t = 0)
      tl.fromTo(
        "#diagram-card",
        { rotationX: -36, scaleY: 0.35, opacity: 0 },
        { rotationX: 0, scaleY: 1, opacity: 1, duration: 0.85, ease: "power3.out" },
        0
      );

      // 2. Slow steady camera pan down into the geological strata (0s -> 7.36s)
      tl.fromTo(
        "#diagram-img",
        { y: 0, x: 15 },
        { y: -340, x: -15, duration: 7.36, ease: "none" },
        0
      );

      // 3. Depth markers entrance
      tl.fromTo(
        "#depth-0",
        { opacity: 0, x: 30 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" },
        0.8
      );
      tl.fromTo(
        "#depth-25",
        { opacity: 0, x: 30 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" },
        1.1
      );

      // 4. Overlay 1: Label "VẤN ĐỀ THỨ HAI" (at 2.54s, fades out cleanly before clip end)
      tl.fromTo(
        "#badge-issue",
        { scale: 0, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        2.54
      );
      tl.to(
        "#badge-issue",
        { opacity: 0, y: -15, duration: 0.25, ease: "power2.in" },
        4.45
      );

      // 5. Overlay 2: Punch Phrase "MẶT ĐẤT SỤT LÚN" (at 5.54s)
      tl.fromTo(
        "#punch-card",
        { scale: 0.88, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        5.54
      );

      // 6. Overlay 3: Icon "fall" self-drawing stroke animation (at 6.54s)
      const groundPath = document.getElementById("fall-ground");
      const arrowPath = document.getElementById("fall-arrow");
      if (groundPath && arrowPath) {
        const gLen = groundPath.getTotalLength();
        const aLen = arrowPath.getTotalLength();
        groundPath.style.strokeDasharray = `${gLen}`;
        groundPath.style.strokeDashoffset = `${gLen}`;
        arrowPath.style.strokeDasharray = `${aLen}`;
        arrowPath.style.strokeDashoffset = `${aLen}`;

        tl.fromTo(
          "#fall-icon-badge",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" },
          6.54
        );
        tl.to(
          groundPath,
          { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
          6.60
        );
        tl.to(
          arrowPath,
          { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" },
          6.68
        );
      }

      // Register master timeline
      window.__timelines["scene-s14"] = tl;
    </script>
  
    </template>
  </body>
</html>
