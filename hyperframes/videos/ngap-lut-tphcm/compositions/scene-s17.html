<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        background-color: #F5F0E4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #F5F0E4;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Vox Brand signature bottom bar */
      .vox-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 18px;
        background-color: #FF6A1A;
        z-index: 50;
      }

      /* Safe area content wrapper */
      .scene-content {
        position: absolute;
        top: 170px;
        left: 48px;
        right: 48px;
        bottom: 540px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* Header section */
      .header-block {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .category-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .category-tag {
        background-color: #141414;
        color: #F7F4EC;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 2px;
        padding: 8px 18px;
        border-radius: 4px;
        text-transform: uppercase;
      }

      .category-sub {
        font-size: 24px;
        font-weight: 700;
        color: #141414;
        letter-spacing: 1px;
        opacity: 0.8;
      }

      /* Overlay Label: NGUYÊN LÝ ĐỘ DỐC */
      #slope-label {
        opacity: 0;
        align-self: flex-start;
        background-color: #FF6A1A;
        color: #141414;
        font-size: 40px;
        font-weight: 900;
        padding: 12px 28px;
        border: 3px solid #141414;
        border-radius: 6px;
        box-shadow: 6px 6px 0px #141414;
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }

      /* Diagram Card Container */
      .diagram-card {
        width: 100%;
        height: 780px;
        background-color: #E7E3D9;
        border: 4px solid #141414;
        border-radius: 12px;
        box-shadow: 10px 10px 0px #141414;
        position: relative;
        padding: 24px;
        display: flex;
        flex-direction: column;
      }

      .card-header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #141414;
        padding-bottom: 12px;
        margin-bottom: 16px;
      }

      .card-title {
        font-size: 26px;
        font-weight: 900;
        color: #141414;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .card-status-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .card-status {
        font-size: 20px;
        font-weight: 900;
        padding: 4px 12px;
        border-radius: 4px;
        letter-spacing: 1px;
        text-transform: uppercase;
        white-space: nowrap;
      }

      #badge-natural {
        background-color: #141414;
        color: #FF6A1A;
      }

      #badge-flat {
        position: absolute;
        right: 0;
        top: 0;
        background-color: #FF6A1A;
        color: #141414;
        visibility: hidden;
        opacity: 0;
      }

      /* SVG Diagram Stage */
      .diagram-stage {
        flex: 1;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Punch Phrase: CHẢY VÙNG TRŨNG */
      .punch-container {
        width: 100%;
        display: flex;
        justify-content: center;
      }

      #punch-box {
        opacity: 0;
        width: 100%;
        background-color: #141414;
        border: 4px solid #141414;
        border-radius: 12px;
        padding: 24px 32px;
        box-shadow: 8px 8px 0px #FF6A1A;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .punch-text {
        color: #F7F4EC;
        font-size: 58px;
        font-weight: 900;
        letter-spacing: 2px;
        line-height: 1.2;
      }

      .punch-badge {
        background-color: #FF6A1A;
        color: #141414;
        font-size: 26px;
        font-weight: 900;
        padding: 10px 20px;
        border-radius: 6px;
        border: 2px solid #141414;
        white-space: nowrap;
      }

      /* SVG line styling */
      .tech-line {
        stroke: #141414;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .grid-dash {
        stroke: rgba(20, 20, 20, 0.25);
        stroke-dasharray: 6 6;
      }
      .measure-arrow {
        stroke: #141414;
        stroke-width: 3;
        fill: #141414;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s17"
      data-width="1080"
      data-height="1920"
      data-duration="7.9"
    >
      <!-- Visual Scene Clip -->
      <div id="scene-clip" class="clip" data-start="0" data-duration="7.9">
        <div id="scene-wrapper" class="scene-content">
          <!-- Header Section -->
          <div class="header-block">
            <div class="category-row">
              <span class="category-tag">THỦY LỰC ĐÔ THỊ</span>
              <span class="category-sub">// QUY LUẬT TỰ NHIÊN</span>
            </div>
            <!-- Shotlist Overlay 1: NGUYÊN LÝ ĐỘ DỐC -->
            <div id="slope-label">NGUYÊN LÝ ĐỘ DỐC</div>
          </div>

          <!-- Main Technical Diagram Card -->
          <div id="diagram-panel" class="diagram-card">
            <div class="card-header-bar">
              <span class="card-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                  <path d="M3 20L21 4M3 20H21M3 20V4" stroke="#141414" stroke-width="3" stroke-linecap="round"/>
                </svg>
                MÔ PHỎNG ĐƯỜNG DỐC THỦY LỰC
              </span>
              <div class="card-status-wrapper">
                <span id="badge-natural" class="card-status">DỐC TỰ NHIÊN</span>
                <span id="badge-flat" class="card-status">ĐỘ DỐC = 0</span>
              </div>
            </div>

            <div class="diagram-stage">
              <svg width="100%" height="100%" viewBox="0 0 930 630" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Background Blueprint Grid Lines -->
                <line x1="50" y1="120" x2="880" y2="120" class="grid-dash" stroke-width="1.5" />
                <line x1="50" y1="260" x2="880" y2="260" class="grid-dash" stroke-width="1.5" />
                <line x1="50" y1="400" x2="880" y2="400" class="grid-dash" stroke-width="1.5" />
                <line x1="50" y1="540" x2="880" y2="540" class="tech-line" stroke-width="2.5" />

                <!-- Height Elevation Guide Left (High Point) -->
                <g id="high-elevation-group">
                  <line x1="80" y1="100" x2="80" y2="540" class="measure-arrow" stroke-dasharray="4 4" />
                  <polygon points="80,90 74,106 86,106" fill="#141414" />
                  <polygon points="80,550 74,534 86,534" fill="#141414" />
                  <rect x="35" y="290" width="90" height="38" rx="4" fill="#141414" />
                  <text x="80" y="316" fill="#F7F4EC" font-size="20" font-weight="900" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">ĐỘ CAO</text>
                </g>

                <!-- SECTION 1: SLOPED PIPE (Natural hydraulic slope) -->
                <g id="sloped-pipe-system">
                  <!-- Pipe outer body -->
                  <path id="pipe-slope-line" d="M 120 120 L 580 440 L 860 440" class="tech-line" stroke-width="24" stroke="#141414" fill="none" stroke-dasharray="1200" stroke-dashoffset="1200" />
                  <path d="M 120 120 L 580 440 L 860 440" stroke="#F5F0E4" stroke-width="12" fill="none" />

                  <!-- Slope indicator angle / arrow -->
                  <g id="slope-angle-guide">
                    <line x1="220" y1="140" x2="400" y2="140" stroke="#141414" stroke-width="2" stroke-dasharray="4 4" />
                    <line x1="220" y1="140" x2="380" y2="260" stroke="#FF6A1A" stroke-width="4" />
                    <rect x="250" y="160" width="110" height="34" rx="4" fill="#FF6A1A" stroke="#141414" stroke-width="2" />
                    <text x="305" y="184" fill="#141414" font-size="19" font-weight="900" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">ĐỘ DỐC</text>
                  </g>

                  <!-- Velocity Flow Vectors -->
                  <g id="flow-arrows" opacity="0">
                    <path d="M 280 210 L 340 255" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round" />
                    <polygon points="352,264 334,258 344,244" fill="#FF6A1A" />
                    <path d="M 400 300 L 460 345" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round" />
                    <polygon points="472,354 454,348 464,334" fill="#FF6A1A" />
                  </g>

                  <!-- Water Particles on Slope (translated via GSAP x/y) -->
                  <circle id="water-drop-1" cx="0" cy="0" r="22" fill="#FF6A1A" stroke="#141414" stroke-width="4" style="opacity: 0;" />
                  <circle id="water-drop-2" cx="0" cy="0" r="16" fill="#141414" style="opacity: 0;" />
                </g>

                <!-- SECTION 2: FLATTENED PIPE / ZERO SLOPE (Failure mode) -->
                <g id="flattened-pipe-system" opacity="0">
                  <!-- Pipe body flattened -->
                  <path id="pipe-flat-line" d="M 120 440 L 860 440" class="tech-line" stroke-width="24" stroke="#141414" fill="none" />
                  <path d="M 120 440 L 860 440" stroke="#F5F0E4" stroke-width="12" fill="none" />

                  <!-- Stagnant Puddle (Vũng tù đọng) -->
                  <ellipse id="stagnant-pool" cx="500" cy="440" rx="140" ry="24" fill="#FF6A1A" stroke="#141414" stroke-width="4" style="transform-origin: 500px 440px;" />

                  <!-- Zero Slope Indicator Callout -->
                  <g id="zero-slope-callout">
                    <line x1="500" y1="410" x2="500" y2="300" stroke="#141414" stroke-width="3" />
                    <polygon points="500,420 493,404 507,404" fill="#141414" />
                    <rect x="390" y="250" width="220" height="48" rx="6" fill="#141414" />
                    <text x="500" y="282" fill="#F7F4EC" font-size="22" font-weight="900" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">ĐỘ CHÊNH = 0</text>
                  </g>

                  <!-- Low point / Stagnant warning label -->
                  <g id="stagnant-marker" style="transform-origin: 500px 510px;">
                    <rect x="420" y="490" width="160" height="42" rx="4" fill="#FF6A1A" stroke="#141414" stroke-width="3" />
                    <text x="500" y="519" fill="#141414" font-size="22" font-weight="900" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">TÙ ĐỌNG</text>
                  </g>
                </g>
              </svg>
            </div>
          </div>

          <!-- Shotlist Overlay 2: CHẢY VÙNG TRŨNG (Punch Phrase) -->
          <div class="punch-container">
            <div id="punch-box">
              <span class="punch-text">CHẢY VÙNG TRŨNG</span>
              <span class="punch-badge">QUY LUẬT NƯỚC</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom Orange Visual Anchor Bar -->
      <div class="vox-bottom-bar"></div>
    </div>

    <!-- GSAP Animation Timeline -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Punch Entrance (0.05s - 0.6s)
      tl.fromTo(
        "#scene-wrapper",
        { opacity: 0, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        0.05
      );

      // 2. Technical Diagram Construction (0.3s - 1.4s)
      tl.fromTo(
        "#pipe-slope-line",
        { strokeDashoffset: 1200 },
        { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" },
        0.3
      );
      tl.fromTo(
        "#high-elevation-group",
        { opacity: 0, x: -30 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" },
        0.6
      );
      tl.fromTo(
        "#slope-angle-guide",
        { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        0.8
      );

      // 3. Shotlist Overlay 1: NGUYÊN LÝ ĐỘ DỐC (atMs: 124500 -> 1.7s relative)
      tl.fromTo(
        "#slope-label",
        { opacity: 0, scale: 0.85, y: -20 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.7
      );

      // 4. Water Flow Active Movement using GSAP x/y transform aliases (1.8s - 3.7s)
      tl.fromTo(
        "#water-drop-1",
        { x: 120, y: 120, opacity: 0 },
        { opacity: 1, duration: 0.2, ease: "power1.out" },
        1.8
      );
      tl.to(
        "#water-drop-1",
        { x: 580, y: 440, duration: 1.1, ease: "power2.in" },
        2.0
      );
      tl.to(
        "#water-drop-1",
        { x: 860, y: 440, duration: 0.6, ease: "power1.out" },
        3.1
      );
      tl.to(
        "#water-drop-1",
        { opacity: 0, duration: 0.2 },
        3.7
      );

      tl.fromTo(
        "#flow-arrows",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out" },
        2.1
      );

      // Second trailing drop
      tl.fromTo(
        "#water-drop-2",
        { x: 120, y: 120, opacity: 0 },
        { opacity: 0.9, duration: 0.2 },
        2.4
      );
      tl.to(
        "#water-drop-2",
        { x: 580, y: 440, duration: 1.0, ease: "power2.in" },
        2.6
      );
      tl.to(
        "#water-drop-2",
        { x: 780, y: 440, duration: 0.5, ease: "power1.out" },
        3.6
      );
      tl.to(
        "#water-drop-2",
        { opacity: 0, duration: 0.2 },
        4.1
      );

      // 5. Transition to Flattened State (3.9s - 5.5s)
      tl.fromTo(
        "#sloped-pipe-system",
        { opacity: 1 },
        { opacity: 0, duration: 0.45, ease: "power2.in" },
        3.9
      );
      tl.fromTo(
        "#badge-natural",
        { autoAlpha: 1 },
        { autoAlpha: 0, duration: 0.25, ease: "power1.out" },
        4.0
      );
      tl.fromTo(
        "#badge-flat",
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.25, ease: "power1.out" },
        4.0
      );
      tl.fromTo(
        "#flattened-pipe-system",
        { opacity: 0 },
        { opacity: 1, duration: 0.55, ease: "power2.out" },
        4.1
      );

      // Water loses momentum and stagnates into a puddle
      tl.fromTo(
        "#stagnant-pool",
        { scaleX: 0.1, scaleY: 0.1, opacity: 0 },
        { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.8, ease: "power3.out" },
        4.3
      );
      tl.fromTo(
        "#zero-slope-callout",
        { opacity: 0, y: -15 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        4.6
      );
      tl.fromTo(
        "#stagnant-marker",
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
        4.9
      );

      // 6. Shotlist Overlay 2: CHẢY VÙNG TRŨNG (atMs: 128500 -> 5.7s relative)
      tl.fromTo(
        "#punch-box",
        { opacity: 0, scale: 0.9, y: 30 },
        { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" },
        5.7
      );

      // Subtle stagnant water pulse to maintain visual life (finite deterministic loops)
      tl.to(
        "#stagnant-pool",
        { scaleX: 1.08, scaleY: 1.12, duration: 0.75, yoyo: true, repeat: 1, ease: "sine.inOut" },
        6.1
      );

      // Register master timeline on window.__timelines
      window.__timelines["scene-s17"] = tl;
    </script>
  
    </template>
  </body>
</html>
