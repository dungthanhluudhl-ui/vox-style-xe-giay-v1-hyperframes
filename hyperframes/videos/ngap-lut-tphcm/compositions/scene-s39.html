<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
      color: #141414;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    .clip {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Lớp nền phong cách spotlight */
    .spotlight-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 42%, rgba(231, 227, 217, 1) 0%, rgba(200, 194, 180, 0.95) 55%, rgba(20, 20, 20, 0.45) 100%);
    }

    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(20, 20, 20, 0.08) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.08) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }

    .vignette-overlay {
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 240px rgba(20, 20, 20, 0.65);
    }

    /* Khung card hình ảnh chính (Crop nửa trên img-04 - OVERFLOW) */
    .hero-card-container {
      position: absolute;
      top: 220px;
      left: 80px;
      width: 920px;
      height: 900px;
      transform-origin: center center;
    }

    .hero-card-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border: 5px solid #141414;
      background-color: #141414;
      box-shadow: 16px 16px 0px #141414;
      overflow: hidden;
    }

    .hero-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 180%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* Tag góc trên của card */
    .card-meta-tag {
      position: absolute;
      top: 24px;
      left: 24px;
      background-color: #141414;
      padding: 10px 18px;
      border-left: 6px solid #FF6A1A;
      z-index: 5;
    }

    .card-meta-text {
      color: #F7F4EC;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Hiệu ứng giọt nước rơi vào tâm ly */
    .water-drop-wrapper {
      position: absolute;
      top: 180px;
      left: 510px;
      width: 60px;
      height: 80px;
      z-index: 10;
      opacity: 0;
      transform-origin: center bottom;
    }

    /* Sóng xung kích khi giọt nước chạm bề mặt */
    .impact-ripple {
      position: absolute;
      top: 610px;
      left: 480px;
      width: 120px;
      height: 48px;
      border: 4px solid #FF6A1A;
      border-radius: 50%;
      z-index: 12;
      opacity: 0;
      transform-origin: center center;
    }

    /* Mảnh vụn nứt vỡ lúc shatter entrance */
    .shatter-line-1 {
      position: absolute;
      top: 200px;
      left: 60px;
      width: 180px;
      height: 6px;
      background-color: #FF6A1A;
      transform: rotate(-25deg);
      opacity: 0;
      z-index: 8;
    }

    .shatter-line-2 {
      position: absolute;
      top: 1080px;
      right: 60px;
      width: 220px;
      height: 6px;
      background-color: #141414;
      transform: rotate(35deg);
      opacity: 0;
      z-index: 8;
    }

    /* Overlay 1: CÂU HỎI CỐT LÕI */
    .overlay-container-1 {
      position: absolute;
      top: 1170px;
      left: 80px;
      width: 920px;
      height: auto;
      z-index: 30;
    }

    .plate-question {
      background-color: #141414;
      padding: 28px 36px;
      border-left: 12px solid #FF6A1A;
      box-shadow: 14px 14px 0px rgba(20, 20, 20, 0.4);
    }

    .badge-orange {
      display: inline-block;
      background-color: #FF6A1A;
      color: #141414;
      font-size: 26px;
      font-weight: 900;
      padding: 8px 18px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .question-title {
      color: #F7F4EC;
      font-size: 46px;
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: -0.5px;
    }

    /* Overlay 2: GIỌT NƯỚC TRÀN LY (Punch phrase) */
    .overlay-container-2 {
      position: absolute;
      top: 1150px;
      left: 80px;
      width: 920px;
      height: auto;
      z-index: 40;
    }

    .plate-punch {
      background-color: #141414;
      padding: 34px 40px;
      border: 5px solid #FF6A1A;
      box-shadow: 18px 18px 0px #141414;
    }

    .punch-headline {
      color: #FF6A1A;
      font-size: 64px;
      font-weight: 900;
      line-height: 1.22;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .punch-subtext {
      color: #F7F4EC;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.35;
    }

    /* Thanh cam nhận diện cố định đáy khung hình */
    .bottom-accent-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 14px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s39" data-width="1080" data-height="1920" data-duration="8.53">
    
    <!-- Lớp nền phong cách Spotlight (kéo dài toàn bộ scene 8.53s) -->
    <div class="clip bg-layer" data-start="0" data-duration="8.53">
      <div class="spotlight-bg"></div>
      <div class="grid-pattern"></div>
      <div class="vignette-overlay"></div>
    </div>

    <!-- Lớp thị giác chính: Crop nửa trên img-04 (Ly nước đô thị quá tải) -->
    <div class="clip main-visual" data-start="0" data-duration="8.53">
      <div class="hero-card-container" id="heroCard">
        <div class="hero-card-frame">
          <img class="hero-image" id="heroImg" src="assets/img-04-sponge-city-overflow-concept-diagram.jpg" alt="Ly nước tràn đô thị">
          <div class="card-meta-tag">
            <span class="card-meta-text">HIỆN TRẠNG ĐÔ THỊ</span>
          </div>
        </div>
      </div>

      <!-- Giọt nước rơi xuống bề mặt ly -->
      <div class="water-drop-wrapper" id="waterDrop">
        <svg viewBox="0 0 60 80" width="60" height="80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M30 4 C30 4, 6 42, 6 56 C6 69 17 78 30 78 C43 78 54 69 54 56 C54 42, 30 4, 30 4 Z" fill="#FF6A1A"/>
        </svg>
      </div>

      <!-- Sóng chấn động khi giọt nước chạm bề mặt -->
      <div class="impact-ripple" id="impactRipple"></div>

      <!-- Mảnh nứt vỡ lúc shatter entrance -->
      <div class="shatter-line-1" id="shatterLine1"></div>
      <div class="shatter-line-2" id="shatterLine2"></div>
    </div>

    <!-- Overlay 1: Nhãn CÂU HỎI CỐT LÕI (Xuất hiện lúc 1.52s, giữ 2.2s -> 3.72s) -->
    <div class="clip overlay-clip-1" data-start="1.52" data-duration="2.2">
      <div class="overlay-container-1" id="overlayBox1">
        <div class="plate-question">
          <div class="badge-orange">CÂU HỎI CỐT LÕI</div>
          <div class="question-title">VÌ SAO CỨ MƯA LÀ NGẬP?</div>
        </div>
      </div>
    </div>

    <!-- Overlay 2: Punch phrase GIỌT NƯỚC TRÀN LY (Xuất hiện lúc 6.32s, giữ 2.21s -> hết scene) -->
    <div class="clip overlay-clip-2" data-start="6.32" data-duration="2.21">
      <div class="overlay-container-2" id="overlayBox2">
        <div class="plate-punch">
          <h1 class="punch-headline">GIỌT NƯỚC TRÀN LY</h1>
          <p class="punch-subtext">MƯA CHỈ LÀ TÁC NHÂN CUỐI CÙNG</p>
        </div>
      </div>
    </div>

    <!-- Thanh cam cố định mép dưới -->
    <div class="bottom-accent-bar"></div>

  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. Shatter entrance cho Hero Card (0.0s -> 0.75s)
    tl.fromTo("#heroCard", 
      { scale: 1.18, rotation: -3, opacity: 0 },
      { scale: 1.0, rotation: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
      0
    );

    // Mảnh nứt giấy shatter văng ra lúc mở đầu
    tl.fromTo("#shatterLine1",
      { opacity: 0, scale: 0.2, x: 50, y: 30 },
      { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.35, ease: "power2.out" },
      0.1
    );
    tl.to("#shatterLine1",
      { opacity: 0, x: -60, y: -40, duration: 0.4, ease: "power2.in" },
      0.45
    );

    tl.fromTo("#shatterLine2",
      { opacity: 0, scale: 0.2, x: -40, y: -20 },
      { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.35, ease: "power2.out" },
      0.15
    );
    tl.to("#shatterLine2",
      { opacity: 0, x: 70, y: 50, duration: 0.4, ease: "power2.in" },
      0.5
    );

    // 2. Camera Motion: Zoom-in liên tục mượt mà suốt thời lượng scene (0.75s -> 8.53s)
    tl.fromTo("#heroImg",
      { scale: 1.0 },
      { scale: 1.12, duration: 7.78, ease: "none" },
      0.75
    );

    // 3. Overlay 1: CÂU HỎI CỐT LÕI (Xuất hiện tại thời điểm 1.52s)
    tl.fromTo("#overlayBox1",
      { y: 50, opacity: 0, scale: 0.94 },
      { y: 0, opacity: 1, scale: 1.0, duration: 0.45, ease: "power3.out" },
      1.52
    );
    // Thu gọn overlay 1 trước khi hết thời lượng hiển thị của clip 1 (kết thúc ở 3.72s)
    tl.to("#overlayBox1",
      { y: -25, opacity: 0, duration: 0.35, ease: "power2.in" },
      3.35
    );

    // 4. Giọt nước duy nhất rơi xuống (5.4s -> 6.25s)
    tl.fromTo("#waterDrop",
      { y: -100, opacity: 0, scale: 0.6 },
      { y: 440, opacity: 1, scale: 1.0, duration: 0.85, ease: "power2.in" },
      5.4
    );

    // Giọt nước chạm mặt ly tại 6.25s -> biến mất lập tức
    tl.set("#waterDrop", { opacity: 0 }, 6.25);

    // 5. Hiệu ứng sóng va chạm & nứt vỡ lúc giọt nước chạm mặt (6.25s -> 6.8s)
    tl.fromTo("#impactRipple",
      { scale: 0.2, opacity: 1 },
      { scale: 2.8, opacity: 0, duration: 0.55, ease: "power2.out" },
      6.25
    );

    // Rung chấn kịch tính của khung ảnh tại khoảnh khắc tràn ly (Screen shake)
    tl.to("#heroCard", { x: 12, y: -6, duration: 0.06, ease: "none" }, 6.25);
    tl.to("#heroCard", { x: -14, y: 8, duration: 0.07, ease: "none" }, 6.31);
    tl.to("#heroCard", { x: 8, y: -4, duration: 0.07, ease: "none" }, 6.38);
    tl.to("#heroCard", { x: 0, y: 0, duration: 0.08, ease: "power1.out" }, 6.45);

    // 6. Overlay 2: GIỌT NƯỚC TRÀN LY (Punch phrase xuất hiện tại 6.32s)
    tl.fromTo("#overlayBox2",
      { scale: 0.82, opacity: 0, y: 40 },
      { scale: 1.0, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      6.32
    );

    // Đăng ký timeline cho HyperFrames seek
    window.__timelines["scene-s39"] = tl;
  </script>

    </template>
  </body>
