<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #F5F0E4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Camera & background image */
      #scene-bg {
        overflow: hidden;
      }
      #camera-frame {
        width: 100%;
        height: 100%;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      #aerial-photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        display: block;
      }
      .vignette-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at 50% 45%, rgba(20, 20, 20, 0.08) 0%, rgba(20, 20, 20, 0.45) 100%),
                    linear-gradient(to bottom, rgba(20, 20, 20, 0.35) 0%, transparent 28%, transparent 62%, rgba(20, 20, 20, 0.65) 100%);
      }

      /* Overlay 1: THỰC TRẠNG ĐÔ THỊ */
      #clip-status {
        pointer-events: none;
      }
      #status-card {
        position: absolute;
        top: 240px;
        left: 60px;
        background: #141414;
        border-left: 12px solid #FF6A1A;
        border-radius: 4px;
        padding: 24px 36px;
        box-shadow: 0 16px 44px rgba(0, 0, 0, 0.55);
        will-change: transform, opacity;
      }
      #status-title {
        margin: 0;
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 52px;
        line-height: 1.25;
        color: #F7F4EC;
        letter-spacing: 2px;
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* Overlay 2 & 3: KHÔNG CHỈ DO MƯA & BAN ICON */
      #clip-debunk {
        pointer-events: none;
      }
      #debunk-card {
        position: absolute;
        top: 660px;
        left: 70px;
        right: 70px;
        background: #141414;
        border: 4px solid #FF6A1A;
        border-radius: 20px;
        padding: 44px 36px;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        will-change: transform, opacity;
      }
      #debunk-icon-wrap {
        width: 110px;
        height: 110px;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }
      #debunk-title {
        margin: 0;
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 64px;
        line-height: 1.34;
        color: #F7F4EC;
        text-align: center;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      /* Bottom signature orange bar */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s04"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.84"
    >
      <!-- Shot S04-1: Flycam đại cảnh ngập lụt -->
      <section id="scene-bg" class="clip" data-start="0" data-duration="7.84">
        <div id="camera-frame" data-layout-allow-overflow>
          <img
            id="aerial-photo"
            src="assets/img-19-urban-flooded-street-aerial.jpg"
            alt="Toàn cảnh đường phố TP.HCM ngập sâu"
          />
        </div>
        <div class="vignette-overlay" data-layout-ignore></div>
      </section>

      <!-- Overlay 1: THỰC TRẠNG ĐÔ THỊ (at 2.3s, hold 2.2s -> ends at 4.5s) -->
      <section id="clip-status" class="clip" data-start="2.3" data-duration="2.2">
        <div id="status-card">
          <h2 id="status-title">THỰC TRẠNG ĐÔ THỊ</h2>
        </div>
      </section>

      <!-- Overlay 2 & 3: KHÔNG CHỈ DO MƯA (at 4.9s) & BAN ICON (at 6.6s) -->
      <section id="clip-debunk" class="clip" data-start="4.9" data-duration="2.94">
        <div id="debunk-card">
          <div id="debunk-icon-wrap">
            <svg id="ban-icon" viewBox="0 0 100 100" width="110" height="110">
              <circle
                id="ban-circle"
                cx="50"
                cy="50"
                r="40"
                fill="none"
                stroke="#FF6A1A"
                stroke-width="8"
                stroke-linecap="round"
              />
              <line
                id="ban-line"
                x1="22"
                y1="22"
                x2="78"
                y2="78"
                stroke="#FF6A1A"
                stroke-width="8"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <h1 id="debunk-title">KHÔNG CHỈ DO MƯA</h1>
        </div>
      </section>

      <!-- Thanh cam đáy khung hình nhận diện thương hiệu -->
      <div id="brand-bottom-bar" data-layout-ignore></div>
    </div>

    <script>
      // Single paused timeline registered on window.__timelines["scene-s04"]
      const tl = gsap.timeline({ paused: true });

      // 1. Setup SVG stroke path lengths for ban icon
      const circleEl = document.getElementById("ban-circle");
      const lineEl = document.getElementById("ban-line");
      const circleLen = circleEl ? circleEl.getTotalLength() : 251.3;
      const lineLen = lineEl ? lineEl.getTotalLength() : 79.2;

      if (circleEl && lineEl) {
        circleEl.style.strokeDasharray = circleLen;
        circleEl.style.strokeDashoffset = circleLen;
        lineEl.style.strokeDasharray = lineLen;
        lineEl.style.strokeDashoffset = lineLen;
      }

      // 2. Camera motion: Transition punch entrance then slow continuous zoom-out 1.12x -> 1.0x
      tl.fromTo(
        "#camera-frame",
        { scale: 1.18 },
        { scale: 1.12, duration: 0.45, ease: "power3.out" },
        0
      );
      tl.to(
        "#camera-frame",
        { scale: 1.0, duration: 7.39, ease: "sine.out" },
        0.45
      );

      // 3. Overlay 1: THỰC TRẠNG ĐÔ THỊ entrance at 2.3s and exit before 4.5s
      tl.fromTo(
        "#status-card",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        2.3
      );
      tl.to(
        "#status-card",
        { x: -30, opacity: 0, duration: 0.3, ease: "power2.in" },
        4.15
      );

      // 4. Overlay 2: Card "KHÔNG CHỈ DO MƯA" pop entrance at 4.9s
      tl.fromTo(
        "#debunk-card",
        { scale: 0.88, opacity: 0, y: 24 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        4.9
      );

      // 5. Overlay 3: Ban icon pop entrance & progressive path draw at 6.6s
      tl.fromTo(
        "#debunk-icon-wrap",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        6.6
      );

      if (circleEl && lineEl) {
        tl.fromTo(
          circleEl,
          { strokeDashoffset: circleLen },
          { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
          6.65
        );
        tl.fromTo(
          lineEl,
          { strokeDashoffset: lineLen },
          { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
          7.0
        );
      }

      // Register master timeline
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s04"] = tl;
    </script>
  
    </template>
  </body>
</html>
