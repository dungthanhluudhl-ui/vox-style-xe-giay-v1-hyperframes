<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }
      /* Quy ước clip chuẩn của HyperFrames: absolute inset: 0 */
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Lớp lưới giấy nền mặc định Vox */
      .bg-grid-pattern {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        opacity: 0.18;
        pointer-events: none;
        z-index: 1;
      }

      /* Khung chứa ảnh tư liệu */
      .photo-frame {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 2;
        background-color: #141414;
      }

      .hero-image {
        position: absolute;
        inset: -6%;
        width: 112%;
        height: 112%;
        object-fit: cover;
        object-position: center 65%;
        will-change: transform, opacity;
      }

      /* Biến thể nền Spotlight u ám theo Scene Plan */
      .spotlight-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 48%,
          rgba(20, 20, 20, 0.15) 25%,
          rgba(20, 20, 20, 0.68) 85%,
          rgba(20, 20, 20, 0.88) 100%
        );
        pointer-events: none;
        z-index: 3;
      }

      /* Cụm overlay hiển thị nhãn và icon trong Safe Zone (trên Y: 1390px, dưới Y: 160px) */
      .overlay-center-layer {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 410px;
        pointer-events: none;
        z-index: 10;
      }

      /* Khối Icon Warning tự vẽ dần (Self-drawing SVG) */
      .warning-icon-wrapper {
        width: 110px;
        height: 110px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        will-change: transform, opacity;
      }

      .warning-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.65));
      }

      /* Tấm thẻ nhãn "NGHỊCH LÝ ĐÔ THỊ" - nền mực đặc #141414 đạt chuẩn tương phản */
      .paradox-card {
        position: relative;
        background-color: #141414;
        border-top: 5px solid #ff6a1a;
        border-radius: 8px;
        padding: 24px 44px;
        box-shadow: 0 20px 42px rgba(0, 0, 0, 0.6);
        opacity: 0;
        will-change: transform, opacity;
        max-width: 920px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .paradox-title {
        margin: 0;
        font-size: 60px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #f7f4ec; /* onDarkText đạt tương phản 16.8:1 trên #141414 */
        white-space: nowrap;
      }

      /* Thanh cam nhận diện thương hiệu cố định mép đáy */
      .bottom-brand-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 50;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s01"
      data-width="1080"
      data-height="1920"
      data-duration="5.92"
    >
      <!-- Lưới toạ độ đặc trưng Vox -->
      <div class="bg-grid-pattern"></div>

      <!-- Scene S01 (0s - 5.92s) -->
      <section id="scene-s01" class="clip" data-start="0" data-duration="5.92">
        <!-- Khung ảnh tư liệu -->
        <div class="photo-frame">
          <img
            id="hero-img"
            class="hero-image"
            src="assets/img-13-saigon-storm-flood-papercut.jpg"
            alt="Đường phố Sài Gòn ngập trong mưa giông"
          />
          <!-- Spotlight tối tạo không khí ngột ngạt giông bão -->
          <div id="spotlight-overlay" class="spotlight-vignette"></div>
        </div>

        <!-- Cụm Overlays căn giữa trong Safe Zone -->
        <div class="overlay-center-layer">
          <!-- Icon Cảnh báo (warning) theo từ vựng Vox -->
          <div id="warning-icon-wrapper" class="warning-icon-wrapper">
            <svg class="warning-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <!-- Tam giác cảnh báo -->
              <path
                id="warn-tri"
                d="M 50 14 L 88 80 C 90 84 88 88 83 88 L 17 88 C 12 88 10 84 12 80 Z"
                fill="none"
                stroke="#FF6A1A"
                stroke-width="8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <!-- Vạch đứng chấm than -->
              <line
                id="warn-bar"
                x1="50"
                y1="38"
                x2="50"
                y2="60"
                stroke="#FF6A1A"
                stroke-width="8"
                stroke-linecap="round"
              />
              <!-- Dấu chấm than -->
              <circle id="warn-dot" cx="50" cy="74" r="4.5" fill="#FF6A1A" />
            </svg>
          </div>

          <!-- Thẻ Label Punch-phrase: NGHỊCH LÝ ĐÔ THỊ -->
          <div id="paradox-card" class="paradox-card">
            <h1 class="paradox-title">NGHỊCH LÝ ĐÔ THỊ</h1>
          </div>
        </div>
      </section>

      <!-- Dải cam đáy thương hiệu xuyên suốt -->
      <div class="bottom-brand-bar"></div>
    </div>

    <script>
      // Khởi tạo Timeline paused duy nhất cho composition
      const tl = gsap.timeline({ paused: true });

      // Thiết lập trạng thái ban đầu của SVG Path (cho hiệu ứng tự vẽ stroke)
      const warnTri = document.getElementById("warn-tri");
      const warnBar = document.getElementById("warn-bar");
      const triLength = warnTri.getTotalLength();
      const barLength = warnBar.getTotalLength();

      warnTri.style.strokeDasharray = triLength;
      warnTri.style.strokeDashoffset = triLength;
      warnBar.style.strokeDasharray = barLength;
      warnBar.style.strokeDashoffset = barLength;

      // 1. Vào cảnh: Zoom-through chuyển tiếp camera (t=0 -> 0.75s)
      tl.fromTo(
        "#hero-img",
        { scale: 1.18, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.75, ease: "power2.out" },
        0
      );

      // Hiệu ứng ánh sáng spotlight dồn u ám từ từ
      tl.fromTo(
        "#spotlight-overlay",
        { opacity: 0.4 },
        { opacity: 0.85, duration: 1.4, ease: "power2.out" },
        0.2
      );

      // 2. Chuyển động Ken Burns zoom-in chậm dần vào dòng người lội nước (t=0.75s -> 5.92s)
      tl.to(
        "#hero-img",
        { scale: 1.08, y: -26, duration: 5.17, ease: "none" },
        0.75
      );

      // 3. Label "NGHỊCH LÝ ĐÔ THỊ" xuất hiện tại t=3.4s (3400ms)
      tl.fromTo(
        "#paradox-card",
        { scale: 0.9, opacity: 0, y: 24 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        3.4
      );

      // 4. Icon "warning" xuất hiện và vẽ nét tại t=4.4s (4400ms)
      tl.fromTo(
        "#warning-icon-wrapper",
        { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1.0, duration: 0.3, ease: "power3.out" },
        4.4
      );

      // Vẽ tam giác cảnh báo
      tl.to(
        "#warn-tri",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        4.45
      );

      // Vẽ thanh đứng chấm than
      tl.to(
        "#warn-bar",
        { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
        4.7
      );

      // Nảy nhẹ dấu chấm tròn
      tl.fromTo(
        "#warn-dot",
        { scale: 0, transformOrigin: "50% 50%" },
        { scale: 1.0, duration: 0.2, ease: "back.out(1.7)" },
        4.85
      );

      // Đăng ký timeline vào hệ thống HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s01"] = tl;
    </script>
  
    </template>
  </body>
</html>
