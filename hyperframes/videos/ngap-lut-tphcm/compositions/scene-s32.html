<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      background-color: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", -apple-system, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    /* Lưới ô vuông 84px đặc trưng Vox Style */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      pointer-events: none;
      z-index: 1;
    }

    /* Biến thể nền spotlight: radial vignette tối cảnh báo rủi ro */
    .bg-spotlight {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, rgba(20, 20, 20, 0) 30%, rgba(20, 20, 20, 0.32) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Thanh cam đáy khung hình - visual signature cố định */
    .bottom-orange-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 999;
    }

    /* Lớp clip cơ bản của HyperFrames */
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Class màu an toàn đạt chuẩn WCAG AAA/AA */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
    .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
    .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
    .hf-plate-paper { background-color: #E7E3D9; color: #141414; }

    /* Khung tranh Hero Card (Paper collage) */
    .hero-card {
      position: absolute;
      top: 180px;
      left: 60px;
      width: 960px;
      height: 1040px;
      background-color: #F5F0E4;
      border: 4px solid #141414;
      box-shadow: 10px 14px 0px rgba(20, 20, 20, 0.9);
      padding: 16px 16px 20px 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .card-badge {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.5px;
      padding: 6px 16px;
      border-radius: 2px;
      text-transform: uppercase;
    }

    .card-meta {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    /* Khung chứa ảnh để thực hiện camera zoom độc lập */
    .img-viewport {
      position: relative;
      width: 100%;
      height: 940px;
      overflow: hidden;
      border: 3px solid #141414;
      background-color: #141414;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 68%;
      display: block;
      transform-origin: 50% 68%;
    }

    /* Diagram lines đo cao độ & hố trũng */
    .diagram-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 15;
    }

    .diag-badge {
      position: absolute;
      font-size: 20px;
      font-weight: 900;
      padding: 4px 12px;
      border: 2px solid #141414;
      box-shadow: 3px 3px 0px #141414;
      pointer-events: none;
      z-index: 16;
      white-space: nowrap;
    }

    .diag-badge-road {
      top: 295px;
      left: 50px;
    }

    .diag-badge-floor {
      top: 610px;
      left: 500px;
    }

    .diag-badge-delta {
      top: 450px;
      left: 540px;
    }

    /* Overlay 1: Punch Phrase "BIẾN THÀNH TẦNG HẦM" */
    .punch-wrapper {
      position: absolute;
      top: 910px;
      left: 70px;
      width: 940px;
      z-index: 30;
      pointer-events: none;
    }

    .punch-card {
      border: 4px solid #FF6A1A;
      box-shadow: 10px 10px 0px #FF6A1A;
      padding: 24px 32px;
      border-radius: 4px;
    }

    .punch-tag {
      font-size: 22px;
      font-weight: 900;
      padding: 4px 14px;
      display: inline-block;
      margin-bottom: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .punch-heading {
      font-size: 66px;
      line-height: 1.25;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .punch-highlight {
      background-color: #FF6A1A;
      color: #141414;
      padding: 2px 14px;
      display: inline-block;
      margin-left: 6px;
    }

    /* Overlay 2 & 3: Risk Label & Warning Icon */
    .risk-wrapper {
      position: absolute;
      top: 925px;
      left: 70px;
      width: 940px;
      z-index: 35;
      pointer-events: none;
    }

    .risk-card {
      border: 4px solid #141414;
      box-shadow: 10px 10px 0px #FF6A1A;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      gap: 28px;
      border-radius: 4px;
    }

    .risk-icon-box {
      width: 88px;
      height: 88px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .risk-text-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .risk-tag {
      font-size: 20px;
      font-weight: 900;
      padding: 3px 12px;
      display: inline-block;
      letter-spacing: 1px;
      text-transform: uppercase;
      align-self: flex-start;
    }

    .risk-title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.5px;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s32"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="7.84"
  >
    <!-- Các lớp background phong cách Vox -->
    <div class="bg-grid"></div>
    <div class="bg-spotlight"></div>

    <!-- Thanh cam cố định chân khung hình -->
    <div class="bottom-orange-bar"></div>

    <!-- Clip 1: Shot chính hiển thị hiện trường img-14 và diagram kỹ thuật -->
    <div id="shot-main" class="clip" data-start="0" data-duration="7.84">
      <div id="hero-card" class="hero-card">
        <div class="card-header">
          <div class="card-badge hf-plate-ink">HẬU QUẢ NGOẠI BIÊN</div>
          <div class="card-meta hf-text-ink">VÙNG NGẬP // S32</div>
        </div>

        <div class="img-viewport">
          <!-- Ảnh minh họa paper-cut đầy đủ màu nguyên bản -->
          <img
            id="hero-img"
            class="hero-img"
            src="assets/img-14-urban-runoff-flood-infrastructure.jpg"
            alt="Cảnh ngập lụt tràn vào tầng trệt nhà dân"
          />

          <!-- Diagram layer: đo đạc mức chênh cốt đường và nền nhà -->
          <svg class="diagram-svg" viewBox="0 0 928 940" fill="none">
            <!-- Mặt đường mới nâng cao -->
            <line
              id="diag-line-road"
              x1="40"
              y1="320"
              x2="720"
              y2="320"
              stroke="#FF6A1A"
              stroke-width="5"
              stroke-dasharray="14 8"
              pathLength="100"
              style="stroke-dasharray: 100; stroke-dashoffset: 100;"
            />
            <!-- Mặt nền nhà tụt sâu phía dưới -->
            <line
              id="diag-line-floor"
              x1="260"
              y1="635"
              x2="880"
              y2="635"
              stroke="#F7F4EC"
              stroke-width="5"
              stroke-dasharray="14 8"
              pathLength="100"
              style="stroke-dasharray: 100; stroke-dashoffset: 100;"
            />
            <!-- Đường gióng chênh lệch cao độ -->
            <line
              id="diag-line-arrow"
              x1="520"
              y1="320"
              x2="520"
              y2="635"
              stroke="#FF6A1A"
              stroke-width="6"
              pathLength="100"
              style="stroke-dasharray: 100; stroke-dashoffset: 100;"
            />
            <!-- Mũi tên chỉ hướng tụt sâu -->
            <polygon
              id="diag-arrow-tip"
              points="510,618 530,618 520,637"
              fill="#FF6A1A"
              style="opacity: 0;"
            />
          </svg>

          <!-- Nhãn chú thích kỹ thuật trên nền đặc WCAG compliant -->
          <div id="badge-road" class="diag-badge diag-badge-road hf-hl-orange" style="opacity: 0;">
            MẶT ĐƯỜNG NÂNG
          </div>
          <div id="badge-floor" class="diag-badge diag-badge-floor hf-plate-ink" style="opacity: 0;">
            MẶT NỀN NHÀ DÂN
          </div>
          <div id="badge-delta" class="diag-badge diag-badge-delta hf-plate-ink-orange" style="opacity: 0;">
            HỐ TRŨNG HỨNG NƯỚC
          </div>
        </div>
      </div>
    </div>

    <!-- Clip 2: Overlay Punch Phrase "BIẾN THÀNH TẦNG HẦM" (246.800s - 249.300s+) -->
    <div id="clip-punch" class="clip" data-start="1.44" data-duration="4.20">
      <div class="punch-wrapper">
        <div id="punch-card" class="punch-card hf-plate-ink" style="opacity: 0;">
          <div class="punch-tag hf-hl-orange">NGUY CƠ HIỆN HỮU</div>
          <div class="punch-heading">
            <span class="hf-text-light">BIẾN THÀNH</span>
            <span class="punch-highlight">TẦNG HẦM</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Clip 3: Overlay "CHUYỂN GIAO RỦI RO" + Warning Icon (251.500s - 253.200s) -->
    <div id="clip-risk" class="clip" data-start="6.14" data-duration="1.70">
      <div class="risk-wrapper">
        <div id="risk-card" class="risk-card hf-plate-ink" style="opacity: 0;">
          <div class="risk-icon-box">
            <!-- Icon cảnh báo vẽ tay tự vẽ dần bằng SVG stroke -->
            <svg width="84" height="84" viewBox="0 0 84 84" fill="none">
              <path
                id="warn-triangle"
                d="M42 10 L76 72 H8 Z"
                stroke="#FF6A1A"
                stroke-width="7"
                stroke-linecap="round"
                stroke-linejoin="round"
                pathLength="100"
                style="stroke-dasharray: 100; stroke-dashoffset: 100;"
              />
              <line
                id="warn-excl-line"
                x1="42"
                y1="30"
                x2="42"
                y2="50"
                stroke="#FF6A1A"
                stroke-width="7"
                stroke-linecap="round"
                style="opacity: 0;"
              />
              <circle
                id="warn-excl-dot"
                cx="42"
                cy="62"
                r="4.5"
                fill="#FF6A1A"
                style="opacity: 0;"
              />
            </svg>
          </div>
          <div class="risk-text-group">
            <div class="risk-tag hf-hl-orange">BẢN CHẤT VẤN ĐỀ</div>
            <div class="risk-title hf-text-light">CHUYỂN GIAO RỦI RO</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Đăng ký timeline gốc paused cho HyperFrames seek runtime
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["scene-s32"] = tl;

    // --- 1. ENTRANCE: Strike transition & Camera Zoom (0.0s -> 7.84s) ---
    // Cú rơi dằn dơ "strike" đưa khung cảnh hiện trường vào vị trí
    tl.fromTo(
      "#hero-card",
      { y: -140, scale: 1.05, opacity: 0 },
      { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power4.out" },
      0.05
    );

    // Camera zoom từ từ 1.0x lên 1.08x tập trung vào tầng trệt nhà dân bị ngập
    tl.fromTo(
      "#hero-img",
      { scale: 1.0 },
      { scale: 1.08, duration: 7.84, ease: "none" },
      0
    );

    // --- 2. DIAGRAM ANNOTATIONS (0.55s -> 1.35s) ---
    // Vẽ đường đo cao độ mặt đường mới nâng
    tl.fromTo(
      "#diag-line-road",
      { strokeDashoffset: 100 },
      { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
      0.55
    );
    tl.fromTo(
      "#badge-road",
      { opacity: 0, scale: 0.8 },
      { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" },
      0.75
    );

    // Vẽ đường đo cốt sàn nhà dân bị tụt sâu
    tl.fromTo(
      "#diag-line-floor",
      { strokeDashoffset: 100 },
      { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
      0.80
    );
    tl.fromTo(
      "#badge-floor",
      { opacity: 0, scale: 0.8 },
      { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" },
      1.00
    );

    // Vẽ đường gióng chênh lệch và mũi tên hố trũng
    tl.fromTo(
      "#diag-line-arrow",
      { strokeDashoffset: 100 },
      { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
      1.05
    );
    tl.fromTo(
      "#diag-arrow-tip",
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" },
      1.30
    );
    tl.fromTo(
      "#badge-delta",
      { opacity: 0, scale: 0.8 },
      { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" },
      1.25
    );

    // --- 3. OVERLAY PUNCH-PHRASE: "BIẾN THÀNH TẦNG HẦM" (1.44s -> 5.3s) ---
    // Xuất hiện dứt khoát tại 1.44s (246800ms)
    tl.fromTo(
      "#punch-card",
      { opacity: 0, scale: 0.88, y: 35 },
      { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" },
      1.44
    );

    // Giữ ổn định trong hơn 2.5s rồi fade-out trước khi overlay tiếp theo xuất hiện
    tl.to(
      "#punch-card",
      { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
      4.90
    );

    // --- 4. OVERLAY LABEL & WARNING ICON: "CHUYỂN GIAO RỦI RO" (6.14s -> 7.84s) ---
    // Nhãn đúc kết xuất hiện tại 6.14s (251500ms)
    tl.fromTo(
      "#risk-card",
      { opacity: 0, scale: 0.94, y: 40 },
      { opacity: 1, scale: 1, y: 0, duration: 0.40, ease: "power3.out" },
      6.14
    );

    // Icon warning tự vẽ khung tam giác tại 6.64s (252000ms)
    tl.fromTo(
      "#warn-triangle",
      { strokeDashoffset: 100 },
      { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
      6.64
    );

    // Dấu chấm than pop nảy nhẹ bên trong tam giác
    tl.fromTo(
      "#warn-excl-line",
      { opacity: 0, scaleY: 0 },
      { opacity: 1, scaleY: 1, duration: 0.22, ease: "back.out(1.6)", transformOrigin: "center top" },
      6.85
    );
    tl.fromTo(
      "#warn-excl-dot",
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: 0.20, ease: "back.out(1.8)", transformOrigin: "center center" },
      6.95
    );
  </script>

    </template>
  </body>
