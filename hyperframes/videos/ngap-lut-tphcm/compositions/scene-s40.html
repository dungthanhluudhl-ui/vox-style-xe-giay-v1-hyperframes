    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance: Header punch card xuất hiện từ t = 0.2s
      tl.fromTo(
        "#header-box",
        { y: -40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.2
      );

      // 2. Entrance: Hero stage xuất hiện kiểu 'grow' từ t = 0.25s

        "#hero-stage",
        { scale: 0.88, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.25
      );

      // Camera motion: pan chậm dọc theo thân chiếc ly nứt (pan-left và zoom nhẹ)

        "#hero-img",
        { x: 25, scale: 1.05 },
        { x: -35, scale: 1.15, duration: 7.6, ease: "none" },
        0.3
      );

      // 3. Overlay 1: ĐÁY LY SỤT LÚN (atMs: 312200 -> t = 1.19s, holdMs: 2000)
      tl.fromTo(
        "#callout-lun",
        { scale: 0, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.19
      );
      tl.fromTo(
        "#vector-lun",
        { opacity: 0, scaleY: 0 },
        { opacity: 1, scaleY: 1, duration: 0.4, ease: "power2.out" },
        1.3
      );

      // 4. Overlay 2: MIỆNG THOÁT BỊ KHÓA (atMs: 314500 -> t = 3.49s, holdMs: 1800)

        "#callout-khoa",
        { scale: 0, opacity: 0, x: 30 },
        { scale: 1, opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
        3.49

        "#vector-khoa",
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out" },
        3.6
      );

      // 5. Overlay 3: BÊ TÔNG LẤP ĐẦY (atMs: 317000 -> t = 5.99s, holdMs: 1700)
      tl.fromTo(
        "#callout-betong",
        { scale: 0, opacity: 0, x: -30 },
        { scale: 1, opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
        5.99

      tl.fromTo(
        "#vector-betong",
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out" },
        6.1
      );

      // Đăng ký timeline duy nhất cho HyperFrames renderer
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s40"] = tl;
