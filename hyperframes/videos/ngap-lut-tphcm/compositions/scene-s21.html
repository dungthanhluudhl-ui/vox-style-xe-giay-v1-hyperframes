      /* Hero Card Footer Bar */

      .footer-stamp {

        border-radius: 6px;

      }

      /* Sinking / Fall Callout Badge (Positioned safely above y = 1390px) */
      .fall-badge {
        position: absolute;
        left: 90px;
        top: 1195px;
        width: 900px;
        height: 135px;
        background: #f5f0e4;
        border: 5px solid #141414;
        box-shadow: 12px 12px 0px #141414;
        border-radius: 16px;
        padding: 16px 24px;
        display: flex;
        align-items: center;

        z-index: 35;

      .fall-icon-box {
        width: 82px;
        height: 82px;
        background: #141414;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .fall-info {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
      .fall-tag {
        background: #ff6a1a;
        color: #141414;
        font-size: 16px;
        font-weight: 900;
        padding: 4px 10px;
        border-radius: 4px;
        letter-spacing: 1px;
      }
      .fall-title {
        font-size: 40px;
        font-weight: 900;
        color: #141414;
        line-height: 1.1;
        letter-spacing: -0.5px;
      }

      /* Vox Signature Bottom Brand Bar */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;

        background: #ff6a1a;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s21"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6.38"
    >
      <section id="shot-s21-1" class="clip" data-start="0" data-duration="6.38">
        <!-- Top Editorial Header -->
        <div class="top-meta">
          <span class="top-meta-tag">Mô hình phân tích // Cơ học đất</span>
          <span class="top-meta-code">S21 // SHOT 1</span>
        </div>

        <!-- Punch Phrase Overlay -->
        <div id="punch-card" class="punch-card">
          <div class="punch-badge">Phép so sánh</div>
          <h1 class="punch-title">ẨN DỤ NỆM MÚT</h1>
        </div>

        <!-- Main Hero Card (Left half of img-01: Books on mattress) -->
        <div id="hero-card" class="hero-card">
          <div class="img-crop-viewport">
            <img
              id="hero-img"
              class="hero-image"
              src="assets/img-01-intellectual-weight-urban-footprint-spli.jpg"
              alt="Chồng sách dày đè lún nệm mút"
            />

            <!-- Embedded Diagram Bracket on Mattress Deformation Zone -->
            <div id="diagram-bracket" class="diagram-bracket">
              <svg
                class="bracket-svg"
                viewBox="0 0 32 70"
                width="32"
                height="70"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <!-- Reference bracket stem and tick -->
                <line x1="8" y1="6" x2="24" y2="6" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
                <line x1="24" y1="6" x2="24" y2="64" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
                <line x1="8" y1="64" x2="24" y2="64" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
                <!-- Downward compression arrow -->
                <path d="M 14 38 L 14 56 M 8 48 L 14 56 L 20 48" stroke="#FF6A1A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <div class="bracket-label-col">
                <span class="bracket-sub">VẬT LÝ</span>
                <span class="bracket-main">ĐỘ BIẾN DẠNG</span>
              </div>
            </div>
          </div>

          <div class="card-footer">
            <div class="card-footer-left">
              <span class="footer-indicator"></span>
              <span class="footer-label">TẢI TRỌNG CHẤT CHỒNG</span>
            </div>
            <span class="footer-stamp">HỆ QUẢ</span>
          </div>
        </div>

        <!-- Fall Icon / Deformation Badge (Clear of caption safe zone) -->
        <div id="fall-icon-badge" class="fall-badge" data-layout-allow-caption-zone="true">
          <div class="fall-icon-box">
            <svg
              id="fall-svg"
              viewBox="0 0 80 80"
              width="64"
              height="64"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <!-- Horizontal surface reference line -->
              <line x1="12" y1="62" x2="68" y2="62" stroke="#F7F4EC" stroke-width="4" stroke-dasharray="5,4" stroke-linecap="round" />
              <!-- Sinking arrow path (progressively self-drawing) -->
              <path
                id="fall-path"
                d="M 40 14 L 40 58 M 26 44 L 40 60 L 54 44"
                stroke="#FF6A1A"
                stroke-width="6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="fall-info">
            <span class="fall-tag">HỆ QUẢ</span>

        <!-- Vox Signature Bottom Brand Bar -->
        <div class="bottom-brand-bar"></div>

    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Measure SVG path for deterministic self-drawing
      const fallPath = document.getElementById("fall-path");
      if (fallPath) {
        const fallLen = fallPath.getTotalLength();
        fallPath.style.strokeDasharray = `${fallLen}`;
        fallPath.style.strokeDashoffset = `${fallLen}`;
      }

      // Initial visual states
      tl.set("#punch-card", { opacity: 0, y: -25, scale: 0.96 });
      tl.set("#diagram-bracket", { opacity: 0, x: 20 });
      tl.set("#fall-icon-badge", { opacity: 0, scale: 0.85, y: 15 });

      // PHASE 1 (0.05s - 0.75s): Strike Entrance of the Hero Card
      // Controlled downward slam within canvas boundaries
      tl.fromTo(
        "#hero-card",
        { y: -150, opacity: 0, scaleY: 1.05, scaleX: 0.96 },
        { y: 0, opacity: 1, scaleY: 1, scaleX: 1, duration: 0.35, ease: "power4.in" },
        0.05
      );
      // Impact squash on the mattress (strike deformation)
      tl.to(
        "#hero-card",
        { y: 16, scaleY: 0.96, scaleX: 1.025, duration: 0.1, ease: "power1.out" },
        0.40
      );
      // Settle
      tl.to(
        "#hero-card",
        { y: 0, scaleY: 1, scaleX: 1, duration: 0.22, ease: "power3.out" },
        0.50
      );

      // Subtle ambient drift to keep the hero card visually alive
      tl.to(
        "#hero-card",
        { y: -4, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1 },
        0.75
      );

      // PHASE 2 (1.17s - 3.67s): Punch-Phrase Arrival ("ẨN DỤ NỆM MÚT")
      // atMs = 157200 -> 1.17s relative; holdMs = 2500 -> holds until 3.67s
      tl.to(
        "#punch-card",
        { opacity: 1, y: 0, scale: 1, duration: 0.38, ease: "power3.out" },
        1.17
      );
      tl.to(
        "#punch-card",
        { opacity: 0, y: -15, duration: 0.25, ease: "power2.in" },
        3.67
      );

      // PHASE 3 (3.8s - 5.0s): Cumulative Weight Sinking
      // VO: "Nhưng cứ chồng dần lên thì cái nệm sẽ lún xuống."
      // Diagram bracket reveals as compression is identified
      tl.to(
        "#diagram-bracket",
        { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" },
        3.8
      );

      // Physical downward compression step as cumulative load indents the mattress
      tl.to(
        "#hero-card",
        { y: 24, scaleY: 0.97, scaleX: 1.015, duration: 0.38, ease: "power2.in" },
        4.2
      );
      tl.to(
        "#hero-card",
        { y: 20, scaleY: 1, scaleX: 1, duration: 0.22, ease: "power1.out" },
        4.58
      );
      tl.to(
        "#hero-img",
        { scale: 1.05, duration: 0.6, ease: "power2.out" },
        4.2
      );

      // PHASE 4 (5.17s - 6.38s): Icon "fall" & "LÚN XUỐNG"
      // atMs = 161200 -> 5.17s relative; holdMs = 1200 -> holds until 6.37s
      tl.to(
        "#fall-icon-badge",
        { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "power3.out" },
        5.17
      );

      // Self-drawing downward path matching the spoken cue "lún xuống"
      if (fallPath) {
        tl.to(
          fallPath,
          { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
          5.25
        );
      }

      // Small secondary settle pulse on the fall badge
      tl.to(
        "#fall-icon-badge",
        { scale: 1.03, duration: 0.12, yoyo: true, repeat: 1, ease: "power1.inOut" },
        5.65
      );

      // Register the master timeline on the global registry
      window.__timelines["scene-s21"] = tl;
    </script>
