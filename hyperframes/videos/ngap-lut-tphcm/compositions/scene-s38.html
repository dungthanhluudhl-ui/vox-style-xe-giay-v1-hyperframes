    <!-- Script Animation GSAP Timeline (Seek-safe, Deterministic) -->
    <script>
      // Đăng ký đúng 1 timeline gốc paused theo HyperFrames Core Contract
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Thiết lập đo độ dài thực tế cho các SVG stroke (stroke-dasharray / stroke-dashoffset)
      const flowDongNai = document.getElementById("flow-dongnai");
      const flowSaiGon = document.getElementById("flow-saigon");
      const flowBranch1 = document.getElementById("flow-branch-1");
      const flowBranch2 = document.getElementById("flow-branch-2");
      const pinBody = document.getElementById("pin-body");

      const lenDongNai = flowDongNai ? flowDongNai.getTotalLength() : 1000;
      const lenSaiGon = flowSaiGon ? flowSaiGon.getTotalLength() : 800;
      const lenBranch1 = flowBranch1 ? flowBranch1.getTotalLength() : 500;
      const lenBranch2 = flowBranch2 ? flowBranch2.getTotalLength() : 500;
      const lenPin = pinBody ? pinBody.getTotalLength() : 300;

      // Khởi tạo trạng thái ban đầu cho các nét vẽ SVG
      if (flowDongNai) {
        flowDongNai.style.strokeDasharray = lenDongNai + " " + lenDongNai;
        flowDongNai.style.strokeDashoffset = lenDongNai;
      }
      if (flowSaiGon) {
        flowSaiGon.style.strokeDasharray = lenSaiGon + " " + lenSaiGon;
        flowSaiGon.style.strokeDashoffset = lenSaiGon;
      }
      if (flowBranch1) {
        flowBranch1.style.strokeDasharray = lenBranch1 + " " + lenBranch1;
        flowBranch1.style.strokeDashoffset = lenBranch1;
      }
      if (flowBranch2) {
        flowBranch2.style.strokeDasharray = lenBranch2 + " " + lenBranch2;
        flowBranch2.style.strokeDashoffset = lenBranch2;
      }
      if (pinBody) {
        pinBody.style.strokeDasharray = lenPin + " " + lenPin;
        pinBody.style.strokeDashoffset = lenPin;
      }

      // 1. Scene Entrance: rise nhẹ từ Y=30 lên Y=0 (0.0s - 0.5s)
      tl.fromTo(
        "#scene-container",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0
      );

      // 2. Camera Motion: Zoom-out chậm toàn cảnh lưu vực từ 1.08x về 1.0x (0.0s - 8.53s)
      tl.fromTo(
        "#map-img",
        { scale: 1.08 },
        { scale: 1.0, duration: 8.53, ease: "none" },
        0
      );

      // 3. Header Label "QUY HOẠCH LƯU VỰC": xuất hiện lúc 0.55s (294500ms)
      tl.fromTo(
        "#header-plate",
        { y: -20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.55
      );

      // Thước đo cao độ vùng cao thượng lưu xuất hiện lúc 0.8s
      tl.fromTo(
        "#badge-upstream",
        { x: 30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.8
      );

      // 4. Các đường ranh giới hành chính rung nhẹ hiển thị lúc 1.0s
      tl.fromTo(
        "#admin-boundaries",
        { opacity: 0 },
        { opacity: 1, duration: 0.6, ease: "power2.out" },
        1.0
      );

      // 5. Dòng chảy tự nhiên bắt đầu vẽ uốn lượn xuyên qua các khu vực (1.5s - 3.8s)
      tl.to(
        "#flow-dongnai",
        { strokeDashoffset: 0, duration: 2.2, ease: "power2.out" },
        1.5
      );
      tl.to(
        "#flow-saigon",
        { strokeDashoffset: 0, duration: 1.8, ease: "power2.out" },
        1.8
      );
      tl.to(
        "#flow-branch-1",
        { strokeDashoffset: 0, duration: 1.4, ease: "power2.out" },
        2.2
      );
      tl.to(
        "#flow-branch-2",
        { strokeDashoffset: 0, duration: 1.4, ease: "power2.out" },
        2.5
      );
      tl.to(
        "#flow-arrows",
        { opacity: 1, duration: 0.4, ease: "power1.out" },
        3.0
      );

      // 6. Header Label giữ 2.4s (đến 2.95s), sau đó mờ dần ở 3.2s
      tl.to(
        "#header-plate",
        { y: -15, opacity: 0, duration: 0.4, ease: "power2.in" },
        3.2
      );

      // 7. Visual Relationship: "Các đường ranh giới hành chính nét đứt bị xóa tan" (3.4s - 4.6s)
      tl.to(
        "#admin-boundaries",
        { opacity: 0, duration: 0.8, ease: "power2.inOut" },
        3.5
      );

      // Dòng nước phát sáng và tỏa rộng khi ranh giới biến mất
      tl.to(
        "#flow-dongnai",
        { strokeWidth: 14, duration: 0.6, ease: "power2.out" },
        4.0
      );
      tl.to(
        "#flow-saigon",
        { strokeWidth: 11, duration: 0.6, ease: "power2.out" },
        4.1
      );

      // 8. Xuất hiện huy hiệu điểm tụ nước vùng trũng (hạ lưu) lúc 4.8s
      tl.fromTo(
        "#badge-downstream",
        { x: -30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        4.8
      );

      // 9. Punch-phrase: "NƯỚC THEO ĐỘ CAO" xuất hiện tại 5.55s (299500ms)
      tl.fromTo(
        "#punch-phrase",
        { y: 35, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1.0, duration: 0.55, ease: "power3.out" },
        5.55
      );

      // 10. Icon "pin" định vị độ dốc/điểm trũng xuất hiện tại 6.05s (300000ms, holdMs: 1500)
      tl.fromTo(
        "#elevation-pin",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        6.05
      );
      tl.to(
        "#pin-body",
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        6.05
      );
      tl.fromTo(
        "#pin-center",
        { scale: 0 },
        { scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "power3.out" },
        6.35
      );

      // Gắn timeline vào window.__timelines["scene-s38"] để HyperFrames seek từng frame
      window.__timelines["scene-s38"] = tl;
    </script>
