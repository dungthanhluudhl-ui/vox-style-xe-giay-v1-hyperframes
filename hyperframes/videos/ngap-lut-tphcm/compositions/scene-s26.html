    <script>
      // Setup self-drawing SVG path dasharrays
      const crowdElements = document.querySelectorAll(".crowd-path");

        const len = typeof path.getTotalLength === "function" ? path.getTotalLength() : 180;
        path.style.strokeDasharray = `${len}`;
        path.style.strokeDashoffset = `${len}`;
      });

      // Master seekable GSAP timeline
      const tl = gsap.timeline({ paused: true });

      // 1. Ken Burns slow zoom-in (1.0x to 1.09x) over entire shot

        "#hero-img",
        { scale: 1.0 },
        { scale: 1.09, duration: 10.75, ease: "none" },
        0
      );

      // 2. Wobble-drop entrance for hero card
      tl.fromTo(
        "#hero-card",
        { y: -150, rotation: -2.5, opacity: 0, scale: 0.94 },
        { y: 0, rotation: 0, opacity: 1, scale: 1, duration: 0.75, ease: "power3.out" },
        0.1

        "#label-buffer",
        { y: -30, opacity: 0, scale: 0.9 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        2.08

        "#crowd-card",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        8.58

        8.72
