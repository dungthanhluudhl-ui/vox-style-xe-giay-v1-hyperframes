<!doctype html>
<html>
  <head>

  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
      background-image: 
        linear-gradient(rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Vox style color utility classes */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
    .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
    .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
    .hf-plate-paper { background-color: #E7E3D9; color: #141414; }

    /* Layout containers */
    #scene-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      will-change: transform, opacity;
    }

    /* Fixed Vox signature bottom bar */
    .bottom-signature-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 16px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Editorial Top Banner */
    .editorial-header {
      position: absolute;
      top: 175px;
      left: 40px;
      right: 40px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }
    .header-tag-pill {
      background-color: #141414;
      padding: 10px 22px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      box-shadow: 4px 4px 0px rgba(20, 20, 20, 0.2);
    }
    .tag-accent-box {
      width: 10px;
      height: 22px;
      background-color: #FF6A1A;
      display: inline-block;
    }
    .tag-title {
      color: #F7F4EC;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1;
    }
    .header-sub-badge {
      background-color: #FF6A1A;
      color: #141414;
      font-weight: 900;
      font-size: 20px;
      padding: 10px 18px;
      border-radius: 4px;
      letter-spacing: 1px;
      box-shadow: 4px 4px 0px rgba(20, 20, 20, 0.2);
    }

    /* Hero Diagram Frame (Collage paper card) */
    .hero-diagram-frame {
      position: absolute;
      top: 265px;
      left: 40px;
      right: 40px;
      height: 780px;
      background-color: #141414;
      border: 3px solid #141414;
      box-shadow: 8px 8px 0px rgba(20, 20, 20, 0.35);
      border-radius: 6px;
      overflow: hidden;
      z-index: 10;
    }
    .diagram-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F5F0E4;
    }
    #diagram-img {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 1480px;
      max-width: none;
      object-fit: cover;
      object-position: left center;
      will-change: transform;
    }

    /* Floating Clock Badge (Initial Hook) */
    #clock-badge {
      position: absolute;
      top: 285px;
      left: 60px;
      background-color: #141414;
      border: 2px solid #FF6A1A;
      border-radius: 6px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.4);
      z-index: 30;
      will-change: transform, opacity;
    }
    .clock-svg {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
    }
    .clock-text {
      color: #F7F4EC;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      line-height: 1;
    }

    /* Milestones Timeline Grid Area */
    .milestones-container {
      position: absolute;
      top: 1070px;
      left: 40px;
      right: 40px;
      height: 275px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      z-index: 20;
    }

    /* Milestone Card */
    .milestone-card {
      flex: 1;
      height: 100%;
      background-color: #141414;
      border-radius: 6px;
      border: 2px solid rgba(247, 244, 236, 0.2);
      box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.35);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      will-change: transform, opacity;
      position: relative;
    }
    .card-top-pill {
      align-self: flex-start;
      background-color: #FF6A1A;
      color: #141414;
      font-weight: 900;
      font-size: 18px;
      padding: 6px 12px;
      border-radius: 3px;
      letter-spacing: 1px;
      line-height: 1;
    }
    .card-main-stat {
      color: #FF6A1A;
      font-size: 44px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -1px;
      margin: 10px 0 6px 0;
    }
    .card-caption {
      color: #F7F4EC;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
      border-top: 1px dashed rgba(247, 244, 236, 0.25);
      padding-top: 10px;
      margin: 0;
    }

    /* Visual warning pulse on 20-year card */
    #card-m3.highlight-danger {
      border-color: #FF6A1A;
      box-shadow: 6px 6px 0px #FF6A1A;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s16"
    data-width="1080"
    data-height="1920"
    data-duration="8.4"
  >
    <section id="scene-s16" class="clip" data-start="0" data-duration="8.4">
      <div id="scene-container">
        <!-- Editorial Header -->
        <div class="editorial-header">
          <div class="header-tag-pill">
            <span class="tag-accent-box"></span>
            <span class="tag-title">DIỄN TIẾN SỤT LÚN</span>
          </div>
          <div class="header-sub-badge">THEO NĂM</div>
        </div>

        <!-- Floating Clock Badge (Intro Hook 0.6s -> 2.2s) -->
        <div id="clock-badge">
          <svg class="clock-svg" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="17" stroke="#FF6A1A" stroke-width="3.5" stroke-linecap="round"/>
            <line id="clock-hour" x1="20" y1="20" x2="20" y2="10" stroke="#F7F4EC" stroke-width="3.5" stroke-linecap="round"/>
            <line id="clock-minute" x1="20" y1="20" x2="28" y2="20" stroke="#FF6A1A" stroke-width="3.5" stroke-linecap="round"/>
          </svg>
          <span class="clock-text">TÁC ĐỘNG ÂM THẦM</span>
        </div>

        <!-- Hero Diagram Card with Camera Pan -->
        <div class="hero-diagram-frame">
          <div class="diagram-viewport">
            <img
              id="diagram-img"
              src="assets/img-18-land-subsidence-process-diagram.jpg"
              alt="Sơ đồ diễn tiến sụt lún ven sông"
              data-layout-allow-overflow="true"
            />
          </div>
        </div>

        <!-- Milestone Overlays -->
        <div class="milestones-container">
          <!-- Mốc 1: 1 Năm (2.4s) -->
          <div id="card-m1" class="milestone-card">
            <span class="card-top-pill">1 NĂM</span>
            <div class="card-main-stat">↓ -3 CM</div>
            <p class="card-caption">Khó nhận biết</p>
          </div>

          <!-- Mốc 2: 10 Năm (5.1s) -->
          <div id="card-m2" class="milestone-card">
            <span class="card-top-pill">10 NĂM</span>
            <div class="card-main-stat">↓ -30 CM</div>
            <p class="card-caption">Chìm bậc thềm</p>
          </div>

          <!-- Mốc 3: 20 Năm (6.9s) -->
          <div id="card-m3" class="milestone-card">
            <span class="card-top-pill">20 NĂM</span>
            <div class="card-main-stat">↓ -60 CM</div>
            <p class="card-caption">Ngập cả sàn nhà</p>
          </div>
        </div>

        <!-- Persistent Signature Bottom Line -->
        <div class="bottom-signature-bar"></div>
      </div>
    </section>
  </div>

  <script>
    // Initialize deterministic, seekable GSAP Timeline
    const tl = gsap.timeline({ paused: true });

    // Initial states set explicitly via fromTo to survive seeking
    // 1. Scene Entrance (Rise animation)
    tl.fromTo(
      "#scene-container",
      { y: 36, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
      0.0
    );

    // 2. Continuous slow pan across the 3 timeline phases of the diagram
    tl.fromTo(
      "#diagram-img",
      { x: 0 },
      { x: -440, duration: 8.4, ease: "none" },
      0.0
    );

    // 3. Icon Clock Entrance (atMs: 115000 -> 0.6s)
    tl.fromTo(
      "#clock-badge",
      { scale: 0.75, opacity: 0, y: -20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.6
    );

    // Animate clock minute needle rotation
    tl.fromTo(
      "#clock-minute",
      { rotation: 0, transformOrigin: "20px 20px" },
      { rotation: 360, transformOrigin: "20px 20px", duration: 1.4, ease: "power2.inOut" },
      0.65
    );

    // Clock badge exit (before first data card arrives)
    tl.fromTo(
      "#clock-badge",
      { opacity: 1, scale: 1 },
      { opacity: 0, scale: 0.9, duration: 0.25, ease: "power2.in" },
      2.15
    );

    // 4. Milestone Card 1: 1 NĂM: -3 CM (atMs: 116800 -> 2.4s)
    tl.fromTo(
      "#card-m1",
      { y: 32, opacity: 0, scale: 0.88 },
      { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
      2.4
    );

    // 5. Milestone Card 2: 10 NĂM: -30 CM (atMs: 119500 -> 5.1s)
    tl.fromTo(
      "#card-m2",
      { y: 32, opacity: 0, scale: 0.88 },
      { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
      5.1
    );

    // 6. Milestone Card 3: 20 NĂM: -60 CM (atMs: 121300 -> 6.9s)
    tl.fromTo(
      "#card-m3",
      { y: 32, opacity: 0, scale: 0.88 },
      { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
      6.9
    );

    // Danger emphasis on 20-year card as floor is submerged
    tl.to(
      "#card-m3",
      { borderColor: "#FF6A1A", duration: 0.35, ease: "power2.out" },
      7.4
    );

    // Register paused timeline into HyperFrames window registry
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s16"] = tl;
  </script>

    </template>
  </body>
</html>
