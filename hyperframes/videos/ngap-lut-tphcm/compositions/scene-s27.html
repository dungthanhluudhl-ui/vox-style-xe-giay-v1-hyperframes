      #depth-rail {

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Peel transition entrance for header and diagram frame
      tl.fromTo(
        "#header-box",
        { y: -50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.08
      );

      tl.fromTo(
        "#diagram-frame",
        {
          clipPath: "polygon(0 0, 100% 0, 100% 0, 0 0)",
          y: 40,
          opacity: 0
        },
        {
          clipPath: "polygon(0 0, 100% 0, 100% 100%, 0 100%)",
          y: 0,
          opacity: 1,
          duration: 0.8,
          ease: "power3.out"
        },
        0.15
      );

      // 2. Camera motion: continuous pan from city surface down into underground sewer maze
      tl.fromTo(
        "#diagram-img",
        { x: 0, y: 0 },
        { x: -60, y: -780, duration: 9.2, ease: "power1.inOut" },
        0.3
      );

      // 3. Technical depth pip moves along the rail in sync with underground exploration
      tl.fromTo(
        "#depth-pip",
        { y: 0 },
        { y: 680, duration: 9.2, ease: "power1.inOut" },
        0.3
      );

      // 4. Overlay 1 entrance and exit animation
      tl.fromTo(
        "#overlay-1-card",
        { y: 30, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        1.83
      );
      tl.to(
        "#overlay-1-card",
        { y: -20, opacity: 0, duration: 0.25, ease: "power2.in" },
        3.75
      );

      // 5. Overlay 2 entrance and exit animation
      tl.fromTo(
        "#overlay-2-card",
        { y: 30, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        6.83
      );
      tl.to(
        "#overlay-2-card",
        { y: -20, opacity: 0, duration: 0.25, ease: "power2.in" },
        9.15
      );

      window.__timelines["scene-s27"] = tl;
