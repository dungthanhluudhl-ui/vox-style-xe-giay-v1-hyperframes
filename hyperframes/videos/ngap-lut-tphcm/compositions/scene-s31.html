    <script>
      // Single deterministic paused GSAP timeline
      const tl = gsap.timeline({ paused: true });

      // Measure SVG path lengths for draw animations
      const arrowLeft = document.getElementById("spill-arrow-left");
      const arrowRight = document.getElementById("spill-arrow-right");
      const lenLeft = Math.ceil(arrowLeft ? arrowLeft.getTotalLength() : 220);
      const lenRight = Math.ceil(arrowRight ? arrowRight.getTotalLength() : 220);

      // 0.0s - 0.7s: Scene entrance (transitionIn: "rise")
      tl.fromTo(
        "#stage-content",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.0
      );

      // Hydraulic piston initial collapsed state in timeline
      tl.fromTo(
        ["#jack-shaft-left", "#jack-shaft-right"],
        { scaleY: 0.1, transformOrigin: "50% 100%" },
        { scaleY: 0.1, duration: 0.01 },
        0.0
      );

      // Water ponds initial shallow state (scaleY: 0.35 = 35px height)
      tl.fromTo(
        ["#water-left-pond", "#water-right-pond"],
        { scaleY: 0.35, transformOrigin: "50% 100%" },
        { scaleY: 0.35, duration: 0.01 },
        0.0
      );

      // Arrow strokes initial hidden state
      tl.fromTo(
        "#spill-arrow-left",
        { strokeDasharray: lenLeft, strokeDashoffset: lenLeft },
        { strokeDashoffset: lenLeft, duration: 0.01 },
        0.0
      );
      tl.fromTo(
        "#spill-arrow-right",
        { strokeDasharray: lenRight, strokeDashoffset: lenRight },
        { strokeDashoffset: lenRight, duration: 0.01 },
        0.0
      );

      // Initial hidden states for overlays
      tl.fromTo("#badge-local-raise", { scale: 0, opacity: 0, y: -15 }, { scale: 0, opacity: 0, y: -15, duration: 0.01 }, 0.0);
      tl.fromTo(["#warning-left", "#warning-right"], { opacity: 0, scale: 0.8 }, { opacity: 0, scale: 0.8, duration: 0.01 }, 0.0);
      tl.fromTo("#elevation-dimension", { opacity: 0, y: 15 }, { opacity: 0, y: 15, duration: 0.01 }, 0.0);
      tl.fromTo("#punch-card", { opacity: 0, y: 30 }, { opacity: 0, y: 30, duration: 0.01 }, 0.0);
      tl.fromTo("#fall-badge", { opacity: 0, scale: 0.7 }, { opacity: 0, scale: 0.7, duration: 0.01 }, 0.0);

      // 0.5s - 6.5s: Subtle technical camera zoom-in
      tl.fromTo(
        "#diagram-card",
        { scale: 1 },
        { scale: 1.03, duration: 6.0, ease: "sine.inOut" },
        0.5
      );

      // 1.24s (237000ms): Label overlay "NÂNG NỀN CỤC BỘ" springs in
      tl.fromTo(
        "#badge-local-raise",
        { scale: 0, opacity: 0, y: -15 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        1.24
      );

      // 1.8s - 3.4s: Road slab raises mechanically up out of the water!
      tl.fromTo(
        "#road-slab",
        { y: 0 },
        { y: -150, duration: 1.6, ease: "power2.inOut" },
        1.8
      );
      tl.to(
        ["#jack-shaft-left", "#jack-shaft-right"],
        { scaleY: 1, duration: 1.6, ease: "power2.inOut" },
        1.8
      );

      // Center water clears / rolls off as road lifts above flood line
      tl.fromTo(
        "#water-center",
        { opacity: 1 },
        { opacity: 0, duration: 0.8, ease: "power2.out" },
        2.2
      );

      // Dimension marker (+0.8M) appears
      tl.to(
        "#elevation-dimension",
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        2.8
      );

      // 3.4s - 5.2s: Displaced water cascades to adjacent low-lying zones
      // Spill arrows trace downward
      tl.to(
        "#spill-arrow-left",
        { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" },
        3.4
      );
      tl.to(
        "#spill-arrow-right",
        { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" },
        3.55
      );

      // Water ponds expand and rise via scaleY (pure transform, no height reflow)
      tl.to(
        "#water-left-pond",
        { scaleY: 1.0, duration: 1.5, ease: "power2.out" },
        3.7
      );

      tl.to(
        "#water-right-pond",
        { scaleY: 1.0, duration: 1.5, ease: "power2.out" },
        3.85
      );

      // Warning badges on left & right pop in at top: 100px
      tl.to(
        ["#warning-left", "#warning-right"],
        { opacity: 1, scale: 1, duration: 0.45, stagger: 0.15, ease: "power3.out" },
        4.6
      );

      // 6.74s (242500ms): Punch-phrase "NƯỚC KHÔNG BIẾN MẤT"
      tl.to(
        "#punch-card",
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        6.74
      );

      // 7.74s (243500ms): Icon "fall" badge arrives
      tl.to(
        "#fall-badge",
        { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        7.74
      );

      // Register the master timeline
      window.__timelines["scene-s31"] = tl;
    </script>
