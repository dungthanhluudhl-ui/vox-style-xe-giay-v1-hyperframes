      const tl = gsap.timeline({ paused: true });

      // 1. Scene Entrance: Punch impact transition on card frame

        "#card-frame",
        { scale: 0.94, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.05

      // Camera pan along sewer water path (completes at 9.1s, safely before data-duration 9.43s)

        "#diagram-img",
        { y: -60, scale: 1.05 },
        { y: 30, scale: 1.05, duration: 9.0, ease: "none" },
        0.1
      );

      // 2. Overlay 1 & River Pressure flow vector (at 3.36s)
      tl.fromTo(
        "#overlay-pressure .overlay-badge",
        { scale: 0.8, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        3.36
      );

      tl.fromTo(
        "#river-flow-group",
        { opacity: 0 },
        { opacity: 1, duration: 0.1 },
        3.36
      );

      tl.fromTo(
        ["#river-arrow-path", "#river-arrow-core"],
        { strokeDashoffset: 1000 },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        3.42
      );

      tl.fromTo(
        "#river-arrow-head",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.25, ease: "power2.out" },
        3.85
      );

      // Fade out Overlay 1 cleanly before its clip ends
      tl.to(
        "#overlay-pressure .overlay-badge",
        { opacity: 0, scale: 0.92, duration: 0.25, ease: "power2.in" },
        5.15
      );
      tl.to(
        "#river-flow-group",
        { opacity: 0, duration: 0.25, ease: "power2.in" },
        5.15
      );

      // 3. Overlay 2: DÒNG CHẢY TRÀO NGƯỢC (at 7.66s)
      tl.fromTo(
        "#overlay-reverse .overlay-badge",
        { scale: 0.8, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        7.66
      );

      // Reverse surge arrow traces upward towards street level
      tl.fromTo(
        "#reverse-flow-group",
        { opacity: 0 },
        { opacity: 1, duration: 0.1 },
        7.66
      );

      tl.fromTo(
        ["#reverse-arrow-path", "#reverse-arrow-core"],
        { strokeDashoffset: 1000 },
        { strokeDashoffset: 0, duration: 0.58, ease: "power2.out" },
        7.72

      tl.fromTo(
        "#reverse-arrow-head",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.25, ease: "power2.out" },
        8.15
      );

      // 4. Overlay 3: Icon warning (at 8.36s)
      tl.fromTo(
        "#overlay-warning .warning-card",
        { scale: 0, rotation: -20, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        8.36
      );

      // Alert pulsation settling by 9.18s
      tl.to(
        "#overlay-warning .warning-card",
        { scale: 1.08, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" },
        8.75
      );

      // Register timeline strictly on window.__timelines
      window.__timelines["scene-s10"] = tl;
