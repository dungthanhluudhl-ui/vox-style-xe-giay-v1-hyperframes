    <script>
      // Single paused master timeline for HyperFrames
      const tl = gsap.timeline({ paused: true });

      // SVG path length setup for self-drawing icons
      const qCurve = document.getElementById("q-curve");
      if (qCurve) {
        const len = qCurve.getTotalLength() || 60;
        qCurve.style.strokeDasharray = len;
        qCurve.style.strokeDashoffset = len;
      }

      const pointerLine = document.getElementById("pointer-line");
      if (pointerLine) {
        const len = pointerLine.getTotalLength() || 180;
        pointerLine.style.strokeDasharray = len;
        pointerLine.style.strokeDashoffset = len;
      }

      const riseArrow = document.getElementById("rise-arrow");
      if (riseArrow) {
        const len = riseArrow.getTotalLength() || 80;
        riseArrow.style.strokeDasharray = len;
        riseArrow.style.strokeDashoffset = len;
      }

      const riseHead = document.getElementById("rise-head");
      if (riseHead) {
        const len = riseHead.getTotalLength() || 40;
        riseHead.style.strokeDasharray = len;
        riseHead.style.strokeDashoffset = len;
      }

      // ==========================================
      // SHOT 1 CHOREOGRAPHY (0.0s - 3.2s)
      // ==========================================

      // 1. Entrance: Paper peel uncurls and exits up-left
      tl.fromTo(
        "#peel-card",
        { yPercent: 0, rotation: 0, opacity: 1 },
        { yPercent: -115, rotation: -6, opacity: 0.8, duration: 0.65, ease: "power2.inOut" },
        0
      );

      // 2. Camera: Subtle zoom-in on video
      tl.fromTo(
        "#vid-02",
        { scale: 1.0 },
        { scale: 1.08, duration: 3.2, ease: "none" },
        0
      );

      // 3. Punch phrase card entrance at t=0.2s (atMs: 200)
      tl.fromTo(
        "#punch-card",
        { scale: 0.82, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.2
      );

      // 4. Question icon path draw at t=0.8s (atMs: 800)
      tl.to(
        "#q-curve",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        0.8
      );
      tl.fromTo(
        "#q-dot",
        { scale: 0, transformOrigin: "center center" },
        { scale: 1, duration: 0.2, ease: "back.out(1.8)" },
        1.15
      );

      // 5. Punch phrase card subtle exit before shot transition
      tl.to(
        "#punch-card",
        { opacity: 0, y: -18, duration: 0.25, ease: "power2.in" },
        2.95
      );

      // ==========================================
      // SHOT 2 CHOREOGRAPHY (3.2s - 6.56s)
      // ==========================================

      // 1. Camera: Ken Burns pan-down from zebra savannah to center seam
      tl.fromTo(
        "#img-01",
        { scale: 1.10, y: -40 },
        { scale: 1.04, y: 20, duration: 3.36, ease: "none", immediateRender: false },
        3.2
      );

      // 2. Annotation leader line draws at t=4.15s
      tl.to(
        "#pointer-line",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        4.15
      );

      // 3. Callout Label pops in at t=4.3s (atMs: 4300)
      tl.fromTo(
        "#callout-card",
        { scale: 0.84, opacity: 0, x: -35 },
        { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "power3.out", immediateRender: false },
        4.3
      );

      // 4. Rise icon draws at t=5.8s (atMs: 5800)
      tl.to(
        "#rise-arrow",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        5.8
      );
      tl.to(
        "#rise-head",
        { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
        6.05
      );

      // Register the paused master timeline
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s01"] = tl;
    </script>
