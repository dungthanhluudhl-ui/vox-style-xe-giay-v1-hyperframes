      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #F5F0E4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #F5F0E4;
        perspective: 1200px;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .shot-camera {
        position: absolute;
        inset: 0;
        overflow: hidden;
        perspective: 1200px;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }
      .media-fill {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: 50% 50%;
      }
      .vignette-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 45%, rgba(20, 20, 20, 0.05) 45%, rgba(20, 20, 20, 0.55) 100%);
        pointer-events: none;
      }
      .ui-layer {
        pointer-events: none;
        z-index: 10;
      }
      /* Editorial Punch Cards */
      .punch-card {
        position: absolute;
        top: 200px;
        left: 60px;
        right: 60px;
        background-color: #F7F4EC;
        border-radius: 20px;
        padding: 24px 32px;
        box-shadow: 0 16px 44px rgba(20, 20, 20, 0.28);
        border-left: 10px solid #FF6A1A;
        opacity: 0;
        will-change: transform, opacity;
      }
      .punch-dark {
        background-color: #141414;
        border-left: 10px solid #FF6A1A;
        box-shadow: 0 16px 44px rgba(0, 0, 0, 0.45);
      }
      .tag-badge {
        display: inline-block;
        background-color: #FF6A1A;
        color: #141414;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 6px 14px;
        border-radius: 6px;
        margin-bottom: 12px;
      }
      .punch-title {
        margin: 0;
        font-size: 54px;
        font-weight: 900;
        line-height: 1.24;
        color: #141414;
        letter-spacing: -0.5px;
        text-transform: uppercase;
      }
      .punch-title-light {
        margin: 0;
        font-size: 54px;
        font-weight: 900;
        line-height: 1.24;
        color: #F7F4EC;
        letter-spacing: -0.5px;
        text-transform: uppercase;
      }
      /* Annotated Icon Card (Shot 1) */
      .annotated-card {
        position: absolute;
        bottom: 440px;
        left: 60px;
        right: 60px;
        background-color: rgba(20, 20, 20, 0.92);
        border: 2px solid rgba(255, 106, 26, 0.6);
        border-radius: 20px;
        padding: 22px 28px;
        display: flex;
        align-items: center;
        gap: 24px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        opacity: 0;
        will-change: transform, opacity;
      }
      .icon-box {
        width: 80px;
        height: 80px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .person-svg {
        width: 80px;
        height: 80px;
      }
      .annotated-info {
        flex: 1;
      }
      .annotated-text {
        margin: 0;
        font-size: 32px;
        font-weight: 900;
        line-height: 1.3;
        color: #F7F4EC;
        text-transform: uppercase;
      }
      /* Final Conclusion Card (Shot 2) */
      .final-card {
        position: absolute;
        bottom: 440px;
        left: 60px;
        right: 60px;
        background-color: #F7F4EC;
        border-left: 10px solid #FF6A1A;
        border-radius: 20px;
        padding: 24px 32px;
        box-shadow: 0 16px 44px rgba(20, 20, 20, 0.32);
        opacity: 0;
        will-change: transform, opacity;
      }
      .final-title {
        margin: 0;
        font-size: 54px;
        font-weight: 900;
        line-height: 1.24;
        color: #141414;
        letter-spacing: -0.5px;
        text-transform: uppercase;
      }
      .final-sub {
        margin-top: 8px;
        font-size: 22px;
        font-weight: 700;
        color: #141414;
        opacity: 0.85;
        letter-spacing: 0.5px;
      }
      /* Fixed Vox Bottom Orange Accent Bar */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 100;
        pointer-events: none;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s07"
      data-width="1080"
      data-height="1920"
      data-duration="8.5"
    >
      <!-- ==================== SHOT 1 (0.00s - 4.18s) ==================== -->
      <!-- 3D Camera / Viewport wrapper for Shot 1 -->
      <div id="shot-1-camera" class="shot-camera" data-layout-allow-overflow="true">
        <video
          id="vid-01"
          class="media-fill"
          src="assets/vid-01-mother-baby-neuron-papercut.mp4"
          data-start="0"
          data-duration="4.18"
          data-media-start="1.2"
          muted
          playsinline
        ></video>
        <div class="vignette-overlay"></div>
      </div>

      <!-- Shot 1 Punch Phrase Card: "TIỀM NĂNG VÔ HẠN" -->
      <div id="punch-1-wrap" class="clip ui-layer" data-start="0" data-duration="4.18">
        <div id="punch-1" class="punch-card">
          <div class="tag-badge">BỘ NÃO TRẺ THƠ</div>
          <div class="punch-title">TIỀM NĂNG VÔ HẠN</div>
        </div>
      </div>

      <!-- Shot 1 Annotated Card: Icon Person + Neural Connection -->
      <div id="person-card-wrap" class="clip ui-layer" data-start="0" data-duration="4.18">
        <div id="person-card" class="annotated-card">
          <div class="icon-box">
            <svg class="person-svg" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
              <circle id="person-head" cx="40" cy="24" r="14" fill="none" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round" />
              <path id="person-body" d="M 18 64 C 18 46, 62 46, 62 64" fill="none" stroke="#F7F4EC" stroke-width="4" stroke-linecap="round" />
              <circle cx="22" cy="18" r="3" fill="#FF6A1A" />
              <circle cx="58" cy="18" r="3" fill="#FF6A1A" />
              <path d="M 25 20 L 33 23 M 55 20 L 47 23" stroke="#FF6A1A" stroke-width="2" stroke-dasharray="3,3" />
            </svg>
          </div>
          <div class="annotated-info">
            <div class="tag-badge">ĐẶC TRƯNG TIẾN HÓA</div>
            <div class="annotated-text">NƠ-RON BÙNG NỔ KẾT NỐI</div>
          </div>
        </div>
      </div>

      <!-- ==================== SHOT 2 (4.18s - 8.50s) ==================== -->
      <!-- Shot 2 Visual Layer: Image background with Ken Burns zoom-out -->
      <img
        id="img-02"
        class="media-fill"
        src="assets/img-02-mother-infant-neural-psychology.jpg"
        alt="Mẹ và bé sơ sinh với mạng nơ-ron thần kinh"
        data-start="4.18"
        data-duration="4.32"
        data-layout-allow-overflow="true"
      />

      <!-- Shot 2 Lighting / Vignette -->
      <div id="vignette-2" class="clip vignette-overlay" data-start="4.18" data-duration="4.32"></div>

      <!-- Shot 2 Punch Phrase Card: "ĐẶC QUYỀN YẾU ỚT" -->
      <div id="punch-2-wrap" class="clip ui-layer" data-start="4.18" data-duration="4.32">
        <div id="punch-2" class="punch-card punch-dark">
          <div class="tag-badge">QUY LUẬT SINH TỒN</div>
          <div class="punch-title-light">ĐẶC QUYỀN YẾU ỚT</div>
        </div>
      </div>

      <!-- Shot 2 Final Conclusion Card: "CHA MẸ BẢO BỌC" -->
      <div id="label-final-wrap" class="clip ui-layer" data-start="4.18" data-duration="4.32">
        <div id="label-final" class="final-card">
          <div class="tag-badge">KẾT LUẬN CỐT LÕI</div>
          <div class="final-title">CHA MẸ BẢO BỌC</div>
          <div class="final-sub">CHÌA KHÓA TIẾN HÓA CỦA LOÀI NGƯỜI</div>
        </div>
      </div>

      <!-- Permanent Vox Signature Bottom Bar -->
      <div class="brand-bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Measure SVG path lengths for deterministic progressive drawing
      const headEl = document.getElementById("person-head");
      const bodyEl = document.getElementById("person-body");
      let headLen = 88;
      let bodyLen = 70;
      if (headEl && headEl.getTotalLength) {
        try {
          headLen = Math.ceil(headEl.getTotalLength());
        } catch (e) {}
      }
      if (bodyEl && bodyEl.getTotalLength) {
        try {
          bodyLen = Math.ceil(bodyEl.getTotalLength());
        } catch (e) {}
      }
      headEl.style.strokeDasharray = headLen + "";
      headEl.style.strokeDashoffset = headLen + "";
      bodyEl.style.strokeDasharray = bodyLen + "";
      bodyEl.style.strokeDashoffset = bodyLen + "";

      // Initial visual states for UI cards
      tl.set("#punch-1, #person-card", { opacity: 0 }, 0);
      tl.set("#punch-2, #label-final", { opacity: 0 }, 4.18);

      // --- SHOT 1 MOTION CHOREOGRAPHY ---
      // 3D Flip transition in for Shot 1 camera viewport
      tl.fromTo(
        "#shot-1-camera",
        { rotationY: -35, opacity: 0 },
        { rotationY: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0
      );
      // Gentle camera zoom-in on Mother & Newborn
      tl.fromTo(
        "#vid-01",
        { scale: 1.0 },
        { scale: 1.08, duration: 4.18, ease: "none" },
        0
      );
      // Clean exit for Shot 1 camera wrapper at boundary
      tl.set("#shot-1-camera", { opacity: 0 }, 4.18);

      // Punch Phrase 1: "TIỀM NĂNG VÔ HẠN" (at 0.28s, holds 2.0s to 2.28s)
      tl.fromTo(
        "#punch-1",
        { y: -30, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        0.28
      );
      tl.to(
        "#punch-1",
        { y: -20, opacity: 0, duration: 0.35, ease: "power2.in" },
        2.28
      );

      // Icon Overlay: "person" / Neural connection (at 2.48s, holds 1.6s to 4.08s)
      tl.fromTo(
        "#person-card",
        { y: 35, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        2.48
      );
      tl.fromTo(
        headEl,
        { strokeDashoffset: headLen },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        2.6
      );
      tl.fromTo(
        bodyEl,
        { strokeDashoffset: bodyLen },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        2.75
      );
      tl.to(
        "#person-card",
        { opacity: 0, duration: 0.1, ease: "power1.in" },
        4.08
      );

      // --- SHOT 2 MOTION CHOREOGRAPHY ---
      // Hard Cut at 4.18s, Ken Burns Camera Zoom-out on Mother's Protection
      tl.fromTo(
        "#img-02",
        { scale: 1.14, y: -20 },
        { scale: 1.0, y: 0, duration: 4.32, ease: "sine.out" },
        4.18
      );

      // Punch Phrase 2: "ĐẶC QUYỀN YẾU ỚT" (at 4.68s, holds 2.2s to 6.88s)
      tl.fromTo(
        "#punch-2",
        { y: -30, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        4.68
      );
      tl.to(
        "#punch-2",
        { y: -20, opacity: 0, duration: 0.35, ease: "power2.in" },
        6.88
      );

      // Final Conclusion Label: "CHA MẸ BẢO BỌC" (at 6.88s, holds 1.6s to 8.48s)
      tl.fromTo(
        "#label-final",
        { y: 35, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        6.88
      );

      // Register master timeline with HyperFrames seek engine
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s07"] = tl;
    </script>
  
    </template>
  </body>
</html>
