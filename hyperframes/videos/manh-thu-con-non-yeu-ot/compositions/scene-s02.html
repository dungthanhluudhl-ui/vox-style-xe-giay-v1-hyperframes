<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Nền lưới kỹ thuật 84px đặc trưng Vox */
      .vox-grid-bg {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        pointer-events: none;
        z-index: 1;
      }

      /* Khung camera và ảnh nền */
      .camera-viewport {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 2;
      }
      .camera-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform-origin: 52% 65%;
        will-change: transform;
      }
      .bg-photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Lớp phủ Spotlight Vignette hang đá tối */
      .vignette-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 52% 62%,
          rgba(20, 20, 20, 0.05) 30%,
          rgba(20, 20, 20, 0.58) 75%,
          rgba(10, 10, 10, 0.88) 100%
        );
        pointer-events: none;
        z-index: 3;
      }

      /* SVG đồ hoạ chỉ dẫn vẽ tay */
      .pointer-svg {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
        z-index: 10;
      }

      /* Header Badge - Safe top zone (Y: 180px) */
      .header-badge {
        position: absolute;
        top: 180px;
        left: 60px;
        display: flex;
        align-items: center;
        background: #141414;
        border: 2px solid #ff6a1a;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        z-index: 20;
      }
      .badge-tag {
        background: #ff6a1a;
        color: #141414;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 1.5px;
        padding: 10px 18px;
        text-transform: uppercase;
      }
      .badge-title {
        color: #f7f4ec;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 1px;
        padding: 10px 22px;
        text-transform: uppercase;
      }

      /* Thẻ chú thích (Annotation Card) chuẩn Vox */
      .annotation-card {
        position: absolute;
        width: 580px;
        background: #141414;
        border-left: 6px solid #ff6a1a;
        border-radius: 4px 12px 12px 4px;
        padding: 24px 28px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
        z-index: 20;
        opacity: 0;
        transform-origin: left center;
      }
      .card-tigress {
        top: 480px;
        left: 60px;
      }
      .card-cubs {
        top: 950px;
        left: 60px;
      }

      .card-indicator {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .card-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: #ff6a1a;
      }
      .card-sub {
        font-size: 20px;
        font-weight: 900;
        color: #ff6a1a;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .card-headline {
        font-size: 40px;
        font-weight: 900;
        line-height: 1.25;
        color: #f7f4ec;
        margin: 0 0 8px 0;
        text-transform: uppercase;
      }
      .card-desc {
        font-size: 22px;
        font-weight: 700;
        line-height: 1.4;
        color: #d8d3c5;
        margin: 0;
      }

      /* Warning Icon & Callout Badge */
      .warning-callout {
        position: absolute;
        top: 1180px;
        left: 60px;
        display: flex;
        align-items: center;
        gap: 20px;
        background: #141414;
        border: 2px solid #ff6a1a;
        border-radius: 12px;
        padding: 16px 24px;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
        z-index: 20;
        opacity: 0;
        transform-origin: left center;
      }
      .warning-icon-svg {
        flex-shrink: 0;
      }
      .warning-text-group {
        display: flex;
        flex-direction: column;
      }
      .warning-title {
        font-size: 24px;
        font-weight: 900;
        color: #ff6a1a;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .warning-desc {
        font-size: 20px;
        font-weight: 700;
        color: #f7f4ec;
        margin-top: 2px;
      }

      /* Thanh cam nhận diện thương hiệu cố định mép đáy */
      .vox-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 50;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s02"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="5.96"
    >
      <section id="scene-s02" class="clip" data-start="0" data-duration="5.96">
        <!-- Nền lưới 84px đặc trưng phong cách Vox -->
        <div class="vox-grid-bg"></div>

        <!-- Khung ảnh camera và hiệu ứng punch + slow zoom -->
        <div class="camera-viewport">
          <div id="camera-layer" class="camera-layer" data-layout-allow-overflow="true">
            <img
              id="tiger-cave-photo"
              class="bg-photo"
              src="assets/img-05-tiger-mother-cubs-cave.jpg"
              alt="Hổ mẹ bảo vệ đàn con trong hang đá"
            />
          </div>
        </div>

        <!-- Lớp phủ Spotlight Vignette tạo chiều sâu hang đá tối -->
        <div class="vignette-overlay"></div>

        <!-- Header Tag trên vùng safe zone top -->
        <div id="header-badge" class="header-badge">
          <span class="badge-tag">NGHỊCH LÝ SINH TỒN</span>
          <span class="badge-title">HỔ MẸ &amp; CON NON</span>
        </div>

        <!-- SVG chỉ dẫn đồ hoạ 1: Chỉ vào móng vuốt / hổ mẹ -->
        <svg id="svg-pointer-tigress" class="pointer-svg" viewBox="0 0 1080 1920">
          <circle
            id="target-circle-tigress"
            cx="600"
            cy="720"
            r="32"
            stroke="#FF6A1A"
            stroke-width="3.5"
            fill="none"
          />
          <circle id="target-dot-tigress" cx="600" cy="720" r="5" fill="#FF6A1A" opacity="0" />
          <path
            id="target-line-tigress"
            d="M 600 720 L 460 610 L 280 610"
            stroke="#FF6A1A"
            stroke-width="3.5"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

        <!-- Thẻ chú thích 1: SỨC MẠNH QUẬT NGÃ -->
        <div id="card-tigress" class="annotation-card card-tigress">
          <div class="card-indicator">
            <span class="card-dot"></span>
            <span class="card-sub">CHÚA TỂ RỪNG XANH</span>
          </div>
          <h2 class="card-headline">SỨC MẠNH QUẬT NGÃ</h2>
          <p class="card-desc">Hạ gục con mồi khổng lồ chỉ trong chớp mắt</p>
        </div>

        <!-- SVG chỉ dẫn đồ hoạ 2: Chỉ vào 3 hổ con đỏ hỏn -->
        <svg id="svg-pointer-cubs" class="pointer-svg" viewBox="0 0 1080 1920">
          <circle
            id="target-circle-cubs"
            cx="530"
            cy="1280"
            r="38"
            stroke="#FF6A1A"
            stroke-width="3.5"
            fill="none"
          />
          <circle id="target-dot-cubs" cx="530" cy="1280" r="5" fill="#FF6A1A" opacity="0" />
          <path
            id="target-line-cubs"
            d="M 530 1280 L 420 1100 L 260 1100"
            stroke="#FF6A1A"
            stroke-width="3.5"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

        <!-- Thẻ chú thích 2: CHƯA THỂ MỞ MẮT -->
        <div id="card-cubs" class="annotation-card card-cubs">
          <div class="card-indicator">
            <span class="card-dot"></span>
            <span class="card-sub">HỔ SƠ SINH</span>
          </div>
          <h2 class="card-headline">CHƯA THỂ MỞ MẮT</h2>
          <p class="card-desc">Bốn chân yếu ớt, hoàn toàn chưa thể tự vệ</p>
        </div>

        <!-- Biểu tượng Warning & nhãn trạng thái -->
        <div id="warning-badge" class="warning-callout">
          <svg
            id="warning-svg"
            class="warning-icon-svg"
            viewBox="0 0 54 54"
            width="52"
            height="52"
          >
            <path
              id="warn-triangle-path"
              d="M 27 6 L 49 44 L 5 44 Z"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="4"
              stroke-linejoin="round"
              stroke-linecap="round"
            />
            <line
              id="warn-line"
              x1="27"
              y1="20"
              x2="27"
              y2="31"
              stroke="#FF6A1A"
              stroke-width="4"
              stroke-linecap="round"
            />
            <circle id="warn-dot" cx="27" cy="38" r="3" fill="#FF6A1A" opacity="0" />
          </svg>
          <div class="warning-text-group">
            <span class="warning-title">BẤT ĐỐI XỨNG SINH HỌC</span>
            <span class="warning-desc">Giai đoạn non nớt và mong manh nhất</span>
          </div>
        </div>

        <!-- Thanh cam đáy cố định nhận diện thương hiệu Vox -->
        <div class="vox-bottom-bar"></div>
      </section>
    </div>

    <script>
      // Khởi tạo GSAP Timeline seekable độc lập cho composition
      const tl = gsap.timeline({ paused: true });

      // Thiết lập đo và gán strokeDasharray/strokeDashoffset cho các đường vẽ SVG
      const svgElements = [
        document.getElementById("target-circle-tigress"),
        document.getElementById("target-line-tigress"),
        document.getElementById("target-circle-cubs"),
        document.getElementById("target-line-cubs"),
        document.getElementById("warn-triangle-path"),
        document.getElementById("warn-line"),
      ];

      svgElements.forEach(function (elem) {
        if (elem && elem.getTotalLength) {
          const len = elem.getTotalLength();
          elem.style.strokeDasharray = len;
          elem.style.strokeDashoffset = len;
        }
      });

      // 1. Entrance punch dập vào dứt khoát tại t = 0 -> 0.45s
      tl.fromTo(
        "#camera-layer",
        { scale: 1.3 },
        { scale: 1.15, duration: 0.45, ease: "power4.out" },
        0,
      );

      // Camera zoom-in chậm dần vào đàn hổ con từ 0.45s đến 5.96s
      tl.to(
        "#camera-layer",
        {
          scale: 1.38,
          y: -75,
          x: -15,
          duration: 5.51,
          ease: "sine.out",
        },
        0.45,
      );

      // Header Tag trượt vào từ trên
      tl.fromTo(
        "#header-badge",
        { y: -50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.2,
      );

      // 2. Overlay 1: "SỨC MẠNH QUẬT NGÃ" (atMs: 7600 -> relative 1.04s, holdMs: 1800)
      // Vẽ vòng tròn mục tiêu và đường nối chỉ vào hổ mẹ
      tl.to("#target-circle-tigress", { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, 1.04);
      tl.to("#target-dot-tigress", { opacity: 1, duration: 0.15 }, 1.12);
      tl.to("#target-line-tigress", { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" }, 1.16);

      // Thẻ chú thích hổ mẹ trượt mở
      tl.fromTo(
        "#card-tigress",
        { opacity: 0, x: -35, scale: 0.94 },
        { opacity: 1, x: 0, scale: 1, duration: 0.42, ease: "power3.out" },
        1.25,
      );

      // Thu gọn Overlay 1 tại t = 2.54s (trước khi Overlay 2 xuất hiện)
      tl.to("#card-tigress", { opacity: 0, x: -25, duration: 0.3, ease: "power2.in" }, 2.54);
      tl.to("#svg-pointer-tigress", { opacity: 0, duration: 0.25 }, 2.58);

      // 3. Overlay 2: "CHƯA THỂ MỞ MẮT" (atMs: 10500 -> relative 3.94s, holdMs: 1800)
      // Vẽ vòng tròn mục tiêu và đường nối chỉ vào hổ sơ sinh
      tl.to("#target-circle-cubs", { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, 3.94);
      tl.to("#target-dot-cubs", { opacity: 1, duration: 0.15 }, 4.02);
      tl.to("#target-line-cubs", { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" }, 4.06);

      // Thẻ chú thích hổ sơ sinh trượt mở
      tl.fromTo(
        "#card-cubs",
        { opacity: 0, x: -35, scale: 0.94 },
        { opacity: 1, x: 0, scale: 1, duration: 0.42, ease: "power3.out" },
        4.15,
      );

      // Thu gọn Overlay 2 tại t = 5.44s
      tl.to("#card-cubs", { opacity: 0, x: -25, duration: 0.3, ease: "power2.in" }, 5.44);
      tl.to("#svg-pointer-cubs", { opacity: 0, duration: 0.25 }, 5.48);

      // 4. Overlay 3: Icon Warning & Nhãn trạng thái (atMs: 11400 -> relative 4.84s)
      tl.to("#warn-triangle-path", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 4.84);
      tl.to("#warn-line", { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, 5.02);
      tl.to("#warn-dot", { opacity: 1, duration: 0.15 }, 5.12);

      tl.fromTo(
        "#warning-badge",
        { opacity: 0, y: 24, scale: 0.92 },
        { opacity: 1, y: 0, scale: 1, duration: 0.38, ease: "power3.out" },
        4.84,
      );

      // Đăng ký timeline vào hệ thống HyperFrames
      window.__timelines["scene-s02"] = tl;
    </script>
  
    </template>
  </body>
</html>
