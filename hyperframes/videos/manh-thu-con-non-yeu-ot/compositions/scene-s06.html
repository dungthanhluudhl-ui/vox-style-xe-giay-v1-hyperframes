<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Quy ước kích thước root HyperFrames: width/height 100% theo canvas */
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }

      /* Quy ước clip HyperFrames: full-frame timing owners */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Nền lưới ô vuông 84px đặc trưng phong cách Vox DNA */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-color: #e7e3d9;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.26) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.26) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        pointer-events: none;
      }

      .vignette-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 45%, transparent 60%, rgba(20, 20, 20, 0.16) 100%);
        pointer-events: none;
      }

      /* Dải cam thương hiệu cố định mép đáy */
      .brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 99;
        pointer-events: none;
      }

      /* Framework-owned Media Clips (direct timed children) */
      .media-asset {
        object-fit: cover;
        clip-path: inset(270px 60px 1010px 60px round 6px);
      }

      /* Collage Framing Box (nằm trong sibling timed clips) */
      .frame-box {
        position: absolute;
        top: 270px;
        left: 60px;
        width: 960px;
        height: 640px;
        border: 5px solid #141414;
        box-shadow: 12px 12px 0px #ff6a1a;
        border-radius: 6px;
        transform-origin: 50% 50%;
        pointer-events: none;
      }

      .tape-pin {
        position: absolute;
        width: 50px;
        height: 20px;
        background-color: rgba(20, 20, 20, 0.85);
        z-index: 15;
      }
      .tape-left {
        top: -8px;
        left: 40px;
        transform: rotate(-5deg);
      }
      .tape-right {
        top: -8px;
        right: 40px;
        transform: rotate(6deg);
      }

      /* Dòng timeline đồ họa biểu thị cơ chế thích nghi (Mechanism Header) */
      .mechanism-header {
        position: absolute;
        top: 140px;
        left: 60px;
        width: 960px;
        pointer-events: none;
      }

      .category-tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background-color: #141414;
        color: #f7f4ec;
        font-size: 19px;
        font-weight: 900;
        letter-spacing: 2px;
        padding: 6px 14px;
        border-radius: 4px;
        margin-bottom: 10px;
        text-transform: uppercase;
      }

      .tag-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #ff6a1a;
      }

      .timeline-track-card {
        display: flex;
        align-items: center;
        background-color: #f5f0e4;
        border: 3px solid #141414;
        box-shadow: 6px 6px 0px #141414;
        border-radius: 8px;
        padding: 10px 16px;
        gap: 14px;
      }

      .timeline-step {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 14px;
        border-radius: 6px;
        border-width: 2px;
        border-style: solid;
      }

      .step-active {
        background-color: #141414;
        color: #f7f4ec;
        border-color: #141414;
      }

      .step-inactive {
        background-color: #e7e3d9;
        color: #141414;
        border-color: rgba(20, 20, 20, 0.45);
      }

      .step-num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        font-size: 18px;
        font-weight: 900;
        border-width: 2px;
        border-style: solid;
      }

      .step-num-active {
        background-color: #ff6a1a;
        color: #141414;
        border-color: #ff6a1a;
      }

      .step-num-inactive {
        background-color: #f5f0e4;
        color: #141414;
        border-color: #141414;
      }

      .step-txt {
        font-size: 20px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

      .timeline-arrow {
        color: #141414;
        font-weight: 900;
        font-size: 22px;
      }

      /* Inner Elements cho Overlay Cards (định vị qua top/left, giới hạn trên y=1220px) */
      .punch-box {
        position: absolute;
        top: 950px;
        left: 60px;
        width: 960px;
        background-color: #141414;
        border-left: 12px solid #ff6a1a;
        padding: 22px 28px;
        border-radius: 4px;
        box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.45);
      }

      .punch-title {
        font-size: 54px;
        font-weight: 900;
        line-height: 1.15;
        color: #f7f4ec;
        margin: 0 0 6px 0;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .punch-sub {
        font-size: 22px;
        font-weight: 700;
        color: #ff6a1a;
        margin: 0;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .label-box {
        position: absolute;
        top: 950px;
        left: 60px;
        width: 960px;
        background-color: #141414;
        border-left: 14px solid #ff6a1a;
        box-shadow: 8px 8px 0px #ff6a1a;
        padding: 22px 28px;
        border-radius: 4px;
      }

      .label-title {
        font-size: 54px;
        font-weight: 900;
        line-height: 1.15;
        color: #f7f4ec;
        margin: 0 0 6px 0;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .label-sub {
        font-size: 22px;
        font-weight: 700;
        color: #ff6a1a;
        margin: 0;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      /* Floating Icon Badges */
      .icon-box-wrapper {
        position: absolute;
        top: 305px;
        left: 630px;
        width: 360px;
        display: flex;
        align-items: center;
        gap: 12px;
        background-color: #f5f0e4;
        border: 3px solid #141414;
        box-shadow: 6px 6px 0px #141414;
        padding: 10px 18px;
        border-radius: 8px;
      }

      .icon-dark-wrapper {
        background-color: #141414;
        border: 3px solid #ff6a1a;
        box-shadow: 6px 6px 0px #ff6a1a;
      }

      .icon-svg-box {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon-badge-text {
        font-size: 20px;
        font-weight: 900;
        color: #141414;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .icon-badge-text.on-dark {
        color: #f7f4ec;
      }
    </style>

    <!-- Root composition không chứa data-start và không dùng data-layout-* -->
    <div
      id="root"
      data-composition-id="scene-s06"
      data-width="1080"
      data-height="1920"
      data-duration="10.72"
    >
      <!-- Nền giấy ngà + Lưới ô vuông 84px + Spotlight vignette -->
      <div class="bg-grid"></div>
      <div class="vignette-overlay"></div>

      <!-- 1. DIRECT TIMED MEDIA CHILDREN OF ROOT -->
      <!-- Shot 1: Video hổ di chuyển trong rừng rậm (0.0s -> 5.9s) -->
      <video
        id="video-s06-1"
        class="clip media-asset"
        src="assets/vid-04-paper-cut-tigers-in-jungle.mp4"
        muted
        playsinline
        data-start="0"
        data-duration="5.9"
        data-media-start="1"
      ></video>

      <!-- Shot 2: Ảnh minh hoạ gia đình hổ papercraft (5.9s -> 10.72s) -->
      <img
        id="img-s06-2"
        class="clip media-asset"
        src="assets/img-03-tiger-family-jungle-papercraft.jpg"
        data-start="5.9"
        data-duration="4.82"
        alt="Gia đình hổ rừng rậm"
      />

      <!-- 2. SIBLING TIMED COLLAGE FRAMING CLIPS -->
      <!-- Shot 1 Collage Frame (0.0s -> 5.9s) -->
      <div id="clip-s1-frame" class="clip" data-start="0" data-duration="5.9">
        <div id="s1-frame-box" class="frame-box">
          <div class="tape-pin tape-left"></div>
          <div class="tape-pin tape-right"></div>
        </div>
      </div>

      <!-- Shot 2 Collage Frame (5.9s -> 10.72s) -->
      <div id="clip-s2-frame" class="clip" data-start="5.9" data-duration="4.82">
        <div id="s2-frame-box" class="frame-box">
          <div class="tape-pin tape-left"></div>
          <div class="tape-pin tape-right"></div>
        </div>
      </div>

      <!-- 3. TIMELINE MECHANISM HEADER (0.0s -> 10.72s) -->
      <div id="clip-mechanism" class="clip" data-start="0" data-duration="10.72">
        <div id="mech-header" class="mechanism-header">
          <div class="category-tag">
            <span class="tag-dot"></span>
            Cơ Chế Tiến Hóa // Mechanism
          </div>
          <div class="timeline-track-card">
            <div id="step-1" class="timeline-step step-active">
              <span class="step-num step-num-active" id="step-num-1">1</span>
              <span class="step-txt">Dời lại thể chất</span>
            </div>
            <div class="timeline-arrow">→</div>
            <div id="step-2" class="timeline-step step-inactive">
              <span class="step-num step-num-inactive" id="step-num-2">2</span>
              <span class="step-txt">Học kỹ năng săn</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 4. SHOT 1 OVERLAYS -->
      <!-- Punch-phrase "DỜI LẠI THỂ CHẤT" (0.0s -> 5.9s) -->
      <div id="clip-s1-punch" class="clip" data-start="0" data-duration="5.9">
        <div id="s1-punch-box" class="punch-box">
          <h1 class="punch-title">DỜI LẠI THỂ CHẤT</h1>
          <p class="punch-sub">Trục phát triển dồn về sau sinh</p>
        </div>
      </div>

      <!-- Clock icon badge (0.0s -> 5.9s) -->
      <div id="clip-s1-clock" class="clip" data-start="0" data-duration="5.9">
        <div id="s1-clock-box" class="icon-box-wrapper">
          <div class="icon-svg-box">
            <svg viewBox="0 0 100 100" width="40" height="40">
              <circle cx="50" cy="50" r="40" fill="none" stroke="#141414" stroke-width="7" />
              <circle cx="50" cy="50" r="5" fill="#ff6a1a" />
              <line id="clock-h" x1="50" y1="50" x2="50" y2="28" stroke="#141414" stroke-width="7" stroke-linecap="round" />
              <line id="clock-m" x1="50" y1="50" x2="50" y2="18" stroke="#ff6a1a" stroke-width="5" stroke-linecap="round" />
            </svg>
          </div>
          <span class="icon-badge-text">Kéo dài thời gian</span>
        </div>
      </div>

      <!-- 5. SHOT 2 OVERLAYS -->
      <!-- Label "HỌC KỸ NĂNG SĂN" (5.9s -> 10.72s) -->
      <div id="clip-s2-label" class="clip" data-start="5.9" data-duration="4.82">
        <div id="s2-label-box" class="label-box">
          <h1 class="label-title">HỌC KỸ NĂNG SĂN</h1>
          <p class="label-sub">Quan sát &amp; học hỏi từ hổ mẹ</p>
        </div>
      </div>

      <!-- Rise icon badge (5.9s -> 10.72s) -->
      <div id="clip-s2-rise" class="clip" data-start="5.9" data-duration="4.82">
        <div id="s2-rise-box" class="icon-box-wrapper icon-dark-wrapper">
          <div class="icon-svg-box">
            <svg viewBox="0 0 100 100" width="40" height="40">
              <path d="M 18 82 L 82 82" stroke="rgba(247, 244, 236, 0.4)" stroke-width="4" stroke-linecap="round" />
              <path d="M 18 18 L 18 82" stroke="rgba(247, 244, 236, 0.4)" stroke-width="4" stroke-linecap="round" />
              <path
                id="rise-arrow"
                d="M 22 75 L 48 50 L 62 60 L 84 26"
                fill="none"
                stroke="#ff6a1a"
                stroke-width="7"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="stroke-dasharray: 110; stroke-dashoffset: 110;"
              />
              <path
                id="rise-head"
                d="M 68 26 L 84 26 L 84 42"
                fill="none"
                stroke="#ff6a1a"
                stroke-width="7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <span class="icon-badge-text on-dark">Bản lĩnh sinh tồn</span>
        </div>
      </div>

      <!-- Thanh cam thương hiệu cố định mép đáy -->
      <div class="brand-bar"></div>
    </div>

    <!-- GSAP Seekable Timeline Runtime -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // ==========================================
      // SHOT 1 CHOREOGRAPHY (0.0s -> 5.9s)
      // ==========================================

      // 1. Entrance cho khung collage (chỉ animate inner element, không animate timed media/clip owner)
      // Kết thúc chính xác tại rotation 0, không lặp lại yoyo
      tl.fromTo(
        "#s1-frame-box",
        { scale: 0.92, opacity: 0, rotation: -1 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.65, ease: "power3.out" },
        0
      );

      // Header mechanism trượt nhẹ từ trên xuống
      tl.fromTo(
        "#mech-header",
        { y: -25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.1
      );

      // 2. Punch-phrase "DỜI LẠI THỂ CHẤT" (0.6s -> 2.8s)
      tl.fromTo(
        "#s1-punch-box",
        { y: 30, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        0.6
      );
      tl.to(
        "#s1-punch-box",
        { y: -15, opacity: 0, duration: 0.35, ease: "power2.in" },
        2.8
      );

      // 3. Clock icon badge (3.7s -> 5.5s)
      tl.fromTo(
        "#s1-clock-box",
        { scale: 0.8, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        3.7
      );
      tl.fromTo(
        "#clock-h",
        { rotation: 0, transformOrigin: "50px 50px" },
        { rotation: 75, duration: 1.8, ease: "none" },
        3.7
      );
      tl.fromTo(
        "#clock-m",
        { rotation: 0, transformOrigin: "50px 50px" },
        { rotation: 360, duration: 1.8, ease: "none" },
        3.7
      );
      tl.to(
        "#s1-clock-box",
        { opacity: 0, scale: 0.9, duration: 0.3, ease: "power2.in" },
        5.5
      );

      // ==========================================
      // SHOT 2 CHOREOGRAPHY (5.9s -> 10.72s)
      // ==========================================

      // 1. Entrance cho Shot 2 frame (kết thúc tại rotation 0, không yoyo)
      tl.fromTo(
        "#s2-frame-box",
        { scale: 0.94, opacity: 0, rotation: 1 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "power3.out" },
        5.9
      );

      // 2. Chuyển trạng thái timeline mechanism tại mốc 5.9s
      // Chỉ tween borderColor, backgroundColor, color; không dùng shorthand border
      tl.to(
        "#step-1",
        {
          backgroundColor: "#e7e3d9",
          color: "#141414",
          borderColor: "rgba(20, 20, 20, 0.45)",
          duration: 0.25
        },
        5.9
      );
      tl.to(
        "#step-num-1",
        {
          backgroundColor: "#f5f0e4",
          color: "#141414",
          borderColor: "#141414",
          duration: 0.25
        },
        5.9
      );
      tl.to(
        "#step-2",
        {
          backgroundColor: "#141414",
          color: "#f7f4ec",
          borderColor: "#141414",
          duration: 0.25
        },
        5.9
      );
      tl.to(
        "#step-num-2",
        {
          backgroundColor: "#ff6a1a",
          color: "#141414",
          borderColor: "#ff6a1a",
          duration: 0.25
        },
        5.9
      );

      // 3. Label "HỌC KỸ NĂNG SĂN" (6.6s -> 8.6s)
      tl.fromTo(
        "#s2-label-box",
        { y: 30, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        6.6
      );
      tl.to(
        "#s2-label-box",
        { y: -15, opacity: 0, duration: 0.35, ease: "power2.in" },
        8.6
      );

      // 4. Rise icon badge (8.8s -> 10.55s)
      tl.fromTo(
        "#s2-rise-box",
        { scale: 0.82, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        8.8
      );
      tl.fromTo(
        "#rise-arrow",
        { strokeDashoffset: 110 },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        8.9
      );
      tl.fromTo(
        "#rise-head",
        { opacity: 0, scale: 0.5, transformOrigin: "84px 26px" },
        { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" },
        9.4
      );
      tl.to(
        "#s2-rise-box",
        { opacity: 0, scale: 0.95, duration: 0.25, ease: "power2.in" },
        10.55
      );

      // Đăng ký duy nhất 1 timeline gốc trên window.__timelines
      window.__timelines["scene-s06"] = tl;
    </script>
  
    </template>
  </body>
</html>
