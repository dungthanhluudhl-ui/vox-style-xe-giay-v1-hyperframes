      const tl = gsap.timeline({ paused: true });

      // Setup self-drawing SVG checkmark path

      if (checkPath) {
        checkPath.style.strokeDasharray = checkLen;
        checkPath.style.strokeDashoffset = checkLen;

      // 1. Transition in: Unfold card flap from top hinge
      tl.fromTo(
        "#card-flipper",
        { rotationX: -70, scaleY: 0.35, opacity: 0 },
        { rotationX: 0, scaleY: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
        0
      );

      // Header entrance
      tl.fromTo(
        "#scene-header",
        { y: -20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
        0.35
      );

      // 2. Camera Motion: Subtle continuous zoom-in, holding freeze-frame push from 8.0s to 9.32s
      tl.fromTo(
        "#video-tiger",
        { scale: 1.0 },
        { scale: 1.04, duration: 8.0, ease: "none" },
        0
      );
      tl.to(
        "#video-tiger",
        { scale: 1.075, duration: 1.32, ease: "power1.out" },
        8.0
      );

      // 3. Overlay 1: HANG ĐÁ KIÊN CỐ (0.72s to 2.72s)

        "#badge-hang-da",
        { y: -30, opacity: 0, scale: 0.88 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        0.72
      );
      tl.to(
        "#badge-hang-da",
        { y: -15, opacity: 0, scale: 0.95, duration: 0.35, ease: "power2.in" },
        2.72
      );

      // 4. Overlay 2: Checkmark Badge (3.52s to 5.32s)

        "#badge-check",
        { scale: 0, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        3.52
      );
      tl.fromTo(
        "#check-mark-path",
        { strokeDashoffset: checkLen },
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        3.72
      );
      tl.to(
        "#badge-check",
        { scale: 0.85, opacity: 0, duration: 0.35, ease: "power2.in" },
        5.32

        { y: 30, opacity: 0, scale: 0.9 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        6.22
      );
      tl.to(
        "#badge-la-chan",
        { opacity: 0, y: 15, duration: 0.4, ease: "power2.in" },
        8.22
      );

      window.__timelines["scene-s05"] = tl;
