<!doctype html>
<html lang="vi" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0a; }
      #root { width: 100%; height: 100%; position: relative; }
      /* isolation: isolate bắt buộc — mỗi slot .clip (scene hoặc caption-track) PHẢI tự tạo
         stacking context riêng. Thiếu dòng này, z-index dùng NỘI BỘ trong 1 sub-composition
         (rất phổ biến, vd overlay/dissolve/punch-card) sẽ "thoát" ra ngoài và cạnh tranh trực
         tiếp ở stacking context gốc của trang, có thể đè lên slot khác (kể cả caption-track dù
         nó luôn nằm SAU trong DOM) — lỗi thật đã gặp: caption-track hoàn toàn bị che khuất suốt
         đúng thời lượng 1 scene (S01) dùng z-index nội bộ tới 20, dù data-track-index của
         caption-track (1) cao hơn scene (0) — track-index KHÔNG quyết định layering (xem
         hyperframes-core/references/tracks-and-clips.md), chỉ CSS z-index/stacking context mới
         quyết định, nên phải chặn rò rỉ ngay ở tầng ráp tất định này. */
      .clip { position: absolute; inset: 0; isolation: isolate; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="59.820000"
      data-width="1080"
      data-height="1920"
    >
      <audio
        id="narration"
        data-start="0"
        src="assets/narration.mp3"
      ></audio>
      <div
        id="slot-scene-s01"
        class="clip"
        data-composition-id="scene-s01"
        data-composition-src="compositions/scene-s01.html"
        data-start="0.000000"
        data-duration="6.560000"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="slot-scene-s02"
        class="clip"
        data-composition-id="scene-s02"
        data-composition-src="compositions/scene-s02.html"
        data-start="6.560000"
        data-duration="5.960000"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="slot-scene-s03"
        class="clip"
        data-composition-id="scene-s03"
        data-composition-src="compositions/scene-s03.html"
        data-start="12.520000"
        data-duration="8.200000"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="slot-scene-s04"
        class="clip"
        data-composition-id="scene-s04"
        data-composition-src="compositions/scene-s04.html"
        data-start="20.720000"
        data-duration="10.560000"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="slot-scene-s05"
        class="clip"
        data-composition-id="scene-s05"
        data-composition-src="compositions/scene-s05.html"
        data-start="31.280000"
        data-duration="9.320000"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="slot-scene-s06"
        class="clip"
        data-composition-id="scene-s06"
        data-composition-src="compositions/scene-s06.html"
        data-start="40.600000"
        data-duration="10.720000"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="slot-scene-s07"
        class="clip"
        data-composition-id="scene-s07"
        data-composition-src="compositions/scene-s07.html"
        data-start="51.320000"
        data-duration="8.500000"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="slot-caption-track"
        class="clip"
        data-composition-id="caption-track"
        data-composition-src="compositions/caption-track.html"
        data-start="0.000000"
        data-duration="59.820000"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
