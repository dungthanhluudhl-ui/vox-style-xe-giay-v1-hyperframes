<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    :root {
      --paper: #E7E3D9;
      --card: #F5F0E4;
      --ink: #141414;
      --orange: #FF6A1A;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: "Be Vietnam Pro", sans-serif;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    .chart {
      position: absolute;
      inset: 0;
      background: var(--paper);
      overflow: hidden;
    }

    .chart::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 83px,
        rgba(20, 20, 20, .32) 83px,
        rgba(20, 20, 20, .32) 84.5px
      );
      opacity: .42;
    }

    .chart-rule {
      position: absolute;
      left: 108px;
      right: 108px;
      height: 3px;
      background: var(--ink);
      opacity: .65;
    }

    .chart-rule::before {
      content: "";
      position: absolute;
      left: -48px;
      top: -10px;
      width: 30px;
      height: 23px;
      background: var(--orange);
    }

    .rule-one { top: 384px; }
    .rule-two { top: 716px; }
    .rule-three { top: 1048px; }
    .rule-four { top: 1380px; }

    .timeline-wheel {
      position: absolute;
      left: 100px;
      top: 330px;
      width: 880px;
      height: 880px;
      display: grid;
      place-items: center;
      transform-origin: center;
    }

    .wheel-ring {
      position: absolute;
      width: 760px;
      height: 760px;
      border: 7px solid var(--ink);
      border-radius: 50%;
    }

    .wheel-ring::before,
    .wheel-ring::after {
      content: "";
      position: absolute;
      left: 50%;
      top: -22px;
      width: 7px;
      height: 800px;
      background: var(--ink);
      transform-origin: center;
    }

    .wheel-ring::after { transform: rotate(90deg); }

    .wheel-inner {
      position: absolute;
      width: 605px;
      height: 605px;
      border: 3px dashed var(--ink);
      border-radius: 50%;
      opacity: .65;
    }

    .wheel-core {
      position: relative;
      z-index: 2;
      width: 610px;
      padding: 32px 12px 38px;
      background: var(--paper);
      border: 5px solid var(--ink);
      text-align: center;
    }

    .wheel-number {
      font-size: 236px;
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -16px;
    }

    .wheel-unit {
      display: inline-block;
      padding: 3px 35px 8px;
      background: var(--ink);
      color: var(--card);
      font-size: 67px;
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: 7px;
    }

    .ruler {
      position: absolute;
      left: 120px;
      right: 120px;
      top: 1325px;
      height: 62px;
      border-top: 7px solid var(--ink);
      display: flex;
      justify-content: space-between;
    }

    .ruler-tick {
      width: 5px;
      height: 36px;
      background: var(--ink);
    }

    .ruler-tick:nth-child(3) {
      height: 57px;
      width: 11px;
      background: var(--orange);
    }

    .ruler-pointer {
      position: absolute;
      top: 1269px;
      left: calc(50% - 23px);
      width: 0;
      height: 0;
      border-left: 23px solid transparent;
      border-right: 23px solid transparent;
      border-top: 37px solid var(--orange);
    }

    .punch-clip { z-index: 5; pointer-events: none; }

    .punch-card {
      position: absolute;
      left: 72px;
      right: 72px;
      top: 1010px;
      padding: 28px 35px 36px;
      background: var(--orange);
      border: 6px solid var(--ink);
      color: var(--ink);
      text-align: center;
      font-size: 83px;
      font-weight: 900;
      line-height: 1.24;
      letter-spacing: -2px;
    }

    .document-scene {
      position: absolute;
      inset: 0;
      background: var(--card);
    }

    .document-scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 166px,
        rgba(20, 20, 20, .12) 166px,
        rgba(20, 20, 20, .12) 168px
      );
    }

    .document-page {
      position: absolute;
      left: 88px;
      right: 88px;
      top: 258px;
      height: 1110px;
      background: var(--paper);
      border: 5px solid var(--ink);
      box-shadow: 20px 20px 0 var(--ink);
      overflow: hidden;
    }

    .document-page::before {
      content: "";
      position: absolute;
      inset: 23px;
      border: 2px solid rgba(20, 20, 20, .45);
      pointer-events: none;
    }

    .document-lines {
      position: absolute;
      left: 110px;
      right: 110px;
      top: 155px;
      height: 90px;
      border-top: 5px solid var(--ink);
      border-bottom: 2px solid var(--ink);
      opacity: .72;
    }

    .document-lines::after {
      content: "";
      position: absolute;
      left: 24%;
      top: 39px;
      width: 52%;
      height: 3px;
      background: var(--ink);
    }

    .stamp {
      position: absolute;
      left: 218px;
      top: 340px;
      width: 470px;
      height: 470px;
      border: 24px double var(--orange);
      border-radius: 50%;
      display: grid;
      place-items: center;
      transform-origin: center;
    }

    .stamp::before {
      content: "";
      position: absolute;
      inset: 22px;
      border: 6px solid var(--orange);
      border-radius: 50%;
    }

    .stamp::after {
      content: "";
      position: absolute;
      left: -64px;
      right: -64px;
      top: 50%;
      height: 16px;
      background: var(--orange);
      transform: rotate(-18deg);
      transform-origin: center;
      z-index: 0;
    }

    .stamp-center {
      position: relative;
      z-index: 1;
      width: 255px;
      height: 255px;
      display: grid;
      place-items: center;
      background: var(--orange);
      border: 7px solid var(--ink);
      color: var(--ink);
      font-size: 155px;
      font-weight: 900;
      line-height: 1;
    }

    .seal-caption {
      position: absolute;
      left: 130px;
      right: 130px;
      bottom: 122px;
      height: 6px;
      background: var(--ink);
    }

    .strike {
      position: absolute;
      z-index: 3;
      left: 0;
      top: 550px;
      width: 100%;
      height: 18px;
      background: var(--orange);
      transform-origin: left center;
    }

    .label-clip {
      z-index: 4;
      pointer-events: none;
    }

    .label-one,
    .label-two {
      position: absolute;
      left: 92px;
      right: 92px;
      padding: 22px 28px 29px;
      background: var(--ink);
      color: var(--card);
      text-align: center;
      font-weight: 900;
      line-height: 1.3;
    }

    .label-one {
      top: 310px;
      font-size: 67px;
    }

    .label-two {
      top: 1110px;
      font-size: 57px;
    }

    .bottom-bar {
      position: absolute;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 0;
      height: 15px;
      background: var(--orange);
    }
  </style>

  <div id="root"
       data-composition-id="scene-s10"
       data-start="0"
       data-width="1080"
       data-height="1920"
       data-fps="30"
       data-duration="10.7">

    <section id="time-shot" class="clip" data-start="0" data-duration="5.62" data-track-index="0">
      <div class="chart" aria-hidden="true">
        <div class="chart-rule rule-one"></div>
        <div class="chart-rule rule-two"></div>
        <div class="chart-rule rule-three"></div>
        <div class="chart-rule rule-four"></div>
      </div>

      <div id="time-wheel" class="timeline-wheel" data-layout-allow-overflow>
        <div id="outer-ring" class="wheel-ring" aria-hidden="true"></div>
        <div id="inner-ring" class="wheel-inner" aria-hidden="true"></div>
        <div class="wheel-core">
          <div class="wheel-number">500</div>
          <div class="wheel-unit">NĂM</div>
        </div>
      </div>

      <div class="ruler" aria-hidden="true">
        <i class="ruler-tick"></i>
        <i class="ruler-tick"></i>
        <i class="ruler-tick"></i>
        <i class="ruler-tick"></i>
        <i class="ruler-tick"></i>
      </div>
      <div id="ruler-pointer" class="ruler-pointer" aria-hidden="true"></div>
    </section>

    <section id="document-shot" class="clip" data-start="5.62" data-duration="5.08" data-track-index="0">
      <div class="document-scene">
        <div id="document-page" class="document-page">
          <div class="document-lines" aria-hidden="true"></div>
          <div id="royal-stamp" class="stamp" aria-hidden="true">
            <div class="stamp-center">15</div>
          </div>
          <div class="seal-caption" aria-hidden="true"></div>
        </div>
        <div id="seal-strike" class="strike" aria-hidden="true"></div>
      </div>
    </section>

    <section id="punch-shot" class="clip punch-clip"
             data-start="4.35" data-duration="2.2" data-track-index="2">
      <div id="time-punch" class="punch-card">500 NĂM TRƯỚC</div>
    </section>

    <section id="century-label-shot" class="clip label-clip"
             data-start="6.14" data-duration="2" data-track-index="3">
      <div id="century-label" class="label-one">THẾ KỶ 15 JOSEON</div>
    </section>

    <section id="king-label-shot" class="clip label-clip"
             data-start="8.57" data-duration="2.1" data-track-index="3">
      <div id="king-label" class="label-two">TRIỀU VUA SEONGJONG</div>
    </section>

    <div class="bottom-bar" aria-hidden="true"></div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // The time marker spirals into place, then retreats to make room for the era.
    tl.fromTo("#time-wheel",
      { scale: 1.85, rotation: -260, opacity: 0 },
      { scale: 1, rotation: 0, opacity: 1, duration: 1.05, ease: "power4.out" },
      0
    );
    tl.fromTo("#outer-ring",
      { rotation: -90 },
      { rotation: 18, duration: 3.1, ease: "power2.out" },
      0.45
    );
    tl.fromTo("#inner-ring",
      { rotation: 65 },
      { rotation: -24, duration: 3.4, ease: "power2.out" },
      0.45
    );
    tl.fromTo("#ruler-pointer",
      { x: -290, opacity: 0 },
      { x: 0, opacity: 1, duration: 1.15, ease: "power3.out" },
      1.6
    );
    tl.fromTo("#time-wheel",
      { scale: 1, y: 0, rotation: 0 },
      { scale: 0.46, y: -280, rotation: 26, duration: 1.05, ease: "power3.inOut",
        immediateRender: false },
      3.75
    );

    // A single punch phrase bridges the two shots without duplicating its text.
    tl.fromTo("#time-punch",
      { y: 85, scale: 0.88, opacity: 0 },
      { y: 0, scale: 1, opacity: 1, duration: 0.48, ease: "power4.out" },
      4.35
    );
    tl.to("#time-punch",
      { y: -65, scale: 0.88, opacity: 0, duration: 0.43,
        ease: "power2.in", immediateRender: false },
      6.08
    );

    // The document arrives with a sharp strike; its seal lands afterward.
    tl.fromTo("#document-page",
      { y: 95, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.62, ease: "power3.out" },
      5.62
    );
    tl.fromTo("#seal-strike",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.36, ease: "power4.out" },
      5.62
    );
    tl.to("#seal-strike",
      { opacity: 0, duration: 0.3, ease: "power1.out" },
      6.05
    );
    tl.fromTo("#century-label",
      { y: 35, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      6.14
    );
    tl.fromTo("#royal-stamp",
      { scale: 1.45, rotation: -17, opacity: 0 },
      { scale: 1, rotation: -8, opacity: 1, duration: 0.55, ease: "power4.out" },
      7.08
    );
    tl.fromTo("#king-label",
      { y: 38, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.48, ease: "power3.out" },
      8.57
    );

    window.__timelines["scene-s10"] = tl;
  </script>

    </template>
  </body>
</html>
