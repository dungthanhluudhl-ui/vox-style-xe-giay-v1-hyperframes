    <script>
      const tl = gsap.timeline({ paused: true });

      // Year 1476 pulse accent at t = 1.0s

        "#s1-axis-dot-active",
        { scale: 1.0 },
        { scale: 1.45, duration: 0.35, ease: "power2.out" },

        { scale: 1.0, duration: 0.25, ease: "power1.out" },

      // Punch-phrase overlay entrance: "NĂM 1476" (atMs: 137470 -> t = 1.86s)

        "#s1-punch-card",
        { y: -20, opacity: 0, duration: 0.35, ease: "power2.in" },

      // ==========================================
      // SHOT 2 ANIMATIONS (5.67s -> 11.05s)
      // Camera Motion: Pan-down
      // ==========================================

      // Cut transition into Shot 2
      tl.fromTo(
        "#s2-photo-wrap",
        { opacity: 0 },
        { opacity: 1, duration: 0.1, ease: "power1.out" },
        5.67
      );

      // Camera Pan-Down on baby prince in mother's arms
      tl.fromTo(
        "#s2-bg-img",
        { scale: 1.35, y: -40 },
        { scale: 1.38, y: 35, duration: 5.38, ease: "power1.inOut" },

        { scale: 1.0, opacity: 1, duration: 0.5, ease: "power2.out" },
        6.2

      tl.fromTo(

        { strokeDasharray: pathLength, strokeDashoffset: pathLength },
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },

        { scale: 0, transformOrigin: "540px 1076px" },
        { scale: 1.0, duration: 0.25, ease: "power2.out" },

        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        8.73

      // Label card hold 2200ms -> biến mất đúng sau khi hold hết 2200ms (t = 10.93s)
      tl.to(
        "#s2-label-card",
        { y: -20, opacity: 0, duration: 0.12, ease: "power1.in" },
        10.93
      );

      // Reticle and branch exit at 10.93s
      tl.to(
        ["#s2-target-box", "#s2-genealogy-svg"],
        { opacity: 0, duration: 0.12, ease: "power1.in" },
        10.93
