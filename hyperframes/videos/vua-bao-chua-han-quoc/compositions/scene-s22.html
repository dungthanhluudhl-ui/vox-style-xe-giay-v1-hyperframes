  <div id="root" data-composition-id="scene-s22" data-width="1080" data-height="1920" data-duration="6.44">
    <!-- Nền lưới toạ độ Vox -->

  <script>
    // Khởi tạo GSAP Timeline tuân thủ chặt chẽ HyperFrames Deterministic Contract
    const tl = gsap.timeline({ paused: true });

    // 1. Giai đoạn mở đầu (t = 0.0s - 1.2s):
    // Header xuất hiện với nhịp rơi đầm
    tl.fromTo("#header-box", 
      { y: -30, opacity: 0 }, 
      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 
      0.1
    );

    // Cột trái "HẬU CUNG ĐÔNG ĐẢO" tiến vào (t = 0.35s)
    tl.fromTo("#col-left",
      { y: 50, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
      0.35
    );

    // Chi tiết thái độ "Tôi không nói" nhấn nhẹ
    tl.fromTo("#status-left",
      { scale: 0.9, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power2.out" },
      0.85
    );

    // 2. Giai đoạn đối nghịch (t = 1.4s - 2.4s):
    // Cột phải "RA NGOÀI KỸ VIỆN" tiến vào gắt hơn
    tl.fromTo("#col-right",
      { y: 50, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
      1.4
    );

    tl.fromTo("#status-right",
      { scale: 0.9, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power2.out" },
      1.9
    );

    // 3. Camera slow zoom-in dần toàn cảnh (2.0s -> 6.44s) tạo căng thẳng
    tl.to("#camera-frame", {
      scale: 1.03,
      duration: 4.44,
      ease: "none"
    }, 2.0);

    // 4. PUNCH-PHRASE: DẤU MỘC "SAI QUY TẮC" GIÁNG XUỐNG (t = 3.48s, đúng 213300ms)
    // Hiệu ứng "strike": rơi từ trên cao cực nhanh, va đập rung chuyển
    tl.fromTo("#stamp-wrapper",
      {
        scale: 2.8,
        rotation: 18,
        opacity: 0,
        y: -40
      },
      {
        scale: 1,
        rotation: -7,
        opacity: 1,
        y: 0,
        duration: 0.24,
        ease: "power4.in"
      },
      3.48
    );

    // Chấn động va chạm (Screen shockwave & tremor)
    tl.fromTo("#stamp-wave",
      { scale: 0.2, opacity: 0.9 },
      { scale: 3.2, opacity: 0, duration: 0.45, ease: "power2.out" },
      3.72
    );

    // Rung giật cột bên phải do bị đóng dấu mạnh
    tl.to("#col-right", { x: 8, duration: 0.04, yoyo: true, repeat: 3, ease: "power1.inOut" }, 3.72);
    tl.to("#col-right", { x: 0, duration: 0.05 }, 3.88);

    // 5. LABEL: "CÃI VÃ TRIỀN MIÊN" XUẤT HIỆN (t = 5.47s, đúng 215290ms)
    // Bật lên như nhát cắt dứt khoát xác nhận kết cục bất hòa
    tl.fromTo("#conflict-wrapper",
      {
        y: 35,
        scale: 0.94,
        opacity: 0
      },
      {
        y: 0,
        scale: 1,
        opacity: 1,
        duration: 0.35,
        ease: "back.out(1.4)"
      },
      5.47
    );

    // Rung động nhẹ biểu thị xung đột âm ỉ đến hết scene
    tl.to("#conflict-wrapper", {
      x: 3,
      duration: 0.08,
      repeat: 5,
      yoyo: true,
      ease: "sine.inOut"
    }, 5.85);
    tl.to("#conflict-wrapper", { x: 0, duration: 0.05 }, 6.25);

    // BẮT BUỘC: Đăng ký timeline cho HyperFrames seek engine
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s22"] = tl;
  </script>
