    <script>
      // 1. Setup SVG stroke geometry for progressive self-drawing
      const pathsToMeasure = [
        document.getElementById("path-stem"),
        document.getElementById("path-left"),
        document.getElementById("path-center"),
        document.getElementById("path-right"),
        document.getElementById("target-circle-main"),
        document.getElementById("target-ring-dashed"),
        document.getElementById("bracket-tl"),
        document.getElementById("bracket-tr"),
        document.getElementById("bracket-bl"),
        document.getElementById("bracket-br")
      ];
      pathsToMeasure.forEach(p => {
        if (p && p.getTotalLength) {
          const len = p.getTotalLength();
          p.style.strokeDasharray = len;
          p.style.strokeDashoffset = len;
        }
      });

      // Hide target lock ticks and tag initially
      gsap.set(["#tick-12", "#tick-6", "#tick-9", "#tick-3"], {
        opacity: 0,
        scale: 0.5,
        transformOrigin: "540px 675px"
      });
      gsap.set("#target-lock-tag", {
        opacity: 0,
        scale: 0.8
      });

      // 2. Initialize Paused GSAP Timeline
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 0.0s: Transition in - rise
      tl.fromTo("#scene-content",
        { y: 45, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0
      );

      // Continuous subtle camera pan-left
      tl.fromTo("#camera-rig",
        { x: 15 },
        { x: -15, duration: 5.66, ease: "none" },
        0
      );

      // 0.25s: King card enters
      tl.fromTo("#node-king",
        { y: -20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.25
      );

      // 0.75s: SVG stem path draws down
      tl.to("#path-stem",
        { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
        0.75
      );

      // 1.05s: Branch paths draw outward to candidates
      tl.to(["#path-left", "#path-center", "#path-right"], {
        strokeDashoffset: 0,
        duration: 0.45,
        ease: "power2.out",
        stagger: 0.08
      }, 1.05);

      // 1.57s: SHOTLIST OVERLAY - Label "TÌM KIẾM VƯƠNG PHI" (atMs: 120130 -> 1.57s)
      tl.fromTo("#search-label-overlay",
        { scale: 0.75, opacity: 0, y: 10 },
        { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        1.57
      );

      // 1.85s: Candidate nodes reveal
      tl.fromTo("#card-clan-han",
        { y: 25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        1.85
      );
      tl.fromTo("#hero-yoon-node",
        { scale: 0.9, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.95
      );
      tl.fromTo("#card-clan-kim",
        { y: 25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        2.05
      );

      // 2.15s: Bottom result card reveals early so it doesn't distract from the climax
      tl.fromTo("#bottom-result",
        { y: 25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        2.15
      );

      // 2.45s: Rejection stamps slam down on side candidates
      tl.fromTo("#stamp-han",
        { scale: 1.5, opacity: 0, rotation: -16 },
        { scale: 1, opacity: 1, rotation: -8, duration: 0.25, ease: "power2.out" },
        2.45
      );
      tl.fromTo("#stamp-kim",
        { scale: 1.5, opacity: 0, rotation: 16 },
        { scale: 1, opacity: 1, rotation: 8, duration: 0.25, ease: "power2.out" },
        2.60
      );

      // 2.75s: Dim rejected candidates to isolate Yoon Thị in the center
      tl.to(["#card-clan-han", "#card-clan-kim"], {
        opacity: 0.45,
        duration: 0.35,
        ease: "power2.out"
      }, 2.75);

      // 3.0s: SHOTLIST REQUIREMENT - "kết thúc bằng vòng tròn cam khóa nét"
      // VÒNG TRÒN CAM CHÍNH KHÓA NÉT vẽ ôm trọn chân dung Yoon thị
      tl.to("#target-circle-main", {
        strokeDashoffset: 0,
        duration: 0.65,
        ease: "power2.out"
      }, 3.0);

      // 3.25s: Vòng định vị nét đứt bên ngoài vẽ theo
      tl.to("#target-ring-dashed", {
        strokeDashoffset: 0,
        duration: 0.5,
        ease: "power2.out"
      }, 3.25);

      // 3.45s: Bốn góc ngắm khóa nét L-brackets xuất hiện
      tl.to(["#bracket-tl", "#bracket-tr", "#bracket-bl", "#bracket-br"], {
        strokeDashoffset: 0,
        duration: 0.3,
        ease: "power2.out",
        stagger: 0.03
      }, 3.45);

      // 3.55s: Bốn vạch reticle ticks khóa chặt mục tiêu
      tl.to(["#tick-12", "#tick-6", "#tick-9", "#tick-3"], {
        opacity: 1,
        scale: 1,
        duration: 0.25,
        ease: "power3.out",
        stagger: 0.03
      }, 3.55);

      // 3.60s: Tag tiêu đề khóa nét bật lên
      tl.to("#target-lock-tag", {
        opacity: 1,
        scale: 1,
        duration: 0.25,
        ease: "power3.out"
      }, 3.60);

      // 3.73s: SHOTLIST OVERLAY - Icon "pin" (atMs: 122290 -> 3.73s)
      // Ghim thẳng vào góc trên của vòng tròn cam đã khóa nét
      tl.fromTo("#pin-icon",
        { y: -50, scale: 2.2, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        3.73
      );

      // Register timeline for HyperFrames renderer
      window.__timelines["scene-s13"] = tl;
    </script>
  
    </template>
  </body>
</html>
