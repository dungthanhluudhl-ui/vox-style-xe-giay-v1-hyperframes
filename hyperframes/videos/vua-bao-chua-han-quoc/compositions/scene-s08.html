      // Chuẩn bị đường nét tự vẽ cho SVG paths (Icon Doc & Clock)
      function prepareSvgPath(elementId) {
        const el = document.getElementById(elementId);
        if (el && el.getTotalLength) {
          const len = el.getTotalLength();
          el.style.strokeDasharray = len + "";
          el.style.strokeDashoffset = len + "";
          return len;
        }
        return 0;
      }

      const lenDocBorder = prepareSvgPath("doc-path-border");
      const lenDocFold = prepareSvgPath("doc-path-fold");
      const lenClockRim = prepareSvgPath("clock-rim");

      // Set trạng thái ban đầu tường minh để đảm bảo seekable & deterministic
      gsap.set("#shot-1", { opacity: 1 });
      gsap.set("#shot-2", { opacity: 0 });

      // Ban đầu ẩn các thành phần con để kích hoạt vào đúng beat
      gsap.set("#doc-icon-box", { scale: 0, opacity: 0 });
      gsap.set("#s1-label", { scale: 0.9, opacity: 0, y: 20 });
      gsap.set("#punch-box", { scale: 0.85, opacity: 0, y: 30 });
      gsap.set("#m-1750", { opacity: 0.3 });
      gsap.set("#m-1450", { opacity: 0.2 });

      /* ========================================================
         PHASE 1: SHOT S08-1 (0.00s -> 5.14s)
         ======================================================== */

      // 0.0s - 0.7s: Cuốn sổ tay mở ra với hiệu ứng "peel" (từ góc lật mở và scale)
      tl.fromTo(
        "#card-1",
        { scaleY: 0.7, scaleX: 0.92, rotation: -3, opacity: 0 },
        { scaleY: 1, scaleX: 1, rotation: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.05
      );

      // Sticker washi tape dán xuống ngay sau khi mở sổ
      tl.fromTo(
        "#tape-1",
        { y: -30, opacity: 0, rotation: -12 },
        { y: 0, opacity: 1, rotation: -6, duration: 0.35, ease: "power2.out" },
        0.35
      );
      tl.fromTo(
        "#tape-2",
        { y: -30, opacity: 0, rotation: 12 },
        { y: 0, opacity: 1, rotation: 5, duration: 0.35, ease: "power2.out" },
        0.45
      );

      // Đóng mộc lưu trữ "CHÍNH SỬ"
      tl.fromTo(
        "#seal-1",
        { scale: 1.6, opacity: 0, rotation: 25 },
        { scale: 1, opacity: 1, rotation: 12, duration: 0.45, ease: "power3.out" },
        0.6
      );

      // Camera motion: zoom-in nhẹ từ từ tạo chiều sâu khám phá
      tl.fromTo(
        "#rig-1",
        { scale: 0.97 },
        { scale: 1.04, duration: 5.0, ease: "sine.inOut" },
        0
      );

      // atMs = 65980 -> tương đối trong scene = (65980 - 64960) / 1000 = 1.02s
      // Icon "doc" xuất hiện dạng spring-pop + stroke draw
      tl.fromTo(
        "#doc-icon-box",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        1.02
      );
      if (lenDocBorder > 0) {
        tl.to("#doc-path-border", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 1.15);
      }
      if (lenDocFold > 0) {
        tl.to("#doc-path-fold", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 1.35);
      }

      // atMs = 66890 -> tương đối trong scene = (66890 - 64960) / 1000 = 1.93s
      // Label "THU THẬP TƯ LIỆU" xuất hiện chắc nịch
      tl.fromTo(
        "#s1-label",
        { scale: 0.88, opacity: 0, y: 16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.93
      );

      // Giữ shot 1 hiển thị hoàn chỉnh đến 4.85s rồi mờ nhẹ chuyển giao sang shot 2
      tl.to(
        "#shot-1",
        { opacity: 0, duration: 0.28, ease: "power2.inOut" },
        4.86
      );

      /* ========================================================
         PHASE 2: SHOT S08-2 (5.14s -> 11.48s)
         ======================================================== */

      // 5.14s: Shot 2 bắt đầu hiện lên bằng dissolve (crossfade)
      tl.to(
        "#shot-2",
        { opacity: 1, duration: 0.3, ease: "power2.out" },
        5.14
      );

      // Bố cục lõi Shot 2 trồi lên vững chãi
      tl.fromTo(
        "#s2-core",
        { scale: 0.95, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        5.25
      );

      // atMs = 71430 -> tương đối trong scene = (71430 - 64960) / 1000 = 6.47s
      // Icon "clock": Vòng tròn đồng hồ vẽ xong, 2 kim xoay tít ngược chiều đưa về quá khứ
      if (lenClockRim > 0) {
        tl.to("#clock-rim", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 6.2);
      }
      // Kim phút xoay ngược 2 vòng (-720 độ)
      tl.fromTo(
        "#clock-hand-min",
        { rotation: 0 },
        { rotation: -720, duration: 2.8, ease: "power2.inOut" },
        6.47
      );
      // Kim giờ xoay ngược (-270 độ)
      tl.fromTo(
        "#clock-hand-hour",
        { rotation: 0 },
        { rotation: -270, duration: 2.8, ease: "power2.inOut" },
        6.47
      );

      // Trục thời gian cuộn ngược chạy từ 2026 xuống 1450
      tl.to(
        "#track-progress",
        { height: "460px", duration: 2.2, ease: "power2.out" },
        6.8
      );

      // Mốc 1750 sáng lên khi dòng thời gian lướt qua
      tl.to(
        "#m-1750",
        { opacity: 1, duration: 0.4, ease: "power2.out" },
        7.4
      );
      tl.to(
        "#node-1750",
        { background: "#FF6A1A", duration: 0.3 },
        7.4
      );

      // Mốc thế kỷ 15 (Joseon) bừng sáng hoàn chỉnh
      tl.to(
        "#m-1450",
        { opacity: 1, duration: 0.5, ease: "power3.out" },
        8.3
      );
      tl.fromTo(
        "#node-1450",
        { scale: 0.8 },
        { scale: 1.25, duration: 0.4, ease: "back.out(1.5)" },
        8.5
      );

      // atMs = 74770 -> tương đối trong scene = (74770 - 64960) / 1000 = 9.81s
      // Punch-phrase "NGƯỢC DÒNG 500 NĂM" xuất hiện dứt khoát, uy lực, giữ đến hết scene
      tl.fromTo(
        "#punch-box",
        { scale: 0.85, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        9.81
      );

      // Đăng ký timeline chính thức vào HyperFrames registry
      window.__timelines["scene-s08"] = tl;
    </script>
  
    </template>
  </body>
</html>
