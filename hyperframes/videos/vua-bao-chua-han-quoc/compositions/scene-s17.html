  <script>
    // Initialize Master Timeline in paused mode
    const tl = gsap.timeline({ paused: true });

    // -------------------------------------------------------------------------
    // SETUP INITIAL STATES (Seek-safe explicit setup)
    // -------------------------------------------------------------------------
    // Shot 1
    gsap.set("#s1-header", { opacity: 0, y: -30 });
    gsap.set("#s1-card-king", { opacity: 0, y: 80, scale: 0.94 });
    gsap.set("#s1-card-queen", { opacity: 0, y: 100, x: -30 });
    gsap.set("#s1-card-prince", { opacity: 0, y: 100, x: 30 });
    gsap.set("#s1-center-seal", { opacity: 0, scale: 0.2, rotation: -25 });
    gsap.set("#s1-punch-card", { opacity: 0, scale: 0.85, y: 30 });

    // Shot 2
    gsap.set("#s2-cam", { scale: 1 });
    gsap.set("#s2-header", { opacity: 0, y: -30 });
    gsap.set("#s2-throne", { opacity: 0, y: -40, scale: 0.92 });
    gsap.set("#s2-pill-1", { opacity: 0, x: -40 });
    gsap.set("#s2-pill-2", { opacity: 0, x: 40 });
    gsap.set("#s2-dest", { opacity: 0, y: 60 });
    gsap.set("#s2-punch-card", { opacity: 0, scale: 0.85, y: 30 });

    // Setup SVG line measurements for draw effect
    const lKQ = document.getElementById("s1-line-kq");
    const lKP = document.getElementById("s1-line-kp");
    const lQP = document.getElementById("s1-line-qp");
    if (lKQ && lKP && lQP) {
      const lenKQ = lKQ.getTotalLength ? lKQ.getTotalLength() : 500;
      const lenKP = lKP.getTotalLength ? lKP.getTotalLength() : 500;
      const lenQP = lQP.getTotalLength ? lQP.getTotalLength() : 540;
      gsap.set(lKQ, { strokeDasharray: lenKQ, strokeDashoffset: lenKQ });
      gsap.set(lKP, { strokeDasharray: lenKP, strokeDashoffset: lenKP });
      gsap.set(lQP, { strokeDasharray: lenQP, strokeDashoffset: lenQP });
    }

    const pLeft = document.getElementById("s2-path-left");
    const pCenter = document.getElementById("s2-path-center");
    const pRight = document.getElementById("s2-path-right");
    if (pLeft && pCenter && pRight) {
      const lenFlow = 320;
      gsap.set([pLeft, pCenter, pRight], { strokeDasharray: lenFlow, strokeDashoffset: lenFlow });
    }

    // -------------------------------------------------------------------------
    // ANIMATION CHOREOGRAPHY: SHOT 1 (0.00s -> 6.34s)
    // -------------------------------------------------------------------------
    // 1. Header entrance (0.15s)
    tl.to("#s1-header", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.15);

    // 2. King Card rises up (0.35s)
    tl.to("#s1-card-king", { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 0.35);

    // 3. SVG guide lines trace down from King to base (0.75s)
    if (lKQ && lKP) {
      tl.to(lKQ, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 0.75);
      tl.to(lKP, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 0.85);
    }

    // 4. Queen & Prince cards arrive and lock the base (1.1s)
    tl.to("#s1-card-queen", { opacity: 1, y: 0, x: 0, duration: 0.65, ease: "power3.out" }, 1.1);
    tl.to("#s1-card-prince", { opacity: 1, y: 0, x: 0, duration: 0.65, ease: "power3.out" }, 1.25);
