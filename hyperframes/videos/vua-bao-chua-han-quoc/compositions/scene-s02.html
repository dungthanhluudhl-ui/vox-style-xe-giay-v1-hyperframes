    <script>
      // 1. Measure all SVG stroke lengths dynamically for exact, seekable drawing
      document.querySelectorAll(".draw-path").forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = len + "";
        p.style.strokeDashoffset = len + "";
      });

      // 2. Build seek-safe GSAP Master Timeline
      const tl = gsap.timeline({ paused: true });

      // ==================== SHOT 1 (0.00s -> 4.63s) ====================
      // Antenna entrance
      tl.fromTo(
        "#tv-antenna",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.1
      );
      tl.fromTo(
        ".antenna-line",
        { strokeDashoffset: 160 },
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        0.15
      );

      // TV Chassis unfold entrance
      tl.fromTo(
        "#tv-wrapper",
        { scaleY: 0.15, scaleX: 0.85, opacity: 0 },
        { scaleY: 1, scaleX: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.2
      );

      // TV Screen waveforms draw
      const waveFront = document.getElementById("tv-wave-front");
      const waveBack = document.getElementById("tv-wave-back");
      const frontLen = waveFront ? waveFront.getTotalLength() : 700;
      const backLen = waveBack ? waveBack.getTotalLength() : 600;

      tl.fromTo(
        "#tv-wave-front",
        { strokeDashoffset: frontLen },
        { strokeDashoffset: 0, duration: 1.3, ease: "power2.out" },
        0.6
      );
      tl.fromTo(
        "#tv-wave-back",
        { strokeDashoffset: backLen },
        { strokeDashoffset: 0, duration: 1.1, ease: "power2.out" },
        0.75
      );

      // Knobs click into place
      tl.fromTo(
        "#knob-upper",
        { rotation: -60 },
        { rotation: 25, duration: 0.5, ease: "power2.out" },
        0.7
      );
      tl.fromTo(
        "#knob-lower",
        { rotation: 45 },
        { rotation: -30, duration: 0.5, ease: "power2.out" },
        0.85
      );

      // Overlay 1: "K-DRAMA JOSEON" badge pops in (atMs 9590 -> local 1.57s)
      tl.fromTo(
        "#kdrama-badge",
        { scale: 0, opacity: 0, rotation: -10 },
        { scale: 1, opacity: 1, rotation: -3, duration: 0.55, ease: "power3.out" },
        1.57
      );

      // Overlay 2: Crowd icon callout arrives (atMs 11550 -> local 3.53s)
      tl.fromTo(
        "#crowd-callout",
        { scale: 0.6, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        3.53
      );
      tl.fromTo(
        "#crowd-svg .draw-path",
        { strokeDashoffset: 60 },
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out", stagger: 0.08 },
        3.65
      );

      // ==================== SHOT 2 (4.63s -> 9.42s) ====================
      // Transition: Monitor frame expands and zooms in
      tl.fromTo(
        "#monitor-frame",
        { scale: 0.78, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
        4.63
      );

      // HUD Header drops in
      tl.fromTo(
        "#monitor-top-hud",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
        4.85
      );

      // Signal status badge arrives
      tl.fromTo(
        "#signal-status-badge",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        5.1
      );

      // Broad broadcast waveform draws across monitor
      const broadMain = document.getElementById("broad-wave-main");
      const broadBack = document.getElementById("broad-wave-back");
      const bMainLen = broadMain ? broadMain.getTotalLength() : 1200;
      const bBackLen = broadBack ? broadBack.getTotalLength() : 1000;

      tl.fromTo(
        "#broad-wave-main",
        { strokeDashoffset: bMainLen },
        { strokeDashoffset: 0, duration: 1.4, ease: "power2.out" },
        5.2
      );
      tl.fromTo(
        "#broad-wave-back",
        { strokeDashoffset: bBackLen },
        { strokeDashoffset: 0, duration: 1.2, ease: "power2.out" },
        5.4
      );

      // Equalizer bars bounce deterministically
      tl.fromTo(
