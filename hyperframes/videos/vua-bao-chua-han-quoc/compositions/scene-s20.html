<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }

      /* Quy ước clip bắt buộc: inset: 0, không set width/height cứng */
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Lớp nền Grid 84px chuẩn Vox-style DNA */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }

      /* Biến thể nền Spotlight: dark radial vignette cho cảnh mờ ám/cảnh báo */
      .bg-spotlight {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 48%, rgba(20, 20, 20, 0.05) 20%, rgba(20, 20, 20, 0.72) 85%, rgba(10, 10, 10, 0.92) 100%);
        pointer-events: none;
      }

      /* Lớp chứa ảnh collage Ken Burns */
      .shot-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .shot-img-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      .shot-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* CÁC CLASS MÀU AN TOÀN THEO CHUẨN WCAG TỪ STYLE-TOKENS */
      .hf-text-ink {
        color: #141414;
      }
      .hf-text-light {
        color: #F7F4EC;
      }
      .hf-hl-orange {
        background-color: #FF6A1A;
        color: #141414;
      }
      .hf-plate-ink {
        background-color: #141414;
        color: #F7F4EC;
      }
      .hf-plate-ink-orange {
        background-color: #141414;
        color: #FF6A1A;
      }
      .hf-plate-paper {
        background-color: #E7E3D9;
        color: #141414;
      }

      /* Thanh cam đáy nhận diện thương hiệu cố định */
      #bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 999;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s20"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="9.08"
    >
      <!-- Nền Grid tĩnh toàn cảnh -->
      <div class="bg-grid"></div>

      <!-- ========================================== -->
      <!-- SHOT 1 (0.00s -> 4.97s): Cảnh Joseon đêm mờ ảo, Ken Burns zoom vào bóng người đàn ông đội mũ gat -->
      <!-- ========================================== -->
      <div id="shot-1" class="clip" data-start="0" data-duration="4.97" data-track-index="0" style="z-index: 10;">
        <div class="shot-wrapper">
          <div id="shot-1-scale" class="shot-img-container" data-layout-allow-overflow="true">
            <img
              class="shot-img"
              src="assets/img-03-joseon-night-mystery-stalking.jpg"
              alt="Joseon night stalking"
              data-layout-allow-overflow="true"
            />
          </div>
          <!-- Lớp vignette spotlight tạo không khí lén lút trong đêm -->
          <div class="bg-spotlight"></div>
        </div>
      </div>

      <!-- OVERLAY 1 (1.50s -> 3.70s, hold 2.2s): Bảng thông tin "NGUYÊN NHÂN TRANH CHẤP" -->
      <div id="overlay-1" class="clip" data-start="1.5" data-duration="2.2" data-track-index="1" style="z-index: 20;">
        <div id="overlay-1-content" style="position: absolute; top: 220px; left: 60px; right: 60px;">
          <div
            class="hf-plate-ink"
            style="
              display: inline-block;
              padding: 24px 32px;
              border-radius: 12px;
              border-left: 10px solid #FF6A1A;
              box-shadow: 0 20px 48px rgba(0, 0, 0, 0.75);
            "
          >
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
              <span
                class="hf-hl-orange"
                style="font-size: 22px; font-weight: 900; padding: 4px 12px; border-radius: 4px; letter-spacing: 1.2px;"
              >
                HỒ SƠ VỤ VIỆC
              </span>
              <span style="color: #FF6A1A; font-size: 20px; font-weight: 700; letter-spacing: 1px;">
                SỬ LIỆU TRIỀU TIÊN
              </span>
            </div>
            <div
              class="hf-text-light"
              style="font-size: 58px; font-weight: 900; line-height: 1.22; letter-spacing: -0.5px;"
            >
              NGUYÊN NHÂN TRANH CHẤP
            </div>
          </div>
        </div>
      </div>

      <!-- ========================================== -->
      <!-- SHOT 2 (4.97s -> 9.08s): Pan lên góc trên để lộ đôi mắt xé giấy rình rập, mũi tên chỉ hướng kỹ viện -->
      <!-- ========================================== -->
      <div id="shot-2" class="clip" data-start="4.97" data-duration="4.11" data-track-index="0" style="z-index: 30;">
        <div class="shot-wrapper">
          <div id="shot-2-scale" class="shot-img-container" data-layout-allow-overflow="true">
            <img
              class="shot-img"
              src="assets/img-03-joseon-night-mystery-stalking.jpg"
              alt="Joseon night stalking upper"
              data-layout-allow-overflow="true"
            />
          </div>
          <!-- Spotlight tối đặc tả sự nghi ngờ và rình rập -->
          <div class="bg-spotlight"></div>
        </div>

        <!-- Mũi tên chỉ hướng vẽ tay + nhãn giải thích (Annotated visual language) -->
        <div
          id="annotated-arrow-box"
          style="
            position: absolute;
            top: 680px;
            left: 140px;
            width: 440px;
            height: 300px;
            z-index: 35;
            pointer-events: none;
          "
        >
          <svg
            viewBox="0 0 320 220"
            style="width: 100%; height: 100%; overflow: visible;"
            data-layout-allow-overflow="true"
          >
            <!-- Đường cong vẽ hướng di chuyển từ cung ra khu kỹ viện -->
            <path
              id="arrow-stem"
              d="M 50 170 C 110 160, 180 120, 230 60"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="8"
              stroke-linecap="round"
            />
            <!-- Đầu mũi tên cam nhọn -->
            <polygon
              id="arrow-head"
              points="225,40 250,65 215,75"
              fill="#FF6A1A"
            />
          </svg>
          <!-- Nhãn chú thích vẽ tay dưới 4 từ, không lặp nguyên văn lời thoại -->
          <div
            id="arrow-badge"
            class="hf-plate-ink"
            style="
              position: absolute;
              top: 175px;
              left: 10px;
              padding: 10px 18px;
              border-radius: 8px;
              border-left: 6px solid #FF6A1A;
              box-shadow: 0 12px 28px rgba(0, 0, 0, 0.7);
            "
          >
            <span style="color: #FF6A1A; font-weight: 900; font-size: 24px; letter-spacing: 1px;">HƯỚNG</span>
            <span class="hf-text-light" style="font-weight: 700; font-size: 24px; margin-left: 8px;">TỚI KỸ VIỆN</span>
          </div>
        </div>
      </div>

      <!-- OVERLAY 2 (7.38s -> 9.08s, hold 1.70s): Punch phrase "LÉN TỚI KỸ VIỆN" -->
      <div id="overlay-2" class="clip" data-start="7.38" data-duration="1.70" data-track-index="1" style="z-index: 40;">
        <div
          id="overlay-2-content"
          style="
            position: absolute;
            bottom: 580px;
            left: 60px;
            right: 60px;
          "
        >
          <div
            class="hf-plate-ink"
            style="
              padding: 36px 40px;
              border-radius: 16px;
              box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
              border-left: 12px solid #FF6A1A;
            "
          >
            <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 14px;">
              <span
                class="hf-hl-orange"
                style="font-size: 24px; font-weight: 900; padding: 6px 14px; border-radius: 4px; letter-spacing: 1.5px;"
              >
                VUA SEONGJONG
              </span>
              <span style="color: #FF6A1A; font-size: 22px; font-weight: 700; letter-spacing: 1px;">
                HÀNH ĐỘNG BÍ MẬT
              </span>
            </div>
            <div
              class="hf-text-light"
              style="font-size: 74px; font-weight: 900; line-height: 1.22; letter-spacing: -1px;"
            >
              LÉN TỚI KỸ VIỆN
            </div>
          </div>
        </div>
      </div>

      <!-- Thanh thương hiệu đáy khung hình luôn hiển thị -->
      <div id="bottom-brand-bar"></div>
    </div>

    <!-- GSAP seekable deterministic timeline script -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // ========================================================
      // 1. SHOT 1: Ken Burns zoom chậm vào người đàn ông (0s -> 4.97s)
      // Transition in: Zoom-through bắt đầu từ góc rộng đẩy vào cận cảnh
      // ========================================================
      tl.fromTo(
        "#shot-1-scale",
        { scale: 1.15, y: 30 },
        { scale: 1.38, y: 110, duration: 4.97, ease: "power1.inOut" },
        0
      );

      // OVERLAY 1: "NGUYÊN NHÂN TRANH CHẤP" xuất hiện tại t = 1.5s
      tl.fromTo(
        "#overlay-1-content",
        { y: 36, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.5
      );
      // Kết thúc overlay 1 trước khi shot 1 kết thúc
      tl.to(
        "#overlay-1-content",
        { y: -20, opacity: 0, duration: 0.35, ease: "power2.in" },
        3.35
      );

      // ========================================================
      // 2. SHOT 2: Cắt cảnh, pan lia lên góc trên để lộ đôi mắt xé giấy rình rập (4.97s -> 9.08s)
      // ========================================================
      tl.fromTo(
        "#shot-2-scale",
        { scale: 1.32, y: 90 },
        { scale: 1.48, y: -70, duration: 4.11, ease: "power1.inOut" },
        4.97
      );

      // Setup đường vẽ SVG mũi tên tự vẽ dần (svg-path-draw)
      const arrowStem = document.getElementById("arrow-stem");
      if (arrowStem) {
        const len = arrowStem.getTotalLength() || 260;
        arrowStem.style.strokeDasharray = len;
        arrowStem.style.strokeDashoffset = len;

        // Bắt đầu vẽ mũi tên tại 5.5s
        tl.to(
          "#arrow-stem",
          { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
          5.5
        );
      }

      // Đầu mũi tên bật ra ngay khi nét vẽ chạm đích
      tl.fromTo(
        "#arrow-head",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" },
        6.05
      );

      // Nhãn chú thích "HƯỚNG TỚI KỸ VIỆN" trượt nhẹ vào
      tl.fromTo(
        "#arrow-badge",
        { x: -24, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        6.15
      );

      // ========================================================
      // 3. OVERLAY 2 (Punch Phrase): "LÉN TỚI KỸ VIỆN" (7.38s -> 9.08s)
      // Giữ cố định 1.70s (> 48 frame / 1.6s) cho đến hết cảnh
      // ========================================================
      tl.fromTo(
        "#overlay-2-content",
        { scale: 0.88, y: 35, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        7.38
      );

      // Đăng ký timeline gốc cho HyperFrames seek renderer
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s20"] = tl;
    </script>
  
    </template>
  </body>
</html>
