    <script>
      const tl = gsap.timeline({ paused: true });

      // Measure SVG path lengths for clean stroke-dash drawing
      const p1 = document.getElementById("arrow-line-1");
      const p2 = document.getElementById("arrow-line-2");
      const p3 = document.getElementById("arrow-line-3");
      const len1 = p1.getTotalLength();
      const len2 = p2.getTotalLength();
      const len3 = p3.getTotalLength();

      p1.style.strokeDasharray = len1;
      p1.style.strokeDashoffset = len1;
      p2.style.strokeDasharray = len2;
      p2.style.strokeDashoffset = len2;
      p3.style.strokeDasharray = len3;
      p3.style.strokeDashoffset = len3;

      // 1. Initial Header Reveal (0.15s - 0.6s)
      tl.fromTo(
        "#header-badge",
        { y: -20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.15
      );
      tl.fromTo(
        "#header-title",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.25
      );
      tl.fromTo(
        "#header-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power2.out" },
        0.35
      );

      // 2. Node 0 Entrance: NGUỒN CẢM HỨNG (at ~0.59s, cue from shotlist at 27820ms)
      tl.fromTo(
        "#node-origin",
        { scale: 0.88, y: 32, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.59
      );
      tl.fromTo(
        "#origin-pulse",
        { scale: 0.98, opacity: 0.8 },
        { scale: 1.15, opacity: 0, duration: 0.75, ease: "power2.out" },
        0.95
      );

      // 3. Branch 1 & Node 1 Entrance: PHIM TRUYỀN HÌNH (at ~3.15s, cue from shotlist at 30380ms)
      tl.fromTo(
        p1,
        { strokeDashoffset: len1 },
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        2.75
      );
      tl.fromTo(
        "#arrow-tip-1",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.15, ease: "power2.out" },
        3.12
      );
      tl.fromTo(
        "#node-tv",
        { scale: 0.9, y: 26, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        3.15
      );
      tl.fromTo(
        "#icon-tv",
        { rotation: -12 },
        { rotation: 0, duration: 0.4, ease: "power2.out" },
        3.35
      );

      // 4. Branch 2 & Node 2 Entrance: TIỂU THUYẾT LỊCH SỬ (at ~5.04s, cue from shotlist at 32270ms)
      tl.fromTo(
        p2,
        { strokeDashoffset: len2 },
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        4.64
      );
      tl.fromTo(
        "#arrow-tip-2",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.15, ease: "power2.out" },
        5.01
      );
      tl.fromTo(
        "#node-novel",
        { scale: 0.9, y: 26, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        5.04
      );

      // 5. Branch 3 & Node 3 Entrance: NHIỀU THỂ LOẠI KHÁC (at ~5.80s, "thành nhiều thể loại khác nhau")
      tl.fromTo(
        p3,
        { strokeDashoffset: len3 },
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        5.45
      );
      tl.fromTo(
        "#arrow-tip-3",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.15, ease: "power2.out" },
        5.77
      );
      tl.fromTo(
        "#node-other",
        { scale: 0.92, y: 26, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        5.80
      );

      // Register timeline for seekable deterministic render
      window.__timelines["scene-s04"] = tl;
    </script>
