    <!-- GSAP Master Timeline -->
    <script>
      // Khởi tạo timeline paused bắt buộc theo chuẩn HyperFrames
      const tl = gsap.timeline({ paused: true });

      // Lấy các element cần setup nét vẽ SVG (Path Draw)
      const mainCrack = document.getElementById("main-crack");
      const branch1 = document.getElementById("crack-branch-1");
      const branch2 = document.getElementById("crack-branch-2");
      const branch3 = document.getElementById("crack-branch-3");
      const warningTriangle = document.getElementById("warning-triangle");

      // Đo chiều dài hình học thật cho các đường path
      const mainCrackLen = mainCrack.getTotalLength();
      mainCrack.style.strokeDasharray = mainCrackLen;
      mainCrack.style.strokeDashoffset = mainCrackLen;

      const branch1Len = branch1.getTotalLength();
      branch1.style.strokeDasharray = branch1Len;
      branch1.style.strokeDashoffset = branch1Len;

      const branch2Len = branch2.getTotalLength();
      branch2.style.strokeDasharray = branch2Len;
      branch2.style.strokeDashoffset = branch2Len;

      const branch3Len = branch3.getTotalLength();
      branch3.style.strokeDasharray = branch3Len;
      branch3.style.strokeDashoffset = branch3Len;

      const warnLen = warningTriangle.getTotalLength();
      warningTriangle.style.strokeDasharray = warnLen;
      warningTriangle.style.strokeDashoffset = warnLen;

      // -------------------------------------------------------------
      // 1. BEAT 1: PUNCH ENTRANCE (0.0s - 0.5s)
      // -------------------------------------------------------------
      // Toàn bộ khối kiến trúc vững chãi giáng vào vị trí
      tl.fromTo(
        "#header-block",
        { y: -40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.05
      );

      tl.fromTo(
        "#pillar-svg",
        { scale: 0.94, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.1
      );

      tl.fromTo(
        ["#label-left", "#callout-line-left"],
        { x: -30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
        0.25
      );

      tl.fromTo(
        ["#label-right", "#callout-line-right"],
        { x: 30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
        0.25
      );

      // -------------------------------------------------------------
      // 2. BEAT 2: ICON WARNING ARRIVAL (atMs 111470 -> relative 0.44s)
      // -------------------------------------------------------------
      tl.fromTo(
        "#warning-badge",
        { scale: 0, opacity: 0, rotation: -12 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "power3.out" },
        0.44
      );

      // Stroke tam giác cảnh báo tự vẽ ra
      tl.to(
        warningTriangle,
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        0.5
      );

      // -------------------------------------------------------------
      // 3. CAMERA MOTION: SLOW CONTINUOUS ZOOM-IN (0.0s - 7.53s)
      // -------------------------------------------------------------
      tl.to(
        "#camera-rig",
        { scale: 1.07, duration: 7.53, ease: "none" },
        0
      );

      // -------------------------------------------------------------
      // 4. BEAT 3: VẾT NỨT XÉ TOẠC CỘT TRỤ (3.2s - 4.6s)
      // "Việc không có người kế vị..."
      // -------------------------------------------------------------
      // Đường nứt chính cam xé toạc từ đỉnh xuống chân cột
      tl.to(
        mainCrack,
        { strokeDashoffset: 0, duration: 1.05, ease: "power2.inOut" },
        3.2
      );

      // Các nhánh nứt phụ bắn rẽ sang hai bên
      tl.to(
        branch1,
        { strokeDashoffset: 0, duration: 0.45, ease: "power1.out" },
        3.55
      );
      tl.to(
        branch2,
        { strokeDashoffset: 0, duration: 0.45, ease: "power1.out" },
        3.8
      );
      tl.to(
        branch3,
        { strokeDashoffset: 0, duration: 0.45, ease: "power1.out" },
        4.05
      );

      // Rung chấn khi vết nứt xé toạc thân cột
      tl.fromTo(
        "#pillar-svg",
        { x: -5 },
        { x: 5, duration: 0.08, repeat: 5, yoyo: true, ease: "sine.inOut" },
        3.35
      );

      // Hai nửa cột trụ bị đẩy dạt nhẹ ra hai bên (đứt gãy kết cấu)
      tl.to(
        "#pillar-left-group",
        { x: -14, rotation: -0.8, duration: 0.8, ease: "power2.out" },
        3.5
      );
      tl.to(
        "#pillar-right-group",
        { x: 14, rotation: 0.8, duration: 0.8, ease: "power2.out" },
        3.5
      );

      // Phù hiệu vương miện rạn vỡ
      tl.to(
        "#crown-insignia",
        { y: 8, opacity: 0.85, duration: 0.6, ease: "power2.out" },
        3.6
      );

      // Warning badge nhấp nháy khẩn cấp
      tl.to(
        "#warning-badge",
        { scale: 1.12, duration: 0.15, repeat: 3, yoyo: true, ease: "power2.inOut" },
        3.7
      );

      // -------------------------------------------------------------
      // 5. BEAT 4: PUNCH PHRASE "BẤT KHẢ CHẤP NHẬN" ĐÓNG SẬP (5.75s - 7.53s)
      // "là điều không thể chấp nhận"
      // -------------------------------------------------------------
      // Setup ban đầu cho con dấu ẩn
      gsap.set("#stamp-wrapper", { opacity: 0 });

      // Đóng sập con dấu khẩn cấp với gia tốc cực lớn (power4.in)
      tl.fromTo(
        "#stamp-wrapper",
        { scale: 2.5, opacity: 0, rotation: 8 },
        { scale: 1, opacity: 1, rotation: -2.5, duration: 0.28, ease: "power4.in" },
        5.75
      );

      // Chấn động toàn khung hình lúc con dấu va chạm (Ground Impact Shake)
      tl.fromTo(
        "#camera-rig",
        { y: 0 },
        { y: 16, duration: 0.08, ease: "power2.out" },
        6.03
      );
