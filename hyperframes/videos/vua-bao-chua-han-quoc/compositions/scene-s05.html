      // Single paused GSAP timeline required by HyperFrames
      const tl = gsap.timeline({ paused: true });

      // Setup SVG Path Lengths for Doc Icon progressive drawing (svg-path-draw recipe)
      const docPaths = [
        document.getElementById("doc-path-body"),
        document.getElementById("doc-path-fold"),
        document.getElementById("doc-line-1"),
        document.getElementById("doc-line-2"),
        document.getElementById("doc-line-3")
      ];

      docPaths.forEach((path) => {
        if (path) {
          const len = path.getTotalLength ? path.getTotalLength() : 100;
          path.style.strokeDasharray = len + "";
          path.style.strokeDashoffset = len + "";
        }
      });

      // ==========================================
      // SHOT 1 CHOREOGRAPHY (0.00s -> 6.18s)
      // ==========================================

      // Entrance 3D flip of the left criminal dossier card
      tl.fromTo(
        "#dossier-left",
        { rotationY: -85, opacity: 0, scale: 0.9 },
        { rotationY: 0, opacity: 1, scale: 1, duration: 0.75, ease: "power3.out" },
        0.15
      );

      // Slide in right chronicle card
      tl.fromTo(
        "#record-right",
        { x: 80, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.65, ease: "power2.out" },
        0.35
      );

      // Subtle editorial pan-left on shot 1 content
      tl.fromTo(

        { x: -24, duration: 5.8, ease: "sine.inOut" },

      );

      // Overlay S05-1: ÁC QUỶ TỘT CÙNG Stamp Strike (atMs 36880 -> relative 2.70s)

        "#villain-stamp",
        { scale: 0, opacity: 0, rotation: -22 },
        { scale: 1, opacity: 1, rotation: -6, duration: 0.42, ease: "power3.out" },

      );

      // ==========================================
      // SHOT 2 CHOREOGRAPHY (6.18s -> 11.82s)
      // ==========================================

      // At 6.18s: Orange Brush Sweep takes over the territory from right to left
      tl.fromTo(
        "#brush-layer",
        { x: 1000, opacity: 0.9 },
        { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" },
        6.18
      );

      // The new chronicle investigation card reveals and pushes in
      tl.fromTo(
        "#chronicle-card",
        { scale: 0.92, opacity: 0, y: 50 },
        { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
        6.45
      );

      // Brush layer fades out smoothly behind the card
      tl.to(
        "#brush-layer",
        { opacity: 0, duration: 0.4, ease: "power2.out" },
        7.1
      );

      // Subtle camera pan-right for Shot 2
      tl.fromTo(
        "#shot2-content",
        { x: -16 },
        { x: 16, duration: 5.0, ease: "sine.inOut" },
        6.6
      );

      // Question Mark Seal pop entrance at relative 7.80s (smooth long-tail settle)

        "#question-seal",
        { scale: 0, opacity: 0, rotation: -20 },
        { scale: 1, opacity: 1, rotation: 8, duration: 0.48, ease: "power3.out" },
        7.8
      );

      // Overlay S05-2: Punch-phrase "SỬ QUAN THAO TÚNG?" (atMs 43670 -> relative 9.49s)
      tl.fromTo(
        "#punch-plate",
        { y: 50, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        9.49
      );

      // Overlay S05-2: Document Icon arrival (atMs 44330 -> relative 10.15s)

        "#doc-icon-wrap",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        10.15
      );

      // Progressively trace each stroke of the document icon
      tl.to("#doc-path-body", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 10.25);
      tl.to("#doc-path-fold", { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, 10.45);

      // Register timeline strictly to window.__timelines["scene-s05"]
      window.__timelines["scene-s05"] = tl;
    </script>
