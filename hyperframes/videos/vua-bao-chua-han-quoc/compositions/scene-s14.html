  <script>
    // Setup SVG progressive path drawing
    document.querySelectorAll(".draw-path").forEach((p) => {
      try {
        const len = Math.ceil(p.getTotalLength());
        p.style.strokeDasharray = `${len}`;
        p.style.strokeDashoffset = `${len}`;
      } catch (e) {
        p.style.strokeDasharray = "800";
        p.style.strokeDashoffset = "800";
      }
    });

    const tl = gsap.timeline({ paused: true });

    // ==========================================
    // SHOT 1 (0.0s - 6.06s)
    // ==========================================

    // Unfold entrance for Shot 1 wrapper

      "#s1-unfold-wrap",
      { scaleY: 0.15, scaleX: 0.85, opacity: 0 },
      { scaleY: 1, scaleX: 1, opacity: 1, duration: 0.8, ease: "power3.out" },
      0.0
    );

    // Relational brackets & connecting line drawing
    tl.to("#s1-bracket-king", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 1.2);
    tl.to("#s1-bracket-queen", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 1.5);
    tl.to("#s1-king-tag", { opacity: 1, duration: 0.35, ease: "power1.out" }, 1.7);
    tl.to("#s1-queen-tag", { opacity: 1, duration: 0.35, ease: "power1.out" }, 1.9);
    tl.to("#s1-conn-line", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 2.1);
    tl.to("#s1-conn-dot", { opacity: 1, duration: 0.3, ease: "power1.out" }, 2.6);

    // Overlay Label: "THANH MAI TRÚC MÃ" (atMs: 128420 -> 4.2s local)

      "#s1-label-card",
      { scale: 0.6, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      4.2
    );

    // ==========================================
    // SHOT 2 (6.06s - 11.39s)
    // ==========================================

    // Ken Burns camera zoom-in focused on the crowning moment

      "#s2-img",
      { scale: 1.12, x: 0, y: 0 },
      { scale: 1.48, x: -30, y: -70, duration: 5.33, ease: "sine.out" },
      6.06
    );

    // Crown target reticle drawing
    tl.to("#s2-reticle-outer", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 6.8);
    tl.to("#s2-crown-pointer", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 7.3);

    // Crown callout pill pop-in

      "#s2-crown-tag",
      { scale: 0.5, opacity: 0, x: -20 },
      { scale: 1, opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
      7.5
    );

      { scale: 0.6, opacity: 0, y: 40 },
      { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
      9.26
    );
