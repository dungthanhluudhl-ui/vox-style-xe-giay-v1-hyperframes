<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .vox-grid {
        position: absolute;
        inset: 0;
        background-color: #E7E3D9;
        background-image: 
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        z-index: 0;
      }
      .shot-unfold-wrapper {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .shot-img {
        position: absolute;
        inset: -10%;
        width: 120%;
        height: 120%;
        object-fit: cover;
        display: block;
      }
      .spotlight-vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(20, 20, 20, 0) 35%,
          rgba(20, 20, 20, 0.45) 75%,
          rgba(20, 20, 20, 0.85) 100%
        );
        z-index: 4;
      }
      .bottom-orange-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 10px;
        background-color: #FF6A1A;
        z-index: 100;
      }
      .overlay-container {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      .card {
        position: absolute;
        top: 240px;
        left: 60px;
        max-width: 640px;
        height: auto;
        background-color: #141414;
        border-left: 8px solid #FF6A1A;
        padding: 24px 32px;
        border-radius: 4px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      }
      .card-tag {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 700;
        font-size: 20px;
        line-height: 1.2;
        letter-spacing: 2px;
        color: #FF6A1A;
        margin-bottom: 10px;
        text-transform: uppercase;
      }
      .card-title {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 52px;
        line-height: 1.15;
        color: #F7F4EC;
        margin: 0;
        letter-spacing: -0.5px;
      }
      .card-desc {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 700;
        font-size: 22px;
        line-height: 1.3;
        color: #E7E3D9;
        margin-top: 12px;
        letter-spacing: 0.5px;
      }
      .card-pill {
        display: inline-block;
        background-color: #FF6A1A;
        padding: 6px 16px;
        border-radius: 4px;
        margin-top: 14px;
      }
      .pill-text {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 22px;
        line-height: 1;
        color: #141414;
        letter-spacing: 1px;
      }
      .temp-bar-track {
        width: 100%;
        height: 10px;
        background-color: #2E2E2E;
        border-radius: 5px;
        margin-top: 16px;
        overflow: hidden;
      }
      .temp-bar-fill {
        display: block;
        width: 100%;
        height: 100%;
        background-color: #FF6A1A;
        border-radius: 5px;
        transform-origin: left center;
      }
      .card-hero-row {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 6px;
      }
      .icon-box {
        width: 60px;
        height: 60px;
        flex-shrink: 0;
        background-color: #FF6A1A;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon-svg {
        display: block;
      }

      /* Utility classes WCAG */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
      .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
      .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
      .hf-plate-paper { background-color: #E7E3D9; color: #141414; }
    </style>

    <div
      id="root"
      data-composition-id="scene-s05"
      data-width="1080"
      data-height="1920"
      data-duration="10.2"
    >
      <!-- Base paper grid background -->
      <div id="bg-grid" class="vox-grid" data-layout-ignore="true"></div>

      <!-- Shot S05-1: Ken Burns Pan-Left on Lab Evidence (0s - 5.48s) -->
      <div id="shot-1" class="clip" data-start="0" data-duration="5.48" data-track-index="0">
        <div id="shot-1-unfold" class="shot-unfold-wrapper" data-layout-allow-overflow="true">
          <img
            id="shot-1-img"
            class="shot-img"
            src="assets/img-03-forensic-lab-evidence-cutout.jpg"
            alt="Bàn thí nghiệm hoàn nguyên bạc"
            data-layout-allow-overflow="true"
          />
        </div>
      </div>

      <!-- Shot S05-2: Hard cut to Torch Melting Ingot (5.48s - 10.2s) -->
      <div id="shot-2" class="clip" data-start="5.48" data-duration="4.72" data-track-index="0">
        <img
          id="shot-2-img"
          class="shot-img"
          src="assets/img-01-torch-melting-gold-crucible.jpg"
          alt="Đèn khò nung chảy kim loại bạc"
          data-layout-allow-overflow="true"
        />
      </div>

      <!-- Spotlight Vignette Overlay (Dark edges for dramatic high heat) -->
      <div id="spotlight-overlay" class="spotlight-vignette" data-layout-ignore="true"></div>

      <!-- Brand Signature Bottom Orange Bar -->
      <div id="brand-bottom-bar" class="bottom-orange-bar" data-layout-ignore="true"></div>

      <!-- Overlay 1 (Shot 1): KHỬ HOÀN NGUYÊN (1.50s - 3.50s) -->
      <div id="overlay-1" class="clip overlay-container" data-start="1.5" data-duration="2.0" data-track-index="1">
        <div class="card" id="card-1">
          <div class="card-tag">CÔNG ĐOẠN 01 // HOÀN NGUYÊN</div>
          <div class="card-title">KHỬ HOÀN NGUYÊN</div>
          <div class="card-pill">
            <span class="pill-text">AgCl ➔ BẠC KIM LOẠI</span>
          </div>
        </div>
      </div>

      <!-- Overlay 2 (Shot 1): KIM LOẠI XỐP (3.84s - 5.48s) -->
      <div id="overlay-2" class="clip overlay-container" data-start="3.84" data-duration="1.64" data-track-index="1">
        <div class="card" id="card-2">
          <div class="card-tag">KẾT TỦA HOÀN TẤT</div>
          <div class="card-title">KIM LOẠI XỐP</div>
          <div class="card-desc">BẠC XỐP MÀU ĐEN</div>
        </div>
      </div>

      <!-- Overlay 3 (Shot 2): NUNG CHẢY 961°C (7.19s - 8.74s) -->
      <div id="overlay-3" class="clip overlay-container" data-start="7.19" data-duration="1.55" data-track-index="1">
        <div class="card" id="card-3">
          <div class="card-tag">NHIỆT ĐỘ NÓNG CHẢY</div>
          <div class="card-title">NUNG CHẢY 961°C</div>
          <div class="temp-bar-track">
            <div id="temp-fill" class="temp-bar-fill"></div>
          </div>
        </div>
      </div>

      <!-- Overlay 4 (Shot 2): ĐÚC THỎI BẠC + Icon Rise (8.76s - 10.20s) -->
      <div id="overlay-4" class="clip overlay-container" data-start="8.76" data-duration="1.44" data-track-index="1">
        <div class="card" id="card-4">
          <div class="card-tag">THÀNH PHẨM KIM HOÀN</div>
          <div class="card-hero-row">
            <div class="icon-box">
              <svg class="icon-svg" viewBox="0 0 48 48" width="48" height="48">
                <path
                  id="rise-path-1"
                  d="M 8 36 L 18 24 L 28 30 L 40 12"
                  fill="none"
                  stroke="#141414"
                  stroke-width="4.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  id="rise-path-2"
                  d="M 28 12 L 40 12 L 40 24"
                  fill="none"
                  stroke="#141414"
                  stroke-width="4.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <div class="card-title">ĐÚC THỎI BẠC</div>
          </div>
          <div class="card-desc">THỎI BẠC ĐẶC SÁNG BÓNG</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ==========================================
      // SHOT 1 CHOREOGRAPHY (0s - 5.48s)
      // ==========================================

      // 1. Ken Burns Pan-Left on img-03 (from white powder to black silver sponge)
      tl.fromTo(
        "#shot-1-img",
        { scale: 1.15, x: 50 },
        { scale: 1.15, x: -50, duration: 5.48, ease: "none" },
        0
      );

      // 2. Unfold entrance transition in (vertical curtain unroll from center)
      tl.fromTo(
        "#shot-1-unfold",
        { clipPath: "inset(50% 0% 50% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.75, ease: "power3.out" },
        0
      );

      // 3. Overlay 1: "KHỬ HOÀN NGUYÊN" (1.50s - 3.50s)
      tl.fromTo(
        "#card-1",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.5
      );
      tl.to(
        "#card-1",
        { x: -30, opacity: 0, duration: 0.25, ease: "power2.in" },
        3.2
      );

      // 4. Overlay 2: "KIM LOẠI XỐP" (3.84s - 5.48s)
      tl.fromTo(
        "#card-2",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        3.84
      );
      tl.to(
        "#card-2",
        { opacity: 0, duration: 0.2, ease: "power2.in" },
        5.25
      );

      // ==========================================
      // SHOT 2 CHOREOGRAPHY (5.48s - 10.20s)
      // ==========================================

      // 5. Ken Burns Zoom-In on img-01 (blowtorch crucible)
      tl.fromTo(
        "#shot-2-img",
        { scale: 1.0 },
        { scale: 1.08, duration: 4.72, ease: "none" },
        5.48
      );

      // 6. Overlay 3: "NUNG CHẢY 961°C" + thermal meter (7.19s - 8.74s)
      tl.fromTo(
        "#card-3",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        7.19
      );
      tl.fromTo(
        "#temp-fill",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.65, ease: "power2.out" },
        7.4
      );
      tl.to(
        "#card-3",
        { y: -20, opacity: 0, duration: 0.2, ease: "power2.in" },
        8.5
      );

      // 7. Overlay 4: "ĐÚC THỎI BẠC" + Rise Icon (8.76s - 10.20s)
      tl.fromTo(
        "#card-4",
        { y: 30, scale: 0.95, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        8.76
      );

      // 8. Self-drawing SVG path setup for "rise" icon
      const path1 = document.querySelector("#rise-path-1");
      const path2 = document.querySelector("#rise-path-2");
      if (path1 && path2) {
        const len1 = path1.getTotalLength();
        const len2 = path2.getTotalLength();
        path1.style.strokeDasharray = len1 + "";
        path1.style.strokeDashoffset = len1 + "";
        path2.style.strokeDasharray = len2 + "";
        path2.style.strokeDashoffset = len2 + "";

        tl.fromTo(
          "#rise-path-1",
          { strokeDashoffset: len1 },
          { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
          8.95
        );
        tl.fromTo(
          "#rise-path-2",
          { strokeDashoffset: len2 },
          { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
          9.25
        );
      }

      // Register master timeline on window
      window.__timelines["scene-s05"] = tl;
    </script>
  
    </template>
  </body>
</html>
