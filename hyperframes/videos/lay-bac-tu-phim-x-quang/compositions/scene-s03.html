  <script>
    // Prepare SVG stroke dash measurements for check icon
    const checkCircle = document.querySelector("#s2-icon-check circle");
    const checkPath = document.querySelector("#check-path");
    let circleLen = 126;
    let pathLen = 30;
    if (checkCircle && checkPath) {
      circleLen = checkCircle.getTotalLength();
      checkCircle.style.strokeDasharray = circleLen;
      checkCircle.style.strokeDashoffset = circleLen;

      pathLen = checkPath.getTotalLength();
      checkPath.style.strokeDasharray = pathLen;
      checkPath.style.strokeDashoffset = pathLen;
    }

    // Single master paused timeline
    const tl = gsap.timeline({ paused: true });

    // === SHOT 1 (0.0s - 5.32s) ===
    // TransitionIn: rise
    tl.fromTo(
      "#shot-1 .card-container",
      { y: 60, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
      0
    );

    // Camera motion: pan-left nhẹ kết hợp zoom 1.03x
    tl.fromTo(
      "#img-s1",
      { scale: 1.0, x: 20 },
      { scale: 1.04, x: -25, duration: 5.32, ease: "none" },
      0
    );

    // Overlay 1: "HÒA TAN KIM LOẠI" (at 2.77s, hold 2.0s -> exit at 4.77s)
    tl.fromTo(
      "#s1-label-1",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      2.77
    );
    tl.to(
      "#s1-label-1",
      { opacity: 0, scale: 0.92, duration: 0.35, ease: "power2.in" },
      4.77
    );

    // Overlay 2: "PHẢN ỨNG TÁCH AG+" (at 3.40s, hold 1.8s -> exit at 5.15s)
    tl.fromTo(
      "#s1-marker",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      3.40
    );
    tl.to(
      "#s1-marker",
      { opacity: 0, duration: 0.25, ease: "power2.in" },
      5.15
    );

    // === SHOT 2 (5.32s - 8.37s) ===
    // TransitionIn: dissolve
    tl.fromTo(
      "#shot-2 .card-container",
      { opacity: 0, y: 15 },
      { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
      5.32
    );

    // Camera motion: zoom-in thẳng từ 1.0x lên 1.05x theo dòng chảy
    tl.fromTo(
      "#img-s2",
      { scale: 1.0, y: 0 },
      { scale: 1.05, y: -20, duration: 3.05, ease: "none" },
      5.32
    );

    // Overlay 1: "LỌC TÁCH CẶN THÔ" (at 5.52s, hold 1.6s -> exit at 7.12s)
    tl.fromTo(
      "#s2-label-1",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      5.52
    );
    tl.to(
      "#s2-label-1",
      { opacity: 0, scale: 0.92, duration: 0.3, ease: "power2.in" },
      7.12
    );

    // Overlay 2 & 3: "DỊCH CHỨA BẠC" + Icon Check (at 6.96s, hold to end)
    tl.fromTo(
      "#s2-result-group",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      6.96
    );

    // Self-drawing checkmark path animation
    if (checkCircle && checkPath) {
      tl.fromTo(
        checkCircle,
        { strokeDashoffset: circleLen },
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        7.05
      );
      tl.fromTo(
        checkPath,
        { strokeDashoffset: pathLen },
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        7.25
      );
    }

    // Register paused timeline to HyperFrames
    window.__timelines["scene-s03"] = tl;
  </script>
