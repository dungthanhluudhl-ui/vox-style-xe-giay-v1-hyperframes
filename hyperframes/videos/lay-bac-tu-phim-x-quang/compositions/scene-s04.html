<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #F5F0E4; /* Biến thể card phẳng màu kem */
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F5F0E4;
    }

    /* Quy ước layout chuẩn HyperFrames */
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Các class màu WCAG an toàn */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
    .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
    .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
    .hf-plate-paper { background-color: #E7E3D9; color: #141414; }

    /* Thanh cam thương hiệu ở đáy khung hình */
    .brand-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 10px;
      background-color: #FF6A1A;
      z-index: 999;
    }

    /* Khung viền tinh tế phong cách tài liệu khoa học/hồ sơ */
    .document-border {
      position: absolute;
      inset: 24px;
      border: 2px solid rgba(20, 20, 20, 0.12);
      pointer-events: none;
      z-index: 10;
    }

    /* Header khu vực trên (Safe Zone Y: 160-1390) */
    .header-zone {
      position: absolute;
      top: 180px;
      left: 70px;
      right: 70px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .step-pill {
      display: inline-block;
      padding: 6px 14px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background-color: #FF6A1A;
      color: #141414;
      border-radius: 4px;
    }

    .step-code {
      font-size: 20px;
      font-weight: 700;
      color: #141414;
      letter-spacing: 1px;
    }

    .headline-text {
      font-size: 50px;
      font-weight: 900;
      line-height: 1.25;
      color: #141414;
      text-transform: uppercase;
    }

    /* Cấu trúc Card chính chứa hình ảnh (khung Y: 320 đến 1300) */
    .scene-viewport {
      position: absolute;
      top: 330px;
      left: 70px;
      width: 940px;
      height: 980px;
      perspective: 1200px;
    }

    .collage-card {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #141414;
      border: 4px solid #141414;
      border-radius: 16px;
      box-shadow: 14px 18px 0px rgba(20, 20, 20, 0.95);
      overflow: hidden;
      transform-style: preserve-3d;
      transform-origin: center center;
    }

    .media-window {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background-color: #141414;
    }

    .media-window img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transform-origin: center center;
    }

    /* Nhãn loại thao tác ở góc card */
    .card-corner-tag {
      position: absolute;
      top: 24px;
      right: 24px;
      padding: 8px 18px;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 6px;
      z-index: 5;
    }

    /* Badge định danh đối tượng chính */
    .primary-overlay-badge {
      position: absolute;
      top: 40px;
      left: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      z-index: 15;
    }

    .badge-accent-strip {
      width: 6px;
      height: 28px;
      background-color: #FF6A1A;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .badge-label-content {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    /* Marker phân tích chỉ điểm (Shot 1) */
    .diagram-marker-group {
      position: absolute;
      left: 80px;
      bottom: 70px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 15;
    }

    .marker-dot-pulse {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #FF6A1A;
      border: 4px solid #141414;
      box-shadow: 0 0 0 4px #F7F4EC;
      flex-shrink: 0;
    }

    .marker-connector {
      width: 60px;
      height: 3px;
      background-color: #FF6A1A;
    }

    .marker-tag-plate {
      padding: 12px 22px;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    }

    .marker-tag-text {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Badge kết quả tinh khiết + Check icon (Shot 2) */
    .verification-plate {
      position: absolute;
      right: 40px;
      bottom: 60px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 16px 26px;
      border-radius: 10px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      z-index: 15;
    }

    .check-icon-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: #141414;
      border: 2px solid #FF6A1A;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .check-svg {
      width: 28px;
      height: 28px;
    }

    .verify-text-info {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Footer nhỏ mô tả quy chuẩn thí nghiệm */
    .chemical-formula-box {
      position: absolute;
      top: 1330px;
      left: 70px;
      right: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background-color: #E7E3D9;
      border: 2px dashed rgba(20, 20, 20, 0.3);
      border-radius: 8px;
      z-index: 20;
    }

    .formula-title {
      font-size: 20px;
      font-weight: 700;
      color: #141414;
    }

    .formula-value {
      font-size: 22px;
      font-weight: 900;
      color: #141414;
      letter-spacing: 1px;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s04"
    data-width="1080"
    data-height="1920"
    data-duration="8.67"
  >
    <!-- Khung viền và thanh nhận diện thương hiệu -->
    <div class="document-border"></div>
    <div class="brand-bottom-bar"></div>

    <!-- Header thông tin giai đoạn xuyên suốt -->
    <div class="header-zone">
      <div class="header-meta">
        <span class="step-pill">BƯỚC 02</span>
        <span class="step-code">QUY TRÌNH KẾT TỦA HOÁ HỌC</span>
      </div>
      <h1 class="headline-text">TẠO KẾT TỦA VÀ RỬA BẠC CLORUA</h1>
    </div>

    <!-- Chú thích công thức kỹ thuật ở dưới card (nằm an toàn trong Y: 1330-1380) -->
    <div class="chemical-formula-box">
      <span class="formula-title">PHẢN ỨNG TẠCH MUỐI BẠC</span>
      <span class="formula-value">Ag⁺ + Cl⁻ → AgCl ↓ (Trắng đục)</span>
    </div>

    <!-- SHOT 1: Kỹ thuật viên tiến hành tạo kết tủa trắng (0.00s -> 4.29s) -->
    <section
      id="shot-1"
      class="clip"
      data-start="0"
      data-duration="4.29"
      data-track-index="1"
    >
      <div class="scene-viewport">
        <div id="shot1-card" class="collage-card">
          <!-- Cửa sổ ảnh minh họa -->
          <div class="media-window">
            <img
              id="shot1-img"
              src="assets/img-09-forensic-lab-chemical-analysis.jpg"
              alt="Kỹ thuật viên phòng thí nghiệm tạo kết tủa"
            >
          </div>

          <!-- Tag góc phân loại -->
          <div class="card-corner-tag hf-hl-orange">PHẢN ỨNG TẠO MẪU</div>

          <!-- Overlay 1: KẾT TỦA AGCL (atMs: 24120 -> 2.19s) -->
          <div id="shot1-overlay-agcl" class="primary-overlay-badge hf-plate-ink">
            <span class="badge-accent-strip"></span>
            <span class="badge-label-content hf-text-light">KẾT TỦA AGCL</span>
          </div>

          <!-- Overlay 2: DẠNG BỘT TRẮNG (atMs: 24600 -> 2.67s) -->
          <div id="shot1-overlay-marker" class="diagram-marker-group">
            <div id="marker-point" class="marker-dot-pulse"></div>
            <div id="marker-line" class="marker-connector"></div>
            <div class="marker-tag-plate hf-plate-ink">
              <span class="marker-tag-text hf-plate-ink-orange">DẠNG BỘT TRẮNG</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- SHOT 2: Xịt rửa kết tủa bằng nước nóng qua phễu lọc (4.29s -> 8.67s) -->
    <section
      id="shot-2"
      class="clip"
      data-start="4.29"
      data-duration="4.38"
      data-track-index="1"
    >
      <div class="scene-viewport">
        <div id="shot2-card" class="collage-card">
          <!-- Cửa sổ ảnh minh họa -->
          <div class="media-window">
            <img
              id="shot2-img"
              src="assets/img-13-drug-synthesis-washing-process.jpg"
              alt="Thao tác xịt rửa kết tủa bằng nước nóng"
            >
          </div>

          <!-- Tag góc phân loại -->
          <div class="card-corner-tag hf-hl-orange">GIAI ĐOẠN TINH CHẾ</div>

          <!-- Overlay 1 (Shot 2): RỬA NƯỚC NÓNG (atMs: 27920 -> 5.99s) -->
          <div id="shot2-overlay-wash" class="primary-overlay-badge hf-plate-ink">
            <span class="badge-accent-strip"></span>
            <span class="badge-label-content hf-text-light">RỬA NƯỚC NÓNG</span>
          </div>

          <!-- Overlay 2 & 3: LOẠI BỎ TẠP CHẤT + Icon Check (atMs: 28500 -> 6.57s) -->
          <div id="shot2-overlay-purity" class="verification-plate hf-plate-ink">
            <div class="check-icon-circle">
              <svg class="check-svg" viewBox="0 0 32 32" fill="none">
                <path
                  id="check-icon-path"
                  d="M7 16.5L13.5 23L25 9.5"
                  stroke="#FF6A1A"
                  stroke-width="4.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <span class="verify-text-info hf-plate-ink-orange">LOẠI BỎ TẠP CHẤT</span>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    // Thiết lập đường vẽ stroke-dashoffset cho SVG icon
    const checkPath = document.getElementById("check-icon-path");
    const checkLen = checkPath ? checkPath.getTotalLength() : 40;
    if (checkPath) {
      checkPath.style.strokeDasharray = checkLen;
      checkPath.style.strokeDashoffset = checkLen;
    }

    // Khởi tạo Timeline GSAP duy nhất theo hợp đồng HyperFrames
    const tl = gsap.timeline({ paused: true });

    // =========================================================================
    // SHOT 1 CHOREOGRAPHY (0.00s -> 4.29s)
    // =========================================================================

    // Flip entrance xoay trục dọc hé lộ bước phản ứng hóa học
    tl.fromTo(
      "#shot1-card",
      { rotationY: -65, opacity: 0, scale: 0.94 },
      { rotationY: 0, opacity: 1, scale: 1.0, duration: 0.75, ease: "power3.out" },
      0.05
    );

    // Ken Burns zoom-in chậm tập trung vào cốc thí nghiệm đang xuất hiện khối đục
    tl.fromTo(
      "#shot1-img",
      { scale: 1.01 },
      { scale: 1.06, duration: 4.24, ease: "none" },
      0.05
    );

    // Overlay 1: KẾT TỦA AGCL (atMs: 24120 -> 2.19s)
    tl.fromTo(
      "#shot1-overlay-agcl",
      { y: 30, opacity: 0, scale: 0.9 },
      { y: 0, opacity: 1, scale: 1.0, duration: 0.45, ease: "power3.out" },
      2.19
    );

    // Overlay 2: DẠNG BỘT TRẮNG (atMs: 24600 -> 2.67s)
    tl.fromTo(
      "#shot1-overlay-marker",
      { scale: 0.8, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.4, ease: "power3.out" },
      2.67
    );

    tl.fromTo(
      "#marker-line",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.3, ease: "power2.out", transformOrigin: "left center" },
      2.8
    );

    // =========================================================================
    // SHOT 2 CHOREOGRAPHY (4.29s -> 8.67s)
    // =========================================================================

    // Transition In dạng Cut sắc nét sang thao tác xịt rửa kết tủa
    tl.fromTo(
      "#shot2-card",
      { opacity: 0.9 },
      { opacity: 1.0, duration: 0.05 },
      4.29
    );

    // Ken Burns pan-right kết hợp zoom 1.04x nhấn mạnh dòng nước xịt rửa
    tl.fromTo(
      "#shot2-img",
      { x: -24, scale: 1.01 },
      { x: 24, scale: 1.05, duration: 4.38, ease: "none" },
      4.29
    );

    // Overlay 1: RỬA NƯỚC NÓNG (atMs: 27920 -> 5.99s)
    tl.fromTo(
      "#shot2-overlay-wash",
      { y: 25, opacity: 0, scale: 0.92 },
      { y: 0, opacity: 1, scale: 1.0, duration: 0.45, ease: "power3.out" },
      5.99
    );

    // Overlay 2: LOẠI BỎ TẠP CHẤT (atMs: 28500 -> 6.57s)
    tl.fromTo(
      "#shot2-overlay-purity",
      { y: 25, opacity: 0, scale: 0.92 },
      { y: 0, opacity: 1, scale: 1.0, duration: 0.45, ease: "power3.out" },
      6.57
    );

    // Overlay 3: Icon check tự vẽ hoàn tất tại 6.75s
    tl.fromTo(
      "#check-icon-path",
      { strokeDashoffset: checkLen },
      { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
      6.75
    );

    // Đăng ký timeline chính thức với HyperFrames runtime
    window.__timelines["scene-s04"] = tl;
  </script>

    </template>
  </body>
</html>
