<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* Khung chứa ảnh toàn màn hình (Background-photo tiêu chuẩn) */
      .media-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .full-media {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      /* Spotlight vignette viền tối tạo độ sâu và tôn sức nóng ngọn lửa cam */
      .bg-spotlight {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(20, 20, 20, 0) 42%,
          rgba(20, 20, 20, 0.38) 82%,
          rgba(20, 20, 20, 0.68) 100%
        );
        pointer-events: none;
        z-index: 15;
      }

      /* Dải cam thương hiệu cố định mép đáy */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 100;
      }

      /* Overlay Badges đặt trên tấm nền đặc đạt chuẩn tương phản WCAG */
      .badge-container {
        position: absolute;
        top: 220px;
        left: 60px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        will-change: transform, opacity;
      }

      .badge-plate {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 14px 26px;
        border-radius: 14px;
        border-left: 7px solid #ff6a1a;
      }

      .badge-tag {
        font-size: 22px;
        font-weight: 900;
        padding: 4px 12px;
        border-radius: 6px;
        letter-spacing: 0.5px;
        line-height: 1.2;
      }

      .badge-title {
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 0.8px;
        line-height: 1.25;
        white-space: nowrap;
      }

      /* Icon SVG cảnh báo dạng tự vẽ */
      .warning-icon-svg {
        width: 44px;
        height: 44px;
        flex-shrink: 0;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s02"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6.2"
    >
      <!-- SHOT 1: Băm nhỏ cơ học (0.00s -> 2.34s) - Ảnh nền toàn khung -->
      <section id="shot-1" class="clip" data-start="0" data-duration="2.34" style="z-index: 10;">
        <div id="shot1-media-wrap" class="media-wrap">
          <img
            id="shot1-img"
            class="full-media"
            src="assets/img-10-destroying-xray-evidence-cutout.jpg"
            alt="Kỹ thuật viên cắt vụn phim X-quang"
          />
        </div>
      </section>

      <!-- Overlay nhãn Shot 1 (Xuất hiện lúc 8030ms = 0.67s, giữ 1.6s) -->
      <div
        id="shot1-overlay"
        class="clip"
        data-start="0.67"
        data-duration="1.6"
        style="z-index: 25; pointer-events: none;"
      >
        <div id="shot1-badge" class="badge-container">
          <div class="badge-plate hf-plate-ink">
            <span class="badge-tag hf-hl-orange">GIAI ĐOẠN 01</span>
            <span class="badge-title hf-text-light">BĂM NHỎ CƠ HỌC</span>
          </div>
        </div>
      </div>

      <!-- SHOT 2: Nhiệt phân hủy (2.34s -> 6.20s) - Ảnh nền toàn khung -->
      <section id="shot-2" class="clip" data-start="2.34" data-duration="3.86" style="z-index: 10;">
        <div id="shot2-media-wrap" class="media-wrap">
          <img
            id="shot2-img"
            class="full-media"
            src="assets/img-08-burning-film-evidence-cutout.jpg"
            alt="Ngọn lửa thiêu rụi phim trong chậu xám"
          />
        </div>
      </section>

      <!-- Overlay nhãn & Icon cảnh báo Shot 2 (Bắt đầu lúc 10050ms = 2.69s, giữ 1.8s) -->
      <div
        id="shot2-overlay"
        class="clip"
        data-start="2.69"
        data-duration="1.8"
        style="z-index: 25; pointer-events: none;"
      >
        <div id="shot2-badge" class="badge-container">
          <div class="badge-plate hf-plate-ink">
            <svg class="warning-icon-svg" viewBox="0 0 48 48" fill="none">
              <path
                id="warn-triangle"
                d="M 24 6 L 43 40 L 5 40 Z"
                stroke="#FF6A1A"
                stroke-width="4.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <line
                id="warn-line"
                x1="24"
                y1="18"
                x2="24"
                y2="28"
                stroke="#FF6A1A"
                stroke-width="4.5"
                stroke-linecap="round"
              />
              <circle id="warn-dot" cx="24" cy="34" r="2.5" fill="#FF6A1A" />
            </svg>
            <span class="badge-tag hf-hl-orange">GIAI ĐOẠN 02</span>
            <span class="badge-title hf-text-light">NHIỆT PHÂN HỦY</span>
          </div>
        </div>
      </div>

      <!-- Lớp Spotlight bao trùm toàn scene -->
      <div class="bg-spotlight"></div>

      <!-- Dải cam thương hiệu cố định mép đáy -->
      <div class="bottom-brand-bar"></div>
    </div>

    <script>
      // Khởi tạo và đăng ký GSAP timeline seekable
      const tl = gsap.timeline({ paused: true });

      // Thiết lập đo và gán stroke-dash pattern cho SVG icon
      const trianglePath = document.getElementById("warn-triangle");
      const linePath = document.getElementById("warn-line");

      if (trianglePath && linePath) {
        const triLen = trianglePath.getTotalLength();
        const lineLen = linePath.getTotalLength();

        trianglePath.style.strokeDasharray = String(triLen);
        trianglePath.style.strokeDashoffset = String(triLen);

        linePath.style.strokeDasharray = String(lineLen);
        linePath.style.strokeDashoffset = String(lineLen);
      }

      // --- SHOT 1 MOTION (0.00s -> 2.34s) ---
      // Entrance Grow mở đầu bước xử lý cơ học
      tl.fromTo(
        "#shot1-media-wrap",
        { scale: 0.95, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0
      );

      // Ken Burns zoom-in tập trung vào lưỡi kéo cắt vụn tấm phim (1.0x -> 1.04x)
      tl.fromTo(
        "#shot1-img",
        { scale: 1.0 },
        { scale: 1.04, duration: 2.34, ease: "none" },
        0
      );

      // Badge "BĂM NHỎ CƠ HỌC" xuất hiện lúc 0.67s (8030ms)
      tl.fromTo(
        "#shot1-badge",
        { y: 28, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        0.67
      );

      // Badge mờ dần trước khi chuyển shot
      tl.to("#shot1-badge", { opacity: 0, duration: 0.2, ease: "power2.in" }, 2.05);

      // --- SHOT 2 MOTION (2.34s -> 6.20s) ---
      // Transition In: Cắt dứt khoát (cut) sang ngọn lửa thiêu rụi
      // Ken Burns zoom-out từ 1.06x về 1.0x thể hiện sự co cụm thành tro tàn
      tl.fromTo(
        "#shot2-img",
        { scale: 1.06 },
        { scale: 1.0, duration: 3.86, ease: "sine.out" },
        2.34
      );

      // Badge "NHIỆT PHÂN HỦY" xuất hiện lúc 2.69s (10050ms)
      tl.fromTo(
        "#shot2-badge",
        { y: 28, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        2.69
      );

      // SVG warning icon tự vẽ đường nét bắt đầu lúc 2.79s (10150ms)
      tl.to(
        "#warn-triangle",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        2.79
      );
      tl.to(
        "#warn-line",
        { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" },
        2.95
      );
      tl.fromTo(
        "#warn-dot",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.15, ease: "power2.out" },
        3.08
      );

      // Badge mờ dần sau khi giữ đủ thời lượng holdMs 1800ms
      tl.to("#shot2-badge", { opacity: 0, duration: 0.24, ease: "power2.in" }, 4.25);

      // Đăng ký timeline cho HyperFrames runtime
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s02"] = tl;
    </script>
  
    </template>
  </body>
</html>
