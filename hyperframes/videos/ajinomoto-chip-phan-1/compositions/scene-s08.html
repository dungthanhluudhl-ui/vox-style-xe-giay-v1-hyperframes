    /* ===================================================

  <!-- Standalone Root Composition (1080x1920, 12.63s duration: 82030 - 69400 = 12630ms) -->
  <div
    id="root"

  >
    <!-- Scene Clip S08 -->
    <section id="scene-s08" class="clip" data-start="0" data-duration="12.63">
      
      <!-- Nền biến thể 'chart' tài chính chuẩn Style Tokens (4 vạch kẻ + tick cam mép trái) -->
      <div id="chart-bg" class="chart-background">
        <div class="chart-grid-pattern"></div>
        
        <!-- Đường đo 20% (384px) -->
        <div class="chart-axis-line" style="top: 384px;">
          <div class="chart-tick"></div>
        </div>
        <!-- Đường đo 40% (768px) -->
        <div class="chart-axis-line" style="top: 768px;">
          <div class="chart-tick"></div>
        </div>
        <!-- Đường đo 60% (1152px) -->
        <div class="chart-axis-line" style="top: 1152px;">
          <div class="chart-tick"></div>
        </div>
        <!-- Đường đo 80% (1536px) -->
        <div class="chart-axis-line" style="top: 1536px;">
          <div class="chart-tick"></div>
        </div>
      </div>

      <!-- Camera Rig: Phân tách Pan (x) và Entrance (scale, rotation, opacity) -->
      <div id="camera-pan">
        <div id="camera-entrance">
          
          <!-- Băng dính kraft dán góc collage -->
          <div class="kraft-tape-top"></div>

          <!-- Khung Hero Asset img-02 -->
          <div class="hero-collage-card">
            <img
              id="hero-image-s08"

              src="assets/img-02-papercraft-tech-empire-diagram.jpg"

          </div>

          <!-- Vector Diagram nối biểu đồ tới các nhãn quyết định -->
          <svg class="diagram-svg-layer" viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Đường nối 1: Từ đồ thị dẫn vào Callout Niêm Yết -->
            <path
              id="diag-path-listing"
              d="M 220 500 L 220 560"

            <!-- Đường nối 2: Rẽ nhánh sang Chiến lược đột phá -->
            <path
              id="diag-path-strategy"

            />
            <!-- Đường nối 3: Dẫn lối vào Đế Chế Hoá Sinh -->
            <path
              id="diag-path-empire"
              d="M 640 980 L 640 1080 L 540 1180"

  <!-- SCRIPT ANIMATION ENGINE (Seekable, Deterministic, Single Paused GSAP Timeline) -->
  <script>
    // 1. Khởi tạo timeline paused bắt buộc theo hợp đồng HyperFrames
    const tl = gsap.timeline({
      paused: true,
      defaults: { ease: "power3.out" }
    });

    // 2. Đo và chuẩn bị các nét vẽ vector SVG bằng fromTo tường minh
    const pathListing = document.querySelector("#diag-path-listing");
    const lenListing = pathListing ? pathListing.getTotalLength() : 200;
    if (pathListing) {
      pathListing.style.strokeDasharray = lenListing;
      pathListing.style.strokeDashoffset = lenListing;
    }

    const pathStrategy = document.querySelector("#diag-path-strategy");
    const lenStrategy = pathStrategy ? pathStrategy.getTotalLength() : 350;
    if (pathStrategy) {
      pathStrategy.style.strokeDasharray = lenStrategy;
      pathStrategy.style.strokeDashoffset = lenStrategy;
    }

    const pathEmpire = document.querySelector("#diag-path-empire");
    const lenEmpire = pathEmpire ? pathEmpire.getTotalLength() : 280;
    if (pathEmpire) {
      pathEmpire.style.strokeDasharray = lenEmpire;
      pathEmpire.style.strokeDashoffset = lenEmpire;
    }

    // ========================================================
    // CHOREOGRAPHY BÁM SÁT SHOTLIST & STYLE DNA (Smooth beats bouncy)
    // Tổng duration: 12.63s
    // ========================================================

    // BEAT 1: ENTRANCE "SPIRAL" (0.0s -> 1.3s) trên #camera-entrance
    // Xoay nhẹ kết hợp phóng to dồn lực vào 1/3 đầu khung hình
    tl.fromTo("#camera-entrance", 
      {
        scale: 1.15,
        rotation: -4,
        opacity: 0
      },
      {
        scale: 1.0,
        rotation: 0,
        opacity: 1,
        duration: 1.3,
        ease: "power3.out"
      },
      0.0
    );

    // Kẻ các vạch trục chart tài chính xuất hiện từ trái sang phải
    tl.fromTo(".chart-axis-line",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.65, stagger: 0.08, ease: "power2.out" },
      0.15
    );

    // BEAT 2: PUNCH PHRASE "MỐC NĂM 1949" (atMs: 69580 -> 0.18s)
    tl.fromTo("#punch-kicker",
      { y: 25, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      0.18
    );
    tl.fromTo("#punch-title-card",
      { scale: 0.9, y: 35, opacity: 0, rotation: -2.5 },
      { scale: 1.0, y: 0, opacity: 1, rotation: -1.0, duration: 0.55, ease: "power3.out" },
      0.28
    );

    // CAMERA MOTION: PAN-RIGHT (1.3s -> 12.63s) trên riêng #camera-pan
    tl.fromTo("#camera-pan", 
      { x: 0, y: 0 },
      {
        x: -40,
        y: -10,
        duration: 11.33,
        ease: "none"
      },
      1.3
    );

    // BEAT 3: ICON MONEY + "NIÊM YẾT SÀN ĐẦU TƯ" (atMs: 72470 -> 3.07s)
    // Đường nét nối dẫn từ biểu đồ chứng khoán
    tl.fromTo("#diag-path-listing",
      { strokeDashoffset: lenListing },
      { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
      2.95
    );

    // Callout niêm yết xuất hiện
    tl.fromTo("#callout-listing",
      { scale: 0.85, opacity: 0, y: 20 },
      { scale: 1.0, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      3.07
    );

    // Biểu tượng tiền: smooth settle theo chuẩn Style DNA (không dùng back.out)
    tl.fromTo("#icon-money-box",
      { rotation: -12, scale: 0.85 },
      { rotation: 0, scale: 1.0, duration: 0.45, ease: "power3.out" },
      3.15
    );

    // BEAT 4: LABEL "CHIẾN LƯỢC ĐỘT PHÁ" (atMs: 76250 -> 6.85s)
    // Đường nét đứt rẽ nhánh xuất hiện
    tl.fromTo("#diag-path-strategy",
      { strokeDashoffset: lenStrategy },
      { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
      6.65
    );

    // Callout chiến lược đột phá trượt vào từ mép phải
    tl.fromTo("#callout-strategy",
      { x: 45, opacity: 0, scale: 0.92 },
      { x: 0, opacity: 1, scale: 1.0, duration: 0.5, ease: "power3.out" },
      6.85
    );

    // BEAT 5: LABEL "ĐẾ CHẾ HOÁ SINH" (atMs: 79200 -> 9.80s)
    // Đường dẫn kết nối chạm tới điểm kết
    tl.fromTo("#diag-path-empire",
      { strokeDashoffset: lenEmpire },
      { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
      9.55
    );

    // Card anh hùng cuối "Đế chế hóa sinh" nâng lên từ dưới
    tl.fromTo("#callout-empire",
      { y: 40, scale: 0.92, opacity: 0 },
      { y: 0, scale: 1.0, opacity: 1, duration: 0.6, ease: "power3.out" },
      9.80
    );

    // Biểu tượng phân tử: smooth settle theo chuẩn Style DNA (không dùng back.out)
    tl.fromTo("#icon-molecule-box",
      { rotation: -20, scale: 0.8 },
      { rotation: 0, scale: 1.0, duration: 0.5, ease: "power3.out" },
      9.90
    );

    // 3. ĐĂNG KÝ BẮT BUỘC TIMELINE LÊN GLOBAL OBJECT THEO COMPOSITION ID
    window.__timelines["scene-s08"] = tl;
  </script>

    </template>
