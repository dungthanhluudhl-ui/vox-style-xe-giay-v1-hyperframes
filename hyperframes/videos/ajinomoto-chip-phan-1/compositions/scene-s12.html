    .label-sub {

      font-weight: 700;

    }

    /* Fixed Signature Bottom Orange Bar */
    #bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: #FF6A1A;
      z-index: 999;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s12"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="5.72"
  >
    <!-- Background framing elements -->
    <div class="bg-tech-corners">
      <div class="corner-mark corner-tl"></div>
      <div class="corner-mark corner-tr"></div>
      <div class="corner-mark corner-bl"></div>
      <div class="corner-mark corner-br"></div>
    </div>

    <!-- Main Scene Clip -->
    <section id="scene-s12" class="clip" data-start="0" data-duration="5.72">

      <!-- Top Header Meta -->
      <div id="top-meta">
        <div class="meta-tag">BÁO CÁO CÔNG NGHỆ BÁN DẪN</div>
        <div class="meta-badge">EVIDENCE // S12</div>
      </div>

      <!-- Punch Phrase Overlay -->
      <div id="punch-phrase-wrapper">
        <h1 class="punch-title">VỊ THẾ TỐI HẬU</h1>
        <div id="punch-accent-line" class="punch-accent-bar"></div>
      </div>

      <!-- Hero Visual Card -->
      <div id="hero-card">
        <div id="hero-img-wrapper">
          <img
            id="hero-img"
            src="assets/img-01-hidden-tech-semiconductor-reveal-cutout.jpg"
            alt="Ajinomoto ABF Semiconductor Reveal"
          >
        </div>

        <!-- Frame Corners -->
        <div class="hero-bracket hero-b-tl"></div>
        <div class="hero-bracket hero-b-tr"></div>
        <div class="hero-bracket hero-b-bl"></div>
        <div class="hero-bracket hero-b-br"></div>

        <!-- Microcircuit Targeting Reticle -->
        <div id="chip-reticle">
          <div id="reticle-glow"></div>
          <svg class="reticle-svg" viewBox="0 0 320 220" fill="none">
            <path class="draw-reticle-path" d="M 10 40 L 10 10 L 40 10" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
            <path class="draw-reticle-path" d="M 280 10 L 310 10 L 310 40" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
            <path class="draw-reticle-path" d="M 310 180 L 310 210 L 280 210" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
            <path class="draw-reticle-path" d="M 40 210 L 10 210 L 10 180" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
            <line class="draw-reticle-path" x1="135" y1="110" x2="185" y2="110" stroke="#FF6A1A" stroke-width="3" stroke-linecap="round" />
            <line class="draw-reticle-path" x1="160" y1="85" x2="160" y2="135" stroke="#FF6A1A" stroke-width="3" stroke-linecap="round" />
          </svg>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Measure SVG stroke length for deterministic drawing
    const drawPaths = document.querySelectorAll(".draw-reticle-path");
    drawPaths.forEach(function (path) {
      const len = typeof path.getTotalLength === "function" ? path.getTotalLength() : 80;
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = len;
    });

    // 0.00s - 5.72s: Continuous slow zoom-out camera motion on hero image
    tl.fromTo(
      "#hero-img",
      { scale: 1.08 },
      { scale: 1.0, duration: 5.72, ease: "none" },
      0
    );

    // 0.05s: Hero Card punch arrival
    tl.fromTo(
      "#hero-card",
      { scale: 0.9, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.05
    );

    // 0.15s: Top meta header entrance
    tl.fromTo(
      "#top-meta",
      { y: -16, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
      0.15
    );

    // 0.25s: Corner bracket accents snap in
    tl.fromTo(
      ".hero-bracket",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out", stagger: 0.04 },
      0.25
    );

    // 0.35s: Hero info ribbon slides up
    tl.fromTo(
      "#hero-tag-ribbon",
      { y: 25, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
      0.35
    );

    // 1.39s (107550ms): Punch Phrase "VỊ THẾ TỐI HẬU" arrival
    tl.fromTo(
      "#punch-phrase-wrapper",
      { y: 28, opacity: 0, scale: 0.95 },
      { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
      1.39
    );

    // 1.55s: Punch accent underline expands
    tl.fromTo(
      "#punch-accent-line",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.4, ease: "power2.out" },
      1.55
    );

    // 3.34s (109500ms): Label "MẮT XÍCH ĐỘC QUYỀN" arrives
    tl.fromTo(
      "#label-card",
      { y: 32, opacity: 0, scale: 0.92 },
      { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
      3.34
    );

    // 3.34s: Targeting reticle locks onto the central semiconductor circuitry
    tl.fromTo(
      "#chip-reticle",
      { scale: 1.3, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      3.34
    );

    // 3.45s: Reticle paths progressively draw
    tl.to(
      ".draw-reticle-path",
      { strokeDashoffset: 0, duration: 0.4, ease: "power2.out", stagger: 0.03 },
      3.45
    );

    // 4.15s: Micro-pulse on reticle glow for active hold
    tl.fromTo(
      "#reticle-glow",
      { opacity: 0.3, scale: 0.96 },
      { opacity: 0.9, scale: 1.04, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 },
      4.15
    );

    // Register root timeline paused
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s12"] = tl;
  </script>
