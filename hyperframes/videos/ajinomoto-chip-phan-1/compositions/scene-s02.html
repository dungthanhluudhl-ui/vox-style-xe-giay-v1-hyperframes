      // Single paused master timeline for HyperFrames
      const tl = gsap.timeline({ paused: true });

      // 1. Camera Motion: Pan right across entire shot duration (10.12s)

        "#scene-camera",
        { x: -24 },
        { x: 24, duration: 10.12, ease: "none" },
        0
      );

      // 2. Entrance Transition: Rise trượt từ dưới lên
      tl.fromTo(
        "#doc-header",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: "power2.out" },
        0.15
      );
      tl.fromTo(
        "#hero-container",
        { y: 130, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.85, ease: "power3.out" },
        0.2
      );

      // 3. Idle Motion: Gentle sway ±1.5 độ (3 độ tổng biên độ)
      // Sử dụng các giá trị tuyệt đối hoàn toàn tất định
      tl.to("#hero-sway", { rotation: 1.5, duration: 2.2, ease: "sine.inOut" }, 1.05);
      tl.to("#hero-sway", { rotation: -1.5, duration: 2.4, ease: "sine.inOut" }, 3.25);
      tl.to("#hero-sway", { rotation: 1.5, duration: 2.4, ease: "sine.inOut" }, 5.65);
      tl.to("#hero-sway", { rotation: 0, duration: 2.07, ease: "sine.inOut" }, 8.05);

      // 4. Overlay 1: Punch phrase "KIKUNAE IKEDA" (atMs: 11230 -> 1.81s)
      tl.fromTo(
        "#punch-container",
        { y: 35, opacity: 0, scale: 0.9 },
        { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" },
        1.81
      );
      tl.fromTo(
        "#punch-accent",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power2.out" },
        2.05
      );

      // 5. Overlay 2: Label "TIẾN SĨ HOÁ HỌC" (atMs: 14050 -> 4.63s)
      tl.fromTo(
        "#milestone-1",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        4.63
      );
      tl.fromTo(
        "#badge-1",
        { scale: 0 },
        { scale: 1, duration: 0.35, ease: "power3.out" },
        4.78
      );

      // 6. Overlay 3: Icon pin + Label "DU HỌC ĐỨC" (atMs: 16140 -> 6.72s)
      tl.fromTo(
        "#milestone-2",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        6.72
      );
      tl.fromTo(
        "#pin-icon-svg",
        { scale: 0, rotation: -25 },
        { scale: 1, rotation: 0, duration: 0.4, ease: "power3.out" },
        6.87
      );

      // 7. Overlay 4: Label "ĐẠI HỌC TOKYO" (atMs: 17860 -> 8.44s)
      tl.fromTo(
        "#milestone-3",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        8.44
      );
      tl.fromTo(
        "#badge-3",
        { scale: 0 },
        { scale: 1, duration: 0.35, ease: "power3.out" },
        8.58
      );

      // Register timeline on global object with root composition id
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s02"] = tl;
    </script>
