    <!-- Root Composition -->
    <div

    <!-- GSAP Seekable Timeline Script -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Camera pan toàn cảnh sang trái mượt mà từ 0s đến 7.01s
      tl.to("#camera-stage", { x: -36, duration: 7.01, ease: "none" }, 0);

      // 2. Chấn động rung vỡ vụn lúc vào cảnh
      tl.to(
        "#shake-rig",
        {
          keyframes: [
            { x: -12, y: 7, duration: 0.05 },
            { x: 10, y: -6, duration: 0.05 },
            { x: -7, y: 4, duration: 0.05 },
            { x: 4, y: -2, duration: 0.05 },
            { x: 0, y: 0, duration: 0.08 }
          ],
          ease: "none"
        },
        0.02
      );

      // 3. Hiệu ứng vỡ vụn (shatter) bung các mảnh găm ra ngoài
      tl.fromTo(
        ".shard-1",
        { x: 0, y: 0, rotation: 0, opacity: 1 },
        { x: -180, y: -140, rotation: -16, opacity: 0, duration: 0.46, ease: "power3.in" },
        0.02
      );
      tl.fromTo(
        ".shard-2",
        { x: 0, y: 0, rotation: 0, opacity: 1 },
        { x: 200, y: -160, rotation: 14, opacity: 0, duration: 0.46, ease: "power3.in" },
        0.02
      );
      tl.fromTo(
        ".shard-3",
        { x: 0, y: 0, rotation: 0, opacity: 1 },
        { x: -160, y: 180, rotation: -12, opacity: 0, duration: 0.46, ease: "power3.in" },
        0.02
      );
      tl.fromTo(
        ".shard-4",
        { x: 0, y: 0, rotation: 0, opacity: 1 },
        { x: 210, y: 170, rotation: 18, opacity: 0, duration: 0.46, ease: "power3.in" },
        0.02
      );
      tl.fromTo(
        ".shatter-cracks",
        { opacity: 1 },
        { opacity: 0, duration: 0.35, ease: "power2.out" },
        0.08
      );

      // 4. Video scale bung nhẹ theo lực chấn động (chỉ 1 tween duy nhất trên video)
      tl.fromTo(
        "#vid-crisis",
        { scale: 1.04 },
        { scale: 1.0, duration: 0.45, ease: "power3.out" },
        0
      );

      // 5. Overlay 1: Punch phrase "KHỦNG HOẢNG 2021" (fromTo vào, to ra)
      tl.fromTo(
        "#punch-card",
        { y: -25, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power4.out" },
        0.42
      );
      tl.to(
        "#punch-card",
        { y: -20, opacity: 0, scale: 0.96, duration: 0.35, ease: "power2.in" },
        2.45
      );

      // 6. Overlay 2: Warning stamp "ĐỨT GÃY TOÀN CẦU" (fromTo vào, to ra)
      tl.fromTo(
        "#warning-stamp",
        { y: 30, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power4.out" },
        3.24
      );
      tl.to(
        "#warning-stamp",
        { y: 20, opacity: 0, scale: 0.95, duration: 0.35, ease: "power2.in" },
        5.45
      );

      // 7. Overlay 3: Label "TUYÊN BỐ TỪ INTEL" (fromTo vào lúc 5.91s, giữ đến hết 7.01s)
      tl.fromTo(
        "#intel-label",
        { x: -40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        5.91
      );

      // Đăng ký timeline gốc vào HyperFrames runtime
      window.__timelines["scene-s10"] = tl;
    </script>
