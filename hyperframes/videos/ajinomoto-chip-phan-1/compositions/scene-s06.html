<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background: #f5f0e4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f5f0e4;
      }

      /* Timed clip base rule following HyperFrames convention */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Camera rig & media layer */
      .media-viewport {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      .media-viewport video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Subtle vintage archival vignette */
      .vignette-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(20, 20, 20, 0) 58%, rgba(20, 20, 20, 0.38) 100%);
        pointer-events: none;
        z-index: 5;
      }

      /* Fixed Vox signature bottom accent bar */
      .bottom-signature-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background: #ff6a1a;
        z-index: 100;
        pointer-events: none;
      }

      /* Overlay 1: Partner Search Badge */
      .badge-partner-box {
        position: absolute;
        top: 220px;
        left: 60px;
        display: inline-flex;
        flex-direction: column;
        background: #141414;
        padding: 16px 28px;
        border-radius: 12px;
        box-shadow: 6px 8px 0px #ff6a1a;
        will-change: transform, opacity;
      }

      .badge-subtag {
        font-size: 18px;
        font-weight: 700;
        color: #ff6a1a;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 4px;
        line-height: 1.2;
      }

      .badge-maintext {
        font-size: 36px;
        font-weight: 900;
        color: #f7f4ec;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        line-height: 1.2;
      }

      /* Overlay 2: Person Callout Badge */
      .badge-suzuki-box {
        position: absolute;
        top: 480px;
        right: 60px;
        display: inline-flex;
        flex-direction: column;
        align-items: flex-end;
        background: #141414;
        padding: 18px 28px;
        border-radius: 12px;
        border-right: 6px solid #ff6a1a;
        box-shadow: -6px 8px 0px rgba(20, 20, 20, 0.4);
        will-change: transform, opacity;
      }

      .badge-suzuki-subtag {
        font-size: 18px;
        font-weight: 700;
        color: #ff6a1a;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 4px;
        line-height: 1.2;
      }

      .badge-suzuki-maintext {
        font-size: 42px;
        font-weight: 900;
        color: #f7f4ec;
        letter-spacing: 1px;
        text-transform: uppercase;
        line-height: 1.2;
      }

      /* Overlay 3: Punch Phrase Banner */
      .punch-banner-box {
        position: absolute;
        bottom: 430px;
        left: 60px;
        right: 60px;
        background: #141414;
        border-radius: 14px;
        padding: 26px 36px;
        box-shadow: 10px 14px 0px #ff6a1a;
        display: flex;
        flex-direction: column;
        justify-content: center;
        will-change: transform, opacity;
      }

      .punch-kicker {
        font-size: 22px;
        font-weight: 700;
        color: #ff6a1a;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 6px;
        line-height: 1.2;
      }

      .punch-headline {
        margin: 0;
        font-size: 68px;
        font-weight: 900;
        color: #f7f4ec;
        line-height: 1.25;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .punch-accent-line {
        display: block;
        width: 100%;
        height: 5px;
        background: #ff6a1a;
        margin-top: 14px;
        border-radius: 2px;
        transform-origin: left center;
        will-change: transform;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s06"
      data-width="1080"
      data-height="1920"
      data-duration="7.25"
    >
      <!-- Media viewport container: wobble-drop entrance + continuous zoom-out -->
      <div id="media-container" class="media-viewport" data-layout-allow-overflow="true">
        <video
          id="vid-handshake"
          data-start="0"
          data-duration="7.25"
          data-media-start="0.4"
          data-track-index="0"
          src="assets/vid-05-handshake-business-partnership-cutout.mp4"
          muted
          playsinline
        ></video>
        <div class="vignette-overlay"></div>
      </div>

      <!-- Overlay 1: TÌM KIẾM ĐỐI TÁC (atMs: 52730 -> 1.46s, holdMs: 2000 -> 2.0s) -->
      <div
        id="clip-overlay-1"
        class="clip"
        data-start="1.46"
        data-duration="2.0"
        data-track-index="1"
      >
        <div id="badge-partner" class="badge-partner-box">
          <span class="badge-subtag">MỤC TIÊU // GIAI ĐOẠN 1</span>
          <span class="badge-maintext">TÌM KIẾM ĐỐI TÁC</span>
        </div>
      </div>

      <!-- Overlay 2: ÔNG SUZUKI (atMs: 55380 -> 4.11s, holdMs: 1600 -> 1.6s) -->
      <div
        id="clip-overlay-2"
        class="clip"
        data-start="4.11"
        data-duration="1.6"
        data-track-index="2"
      >
        <div id="badge-suzuki" class="badge-suzuki-box">
          <span class="badge-suzuki-subtag">ĐỐI TÁC THƯƠNG MẠI</span>
          <span class="badge-suzuki-maintext">ÔNG SUZUKI</span>
        </div>
      </div>

      <!-- Overlay 3: BẮT TAY LỊCH SỬ (atMs: 56720 -> 5.45s, holdMs: 1800 -> 1.8s) -->
      <div
        id="clip-overlay-3"
        class="clip"
        data-start="5.45"
        data-duration="1.8"
        data-track-index="3"
      >
        <div id="punch-handshake" class="punch-banner-box">
          <span class="punch-kicker">LIÊN MINH CHIẾN LƯỢC</span>
          <h1 class="punch-headline">BẮT TAY LỊCH SỬ</h1>
          <span id="punch-line" class="punch-accent-line"></span>
        </div>
      </div>

      <!-- Permanent signature Vox bottom accent bar -->
      <div class="bottom-signature-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Wobble-drop transition in for media container (0s -> 0.75s)
      // Physical drop with slight angular momentum and weighted settle
      tl.fromTo(
        "#media-container",
        { y: -75, rotation: -1.6, scale: 1.08 },
        { y: 0, rotation: 0, scale: 1.05, duration: 0.75, ease: "power2.out" },
        0
      );

      // Camera motion: slow cinematic zoom-out from 1.05 down to 1.00
      tl.to(
        "#media-container",
        { scale: 1.0, duration: 6.5, ease: "sine.out" },
        0.75
      );

      // 2. Overlay 1: TÌM KIẾM ĐỐI TÁC (active 1.46s -> 3.46s)
      tl.fromTo(
        "#badge-partner",
        { opacity: 0, y: -24, scale: 0.92 },
        { opacity: 1, y: 0, scale: 1, duration: 0.38, ease: "power3.out" },
        1.46
      );
      tl.to(
        "#badge-partner",
        { opacity: 0, y: -12, duration: 0.28, ease: "power2.in" },
        3.18
      );

      // 3. Overlay 2: ÔNG SUZUKI (active 4.11s -> 5.71s)
      tl.fromTo(
        "#badge-suzuki",
        { opacity: 0, x: 36, scale: 0.92 },
        { opacity: 1, x: 0, scale: 1, duration: 0.35, ease: "power3.out" },
        4.11
      );
      tl.to(
        "#badge-suzuki",
        { opacity: 0, x: 18, duration: 0.28, ease: "power2.in" },
        5.42
      );

      // 4. Overlay 3: BẮT TAY LỊCH SỬ (active 5.45s -> 7.25s)
      tl.fromTo(
        "#punch-handshake",
        { opacity: 0, y: 44, scale: 0.92 },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
        5.45
      );

      // Accompanying animated orange underline reveal
      tl.fromTo(
        "#punch-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power2.out" },
        5.6
      );

      // Register the paused timeline with HyperFrames runtime
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s06"] = tl;
    </script>
  
    </template>
  </body>
</html>
