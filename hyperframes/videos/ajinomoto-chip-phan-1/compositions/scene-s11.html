    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Camera Subtle Push-In across scene duration (7.57s)
      tl.fromTo(
        "#camera-rig",
        { scale: 1 },
        { scale: 1.04, ease: "none", duration: 7.57 },
        0
      );

      // 2. Entrance Flip & Staggered Reveal
      tl.fromTo(
        "#quote-card",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.15
      );

      tl.fromTo(
        "#card-silicon",
        { x: -45, opacity: 0, rotationY: -10 },
        { x: 0, opacity: 1, rotationY: 0, duration: 0.7, ease: "power3.out" },
        0.3
      );

      tl.fromTo(
        "#card-abf",
        { x: 45, opacity: 0, rotationY: 10 },
        { x: 0, opacity: 1, rotationY: 0, duration: 0.7, ease: "power3.out" },
        0.45
      );

      tl.fromTo(
        "#vs-badge",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.65
      );

      // 3. Beat 1 (atMs: 100550 -> 1.96s scene time): Ban Stamp "KHÔNG THIẾU SILICON"
      const banSlash = document.getElementById("ban-slash");
      if (banSlash) {
        banSlash.style.strokeDasharray = "60";
        banSlash.style.strokeDashoffset = "60";
      }

      tl.fromTo(
        "#silicon-ban-stamp",
        { scale: 1.5, opacity: 0, rotation: -12 },
        { scale: 1, opacity: 1, rotation: -5, duration: 0.35, ease: "power4.out" },
        1.96
      );

      tl.to(
        "#ban-slash",
        { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
        1.96
      );

      tl.to(
        "#silicon-visual",
        { opacity: 0.35, duration: 0.4, ease: "power2.out" },
        2.05
      );

      tl.to(
        "#silicon-status",
        { opacity: 0.75, backgroundColor: "rgba(20, 20, 20, 0.04)", duration: 0.4, ease: "power2.out" },
        2.05
      );

      // 4. Beat 2 (atMs: 103690 -> 5.10s scene time): Punch Phrase "THIẾU CHẤT NỀN ABF"
      tl.to(
        "#card-abf",
        {
          borderColor: "#FF6A1A",
          boxShadow: "0 0 32px rgba(255, 106, 26, 0.45)",
          duration: 0.4,
          ease: "power2.out"
        },
        5.10
      );

      tl.fromTo(
        "#abf-punch-card",
        { scale: 0.88, opacity: 0, y: 16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
        5.10
      );

      tl.fromTo(
        "#abf-visual",
        { scale: 0.98 },
        { scale: 1.05, duration: 0.45, ease: "power3.out" },
        5.10
      );

      // Single paused master timeline registration
      window.__timelines["scene-s11"] = tl;
