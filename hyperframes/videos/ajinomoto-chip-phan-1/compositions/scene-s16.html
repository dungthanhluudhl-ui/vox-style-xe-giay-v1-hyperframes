    <script>
      const tl = gsap.timeline({ paused: true });

      // === 0.0s - 1.0s: ENTRANCE UNFOLD & CHART REVEAL ===
      tl.fromTo(
        ".chart-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.7, ease: "power2.out", stagger: 0.08 },
        0.05
      );

      tl.fromTo(
        "#header-block",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.15
      );

      // Unfold entrance for the collage paper card
      tl.fromTo(
        "#hero-card",
        { rotateX: -70, scaleY: 0.4, opacity: 0 },
        { rotateX: 0, scaleY: 1, opacity: 1, duration: 0.85, ease: "power3.out" },
        0.1
      );

      // Continuous subtle camera zoom-in across the whole scene
      tl.fromTo(
        "#hero-img",
        { scale: 1 },
        { scale: 1.07, duration: 8.35, ease: "none" },
        0.0
      );

      // === PHASE 1 (1.41s - 4.25s): NỬA BÀN TAY ===
      const caliperLines = document.querySelectorAll(".caliper-1");
      caliperLines.forEach((line) => {
        const len = line.getTotalLength ? line.getTotalLength() : 480;
        line.style.strokeDasharray = len;
        line.style.strokeDashoffset = len;
      });

      tl.to(
        ".caliper-1",
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        1.42
      );

      tl.fromTo(
        ".caliper-sub",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out" },
        1.65
      );

      tl.fromTo(
        "#badge-1",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.45
      );

      // Fade-out phase 1 elements smoothly before clip end
      tl.to(
        ["#badge-1", "#p1-graphics"],
        { opacity: 0, duration: 0.35, ease: "power2.in" },
        3.85
      );

      // === PHASE 2 (4.50s - 6.35s): CỠ MÓNG TAY ===
      tl.fromTo(
        "#reticle-box-el",
        { scale: 2.2, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        4.52
      );

      tl.fromTo(
        "#badge-2",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        4.55
      );

      tl.fromTo(
        "#p2-graphics svg",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out" },
        4.75
      );

      // Fade-out phase 2 before clip end
      tl.to(
        ["#badge-2", "#p2-graphics"],
        { opacity: 0, duration: 0.3, ease: "power2.in" },
        6.0
      );

      // === PHASE 3 (6.49s - 8.37s): HÀNG TỶ BÁN DẪN ===
      tl.fromTo(
        "#matrix-glow-el",
        { scale: 0.4, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        6.5
      );

      tl.fromTo(
        "#badge-3",
        { y: 40, scale: 0.95, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        6.52
      );

      // Deterministic innerText counter: snaps to 0.1 increments from 1.0 to 15.8 (seek-safe, no locale mutation)
      tl.fromTo(
        "#transistor-count",
        { innerText: 1.0 },
        {
          innerText: 15.8,
          snap: { innerText: 0.1 },
          duration: 1.35,
          ease: "power2.out",
        },
        6.58
      );

      // Register the single paused GSAP timeline
      window.__timelines["scene-s16"] = tl;
    </script>
