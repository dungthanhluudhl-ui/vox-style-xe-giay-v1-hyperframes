  <script>
    // BẮT BUỘC: Đăng ký timeline gốc paused duy nhất cho composition
    const tl = gsap.timeline({ paused: true });

    // 1. ENTRANCE: "grow" theo Scene Plan (t = 0s -> 0.75s)
    tl.fromTo("#scene-content",
      { scale: 0.92, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
      0
    );

    // 2. CAMERA MOTION: "zoom-in" chậm trên ảnh nền vintage trong suốt 11.46s
    tl.fromTo("#bg-photo-img",
      { scale: 1.0 },
      { scale: 1.10, duration: 11.46, ease: "none" },
      0
    );

    // 3. VẼ CÁC ĐƯỜNG KẺ BIỂU ĐỒ NGANG (CHART LINES & TICKS) (t = 0.2s -> 0.8s)
    tl.fromTo(".chart-h-line",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.6, stagger: 0.08, ease: "power2.out" },
      0.2
    );
    tl.fromTo(".chart-tick",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.4, stagger: 0.08, ease: "power2.out" },
      0.35
    );

    // 4. HEADER ARCHIVE & THẺ ẢNH CỔ ĐIỂN
    tl.fromTo("#archive-header",
      { opacity: 0, y: -20 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      0.4
    );
    tl.fromTo("#vintage-photo-card",
      { opacity: 0, y: 25 },
      { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
      0.5
    );

    // 5. CƠ CHẾ SƠ ĐỒ CHIẾT XUẤT (t = 1.0s -> 2.0s)
    tl.fromTo("#node-kombu",
      { scale: 0.85, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      1.0
    );
    tl.fromTo("#arrow-1",
      { opacity: 0, scale: 0.5 },
      { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" },
      1.3
    );
    tl.fromTo("#node-acid",
      { scale: 0.85, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      1.5
    );
    tl.fromTo("#arrow-2",
      { opacity: 0, scale: 0.5 },
      { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" },
      1.75
    );
    tl.fromTo("#node-food",
      { scale: 0.85, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      1.95
    );

    // 6. OVERLAY 1: "Ý TƯỞNG CHIẾT XUẤT" (atMs: 32990 -> 2.15s, holdMs: 2000 -> 4.15s)
    tl.fromTo("#overlay-1",
      { x: -50, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      2.15
    );
    // Hết thời gian hold: FADE OUT HOÀN TOÀN VỀ 0 (tránh giảm opacity làm hỏng contrast)
    tl.to("#overlay-1",
      { opacity: 0, x: -30, duration: 0.45, ease: "power2.in" },
      4.15
    );

    // 7. CỘT BIỂU ĐỒ DINH DƯỠNG DÂNG LÊN (t = 4.8s -> 5.8s)
    tl.fromTo("#pillar-1",
      { scaleY: 0 },
      { scaleY: 1, duration: 0.5, ease: "power3.out" },
      4.8
    );
    tl.fromTo("#pillar-2",
      { scaleY: 0 },
      { scaleY: 1, duration: 0.6, ease: "power3.out" },
      5.1
    );
    tl.fromTo("#pillar-3",
      { scaleY: 0 },
      { scaleY: 1, duration: 0.7, ease: "power3.out" },
      5.4
    );

    // 8. OVERLAY 2: "CẢI THIỆN THỂ TRẠNG" (atMs: 37020 -> 6.18s, holdMs: 2200 -> 8.38s)
