  <script>
    // HyperFrames Single Paused Timeline contract
    const tl = gsap.timeline({ paused: true });

    // 1. Entrance Motion: "zoom-through" camera plunge into micro scale
    tl.fromTo(
      "#hero-stage",
      { scale: 1.25, opacity: 0, y: 35 },
      { scale: 1.0, opacity: 1, y: 0, duration: 0.75, ease: "power3.out" },
      0.0
    );

    // Continuous subtle camera zoom-in across the scene
    tl.fromTo(
      "#hero-image",
      { scale: 1.0 },
      { scale: 1.15, duration: 6.59, ease: "none" },
      0.0
    );

    // 2. Reticle Callout Animation (scale in focused)
    tl.fromTo(
      "#reticle",
      { scale: 1.35, opacity: 0, rotation: -25 },
      { scale: 1.0, opacity: 1, rotation: 0, duration: 0.55, ease: "power2.out" },
      0.2
    );

    // 3. Overlay 1: Density Badge Entrance (atMs: 150090 -> rel: 0.22s)
    tl.fromTo(
      "#overlay-density",
      { scale: 0, opacity: 0, x: -30 },
      { scale: 1, opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
      0.22
    );

    // 4. Diagram Measurements Bars Progression
    tl.fromTo(
      "#bar-hair",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.7, ease: "power2.out" },
      0.8
    );

    tl.fromTo(
      "#bar-chip",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.7, ease: "power2.out" },
      1.1
    );

    // 5. Overlay 2: Punch Phrase Box Entrance (atMs: 153470 -> rel: 3.60s)
    tl.fromTo(
      "#overlay-punch",
      { scale: 0.9, opacity: 0, y: 35 },
      { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power4.out" },
      3.60
    );

    // Register paused timeline on window.__timelines
    window.__timelines["scene-s18"] = tl;
  </script>
