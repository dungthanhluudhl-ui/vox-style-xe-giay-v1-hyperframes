<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #0b0f14;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #F5F0E4;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      .bg-card {
        position: absolute;
        inset: 0;
        background-color: #F5F0E4;
        z-index: 1;
      }

      .scene-scale {
        position: absolute;
        inset: 0;
        z-index: 2;
        transform-origin: 50% 50%;
      }

      .camera-wrap {
        position: absolute;
        inset: 0;
        transform-origin: 50% 45%;
      }

      #chip-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Thanh cam nhận diện thương hiệu cố định mép đáy */
      .brand-bar-bottom {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 100;
        pointer-events: none;
      }

      /* Khối label biên tập: TRÁI TIM ĐIỆN TỬ */
      .label-layer {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 220px;
        pointer-events: none;
        z-index: 10;
      }

      .label-badge {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        background-color: #141414;
        color: #F7F4EC;
        padding: 14px 28px;
        border-radius: 4px;
        border-left: 6px solid #FF6A1A;
        box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.35), 0 10px 24px rgba(0, 0, 0, 0.4);
      }

      .label-icon-box {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #FF6A1A;
        width: 30px;
        height: 30px;
      }

      .chip-icon {
        width: 26px;
        height: 26px;
      }

      .label-text {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 32px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #F7F4EC;
      }

      /* Khối punch-phrase: KỲ QUAN CÔNG NGHỆ */
      .punch-layer {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 1240px;
        pointer-events: none;
        z-index: 20;
      }

      .punch-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #141414;
        padding: 24px 44px;
        border-radius: 4px;
        box-shadow: 10px 10px 0px #FF6A1A, 0 16px 36px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.08);
        text-align: center;
        max-width: 920px;
      }

      .punch-kicker-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }

      .punch-accent-bar {
        display: inline-block;
        width: 22px;
        height: 4px;
        background-color: #FF6A1A;
        border-radius: 2px;
      }

      .punch-kicker {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #FF6A1A;
      }

      .punch-title {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 64px;
        line-height: 1.25;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #F7F4EC;
        white-space: nowrap;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s15"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="5.43"
    >
      <!-- Nền phẳng phong cách card -->
      <div class="bg-card"></div>

      <!-- Khung video collage và hiệu ứng camera -->
      <div id="scene-scale" class="scene-scale">
        <div id="camera" class="camera-wrap" data-layout-allow-overflow="true">
          <video
            id="chip-video"
            src="assets/vid-01-holding-glowing-microchip-cutout.mp4"
            muted
            playsinline
            data-start="0"
            data-duration="5.43"
            data-media-start="1"
            data-track-index="0"
          ></video>
        </div>
      </div>

      <!-- Overlay 1: Nhãn diagram/annotation bổ sung thông tin (0.24s - 2.24s) -->
      <section
        id="label-clip"
        class="clip label-layer"
        data-start="0.24"
        data-duration="2.0"
        data-track-index="1"
      >
        <span id="label-badge" class="label-badge">
          <span class="label-icon-box" aria-hidden="true">
            <svg
              class="chip-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="4" y="4" width="16" height="16" rx="2" />
              <rect x="8" y="8" width="8" height="8" />
              <line x1="1" y1="9" x2="4" y2="9" />
              <line x1="1" y1="15" x2="4" y2="15" />
              <line x1="20" y1="9" x2="23" y2="9" />
              <line x1="20" y1="15" x2="23" y2="15" />
              <line x1="9" y1="1" x2="9" y2="4" />
              <line x1="15" y1="1" x2="15" y2="4" />
              <line x1="9" y1="20" x2="9" y2="23" />
              <line x1="15" y1="20" x2="15" y2="23" />
            </svg>
          </span>
          <span class="label-text">TRÁI TIM ĐIỆN TỬ</span>
        </span>
      </section>

      <!-- Overlay 2: Punch phrase điểm nhấn cao trào (3.29s - 5.43s) -->
      <section
        id="punch-clip"
        class="clip punch-layer"
        data-start="3.29"
        data-duration="2.14"
        data-track-index="1"
      >
        <span id="punch-card" class="punch-card">
          <span class="punch-kicker-row">
            <span class="punch-accent-bar" aria-hidden="true"></span>
            <span class="punch-kicker">PHÁT MINH PHỨC TẠP NHẤT</span>
          </span>
          <span class="punch-title">KỲ QUAN CÔNG NGHỆ</span>
        </span>
      </section>

      <!-- Thanh cam đáy cố định nhận diện thương hiệu -->
      <div class="brand-bar-bottom" aria-hidden="true"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Hiệu ứng grow vào cảnh cho toàn bộ cấu trúc video
      tl.fromTo(
        "#scene-scale",
        { scale: 0.84, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
        0
      );

      // 2. Chuyển động camera zoom-in liên tục tạo chiều sâu vào con chip
      tl.fromTo(
        "#camera",
        { scale: 1.0 },
        { scale: 1.10, duration: 5.43, ease: "sine.inOut" },
        0
      );

      // 3. Label overlay: TRÁI TIM ĐIỆN TỬ (xuất hiện tại 0.24s, kết thúc tại 2.24s)
      tl.fromTo(
        "#label-badge",
        { opacity: 0, y: -20, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" },
        0.24
      );
      tl.to(
        "#label-badge",
        { opacity: 0, y: -14, duration: 0.24, ease: "power2.in" },
        2.00
      );

      // 4. Punch phrase: KỲ QUAN CÔNG NGHỆ (xuất hiện tại 3.29s, giữ vững đến hết cảnh)
      tl.fromTo(
        "#punch-card",
        { opacity: 0, scale: 0.88, y: 30 },
        { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" },
        3.29
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s15"] = tl;
    </script>
  
    </template>
  </body>
</html>
