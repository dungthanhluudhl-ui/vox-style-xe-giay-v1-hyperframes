      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Background & Spotlight */
      .bg-base {
        position: absolute;
        inset: 0;
        background-color: #e7e3d9;
      }
      .bg-grid {
        position: absolute;
        inset: 0;
        background-size: 84px 84px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px);
        opacity: 0.85;
      }
      .bg-spotlight {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 48%,
          rgba(231, 227, 217, 0) 25%,
          rgba(20, 20, 20, 0.18) 65%,
          rgba(20, 20, 20, 0.42) 100%
        );
      }

      /* Hero Collage Stage */
      .hero-stage {
        position: absolute;
        left: 120px;
        top: 250px;
        width: 840px;
        height: 1240px;
        display: flex;
        flex-direction: column;
        align-items: center;
        transform-origin: 50% 30%;
      }
      .hero-card {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 12px;
        background-color: #141414;
        box-shadow: 12px 18px 0px rgba(20, 20, 20, 0.85);
        border: 3px solid #141414;
        overflow: hidden;
        transform-origin: 50% 10%;
      }
      .hero-img-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 50% 50%;
        display: block;
      }

      /* Split Dual Sub-Headers on Hero Card */
      .split-bar {
        position: absolute;
        top: 24px;
        left: 24px;
        right: 24px;
        display: flex;
        justify-content: space-between;
        z-index: 10;
      }
      .split-pill {
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .split-pill.left-pill {
        background-color: #f5f0e4;
        color: #141414;
        border: 2px solid #141414;
        box-shadow: 3px 3px 0px #141414;
      }
      .split-pill.right-pill {
        background-color: #141414;
        color: #ff6a1a;
        border: 2px solid #ff6a1a;
        box-shadow: 3px 3px 0px rgba(255, 106, 26, 0.4);
      }

      /* Decorative Paper Tape at Card Corners */
      .paper-tape {
        position: absolute;
        width: 110px;
        height: 32px;
        background: rgba(245, 240, 228, 0.92);
        border: 1px solid rgba(20, 20, 20, 0.25);
        z-index: 15;
      }
      .tape-tl {
        top: -12px;
        left: -20px;
        transform: rotate(-18deg);
      }
      .tape-tr {
        top: -12px;
        right: -20px;
        transform: rotate(18deg);
      }

      /* Top Question Badge (Overlay 1) */
      .question-wrapper {
        position: absolute;
        top: 175px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        z-index: 40;
      }
      .question-pill {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        background-color: #141414;
        padding: 14px 28px;
        border-radius: 50px;
        border: 2px solid #ff6a1a;
        box-shadow: 0px 8px 24px rgba(20, 20, 20, 0.4);
      }
      .question-svg {
        width: 38px;
        height: 38px;
        flex-shrink: 0;
      }
      .question-title {
        color: #f7f4ec;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 1px;
      }

      /* Callout Badges (Overlay 2 & Overlay 3) */
      .callout-wrapper {
        position: absolute;
        z-index: 40;
      }
      .callout-left {
        left: 60px;
        top: 1150px;
      }
      .callout-right {
        right: 60px;
        top: 1150px;
      }
      .badge-card {
        background-color: #141414;
        border-radius: 12px;
        padding: 16px 24px;
        border: 3px solid #141414;
        box-shadow: 6px 8px 0px rgba(20, 20, 20, 0.9);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .badge-card.card-orange-border {
        border-color: #ff6a1a;
        box-shadow: 6px 8px 0px #ff6a1a;
      }
      .badge-tag {
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 1px;
        color: #ff6a1a;
        text-transform: uppercase;
      }
      .badge-title {
        font-size: 32px;
        font-weight: 900;
        color: #f7f4ec;
        margin: 0;
        line-height: 1.25;
        white-space: nowrap;
      }

      /* Signature Vox Orange Bottom Bar */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s13"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.16"
    >
      <!-- Base Layer: Scene Setup & Hero Art (0s - 7.16s) -->
      <section id="scene-base" class="clip" data-start="0" data-duration="7.16">
        <div class="bg-base"></div>
        <div id="bg-grid" class="bg-grid"></div>
        <div class="bg-spotlight"></div>

        <!-- Center Hero Stage with Torn Split Collage Asset -->
        <div id="hero-stage" class="hero-stage">
          <div class="paper-tape tape-tl"></div>
          <div class="paper-tape tape-tr"></div>

          <div id="hero-card" class="hero-card">
            <!-- Visual Dual Indicators -->
            <div class="split-bar">
              <span class="split-pill left-pill">GIA VỊ NẤU ĂN</span>
              <span class="split-pill right-pill">SIÊU CHIP BÁN DẪN</span>
            </div>

            <!-- Main Torn Paper Collage Image -->
            <div class="hero-img-wrap">
              <img
                id="hero-img"
                class="hero-img"
                src="assets/img-01-hidden-tech-semiconductor-reveal-cutout.jpg"
                alt="Ajinomoto seasoning bag torn open revealing AI semiconductor circuitry"
              />
            </div>
          </div>
        </div>

        <!-- Permanent Brand Bottom Bar -->
        <div class="brand-bottom-bar"></div>
      </section>

      <!-- Overlay 1: Paradox Question Badge (0.24s - 2.44s) -->
      <section
        id="overlay-question-sec"
        class="clip"
        data-start="0.24"
        data-duration="2.20"
      >
        <div class="question-wrapper">
          <div id="question-pill-inner" class="question-pill">
            <svg class="question-svg" viewBox="0 0 38 38" fill="none">
              <path
                id="q-path"
                d="M 12 15 C 12 9, 26 9, 26 16 C 26 21, 19 22, 19 26"
                stroke="#FF6A1A"
                stroke-width="4.5"
                stroke-linecap="round"
                fill="none"
              />
              <circle id="q-dot" cx="19" cy="32" r="2.8" fill="#FF6A1A" />
            </svg>
            <span class="question-title">NGHỊCH LÝ KHÓ HIỂU</span>
          </div>
        </div>
      </section>

      <!-- Overlay 2: Food Label (3.13s - 4.93s) -->
      <section
        id="overlay-food-sec"
        class="clip"
        data-start="3.13"
        data-duration="1.80"
      >
        <div class="callout-wrapper callout-left">
          <div id="badge-food-inner" class="badge-card">
            <span class="badge-tag">NGÀNH THỰC PHẨM</span>
            <h3 class="badge-title">GIA VỊ NẤU ĂN</h3>
          </div>
        </div>
      </section>

      <!-- Overlay 3: Chip Label (5.32s - 7.16s) -->
      <section
        id="overlay-chip-sec"
        class="clip"
        data-start="5.32"
        data-duration="1.84"
      >
        <div class="callout-wrapper callout-right">
          <div id="badge-chip-inner" class="badge-card card-orange-border">
            <span class="badge-tag">CÔNG NGHỆ CAO</span>
            <h3 class="badge-title">SIÊU CHIP BÁN DẪN</h3>
          </div>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Setup Question SVG Path Length
      const qPathEl = document.getElementById("q-path");
      if (qPathEl) {
        const qPathLen = qPathEl.getTotalLength();
        qPathEl.style.strokeDasharray = qPathLen;
        qPathEl.style.strokeDashoffset = qPathLen;
      }

      // ==========================================
      // 1. Hero Peel Entrance & Parallax Motion
      // ==========================================
      // Peel entrance: Paper uncurls top-down with subtle rotation settle
      tl.fromTo(
        "#hero-card",
        {
          clipPath: "polygon(0% 0%, 100% 0%, 100% 0%, 0% 0%)",
          scale: 0.93,
          rotation: -1.8,
          opacity: 0,
        },
        {
          clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)",
          scale: 1,
          rotation: 0,
          opacity: 1,
          duration: 0.85,
          ease: "power3.out",
        },
        0.05
      );

      // Continuous subtle parallax camera drift throughout 7.16s
      tl.to(
        "#hero-img",
        {
          scale: 1.06,
          y: -18,
          duration: 7.16,
          ease: "sine.inOut",
        },
        0
      );

      tl.to(
        "#bg-grid",
        {
          y: -14,
          duration: 7.16,
          ease: "none",
        },
        0
      );

      // ==========================================
      // 2. Overlay 1: Paradox Question Pill (0.24s - 2.44s)
      // ==========================================
      tl.fromTo(
        "#question-pill-inner",
        { y: -36, opacity: 0, scale: 0.9 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        0.24
      );

      tl.to(
        "#q-path",
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        0.36
      );

      tl.fromTo(
        "#q-dot",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.22, ease: "back.out(2)" },
        0.72
      );

      tl.to(
        "#question-pill-inner",
        { y: -22, opacity: 0, duration: 0.32, ease: "power2.in" },
        2.12
      );

      // ==========================================
      // 3. Overlay 2: Food Label (3.13s - 4.93s)
      // ==========================================
      tl.fromTo(
        "#badge-food-inner",
        { x: -50, opacity: 0, scale: 0.88 },
        { x: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        3.13
      );

      tl.to(
        "#badge-food-inner",
        { x: -30, opacity: 0, duration: 0.3, ease: "power2.in" },
        4.63
      );

      // ==========================================
      // 4. Overlay 3: Chip Label (5.32s - 7.16s)
      // ==========================================
      tl.fromTo(
        "#badge-chip-inner",
        { x: 50, opacity: 0, scale: 0.88 },
        { x: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        5.32
      );

      tl.to(
        "#badge-chip-inner",
        { x: 30, opacity: 0, duration: 0.3, ease: "power2.in" },
        6.86
      );

      // Register Paused Timeline on Root Composition
      window.__timelines["scene-s13"] = tl;
    </script>
  
    </template>
  </body>
</html>
