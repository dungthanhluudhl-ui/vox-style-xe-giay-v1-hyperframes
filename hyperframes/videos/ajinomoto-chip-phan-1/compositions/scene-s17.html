    <!-- Animation Choreography -->
    <script>
      // Pure deterministic number formatter (e.g. 1700 -> "1.700")
      function formatNumberVi(num) {
        const rounded = Math.round(Number(num) || 0);
        if (rounded >= 1000) {
          const thousands = Math.floor(rounded / 1000);
          const remainder = rounded % 1000;
          const remainderStr =
            remainder < 10
              ? "00" + remainder
              : remainder < 100
                ? "0" + remainder
                : String(remainder);
          return thousands + "." + remainderStr;
        }
        return String(rounded);
      }

      const tl = gsap.timeline({ paused: true });

      // 1. Strike Entrance: Video and Overlays impact
      tl.fromTo(
        "#cpu-video",
        { scale: 1.1, opacity: 0, y: -20 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.35, ease: "power4.out" },
        0
      );

      tl.fromTo(
        "#overlays",
        { opacity: 0 },
        { opacity: 1, duration: 0.2, ease: "power2.out" },
        0
      );

      tl.fromTo(
        "#header-bar",
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        0.1
      );

      // 2. Deterministic Laser Scan: Two explicit passes ending cleanly before counter
      tl.fromTo(
        "#scan-laser",
        { y: 0 },
        { y: 760, duration: 1.4, ease: "power1.inOut" },
        0.4
      );
      tl.fromTo(
        "#scan-laser",
        { y: 760 },
        { y: 0, duration: 1.4, ease: "power1.inOut" },
        1.8
      );
      tl.fromTo(
        "#scan-laser",
        { opacity: 1 },
        { opacity: 0, duration: 0.25, ease: "power1.out" },
        3.25
      );

      // 3. Overlay 1: "CHÂN TRUYỀN DỮ LIỆU" (atMs: 1.12s, hold: 2.2s -> 3.32s)
      tl.fromTo(
        "#label-data-pins",
        { y: 24, opacity: 0, scale: 0.9 },
        { y: 0, opacity: 1, scale: 1.0, duration: 0.38, ease: "power3.out" },
        1.12
      );
      tl.fromTo(
        "#label-data-pins",
        { y: 0, opacity: 1 },
        { y: -12, opacity: 0, duration: 0.28, ease: "power2.in" },
        3.04
      );

      // 4. Counter HUD Card Entry (t = 3.6s)
      tl.fromTo(
        "#counter-card",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        3.6
      );

      // 5. Deterministic Pin Counter (Tweens DOM text directly with modifiers)
      tl.fromTo(
        "#pin-counter-val",
        { innerText: 0 },
        {
          innerText: 1700,
          duration: 2.69,
          ease: "power2.out",
          snap: { innerText: 1 },
          modifiers: {
            innerText: function (val) {
              return formatNumberVi(val);
            },
          },
        },
        4.0
      );

      // Matrix pin dots activation with explicit from/to states
      tl.fromTo(
        ".matrix-pin-dot",
        {
          backgroundColor: "rgba(20, 20, 20, 0.15)",
          borderColor: "rgba(20, 20, 20, 0.4)",
        },
        {
          backgroundColor: "#ff6a1a",
          borderColor: "#ff6a1a",
          stagger: 0.09,
          duration: 0.15,
          ease: "power1.out",
        },
        4.1
      );

      // 6. Overlay 2: "CORE I7 GEN 14" (atMs: 5.01s, hold: 1.8s -> 6.81s)
      tl.fromTo(
        "#label-core-i7",
        { y: -20, opacity: 0, scale: 0.88 },
        { y: 0, opacity: 1, scale: 1.0, duration: 0.35, ease: "power3.out" },
        5.01
      );
      tl.fromTo(
        "#label-core-i7",
        { opacity: 1, scale: 1.0 },
        { opacity: 0, scale: 0.92, duration: 0.25, ease: "power2.in" },
        6.56
      );

      // 7. Overlay 3: Punch Phrase Banner (atMs: 6.69s, hold: 1.52s -> 8.21s)
      tl.fromTo(
        "#punch-card",
        { scale: 0.9, opacity: 0, y: 20 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.38, ease: "power4.out" },
        6.69
      );

      // Register the paused timeline with the exact root data-composition-id
      window.__timelines["scene-s17"] = tl;
    </script>
