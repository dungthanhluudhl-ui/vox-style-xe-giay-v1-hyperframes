<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Quy ước clip full-frame chuẩn của HyperFrames */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Nền ô vuông 84px đặc trưng Vox style */
      #bg-grid {
        position: absolute;
        inset: 0;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        z-index: 1;
      }

      /* Dải cam cố định ở chân khung hình nhận diện thương hiệu */
      #brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 16px;
        background-color: #FF6A1A;
        z-index: 100;
      }

      /* Video shot 1 đặt trực tiếp dưới root, mang timing chuẩn */
      #vid-04 {
        position: absolute;
        top: 218px;
        left: 60px;
        width: 960px;
        height: 1200px;
        object-fit: cover;
        border: 4px solid #141414;
        border-radius: 0 0 8px 8px;
        box-shadow: 14px 14px 0px #141414, 20px 20px 0px #FF6A1A;
        background-color: #141414;
        z-index: 10;
        display: block;
      }

      /* Header meta trên đầu media card */
      .card-meta {
        position: absolute;
        top: 170px;
        left: 60px;
        width: 960px;
        height: 48px;
        background-color: #141414;
        color: #F7F4EC;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 2px;
        display: flex;
        align-items: center;
        padding: 0 24px;
        border-radius: 8px 8px 0 0;
        border: 4px solid #141414;
        border-bottom: 2px solid rgba(247, 244, 236, 0.15);
        text-transform: uppercase;
        z-index: 15;
      }

      /* Khung thẻ chứa media tĩnh của shot 2 */
      .media-card-frame {
        position: absolute;
        top: 218px;
        left: 60px;
        width: 960px;
        height: 1200px;
        overflow: hidden;
        border: 4px solid #141414;
        border-radius: 0 0 8px 8px;
        box-shadow: 14px 14px 0px #141414, 20px 20px 0px #FF6A1A;
        background-color: #141414;
        z-index: 10;
      }

      .media-content {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      /* Các class định vị bắt buộc có position: absolute */
      .badge-top-left {
        position: absolute;
        top: 246px;
        left: 95px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background-color: #141414;
        color: #F7F4EC;
        padding: 12px 24px;
        border-radius: 6px;
        border-left: 6px solid #FF6A1A;
        box-shadow: 8px 8px 0px rgba(20, 20, 20, 0.4);
        z-index: 25;
        will-change: transform, opacity;
      }

      .icon-badge-pos {
        position: absolute;
        top: 246px;
        left: 95px;
      }

      .badge-question {
        position: absolute;
        top: 246px;
        left: 95px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background-color: #141414;
        color: #F7F4EC;
        padding: 12px 24px;
        border-radius: 6px;
        border-left: 6px solid #FF6A1A;
        box-shadow: 8px 8px 0px rgba(20, 20, 20, 0.4);
        z-index: 25;
        will-change: transform, opacity;
      }

      .punch-pos {
        position: absolute;
        top: 1000px;
        left: 90px;
        width: 900px;
      }

      .punch-card {
        background-color: #141414;
        border: 4px solid #FF6A1A;
        border-radius: 8px;
        padding: 28px 36px;
        box-shadow: 12px 12px 0px #141414, 18px 18px 0px #FF6A1A;
        z-index: 30;
        will-change: transform, opacity;
      }

      .badge-bottom-left {
        position: absolute;
        top: 1180px;
        left: 95px;
      }

      .badge-kombu {
        position: absolute;
        top: 1180px;
        left: 95px;
        display: flex;
        flex-direction: column;
        background-color: #FF6A1A;
        border: 4px solid #141414;
        border-radius: 8px;
        padding: 20px 32px;
        box-shadow: 10px 10px 0px #141414;
        z-index: 25;
        will-change: transform, opacity;
      }

      /* Chi tiết đồ hoạ badge và punch card */
      .badge-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: #FF6A1A;
        flex-shrink: 0;
      }

      .badge-text {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #F7F4EC;
      }

      .badge-icon-q {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 2.5px solid #FF6A1A;
        color: #FF6A1A;
        font-size: 22px;
        font-weight: 900;
        line-height: 1;
        flex-shrink: 0;
      }

      .punch-tag {
        display: inline-block;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #141414;
        background-color: #FF6A1A;
        padding: 4px 12px;
        border-radius: 3px;
        margin-bottom: 12px;
        text-transform: uppercase;
      }

      .punch-title {
        margin: 0 0 10px 0;
        font-size: 54px;
        font-weight: 900;
        line-height: 1.22;
        letter-spacing: -1px;
        color: #F7F4EC;
        text-transform: uppercase;
      }

      .highlight-orange {
        color: #FF6A1A;
      }

      .punch-sub {
        margin: 0;
        font-size: 23px;
        font-weight: 700;
        line-height: 1.35;
        color: #E7E3D9;
      }

      .accent-badge-tag {
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 1.5px;
        color: #141414;
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      .accent-badge-title {
        font-size: 46px;
        font-weight: 900;
        line-height: 1.15;
        color: #141414;
        text-transform: uppercase;
      }
    </style>

    <!-- Composition root độc lập (untimed, không data-start) -->
    <div
      id="root"
      data-composition-id="scene-s03"
      data-width="1080"
      data-height="1920"
      data-duration="11.3"
    >
      <!-- Nền lưới kiến trúc chung (untimed) -->
      <div id="bg-grid"></div>

      <!-- Shot 1: Video đặt trực tiếp dưới root, mang timing độc lập (0.0s - 7.66s) -->
      <video
        id="vid-04"
        src="assets/vid-04-vintage-japanese-meal-serving.mp4"
        data-start="0"
        data-duration="7.66"
        data-media-start="0.2"
        muted
        playsinline
      ></video>

      <!-- Shot 1 Meta Bar (0.0s - 7.66s) -->
      <div id="shot-1-meta-clip" class="clip" data-start="0" data-duration="7.66" style="z-index: 15;">
        <div id="meta-shot-1" class="card-meta">
          TÔKYO, 1908 • BỮA CƠM TẠI GIA
        </div>
      </div>

      <!-- Shot 1 - Overlay 1: BỮA CƠM GIA ĐÌNH (0.65s - 2.45s) -->
      <div id="badge-family-clip" class="clip" data-start="0.65" data-duration="1.8" style="z-index: 25;">
        <div id="badge-family-inner" class="badge-top-left">
          <span class="badge-dot"></span>
          <span class="badge-text">BỮA CƠM GIA ĐÌNH</span>
        </div>
      </div>

      <!-- Shot 1 - Overlay 2: BÁT CANH NÓNG HỔI (2.68s - 4.48s) -->
      <div id="badge-soup-clip" class="clip" data-start="2.68" data-duration="1.8" style="z-index: 25;">
        <div id="badge-soup-inner" class="badge-top-left">
          <span class="badge-dot"></span>
          <span class="badge-text">BÁT CANH NÓNG HỔI</span>
        </div>
      </div>

      <!-- Shot 1 - Overlay 3: Punch-phrase HƯƠNG VỊ LẠ LÙNG (5.23s - 7.43s) -->
      <div id="punch-box-clip" class="clip" data-start="5.23" data-duration="2.2" style="z-index: 30;">
        <div id="punch-box-inner" class="punch-pos punch-card">
          <div class="punch-tag">BẤT NGỜ PHÁT HIỆN</div>
          <div class="punch-title">HƯƠNG VỊ <span class="highlight-orange">LẠ LÙNG</span></div>
          <div class="punch-sub">Vị ngọt đậm đà khác hẳn mọi món ăn từng nếm</div>
        </div>
      </div>

      <!-- Shot 2: CẬN CẢNH BÁT CANH & TẢO BẸ (7.66s - 11.3s) -->
      <section id="shot-2-clip" class="clip" data-start="7.66" data-duration="3.64" style="z-index: 20;">
        <div id="meta-shot-2" class="card-meta">
          CHI TIẾT • MANH MỐI BÁT CANH
        </div>
        <div id="shot-2-frame" class="media-card-frame">
          <img
            id="img-07"
            class="media-content"
            src="assets/img-07-vintage-japanese-served-soup-cutout.jpg"
            alt="Bát canh và nhánh tảo bẹ"
            data-layout-allow-overflow="true"
          />
        </div>
      </section>

      <!-- Shot 2 - Overlay 4: Icon dấu hỏi & NGUỒN GỐC VỊ NGON (7.86s - 9.46s) -->
      <div id="badge-question-clip" class="clip" data-start="7.86" data-duration="1.6" style="z-index: 25;">
        <div id="badge-question-inner" class="icon-badge-pos badge-question">
          <span class="badge-icon-q">?</span>
          <span class="badge-text">NGUỒN GỐC VỊ NGON</span>
        </div>
      </div>

      <!-- Shot 2 - Overlay 5: Tiết lộ TẢO BẸ KOMBU (10.49s - 11.3s, clamp 0.81s) -->
      <div id="badge-kombu-clip" class="clip" data-start="10.49" data-duration="0.81" style="z-index: 25;">
        <div id="badge-kombu-inner" class="badge-bottom-left badge-kombu">
          <div class="accent-badge-tag">BÍ MẬT TỪ NƯỚC DÙNG</div>
          <div class="accent-badge-title">TẢO BẸ KOMBU</div>
        </div>
      </div>

      <!-- Dải cam đáy cố định nhận diện thương hiệu -->
      <div id="brand-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // === SHOT 1 (0.0s - 7.66s) ===
      // vid-04 là timed video do HyperFrames quản lý phát tự động, không tween trực tiếp trên nó

      // Entrance cho card-meta shot 1
      tl.fromTo(
        "#meta-shot-1",
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        0.1
      );

      // Overlay 1: BỮA CƠM GIA ĐÌNH (0.65s - 2.45s)
      tl.fromTo(
        "#badge-family-inner",
        { y: -18, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" },
        0.65
      );

      // Overlay 2: BÁT CANH NÓNG HỔI (2.68s - 4.48s)
      tl.fromTo(
        "#badge-soup-inner",
        { y: -18, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" },
        2.68
      );

      // Overlay 3: Punch-phrase HƯƠNG VỊ LẠ LÙNG (5.23s - 7.43s)
      tl.fromTo(
        "#punch-box-inner",
        { scale: 0.88, opacity: 0, y: 22 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        5.23
      );

      // === SHOT 2 (7.66s - 11.3s) ===
      // Entrance cho card-meta shot 2
      tl.fromTo(
        "#meta-shot-2",
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        7.66
      );

      // Đúng 1 tween fromTo duy nhất kết hợp cả opacity, scale và x pan cho img-07
      tl.fromTo(
        "#img-07",
        { opacity: 0, x: 18, scale: 1.04 },
        { opacity: 1, x: -18, scale: 1.04, duration: 3.64, ease: "sine.out" },
        7.66
      );

      // Overlay 4: Icon dấu hỏi & NGUỒN GỐC VỊ NGON (7.86s - 9.46s)
      tl.fromTo(
        "#badge-question-inner",
        { y: -18, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" },
        7.86
      );

      // Overlay 5: Tiết lộ TẢO BẸ KOMBU (10.49s - 11.3s)
      tl.fromTo(
        "#badge-kombu-inner",
        { scale: 0.9, opacity: 0, y: 16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        10.49
      );

      // Đăng ký timeline paused vào window.__timelines["scene-s03"]
      window.__timelines["scene-s03"] = tl;
    </script>
  
    </template>
  </body>
</html>
