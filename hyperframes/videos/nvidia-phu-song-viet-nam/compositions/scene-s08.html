<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Nền biến thể Chart & Lưới Vox */
      #chart-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }
      .chart-grid-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 1px;
        background: rgba(20, 20, 20, 0.22);
      }
      .chart-tick {
        position: absolute;
        left: 0;
        width: 18px;
        height: 3px;
        background: #FF6A1A;
      }

      /* Media styling */
      .media-asset {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Lớp phủ tương phản bảo vệ chữ */
      .scene-scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(20, 20, 20, 0.72) 0%,
          rgba(20, 20, 20, 0.35) 45%,
          rgba(20, 20, 20, 0.65) 100%
        );
        pointer-events: none;
      }

      /* Container chứa các phần tử giao diện trong vùng an toàn */
      .ui-container {
        position: absolute;
        top: 200px;
        left: 60px;
        right: 60px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        pointer-events: none;
        z-index: 10;
      }

      /* Nhãn phân loại cấp cao (Tag Pill) */
      .vox-tag {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: #141414;
        color: #FF6A1A;
        font-size: 24px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 2px;
        padding: 10px 22px;
        border-radius: 6px;
        border-left: 5px solid #FF6A1A;
        margin-bottom: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        will-change: transform, opacity;
      }

      /* Punch Phrase Card */
      .punch-card {
        background: rgba(20, 20, 20, 0.94);
        border: 2px solid rgba(255, 106, 26, 0.85);
        border-radius: 16px;
        padding: 30px 40px;
        max-width: 960px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
        will-change: transform, opacity;
      }
      .punch-text {
        margin: 0;
        font-size: 58px;
        font-weight: 900;
        line-height: 1.25;
        color: #F7F4EC;
        text-transform: uppercase;
        letter-spacing: -0.5px;
      }
      .punch-accent-bar {
        height: 6px;
        background: #FF6A1A;
        margin-top: 18px;
        border-radius: 3px;
        transform-origin: left center;
        width: 140px;
      }

      /* Badge chứng thực (Shot 1 Check Badge) */
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        background: #141414;
        border: 2px solid #FF6A1A;
        padding: 14px 26px;
        border-radius: 12px;
        margin-top: 28px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
        will-change: transform, opacity;
      }
      .status-badge-text {
        font-size: 28px;
        font-weight: 700;
        color: #F7F4EC;
        letter-spacing: 0.5px;
      }

      /* Icon Network Crowd & Label (Shot 2) */
      .crowd-badge {
        display: inline-flex;
        align-items: center;
        gap: 18px;
        background: #141414;
        border-left: 6px solid #FF6A1A;
        padding: 16px 28px;
        border-radius: 10px;
        margin-bottom: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        will-change: transform, opacity;
      }
      .crowd-badge-text {
        font-size: 26px;
        font-weight: 900;
        color: #F7F4EC;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* Label nổi bật: 0 ĐỒNG TRUYỀN THÔNG */
      .highlight-badge-wrapper {
        position: relative;
        margin-top: 32px;
        display: inline-block;
      }
      .highlight-badge {
        background: #FF6A1A;
        color: #141414;
        font-size: 40px;
        font-weight: 900;
        padding: 16px 36px;
        border-radius: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        box-shadow: 0 12px 32px rgba(255, 106, 26, 0.4);
        display: flex;
        align-items: center;
        gap: 14px;
        will-change: transform, opacity;
      }
      .highlight-pulse {
        position: absolute;
        inset: 0;
        border: 3px solid #FF6A1A;
        border-radius: 10px;
        pointer-events: none;
        will-change: transform, opacity;
      }

      /* Thanh cam nhận diện thương hiệu cố định mép đáy */
      #bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s08"
      data-width="1080"
      data-height="1920"
      data-duration="7.49"
    >
      <!-- Biến thể nền Chart Vox với 4 đường kẻ ngang cố định và các vạch cam -->
      <div id="chart-bg">
        <div class="chart-grid-line" style="top: 384px;"></div>
        <div class="chart-tick" style="top: 383px;"></div>

        <div class="chart-grid-line" style="top: 768px;"></div>
        <div class="chart-tick" style="top: 767px;"></div>

        <div class="chart-grid-line" style="top: 1152px;"></div>
        <div class="chart-tick" style="top: 1151px;"></div>

        <div class="chart-grid-line" style="top: 1536px;"></div>
        <div class="chart-tick" style="top: 1535px;"></div>
      </div>

      <!-- ==================== SHOT S08-1 (0.0s -> 3.05s) ==================== -->
      <video
        id="shot-1-vid"
        class="clip media-asset"
        data-start="0"
        data-duration="3.05"
        data-track-index="0"
        muted
        playsinline
        src="assets/vid-04-social-media-campaign-diagram.mp4"
        data-media-start="1.5"
      ></video>

      <div id="shot-1-ui" class="clip" data-start="0" data-duration="3.05" data-track-index="1">
        <div class="scene-scrim"></div>
        <div class="ui-container">
          <div id="s1-tag" class="vox-tag">
            <span>Chiến Lược Quốc Gia</span>
          </div>

          <div id="punch-1-card" class="punch-card">
            <h1 class="punch-text">ĐỐI TÁC QUỐC GIA</h1>
            <div id="punch-1-accent" class="punch-accent-bar"></div>
          </div>

          <div id="s1-check-badge" class="status-badge">
            <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
              <circle cx="22" cy="22" r="20" stroke="#FF6A1A" stroke-width="3.5" />
              <path
                id="check-path"
                d="M 12 22 L 19 29 L 32 15"
                fill="none"
                stroke="#F7F4EC"
                stroke-width="4.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="stroke-dasharray: 40; stroke-dashoffset: 40;"
              />
            </svg>
            <span class="status-badge-text">Công Nhận Quan Trọng Nhất</span>
          </div>
        </div>
      </div>

      <!-- ==================== SHOT S08-2 (3.05s -> 7.49s) ==================== -->
      <img
        id="shot-2-img"
        class="clip media-asset"
        data-start="3.05"
        data-duration="4.44"
        data-track-index="0"
        src="assets/img-06-digital-reach-data-infographic.jpg"
        alt="Infographic phân nhánh dữ liệu và lan truyền tự nguyện"
      />

      <div id="shot-2-ui" class="clip" data-start="3.05" data-duration="4.44" data-track-index="1">
        <div class="scene-scrim"></div>
        <div class="ui-container">
          <div id="s2-crowd-badge" class="crowd-badge">
            <svg width="40" height="32" viewBox="0 0 40 32" fill="none">
              <path
                class="crowd-line"
                d="M 8 26 L 20 10 L 32 26"
                stroke="#FF6A1A"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="stroke-dasharray: 45; stroke-dashoffset: 45;"
              />
              <circle cx="20" cy="8" r="5" fill="#FF6A1A" />
              <circle cx="8" cy="26" r="4.5" fill="#F7F4EC" />
              <circle cx="32" cy="26" r="4.5" fill="#F7F4EC" />
            </svg>
            <span class="crowd-badge-text">Mạng Lưới Người Dân Tự Nguyện</span>
          </div>

          <div id="punch-2-card" class="punch-card">
            <h1 class="punch-text">LAN TRUYỀN TỰ NGUYỆN</h1>
            <div id="punch-2-accent" class="punch-accent-bar" style="width: 170px;"></div>
          </div>

          <div class="highlight-badge-wrapper">
            <div id="label-free-pulse" class="highlight-pulse"></div>
            <div id="label-free-badge" class="highlight-badge">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M 4.93 4.93 L 19.07 19.07" />
              </svg>
              <span>0 ĐỒNG TRUYỀN THÔNG</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Thanh cam cố định mép đáy nhận diện thương hiệu -->
      <div id="bottom-brand-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // ==========================================
      // SHOT S08-1 CHOREOGRAPHY (0.00s -> 3.05s)
      // ==========================================

      // Transition-in: Zoom-through từ 2.2x nhanh qua 1.0x
      tl.fromTo(
        "#shot-1-vid",
        { scale: 2.2, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.65, ease: "power4.out" },
        0
      );

      // Camera motion: Zoom-in nhẹ tiếp tục giữ nhịp
      tl.to(
        "#shot-1-vid",
        { scale: 1.08, duration: 2.4, ease: "sine.out" },
        0.65
      );

      // Header tag xuất hiện mượt
      tl.fromTo(
        "#s1-tag",
        { y: -24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.2
      );

      // Punch Phrase: "ĐỐI TÁC QUỐC GIA" tại 57610ms (0.96s)
      tl.fromTo(
        "#punch-1-card",
        { scale: 0.88, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
        0.96
      );
      tl.fromTo(
        "#punch-1-accent",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.42, ease: "power2.out" },
        1.15
      );

      // Icon Check tự vẽ tại 58700ms (2.05s)
      tl.fromTo(
        "#s1-check-badge",
        { scale: 0.85, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        2.05
      );
      tl.to(
        "#check-path",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        2.2
      );

      // Outro nhẹ trước khi cắt shot
      tl.to(
        ["#punch-1-card", "#s1-check-badge", "#s1-tag"],
        { opacity: 0, duration: 0.15, ease: "power2.in" },
        2.90
      );

      // ==========================================
      // SHOT S08-2 CHOREOGRAPHY (3.05s -> 7.49s)
      // ==========================================

      // Hard Cut sang hình ảnh phân nhánh infographic + Camera pan-right
      tl.fromTo(
        "#shot-2-img",
        { scale: 1.08, x: -35 },
        { scale: 1.02, x: 25, duration: 4.44, ease: "sine.inOut" },
        3.05
      );

      // Icon Crowd & mạng lưới người dân tại 59900ms (3.25s)
      tl.fromTo(
        "#s2-crowd-badge",
        { scale: 0.85, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        3.25
      );
      tl.to(
        ".crowd-line",
        { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
        3.45
      );

      // Punch Phrase: "LAN TRUYỀN TỰ NGUYỆN" tại 60870ms (4.22s)
      tl.fromTo(
        "#punch-2-card",
        { scale: 0.88, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        4.22
      );
      tl.fromTo(
        "#punch-2-accent",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.42, ease: "power2.out" },
        4.45
      );

      // Label: "0 ĐỒNG TRUYỀN THÔNG" tại 62730ms (6.08s)
      tl.fromTo(
        "#label-free-badge",
        { scale: 0.82, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power4.out" },
        6.08
      );
      tl.fromTo(
        "#label-free-pulse",
        { scale: 1, opacity: 0.85 },
        { scale: 1.35, opacity: 0, duration: 0.65, ease: "power2.out" },
        6.35
      );

      // Đăng ký timeline cho HyperFrames seek
      window.__timelines["scene-s08"] = tl;
    </script>
  
    </template>
  </body>
