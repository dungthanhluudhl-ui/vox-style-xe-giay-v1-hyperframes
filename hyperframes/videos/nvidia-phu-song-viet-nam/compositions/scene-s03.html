    <script>
      const svgStrokes = document.querySelectorAll(".draw-stroke");
      const strokeLengths = [];
      svgStrokes.forEach((stroke) => {
        const len = Math.ceil(stroke.getTotalLength()) || 50;
        strokeLengths.push(len);
        stroke.style.strokeDasharray = len + "";
        stroke.style.strokeDashoffset = len + "";
      });

      const tl = gsap.timeline({ paused: true });

      // Shot 1: Video Camera Zoom (single writer on #vid-05-elem scale)
      tl.fromTo("#vid-05-elem", { scale: 1 }, { scale: 1.06, duration: 3.96, ease: "none" }, 0);

      // Shot 1: Punch phrase entrance (0.27s)
      tl.fromTo("#punch-1", { scale: 0.92, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.27);

      // Shot 1: Diagram entrance (0.70s)
      tl.fromTo("#diagram-container", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 0.7);

      // Shot 1: Activate Tier 1 at 2.13s (dedicated inner elements, high-contrast endpoints)
      tl.to("#tier-1-highlight", { opacity: 1, duration: 0.35, ease: "power2.out" }, 2.13);
      tl.to("#tier-1-pill", { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.13);
      tl.to("#tier-1-num", { backgroundColor: "#FF6A1A", color: "#141414", duration: 0.35, ease: "power2.out" }, 2.13);

      // Shot 2: Hero card entrance (3.96s)
      tl.fromTo("#shot2-card", { scale: 0.95, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 3.96);

      // Shot 2: Hero card inner idle tremor on #shot2-card-inner (independent element, resolves cleanly to 0)
      tl.to(
        "#shot2-card-inner",
        {
          keyframes: [
            { rotation: 1.1, duration: 0.5, ease: "sine.inOut" },
            { rotation: -0.9, duration: 0.6, ease: "sine.inOut" },
            { rotation: 0.5, duration: 0.5, ease: "sine.inOut" },
            { rotation: 0, duration: 0.5, ease: "sine.inOut" },
          ],
        },
        4.35
      );

      // Shot 2: Icon badge and SVG self-draw (4.46s, pre-measured numeric values)
      tl.fromTo("#shot2-icon-badge", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 4.46);
      svgStrokes.forEach((stroke, i) => {
        const len = strokeLengths[i];
        tl.fromTo(
          stroke,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
          4.46 + i * 0.08
        );
      });

      // Shot 2: Punch phrase (4.82s)
      tl.fromTo("#punch-2", { scale: 0.92, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 4.82);
      tl.fromTo("#sub-tag-2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 5.15);

      // Register timeline on runtime registry
      window.__timelines["scene-s03"] = tl;
    </script>
