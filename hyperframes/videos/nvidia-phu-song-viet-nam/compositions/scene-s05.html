        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },

        { x: -30 },
        { x: 30, duration: 5.64, ease: "none" },

        2.6

      // Overlay: Punch-phrase "CHỈ ĐỂ BÁN HÀNG?" (atMs: 35280 -> local 3.48s, hold 2.0s)
