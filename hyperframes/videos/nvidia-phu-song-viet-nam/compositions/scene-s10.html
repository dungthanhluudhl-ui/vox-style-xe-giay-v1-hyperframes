    <script>
      // Single paused master timeline for HyperFrames
      const tl = gsap.timeline({ paused: true });

      // Setup SVG paths for deterministic drawing
      const qCurve = document.getElementById("q-curve");
      if (qCurve) {
        const len = qCurve.getTotalLength();
        qCurve.style.strokeDasharray = len;
        qCurve.style.strokeDashoffset = len;
      }
      const checkPath = document.getElementById("check-path");
      if (checkPath) {
        const len = checkPath.getTotalLength();
        checkPath.style.strokeDasharray = len;
        checkPath.style.strokeDashoffset = len;
      }

      /* ----------------------------------------------------
         SHOT 1 ANIMATIONS (0.0s to 4.4s)
         ---------------------------------------------------- */
      // Scene entrance rise
      tl.fromTo(
        "#shot-1-bg",
        { scale: 1.08, opacity: 0 },
        { scale: 1.0, opacity: 0.35, duration: 1.2, ease: "power2.out" },
        0
      );

      tl.fromTo(
        "#shot-1-content",
        { y: 70, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
        0.15
      );

      // Punch phrase entrance at atMs: 73430 (1.55s relative)
      tl.fromTo(
        "#punch-1",
        { scale: 0.9, opacity: 0, y: 24 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.65, ease: "power3.out" },
        1.55
      );

      tl.fromTo(
        "#punch-1-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.55, ease: "power2.out" },
        1.8
      );

      // Question icon reveals at atMs: 75260 (3.38s relative)
      tl.fromTo(
        "#q-badge",
        { scale: 0, opacity: 0, rotation: -25 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "power3.out" },
        3.3
      );

      if (qCurve) {
        tl.to(
          "#q-curve",
          { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
          3.45
        );
      }

      tl.fromTo(
        "#q-dot",
        { scale: 0, transformOrigin: "50% 50%" },
        { scale: 1, duration: 0.25, ease: "power3.out" },
        3.8
      );

      /* ----------------------------------------------------
         SHOT 2 ANIMATIONS (4.4s to 9.6s)
         ---------------------------------------------------- */
      // Camera subtle zoom-in during shot 2
      tl.fromTo(
        "#shot-2-camera",
        { scale: 1.0 },
        { scale: 1.05, duration: 5.2, ease: "none" },
        4.4
      );

      tl.fromTo(
        "#shot-2-bg",
        { opacity: 0 },
        { opacity: 0.25, duration: 0.6, ease: "power2.out" },
        4.4
      );

      tl.fromTo(
        "#shot-2-card",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        4.45
      );

      // CTA button punch entrance at atMs: 76530 (4.65s relative)
      tl.fromTo(
        "#btn-follow",
        { scale: 0.88, opacity: 0, y: 20 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        4.65
      );

      // Secondary label at atMs: 78520 (6.64s relative)
      tl.fromTo(
        "#label-case-study",
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        6.64
      );

      // Check icon confirms at atMs: 80060 (8.006s ~ 8.01s relative)
      tl.to(
        "#btn-text-normal",
        { opacity: 0, duration: 0.2, ease: "power1.out" },
        8.01
      );

      tl.to(
        "#btn-text-confirmed",
        { opacity: 1, duration: 0.25, ease: "power2.out" },
        8.1
      );

      if (checkPath) {
        tl.to(
          "#check-path",
          { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
          8.2
        );
      }

      // Register master timeline with exact composition-id
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s10"] = tl;
    </script>
