    <div

      <!-- Person Vocabulary Icon (Animated SVG Path Draw) -->

    <!-- Animation Runtime Contract -->
    <script>
      // Setup SVG Path Lengths synchronously for deterministic path drawing
      const personHead = document.getElementById("person-head");
      const personBody = document.getElementById("person-body");
      if (personHead && personBody) {
        const lenHead = personHead.getTotalLength ? personHead.getTotalLength() : 44;
        personHead.style.strokeDasharray = lenHead + "px";
        personHead.style.strokeDashoffset = lenHead + "px";

        const lenBody = personBody.getTotalLength ? personBody.getTotalLength() : 55;
        personBody.style.strokeDasharray = lenBody + "px";
        personBody.style.strokeDashoffset = lenBody + "px";
      }

      // Root GSAP Master Timeline (Seekable, Paused)
      const tl = gsap.timeline({ paused: true });

      // ==========================================
      // CHOREOGRAPHY: SHOT 1 (0.00s -> 4.08s)
      // ==========================================

      // Wobble-drop entrance on Shot 1 video element
      tl.fromTo(
        "#vid-01-media",
        { y: -160, rotation: -2.4, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
        0
      );

      // Camera motion: slow zoom-in on the video framing
      tl.fromTo(
        "#vid-01-media",
        { scale: 1 },
        { scale: 1.06, duration: 4.08, ease: "none" },
        0
      );

      // Punch Phrase 1 ("HÌNH ẢNH NGƯỜI ĐỨNG ĐẦU"): atMs 64820 -> 0.68s, hold 2.20s -> 2.88s
      tl.fromTo(
        "#punch-1-card",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.68
      );
      tl.to(
        "#punch-1-card",
        { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" },
        2.60
      );

      // Person Icon Badge entrance: atMs 66550 -> 2.41s
      tl.fromTo(
        "#icon-person-badge",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        2.41
      );

      // Progressive SVG path draw for the icon
      if (personHead && personBody) {
        tl.to(
          personHead,
          { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
          2.52
        );
        tl.to(
          personBody,
          { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
          2.65
        );
      }

      // ==========================================
      // CHOREOGRAPHY: SHOT 2 (4.08s -> 7.74s)
      // ==========================================

      // Camera motion: pan-up on the split mirror graphics
      tl.fromTo(
        "#img-08-media",
        { y: 30, scale: 1.03 },
        { y: -30, scale: 1.08, duration: 3.66, ease: "none" },
        4.08
      );

      // Mirror Optical Axis line draw
      tl.fromTo(
        "#mirror-divider-line",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        4.18
      );

      // Mirror directional callouts
      tl.fromTo(
        "#mirror-tag-top",
        { y: 15, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
        4.35
      );
      tl.fromTo(
        "#mirror-tag-bottom",
        { y: -15, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
        4.35
      );

      // Punch Phrase 2 ("TẤM GƯƠNG DOANH NGHIỆP"): atMs 68620 -> 4.48s, hold 2.60s -> 7.08s
      tl.fromTo(
        "#punch-2-card",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        4.48
      );
      tl.to(
        "#punch-2-card",
        { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" },
        6.80
      );

      // Secondary Label ("UY TÍN TỔ CHỨC"): atMs 70470 -> 6.33s
      tl.fromTo(
        "#label-uy-tin",
        { x: -35, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        6.33
      );

      // Register timeline for seek-driven frame rendering
      window.__timelines["scene-s09"] = tl;
    </script>
