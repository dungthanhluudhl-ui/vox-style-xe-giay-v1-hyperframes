<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #e7e3d9;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Background Media */
      #shot1-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      #shot2-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      /* Spotlight Vignette Variant */
      .spotlight-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(20, 20, 20, 0.12) 30%, rgba(20, 20, 20, 0.72) 100%);
        pointer-events: none;
        z-index: 5;
      }

      /* Overlay Layout Rows */
      .overlay-row {
        position: absolute;
        left: 0;
        right: 0;
        height: auto;
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
      }
      .row-top {
        top: 280px;
      }
      .row-bottom {
        top: 1240px;
      }
      .row-center {
        top: 860px;
      }

      /* Punch Card: Chi phí 0 đồng */
      .punch-box {
        position: relative;
        background: #f5f0e4;
        border: 5px solid #141414;
        box-shadow: 12px 12px 0px #141414;
        border-radius: 6px;
        padding: 28px 52px;
        text-align: center;
        will-change: transform, opacity;
      }
      .badge-tag {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 5px;
        color: #141414;
        opacity: 0.85;
        margin-bottom: 6px;
      }
      .badge-number {
        font-size: 76px;
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: 2px;
        color: #141414;
      }

      /* Ban Icon Overlay */
      .ban-overlay {
        position: absolute;
        inset: -20px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        will-change: transform, opacity;
      }
      .ban-svg {
        width: 240px;
        height: 240px;
        filter: drop-shadow(4px 6px 0px rgba(20, 20, 20, 0.45));
      }

      /* Viral Pill Badge */
      .label-pill {
        background: #141414;
        border: 3px solid #ff6a1a;
        box-shadow: 8px 8px 0px rgba(20, 20, 20, 0.6);
        border-radius: 999px;
        padding: 18px 42px;
        display: inline-flex;
        align-items: center;
        gap: 18px;
        will-change: transform, opacity;
      }
      .pill-dot {
        width: 16px;
        height: 16px;
        background: #ff6a1a;
        border-radius: 50%;
        box-shadow: 0 0 14px #ff6a1a;
      }
      .pill-text {
        font-size: 34px;
        font-weight: 900;
        color: #f7f4ec;
        letter-spacing: 2px;
      }

      /* Question Card */
      .question-card {
        background: #141414;
        border: 4px solid #f5f0e4;
        border-radius: 8px;
        box-shadow: 14px 14px 0px #ff6a1a;
        padding: 38px 46px;
        display: flex;
        align-items: center;
        gap: 28px;
        max-width: 900px;
        will-change: transform, opacity;
      }
      .question-icon-box {
        width: 110px;
        height: 110px;
        flex-shrink: 0;
      }
      .question-svg {
        width: 100%;
        height: 100%;
      }
      .question-sub {
        font-size: 26px;
        font-weight: 700;
        color: #ff6a1a;
        letter-spacing: 3px;
        margin-bottom: 6px;
      }
      .question-main {
        font-size: 58px;
        font-weight: 900;
        color: #f7f4ec;
        line-height: 1.22;
        letter-spacing: 0.5px;
      }

      /* Signature Bottom Orange Bar */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 10px;
        background: #ff6a1a;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s01"
      data-width="1080"
      data-height="1920"
      data-duration="8"
      data-start="0"
    >
      <!-- SHOT 1 Media (0.0s - 4.5s) -->
      <video
        id="shot1-video"
        data-start="0"
        data-duration="4.5"
        data-media-start="1"
        muted
        playsinline
        src="assets/vid-03-social-media-viral-hype.mp4"
      ></video>

      <!-- SHOT 2 Media (4.5s - 8.0s) -->
      <img
        id="shot2-image"
        class="clip"
        data-start="4.5"
        data-duration="3.5"
        src="assets/img-07-viral-social-media-tech-hype.jpg"
        alt="Viral Social Media Tech Hype"
      />

      <!-- Shared Spotlight Vignette Overlay -->
      <div class="spotlight-overlay"></div>

      <!-- SHOT 1 Overlays (0.0s - 4.5s) -->
      <div id="shot1-overlays" class="clip" data-start="0" data-duration="4.5" style="z-index: 10">
        <!-- Punch phrase: Chi phí 0 đồng + Ban Icon -->
        <div class="overlay-row row-top">
          <div id="cost-badge" class="punch-box">
            <div class="badge-tag">NGÂN SÁCH</div>
            <div class="badge-number">0 ĐỒNG</div>
            <div id="ban-icon-wrap" class="ban-overlay" data-layout-allow-occlusion="true">
              <svg class="ban-svg" viewBox="0 0 160 160" fill="none">
                <circle cx="80" cy="80" r="66" stroke="#FF6A1A" stroke-width="15" />
                <line x1="33" y1="33" x2="127" y2="127" stroke="#FF6A1A" stroke-width="15" stroke-linecap="round" />
              </svg>
            </div>
          </div>
        </div>

        <!-- Label: Hiệu ứng Viral -->
        <div class="overlay-row row-bottom">
          <div id="viral-badge" class="label-pill">
            <span class="pill-dot"></span>
            <span class="pill-text">HIỆU ỨNG VIRAL</span>
          </div>
        </div>
      </div>

      <!-- SHOT 2 Overlays (4.5s - 8.0s) -->
      <div id="shot2-overlays" class="clip" data-start="4.5" data-duration="3.5" style="z-index: 10">
        <!-- Question Card: Bí quyết đằng sau? + Question Icon -->
        <div class="overlay-row row-center">
          <div id="question-card" class="question-card">
            <div class="question-icon-box">
              <svg class="question-svg" viewBox="0 0 100 100" fill="none">
                <path
                  id="q-mark"
                  d="M 32 36 C 32 20, 68 20, 68 36 C 68 48, 50 50, 50 64"
                  stroke="#FF6A1A"
                  stroke-width="12"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <circle id="q-dot" cx="50" cy="84" r="6.5" fill="#FF6A1A" />
              </svg>
            </div>
            <div class="question-text-box">
              <div class="question-sub">BẰNG CÁCH NÀO?</div>
              <div class="question-main">BÍ QUYẾT ĐẰNG SAU?</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Signature Visual Identity: Fixed Bottom Orange Bar -->
      <div class="brand-bottom-bar"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Path setup for question mark SVG self-drawing stroke
      const qMarkPath = document.getElementById("q-mark");
      const qMarkLen = qMarkPath ? qMarkPath.getTotalLength() : 130;
      if (qMarkPath) {
        qMarkPath.style.strokeDasharray = qMarkLen + "px";
        qMarkPath.style.strokeDashoffset = qMarkLen + "px";
      }

      // --- SHOT 1 ANIMATION (0.0s - 4.5s) ---
      // Background Video: Camera Zoom-in
      tl.fromTo(
        "#shot1-video",
        { scale: 1.0 },
        { scale: 1.09, duration: 4.5, ease: "sine.out" },
        0
      );

      // Punch Phrase: CHI PHÍ: 0 ĐỒNG (at 0.53s, hold 2.2s until 2.73s)
      tl.fromTo(
        "#cost-badge",
        { scale: 0.65, opacity: 0, y: 35 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        0.53
      );

      // Icon Ban: Stamped over 0 ĐỒNG (at 0.87s)
      tl.fromTo(
        "#ban-icon-wrap",
        { scale: 2.0, opacity: 0, rotation: -20 },
        { scale: 1.0, opacity: 1, rotation: 0, duration: 0.28, ease: "power4.out" },
        0.87
      );

      // Exit for Cost Badge + Ban Icon (at 2.73s)
      tl.to(
        "#cost-badge",
        { opacity: 0, scale: 0.92, duration: 0.25, ease: "power2.in" },
        2.73
      );

      // Label: HIỆU ỨNG VIRAL (at 3.31s, holds through end of Shot 1)
      tl.fromTo(
        "#viral-badge",
        { scale: 0.78, opacity: 0, y: 30 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
        3.31
      );

      // --- SHOT 2 ANIMATION (4.5s - 8.0s) ---
      // Background Image: Camera Pan-up on img-07
      tl.fromTo(
        "#shot2-image",
        { y: 36, scale: 1.04 },
        { y: -32, scale: 1.08, duration: 3.5, ease: "sine.out" },
        4.5
      );

      // Punch Phrase & Card: BÍ QUYẾT ĐẰNG SAU? (at 6.58s)
      tl.fromTo(
        "#question-card",
        { scale: 0.75, opacity: 0, y: 40 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        6.58
      );

      // Self-drawing Question Mark Path
      if (qMarkPath) {
        tl.fromTo(
          "#q-mark",
          { strokeDashoffset: qMarkLen },
          { strokeDashoffset: 0, duration: 0.52, ease: "power2.out" },
          6.65
        );
      }

      // Question Mark Dot Pop
      tl.fromTo(
        "#q-dot",
        { scale: 0, transformOrigin: "50% 50%" },
        { scale: 1, duration: 0.22, ease: "power3.out" },
        7.05
      );

      // Register master paused timeline
      window.__timelines["scene-s01"] = tl;
    </script>
  
    </template>
  </body>
</html>
