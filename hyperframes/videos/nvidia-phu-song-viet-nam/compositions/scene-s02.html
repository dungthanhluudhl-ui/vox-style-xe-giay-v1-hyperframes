    >

      <header id="persistent-header">

    <!-- GSAP seekable timeline script -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // === SETUP SVG STROKE PATH DRAW ===
      const pinPath = document.getElementById("pin-path");
      let pinLen = 120;
      if (pinPath) {
        pinLen = Math.ceil(pinPath.getTotalLength ? pinPath.getTotalLength() : 120);
        pinPath.style.strokeDasharray = String(pinLen);
        pinPath.style.strokeDashoffset = String(pinLen);
      }

      const crowdStrokes = document.querySelectorAll(".crowd-stroke");
      const crowdLengths = [];
      crowdStrokes.forEach((stroke, i) => {
        const len = Math.ceil(stroke.getTotalLength ? stroke.getTotalLength() : 80);
        crowdLengths[i] = len;
        stroke.style.strokeDasharray = String(len);
        stroke.style.strokeDashoffset = String(len);
      });

      // === SHOT 1 (0.00s -> 6.95s) ===
      // Peel entrance: như dán miếng sticker ảnh xuống phố
      tl.fromTo(
        "#card-1",
        { rotation: -5, scale: 0.9, y: -60, opacity: 0 },
        { rotation: 0, scale: 1, y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.0
      );

      // Camera pan-left nhẹ qua hình ảnh trong Shot 1
      tl.fromTo(
        "#img-1",
        { x: 30, scale: 1.05 },
        { x: -30, scale: 1.05, duration: 6.95, ease: "none" },
        0.0
      );

      // Overlay 1: HÀ NỘI 12/2024 (at 0.34s, hold 2.20s -> 2.54s)
      tl.fromTo(
        "#badge-hanoi-box",
        { scale: 0.8, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.34
      );
      tl.to(
        "#badge-hanoi-box",
        { opacity: 0, y: -15, duration: 0.25, ease: "power2.in" },
        2.25
      );

      // Overlay 2: Icon pin vẽ nét (at 2.86s, hold 1.80s -> 4.66s)
      tl.fromTo(
        "#pin-overlay-box",
        { scale: 0.8, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        2.86
      );
      if (pinPath) {
        tl.fromTo(
          pinPath,
          { strokeDashoffset: pinLen },
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
          2.90
        );
      }
      tl.to(
        "#pin-overlay-box",
        { opacity: 0, scale: 0.9, duration: 0.25, ease: "power2.in" },
        4.35
      );

      // Overlay 3: KHÔNG PHÒNG LẠNH (at 4.85s, hold 2.00s -> 6.85s)
      tl.fromTo(
        "#khongphonglanh-box",
        { scale: 0.88, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power4.out" },
        4.85
      );
      tl.fromTo(
        "#strike-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.35, ease: "power3.out" },
        5.15
      );
      tl.to(
        "#khongphonglanh-box",
        { opacity: 0, y: 20, duration: 0.25, ease: "power2.in" },
        6.55
      );

      // === SHOT 2 (6.95s -> 10.92s) ===
      // Cut cận cảnh punch-in
      tl.fromTo(
        "#card-2",
        { scale: 0.96, opacity: 0.8 },
        { scale: 1, opacity: 1, duration: 0.2, ease: "power2.out" },
        6.95
      );

      // Camera zoom-in cận cảnh ly bia và nụ cười
      tl.fromTo(
        "#img-2",
        { scale: 1.5, y: 35 },
        { scale: 1.65, y: 15, duration: 3.97, ease: "none" },
        6.95
      );

      // Overlay 4: VỈA HÈ BÌNH DÂN (at 7.58s, hold 1.80s -> 9.38s)
      tl.fromTo(
        "#badge-viahe-box",
        { scale: 0.85, opacity: 0, x: -35 },
        { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        7.58
      );
      tl.to(
        "#badge-viahe-box",
        { opacity: 0, x: -20, duration: 0.25, ease: "power2.in" },
        9.10
      );

      // Overlay 5: Icon CROWD + CÙNG NGƯỜI DÂN (at 9.41s, hold 1.51s -> 10.92s)
      tl.fromTo(
        "#crowd-box",
        { scale: 0.88, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        9.41
      );
      crowdStrokes.forEach((stroke, i) => {
        const len = crowdLengths[i] || 80;
        tl.fromTo(
          stroke,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
          9.45 + i * 0.08
        );
      });

      // Đăng ký đúng duy nhất 1 timeline gốc paused theo HyperFrames contract
      window.__timelines["scene-s02"] = tl;
    </script>
