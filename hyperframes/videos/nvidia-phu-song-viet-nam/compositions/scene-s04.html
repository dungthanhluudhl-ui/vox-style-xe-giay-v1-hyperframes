        { scale: 1.08, duration: 5.74, ease: "none" },

        { scale: 1, opacity: 1, duration: 0.65, ease: "power3.out" },

        ".header-badge",
        { y: -20, opacity: 0 },

        0.1,
      );

      // 3. Phân tách split: Làm mờ đống tiền quảng cáo ở nửa trái (t=1.0s)
      tl.fromTo(
        "#split-left-overlay",
        { opacity: 0 },
        { opacity: 1, duration: 0.6, ease: "power2.out" },
        1.0,
      );

      // 4. Overlay 1: Nhãn "THIỆN CẢM TỰ NHIÊN" xuất hiện (t=1.69s)
      tl.fromTo(
        "#label-badge",
        { scale: 0, opacity: 0, y: 15 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.69,

        "#scale-widget",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        2.96,
      );

      tl.fromTo(
        "#scale-beam-group",
        { rotation: 0 },
        {
          rotation: 12,
          transformOrigin: "120px 30px",
          duration: 0.65,
          ease: "power2.out",
