    >
      <!-- Nền lưới ô vuông 84px chuẩn Vox-style DNA -->
      <div class="bg-grid"></div>

    <!-- GSAP Master Timeline Construction -->
    <script>
      // Khởi tạo một timeline duy nhất ở trạng thái paused theo composition contract
      const tl = gsap.timeline({ paused: true });

      // Chuẩn bị strokeDash cho các đường mạch SVG (tính độ dài thực tế để tự vẽ)
      document.querySelectorAll(".circuit-trace").forEach((path) => {
        const len = Math.ceil(path.getTotalLength()) || 450;
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
      });

      const riseArrow = document.querySelector("#rise-arrow-path");
      if (riseArrow) {
        const arrowLen = Math.ceil(riseArrow.getTotalLength()) || 150;
        riseArrow.style.strokeDasharray = arrowLen;
        riseArrow.style.strokeDashoffset = arrowLen;
      }

      // ==========================================
      // CHOREOGRAPHY CHO SHOT 1 (0.00s -> 4.61s)
      // ==========================================

      // 1. Entrance "unfold" mở rộng khung hình từ trục đứng
      tl.fromTo(
        "#hero-frame",
        { scaleY: 0.08, opacity: 0, transformOrigin: "50% 50%" },
        { scaleY: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.05
      );

      // Header xuất hiện với nội dung Shot 1
      tl.fromTo(
        "#meta-header",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        0.05
      );

      // 2. Camera pan-left nhẹ trên hình nền bản đồ bo mạch
      tl.fromTo(
        "#hero-img",
        { x: 35, y: 0, scale: 1.08, transformOrigin: "50% 50%" },
        { x: -30, y: 0, scale: 1.15, duration: 4.61, ease: "none" },
        0
      );

      // 3. Xung radar phát sáng từ tâm điểm Việt Nam (lặp hữu hạn)
      tl.fromTo(
        "#shot1-radar",
        { scale: 0.3, opacity: 0.95 },
        { scale: 2.2, opacity: 0, duration: 1.6, ease: "power2.out", repeat: 1 },
        0.3
      );

      // 4. Nhãn: "KHÁT VỌNG QUỐC GIA" xuất hiện tại t = 0.8s, giữ 2.2s rồi biến mất tại t = 3.0s
      tl.fromTo(
        "#label-1",
        { y: 22, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.8
      );
      tl.to(
        "#label-1",
        { y: -12, opacity: 0, duration: 0.28, ease: "power2.in" },
        3.0
      );

      // 5. Punch-phrase: "KHÔNG BÁN PHẦN CỨNG" xuất hiện tại t = 3.28s và giữ đến hết shot 1
      tl.fromTo(
        "#punch-1",
        { scale: 0.9, opacity: 0, y: 28 },
        { scale: 1, opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
        3.28
      );

      // ==========================================
      // CHOREOGRAPHY CHO SHOT 2 (4.61s -> 8.70s)
      // ==========================================

      // 1. Chuyển cảnh tại ranh giới t = 4.61s
      // Ẩn nội dung Shot 1 trước mốc 4.61s
      tl.to("#punch-1", { opacity: 0, duration: 0.15 }, 4.45);

      // Fade out header Shot 1, swap nội dung sang Shot 2 tại 4.61s, rồi fade in
      tl.to("#meta-header", { opacity: 0, duration: 0.15, ease: "power2.in" }, 4.45);
      tl.set("#meta-tag", { textContent: "HỆ SINH THÁI AI // ASEAN" }, 4.61);
      tl.set("#meta-index-text", { textContent: "MẠNG LƯỚI KHU VỰC" }, 4.61);
      tl.to("#meta-header", { opacity: 1, duration: 0.25, ease: "power2.out" }, 4.61);

      // Camera nhảy "cut" sang zoom cận cảnh trung tâm Việt Nam phát sáng, tiếp tục zoom-in
      tl.fromTo(
        "#hero-img",
        { x: -35, y: -35, scale: 1.38, transformOrigin: "50% 50%" },
        { x: -70, y: -65, scale: 1.58, duration: 4.09, ease: "none" },
        4.61
      );

      // Hiện lớp mạng vi mạch SVG
      tl.to("#circuit-svg-layer", { opacity: 1, duration: 0.25 }, 4.61);

      // 2. Mạng lưới đường mạch vi xử lý tự vẽ từ Việt Nam lan tỏa các nước xung quanh
      tl.to(
        ".circuit-trace",
        { strokeDashoffset: 0, duration: 1.15, stagger: 0.12, ease: "power2.out" },
        4.85
      );

      // 3. Vòng hào quang tại Hà Nội phát xung (animate trực tiếp SVG attr r để đảm bảo độ chính xác tuyệt đối)
      tl.fromTo(
        "#shot2-hub-halo",
        { attr: { r: 14 }, opacity: 0.95 },
        { attr: { r: 60 }, opacity: 0, duration: 1.3, ease: "power2.out", repeat: 1 },
        4.9
      );

      // 4. Các nút trạm phát tín hiệu bo mạch nảy lên
      tl.fromTo(
        ".circuit-node",
        { opacity: 0, scale: 0, transformOrigin: "center center" },
        { opacity: 1, scale: 1, duration: 0.35, stagger: 0.08, ease: "power3.out" },
        5.15
      );

      // 5. Callout badge tâm điểm Hà Nội xuất hiện
      tl.fromTo(
        "#shot2-hub-badge",
        { scale: 0.8, opacity: 0, y: 12 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        5.2
      );

      // 6. Punch-phrase: "TÂM ĐIỂM AI KHU VỰC" xuất hiện tại t = 6.06s và giữ 2.4s
      tl.fromTo(
        "#punch-2",
        { scale: 0.9, opacity: 0, y: 28 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        6.06
      );

      // 7. Icon vocabulary "rise" xuất hiện tại t = 7.34s
      tl.fromTo(
        "#icon-rise-badge",
        { scale: 0, opacity: 0, rotation: -10, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.42, ease: "power3.out" },
        7.34
      );

      // 8. Icon rise: Đường mũi tên tăng trưởng vẽ hoàn chỉnh
      tl.to(
        "#rise-arrow-path",
        { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
        7.45
      );

      // 9. Icon rise: Các cột tăng trưởng nhô lên từ đáy
      tl.fromTo(
        ".rise-bar",
        { scaleY: 0, transformOrigin: "bottom" },
        { scaleY: 1, duration: 0.32, stagger: 0.07, ease: "power3.out" },
        7.52
      );

      // Đăng ký timeline chính lên window.__timelines theo chuẩn HyperFrames
      window.__timelines["scene-s06"] = tl;
    </script>
