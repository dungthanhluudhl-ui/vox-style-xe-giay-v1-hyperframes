      { y: -680 },
      { y: 0, duration: 7.4, ease: "power1.inOut" },

      "#label-1",
      { scale: 0.2, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
      1.46

      { scale: 0.2, opacity: 0, y: 24 },
