<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #F5F0E4;
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #F5F0E4;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Shot 1 - Video Layer */
    #video-wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 10;
    }

    #video-cam {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
    }

    #vid-banquet {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Shot 1 - Quote Overlay */
    #overlay-shot-1 {
      z-index: 15;
      pointer-events: none;
    }

    #quote-wrapper {
      position: absolute;
      top: 430px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #quote-card {
      background-color: #141414;
      padding: 24px 44px;
      border-radius: 12px;
      border: 3px solid #FF6A1A;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      transform-origin: center center;
    }

    .quote-text {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 58px;
      line-height: 1.25;
      color: #F7F4EC;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      display: block;
    }

    /* Shot 2 - Image Layer */
    #shot-2 {
      z-index: 20;
      overflow: hidden;
    }

    #shot-2-cam {
      position: absolute;
      width: 1400px;
      height: 1920px;
      top: 0;
      left: 0;
    }

    #img-banquet {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* Shot 2 - Label Overlay */
    #label-wrapper {
      position: absolute;
      top: 1200px;
      left: 70px;
      z-index: 25;
      pointer-events: none;
    }

    #label-card {
      display: inline-flex;
      align-items: center;
      background-color: #141414;
      padding: 18px 34px;
      border-radius: 8px;
      border-left: 8px solid #FF6A1A;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.65);
      transform-origin: left center;
    }

    .label-text {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 40px;
      line-height: 1.2;
      color: #F7F4EC;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      display: block;
    }

    /* Visual Signature Bottom Bar */
    #brand-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 1000;
      pointer-events: none;
    }
  </style>

  <div id="root" data-composition-id="scene-s01" data-width="1080" data-height="1920" data-duration="7.76">
    <!-- Shot 1: Video (not inside any timed element) -->
    <div id="video-wrapper">
      <div id="video-cam">
        <video
          id="vid-banquet"
          src="assets/vid-01-royal-banquet-cutout-animation.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="5.29"
          data-media-start="1"
        ></video>
      </div>
    </div>

    <!-- Shot 1: Overlay -->
    <div id="overlay-shot-1" class="clip" data-start="0" data-duration="5.29">
      <div id="quote-wrapper">
        <div id="quote-card" class="hf-plate-ink">
          <span class="quote-text">TIỆC TÙNG SIÊU GIÀU</span>
        </div>
      </div>
    </div>

    <!-- Shot 2: Section (Image + Label) -->
    <section id="shot-2" class="clip" data-start="5.29" data-duration="2.47">
      <div id="shot-2-cam">
        <img id="img-banquet" src="assets/img-02-royal-banquet-hall-cutout.jpg" alt="">
      </div>
      <div id="label-wrapper">
        <div id="label-card" class="hf-plate-ink">
          <span class="label-text">HOÀNG ĐẾ FRANCIS II</span>
        </div>
      </div>
    </section>

    <!-- Bottom brand accent line -->
    <div id="brand-bottom-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Shot 1 (0s -> 5.29s)
    // TransitionIn: grow entrance
    tl.fromTo("#video-cam",
      { scale: 0.88, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.55, ease: "power3.out" },
      0
    );
    // CameraMotion: continuous zoom-in towards the royal banquet
    tl.fromTo("#video-cam",
      { scale: 1.0 },
      { scale: 1.16, duration: 4.65, ease: "sine.out" },
      0.55
    );

    // Overlay 1: Pop entrance at 1.0s, hold for 3.2s+, then fade out before shot end
    tl.fromTo("#quote-card",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      1.0
    );
    tl.fromTo("#quote-card",
      { opacity: 1, scale: 1 },
      { opacity: 0, scale: 0.95, duration: 0.35, ease: "power2.in" },
      4.6
    );

    // Shot 2 (5.29s -> 7.76s)
    // TransitionIn: cut (instant switch)
    // CameraMotion: pan-right across aristocratic banquet (x decreases from 0 to -200px)
    tl.fromTo("#shot-2-cam",
      { x: 0 },
      { x: -200, duration: 2.4, ease: "sine.inOut" },
      5.29
    );

    // Overlay 2: Pop entrance at 6.13s (0.84s into shot), hold until end of shot
    tl.fromTo("#label-card",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      6.13
    );

    window.__timelines["scene-s01"] = tl;
  </script>

    </template>
  </body>
</html>
