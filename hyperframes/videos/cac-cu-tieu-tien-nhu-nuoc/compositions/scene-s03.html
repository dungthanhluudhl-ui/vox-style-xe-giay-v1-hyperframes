  <script>
    const tl = gsap.timeline({ paused: true });

    // Transition-in: peel effect uncovering historical decree document
    tl.fromTo(
      "#peel-wrapper",
      { clipPath: "polygon(100% 0%, 100% 0%, 100% 0%, 100% 0%)" },
      { clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)", duration: 0.82, ease: "power2.out" },

    // Camera motion: continuous subtle zoom-in
    tl.fromTo(
      "#camera-rig",
      { scale: 1.0 },
      { scale: 1.08, duration: 7.2, ease: "none" },
      0
    );

    // Overlay 1: document header stamp slam at 0.18s (holdMs: 2800)
    tl.fromTo(
      "#doc-badge-1807",
      { opacity: 0, scale: 1.4, rotation: -10 },
      { opacity: 1, scale: 1, rotation: -2, duration: 0.3, ease: "power4.out" },
      0.18
    );

    // Overlay 2: document-mark stamp slam at 4.53s (holdMs: 2600)
    tl.fromTo(
      "#doc-mark-ban",
      { opacity: 0, scale: 1.5, rotation: 8 },
      { opacity: 1, scale: 1, rotation: 1.5, duration: 0.28, ease: "power4.out" },
      4.53
    );

    // Graceful exit before the composition boundary at 7.32s
    tl.fromTo(
      "#badge-wrapper",
      { opacity: 1 },
      { opacity: 0, duration: 0.15, ease: "power2.in" },
      7.14
    );
    tl.fromTo(
      "#mark-wrapper",
      { opacity: 1 },
      { opacity: 0, duration: 0.15, ease: "power2.in" },
      7.14
    );

    window.__timelines["scene-s03"] = tl;
