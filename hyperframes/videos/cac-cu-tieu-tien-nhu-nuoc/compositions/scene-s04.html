<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      font-family: 'Be Vietnam Pro', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Shot 1 media hierarchy */
    #shot-1-perspective {
      position: absolute;
      inset: 0;
      perspective: 1200px;
      overflow: hidden;
      pointer-events: none;
    }

    #shot-1-unfold {
      position: absolute;
      inset: 0;
      transform-origin: 50% 0%;
    }

    #shot-1-camera {
      position: absolute;
      width: 1200px;
      height: 1920px;
      left: -60px;
      top: 0;
    }

    #vid-05 {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Shot 2 media hierarchy */
    #shot-2-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    #shot-2-camera {
      position: absolute;
      inset: 0;
      transform-origin: 50% 45%;
    }

    #img-05 {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Overlay styles */
    .timeline-card {
      position: absolute;
      left: 90px;
      top: 1100px;
      width: 900px;
      background-color: #141414;
      border-left: 10px solid #FF6A1A;
      border-radius: 8px;
      padding: 24px 36px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }

    .timeline-text {
      font-weight: 900;
      font-size: 46px;
      line-height: 1.25;
      letter-spacing: -0.5px;
      color: #F7F4EC;
      text-transform: uppercase;
    }

    #bottom-bar {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s04" data-width="1080" data-height="1920" data-duration="8.76">

    <!-- Shot 1 Media (vid-05: duration 3.83s, camera pan-left, unfold entrance) -->
    <div id="shot-1-perspective">
      <div id="shot-1-unfold">
        <div id="shot-1-camera">
          <video
            id="vid-05"
            src="assets/vid-05-cutout-building-blueprint-records.mp4"
            muted
            playsinline
            data-start="0"
            data-duration="3.83"
            data-media-start="1">
          </video>
        </div>
      </div>
    </div>

    <!-- Shot 1 Overlay -->
    <section id="shot-1-overlay" class="clip" data-start="0" data-duration="3.83" style="z-index: 10; pointer-events: none;">
      <div id="shot-1-overlay-card" class="timeline-card hf-plate-ink">
        <div class="timeline-text">CUNG ĐIỆN HOFBURG VIENNA</div>
      </div>
    </section>

    <!-- Shot 2 Media (img-05: duration 4.93s, camera zoom-in) -->
    <div id="shot-2-stage">
      <div id="shot-2-camera">
        <img
          id="img-05"
          class="clip"
          src="assets/img-05-vintage-architecture-blueprint-cutout.jpg"
          data-start="3.83"
          data-duration="4.93"
          alt="Hofburg Palace">
      </div>
    </div>

    <!-- Shot 2 Overlay -->
    <section id="shot-2-overlay" class="clip" data-start="3.83" data-duration="4.93" style="z-index: 20; pointer-events: none;">
      <div id="shot-2-overlay-card" class="timeline-card hf-plate-ink">
        <div class="timeline-text">SẢNH NGHI LỄ: 575 m²</div>
      </div>
    </section>

    <!-- Permanent brand bottom bar -->
    <div id="bottom-bar"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // SHOT 1 (0s -> 3.83s)
    // 1. Unfold entrance for entire stage
    tl.fromTo(
      "#shot-1-unfold",
      { rotationX: -35, scaleY: 0.7, opacity: 0 },
      { rotationX: 0, scaleY: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      0
    );

    // 2. Camera motion: pan-left (viewport moves left -> content moves right, x increases)
    tl.fromTo(
      "#shot-1-camera",
      { x: -40 },
      { x: 40, duration: 3.75, ease: "none" },
      0
    );

    // 3. Overlay entrance at 1.23s (atMs: 25510 -> (25510 - 24280)/1000 = 1.23s)
    tl.fromTo(
      "#shot-1-overlay-card",
      { scale: 0.85, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      1.23
    );

    // 4. Overlay exit before shot boundary (holdMs: 2500 -> 1.23 + 2.5 = 3.73s)
    tl.fromTo(
      "#shot-1-overlay-card",
      { opacity: 1 },
      { opacity: 0, duration: 0.08, ease: "power2.in" },
      3.73
    );

    // SHOT 2 (3.83s -> 8.76s)
    // 1. Camera motion: zoom-in into grand ceremonial hall
    tl.fromTo(
      "#shot-2-camera",
      { scale: 1 },
      { scale: 1.15, duration: 4.85, ease: "power1.out" },
      3.83
    );

    // 2. Overlay entrance at 5.78s (atMs: 30060 -> (30060 - 24280)/1000 = 5.78s)
    tl.fromTo(
      "#shot-2-overlay-card",
      { scale: 0.85, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      5.78
    );

    // 3. Overlay exit before scene boundary (holdMs: 2900 -> 5.78 + 2.9 = 8.68s)
    tl.fromTo(
      "#shot-2-overlay-card",
      { opacity: 1 },
      { opacity: 0, duration: 0.06, ease: "power2.in" },
      8.68
    );

    // Register paused timeline with HyperFrames runtime
    window.__timelines["scene-s04"] = tl;
  </script>

    </template>
  </body>
</html>
