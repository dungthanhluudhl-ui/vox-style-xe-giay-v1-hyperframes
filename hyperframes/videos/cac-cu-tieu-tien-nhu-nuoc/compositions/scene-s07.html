  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // --- SHOT 1 (0s -> 4.71s) ---
    // TransitionIn: wobble-drop entry on shot 1 drop wrapper
    tl.fromTo(
      "#shot1-drop-wrap",
      { y: -720, rotation: -4, opacity: 0 },
      { y: 0, rotation: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
      0
    );

    // Camera motion: continuous zoom-in on shot 1 video wrapper
    tl.fromTo(
      "#shot1-zoom-wrap",
      { scale: 1.0 },
      { scale: 1.15, duration: 4.71, ease: "none" },
      0
    );

    // Shot 1 Overlay 1: "3.000 LÍT NƯỚC SÚP" (atMs: 50860 -> 1.98s, hold: 2.50s)
    tl.fromTo(
      "#shot1-overlay1",
      { scale: 0, opacity: 0, y: 36 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      1.98
    );
    tl.fromTo(
      "#shot1-overlay1",
      { opacity: 1, scale: 1, y: 0 },
      { opacity: 0, scale: 1, y: 0, duration: 0.23, ease: "power2.in" },
      4.25
    );

    // Shot 1 Overlay 2: "ĐẦY 18 BỒN TẮM" (atMs: 52280 -> 3.40s, hold: 1.31s)
    tl.fromTo(
      "#shot1-overlay2",
      { scale: 0, opacity: 0, y: 36 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      3.40
    );
    tl.fromTo(
      "#shot1-overlay2",
      { opacity: 1, scale: 1, y: 0 },
      { opacity: 0, scale: 1, y: 0, duration: 0.20, ease: "power2.in" },
      4.45
    );

    // --- SHOT 2 (4.71s -> 9.52s) ---
    // TransitionIn: cut (handled by timed media clip starting at 4.71s)
    // Camera motion: pan-right (wrapper translates left from x: 0 to x: -280px)
    tl.fromTo(
      "#shot2-pan-wrap",
      { x: 0 },
      { x: -280, duration: 4.81, ease: "none" },
      4.71
    );

    // Shot 2 Overlay 1: "ĂN UỐNG CHƯA ĐỦ ĐÔ" (atMs: 54340 -> 5.46s, hold: 1.80s)
    tl.fromTo(
      "#shot2-overlay1",
      { scale: 0.85, opacity: 0, y: 36 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      5.46
    );
    tl.fromTo(
      "#shot2-overlay1",
      { opacity: 1, scale: 1, y: 0 },
      { opacity: 0, scale: 1, y: -20, duration: 0.22, ease: "power2.in" },
      7.04
    );

    // Shot 2 Overlay 2: "ĐẠI MÀN TRÌNH DIỄN" (atMs: 56350 -> 7.47s, hold: 1.90s)
    tl.fromTo(
      "#shot2-overlay2",
      { scale: 0.85, opacity: 0, y: 36 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      7.47
    );
    tl.fromTo(
      "#shot2-overlay2",
      { opacity: 1, scale: 1, y: 0 },
      { opacity: 0, scale: 1, y: 0, duration: 0.19, ease: "power2.in" },
      9.18
    );

    // Register paused timeline with HyperFrames runtime
    window.__timelines["scene-s07"] = tl;
  </script>
