<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #E7E3D9;
      overflow: hidden;
    }

    /* Quy ước timed clip bắt buộc */
    .clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* Biến thể nền Chart (4 đường ngang tỉ lệ + vạch cam mép trái) */
    .chart-background {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .chart-line {
      position: absolute;
      left: 0;
      width: 1080px;
      height: 2px;
      background: rgba(20, 20, 20, 0.22);
    }

    .chart-line-1 { top: 20%; }
    .chart-line-2 { top: 40%; }
    .chart-line-3 { top: 60%; }
    .chart-line-4 { top: 80%; }

    .chart-tick {
      position: absolute;
      left: 0;
      top: -5px;
      width: 18px;
      height: 12px;
      background-color: #FF6A1A;
    }

    /* Khung giới hạn chứa media phong cách collage poster */
    .shot-viewport {
      position: absolute;
      top: 190px;
      left: 60px;
      width: 960px;
      height: 1140px;
      background-color: #F5F0E4;
      border: 4px solid #141414;
      box-shadow: 16px 16px 0px #141414;
      overflow: hidden;
      z-index: 5;
    }

    /* Wrapper bọc media không-timed để pan/zoom bằng transform */
    .media-wrapper {
      position: absolute;
      inset: -40px;
      display: flex;
      justify-content: center;
      align-items: center;
      will-change: transform;
    }

    .media-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Lớp chữ thứ hai: Thẻ badge trên nền mực đặc đảm bảo độ tương phản */
    .shot-badge {
      position: absolute;
      top: 240px;
      left: 100px;
      padding: 16px 26px;
      border-left: 10px solid #FF6A1A;
      font-size: 38px;
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 8px 8px 0px rgba(20, 20, 20, 0.4);
      z-index: 20;
      height: auto;
      width: auto;
      max-width: 860px;
      opacity: 0;
    }

    /* Thanh cam thương hiệu cố định mép dưới cùng */
    .brand-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s05" data-width="1080" data-height="1920" data-duration="8.28">
    <!-- Nền chart cố định của scene -->
    <div class="chart-background">
      <div class="chart-line chart-line-1"><div class="chart-tick"></div></div>
      <div class="chart-line chart-line-2"><div class="chart-tick"></div></div>
      <div class="chart-line chart-line-3"><div class="chart-tick"></div></div>
      <div class="chart-line chart-line-4"><div class="chart-tick"></div></div>
    </div>

    <!-- Shot 1: Crop cận cảnh bản vẽ khung dây toà nhà chung cư (0s -> 3.72s) -->
    <section id="shot-1" class="clip" data-start="0" data-duration="3.72">
      <div id="viewport-1" class="shot-viewport">
        <div id="media-wrap-1" class="media-wrapper">
          <img src="assets/img-01-building-scale-comparison-cutout.jpg" alt="Building scale comparison" class="media-img">
        </div>
      </div>
      <div id="badge-1" class="shot-badge hf-plate-ink">
        QUY MÔ 1 TÒA CHUNG CƯ
      </div>
    </section>

    <!-- Shot 2: Nới rộng góc máy sang toàn cảnh sảnh tiệc hoàng gia (3.72s -> 8.28s) -->
    <section id="shot-2" class="clip" data-start="3.72" data-duration="4.56">
      <div id="viewport-2" class="shot-viewport">
        <div id="media-wrap-2" class="media-wrapper">
          <img src="assets/img-01-building-scale-comparison-cutout.jpg" alt="Building scale comparison" class="media-img">
        </div>
      </div>
      <div id="badge-2" class="shot-badge hf-plate-ink">
        12.000 KHÁCH THAM DỰ
      </div>
    </section>

    <!-- Dải cam đáy nhận diện thương hiệu -->
    <div class="brand-bottom-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // --- SHOT 1 (0.0s - 3.72s) ---
    // TransitionIn: punch (cú giật dứt khoát làm nổi bật tỷ lệ)
    tl.fromTo("#viewport-1",
      { scale: 0.88, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.42, ease: "power4.out" },
      0
    );

    // Camera motion: zoom-in cận cảnh bản vẽ chung cư trên mẩu giấy
    tl.fromTo("#media-wrap-1",
      { scale: 1.75, x: 0, y: 30 },
      { scale: 2.15, x: -15, y: -20, duration: 3.65, ease: "sine.out" },
      0
    );

    // Overlay Badge 1 ("QUY MÔ 1 TÒA CHUNG CƯ") xuất hiện ở atMs 34400 (offset: 1.36s)
    tl.fromTo("#badge-1",
      { scale: 0.65, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
      1.36
    );
    tl.fromTo("#badge-1",
      { opacity: 1 },
      { opacity: 0, duration: 0.18, ease: "power2.in" },
      3.50
    );

    // --- SHOT 2 (3.72s - 8.28s) ---
    // TransitionIn: cut dứt khoát
    tl.fromTo("#viewport-2",
      { opacity: 1 },
      { opacity: 1, duration: 0.01 },
      3.72
    );

    // Camera motion: pan-right toàn cảnh sảnh tiệc (nội dung ảnh dịch sang trái)
    tl.fromTo("#media-wrap-2",
      { scale: 1.18, x: 60, y: -10 },
      { scale: 1.24, x: -75, y: -5, duration: 4.45, ease: "sine.inOut" },
      3.72
    );

    // Overlay Badge 2 ("12.000 KHÁCH THAM DỰ") xuất hiện ở atMs 38410 (offset: 5.37s)
    tl.fromTo("#badge-2",
      { scale: 0.65, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
      5.37
    );
    tl.fromTo("#badge-2",
      { opacity: 1 },
      { opacity: 0, duration: 0.18, ease: "power2.in" },
      8.15
    );

    // Đăng ký timeline cho runtime HyperFrames
    window.__timelines["scene-s05"] = tl;
  </script>

    </template>
  </body>
</html>
