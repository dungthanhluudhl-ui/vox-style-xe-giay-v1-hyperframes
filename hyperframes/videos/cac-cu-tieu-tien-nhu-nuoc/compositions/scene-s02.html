<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background: #141414;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      background-image: radial-gradient(circle at 50% 45%, #E7E3D9 25%, rgba(20, 20, 20, 0.28) 100%);
      font-family: "Be Vietnam Pro", sans-serif;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Thanh cam thương hiệu cố định mép đáy */
    #brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 90;
    }

    /* Bố cục split 2 cột trong vùng an toàn (y: 160-1390) */
    .split-layout {
      position: absolute;
      top: 220px;
      left: 60px;
      width: 960px;
      height: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
    }

    /* Khung media nửa trái */
    .media-pane {
      width: 468px;
      height: 1100px;
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      border: 4px solid #141414;
      background-color: #141414;
      box-shadow: 10px 10px 0px rgba(20, 20, 20, 0.35);
    }

    .media-scaler {
      width: 100%;
      height: 100%;
      transform-origin: center center;
    }

    .media-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 25% 20%;
      display: block;
    }

    /* Pane nửa phải Shot 1 */
    .pane-right-s1 {
      width: 468px;
      height: 1100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .plate-ink-label {
      background-color: #141414;
      border-radius: 14px;
      padding: 32px 28px;
      border: 3px solid #FF6A1A;
      box-shadow: 8px 8px 0px rgba(20, 20, 20, 0.3);
      width: 100%;
      text-align: center;
    }

    .text-label {
      font-size: 44px;
      font-weight: 900;
      line-height: 1.3;
      color: #F7F4EC;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    /* Card cam nửa phải Shot 2 */
    .card-orange-s2 {
      width: 468px;
      height: 1100px;
      background-color: #FF6A1A;
      border: 4px solid #141414;
      border-radius: 16px;
      box-shadow: 12px 12px 0px #141414;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: stretch;
      padding: 44px 32px;
      transform-origin: center right;
    }

    .card-block-top {
      background-color: #141414;
      border-radius: 12px;
      padding: 28px 20px;
      box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.25);
      text-align: center;
      transform-origin: center center;
    }

    .text-split {
      font-size: 42px;
      font-weight: 900;
      line-height: 1.32;
      color: #F7F4EC;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .card-block-bottom {
      background-color: #F5F0E4;
      border: 3px solid #141414;
      border-radius: 12px;
      padding: 36px 20px;
      box-shadow: 8px 8px 0px #141414;
      text-align: center;
      transform-origin: center center;
    }

    .text-punch {
      font-size: 46px;
      font-weight: 900;
      line-height: 1.28;
      color: #141414;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }
  </style>

  <div id="root" data-composition-id="scene-s02" data-width="1080" data-height="1920" data-duration="9.2">
    <!-- SHOT 1 (0.00s - 4.08s) -->
    <section id="shot-1" class="clip" data-start="0" data-duration="4.08">
      <div id="shot-1-stage" style="width: 100%; height: 100%; perspective: 1000px; transform-origin: left center;">
        <div class="split-layout">
          <!-- Cột trái: ảnh cận cảnh Hoàng đế -->
          <div class="media-pane">
            <div class="media-scaler">
              <img src="assets/img-03-papercut-historical-official-document.jpg" alt="Hoàng đế Francis" class="media-img">
            </div>
          </div>
          <!-- Cột phải: nhãn VỐN SỐNG KÍN ĐÁO -->
          <div class="pane-right-s1">
            <div id="label-s1" class="plate-ink-label">
              <div class="text-label">VỐN SỐNG KÍN ĐÁO</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- SHOT 2 (4.08s - 9.20s) -->
    <section id="shot-2" class="clip" data-start="4.08" data-duration="5.12">
      <div id="shot-2-stage" style="width: 100%; height: 100%;">
        <div class="split-layout">
          <!-- Cột trái: ảnh zoom-in tạo áp lực vương quyền -->
          <div class="media-pane">
            <div id="shot-2-img-scaler" class="media-scaler">
              <img src="assets/img-03-papercut-historical-official-document.jpg" alt="Hoàng đế Francis" class="media-img">
            </div>
          </div>
          <!-- Cột phải: khối card cam đậm tương phản -->
          <div id="shot-2-right-card" class="card-orange-s2">
            <div id="overlay-the-dien" class="card-block-top">
              <div class="text-split">THỂ DIỆN HOÀNG GIA</div>
            </div>
            <div id="overlay-chiu-chi" class="card-block-bottom">
              <div class="text-punch">CHỊU CHI CỰC MẠNH</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Thanh cam đáy cố định nhận diện thương hiệu -->
    <div id="brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    /* =========================================================
       SHOT 1 TIMELINE (0.00s -> 4.08s)
       ========================================================= */
    // TransitionIn: flip entrance cho cả shot stage
    tl.fromTo(
      "#shot-1-stage",
      { rotationY: -50, opacity: 0 },
      { rotationY: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
      0
    );

    // Overlay 1: VỐN SỐNG KÍN ĐÁO (atSec = 0.62s, holdMs = 2.8s)
    tl.fromTo(
      "#label-s1",
      { scale: 0.75, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
      0.62
    );

    /* =========================================================
       SHOT 2 TIMELINE (4.08s -> 9.20s)
       ========================================================= */
    // Camera motion: zoom-in wrapper ảnh Hoàng đế
    tl.fromTo(
      "#shot-2-img-scaler",
      { scale: 1.0 },
      { scale: 1.18, duration: 5.0, ease: "none" },
      4.08
    );

    // TransitionIn: punch entrance đập mạnh khối card cam vào nửa phải
    tl.fromTo(
      "#shot-2-right-card",
      { scale: 0.85, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.38, ease: "back.out(1.4)" },
      4.08
    );

    // Overlay 2: THỂ DIỆN HOÀNG GIA (atSec = 5.34s, holdMs = 2.4s)
    tl.fromTo(
      "#overlay-the-dien",
      { scale: 0.72, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      5.34
    );

    // Overlay 3: CHỊU CHI CỰC MẠNH (atSec = 7.56s, holdMs = 1.64s)
    tl.fromTo(
      "#overlay-chiu-chi",
      { scale: 1.45, opacity: 0, rotation: -3 },
      { scale: 1, opacity: 1, rotation: 0, duration: 0.28, ease: "power4.out" },
      7.56
    );

    window.__timelines["scene-s02"] = tl;
  </script>

    </template>
  </body>
</html>
