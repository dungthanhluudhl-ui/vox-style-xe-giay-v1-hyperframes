<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #141414;
      font-family: 'Be Vietnam Pro', sans-serif;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
    }
    .clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  </style>

  <div id="root" data-composition-id="scene-s08" data-width="1080" data-height="1920" data-duration="7.94">
    <!-- Nền spotlight (vignette tối) cho beat rạp xiếc kịch tính -->
    <div id="scene-bg" style="position: absolute; inset: 0; background-color: #E7E3D9; background-image: radial-gradient(circle at 50% 50%, #E7E3D9 30%, rgba(20, 20, 20, 0.35) 100%); z-index: 1;"></div>

    <!-- SHOT 1: vid-03 (0.0s -> 4.4s) | Transition: spiral | Motion: zoom-in -->
    <div id="shot-1-transition-wrap" data-layout-allow-overflow style="position: absolute; inset: 0; overflow: hidden; z-index: 10;">
      <div id="shot-1-camera-wrap" data-layout-allow-overflow style="position: absolute; inset: 0; overflow: hidden; width: 100%; height: 100%;">
        <video id="shot-1-video" src="assets/vid-03-circus-horse-stunt-cutout.mp4" muted playsinline data-start="0" data-duration="4.4" data-media-start="0.5" style="width: 100%; height: 100%; object-fit: cover; display: block;"></video>
      </div>
    </div>

    <!-- SHOT 1 OVERLAY (t = 2.89s -> 4.39s): quote "VÒNG QUAY NGỰA THẬT" -->
    <section id="shot-1-overlay" class="clip" data-start="0" data-duration="4.4" style="z-index: 25; pointer-events: none;">
      <div id="quote-container" style="position: absolute; top: 480px; left: 0; width: 1080px; display: flex; justify-content: center; align-items: center;">
        <div id="quote-card" class="hf-plate-ink" style="padding: 24px 44px; border-radius: 8px; border-left: 10px solid #FF6A1A; box-shadow: 0 16px 36px rgba(0,0,0,0.45); opacity: 0;">
          <span id="quote-text" class="hf-text-light" style="font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; font-size: 58px; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap;">VÒNG QUAY NGỰA THẬT</span>
        </div>
      </div>
    </section>

    <!-- SHOT 2: img-07 (4.4s -> 7.94s) | Transition: cut | Motion: pan-left -->
    <section id="shot-2" class="clip" data-start="4.4" data-duration="3.54" style="z-index: 20;">
      <div id="shot-2-camera-wrap" data-layout-allow-overflow style="position: absolute; inset: 0; width: 100%; height: 100%;">
        <img id="shot-2-img" src="assets/img-07-paper-cutout-circus-spectacle.jpg" alt="Circus spectacle" style="width: 124%; height: 100%; object-fit: cover; position: absolute; left: -12%; top: 0;" />
      </div>

      <!-- SHOT 2 OVERLAY (t = 5.45s -> 7.85s): label "KỴ SĨ NHÀO LỘN" -->
      <div id="shot-2-overlay" style="position: absolute; inset: 0; pointer-events: none; z-index: 26;">
        <div id="label-container" style="position: absolute; top: 480px; left: 0; width: 1080px; display: flex; justify-content: center; align-items: center;">
          <div id="label-card" class="hf-plate-ink" style="padding: 22px 42px; border-radius: 8px; border-left: 10px solid #FF6A1A; box-shadow: 0 16px 36px rgba(0,0,0,0.45); opacity: 0;">
            <span id="label-text" class="hf-text-light" style="font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; font-size: 54px; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap;">KỴ SĨ NHÀO LỘN</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Lớp phủ vignette spotlight kịch tính toàn khung -->
    <div id="vignette-overlay" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 50%, rgba(20,20,20,0.45) 100%); pointer-events: none; z-index: 30;"></div>

    <!-- Thanh cam thương hiệu cố định mép đáy -->
    <div id="brand-orange-bar" style="position: absolute; bottom: 0; left: 0; width: 1080px; height: 12px; background-color: #FF6A1A; z-index: 999;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // --- SHOT 1 (0.0s - 4.40s) ---
    // Transition In "spiral": xoay và scale vào cảnh mô phỏng vòng xoay rạp xiếc
    tl.fromTo(
      "#shot-1-transition-wrap",
      { scale: 0.28, rotation: -55, opacity: 0 },
      { scale: 1, rotation: 0, opacity: 1, duration: 0.68, ease: "power2.out" },
      0
    );

    // Camera Motion "zoom-in" xuyên suốt Shot 1
    tl.fromTo(
      "#shot-1-camera-wrap",
      { scale: 1 },
      { scale: 1.15, duration: 4.38, ease: "power1.inOut" },
      0
    );

    // Overlay 1: Quote "VÒNG QUAY NGỰA THẬT" (atMs: 61290 -> t=2.89s, holdMs: 1500 -> 4.39s)
    tl.fromTo(
      "#quote-card",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
      2.89
    );
    tl.fromTo(
      "#quote-card",
      { opacity: 1 },
      { opacity: 0, duration: 0.05, ease: "power2.in" },
      4.34
    );

    // --- SHOT 2 (4.40s - 7.94s) ---
    // Camera Motion "pan-left": viewport lia sang trái -> nội dung ảnh dịch sang phải (x tăng dần)
    tl.fromTo(
      "#shot-2-camera-wrap",
      { x: -65 },
      { x: 65, duration: 3.50, ease: "none" },
      4.4
    );

    // Overlay 2: Label "KỴ SĨ NHÀO LỘN" (atMs: 63850 -> t=5.45s, holdMs: 2400 -> 7.85s)
    tl.fromTo(
      "#label-card",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
      5.45
    );
    tl.fromTo(
      "#label-card",
      { opacity: 1 },
      { opacity: 0, duration: 0.08, ease: "power2.in" },
      7.85
    );

    window.__timelines["scene-s08"] = tl;
  </script>

    </template>
  </body>
</html>
