<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #E7E3D9;
      color: #141414;
      font-family: 'Be Vietnam Pro', sans-serif;
      overflow: hidden;
      width: 1080px;
      height: 1920px;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    /* Quy ước bắt buộc: .clip dùng inset: 0, không đặt width/height cứng */
    .clip {
      position: absolute;
      inset: 0;
    }

    /* Biến thể nền spotlight: radial vignette tối cảnh báo quá tải */
    #bg-spotlight {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, #E7E3D9 25%, rgba(20, 20, 20, 0.45) 80%, rgba(20, 20, 20, 0.75) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Thanh cam thương hiệu cố định mép đáy */
    #brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* SHOT 1: Ảnh collage tĩnh, zoom-in, shatter transition */
    #shot-1 {
      z-index: 10;
    }

    #shot-1-media {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #shot-1-media-inner {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
    }

    /* 4 mảnh ghép shatter cho transitionIn */
    .shatter-shard {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .shatter-shard img {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    #shard-1 {
      clip-path: polygon(0% 0%, 100% 0%, 48% 52%, 0% 60%);
    }

    #shard-2 {
      clip-path: polygon(100% 0%, 100% 65%, 48% 52%);
    }

    #shard-3 {
      clip-path: polygon(100% 65%, 100% 100%, 0% 100%, 48% 52%);
    }

    #shard-4 {
      clip-path: polygon(0% 60%, 48% 52%, 0% 100%);
    }

    /* SHOT 2: Video bốc khói quá tải */
    #video-wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 20;
    }

    #vid-04 {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Layer overlay của Shot 2 */
    #shot-2-overlays {
      z-index: 30;
      pointer-events: none;
    }

    /* KHỐI OVERLAYS TYPE: DOCUMENT (tem hồ sơ / cảnh báo đóng dấu) */
    .doc-stamp-container {
      position: absolute;
      left: 70px;
      z-index: 40;
      transform-origin: 20% 50%;
    }

    /* Overlay 1: HỒ SƠ: QUÁ TẢI (nền mực đặc, chữ kem sáng 16.8:1, viền cam) */
    #doc-tag-1-container {
      top: 320px;
    }

    #doc-tag-1 {
      display: inline-block;
      background-color: #141414;
      border: 4px solid #FF6A1A;
      border-radius: 8px;
      padding: 22px 36px;
      color: #F7F4EC;
      font-size: 52px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: 1px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }

    /* Overlay 2: CẢNH BÁO: HOANG TƯỞNG (nền cam đặc, chữ mực 6.4:1, viền mực) */
    #doc-tag-2-container {
      top: 460px;
    }

    #doc-tag-2 {
      display: inline-block;
      background-color: #FF6A1A;
      border: 4px solid #141414;
      border-radius: 8px;
      padding: 22px 36px;
      color: #141414;
      font-size: 48px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: 1px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }

    /* Overlay 3: MÁY KHÔNG BẢO DƯỠNG (nền mực đặc, chữ kem sáng 16.8:1, viền cam) */
    #doc-tag-3-container {
      top: 360px;
    }

    #doc-tag-3 {
      display: inline-block;
      background-color: #141414;
      border: 4px solid #FF6A1A;
      border-radius: 8px;
      padding: 22px 36px;
      color: #F7F4EC;
      font-size: 50px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: 1px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }
  </style>

  <div id="root" data-composition-id="scene-s04" data-width="1080" data-height="1920" data-duration="12.2">
    <!-- Nền cảnh Spotlight -->
    <div id="bg-spotlight"></div>

    <!-- SHOT 1: 0s -> 6s -->
    <section id="shot-1" class="clip" data-start="0" data-duration="6">
      <div id="shot-1-media">
        <div id="shot-1-media-inner">
          <div id="shard-1" class="shatter-shard">
            <img src="assets/img-04-papercut-overload-human-breakdown.jpg" alt="">
          </div>
          <div id="shard-2" class="shatter-shard">
            <img src="assets/img-04-papercut-overload-human-breakdown.jpg" alt="">
          </div>
          <div id="shard-3" class="shatter-shard">
            <img src="assets/img-04-papercut-overload-human-breakdown.jpg" alt="">
          </div>
          <div id="shard-4" class="shatter-shard">
            <img src="assets/img-04-papercut-overload-human-breakdown.jpg" alt="">
          </div>
        </div>
      </div>

      <!-- Overlays của Shot 1 -->
      <div id="doc-tag-1-container" class="doc-stamp-container">
        <div id="doc-tag-1">HỒ SƠ: QUÁ TẢI</div>
      </div>

      <div id="doc-tag-2-container" class="doc-stamp-container">
        <div id="doc-tag-2">CẢNH BÁO: HOANG TƯỞNG</div>
      </div>
    </section>

    <!-- SHOT 2: Video độc lập, KHÔNG nằm trong timed clip để tránh lỗi video_nested_in_timed_element -->
    <div id="video-wrapper">
      <video
        id="vid-04"
        src="assets/vid-04-mental-breakdown-overloaded-burnout.mp4"
        muted
        playsinline
        data-start="6"
        data-duration="6.2"
        data-media-start="1">
      </video>
    </div>

    <!-- Overlays của Shot 2: 6s -> 12.2s -->
    <section id="shot-2-overlays" class="clip" data-start="6" data-duration="6.2">
      <div id="doc-tag-3-container" class="doc-stamp-container">
        <div id="doc-tag-3">MÁY KHÔNG BẢO DƯỠNG</div>
      </div>
    </section>

    <!-- Thanh cam thương hiệu cố định mép đáy -->
    <div id="brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // === SHOT 1 (0s - 6.0s) ===
    // 1. TransitionIn: Shatter entrance (các mảnh vỡ bay vào khớp lại)
    tl.fromTo("#shard-1",
      { x: -140, y: -100, rotation: -9, opacity: 0 },
      { x: 0, y: 0, rotation: 0, opacity: 1, duration: 0.45, ease: "power4.out" },
      0
    );
    tl.fromTo("#shard-2",
      { x: 150, y: -110, rotation: 11, opacity: 0 },
      { x: 0, y: 0, rotation: 0, opacity: 1, duration: 0.45, ease: "power4.out" },
      0
    );
    tl.fromTo("#shard-3",
      { x: 120, y: 130, rotation: -8, opacity: 0 },
      { x: 0, y: 0, rotation: 0, opacity: 1, duration: 0.45, ease: "power4.out" },
      0
    );
    tl.fromTo("#shard-4",
      { x: -130, y: 100, rotation: 10, opacity: 0 },
      { x: 0, y: 0, rotation: 0, opacity: 1, duration: 0.45, ease: "power4.out" },
      0
    );

    // 2. CameraMotion: zoom-in chậm dần xuyên suốt Shot 1
    tl.fromTo("#shot-1-media-inner",
      { scale: 1.0 },
      { scale: 1.10, duration: 5.8, ease: "none" },
      0
    );

    // 3. Overlay 1: "HỒ SƠ: QUÁ TẢI" (at 1.8s, holdMs 2200ms -> 4.0s)
    tl.fromTo("#doc-tag-1-container",
      { opacity: 0, scale: 1.45, rotation: -12, y: -25 },
      { opacity: 1, scale: 1, rotation: -2, y: 0, duration: 0.28, ease: "power4.out" },
      1.8
    );
    tl.fromTo("#doc-tag-1-container",
      { opacity: 1 },
      { opacity: 0, duration: 0.22, ease: "power2.in" },
      4.0
    );

    // 4. Overlay 2: "CẢNH BÁO: HOANG TƯỞNG" (at 4.8s, holdMs 2000ms -> fade out trước khi hết shot 1)
    tl.fromTo("#doc-tag-2-container",
      { opacity: 0, scale: 1.45, rotation: 10, y: -25 },
      { opacity: 1, scale: 1, rotation: 2.5, y: 0, duration: 0.28, ease: "power4.out" },
      4.8
    );
    tl.fromTo("#doc-tag-2-container",
      { opacity: 1 },
      { opacity: 0, duration: 0.15, ease: "power2.in" },
      5.85
    );

    // Chuyển shot 1 -> shot 2: fade out nội dung con của shot 1
    tl.fromTo("#shot-1-media-inner",
      { opacity: 1 },
      { opacity: 0, duration: 0.2, ease: "none" },
      5.8
    );

    // === SHOT 2 (6.0s - 12.2s) ===
    // 5. TransitionIn: Dissolve video wrapper vào cảnh tại t=6.0s
    tl.fromTo("#video-wrapper",
      { opacity: 0 },
      { opacity: 1, duration: 0.35, ease: "power2.out" },
      6.0
    );

    // 6. Overlay 3: "MÁY KHÔNG BẢO DƯỠNG" (at 9.5s, holdMs 2400ms -> 11.9s)
    tl.fromTo("#doc-tag-3-container",
      { opacity: 0, scale: 1.45, rotation: -9, y: -25 },
      { opacity: 1, scale: 1, rotation: -1.5, y: 0, duration: 0.28, ease: "power4.out" },
      9.5
    );
    tl.fromTo("#doc-tag-3-container",
      { opacity: 1 },
      { opacity: 0, duration: 0.25, ease: "power2.in" },
      11.9
    );

    // Đăng ký timeline paused vào registry của HyperFrames runtime
    window.__timelines["scene-s04"] = tl;
  </script>

    </template>
  </body>
</html>
