<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #141414;
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #F5F0E4;
    }
    .clip {
      position: absolute;
      inset: 0;
    }
    .brand-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s03" data-width="1080" data-height="1920" data-duration="7.8">
    
    <!-- Shot S03-1: 0s -> 3.8s -->
    <section id="shot-1" class="clip" data-start="0" data-duration="3.8" style="z-index: 20;">
      <div id="shot-1-content" style="position: absolute; inset: 0;">
        <!-- Hero Collage Card (y: 200 - 1340 inside safe zone) -->
        <div id="hero-img-wrap" style="position: absolute; left: 140px; top: 210px; width: 800px; height: 1120px; overflow: hidden; border-radius: 20px; box-shadow: 0 20px 50px rgba(20,20,20,0.18); background-color: #E7E3D9;">
          <div id="hero-img-scaler" style="width: 100%; height: 100%;">
            <img src="assets/img-01-brain-power-off-cutout.jpg" alt="Microsleep brain collage" style="width: 100%; height: 100%; object-fit: cover;">
          </div>
        </div>

        <!-- Overlay 1: Label "HIỆN TƯỢNG MICROSLEEP" (at 0.6s) -->
        <div id="overlay-label" class="hf-hl-orange" style="position: absolute; left: 80px; top: 230px; padding: 14px 28px; border-radius: 10px; box-shadow: 0 8px 24px rgba(20,20,20,0.25); z-index: 25; font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; font-size: 34px; letter-spacing: 0.5px; line-height: 1.2;">HIỆN TƯỢNG MICROSLEEP</div>

        <!-- Overlay 2: Quote "TAO VẪN THỨC ĐƯỢC!" (at 2.44s) -->
        <div id="overlay-quote-1" class="hf-plate-ink" style="position: absolute; left: 80px; top: 330px; padding: 18px 32px; border-radius: 14px; border-left: 8px solid #FF6A1A; box-shadow: 0 14px 36px rgba(20,20,20,0.35); z-index: 26; font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; font-size: 42px; line-height: 1.25;">TAO VẪN THỨC ĐƯỢC!</div>
      </div>
    </section>

    <!-- Shot S03-2 Video: Direct child of #root, no data-start parent, no clip class (3.8s -> 7.8s) -->
    <video id="vid-01" src="assets/vid-01-brain-power-off-switch.mp4" muted playsinline data-start="3.8" data-duration="4" data-media-start="2" style="position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; z-index: 10;"></video>

    <!-- Shot S03-2 Overlays container (3.8s -> 7.8s) -->
    <section id="shot-2-overlays" class="clip" data-start="3.8" data-duration="4" style="z-index: 30; pointer-events: none;">
      <!-- Overlay 1: Quote "NÃO: TỰ TẮT NGUỒN" (at 4.4s) -->
      <div id="overlay-quote-2" class="hf-plate-ink" style="position: absolute; left: 80px; top: 260px; padding: 22px 36px; border-radius: 14px; border-left: 10px solid #FF6A1A; box-shadow: 0 16px 40px rgba(0,0,0,0.6); font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; font-size: 52px; letter-spacing: -0.5px; line-height: 1.25;">NÃO: TỰ TẮT NGUỒN</div>
    </section>

    <!-- Brand Accent Line (Fixed at bottom edge) -->
    <div class="brand-bottom-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // --- SHOT S03-1 (0s -> 3.8s) ---
    // Strike transitionIn: swift impact entrance with rotation snap
    tl.fromTo(
      "#shot-1-content",
      { y: -160, rotation: -3, opacity: 0 },
      { y: 0, rotation: 0, opacity: 1, duration: 0.45, ease: "power4.out" },
      0
    );

    // Camera motion: continuous subtle zoom-in on the hero image
    tl.fromTo(
      "#hero-img-scaler",
      { scale: 1 },
      { scale: 1.12, duration: 3.8, ease: "none" },
      0
    );

    // Overlay 1: Label "HIỆN TƯỢNG MICROSLEEP" at 0.6s, hold >= 2000ms, then fade out
    tl.fromTo(
      "#overlay-label",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.38, ease: "power3.out" },
      0.6
    );
    tl.fromTo(
      "#overlay-label",
      { opacity: 1 },
      { opacity: 0, duration: 0.25, ease: "power2.in" },
      2.6
    );

    // Overlay 2: Quote "TAO VẪN THỨC ĐƯỢC!" at 2.44s (16640ms - 14200ms)
    tl.fromTo(
      "#overlay-quote-1",
      { scale: 0, opacity: 0, rotation: -2 },
      { scale: 1, opacity: 1, rotation: 0, duration: 0.35, ease: "power3.out" },
      2.44
    );

    // --- SHOT S03-2 (3.8s -> 7.8s) ---
    // Cut transition at 3.8s handled by shot clip & video boundaries
    // Overlay 1: Quote "NÃO: TỰ TẮT NGUỒN" at 4.4s (18600ms - 14200ms), hold >= 2600ms
    tl.fromTo(
      "#overlay-quote-2",
      { scale: 0.6, opacity: 0, y: -20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      4.4
    );
    tl.fromTo(
      "#overlay-quote-2",
      { opacity: 1 },
      { opacity: 0, duration: 0.35, ease: "power2.in" },
      7.0
    );

    // Register paused timeline on window.__timelines["scene-s03"]
    window.__timelines["scene-s03"] = tl;
  </script>

    </template>
  </body>
</html>
