<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      background-image: 
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Khung tư liệu dạng collage hồ sơ */
    .archival-frame {
      position: absolute;
      left: 60px;
      top: 180px;
      width: 960px;
      height: 1060px;
      background-color: #F5F0E4;
      border: 4px solid #141414;
      box-shadow: 12px 12px 0px rgba(20, 20, 20, 0.85);
      overflow: hidden;
    }

    .media-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .media-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Căn chỉnh wrapper pan cho ảnh tĩnh */
    #shot-1-img-wrapper {
      position: absolute;
      top: 0;
      left: -80px;
      width: 1120px;
      height: 100%;
    }

    /* Container định vị nhãn overlay an toàn (y trong dải 160-1390) */
    .overlay-band {
      position: absolute;
      left: 60px;
      top: 1276px;
      width: 960px;
      display: flex;
      justify-content: flex-start;
      pointer-events: none;
      z-index: 120;
    }

    .annotated-badge {
      display: inline-flex;
      align-items: center;
      background-color: #141414;
      border-left: 10px solid #FF6A1A;
      box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.45);
      padding: 16px 32px;
      transform-origin: left center;
    }

    .badge-text {
      color: #F7F4EC;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      line-height: 1.2;
    }

    /* Wrapper video không timed để tránh lỗi video_nested_in_timed_element */
    #video-box {
      position: absolute;
      left: 60px;
      top: 180px;
      width: 960px;
      height: 1060px;
      background-color: #F5F0E4;
      border: 4px solid #141414;
      box-shadow: 12px 12px 0px rgba(20, 20, 20, 0.85);
      overflow: hidden;
      opacity: 0;
      z-index: 40;
    }

    #video-pan-zoom {
      width: 100%;
      height: 100%;
      transform-origin: center center;
    }

    /* Thẻ video độc lập, không class clip */
    #vid-06 {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Thanh cam thương hiệu cố định mép đáy */
    #brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 999;
    }
  </style>

  <div id="root" data-composition-id="scene-s05" data-width="1080" data-height="1920" data-duration="7.8">

    <!-- SHOT 1: Ảnh collage vintage với hiệu ứng peel entrance và pan-left -->
    <section id="shot-1" class="clip" data-start="0" data-duration="3.8" style="z-index: 20;">
      <div id="shot-1-card" class="archival-frame">
        <div class="media-viewport">
          <div id="shot-1-img-wrapper">
            <img src="assets/img-06-scene-observation-alibi-notes.jpg" alt="Randy Gardner Alibi Observation" class="media-content">
          </div>
        </div>
      </div>
      <div class="overlay-band">
        <div id="overlay-1" class="annotated-badge hf-plate-ink">
          <span class="badge-text">HỒ SƠ: RANDY GARDNER</span>
        </div>
      </div>
    </section>

    <!-- SHOT 2 Media: Wrapper video KHÔNG có data-start để chứa thẻ video timed -->
    <div id="video-box">
      <div id="video-pan-zoom">
        <video id="vid-06"
               src="assets/vid-06-alibi-observation-student-cutout.mp4"
               muted
               playsinline
               data-start="3.8"
               data-duration="4.0"
               data-media-start="2">
        </video>
      </div>
    </div>

    <!-- SHOT 2 Overlays: Lớp UI timed cho shot 2 -->
    <section id="shot-2-ui" class="clip" data-start="3.8" data-duration="4.0" style="z-index: 100;">
      <div class="overlay-band">
        <div id="overlay-2" class="annotated-badge hf-plate-ink">
          <span class="badge-text">17 TUỔI (NĂM 1963)</span>
        </div>
      </div>
    </section>

    <!-- Thanh nhận diện thương hiệu đáy -->
    <div id="brand-bar"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    /* ==========================================================================
       SHOT 1 TIMELINE (0.0s -> 3.8s)
       - TransitionIn: "peel" (lật mở tài liệu)
       - CameraMotion: "pan-left" (nội dung x dịch sang phải)
       - Overlay 1: "HỒ SƠ: RANDY GARDNER" tại 1.3s (35500 - 34200), giữ 2.2s
       ========================================================================== */
    // Peel entrance cho khung tư liệu
    tl.fromTo("#shot-1-card",
      { rotationY: -35, rotationZ: -1.5, scale: 0.94, opacity: 0, transformOrigin: "left center" },
      { rotationY: 0, rotationZ: 0, scale: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
      0.05
    );

    // Pan-left: camera dịch sang trái = hình ảnh dịch sang phải (x tăng dần)
    tl.fromTo("#shot-1-img-wrapper",
      { x: -60 },
      { x: 50, duration: 3.65, ease: "none" },
      0.05
    );

    // Overlay 1: Pop entrance và exit
    tl.fromTo("#overlay-1",
      { scale: 0.85, opacity: 0, y: 25 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      1.3
    );
    tl.fromTo("#overlay-1",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" },
      3.5
    );

    /* ==========================================================================
       SHOT 2 TIMELINE (3.8s -> 7.8s)
       - TransitionIn: "dissolve" (hòa tan vào video quan sát đồng hồ)
       - CameraMotion: "zoom-in" (wrapper scale tăng dần)
       - Overlay 2: "17 TUỔI (NĂM 1963)" tại 4.2s (38400 - 34200), giữ 2.4s
       ========================================================================== */
    // Dissolve in cho video box
    tl.fromTo("#video-box",
      { opacity: 0 },
      { opacity: 1, duration: 0.5, ease: "power2.out" },
      3.8
    );

    // Zoom-in camera motion liên tục trên wrapper
    tl.fromTo("#video-pan-zoom",
      { scale: 1.0 },
      { scale: 1.12, duration: 3.9, ease: "power1.out" },
      3.8
    );

    // Overlay 2: Pop entrance và exit
    tl.fromTo("#overlay-2",
      { scale: 0.85, opacity: 0, y: 25 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      4.2
    );
    tl.fromTo("#overlay-2",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -10, duration: 0.3, ease: "power2.in" },
      7.0
    );

    // Đăng ký timeline chính
    window.__timelines["scene-s05"] = tl;
  </script>

    </template>
  </body>
</html>
