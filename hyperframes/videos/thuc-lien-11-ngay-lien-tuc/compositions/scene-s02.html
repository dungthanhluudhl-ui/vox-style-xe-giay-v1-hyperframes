<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #141414;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #E7E3D9;
      overflow: hidden;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Nền ô lưới 84px chuẩn Vox style (variant: grid) */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      background-position: -0.75px -0.75px;
      z-index: 0;
    }

    /* Lớp bọc media chuyển động */
    .media-frame {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* Vùng chứa nhãn dán timeline (y safe: 160 - 1390) */
    .overlay-band {
      position: absolute;
      top: 240px;
      left: 60px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      pointer-events: none;
    }

    /* Thẻ plate mực tương phản cao, chuẩn WCAG */
    .timeline-plate {
      display: inline-flex;
      align-items: center;
      background-color: #141414;
      padding: 16px 28px 16px 20px;
      border-radius: 4px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.38);
      border-left: 8px solid #FF6A1A;
    }

    .timeline-text-content {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 38px;
      line-height: 1.25;
      letter-spacing: 0.04em;
      color: #F7F4EC;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Dải cam nhận diện đáy khung hình cố định 12px */
    .bottom-brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s02" data-width="1080" data-height="1920" data-duration="9.2">
    <!-- Nền grid cố định -->
    <div class="bg-grid"></div>

    <!-- SHOT 1: vid-02 (0s -> 4.5s) -->
    <!-- Wrapper rise & pan cho video, KHÔNG mang data-start để tránh nested timed element -->
    <div id="shot-1-rise-wrap" class="media-frame" style="z-index: 10;">
      <div id="shot-1-pan-wrap" class="media-frame">
        <video
          id="vid-02"
          src="assets/vid-02-exhausted-suspect-custody-time.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="4.5"
          data-media-start="1.5"
          style="position: absolute; width: 100%; height: 100%; object-fit: cover;"
        ></video>
      </div>
    </div>

    <!-- Overlay Shot 1 -->
    <section id="shot-1" class="clip" data-start="0" data-duration="4.5" style="pointer-events: none; z-index: 20;">
      <div class="overlay-band">
        <div id="badge-shot-1" class="hf-plate-ink timeline-plate">
          <span class="timeline-text-content hf-text-light">MỐC 48H - 72H</span>
        </div>
      </div>
    </section>

    <!-- SHOT 2: img-02 (4.5s -> 9.2s) -->
    <section id="shot-2" class="clip" data-start="4.5" data-duration="4.7" style="z-index: 30;">
      <div id="shot-2-container" style="position: absolute; inset: 0;">
        <div id="shot-2-zoom-wrap" class="media-frame" style="transform-origin: 52% 40%;">
          <img
            id="img-02"
            src="assets/img-02-exhausted-suspect-interrogation-hours.jpg"
            alt="Ảo giác và ngủ lịm"
            style="position: absolute; width: 100%; height: 100%; object-fit: cover; display: block;"
          />
        </div>
        <!-- Overlay Shot 2 -->
        <div class="overlay-band">
          <div id="badge-shot-2" class="hf-plate-ink timeline-plate">
            <span class="timeline-text-content hf-text-light">ẢO GIÁC & NGỦ LỊM</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Thanh thương hiệu đáy 12px -->
    <div class="bottom-brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // --- SHOT 1 (0.0s -> 4.5s) ---
    // TransitionIn: rise trượt lên mở màn mốc thời gian leo thang
    tl.fromTo("#shot-1-rise-wrap",
      { y: 130, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
      0
    );

    // CameraMotion: pan-right (nội dung di chuyển sang trái: x giảm dần)
    tl.fromTo("#shot-1-pan-wrap",
      { x: 30, scale: 1.14 },
      { x: -50, scale: 1.14, duration: 4.4, ease: "power1.out" },
      0
    );

    // Overlay timeline: "MỐC 48H - 72H" (atMs: 6350 -> scene local: 1.35s, holdMs: 2200ms -> hold tới 3.55s)
    tl.fromTo("#badge-shot-1",
      { scale: 0.82, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
      1.35
    );
    tl.fromTo("#badge-shot-1",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -16, duration: 0.3, ease: "power2.in" },
      3.65
    );

    // --- SHOT 2 (4.5s -> 9.2s) ---
    // TransitionIn: dissolve hòa tan chuyển cảnh
    tl.fromTo("#shot-2-container",
      { opacity: 0 },
      { opacity: 1, duration: 0.5, ease: "power2.out" },
      4.5
    );

    // CameraMotion: zoom-in crop sát vào gương mặt choáng váng
    tl.fromTo("#shot-2-zoom-wrap",
      { scale: 1.06 },
      { scale: 1.22, duration: 4.6, ease: "power1.out" },
      4.5
    );

    // Overlay timeline: "ẢO GIÁC & NGỦ LỊM" (atMs: 10430 -> scene local: 5.43s, holdMs: 2800ms -> hold tới 8.23s)
    tl.fromTo("#badge-shot-2",
      { scale: 0.82, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
      5.43
    );
    tl.fromTo("#badge-shot-2",
      { opacity: 1, y: 0 },
      { opacity: 0, y: -16, duration: 0.35, ease: "power2.in" },
      8.35
    );

    // Đăng ký timeline cho runtime HyperFrames
    window.__timelines["scene-s02"] = tl;
  </script>

    </template>
  </body>
</html>
