<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #141414;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #F5F0E4;
      font-family: "Be Vietnam Pro", sans-serif;
    }
    .clip {
      position: absolute;
      inset: 0;
    }
    .bg-card {
      position: absolute;
      inset: 0;
      background-color: #F5F0E4;
      z-index: 1;
    }
    .media-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* Shot 1 */
    #shot-1 {
      z-index: 20;
      perspective: 1200px;
    }
    .unfold-wrap {
      position: absolute;
      inset: 0;
      transform-origin: top center;
    }
    .camera-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Shot 2 Video Viewport (không có data-start để tránh lỗi nested timed) */
    .video-viewport {
      position: absolute;
      inset: 0;
      z-index: 10;
      overflow: hidden;
    }
    .dissolve-wrap {
      position: absolute;
      inset: 0;
    }
    /* Shot 2 Section */
    #shot-2 {
      z-index: 30;
      pointer-events: none;
    }
    /* Overlays */
    .overlay-pos {
      position: absolute;
      top: 1120px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50;
    }
    .overlay-card {
      display: inline-flex;
      align-items: center;
      background-color: #141414;
      border-left: 10px solid #FF6A1A;
      border-radius: 8px;
      padding: 22px 38px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }
    .overlay-text {
      font-weight: 900;
      font-size: 56px;
      line-height: 1.2;
      color: #F7F4EC;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    /* Brand Bar cố định ở đáy */
    .brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div id="root" data-composition-id="scene-s07" data-width="1080" data-height="1920" data-duration="6">
    <!-- Nền card phẳng theo style tokens -->
    <div class="bg-card"></div>

    <!-- Video của Shot 2 nằm ngoài section để không vi phạm video_nested_in_timed_element -->
    <div class="video-viewport">
      <div id="shot-2-dissolve" class="dissolve-wrap">
        <div id="shot-2-camera" class="camera-wrap">
          <video
            id="vid-shot-2"
            src="assets/vid-07-sleeping-man-alibi-cutout.mp4"
            muted
            playsinline
            data-start="3"
            data-duration="3"
            data-media-start="2"
            class="media-cover"
          ></video>
        </div>
      </div>
    </div>

    <!-- Shot 1: 0s -> 3s -->
    <section id="shot-1" class="clip" data-start="0" data-duration="3">
      <div id="shot-1-unfold" class="unfold-wrap">
        <div id="shot-1-camera" class="camera-wrap">
          <img src="assets/img-07-man-sleeping-alibi-timeline.jpg" alt="" class="media-cover">
        </div>
      </div>
      <div class="overlay-pos">
        <div id="overlay-1" class="overlay-card">
          <span class="overlay-text">+14 GIỜ NGỦ LIỀN</span>
        </div>
      </div>
    </section>

    <!-- Shot 2: 3s -> 6s (chứa overlay của shot 2) -->
    <section id="shot-2" class="clip" data-start="3" data-duration="3">
      <div class="overlay-pos">
        <div id="overlay-2" class="overlay-card">
          <span class="overlay-text">HỒI PHỤC HOÀN TOÀN</span>
        </div>
      </div>
    </section>

    <!-- Thanh cam đáy nhận diện thương hiệu -->
    <div class="brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // SHOT 1 (0s -> 3s)
    // Transition unfold: mở bung nếp gấp giấy đón ánh sáng ấm áp
    tl.fromTo(
      "#shot-1-unfold",
      { rotationX: -36, scale: 0.92, opacity: 0 },
      { rotationX: 0, scale: 1, opacity: 1, duration: 0.55, ease: "power2.out" },
      0.05
    );

    // Camera motion: pan-left (camera lia sang trái -> ảnh dịch sang phải)
    tl.fromTo(
      "#shot-1-camera",
      { scale: 1.08, x: -45 },
      { scale: 1.08, x: 45, duration: 2.9, ease: "power1.inOut" },
      0
    );

    // Overlay 1: data badge xuất hiện tại 1.5s (+14 GIỜ NGỦ LIỀN)
    tl.fromTo(
      "#overlay-1",
      { scale: 0.75, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      1.5
    );

    // SHOT 2 (3s -> 6s)
    // Transition dissolve: hòa tan êm dịu lúc 3.0s
    tl.fromTo(
      "#shot-2-dissolve",
      { opacity: 0 },
      { opacity: 1, duration: 0.5, ease: "power2.out" },
      3.0
    );

    // Camera motion: zoom-in từ 3.0s -> 5.9s
    tl.fromTo(
      "#shot-2-camera",
      { scale: 1.0 },
      { scale: 1.12, duration: 2.9, ease: "power1.out" },
      3.0
    );

    // Overlay 2: data badge xuất hiện tại 3.5s (HỒI PHỤC HOÀN TOÀN)
    tl.fromTo(
      "#overlay-2",
      { scale: 0.75, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      3.5
    );

    // Fade out overlay 2 nhẹ trước khi scene kết thúc
    tl.fromTo(
      "#overlay-2",
      { opacity: 1 },
      { opacity: 0, duration: 0.18, ease: "power2.in" },
      5.8
    );

    // Đăng ký timeline paused vào window.__timelines
    window.__timelines["scene-s07"] = tl;
  </script>

    </template>
  </body>
</html>
