<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #141414;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #E7E3D9;
      overflow: hidden;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Background Spotlight Variant */
    #bg-spotlight {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, #E7E3D9 30%, rgba(20, 20, 20, 0.35) 100%), #E7E3D9;
      z-index: 1;
      pointer-events: none;
    }

    /* Bottom Brand Bar */
    #bottom-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
      pointer-events: none;
    }

    /* Media Wrappers */
    #shot-1-media-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
    }

    #vid-s01-1 {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #shot-2-media-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
      transform-origin: 50% 38%;
      pointer-events: none;
    }

    #img-s01-2 {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 38%;
      display: block;
    }

    /* Overlay Layers */
    .overlay-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 320px;
    }

    /* Data Cards */
    .data-plate-ink {
      background-color: #141414;
      border: 3.5px solid #FF6A1A;
      border-radius: 16px;
      padding: 20px 42px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .data-plate-ink span {
      color: #F7F4EC;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1.2;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .data-plate-orange {
      background-color: #FF6A1A;
      border: 3.5px solid #141414;
      border-radius: 16px;
      padding: 20px 42px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .data-plate-orange span {
      color: #141414;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1.2;
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>

  <div id="root" data-composition-id="scene-s01" data-width="1080" data-height="1920" data-duration="5">
    <!-- Nền Spotlight cố định -->
    <div id="bg-spotlight"></div>

    <!-- SHOT 1: Video 24h thức trắng (0s - 3s) -->
    <div id="shot-1-media-wrap" data-layout-allow-overflow>
      <video id="vid-s01-1"
             src="assets/vid-03-exhausted-suspect-24-hours-clock.mp4"
             muted playsinline
             data-start="0"
             data-duration="3"
             data-media-start="1">
      </video>
    </div>

    <div id="shot-1-overlay" class="clip overlay-layer" data-start="0" data-duration="3" style="z-index: 20;">
      <div id="shot-1-data-card" class="data-plate-ink">
        <span>24 GIỜ THỨC TRẮNG</span>
      </div>
    </div>

    <!-- SHOT 2: Ảnh tĩnh kiệt sức (3s - 5s) -->
    <section id="shot-2" class="clip" data-start="3" data-duration="2" style="z-index: 30;">
      <div id="shot-2-media-wrap" data-layout-allow-overflow>
        <img id="img-s01-2"
             src="assets/img-03-exhausted-man-24-hours-interrogation.jpg"
             alt="">
      </div>

      <div class="overlay-layer" style="z-index: 40;">
        <div id="shot-2-data-card" class="data-plate-orange">
          <span>PHẢN XẠ GIẢM RÕ</span>
        </div>
      </div>
    </section>

    <!-- Thanh cam đáy cố định -->
    <div id="bottom-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    /* --- SHOT 1 TIMELINE (0s -> 3s) --- */
    // Transition in: punch (đập mạnh từ scale 1.25 xuống 1.04)
    tl.fromTo("#shot-1-media-wrap",
      { scale: 1.25, opacity: 0 },
      { scale: 1.04, opacity: 1, duration: 0.45, ease: "power4.out" },
      0
    );

    // Camera zoom-in tiếp diễn
    tl.fromTo("#shot-1-media-wrap",
      { scale: 1.04 },
      { scale: 1.16, duration: 2.5, ease: "none" },
      0.45
    );

    // Overlay: "24 GIỜ THỨC TRẮNG" xuất hiện tại 940ms (0.94s), giữ 1900ms (1.9s)
    tl.fromTo("#shot-1-data-card",
      { scale: 0.6, opacity: 0, y: 35 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      0.94
    );

    tl.fromTo("#shot-1-data-card",
      { opacity: 1 },
      { opacity: 0, duration: 0.14, ease: "power2.in" },
      2.84
    );

    /* --- SHOT 2 TIMELINE (3s -> 5s) --- */
    // Transition in: cut; camera zoom-in đẩy sâu vào gương mặt kiệt sức
    tl.fromTo("#shot-2-media-wrap",
      { scale: 1.04 },
      { scale: 1.22, duration: 1.95, ease: "power1.out" },
      3.0
    );

    // Overlay: "PHẢN XẠ GIẢM RÕ" xuất hiện tại 3100ms (3.1s), giữ 1800ms (1.8s)
    tl.fromTo("#shot-2-data-card",
      { scale: 0.65, opacity: 0, y: 35 },
      { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
      3.1
    );

    tl.fromTo("#shot-2-data-card",
      { opacity: 1 },
      { opacity: 0, duration: 0.08, ease: "power2.in" },
      4.9
    );

    window.__timelines["scene-s01"] = tl;
  </script>

    </template>
  </body>
</html>
