      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }

    * {

      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #E7E3D9;
      overflow: hidden;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #E7E3D9;
      overflow: hidden;
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    .clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* Background Variant: Chart */
    #bg-chart {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .chart-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background-color: rgba(20, 20, 20, 0.22);
    }

    .chart-tick {
      position: absolute;
      left: 0;
      width: 24px;
      height: 12px;
      background-color: #FF6A1A;
    }

    /* Fixed Brand Bottom Bar */
    #brand-bar {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 90;
    }

    /* Media Frames in Safe Zone */
    .media-frame {
      position: absolute;
      left: 120px;
      top: 180px;
      width: 840px;
      height: 960px;
    }

    .media-box {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 8px;
      border: 3px solid #141414;
      box-shadow: 0 20px 48px rgba(20, 20, 20, 0.28);
      background-color: #141414;
    }

    .media-box img,
    .media-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Overlay Punch Phrase */
    .overlay-row {
      position: absolute;
      left: 0;
      width: 1080px;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;

      font-weight: 900;

      line-height: 1.2;
      letter-spacing: 0.03em;
      white-space: nowrap;
      border-left: 8px solid #FF6A1A;
      border-radius: 4px;
      box-shadow: 0 16px 40px rgba(20, 20, 20, 0.42);
    }
  </style>

  <div id="root" data-composition-id="scene-s06" data-width="1080" data-height="1920" data-duration="10">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Shot 1: transitionIn "grow" (0s - 0.5s)
    tl.fromTo("#shot-1-stage", 
      { scale: 0.86, opacity: 0 }, 
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 
      0
    );

    // Shot 1: cameraMotion "zoom-out" (0.2s - 4.8s)
    tl.fromTo("#shot-1-media", 
      { scale: 1.15 }, 
      { scale: 1.0, duration: 4.6, ease: "power1.out" }, 
      0.2
    );

    // Shot 1: overlay entrance at 1.8s (holdMs: 2600ms)
    tl.fromTo("#overlay-s06-1", 
      { scale: 0.72, opacity: 0, y: 30 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 
      1.8
    );

    // Shot 1: overlay exit before shot ends
    tl.fromTo("#overlay-s06-1", 
      { opacity: 1, y: 0 }, 
      { opacity: 0, y: -15, duration: 0.3, ease: "power2.in" }, 
      4.5
    );

    // Shot 2: transitionIn "dissolve" into video stage at 5.0s
    tl.fromTo("#shot-2-stage", 
      { opacity: 0 }, 
      { opacity: 1, duration: 0.4, ease: "power2.out" }, 
      5.0
    );

    // Shot 2: overlay entrance at 6.8s (holdMs: 2800ms)
    tl.fromTo("#overlay-s06-2", 
      { scale: 0.72, opacity: 0, y: 30 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 
      6.8
    );

    // Shot 2: overlay exit before shot ends
    tl.fromTo("#overlay-s06-2", 
      { opacity: 1, y: 0 }, 
      { opacity: 0, y: -15, duration: 0.25, ease: "power2.in" }, 
      9.65
    );

    window.__timelines["scene-s06"] = tl;
  </script>
