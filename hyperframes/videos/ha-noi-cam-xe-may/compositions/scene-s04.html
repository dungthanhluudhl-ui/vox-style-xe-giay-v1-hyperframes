    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>

        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
        overflow: hidden;
      }

      /* Root composition 1080x1920 portrait */
      #root {
        position: relative;
        width: 100%;
        height: 100%;

          linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);

      }

      /* Chuẩn HyperFrames clip: position: absolute; inset: 0 */
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Chữ ký thương hiệu Vox DNA: Thanh cam cố định mép dưới cùng */
      .bottom-brand-bar {

        left: 0;
        right: 0;
        height: 10px;
        background-color: #FF6A1A;
        z-index: 100;
      }

        left: 60px;
        right: 60px;
        height: 46px;

        align-items: center;
        justify-content: space-between;
        background-color: #141414;

      /* PHOTO CARD: Đại công trường Nhổn - Ga Hà Nội (y: 235px - 990px) */
      .photo-frame {
        position: absolute;

      /* Sticker dán góc ảnh */
      .photo-badge {

        color: #F7F4EC;

      /* DIAGRAM CARD: Tiến độ thi công đứt đoạn (y: 1015px - 1230px) */
      .diagram-card {
        position: absolute;

      .diagram-status-pill {

      .diagram-svg {

      /* PUNCH PHRASE & CLOCK BLOCK (y: 1255px - 1490px) */
      .punch-block {
        position: absolute;
        top: 1255px;
        left: 60px;
        width: 960px;

      .punch-top-row {

        justify-content: space-between;
      }
      .punch-phrase {
        font-size: 64px;
        font-weight: 900;

        letter-spacing: -0.5px;
        margin: 0;
      }
      .punch-phrase .accent-orange {
        color: #FF6A1A;
      }
      .punch-phrase .ink-light {
        color: #F7F4EC;
      }
      .clock-icon-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 80px;
        height: 80px;
        flex-shrink: 0;
      }
      .punch-bottom-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 2px dashed rgba(247, 244, 236, 0.25);
        padding-top: 14px;
      }
      .broken-label-badge {
        background-color: #FF6A1A;
        color: #141414;
        font-size: 24px;
        font-weight: 900;
        padding: 6px 18px;
        border: 2px solid #141414;
        border-radius: 6px;
        letter-spacing: 0.5px;
      }
      .punch-subtext {
        font-size: 20px;
        font-weight: 700;
        color: #F7F4EC;
        letter-spacing: 0.5px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s04"
      data-width="1080"
      data-height="1920"
      data-duration="5.32"
    >
      <section id="scene-s04" class="clip" data-start="0" data-duration="5.32">
        <!-- TOP PROJECT IDENTIFIER -->
        <div id="project-tag" class="project-tag">
          <div class="project-tag-left">
            <span class="project-tag-dot"></span>
            <span>Tuyến Metro Số 3 · Hà Nội</span>
          </div>
          <div class="project-tag-right">HỒ SƠ HẠ TẦNG</div>
        </div>

        <!-- PHOTO CARD: CÔNG TRƯỜNG DANG DỞ -->
        <div id="photo-frame" class="photo-frame">
          <div class="photo-inner" data-layout-allow-overflow="true">
            <img
              id="hero-img"
              src="assets/img-03-urban-transit-data-infographic.jpeg"
              alt="Công trường tuyến metro Nhổn - Ga Hà Nội"
              data-layout-allow-overflow="true"
            />
          </div>
          <!-- Sticker góc ảnh -->
          <div id="photo-badge" class="photo-badge">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L2 22H22L12 2Z" fill="#FF6A1A" stroke="#141414" stroke-width="2" />
              <path d="M12 9V14" stroke="#141414" stroke-width="2" stroke-linecap="round" />
              <circle cx="12" cy="18" r="1.5" fill="#141414" />
            </svg>
            <span class="photo-badge-text">CÔNG TRƯỜNG DANG DỞ</span>
          </div>
        </div>

        <!-- DIAGRAM: ĐƯỜNG TIẾN ĐỘ THI CÔNG BỊ GÃY KHÚC -->
        <div id="diagram-card" class="diagram-card">
          <div class="diagram-header">
            <span class="diagram-title">ĐƯỜNG TIẾN ĐỘ THI CÔNG (2009 — NAY)</span>
            <span class="diagram-status-pill">ĐÌNH TRỆ</span>
          </div>
          <svg class="diagram-svg" viewBox="0 0 910 120" fill="none">
            <!-- Ray nền & Tà vẹt -->
            <line x1="80" y1="55" x2="440" y2="55" stroke="rgba(20, 20, 20, 0.2)" stroke-width="12" stroke-linecap="round" />
            <line x1="560" y1="55" x2="830" y2="55" stroke="rgba(20, 20, 20, 0.15)" stroke-width="12" stroke-dasharray="14 14" stroke-linecap="round" />

            <!-- Đoạn 1: Đã thi công kéo dài (2009 -> Rào chắn) -->
            <path id="track-drawn" d="M 80 55 L 450 55" stroke="#141414" stroke-width="8" stroke-linecap="round" />

            <!-- Mốc khởi công 2009 -->
            <g id="marker-2009">
              <circle cx="80" cy="55" r="14" fill="#FF6A1A" stroke="#141414" stroke-width="3" />
              <circle cx="80" cy="55" r="5" fill="#141414" />
              <text x="80" y="24" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="18" fill="#141414">2009</text>
              <text x="80" y="94" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="15" fill="#141414">Khởi công</text>
            </g>

            <!-- Rào chắn công trường & Vết gãy đứt -->
            <g id="barrier-group">
              <!-- Vết gãy cam rực -->
              <path d="M 450 55 L 475 25 L 495 85 L 520 55" stroke="#FF6A1A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
              <!-- Biển rào chắn xây dựng (Màu chữ #FF6A1A trên nền tối #141414 đạt tương phản 6.57:1) -->
              <rect x="475" y="10" width="72" height="24" rx="3" fill="#141414" stroke="#FF6A1A" stroke-width="2" />
              <text x="511" y="27" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="13" fill="#FF6A1A">RÀO CHẮN</text>
              
              <!-- Badge nền đen cho ĐỨT ĐOẠN bảo đảm độ tương phản chuẩn WCAG AA -->
              <rect x="445" y="86" width="102" height="26" rx="4" fill="#141414" stroke="#FF6A1A" stroke-width="2" />
              <text x="496" y="104" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="14" fill="#FF6A1A">ĐỨT ĐOẠN</text>
            </g>

            <!-- Mốc đích đến: Ga Hà Nội (Chưa thông) - Text dùng màu #141414 trên nền kem đạt tương phản 15:1 -->
            <g id="marker-destination">
              <circle cx="830" cy="55" r="14" fill="#F5F0E4" stroke="#141414" stroke-width="3" stroke-dasharray="4 4" />
              <text x="830" y="24" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="18" fill="#141414">GA HÀ NỘI</text>
              <text x="830" y="94" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="15" fill="#141414">Chưa vận hành</text>
            </g>
          </svg>
        </div>

        <!-- PUNCH PHRASE & CLOCK ICON BLOCK -->
        <div id="punch-block" class="punch-block">
          <div class="punch-top-row">
            <h1 id="punch-phrase" class="punch-phrase">
              <span class="accent-orange">15 NĂM</span>
              <span class="ink-light">DỞ DANG</span>
            </h1>

            <!-- Icon CLOCK SVG chuẩn hoá -->
            <div id="clock-wrap" class="clock-icon-wrap">
              <svg id="clock-svg" width="76" height="76" viewBox="0 0 76 76" fill="none">
                <!-- Vành đồng hồ tự vẽ -->
                <circle id="clock-rim" cx="38" cy="38" r="32" stroke="#FF6A1A" stroke-width="5" stroke-linecap="round" />
                <!-- 4 vạch số chính -->
                <line x1="38" y1="12" x2="38" y2="18" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
                <line x1="38" y1="58" x2="38" y2="64" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
                <line x1="12" y1="38" x2="18" y2="38" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
                <line x1="58" y1="38" x2="64" y2="38" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
                <!-- Kim giờ & kim phút quay -->
                <g id="clock-hand-hour" style="transform-origin: 38px 38px;">
                  <line x1="38" y1="38" x2="38" y2="24" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" />
                </g>
                <g id="clock-hand-min" style="transform-origin: 38px 38px;">
                  <line x1="38" y1="38" x2="54" y2="38" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round" />
                </g>
                <!-- Tâm kim -->
                <circle cx="38" cy="38" r="4.5" fill="#FF6A1A" stroke="#141414" stroke-width="1.5" />
              </svg>
            </div>
          </div>

          <div class="punch-bottom-row">
            <div id="broken-label" class="broken-label-badge">TIẾN ĐỘ ĐỨT ĐOẠN</div>
            <div id="subtext-status" class="punch-subtext">KHỞI CÔNG 2009 · CHƯA ĐƯA VÀO SỬ DỤNG</div>
          </div>
        </div>

        <!-- Dải cam cố định đáy khung hình -->
        <div class="bottom-brand-bar"></div>
      </section>
    </div>

    <!-- GSAP ANIMATION SCRIPT -->
    <script>
      // 1. Khởi tạo timeline paused bắt buộc theo HyperFrames contract
      const tl = gsap.timeline({ paused: true });

      // 2. Chuẩn bị đường nét vẽ SVG (Path Lengths)
      const trackDrawn = document.getElementById("track-drawn");
      const trackLen = trackDrawn.getTotalLength();
      trackDrawn.style.strokeDasharray = trackLen;
      trackDrawn.style.strokeDashoffset = trackLen;

      const clockRim = document.getElementById("clock-rim");
      const rimLen = clockRim.getTotalLength();
      clockRim.style.strokeDasharray = rimLen;
      clockRim.style.strokeDashoffset = rimLen;

      // 3. Xây dựng diễn hoạt theo nhịp kịch bản và Shotlist
      // t = 0.05s: Top tag xuất hiện
      tl.fromTo(
        "#project-tag",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.05
      );

      // t = 0.08s: Photo Card vào cảnh bằng hiệu ứng "peel" (như bóc nhãn dán xuống mặt bàn)
      tl.fromTo(
        "#photo-frame",
        {
          rotationX: 8,
          rotationY: -8,
          scale: 0.94,
          opacity: 0,
          y: 20
        },
        {
          rotationX: 0,
          rotationY: 0,
          scale: 1,
          opacity: 1,
          y: 0,
          duration: 0.75,
          ease: "power3.out"
        },
        0.08
      );

      // Camera Pan-left nhẹ trên ảnh công trường (từ t = 0.0s đến hết scene 5.32s)
      tl.fromTo(
        "#hero-img",
        { x: 35, scale: 1.32 },
        { x: -35, scale: 1.32, duration: 5.32, ease: "none" },
        0
      );

      // Sticker góc ảnh pop vào
      tl.fromTo(
        "#photo-badge",
        { scale: 0, opacity: 0, rotation: -15 },
        { scale: 1, opacity: 1, rotation: -3, duration: 0.45, ease: "power3.out" },
        0.45
      );

      // t = 0.65s: Diagram card trượt lên
      tl.fromTo(
        "#diagram-card",
        { y: 25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.65
      );

      // t = 0.85s: Mốc 2009 pop-in
      tl.fromTo(
        "#marker-2009",
        { scale: 0, opacity: 0, transformOrigin: "80px 55px" },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.85
      );

      // t = 0.95s: Vẽ đường ray tiến độ thi công từ 2009 đến điểm đứt gãy
      tl.to(
        "#track-drawn",
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        0.95
      );

      // t = 1.35s: Rào chắn & vết gãy đứt bung ra (Barrier pop)
      tl.fromTo(
        "#barrier-group",
        { scale: 0, opacity: 0, transformOrigin: "495px 55px" },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.35
      );

      // t = 1.55s: Điểm đích mờ mịt (Ga Hà Nội chưa thông xe)
      tl.fromTo(
        "#marker-destination",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        1.55
      );

      // t = 1.85s - 1.90s (Shotlist 26500ms): PUNCH PHRASE "15 NĂM DỞ DANG" xuất hiện
      tl.fromTo(
        "#punch-block",
        { scale: 0.95, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.85
      );

      tl.fromTo(
        "#punch-phrase",
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.90
      );

      // t = 2.20s (Shotlist 26800ms): ICON CLOCK (vòng tròn đồng hồ tự vẽ & kim quay dồn dập 15 năm)
      tl.fromTo(
        "#clock-wrap",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        2.20
      );

      tl.to(
        "#clock-rim",
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        2.25
      );

      // Kim giờ và kim phút xoay tượng trưng 15 năm thời gian bế tắc
      tl.fromTo(
        "#clock-hand-hour",
        { rotation: 0 },
        { rotation: 360, duration: 1.8, ease: "power2.out" },
        2.30
      );
      tl.fromTo(
        "#clock-hand-min",
        { rotation: 0 },
        { rotation: 720, duration: 1.8, ease: "power2.out" },
        2.30
      );

      // t = 3.20s (Shotlist 27800ms): LABEL "TIẾN ĐỘ ĐỨT ĐOẠN" xuất hiện dứt khoát
      tl.fromTo(
        "#broken-label",
        { scale: 0.8, opacity: 0, y: 15 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        3.20
      );

      tl.fromTo(
        "#subtext-status",
        { opacity: 0, x: -15 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" },
        3.35
      );

      // 4. BẮT BUỘC: Đăng ký timeline đã build xong với window.__timelines["scene-s04"]
      window.__timelines["scene-s04"] = tl;
    </script>
  
    </template>
  </body>
</html>
