<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #f5f0e4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f5f0e4;
      }

      /* Fixed signature Vox orange bottom bar */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 100;
      }

      /* Scene Layout Layer */
      .scene-layer {
        position: absolute;
        inset: 0;
      }

      /* Header Category Pill */
      .header-pill {
        position: absolute;
        top: 175px;
        left: 60px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background-color: #141414;
        color: #f7f4ec;
        padding: 12px 28px;
        border-radius: 999px;
        font-weight: 900;
        font-size: 26px;
        letter-spacing: 2px;
        box-shadow: 4px 4px 0px #ff6a1a;
        z-index: 30;
      }
      .pill-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background-color: #ff6a1a;
      }

      /* Causal Multiplication Diagram (Dark card ensures 100% WCAG AAA contrast) */
      .diagram-card {
        position: absolute;
        top: 258px;
        left: 60px;
        width: 960px;
        height: 154px;
        background-color: #141414;
        border: 3px solid #141414;
        border-radius: 16px;
        box-shadow: 8px 8px 0px #ff6a1a;
        padding: 18px 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 25;
      }
      .math-node {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .math-number {
        font-size: 38px;
        font-weight: 900;
        color: #f7f4ec;
        line-height: 1.1;
      }
      .math-sub {
        font-size: 19px;
        font-weight: 700;
        color: #e7e3d9;
        margin-top: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .math-operator {
        font-size: 44px;
        font-weight: 900;
        color: #ff6a1a;
      }
      .math-result {
        background-color: #ff6a1a;
        border: 3px solid #141414;
        border-radius: 12px;
        padding: 10px 22px;
        box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.45);
      }
      .math-result .math-number {
        color: #141414;
        font-size: 40px;
      }
      .math-result .math-sub {
        color: #141414;
        font-weight: 900;
      }

      /* Hero Visual Frame */
      .hero-frame {
        position: absolute;
        top: 445px;
        left: 60px;
        width: 960px;
        height: 800px;
        background-color: #e7e3d9;
        border: 4px solid #141414;
        border-radius: 20px;
        box-shadow: 14px 14px 0px #ff7a1a, 14px 14px 0px 4px #141414;
        overflow: hidden;
        z-index: 10;
        transform-origin: 50% 50%;
      }
      .hero-image-wrapper {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .hero-image-wrapper img {
        position: absolute;
        top: 0;
        left: -40px;
        width: calc(100% + 80px);
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
      }

      /* Overlaid Scale Balance Badge */
      .scale-badge {
        position: absolute;
        top: 905px;
        right: 85px;
        width: 325px;
        height: 295px;
        background-color: #f7f4ec;
        border: 3px solid #141414;
        border-radius: 18px;
        box-shadow: 8px 8px 0px #141414;
        padding: 16px 20px;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        transform-origin: 50% 50%;
      }
      .scale-title {
        font-size: 20px;
        font-weight: 900;
        color: #141414;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 6px;
      }
      .scale-svg {
        width: 280px;
        height: 220px;
      }

      /* Lower Punch Phrase Card */
      .punch-card {
        position: absolute;
        top: 1290px;
        left: 60px;
        width: 960px;
        height: 175px;
        background-color: #141414;
        border-radius: 20px;
        border: 3px solid #141414;
        box-shadow: 10px 10px 0px #ff6a1a;
        padding: 24px 34px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        z-index: 30;
      }
      .punch-sub {
        color: #ff6a1a;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .punch-headline {
        color: #f7f4ec;
        font-size: 56px;
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: -0.5px;
        margin: 0;
        text-transform: uppercase;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s10"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6.32"
    >
      <div id="scene-s10" class="scene-layer">
        <!-- Editorial Label -->
        <div id="label-tag" class="header-pill">
          <span class="pill-dot"></span>
          <span>NHÂN LÊN GẤP BA</span>
        </div>

        <!-- Technical Multiplier Diagram -->
        <div id="diagram-card" class="diagram-card">
          <div class="math-node math-item">
            <div class="math-number">2 — 3 XE</div>
            <div class="math-sub">Số lượng đổi</div>
          </div>

          <div class="math-operator math-item">×</div>

          <div class="math-node math-item">
            <div class="math-number">25 — 30 TR</div>
            <div class="math-sub">Đơn giá 1 xe</div>
          </div>

          <div class="math-operator math-item">=</div>

          <div id="math-total-result" class="math-node math-result math-item">
            <div class="math-number">60 — 90 TR</div>
            <div class="math-sub">Tổng chi phí</div>
          </div>
        </div>

        <!-- Hero Cutout Frame -->
        <div id="hero-card" class="hero-frame">
          <div
            id="hero-img-wrap"
            class="hero-image-wrapper"
            data-layout-allow-overflow="true"
          >
            <img
              id="hero-img"
              src="assets/img-02-financial-burden-poor-family.jpeg"
              alt="Áp lực tài chính gia đình nghèo"
              data-layout-allow-overflow="true"
            />
          </div>
        </div>

        <!-- Technical Scale Overlay -->
        <div
          id="scale-badge"
          class="scale-badge"
          data-layout-allow-overlap="true"
        >
          <div class="scale-title">Mất cân đối chi phí</div>
          <svg class="scale-svg" viewBox="0 0 280 200" fill="none">
            <!-- Base and Central Pillar -->
            <polygon points="140,150 120,185 160,185" fill="#141414" />
            <rect x="136" y="55" width="8" height="100" fill="#141414" rx="3" />
            <circle cx="140" cy="55" r="9" fill="#FF6A1A" stroke="#141414" stroke-width="3" />

            <!-- Tilting Beam -->
            <g id="scale-beam-group">
              <line
                id="scale-beam-bar"
                x1="45"
                y1="55"
                x2="235"
                y2="55"
                stroke="#141414"
                stroke-width="6"
                stroke-linecap="round"
              />

              <!-- Left Pan: Light Income -->
              <g id="pan-income">
                <line x1="45" y1="55" x2="25" y2="105" stroke="#141414" stroke-width="2.5" />
                <line x1="45" y1="55" x2="65" y2="105" stroke="#141414" stroke-width="2.5" />
                <path d="M 15 105 Q 45 125 75 105 Z" fill="#141414" />
                <rect x="23" y="85" width="44" height="20" rx="4" fill="#141414" />
                <text x="45" y="100" font-family="'Be Vietnam Pro', sans-serif" font-size="11" font-weight="900" fill="#F7F4EC" text-anchor="middle">LƯƠNG</text>
              </g>

              <!-- Right Pan: Heavy Cost -->
              <g id="pan-cost">
                <line x1="235" y1="55" x2="210" y2="105" stroke="#141414" stroke-width="2.5" />
                <line x1="235" y1="55" x2="260" y2="105" stroke="#141414" stroke-width="2.5" />
                <path d="M 200 105 Q 235 125 270 105 Z" fill="#141414" />
                <rect x="206" y="68" width="58" height="34" rx="6" fill="#FF6A1A" stroke="#141414" stroke-width="3" />
                <text x="235" y="90" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="900" fill="#141414" text-anchor="middle">90 TR</text>
              </g>
            </g>
          </svg>
        </div>

        <!-- Punch Phrase Banner -->
        <div id="punch-card" class="punch-card">
          <div class="punch-sub">Cảnh báo kinh tế</div>
          <h1 class="punch-headline">GÁNH NẶNG NGÂN SÁCH</h1>
        </div>
      </div>

      <!-- Fixed Signature Bottom Line -->
      <div class="brand-bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Hero Card: Spiral entrance (scaling, rotating, fading in)
      tl.fromTo(
        "#hero-card",
        { scale: 0.15, rotation: -22, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
        0.05
      );

      // Camera pan-left across scene duration on image
      tl.fromTo(
        "#hero-img",
        { x: 35 },
        { x: -35, duration: 6.32, ease: "none" },
        0
      );

      // 2. Editorial Label arrives at 0.6s (66000ms in master timeline)
      tl.fromTo(
        "#label-tag",
        { scale: 0.65, y: -25, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.6
      );

      // 3. Multiplication diagram unfolds at 0.95s
      tl.fromTo(
        "#diagram-card",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.95
      );

      tl.fromTo(
        ".math-item",
        { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, stagger: 0.1, ease: "power3.out" },
        1.15
      );

      // Accent pulse on the calculated total
      tl.fromTo(
        "#math-total-result",
        { scale: 1 },
        { scale: 1.06, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" },
        2.3
      );

      // 4. Punch Phrase "GÁNH NẶNG NGÂN SÁCH" reveals at 3.4s (68800ms)
      tl.fromTo(
        "#punch-card",
        { y: 40, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" },
        3.4
      );

      // 5. Scale balance icon stamps in at 3.8s (69200ms)
      tl.fromTo(
        "#scale-badge",
        { scale: 0.35, rotation: -12, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        3.8
      );

      // Severe weight imbalance tilt on the scale
      tl.fromTo(
        "#scale-beam-bar",
        { rotation: 0, transformOrigin: "140px 55px" },
        { rotation: 16, duration: 0.6, ease: "power2.out" },
        4.15
      );

      tl.fromTo(
        "#pan-income",
        { y: 0 },
        { y: -16, duration: 0.6, ease: "power2.out" },
        4.15
      );

      tl.fromTo(
        "#pan-cost",
        { y: 0 },
        { y: 16, duration: 0.6, ease: "power2.out" },
        4.15
      );

      // Micro accent vibration on heavy cost pan
      tl.fromTo(
        "#pan-cost",
        { y: 16 },
        { y: 18, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" },
        4.85
      );

      window.__timelines["scene-s10"] = tl;
    </script>
  
    </template>
  </body>
</html>
