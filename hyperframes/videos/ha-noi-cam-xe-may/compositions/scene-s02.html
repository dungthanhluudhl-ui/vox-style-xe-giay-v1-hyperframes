    <script>
      const tl = gsap.timeline({ paused: true });

      clockHour.style.strokeDashoffset = hourLen;
      clockMin.style.strokeDasharray = minLen;
      clockMin.style.strokeDashoffset = minLen;

      // 1. Vào cảnh: Unfold video card + tape collage
      tl.fromTo(
        "#video-card",
        { transformPerspective: 1100, transformOrigin: "50% 0%", rotationX: -18, opacity: 0, scale: 0.95, y: -20 },
        { rotationX: 0, opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "power3.out" },
        0.05
      );

        "#video-card-shadow",
        { opacity: 0, scale: 0.95, y: -16 },
        { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "power3.out" },
        0.05
      );
      // Đưa góc xoay collage vào chính tween GSAP để tránh xung đột với CSS
      tl.fromTo(
        "#tape-tl",
        { scale: 0, opacity: 0, rotation: -6 },
        { scale: 1, opacity: 1, rotation: -6, duration: 0.4, ease: "power2.out" },
        0.3
      );

        "#tape-br",
        { scale: 0, opacity: 0, rotation: 4 },
        { scale: 1, opacity: 1, rotation: 4, duration: 0.4, ease: "power2.out" },
        0.38
      );

      // Header highlight cam dùng scaleX thay vì width layout property
      tl.fromTo(
        "#headline-hl",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.6, ease: "power2.out" },
        0.35
      );

      // Camera motion: pan-right trên video (0s - 8.0s)
      tl.fromTo(
        "#vid-05",
        { scale: 1.15, x: -30 },
        { scale: 1.15, x: 30, duration: 8.0, ease: "none" },
        0
      );

      // 2. Overlay 1: KHỞI ĐIỂM 2017 (atMs: 6500 -> 1.38s)
      tl.fromTo(
        "#badge-2017",
        { scale: 0, opacity: 0, y: 15 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.38
      );
      tl.to("#clock-rim", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 1.88);
      tl.to("#clock-hand-hour", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 2.1);
      tl.to("#clock-hand-min", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 2.25);

      // 3. Sơ đồ timeline vẽ đường cơ sở ban đầu (2017)
      tl.fromTo(
        "#timeline-card",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        2.1
      );
      tl.fromTo(
        "#tl-track-solid",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.6, ease: "power2.out" },
        2.3
      );
      tl.fromTo(
        "#node-2017",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        2.5
      );

      // 4. Overlay 2: LỘ TRÌNH LÙI DẦN (atMs: 9200 -> 4.08s)
      tl.fromTo(
        "#badge-delay",
        { scale: 0, opacity: 0, x: -20 },
        { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        4.08
      );
      tl.fromTo(
        "#tl-track-dashed",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.6, ease: "power2.out" },
        4.15
      );
      tl.fromTo(
        ["#node-2025", "#node-2030"],
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out", stagger: 0.18 },
        4.35
      );

      // 5. Punch-phrase: CẤM -> HẠN CHẾ (atMs: 10400 -> 5.28s)
      tl.fromTo(
        "#punch-card",
        { scale: 0.9, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        5.28
      );
      tl.fromTo(
        "#punch-strike",
        { scaleX: 0, rotation: -6 },
        { scaleX: 1, rotation: -6, duration: 0.35, ease: "power2.out" },
        5.7
      );
      tl.fromTo(
        "#punch-arrow",
        { x: -10, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        5.85
      );

      // 6. Freeze frame tại 8.0s + giảm nhẹ tương phản bằng dim overlay + trôi êm
      tl.to(
        "#video-dim",
        { opacity: 0.18, duration: 0.8, ease: "power2.out" },
        8.0
      );
      tl.fromTo(
        "#video-card",
        { y: 0, rotation: 0 },
        { y: -8, rotation: 0.4, duration: 3.8, ease: "sine.out" },
        8.0

      // 7. Overlay 3: THIẾU PHƯƠNG ÁN THAY (atMs: 14200 -> 9.08s)

        { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
