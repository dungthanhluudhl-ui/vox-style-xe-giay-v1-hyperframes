    <div

      <!-- Nền biến thể chart theo đúng style-tokens: 4 vạch ngang + tick cam -->

        <div class="chart-line" style="top: 20%;">

            muted

        <!-- Mũi tên chỉ đoàn tàu metro -->

              <circle class="density-path" cx="50" cy="24" r="14" stroke="#FF6A1A" stroke-width="4" />

    <script>
      // Khởi tạo đo đạc stroke dasharray cho icon density SVG
      const densityPaths = document.querySelectorAll(".density-path");
      densityPaths.forEach((path) => {
        const len = path.getTotalLength ? path.getTotalLength() : 88;
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
      });

      // Đăng ký đúng 1 paused timeline trên window.__timelines["scene-s03"]
      const tl = gsap.timeline({ paused: true });

      // 1. Toàn bộ Camera Motion: Zoom-out nhẹ xuyên suốt shot từ 1.06 về 1.00
      tl.fromTo(
        "#camera-rig",
        { scale: 1.06 },
        { scale: 1.0, duration: 7.68, ease: "none" },
        0
      );

      // 2. Transition in: Hiệu ứng grow của video container (từ 0.6 lên 1.0 kèm spring settle)
      tl.fromTo(
        "#video-wrap",
        { scale: 0.6, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.8, ease: "power3.out" },
        0.05
      );

      // 3. Top badge xuất hiện an toàn trong safeZone (y >= 160px)
      tl.fromTo(
        "#top-badge",
        { y: -10, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.3
      );

      // 4. Punch phrase card: "< 20% NHU CẦU" xuất hiện tại t = 2.28s (19200ms - 16920ms)
      tl.fromTo(
        "#punch-card",
        { scale: 0.72, opacity: 0, y: 35 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        2.28
      );

      // 5. Hiệu ứng đếm số từ 0 lên 20% và thanh tỷ lệ mở rộng từ 2.4s đến 3.25s
      const counterTarget = { val: 0 };
      const counterEl = document.getElementById("counter-val");

      tl.fromTo(
        counterTarget,
        { val: 0 },
        {
          val: 20,
          duration: 0.85,
          ease: "power2.out",
          onUpdate: function () {
            counterEl.textContent = Math.round(counterTarget.val);
          }
        },
        2.4
      );

      tl.fromTo(
        "#ratio-transit",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.85, ease: "power2.out" },
        2.4
      );

      // 6. Icon density vẽ nét tự động tại t = 2.58s (19500ms - 16920ms)
      tl.to("#density-icon-wrap", { opacity: 1, duration: 0.2 }, 2.58);
      tl.to(
        densityPaths,
        {
          strokeDashoffset: 0,
          duration: 0.6,
          stagger: 0.08,
          ease: "power2.out"
        },
        2.58
      );

      // 7. Mũi tên và Card label "DUY NHẤT 1 TUYẾN" tại t = 5.88s (22800ms - 16920ms)
      tl.fromTo(
        "#metro-pointer",
        { opacity: 0, y: 15 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        5.80
      );

      tl.fromTo(
        "#metro-card",
        { scale: 0.8, opacity: 0, y: 15 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        5.88
      );

      // Gắn timeline vào registry của HyperFrames
      window.__timelines["scene-s03"] = tl;
    </script>
