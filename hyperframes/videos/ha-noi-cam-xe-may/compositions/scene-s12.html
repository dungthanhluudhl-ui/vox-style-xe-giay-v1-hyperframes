<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #0b0f14;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }

      /* Canonical HyperFrames Clip container */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Media layers */
      .media-fill {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: center center;
        will-change: transform;
      }

      /* Persistent Brand Signature Bottom Bar */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background: #ff6a1a;
        z-index: 100;
      }

      /* Vox Grid Overlay (Z-index 3) */
      .vox-grid-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        background-size: 84px 84px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px);
        opacity: 0.4;
      }

      /* Spotlight vignette (Z-index 2) */
      .spotlight-vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        background: radial-gradient(
          circle at 50% 48%,
          transparent 30%,
          rgba(20, 20, 20, 0.45) 70%,
          rgba(10, 10, 10, 0.88) 100%
        );
      }

      /* SHOT 1: Pure Graphic Paper Shards (No text to avoid occlusion) */
      .shatter-layer {
        z-index: 10;
      }
      .paper-shard {
        position: absolute;
        will-change: transform, opacity;
      }
      #shard-geo-1 {
        top: 220px;
        left: -40px;
        width: 380px;
        height: 180px;
        background: #141414;
        border-left: 12px solid #ff6a1a;
        clip-path: polygon(0 0, 100% 15%, 85% 100%, 0% 90%);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }
      #shard-geo-2 {
        top: 360px;
        right: -30px;
        width: 400px;
        height: 200px;
        background: #ff6a1a;
        clip-path: polygon(15% 0, 100% 5%, 95% 95%, 0% 100%);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }
      #shard-geo-3 {
        top: 860px;
        left: -30px;
        width: 360px;
        height: 160px;
        background: #141414;
        border-right: 10px solid #f7f4ec;
        clip-path: polygon(5% 10%, 100% 0%, 90% 100%, 0% 85%);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }
      #shard-geo-4 {
        top: 1000px;
        right: -40px;
        width: 390px;
        height: 190px;
        background: #ff6a1a;
        clip-path: polygon(0% 0%, 95% 15%, 100% 100%, 10% 90%);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }

      /* UI Layers (Z-index 20, within Safe Zone: Top 160px - Bottom 391px) */
      .ui-layer {
        z-index: 20;
      }

      /* SHOT 1: Info Card (t=1.40s -> 3.85s) */
      #shot1-card {
        position: absolute;
        top: 220px;
        left: 60px;
        right: 60px;
        background: #141414;
        border-left: 12px solid #ff6a1a;
        border-radius: 18px;
        padding: 34px 38px;
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.65);
      }
      .card-tag {
        font-size: 20px;
        font-weight: 900;
        color: #ff6a1a;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 8px;
      }
      .card-headline {
        font-size: 58px;
        font-weight: 900;
        line-height: 1.15;
        color: #f7f4ec;
        margin: 0 0 20px 0;
        white-space: nowrap;
      }
      .metric-box {
        display: flex;
        align-items: center;
        gap: 20px;
        padding-top: 18px;
        border-top: 2px solid rgba(247, 244, 236, 0.16);
      }
      .metric-icon-wrap {
        width: 64px;
        height: 64px;
        background: rgba(255, 106, 26, 0.15);
        border: 2px solid #ff6a1a;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .metric-val {
        font-size: 28px;
        font-weight: 900;
        color: #ff6a1a;
        letter-spacing: 0.5px;
      }
      .metric-sub {
        font-size: 22px;
        font-weight: 700;
        color: #f7f4ec;
        opacity: 0.88;
        margin-top: 2px;
      }

      /* SHOT 2: Punch Phrase Card (t=3.98s -> 5.75s) */
      #shot2-punch {
        position: absolute;
        top: 260px;
        left: 60px;
        right: 60px;
        background: #141414;
        border-left: 12px solid #ff6a1a;
        border-radius: 18px;
        padding: 34px 42px;
        box-shadow: 0 28px 60px rgba(0, 0, 0, 0.7);
      }
      .punch-eyebrow {
        font-size: 22px;
        font-weight: 900;
        color: #ff6a1a;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 8px;
      }
      .punch-main {
        font-size: 70px;
        font-weight: 900;
        color: #f7f4ec;
        line-height: 1.15;
        letter-spacing: -0.5px;
        margin: 0;
      }

      /* SHOT 2: End Card (t=5.80s -> 7.20s) */
      #shot2-endcard {
        position: absolute;
        top: 580px;
        left: 80px;
        right: 80px;
        background: rgba(20, 20, 20, 0.95);
        border: 3px solid #ff6a1a;
        border-radius: 24px;
        padding: 44px 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        box-shadow: 0 32px 70px rgba(0, 0, 0, 0.8);
      }
      .question-icon-wrap {
        width: 90px;
        height: 116px;
        margin-bottom: 12px;
      }
      .endcard-title {
        font-size: 56px;
        font-weight: 900;
        color: #f7f4ec;
        margin: 0 0 10px 0;
        letter-spacing: -0.5px;
      }
      .endcard-sub {
        font-size: 32px;
        font-weight: 900;
        color: #ff6a1a;
        letter-spacing: 2px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s12"
      data-width="1080"
      data-height="1920"
      data-duration="7.2"
    >
      <!-- Media Layer: Shot 1 Video (0.0s -> 3.98s) -->
      <video
        id="vid-traffic"
        class="clip media-fill"
        muted
        playsinline
        data-start="0"
        data-duration="3.98"
        data-media-start="1.2"
        src="assets/vid-01-urban-traffic-paper-cutout.mp4"
      ></video>

      <!-- Media Layer: Shot 2 Image (3.98s -> 7.20s) -->
      <img
        id="img-traffic"
        class="clip media-fill"
        data-start="3.98"
        data-duration="3.22"
        src="assets/img-04-paper-cutout-traffic-jam.jpeg"
        alt="Congestion Gridlock"
      />

      <!-- Ambient Background Layers (Z-index 2 & 3) -->
      <div class="spotlight-vignette"></div>
      <div class="vox-grid-overlay"></div>

      <!-- Shatter Entrance Overlay: Paper Shard Fragments (0.0s -> 1.2s) -->
      <div id="shatter-layer" class="clip shatter-layer" data-start="0" data-duration="1.2">
        <div id="shard-geo-1" class="paper-shard"></div>
        <div id="shard-geo-2" class="paper-shard"></div>
        <div id="shard-geo-3" class="paper-shard"></div>
        <div id="shard-geo-4" class="paper-shard"></div>
      </div>

      <!-- Shot 1 Info Card: "LÀN SÓNG BỐN BÁNH" + Rise Icon (1.4s -> 3.85s) -->
      <div id="shot1-card-clip" class="clip ui-layer" data-start="1.4" data-duration="2.45">
        <div id="shot1-card">
          <div class="card-tag">QUY ĐỔI KHÔNG GIAN</div>
          <h1 class="card-headline">LÀN SÓNG BỐN BÁNH</h1>
          <div class="metric-box">
            <div class="metric-icon-wrap">
              <svg viewBox="0 0 60 60" width="44" height="44" fill="none">
                <rect id="rise-bar-1" x="10" y="36" width="8" height="16" fill="#FF6A1A" rx="2" />
                <rect id="rise-bar-2" x="23" y="24" width="8" height="28" fill="#FF6A1A" rx="2" />
                <rect id="rise-bar-3" x="36" y="12" width="8" height="40" fill="#FF6A1A" rx="2" />
                <path
                  id="rise-arrow-stem"
                  d="M 8 44 L 22 28 L 34 36 L 48 14"
                  stroke="#F7F4EC"
                  stroke-width="4.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  id="rise-arrow-head"
                  d="M 36 14 H 48 V 26"
                  stroke="#F7F4EC"
                  stroke-width="4.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <div>
              <div class="metric-val">+400% DIỆN TÍCH MẶT ĐƯỜNG</div>
              <div class="metric-sub">1 Ô tô chiếm chỗ bằng 4 xe máy</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Shot 2 Punch Phrase: "ÙN TẮC BỘI PHẦN" (3.98s -> 5.75s) -->
      <div id="shot2-punch-clip" class="clip ui-layer" data-start="3.98" data-duration="1.77">
        <div id="shot2-punch">
          <div class="punch-eyebrow">NGUY CƠ ĐẢO CHIỀU</div>
          <h2 class="punch-main">ÙN TẮC BỘI PHẦN</h2>
        </div>
      </div>

      <!-- Shot 2 End Card: "BÀI TOÁN BẾ TẮC" + Question Icon (5.80s -> 7.20s) -->
      <div id="shot2-endcard-clip" class="clip ui-layer" data-start="5.8" data-duration="1.4">
        <div id="shot2-endcard">
          <div class="question-icon-wrap">
            <svg viewBox="0 0 100 130" width="100%" height="100%" fill="none">
              <path
                id="question-stroke"
                d="M 28 38 C 28 14, 72 14, 72 42 C 72 60, 50 66, 50 86"
                stroke="#FF6A1A"
                stroke-width="11"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle id="question-dot" cx="50" cy="110" r="6.5" fill="#FF6A1A" />
            </svg>
          </div>
          <h3 class="endcard-title">BÀI TOÁN BẾ TẮC</h3>
          <span class="endcard-sub">THẾ NÊN...</span>
        </div>
      </div>

      <!-- Persistent Brand Bottom Bar -->
      <div id="brand-bottom-bar"></div>
    </div>

    <!-- GSAP Seekable Timeline Runtime -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // Measure SVG path dash lengths deterministically
      const riseStem = document.querySelector("#rise-arrow-stem");
      const riseHead = document.querySelector("#rise-arrow-head");
      if (riseStem) {
        const len = riseStem.getTotalLength();
        riseStem.style.strokeDasharray = len;
        riseStem.style.strokeDashoffset = len;
      }
      if (riseHead) {
        const len = riseHead.getTotalLength();
        riseHead.style.strokeDasharray = len;
        riseHead.style.strokeDashoffset = len;
      }

      const questionStroke = document.querySelector("#question-stroke");
      if (questionStroke) {
        const len = questionStroke.getTotalLength();
        questionStroke.style.strokeDasharray = len;
        questionStroke.style.strokeDashoffset = len;
      }

      // ==========================================
      // ANIMATION SEQUENCING: SHOT 1 (0.0s -> 3.98s)
      // ==========================================

      // 1. Camera Zoom In on Urban Traffic Video
      tl.fromTo(
        "#vid-traffic",
        { scale: 1.25, y: 0 },
        { scale: 1.48, y: -30, duration: 3.98, ease: "none" },
        0
      );

      // 2. Shatter Entrance Shards (0.0s -> 1.1s)
      tl.fromTo(
        "#shard-geo-1",
        { x: -500, y: -260, rotation: -32, opacity: 0 },
        { x: 0, y: 0, rotation: -6, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.04
      );
      tl.fromTo(
        "#shard-geo-2",
        { x: 500, y: -200, rotation: 28, opacity: 0 },
        { x: 0, y: 0, rotation: 4, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.1
      );
      tl.fromTo(
        "#shard-geo-3",
        { x: -450, y: 320, rotation: 24, opacity: 0 },
        { x: 0, y: 0, rotation: -3, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.16
      );
      tl.fromTo(
        "#shard-geo-4",
        { x: 480, y: 280, rotation: -26, opacity: 0 },
        { x: 0, y: 0, rotation: 5, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.22
      );

      // Shards scatter out to clear viewport for video and info card
      tl.to(
        ".paper-shard",
        { scale: 1.25, opacity: 0, duration: 0.4, ease: "power2.in" },
        0.75
      );

      // 3. Info Card Entrance (1.45s)
      tl.fromTo(
        "#shot1-card",
        { y: 45, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.48, ease: "power3.out" },
        1.45
      );

      // 4. Rise Icon Bars & Arrow
      tl.fromTo(
        "#rise-bar-1",
        { scaleY: 0, transformOrigin: "bottom" },
        { scaleY: 1, duration: 0.25, ease: "power2.out" },
        1.9
      );
      tl.fromTo(
        "#rise-bar-2",
        { scaleY: 0, transformOrigin: "bottom" },
        { scaleY: 1, duration: 0.25, ease: "power2.out" },
        2.02
      );
      tl.fromTo(
        "#rise-bar-3",
        { scaleY: 0, transformOrigin: "bottom" },
        { scaleY: 1, duration: 0.25, ease: "power2.out" },
        2.14
      );
      tl.to("#rise-arrow-stem", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 2.1);
      tl.to("#rise-arrow-head", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 2.45);

      // Card exit before shot cut
      tl.to("#shot1-card", { y: -25, opacity: 0, duration: 0.3, ease: "power2.in" }, 3.5);

      // ==========================================
      // ANIMATION SEQUENCING: SHOT 2 (3.98s -> 7.20s)
      // ==========================================

      // 1. Camera Zoom Out on Congestion Still
      tl.fromTo(
        "#img-traffic",
        { scale: 1.38, y: 15 },
        { scale: 1.18, y: -15, duration: 3.22, ease: "sine.out" },
        3.98
      );

      // 2. Punch-phrase Entrance: "ÙN TẮC BỘI PHẦN" (4.15s)
      tl.fromTo(
        "#shot2-punch",
        { y: 35, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        4.15
      );

      // Punch phrase exits before End Card arrives
      tl.to("#shot2-punch", { y: -20, opacity: 0, duration: 0.3, ease: "power2.in" }, 5.42);

      // 3. End Card Arrival: "BÀI TOÁN BẾ TẮC" (5.85s)
      tl.fromTo(
        "#shot2-endcard",
        { y: 35, scale: 0.9, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        5.85
      );

      // 4. Hand-drawn Question Icon Stroke (6.05s)
      tl.to(
        "#question-stroke",
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        6.05
      );
      tl.fromTo(
        "#question-dot",
        { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(1.7)" },
        6.58
      );

      // Register timeline into HyperFrames runtime
      window.__timelines["scene-s12"] = tl;
    </script>
  
    </template>
  </body>
</html>
