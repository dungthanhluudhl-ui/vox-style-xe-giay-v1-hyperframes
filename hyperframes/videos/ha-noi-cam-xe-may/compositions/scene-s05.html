<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* Nền ô vuông 84px chuẩn Vox style */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        background-position: 0 0;
        z-index: 1;
      }

      /* Dải cam cố định ở mép đáy */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }

      /* Khung ảnh collage / cutout */
      .media-frame {
        position: absolute;
        top: 220px;
        left: 60px;
        width: 960px;
        height: 1060px;
        background-color: #F5F0E4;
        border: 4px solid #141414;
        box-shadow: 16px 16px 0px rgba(20, 20, 20, 0.95);
        overflow: hidden;
        border-radius: 6px;
        z-index: 10;
        transform-origin: 50% 100%;
      }

      .media-inner {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
        transform-origin: 50% 50%;
      }

      /* Annotation: Rào cản hạ tầng */
      .annotation-wrap {
        position: absolute;
        top: 260px;
        left: 100px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        z-index: 25;
        pointer-events: none;
      }

      .annotation-badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background-color: #141414;
        border: 2px solid #FF6A1A;
        padding: 10px 20px;
        border-radius: 8px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
      }

      .annotation-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background-color: #FF6A1A;
      }

      .annotation-text {
        font-size: 26px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .annotation-line {
        margin-top: -2px;
        margin-left: 24px;
        display: block;
      }

      /* Warning Overlay */
      .warning-wrap {
        position: absolute;
        top: 410px;
        right: 90px;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        background-color: #F5F0E4;
        border: 3px solid #141414;
        padding: 12px 22px;
        border-radius: 8px;
        box-shadow: 8px 8px 0px #141414;
        z-index: 25;
      }

      .warning-label {
        font-size: 26px;
        font-weight: 900;
        color: #141414;
        letter-spacing: 0.02em;
      }

      /* Punch Phrase: NGÕ SÂU HẸP HÒI */
      .punch-card {
        position: absolute;
        top: 1340px;
        left: 60px;
        width: 960px;
        height: 130px;
        background-color: #141414;
        border: 3px solid rgba(255, 106, 26, 0.45);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
        z-index: 30;
      }

      .punch-text {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }

      .punch-accent {
        font-size: 64px;
        font-weight: 900;
        color: #FF6A1A;
        letter-spacing: -0.01em;
      }

      .punch-rest {
        font-size: 64px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: -0.01em;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s05"
      data-start="0"
      data-duration="6.2"
      data-width="1080"
      data-height="1920"
    >
      <section id="scene-s05" class="clip" data-start="0" data-duration="6.2">
        <!-- Nền ô vuông đặc trưng Vox -->
        <div class="bg-grid"></div>

        <!-- Khung ảnh con ngõ nhỏ -->
        <div id="media-frame" class="media-frame">
          <div class="media-inner">
            <img
              id="hero-img"
              src="assets/img-01-vietnam-narrow-alley-papercut.jpeg"
              alt="Con ngõ nhỏ chật chội tại Hà Nội"
            />
          </div>
        </div>

        <!-- Annotation nhãn chỉ vị trí rào cản -->
        <div id="annotation-group" class="annotation-wrap">
          <div class="annotation-badge">
            <div class="annotation-dot"></div>
            <span class="annotation-text">RÀO CẢN HẠ TẦNG</span>
          </div>
          <svg class="annotation-line" width="160" height="90" viewBox="0 0 160 90">
            <path
              id="annotation-line-path"
              d="M 12 6 L 90 70 L 150 70"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="12" cy="6" r="6" fill="#FF6A1A" />
          </svg>
        </div>

        <!-- Biểu tượng cảnh báo ngõ chật hẹp -->
        <div id="warning-group" class="warning-wrap">
          <svg class="warning-svg" width="44" height="44" viewBox="0 0 44 44" fill="none">
            <polygon points="22,4 40,38 4,38" fill="#FF6A1A" stroke="#141414" stroke-width="3" stroke-linejoin="round" />
            <line x1="22" y1="16" x2="22" y2="26" stroke="#141414" stroke-width="4" stroke-linecap="round" />
            <circle cx="22" cy="32" r="2.5" fill="#141414" />
          </svg>
          <span class="warning-label">CỰC KỲ CHẬT HẸP</span>
        </div>

        <!-- Punch phrase điểm nhấn thị giác -->
        <div id="punch-group" class="punch-card">
          <div class="punch-text" data-layout-allow-overlap>
            <span class="punch-accent">NGÕ SÂU</span>
            <span class="punch-rest">HẸP HÒI</span>
          </div>
        </div>

        <!-- Dải cam đáy thương hiệu cố định -->
        <div class="bottom-brand-bar"></div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Setup đường path SVG annotation
      const pathEl = document.getElementById("annotation-line-path");
      if (pathEl) {
        const pathLen = pathEl.getTotalLength ? pathEl.getTotalLength() : 180;
        pathEl.style.strokeDasharray = `${pathLen}`;
        pathEl.style.strokeDashoffset = `${pathLen}`;
      }

      // 1. Transition in dạng 'rise' cho khung ảnh con ngõ (0.0s -> 0.8s)
      tl.fromTo(
        "#media-frame",
        { y: 160, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
        0.05
      );

      // 2. Camera motion 'pan-right' quét chậm không gian con ngõ (0.0s -> 6.2s)
      tl.fromTo(
        "#hero-img",
        { scale: 1.36, x: -35 },
        { scale: 1.44, x: 25, duration: 6.1, ease: "sine.inOut" },
        0
      );

      // 3. Overlay 1: Nhãn 'RÀO CẢN HẠ TẦNG' xuất hiện lúc 2.28s
      tl.fromTo(
        "#annotation-group",
        { opacity: 0, y: 30, scale: 0.92 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
        2.28
      );
      if (pathEl) {
        const pathLen = pathEl.getTotalLength ? pathEl.getTotalLength() : 180;
        tl.fromTo(
          "#annotation-line-path",
          { strokeDashoffset: pathLen },
          { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
          2.4
        );
      }

      // 4. Overlay 2: Biểu tượng cảnh báo xuất hiện lúc 3.28s
      tl.fromTo(
        "#warning-group",
        { opacity: 0, scale: 0.6, rotation: -6 },
        { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(1.6)" },
        3.28
      );

      // 5. Overlay 3: Punch phrase 'NGÕ SÂU HẸP HÒI' xuất hiện lúc 4.58s
      tl.fromTo(
        "#punch-group",
        { opacity: 0, y: 40, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" },
        4.58
      );

      // Đăng ký timeline cho HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s05"] = tl;
      tl.seek(0);
    </script>
  
    </template>
  </body>
</html>
