    <script>
      // Setup progressive SVG path draws
      const surgePath = document.getElementById("surge-path");
      if (surgePath) {
        const len = surgePath.getTotalLength();
        surgePath.style.strokeDasharray = len;
        surgePath.style.strokeDashoffset = len;
      }
      const arrowPath = document.getElementById("arrow-path");

        checkPath.style.strokeDasharray = len;
        checkPath.style.strokeDashoffset = len;
      }

      // Master paused timeline
      const tl = gsap.timeline({ paused: true });

      // 0.00s - 6.11s: Ken Burns vertical pan & zoom
      tl.fromTo(
        "#photo-hero",
        { scale: 1.10, y: -60 },
        { scale: 1.24, y: 50, duration: 6.11, ease: "none" },
        0

        1.08

      // 2.57s: Connector surge line & rise arrow draw

        "#surge-path",
        { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
        2.57

      tl.to(
        "#arrow-path",
        { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" },
        2.75
      );

        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        2.80

      tl.fromTo(
        "#multiplier-pill",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        3.02
      );

      // 3.41s: Badge 3 - Bao bì sang trọng
      tl.fromTo(
        "#badge-packaging",

        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },

        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        4.57
      );

      window.__timelines["scene-s35"] = tl;
