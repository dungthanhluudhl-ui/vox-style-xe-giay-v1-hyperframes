<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #e7e3d9;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      /* Nền lưới giấy ngà chuẩn Vox */
      #bg-grid {
        position: absolute;
        inset: 0;
        background-color: #e7e3d9;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        z-index: 1;
      }
      /* Thanh cam nhận diện cố định đáy khung hình */
      #bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 100;
      }

      /* Shot 1: Video container (không mang data-start để tuân thủ quy tắc lồng video) */
      #video-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 2;
        transform-origin: 50% 30%;
      }
      #shot1-video {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 20%;
      }

      /* Thẻ plate thông tin Shot 1 */
      #shot1-overlay {
        z-index: 10;
        pointer-events: none;
      }
      .plate-card {
        position: absolute;
        top: 240px;
        left: 80px;
        width: 920px;
        background-color: #141414;
        padding: 34px 38px;
        border-left: 10px solid #ff6a1a;
        box-shadow: 14px 14px 0px rgba(20, 20, 20, 0.45);
      }
      .plate-tag {
        display: inline-block;
        background-color: #ff6a1a;
        color: #141414;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 2px;
        padding: 6px 14px;
        margin-bottom: 14px;
        text-transform: uppercase;
      }
      .plate-title {
        font-size: 58px;
        font-weight: 900;
        line-height: 1.18;
        color: #f7f4ec;
        text-transform: uppercase;
        margin: 0 0 10px 0;
      }
      .plate-sub {
        font-size: 24px;
        font-weight: 700;
        color: #ff6a1a;
        letter-spacing: 1px;
      }

      /* Shot 2: Cảnh minh họa hạ tầng */
      #shot2-scene {
        z-index: 5;
      }
      #shot2-img-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #shot2-img {
        position: absolute;
        width: 116%;
        height: 116%;
        top: -12%;
        left: -8%;
        object-fit: cover;
        display: block;
      }

      /* Shot 2 Punch card overlay */
      #shot2-overlay {
        z-index: 20;
        pointer-events: none;
      }
      .punch-card {
        position: absolute;
        top: 220px;
        left: 80px;
        width: 920px;
        background-color: #141414;
        padding: 34px 38px;
        border-left: 10px solid #ff6a1a;
        box-shadow: 14px 14px 0px rgba(20, 20, 20, 0.45);
        transform-origin: 50% 50%;
      }
      .punch-tag {
        display: inline-block;
        background-color: #ff6a1a;
        color: #141414;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 2px;
        padding: 6px 14px;
        margin-bottom: 14px;
        text-transform: uppercase;
      }
      .punch-title {
        font-size: 70px;
        font-weight: 900;
        line-height: 1.14;
        color: #f7f4ec;
        text-transform: uppercase;
        margin: 0 0 22px 0;
      }
      .flow-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .flow-item {
        display: inline-flex;
        align-items: center;
        transform-origin: 50% 50%;
      }
      .flow-pill {
        display: inline-block;
        background-color: #e7e3d9;
        color: #141414;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 1px;
        padding: 8px 18px;
        box-shadow: 4px 4px 0px #ff6a1a;
      }
      .flow-arrow {
        font-size: 26px;
        font-weight: 900;
        color: #ff6a1a;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s48"
      data-width="1080"
      data-height="1920"
      data-duration="5.69"
    >
      <!-- Nền lưới giấy -->
      <div id="bg-grid"></div>

      <!-- Shot 1: Video vay nợ (được đặt trong wrapper không có data-start) -->
      <div id="video-wrapper">
        <video
          id="shot1-video"
          src="assets/vid-05-paper-cutout-public-debt-loan.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="2.99"
          data-media-start="0"
        ></video>
      </div>

      <!-- Shot 1: Nhãn thông tin nguồn vốn -->
      <section id="shot1-overlay" class="clip" data-start="0.68" data-duration="1.8">
        <div class="plate-card" id="shot1-badge">
          <div class="plate-tag">QUỐC TẾ • LOAN</div>
          <div class="plate-title">VAY VỐN RỪNG NGOÀI</div>
          <div class="plate-sub">NGUỒN LỰC TÀI CHÍNH MỚI</div>
        </div>
      </section>

      <!-- Shot 2: Hoạt cảnh hạ tầng công trường (từ 2.99s đến hết) -->
      <section id="shot2-scene" class="clip" data-start="2.99" data-duration="2.7">
        <div id="shot2-img-wrap">
          <img
            id="shot2-img"
            src="assets/img-20-public-debt-infrastructure-loan-cutout.jpeg"
            alt="Công trường xây dựng hạ tầng"
          />
        </div>
      </section>

      <!-- Shot 2: Punch phrase và flow đầu tư hạ tầng -->
      <section id="shot2-overlay" class="clip" data-start="3.46" data-duration="2.2">
        <div class="punch-card" id="shot2-punch">
          <div class="punch-tag">GIẢI NGÂN THỰC TẾ</div>
          <h1 class="punch-title">ĐẦU TƯ HẠ TẦNG</h1>
          <div class="flow-row">
            <div class="flow-item">
              <span class="flow-pill">CẦU ĐƯỜNG</span>
            </div>
            <div class="flow-item">
              <span class="flow-arrow">→</span>
            </div>
            <div class="flow-item">
              <span class="flow-pill">TRƯỜNG HỌC</span>
            </div>
            <div class="flow-item">
              <span class="flow-arrow">→</span>
            </div>
            <div class="flow-item">
              <span class="flow-pill">NHÀ MÁY</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Thanh thương hiệu màu cam dưới đáy -->
      <div id="bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Shot 1: Camera zoom-in nhẹ và unfold vào video
      tl.fromTo(
        "#video-wrapper",
        { scale: 0.94, opacity: 0 },
        { scale: 1.06, opacity: 1, duration: 2.99, ease: "power1.out" },
        0
      );

      // Shot 1 Overlay: Xuất hiện tại 0.68s và trượt ra trước khi hết shot
      tl.fromTo(
        "#shot1-badge",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.68
      );
      tl.to(
        "#shot1-badge",
        { x: -20, opacity: 0, duration: 0.3, ease: "power2.in" },
        2.18
      );

      // Shot 2: Pan camera xuống và sang phải trên tranh công trường
      tl.fromTo(
        "#shot2-img",
        { y: -70, x: 0, scale: 1.0 },
        { y: 30, x: -40, scale: 1.05, duration: 2.7, ease: "none" },
        2.99
      );

      // Shot 2 Overlay: Punch phrase đáp xuống dứt khoát (power3.out)
      tl.fromTo(
        "#shot2-punch",
        { scale: 0.88, y: 35, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        3.46
      );

      // Flow items: Xuất hiện lần lượt theo thứ tự chuỗi nhân quả
      tl.fromTo(
        ".flow-item",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, stagger: 0.08, ease: "power3.out" },
        3.75
      );

      // Thu nhẹ punch card ở cuối cảnh
      tl.to(
        "#shot2-punch",
        { opacity: 0, y: -15, duration: 0.28, ease: "power2.in" },
        5.38
      );

      // Đăng ký timeline cho HyperFrames seek
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s48"] = tl;
    </script>
  
    </template>
  </body>
</html>
