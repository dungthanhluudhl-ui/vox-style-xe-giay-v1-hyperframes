<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (đạt chuẩn WCAG từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Root composition */
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      /* Base clip layout - chuẩn HyperFrames inset:0 */
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Background Photo: Nền toàn khung cho ảnh AI Flow, giữ nguyên màu gốc 100% */
      .shot-bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 1;
      }

      .full-bleed-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: 50% 50%;
      }

      /* Thanh cam nhận diện thương hiệu cố định mép dưới khung hình */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 16px;
        background-color: #FF6A1A;
        z-index: 100;
        pointer-events: none;
      }

      /* Dossier Tag trên cùng (Safe Zone Top Y: 175px) */
      .dossier-tag {
        position: absolute;
        top: 175px;
        left: 60px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 8px 18px;
        border-radius: 6px;
        border: 2px solid #141414;
        box-shadow: 4px 4px 0 #141414;
        z-index: 30;
      }
      .tag-status {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1.5px;
        padding: 3px 8px;
        border-radius: 4px;
      }
      .tag-divider {
        color: #FF6A1A;
        font-weight: 900;
      }
      .tag-title {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0.5px;
      }

      /* Tem đóng dấu kiểm định (Stamp badge) trên nền tấm đặc */
      .stamp-badge {
        position: absolute;
        top: 250px;
        right: 60px;
        padding: 10px 18px;
        border: 4px solid #FF6A1A;
        border-radius: 8px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        box-shadow: 6px 6px 0 #141414;
        z-index: 25;
        transform-origin: 50% 50%;
      }

      /* Shot 1: Card cảnh báo Dự án ma (Tấm nền đặc bảo đảm tương phản WCAG) */
      .overlay-warning-card {
        position: absolute;
        top: 1050px;
        left: 60px;
        width: 960px;
        border-radius: 8px;
        border: 4px solid #141414;
        border-left: 14px solid #FF6A1A;
        padding: 24px 32px;
        box-shadow: 8px 10px 0 #141414;
        z-index: 40;
      }
      .warning-badge-pill {
        display: inline-block;
        padding: 6px 14px;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1px;
        border-radius: 4px;
        margin-bottom: 12px;
      }
      .overlay-headline {
        font-size: 52px;
        font-weight: 900;
        line-height: 1.2;
        margin: 0 0 8px 0;
        letter-spacing: 0.5px;
      }
      .overlay-subline {
        font-size: 24px;
        font-weight: 700;
        color: #E7E3D9;
        margin: 0;
        letter-spacing: 1px;
      }

      /* Shot 2: Card mồi nhử đầu tư (Lãi suất 1%/ngày -> 365%/năm, khớp chuẩn toán học) */
      .calc-flow-card {
        position: absolute;
        top: 960px;
        left: 60px;
        width: 960px;
        border: 5px solid #141414;
        border-radius: 8px;
        padding: 20px 28px;
        box-shadow: 8px 8px 0 #141414;
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 35;
      }
      .flow-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .flow-label {
        font-size: 18px;
        font-weight: 900;
        color: #141414;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .flow-val {
        font-size: 38px;
        font-weight: 900;
        line-height: 1;
        color: #141414;
      }
      .flow-arrow {
        font-size: 44px;
        font-weight: 900;
        color: #141414;
      }
      .flow-badge-reward {
        padding: 10px 18px;
        border-radius: 6px;
        border: 3px solid #141414;
      }
      .flow-payback-tag {
        padding: 10px 18px;
        border-radius: 6px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0.5px;
        border: 2px solid #141414;
      }

      /* Shot 2: Punch-phrase Container (Đỉnh cao của mô hình lừa đảo: LÃI SUẤT 365%/NĂM) */
      .punch-container {
        position: absolute;
        top: 1140px;
        left: 60px;
        width: 960px;
        border: 6px solid #141414;
        border-radius: 8px;
        padding: 26px 20px;
        text-align: center;
        box-shadow: 12px 14px 0 #141414;
        z-index: 45;
        transform-origin: 50% 50%;
      }
      .punch-title {
        margin: 0;
        font-size: 68px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.5px;
      }
      .punch-sub-plate {
        display: inline-block;
        margin-top: 14px;
        padding: 8px 24px;
        border-radius: 4px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
    </style>

    <!-- Standalone composition root: duration 9.9s (361700ms -> 371600ms) -->
    <div
      id="root"
      data-composition-id="scene-s40"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="9.9"
    >
      <!-- Thanh cam đáy nhận diện thương hiệu -->
      <div class="bottom-brand-bar"></div>

      <!-- ==========================================
           SHOT 1: S40-1 (0.0s -> 4.8s)
           Chủ đề: Nhà máy ma hoang vắng, bình phong tài chính
           Visual Language: background-photo toàn khung
           ========================================== -->
      <section id="shot-1" class="clip" data-start="0" data-duration="4.8">
        <!-- Nền toàn khung giữ nguyên màu gốc ảnh AI Flow (không vignette/filter) -->
        <div class="shot-bg">
          <img
            id="s1-img"
            class="full-bleed-img"
            src="assets/img-10-ponzi-scheme-seminar-scam.jpeg"
            alt="Dự án nhà máy ma"
            data-layout-allow-overflow="true"
          />
        </div>

        <!-- Tag chủ đề -->
        <div id="s1-top-badge" class="dossier-tag hf-plate-ink">
          <span class="tag-status hf-hl-orange">MÔ HÌNH #04</span>
          <span class="tag-divider">|</span>
          <span class="tag-title">DỰ ÁN BÁNH VẼ</span>
        </div>

        <!-- Con dấu cảnh báo trạng thái -->
        <div id="s1-stamp" class="stamp-badge hf-plate-ink-orange">
          ⚠ KHÔNG HOẠT ĐỘNG
        </div>

        <!-- Overlay Label: DỰ ÁN MA HOANG VẮNG (Xuất hiện lúc 3.56s) -->
        <div id="s1-overlay" class="overlay-warning-card hf-plate-ink">
          <div class="warning-badge-pill hf-hl-orange">CẢNH BÁO RỦI RO</div>
          <h2 class="overlay-headline hf-text-light">DỰ ÁN MA HOANG VẮNG</h2>
          <p class="overlay-subline">NHÀ MÁY BỎ KHÔNG • BÌNH PHONG TÀI CHÍNH</p>
        </div>
      </section>

      <!-- ==========================================
           SHOT 2: S40-2 (4.8s -> 9.9s)
           Chủ đề: Lãi suất 365%/năm - Chiêu trò mồi nhử Ponzi
           Visual Language: background-photo toàn khung + data overlay
           ========================================== -->
      <section id="shot-2" class="clip" data-start="4.8" data-duration="5.1">
        <!-- Nền toàn khung giữ nguyên màu gốc ảnh AI Flow (không vignette/filter) -->
        <div class="shot-bg">
          <img
            id="s2-img"
            class="full-bleed-img"
            src="assets/img-10-ponzi-scheme-seminar-scam.jpeg"
            alt="Hội thảo chào mời vốn"
            data-layout-allow-overflow="true"
          />
        </div>

        <!-- Tag chủ đề -->
        <div id="s2-top-badge" class="dossier-tag hf-plate-ink">
          <span class="tag-status hf-hl-orange">CHIÊU MỒI NHỬ</span>
          <span class="tag-divider">|</span>
          <span class="tag-title">HUY ĐỘNG VỐN ĐA CẤP</span>
        </div>

        <!-- Card mồi nhử: Lãi 1%/ngày -> Quy đổi 365%/năm (chuẩn xác 100% về mặt toán học, thống nhất với số liệu chính) -->
        <div id="s2-calc-card" class="calc-flow-card hf-plate-paper">
          <div class="flow-item">
            <span class="flow-label">MỒI NHỬ ĐẦU TƯ</span>
            <span class="flow-val">LÃI 1% / NGÀY</span>
          </div>

          <span class="flow-arrow">➔</span>

          <div class="flow-badge-reward hf-hl-orange">
            <span class="flow-label">CAM KẾT LÃI</span>
            <div class="flow-val">365% / NĂM</div>
          </div>

          <div class="flow-payback-tag hf-plate-ink">
            TRẢ LÃI MỖI NGÀY
          </div>
        </div>

        <!-- Punch-phrase khổng lồ: LÃI SUẤT 365%/NĂM (Xuất hiện lúc 7.56s) -->
        <div id="s2-punch-card" class="punch-container hf-hl-orange">
          <h1 class="punch-title hf-text-ink">LÃI SUẤT 365%/NĂM</h1>
          <div id="s2-punch-sub" class="punch-sub-plate hf-plate-ink">
            BÁNH VẼ LỢI NHUẬN PHI THỰC TẾ
          </div>
        </div>
      </section>
    </div>

    <!-- Animation Runtime: Đăng ký duy nhất 1 GSAP timeline paused tại window.__timelines["scene-s40"] -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // ---------------------------------------------
      // SHOT 1 CHOREOGRAPHY (0.0s - 4.8s)
      // ---------------------------------------------
      // Entrance: Transition Punch mạnh mẽ của shot 1
      tl.fromTo(
        "#s1-img",
        { scale: 1.12, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.0
      );

      // Top badge trượt nhẹ từ trên xuống
      tl.fromTo(
        "#s1-top-badge",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
        0.15
      );

      // Camera motion: zoom-in chậm xuyên suốt Shot 1
      tl.to(
        "#s1-img",
        { scale: 1.15, duration: 4.3, ease: "none" },
        0.5
      );

      // Đóng dấu kiểm định "KHÔNG HOẠT ĐỘNG"
      tl.fromTo(
        "#s1-stamp",
        { scale: 0, rotation: -18, opacity: 0 },
        { scale: 1, rotation: -6, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.75
      );

      // Overlay Shot 1: DỰ ÁN MA HOANG VẮNG xuất hiện chính xác tại 3.56s (atMs: 365260)
      tl.fromTo(
        "#s1-overlay",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        3.56
      );

      // ---------------------------------------------
      // SHOT 2 CHOREOGRAPHY (4.8s - 9.9s)
      // ---------------------------------------------
      // Chuyển cảnh: Cut dứt khoát tại 4.8s
      tl.fromTo(
        "#s2-top-badge",
        { y: -25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
        4.85
      );

      // Camera motion: Pan ngang từ trái sang phải, mở rộng góc nhìn đám đông
      tl.fromTo(
        "#s2-img",
        { scale: 1.15, x: -60 },
        { scale: 1.25, x: 40, duration: 5.1, ease: "none" },
        4.8
      );

      // Card mồi nhử đầu tư (5.2s)
      tl.fromTo(
        "#s2-calc-card",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        5.2
      );

      // Punch-phrase khổng lồ: LÃI SUẤT 365%/NĂM tại 7.56s (atMs: 369260)
      tl.fromTo(
        "#s2-punch-card",
        { scale: 0.9, opacity: 0, y: 30 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        7.56
      );

      // Dải phụ chú "BÁNH VẼ LỢI NHUẬN PHI THỰC TẾ"
      tl.fromTo(
        "#s2-punch-sub",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
        7.8
      );

      // Đăng ký timeline vào HyperFrames runtime
      window.__timelines["scene-s40"] = tl;
    </script>
  
    </template>
  </body>
</html>
