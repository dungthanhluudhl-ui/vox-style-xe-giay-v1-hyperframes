        --grid-line: rgba(20, 20, 20, 0.32);
        --on-dark: #f7f4ec;
      }
      * {

      }
      html,

        padding: 0;

        height: 1920px;
        background-color: var(--bg-paper);
        color: var(--ink);

        overflow: hidden;

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .grid-bg {
        position: absolute;
        inset: 0;

        background-image:

          linear-gradient(90deg, var(--grid-line) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        background-position: -1.5px -1.5px;
        z-index: 1;
      }
      .grain-overlay {
        position: absolute;
        inset: 0;
        filter: url(#grain-filter);
        opacity: 0.18;

        z-index: 2;

        left: 90px;

      .tape-tr {

        right: 90px;

        display: grid;

        font-weight: 900;
        letter-spacing: 1.2px;

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "#peel-sheet",

          rotation: -22,
