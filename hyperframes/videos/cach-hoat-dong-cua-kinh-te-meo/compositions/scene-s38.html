    <!-- GSAP Seekable Timeline Runtime -->
    <script>
      // Thiết lập nét vẽ SVG tự động bằng getTotalLength chuẩn
      document.querySelectorAll(".draw-stroke").forEach((path) => {
        let len = 200;
        try {
          if (typeof path.getTotalLength === "function") {
            len = Math.ceil(path.getTotalLength());
          }
        } catch (e) {
          len = 200;
        }
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
      });

      // Tạo timeline chính duy nhất và đăng ký paused
      const tl = gsap.timeline({ paused: true });

      // 0s: Transition In "flip" mở sân khấu 3D

        "#scene-stage",
        { rotationY: -14, scale: 0.94, opacity: 0 },
        { rotationY: 0, scale: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
        0
      );

      // Camera pan-right mượt mà suốt thời lượng video
      tl.fromTo(
        "#bg-video",
        { scale: 1.08, x: 30 },
        { scale: 1.08, x: -30, duration: 8.95, ease: "none" },
        0
      );

      // BEAT 1 (data-start="1.2", duration="3.0"): Card 1 & Icon Money xuất hiện

        "#card-beat-1",
        { scale: 0.88, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.32
      );
      tl.to("#coin-circle", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 1.4);
      tl.to("#fish-body", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.6);
      tl.to("#fish-tail", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 1.8);

      // 2.55s: Nhấn mạnh tiêu đề Góp Cá Mua Cổ Phần
      tl.to(
        "#card-1-heading",
        { scale: 1.05, duration: 0.18, ease: "power2.out" },
        2.55
      );
      tl.to(
        "#card-1-heading",
        { scale: 1.0, duration: 0.18, ease: "power2.in" },
        2.73
      );

      // 3.90s: Card 1 thu lại trước khi clip 1 kết thúc ở 4.2s
      tl.to(
        "#card-beat-1",
        { opacity: 0, y: -20, scale: 0.96, duration: 0.25, ease: "power2.in" },
        3.9
      );

      // BEAT 2 (data-start="4.2", duration="2.0"): PUNCH PHRASE "CÔNG TY CỔ PHẦN" & Diagram Pie Shares
      tl.fromTo(
        "#card-beat-2",
        { scale: 0.88, opacity: 0, y: 32 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        4.35
      );
      tl.fromTo(
        "#pie-slice-1",
        { scale: 0.5, opacity: 0, transformOrigin: "74px 66px" },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        4.5
      );
      tl.fromTo(
        "#pie-slice-2",
        { scale: 0.5, opacity: 0, transformOrigin: "68px 72px" },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        4.6
      );
      tl.fromTo(
        "#pie-slice-3",
        { scale: 0.5, opacity: 0, transformOrigin: "68px 68px" },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        4.7
      );

      // 5.95s: Card 2 exit trước khi clip 2 kết thúc ở 6.2s
      tl.to(
        "#card-beat-2",
        { opacity: 0, y: -18, scale: 0.96, duration: 0.2, ease: "power2.in" },

      // BEAT 3 (data-start="6.2", duration="2.75"): Card 3 & Chứng chỉ cổ đông
