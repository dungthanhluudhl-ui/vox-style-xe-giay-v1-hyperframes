    <script>
      const tl = gsap.timeline({ paused: true });

      const fallHead = document.getElementById("fall-arrow-head");

      let headLen = 20;
      if (fallPath) {
        pathLen = fallPath.getTotalLength();

        fallPath.style.strokeDashoffset = pathLen;

      if (fallHead) {
        headLen = fallHead.getTotalLength();

        fallHead.style.strokeDashoffset = headLen;

      // 0.0s - 0.5s: Scene Transition In (Fade & settle)
      tl.fromTo(
        "#camera-rig",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power2.out" },
        0
      );

      // 0.0s - 7.98s: Camera Motion (Pan-right across full duration)
      tl.fromTo(
        "#camera-rig",
        { x: -28, scale: 1.06 },
        { x: 28, scale: 1.06, duration: 7.98, ease: "none" },
        0
      );

      // --- BEAT 1: Crowd & Unemployed ---
      // atMs 401220 (0.47s), holdMs 2400 (to 2.87s)

        "#callout-crowd",
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.47

      tl.fromTo(
        "#crowd-icon-box",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.47
      );

      // Label atMs 401700 (0.95s), holdMs 2200 (to 3.15s)

        { x: -20, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.95
      );

      // Crowd icon fade out at 2.87s
      tl.to(
        "#crowd-icon-box",
        { scale: 0.85, opacity: 0, duration: 0.25, ease: "power2.in" },
        2.87
      );

      // Callout crowd container fade out at 3.15s
      tl.to(
        "#callout-crowd",
        { y: -16, opacity: 0, duration: 0.3, ease: "power2.in" },
        3.15

      // --- BEAT 2: Fall & Downward Spiral ---
      // atMs 404410 (3.66s), holdMs 2500 (to 6.16s)

        "#callout-fall",
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },

      tl.fromTo(
        "#fall-icon-box",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        3.66

      // SVG path progressive drawing for downward arrow
      if (fallPath) {
        tl.fromTo(
          fallPath,
          { strokeDashoffset: pathLen },
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
          3.78
        );

      if (fallHead) {
        tl.fromTo(
          fallHead,
          { strokeDashoffset: headLen },
          { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
          4.22
        );

        "#fall-text-box",
        { x: -20, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
