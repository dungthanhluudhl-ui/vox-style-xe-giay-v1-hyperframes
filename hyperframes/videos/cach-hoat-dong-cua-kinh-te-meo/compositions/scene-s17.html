    </style>

    <div
      id="root"
      data-composition-id="scene-s17"
      data-width="1080"

      data-duration="9.71"
    >
      <div id="scene-s17-clip" class="clip" data-start="0" data-duration="9.71">
        <!-- Top Dossier Header -->
        <div id="docHeader" class="doc-header">
          <div class="doc-tag">
            <span class="doc-dot"></span>
            <span>HỒ SƠ THƯƠNG MẠI // BIÊN GIỚI RỪNG</span>
          </div>
          <div class="doc-id">MÃ SỐ S17</div>
        </div>

        <!-- Main Card Sticker Frame -->
        <div id="cardFrame" class="card-frame">
          <div class="img-viewport">
            <img
              id="heroImg"
              class="hero-img"
              src="assets/img-18-corrupt-law-revision-cutout.jpeg"
              alt="Luật cấm xuất khẩu và mạng lưới buôn lậu"
            />
          </div>
        </div>

        <!-- Overlay 1: Rise icon badge -->
        <div id="riseBadge" class="rise-badge">
          <svg
            class="rise-icon-svg"
            viewBox="0 0 40 40"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <polyline
              id="riseArrow"
              points="6,32 18,20 25,26 34,10"
              stroke="#FF6A1A"
              stroke-width="4.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <polyline
              id="riseHead"
              points="24,10 34,10 34,20"
              stroke="#FF6A1A"
              stroke-width="4.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="rise-badge-text">TĂNG TRƯỞNG</span>
        </div>

          <span class="export-sub">HOẠT ĐỘNG THƯƠNG MẠI</span>

                cx="25"
                cy="25"

              <line

    <script>
      const tl = gsap.timeline({ paused: true });

      // Measure SVG path lengths for clean progressive draw
      const riseArrow = document.getElementById("riseArrow");
      const riseHead = document.getElementById("riseHead");
      const banCircle = document.getElementById("banCircle");
      const banSlash = document.getElementById("banSlash");

      const riseArrowLen = riseArrow.getTotalLength();
      const riseHeadLen = riseHead.getTotalLength();
      const banCircleLen = banCircle.getTotalLength();
      const banSlashLen = banSlash.getTotalLength();

      riseArrow.style.strokeDasharray = `${riseArrowLen}`;
      riseArrow.style.strokeDashoffset = `${riseArrowLen}`;
      riseHead.style.strokeDasharray = `${riseHeadLen}`;
      riseHead.style.strokeDashoffset = `${riseHeadLen}`;

      banCircle.style.strokeDasharray = `${banCircleLen}`;
      banCircle.style.strokeDashoffset = `${banCircleLen}`;
      banSlash.style.strokeDasharray = `${banSlashLen}`;
      banSlash.style.strokeDashoffset = `${banSlashLen}`;

      // 1. Initial State Setup
      gsap.set("#cardFrame", { opacity: 0, scale: 1.15 });
      gsap.set("#heroImg", { x: 30 });
      gsap.set("#riseBadge", { opacity: 0, y: -24, scale: 0.92 });
      gsap.set("#exportLabel", { opacity: 0, x: -48 });
      gsap.set("#punchStamp", { opacity: 0, scale: 1.25 });
      gsap.set("#banIconBox", { opacity: 0, scale: 0 });
      gsap.set("#barrierLabelBox", { opacity: 0, x: 44 });

      // 2. Entrance: Zoom-through transition into the card (0.0s - 0.75s)
      tl.to(
        "#cardFrame",
        {
          scale: 1,
          opacity: 1,
          duration: 0.75,
          ease: "power3.out"
        },
        0
      );

      // Camera motion: continuous subtle pan-left drift on the cropped image
      tl.to(
        "#heroImg",
        {
          x: -35,
          duration: 9.71,
          ease: "none"
        },
        0
      );

      // 3. Overlay 1: Rise icon badge appears (atMs: 145990 -> 1.29s, hold 2.4s)
      tl.to(
        "#riseBadge",
        {
          opacity: 1,
          y: 0,
          scale: 1,
          duration: 0.45,
          ease: "power3.out"
        },
        1.29
      );
      tl.to(
        riseArrow,
        {
          strokeDashoffset: 0,
          duration: 0.42,
          ease: "power2.out"
        },
        1.38
      );
      tl.to(
        riseHead,
        {
          strokeDashoffset: 0,
          duration: 0.28,
          ease: "power2.out"
        },
        1.62
      );
      // Fade out Overlay 1 before next beat
      tl.to(
        "#riseBadge",
        {
          opacity: 0,
          y: -16,
          duration: 0.28,
          ease: "power2.in"
        },
        3.42
      );

      // 4. Overlay 2: Label "XUẤT KHẨU SANG RỪNG BẠN" (atMs: 148180 -> 3.48s, hold 2.5s)
      tl.to(
        "#exportLabel",
        {
          opacity: 1,
          x: 0,
          duration: 0.48,
          ease: "power3.out"
        },
        3.48
      );
      // Fade out Overlay 2 before punch stamp arrives
      tl.to(
        "#exportLabel",
        {
          opacity: 0,
          x: 24,
          duration: 0.28,
          ease: "power2.in"
        },
        5.48
      );

      // 5. Overlay 3: Punch-phrase "THỊ TRƯỜNG BỊ CẤM" (atMs: 150500 -> 5.80s, hold 1.8s)
      // Pure axial scale without rotation avoids AABB bounding box collision between internal lines
      tl.to(
        "#punchStamp",
        {
          opacity: 1,
          scale: 1,
          duration: 0.42,
          ease: "power4.out"
        },
        5.80
      );
      // Fade out Punch-phrase before ban icon lockup
      tl.to(
        "#punchStamp",
        {
          opacity: 0,
          scale: 0.94,
          duration: 0.32,
          ease: "power2.in"
        },
        7.85
      );

      // 6. Overlay 4: Icon "ban" pops and draws (atMs: 152990 -> 8.29s)
      tl.to(
        "#banIconBox",
        {
          opacity: 1,
          scale: 1,
          duration: 0.45,
          ease: "power3.out"
        },
        8.29
      );
      tl.to(
        banCircle,
        {
          strokeDashoffset: 0,
          duration: 0.4,
          ease: "power2.out"
        },
        8.35
      );
      tl.to(
        banSlash,
        {
          strokeDashoffset: 0,
          duration: 0.3,
          ease: "power2.out"
        },
        8.55
      );

      // 7. Overlay 5: Label "RÀO CẢN PHÁP LÝ" (atMs: 153480 -> 8.78s, hold to end)
      tl.to(
        "#barrierLabelBox",
        {
          opacity: 1,
          x: 0,
          duration: 0.48,
          ease: "power3.out"
        },
        8.78
      );

      // Register timeline deterministically
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s17"] = tl;
    </script>
