        "#s1-stamp",
        { scale: 2.2, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        1.1
      );

      // Label 1: TRUY THU TIỀN CÁ xuất hiện lúc 2.57s
      tl.fromTo(
        "#box-label-1",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        2.57
      );
      // Fade out nhẹ trước khi hết thời lượng hiển thị ở 4.57s

        "#s2-frame",
        { opacity: 0 },
        { opacity: 1, duration: 0.05, ease: "none" },
        5.8

        { x: 40, scale: 1.1 },
        { x: -70, scale: 1.22, duration: 4.68, ease: "none" },
        5.8

        "#s2-callout",
        { scale: 0.8, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        6.4

        "#box-punch-phrase",
        { y: 50, scale: 0.95, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        7.64
