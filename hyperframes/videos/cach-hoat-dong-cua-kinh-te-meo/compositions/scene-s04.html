  <div id="root" data-composition-id="scene-s04" data-width="1080" data-height="1920" data-duration="11">

    <!-- Lớp nền Grain Texture -->

    <!-- Nền: Các đường kẻ ngang Chart & Ticks cam -->
    <div class="bg-chart-layer">
      <div class="chart-line chart-line-20"><div class="chart-tick"></div></div>
      <div class="chart-line chart-line-40"><div class="chart-tick"></div></div>

        <div id="photo-card" class="photo-card-container" data-layout-allow-overflow="true">
          <div class="photo-doc-tag">HỒ SƠ GIAO DỊCH // S04</div>
          <div class="photo-wrapper" data-layout-allow-overflow="true">
            <img id="bg-photo-img" class="photo-img" src="assets/img-13-huge-profit-margin-diagram.jpeg" alt="Sơ đồ tỷ suất lợi nhuận khổng lồ">

        <!-- Icon DOC tự vẽ SVG (Overlay 1: xuất hiện 0.57s) -->

  <script>
    // Khởi tạo GSAP Timeline đúng chuẩn deterministic seek của HyperFrames
    const tl = gsap.timeline({ paused: true });

    // Đo và thiết lập ban đầu cho các nét vẽ SVG doc-path
    const docPaths = document.querySelectorAll(".doc-path");
    docPaths.forEach(p => {
      const len = p.getTotalLength();
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
    });

    // 0.0s - 0.6s: Hiệu ứng chuyển cảnh vào "unfold" mở rộng toàn bộ viewport
    tl.fromTo("#scene-viewport", 
      { scaleY: 0.85, opacity: 0, y: -30 }, 
      { scaleY: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 
      0
    );

    // 0.0s - 11.0s: Camera Motion Ken Burns pan dọc & zoom chậm trên ảnh minh họa A-roll
    tl.fromTo("#bg-photo-img", 
      { scale: 1.05, x: -15, y: 15 }, 
      { scale: 1.15, x: 20, y: -20, duration: 11.0, ease: "none" }, 
      0
    );

    // 0.57s: Icon DOC xuất hiện (atMs: 20270 -> 570ms = 0.57s, holdMs: 2500)
    tl.fromTo("#doc-badge", 
      { scale: 0, opacity: 0, rotation: 8 }, 
      { scale: 1, opacity: 1, rotation: 0, duration: 0.42, ease: "power3.out" }, 
      0.57
    );

    // Vẽ từng nét của Icon DOC (svg-path-draw)
    docPaths.forEach((p, idx) => {
      const len = p.getTotalLength();
      tl.fromTo(p, 
        { strokeDashoffset: len }, 
        { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, 
        0.65 + idx * 0.07
      );
    });

    // 1.4s - 2.2s: Các chip nguyên liệu nhỏ lần lượt hội tụ vào bảng
    const ingChips = [".ing-chip-1", ".ing-chip-2", ".ing-chip-3", ".ing-chip-4"];
    ingChips.forEach((chip, i) => {
      tl.fromTo(chip, 
        { y: -16, opacity: 0 }, 
        { y: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, 
        1.4 + i * 0.22
      );
    });

    // 3.2s: Icon DOC thu gọn nhẹ để nhường tâm điểm cho bảng số liệu
    tl.to("#doc-badge", { scale: 0.9, opacity: 0.85, duration: 0.35, ease: "power2.out" }, 3.2);

    // 4.27s: Overlay Label "NGUYÊN LIỆU + MẶT BẰNG" (atMs: 23970 -> 4.27s)
    tl.fromTo("#label-materials", 
      { x: -25, opacity: 0 }, 
      { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 
      4.27
    );

    // 5.8s: Nhịp nhấn thị giác tránh dead-air — chấm nguyên liệu nổi bật
    tl.to(".ing-chip-dot", { scale: 1.4, duration: 0.2, ease: "power2.out" }, 5.8)
      .to(".ing-chip-dot", { scale: 1, duration: 0.2, ease: "power2.in" }, 6.0);

    // 6.2s: Trục chuẩn ngang vẽ ra tạo nền tảng so sánh
    tl.fromTo("#baseline-guide", 
      { scaleX: 0 }, 
      { scaleX: 1, duration: 0.5, ease: "power3.out" }, 
      6.2
    );

    // 7.64s: Overlay Label "VỐN GỐC: 2K" & Cột chi phí 2K dựng lên (atMs: 27340 -> 7.64s)
    tl.fromTo("#bar-cost", 
      { scaleY: 0 }, 
      { scaleY: 1, duration: 0.45, ease: "power3.out" }, 
      7.64
    );

    tl.fromTo("#label-cost-tag", 
      { scale: 0.7, opacity: 0, y: 12 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 
      7.64
    );

    // 8.6s: Mũi tên khoảng chênh lệch tự mở rộng
    tl.fromTo("#gap-indicator", 
      { opacity: 0, scaleY: 0 }, 
      { opacity: 1, scaleY: 1, duration: 0.45, ease: "power3.out" }, 
      8.6
    );

    // 8.9s: Cột Doanh Thu & Lợi Nhuận 18K vọt lên khổng lồ đối chiếu với 2K
    tl.fromTo("#bar-profit", 
      { scaleY: 0 }, 
      { scaleY: 1, duration: 0.55, ease: "power3.out" }, 
      8.9
    );

    tl.fromTo("#profit-tag", 
      { y: 16, opacity: 0 }, 
      { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 
      9.05
    );

    // 9.27s - 11.0s: PUNCH-PHRASE "SIÊU LỢI NHUẬN: 18K" bung ra ấn tượng (atMs: 28970 -> 9.27s, hold 1.73s)
    tl.fromTo("#punch-phrase-wrapper", 
      { opacity: 0 }, 
      { opacity: 1, duration: 0.01 }, 
      9.27
    );

    tl.fromTo("#punch-card", 
      { scale: 0.82, opacity: 0, y: 24 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 
      9.27
    );

    // Đăng ký timeline duy nhất trên window.__timelines["scene-s04"]
    window.__timelines["scene-s04"] = tl;
  </script>
