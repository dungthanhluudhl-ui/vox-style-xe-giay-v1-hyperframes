    <!-- GSAP Seekable Timeline Script -->
    <script>
      // Thiết lập SVG stroke paths cho icon money tự vẽ
      const svgPaths = document.querySelectorAll(".money-svg path, .money-svg circle");
      svgPaths.forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = len + 1;
        p.style.strokeDashoffset = len + 1;
      });

      // Tạo duy nhất 1 paused GSAP timeline
      const tl = gsap.timeline({ paused: true });

      // === SHOT 1: Camera Motion (0s -> 5.8s) ===
      // Rise entrance + Zoom nhẹ vào toà nhà chung cư thu tiền thuê
      tl.fromTo(
        "#video-viewport-1",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0
      );
      tl.fromTo(
        "#video-viewport-1",
        { scale: 1.0, transformOrigin: "50% 40%" },
        { scale: 1.07, duration: 5.8, ease: "none" },
        0
      );

      // Overlay 1 Animation: "CHUNG CƯ CHO THUÊ" (1.48s -> 3.28s)
      tl.fromTo(
        "#badge-apartment-wrap",
        { y: 30, opacity: 0, scale: 0.9 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        1.48
      );
      tl.to(
        "#badge-apartment-wrap",
        { opacity: 0, y: -15, duration: 0.25, ease: "power2.in" },
        3.03
      );

      // Overlay 2 Animation: Flow Card "CƠ CHẾ DÒNG TIỀN" (3.4s -> 5.6s)
      tl.fromTo(
        "#flow-card-box",
        { y: 35, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        3.4
      );
      tl.to(
        "#flow-card-box",
        { opacity: 0, y: -15, duration: 0.25, ease: "power2.in" },
        5.35
      );

      // === SHOT 2: Camera Motion (5.8s -> 11.0s) ===
      // Cut transition lúc 5.8s, pan nhẹ xuống chú mèo thư thái nằm võng
      tl.fromTo(
        "#video-viewport-2",
        { x: 30, scale: 1.05, transformOrigin: "50% 50%" },
        { x: -25, scale: 1.09, duration: 5.2, ease: "power1.out" },
        5.8
      );

      // Overlay 3 Animation: Punch Phrase "TÀI SẢN DÒNG TIỀN" (6.1s -> 8.4s)
      tl.fromTo(
        "#punch-cashflow-box",
        { y: 40, opacity: 0, scale: 0.88 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power4.out" },
        6.1
      );
      tl.to(
        "#punch-cashflow-box",
        { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" },
        8.15
      );

      // Overlay 4 Animation: Punch Phrase "THU NHẬP THỤ ĐỘNG" & Icon Money (8.6s -> 11.0s)
      tl.fromTo(
        "#punch-passive-box",
        { y: 40, opacity: 0, scale: 0.88 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power4.out" },
        8.6
      );

      // Icon money stroke draw progressively
      tl.to(
        "#path-money-bag",
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        8.9
      );
      tl.to(
        "#path-money-tie",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        9.2
      );
      tl.to(
        "#path-money-coin",
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        9.4
      );
      tl.to(
        "#path-money-symbol",
        { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
        9.65
      );

      // Đăng ký timeline gốc duy nhất cho HyperFrames seeking
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s28"] = tl;
    </script>
