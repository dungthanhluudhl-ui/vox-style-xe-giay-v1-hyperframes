<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0f14;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Flow card styling */
      .flow-card {
        position: absolute;
        background: #F5F0E4;
        border: 4px solid #141414;
        box-shadow: 8px 8px 0 #141414;
        border-radius: 12px;
        padding: 16px 24px;
        transform-origin: 50% 50%;
        z-index: 20;
      }
      .flow-pill {
        display: inline-block;
        background: #FF6A1A;
        color: #141414;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1.5px;
        padding: 4px 14px;
        border: 2px solid #141414;
        border-radius: 6px;
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      .flow-title {
        font-size: 32px;
        font-weight: 900;
        line-height: 1.2;
        color: #141414;
        letter-spacing: -0.5px;
      }
      .flow-desc {
        font-size: 22px;
        font-weight: 700;
        color: #141414;
        margin-top: 4px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s45"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="8"
    >
      <!-- Base paper background with 84px grid and spotlight vignette on background layer -->
      <div
        id="base-bg"
        style="
          position: absolute;
          inset: 0;
          background-color: #E7E3D9;
          background-image:
            radial-gradient(circle at 50% 50%, transparent 40%, rgba(20, 20, 20, 0.28) 100%),
            linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
            linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
          background-size: 100% 100%, 84px 84px, 84px 84px;
          z-index: 0;
        "
      ></div>

      <!-- Signature orange bottom bar -->
      <div
        id="signature-bottom-bar"
        style="
          position: absolute;
          bottom: 0;
          left: 0;
          right: 0;
          height: 14px;
          background: #FF6A1A;
          z-index: 999;
        "
      ></div>

      <!-- ================= SHOT 1 (0.0s - 4.3s) ================= -->
      <!-- Non-timed camera pan wrapper for video -->
      <div
        id="shot1-viewport"
        style="position: absolute; inset: 0; overflow: hidden; z-index: 1;"
      >
        <div
          id="shot1-cam-pan"
          style="position: absolute; inset: -4% -8%; width: 116%; height: 108%;"
        >
          <video
            id="vid-02"
            src="assets/vid-02-economic-crisis-cutout-animation.mp4"
            muted
            playsinline
            data-start="0"
            data-duration="4.3"
            data-media-start="0"
            style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;"
          ></video>
        </div>
      </div>

      <!-- Shot 1 Overlays (Timed clip) -->
      <div id="shot1-overlay" class="clip" data-start="0" data-duration="4.3" style="z-index: 5;">
        <!-- Primary Label: LÀN SÓNG SA THẢI -->
        <div
          id="shot1-label"
          style="position: absolute; top: 240px; left: 80px; transform-origin: 0% 50%;"
        >
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
            <span style="display: inline-block; width: 14px; height: 14px; background: #FF6A1A; border: 2px solid #141414;"></span>
            <span
              style="
                font-size: 20px;
                font-weight: 900;
                letter-spacing: 2px;
                color: #F7F4EC;
                background: #141414;
                padding: 4px 14px;
                border-radius: 4px;
              "
            >
              HỒ SƠ BỐI CẢNH
            </span>
          </div>
          <div
            class="hf-hl-orange"
            style="
              display: inline-block;
              padding: 14px 30px;
              border: 4px solid #141414;
              box-shadow: 8px 8px 0 #141414;
              border-radius: 8px;
            "
          >
            <span style="font-size: 42px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase;">
              LÀN SÓNG SA THẢI
            </span>
          </div>
        </div>

        <!-- Secondary Economic Tag -->
        <div
          id="shot1-sublabel"
          style="position: absolute; top: 380px; left: 80px; transform-origin: 0% 50%;"
        >
          <div
            class="hf-plate-ink"
            style="
              display: inline-block;
              padding: 10px 22px;
              border: 3px solid #FF6A1A;
              box-shadow: 6px 6px 0 rgba(20, 20, 20, 0.9);
              border-radius: 8px;
            "
          >
            <span style="font-size: 26px; font-weight: 900; color: #F7F4EC;">
              SỨC MUA ĐÓNG BĂNG
            </span>
          </div>
        </div>
      </div>

      <!-- ================= SHOT 2 (4.3s - 8.0s) ================= -->
      <div id="shot2-scene" class="clip" data-start="4.3" data-duration="3.7" style="z-index: 10;">
        <!-- Background Illustration Image: nguyên màu theo Style DNA, không phủ gradient đen -->
        <div
          id="shot2-bg-wrap"
          style="position: absolute; inset: 0; overflow: hidden;"
        >
          <img
            id="img-12"
            src="assets/img-12-economic-crisis-cat-illustration.jpeg"
            alt="Khủng hoảng kinh tế"
            style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;"
          />
        </div>

        <!-- Flow diagram SVG arrows -->
        <svg
          id="flow-arrows"
          viewBox="0 0 1080 1920"
          style="position: absolute; inset: 0; width: 1080px; height: 1920px; pointer-events: none; z-index: 18;"
        >
          <!-- Arrow 1: Node 1 right edge -> Node 2 left edge -->
          <path
            id="arrow-1"
            d="M 514 275 C 555 275, 525 420, 560 420"
            fill="none"
            stroke="#FF6A1A"
            stroke-width="6"
            stroke-linecap="round"
          />
          <polygon id="head-1" points="555,412 568,420 555,428" fill="#FF6A1A" />

          <!-- Arrow 2: Node 2 left edge -> Node 3 right edge -->
          <path
            id="arrow-2"
            d="M 570 445 C 530 445, 565 575, 540 575"
            fill="none"
            stroke="#FF6A1A"
            stroke-width="6"
            stroke-linecap="round"
          />
          <polygon id="head-2" points="545,567 532,575 545,583" fill="#FF6A1A" />

          <!-- Arrow 3 (Loop back): Node 3 left edge -> curves around margin -> Node 1 left edge -->
          <path
            id="arrow-3"
            d="M 80 575 C 18 575, 18 275, 72 275"
            fill="none"
            stroke="#FF6A1A"
            stroke-width="6"
            stroke-linecap="round"
          />
          <polygon id="head-3" points="65,267 78,275 65,283" fill="#FF6A1A" />
        </svg>

        <!-- Flow Node 1 (left side) -->
        <div id="flow-node-1" class="flow-card" style="top: 210px; left: 80px; width: 430px;">
          <div class="flow-pill">BƯỚC 1</div>
          <div class="flow-title">MẤT VIỆC LÀM</div>
          <div class="flow-desc">THU NHẬP = 0</div>
        </div>

        <!-- Flow Node 2 (right side) -->
        <div id="flow-node-2" class="flow-card" style="top: 360px; right: 80px; width: 430px;">
          <div class="flow-pill">BƯỚC 2</div>
          <div class="flow-title">MẤT SỨC MUA</div>
          <div class="flow-desc">PATE TỒN KHO</div>
        </div>

        <!-- Flow Node 3 (left side) -->
        <div id="flow-node-3" class="flow-card" style="top: 510px; left: 80px; width: 450px;">
          <div class="flow-pill">HỆ QUẢ</div>
          <div class="flow-title">PHÁ SẢN LAN RỘNG</div>
          <div class="flow-desc">DÂY CHUYỀN ĐỔ VỠ</div>
        </div>

        <!-- Climax Punch Card: KHỦNG HOẢNG KINH TẾ (Opaque plate for high contrast) -->
        <div
          id="punch-card"
          style="
            position: absolute;
            top: 700px;
            left: 60px;
            right: 60px;
            background: #141414;
            border: 4px solid #FF6A1A;
            box-shadow: 12px 12px 0 rgba(20, 20, 20, 0.95);
            border-radius: 16px;
            padding: 28px 24px;
            text-align: center;
            transform-origin: 50% 50%;
            z-index: 30;
          "
        >
          <!-- Top Row: Warning icon and Crisis Header -->
          <div style="display: flex; align-items: center; justify-content: center; gap: 16px;">
            <svg
              id="warn-svg"
              viewBox="0 0 100 100"
              width="76"
              height="76"
              style="overflow: visible; flex-shrink: 0;"
            >
              <path
                id="warn-path"
                d="M 50 14 L 92 86 L 8 86 Z"
                fill="none"
                stroke="#FF6A1A"
                stroke-width="9"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                id="warn-stem"
                d="M 50 40 L 50 62"
                fill="none"
                stroke="#FF6A1A"
                stroke-width="9"
                stroke-linecap="round"
              />
              <circle
                id="warn-dot"
                cx="50"
                cy="76"
                r="5"
                fill="#FF6A1A"
              />
            </svg>
            <div
              style="
                display: inline-block;
                background: #FF6A1A;
                color: #141414;
                font-size: 22px;
                font-weight: 900;
                letter-spacing: 2px;
                padding: 6px 18px;
                border-radius: 6px;
                text-transform: uppercase;
              "
            >
              VÒNG XOÁY SUY THOÁI
            </div>
          </div>

          <!-- Headline Lines -->
          <div
            id="punch-title-1"
            style="
              font-size: 68px;
              font-weight: 900;
              line-height: 1.15;
              color: #F7F4EC;
              letter-spacing: -0.5px;
              margin-top: 14px;
            "
          >
            KHỦNG HOẢNG
          </div>
          <div
            id="punch-title-2"
            style="
              font-size: 76px;
              font-weight: 900;
              line-height: 1.15;
              color: #FF6A1A;
              letter-spacing: -0.5px;
            "
          >
            KINH TẾ
          </div>
        </div>
      </div>
    </div>

    <!-- GSAP seekable timeline script -->
    <script>
      // 1. Measure and prepare SVG paths for deterministic progressive drawing
      const strokeSelectors = ["#arrow-1", "#arrow-2", "#arrow-3", "#warn-path", "#warn-stem"];
      const strokeLengths = {};
      strokeSelectors.forEach(function (selector) {
        const el = document.querySelector(selector);
        if (el && typeof el.getTotalLength === "function") {
          const len = Math.ceil(el.getTotalLength()) + 2;
          strokeLengths[selector] = len;
          el.style.strokeDasharray = len;
          el.style.strokeDashoffset = len;
        } else {
          strokeLengths[selector] = 300;
        }
      });

      // 2. Build seekable master timeline
      const tl = gsap.timeline({ paused: true });

      // ----- SHOT 1 MOTION (0.0s - 4.3s) -----
      // Strike entrance for Shot 1 viewport
      tl.fromTo(
        "#shot1-viewport",
        { scale: 1.12, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power4.out" },
        0
      );

      // Pan left camera motion across the factory sequence
      tl.fromTo(
        "#shot1-cam-pan",
        { x: 35 },
        { x: -35, duration: 4.3, ease: "none" },
        0
      );

      // Overlay label: LÀN SÓNG SA THẢI (enters at 0.52s = 401220 - 400700)
      tl.fromTo(
        "#shot1-label",
        { scale: 0, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.52
      );

      // Economic consequence tag (enters at 1.8s)
      tl.fromTo(
        "#shot1-sublabel",
        { x: -30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        1.8
      );

      // Shot 1 overlays fade out before cut
      tl.to(
        "#shot1-label, #shot1-sublabel",
        { opacity: 0, duration: 0.2, ease: "power2.in" },
        4.1
      );

      // ----- SHOT 2 MOTION (4.3s - 8.0s) -----
      // Hard cut transition into Shot 2 at 4.3s
      tl.fromTo(
        "#shot2-scene",
        { opacity: 0 },
        { opacity: 1, duration: 0.05, ease: "none" },
        4.3
      );

      // Causal chain: Flow Step 1 (enters at 4.45s)
      tl.fromTo(
        "#flow-node-1",
        { scale: 0.8, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        4.45
      );

      // Arrow 1 draws (Node 1 -> Node 2)
      tl.fromTo(
        "#arrow-1",
        { strokeDashoffset: strokeLengths["#arrow-1"] },
        { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
        4.7
      );
      tl.fromTo(
        "#head-1",
        { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, duration: 0.12, ease: "power3.out" },
        4.88
      );

      // Causal chain: Flow Step 2 (enters at 4.95s)
      tl.fromTo(
        "#flow-node-2",
        { scale: 0.8, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        4.95
      );

      // Arrow 2 draws (Node 2 -> Node 3)
      tl.fromTo(
        "#arrow-2",
        { strokeDashoffset: strokeLengths["#arrow-2"] },
        { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
        5.2
      );
      tl.fromTo(
        "#head-2",
        { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, duration: 0.12, ease: "power3.out" },
        5.38
      );

      // Causal chain: Flow Step 3 (enters at 5.45s)
      tl.fromTo(
        "#flow-node-3",
        { scale: 0.8, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        5.45
      );

      // Arrow 3 loop draws back to Node 1 (closing the recession cycle)
      tl.fromTo(
        "#arrow-3",
        { strokeDashoffset: strokeLengths["#arrow-3"] },
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        5.7
      );
      tl.fromTo(
        "#head-3",
        { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, duration: 0.12, ease: "power3.out" },
        5.95
      );

      // Punch Phrase Card arrival: KHỦNG HOẢNG KINH TẾ (enters at 6.14s = 406840 - 400700)
      tl.fromTo(
        "#punch-card",
        { scale: 0.86, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power4.out" },
        6.14
      );

      // Progressive SVG draw of Warning icon (enters at 6.85s = 407550 - 400700)
      tl.fromTo(
        "#warn-path",
        { strokeDashoffset: strokeLengths["#warn-path"] },
        { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
        6.85
      );
      tl.fromTo(
        "#warn-stem",
        { strokeDashoffset: strokeLengths["#warn-stem"] },
        { strokeDashoffset: 0, duration: 0.15, ease: "power2.out" },
        7.08
      );
      tl.fromTo(
        "#warn-dot",
        { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, duration: 0.12, ease: "power3.out" },
        7.2
      );

      // Border flash accent on punch card
      tl.to(
        "#punch-card",
        { borderColor: "#F7F4EC", duration: 0.12, ease: "power1.out" },
        7.24
      );
      tl.to(
        "#punch-card",
        { borderColor: "#FF6A1A", duration: 0.12, ease: "power1.in" },
        7.36
      );

      // 3. Register root timeline for HyperFrames frame seek engine
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s45"] = tl;
    </script>
  
    </template>
  </body>
</html>
