      tl.fromTo("#camera-rig", { scale: 0.88, rotation: -4, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.75, ease: "power3.out" }, 0);

      // Border line & Trade route draw
      tl.fromTo("#border-demarcation", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.4);
      tl.to("#trade-route-line", { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, 0.65);

      // Overlay 1: check icon
      tl.to("#check-pill", { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 0.94);

      tl.to("#cargo-crate-1", {
        keyframes: [
          { y: 70, duration: 0.65, ease: "power1.inOut" },
          { y: 155, duration: 0.65, ease: "power1.inOut" },

        { scale: 1.08, backgroundColor: "#FF6A1A", color: "#141414", duration: 0.3, yoyo: true, repeat: 1, ease: "power2.inOut" },

      tl.to("#pin-container", { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.5)" }, 5.80);
