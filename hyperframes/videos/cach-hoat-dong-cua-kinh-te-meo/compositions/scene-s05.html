<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #141414;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Khung canvas chuẩn 1080x1920 */
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Quy ước clip của HyperFrames */
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Lớp nền Spotlight kết hợp Grid kẻ ô 84px của Vox */
      #bg-spotlight {
        position: absolute;
        inset: 0;
        background-color: #e7e3d9;
        background-image:
          radial-gradient(
            circle at 50% 38%,
            rgba(231, 227, 217, 0.25) 20%,
            rgba(60, 50, 40, 0.45) 60%,
            rgba(15, 15, 15, 0.88) 100%
          ),
          linear-gradient(rgba(20, 20, 20, 0.25) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.25) 1.5px, transparent 1.5px);
        background-size:
          100% 100%,
          84px 84px,
          84px 84px;
        z-index: 1;
      }

      /* Camera container chứa hero image */
      #camera-wrapper {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        transform-origin: 50% 35%;
      }

      #hero-image-box {
        position: absolute;
        width: 1080px;
        height: 1920px;
        left: 0;
        top: 0;
      }

      #hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Container chứa Flow Diagram & Badges (tách layer độc lập) */
      #flow-container {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      #flow-svg {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
      }

      /* Các chip nhãn chỉ luồng flow trên ảnh (nền đặc đảm bảo contrast WCAG AAA) */
      .flow-node-badge {
        position: absolute;
        padding: 10px 22px;
        border-radius: 4px;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 1px;
        text-transform: uppercase;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.7);
        pointer-events: none;
      }

      /* Đặt badge-source tại top: 1120px (Y: 1120-1170) an toàn cao hơn Caption Zone (>=1390px) */
      #badge-source {
        top: 1120px;
        right: 80px;
        background: #141414;
        color: #f7f4ec;
        border-left: 6px solid #ff6a1a;
      }

      /* Đặt badge-target tại top: 700px chỉ về mèo trùm */
      #badge-target {
        top: 700px;
        left: 100px;
        background: #ff6a1a;
        color: #141414;
        border: 3px solid #141414;
      }

      /* Header hồ sơ điều tra phóng sự Vox (nằm trong vùng an toàn > 160px) */
      #top-report-tag {
        position: absolute;
        top: 180px;
        left: 60px;
        display: flex;
        align-items: center;
        gap: 14px;
        z-index: 100;
      }

      .tag-pill {
        background: #141414;
        color: #ff6a1a;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 2px;
        padding: 8px 18px;
        border-radius: 2px;
        text-transform: uppercase;
      }

      .tag-title {
        background: #f5f0e4;
        color: #141414;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 1px;
        padding: 8px 18px;
        border-radius: 2px;
      }

      /* Overlay 1: Label Đe dọa tiểu thương */
      #label-wrapper {
        position: absolute;
        top: 360px;
        left: 60px;
        right: 60px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        z-index: 50;
      }

      .label-plate {
        background: #141414;
        border-left: 10px solid #ff6a1a;
        padding: 24px 34px;
        border-radius: 4px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
        max-width: 900px;
      }

      .label-category {
        color: #ff6a1a;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .label-main-text {
        color: #f7f4ec;
        font-size: 58px;
        font-weight: 900;
        line-height: 1.22;
        letter-spacing: -0.5px;
        text-transform: uppercase;
      }

      /* Overlay 2: Punch phrase Bảo kê & chia lãi */
      #punch-wrapper {
        position: absolute;
        top: 400px;
        left: 60px;
        right: 60px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        z-index: 60;
      }

      .punch-tag {
        background: #ff6a1a;
        color: #141414;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 2px;
        padding: 10px 24px;
        border-radius: 4px 4px 0 0;
        text-transform: uppercase;
        border: 4px solid #141414;
        border-bottom: none;
      }

      .punch-plate {
        background: #141414;
        color: #f7f4ec;
        font-size: 68px;
        font-weight: 900;
        line-height: 1.25;
        padding: 30px 40px;
        border-radius: 0 4px 4px 4px;
        border: 4px solid #141414;
        border-bottom: 10px solid #ff6a1a;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
        text-transform: uppercase;
        letter-spacing: -1px;
      }

      .punch-plate span.highlight-orange {
        color: #ff6a1a;
      }

      /* Dấu mộc điều tra Monopoly đóng chéo */
      #punch-stamp {
        position: absolute;
        right: 20px;
        bottom: -32px;
        background: #141414;
        color: #ff6a1a;
        border: 5px solid #ff6a1a;
        padding: 10px 26px;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 4px;
        text-transform: uppercase;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      }

      /* Thanh cam nhận diện thương hiệu cố định mép đáy */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 12px;
        background: #ff6a1a;
        z-index: 999;
      }

      /* Tối ưu render tăng tốc phần cứng */
      #camera-wrapper,
      #label-wrapper,
      #punch-wrapper,
      #punch-stamp,
      #flow-container {
        will-change: transform, opacity;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s05"
      data-width="1080"
      data-height="1920"
      data-duration="8.45"
    >
      <!-- Nền Spotlight & Grid của Vox -->
      <div id="bg-spotlight"></div>

      <!-- Tag nhận diện phóng sự điều tra -->
      <header id="top-report-tag">
        <span class="tag-pill">HỒ SƠ #05</span>
        <span class="tag-title">MAFIA HÓA THỊ TRƯỜNG</span>
      </header>

      <!-- Visual Clip chính: Toàn bộ Shot 1 (0s - 8.45s) -->
      <section
        id="visual-shot-clip"
        class="clip"
        data-start="0"
        data-duration="8.45"
        style="z-index: 10"
      >
        <div id="camera-wrapper">
          <!-- Ảnh cắt dán AI Google Flow giữ nguyên màu gốc -->
          <div id="hero-image-box">
            <img
              id="hero-img"
              src="assets/img-17-monopoly-threat-extortion-cutout.jpeg"
              alt="Mèo Mafia đe dọa thợ làm bánh"
            />
          </div>
        </div>
      </section>

      <!-- Flow Diagram Clip: Hiển thị minh họa từ t = 1.2s đến 5.7s (trước khi punch phrase xuất hiện) -->
      <section
        id="flow-clip"
        class="clip"
        data-start="1.2"
        data-duration="4.5"
        style="z-index: 25"
      >
        <div id="flow-container">
          <!-- Lớp đồ họa Flow: Đường nộp tiền cưỡng đoạt rẽ hướng về mèo trùm -->
          <svg id="flow-svg" viewBox="0 0 1080 1920" fill="none">
            <defs>
              <marker
                id="arrow-marker"
                viewBox="0 0 12 12"
                refX="10"
                refY="6"
                markerWidth="8"
                markerHeight="8"
                orient="auto-start-reverse"
              >
                <path d="M 0 0 L 12 6 L 0 12 z" fill="#FF6A1A" />
              </marker>
            </defs>

            <!-- Nhánh 1: Từ quầy bánh bên phải hướng lên mèo trùm -->
            <path
              id="flow-path-main"
              d="M 760 1120 C 860 960, 640 860, 360 740"
              stroke="#FF6A1A"
              stroke-width="9"
              stroke-linecap="round"
              stroke-dasharray="14 10"
              marker-end="url(#arrow-marker)"
            />

            <!-- Nhánh 2: Từ quầy bánh bên trái hướng lên mèo trùm -->
            <path
              id="flow-path-sub"
              d="M 280 1240 C 200 1060, 240 910, 330 790"
              stroke="#FF6A1A"
              stroke-width="7"
              stroke-linecap="round"
              stroke-dasharray="10 8"
              marker-end="url(#arrow-marker)"
            />
          </svg>

          <!-- Các badge nhãn chỉ dẫn luồng nộp tiền -->
          <div id="badge-source" class="flow-node-badge">Tiền Lãi Quầy Bánh</div>
          <div id="badge-target" class="flow-node-badge">Về Túi Mèo Trùm</div>
        </div>
      </section>

      <!-- Overlay 1: Label ĐE DỌA TIỂU THƯƠNG (40320 - 37510 = 2.81s, hold 2.0s) -->
      <section
        id="label-shot-clip"
        class="clip"
        data-start="2.81"
        data-duration="2.0"
        style="z-index: 40"
      >
        <div id="label-wrapper">
          <div class="label-plate">
            <div class="label-category">Áp Lực Cưỡng Đoạt</div>
            <div class="label-main-text">Đe Dọa Tiểu Thương</div>
          </div>
        </div>
      </section>

      <!-- Overlay 2: Punch phrase BẢO KÊ & CHIA LÃI (43550 - 37510 = 6.04s, hold 2.41s) -->
      <section
        id="punch-shot-clip"
        class="clip"
        data-start="6.04"
        data-duration="2.41"
        style="z-index: 50"
      >
        <div id="punch-wrapper">
          <div class="punch-tag">Mô Hình Băng Nhóm</div>
          <div class="punch-plate">
            Bảo Kê & <span class="highlight-orange">Chia Lãi</span>
          </div>
          <div id="punch-stamp">MONOPOLY</div>
        </div>
      </section>

      <!-- Thanh màu cam cố định đáy màn hình (Signature của phong cách) -->
      <div id="brand-bottom-bar"></div>
    </div>

    <!-- GSAP Master Animation Script -->
    <script>
      // 1. Tạo timeline paused duy nhất theo quy ước HyperFrames
      const tl = gsap.timeline({ paused: true });

      // 2. Setup trước độ dài nét vẽ cho các đường Flow SVG
      const pathMain = document.getElementById("flow-path-main");
      const pathSub = document.getElementById("flow-path-sub");

      const lenMain = pathMain ? pathMain.getTotalLength() : 900;
      const lenSub = pathSub ? pathSub.getTotalLength() : 750;

      if (pathMain) {
        pathMain.style.strokeDasharray = lenMain + " " + lenMain;
        pathMain.style.strokeDashoffset = lenMain;
      }
      if (pathSub) {
        pathSub.style.strokeDasharray = lenSub + " " + lenSub;
        pathSub.style.strokeDashoffset = lenSub;
      }

      // 3. ENTRANCE: "Strike" Transition (t = 0.0s đến 0.65s)
      // Cú đập mạnh giáng xuống từ trên của bóng mèo trùm khổng lồ, camera rung chấn
      tl.fromTo(
        "#camera-wrapper",
        {
          y: -130,
          x: 0,
          scale: 1.3,
          opacity: 0,
        },
        {
          y: 0,
          x: 0,
          scale: 1.22,
          opacity: 1,
          duration: 0.44,
          ease: "power4.in",
        },
        0.0,
      );

      // Camera chấn động phản lực (strike impact shake)
      tl.to(
        "#camera-wrapper",
        {
          y: 16,
          duration: 0.07,
          ease: "power2.out",
        },
        0.44,
      );
      tl.to(
        "#camera-wrapper",
        {
          y: -8,
          duration: 0.07,
          ease: "power2.inOut",
        },
        0.51,
      );
      tl.to(
        "#camera-wrapper",
        {
          y: 0,
          duration: 0.12,
          ease: "power2.out",
        },
        0.58,
      );

      // Header xuất hiện ngay sau cú strike
      tl.fromTo(
        "#top-report-tag",
        { y: -24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.65,
      );

      // 4. CAMERA MOTION: Pan nhẹ trôi xuống nhóm thợ bánh đang sợ hãi (t = 0.8s -> 8.45s)
      tl.to(
        "#camera-wrapper",
        {
          y: -140,
          x: -45,
          scale: 1.15,
          duration: 7.65,
          ease: "none",
        },
        0.8,
      );

      // 5. FLOW LANGUAGE: Mũi tên uốn lượn và badge nộp tiền lãi rẽ hướng (t = 1.3s -> 5.5s)
      tl.to(
        "#flow-path-main",
        {
          strokeDashoffset: 0,
          duration: 1.3,
          ease: "power2.out",
        },
        1.3,
      );

      tl.to(
        "#flow-path-sub",
        {
          strokeDashoffset: 0,
          duration: 1.1,
          ease: "power2.out",
        },
        1.65,
      );

      // Badge nguồn tiền bánh hiện ra
      tl.fromTo(
        "#badge-source",
        { scale: 0, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.4,
      );

      // Badge đích nộp về túi mèo trùm bật lên
      tl.fromTo(
        "#badge-target",
        { scale: 0, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        2.1,
      );

      // Thu gọn nhẹ nhàng flow container trước khi clip kết thúc ở 5.7s
      tl.to(
        "#flow-container",
        {
          opacity: 0,
          scale: 0.94,
          duration: 0.38,
          ease: "power2.in",
        },
        5.2,
      );

      // 6. OVERLAY 1: "ĐE DỌA TIỂU THƯƠNG" (Clip hiển thị từ t = 2.81s đến 4.81s)
      tl.fromTo(
        "#label-wrapper",
        { x: -60, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.46, ease: "power3.out" },
        2.81,
      );

      tl.to(
        "#label-wrapper",
        {
          x: 35,
          opacity: 0,
          duration: 0.28,
          ease: "power2.in",
        },
        4.53,
      );

      // 7. OVERLAY 2: "BẢO KÊ & CHIA LÃI" (Clip hiển thị từ t = 6.04s đến 8.45s)
      tl.fromTo(
        "#punch-wrapper",
        { scale: 0.88, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        6.04,
      );

      // Đóng dấu MONOPOLY đập mạnh vào góc dưới của punch card
      tl.fromTo(
        "#punch-stamp",
        { scale: 2.1, opacity: 0, rotation: -26 },
        {
          scale: 1,
          opacity: 1,
          rotation: -7,
          duration: 0.36,
          ease: "power4.out",
        },
        6.36,
      );

      // 8. Đăng ký timeline chính thức cho HyperFrames seek runtime
      window.__timelines["scene-s05"] = tl;
    </script>
  
    </template>
  </body>
</html>
