  <!-- GSAP Animation -->
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Setup nét vẽ SVG cảnh báo
    const warnTri = document.getElementById("warn-tri");
    const warnLine = document.getElementById("warn-line");
    const triLen = warnTri ? Math.ceil(warnTri.getTotalLength()) : 260;
    const lineLen = warnLine ? Math.ceil(warnLine.getTotalLength()) : 30;

    if (warnTri) {
      warnTri.style.strokeDasharray = triLen;
      warnTri.style.strokeDashoffset = triLen;
    }
    if (warnLine) {
      warnLine.style.strokeDasharray = lineLen;
      warnLine.style.strokeDashoffset = lineLen;
    }

    // 1. Scene Entrance (0.0s - 0.6s)
    tl.fromTo("#scene-stage",
      { scale: 0.96, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
      0.0
    );

    // 2. Ken Burns pan-left (0.0s - 12.0s)
    tl.fromTo("#hero-img",
      { scale: 1.08, x: 24 },
      { scale: 1.15, x: -28, duration: 12.0, ease: "none" },
      0.0
    );

    // 3. Beat 1: Chi phí thiết yếu: 5 cá (0.77s - 3.10s)
    tl.to("#tray-1", { borderColor: "#FF6A1A", y: -4, duration: 0.35, ease: "power2.out" }, 0.77);
    tl.to("#tray-ind-1", { opacity: 1, duration: 0.35 }, 0.77);
    tl.fromTo("#callout-1",
      { opacity: 0, y: 24 },
      { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
      0.77
    );
    tl.to("#callout-1",
      { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" },
      2.85
    );
    tl.to("#tray-1", { borderColor: "#141414", y: 0, duration: 0.25, ease: "power2.in" }, 2.95);
    tl.to("#tray-ind-1", { opacity: 0, duration: 0.25 }, 2.95);

    // 4. Beat 2: Nguy cơ ốm đau / mất việc (3.20s - 5.75s)
    tl.fromTo("#callout-2",
      { opacity: 0, y: 24 },
      { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
      3.20
    );
    if (warnTri) {
      tl.fromTo(warnTri,
        { strokeDashoffset: triLen },
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        3.25
      );
    }
    if (warnLine) {
      tl.fromTo(warnLine,
        { strokeDashoffset: lineLen },
        { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
        3.50
      );
    }
    tl.fromTo("#warn-dot",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.2, ease: "power3.out" },
      3.65
    );
    tl.to("#callout-2",
      { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" },
      5.50
    );

    // 5. Beat 3: Cất két dự phòng: 1 cá (6.03s - 7.95s)
    tl.to("#tray-2", { borderColor: "#FF6A1A", y: -4, duration: 0.35, ease: "power2.out" }, 6.03);
    tl.to("#tray-ind-2", { opacity: 1, duration: 0.35 }, 6.03);
    tl.fromTo("#callout-3",
      { opacity: 0, y: 24 },
      { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
      6.03
    );
    tl.to("#callout-3",
      { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" },
      7.80
    );

    // 6. Beat 4: Punch Phrase - QUỸ DỰ PHÒNG KHẨN CẤP (8.15s - 10.05s)
    tl.fromTo("#punch-card",
      { opacity: 0, scale: 0.92, y: 20 },
      { opacity: 1, scale: 1, y: 0, duration: 0.38, ease: "power3.out" },
      8.15
    );
    tl.to("#punch-card",
      { opacity: 0, scale: 0.95, y: -12, duration: 0.25, ease: "power2.in" },
      9.80
    );
    tl.to("#tray-2", { borderColor: "#141414", y: 0, duration: 0.25, ease: "power2.in" }, 9.90);
    tl.to("#tray-ind-2", { opacity: 0, duration: 0.25 }, 9.90);

    // 7. Beat 5: Tiền dư nhàn rỗi: 2 cá (10.25s - 12.0s)
    tl.to("#tray-3", { borderColor: "#FF6A1A", y: -4, duration: 0.35, ease: "power2.out" }, 10.25);
    tl.to("#tray-ind-3", { opacity: 1, duration: 0.35 }, 10.25);
    tl.fromTo("#callout-5",
      { opacity: 0, y: 24 },
      { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
      10.25
    );

    // Đăng ký paused timeline duy nhất cho composition "scene-s26"
    window.__timelines["scene-s26"] = tl;
  </script>
