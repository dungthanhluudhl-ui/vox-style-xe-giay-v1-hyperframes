      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }

      /* Video background container */
      #video-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1;
        transform-origin: 50% 50%;
      }
      #vid-07 {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Unfold paper transition mask */
      #unfold-mask {
        position: absolute;
        inset: 0;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        z-index: 20;
        transform-origin: 50% 50%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        pointer-events: none;
      }
      .unfold-crease {
        width: 100%;
        height: 4px;
        background: #FF6A1A;
        box-shadow: 0 0 12px rgba(20, 20, 20, 0.5);
      }

      /* Layout clip quy ước */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Khối chứa Overlay định vị trong Safe Zone [Y: 160 -> 1390] */
      .overlay-lane {
        position: absolute;
        top: 220px;
        left: 60px;
        right: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
      }

      /* Thẻ thông tin phong cách collage giấy cắt */
      .card-plate {
        width: 100%;
        max-width: 960px;
        background-color: #141414; /* Nền mực đặc 100% đảm bảo tương phản trên video */
        border: 4px solid #141414;
        border-radius: 16px;
        padding: 36px 44px;
        box-shadow: 0 18px 36px rgba(0, 0, 0, 0.38);
        transform-origin: 50% 50%;
      }

      /* Header Tag */
      .card-tag {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background-color: #FF6A1A;
        color: #141414;
        font-weight: 700;
        font-size: 24px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 8px 18px;
        border-radius: 6px;
      }

      /* Main Title / Punch Phrase */
      .card-title {
        margin: 20px 0 0 0;
        font-weight: 900;
        font-size: 56px;
        line-height: 1.25;
        color: #F7F4EC;
        letter-spacing: 0.5px;
      }

      .card-punch-title {
        margin: 18px 0 0 0;
        font-weight: 900;
        font-size: 68px;
        line-height: 1.2;
        color: #F7F4EC;
        letter-spacing: -0.5px;
      }

      .highlight-block {
        display: inline-block;
        background-color: #FF6A1A;
        color: #141414;
        padding: 2px 18px;
        border-radius: 8px;
        margin-left: 8px;
      }

      /* Flow connector & sub-label (tối đa 4 từ) */
      .card-flow-sub {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 18px;
        padding-top: 18px;
        border-top: 2px dashed rgba(247, 244, 236, 0.25);
      }
      .flow-label {
        font-weight: 700;
        font-size: 28px;
        color: #FF6A1A;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .flow-note {
        font-weight: 700;
        font-size: 28px;
        color: #F7F4EC;
        letter-spacing: 0.5px;
      }

      /* Thanh cam nhận diện thương hiệu cố định đáy khung hình */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 50;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s31"
      data-width="1080"
      data-height="1920"
      data-duration="6.94"
    >
      <!-- Video hoạt cảnh trao sổ đỏ để nhận bao tải tiền vay giải ngân -->
      <div id="video-wrapper">
        <video
          id="vid-07"
          src="assets/vid-07-cat-bank-loan-cutout.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="6.94"
          data-media-start="0.5"
        ></video>
      </div>

      <!-- Hiệu ứng chuyển cảnh Unfold giấy mở từ giữa ra toàn khung -->
      <div id="unfold-mask" data-layout-ignore="true">
        <div class="unfold-crease"></div>
      </div>

      <!-- Overlay 1: TÀI SẢN ĐẢM BẢO (2.16s -> 3.94s, thời lượng 1.78s) -->
      <section id="overlay-step-1" class="clip" data-start="2.16" data-duration="1.78">
        <div class="overlay-lane">
          <div id="card-asset" class="card-plate">
            <div class="card-tag">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <span>BƯỚC 1: BẢO CHỨNG</span>
            </div>
            <h2 class="card-title">TÀI SẢN ĐẢM BẢO</h2>
            <div class="card-flow-sub">
              <span class="flow-label">TRAO SỔ ĐỎ</span>
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FF6A1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
              <span class="flow-note">VÀO KÉT BẢO CHỨNG</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Overlay 2: THẾ CHẤP GIẢI NGÂN (3.94s -> 6.14s, thời lượng 2.20s) -->
      <section id="overlay-step-2" class="clip" data-start="3.94" data-duration="2.20">
        <div class="overlay-lane">
          <div id="card-punch" class="card-plate">
            <div class="card-tag">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span>BƯỚC 2: CẤP VỐN</span>
            </div>
            <h1 class="card-punch-title">
              THẾ CHẤP<span class="highlight-block">GIẢI NGÂN</span>

            <div class="card-flow-sub">
              <span class="flow-label">KHO TIỀN MỞ RA</span>
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FF6A1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

                <polyline points="12 5 19 12 12 19"></polyline>

              <span class="flow-note">NHẬN BAO TIỀN VAY</span>

      <!-- Thanh màu cam signature ở đáy -->
      <div id="brand-bottom-bar" data-layout-ignore="true"></div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Camera motion: zoom in nhẹ và đều xuyên suốt cảnh (6.94s)
      tl.fromTo(
        "#video-wrapper",
        { scale: 1 },
        { scale: 1.07, duration: 6.94, ease: "none" },
        0
      );

      // Hiệu ứng mở nếp gấp giấy Unfold ở đầu cảnh (0s -> 0.65s)
      tl.fromTo(
        "#unfold-mask",
        { scaleY: 1, opacity: 1 },
        { scaleY: 0, opacity: 0, duration: 0.65, ease: "power3.inOut" },
        0
      );

      // Card 1: TÀI SẢN ĐẢM BẢO (xuất hiện tại 2.16s, thoát nhẹ tại 3.74s trước khi clip kết thúc ở 3.94s)
      tl.fromTo(
        "#card-asset",
        { y: -30, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
        2.16
      );
      tl.to(
        "#card-asset",
        { y: -16, opacity: 0, duration: 0.18, ease: "power2.in" },
        3.74
      );

      // Card 2: THẾ CHẤP GIẢI NGÂN (xuất hiện tại 3.94s, thoát nhẹ tại 5.94s trước khi clip kết thúc ở 6.14s)
      tl.fromTo(
        "#card-punch",
        { y: 35, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" },
        3.94
      );
      tl.to(
        "#card-punch",
        { opacity: 0, scale: 0.98, duration: 0.18, ease: "power2.in" },
        5.94
      );

      window.__timelines["scene-s31"] = tl;
    </script>
  
    </template>
