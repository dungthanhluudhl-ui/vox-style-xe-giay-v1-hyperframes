    <script>
      // Single paused master timeline for HyperFrames
      const tl = gsap.timeline({ paused: true });

      // 1. Setup SVG Paths for stroke-dash animation
      const flowArrow = document.getElementById("flow-arrow-path");
      if (flowArrow) {
        const len = flowArrow.getTotalLength ? flowArrow.getTotalLength() : 200;
        flowArrow.style.strokeDasharray = len + "px";
        flowArrow.style.strokeDashoffset = len + "px";
      }

      const checkPath = document.getElementById("check-path");
      if (checkPath) {
        const checkLen = checkPath.getTotalLength ? checkPath.getTotalLength() : 50;
        checkPath.style.strokeDasharray = checkLen + "px";
        checkPath.style.strokeDashoffset = checkLen + "px";
      }

      // Initial visual states
      gsap.set("#label-1", { opacity: 0, scale: 0.9, y: 30 });
      gsap.set("#label-2", { opacity: 0, scale: 0.9, y: 30 });
      gsap.set("#diag-salary", { opacity: 0, x: -40 });
      gsap.set("#diag-connector", { opacity: 0 });
      gsap.set("#flow-arrow-head", { opacity: 0, scale: 0, transformOrigin: "center center" });
      gsap.set("#diag-fund", { opacity: 0, scale: 0.9 });
      gsap.set("#diag-benefits", { opacity: 0, y: 35 });
      gsap.set("#punch-box", { opacity: 0, scale: 0.9, y: 30 });
      gsap.set("#check-badge", { opacity: 0, scale: 0 });

      // ==========================================
      // CHOREOGRAPHY - SHOT 1 (0.0s - 6.3s)
      // ==========================================

      // Entrance animation: "peel" (corner curl / unfold entrance on inner wrapper)
      tl.fromTo(
        "#shot-1-inner",
        { clipPath: "polygon(0% 100%, 0% 100%, 0% 100%, 0% 100%)" },
        { clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)", duration: 0.85, ease: "power3.out" },
        0.1
      );

      // Camera motion: zoom-in into the cat working at desk
      tl.fromTo(
        "#photo-s1",
        { scale: 1.05, y: 0 },
        { scale: 1.22, y: -30, duration: 6.3, ease: "none" },
        0
      );

      // Overlay 1: "LÀM VIỆC CHÂN CHÍNH" (starts at 1.98s, holds 1.8s -> ends at 3.78s)
      tl.to(
        "#label-1",
        { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.98
      );
      tl.to(
        "#label-1",
        { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
        3.78
      );

      // Overlay 2: "NHÂN VIÊN CÔNG SỞ" (starts at 4.63s, holds 1.8s -> ends at 6.3s)
      tl.to(
        "#label-2",
        { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" },
        4.63
      );

      // ==========================================
      // CHOREOGRAPHY - SHOT 2 (6.3s - 12.0s)
      // ==========================================

      // Camera motion: pan-right across wage deduction documents
      tl.fromTo(
        "#photo-s2",
        { scale: 1.18, x: 35 },
        { scale: 1.28, x: -45, duration: 5.7, ease: "none" },
        6.3
      );

      // Diagram progressive reveal
      // Step A: Monthly salary box arrives
      tl.to(
        "#diag-salary",
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
        6.55
      );

      // Step B: Connector fades in and SVG arrow draws
      tl.to(
        "#diag-connector",
        { opacity: 1, duration: 0.3, ease: "power1.out" },
        7.15
      );
      tl.to(
        "#flow-arrow-path",
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        7.25
      );
      tl.to(
        "#flow-arrow-head",
        { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(1.7)" },
        7.7
      );

      // Step C: Shield Fund box arrives
      tl.to(
        "#diag-fund",
        { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        7.85
      );

      // Step D: Benefits coverage panel arrives
      tl.to(
        "#diag-benefits",
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        8.6
      );

      // Punch Phrase: "ĐÓNG PHÍ BẢO HIỂM" (starts at 10.0s, holds 2.0s -> 12.0s)
      tl.to(
        "#punch-box",
        { opacity: 1, scale: 1, y: 0, duration: 0.48, ease: "power4.out" },
        10.0
      );

      // Check Icon: circular badge pops in and checkmark draws (starts at 11.18s)
      tl.to(
        "#check-badge",
        { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.5)" },
        11.18
      );
      tl.to(
        "#check-path",
        { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
        11.32
      );

      // Register timeline on HyperFrames window object
      window.__timelines["scene-s23"] = tl;
    </script>
