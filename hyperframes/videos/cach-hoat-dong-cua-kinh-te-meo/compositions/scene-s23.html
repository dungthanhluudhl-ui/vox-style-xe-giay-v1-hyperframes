<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f5f0e4; /* Card background variant */
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* Nền texture giấy ngà & hạt grain */
      .bg-paper {
        position: absolute;
        inset: 0;
        background-color: #f5f0e4;
        z-index: 1;
      }

      .bg-grid-overlay {
        position: absolute;
        inset: 0;
        background-size: 84px 84px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.08) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.08) 1.5px, transparent 1.5px);
        opacity: 0.7;
        pointer-events: none;
      }

      /* Dải cam chữ ký thương hiệu ở mép dưới cùng */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 14px;
        background: #ff6a1a;
        z-index: 100;
      }

      /* Container 3D Flip & Perspective */
      .stage-perspective {
        position: absolute;
        inset: 0;
        perspective: 1600px;
        transform-style: preserve-3d;
        z-index: 10;
      }

      /* PHASE 1: Bẫy nợ mafia (Dark Side Card) */
      .dark-card-wrap {
        position: absolute;
        top: 200px;
        left: 60px;
        width: 960px;
        height: 1260px;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .dark-card {
        position: absolute;
        inset: 0;
        background: #141414;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(20, 20, 20, 0.35);
        border: 4px solid #141414;
      }

      .photo-viewport {
        position: absolute;
        inset: 16px;
        border-radius: 12px;
        overflow: hidden;
        background: #1c1c1c;
      }

      .photo-img {
        position: absolute;
        top: -60px;
        left: -30px;
        width: 1020px;
        height: 1380px;
        object-fit: cover;
        will-change: transform;
      }

      /* Chi tiết băng keo collage thủ công dán góc */
      .tape-corner {
        position: absolute;
        width: 150px;
        height: 40px;
        background: rgba(245, 240, 228, 0.75);
        backdrop-filter: blur(2px);
        border: 1px dashed rgba(20, 20, 20, 0.2);
        z-index: 5;
      }
      .tape-tl {
        top: 10px;
        left: -30px;
        transform: rotate(-32deg);
      }
      .tape-tr {
        top: 10px;
        right: -30px;
        transform: rotate(32deg);
      }

      /* Overlay cảnh báo từ chối */
      .ban-icon-wrap {
        position: absolute;
        top: 560px;
        left: 470px;
        width: 140px;
        height: 140px;
        z-index: 20;
        will-change: transform, opacity;
        transform-origin: 50% 50%;
      }

      .ban-badge {
        width: 140px;
        height: 140px;
        background: rgba(20, 20, 20, 0.88);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 3px solid #ff6a1a;
        box-shadow: 0 12px 32px rgba(255, 106, 26, 0.35);
      }

      .ban-badge svg {
        width: 86px;
        height: 86px;
      }

      /* Label: TỪ CHỐI BẪY NỢ */
      .refuse-label-wrap {
        position: absolute;
        top: 730px;
        left: 200px;
        width: 680px;
        display: flex;
        justify-content: center;
        z-index: 25;
        will-change: transform, opacity;
      }

      .refuse-badge {
        background: #141414;
        border: 3px solid #ff6a1a;
        border-radius: 12px;
        padding: 16px 36px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      }

      .refuse-badge span {
        font-size: 42px;
        font-weight: 900;
        color: #f7f4ec;
        letter-spacing: 2px;
        text-transform: uppercase;
        display: block;
      }

      /* PHASE 2: Con đường văn phòng / Ô cửa kính chính ngạch */
      .office-card-wrap {
        position: absolute;
        top: 190px;
        left: 60px;
        width: 960px;
        height: 1280px;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
        z-index: 30;
      }

      .office-card {
        position: absolute;
        inset: 0;
        background: #ffffff;
        border-radius: 24px;
        border: 4px solid #141414;
        box-shadow: 0 28px 70px rgba(20, 20, 20, 0.22);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Khung thẻ nhân viên văn phòng cao cấp */
      .id-header {
        height: 130px;
        background: #141414;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 50px;
        border-bottom: 6px solid #ff6a1a;
      }

      .id-logo-text {
        color: #f7f4ec;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 1.5px;
      }

      .id-badge-tag {
        background: #ff6a1a;
        color: #141414;
        font-size: 20px;
        font-weight: 900;
        padding: 8px 18px;
        border-radius: 6px;
        letter-spacing: 1px;
      }

      .id-body {
        flex: 1;
        position: relative;
        background: #fdfbf7;
        padding: 60px 50px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .id-avatar-slot {
        width: 380px;
        height: 380px;
        background: #f5f0e4;
        border: 4px dashed #141414;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      .id-avatar-bg-pattern {
        position: absolute;
        inset: 0;
        background-size: 24px 24px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.05) 1px, transparent 1px);
      }

      .person-icon-wrap {
        position: relative;
        width: 200px;
        height: 200px;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .person-icon-wrap svg {
        width: 170px;
        height: 170px;
      }

      .id-meta-group {
        margin-top: 40px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .id-meta-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid rgba(20, 20, 20, 0.1);
        padding-bottom: 12px;
      }

      .meta-title {
        font-size: 24px;
        font-weight: 700;
        color: rgba(20, 20, 20, 0.55);
        text-transform: uppercase;
      }

      .meta-value {
        font-size: 28px;
        font-weight: 900;
        color: #141414;
      }

      /* Punch Phrase: LÀM NHÂN VIÊN VĂN PHÒNG */
      .punch-phrase-container {
        margin-top: 50px;
        width: 100%;
        background: #141414;
        border-radius: 16px;
        padding: 32px 30px;
        text-align: center;
        border-left: 12px solid #ff6a1a;
        box-shadow: 0 14px 30px rgba(20, 20, 20, 0.2);
        will-change: transform, opacity;
      }

      .punch-phrase-text {
        margin: 0;
        font-size: 58px;
        font-weight: 900;
        line-height: 1.25;
        color: #f7f4ec;
        text-transform: uppercase;
        letter-spacing: -0.5px;
      }

      .punch-sub-highlight {
        display: block;
        margin-top: 8px;
        font-size: 30px;
        font-weight: 700;
        color: #ff6a1a;
        letter-spacing: 2px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s23"
      data-width="1080"
      data-height="1920"
      data-duration="6.04"
    >
      <!-- Layer nền ngà card & grain -->
      <div class="bg-paper">
        <div class="bg-grid-overlay"></div>
      </div>

      <!-- Main Clip Container -->
      <section id="scene-s23" class="clip" data-start="0" data-duration="6.04">
        <div class="stage-perspective">
          
          <!-- PHASE 1: Bẫy nợ mafia & hợp đồng ép buộc -->
          <div class="dark-card-wrap" id="dark-card-wrap">
            <div class="tape-corner tape-tl"></div>
            <div class="tape-corner tape-tr"></div>
            <div class="dark-card">
              <div class="photo-viewport">
                <img
                  src="assets/img-06-predatory-loan-contract-cats.jpeg"
                  alt="Mèo từ chối bẫy nợ"
                  class="photo-img"
                  id="photo-img"
                />
              </div>
            </div>

            <!-- Icon Cấm (Ban) vẽ tay -->
            <div class="ban-icon-wrap" id="ban-icon-wrap">
              <div class="ban-badge">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle
                    id="ban-circle"
                    cx="50"
                    cy="50"
                    r="40"
                    stroke="#FF6A1A"
                    stroke-width="10"
                    stroke-linecap="round"
                  />
                  <line
                    id="ban-line"
                    x1="22"
                    y1="22"
                    x2="78"
                    y2="78"
                    stroke="#FF6A1A"
                    stroke-width="10"
                    stroke-linecap="round"
                  />
                </svg>
              </div>
            </div>

            <!-- Label: TỪ CHỐI BẪY NỢ -->
            <div class="refuse-label-wrap" id="refuse-label-wrap">
              <div class="refuse-badge">
                <span>TỪ CHỐI BẪY NỢ</span>
              </div>
            </div>
          </div>

          <!-- PHASE 2: Thẻ nhân viên văn phòng chính ngạch -->
          <div class="office-card-wrap" id="office-card-wrap">
            <div class="office-card">
              <div class="id-header">
                <span class="id-logo-text">CÔNG TY CÁ TƯƠI</span>
                <span class="id-badge-tag">CHÍNH NGẠCH</span>
              </div>
              <div class="id-body">
                <div class="id-avatar-slot">
                  <div class="id-avatar-bg-pattern"></div>
                  <!-- Icon Person vẽ nét chuẩn phong cách Vox -->
                  <div class="person-icon-wrap">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <!-- Đầu -->
                      <circle
                        id="person-head"
                        cx="50"
                        cy="32"
                        r="18"
                        stroke="#FF6A1A"
                        stroke-width="7"
                      />
                      <!-- Thân áo sơ mi -->
                      <path
                        id="person-body"
                        d="M 18 90 C 18 64 34 58 50 58 C 66 58 82 64 82 90"
                        stroke="#141414"
                        stroke-width="8"
                        stroke-linecap="round"
                      />
                      <!-- Cà vạt công sở -->
                      <path
                        id="person-tie"
                        d="M 45 60 L 55 60 L 53 82 L 50 86 L 47 82 Z"
                        fill="#FF6A1A"
                        stroke="#FF6A1A"
                        stroke-width="2"
                      />
                    </svg>
                  </div>
                </div>

                <div class="id-meta-group">
                  <div class="id-meta-row">
                    <span class="meta-title">Vị trí</span>
                    <span class="meta-value">Nhân Viên Chính Thức</span>
                  </div>
                  <div class="id-meta-row">
                    <span class="meta-title">Mục tiêu</span>
                    <span class="meta-value">Kiếm Cá Mua Nhà</span>
                  </div>
                </div>

                <!-- Punch phrase -->
                <div class="punch-phrase-container" id="punch-container">
                  <h1 class="punch-phrase-text">LÀM NHÂN VIÊN VĂN PHÒNG</h1>
                  <span class="punch-sub-highlight">TỰ DO TÀI CHÍNH</span>
                </div>
              </div>
            </div>
          </div>

        </div>
      </section>

      <!-- Signature Orange Bar ở đáy -->
      <div class="brand-bottom-bar"></div>
    </div>

    <script>
      // Đăng ký timeline GSAP paused tất định
      const tl = gsap.timeline({ paused: true });

      // Thiết lập ban đầu cho các nét vẽ SVG
      const banCircle = document.getElementById("ban-circle");
      const banLine = document.getElementById("ban-line");
      const personHead = document.getElementById("person-head");
      const personBody = document.getElementById("person-body");
      const personTie = document.getElementById("person-tie");

      if (banCircle && banLine) {
        const circleLen = banCircle.getTotalLength();
        banCircle.style.strokeDasharray = circleLen;
        banCircle.style.strokeDashoffset = circleLen;

        const lineLen = banLine.getTotalLength();
        banLine.style.strokeDasharray = lineLen;
        banLine.style.strokeDashoffset = lineLen;
      }

      if (personHead && personBody) {
        const headLen = personHead.getTotalLength();
        personHead.style.strokeDasharray = headLen;
        personHead.style.strokeDashoffset = headLen;

        const bodyLen = personBody.getTotalLength();
        personBody.style.strokeDasharray = bodyLen;
        personBody.style.strokeDashoffset = bodyLen;
      }

      // Khởi tạo trạng thái ban đầu cho các layer bằng GSAP fromTo an toàn
      // 1. PHASE 1: Transition In "flip" (0.0s -> 0.7s)
      tl.fromTo(
        "#dark-card-wrap",
        {
          rotateY: -65,
          scale: 0.88,
          opacity: 0,
          x: -120,
        },
        {
          rotateY: 0,
          scale: 1,
          opacity: 1,
          x: 0,
          duration: 0.75,
          ease: "power3.out",
        },
        0.05
      );

      // Camera pan-left nhẹ trên ảnh (quét sang trái nhấn mạnh chú mèo từ chối)
      tl.fromTo(
        "#photo-img",
        { x: 30 },
        {
          x: -50,
          duration: 3.4,
          ease: "sine.out",
        },
        0.1
      );

      // Icon Ban xuất hiện lúc 0.55s (theo Shotlist atMs: 208250 -> 550ms)
      tl.fromTo(
        "#ban-icon-wrap",
        { scale: 0, opacity: 0, rotation: -45 },
        {
          scale: 1,
          opacity: 1,
          rotation: 0,
          duration: 0.45,
          ease: "back.out(1.5)",
        },
        0.55
      );

      if (banCircle && banLine) {
        tl.to(
          banCircle,
          {
            strokeDashoffset: 0,
            duration: 0.4,
            ease: "power2.out",
          },
          0.65
        );
        tl.to(
          banLine,
          {
            strokeDashoffset: 0,
            duration: 0.3,
            ease: "power2.out",
          },
          0.85
        );
      }

      // Label: TỪ CHỐI BẪY NỢ xuất hiện lúc 1.32s (Shotlist atMs: 209020 -> 1320ms)
      tl.fromTo(
        "#refuse-label-wrap",
        { y: 50, opacity: 0, scale: 0.9 },
        {
          y: 0,
          opacity: 1,
          scale: 1,
          duration: 0.5,
          ease: "power3.out",
        },
        1.32
      );

      // 2. CHUYỂN TIẾP REVERSAL: Tách khỏi mafia, bước vào văn phòng (3.4s -> 3.9s)
      // Dark card trượt sang trái và lật ra khỏi khung
      tl.to(
        "#dark-card-wrap",
        {
          x: -600,
          rotateY: 45,
          scale: 0.85,
          opacity: 0,
          duration: 0.65,
          ease: "power3.in",
        },
        3.4
      );

      // Office card (Phase 2) lật vào từ phải
      tl.fromTo(
        "#office-card-wrap",
        {
          x: 400,
          rotateY: -55,
          scale: 0.88,
          opacity: 0,
        },
        {
          x: 0,
          rotateY: 0,
          scale: 1,
          opacity: 1,
          duration: 0.75,
          ease: "power3.out",
        },
        3.55
      );

      // Icon Person tự vẽ xuất hiện lúc 3.89s (Shotlist atMs: 211590 -> 3890ms)
      if (personHead && personBody) {
        tl.to(
          personHead,
          {
            strokeDashoffset: 0,
            duration: 0.35,
            ease: "power2.out",
          },
          3.89
        );
        tl.to(
          personBody,
          {
            strokeDashoffset: 0,
            duration: 0.45,
            ease: "power2.out",
          },
          4.05
        );
      }

      tl.fromTo(
        "#person-tie",
        { scale: 0, opacity: 0, transformOrigin: "50% 0%" },
        {
          scale: 1,
          opacity: 1,
          duration: 0.3,
          ease: "back.out(1.4)",
        },
        4.25
      );

      // Punch Phrase: LÀM NHÂN VIÊN VĂN PHÒNG xuất hiện lúc 4.44s (Shotlist atMs: 212140 -> 4440ms)
      // Giữ chắc chắn đến hết scene 6.04s (hold 1.6s)
      tl.fromTo(
        "#punch-container",
        {
          y: 40,
          opacity: 0,
          scale: 0.95,
        },
        {
          y: 0,
          opacity: 1,
          scale: 1,
          duration: 0.5,
          ease: "power3.out",
        },
        4.44
      );

      // Gán timeline gốc vào window.__timelines
      window.__timelines["scene-s23"] = tl;
    </script>
  
    </template>
  </body>
</html>
