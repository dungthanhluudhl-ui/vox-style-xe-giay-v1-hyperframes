        p.style.strokeDasharray = `${len} ${len}`;
        p.style.strokeDashoffset = `${len}`;

        { scale: 1.05 },
        { scale: 1.22, duration: 6.2, ease: "sine.out" },
        0.1
      );
      // Metadata header entrance
      tl.fromTo(
        "#s1-header",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.05
      );
      // Status pill badge entrance
      tl.fromTo(
        "#s1-status",
        { scale: 0.8, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        0.2
      );

      // Shot 1 Overlay Label: "TIỀN BẨN NGHẼN LƯU THÔNG" (2.78s - 4.98s)
      tl.fromTo(
        "#s1-label-card",
        { scale: 0.92, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        2.78

        "#s1-label-card",
        { scale: 1, opacity: 1, y: 0 },
        { scale: 0.96, opacity: 0, y: -15, duration: 0.25, ease: "power2.in" },
        4.70

      // --- SHOT 2 CHOREOGRAPHY (6.3s - 11.81s) ---

        "#s2-img",
        { x: 40, scale: 1.15 },

        6.35

        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },

      // Status pill badge entrance

        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.28, ease: "power3.out" },
        9.55

      tl.fromTo(

        { scale: 1, opacity: 1, y: 0 },
        { scale: 0.96, opacity: 0, y: -15, duration: 0.25, ease: "power2.in" },

      tl.fromTo(

        { opacity: 1, scale: 1 },
        { opacity: 0, scale: 0.9, duration: 0.22, ease: "power2.in" },
        11.35

      window.__timelines["scene-s14"] = tl;
