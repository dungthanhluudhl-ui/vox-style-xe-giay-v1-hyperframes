<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background: #141414;
        color: #F7F4EC;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #141414;
      }

      /* Video layer */
      #vid-01 {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center bottom;
        will-change: transform;
      }

      /* Style DNA - Texture overlays */
      .spotlight-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          circle at 50% 68%,
          rgba(231, 227, 217, 0.04) 0%,
          rgba(20, 20, 20, 0.5) 48%,
          rgba(12, 12, 12, 0.88) 100%
        );
        mix-blend-mode: multiply;
      }

      .grid-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.2) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.2) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        mix-blend-mode: multiply;
        opacity: 0.6;
      }

      .vignette-frame {
        position: absolute;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 160px rgba(10, 10, 10, 0.85);
      }

      /* Standard clip contract */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Strike transition */
      #strike-slash {
        position: absolute;
        top: -200px;
        left: -300px;
        width: 1600px;
        height: 2400px;
        background: linear-gradient(
          115deg,
          transparent 35%,
          rgba(255, 106, 26, 0.9) 47%,
          #141414 53%,
          transparent 65%
        );
        transform: rotate(-12deg);
        will-change: transform, opacity;
      }

      /* BAN overlay card */
      .ban-card {
        position: absolute;
        top: 360px;
        left: 80px;
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 16px 28px;
        background: rgba(20, 20, 20, 0.94);
        border: 2px solid #FF6A1A;
        border-radius: 12px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
        will-change: transform, opacity;
      }

      .ban-svg {
        display: block;
      }

      .ban-text-wrap {
        display: flex;
        flex-direction: column;
      }

      .ban-subtitle {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 3px;
        color: #FF6A1A;
        text-transform: uppercase;
      }

      .ban-status {
        font-size: 32px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 1px;
      }

      /* Flow diagram SVG */
      .flow-svg {
        position: absolute;
        inset: 0;
        width: 1008px;
        height: 1920px;
        pointer-events: none;
      }

      /* Callout cards (Labels) */
      .callout-card {
        position: absolute;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 18px 28px;
        background: rgba(20, 20, 20, 0.92);
        border: 2px solid rgba(255, 106, 26, 0.85);
        border-left: 8px solid #FF6A1A;
        border-radius: 8px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
        will-change: transform, opacity;
      }

      #label-avoid-inner {
        top: 650px;
        left: 80px;
      }

      #label-secret-inner {
        top: 1120px;
        left: 80px;
      }

      .callout-indicator {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .indicator-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #FF6A1A;
      }

      .indicator-tag {
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 3px;
        color: #FF6A1A;
        text-transform: uppercase;
      }

      .callout-text {
        font-size: 36px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 1px;
        line-height: 1.25;
      }

      /* Punch Phrase container */
      .punch-box {
        position: absolute;
        top: 240px;
        left: 60px;
        right: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 32px 36px;
        background: rgba(20, 20, 20, 0.95);
        border: 3px solid #FF6A1A;
        border-radius: 16px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
        will-change: transform, opacity;
      }

      .punch-badge {
        display: inline-block;
        background: #FF6A1A;
        padding: 6px 20px;
        border-radius: 6px;
        margin-bottom: 16px;
      }

      .punch-badge-text {
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 4px;
        color: #141414;
        text-transform: uppercase;
      }

      .punch-text {
        margin: 0;
        font-size: 64px;
        font-weight: 900;
        color: #F7F4EC;
        line-height: 1.3;
        letter-spacing: 1px;
      }

      .punch-subbar {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 106, 26, 0.4);
      }

      .punch-subtext {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #FF6A1A;
      }

      /* Style DNA - Signature bottom orange bar */
      .brand-bottom-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 10px;
        background: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s14"
      data-width="1080"
      data-height="1920"
      data-duration="6.02"
    >
      <!-- Media Layer: Fit 9:16 focusing on smuggler cat at lower area -->
      <video
        id="vid-01"
        data-start="0"
        data-duration="6.02"
        data-media-start="1"
        muted
        playsinline
        preload="auto"
        src="assets/vid-01-smuggling-customs-cat-cutout.mp4"
      ></video>

      <!-- Background Variant: Spotlight + Noir Texture -->
      <div class="spotlight-layer"></div>
      <div class="grid-layer"></div>
      <div class="vignette-frame"></div>

      <!-- Strike Transition Entrance (0s - 0.35s) -->
      <div id="clip-strike" class="clip" data-start="0" data-duration="0.35">
        <div id="strike-slash"></div>
      </div>

      <!-- Overlay 1: BAN Icon on Main Checkpoint (0.52s - 2.72s) -->
      <div id="clip-ban" class="clip" data-start="0.52" data-duration="2.2">
        <div id="ban-inner" class="ban-card">
          <div class="ban-icon-wrap">
            <svg class="ban-svg" viewBox="0 0 80 80" width="80" height="80">
              <circle cx="40" cy="40" r="32" fill="none" stroke="#FF6A1A" stroke-width="8" />
              <line x1="17" y1="17" x2="63" y2="63" stroke="#FF6A1A" stroke-width="8" stroke-linecap="round" />
            </svg>
          </div>
          <div class="ban-text-wrap">
            <div class="ban-subtitle">CỔNG CHÍNH</div>
            <div class="ban-status">KHÓA KIỂM SOÁT</div>
          </div>
        </div>
      </div>

      <!-- Overlay 2: Flow diagram of bypassing diversion route (1.00s - 5.30s) -->
      <div id="clip-flow" class="clip" data-start="1.0" data-duration="4.3">
        <svg class="flow-svg" viewBox="0 0 1080 1920">
          <defs>
            <marker
              id="flow-arrow-head"
              viewBox="0 0 12 12"
              refX="10"
              refY="6"
              markerWidth="10"
              markerHeight="10"
              orient="auto-start-reverse"
            >
              <path d="M 0 1 L 12 6 L 0 11 z" fill="#FF6A1A" />
            </marker>
          </defs>
          <path
            id="detour-path"
            d="M 280 470 C 130 600, 140 840, 320 950 C 420 1010, 470 1080, 490 1150"
            fill="none"
            stroke="#FF6A1A"
            stroke-width="8"
            stroke-linecap="round"
            stroke-linejoin="round"
            marker-end="url(#flow-arrow-head)"
          />
        </svg>
      </div>

      <!-- Overlay 3: Label "NÉ TRÁNH CỔNG CHÍNH" (1.77s - 3.77s) -->
      <div id="clip-label-1" class="clip" data-start="1.77" data-duration="2.0">
        <div id="label-avoid-inner" class="callout-card">
          <div class="callout-indicator">
            <span class="indicator-dot"></span>
            <span class="indicator-tag">LỐI ĐI CHÍNH</span>
          </div>
          <div class="callout-text">NÉ TRÁNH CỔNG CHÍNH</div>
        </div>
      </div>

      <!-- Overlay 4: Label "TUỒN QUA ĐƯỜNG MÒN" (3.30s - 5.30s) -->
      <div id="clip-label-2" class="clip" data-start="3.30" data-duration="2.0">
        <div id="label-secret-inner" class="callout-card">
          <div class="callout-indicator">
            <span class="indicator-dot"></span>
            <span class="indicator-tag">CỬA SAU CHỢ ĐÊM</span>
          </div>
          <div class="callout-text">TUỒN QUA ĐƯỜNG MÒN</div>
        </div>
      </div>

      <!-- Overlay 5: Punch Phrase "HÀNH VI BUÔN LẬU" (4.42s - 6.02s) -->
      <div id="clip-punch" class="clip" data-start="4.42" data-duration="1.6">
        <div id="punch-card" class="punch-box">
          <div class="punch-badge">
            <span class="punch-badge-text">KẾT LUẬN ĐỊNH NGHĨA</span>
          </div>
          <h1 class="punch-text">HÀNH VI BUÔN LẬU</h1>
          <div class="punch-subbar">
            <span class="punch-subtext">LÁCH HẢI QUAN • VẬN CHUYỂN NGẦM</span>
          </div>
        </div>
      </div>

      <!-- Brand Signature: Bottom Orange Bar -->
      <div class="brand-bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Camera motion: slow pan-right on video background
      tl.fromTo(
        "#vid-01",
        { scale: 1.12, x: -35, y: 0 },
        { scale: 1.12, x: 35, y: 0, duration: 6.02, ease: "sine.inOut" },
        0
      );

      // Strike cut entrance (0s - 0.3s)
      tl.fromTo(
        "#strike-slash",
        { x: -1400, opacity: 1 },
        { x: 1400, opacity: 0, duration: 0.32, ease: "power4.out" },
        0
      );

      // BAN icon overlay entrance & exit (0.52s - 2.72s)
      tl.fromTo(
        "#ban-inner",
        { scale: 0.75, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        0.52
      );
      tl.to(
        "#ban-inner",
        { opacity: 0, y: -15, duration: 0.28, ease: "power2.in" },
        2.42
      );

      // SVG path drawing for diversion flow route (starts 1.1s)
      const detourPath = document.getElementById("detour-path");
      if (detourPath) {
        const len = detourPath.getTotalLength();
        detourPath.style.strokeDasharray = len;
        detourPath.style.strokeDashoffset = len;
        tl.fromTo(
          detourPath,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 1.05, ease: "power2.out" },
          1.1
        );
      }

      // Label 1: "NÉ TRÁNH CỔNG CHÍNH" entrance & exit (1.77s - 3.77s)
      tl.fromTo(
        "#label-avoid-inner",
        { scale: 0.88, opacity: 0, x: -30 },
        { scale: 1, opacity: 1, x: 0, duration: 0.42, ease: "power3.out" },
        1.77
      );
      tl.to(
        "#label-avoid-inner",
        { opacity: 0, x: -20, duration: 0.28, ease: "power2.in" },
        3.47
      );

      // Label 2: "TUỒN QUA ĐƯỜNG MÒN" entrance & exit (3.30s - 5.30s)
      tl.fromTo(
        "#label-secret-inner",
        { scale: 0.88, opacity: 0, x: -30 },
        { scale: 1, opacity: 1, x: 0, duration: 0.42, ease: "power3.out" },
        3.3
      );
      tl.to(
        "#label-secret-inner",
        { opacity: 0, x: -20, duration: 0.28, ease: "power2.in" },
        5.0
      );

      // Punch Phrase: "HÀNH VI BUÔN LẬU" stamp entrance (4.42s - 6.02s)
      tl.fromTo(
        "#punch-card",
        { scale: 1.14, opacity: 0, y: -24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.36, ease: "power4.out" },
        4.42
      );

      // Register master timeline
      window.__timelines["scene-s14"] = tl;
    </script>
  
    </template>
  </body>
</html>
