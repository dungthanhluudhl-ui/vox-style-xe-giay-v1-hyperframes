        letter-spacing: 2px;

        background-color: #141414;

      }

      .hero-image-zoom-box {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .hero-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 30%;

      .split-badge {
        position: absolute;
        bottom: 20px;

        border: 4px solid #ff6a1a;

      .label-badge {

        font-size: 22px;
        padding: 6px 14px;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 1.5px;

      }

      .label-text {

        line-height: 1.2;
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* Overlay 2: Punch Phrase Row (Placed safely in y: 1140px - 1320px, well above caption band 1390px) */
      .punch-row {
        position: absolute;
        top: 1140px;
        left: 0;
        right: 0;
        height: 180px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
      }

      .punch-plate {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 22px 40px;
        border-radius: 8px;
        border: 4px solid #141414;
        box-shadow: 12px 12px 0px rgba(20, 20, 20, 0.95);
        text-align: center;
      }

      .punch-kicker {
        font-weight: 900;
        font-size: 24px;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 6px 16px;
        border-radius: 4px;
        margin-bottom: 10px;
      }

      .punch-title {
        font-weight: 900;
        font-size: 58px;
        line-height: 1.25;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .punch-line {
        width: 100%;
        height: 6px;
        background-color: #ff6a1a;
        margin-top: 12px;
        transform-origin: center;
      }

      /* Bottom Brand Strip */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 50;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s44"
      data-width="1080"
      data-height="1920"
      data-duration="7"
    >
      <!-- Base Scene Clip -->
      <section id="scene-base" class="clip" data-start="0" data-duration="7">
        <div class="spotlight-bg"></div>

        <div class="editorial-header">
          <div class="case-tag hf-hl-orange">HỒ SƠ KINH TẾ</div>
          <div class="case-number hf-plate-paper">GIAI ĐOẠN 02</div>
        </div>

        <div id="hero-card" class="hero-card-container">
          <div class="hero-card-frame">
            <div id="image-scaler" class="hero-image-zoom-box">
              <img
                src="assets/img-12-economic-crisis-cat-illustration.jpeg"

                class="hero-image"
              />
            </div>
            <div class="split-badge hf-hl-orange">ĐỐI LẬP KINH TẾ</div>
          </div>
        </div>
      </section>

      <!-- Overlay 1: Label (0.9s - 3.2s) -->
      <section id="overlay-label" class="clip" data-start="0.9" data-duration="2.3">
        <div class="label-row">
          <div id="label-box" class="label-plate hf-plate-ink">
            <span class="label-badge hf-hl-orange">HỆ QUẢ</span>
            <span class="label-text hf-text-light">TRẮNG TAY SAU CÚ LỪA</span>
          </div>
        </div>

      <!-- Overlay 2: Punch Phrase (3.3s - 7.0s) -->
      <section id="overlay-punch" class="clip" data-start="3.3" data-duration="3.7">
        <div class="punch-row">
          <div id="punch-box" class="punch-plate hf-plate-ink">
            <div class="punch-kicker hf-hl-orange">THỊ TRƯỜNG ĐÓNG BĂNG</div>
            <div class="punch-title hf-text-light">SỨC MUA TÊ LIỆT</div>

        </div>

      <!-- Fixed Signature Bottom Bar -->
      <div id="brand-bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Wobble-drop entrance for hero card
      tl.fromTo(
        "#hero-card",
        { y: -120, rotation: -3, scale: 0.94, opacity: 0 },
        { y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
        0.15
      );

      // 2. Continuous camera zoom-in
      tl.fromTo(
        "#image-scaler",
        { scale: 1.0 },
        { scale: 1.08, duration: 7.0, ease: "none" },
        0
      );

      // 3. Header badge entrance
      tl.fromTo(
        ".editorial-header",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.3
      );

      // 4. Overlay 1: TRẮNG TAY SAU CÚ LỪA (Starts at 0.9s, exits at 2.9s)
      tl.fromTo(
        "#label-box",
        { y: 24, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        0.9
      );
      tl.to(
        "#label-box",
        { y: -20, opacity: 0, duration: 0.25, ease: "power2.in" },
        2.9
      );

      // 5. Overlay 2: SỨC MUA TÊ LIỆT (Starts at 3.3s, holds till end)
      tl.fromTo(
        "#punch-box",
        { scale: 0.92, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        3.3
      );
      tl.fromTo(
        "#punch-underline",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power2.out" },
        3.7
      );

      window.__timelines["scene-s44"] = tl;
    </script>
  
    </template>
