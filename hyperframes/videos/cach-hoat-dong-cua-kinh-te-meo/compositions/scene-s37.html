    <script>
      // Single paused GSAP timeline for HyperFrames deterministic seeking
      const tl = gsap.timeline({ paused: true });

      // Path length calculations for SVG self-drawing
      const shieldPath = document.getElementById("shield-path");
      const fishSymbol = document.getElementById("fish-symbol");
      const risePath = document.getElementById("rise-path");
      const warningPath = document.getElementById("warning-path");

      if (shieldPath) {
        const len = shieldPath.getTotalLength();
        shieldPath.style.strokeDasharray = len;
        shieldPath.style.strokeDashoffset = len;
      }
      if (fishSymbol) {
        const len = fishSymbol.getTotalLength();
        fishSymbol.style.strokeDasharray = len;
        fishSymbol.style.strokeDashoffset = len;
      }
      if (risePath) {
        const len = risePath.getTotalLength();
        risePath.style.strokeDasharray = len;
        risePath.style.strokeDashoffset = len;
      }
      if (warningPath) {
        const len = warningPath.getTotalLength();
        warningPath.style.strokeDasharray = len;
        warningPath.style.strokeDashoffset = len;
      }

      // Initial States (Explicit fromTo endpoints for seeking stability)
      gsap.set("#hero-wrapper", { transformPerspective: 1200 });
      gsap.set("#shield-overlay", { opacity: 0, scale: 0.6 });
      gsap.set("#beat-profit", { opacity: 0 });
      gsap.set("#profit-badge", { y: 32, opacity: 0 });
      gsap.set("#beat-risk", { opacity: 0 });
      gsap.set("#risk-badge", { y: 32, opacity: 0 });
      gsap.set("#beat-punch", { opacity: 0 });
      gsap.set("#punch-card", { scale: 0.88, opacity: 0, y: 24 });
      gsap.set("#flow-arrows", { opacity: 0 });

      // ----------------------------------------------------
      // Continuous Ken Burns Pan & Zoom across 9.07s
      // ----------------------------------------------------
      tl.fromTo(
        "#hero-img",
        { scale: 1.18, x: -30, y: -10 },
        { scale: 1.05, x: 25, y: 10, duration: 9.07, ease: "none" },
        0
      );

      // ----------------------------------------------------
      // Scene Unfold Entrance (t = 0.1s -> 0.85s)
      // ----------------------------------------------------
      tl.fromTo(
        "#hero-wrapper",
        { opacity: 0, rotationX: -18, y: -40, scale: 0.94 },
        { opacity: 1, rotationX: 0, y: 0, scale: 1, duration: 0.75, ease: "power3.out" },
        0.1
      );

      tl.fromTo(
        "#header-tag",
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0.25
      );

      // ----------------------------------------------------
      // BEAT 1: LỢI NHUẬN TĂNG CAO (t = 1.41s -> 4.65s)
      // ----------------------------------------------------
      tl.fromTo(
        "#beat-profit",
        { opacity: 0 },
        { opacity: 1, duration: 0.2 },
        1.41
      );

      tl.fromTo(
        "#rise-path",
        { strokeDashoffset: risePath ? risePath.getTotalLength() : 100 },
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        1.41
      );

      // Label "LỢI NHUẬN TĂNG CAO" at t = 2.46s
      tl.fromTo(
        "#profit-badge",
        { y: 32, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        2.46
      );

      // Transition Beat 1 out completely at t = 4.35s -> fully gone at 4.65s
      tl.to(
        "#beat-profit",
        { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" },
        4.35
      );

      // ----------------------------------------------------
      // BEAT 2: TRÁNH RỦI RO VỐN TỰ CÓ + SHIELD OVERLAY (t = 4.85s -> 7.20s)
      // ----------------------------------------------------
      tl.fromTo(
        "#beat-risk",
        { opacity: 0 },
        { opacity: 1, duration: 0.2 },
        4.85
      );

      tl.fromTo(
        "#warning-path",
        { strokeDashoffset: warningPath ? warningPath.getTotalLength() : 100 },
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        4.85
      );

      // Shield Overlay reveal (using power3.out for smooth, confident arrival - no bounce)
      tl.fromTo(
        "#shield-overlay",
        { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        5.05
      );

      tl.fromTo(
        "#shield-path",
        { strokeDashoffset: shieldPath ? shieldPath.getTotalLength() : 350 },
        { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
        5.15
      );

      tl.fromTo(
        "#fish-symbol",
        { strokeDashoffset: fishSymbol ? fishSymbol.getTotalLength() : 150 },
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        5.45
      );

      // Label "TRÁNH RỦI RO VỐN TỰ CÓ" at t = 6.04s
      tl.fromTo(
        "#risk-badge",
        { y: 32, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        6.04
      );

      // Transition Beat 2 out at t = 6.90s -> completely at opacity 0 by 7.20s
      // (ensuring zero overlap with Beat 3 which starts at 7.39s)
      tl.to(
        "#beat-risk",
        { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" },
        6.90
      );

      // ----------------------------------------------------
      // BEAT 3: PUNCH PHRASE - GỌI VỐN BÊN NGOÀI (t = 7.39s -> 9.07s)
      // ----------------------------------------------------
      // Flow diagram connecting outward capital at t = 7.25s
      tl.fromTo(
        "#flow-arrows",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power2.out" },
        7.25
      );

      tl.fromTo(
        "#beat-punch",
        { opacity: 0 },
        { opacity: 1, duration: 0.2 },
        7.39
      );

      tl.fromTo(
        "#punch-card",
        { scale: 0.88, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        7.39
      );

      // Subtle scale pulse on "BÊN NGOÀI" using absolute values (deterministic, no repeat conflict)
      tl.fromTo(
        ".punch-highlight",
        { scale: 1 },
        { scale: 1.05, duration: 0.25, ease: "power2.out" },
        7.85
      );
      tl.to(
        ".punch-highlight",
        { scale: 1, duration: 0.25, ease: "power2.in" },
        8.10
      );

      // Register the paused timeline with HyperFrames
      window.__timelines["scene-s37"] = tl;
    </script>
