      // Khởi tạo GSAP timeline ở trạng thái paused theo HyperFrames contract

      // 1. Trạng thái khởi tạo tường minh (Explicit initial states để render tất định khi seek)

      gsap.set("#phone-mockup", { scale: 0.94, opacity: 0 });
      gsap.set("#chat-alert", { scale: 0, opacity: 0 });
      gsap.set("#trap-jaw-top", { y: -300, opacity: 0 });
      gsap.set("#trap-jaw-bottom", { y: 300, opacity: 0 });
      gsap.set("#overlay-phone-icon", { scale: 0, opacity: 0 });
      gsap.set("#overlay-chat-label", { scale: 0.85, opacity: 0, x: -20 });
      gsap.set("#overlay-warning-icon", { scale: 0, opacity: 0 });
      gsap.set("#overlay-trap-label", { scale: 0.85, opacity: 0, y: 25 });
      gsap.set("#overlay-deposit-danger", { scale: 0, opacity: 0 });
      gsap.set("#punch-card", { scale: 0.85, opacity: 0 });
      gsap.set("#dramatic-spotlight", { opacity: 0 });

      // 2. Camera slow zoom-in suốt 9.05s

      // 3. Entrance: Vỡ mảnh Shatter bung ra ngoài (0.02s -> 0.65s)

      tl.to("#sh-2", { x: 450, y: -450, rotation: 30, opacity: 0, duration: 0.65, ease: "power4.out" }, 0.02);
      tl.to("#sh-3", { x: -400, y: 150, rotation: -25, opacity: 0, duration: 0.65, ease: "power4.out" }, 0.05);
      tl.to("#sh-4", { x: 450, y: 180, rotation: 25, opacity: 0, duration: 0.65, ease: "power4.out" }, 0.05);
      tl.to("#sh-5", { x: -420, y: 480, rotation: -40, opacity: 0, duration: 0.65, ease: "power4.out" }, 0.08);
