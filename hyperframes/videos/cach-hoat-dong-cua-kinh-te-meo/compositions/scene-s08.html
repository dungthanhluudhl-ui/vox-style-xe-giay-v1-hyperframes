    <div

    <script>
      const tl = gsap.timeline({ paused: true });

      const cutPath = document.getElementById("tax-cut-path");
      if (cutPath) {
        const pathLen = cutPath.getTotalLength();
        cutPath.style.strokeDasharray = pathLen + " " + pathLen;
        cutPath.style.strokeDashoffset = pathLen;
      }

      // 1. CÚ MÁY ZOOM-THROUGH (CẮT CỨNG TỪ SCALE 1.18 -> ZOOM-OUT CHẬM)
      tl.fromTo(
        "#camera-rig",
        { scale: 1.18 },
        { scale: 1.04, duration: 0.45, ease: "power3.out" },
        0
      );
      tl.to("#camera-rig", { scale: 1.0, duration: 6.59, ease: "none" }, 0.45);

      // 2. HEADER & DIAGRAM CARD VÀO CẢNH
      tl.fromTo("#header-tag", { y: -25, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.15);
      tl.fromTo("#diagram-card", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.25);
      tl.fromTo("#fish-mountain-base", { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.4);

      // 3. OVERLAY 1: TIỀN & LỢI NHUẬN KHỦNG (0.97s & 1.48s, THOÁT LÚC 2.4s)
      tl.fromTo("#overlay-profit", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.97);
      tl.fromTo("#profit-text", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 1.48);
      tl.to("#overlay-profit", { opacity: 0, y: -15, duration: 0.2 }, 2.4);

      // 4. OVERLAY 2: TRÁT THUẾ (2.57s & 3.05s)
      tl.fromTo("#overlay-tax-claim", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 2.57);
      tl.fromTo("#tax-claim-text", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 3.05);

      // 5. LƯỠI KÉO THUẾ TIẾN VÀO & CẮT NÚI CÁ (3.25s)
      tl.fromTo("#tax-scissors", { x: 100, y: -40, opacity: 0, rotation: 25 }, { x: 0, y: 0, opacity: 1, rotation: -10, duration: 0.45, ease: "power3.out" }, 3.25);
      tl.to("#tax-scissors", { rotation: -20, scale: 1.08, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.inOut" }, 3.55);

      // 6. ĐƯỜNG CẮT RẠCH & PHẦN CÁ BỊ XÉN TÁCH LÌA
      if (cutPath) {
        tl.to("#tax-cut-path", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 3.6);
      }
      tl.fromTo("#fish-mountain-cut", { x: 0, y: 0, opacity: 0 }, { x: 30, y: 20, opacity: 1, duration: 0.4, ease: "power3.out" }, 3.8);

      // 7. CON DẤU NỘP THUẾ ĐÓNG XUỐNG & NHẤP NHÁY BÁO ĐỘNG (4.15s)
      tl.fromTo("#alarm-stamp", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out" }, 4.15);
      tl.to("#alarm-stamp", { boxShadow: "0 0 20px #FF6A1A", duration: 0.18, yoyo: true, repeat: 3 }, 4.45);

      // 8. PUNCH PHRASE "NGUY CƠ MẤT VỐN CÁ" (4.97s -> 7.04s)
      tl.fromTo("#punch-card", { scale: 0.9, y: 35, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: "power4.out" }, 4.97);

      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s08"] = tl;
    </script>
