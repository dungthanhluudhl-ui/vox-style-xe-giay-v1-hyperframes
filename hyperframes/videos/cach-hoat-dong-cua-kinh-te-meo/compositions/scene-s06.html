    <!-- SHOT 1: VIDEO HOẠT HỌA GIAO DỊCH NGẦM (t: 0s -> 4.84s) -->

    <section

      <div id="shot2-hero-wrap">

    <div

    <!-- OVERLAY SHOT 2-B: BIỂU TƯỢNG CẢNH BÁO VÀ KẾT LUẬN THAM NHŨNG (t: 8.54s -> 9.74s) -->
    <div
      id="overlay-shot2-warning"

      style="z-index: 35; pointer-events: none;"
    >

          <svg id="warning-svg" width="94" height="94" viewBox="0 0 100 100" style="flex-shrink: 0;">
            <polygon id="warn-tri" points="50,14 92,86 8,86" fill="none" stroke="#FF6A1A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
            <line id="warn-line" x1="50" y1="36" x2="50" y2="60" stroke="#FF6A1A" stroke-width="8" stroke-linecap="round" />
            <circle id="warn-dot" cx="50" cy="74" r="5" fill="#FF6A1A" />

          <div style="display: flex; flex-direction: column; gap: 4px;">

  <script>
    // Khởi tạo GSAP Timeline chính xác theo hợp đồng HyperFrames
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // 1. CHOREOGRAPHY CHO SHOT 1 (0s -> 4.84s)
    // Hiệu ứng vào cảnh wobble-drop cho video
    tl.fromTo(
      "#shot1-wobble",
      { y: -70, rotation: -2.5, opacity: 0 },
      { y: 0, rotation: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
      0
    );

    // Camera chuyển động zoom chậm vào giỏ cá trên bàn
    tl.fromTo(
      "#shot1-camera",
      { scale: 1.0 },
      { scale: 1.15, duration: 4.84, ease: "sine.inOut" },
      0
    );

    // Nhãn 1: "LỆNH TRUY BẮT" xuất hiện tại 1.48s
    tl.fromTo(
      "#badge-warrant-wrap",
      { scale: 0.85, y: -25, opacity: 0 },
      { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      1.48
    );
    tl.to(
      "#badge-warrant-wrap",
      { opacity: 0, y: -15, duration: 0.25, ease: "power2.in" },
      3.00
    );

    // Nhãn 2: "GIAO DỊCH DƯỚI BÀN" xuất hiện tại 3.86s
    tl.fromTo(
      "#badge-deal-wrap",
      { x: -35, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      3.86
    );

    // 2. CHOREOGRAPHY CHO SHOT 2 (4.84s -> 9.74s)
    // Chuyển cảnh dứt khoát (hard cut) sang bức tranh liên minh, chuyển động drift nhẹ
    tl.fromTo(
      "#img-14",
      { scale: 1.0 },
      { scale: 1.05, duration: 4.90, ease: "sine.out" },
      4.84
    );

    // Punch-phrase "THỎA THUẬN ĂN CHIA" tại 5.94s
    tl.fromTo(
      "#punch-card-wrap",
      { y: 35, scale: 0.96, opacity: 0 },
      { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      5.94
    );
    tl.to(
      "#punch-card-wrap",
      { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
      7.75
    );

    // Chuẩn bị đường vẽ icon cảnh báo (SVG self-drawing)
    const warnTri = document.getElementById("warn-tri");
    const warnLine = document.getElementById("warn-line");
    if (warnTri && warnLine) {
      const triLength = warnTri.getTotalLength();
      warnTri.style.strokeDasharray = triLength;
      warnTri.style.strokeDashoffset = triLength;

      const lineLength = warnLine.getTotalLength();
      warnLine.style.strokeDasharray = lineLength;
      warnLine.style.strokeDashoffset = lineLength;

      // Card cảnh báo hiện lên tại 8.54s
      tl.fromTo(
        "#warning-card-wrap",
        { scale: 0.88, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        8.54
      );

      // Icon vẽ dần
      tl.fromTo(
        "#warn-tri",
        { strokeDashoffset: triLength },
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        8.60
      );
      tl.fromTo(
        "#warn-line",
        { strokeDashoffset: lineLength },
        { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" },
        8.85
      );
      tl.fromTo(
        "#warn-dot",
        { scale: 0, transformOrigin: "50% 50%" },
        { scale: 1, duration: 0.22, ease: "power3.out" },
        9.05
      );
    }

    // Đăng ký timeline gốc vào HyperFrames
    window.__timelines["scene-s06"] = tl;
  </script>
