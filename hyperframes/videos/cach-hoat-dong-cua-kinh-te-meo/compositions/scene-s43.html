    // HyperFrames Animation Contract: Paused Timeline registered synchronously
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // 1. Setup SVG stroke lengths deterministically
    const pathElements = [
      "#branch-line-1", "#branch-line-2", "#branch-line-3",
      "#sub-line-1a", "#sub-line-1b", "#sub-line-2a", "#sub-line-2b", "#sub-line-3a", "#sub-line-3b",
      "#sub3-line-1", "#sub3-line-2", "#sub3-line-3", "#sub3-line-4", "#sub3-line-5", "#sub3-line-6",
      "#web-arc-1", "#web-arc-2", "#web-arc-3"
    ];

    pathElements.forEach(function(selector) {
      const el = document.querySelector(selector);
      if (el && el.getTotalLength) {
        const len = el.getTotalLength();
        el.style.strokeDasharray = len + "";
        el.style.strokeDashoffset = len + "";
      }
    });

    // 2. Timeline at t=0: Initialize deterministic start states for all elements
    const allNodes = [
      "#node-apex",
      "#node-branch-1", "#node-branch-2", "#node-branch-3",
      "#node-sub-1", "#node-sub-2", "#node-sub-3", "#node-sub-4", "#node-sub-5", "#node-sub-6",
      "#node-sub3-1", "#node-sub3-2", "#node-sub3-3", "#node-sub3-4", "#node-sub3-5", "#node-sub3-6"
    ];

    tl.set("#diagram-svg", { autoAlpha: 1 }, 0);
    tl.set(allNodes, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, 0);
    tl.set("#overlay-seminar", { opacity: 0 }, 0);
    tl.set("#overlay-crowd-card", { opacity: 0 }, 0);
    tl.set("#punch-group", { opacity: 0 }, 0);

    // 3. Camera Stage: Spiral Entrance Animation (0.0s -> 0.9s)
    // Animating #camera-stage (child wrapper) instead of .clip element
    tl.fromTo(
      "#camera-stage",
      { rotation: -4, scale: 1.12, opacity: 0 },
      { rotation: 0, scale: 1, opacity: 1, duration: 0.9, ease: "power3.out" },
      0
    );

    // Continuous Pan-Right Camera Motion on Image (0.0s -> 8.12s)
    tl.to(
      "#media-pan",
      { x: -80, duration: 8.12, ease: "none" },
      0
    );

    // 4. OVERLAY 1: Phone Icon (at 0.82s) & Label "HỘI THẢO ĐỔI VẬN MỆNH" (at 1.65s)
    tl.fromTo(
