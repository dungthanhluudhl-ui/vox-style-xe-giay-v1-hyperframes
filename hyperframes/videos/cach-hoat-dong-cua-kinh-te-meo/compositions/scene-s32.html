<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Nền lưới giấy ngà đặc trưng Vox */
      .bg-canvas {
        position: absolute;
        inset: 0;
        background-color: #e7e3d9;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        z-index: 1;
      }
      .grain-overlay {
        position: absolute;
        inset: 0;
        opacity: 0.15;
        mix-blend-mode: multiply;
        pointer-events: none;
        z-index: 2;
      }

      /* Thanh cam thương hiệu cố định mép đáy */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 16px;
        background-color: #ff6a1a;
        z-index: 100;
      }

      /* Phối cảnh 3D cho hiệu ứng Flip Entrance */
      .perspective-stage {
        position: absolute;
        inset: 0;
        perspective: 1200px;
        z-index: 10;
        transform-style: preserve-3d;
      }

      /* Header hồ sơ tín dụng / pháp lý */
      .meta-header {
        position: absolute;
        top: 170px;
        left: 70px;
        right: 70px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #141414;
        padding-bottom: 12px;
        z-index: 15;
      }
      .meta-badge {
        background-color: #141414;
        color: #f7f4ec;
        font-size: 22px;
        font-weight: 700;
        padding: 6px 16px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .meta-sub {
        font-size: 20px;
        font-weight: 700;
        color: #141414;
        letter-spacing: 1px;
      }

      /* Khung video tư liệu cắt dán (Collage Art Frame) */
      .video-card {
        position: absolute;
        top: 240px;
        left: 70px;
        width: 940px;
        height: 980px;
        background-color: #141414;
        border: 4px solid #141414;
        box-shadow: 14px 14px 0px #ff6a1a, 14px 14px 0px 4px #141414;
        overflow: hidden;
        transform-origin: center center;
        will-change: transform, opacity;
      }
      .video-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .video-wrapper video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: center center;
      }

      /* Băng keo dán ghi chú (Paper tape) */
      .tape-label {
        position: absolute;
        top: 18px;
        left: 20px;
        background-color: #f5f0e4;
        border: 2px solid #141414;
        padding: 8px 18px;
        font-size: 24px;
        font-weight: 900;
        color: #141414;
        box-shadow: 4px 4px 0px #141414;
        transform: rotate(-1.5deg);
        z-index: 5;
      }

      /* Punch Phrase: BIỆN PHÁP THẾ CHẤP */
      .punch-container {
        position: absolute;
        top: 680px;
        left: 110px;
        width: 860px;
        background-color: #141414;
        border: 4px solid #ff6a1a;
        box-shadow: 8px 8px 0px rgba(20, 20, 20, 0.85);
        padding: 24px 30px;
        text-align: center;
        z-index: 30;
        opacity: 0;
        will-change: transform, opacity;
      }
      .punch-text {
        font-size: 58px;
        font-weight: 900;
        line-height: 1.25;
        color: #f7f4ec;
        margin: 0;
        letter-spacing: 1.5px;
      }
      .punch-accent-bar {
        height: 8px;
        background-color: #ff6a1a;
        margin-top: 14px;
        transform-origin: left center;
      }

      /* Flow Quy trình Thế chấp - Giải ngân */
      .flow-section {
        position: absolute;
        top: 1260px;
        left: 70px;
        width: 940px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        z-index: 20;
      }

      /* Card Bước 1: ĐƯA CHUNG CƯ BẢO LÃNH */
      .step-card {
        flex: 1;
        background-color: #141414;
        border: 3px solid #141414;
        box-shadow: 6px 6px 0px #ff6a1a;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        opacity: 0;
        will-change: transform, opacity;
      }
      .step-tag {
        align-self: flex-start;
        background-color: #ff6a1a;
        color: #141414;
        font-size: 18px;
        font-weight: 900;
        padding: 4px 10px;
        letter-spacing: 1px;
      }
      .step-title {
        color: #f7f4ec;
        font-size: 26px;
        font-weight: 900;
        line-height: 1.3;
        margin: 0;
      }

      /* Mũi tên liên kết Flow */
      .flow-arrow-box {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 60px;
        opacity: 0;
      }
      .flow-arrow-svg {
        width: 48px;
        height: 48px;
      }

      /* Card Bước 2: NGÂN HÀNG GIẢI NGÂN */
      .step-card-success {
        flex: 1;
        background-color: #141414;
        border: 3px solid #ff6a1a;
        box-shadow: 6px 6px 0px #141414;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        opacity: 0;
        will-change: transform, opacity;
      }
      .step-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .step-tag-white {
        background-color: #f5f0e4;
        color: #141414;
        font-size: 18px;
        font-weight: 900;
        padding: 4px 10px;
        letter-spacing: 1px;
      }
      .check-icon-svg {
        width: 32px;
        height: 32px;
      }
      .step-title-accent {
        color: #f7f4ec;
        font-size: 26px;
        font-weight: 900;
        line-height: 1.3;
        margin: 0;
      }
    </style>

    <!-- SVG Filter tạo hạt giấy grain thủ công không dùng ảnh ngoài -->
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
      <filter id="noise">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
      </filter>
    </svg>

    <div
      id="root"
      data-composition-id="scene-s32"
      data-width="1080"
      data-height="1920"
      data-duration="7.94"
    >
      <!-- Lớp nền phong cách phóng sự điều tra Vox -->
      <div class="bg-canvas"></div>
      <div class="grain-overlay" style="filter: url(#noise);"></div>
      <div class="brand-bottom-bar"></div>

      <!-- Không gian phối cảnh cho hiệu ứng chuyển động -->
      <div class="perspective-stage">
        <!-- Thanh tiêu đề hồ sơ pháp lý -->
        <div class="meta-header" id="meta-header">
          <span class="meta-badge">QUY TRÌNH TÍN DỤNG</span>
          <span class="meta-sub">HỒ SƠ: S32 // CƠ CHẾ VAY</span>
        </div>

        <!-- Khung video tài liệu thực tế (vid-07) -->
        <div class="video-card" id="main-card">
          <div class="video-wrapper">
            <video
              id="cat-video"
              src="assets/vid-07-cat-bank-loan-cutout.mp4"
              data-start="0"
              data-duration="7.94"
              muted
              playsinline
            ></video>
          </div>
          <!-- Nhãn tem ghim góc -->
          <div class="tape-label">TÀI SẢN: CHUNG CƯ MINI</div>
        </div>

        <!-- Punch phrase: Điểm nhấn trọng tâm định nghĩa -->
        <div class="punch-container" id="punch-box">
          <h1 class="punch-text">BIỆN PHÁP THẾ CHẤP</h1>
          <div class="punch-accent-bar" id="punch-bar"></div>
        </div>

        <!-- Flowchart liên kết cơ chế: Đưa bảo lãnh -> Giải ngân -->
        <div class="flow-section">
          <!-- Bước 1: ĐƯA CHUNG CƯ BẢO LÃNH -->
          <div class="step-card" id="step1-card">
            <div class="step-tag">BƯỚC 1</div>
            <p class="step-title">ĐƯA CHUNG CƯ BẢO LÃNH</p>
          </div>

          <!-- Mũi tên chuyển giao tài sản -->
          <div class="flow-arrow-box" id="flow-arrow">
            <svg class="flow-arrow-svg" viewBox="0 0 48 48" fill="none">
              <path
                d="M10 24H38M38 24L26 12M38 24L26 36"
                stroke="#FF6A1A"
                stroke-width="5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>

          <!-- Bước 2: NGÂN HÀNG GIẢI NGÂN kèm check mark -->
          <div class="step-card-success" id="step2-card">
            <div class="step-header-row">
              <div class="step-tag-white">BƯỚC 2</div>
              <svg class="check-icon-svg" viewBox="0 0 32 32" fill="none">
                <circle cx="16" cy="16" r="14" fill="#FF6A1A" />
                <path
                  id="check-path"
                  d="M9 16.5L14 21.5L23 11"
                  stroke="#141414"
                  stroke-width="3.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <p class="step-title-accent">NGÂN HÀNG GIẢI NGÂN</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Thiết lập nét vẽ checkmark theo chiều dài thực tế (svg-path-draw)
      const checkPath = document.getElementById("check-path");
      let pathLen = 30;
      if (checkPath && checkPath.getTotalLength) {
        pathLen = Math.ceil(checkPath.getTotalLength());
        checkPath.style.strokeDasharray = pathLen + "px";
        checkPath.style.strokeDashoffset = pathLen + "px";
      }

      // Khởi tạo timeline chính thức cho HyperFrames
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance: Hiệu ứng Flip 3D bước vào cảnh (0.0s - 0.7s)
      tl.fromTo(
        "#main-card",
        { rotationY: -35, rotationX: 10, scale: 0.86, opacity: 0 },
        { rotationY: 0, rotationX: 0, scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
        0
      );
      tl.fromTo(
        "#meta-header",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.2
      );

      // 2. Camera zoom-in liên tục trên video tài liệu
      tl.fromTo(
        "#cat-video",
        { scale: 1 },
        { scale: 1.08, duration: 7.94, ease: "none" },
        0
      );

      // 3. Overlay 1: Nhãn "ĐƯA CHUNG CƯ BẢO LÃNH" (atMs: 289960 -> t = 3.20s, hold: 2.40s)
      tl.fromTo(
        "#step1-card",
        { scale: 0.85, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        3.20
      );

      // 4. Overlay 2: Punch Phrase "BIỆN PHÁP THẾ CHẤP" (atMs: 291200 -> t = 4.44s, hold: 1.80s)
      tl.fromTo(
        "#punch-box",
        { scale: 0.88, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        4.44
      );
      tl.fromTo(
        "#punch-bar",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "power2.out" },
        4.65
      );
      // Kết thúc thời gian hiển thị punch phrase (4.44 + 1.80 = 6.24s)
      tl.to(
        "#punch-box",
        { opacity: 0, scale: 0.95, y: -10, duration: 0.35, ease: "power2.in" },
        6.24
      );

      // 5. Mũi tên luồng giải ngân kích hoạt sau khi hoàn tất bảo lãnh
      tl.fromTo(
        "#flow-arrow",
        { opacity: 0, x: -10 },
        { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" },
        5.40
      );

      // Giảm độ nổi bật của bước 1 để nhường sự chú ý cho bước giải ngân (at 5.60s)
      tl.to(
        "#step1-card",
        { opacity: 0.65, duration: 0.3, ease: "power1.out" },
        5.60
      );

      // 6. Overlay 3: Icon "check" (atMs: 292580 -> t = 5.82s, hold: 2.20s)
      if (checkPath) {
        tl.fromTo(
          "#check-path",
          { strokeDashoffset: pathLen },
          { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
          5.82
        );
      }

      // 7. Overlay 4: "NGÂN HÀNG GIẢI NGÂN" (atMs: 293120 -> t = 6.36s, hold: 1.58s)
      tl.fromTo(
        "#step2-card",
        { scale: 0.86, opacity: 0, x: -15 },
        { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        6.36
      );

      // Đăng ký timeline cho HyperFrames seek engine
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s32"] = tl;
    </script>
  
    </template>
  </body>
</html>
