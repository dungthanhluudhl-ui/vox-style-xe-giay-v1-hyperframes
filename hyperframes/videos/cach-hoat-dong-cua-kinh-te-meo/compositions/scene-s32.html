      0.35
    );
    tl.to(

      { y: -20, opacity: 0, duration: 0.3, ease: "power2.in" },
      1.55
    );

    // 3. Breakdown Clip Animation (Inside clip-breakdown, start 2.0s)

      "#breakdown-plate",
      { y: 40, opacity: 0, scale: 0.96 },
      { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
      2.05

      { x: -50, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.45, stagger: 0.14, ease: "power3.out" },
      2.3
    );

      6.35
    );

      { scale: 0.86, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      6.95
    );

      "#punch-stamp",
      { scale: 1.4, opacity: 0, rotation: -12 },
      { scale: 1, opacity: 1, rotation: -3, duration: 0.4, ease: "power3.out" },
      7.3
    );
