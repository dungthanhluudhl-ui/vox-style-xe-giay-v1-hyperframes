    .compare-card.card-goods {

    .compare-card.card-money {

    .compare-title {
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .compare-metric {
      font-size: 34px;
      font-weight: 900;
      line-height: 1.1;
    }

    /* Vùng chứa Punch Phrase và Label ở dải an toàn Y: 1070px - 1360px */
    .editorial-lower-zone {
      position: absolute;
      top: 1070px;
      left: 60px;
      width: 960px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 30;
    }

    /* Label phụ tối đa 4 từ */
    .editorial-label {
      align-self: flex-start;
      padding: 10px 22px;
      background-color: #141414;
      border-radius: 8px;
      box-shadow: 4px 4px 0px rgba(20, 20, 20, 0.4);

    .editorial-label-text {
      font-size: 26px;
      font-weight: 900;
      color: #F7F4EC;
      letter-spacing: 1.5px;
      text-transform: uppercase;

    /* Khối Punch-phrase chính cỡ lớn */
    .punch-card {
      padding: 24px 32px;

    .punch-text {

    .punch-highlight {
      color: #FF6A1A;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s47"
    data-width="1080"
    data-height="1920"
    data-duration="10.22"
    data-fps="30"
  >
    <!-- Nền dạng đồ thị theo Style DNA (chart variant) -->
    <div class="chart-background">
      <div class="chart-grid-line line-20"></div>
      <div class="chart-grid-line line-40"></div>
      <div class="chart-grid-line line-60"></div>
      <div class="chart-grid-line line-80"></div>
      <div class="chart-tick tick-20"></div>
      <div class="chart-tick tick-40"></div>
      <div class="chart-tick tick-60"></div>
      <div class="chart-tick tick-80"></div>
    </div>

    <!-- Thanh cam cố định nhận diện thương hiệu -->
    <div class="brand-bottom-bar"></div>

    <!-- SHOT 1 (t = 0.00s đến 5.21s): Hiệu ứng nới lỏng tiền tệ làm kinh tế nhích lên -->
    <section id="shot-1" class="clip" data-start="0" data-duration="5.21">
      <div class="header-badge" id="s1-badge">
        <span class="header-badge-tag">GIAI ĐOẠN 1</span>
        <span class="header-badge-title">KÍCH CẦU THỊ TRƯỜNG</span>
      </div>

      <!-- Khung tranh collage có hiệu ứng camera Pan-left -->
      <div class="hero-collage-frame" id="s1-frame">
        <div class="hero-media-wrapper" id="s1-media">
          <img
            class="hero-media-img"
            src="assets/img-21-paper-cutout-money-printing-inflation.jpeg"
            alt="May in tien kich thich kinh te"
          />
        </div>

        <!-- Biểu đồ đường vẽ tăng trưởng kinh tế -->
        <svg class="chart-overlay-svg" viewBox="0 0 960 760">
          <path
            id="s1-curve"
            class="chart-trend-path"
            d="M 80 620 C 300 580, 480 440, 860 220"
          />
        </svg>

        <!-- Thẻ chỉ số thị trường khởi sắc -->
        <div class="metric-badge" id="s1-metric">

          <div class="metric-value">↗ TĂNG TỨC THÌ</div>
        </div>

      <!-- Vùng Punch Phrase của Shot 1 -->

    <!-- SHOT 2 (t = 5.21s đến 10.22s): Núi tiền ngập tràn gây bùng phát lạm phát -->
    <section id="shot-2" class="clip" data-start="5.21" data-duration="5.01">
      <div class="header-badge" id="s2-badge">
        <span class="header-badge-tag">NGHỊCH LÝ</span>
        <span class="header-badge-title">CƠ CHẾ LẠM PHÁT</span>

        <!-- Punch-phrase đỉnh điểm của cảnh -->
        <div class="punch-card" id="s2-punch">

  <script>
    // Chuẩn bị đo độ dài đường path SVG biểu đồ
    const curvePath = document.getElementById("s1-curve");
    if (curvePath) {
      const curveLen = curvePath.getTotalLength();
      curvePath.style.strokeDasharray = curveLen + "";
      curvePath.style.strokeDashoffset = curveLen + "";
    }

    // Đăng ký đúng 1 paused timeline gốc cho HyperFrames
    const tl = gsap.timeline({ paused: true });

    // ==========================================
    // DIỄN HOẠT SHOT 1 (t = 0.00s -> 5.21s)
    // ==========================================

    // Entrance "punch" cho khung hình và badge đầu shot 1
    tl.fromTo(
      "#s1-badge",
      { y: -30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      0.1
    );

    tl.fromTo(
      "#s1-frame",
      { scale: 0.88, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
      0.15
    );

    // Camera motion: pan-left cho ảnh bên trong
    tl.fromTo(
      "#s1-media",
      { x: 30, scale: 1.25 },
      { x: -50, scale: 1.25, duration: 5.0, ease: "none" },
      0.2
    );

    // SVG đường xu hướng kinh tế đi lên vẽ dần (svg-path-draw)
    if (curvePath) {
      tl.to(
        "#s1-curve",
        { strokeDashoffset: 0, duration: 1.6, ease: "power2.out" },
        0.8
      );
    }

    // Thẻ chỉ số thị trường xuất hiện sau khi đường xu hướng nhích lên
    tl.fromTo(
      "#s1-metric",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      1.8
    );

    // Punch-phrase Shot 1: "CHÍNH SÁCH TIỀN TỆ" xuất hiện dứt khoát
    tl.fromTo(
      "#s1-punch",
      { y: 40, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
      3.8
    );

    // ==========================================
    // DIỄN HOẠT SHOT 2 (t = 5.21s -> 10.22s)
    // ==========================================

    // Transition cut tại 5.21s, badge và khung Shot 2 xuất hiện ngay
    tl.fromTo(
      "#s2-badge",
      { y: -20, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
      5.25
    );

    tl.fromTo(
      "#s2-frame",
      { scale: 0.94, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      5.25
    );

    // Camera motion: zoom-out hé lộ quy mô núi tiền giấy
    tl.fromTo(
      "#s2-media",
      { scale: 1.35, y: -20 },
      { scale: 1.05, y: 10, duration: 4.8, ease: "sine.out" },
      5.25
    );

    // Hai thẻ đối nghịch xuất hiện dạng stamp so sánh (Hàng hoá vs Tiền)
    tl.fromTo(
      "#s2-card-goods",
      { scale: 0.8, opacity: 0, y: -15 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      5.9
    );

    tl.fromTo(
      "#s2-card-money",
      { scale: 0.8, opacity: 0, y: -15 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      6.4
    );

    // Label bổ trợ: "HÀNG ÍT : TIỀN NHIỀU"
    tl.fromTo(
      "#s2-label",
      { y: 24, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      7.4
    );

    // Punch-phrase cao trào: "BÙNG PHÁT LẠM PHÁT"
    tl.fromTo(
      "#s2-punch",
      { scale: 0.85, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power4.out" },
      8.6
    );

    // Gắn timeline vào window registry phục vụ render seekable
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s47"] = tl;
  </script>
