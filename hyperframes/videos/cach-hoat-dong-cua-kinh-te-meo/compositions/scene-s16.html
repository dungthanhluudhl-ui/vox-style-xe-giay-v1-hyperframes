    <script>
      const tl = gsap.timeline({ paused: true });

      // Elements
      const stage = document.getElementById("stage-wrapper");
      const zoneA = document.getElementById("zone-domestic");
      const zoneB = document.getElementById("zone-foreign");
      const barrier = document.getElementById("barrier-wall");
      const punchCard = document.getElementById("punch-card");
      const labelMarket = document.getElementById("label-market");
      const iconBanBox = document.getElementById("icon-ban-box");
      const banCircle = document.getElementById("ban-circle");
      const banSlash = document.getElementById("ban-slash");

      const convoy1 = document.getElementById("convoy-1");
      const convoy2 = document.getElementById("convoy-2");
      const convoy3 = document.getElementById("convoy-3");

      const flow1 = document.getElementById("flow-line-1");
      const flow2 = document.getElementById("flow-line-2");
      const flow3 = document.getElementById("flow-line-3");

      // Measure SVG path lengths for ban icon
      const circleLen = banCircle.getTotalLength();
      const slashLen = banSlash.getTotalLength();

      banCircle.style.strokeDasharray = circleLen;
      banCircle.style.strokeDashoffset = circleLen;
      banSlash.style.strokeDasharray = slashLen;
      banSlash.style.strokeDashoffset = slashLen;

      // 1. Initial Transition In: "flip" entrance (0.0s - 0.7s)
      tl.fromTo(
        stage,
        { rotationX: -14, transformPerspective: 1200, opacity: 0, scale: 0.94 },
        { rotationX: 0, opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" },
        0.0
      );

      // Camera motion: slow steady zoom-in as specified in shotlist
      tl.fromTo(
        stage,
        { scale: 1 },
        { scale: 1.04, duration: 6.22, ease: "none" },
        0.7
      );

      // Stagger convoy cards entrance inside Domestic territory
      tl.fromTo(
        [convoy1, convoy2, convoy3],
        { y: -20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, stagger: 0.12, ease: "power2.out" },
        0.35
      );

      // Flow lines activation: convey moving bread trucks outward
      tl.fromTo(
        [flow1, flow2, flow3],
        { opacity: 0 },
        { opacity: 1, duration: 0.4, stagger: 0.1, ease: "power1.out" },
        0.85
      );

      // Convoys start creeping downward along the trade route
      tl.fromTo(
        [convoy1, convoy2, convoy3],
        { y: 0 },
        { y: 35, duration: 1.4, ease: "power1.inOut" },
        1.1
      );

      // Hide barrier, punch card, label, and ban icon initially
      gsap.set(barrier, { y: -80, opacity: 0, scale: 1.15 });
      gsap.set(punchCard, { scale: 0.85, opacity: 0 });
      gsap.set(labelMarket, { y: 24, opacity: 0 });
      gsap.set(iconBanBox, { scale: 0, opacity: 0 });

      // 2. The Blockade (t = 2.68s / 150150ms):
      // The Wall of Law SLAMS down, halting trade flow abruptly!
      tl.fromTo(
        barrier,
        { y: -90, opacity: 0, scale: 1.2 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power4.out" },
        2.68
      );

      // Convoys recoil back upon hitting the legal blockade
      tl.to(
        [convoy1, convoy2, convoy3],
        { y: 15, duration: 0.25, ease: "back.out(2)" },
        2.78
      );

      // Flow lines dim to indicate cutoff
      tl.to(
        [flow1, flow2, flow3],
        { opacity: 0.25, duration: 0.3, ease: "power2.out" },
        2.78
      );

      // Punch Phrase enters firmly (atMs: 150150 -> 2.68s)
      tl.fromTo(
        punchCard,
        { scale: 0.86, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        2.68
      );

      // 3. Label "RÀO CẢN THỊ TRƯỜNG" enters (atMs: 152990 -> 5.52s)
      tl.fromTo(
        labelMarket,
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        5.52
      );

      // 4. Icon "ban" badge pops & draws in (atMs: 153480 -> 6.01s)
      tl.fromTo(
        iconBanBox,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        6.01
      );

      // Progressive SVG path draw for Ban circle & slash
      tl.to(
        banCircle,
        { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
        6.05
      );
      tl.to(
        banSlash,
        { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
        6.35
      );

      // Register master timeline
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s16"] = tl;
    </script>
