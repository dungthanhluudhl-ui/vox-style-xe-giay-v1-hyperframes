    /* Icon SVGs */

      width: 56px;
      height: 56px;
      flex-shrink: 0;
    }
  </style>

  <div

      <!-- Header / Tiêu đề cơ chế -->

        <div class="header-pill">CƠ CHẾ ĐẦU CƠ</div>
        <h1 class="header-title">XẺ THỊT ĐẤT RỪNG</h1>

      <!-- Hero Card: Khung tranh cắt dán Vintage Ken Burns -->
      <div id="hero-card" class="hero-card">
        <div class="hero-img-wrap">
          <img
            id="hero-img"

          <!-- Lớp sơ đồ xẻ nhỏ đất (Diagram Grid Cut) -->
          <div id="diagram-overlay" class="diagram-layer">
            <svg width="100%" height="100%" viewBox="0 0 928 948" style="overflow: visible;">
              <!-- Đường cắt dọc 1 -->
              <line id="cut-v1" class="cut-line" x1="310" y1="0" x2="310" y2="948" />
              <!-- Đường cắt dọc 2 -->
              <line id="cut-v2" class="cut-line" x1="620" y1="0" x2="620" y2="948" />

            <svg class="icon-svg" viewBox="0 0 64 64" fill="none">

              <line x1="10" y1="24" x2="54" y2="24" stroke="#FF6A1A" stroke-width="2"/>
              <line x1="10" y1="38" x2="54" y2="38" stroke="#FF6A1A" stroke-width="2"/>
              <line x1="24" y1="10" x2="24" y2="54" stroke="#FF6A1A" stroke-width="2"/>

        <div id="status-step-3" class="status-card">
          <div class="status-left">

            <svg class="icon-svg" viewBox="0 0 64 64" fill="none">
              <path d="M14 8H38L50 20V56H14V8Z" stroke="#FF6A1A" stroke-width="4" stroke-linejoin="round"/>
              <path d="M38 8V20H50" stroke="#FF6A1A" stroke-width="4"/>

  <script>
    // Khởi tạo GSAP Timeline seekable cho HyperFrames
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Đoạn chuẩn bị SVG line dashoffset để vẽ hoạt họa (Path Draw)
    const cutV1 = document.getElementById("cut-v1");
    const cutV2 = document.getElementById("cut-v2");
    const cutH = document.getElementById("cut-h");
    const docPath = document.getElementById("doc-path");

    if (cutV1 && cutV2 && cutH) {
      cutV1.style.strokeDasharray = "948";
      cutV1.style.strokeDashoffset = "948";
      cutV2.style.strokeDasharray = "948";
      cutV2.style.strokeDashoffset = "948";
      cutH.style.strokeDasharray = "928";
      cutH.style.strokeDashoffset = "928";
    }

    if (docPath) {
      const docLen = docPath.getTotalLength() || 180;
      docPath.style.strokeDasharray = String(docLen);
      docPath.style.strokeDashoffset = String(docLen);
    }

    // 1. CẢNH VÀO (0.0s - 0.6s) - Transition "punch"
    tl.fromTo(
      "#hero-card",
      { scale: 0.92, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
      0
    );
    tl.fromTo(
      "#header-box",
      { y: -30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.15
    );

    // 2. CAMERA MOTION: Ken Burns Pan Right dọc toàn bộ 13s
    tl.fromTo(
      "#hero-img",
      { scale: 1.15, x: -40, y: 0 },
      { scale: 1.25, x: 40, y: -20, duration: 13.0, ease: "none" },
      0
    );

    // Initial state cho các overlay con
    gsap.set("#tag-cheap-land", { scale: 0, opacity: 0 });
    gsap.set(".parcel-badge", { scale: 0, opacity: 0 });
    gsap.set(".parcel-vip", { scale: 0, opacity: 0 });
    gsap.set("#blueprint-overlay", { opacity: 0, scale: 0.92, y: 30 });

    // 3. OVERLAY 1: "GOM ĐẤT TRỐNG GIÁ RẺ" (atMs: 173200 -> t = 2.5s)
    tl.fromTo(
      "#status-step-1",
      { scale: 0.9, opacity: 0, y: 20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      2.5
    );
    tl.fromTo(
      "#tag-cheap-land",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.4)" },
      2.8
    );

    // Bước 1 fade out tại 4.85s (chuẩn bị chuyển sang Bước 2)
    tl.to(
      "#status-step-1",
      { opacity: 0, y: -15, duration: 0.2, ease: "power2.in" },
      4.85
    );
    tl.to(
      "#tag-cheap-land",
      { opacity: 0, scale: 0.8, duration: 0.2, ease: "power2.in" },
      4.85
    );

    // 4. OVERLAY 2: "XẺ NHỎ THÀNH NHIỀU LÔ" (atMs: 175740 -> t = 5.04s)
    // Kèm biểu tượng density và đường xẻ ranh giới đất
    tl.fromTo(
      "#status-step-2",
      { scale: 0.9, opacity: 0, y: 20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      5.04
    );

    // Vẽ đường cắt xẻ đất (SVG Stroke Dashoffset)
    tl.to("#cut-h", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 5.2);
    tl.to("#cut-v1", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 5.4);
    tl.to("#cut-v2", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 5.6);

    // Các lô đất nhảy vọt giá (Stagger reveal)
    tl.fromTo(
      ".parcel-badge",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, stagger: 0.1, ease: "power3.out" },
      5.8
    );
    tl.fromTo(
      ".parcel-vip",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.5)" },
      6.3
    );

    // Bước 2 mờ dần chuyển tiếp tại 9.4s
    tl.to(
      "#status-step-2",
      { opacity: 0, y: -15, duration: 0.25, ease: "power2.in" },
      9.4
    );
    tl.to(
      "#diagram-overlay",
      { opacity: 0.35, duration: 0.4, ease: "power2.out" },
      9.4
    );

    // 5. OVERLAY 3: "THIẾT KẾ DỰ ÁN ẢO" + Icon doc (atMs: 180420 -> 9.72s & 181860 -> 11.16s)
    // Bản vẽ dự án ảo xuất hiện tại 9.72s
    tl.fromTo(
      "#blueprint-overlay",
      { opacity: 0, scale: 0.9, y: 30 },
      { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" },
      9.72
    );
    if (docPath) {
      tl.to(docPath, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 9.9);
    }

    // Label chính thức "THIẾT KẾ DỰ ÁN ẢO" xuất hiện tại 11.16s
    tl.fromTo(
      "#status-step-3",
      { scale: 0.9, opacity: 0, y: 20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      11.16
    );

    // Đăng ký timeline cho HyperFrames seek runtime
    window.__timelines["scene-s20"] = tl;
  </script>
