<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        padding: 0;
        background: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #F5F0E4; /* Biến thể nền card phẳng phong cách Vox */
      }

      /* Quy ước clip của HyperFrames */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Bảng màu an toàn WCAG chuẩn Vox */
      .hf-text-ink {
        color: #141414;
      }
      .hf-text-light {
        color: #F7F4EC;
      }
      .hf-hl-orange {
        background-color: #FF6A1A;
        color: #141414;
      }
      .hf-plate-ink {
        background-color: #141414;
        color: #F7F4EC;
      }
      .hf-plate-paper {
        background-color: #E7E3D9;
        color: #141414;
      }

      /* Thanh nhận diện cam cố định đáy khung hình */
      #vox-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }

      /* Viền phong cách tài liệu / hồ sơ quy hoạch */
      .doc-border-frame {
        position: absolute;
        inset: 24px;
        border: 2px solid rgba(20, 20, 20, 0.18);
        pointer-events: none;
      }

      .crosshair {
        position: absolute;
        width: 18px;
        height: 18px;
      }
      .crosshair::before, .crosshair::after {
        content: "";
        position: absolute;
        background-color: rgba(20, 20, 20, 0.45);
      }
      .crosshair::before {
        top: 8px;
        left: 0;
        width: 18px;
        height: 2px;
      }
      .crosshair::after {
        top: 0;
        left: 8px;
        width: 2px;
        height: 18px;
      }
      .crosshair-tl { top: 32px; left: 32px; }
      .crosshair-tr { top: 32px; right: 32px; }
      .crosshair-bl { bottom: 44px; left: 32px; }
      .crosshair-br { bottom: 44px; right: 32px; }

      /* Khối hồ sơ dự án chính */
      #document-container {
        position: absolute;
        top: 170px;
        left: 50px;
        width: 980px;
        height: 1260px;
        display: flex;
        flex-direction: column;
      }

      /* Header tài liệu */
      .doc-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 16px;
        border-bottom: 2px solid #141414;
        margin-bottom: 18px;
      }

      .doc-title-block {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .doc-tag-dot {
        width: 14px;
        height: 14px;
        background-color: #FF6A1A;
      }

      .doc-ref-text {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .doc-sub-text {
        font-size: 18px;
        font-weight: 700;
        color: rgba(20, 20, 20, 0.7);
        letter-spacing: 1px;
      }

      /* Khung ảnh hero (Bản vẽ quy hoạch & Báo chí) */
      .hero-image-wrapper {
        position: relative;
        width: 980px;
        height: 1100px;
        background-color: #141414;
        overflow: hidden;
        border: 4px solid #141414;
      }

      #hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: center center;
      }

      /* Tem kỹ thuật đồ họa kiểu bản vẽ */
      .blueprint-legend {
        position: absolute;
        top: 20px;
        left: 20px;
        padding: 8px 18px;
        background-color: #141414;
        color: #F7F4EC;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 1px;
        border-left: 6px solid #FF6A1A;
        z-index: 10;
      }

      /* ========================================================
         OVERLAY 1: LABEL "BẢN VẼ HÀO NHOÁNG" (at 2.34s - hold 2.0s)
         ======================================================== */
      .overlay-lane {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
      }

      #overlay-label-container {
        position: absolute;
        top: 860px;
        left: 50px;
        width: 980px;
        display: flex;
        justify-content: center;
      }

      .label-plate {
        background-color: #141414;
        padding: 24px 44px;
        border-radius: 4px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        border-top: 6px solid #FF6A1A;
      }

      .label-kicker {
        padding: 4px 14px;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        border-radius: 2px;
      }

      .label-heading {
        font-size: 54px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: -0.5px;
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* ========================================================
         OVERLAY 2: PUNCH-PHRASE "TRUYỀN THÔNG BƠM THỔI" (at 4.94s - hold 2.2s)
         ======================================================== */
      #overlay-punch-container {
        position: absolute;
        top: 920px;
        left: 50px;
        width: 980px;
        display: flex;
        justify-content: center;
      }

      .punch-plate {
        background-color: #141414;
        padding: 32px 52px;
        border-radius: 6px;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        border: 3px solid #FF6A1A;
      }

      .punch-kicker {
        padding: 6px 18px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .punch-heading {
        font-size: 66px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: -1px;
        text-transform: uppercase;
        white-space: nowrap;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s20"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.18"
    >
      <!-- Dải cam đáy khung hình đặc trưng phong cách Vox -->
      <div id="vox-bottom-bar"></div>

      <!-- Khung viền và dấu ngắm kỹ thuật phong cách tài liệu quy hoạch -->
      <div class="doc-border-frame"></div>
      <div class="crosshair crosshair-tl"></div>
      <div class="crosshair crosshair-tr"></div>
      <div class="crosshair crosshair-bl"></div>
      <div class="crosshair crosshair-br"></div>

      <!-- ========================================================
           SHOT S20-1 NỀN CHÍNH: HỒ SƠ QUY HOẠCH & ẢNH MINH HOẠ
           ======================================================== -->
      <section id="shot-s20-main" class="clip" data-start="0" data-duration="7.18">
        <div id="document-container">
          <!-- Thanh tiêu đề hồ sơ -->
          <div class="doc-header">
            <div class="doc-title-block">
              <div class="doc-tag-dot"></div>
              <div class="doc-ref-text hf-text-ink">HỒ SƠ DỰ ÁN 08-B // BẢN ĐỒ PHÂN LÔ</div>
            </div>
            <div class="doc-sub-text">GIAI ĐOẠN 2: TẨY TRẮNG</div>
          </div>

          <!-- Khung ảnh hero: Zoom camera mượt mà xuyên suốt cảnh -->
          <div class="hero-image-wrapper">
            <img
              id="hero-img"
              src="assets/img-15-illegal-forest-land-grab.jpeg"
              alt="Mèo mafia phân lô đất rừng và báo chí bảo chứng"
            />
            <div class="blueprint-legend">QUY HOẠCH ĐÔ THỊ SINH THÁI // DỰ ÁN VÀNG</div>
          </div>
        </div>
      </section>

      <!-- ========================================================
           SHOT S20-1 OVERLAY 1: LABEL "BẢN VẼ HÀO NHOÁNG"
           Thời gian: atMs: 181860, holdMs: 2000 -> data-start="2.34" data-duration="2.0"
           ======================================================== -->
      <section id="overlay-label-clip" class="clip" data-start="2.34" data-duration="2.0">
        <div class="overlay-lane">
          <div id="overlay-label-container">
            <div class="label-plate" id="label-card">
              <div class="label-kicker hf-hl-orange">KIẾN TRÚC SƯ DỰ ÁN</div>
              <div class="label-heading">BẢN VẼ HÀO NHOÁNG</div>
            </div>
          </div>
        </div>
      </section>

      <!-- ========================================================
           SHOT S20-1 OVERLAY 2: PUNCH-PHRASE "TRUYỀN THÔNG BƠM THỔI"
           Thời gian: atMs: 184460, holdMs: 2200 -> data-start="4.94" data-duration="2.2"
           ======================================================== -->
      <section id="overlay-punch-clip" class="clip" data-start="4.94" data-duration="2.2">
        <div class="overlay-lane">
          <div id="overlay-punch-container">
            <div class="punch-plate" id="punch-card">
              <div class="punch-kicker hf-hl-orange">CHIẾN DỊCH PR DỌN ĐƯỜNG</div>
              <div class="punch-heading">TRUYỀN THÔNG BƠM THỔI</div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- GSAP Master Timeline (seekable, deterministic) -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance "rise" của khung tài liệu tổng từ giây 0.05
      tl.fromTo(
        "#document-container",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
        0.05
      );

      // 2. Camera motion "zoom-in" chậm và liền mạch trên ảnh minh họa xuyên suốt 7.18s
      tl.fromTo(
        "#hero-img",
        { scale: 1.0 },
        { scale: 1.15, duration: 7.18, ease: "none" },
        0
      );

      // 3. Overlay 1: "BẢN VẼ HÀO NHOÁNG" (Active từ 2.34s đến 4.34s)
      tl.fromTo(
        "#label-card",
        { scale: 0.86, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        2.34
      );
      tl.to(
        "#label-card",
        { opacity: 0, y: -16, duration: 0.2, ease: "power2.in" },
        4.14
      );

      // 4. Overlay 2: "TRUYỀN THÔNG BƠM THỔI" (Active từ 4.94s đến 7.14s)
      tl.fromTo(
        "#punch-card",
        { scale: 0.88, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
        4.94
      );
      tl.to(
        "#punch-card",
        { opacity: 0, scale: 0.96, duration: 0.2, ease: "power2.in" },
        6.94
      );

      // Đăng ký timeline paused vào window.__timelines["scene-s20"]
      window.__timelines["scene-s20"] = tl;
    </script>
  
    </template>
  </body>
</html>
