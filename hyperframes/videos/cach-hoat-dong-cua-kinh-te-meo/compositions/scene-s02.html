      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }

      /* Video wrapper without data-start to allow seekable camera zooms */
      #video-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 2;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      #vid-19 {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Background chart variant: ruled horizontal lines + orange left ticks (pure visual lines, no text) */
      #chart-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
      }
      .chart-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: rgba(20, 20, 20, 0.32);
      }
      .chart-tick {
        position: absolute;
        left: 0;
        width: 28px;
        height: 6px;
        background: #ff6a1a;
        transform: translateY(-2px);
      }

      /* Standard clip contract */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      /* Safe container positioning for overlay cards */
      .overlay-container {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
      }
      .pos-top {
        top: 360px;
      }
      .pos-mid {
        top: 660px;
      }
      .pos-bot {
        top: 980px;
      }

      /* Solid card designs with strict WCAG contrast */
      .plate-ink {
        background-color: #141414;
        color: #f7f4ec;
        border-radius: 16px;
        padding: 24px 36px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        will-change: transform, opacity;
      }
      .plate-orange {
        background-color: #ff6a1a;
        color: #141414;
        border-radius: 16px;
        padding: 24px 40px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.3);
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        will-change: transform, opacity;
      }

      /* Typography & tags */
      .badge-tag-orange {
        background-color: #ff6a1a;
        color: #141414;
        font-size: 22px;
        font-weight: 900;
        padding: 6px 16px;
        border-radius: 6px;
        letter-spacing: 1px;
        margin-bottom: 12px;
        text-transform: uppercase;
      }
      .badge-tag-ink {
        background-color: #141414;
        color: #f7f4ec;
        font-size: 22px;
        font-weight: 900;
        padding: 6px 16px;
        border-radius: 6px;
        letter-spacing: 1px;
        margin-bottom: 12px;
        text-transform: uppercase;
      }
      .badge-title {
        font-size: 64px;
        font-weight: 900;
        line-height: 1.24;
        margin: 0;
      }
      .punch-title {
        font-size: 72px;
        font-weight: 900;
        line-height: 1.2;
        margin: 0;
      }
      .text-orange {
        color: #ff6a1a;
      }
      .text-ink {
        color: #141414;
      }
      .text-light {
        color: #f7f4ec;
      }

      /* Signature bottom orange bar */
      #bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 100;
      }

    <div

      data-composition-id="scene-s02"
      data-width="1080"
      data-height="1920"
      data-duration="7.79"

      <!-- Video wrapper for deterministic camera zoom -->
      <div id="video-wrapper">
        <video
          id="vid-19"
          src="assets/vid-19-high-profit-cutout-infographic.mp4"
          muted

          data-start="0"
          data-duration="7.79"

        ></video>

      <div id="chart-bg">

        <div class="chart-line" style="top: 1536px;">
          <div class="chart-tick"></div>
        </div>

      <!-- Overlay 1: GIÁ GỐC: 5K (atMs: 14380 -> rel 2.48s, hold 1.8s) -->
      <div id="overlay-1" class="clip" data-start="2.48" data-duration="1.8">
        <div class="overlay-container pos-top">
          <div id="badge-1" class="plate-ink">

      <div id="overlay-2" class="clip" data-start="5.52" data-duration="2.27">

      <div id="overlay-3" class="clip" data-start="6.80" data-duration="0.99">

    <script>
      const tl = gsap.timeline({ paused: true });

      // Camera motion & entrance: grow entrance (0 -> 0.6s) followed by subtle continuous zoom
      tl.fromTo(
        "#video-wrapper",
        { scale: 0.94, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        0
      );
      tl.to(
        "#video-wrapper",
        { scale: 1.06, duration: 7.19, ease: "sine.inOut" },
        0.6
      );

      // Entrance for Overlay 1 badge
      tl.fromTo(
        "#badge-1",
        { scale: 0.85, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        2.48
      );

      // Entrance for Overlay 2 punch phrase badge
      tl.fromTo(
        "#badge-2",
        { scale: 0.85, opacity: 0, y: 40 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        5.52
      );

      // Entrance for Overlay 3 concept label badge (crisp stamp settle)
      tl.fromTo(
        "#badge-3",
        { scale: 1.15, opacity: 0, rotation: -2 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: "power3.out" },
        6.80
      );

      // Register root timeline to HyperFrames runtime
      window.__timelines["scene-s02"] = tl;
