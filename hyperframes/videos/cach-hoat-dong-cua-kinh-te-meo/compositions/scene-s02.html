<!doctype html>

    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Background Video - oversized width prevents white edge leak during pan */
      #bg-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 115%;
        height: 100%;
        max-width: none;
        object-fit: cover;
        z-index: 1;
        filter: contrast(1.08) brightness(0.96);
        pointer-events: none;
      }

      /* Vox Signature Grid Texture (84px square cells) */
      .grid-layer {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.28) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.28) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        mix-blend-mode: multiply;
        pointer-events: none;
        z-index: 2;
      }

      /* Paper Grain Layer */
      .grain-layer {
        position: absolute;
        inset: 0;
        opacity: 0.18;
        mix-blend-mode: multiply;
        pointer-events: none;
        z-index: 3;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      }

      /* Vignette overlay for depth */
      .vignette-layer {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(231, 227, 217, 0.1) 40%, rgba(20, 20, 20, 0.46) 100%);
        pointer-events: none;
        z-index: 4;
      }

      /* Editorial Topic Tag - Safe Zone at top: 175px */
      .editorial-header {
        position: absolute;
        top: 175px;
        left: 80px;
        width: auto;
        height: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 10;
      }
      .topic-badge {
        background-color: #141414;
        color: #F7F4EC;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 8px 18px;
        border-radius: 6px;
      }
      .chapter-text {
        font-size: 20px;
        font-weight: 700;
        color: #141414;
        background-color: #F5F0E4;
        padding: 8px 16px;
        border: 2px solid #141414;
        border-radius: 6px;
      }

      /* Diagram Card: Balance Scale */
      #diagram-card {

      .card-header-bar {

      .card-title {

        font-weight: 900;

        text-transform: uppercase;

      .card-title-dot {

        height: 10px;

      /* Ratio Badge: 6 CẦU ĐỐI 1 CUNG */

      .scale-svg-container {

      /* Punch Phrase Card */
      #punch-phrase-card {

      .punch-eyebrow {

      .punch-headline {

        color: #F7F4EC;
        line-height: 1.15;
        letter-spacing: -1px;
        text-transform: uppercase;
        margin: 0;
      }
      .punch-underline-bar {
        display: block;
        width: 220px;
        height: 8px;
        background-color: #FF6A1A;
        margin: 20px 0 16px 0;
        transform-origin: 0% 50%;

      .punch-subtext {
        font-size: 28px;
        font-weight: 700;
        color: #E7E3D9;
        margin: 0;
        line-height: 1.35;
      }

      /* Monopoly Baker Cat Label - explicit height: auto prevents inheritance bug */
      #label-monopoly {
        position: absolute;
        top: 1160px;
        left: 80px;
        width: auto;
        height: auto;
        display: inline-flex;
        align-items: center;
        gap: 16px;
        background-color: #FF6A1A;
        color: #141414;
        border: 3.5px solid #141414;
        border-radius: 12px;
        box-shadow: 8px 8px 0px #141414;
        padding: 18px 32px;
        z-index: 25;
        transform-origin: 0% 50%;
      }
      .monopoly-icon {
        width: 36px;
        height: 36px;
      }
      .monopoly-text {
        font-size: 38px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* Signature Vox Orange Bottom Bar */
      .bottom-orange-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s02"
      data-width="1080"
      data-height="1920"
      data-duration="5.13"
    >
      <!-- Direct child timed video clip -->
      <video
        id="bg-video"
        src="assets/vid-15-animated-cat-paper-cutout.mp4"
        muted
        playsinline
        data-start="0"
        data-duration="5.13"
        data-media-start="1.5"
      ></video>

      <!-- Aesthetic Background Texture Overlays -->
      <div class="grid-layer"></div>
      <div class="grain-layer"></div>
      <div class="vignette-layer"></div>

      <!-- Overlays Scene Clip -->
      <div id="overlays-clip" class="clip" data-start="0" data-duration="5.13">
        <!-- Editorial Topic Tag -->
        <div class="editorial-header">
          <div class="topic-badge">KINH TẾ HỌC MÈO</div>
          <div class="chapter-text">QUY LUẬT CUNG - CẦU</div>
        </div>

        <!-- Diagram Card: Balance Scale of Supply and Demand -->
        <div id="diagram-card" data-layout-allow-occlusion="true">
          <div class="card-header-bar">
            <div class="card-title">
              <span class="card-title-dot"></span>
              SƠ ĐỒ CÁN CÂN THỊ TRƯỜNG
            </div>
            <div id="label-ratio">6 CẦU ĐỐI 1 CUNG</div>
          </div>

          <div class="scale-svg-container">
            <svg viewBox="0 0 856 460" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
              <!-- Center Fulcrum Structure (Fixed) -->
              <polygon points="428,210 400,340 456,340" fill="#141414" />
              <rect x="370" y="340" width="116" height="12" rx="4" fill="#141414" />

              <!-- Pivoting Scale Beam Group -->
              <g id="scale-beam-group">
                <!-- Beam Bar -->
                <line x1="90" y1="210" x2="766" y2="210" stroke="#141414" stroke-width="8" stroke-linecap="round" />
                <circle cx="428" cy="210" r="10" fill="#FF6A1A" stroke="#141414" stroke-width="4" />

                <!-- Left Suspension Ropes & Pan (DEMAND / 6 CATS) -->
                <line x1="130" y1="210" x2="130" y2="290" stroke="#141414" stroke-width="3.5" stroke-dasharray="6,4" />
                <path d="M 50 290 Q 130 325 210 290" fill="none" stroke="#141414" stroke-width="6" stroke-linecap="round" />

                <!-- 6 Cats Cluster on Left Pan -->
                <g id="cats-cluster" transform="translate(68, 185)">
                  <!-- Cat 1 (Bottom Left) -->
                  <g transform="translate(0, 50)">
                    <circle cx="16" cy="18" r="14" fill="#141414" />
                    <polygon points="5,8 11,0 17,9" fill="#141414" />
                    <polygon points="15,9 21,0 27,8" fill="#141414" />
                  </g>
                  <!-- Cat 2 (Bottom Mid) -->
                  <g transform="translate(42, 50)">
                    <circle cx="16" cy="18" r="14" fill="#141414" />
                    <polygon points="5,8 11,0 17,9" fill="#141414" />
                    <polygon points="15,9 21,0 27,8" fill="#141414" />
                  </g>
                  <!-- Cat 3 (Bottom Right) -->
                  <g transform="translate(84, 50)">
                    <circle cx="16" cy="18" r="14" fill="#141414" />
                    <polygon points="5,8 11,0 17,9" fill="#141414" />
                    <polygon points="15,9 21,0 27,8" fill="#141414" />
                  </g>
                  <!-- Cat 4 (Mid Left) -->
                  <g transform="translate(20, 22)">
                    <circle cx="16" cy="18" r="14" fill="#141414" />
                    <polygon points="5,8 11,0 17,9" fill="#141414" />
                    <polygon points="15,9 21,0 27,8" fill="#141414" />
                  </g>
                  <!-- Cat 5 (Mid Right) -->
                  <g transform="translate(62, 22)">
                    <circle cx="16" cy="18" r="14" fill="#141414" />
                    <polygon points="5,8 11,0 17,9" fill="#141414" />
                    <polygon points="15,9 21,0 27,8" fill="#141414" />
                  </g>
                  <!-- Cat 6 (Top) -->
                  <g transform="translate(42, -6)">
                    <circle cx="16" cy="18" r="15" fill="#141414" />
                    <polygon points="5,8 11,0 17,9" fill="#141414" />
                    <polygon points="15,9 21,0 27,8" fill="#141414" />
                  </g>
                </g>

                <!-- Left Text Label -->
                <text x="130" y="345" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="22" fill="#141414" text-anchor="middle">
                  CẦU (6 MÈO)
                </text>

                <!-- Downward Force Indicator -->
                <g id="indicator-left" transform="translate(118, 360)">
                  <path d="M 12 0 L 12 28 M 4 20 L 12 28 L 20 20" fill="none" stroke="#FF6A1A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
                </g>

                <!-- Right Suspension Ropes & Pan (SUPPLY / 1 CAKE) -->
                <line x1="726" y1="210" x2="726" y2="290" stroke="#141414" stroke-width="3.5" stroke-dasharray="6,4" />
                <path d="M 646 290 Q 726 325 806 290" fill="none" stroke="#141414" stroke-width="6" stroke-linecap="round" />

                <!-- 1 Single Cake on Right Pan -->
                <g id="cake-payload" transform="translate(696, 218)">
                  <path d="M 0 45 L 60 45 L 54 20 L 6 20 Z" fill="#FF6A1A" stroke="#141414" stroke-width="3.5" stroke-linejoin="round" />
                  <path d="M 6 20 Q 30 10 54 20" fill="#F7F4EC" stroke="#141414" stroke-width="3.5" />
                  <circle cx="30" cy="8" r="7" fill="#141414" />
                  <path d="M 30 2 Q 38 -6 42 -2" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" />
                </g>

                <!-- Right Text Label -->
                <text x="726" y="345" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="22" fill="#141414" text-anchor="middle">
                  CUNG (1 BÁNH)
                </text>

                <!-- Upward Float Indicator -->
                <g id="indicator-right" transform="translate(714, 390)">
                  <path d="M 12 28 L 12 0 M 4 8 L 12 0 L 20 8" fill="none" stroke="#FF6A1A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
                </g>
              </g>
            </svg>
          </div>
        </div>

        <!-- Punch Phrase Card: LỆCH CUNG - CẦU -->
        <div id="punch-phrase-card" data-layout-allow-occlusion="true">
          <div class="punch-eyebrow">QUY LUẬT THỊ TRƯỜNG</div>
          <h1 class="punch-headline">LỆCH CUNG - CẦU</h1>
          <div id="punch-underline" class="punch-underline-bar"></div>
          <p class="punch-subtext">6 người mua tranh nhau 1 sản phẩm duy nhất</p>
        </div>

        <!-- Label: LÒ BÁNH ĐỘC QUYỀN (Points to Baker Cat) -->
        <div id="label-monopoly">
          <svg class="monopoly-icon" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
          </svg>
          <span class="monopoly-text">LÒ BÁNH ĐỘC QUYỀN</span>
        </div>
      </div>

      <!-- Static Orange Bottom Bar -->
      <div class="bottom-orange-bar"></div>
    </div>

    <!-- GSAP Seekable Timeline Script -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Initial State: camera motion pan-left on video across scene duration
      tl.fromTo("#bg-video", { x: 0 }, { x: -65, duration: 5.13, ease: "none" }, 0);

      // 2. Diagram Card arrives at t = 0.17s (8070ms - 7900ms) with clean settle
      tl.fromTo(
        "#diagram-card",
        { y: 45, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.52, ease: "power3.out" },
        0.17
      );

      // 3. Balance tilts sharply into imbalance at t = 1.01s (8910ms - 7900ms)
      // svgOrigin sets pivot exactly at fulcrum coordinates (428, 210)
      tl.to(
        "#scale-beam-group",
        { rotation: 14, svgOrigin: "428 210", duration: 0.65, ease: "power3.inOut" },
        1.01
      );

      // Ratio badge pops in when balance tilts
      tl.fromTo(
        "#label-ratio",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.38, ease: "power3.out" },
        1.01
      );

      // Force indicators pop in to accentuate imbalance
      tl.fromTo(
        "#indicator-left",
        { scale: 0, opacity: 0, transformOrigin: "12px 14px" },
        { scale: 1, opacity: 1, duration: 0.32, ease: "power3.out" },
        1.18
      );
      tl.fromTo(
        "#indicator-right",
        { scale: 0, opacity: 0, transformOrigin: "12px 14px" },
        { scale: 1, opacity: 1, duration: 0.32, ease: "power3.out" },
        1.22
      );

      // Diagram Card exits cleanly before punch phrase starts (at t = 2.20s -> 2.50s)
      tl.to(
        "#diagram-card",
        { y: -35, opacity: 0, scale: 0.96, duration: 0.3, ease: "power2.in" },
        2.20
      );

      // 4. Punch Phrase Card enters at t = 2.76s (10660ms - 7900ms)
      tl.fromTo(
        "#punch-phrase-card",
        { y: 40, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.44, ease: "power3.out" },
        2.76
      );

      // Orange underline draw reveal
      tl.fromTo(
        "#punch-underline",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.36, ease: "power2.out" },
        2.92
      );

      // Punch Phrase Card exit at t = 4.15s (holds 1.39s, well above 1.6s combined reading window)
      tl.to(
        "#punch-phrase-card",
        { y: -30, opacity: 0, duration: 0.22, ease: "power2.in" },
        4.15
      );

      // 5. Label: LÒ BÁNH ĐỘC QUYỀN enters at t = 4.35s (12250ms - 7900ms) to scene end
      tl.fromTo(
        "#label-monopoly",
        { y: 25, opacity: 0, scale: 0.88 },
        { y: 0, opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" },
        4.35
      );

      // Register the paused timeline with window.__timelines["scene-s02"]
      window.__timelines["scene-s02"] = tl;
    </script>
  
    </template>
  </body>
