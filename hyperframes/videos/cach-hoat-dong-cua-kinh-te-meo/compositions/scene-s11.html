      .punch-phrase-container {

      /* Chữ ký thị giác: Dải cam cố định ở mép dưới cùng */
      .bottom-orange-bar {

        z-index: 100;

    </style>

    <div
      id="root"
      data-composition-id="scene-s11"
      data-width="1080"
      data-height="1920"
      data-duration="12"
    >
      <!-- Nền giấy ngà + Lưới ô vuông 84px -->
      <div class="bg-layer">
        <div class="grid-canvas"></div>
        <div class="grain-overlay"></div>
      </div>

      <!-- Punch Entrance Wrapper -->
      <div id="punch-wrapper" class="punch-wrapper">
        <!-- Header thông tin đạt chuẩn WCAG AA contrast -->
        <div class="scene-header">
          <div class="meta-badge">CHIẾN LƯỢC</div>
          <span class="meta-title">THỊ TRƯỜNG PATE</span>
        </div>

        <!-- Bố cục Split Collage so sánh hai vùng -->
        <div class="split-frame-wrapper">
          <div class="split-frame">
            <!-- Nền ảnh di chuyển nhẹ sang phải (pan-right), cho phép overflow vì là camera pan -->
            <div id="pan-container" class="pan-container" data-layout-allow-overflow="true">
              <img
                id="hero-img"
                class="hero-img"
                src="assets/img-01-smuggling-customs-evasion-cutout.jpeg"

              />
            </div>

            <!-- Đường cắt đôi khung hình (Split border) -->
            <div class="split-divider"></div>
            <!-- Huy hiệu VS đặt làm direct child của split-frame -->
            <div class="divider-badge">VS</div>

            <!-- Vùng trái: Rừng nhà -->
            <div id="left-region" class="region-overlay left-region">
              <div class="region-tag tag-left">RỪNG NHÀ</div>
              <div class="cross-mark-container">
                <svg viewBox="0 0 100 100" class="svg-cross">
                  <path d="M 20 20 L 80 80" class="cross-line cross-1" />
                  <path d="M 80 20 L 20 80" class="cross-line cross-2" />
                </svg>

              <div class="arrow-recon-container">

                  <path d="M 20 40 L 160 40 M 130 15 L 165 40 L 130 65" class="recon-path" />

        <div id="card-opportunity" class="overlay-card card-opportunity">
          <div class="icon-box icon-box-rise">
            <svg viewBox="0 0 48 48" class="svg-icon">
              <path d="M8 38 L20 26 L28 34 L38 14" class="draw-path stroke-dark path-rise" />
              <polyline points="26 14 38 14 38 26" class="draw-path stroke-dark path-rise-arrow" />

    <script>
      // Thiết lập đo và chuẩn bị nét vẽ SVG
      function initSvgPath(selector) {
        const el = document.querySelector(selector);
        if (!el) return 100;
        const len = el.getTotalLength ? el.getTotalLength() : 100;
        el.style.strokeDasharray = len + "";
        el.style.strokeDashoffset = len + "";
        return len;
      }

      const lenCross1 = initSvgPath(".cross-1");
      const lenCross2 = initSvgPath(".cross-2");
      const lenRise = initSvgPath(".path-rise");
      const lenRiseArr = initSvgPath(".path-rise-arrow");
      const lenFall = initSvgPath(".path-fall");
      const lenFallArr = initSvgPath(".path-fall-arrow");
      const lenRecon = initSvgPath(".recon-path");

      // Khởi tạo duy nhất 1 GSAP timeline paused cho HyperFrames seek
      const tl = gsap.timeline({ paused: true });

      // 1. Transition vào cảnh (Punch entrance) tại t = 0s
      tl.fromTo(
        "#punch-wrapper",
        { scale: 1.06, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0
      );

      // 2. Camera motion: pan-right nhẹ nhàng trên ảnh bối cảnh (0s - 12s)
      tl.fromTo(
        "#pan-container",
        { x: 0 },
        { x: -180, duration: 12.0, ease: "none" },
        0
      );

      // 3. Beat 1: Overlay icon rise & nhãn "TÌM KIẾM CƠ HỘI MỚI"
      // Icon rise atMs: 87580 -> t = 0.88s
      tl.fromTo(
        "#card-opportunity",
        { autoAlpha: 0, y: 35, scale: 0.96 },
        { autoAlpha: 1, y: 0, scale: 1.0, duration: 0.45, ease: "power3.out" },
        0.88
      );

      tl.fromTo(
        ".path-rise",
        { strokeDashoffset: lenRise },
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        0.95
      );

      tl.fromTo(
        ".path-rise-arrow",
        { strokeDashoffset: lenRiseArr },
        { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
        1.25
      );

      // Card 1 rút lui tại 3.7s
      tl.to(
        "#card-opportunity",
        { autoAlpha: 0, y: -25, duration: 0.35, ease: "power2.in" },
        3.7
      );

      // 4. Beat 2: Pate nội đắt & kém (vùng trái đỏ + X mark + card fall)
      // Chuyển nền vùng trái sang sắc đỏ cảnh báo tại 5.8s
      tl.fromTo(
        "#left-region",
        { backgroundColor: "rgba(20, 20, 20, 0)" },
        { backgroundColor: "rgba(224, 46, 27, 0.28)", duration: 0.4 },
        5.8
      );

      // Icon fall atMs: 92800 -> t = 6.10s
      tl.fromTo(
        "#card-local-pate",
        { autoAlpha: 0, y: 35, scale: 0.96 },
        { autoAlpha: 1, y: 0, scale: 1.0, duration: 0.45, ease: "power3.out" },
        6.10
      );

      // Nét vẽ X đỏ lần lượt hai gạch (từ 6.12s)
      tl.fromTo(
        ".cross-1",
        { strokeDashoffset: lenCross1 },
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        6.12
      );

      tl.fromTo(
        ".cross-2",
        { strokeDashoffset: lenCross2 },
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        6.32
      );

      // Icon fall vẽ đường nét
      tl.fromTo(
        ".path-fall",
        { strokeDashoffset: lenFall },
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        6.20
      );

      tl.fromTo(
        ".path-fall-arrow",
        { strokeDashoffset: lenFallArr },
        { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
        6.50
      );

      // Card 2 rút lui tại 9.1s
      tl.to(
        "#card-local-pate",
        { autoAlpha: 0, y: -25, duration: 0.35, ease: "power2.in" },
        9.10
      );

      // 5. Beat 3: Mũi tên trinh sát vượt biên & Punch phrase
      // Mũi tên trinh sát vẽ sang rừng bạn tại 9.25s
      tl.fromTo(
        ".recon-path",
        { strokeDashoffset: lenRecon },
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        9.25
      );

      // Punch phrase: SANG RỪNG BẠN KHẢO SÁT atMs: 96210 -> t = 9.51s
      tl.fromTo(
        "#punch-phrase",
        { autoAlpha: 0, scale: 0.9, y: 30 },
        { autoAlpha: 1, scale: 1.0, y: 0, duration: 0.55, ease: "power3.out" },
        9.51
      );

      tl.fromTo(
        ".punch-phrase-badge",
        { scale: 0 },
        { scale: 1.0, duration: 0.35, ease: "power3.out" },
        9.70
      );

      // Đăng ký timeline cho HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s11"] = tl;
    </script>
