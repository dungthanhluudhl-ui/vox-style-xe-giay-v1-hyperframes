      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }

      *, *::before, *::after {

      }

      body {

        padding: 0;
        background: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Base Composition Sizing */
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }

      /* Core Clip Definition */
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      /* Mandatory Contrast-Safe Utility Classes */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background: #FF6A1A; color: #141414; }
      .hf-plate-ink { background: #141414; color: #F7F4EC; }
      .hf-plate-ink-orange { background: #141414; color: #FF6A1A; }
      .hf-plate-paper { background: #E7E3D9; color: #141414; }

      /* Persistent Brand Signature Bottom Bar */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;

        height: 14px;
        background: #FF6A1A;

      /* Header Bar - Safe Zone Y: 175px */

      .stamp-badge {

        top: 20px;
        right: 24px;

        font-size: 20px;
        letter-spacing: 1px;

      /* Trade Flow Diagram - Safe Zone Y: 1060px to 1180px */
      #flow-card {

        width: 960px;

        border: 4px solid #141414;

        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        z-index: 8;
      }

      .flow-node {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .flow-node.origin {
        width: 320px;
      }

      .flow-node.dest {
        width: 300px;
        align-items: flex-end;
        text-align: right;
      }

      .node-badge {
        display: inline-block;
        width: fit-content;
        padding: 3px 10px;
        font-size: 14px;
        font-weight: 900;
        text-transform: uppercase;
        border-radius: 2px;
        margin-bottom: 4px;
      }

      .node-title {
        font-size: 24px;
        font-weight: 900;
        line-height: 1.2;
      }

      .node-sub {
        font-size: 17px;
        font-weight: 700;
        opacity: 0.9;
        margin-top: 2px;
      }

      .flow-track {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 240px;
      }

      .flow-track-label {
        font-size: 15px;
        font-weight: 900;
        letter-spacing: 1px;
        color: #FF6A1A;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .flow-svg {
        display: block;
        width: 220px;
        height: 24px;
      }

      /* Timed Overlays - Safe Zone Y: 1205px to 1370px */
      .overlay-container {
        position: absolute;
        top: 1205px;
        left: 60px;
        width: 960px;
        height: 165px;
        border: 4px solid #141414;
        border-radius: 8px;
        box-shadow: 10px 10px 0 #141414;
        padding: 20px 32px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        z-index: 20;
      }

      .overlay-badge {
        display: inline-block;
        width: fit-content;
        padding: 4px 14px;
        font-weight: 900;
        font-size: 18px;
        letter-spacing: 1px;
        text-transform: uppercase;
        border-radius: 3px;
        margin-bottom: 8px;
      }

      .overlay-heading {
        font-size: 54px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.5px;
        text-transform: uppercase;
        margin: 0;
      }

      .punch-heading {
        font-size: 56px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.5px;
        text-transform: uppercase;
        margin: 0;
      }

      #punch-accent-line {
        width: 100%;
        height: 6px;
        background: #FF6A1A;
        margin-top: 10px;
        transform-origin: 0% 50%;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s11"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="9"
    >
      <!-- Base Shot Clip: 0s to 9s -->
      <section class="clip" data-start="0" data-duration="9" data-track-index="1">
        <!-- Top Category Header -->
        <header id="header-bar">
          <div class="header-pill hf-hl-orange">
            <span>QUY LUẬT THƯƠNG MẠI</span>
          </div>
          <div class="header-meta">
            <span>BÀI TOÁN CHI PHÍ & CHẤT LƯỢNG</span>
          </div>
        </header>

        <!-- Hero Photo Frame -->
        <article id="hero-card">
          <div class="img-viewport">
            <img
              id="hero-img"
              src="assets/img-01-smuggling-customs-evasion-cutout.jpeg"
              alt="Pate nhập khẩu từ rừng bên cạnh"
            />
            <div class="tape-label">HỒ SƠ GIAO THƯƠNG #11</div>
            <div class="stamp-badge hf-hl-orange">PATE NGOẠI</div>
            <div class="origin-tag hf-plate-ink">
              <span>ĐIỂM XUẤT PHÁT: RỪNG LÁNG GIỀNG</span>
            </div>
          </div>
        </article>

        <!-- Trade Flow Diagram -->
        <div id="flow-card">
          <div class="flow-node origin">
            <span class="node-badge hf-hl-orange">RỪNG BÊN CẠNH</span>
            <span class="node-title hf-text-light">NGUỒN CUNG RẺ</span>
            <span class="node-sub hf-text-light">Nguyên liệu tốt · Công thức chuẩn</span>
          </div>

          <div class="flow-track">
            <span class="flow-track-label">VẬN CHUYỂN VỀ</span>
            <svg class="flow-svg" viewBox="0 0 220 24" fill="none">
              <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#FF6A1A" />
                </marker>
              </defs>
              <line
                id="flow-line"
                x1="8"
                y1="12"
                x2="204"
                y2="12"
                stroke="#FF6A1A"
                stroke-width="5"
                stroke-dasharray="14 8"
                marker-end="url(#arrow)"
              />
            </svg>
          </div>

          <div id="node-dest" class="flow-node dest">
            <span class="node-badge hf-plate-paper">RỪNG CỦA MÈO</span>
            <span class="node-title hf-text-light">CHỢ NỘI ĐỊA</span>
            <span class="node-sub hf-text-light">Tiêu thụ nhanh · Siêu lợi nhuận</span>

      <!-- Timed Overlay 1: Label at 2.89s (hold 2.1s) -->
      <div class="clip" data-start="2.89" data-duration="2.1" data-track-index="2">
        <div id="overlay-quality" class="overlay-container hf-plate-ink">
          <div class="overlay-badge hf-hl-orange">LỢI THẾ CẠNH TRANH</div>
          <h2 class="overlay-heading hf-text-light">CHẤT LƯỢNG VƯỢT TRỘI</h2>
        </div>
      </div>

      <!-- Timed Overlay 2: Punch-phrase at 6.60s (hold 2.4s to end) -->
      <div class="clip" data-start="6.6" data-duration="2.4" data-track-index="3">
        <div id="overlay-punch" class="overlay-container hf-plate-ink">
          <div class="overlay-badge hf-hl-orange">KẾT LUẬN ĐỊNH NGHĨA</div>
          <h1 class="punch-heading hf-text-light">DÒNG HÀNG NHẬP KHẨU</h1>
          <div id="punch-accent-line"></div>
        </div>
      </div>

      <!-- Persistent Visual Signature -->
      <div id="brand-bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance Transition (rise) for main collage layout
      tl.fromTo(
        "#header-bar",
        { y: -35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.15
      );

      tl.fromTo(
        "#hero-card",
        { y: 70, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.2
      );

      tl.fromTo(
        "#flow-card",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.35
      );

      // 2. Camera Motion: Continuous subtle zoom-in on the imported pate scene
      tl.fromTo(
        "#hero-img",
        { scale: 1.0, y: 0 },
        { scale: 1.12, y: -20, duration: 9.0, ease: "none" },
        0.0
      );

      // 3. Flow visual language: Animated trade movement across border (finite repeat)
      tl.fromTo(
        "#flow-line",
        { strokeDashoffset: 88 },
        { strokeDashoffset: 0, duration: 1.1, ease: "none", repeat: 7 },
        0.5
      );

      // 4. Overlay 1: "CHẤT LƯỢNG VƯỢT TRỘI" entrance & exit
      tl.fromTo(
        "#overlay-quality",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        2.89
      );

      tl.to(
        "#overlay-quality",
        { y: -20, opacity: 0, duration: 0.35, ease: "power2.in" },
        4.64
      );

      // 5. Flow reaction beat: Market reception pulse
      tl.to(
        "#node-dest",
        { scale: 1.05, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out" },
        5.2
      );

      // 6. Overlay 2: "DÒNG HÀNG NHẬP KHẨU" Punch Phrase entrance
      tl.fromTo(
        "#overlay-punch",
        { y: 40, scale: 0.95, opacity: 0 },
        { y: 0, scale: 1.0, opacity: 1, duration: 0.5, ease: "power3.out" },
        6.60
      );

      tl.fromTo(
        "#punch-accent-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power2.out" },
        6.95
      );

      // Register the paused master timeline under the composition ID
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s11"] = tl;
    </script>
  
    </template>
