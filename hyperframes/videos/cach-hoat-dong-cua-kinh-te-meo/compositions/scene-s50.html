<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    /* CSS Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #141414;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
      background-image: 
        linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }

    /* Quy ước bắt buộc: .clip { position: absolute; inset: 0; } (không set width/height px) */
    .clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* Lớp màu an toàn chuẩn Style Tokens & WCAG */
    .hf-text-ink {
      color: #141414;
    }

    .hf-text-light {
      color: #F7F4EC;
    }

    .hf-hl-orange {
      background-color: #FF6A1A;
      color: #141414;
    }

    .hf-plate-ink {
      background-color: #141414;
      color: #F7F4EC;
    }

    .hf-plate-ink-orange {
      background-color: #141414;
      color: #FF6A1A;
    }

    .hf-plate-paper {
      background-color: #E7E3D9;
      color: #141414;
    }

    /* Thanh cam thương hiệu cố định ở chân khung hình */
    #brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 16px;
      background-color: #FF6A1A;
      z-index: 100;
      pointer-events: none;
    }

    /* Card Layouts - An toàn cho vùng Safe Zone */
    .overlay-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .editorial-card {
      background-color: #141414;
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      border-left: 10px solid #FF6A1A;
      padding: 28px 42px;
      max-width: 880px;
      width: 86%;
      text-align: left;
    }

    .punch-card {
      background-color: #141414;
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      border: 3px solid #FF6A1A;
      padding: 32px 48px;
      max-width: 900px;
      width: 88%;
      text-align: center;
    }

    .quote-card {
      background-color: #141414;
      border-radius: 20px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.75);
      border: 3px solid #FF6A1A;
      padding: 36px 48px;
      max-width: 920px;
      width: 90%;
      text-align: center;
    }

    .badge-label {
      display: inline-block;
      background-color: #FF6A1A;
      color: #141414;
      font-size: 24px;
      font-weight: 900;
      padding: 6px 16px;
      border-radius: 6px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .tag-category {
      font-size: 24px;
      font-weight: 900;
      color: #FF6A1A;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .card-title-main {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.22;
      color: #F7F4EC;
      text-transform: uppercase;
    }

    .card-subtext {
      font-size: 26px;
      font-weight: 700;
      color: #E7E3D9;
      margin-top: 12px;
      line-height: 1.35;
    }

    .punch-title-main {
      font-size: 70px;
      font-weight: 900;
      line-height: 1.18;
      color: #F7F4EC;
      text-transform: uppercase;
    }

    .quote-title-main {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.2;
      color: #F7F4EC;
      text-transform: uppercase;
    }

    .highlight-orange {
      color: #FF6A1A;
    }

    .icon-badge {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      background-color: #141414;
      border: 3px solid #FF6A1A;
      border-radius: 40px;
      padding: 12px 28px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      margin-top: 24px;
    }

    .icon-badge-text {
      font-size: 26px;
      font-weight: 900;
      color: #F7F4EC;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Spotlight Vignette Layers */
    .spotlight-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, transparent 35%, rgba(20, 20, 20, 0.72) 100%);
      pointer-events: none;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s50"
    data-width="1080"
    data-height="1920"
    data-duration="14"
  >
    <!-- Thanh cam thương hiệu cố định mép dưới -->
    <div id="brand-bar"></div>

    <!-- ========================================== -->
    <!-- SHOT 1: Gánh nặng nợ công (0.0s - 4.8s)    -->
    <!-- ========================================== -->
    <section id="shot-1" class="clip" data-start="0" data-duration="4.8" style="z-index: 10;">
      <div id="shot-1-viewport" style="position: absolute; inset: 0; transform-origin: 50% 40%;">
        <img
          id="shot-1-img"
          src="assets/img-20-public-debt-infrastructure-loan-cutout.jpeg"
          alt="Public Debt Infrastructure Loan"
          style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; transform-origin: 50% 35%;"
        />
        <div class="spotlight-vignette"></div>
      </div>
    </section>

    <!-- Shot 1 Overlay: Label Gánh nặng trả nợ (1.76s - 4.8s) -->
    <div id="shot-1-overlay" class="clip" data-start="1.76" data-duration="3.04" style="z-index: 15;">
      <div class="overlay-container" style="padding-top: 320px;">
        <div id="shot-1-card" class="editorial-card">
          <div class="badge-label">CHÍNH SÁCH TÀI KHÓA</div>
          <div class="card-title-main">GÁNH NẶNG TRẢ NỢ</div>
          <div class="card-subtext">CAM KẾT BẰNG TÀI NGUYÊN VÀ CÁ CỦA RỪNG MÈO</div>
        </div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- SHOT 2: Dòng thời gian & Nợ công dài hạn (4.8s - 9.8s) -->
    <!-- Thẻ video KHÔNG nằm trong phần tử có data-start! -->
    <!-- ========================================== -->
    <div id="vid-wrapper" style="position: absolute; inset: 0; overflow: hidden; z-index: 20; pointer-events: none;">
      <video
        id="vid-16"
        src="assets/vid-16-hourglass-papercut-memory-erosion.mp4"
        muted
        playsinline
        data-start="4.8"
        data-duration="5"
        data-media-start="0"
        style="position: absolute; inset: -4% -12% -4% -4%; width: 116%; height: 108%; object-fit: cover; object-position: center;"
      ></video>
    </div>

    <!-- Shot 2 Overlay: Punch phrase Nợ công dài hạn (7.38s - 9.8s) -->
    <div id="shot-2-overlay" class="clip" data-start="7.38" data-duration="2.42" style="z-index: 25;">
      <div class="overlay-container" style="padding-top: 1000px;">
        <div id="shot-2-punch" class="punch-card">
          <div class="tag-category">HỆ QUẢ KINH TẾ</div>
          <div class="punch-title-main">
            NỢ CÔNG <span class="highlight-orange">DÀI HẠN</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- SHOT 3: Kết luận triết lý Keynes (9.8s - 14.0s) -->
    <!-- ========================================== -->
    <section id="shot-3" class="clip" data-start="9.8" data-duration="4.2" style="z-index: 30;">
      <div id="shot-3-viewport" style="position: absolute; inset: 0;">
        <img
          id="shot-3-img"
          src="assets/img-02-paper-cutout-hourglass-memory.jpeg"
          alt="Hourglass Memory"
          style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center;"
        />
        <div class="spotlight-vignette"></div>
      </div>
    </section>

    <!-- Shot 3 Overlay 1: Punch phrase Keynes (12.1s - 14.0s) -->
    <div id="shot-3-punch-clip" class="clip" data-start="12.1" data-duration="1.9" style="z-index: 35;">
      <div class="overlay-container" style="padding-top: 380px;">
        <div id="shot-3-punch" class="quote-card">
          <div class="tag-category">JOHN MAYNARD KEYNES</div>
          <div class="quote-title-main">
            DÀI HẠN: <span class="highlight-orange">AI CŨNG CHẾT</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Shot 3 Overlay 2: Vocabulary Icon clock (12.79s - 14.0s) -->
    <div id="shot-3-icon-clip" class="clip" data-start="12.79" data-duration="1.21" style="z-index: 36;">
      <div class="overlay-container" style="padding-top: 680px;">
        <div id="shot-3-icon-badge" class="icon-badge">
          <svg class="clock-svg" width="56" height="56" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle id="clock-rim" cx="30" cy="30" r="22" stroke="#FF6A1A" stroke-width="4.5" stroke-linecap="round" />
            <line id="clock-hour" x1="30" y1="30" x2="30" y2="17" stroke="#F7F4EC" stroke-width="4.5" stroke-linecap="round" />
            <line id="clock-minute" x1="30" y1="30" x2="42" y2="30" stroke="#FF6A1A" stroke-width="4.5" stroke-linecap="round" />
          </svg>
          <span class="icon-badge-text">THỜI GIAN VÔ TẬN</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Khởi tạo GSAP Timeline (paused: true)
    const tl = gsap.timeline({ paused: true });

    // ==========================================
    // SHOT 1 CHOREOGRAPHY (0.0s - 4.8s)
    // ==========================================
    // TransitionIn: spiral (xoay nhẹ và bung nở)
    tl.fromTo(
      "#shot-1-viewport",
      { scale: 0.78, rotation: -8, opacity: 0 },
      { scale: 1, rotation: 0, opacity: 1, duration: 0.85, ease: "power3.out" },
      0
    );

    // Camera Motion: zoom-in
    tl.fromTo(
      "#shot-1-img",
      { scale: 1.0 },
      { scale: 1.15, duration: 4.8, ease: "none" },
      0
    );

    // Overlay Label "GÁNH NẶNG TRẢ NỢ" (at 1.76s)
    tl.fromTo(
      "#shot-1-card",
      { y: 40, opacity: 0, scale: 0.94 },
      { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
      1.76
    );

    // ==========================================
    // SHOT 2 CHOREOGRAPHY (4.8s - 9.8s)
    // ==========================================
    // TransitionIn: cut (tự động qua clip window)
    // Camera Motion: pan-right
    tl.fromTo(
      "#vid-wrapper",
      { x: -50 },
      { x: 40, duration: 5.0, ease: "none" },
      4.8
    );

    // Overlay Punch-phrase "NỢ CÔNG DÀI HẠN" (at 7.38s)
    tl.fromTo(
      "#shot-2-punch",
      { y: 35, opacity: 0, scale: 0.92 },
      { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
      7.38
    );

    // ==========================================
    // SHOT 3 CHOREOGRAPHY (9.8s - 14.0s)
    // ==========================================
    // TransitionIn: cut
    // Camera Motion: static

    // Overlay Punch-phrase "DÀI HẠN: AI CŨNG CHẾT" (at 12.1s)
    tl.fromTo(
      "#shot-3-punch",
      { y: 30, opacity: 0, scale: 0.95 },
      { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
      12.1
    );

    // Overlay Icon clock arrival (at 12.79s)
    tl.fromTo(
      "#shot-3-icon-badge",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      12.79
    );

    // Self-drawing SVG path cho icon clock
    const clockRim = document.getElementById("clock-rim");
    const clockHour = document.getElementById("clock-hour");
    const clockMinute = document.getElementById("clock-minute");

    if (clockRim && clockHour && clockMinute) {
      const rimLen = clockRim.getTotalLength();
      const hourLen = clockHour.getTotalLength();
      const minLen = clockMinute.getTotalLength();

      clockRim.style.strokeDasharray = rimLen;
      clockRim.style.strokeDashoffset = rimLen;
      clockHour.style.strokeDasharray = hourLen;
      clockHour.style.strokeDashoffset = hourLen;
      clockMinute.style.strokeDasharray = minLen;
      clockMinute.style.strokeDashoffset = minLen;

      tl.to(clockRim, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 12.85);
      tl.to(clockHour, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 13.05);
      tl.to(clockMinute, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 13.15);
    }

    // Đăng ký timeline cho HyperFrames seek
    window.__timelines["scene-s50"] = tl;
  </script>

    </template>
  </body>
</html>
