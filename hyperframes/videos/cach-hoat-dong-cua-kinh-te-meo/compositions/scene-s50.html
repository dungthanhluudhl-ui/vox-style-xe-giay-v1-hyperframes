    <script>

        "#scene-video",
        { scaleY: 0.35, scaleX: 0.92, opacity: 0 },
        { scaleY: 1.08, scaleX: 1.08, opacity: 0.90, duration: 0.75, ease: "power3.out" },
        0
      );

      // Camera Zoom-out từ 1.08 về 1.00 suốt thời lượng còn lại

        "#scene-video",
        { scaleX: 1.0, scaleY: 1.0, duration: 7.16, ease: "none" },
        0.75
      );

        "#production-card",
        { scale: 0.85, opacity: 0, y: -25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.67
      );

      // Check icon vẽ đường nét mực cam lúc 0.75s
      tl.fromTo(
        checkPath,
        { strokeDashoffset: checkLen },
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        0.75
      );

      // Label "SẢN XUẤT HOẠT ĐỘNG LẠI" xuất hiện bổ sung lúc 1.40s

        "#production-text",
        { opacity: 0, x: -18 },
        { opacity: 1, x: 0, duration: 0.40, ease: "power2.out" },
        1.40

      // Thẻ fade out êm lúc 3.20s trước khi clip kết thúc ở 3.60s

        "#production-card",
        { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
        3.20

        2.55

      // Đường biểu đồ GDP vọt thẳng lên trên nền chart
      tl.fromTo(
        trendPath,
        { strokeDashoffset: trendLen },
        { strokeDashoffset: 0, duration: 0.70, ease: "power2.out" },
        2.65
      );

      // Đầu mũi tên bật ra xác lập đỉnh phục hồi
      tl.fromTo(
        "#trend-arrowhead",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.30, ease: "power3.out" },
        3.30
      );

      // Thẻ trend fade out lúc 4.40s trước khi clip kết thúc ở 4.75s
      tl.to(
        "#rise-card",
        { opacity: 0, y: -15, duration: 0.30, ease: "power2.in" },

      tl.fromTo(
