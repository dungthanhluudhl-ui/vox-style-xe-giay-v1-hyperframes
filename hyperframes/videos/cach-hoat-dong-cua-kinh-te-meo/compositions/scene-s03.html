      #punch-card {

    <div
      id="root"
      data-composition-id="scene-s03"
      data-width="1080"
      data-height="1920"
      data-duration="6.67"
      data-fps="30"
    >
      <!-- Lớp Video chính có Camera Zoom Rig (video mang data-start và duration) -->

        <div id="camera-rig">
          <video
            id="vid-19"

      <!-- Lớp đồ họa Chart Grid: 4 đường kẻ ngang 20/40/60/80% cùng tick cam ở mép trái -->
      <div class="chart-grid-layer">
        <div class="chart-line-row" style="top: 20%;">

        </div>
        <div class="chart-line-row" style="top: 40%;">

        <div class="chart-line-row" style="top: 60%;">

        <div class="chart-line-row" style="top: 80%;">

      <!-- OVERLAY 1: Giá ban đầu 5K (1.35s -> 3.15s) -->
      <div id="overlay-5k" class="clip" data-start="1.35" data-duration="1.8">
        <div id="label-5k-card">
          <div class="tag-subtitle">GIÁ BAN ĐẦU</div>
          <div class="price-container">

          <div class="rise-svg-wrap">

    <script>
      // 1. Chuẩn bị hình học SVG theo API getTotalLength
      const strikePath = document.getElementById("strikethrough-path");
      if (strikePath) {
        const len = strikePath.getTotalLength() || 145;
        strikePath.style.strokeDasharray = `${len}`;
        strikePath.style.strokeDashoffset = `${len}`;
      }

      const risePath = document.getElementById("rise-arrow-path");
      if (risePath) {
        const len = risePath.getTotalLength() || 320;
        risePath.style.strokeDasharray = `${len}`;
        risePath.style.strokeDashoffset = `${len}`;
      }

      // 2. Khởi tạo paused timeline duy nhất cho composition
      const tl = gsap.timeline({ paused: true });

      // Camera motion: zoom-in chậm, mượt mà xuyên suốt 6.67s
      tl.fromTo(
        "#camera-rig",
        { scale: 1.0 },
        { scale: 1.08, duration: 6.67, ease: "sine.inOut" },
        0
      );

      // Nhịp xuất hiện các vạch cam chart
      tl.fromTo(
        ".chart-tick",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.35, stagger: 0.08, ease: "power2.out" },
        0.15
      );

      // OVERLAY 1: Giá 5k xuất hiện (t = 1.35s)
      tl.fromTo(
        "#label-5k-card",
        { scale: 0.85, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        1.35
      );

      // Gạch chéo mực đen xuất hiện khi narrator chuyển ý "nhưng..." (t = 2.15s)
      tl.to(
        "#strikethrough-path",
        { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" },
        2.15
      );

      // Nhãn Hết hàng nảy ra (t = 2.28s)
      tl.fromTo(
        "#badge-soldout",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.28, ease: "power3.out" },
        2.28
      );

      // Thẻ 5k mờ dần trước khi kết thúc thời lượng clip (t = 2.85s)
      tl.to(
        "#label-5k-card",
        { opacity: 0, y: -18, duration: 0.3, ease: "power2.in" },
        2.85
      );

      // OVERLAY 2: Icon Rise xuất hiện (t = 3.18s)
      tl.fromTo(
        "#rise-card",
        { scale: 0.85, opacity: 0, x: 30 },
        { scale: 1, opacity: 1, x: 0, duration: 0.42, ease: "power3.out" },
        3.18
      );

      // Đường path mũi tên tự vẽ (t = 3.35s)
      tl.to(
        "#rise-arrow-path",
        { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
        3.35
      );

      // Đầu mũi tên bật ra (t = 3.85s)
      tl.fromTo(
        "#rise-arrowhead",
        { scale: 0 },
        { scale: 1, duration: 0.22, ease: "power3.out" },
        3.85
      );

      // Badge Sức mua bùng nổ (t = 3.92s)
      tl.fromTo(
        "#rise-badge",
        { scale: 0.8, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
        3.92
      );

      // Thẻ Rise mờ dần trước khi kết thúc slot (t = 5.08s)
      tl.to(
        "#rise-card",
        { opacity: 0, y: -16, duration: 0.3, ease: "power2.in" },
        5.08
      );

      // OVERLAY 3: Giá mới 20k xuất hiện (t = 4.39s)
      tl.fromTo(
        "#label-20k-card",
        { scale: 0.85, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        4.39
      );

      // Nhãn x4 bật ra (t = 4.7s)
      tl.fromTo(
        "#pill-multiplier",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
        4.7
      );

      // Thẻ 20k mờ dần (t = 6.09s)
      tl.to(
        "#label-20k-card",
        { opacity: 0, y: -16, duration: 0.3, ease: "power2.in" },
        6.09
      );

      // OVERLAY 4: Punch-Phrase "LẠM PHÁT CẦU KÉO" (t = 5.07s)
      tl.fromTo(
        "#punch-card",
        { scale: 0.9, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power4.out" },
        5.07
      );

      // Gạch chân highlight cam mở rộng ra (t = 5.35s)
      tl.fromTo(
        "#punch-highlight-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.35, ease: "power3.out" },
        5.35
      );

      // 3. Đăng ký timeline đồng bộ với framework HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s03"] = tl;
    </script>
