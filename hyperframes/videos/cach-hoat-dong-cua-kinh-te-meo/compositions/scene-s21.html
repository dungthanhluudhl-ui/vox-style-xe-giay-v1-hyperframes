  <script>
    // Register exactly one paused timeline on window.__timelines["scene-s21"]
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Camera Motion: Continuous pan-right across full 9.0s shot
    tl.fromTo(
      "#video-camera",
      { x: -30, scale: 1.05 },
      { x: 30, scale: 1.12, duration: 9.0, ease: "sine.inOut" },
      0
    );

    // Initial transition in: subtle punch settle at scene start
    tl.fromTo(
      "#video-camera",
      { filter: "contrast(1.2) brightness(1.15)" },
      { filter: "contrast(1) brightness(1)", duration: 0.6, ease: "power2.out" },
      0
    );

    // ==========================================
    // Overlay 1: KOL Kích Động Giá (data-start="0.6")
    // ==========================================
    tl.fromTo(
      "#kol-card",
      { y: 40, opacity: 0, scale: 0.95 },
      { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
      0.6
    );
    tl.fromTo(
      "#kol-trend",
      { scale: 0.85, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power2.out" },
      0.9
    );
    tl.to(
      "#kol-card",
      { y: -30, opacity: 0, duration: 0.3, ease: "power2.in" },
      2.7
    );

    // ==========================================
    // Overlay 2: Punch Phrase PHÂN LÔ BÁN NỀN (data-start="3.2")
    // ==========================================
    tl.fromTo(
      "#punch-container",
      { y: 50, opacity: 0, scale: 0.92 },
      { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power4.out" },
      3.2

      { y: 0, opacity: 1, scale: 1, duration: 0.3, stagger: 0.08, ease: "power2.out" },

    );
    tl.to(

      { y: -30, opacity: 0, duration: 0.3, ease: "power2.in" },
      5.45
    );

    // ==========================================
    // Overlay 3: Flow & Data Kiếm Nhiều Cá (data-start="6.0")
    // ==========================================
    tl.fromTo(
      "#profit-container",
      { y: 40, opacity: 0, scale: 0.95 },
      { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
      6.0
    );

      "#stat-land",
      { x: -30, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
      6.35
    );
    tl.fromTo(
      "#stat-fish",
      { x: 30, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
      6.55
    );

    // Attach timeline to global registry
    window.__timelines["scene-s21"] = tl;
