    <!-- GSAP Seekable Timeline Script -->
    <script>
      // Thiết lập độ dài nét vẽ cho các đường path SVG (công thức getTotalLength chuẩn xác)
      document.querySelectorAll(".draw-path").forEach(function(p) {
        var len = p.getTotalLength();
        p.style.strokeDasharray = len + 1;
        p.style.strokeDashoffset = len + 1;
      });

      // Khởi tạo Timeline Paused cho HyperFrames runtime
      var tl = gsap.timeline({ paused: true });

      // 1. Scene Entrance (0.0s - 0.6s): rise và scale tự nhiên
      tl.fromTo(
        "#stage",
        { y: 60, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.05
      );

      // Camera motion: zoom-out chậm và ổn định xuyên suốt scene (0.2s -> 7.8s)
      tl.fromTo(
        "#camera-frame",
        { scale: 1.04 },
        { scale: 1.0, duration: 7.6, ease: "sine.inOut" },
        0.2
      );

      // Origin card xuất hiện vững chãi (t = 0.2s)
      tl.fromTo(
        "#origin-card",
        { scale: 0.94, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.2
      );

      // 2. Các nhánh phân bổ bắt đầu vẽ xuống (t = 0.7s - 1.25s)
      tl.to(
        ".divergence-svg .flow-path",
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out", stagger: 0.08 },
        0.75
      );

      // 3. Overlay 1: MUA SẮM DÂY CHUYỀN (t = 1.29s)
      tl.fromTo(
        "#card-machinery",
        { y: 35, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        1.29
      );

      // Card 2: Nhà xưởng xuất hiện tiếp nối chuỗi mua sắm (t = 2.10s)
      tl.fromTo(
        "#card-factory",
        { y: 35, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        2.10
      );

      // 4. Overlay 2: NGUYÊN VẬT LIỆU SẢN XUẤT (t = 3.00s)
      tl.fromTo(
        "#card-materials",
        { y: 35, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        3.00
      );

      // Khung vỏ card công thức xuất hiện (t = 4.60s)
      tl.fromTo(
        "#card-formula",
        { y: 35, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        4.60
      );

      // 5. Overlay 3: Icon "doc" tự vẽ dần từng nét path (t = 4.95s)
      tl.to(
        ".doc-stroke-path",
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out", stagger: 0.08 },
        4.95
      );

      // 6. Overlay 4: MUA CÔNG THỨC PATE (t = 5.35s)
      tl.fromTo(
        "#formula-title",
        { x: -20, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        5.35
      );

      // 7. Nhánh hội tụ vẽ xuống Punch Card (t = 6.20s - 6.75s)
      tl.to(
        ".confluence-path",
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out", stagger: 0.06 },
        6.20
      );

      // 8. Overlay 5: Punch Phrase "VỐN VÀ TƯ BẢN" (t = 6.76s)
      tl.fromTo(
