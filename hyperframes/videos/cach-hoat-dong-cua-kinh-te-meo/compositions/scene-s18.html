    </style>

    <!-- Standalone composition root -->
    <div

    >
      <!-- Background: Ruled Chart Variant (Ivory Paper + 4 Horizontal lines + Left ticks) -->
      <div id="chart-background">
        <div class="chart-line line-1"><div class="chart-tick"></div></div>
        <div class="chart-line line-2"><div class="chart-tick"></div></div>
        <div class="chart-line line-3"><div class="chart-tick"></div></div>

      </div>

      <!-- Permanent Bottom Orange Accent Line -->

      <!-- S18-1: Video Element (Non-timed wrapper, timing directly on <video>) -->
      <div id="video-wrapper">

          src="assets/vid-11-paper-cutout-smuggling-law-revision.mp4"

      <!-- S18-1: Label Overlay (Active 1.30s - 3.30s) -->
      <div id="s18-label-clip" class="clip" data-start="1.30" data-duration="2.00" style="z-index: 20;">

      <div id="s18-shot2-clip" class="clip" data-start="4.30" data-duration="4.52" style="z-index: 25;">

        <div id="s18-icon-card" class="hf-plate-ink">
          <div class="icon-card-header">

              <path

    <!-- GSAP Seekable Timeline Script -->
    <script>
      // 1. Setup deterministic SVG drawing lengths
      const risePath = document.getElementById("s18-rise-path");
      const riseArrow = document.getElementById("s18-rise-arrow");
      let pathLen = 180;
      let arrowLen = 60;

      if (risePath) {
        pathLen = risePath.getTotalLength() || 180;
        risePath.style.strokeDasharray = String(pathLen);
        risePath.style.strokeDashoffset = String(pathLen);
      }
      if (riseArrow) {
        arrowLen = riseArrow.getTotalLength() || 60;
        riseArrow.style.strokeDasharray = String(arrowLen);
        riseArrow.style.strokeDashoffset = String(arrowLen);
      }

      // 2. Create single paused timeline
      const tl = gsap.timeline({ paused: true });

      // === SHOT 1 (0.00s - 4.30s) ===
      // Camera motion: zoom-through transition into smooth zoom-out
      tl.fromTo(
        "#vid-11",
        { scale: 1.3, transformOrigin: "50% 50%" },
        { scale: 1.0, duration: 4.3, ease: "power1.out" },
        0
      );

      // S18-1: Label Card entrance (at 1.30s) and exit (holds ~2.00s)
      tl.fromTo(
        "#s18-label-card",
        { scale: 0.85, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.30
      );
      tl.to(
        "#s18-label-card",
        { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" },
        2.95
      );

      // === SHOT 2 (4.30s - 8.82s) ===
      // Cut transition at 4.30s: full-bleed background with subtle drift
      tl.fromTo(
        "#s18-shot2-media",
        { scale: 1.0, transformOrigin: "50% 50%" },
        { scale: 1.03, duration: 4.52, ease: "sine.out" },
        4.30
      );

      // S18-2: Punch Phrase ("ĐẾ CHẾ TÀI SẢN KHỔNG LỒ" at 5.35s, holds 2.20s)
      tl.fromTo(
        "#s18-punch-card",
        { scale: 0.9, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        5.35
      );
      tl.to(
        "#s18-punch-card",
        { opacity: 0, y: -25, duration: 0.30, ease: "power2.in" },
        7.20
      );

      // S18-2: Icon Vocabulary ("rise" at 6.99s, holds 1.83s)
      tl.fromTo(
        "#s18-icon-card",
        { scale: 0.85, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        6.99
      );

      // SVG path drawing: progressive stroke reveal
      if (risePath) {
        tl.fromTo(
          risePath,
          { strokeDashoffset: pathLen },
          { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
          7.15
        );
      }
      if (riseArrow) {
        tl.fromTo(
          riseArrow,
          { strokeDashoffset: arrowLen },
          { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
          7.60
        );
      }

      // 3. Register timeline under composition ID "scene-s18"
      window.__timelines["scene-s18"] = tl;
    </script>
