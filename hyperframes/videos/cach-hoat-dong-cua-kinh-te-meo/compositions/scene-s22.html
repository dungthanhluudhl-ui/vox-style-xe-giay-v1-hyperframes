    <template>

      <style>

      body {
        margin: 0;

        background-color: #E7E3D9;

      /* Root canvas 1080x1920 */
      #root {
        position: relative;
        width: 100%;
        height: 100%;

      /* Spotlight & Paper Background Variant */
      .bg-layer {
        position: absolute;
        inset: 0;
        background-color: #E7E3D9;
        background-image: 
          linear-gradient(to right, rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px),

        z-index: 1;

      /* Dark spotlight vignette for predatory warning atmosphere */
      .vignette-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 45%, rgba(231, 227, 217, 0.08) 20%, rgba(20, 20, 20, 0.62) 85%);
        mix-blend-mode: multiply;
        pointer-events: none;
        z-index: 2;

      /* Camera Zoom Rig (handles long continuous zoom, separate target to avoid GSAP overlap) */
      #camera-zoom {
        position: absolute;
        inset: 0;
        z-index: 5;
        transform-origin: 50% 45%;
        will-change: transform;
      }

      /* Camera Entrance Rig (handles wobble-drop physics at scene entrance) */
      #camera-entrance {
        position: absolute;
        inset: 0;
        transform-origin: 50% 45%;
        will-change: transform;
      }

      /* Main Video Card (Collage frame with physical shadow & tape) */
      #video-card-wrapper {
        position: absolute;
        top: 200px;
        left: 60px;
        width: 960px;
        height: 1300px;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      .video-card {
        position: absolute;
        inset: 0;
        background-color: #141414;
        border-radius: 20px;
        border: 4px solid #141414;
        box-shadow: 14px 18px 0px rgba(20, 20, 20, 0.9);

      #vid-cat-contract {
        width: 100%;
        height: 100%;

        display: block;

      /* Inner dark gradient for high contrast readability of overlays */
      .video-shadow-gradient {
        position: absolute;

      /* Physical Paper Tape Corners */

      .tape-tl {
        top: 185px;
        left: 45px;
        transform: rotate(-25deg);
      }
      .tape-tr {
        top: 185px;
        right: 45px;

      /* Top Label & Question Icon (Overlay 1: 196.72s -> ~1.02s) */
      #badge-no-money {

      .badge-text-title {

        margin: 0;

      }

      /* Diagram Card: Vay 100 - Cầm Về 80 (Overlay 2: 201.05s -> ~5.35s) */
      #diagram-loan-breakdown {
        position: absolute;
        top: 760px;
        left: 80px;
        right: 80px;
        height: auto;
        background: #141414;
        border: 3px solid rgba(247, 244, 236, 0.25);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 10px 14px 0px rgba(0, 0, 0, 0.85);
        z-index: 25;
        opacity: 0;
      }

      .diagram-tag {
        display: inline-block;
        background: #FF6A1A;
        color: #141414;
        font-size: 22px;
        font-weight: 900;
        padding: 6px 14px;
        border-radius: 6px;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 18px;
      }

      .diagram-steps {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .diagram-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #1F1F1F;
        border-radius: 10px;
        padding: 14px 20px;
        font-size: 28px;
        font-weight: 700;

      .diagram-row.step-cut {

      }

      .diagram-row.step-result {
        background: #F7F4EC;

      }

      .row-label {
        color: #F7F4EC;
      }
      .step-result .row-label {
        color: #141414;
        font-weight: 900;
      }

      .row-value {
        font-weight: 900;
        font-size: 32px;
      }

      .val-orange {
        color: #FF8533;
      }
      .val-dark {
        color: #141414;
      }

      .summary-banner {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 2px solid rgba(247, 244, 236, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .summary-banner-text {
        color: #FF8533;
        font-size: 34px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin: 0;
      }

      /* Fall Icon Indicator (Overlay 3: 204.66s -> ~8.96s) */
      #badge-debt-trap {
        position: absolute;
        top: 230px;
        left: 80px;
        height: auto;
        display: flex;
        align-items: center;
        gap: 16px;
        background: #FF6A1A;
        color: #141414;
        padding: 14px 24px;
        border-radius: 12px;
        border: 3px solid #141414;
        box-shadow: 6px 8px 0px #141414;
        z-index: 30;
        opacity: 0;
      }

      .icon-fall-svg {
        width: 36px;
        height: 36px;
        stroke: #141414;
        fill: none;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .badge-trap-text {
        font-size: 26px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin: 0;
      }

      /* Punch Phrase: CHO VAY NẶNG LÃI (Overlay 4: 205.88s -> ~10.18s) */
      #punch-phrase-card {
        position: absolute;
        bottom: 420px;
        left: 60px;
        right: 60px;
        height: auto;
        background: #141414;
        border: 4px solid #FF6A1A;
        border-radius: 16px;
        padding: 26px 30px;
        box-shadow: 10px 14px 0px rgba(0, 0, 0, 0.9);
        z-index: 40;
        text-align: center;
        opacity: 0;
      }

      .punch-phrase-main {
        font-size: 60px;
        font-weight: 900;
        color: #F7F4EC;
        line-height: 1.25;
        margin: 0 0 10px 0;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .punch-phrase-main span {
        color: #FF8533;
      }

      .punch-phrase-sub {
        display: inline-block;
        background: #F7F4EC;
        color: #141414;
        font-size: 26px;
        font-weight: 900;
        padding: 6px 18px;
        border-radius: 6px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin: 0;
      }

      /* Vox Signature Persistent Bottom Orange Bar */
      #vox-signature-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <!-- Root Composition: standalone 1080x1920, duration 12s (195.7s to 207.7s) -->
    <div
      id="root"
      data-composition-id="scene-s22"
      data-width="1080"
      data-height="1920"
      data-duration="12"
    >
      <!-- Background layers -->
      <div class="bg-layer"></div>
      <div class="vignette-overlay"></div>

      <!-- Camera Zoom Rig (controls camera zoom 0-12s) -->
      <div id="camera-zoom">
        <!-- Camera Entrance Rig (controls wobble-drop physics 0-0.65s) -->
        <div id="camera-entrance">
          <!-- Physical paper tape decorations -->
          <div class="tape-corner tape-tl"></div>
          <div class="tape-corner tape-tr"></div>

          <!-- Video Card with Tremble behavior in last 4s -->
          <div id="video-card-wrapper">
            <div class="video-card">
              <!-- Video timed clip with data-start and data-duration -->
              <video
                id="vid-cat-contract"
                data-start="0"
                data-duration="12"
                muted
                playsinline
                src="assets/vid-08-loan-shark-predatory-contract.mp4"
              ></video>
              <div class="video-shadow-gradient"></div>
            </div>
          </div>

          <!-- Overlay 1: Không có tiền mua đất (at ~1.02s) -->
          <div id="badge-no-money">
            <div class="icon-question-box">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" />
                <path d="M9.5 9a2.5 2.5 0 0 1 4.8 1c-.4 1.2-1.8 1.6-1.8 2.5v.5" />
                <circle cx="12" cy="16.5" r="0.7" fill="#141414" />
              </svg>
            </div>
            <p class="badge-text-title">KHÔNG CÓ TIỀN MUA ĐẤT</p>
          </div>

          <!-- Overlay 2: Diagram Vay 100 - Cầm về 80 (at ~5.35s) -->
          <div id="diagram-loan-breakdown">
            <div class="diagram-tag">CƠ CHẾ TÍN DỤNG ĐEN</div>
            <div class="diagram-steps">
              <div class="diagram-row" id="row-step-1">
                <span class="row-label">HỢP ĐỒNG GHI VAY:</span>
                <span class="row-value">100 CÁ</span>
              </div>
              <div class="diagram-row step-cut" id="row-step-2">
                <span class="row-label">CẮT LÃI TRƯỚC (1 THÁNG):</span>
                <span class="row-value val-orange">-20 CÁ</span>
              </div>
              <div class="diagram-row step-result" id="row-step-3">
                <span class="row-label">THỰC TẾ CẦM VỀ:</span>
                <span class="row-value val-dark">80 CÁ</span>
              </div>
            </div>
            <div class="summary-banner" id="row-summary">
              <p class="summary-banner-text">VAY 100 — CẦM VỀ 80</p>
            </div>
          </div>

          <!-- Overlay 3: Fall Icon / Bẫy nợ (at ~8.96s) -->
          <div id="badge-debt-trap">
            <svg class="icon-fall-svg" viewBox="0 0 24 24">
              <path d="M12 3v12" />
              <path d="m7 10 5 5 5-5" />
              <path d="M4 19h16" />
              <path d="m18 15 3 4-3 2" />
            </svg>
            <p class="badge-trap-text">BẪY NỢ CẮT LÃI TRƯỚC</p>
          </div>

          <!-- Overlay 4: Punch-phrase Cho vay nặng lãi (at ~10.18s) -->
          <div id="punch-phrase-card">
            <h1 class="punch-phrase-main">CHO VAY <span>NẶNG LÃI</span></h1>
            <div class="punch-phrase-sub">HOẶC LÀ BỐC BÁT HỌ</div>
          </div>
        </div>
      </div>

      <!-- Signature bottom orange bar -->
      <div id="vox-signature-bar"></div>
    </div>

    <!-- Animation Runtime (Seek-safe GSAP) -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Scene Entrance: wobble-drop physics on #camera-entrance (y and rotation only)
      tl.fromTo(
        "#camera-entrance",
        { y: -75, rotation: 1.6 },
        { y: 0, rotation: 0, duration: 0.65, ease: "power3.out" },
        0
      );

      // 2. Slow Camera Zoom-in on #camera-zoom (scale only, 12s linear)
      tl.fromTo(
        "#camera-zoom",
        { scale: 1 },
        { scale: 1.05, duration: 12, ease: "none" },
        0
      );

      // 3. Overlay 1: "KHÔNG CÓ TIỀN MUA ĐẤT" (196.72s -> ~1.02s)
      tl.fromTo(
        "#badge-no-money",
        { opacity: 0, y: -24, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
        1.02
      );
      // Exit overlay 1 at 3.5s
      tl.to(
        "#badge-no-money",
        { opacity: 0, y: -16, duration: 0.35, ease: "power2.in" },
        3.5
      );

      // 4. Overlay 2: Diagram Card "VAY 100 - CẦM VỀ 80" (201.05s -> ~5.35s)
      tl.fromTo(
        "#diagram-loan-breakdown",
        { opacity: 0, scale: 0.92, y: 30 },
        { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" },
        5.35
      );
      // Stagger internal diagram rows
      tl.fromTo(
        "#row-step-1",
        { opacity: 0, x: -16 },
        { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" },
        5.55
      );
      tl.fromTo(
        "#row-step-2",
        { opacity: 0, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.5)" },
        5.95
      );
      tl.fromTo(
        "#row-step-3",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        6.45
      );
      tl.fromTo(
        "#row-summary",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" },
        6.85
      );
      // Exit Diagram at 7.95s
      tl.to(
        "#diagram-loan-breakdown",
        { opacity: 0, scale: 0.96, duration: 0.3, ease: "power2.in" },
        7.95
      );

      // 5. Freeze frame tremble effect in last 4 seconds (8.0s - 12.0s)
      // Deterministic keyframe offsets simulate nervous tension without Math.random()
      const tremorSteps = [
        { t: 8.0, x: 2.5, y: -1.5, r: 0.25 },
        { t: 8.25, x: -2.0, y: 2.0, r: -0.2 },
        { t: 8.5, x: 3.0, y: -2.0, r: 0.3 },
        { t: 8.75, x: -2.5, y: 1.5, r: -0.25 },
        { t: 9.0, x: 2.0, y: -2.5, r: 0.2 },
        { t: 9.25, x: -3.0, y: 2.0, r: -0.3 },
        { t: 9.5, x: 2.5, y: -1.0, r: 0.25 },
        { t: 9.75, x: -2.0, y: 2.5, r: -0.2 },
        { t: 10.0, x: 3.0, y: -1.5, r: 0.3 },
        { t: 10.25, x: -2.5, y: 2.0, r: -0.25 },
        { t: 10.5, x: 2.0, y: -2.0, r: 0.2 },
        { t: 10.75, x: -3.0, y: 1.5, r: -0.3 },
        { t: 11.0, x: 2.0, y: -1.5, r: 0.2 },
        { t: 11.25, x: -2.0, y: 2.0, r: -0.2 },
        { t: 11.5, x: 1.5, y: -1.0, r: 0.15 },
        { t: 11.75, x: -1.0, y: 1.0, r: -0.1 },
        { t: 12.0, x: 0, y: 0, r: 0 }
      ];

      tremorSteps.forEach((step) => {
        tl.to(
          "#video-card-wrapper",
          {
            x: step.x,
            y: step.y,
            rotation: step.r,
            duration: 0.24,
            ease: "sine.inOut"
          },
          step.t
        );
      });

      // 6. Overlay 3: Fall Icon / Debt Trap (204.66s -> ~8.96s)
      tl.fromTo(
        "#badge-debt-trap",
        { opacity: 0, y: -25, scale: 0.9 },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
        8.96
      );
      tl.to(
        "#badge-debt-trap",
        { opacity: 0, y: -15, duration: 0.35, ease: "power2.in" },
        11.16
      );

      // 7. Overlay 4: Punch-phrase "CHO VAY NẶNG LÃI" (205.88s -> ~10.18s)
      // Held for 1.82s (>= 1.6s standard) until 12.0s
      tl.fromTo(
        "#punch-phrase-card",
        { opacity: 0, scale: 0.92, y: 28 },
        { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" },
        10.18
      );
      tl.fromTo(
        ".punch-phrase-sub",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
        10.45
      );

      // Register master timeline
      window.__timelines["scene-s22"] = tl;
    </script>
  
    </template>
  </body>
