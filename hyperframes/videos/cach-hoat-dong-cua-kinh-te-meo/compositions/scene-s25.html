    <script>
      const tl = gsap.timeline({ paused: true });

      // Path setup for Money Icon
      const moneyCircle = document.getElementById("money-path-circle");
      const moneySymbol = document.getElementById("money-path-symbol");
      if (moneyCircle && moneySymbol) {
        const lenCircle = moneyCircle.getTotalLength();
        const lenSymbol = moneySymbol.getTotalLength();
        moneyCircle.style.strokeDasharray = lenCircle;
        moneyCircle.style.strokeDashoffset = lenCircle;
        moneySymbol.style.strokeDasharray = lenSymbol;
        moneySymbol.style.strokeDashoffset = lenSymbol;
      }

      /* ===================================================
         SHOT 1 ANIMATION (0.0s - 4.8s)
         =================================================== */

      // Camera motion: continuous subtle zoom-in
      tl.fromTo(
        "#shot1-rig",
        { scale: 1 },
        { scale: 1.05, duration: 4.8, ease: "none" },
        0
      );

      // Columns rising up
      tl.fromTo(
        ["#col-food", "#col-rent", "#col-play"],
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.6, stagger: 0.12, ease: "power3.out" },
        0.2
      );

      // Fish items pop inside columns
      tl.fromTo(
        ".s1-fish",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, stagger: 0.08, ease: "power3.out" },
        0.5
      );

      // Overlay Label: CHI PHÍ SỐNG: 5 CÁ (atMs: 228820 -> 1.12s)

        "#s1-label",
