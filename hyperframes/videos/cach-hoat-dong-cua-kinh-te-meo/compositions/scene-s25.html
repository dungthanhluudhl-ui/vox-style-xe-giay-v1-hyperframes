      // 1. Prepare SVG self-drawing stroke parameters deterministically
      const drawPaths = document.querySelectorAll(
        ".draw-path, .draw-path-orange, .draw-path-light"
      );
      drawPaths.forEach(function (path) {
        let len = 200;
        try {
          if (typeof path.getTotalLength === "function") {
            const l = path.getTotalLength();
            if (l > 0) len = Math.ceil(l) + 2;
          }
        } catch (e) {
          len = 200;
        }
        path.setAttribute("data-len", len);
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
      });

      // 2. Build Single Paused Timeline for the Scene
      const tl = gsap.timeline({ paused: true });

      // Camera motion: continuous subtle zoom-in on video background

        "#hero-video",
        { scale: 1.0 },
        { scale: 1.08, duration: 6.94, ease: "none" },
        0
      );

      // Ruled chart lines sweep in from left (entrance transition)
      tl.fromTo(
        ".chart-line",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.6, stagger: 0.08, ease: "power3.out" },
        0.15
