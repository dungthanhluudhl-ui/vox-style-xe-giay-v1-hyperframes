    <!-- GSAP Seekable Timeline Script -->
    <script>
      // Initialize single paused timeline
      const tl = gsap.timeline({ paused: true });

      // Path length calculation for SVG stroke animations
      const growthPath = document.querySelector("#growth-path");
      let growthLen = 1000;
      if (growthPath) {
        growthLen = growthPath.getTotalLength();
        growthPath.style.strokeDasharray = growthLen;
        growthPath.style.strokeDashoffset = growthLen;
      }

      const sinePath = document.querySelector("#sine-path");
      let sineLen = 1500;
      if (sinePath) {
        sineLen = sinePath.getTotalLength();
        sinePath.style.strokeDasharray = sineLen;
        sinePath.style.strokeDashoffset = sineLen;
      }

      // ================= SHOT S27-1 ANIMATION (0.0s - 5.1s) =================
      // Wobble-drop entrance on Card 1
      tl.fromTo(
        "#card-1",
        { y: -180, rotation: -3, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
        0.15
      );

      // Camera zoom-in motion on image in Shot 1
      tl.fromTo(
        "#img-s1",
        { scale: 1.0 },
        { scale: 1.15, duration: 5.1, ease: "none" },
        0
      );

      // Growth curve SVG path trace
      if (growthPath) {
        tl.fromTo(
          growthPath,
          { strokeDashoffset: growthLen },
          { strokeDashoffset: 0, duration: 1.5, ease: "power2.out" },
          0.8
        );
      }
      tl.fromTo(
        "#growth-dot",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        2.1
      );
      tl.fromTo(
        "#growth-badge",
        { scale: 0, opacity: 0, y: -15 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.7
      );

      // Shot 1 Overlay Label at 2.22s (251920ms rel 0)
      tl.fromTo(
        "#label-s27-1",
        { scale: 0.9, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        2.22
      );

      // ================= SHOT S27-2 ANIMATION (5.1s - 10.0s) =================
      // Card 2 entrance at 5.15s (cut transition into pan-right motion)
      tl.fromTo(
        "#card-2",
        { x: 130, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        5.15
      );

      // Camera pan-right motion on image img-11 in Shot 2
      tl.fromTo(
        "#img-s2",
        { x: 0 },
        { x: -160, duration: 4.9, ease: "none" },
        5.1
      );

      // Volatile sine wave trace
      if (sinePath) {
        tl.fromTo(
          sinePath,
          { strokeDashoffset: sineLen },
          { strokeDashoffset: 0, duration: 1.8, ease: "power1.inOut" },
          5.4
        );
      }

      // Volatility callout badges
      tl.fromTo(
        "#peak-badge",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        6.7
      );
      tl.fromTo(
        "#valley-badge",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        7.3
      );

      // Punch phrase overlay "ĐẦU TƯ MẠO HIỂM" at 8.48s (258180ms rel 0)
      tl.fromTo(
        "#overlay-s27-2",
        { scale: 0.94, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        8.48
      );

      // Warning icon pop at 8.98s (258680ms rel 0)
      tl.fromTo(
        "#icon-warning",
        { scale: 0, rotation: -25, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        8.98
      );

      // Register timeline for seekable HyperFrames engine
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s27"] = tl;
    </script>
