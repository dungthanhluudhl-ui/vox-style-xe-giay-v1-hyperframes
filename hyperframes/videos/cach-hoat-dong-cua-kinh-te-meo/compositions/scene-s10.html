    // Initialize travel path dash pattern strictly before build
    const travelPathEl = document.getElementById("s2-travel-path");
    const travelLen = travelPathEl && travelPathEl.getTotalLength ? Math.ceil(travelPathEl.getTotalLength()) : 740;
    if (travelPathEl) {
      travelPathEl.style.strokeDasharray = travelLen + "px";
      travelPathEl.style.strokeDashoffset = travelLen + "px";
    }

    // Set initial seek states for Shot 1 and Shot 2 elements
    gsap.set("#s1-label-overlay", { opacity: 0 });
    gsap.set("#s2-punch-card", { opacity: 0 });
    gsap.set("#s2-paw-1", { opacity: 0 });
    gsap.set("#s2-paw-2", { opacity: 0 });
    gsap.set("#s2-paw-3", { opacity: 0 });
    gsap.set("#s2-pin-icon", { opacity: 0 });
    gsap.set("#s2-pin-label", { opacity: 0 });

    // Single paused timeline registered on window.__timelines["scene-s10"]
    const tl = gsap.timeline({ paused: true });

    /* ---------------------------------------------------------
       SHOT 1 TIMELINE (0.0s - 6.8s)
       --------------------------------------------------------- */
    // Transition in: zoom-through entrance
    tl.fromTo("#s1-camera",
      { scale: 1.15, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.8, ease: "power3.out" },
      0.0
    );

    // Header and UI reveal
    tl.fromTo(".s1-kicker-wrap",
      { opacity: 0, scale: 0.95 },
      { opacity: 1, scale: 1.0, duration: 0.45, ease: "power2.out" },
      0.2
    );
    tl.fromTo(".s1-header-card",
      { opacity: 0, scale: 0.96 },
      { opacity: 1, scale: 1.0, duration: 0.55, ease: "power3.out" },
      0.35
    );

    // Map board unfolds
    tl.fromTo(".s1-map-board",
      { scale: 0.94, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.65, ease: "power3.out" },
      0.5
    );

    // Stagger entrance of Left problem cards
    tl.fromTo(".zone-left .map-card",
      { x: -35, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.5, stagger: 0.14, ease: "power3.out" },
      0.75
    );

    // Boundary divider springs up
    tl.fromTo(".border-divider",
      { scaleY: 0, opacity: 0 },
      { scaleY: 1, opacity: 1, duration: 0.6, ease: "power2.out", transformOrigin: "top center" },
      0.9
    );

    // Right territory opportunity unfolds
    tl.fromTo(".zone-right",
      { x: 35, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
      1.1
    );

    // Camera Motion: Subtle slow zoom-in on the problem area
    tl.to("#s1-camera",
      { scale: 1.05, duration: 5.3, ease: "sine.inOut" },
      1.5
    );

    // Overlay Label (Shotlist atMs: 92140ms -> rel: 5.44s): "PATE ĐẮT & KÉM VỊ"
    // Using clean spring pop-entrance without rotation to prevent AABB bounding box collision
    tl.fromTo("#s1-label-overlay",
      { scale: 0.85, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.45, ease: "power3.out" },
      5.44
    );

    /* ---------------------------------------------------------
       SHOT 2 TIMELINE (6.8s - 12.0s)
       --------------------------------------------------------- */
    // Transition in: Cut cleanly at 6.8s
    tl.fromTo(".s2-tracker-bar",
      { opacity: 0, scale: 0.96 },
      { opacity: 1, scale: 1.0, duration: 0.45, ease: "power2.out" },
      6.85
    );
    tl.fromTo(".s2-map-canvas",
      { scale: 0.95, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.6, ease: "power3.out" },
      6.9
    );

    // Camera motion: continuous pan-right feeling across expedition board
    tl.fromTo("#s2-camera",
      { x: 30 },
      { x: -25, duration: 5.2, ease: "none" },
      6.8
    );

    // Travel path progressively self-drawing across the border
    tl.fromTo("#s2-travel-path",
      { strokeDashoffset: travelLen },
      { strokeDashoffset: 0, duration: 1.8, ease: "power2.out" },
      7.1
    );

    // Paw prints pop sequentially along the path
    tl.fromTo("#s2-paw-1",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      7.5
    );
    tl.fromTo("#s2-paw-2",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      8.1
    );
    tl.fromTo("#s2-paw-3",

      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },

    // Punch Phrase Overlay (Shotlist atMs: 95700ms -> rel: 9.0s): "KHẢO SÁT VÙNG BIÊN"

      { y: -65, opacity: 0, scale: 0.6 },
      { y: 0, opacity: 1, scale: 1.0, duration: 0.45, ease: "power3.out" },
      10.12

    tl.fromTo("#s2-pin-label",

      { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" },
      10.35
    );

    // Sonar radar rings radiating from pin
    tl.fromTo("#s2-sonar-1",
      { scale: 0.2, opacity: 0.85 },
      { scale: 2.2, opacity: 0, duration: 1.1, ease: "power2.out" },
      10.3
    );
    tl.fromTo("#s2-sonar-2",
      { scale: 0.2, opacity: 0.85 },
      { scale: 2.2, opacity: 0, duration: 1.1, ease: "power2.out" },
      10.55
    );

    // Final registration on window.__timelines
    window.__timelines["scene-s10"] = tl;
