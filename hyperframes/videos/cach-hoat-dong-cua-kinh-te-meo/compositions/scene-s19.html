        <!-- OVERLAY 3: PUNCH PHRASE "LÒNG THAM VÔ ĐỘ" (7.4s - 9.0s) -->
        <div id="punch-phrase-card">
          <div class="punch-prefix">[ ĐỘNG CƠ CỐT LÕI // KẾT LUẬN ]</div>
          <div class="punch-headline">LÒNG THAM VÔ ĐỘ</div>
          <div class="punch-subtext">MỤC TIÊU TIẾP THEO: ĐỘC CHIẾM 100% TOÀN BỘ NGUỒN CÁ</div>
        </div>
      </div>

      <!-- Dải cam đáy thương hiệu -->
      <div id="bottom-brand-bar"></div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. Chuyển động Camera Rig
    tl.fromTo(
      "#camera-rig",
      { scale: 0.92, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.7, ease: "power3.out" },
      0
    );

    tl.to(
      "#camera-rig",
      { scale: 0.96, duration: 8.3, ease: "sine.out" },
      0.7
    );

    // 2. Setup nét vẽ SVG
    const routeNorth = document.querySelector("#route-north");
    const routeEast = document.querySelector("#route-east");
    const routeWest = document.querySelector("#route-west");
    const routeSouth = document.querySelector("#route-south");
    const routeList = [routeNorth, routeEast, routeWest, routeSouth];

    routeList.forEach(function (el) {
      if (el) {
        const len = el.getTotalLength() || 500;
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
      }
    });

    const pinPath = document.querySelector("#pin-path");
    if (pinPath) {
      const len = pinPath.getTotalLength() || 130;
      pinPath.style.strokeDasharray = len;
      pinPath.style.strokeDashoffset = len;
    }

    const riseArrow = document.querySelector("#rise-arrow");
    if (riseArrow) {
      const len = riseArrow.getTotalLength() || 90;
      riseArrow.style.strokeDasharray = len;
      riseArrow.style.strokeDashoffset = len;
    }

    const riseHead = document.querySelector("#rise-head");
    if (riseHead) {
      const len = riseHead.getTotalLength() || 40;
      riseHead.style.strokeDasharray = len;
      riseHead.style.strokeDashoffset = len;
    }

    // Node Trung tâm Mafia
    tl.fromTo(
      "#node-center",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
      0.2
    );

    // Các tuyến buôn lậu tỏa ra
    routeList.forEach(function (el, index) {
      if (el) {
        const len = el.getTotalLength() || 500;
        tl.fromTo(
          el,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" },
          0.4 + index * 0.16
        );
      }
    });

    // Các Node vệ tinh
    const satelliteNodes = ["#node-north", "#node-east", "#node-west", "#node-south"];
    satelliteNodes.forEach(function (nodeId, index) {
      tl.fromTo(
        nodeId,
        { scale: 0, opacity: 0, y: 12 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.85 + index * 0.14
      );
    });

    // Cargo tags
    const cargoTags = ["#cargo-tag-1", "#cargo-tag-2", "#cargo-tag-3", "#cargo-tag-4"];
    cargoTags.forEach(function (tagId, index) {
      tl.fromTo(
        tagId,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        1.1 + index * 0.1
      );
    });

    // 3. OVERLAY 1: PIN ICON & LABEL BÀNH TRƯỚNG ĐA RỪNG (0.9s - 3.7s)
    tl.fromTo(
      "#header-banner-1",
      { opacity: 0, y: -20 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      0.9
    );

    if (pinPath) {
      const lenPin = pinPath.getTotalLength() || 130;
      tl.fromTo(
        pinPath,
        { strokeDashoffset: lenPin },
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        0.95
      );
    }

    tl.fromTo(
      "#pin-dot",
      { scale: 0, transformOrigin: "24px 20px" },
      { scale: 1, duration: 0.25, ease: "power3.out" },
      1.15
    );

    tl.fromTo(
      "#banner-text-1",
      { opacity: 0, x: -16 },
      { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
      1.3
    );

    tl.to(
      "#header-banner-1",
      { opacity: 0, y: -15, duration: 0.3, ease: "power2.in" },
      3.7
    );

    // 4. DATA CHART TÀI SẢN
    tl.fromTo("#bar-1", { scaleY: 0 }, { scaleY: 1, duration: 0.45, ease: "power3.out" }, 3.5);
    tl.fromTo("#bar-2", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power3.out" }, 3.65);
    tl.fromTo("#bar-3", { scaleY: 0 }, { scaleY: 1, duration: 0.55, ease: "power3.out" }, 3.8);

    tl.fromTo(
      "#bar-4",
      { scaleY: 0 },
      { scaleY: 1, duration: 1.2, ease: "power3.out" },
      4.2
    );

    tl.fromTo(
      "#mafia-crown-badge",
      { scale: 0, opacity: 0, y: 20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      4.8
    );

    // Bộ đếm cá tăng từ 12.000 lên 380.000 cá
    const fishCounter = { count: 12000 };
    const counterEl = document.getElementById("fish-counter-val");
    tl.to(
      fishCounter,
      {
        count: 380000,
        duration: 3.3,
        ease: "power2.out",
        onUpdate: function () {
          if (counterEl) {
            counterEl.innerText = Math.floor(fishCounter.count).toLocaleString("vi-VN") + " CÁ";
          }
        }
      },
      4.2
    );

    // 5. OVERLAY 2: RISE ICON & LABEL GIÀU NHẤT KHU RỪNG (4.58s - 7.3s)
    tl.fromTo(
      "#header-banner-2",
      { opacity: 0, y: -20 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      4.58
    );

    if (riseArrow && riseHead) {
      const lenArrow = riseArrow.getTotalLength() || 90;
      const lenHead = riseHead.getTotalLength() || 40;
      tl.fromTo(
        riseArrow,
        { strokeDashoffset: lenArrow },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        4.65
      );
      tl.fromTo(
        riseHead,
        { strokeDashoffset: lenHead },
        { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
        5.05
      );
    }

    tl.fromTo(
      "#banner-text-2",
      { opacity: 0, x: -16 },
      { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
      5.61
    );

    tl.to(
      "#header-banner-2",
      { opacity: 0, y: -15, duration: 0.3, ease: "power2.in" },
      7.3
    );

    // 6. OVERLAY 3: PUNCH PHRASE "LÒNG THAM VÔ ĐỘ" (7.4s - 9.0s)
    tl.fromTo(
      "#punch-phrase-card",
      { scale: 0.94, opacity: 0, y: 20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      7.4
    );

    // Đăng ký timeline paused vào window.__timelines
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s19"] = tl;
  </script>

    </template>
  </body>
