    <script>
      // Timeline gốc paused: bắt buộc cho Seek runtime của HyperFrames
      const tl = gsap.timeline({ paused: true });

      // SHOT 1 CHOREOGRAPHY (0.0s -> 4.48s)
      // Entrance: unfold hiệu ứng mở bản đồ
      tl.fromTo(
        "#vid-wrapper",
        { scale: 0.94, y: -24, opacity: 0.4 },
        { scale: 1.0, y: 0, opacity: 1, duration: 0.7, ease: "power2.out" },
        0
      );

      // Camera pan-left nhẹ nhàng suốt shot 1
      tl.fromTo(
        "#vid-s19",
        { x: 30, scale: 1.05 },
        { x: -30, scale: 1.05, duration: 4.48, ease: "none" },
        0
      );

      // Label Shot 1 xuất hiện tại t = 2.68s
      tl.fromTo(
        "#shot1-label-card",
        { scale: 0.86, y: -24, opacity: 0 },
        { scale: 1.0, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        2.68
      );

      // SHOT 2 CHOREOGRAPHY (4.48s -> 9.00s)
      // Transition cut: sang ảnh img-15, zoom-in liên tục
      tl.fromTo(
        "#shot2-media-wrap",
        { scale: 1.0 },
        { scale: 1.12, duration: 4.52, ease: "none" },
        4.48
      );

      // Diagram chia lô xuất hiện dạng pop-in có trật tự
      tl.fromTo(
        "#diagram-box",
        { scale: 0.88, opacity: 0, y: 30 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        4.85
      );

      // Punch Phrase Shot 2 xuất hiện tại t = 6.74s
      tl.fromTo(
        "#punch-card-wrapper",
        { scale: 0.85, y: -30, opacity: 0 },
        { scale: 1.0, y: 0, opacity: 1, duration: 0.48, ease: "power3.out" },
        6.74
      );

      // Đăng ký timeline cho HyperFrames seek
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s19"] = tl;
    </script>
