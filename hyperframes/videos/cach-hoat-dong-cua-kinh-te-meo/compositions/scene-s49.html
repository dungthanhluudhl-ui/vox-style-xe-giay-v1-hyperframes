<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      width: 1080px;
      height: 1920px;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    /* Quy ước bắt buộc: .clip dùng inset: 0, không set width/height px cứng */
    .clip {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Ảnh minh họa AI Flow (img-20) làm nền toàn khung hình, nguyên màu, không viền, không bóng giả */
    .hero-background-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    .hero-full-image {
      position: absolute;
      top: -40px;
      left: -40px;
      width: 1320px;
      height: 2000px;
      object-fit: cover;
      object-position: left center;
      display: block;
      /* Style DNA Stage 2b: giữ nguyên màu nguyên gốc, không filter grayscale, không bóng giả */
    }

    /* Nền biến thể 'chart': 4 đường kẻ ngang đậm + vạch chia cam mép trái (z-index trên ảnh nền) */
    .chart-overlay-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .chart-ruled-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background-color: rgba(20, 20, 20, 0.28);
    }
    .chart-line-1 { top: 20%; }
    .chart-line-2 { top: 40%; }
    .chart-line-3 { top: 60%; }
    .chart-line-4 { top: 80%; }

    .chart-tick {
      position: absolute;
      left: 0;
      width: 16px;
      height: 4px;
      background-color: #FF6A1A;
    }

    /* Thanh cam thương hiệu cố định mép dưới khung hình */
    .signature-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 90;
    }

    /* Overlay 1: Thẻ Label "KÍCH CẦU THỰC CHẤT" (t = 1.3s -> 3.8s) */
    .label-card-container {
      position: absolute;
      top: 240px;
      left: 70px;
      width: 940px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      z-index: 40;
    }

    .label-sub-tag {
      background-color: #FF6A1A;
      color: #141414;
      font-weight: 900;
      font-size: 26px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 8px 20px;
      border: 3px solid #141414;
    }

    .label-main-plate {
      background-color: #141414;
      color: #F7F4EC;
      font-weight: 900;
      font-size: 60px;
      line-height: 1.15;
      padding: 18px 30px;
      border-left: 12px solid #FF6A1A;
      text-transform: uppercase;
    }

    /* Overlay 2: Diagram Chu trình kinh tế & Đồ thị đi lên (t = 2.8s -> 5.9s) */
    .diagram-panel {
      position: absolute;
      top: 700px;
      left: 70px;
      width: 940px;
      background-color: #141414;
      border: 4px solid #141414;
      border-radius: 8px;
      padding: 28px 32px;
      box-shadow: 16px 16px 0px #FF6A1A;
      z-index: 50;
    }

    .diagram-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(247, 244, 236, 0.2);
    }

    .diagram-title {
      font-weight: 900;
      font-size: 28px;
      color: #FF6A1A;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .diagram-metric-label {
      font-weight: 700;
      font-size: 22px;
      color: #141414;
      background-color: #F5F0E4;
      padding: 4px 14px;
      border-radius: 4px;
    }

    .cycle-flow-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .flow-step-box {
      flex: 1;
      background-color: #F5F0E4;
      color: #141414;
      padding: 14px 10px;
      text-align: center;
      border: 2px solid #141414;
      font-weight: 900;
      font-size: 22px;
      line-height: 1.25;
      box-shadow: 4px 4px 0px #FF6A1A;
    }

    .flow-arrow-indicator {
      width: 44px;
      text-align: center;
      color: #FF6A1A;
      font-size: 28px;
      font-weight: 900;
    }

    .chart-curve-svg-box {
      position: relative;
      width: 100%;
      height: 110px;
      background-color: rgba(247, 244, 236, 0.05);
      border: 1px dashed rgba(247, 244, 236, 0.25);
      border-radius: 4px;
    }

    .chart-curve-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Overlay 3: Punch Phrase "CHÍNH SÁCH TÀI KHÓA" (t = 6.0s -> 8.0s) */
    .punch-container {
      position: absolute;
      top: 560px;
      left: 70px;
      width: 940px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 60;
    }

    .punch-card-wrapper {
      width: 100%;
      background-color: #141414;
      border: 5px solid #141414;
      border-radius: 10px;
      padding: 40px 32px;
      box-shadow: 18px 18px 0px #FF6A1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .punch-tagline {
      display: inline-block;
      background-color: #FF6A1A;
      color: #141414;
      font-size: 26px;
      font-weight: 900;
      padding: 6px 20px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: 2px solid #141414;
    }

    .punch-main-text {
      color: #F7F4EC;
      font-size: 68px;
      font-weight: 900;
      line-height: 1.25;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      max-width: 880px;
    }

    .punch-footnote {
      margin-top: 18px;
      color: #FF6A1A;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
    }
  </style>

  <div id="root" data-composition-id="scene-s49" data-width="1080" data-height="1920" data-duration="8">
    
    <!-- Lớp ảnh nền toàn khung hình (img-20) cho toàn bộ thời lượng 8s -->
    <section id="shot-main-visual" class="clip" data-start="0" data-duration="8">
      <div id="hero-bg-container" class="hero-background-wrapper">
        <img 
          id="hero-img" 
          class="hero-full-image" 
          src="assets/img-20-public-debt-infrastructure-loan-cutout.jpeg" 
          alt="Đàn mèo công nhân và dòng tiền tuần hoàn"
        />
      </div>
    </section>

    <!-- Biến thể nền Chart: 4 đường kẻ ngang đậm có vạch chia cam nhận diện -->
    <div class="chart-overlay-lines">
      <div class="chart-ruled-line chart-line-1"><div class="chart-tick"></div></div>
      <div class="chart-ruled-line chart-line-2"><div class="chart-tick"></div></div>
      <div class="chart-ruled-line chart-line-3"><div class="chart-tick"></div></div>
      <div class="chart-ruled-line chart-line-4"><div class="chart-tick"></div></div>
    </div>

    <!-- Thanh cam thương hiệu mép dưới khung hình -->
    <div class="signature-bottom-bar"></div>

    <!-- Overlay 1: Nhãn 'KÍCH CẦU THỰC CHẤT' (atMs: 433070 -> ~1.3s) -->
    <div id="clip-label-overlay" class="clip" data-start="1.3" data-duration="2.5">
      <div id="label-card-content" class="label-card-container">
        <div class="label-sub-tag">TUẦN HOÀN DÒNG TIỀN</div>
        <div class="label-main-plate">KÍCH CẦU THỰC CHẤT</div>
      </div>
    </div>

    <!-- Overlay 2: Diagram 'Chu trình tiền tệ & Đồ thị đi lên' (t = 2.8s -> 5.9s) -->
    <div id="clip-diagram-overlay" class="clip" data-start="2.8" data-duration="3.1">
      <div id="diagram-box-content" class="diagram-panel">
        <div class="diagram-header">
          <span class="diagram-title">CHU TRÌNH HỒI PHỤC</span>
          <span class="diagram-metric-label">TĂNG TRƯỞNG GDP ↑</span>
        </div>

        <div class="cycle-flow-container">
          <div id="flow-node-1" class="flow-step-box">1. TRẢ LƯƠNG<br>CÔNG NHÂN</div>
          <div class="flow-arrow-indicator">➔</div>
          <div id="flow-node-2" class="flow-step-box">2. MUA PATE<br>TIÊU DÙNG</div>
          <div class="flow-arrow-indicator">➔</div>
          <div id="flow-node-3" class="flow-step-box">3. SẢN XUẤT<br>HỒI SINH</div>
        </div>

        <!-- SVG đồ thị dốc đi lên được vẽ bằng stroke-dashoffset -->
        <div class="chart-curve-svg-box">
          <svg class="chart-curve-svg" viewBox="0 0 870 110" preserveAspectRatio="none">
            <!-- Trục cơ sở nhạt -->
            <line x1="20" y1="95" x2="850" y2="95" stroke="rgba(247,244,236,0.2)" stroke-width="2" />
            <!-- Đường cong tăng trưởng kinh tế màu cam -->
            <path 
              id="growth-path" 
              d="M 25 90 Q 300 85, 520 50 T 840 18" 
              fill="none" 
              stroke="#FF6A1A" 
              stroke-width="8" 
              stroke-linecap="round"
            />
            <!-- Điểm nút đích dốc đỉnh -->
            <circle id="growth-dot" cx="840" cy="18" r="9" fill="#F7F4EC" stroke="#141414" stroke-width="4" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Overlay 3: Punch Phrase 'CHÍNH SÁCH TÀI KHÓA' (atMs: 438440 -> ~6.0s đến 8.0s) -->
    <div id="clip-punch-overlay" class="clip" data-start="6.0" data-duration="2.0">
      <div id="punch-card-content" class="punch-container">
        <div class="punch-card-wrapper">
          <div class="punch-tagline">CƠ CHẾ KINH TẾ CỐT LÕI</div>
          <div class="punch-main-text">CHÍNH SÁCH TÀI KHÓA</div>
          <div class="punch-footnote">CHI TIÊU CÔNG KÍCH HOẠT TIÊU DÙNG</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Đảm bảo chỉ dùng đúng 1 timeline PAUSED và gắn vào window.__timelines["scene-s49"]
    const tl = gsap.timeline({ paused: true });

    // 1. Phân cảnh mở đầu: Hiệu ứng 'rise' vào cảnh và camera pan-left quét qua bức tranh nền toàn khung
    tl.fromTo(
      "#hero-bg-container",
      { y: 50, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
      0
    );

    // Camera pan-left: chuyển dịch góc quay từ công nhân nhận lương sang các hoạt động kinh tế
    tl.fromTo(
      "#hero-img",
      { x: 40, scale: 1.05 },
      { x: -180, scale: 1.12, duration: 8.0, ease: "sine.out" },
      0
    );

    // 2. Chuyển động cho Thẻ Label 1: "KÍCH CẦU THỰC CHẤT" (t = 1.3s -> 3.8s)
    tl.fromTo(
      "#label-card-content",
      { y: 30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      1.35
    );
    tl.to(
      "#label-card-content",
      { y: -20, opacity: 0, duration: 0.3, ease: "power2.in" },
      3.45
    );

    // 3. Chuyển động cho Diagram Panel & SVG Path Draw (t = 2.8s -> 5.9s)
    const growthPath = document.getElementById("growth-path");
    if (growthPath) {
      const pathLength = growthPath.getTotalLength();
      growthPath.style.strokeDasharray = pathLength;
      growthPath.style.strokeDashoffset = pathLength;

      // Panel diagram trồi lên nhẹ nhàng
      tl.fromTo(
        "#diagram-box-content",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        2.85
      );

      // 3 khối bước chuyển tiền tuần hoàn xuất hiện theo nhịp stagger
      tl.fromTo(
        "#flow-node-1",
        { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        3.05
      );
      tl.fromTo(
        "#flow-node-2",
        { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        3.25
      );
      tl.fromTo(
        "#flow-node-3",
        { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        3.45
      );

      // Đường cong tăng trưởng (SVG path drawing)
      tl.fromTo(
        "#growth-path",
        { strokeDashoffset: pathLength },
        { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" },
        3.55
      );

      // Nút đỉnh tăng trưởng
      tl.fromTo(
        "#growth-dot",
        { scale: 0, opacity: 0, transformOrigin: "center center" },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        4.35
      );

      // Rút lui trước khi punch phrase xuất hiện
      tl.to(
        "#diagram-box-content",
        { y: -20, opacity: 0, duration: 0.35, ease: "power2.in" },
        5.5
      );
    }

    // 4. Chuyển động Punch Phrase: "CHÍNH SÁCH TÀI KHÓA" (t = 6.0s -> 8.0s)
    tl.fromTo(
      "#punch-card-content",
      { y: 40, scale: 0.94, opacity: 0 },
      { y: 0, scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
      6.05
    );

    // Đăng ký timeline cho HyperFrames seek engine
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s49"] = tl;
  </script>

    </template>
  </body>
</html>
