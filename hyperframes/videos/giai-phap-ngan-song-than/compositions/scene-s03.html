    </style>

    <!-- Composition Root: 1080x1920, duration = 12.24s (32200 - 19960) -->

          <svg id="diagram-angle-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">

      <!-- SHOT 2 Video: direct child của untimed root, không bao bọc bởi clip có data-start khác -->
      <video

      <!-- SHOT 2 Overlays: sibling visual layer với video -->

              <polygon points="730,35 765,50 730,65" fill="#FF6A1A" opacity="0.8" />

    <!-- Master Animation Timeline -->
    <script>
      // Thiết lập trước stroke-dasharray từ hình học thật (synchronous DOM measurement)
      const axisH = document.getElementById("axis-horizontal");
      const axisV = document.getElementById("axis-vertical");
      if (axisH && axisV) {
        const lenH = axisH.getTotalLength();
        axisH.style.strokeDasharray = lenH;
        axisH.style.strokeDashoffset = lenH;
        const lenV = axisV.getTotalLength();
        axisV.style.strokeDasharray = lenV;
        axisV.style.strokeDashoffset = lenV;
      }

      const burstCurve = document.getElementById("burst-curve-path");
      if (burstCurve) {
        const lenCurve = burstCurve.getTotalLength();
        burstCurve.style.strokeDasharray = lenCurve;
        burstCurve.style.strokeDashoffset = lenCurve;
      }

      // Khởi tạo duy nhất 1 GSAP timeline paused
      const tl = gsap.timeline({ paused: true });

      // ========================================================
      // SHOT 1 ANIMATION (0.00s -> 6.04s)
      // ========================================================

      // Transition In: Punch nảy nhẹ vào nội dung Shot 1
      tl.fromTo(
        "#shot-1-content",
        { scale: 0.94, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1.0, opacity: 1, transformOrigin: "50% 50%", duration: 0.35, ease: "power3.out" },
        0
      );

      // Camera motion: zoom chậm vào góc giao 90 độ
      // transformOrigin đặt trực tiếp trong GSAP fromTo thay vì CSS
      tl.fromTo(
        "#img-06-el",
        { scale: 1.0, transformOrigin: "46% 62%" },
        { scale: 1.12, transformOrigin: "46% 62%", duration: 6.04, ease: "sine.inOut" },
        0
      );

      // --- Overlay 1: "GÓC ĐỨNG 90 ĐỘ" (atMs: 20570 -> rel: 0.61s, holdMs: 1900) ---
      tl.fromTo(
        "#badge-angle",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.61
      );
      tl.fromTo(
        "#diagram-angle-svg",
        { opacity: 0, scale: 0.9, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1.0, transformOrigin: "50% 50%", duration: 0.3, ease: "power3.out" },
        0.65
      );
      // Vẽ 2 trục đo góc 90°
      tl.to("#axis-horizontal", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 0.68);
      tl.to("#axis-vertical", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 0.85);

      // Exit Overlay 1 trước khi Overlay 2 vào
      tl.to(
        "#badge-angle",
        { opacity: 0, duration: 0.2, ease: "power1.in" },
        2.20
      );
      tl.to(
        "#diagram-angle-svg",
        { opacity: 0, duration: 0.2, ease: "power1.in" },
        2.20
      );

      // --- Overlay 2: Warning Icon thuần túy trực quan (atMs: 22330 -> rel: 2.37s, holdMs: 1700) ---
      tl.fromTo(
        "#warning-icon-wrap",
        { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1.0, opacity: 1, transformOrigin: "50% 50%", duration: 0.35, ease: "power3.out" },
        2.37
      );
      // Chớp cam đỏ cảnh báo (finite repeat, tất định)
      tl.fromTo(
        "#warning-icon-circle",
        { borderColor: "#FF6A1A" },
        { borderColor: "#F7F4EC", repeat: 3, yoyo: true, duration: 0.15, ease: "none" },
        2.70
      );
      // Exit Warning Icon trước khi Overlay 3 xuất hiện
      tl.to(
        "#warning-icon-wrap",
        { scale: 0.85, opacity: 0, transformOrigin: "50% 50%", duration: 0.22, ease: "power2.in" },
        4.10
      );

      // --- Overlay 3: "KHÔNG GIẢM ĐỘNG NĂNG" (atMs: 24500 -> rel: 4.54s, holdMs: 1500) ---
      tl.fromTo(
        "#badge-no-damping",
        { x: -40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.38, ease: "power3.out" },
        4.54
      );
      // Exit Overlay 3 trước khi cut sang Shot 2
      tl.to(
        "#badge-no-damping",
        { opacity: 0, duration: 0.2, ease: "power1.in" },
        5.85
      );

      // ========================================================
      // SHOT 2 ANIMATION (6.04s -> 12.24s)
      // ========================================================
      // Video vid-05 phát trực tiếp từ data-start="6.04", không tween trên clip owner.
      // Rung camera được ghi vào 1 keyframed writer duy nhất trên dedicated shake wrapper (#shot-2-shake-wrap).
      tl.fromTo(
        "#shot-2-shake-wrap",
        { x: 0, y: 0 },
        {
          keyframes: [
            { x: -16, y: 10, duration: 0.035, ease: "none" },
            { x: 14, y: -12, duration: 0.035, ease: "none" },
            { x: -8, y: 6, duration: 0.035, ease: "none" },
            { x: 0, y: 0, duration: 0.035, ease: "none" }
          ],
          duration: 0.14,
          ease: "none"
        },
        7.80
      );

      // --- Overlay 4: "100% XUNG LỰC" (atMs: 27790 -> rel: 7.83s, holdMs: 2100) ---
      tl.fromTo(
        "#vector-impact-wrap",
        { opacity: 0, x: -40 },
        { opacity: 1, x: 0, duration: 0.35, ease: "power4.out" },
        7.83
      );
      // Hiệu ứng sóng kích nổ shockwave khi vector chạm tường
      tl.fromTo(
        "#impact-ring-1",
        { attr: { r: 10 }, opacity: 1 },
        { attr: { r: 75 }, opacity: 0, duration: 0.5, ease: "power2.out" },
        7.90
      );
      tl.fromTo(
        "#impact-ring-2",
        { attr: { r: 15 }, opacity: 1 },
        { attr: { r: 100 }, opacity: 0, duration: 0.6, ease: "power2.out" },
        7.98
      );
      // Exit Overlay 4
      tl.to(
        "#vector-impact-wrap",
        { opacity: 0, duration: 0.25, ease: "power1.in" },
        9.90
      );

      // --- Overlay 5: "BẮN VỌT QUA ĐỈNH" (atMs: 30780 -> rel: 10.82s, holdMs: 1400) ---
      tl.fromTo(
        "#water-burst-wrap",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        10.82
      );
      // Vẽ quỹ đạo nước bị ép đổi hướng vọt lên đỉnh tường
      tl.to(
        "#burst-curve-path",
        { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
        10.85
      );
      tl.to(
        "#burst-arrowhead",
        { opacity: 1, duration: 0.15, ease: "power1.out" },
        11.20
      );
      tl.to(
        "#burst-spray-path",
        { opacity: 1, duration: 0.25, ease: "power1.out" },
        11.26
      );

      // Đăng ký timeline gốc PAUSED cho root composition mà không khởi tạo lại registry
      window.__timelines["scene-s03"] = tl;
    </script>
