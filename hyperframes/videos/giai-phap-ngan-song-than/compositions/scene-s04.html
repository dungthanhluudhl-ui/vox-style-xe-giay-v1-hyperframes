    <script>
      const tl = gsap.timeline({ paused: true });

      // Measure SVG cross lines for stroke animation
      const line1 = document.getElementById("cross-line-1");
      const line2 = document.getElementById("cross-line-2");
      const len1 = line1 ? line1.getTotalLength() : 450;
      const len2 = line2 ? line2.getTotalLength() : 450;

      if (line1 && line2) {
        line1.style.strokeDasharray = len1;
        line1.style.strokeDashoffset = len1;
        line2.style.strokeDasharray = len2;
        line2.style.strokeDashoffset = len2;
      }

      // 1. Header drop-in (t=0.1s -> 0.6s)
      tl.fromTo(
        "#header-box",
        { y: -24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.1
      );

      // 2. Entrance: 3D Flip revealing the technical card (t=0.22s -> 0.92s)
      tl.fromTo(
        "#main-card",
        {
          rotationY: 72,
          opacity: 0,
          transformPerspective: 1000,
        },
        {
          rotationY: 0,
          opacity: 1,
          duration: 0.7,
          ease: "power3.out",
        },
        0.22
      );

      // 3. Camera pan-down on the seawall failure diagram (t=0.3s -> 7.8s)
      tl.fromTo(
        "#diagram-img",
        { y: 0, scale: 1.02 },
        { y: -55, scale: 1.08, duration: 7.4, ease: "none" },
        0.3
      );

      // 4. Overlay label: "GIẢI PHÁP MẶT DỐC" at 1.67s (33870ms - 32200ms), hold for 2.2s then fade out
      tl.fromTo(
        "#badge-solution",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.67
      );

      tl.to(
        "#badge-solution",
        { scale: 0.85, opacity: 0, duration: 0.3, ease: "power2.in" },
        3.87
      );

      // 5. Misconception card + question icon at 3.53s (35730ms - 32200ms)
      tl.fromTo(
        "#card-misconception",
        { y: 25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        3.53
      );

      tl.fromTo(
        "#icon-question",
        { scale: 0, opacity: 0, rotation: -20 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: "power3.out" },
        3.75
      );

      // 6. Orange negation cross draws over misconception at 4.9s
      if (line1 && line2) {
        tl.to(
          line1,
          { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
          4.9
        );
        tl.to(
          line2,
          { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
          5.15
        );
      }

      // 7. Reality card enters at 5.5s
      tl.fromTo(
        "#card-reality",
        { y: 25, opacity: 0, borderColor: "#141414" },
        { y: 0, opacity: 1, borderColor: "#141414", duration: 0.5, ease: "power3.out" },
        5.5
      );

      // 8. "Fall" icon appears at 6.82s (39020ms - 32200ms)
      tl.fromTo(
        "#icon-fall",
        { scale: 0, opacity: 0, y: -12 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        6.82
      );

      // Highlight reality card border
      tl.to(
        "#card-reality",
        { borderColor: "#FF6A1A", duration: 0.3, ease: "power2.out" },
        6.85
      );

      // Register the paused timeline with HyperFrames runtime
      window.__timelines["scene-s04"] = tl;
    </script>
