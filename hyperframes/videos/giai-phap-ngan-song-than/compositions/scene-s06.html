<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Nền ô vuông 84px đặc trưng Vox */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.14) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.14) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        background-position: center center;
        z-index: 1;
      }

      /* Dải cam thương hiệu cố định mép đáy */
      .vox-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 999;
      }

      /* ==================== SHOT 1 ==================== */
      #shot-1-container {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 180px;
        z-index: 10;
        transform-origin: center center;
      }

      .card-frame {
        position: relative;
        width: 920px;
        height: 1200px;
        background-color: #F5F0E4;
        border: 4px solid #141414;
        box-shadow: 12px 12px 0px #141414;
        overflow: hidden;
      }

      .card-image-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .card-image-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: 65% 55%;
      }

      .diagram-svg-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* Base cho các overlay căn giữa */
      .badge-center-row {
        position: absolute;
        left: 0;
        right: 0;
        bottom: auto;
        height: auto;
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
      }

      /* Punch Phrase: TƯỜNG CONG NGƯỢC */
      #punch-phrase-1 {
        top: 210px;
        z-index: 40;
      }

      .punch-box {
        background-color: #141414;
        border-left: 12px solid #FF6A1A;
        border-radius: 12px;
        padding: 16px 36px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        box-shadow: 8px 8px 0px rgba(20, 20, 20, 0.35);
      }

      .punch-tag {
        font-size: 24px;
        font-weight: 700;
        color: #FF6A1A;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .punch-main-title {
        font-size: 64px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: -0.5px;
        line-height: 1.15;
        margin: 0;
      }

      /* Callout Label: CUNG PARABOL */
      #label-parabol {
        top: 1260px;
        z-index: 42;
      }

      .callout-pill {
        background-color: #141414;
        border: 2px solid #FF6A1A;
        border-radius: 40px;
        padding: 12px 28px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.4);
      }

      .callout-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background-color: #FF6A1A;
      }

      .callout-text {
        font-size: 32px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      /* ==================== SHOT 2 ==================== */
      #shot-2-video {
        z-index: 20;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #shot-2-frame-overlay {
        z-index: 25;
        pointer-events: none;
      }

      .screen-vignette {
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 140px rgba(20, 20, 20, 0.65);
        border: 24px solid rgba(20, 20, 20, 0.2);
      }

      /* Overlay Shot 2: ĐẢO CHIỀU 180° */
      #vector-overlay-shot2 {
        top: 230px;
        z-index: 50;
      }

      .reversal-card {
        background-color: #141414;
        border: 3px solid #FF6A1A;
        border-radius: 16px;
        padding: 20px 36px;
        display: flex;
        align-items: center;
        gap: 24px;
        box-shadow: 10px 10px 0px rgba(20, 20, 20, 0.5);
      }

      .reversal-icon-box {
        width: 76px;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .reversal-content {
        display: flex;
        flex-direction: column;
      }

      .reversal-sub {
        font-size: 22px;
        font-weight: 700;
        color: #FF6A1A;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .reversal-title {
        font-size: 58px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: -0.5px;
        line-height: 1.1;
        margin: 0;
      }

      /* Overlay Shot 2: Icon Check */
      #icon-check-shot2 {
        top: 1320px;
        z-index: 52;
      }

      .success-badge {
        background-color: #141414;
        border: 3px solid #FF6A1A;
        border-radius: 16px;
        padding: 18px 34px;
        display: flex;
        align-items: center;
        gap: 20px;
        box-shadow: 8px 8px 0px rgba(20, 20, 20, 0.45);
      }

      .check-circle {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background-color: #FF6A1A;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .success-title {
        font-size: 38px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: -0.5px;
        line-height: 1.2;
        margin: 0;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s06"
      data-width="1080"
      data-height="1920"
      data-duration="9.17"
    >
      <!-- Nền Grid toàn khung -->
      <div class="bg-grid"></div>

      <!-- ==================== SHOT 1 (0s - 4.71s) ==================== -->
      <section id="shot-1" class="clip" data-start="0" data-duration="4.71" data-track-index="1">
        <div id="shot-1-container">
          <div class="card-frame">
            <div class="card-image-wrap">
              <img
                id="img-03-media"
                src="assets/img-03-parabolic-defense-wave-diagram.jpg"
                alt="Sơ đồ tường chắn sóng parabol"
                data-layout-allow-overflow="true"
              />
            </div>

            <!-- SVG Diagram vẽ đường cong lực và hướng phản xạ sóng -->
            <svg class="diagram-svg-overlay" viewBox="0 0 920 1200" xmlns="http://www.w3.org/2000/svg">
              <!-- Nét đứt biểu diễn tường thẳng cũ bị tràn -->
              <path
                d="M 650 380 L 650 980"
                stroke="rgba(20, 20, 20, 0.45)"
                stroke-width="5"
                stroke-dasharray="14 10"
                fill="none"
              />
              <!-- Nhãn kè thẳng cũ có nền đen che tương phản cao và gọn trong khung -->
              <g id="old-wall-badge">
                <rect x="510" y="420" width="250" height="42" rx="8" fill="#141414" />
                <text x="635" y="448" fill="#F7F4EC" font-size="19" font-weight="700" font-family="Be Vietnam Pro" text-anchor="middle">
                  KÈ CŨ (TRÀN ĐỈNH)
                </text>
              </g>

              <!-- Cung parabol cam uốn sóng dội ngược -->
              <path
                id="parabol-vector-path"
                d="M 650 980 C 650 780 570 560 420 560 C 340 560 290 610 290 670"
                fill="none"
                stroke="#FF6A1A"
                stroke-width="10"
                stroke-linecap="round"
              />

              <!-- Mũi tên cam phản lực ngược về biển -->
              <path
                id="parabol-vector-arrow"
                d="M 325 640 L 290 670 L 300 620"
                fill="none"
                stroke="#FF6A1A"
                stroke-width="10"
                stroke-linecap="round"
                stroke-linejoin="round"
              />

              <!-- Nhãn góc xoay 180 độ -->
              <g id="parabol-angle-marker" opacity="0">
                <circle cx="420" cy="560" r="8" fill="#FF6A1A" />
                <rect x="370" y="495" width="105" height="42" rx="8" fill="#141414" />
                <text x="422" y="524" fill="#F7F4EC" font-size="22" font-weight="900" font-family="Be Vietnam Pro" text-anchor="middle">
                  180°
                </text>
              </g>
            </svg>
          </div>
        </div>
      </section>

      <!-- Punch Phrase Shot 1: TƯỜNG CONG NGƯỢC (atMs: 51390 -> 1.70s, hold 2.4s -> 4.10s) -->
      <div id="punch-phrase-1" class="clip badge-center-row" data-start="1.70" data-duration="2.40" data-track-index="2">
        <div class="punch-box">
          <span class="punch-tag">● BƯỚC NGOẶT ĐỘT PHÁ</span>
          <h1 class="punch-main-title">TƯỜNG CONG NGƯỢC</h1>
        </div>
      </div>

      <!-- Label Shot 1: CUNG PARABOL (atMs: 53460 -> 3.77s, hold 0.9s -> 4.67s) -->
      <div id="label-parabol" class="clip badge-center-row" data-start="3.77" data-duration="0.90" data-track-index="3">
        <div class="callout-pill">
          <div class="callout-dot"></div>
          <span class="callout-text">CUNG PARABOL</span>
        </div>
      </div>

      <!-- ==================== SHOT 2 (4.71s - 9.17s) ==================== -->
      <video
        id="shot-2-video"
        class="clip"
        data-start="4.71"
        data-duration="4.46"
        data-media-start="1.5"
        data-track-index="1"
        muted
        playsinline
        src="assets/vid-06-seawall-defense-mechanism-diagram.mp4"
      ></video>

      <!-- Khung viền tinh tế cho Shot 2 -->
      <div id="shot-2-frame-overlay" class="clip" data-start="4.71" data-duration="4.46" data-track-index="2">
        <div class="screen-vignette"></div>
      </div>

      <!-- Diagram Vector Shot 2: ĐẢO CHIỀU 180° (atMs: 54850 -> 5.16s, hold 2.2s -> 7.36s) -->
      <div id="vector-overlay-shot2" class="clip badge-center-row" data-start="5.16" data-duration="2.20" data-track-index="3">
        <div class="reversal-card">
          <div class="reversal-icon-box">
            <svg width="68" height="68" viewBox="0 0 68 68" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                id="svg-u-turn-path"
                d="M 18 52 L 18 28 C 18 16 50 16 50 28 L 50 48"
                stroke="#FF6A1A"
                stroke-width="7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                id="svg-u-turn-head"
                d="M 40 40 L 50 49 L 60 40"
                stroke="#FF6A1A"
                stroke-width="7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="reversal-content">
            <span class="reversal-sub">TRIỆT TIÊU ĐỘNG NĂNG SÓNG</span>
            <h2 class="reversal-title">ĐẢO CHIỀU 180°</h2>
          </div>
        </div>
      </div>

      <!-- Icon Check Shot 2: XÁC NHẬN KHÔNG TRÀN ĐỈNH (atMs: 57440 -> 7.75s, hold 1.4s -> 9.15s) -->
      <div id="icon-check-shot2" class="clip badge-center-row" data-start="7.75" data-duration="1.40" data-track-index="3">
        <div class="success-badge">
          <div class="check-circle">
            <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                id="svg-check-tick"
                d="M 8 18 L 15 25 L 28 10"
                stroke="#141414"
                stroke-width="5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <h3 class="success-title">GẦN NHƯ 0% NƯỚC TRÀN ĐỈNH</h3>
        </div>
      </div>

      <!-- Dải cam đáy khung hình nhận diện Vox -->
      <div class="vox-brand-bar"></div>
    </div>

    <!-- GSAP Seekable Timeline Script -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // Khởi tạo và đo chiều dài các vector SVG
      const parabolPath = document.getElementById("parabol-vector-path");
      const parabolArrow = document.getElementById("parabol-vector-arrow");
      const uTurnPath = document.getElementById("svg-u-turn-path");
      const uTurnHead = document.getElementById("svg-u-turn-head");
      const checkTick = document.getElementById("svg-check-tick");

      const lenParabol = parabolPath ? parabolPath.getTotalLength() : 0;
      const lenArrow = parabolArrow ? parabolArrow.getTotalLength() : 0;
      const lenUTurn = uTurnPath ? uTurnPath.getTotalLength() : 0;
      const lenUTurnHead = uTurnHead ? uTurnHead.getTotalLength() : 0;
      const lenTick = checkTick ? checkTick.getTotalLength() : 0;

      if (parabolPath) {
        parabolPath.style.strokeDasharray = lenParabol;
        parabolPath.style.strokeDashoffset = lenParabol;
      }
      if (parabolArrow) {
        parabolArrow.style.strokeDasharray = lenArrow;
        parabolArrow.style.strokeDashoffset = lenArrow;
      }
      if (uTurnPath) {
        uTurnPath.style.strokeDasharray = lenUTurn;
        uTurnPath.style.strokeDashoffset = lenUTurn;
      }
      if (uTurnHead) {
        uTurnHead.style.strokeDasharray = lenUTurnHead;
        uTurnHead.style.strokeDashoffset = lenUTurnHead;
      }
      if (checkTick) {
        checkTick.style.strokeDasharray = lenTick;
        checkTick.style.strokeDashoffset = lenTick;
      }

      // ==================== GSAP CHOREOGRAPHY ====================

      // --- SHOT 1 (0s -> 4.71s) ---
      tl.fromTo(
        "#shot-1-container",
        { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
        0
      );

      // Camera Ken Burns nhẹ vào vùng cong
      tl.fromTo(
        "#img-03-media",
        { scale: 1.0 },
        { scale: 1.12, duration: 4.1, ease: "sine.inOut" },
        0.6
      );

      // Vẽ cung parabol cam
      tl.fromTo(
        "#parabol-vector-path",
        { strokeDashoffset: lenParabol },
        { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" },
        0.85
      );
      tl.fromTo(
        "#parabol-vector-arrow",
        { strokeDashoffset: lenArrow },
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        1.55
      );
      tl.fromTo(
        "#parabol-angle-marker",
        { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" },
        1.65
      );

      // Punch Phrase: TƯỜNG CONG NGƯỢC (atMs: 51390 -> 1.70s)
      tl.fromTo(
        "#punch-phrase-1 .punch-box",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.70
      );
      tl.fromTo(
        "#punch-phrase-1 .punch-box",
        { y: 0, opacity: 1 },
        { y: -18, opacity: 0, duration: 0.25, ease: "power2.in" },
        3.80
      );

      // Callout Label: CUNG PARABOL (atMs: 53460 -> 3.77s)
      tl.fromTo(
        "#label-parabol .callout-pill",
        { scale: 0.75, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        3.77
      );

      // --- SHOT 2 (4.71s -> 9.17s) ---
      // Diagram Vector: ĐẢO CHIỀU 180° (atMs: 54850 -> 5.16s)
      tl.fromTo(
        "#vector-overlay-shot2 .reversal-card",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        5.16
      );
      tl.fromTo(
        "#svg-u-turn-path",
        { strokeDashoffset: lenUTurn },
        { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" },
        5.25
      );
      tl.fromTo(
        "#svg-u-turn-head",
        { strokeDashoffset: lenUTurnHead },
        { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
        5.80
      );
      tl.fromTo(
        "#vector-overlay-shot2 .reversal-card",
        { y: 0, opacity: 1 },
        { y: -16, opacity: 0, duration: 0.25, ease: "power2.in" },
        7.05
      );

      // Icon Check: GẦN NHƯ 0% NƯỚC TRÀN ĐỈNH (atMs: 57440 -> 7.75s)
      tl.fromTo(
        "#icon-check-shot2 .success-badge",
        { scale: 0.75, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        7.75
      );
      tl.fromTo(
        "#svg-check-tick",
        { strokeDashoffset: lenTick },
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        7.95
      );

      // Đăng ký timeline paused vào window.__timelines["scene-s06"]
      window.__timelines["scene-s06"] = tl;
    </script>
  
    </template>
  </body>
</html>
