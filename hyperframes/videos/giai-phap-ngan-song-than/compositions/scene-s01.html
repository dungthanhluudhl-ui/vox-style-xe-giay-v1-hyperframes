<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
        color: #141414;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }

      /* Full-frame container for timed clips */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Base media elements */
      #vid-03 {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        transform-origin: 50% 50%;
      }

      #img-04 {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        transform-origin: 50% 50%;
      }

      /* Editorial grid overlay */
      .grid-layer {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        pointer-events: none;
        z-index: 5;
      }

      /* Warm kraft texture layer */
      .kraft-layer {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, rgba(231, 227, 217, 0.08) 0%, rgba(185, 160, 130, 0.25) 100%);
        mix-blend-mode: multiply;
        pointer-events: none;
        z-index: 6;
      }

      /* Consequence & warning spotlight vignette */
      .spotlight-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 45%,
          transparent 30%,
          rgba(20, 20, 20, 0.42) 75%,
          rgba(20, 20, 20, 0.82) 100%
        );
        pointer-events: none;
        z-index: 7;
      }

      /* Signature bottom orange anchor bar */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 10px;
        background-color: #FF6A1A;
        z-index: 100;
        pointer-events: none;
      }

      /* Top label card (Shot 1: ẢO TƯỞNG ĐÊ CHẮN) */
      .callout-card {
        position: absolute;
        top: 240px;
        left: 60px;
        right: 60px;
        background-color: #141414;
        border-left: 10px solid #FF6A1A;
        border-radius: 12px;
        padding: 24px 32px;
        box-shadow: 10px 10px 0px #ff7a1a;
        z-index: 20;
        transform-origin: 50% 50%;
      }

      .callout-tag-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }

      .callout-pill {
        background-color: #FF6A1A;
        color: #141414;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 4px 14px;
        border-radius: 6px;
      }

      .callout-subtext {
        font-size: 22px;
        font-weight: 700;
        color: #F7F4EC;
        letter-spacing: 1px;
      }

      .callout-title {
        font-size: 56px;
        font-weight: 900;
        line-height: 1.2;
        color: #F7F4EC;
        margin: 0;
        text-transform: uppercase;
      }

      /* Center warning alert card (Shot 1: THẤT BẠI KỸ THUẬT) */
      .warning-badge-card {
        position: absolute;
        top: 760px;
        left: 250px;
        width: 580px;
        background-color: #141414;
        border: 4px solid #FF6A1A;
        border-radius: 16px;
        padding: 32px 28px;
        box-shadow: 12px 12px 0px #ff7a1a;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        z-index: 25;
        transform-origin: 50% 50%;
      }

      .warning-icon-wrap {
        width: 120px;
        height: 105px;
        margin-bottom: 16px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .radar-ring {
        position: absolute;
        inset: -14px;
        border: 3px solid #FF6A1A;
        border-radius: 50%;
        pointer-events: none;
      }

      .warning-badge-title {
        font-size: 38px;
        font-weight: 900;
        color: #FF6A1A;
        margin: 0 0 8px 0;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .warning-badge-desc {
        font-size: 26px;
        font-weight: 700;
        color: #F7F4EC;
        margin: 0;
        line-height: 1.3;
      }

      /* Upper-left tag card (Shot 2: VÙNG THẢM HỌA) */
      .hazard-tag-card {
        position: absolute;
        top: 260px;
        left: 60px;
        width: 520px;
        background-color: #141414;
        border-left: 8px solid #FF6A1A;
        border-radius: 10px;
        padding: 20px 28px;
        box-shadow: 8px 8px 0px #ff7a1a;
        z-index: 20;
      }

      .hazard-tag-header {
        font-size: 18px;
        font-weight: 900;
        color: #FF6A1A;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      .hazard-tag-title {
        font-size: 50px;
        font-weight: 900;
        color: #F7F4EC;
        margin: 0;
        text-transform: uppercase;
        line-height: 1.15;
      }

      /* Lower technical card (Shot 2: MÔ HÌNH THỰC NGHIỆM) - safely above caption zone (y < 1529px) */
      .model-tag-card {
        position: absolute;
        top: 1180px;
        left: 60px;
        right: 60px;
        background-color: #141414;
        border-left: 8px solid #FF6A1A;
        border-radius: 12px;
        padding: 24px 30px;
        box-shadow: 8px 8px 0px #ff7a1a;
        z-index: 20;
      }

      .model-tag-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .model-dot {
        width: 14px;
        height: 14px;
        background-color: #FF6A1A;
        border-radius: 50%;
      }

      .model-tag-label {
        font-size: 20px;
        font-weight: 900;
        color: #FF6A1A;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .model-tag-title {
        font-size: 50px;
        font-weight: 900;
        color: #F7F4EC;
        margin: 0;
        text-transform: uppercase;
        line-height: 1.15;
      }

      .model-divider {
        height: 3px;
        width: 100%;
        background-color: #FF6A1A;
        margin-top: 12px;
        transform-origin: 0% 50%;
      }
    </style>

    <!-- Untimed composition root -->
    <div
      id="root"
      data-composition-id="scene-s01"
      data-width="1080"
      data-height="1920"
      data-duration="10"
    >
      <!-- ================= TRACK 0: BASE MEDIA ================= -->
      <!-- Shot 1 Video (0.0s - 5.2s) -->
      <video
        id="vid-03"
        data-start="0"
        data-duration="5.2"
        data-track-index="0"
        data-media-start="1.5"
        src="assets/vid-03-tsunami-hazard-impact-diagram.mp4"
        muted
        playsinline
        preload="auto"
      ></video>

      <!-- Shot 2 Image (5.2s - 10.0s) -->
      <img
        id="img-04"
        class="clip"
        data-start="5.2"
        data-duration="4.8"
        data-track-index="0"
        src="assets/img-04-tsunami-hazard-mechanism-diagram.jpg"
        alt="Tsunami Hazard Mechanism"
      />

      <!-- ================= SHARED STYLIZED OVERLAYS ================= -->
      <div class="grid-layer" data-layout-ignore="true"></div>
      <div class="kraft-layer" data-layout-ignore="true"></div>
      <div class="spotlight-vignette" data-layout-ignore="true"></div>
      <div class="bottom-brand-bar" data-layout-ignore="true"></div>

      <!-- ================= TRACK 1: PRIMARY CALLOUTS ================= -->
      <!-- Shot 1 Overlay 1: ẢO TƯỞNG ĐÊ CHẮN (0.8s - 3.3s) -->
      <div
        id="clip-s1-barrier"
        class="clip"
        data-start="0.8"
        data-duration="2.5"
        data-track-index="1"
      >
        <div id="card-s1-barrier" class="callout-card">
          <div class="callout-tag-row">
            <span class="callout-pill">PHÒNG TUYẾN</span>
            <span class="callout-subtext">ĐÁNH GIÁ THỰC TẾ</span>
          </div>
          <h1 class="callout-title">ẢO TƯỞNG ĐÊ CHẮN</h1>
        </div>
      </div>

      <!-- Shot 2 Overlay 1: VÙNG THẢM HỌA (6.35s - 8.45s) -->
      <div
        id="clip-s2-hazard"
        class="clip"
        data-start="6.35"
        data-duration="2.1"
        data-track-index="1"
      >
        <div id="card-s2-hazard" class="hazard-tag-card">
          <div class="hazard-tag-header">CẢNH BÁO HIỆN TRƯỜNG</div>
          <div class="hazard-tag-title">VÙNG THẢM HỌA</div>
        </div>
      </div>

      <!-- ================= TRACK 2: SECONDARY ALERTS / DETAILS ================= -->
      <!-- Shot 1 Overlay 2: THẤT BẠI KỸ THUẬT (4.01s - 5.2s) -->
      <div
        id="clip-s1-warning"
        class="clip"
        data-start="4.01"
        data-duration="1.19"
        data-track-index="2"
      >
        <div id="card-s1-warning" class="warning-badge-card">
          <div class="warning-icon-wrap">
            <div id="radar-ring" class="radar-ring" data-layout-ignore="true"></div>
            <svg width="100" height="90" viewBox="0 0 100 90" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                id="warning-path"
                d="M 50 10 L 90 80 L 10 80 Z"
                stroke="#FF6A1A"
                stroke-width="9"
                stroke-linejoin="round"
                stroke-linecap="round"
                fill="none"
                style="stroke-dasharray: 250; stroke-dashoffset: 250;"
              />
              <path id="warning-excl" d="M 50 34 L 50 56" stroke="#FF6A1A" stroke-width="8" stroke-linecap="round" />
              <circle id="warning-dot" cx="50" cy="69" r="4.5" fill="#FF6A1A" />
            </svg>
          </div>
          <div class="warning-badge-title">THẤT BẠI KỸ THUẬT</div>
          <div class="warning-badge-desc">NGUY CƠ NGẬP LỤT TĂNG CAO</div>
        </div>
      </div>

      <!-- Shot 2 Overlay 2: MÔ HÌNH THỰC NGHIỆM (8.49s - 10.0s) -->
      <div
        id="clip-s2-model"
        class="clip"
        data-start="8.49"
        data-duration="1.51"
        data-track-index="2"
      >
        <div id="card-s2-model" class="model-tag-card">
          <div class="model-tag-header">
            <div class="model-dot"></div>
            <span class="model-tag-label">DỮ LIỆU ĐỐI CHỨNG</span>
          </div>
          <div class="model-tag-title">MÔ HÌNH THỰC NGHIỆM</div>
          <div id="reticle-line" class="model-divider"></div>
        </div>
      </div>
    </div>

    <!-- Animation Orchestration -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // ==========================================
      // SHOT 1 (0.0s - 5.2s)
      // ==========================================

      // Ken Burns smooth zoom & drift on surge wave impact (single writer for scale and y)
      tl.fromTo(
        "#vid-03",
        { scale: 1.04, y: -20 },
        { scale: 1.12, y: 0, duration: 5.2, ease: "sine.inOut" },
        0
      );

      // Overlay 1: "ẢO TƯỞNG ĐÊ CHẮN" entrance (atMs: 800) on inner card
      tl.fromTo(
        "#card-s1-barrier",
        { y: 35, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        0.8
      );

      // Overlay 2: Warning Alert card entrance (atMs: 4010) on inner card
      tl.fromTo(
        "#card-s1-warning",
        { scale: 0.8, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        4.01
      );

      // SVG path draw for warning triangle outline
      tl.fromTo(
        "#warning-path",
        { strokeDashoffset: 250 },
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        4.01
      );

      // Exclamation mark pop-in
      tl.fromTo(
        "#warning-excl",
        { opacity: 0, scaleY: 0, transformOrigin: "50% 0%" },
        { opacity: 1, scaleY: 1, duration: 0.2, ease: "power3.out" },
        4.25
      );
      tl.fromTo(
        "#warning-dot",
        { opacity: 0, scale: 0, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" },
        4.3
      );

      // Warning radar pulse animation
      tl.fromTo(
        "#radar-ring",
        { scale: 0.8, opacity: 0.9 },
        { scale: 1.4, opacity: 0, duration: 0.5, ease: "power2.out" },
        4.12
      );

      // ==========================================
      // SHOT 2 (5.2s - 10.0s)
      // ==========================================

      // Hard cut into Shot 2 at 5.2s: Vertical pan-up from water level to warning diagram
      tl.fromTo(
        "#img-04",
        { y: -30, scale: 1.08 },
        { y: 30, scale: 1.12, duration: 4.8, ease: "sine.inOut" },
        5.2
      );

      // Overlay 1: "VÙNG THẢM HỌA" entrance (atMs: 6350) on inner card
      tl.fromTo(
        "#card-s2-hazard",
        { x: -40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        6.35
      );

      // Overlay 2: "MÔ HÌNH THỰC NGHIỆM" entrance (atMs: 8490) on inner card
      tl.fromTo(
        "#card-s2-model",
        { y: 30, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        8.49
      );

      // Reticle rule horizontal expansion
      tl.fromTo(
        "#reticle-line",
        { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, duration: 0.35, ease: "power2.out" },
        8.65
      );

      // Register master timeline on window.__timelines without initializing the registry
      window.__timelines["scene-s01"] = tl;
    </script>
  
    </template>
  </body>
</html>
