<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }

      /* Quy ước clip HyperFrames: inset: 0, không đặt width/height cố định bằng px */
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Lớp nền phong cách spotlight (vignette u tối cảnh báo) */
      .bg-spotlight {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 45%, rgba(231, 227, 217, 0.95) 20%, rgba(20, 20, 20, 0.88) 95%);
        pointer-events: none;
        z-index: 0;
      }

      /* Lưới nền ô vuông Vox DNA */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-size: 84px 84px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.18) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.18) 1.5px, transparent 1.5px);
        pointer-events: none;
        z-index: 0;
      }

      /* Dải cam chữ ký thương hiệu ở mép đáy màn hình */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 99;
      }

      /* Wrapper video S07-1: KHÔNG có data-start để tuân thủ quy tắc lồng video */
      #video-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 2;
        transform-origin: 50% 50%;
      }

      #vid-03 {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Lớp phủ vệt tối và vết rạn vỡ (shatter transition) */
      .shatter-overlay {
        position: absolute;
        inset: 0;
        background-color: #141414;
        z-index: 3;
        pointer-events: none;
      }

      /* Khung badge biểu tượng cấm / cảnh báo (Ban Icon) */
      .icon-card {
        position: absolute;
        top: 240px;
        left: 50%;
        transform-origin: 50% 50%;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 16px 28px;
        background-color: #141414;
        border: 4px solid #ff6a1a;
        border-radius: 18px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      }

      .icon-label {
        font-size: 32px;
        font-weight: 900;
        color: #f7f4ec;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin: 0;
        line-height: 1.2;
      }

      /* Con dấu dập bản án 'KHUNG 7 - 15 NĂM' */
      .punch-container {
        position: absolute;
        top: 900px;
        left: 50%;
        transform-origin: 50% 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .stamp-plate {
        background-color: #ff6a1a;
        border: 8px solid #141414;
        border-radius: 12px;
        padding: 24px 44px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      }

      .stamp-sub {
        font-size: 26px;
        font-weight: 900;
        color: #141414;
        letter-spacing: 6px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      .stamp-title {
        font-size: 74px;
        font-weight: 900;
        color: #141414;
        letter-spacing: -1px;
        margin: 0;
        line-height: 1.1;
        white-space: nowrap;
        text-transform: uppercase;
      }

      /* Shot S07-2: Hình ảnh người ân hận img-06 */
      .shot-img-wrapper {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #141414;
      }

      #regret-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 50% 50%;
      }

      /* Nhãn cầu xin cơ hội sửa sai */
      .label-plea-card {
        position: absolute;
        top: 1220px;
        left: 50%;
        transform-origin: 50% 50%;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 22px 38px;
        background-color: #141414;
        border-left: 10px solid #ff6a1a;
        border-radius: 8px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.8);
        white-space: nowrap;
      }

      .label-plea-text {
        font-size: 38px;
        font-weight: 900;
        color: #f7f4ec;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin: 0;
        line-height: 1.2;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s07"
      data-width="1080"
      data-height="1920"
      data-duration="6.44"
    >
      <!-- Lớp nền đồ họa thương hiệu -->
      <div class="bg-grid"></div>
      <div class="bg-spotlight"></div>

      <!-- SHOT 1 (0.00s -> 4.40s): Video người vi phạm sau song sắt vid-03 -->
      <!-- Wrapper không có data-start để chứa video an toàn -->
      <div id="video-wrapper">
        <video
          id="vid-03"
          src="assets/vid-03-convict-crying-prison-sentence.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="4.4"
          data-media-start="1.2"
        ></video>
      </div>

      <!-- Hiệu ứng shatter lúc mở đầu shot 1 -->
      <div id="shatter-fx" class="clip shatter-overlay" data-start="0" data-duration="0.45"></div>

      <!-- Overlay Shot 1 - Icon Ban: NGUY CƠ PHẠT TÙ (0.62s -> 2.42s) -->
      <div id="clip-icon-ban" class="clip" data-start="0.62" data-duration="1.8" style="z-index: 10; pointer-events: none;">
        <div id="ban-badge" class="icon-card">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="20" stroke="#FF6A1A" stroke-width="5" />
            <line x1="10" y1="10" x2="38" y2="38" stroke="#FF6A1A" stroke-width="5" stroke-linecap="round" />
          </svg>
          <span class="icon-label">NGUY CƠ PHẠT TÙ</span>
        </div>
      </div>

      <!-- Overlay Shot 1 - Punch Phrase: KHUNG 7 - 15 NĂM (2.59s -> 4.40s) -->
      <div id="clip-punch" class="clip" data-start="2.59" data-duration="1.81" style="z-index: 15; pointer-events: none;">
        <div id="punch-badge" class="punch-container">
          <div class="stamp-plate">
            <span class="stamp-sub">HÌNH PHẠT TÙ GIAM</span>
            <h1 class="stamp-title">KHUNG 7 - 15 NĂM</h1>
          </div>
        </div>
      </div>

      <!-- SHOT 2 (4.40s -> 6.44s): Hình ảnh cầu xin cơ hội khắc phục img-06 (hiển thị nguyên bản) -->
      <div id="clip-shot-2" class="clip" data-start="4.4" data-duration="2.04" style="z-index: 5;">
        <div class="shot-img-wrapper">
          <img
            id="regret-img"
            src="assets/img-06-prison-sentence-convict-regret.jpg"
            alt="Người đàn ông cầu xin sửa sai sau song sắt"
          />
        </div>
      </div>

      <!-- Overlay Shot 2 - Label: XIN CƠ HỘI CHUỘC LỖI (4.75s -> 6.35s) -->
      <div id="clip-label" class="clip" data-start="4.75" data-duration="1.6" style="z-index: 20; pointer-events: none;">
        <div id="label-chuoc-loi" class="label-plea-card">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FF6A1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span class="label-plea-text">XIN CƠ HỘI CHUỘC LỖI</span>
        </div>
      </div>

      <!-- Thanh cam đáy cố định nhận diện thương hiệu Vox DNA -->
      <div class="brand-bottom-bar"></div>
    </div>

    <script>
      // Khởi tạo timeline chính và đăng ký seekable với HyperFrames
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Định vị căn giữa theo trục ngang cho các badge overlay
      gsap.set("#ban-badge", { xPercent: -50 });
      gsap.set("#punch-badge", { xPercent: -50 });
      gsap.set("#label-chuoc-loi", { xPercent: -50 });

      // ----------------------------------------------------
      // SHOT 1: 0.00s -> 4.40s
      // ----------------------------------------------------

      // Camera motion: zoom chậm tiến sát khuôn mặt người vi phạm ôm mặt khóc
      tl.fromTo(
        "#video-wrapper",
        { scale: 1.35, transformOrigin: "50% 50%" },
        { scale: 1.55, duration: 4.4, ease: "none" },
        0
      );

      // Hiệu ứng shatter sụp đổ lúc vào cảnh (chớp flash đen và rung giật chấn động)
      tl.fromTo(
        "#shatter-fx",
        { opacity: 0.95 },
        { opacity: 0, duration: 0.45, ease: "power2.out" },
        0
      );
      tl.fromTo(
        "#video-wrapper",
        { rotation: -1.2, x: -18 },
        { rotation: 0, x: 0, duration: 0.4, ease: "power3.out" },
        0
      );

      // Icon Ban xuất hiện (0.62s) - nảy lò xo vững chắc, không văng quá mức
      tl.fromTo(
        "#ban-badge",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        0.62
      );
      // Rút lui nhẹ trước khi con dấu bản án ập xuống
      tl.to(
        "#ban-badge",
        { opacity: 0, y: -25, duration: 0.25, ease: "power2.in" },
        2.15
      );

      // Con dấu bản án "KHUNG 7 - 15 NĂM" dập mạnh xuống (2.59s)
      tl.fromTo(
        "#punch-badge",
        { scale: 2.3, opacity: 0, rotation: 8 },
        { scale: 1, opacity: 1, rotation: -3, duration: 0.32, ease: "power4.out" },
        2.59
      );
      // Chấn động camera do lực va chạm của con dấu
      tl.fromTo(
        "#video-wrapper",
        { y: 15 },
        { y: 0, duration: 0.22, ease: "power2.out" },
        2.62
      );

      // ----------------------------------------------------
      // SHOT 2: 4.40s -> 6.44s
      // ----------------------------------------------------

      // Nhịp thở chậm tinh tế trên hình ảnh minh họa img-06
      tl.fromTo(
        "#regret-img",
        { scale: 1.0 },
        { scale: 1.04, duration: 2.04, ease: "sine.inOut" },
        4.4
      );

      // Label "XIN CƠ HỘI CHUỘC LỖI" trượt lên dứt khoát (4.75s)
      tl.fromTo(
        "#label-chuoc-loi",
        { y: 45, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.38, ease: "power3.out" },
        4.75
      );

      // Đăng ký timeline cho runtime HyperFrames
      window.__timelines["scene-s07"] = tl;
    </script>
  
    </template>
  </body>
</html>
