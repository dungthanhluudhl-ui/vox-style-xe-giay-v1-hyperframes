  <script>
    // Measure SVG stroke length deterministically
    const checkPath = document.getElementById("check-path");

      checkPath.style.strokeDasharray = checkStrokeLen + "px";
      checkPath.style.strokeDashoffset = checkStrokeLen + "px";
    }

    // Build single paused GSAP timeline
    const tl = gsap.timeline({ paused: true });

    // 0.1s: Hero Image Card Entrance (grow) + Camera Pan & Zoom

      "#hero-frame",
      { scale: 0.92, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
      0.1

      5.28
    );

    // 6.79s: Overlay Icon Card Entrance ("check")
    tl.fromTo(
      "#icon-card",
      { scale: 0.85, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      6.79
    );

    // 6.95s: Self-drawing Checkmark Path Tracing

      "#check-path",
      { strokeDashoffset: checkStrokeLen },
      { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
