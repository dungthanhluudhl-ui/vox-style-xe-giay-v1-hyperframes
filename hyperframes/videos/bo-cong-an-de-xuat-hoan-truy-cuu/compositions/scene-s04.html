  <div

        <!-- Hero Photo Frame căn chuẩn 9:16 dọc -->

  <script>
    // Measure SVG paths for deterministic path drawing
    const pOutline = document.getElementById("doc-outline");
    const pFold = document.getElementById("doc-fold");
    const pLine1 = document.getElementById("doc-line-1");
    const pLine2 = document.getElementById("doc-line-2");
    const pLine3 = document.getElementById("doc-line-3");

    const lenOutline = pOutline ? pOutline.getTotalLength() : 180;
    const lenFold = pFold ? pFold.getTotalLength() : 40;
    const lenLine1 = pLine1 ? pLine1.getTotalLength() : 30;
    const lenLine2 = pLine2 ? pLine2.getTotalLength() : 30;
    const lenLine3 = pLine3 ? pLine3.getTotalLength() : 20;

    if (pOutline) { pOutline.style.strokeDasharray = lenOutline + ""; pOutline.style.strokeDashoffset = lenOutline + ""; }
    if (pFold) { pFold.style.strokeDasharray = lenFold + ""; pFold.style.strokeDashoffset = lenFold + ""; }
    if (pLine1) { pLine1.style.strokeDasharray = lenLine1 + ""; pLine1.style.strokeDashoffset = lenLine1 + ""; }
    if (pLine2) { pLine2.style.strokeDasharray = lenLine2 + ""; pLine2.style.strokeDashoffset = lenLine2 + ""; }
    if (pLine3) { pLine3.style.strokeDasharray = lenLine3 + ""; pLine3.style.strokeDashoffset = lenLine3 + ""; }

    // Master seekable GSAP timeline
    const tl = gsap.timeline({ paused: true });

    // 0.0s - 0.75s: Peel entrance animation
    tl.fromTo(
      "#peel-layer",
      { clipPath: "polygon(0 0, 100% 0, 100% 0, 0 0)" },
      { clipPath: "polygon(0 0, 100% 0, 100% 100%, 0 100%)", duration: 0.75, ease: "power3.inOut" },
      0
    );

    // 0.0s - 6.24s: Smooth GPU-composited camera pan in 9:16 frame: lia chậm từ góc hai người thì thầm xuống mặt bàn
    tl.fromTo(
      "#hero-img",
      { x: 25, y: 0, scale: 1.12 },
      { x: -35, y: -240, scale: 1.04, duration: 6.24, ease: "sine.inOut" },
      0
    );

    // 1.77s (atMs: 29330): Punch Phrase entrance ("QUYẾT ĐỊNH LIỀU LĨNH")
    tl.fromTo(
      "#punch-card",
      { opacity: 0, y: 24, scale: 0.96 },
      { opacity: 1, y: 0, scale: 1, duration: 0.52, ease: "power3.out" },
      1.77
    );

    // 3.00s: Dossier container reveals smoothly
    tl.fromTo(
      "#dossier-box",
      { opacity: 0, y: 30 },
      { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      3.00
    );

    // 3.11s (atMs: 30670): "doc" SVG Icon Progressive Path Draw
    tl.fromTo(
      "#doc-outline",
      { strokeDashoffset: lenOutline },
      { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
      3.11
    );
    tl.fromTo(
      "#doc-fold",
      { strokeDashoffset: lenFold },
      { strokeDashoffset: 0, duration: 0.24, ease: "power2.out" },
      3.28
    );
    tl.fromTo(
      "#doc-line-1",
      { strokeDashoffset: lenLine1 },
      { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" },
      3.36
    );
    tl.fromTo(
      "#doc-line-2",
      { strokeDashoffset: lenLine2 },
      { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" },
      3.44
    );
    tl.fromTo(
      "#doc-line-3",
      { strokeDashoffset: lenLine3 },
      { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" },
      3.52
    );

    // 3.46s (atMs: 31020): Rubber Stamp Slams Down ("NGỤY TẠO 80 CĂN")
    tl.fromTo(
      "#fraud-stamp",
      { opacity: 0, scale: 1.4, rotation: -12 },
      { opacity: 1, scale: 1, rotation: -3, duration: 0.28, ease: "power4.out" },
      3.46
    );

    // 3.82s: Strike through real 40 units status (fromTo ensures pure GSAP ownership of transform)
    tl.fromTo(
      "#strike-line",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.36, ease: "power2.out" },
      3.82
    );

    // Register paused timeline with HyperFrames runtime
    window.__timelines["scene-s04"] = tl;
  </script>
