<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        margin: 0;
        background-color: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Lớp màu an toàn WCAG chuẩn style-tokens.json */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
      .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
      .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
      .hf-plate-paper { background-color: #E7E3D9; color: #141414; }

      /* Texture lưới nhẹ nhàng tôn phong cách Vox Collage */
      .grid-pattern {
        position: absolute;
        inset: 0;
        background-size: 84px 84px;
        background-image: 
          linear-gradient(to right, rgba(20, 20, 20, 0.08) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.08) 1.5px, transparent 1.5px);
        pointer-events: none;
      }

      /* Card thông tin đặt trong vùng safe-zone */
      .vox-card {
        position: absolute;
        left: 54px;
        right: 54px;
        bottom: 420px;
        background-color: #141414;
        border-radius: 18px;
        border-left: 10px solid #FF6A1A;
        padding: 38px 40px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
        gap: 18px;
        z-index: 30;
      }

      .badge-pill {
        display: inline-flex;
        align-items: center;
        background-color: #FF6A1A;
        color: #141414;
        font-weight: 900;
        font-size: 30px;
        line-height: 1;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 12px 22px;
        border-radius: 8px;
        align-self: flex-start;
      }

      .card-headline {
        font-size: 64px;
        font-weight: 900;
        line-height: 1.25;
        color: #F7F4EC;
        text-transform: uppercase;
        letter-spacing: -0.01em;
      }

      .card-subtext {
        font-size: 32px;
        font-weight: 700;
        line-height: 1.35;
        color: #FF6A1A;
      }

      .icon-cluster {
        position: absolute;
        right: 36px;
        top: 36px;
        width: 130px;
        height: 130px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgba(255, 255, 255, 0.05);
        border-radius: 14px;
        border: 1.5px solid rgba(255, 106, 26, 0.35);
      }

      /* Dải nhận diện thương hiệu cam cố định dưới đáy */
      #signature-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s01"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6"
    >
      <!-- SHOT 1: Media Video (0s -> 3.37s) -->
      <!-- Thẻ video KHÔNG nằm trong timed element khác để tuân thủ video_nested_in_timed_element -->
      <div id="video-host-s01-1" style="position: absolute; inset: 0; overflow: hidden; z-index: 1; pointer-events: none;">
        <video
          id="vid-s01-1"
          src="assets/vid-08-financial-crime-court-cutout.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="3.37"
          data-media-start="1.5"
          style="position: absolute; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%;"
        ></video>
      </div>

      <!-- SHOT 1: Overlays (Punch-phrase + Icon Scale) (0s -> 3.37s) -->
      <section id="shot-1-overlay" class="clip" data-start="0" data-duration="3.37" style="z-index: 10;">
        <div class="grid-pattern"></div>
        
        <!-- Card nội dung chính đặt trên plate màu mực bảo đảm độ tương phản chuẩn WCAG -->
        <div id="card-shot-1" class="vox-card">
          <!-- Icon Cán Cân Công Lý (scale) tự vẽ nét -->
          <div id="icon-scale-box" class="icon-cluster">
            <svg id="icon-scale-svg" viewBox="0 0 120 120" width="100" height="100" style="overflow: visible;">
              <!-- Trụ đứng -->
              <line class="scale-path" x1="60" y1="20" x2="60" y2="100" stroke="#FF6A1A" stroke-width="5" stroke-linecap="round" />
              <!-- Chân đế cán cân -->
              <path class="scale-path" d="M 35 100 L 85 100" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round" />
              <!-- Đỉnh chóp -->
              <circle class="scale-path" cx="60" cy="18" r="4" fill="none" stroke="#FF6A1A" stroke-width="4" />
              <!-- Đòn cân ngang -->
              <line class="scale-path" x1="20" y1="36" x2="100" y2="36" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" />
              <!-- Dây treo đĩa cân trái -->
              <path class="scale-path" d="M 20 36 L 8 68 M 20 36 L 32 68" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
              <!-- Đĩa cân trái -->
              <path class="scale-path" d="M 4 68 Q 20 82 36 68 Z" fill="none" stroke="#FF6A1A" stroke-width="4" stroke-linejoin="round" />
              <!-- Dây treo đĩa cân phải -->
              <path class="scale-path" d="M 100 36 L 88 68 M 100 36 L 112 68" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
              <!-- Đĩa cân phải -->
              <path class="scale-path" d="M 84 68 Q 100 82 116 68 Z" fill="none" stroke="#FF6A1A" stroke-width="4" stroke-linejoin="round" />
            </svg>
          </div>

          <!-- Punch phrase overlay theo shotlist -->
          <div id="badge-shot-1" class="badge-pill">ĐỀ XUẤT ĐỘT PHÁ</div>
          
          <div id="title-shot-1" class="card-headline">
            TẠM HOÃN<br />TRUY CỨU
          </div>
          
          <div id="sub-shot-1" class="card-subtext">
            CHẾ TÀI ÁN KINH TẾ
          </div>
        </div>
      </section>

      <!-- SHOT 2: Media Image & Overlays (3.37s -> 6s) -->
      <section id="shot-2-clip" class="clip" data-start="3.37" data-duration="2.63" style="z-index: 20;">
        <!-- Container ảnh phục vụ hiệu ứng Ken Burns Pan Right -->
        <div id="img-pan-box" style="position: absolute; inset: -40px; overflow: hidden;">
          <img
            id="img-s01-2"
            src="assets/img-09-legal-gavel-financial-crime-collage.jpg"
            alt="Collage búa thẩm phán và điều luật"
            style="width: 100%; height: 100%; object-fit: cover; transform-origin: 40% 50%;"
          />
        </div>

        <div class="grid-pattern"></div>

        <!-- Card thông tin Shot 2 -->
        <div id="card-shot-2" class="vox-card">
          <!-- Icon Văn Bản Điều Luật (doc) tự vẽ nét -->
          <div id="icon-doc-box" class="icon-cluster">
            <svg id="icon-doc-svg" viewBox="0 0 120 120" width="100" height="100" style="overflow: visible;">
              <!-- Viền trang tài liệu có góc gấp -->
              <path class="doc-path" d="M 25 15 L 75 15 L 95 35 L 95 105 L 25 105 Z" fill="none" stroke="#FF6A1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
              <!-- Nếp gấp góc -->
              <path class="doc-path" d="M 75 15 L 75 35 L 95 35" fill="none" stroke="#F7F4EC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
              <!-- Các dòng điều khoản pháp luật -->
              <line class="doc-path" x1="38" y1="50" x2="82" y2="50" stroke="#F7F4EC" stroke-width="4" stroke-linecap="round" />
              <line class="doc-path" x1="38" y1="64" x2="82" y2="64" stroke="#F7F4EC" stroke-width="4" stroke-linecap="round" />
              <line class="doc-path" x1="38" y1="78" x2="62" y2="78" stroke="#F7F4EC" stroke-width="4" stroke-linecap="round" />
              <!-- Mộc thẩm định điều luật -->
              <circle class="doc-path" cx="78" cy="85" r="11" fill="none" stroke="#FF6A1A" stroke-width="3" />
            </svg>
          </div>

          <!-- Label overlay theo shotlist -->
          <div id="badge-shot-2" class="badge-pill">ÁN KINH TẾ</div>

          <div id="title-shot-2" class="card-headline">
            QUẢN LÝ<br />THỊ TRƯỜNG
          </div>

          <div id="sub-shot-2" class="card-subtext" style="color: #F7F4EC;">
            KHẮC PHỤC HẬU QUẢ
          </div>
        </div>
      </section>

      <!-- Signature Orange Bar cố định dưới đáy màn hình -->
      <div id="signature-bar"></div>
    </div>

    <!-- GSAP Seekable Timeline Script -->
    <script>
      // Chuẩn bị stroke dash cho các SVG paths trước khi GSAP render
      const scalePaths = document.querySelectorAll(".scale-path");
      scalePaths.forEach((p) => {
        const len = p.getTotalLength ? p.getTotalLength() : 120;
        p.style.strokeDasharray = len + "px";
        p.style.strokeDashoffset = len + "px";
      });

      const docPaths = document.querySelectorAll(".doc-path");
      docPaths.forEach((p) => {
        const len = p.getTotalLength ? p.getTotalLength() : 120;
        p.style.strokeDasharray = len + "px";
        p.style.strokeDashoffset = len + "px";
      });

      // Tạo timeline chính ở trạng thái paused
      const tl = gsap.timeline({ paused: true });

      // ================= SHOT 1 (0s -> 3.37s) =================
      // Camera motion: Zoom-in nhẹ video từ 1.5x lên 1.62x
      tl.fromTo(
        "#vid-s01-1",
        { scale: 1.5 },
        { scale: 1.62, duration: 3.37, ease: "none" },
        0
      );

      // Card thông tin Punch entrance
      tl.fromTo(
        "#card-shot-1",
        { scale: 0.86, opacity: 0, y: 40 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        0.3
      );

      // Punch-phrase "ĐỀ XUẤT ĐỘT PHÁ" tại 0.95s (950ms)
      tl.fromTo(
        "#badge-shot-1",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.95
      );

      // Tiêu đề và dòng phụ
      tl.fromTo(
        "#title-shot-1",
        { opacity: 0, x: -24 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
        1.1
      );
      tl.fromTo(
        "#sub-shot-1",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        1.25
      );

      // Icon Scale (Cán cân) xuất hiện tại 1.5s (1500ms)
      tl.fromTo(
        "#icon-scale-box",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        1.5
      );
      scalePaths.forEach((p, idx) => {
        const len = p.getTotalLength ? p.getTotalLength() : 120;
        tl.fromTo(
          p,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
          1.58 + idx * 0.05
        );
      });

      // ================= SHOT 2 (3.37s -> 6.0s) =================
      // Camera motion: Ken Burns Pan Right ảnh
      tl.fromTo(
        "#img-s01-2",
        { scale: 1.15, x: -30 },
        { scale: 1.25, x: 30, duration: 2.63, ease: "none" },
        3.37
      );

      // Card Shot 2 xuất hiện ngay sau chuyển cảnh cut
      tl.fromTo(
        "#card-shot-2",
        { scale: 0.9, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        3.45
      );

      // Label "ÁN KINH TẾ" xuất hiện tại 3.91s (3910ms)
      tl.fromTo(
        "#badge-shot-2",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        3.91
      );

      // Tiêu đề & Subtitle Shot 2
      tl.fromTo(
        "#title-shot-2",
        { opacity: 0, x: -24 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        4.08
      );
      tl.fromTo(
        "#sub-shot-2",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        4.22
      );

      // Icon Doc (Văn bản pháp luật) xuất hiện tại 4.54s (4540ms)
      tl.fromTo(
        "#icon-doc-box",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        4.54
      );
      docPaths.forEach((p, idx) => {
        const len = p.getTotalLength ? p.getTotalLength() : 120;
        tl.fromTo(
          p,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
          4.62 + idx * 0.06
        );
      });

      // Bắt buộc: Đăng ký timeline chính với HyperFrames Runtime
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s01"] = tl;
    </script>
  
    </template>
  </body>
</html>
