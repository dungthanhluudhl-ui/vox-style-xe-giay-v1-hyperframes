<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #E7E3D9;
      }

      /* Hợp đồng clip tiêu chuẩn */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Màu sắc và plate an toàn chuẩn WCAG */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
      .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
      .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
      .hf-plate-paper { background-color: #E7E3D9; color: #141414; }

      /* Video Stage & Camera Pan (Wrapper KHÔNG có data-start) */
      #video-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 1;
      }
      #video-container {
        position: absolute;
        width: 100%;
        height: 100%;
        transform-origin: 50% 50%;
      }
      #vid-05 {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Nền texture & Grid hoạ tiết Vox tinh tế */
      .grid-layer {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.08) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.08) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        pointer-events: none;
        z-index: 2;
      }

      /* Unfold Transition Effect lúc mở màn */
      #unfold-flap {
        position: absolute;
        inset: 0;
        background-color: #E7E3D9;
        transform-origin: top center;
        z-index: 90;
        pointer-events: none;
      }

      /* Dải cam cố định ở mép đáy khung hình (Signature Vox) */
      #bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 100;
      }

      /* Overlay 1: Punch Phrase "LỜI KHAI KHẮC PHỤC" */
      .punch-card {
        position: absolute;
        top: 220px;
        left: 60px;
        right: 60px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        z-index: 20;
        pointer-events: auto;
      }
      .punch-badge {
        display: inline-block;
        padding: 8px 22px;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        border-radius: 4px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      }
      .punch-title-box {
        padding: 20px 32px;
        border-radius: 4px;
        border-left: 10px solid #FF6A1A;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      }
      .punch-text {
        display: block;
        font-size: 58px;
        font-weight: 900;
        letter-spacing: 1px;
        line-height: 1.25;
        text-transform: uppercase;
      }
      .punch-sub {
        display: block;
        margin-top: 8px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 1.5px;
      }

      /* Overlay 2: Timeline "XIN GIA HẠN 3 NĂM" & Flow Card */
      .timeline-container {
        position: absolute;
        bottom: 430px;
        left: 50px;
        right: 50px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        z-index: 20;
        pointer-events: auto;
      }
      .action-header {
        padding: 22px 28px;
        border-radius: 8px 8px 0 0;
        border-left: 10px solid #FF6A1A;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      }
      .action-tag {
        display: inline-block;
        padding: 6px 14px;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 8px;
        border-radius: 3px;
      }
      .action-title {
        font-size: 48px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .timeline-body {
        padding: 28px 24px;
        border-radius: 0 0 8px 8px;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
        gap: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }
      .timeline-meta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .clock-group {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .clock-desc {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .clock-desc .title {
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 1px;
      }
      .clock-desc .sub {
        font-size: 20px;
        font-weight: 700;
      }
      .plan-status-badge {
        padding: 10px 18px;
        font-size: 22px;
        font-weight: 900;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .flow-steps-grid {
        display: grid;
        grid-template-columns: 1fr auto 1.35fr auto 1fr;
        align-items: center;
        gap: 10px;
      }
      .flow-step-box {
        padding: 16px 10px;
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 6px;
        min-height: 116px;
        justify-content: center;
      }
      .flow-step-box.step-normal {
        border: 1.5px solid rgba(255, 255, 255, 0.22);
      }
      .flow-step-box.step-highlight {
        position: relative;
        box-shadow: 0 0 24px rgba(255, 106, 26, 0.45);
      }
      .step-idx {
        font-size: 22px;
        font-weight: 900;
      }
      .step-label {
        font-size: 19px;
        font-weight: 700;
        line-height: 1.3;
      }
      .flow-arrow-symbol {
        font-size: 28px;
        font-weight: 900;
        color: #FF6A1A;
      }
      .highlight-stamp {
        position: absolute;
        top: -16px;
        right: -12px;
        padding: 4px 10px;
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 1px;
        border-radius: 4px;
        border: 2px solid #FF6A1A;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s08"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.36"
    >
      <!-- Hiệu ứng Unfold mở màn phong cách giấy gấp Vox -->
      <div id="unfold-flap"></div>

      <!-- Hoạ tiết Grid mờ nhận diện thương hiệu -->
      <div class="grid-layer"></div>

      <!-- Thẻ Video A-Roll: con trực tiếp của wrapper KHÔNG có data-start để tuân thủ quy tắc HyperFrames -->
      <div id="video-wrapper">
        <div id="video-container">
          <video
            id="vid-05"
            src="assets/vid-05-police-interrogation-remedy-damages.mp4"
            data-start="0"
            data-duration="7.36"
            data-media-start="0.3"
            muted
            playsinline
          ></video>
        </div>
      </div>

      <!-- Overlay 1: Punch Phrase (Từ 1.1s đến 3.5s) -->
      <section id="clip-punch" class="clip" data-start="1.1" data-duration="2.4">
        <div id="punch-card-inner" class="punch-card">
          <div class="punch-badge hf-hl-orange">HỒ SƠ ĐIỀU TRA</div>
          <div class="punch-title-box hf-plate-ink">
            <span class="punch-text hf-text-light">LỜI KHAI KHẮC PHỤC</span>
            <span class="punch-sub hf-plate-ink-orange">THẨM VẤN & XÁC NHẬN NGUYỆN VỌNG</span>
          </div>
        </div>
      </section>

      <!-- Overlay 2: Timeline Diagram & Label Xin Gia Hạn (Từ 3.8s đến 7.36s) -->
      <section id="clip-timeline" class="clip" data-start="3.8" data-duration="3.56">
        <div id="timeline-card-inner" class="timeline-container">
          <!-- Nhãn hành động chính -->
          <div class="action-header hf-plate-ink">
            <div class="action-tag hf-hl-orange">ĐỀ XUẤT CỦA BỊ CAN</div>
            <h2 class="action-title hf-text-light">XIN GIA HẠN 3 NĂM</h2>
          </div>

          <!-- Lộ trình thực hiện & Đồng hồ thời gian -->
          <div class="timeline-body hf-plate-ink">
            <div class="timeline-meta-row">
              <div class="clock-group">
                <!-- SVG Icon Đồng hồ vẽ nét tự động -->
                <svg id="svg-clock" width="68" height="68" viewBox="0 0 70 70">
                  <circle
                    id="clock-rim"
                    cx="35"
                    cy="35"
                    r="28"
                    stroke="#FF6A1A"
                    stroke-width="5"
                    fill="none"
                  />
                  <line
                    id="clock-hour"
                    x1="35"
                    y1="35"
                    x2="35"
                    y2="19"
                    stroke="#F7F4EC"
                    stroke-width="5"
                    stroke-linecap="round"
                  />
                  <line
                    id="clock-minute"
                    x1="35"
                    y1="35"
                    x2="48"
                    y2="35"
                    stroke="#FF6A1A"
                    stroke-width="5"
                    stroke-linecap="round"
                  />
                </svg>
                <div class="clock-desc">
                  <span class="title hf-plate-ink-orange">MỐC 36 THÁNG</span>
                  <span class="sub hf-text-light">BÁN BỚT TÀI SẢN</span>
                </div>
              </div>
              <div class="plan-status-badge hf-hl-orange">PHƯƠNG ÁN</div>
            </div>

            <!-- Các bước chuyển đổi tài sản -->
            <div class="flow-steps-grid">
              <div class="flow-step-box step-normal flow-anim-item">
                <span class="step-idx hf-plate-ink-orange">01</span>
                <span class="step-label hf-text-light">Hỏi cung &amp; Khai nhận</span>
              </div>
              <div class="flow-arrow-symbol flow-anim-item">➔</div>
              <div class="flow-step-box step-highlight hf-hl-orange flow-anim-item">
                <div class="highlight-stamp hf-plate-ink">
                  <span class="hf-plate-ink-orange">ƯU TIÊN</span>
                </div>
                <span class="step-idx hf-text-ink">02</span>
                <span class="step-label hf-text-ink">Thanh lý nhà xưởng, xe</span>
              </div>
              <div class="flow-arrow-symbol flow-anim-item">➔</div>
              <div class="flow-step-box step-normal flow-anim-item">
                <span class="step-idx hf-plate-ink-orange">03</span>
                <span class="step-label hf-text-light">Hoàn trả thiệt hại</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Dải cam đáy thương hiệu -->
      <div id="bottom-brand-bar"></div>
    </div>

    <script>
      // 1. Khởi tạo stroke-dash cho SVG icon Đồng hồ
      const clockRim = document.getElementById("clock-rim");
      if (clockRim) {
        const lenRim = clockRim.getTotalLength();
        clockRim.style.strokeDasharray = lenRim;
        clockRim.style.strokeDashoffset = lenRim;
      }
      const clockHour = document.getElementById("clock-hour");
      if (clockHour) {
        const lenHour = clockHour.getTotalLength();
        clockHour.style.strokeDasharray = lenHour;
        clockHour.style.strokeDashoffset = lenHour;
      }
      const clockMinute = document.getElementById("clock-minute");
      if (clockMinute) {
        const lenMinute = clockMinute.getTotalLength();
        clockMinute.style.strokeDasharray = lenMinute;
        clockMinute.style.strokeDashoffset = lenMinute;
      }

      // 2. Xây dựng Paused Timeline độc lập cho Composition S08
      const tl = gsap.timeline({ paused: true });

      // Unfold effect mở đầu
      tl.fromTo(
        "#unfold-flap",
        { scaleY: 1, opacity: 1 },
        { scaleY: 0, opacity: 0, duration: 0.65, ease: "power2.out" },
        0.0
      );

      // Camera pan-right mượt mà: từ phía điều tra viên sang phía bị can trình bày
      tl.fromTo(
        "#video-container",
        { x: 140, scale: 1.48 },
        { x: -130, scale: 1.54, duration: 7.2, ease: "sine.inOut" },
        0.0
      );

      // --- Phân đoạn 1: Punch phrase "LỜI KHAI KHẮC PHỤC" (t = 1.1s -> 3.5s) ---
      tl.fromTo(
        "#punch-card-inner",
        { y: -36, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        1.1
      );
      tl.to(
        "#punch-card-inner",
        { y: -20, opacity: 0, duration: 0.35, ease: "power2.in" },
        3.15
      );

      // --- Phân đoạn 2: Timeline Diagram & Label 3 Năm (t = 3.8s -> 7.36s) ---
      tl.fromTo(
        "#timeline-card-inner",
        { y: 64, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        3.8
      );

      // Các bước sơ đồ xuất hiện tuần tự
      tl.fromTo(
        ".flow-anim-item",
        { scale: 0.82, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, stagger: 0.12, ease: "power2.out" },
        4.3
      );

      // Nhấn mạnh mốc thời gian và vẽ biểu tượng Đồng hồ (atMs ~58780 - 59090 tương đương 5.34s - 5.65s)
      tl.fromTo(
        ".step-highlight",
        { scale: 1 },
        { scale: 1.06, duration: 0.35, yoyo: true, repeat: 1, ease: "power2.out" },
        5.34
      );

      // Tự vẽ nét SVG Path Clock Icon
      if (clockRim) {
        tl.to("#clock-rim", { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" }, 5.65);
      }
      if (clockHour) {
        tl.to("#clock-hour", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 6.1);
      }
      if (clockMinute) {
        tl.to("#clock-minute", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 6.3);
      }

      // Đăng ký timeline cho HyperFrames runtime
      window.__timelines["scene-s08"] = tl;
    </script>
  
    </template>
  </body>
</html>
