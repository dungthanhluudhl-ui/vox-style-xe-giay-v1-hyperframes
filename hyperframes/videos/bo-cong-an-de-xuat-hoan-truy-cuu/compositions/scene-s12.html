    <script>
      const tl = gsap.timeline({ paused: true });

      // Video camera push nhẹ 1.0 -> 1.15
      tl.fromTo("#video-scaler", { scale: 1.0 }, { scale: 1.15, duration: 8.0, ease: "none" }, 0);

      // Setup SVG paths cho Money Icon (strokeDashoffset)
      const strokeElements = document.querySelectorAll("#money-icon .svg-stroke");
      strokeElements.forEach((el) => {
        const len = el.getTotalLength ? el.getTotalLength() : 180;
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
      });

      // --- PHASE 1 ANIMATION (0.0s - 2.1s) ---
      tl.fromTo(
        "#card-1",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.1
      );

      strokeElements.forEach((el) => {
        tl.to(
          el,
          { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" },
          0.45
        );
      });

      tl.to(
        "#card-1",
        { y: -20, opacity: 0, duration: 0.25, ease: "power2.in" },
        1.8
      );

      // --- PHASE 2 ANIMATION (2.1s - 4.8s) ---
      tl.fromTo(
        "#card-2",
        { scale: 0.88, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        2.15
      );

      tl.fromTo(
        ".pillar-pill",
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, stagger: 0.1, ease: "power3.out" },
        2.5
      );

      tl.to(
        "#card-2",
        { scale: 0.94, opacity: 0, duration: 0.25, ease: "power2.in" },
        4.5
      );

      // --- PHASE 3 ANIMATION (4.8s - 8.0s) ---
      tl.fromTo(
        "#card-3",
        { y: 60, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        4.85
      );

      tl.fromTo(
        "#card-3-strip",
        { scale: 0.9, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        5.25
      );

      // Đăng ký timeline cho HyperFrames seek
      window.__timelines["scene-s12"] = tl;
    </script>
