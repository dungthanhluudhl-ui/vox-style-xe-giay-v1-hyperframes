    <script>
      // Single paused timeline registered on window.__timelines["scene-s09"]
      const tl = gsap.timeline({ paused: true });

      // 1. Initial State Setup
      tl.set("#punch-container", { opacity: 0, y: -24 });
      tl.set("#hero-card-container", { opacity: 0, y: 70 });
      tl.set("#data-board-container", { opacity: 0, y: 50 });
      tl.set("#money-badge", { scale: 0, opacity: 0 });
      tl.set("#restitution-stamp", { scale: 0.85, opacity: 0 });

      // Prepare SVG path lengths
      const paths = document.querySelectorAll(".draw-path");
      paths.forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = len + "";
        p.style.strokeDashoffset = len + "";
      });

      // 2. Entrance Animation: rise (t = 0.15s)
      tl.to(
        "#hero-card-container",
        { y: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
        0.15
      );

      // Camera Motion: gentle upward pan & slight zoom on hero illustration
      tl.fromTo(
        "#hero-img",
        { y: 30, scale: 1.0 },
        { y: -15, scale: 1.05, duration: 5.65, ease: "none" },
        0.15
      );

      // 3. Data Board Entrance (t = 0.65s)
      tl.to(
        "#data-board-container",
        { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.65
      );

      // 4. Overlay 1: Punch Phrase "GOM MỌI NGUỒN LỰC" (atMs: 62250 -> 1.45s)
      tl.to(
        "#punch-container",
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.45
      );

      // 5. Overlay 2: Icon "money" + Data Progress Counter (atMs: 62680 -> 1.88s)
      tl.to(
        "#money-badge",
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.88
      );

      // SVG path progressive draw
      tl.to(
        ".draw-path",
        { strokeDashoffset: 0, duration: 0.7, ease: "power2.out", stagger: 0.12 },
        1.95
      );

      // Counter animation & progress bar fill (1.95s to 3.75s)
      tl.to(
        "#counter-num",
        { innerText: 100, snap: { innerText: 1 }, duration: 1.8, ease: "power2.out" },
        1.95
      );
      tl.to(
        "#progress-fill",
        { width: "100%", duration: 1.8, ease: "power2.out" },
        1.95
      );

      // 6. Overlay 3: Label "QUỸ KHẮC PHỤC HẬU QUẢ" (atMs: 64890 -> 4.09s)
      tl.to(
        "#restitution-stamp",
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        4.09
      );

      // Register timeline deterministically
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s09"] = tl;
    </script>
