    <script>
      // THIẾT LẬP ĐO ĐƯỜNG NÉT SVG PATH DRAW CHUẨN XÁC
      const warnTri = document.getElementById("warn-triangle");
      const warnStem = document.getElementById("warn-stem");
      if (warnTri && warnStem) {
        const triLen = warnTri.getTotalLength();
        warnTri.style.strokeDasharray = `${triLen}`;
        warnTri.style.strokeDashoffset = `${triLen}`;

        const stemLen = warnStem.getTotalLength();
        warnStem.style.strokeDasharray = `${stemLen}`;
        warnStem.style.strokeDashoffset = `${stemLen}`;
      }

      // KHỞI TẠO DUY NHẤT 1 TIMELINE PAUSED CHO HYPERFRAMES COMPOSITION
      const tl = gsap.timeline({ paused: true });

      // ==========================================
      // SHOT 1: 0s -> 7.01s (ENTRANCE: STRIKE & CAMERA ZOOM-IN)
      // ==========================================

      // 1. Strike Entrance: Giáng xuống từ trên với lực nén mạnh mẽ dùng fromTo (không dùng tl.set tại 0)
      tl.fromTo(
        "#stage",
        { scale: 1.16, y: -40, opacity: 0 },
        { scale: 1.0, y: 0, opacity: 1, duration: 0.45, ease: "power4.out" },
        0
      );

      // Camera motion: Zoom-in nhẹ nhàng kéo dài suốt Shot 1 qua camera-rig độc lập (0.45s -> 7.01s)
      tl.to(
        "#camera-rig",
        { scale: 1.06, duration: 6.56, ease: "sine.inOut" },
        0.45
      );

      // 2. Overlay 1: Warning Badge xuất hiện tại 0.84s (giữ 2.0s đến 2.84s)
      tl.fromTo(
        "#warning-badge",
        { scale: 0, opacity: 0, x: 20 },
        { scale: 1, opacity: 1, x: 0, duration: 0.38, ease: "power3.out" },
        0.84
      );
      // SVG stroke draw đồng bộ
      tl.to("#warn-triangle", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 0.88);
      tl.to("#warn-stem", { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, 1.05);

      // Warning Badge biến mất lúc 2.84s
      tl.to(
        "#warning-badge",
        { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" },
        2.84
      );

      // 3. Overlay 2: Label "ĐƯA VÀO HỆ THỐNG" xuất hiện tại 3.61s (giữ 2.2s đến 5.81s)

        "#system-label",
        { x: -50, opacity: 0, scale: 0.9 },
        { x: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        3.61
      );
      // Label biến mất lúc 5.81s
      tl.to(
        "#system-label",
        { opacity: 0, x: -30, duration: 0.35, ease: "power2.in" },
        5.81
      );

      // ==========================================
      // SHOT 2: 7.01s -> 10.9s (TRANSITION: GROW & KẾT ÁN)
      // ==========================================

      // 4. Transition In: Grow pop bùng nổ khi video dừng ở ngôi sao 352 triệu
      tl.fromTo(
        "#stage",
        { scale: 0.94 },
        { scale: 1.0, duration: 0.48, ease: "power3.out", immediateRender: false },
        7.01
      );

      // 5. Overlay 3: Punch-phrase "THẤT THOÁT NGÂN SÁCH" xuất hiện tại 7.38s (giữ đến 9.20s)
      tl.fromTo(
        "#punch-phrase",
        { scale: 0.8, opacity: 0, y: -30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
        7.38
      );
      // Punch-phrase thu gọn lúc 9.20s nhường sự tập trung tối đa cho con dấu kết án
      tl.to(
        "#punch-phrase",
        { opacity: 0, scale: 0.95, duration: 0.2, ease: "power2.in" },
        9.14
      );

      // 6. Overlay 4: Con dấu mộc "ÁP VÀO ÁN HÙNG" đóng dấu đanh thép dứt khoát tại 9.34s (giữ tới hết scene 10.9s)
