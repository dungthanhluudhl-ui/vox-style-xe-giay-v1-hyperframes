    <script>
      // Khởi tạo đo đạc SVG chính xác để seek an toàn và tất định
      const checkCircle = document.getElementById("check-circle");
      const checkTick = document.getElementById("check-tick");
      const circleLen = checkCircle ? Math.ceil(checkCircle.getTotalLength()) : 315;
      const tickLen = checkTick ? Math.ceil(checkTick.getTotalLength()) : 70;

      if (checkCircle) {
        checkCircle.style.strokeDasharray = circleLen;
        checkCircle.style.strokeDashoffset = circleLen;
      }

      if (checkTick) {
        checkTick.style.strokeDasharray = tickLen;
        checkTick.style.strokeDashoffset = tickLen;
      }

      // Tạo timeline chính PAUSED theo hợp đồng HyperFrames
      const tl = gsap.timeline({ paused: true });

      // 1. Vào cảnh (0.0s - 0.7s): Rise lò xo nhẹ cho Video Card & Tape
      tl.fromTo(
        "#video-card",
        { y: 90, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0
      );

      tl.fromTo(
        "#tape-accent",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.2
      );

      tl.fromTo(
        "#meta-header",
        { opacity: 0, y: -15 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0.1
      );

      // Camera motion: zoom-in chậm, liên tục từ 1.0 -> 1.06 trong suốt 8.29s
      tl.fromTo(
        "#video-viewport",
        { scale: 1.0 },
        { scale: 1.06, duration: 8.29, ease: "none" },
        0
      );

      // 2. Hook Card xuất hiện (0.25s -> 2.75s)
      tl.fromTo(
        "#hook-card",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.25
      );
      tl.to(
        "#hook-card",
        { y: -20, opacity: 0, duration: 0.35, ease: "power2.in" },
        2.4
      );

      // 3. Overlay 1: "VẬT TƯ THỰC TẾ" (atMs: 2950, holdMs: 1900 -> kết thúc lúc 4.85s)
      tl.fromTo(
        "#overlay-inspect",
        { scale: 0.85, opacity: 0, x: -20 },
        { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        2.95
      );
      tl.to(
        "#overlay-inspect",
        { opacity: 0, y: -10, duration: 0.3, ease: "power2.in" },
        4.55
      );

      // 4. Overlay 2: ICON CHECK "PHỤ TÙNG LÀ THẬT" (atMs: 4960, holdMs: 1600 -> kết thúc lúc 6.56s)
      tl.fromTo(
        "#overlay-check",
        { scale: 0.75, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        4.96
      );

      // Hiệu ứng tự vẽ SVG đường viền tròn và dấu tích (Self-drawing path seek-safe)
      tl.fromTo(
        "#check-circle",
        { strokeDashoffset: circleLen },
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        5.05
      );
      tl.fromTo(
        "#check-tick",
        { strokeDashoffset: tickLen },
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        5.25
      );

      tl.to(
        "#overlay-check",
        { scale: 0.9, opacity: 0, duration: 0.3, ease: "power2.in" },
        6.26
      );

      // 5. Overlay 3: "LẮP RÁP TRỰC TIẾP" (atMs: 6960, holdMs: 1330 -> giữ đến hết cảnh 8.29s)
      tl.fromTo(
        "#overlay-assembly",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        6.96
      );

      // Đăng ký timeline cho HyperFrames
      window.__timelines["scene-s01"] = tl;
    </script>
