      const circlePath = document.getElementById("circle-path-draw");
      const moneyPaths = document.querySelectorAll(".money-draw");

      pathNormal.style.strokeDashoffset = lenNormal;

      const lenKink = pathKink.getTotalLength();
      pathKink.style.strokeDasharray = lenKink;

      const lenCircle = circlePath.getTotalLength();

      circlePath.style.strokeDashoffset = lenCircle;

        const len = p.getTotalLength();

        p.style.strokeDashoffset = len;
      });

      const tl = gsap.timeline({ paused: true });

        "#camera-rig",

        { scale: 1.0, y: 0, duration: 0.45, ease: "power4.out" },
        0.0
      );

      tl.to(
        "#flow-path-normal",
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        0.5
      );

      tl.fromTo(
        "#flow-label-1",
        { opacity: 0, scale: 0.85 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" },
        0.7
      );

      // 1.1s - 1.65s: Bước ngoặt nghịch lý - Đường dẫn bị bẻ gập hướng sang chỗ mua bất thường

        "#kink-marker",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(2)" },
        1.1
      );

      tl.to(
        "#flow-path-kink",
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        1.15
      );

      tl.fromTo(
        "#kink-arrowhead",
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" },
        1.55
      );

      // 1.65s: Overlay Icon Tiền Mặt xuất hiện (atMs: 104440 - offset 1.65s)

        "#money-badge",
        { scale: 0, opacity: 0, rotation: -12 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.42, ease: "power3.out" },
        1.65
      );

      tl.to(
        ".money-draw",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        1.75
      );

      // 2.05s: Card 2 xuất hiện ("CHỖ MUA")

        { scale: 1, opacity: 1, y: 0, duration: 0.52, ease: "power3.out" },
