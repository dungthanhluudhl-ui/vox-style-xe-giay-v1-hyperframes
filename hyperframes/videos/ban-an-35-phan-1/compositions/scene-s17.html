      // 1. Khởi tạo paused timeline duy nhất theo hợp đồng HyperFrames
      const tl = gsap.timeline({ paused: true });

      // 2. Chuẩn bị hiệu ứng vẽ SVG path cho Ban Icon & Rail Tracks
      const banCircle = document.getElementById("ban-circle");
      const banSlash = document.getElementById("ban-slash");
      if (banCircle) {
        const lenCircle = banCircle.getTotalLength();
        banCircle.style.strokeDasharray = lenCircle;
        banCircle.style.strokeDashoffset = lenCircle;
      }
      if (banSlash) {
        const lenSlash = banSlash.getTotalLength();
        banSlash.style.strokeDasharray = lenSlash;
        banSlash.style.strokeDashoffset = lenSlash;
      }

      const rail1Top = document.getElementById("rail-1-track-top");
      const rail1Bot = document.getElementById("rail-1-track-bot");
      if (rail1Top && rail1Bot) {
        const len1 = rail1Top.getTotalLength();
        rail1Top.style.strokeDasharray = len1;
        rail1Top.style.strokeDashoffset = len1;
        rail1Bot.style.strokeDasharray = len1;
        rail1Bot.style.strokeDashoffset = len1;
      }

      // ==========================================
      // CHOREOGRAPHY THEO SHOTLIST S17 (8.67s)
      // ==========================================

      // [0.05s - 0.80s] Transition In: "rise" cho toàn bộ cấu trúc cảnh trong safe-zone
      tl.fromTo(
        "#scene-container",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
        0.05
      );

      // Camera motion: pan-right chậm trên ảnh hero (img-01) xuyên suốt thời lượng
      tl.fromTo(
        "#hero-img",
        { scale: 1.06, x: -25 },
        { scale: 1.14, x: 25, duration: 8.6, ease: "none" },
        0.05
      );
