    <!-- GSAP Choreography Timeline Script -->
    <script>
      // Khởi tạo Timeline paused bắt buộc cho HyperFrames
      const tl = gsap.timeline({ paused: true });

      // Cài đặt chiều dài dash cho đường vẽ annotation
      const pathLine = document.getElementById("pointer-line");
      if (pathLine) {
        const lineLen = pathLine.getTotalLength();
        pathLine.style.strokeDasharray = lineLen;
        pathLine.style.strokeDashoffset = lineLen;
      }

      /* -------------------------------------------------------------
       * SHOT 1 (0.00s -> 4.81s)
       * Transition In: Grow, Camera: Zoom-in nhẹ đặc tả phụ tùng
       * ------------------------------------------------------------- */

      // 1. Entrance Grow cho Hero Card (t = 0.1s)
      tl.fromTo(
        "#hero-card",
        { scale: 0.84, opacity: 0, y: 50 },
        { scale: 1, opacity: 1, y: 0, duration: 0.75, ease: "power3.out" },
        0.1
      );

      // 2. Camera Motion: Zoom-in chậm tập trung vào bộ giảm xóc
      tl.fromTo(
        "#hero-img",
        { scale: 1 },
        { scale: 1.15, duration: 4.7, ease: "sine.out" },
        0.1
      );

      // 3. SVG Path Draw vẽ đường trỏ tới phụ tùng (t = 0.85s)
      tl.to(
        "#pointer-line",
        { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
        0.85
      );

      // 4. Callout Pin xuất hiện sau khi đường nét chạm đích (t = 1.15s)
      tl.fromTo(
        "#callout-pin",
        { opacity: 0, scale: 0.7, x: -20 },
        { opacity: 1, scale: 1, x: 0, duration: 0.45, ease: "back.out(1.5)" },
        1.15
      );

      // 5. Overlay Label: "ĐIỀU KIỆN SỬA CHỮA" (từ 1.36s đến 3.56s)
      tl.fromTo(
        "#label-dieu-kien",
        { opacity: 0, y: 35, scale: 0.92 },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
        1.36
      );
      tl.to(
        "#label-dieu-kien",
        { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
        3.56
      );

      // 6. Overlay Icon: Warning lúc 3.76s
      tl.fromTo(
        "#icon-warning",
        { opacity: 0, scale: 0.3, rotation: -20 },
        { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.7)" },
        3.76
      );
      tl.to(
        "#icon-warning",
        { opacity: 0, scale: 0.8, duration: 0.3, ease: "power2.in" },
        4.65
      );

      /* -------------------------------------------------------------
       * SHOT 2 (4.81s -> 10.07s)
       * Transition In: Cut sắc nét, Camera: Pan-left & Idle Sway
       * ------------------------------------------------------------- */

      // 1. Chuyển cảnh tại 4.81s: Ẩn annotation của Shot 1
      tl.to(
        ["#annotation-group", "#callout-pin"],
        { opacity: 0, duration: 0.2, ease: "power2.in" },
        4.75
      );

      // 2. Cập nhật nhãn hồ sơ tại header
      tl.set("#case-serial-text", { innerText: "NGHỊCH LÝ GARA" }, 4.81);
      tl.set("#stamp-label", { innerText: "THIẾU PHỤ TÙNG THAY THẾ" }, 4.81);

      // 3. Card thợ xe thu nhỏ nhẹ & pan sang trái tạo bố cục Shot 2 (t = 4.81s)
      tl.to(
        "#hero-card",
        { scale: 0.82, x: -30, y: -30, duration: 0.55, ease: "power2.inOut" },
        4.81
      );

      // 4. Idle sway nhẹ nhàng cho card thợ xe
      tl.to(
        "#hero-card",
        { rotation: 1.1, duration: 2.3, yoyo: true, repeat: 1, ease: "sine.inOut" },
        5.4
      );

      // 5. Khung trích dẫn châm biếm xuất hiện (t = 5.2s)
      tl.fromTo(
        "#satire-card",
        { opacity: 0, y: 40, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" },
        5.2
      );

      // 6. Overlay Label: "NGHỊCH LÝ THỰC TẾ" (từ 6.01s đến 8.01s)
      tl.fromTo(
        "#label-nghich-ly",
        { opacity: 0, y: 35, scale: 0.92 },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
        6.01
      );
      tl.to(
        "#label-nghich-ly",
        { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
        8.01
      );

      // 7. Overlay Icon: Question lúc 9.21s
      tl.fromTo(
        "#icon-question",
        { opacity: 0, scale: 0.3, rotation: 25 },
        { opacity: 1, scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.8)" },
        9.21
      );

      // Đăng ký timeline paused vào HyperFrames registry bắt buộc
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s10"] = tl;
    </script>
