    // Khởi tạo Timeline paused duy nhất cho composition root
    const tl = gsap.timeline({ paused: true });

    const rim = document.getElementById("clock-rim");
    const handH = document.getElementById("clock-hand-h");
    const handM = document.getElementById("clock-hand-m");

    let lenRim = 0;
    let lenH = 0;
    let lenM = 0;

    if (rim && typeof rim.getTotalLength === "function") {
      lenRim = rim.getTotalLength();
      rim.style.strokeDasharray = `${lenRim}`;
      rim.style.strokeDashoffset = `${lenRim}`;
    }
    if (handH && typeof handH.getTotalLength === "function") {
      lenH = handH.getTotalLength();
      handH.style.strokeDasharray = `${lenH}`;
      handH.style.strokeDashoffset = `${lenH}`;
    }
    if (handM && typeof handM.getTotalLength === "function") {
      lenM = handM.getTotalLength();
      handM.style.strokeDasharray = `${lenM}`;
      handM.style.strokeDashoffset = `${lenM}`;

    // ==========================================
    // DIỄN HOẠT SHOT 1 (0.00s -> 6.54s)
    // ==========================================

    // Hero card trượt lên từ đáy khung hình (rise transition)

    );
