    <!-- GSAP Master Timeline Animation Script -->
    <script>
      // Khởi tạo timeline paused bắt buộc theo chuẩn HyperFrames
      const tl = gsap.timeline({ paused: true });

      // Chuẩn bị đường nét tự vẽ cho icon doc
      const docPaths = document.querySelectorAll(".doc-path");
      docPaths.forEach(function (path) {
        const len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
      });

      // 1. GIAI ĐOẠN 0.0s - 0.5s: Setup nền tảng kỹ thuật & Header
      tl.fromTo(
        "#header-zone",
        { y: -24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.1
      );

      tl.fromTo(
        "#ray-track-bottom",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
        0.2
      );

      tl.fromTo(
        "#separation-barrier",
        { opacity: 0, scaleX: 0.8 },
        { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.out" },
        0.3
      );

      // 2. GIAI ĐOẠN 0.4s - 0.9s: ĐƯỜNG RAY 2 MỞ RỘNG (transitionIn: grow)
      tl.fromTo(
        "#ray-track-top",
        { scaleX: 0.88, opacity: 0, transformOrigin: "left center" },
        { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.35
      );

      tl.fromTo(
        "#rail-line-1",
        { scaleX: 0, transformOrigin: "left center" },
        { scaleX: 1, duration: 0.6, ease: "power3.out" },
        0.45
      );

      tl.fromTo(
        "#rail-line-2",
        { scaleX: 0, transformOrigin: "left center" },
        { scaleX: 1, duration: 0.6, ease: "power3.out" },
        0.50
      );

      // 3. OVERLAY 1: LABEL "RAY 2: SỔ SÁCH" (atMs: 166850 -> 0.55s)
      tl.fromTo(
        "#overlay-label-ray2",
        { scale: 0.6, opacity: 0, y: -10 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.55
      );

      // 4. GIAI ĐOẠN 0.8s - 2.0s: XẤP HÓA ĐƠN CỦA CÔNG TY Đ LƯỚT VÀO ĐƯỜNG RAY
      tl.fromTo(
        "#main-invoice",
        { x: -160, opacity: 0, rotation: -2 },
        { x: 0, opacity: 1, rotation: 0, duration: 0.7, ease: "power3.out" },
        0.85
      );

      tl.fromTo(
        "#secondary-invoice",
        { x: -100, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        1.1
      );

      // Con dấu dập mạnh vào góc phải của hóa đơn
      tl.fromTo(
        "#fake-stamp",
        { scale: 2.2, opacity: 0, rotation: -22 },
        { scale: 1, opacity: 1, rotation: -7, duration: 0.35, ease: "power4.out" },
        1.75
      );

      // Camera motion: pan-right nhẹ xuyên qua đường ray
      tl.to(
        "#doc-conveyor",
        { x: 26, duration: 3.5, ease: "sine.inOut" },
        1.9
      );

      // 5. OVERLAY 2: ICON "DOC" TỰ VẼ SVG (atMs: 169580 -> 3.28s)
      tl.fromTo(
        "#overlay-icon-doc",
        { scale: 0, opacity: 0, y: 12 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        3.28
      );

      docPaths.forEach(function (path, i) {
        tl.to(
          path,
          { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
          3.38 + i * 0.08
        );
      });

      // 6. OVERLAY 3: PUNCH-PHRASE "GIẢ LẬP MUA BÁN" (atMs: 170680 -> 4.38s)
      tl.fromTo(
        "#punch-card",
        { scale: 0.75, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
        4.38
      );

      // Đăng ký timeline duy nhất trên window.__timelines["scene-s18"]
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s18"] = tl;
    </script>
