    // Khởi tạo Timeline Paused duy nhất theo hợp đồng của HyperFrames

      "#shot-card",
      { rotationY: -38, rotationX: 12, scale: 0.88, opacity: 0 },
      { rotationY: 0, rotationX: 0, scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
