<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { font-family: "Be Vietnam Pro", sans-serif; }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #F5F0E4;
    }
    .clip { position: absolute; inset: 0; }

    #first-stage {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #F5F0E4;
      transform-origin: 50% 50%;
    }
    #first-stage video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #first-overlay { z-index: 2; }

    #shot-2 {
      z-index: 3;
      overflow: hidden;
    }
    #shot2-media {
      position: absolute;
      inset: 0;
      overflow: hidden;
      transform-origin: 50% 66%;
    }
    #shot2-media img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .document-plate {
      position: absolute;
      top: 202px;
      left: 66px;
      width: max-content;
      padding: 17px 29px 20px;
      background: #141414;
      color: #F7F4EC;
      font-size: 66px;
      font-weight: 900;
      line-height: 1.16;
      letter-spacing: -1.5px;
      white-space: nowrap;
      transform-origin: 18% 82%;
    }
    #shot2-plate { z-index: 2; }

    #brand-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      background: #FF6A1A;
      z-index: 10;
    }
  </style>

  <div id="root" data-composition-id="scene-s01" data-width="1080" data-height="1920" data-duration="7.66">
    <div id="first-stage">
      <video
        id="journey-video"
        src="assets/vid-10-journey-west-paper-cutout.mp4"
        muted
        playsinline
        data-start="0"
        data-duration="4.38"
        data-media-start="1.5"
      ></video>
      <div id="first-overlay" class="clip" data-start="0" data-duration="4.38" data-layout-allow-overlap>
        <div id="shot1-plate" class="document-plate">ĐỌC NGƯỢC</div>
      </div>
    </div>

    <section id="shot-2" class="clip" data-start="4.38" data-duration="3.28">
      <div id="shot2-media">
        <img src="assets/img-05-pilgrims-holding-glowing-scrolls.jpg" alt="">
      </div>
      <div id="shot2-plate" class="document-plate" data-layout-allow-overlap>MẬT CHỈ</div>
    </section>

    <div id="brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo("#first-stage",
      { rotationY: -55, opacity: 0, transformPerspective: 1000 },
      { rotationY: 0, opacity: 1, transformPerspective: 1000, duration: 0.45, ease: "power2.out" },
      0
    );

    tl.fromTo("#shot1-plate",
      { opacity: 0, scale: 1.4, rotation: -12 },
      { opacity: 1, scale: 1, rotation: -3, duration: 0.28, ease: "power4.out" },
      0.81
    );

    tl.fromTo("#shot2-media",
      { opacity: 0 },
      { opacity: 1, duration: 0.3, ease: "none" },
      4.38
    );
    tl.fromTo("#shot2-media",
      { scale: 1 },
      { scale: 1.18, duration: 2.45, ease: "power2.out" },
      5.0
    );
    tl.fromTo("#shot2-plate",
      { opacity: 0, scale: 1.4, rotation: -12 },
      { opacity: 1, scale: 1, rotation: -3, duration: 0.28, ease: "power4.out" },
      4.83
    );

    window.__timelines["scene-s01"] = tl;
  </script>

    </template>
  </body>
</html>
