    #root {
      position: relative;
      width: 1080px;
      height: 1920px;

    }
    .clip { position: absolute; inset: 0; }

    #plea-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    #terms-shot { z-index: 2; pointer-events: none; }
    #terms-card {

      left: 65px;
      top: 1000px;

      border-radius: 12px;
      background: #141414;
      color: #F7F4EC;
      transform-origin: center top;
      opacity: 0;

    .term {

      width: 100%;

      line-height: 1.45;

      height: 120%;

      { y: 0, opacity: 1, duration: 0.32, ease: "power3.out" },
