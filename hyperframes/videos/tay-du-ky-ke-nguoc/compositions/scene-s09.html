<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    .media-frame {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .image-stage {
      position: absolute;
      inset: -80px -90px;
    }

    .image-stage img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #shot-1 { z-index: 1; }

    #shot-1-peel {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #video-2-frame {
      z-index: 2;
    }

    .timed-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #shot-3 { z-index: 3; }

    #shot-3-picture {
      position: absolute;
      inset: 0;
    }

    #video-4-frame {
      z-index: 4;
      transform-origin: 50% 49%;
    }

    #spotlight {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: radial-gradient(
        ellipse at 50% 47%,
        rgba(20,20,20,0) 39%,
        rgba(20,20,20,0.28) 100%
      );
    }

    .label-layer {
      z-index: 6;
      pointer-events: none;
    }

    .label {
      position: absolute;
      left: 50%;
      width: max-content;
      max-width: 940px;
      padding: 19px 30px 21px;
      border-radius: 8px;
      background: #141414;
      color: #F7F4EC;
      font-size: 54px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: 0.025em;
      text-align: center;
      white-space: nowrap;
      transform-origin: 50% 50%;
    }

    #place-label { top: 246px; }
    #closing-label { top: 252px; }

    #brand-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      z-index: 9;
      background: #FF6A1A;
    }
  </style>

  <div id="root" data-composition-id="scene-s09" data-width="1080" data-height="1920" data-duration="10.11">

      <div id="shot-1-peel">

            <img src="assets/img-07-wukong-losing-golden-staff.jpg" alt="">
          </div>
        </div>
      </div>
    </section>

    <div id="video-2-frame" class="media-frame">
      <video
        id="video-2"
        class="timed-video"
        src="assets/vid-04-wukong-drops-golden-staff.mp4"
        muted
        playsinline
        data-start="1.5"
        data-duration="1.6"
        data-media-start="3"
      ></video>
    </div>

    <section id="shot-3" class="clip" data-start="3.1" data-duration="2.28">
      <div id="shot-3-picture" class="media-frame">
        <div id="shot-3-camera" class="image-stage" data-layout-allow-overflow>

        id="video-4"

        playsinline
        data-start="5.38"
        data-duration="4.73"
        data-media-start="1.5"
      ></video>

    <div id="spotlight" aria-hidden="true"></div>

      <div id="place-label" class="label">HOA QUẢ SƠN</div>

    <div id="brand-bar" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo("#shot-1-peel",
      { clipPath: "inset(0 100% 0 0)" },
      { clipPath: "inset(0 0% 0 0)", duration: 0.43, ease: "power3.out" },
      0
    );

    tl.fromTo("#shot-1-camera",
      { x: 65, y: 15, scale: 1.07 },
      { x: -65, y: -100, scale: 1.12, duration: 1.46, ease: "power2.inOut" },
      0
    );

    tl.fromTo("#shot-3-picture",
      { opacity: 0 },
      { opacity: 1, duration: 0.22, ease: "none" },
      3.1
    );

    tl.fromTo("#shot-3-camera",
      { x: -76, y: 5, scale: 1.02 },
      { x: 76, y: -18, scale: 1.07, duration: 2.23, ease: "power2.inOut" },
      3.1
    );

    tl.fromTo("#place-label",
      { xPercent: -50, scale: 0, opacity: 0 },
      { xPercent: -50, scale: 1, opacity: 1, duration: 0.32, ease: "power3.out" },
      3.46
    );

    tl.fromTo("#video-4-frame",
      { scale: 1 },
      { scale: 1.085, duration: 4.68, ease: "power1.inOut" },
      5.38
    );

    tl.fromTo("#closing-label",
      { xPercent: -50, scale: 0, opacity: 0 },
      { xPercent: -50, scale: 1, opacity: 1, duration: 0.32, ease: "power3.out" },
      5.38
    );

    tl.fromTo("#closing-label",
      { opacity: 1 },
      { opacity: 0, duration: 0.24, ease: "power2.out" },
      7.68
    );

    window.__timelines["scene-s09"] = tl;
  </script>

    </template>
  </body>
</html>
