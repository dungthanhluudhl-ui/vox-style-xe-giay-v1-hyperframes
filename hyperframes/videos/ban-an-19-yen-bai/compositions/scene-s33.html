<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    /* WCAG safe color classes (Style DNA) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      background-color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      color: #141414;
      -webkit-font-smoothing: antialiased;
    }

    /* Standard HyperFrames .clip convention: full-frame absolute positioning */
    .clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #141414;
    }

    /* Stacking contexts & explicit z-index hierarchy */
    #shot-bg {
      z-index: 1;
      isolation: isolate;
    }

    #clip-diagram {
      z-index: 10;
    }

    #clip-label {
      z-index: 20;
    }

    #clip-punch {
      z-index: 30;
    }

    #clip-icon {
      z-index: 40;
    }

    /* Main background asset: full-bleed 1080x1920 image kept in original color */
    #bg-photo-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: center center;
      will-change: transform;
      z-index: 1;
    }

    #bg-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Shatter entrance transition flaps */
    #shatter-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }

    .shatter-flap {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.22) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      will-change: transform, opacity;
    }

    #shatter-flap-a {
      clip-path: polygon(0 0, 100% 0, 100% 42%, 54% 50%, 0 60%);
      transform-origin: 20% 20%;
    }

    #shatter-flap-b {
      clip-path: polygon(0 60%, 54% 50%, 100% 42%, 100% 100%, 0 100%);
      transform-origin: 80% 80%;
    }

    #shatter-seam {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
    }

    /* Overlay 1: Diagram Card ("LỊCH SỬ VI PHẠM") */
    #diagram-card {
      position: absolute;
      top: 240px;
      left: 60px;
      right: 60px;
      height: auto;
      padding: 30px 38px;
      border-left: 12px solid #FF6A1A;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      border-radius: 4px;
      will-change: transform, opacity;
    }

    .diagram-title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Overlay 2: Label Card ("GÂY RỐI • LỪA ĐẢO") */
    #label-card {
      position: absolute;
      top: 480px;
      left: 60px;
      right: 60px;
      height: auto;
      padding: 28px 38px;
      border-left: 12px solid #FF6A1A;
      border-radius: 4px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      will-change: transform, opacity;
    }

    .label-headline {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.25;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Overlay 4: Warning Icon Badge */
    #warning-badge {
      position: absolute;
      top: 660px;
      left: 60px;
      width: 84px;
      height: 84px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      border-left: 8px solid #FF6A1A;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
      will-change: transform, opacity;
    }

    .warning-svg {
      width: 52px;
      height: 52px;
      display: block;
    }

    /* Overlay 3: Punch Phrase Card ("CỐ Ý GÂY THƯƠNG TÍCH") */
    #punch-card {
      position: absolute;
      top: 770px;
      left: 60px;
      right: 60px;
      height: auto;
      padding: 34px 38px;
      border: 4px solid #FF6A1A;
      border-radius: 6px;
      box-shadow: 0 24px 65px rgba(0, 0, 0, 0.9);
      will-change: transform, opacity;
    }

    .punch-text {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Brand Signature: Bottom Orange Bar */
    #bottom-orange-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 10px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s33"
    data-width="1080"
    data-height="1920"
    data-duration="8.48"
  >
    <!-- Background Photo & Transition Layer (isolated stacking context) -->
    <section id="shot-bg" class="clip" data-start="0" data-duration="8.48" data-track-index="0">
      <div id="bg-photo-wrapper">
        <img
          id="bg-photo"
          src="assets/img-16-case-file-criminal-charges.jpg"
          alt="Hồ sơ tiền án tiền sự"
        />
      </div>

      <!-- Shatter Reveal Paper Cover Flaps -->
      <div id="shatter-overlay">
        <div id="shatter-flap-a" class="shatter-flap"></div>
        <div id="shatter-flap-b" class="shatter-flap"></div>
      </div>

      <!-- Seam flash stroke on shatter -->
      <svg id="shatter-seam" viewBox="0 0 1080 1920" width="1080" height="1920">
        <path d="M 0 1152 L 583 960 L 1080 806" stroke="#FF6A1A" stroke-width="8" fill="none" stroke-linecap="round" />
      </svg>
    </section>

    <!-- Overlay 1: Diagram ("LỊCH SỬ VI PHẠM") -->
    <!-- atMs: 259980 (1.84s), holdMs: 5000 (ends at 6.84s) -->
    <section id="clip-diagram" class="clip" data-start="1.84" data-duration="5.0" data-track-index="1">
      <div id="diagram-card" class="hf-plate-ink">
        <div class="diagram-title hf-text-light">LỊCH SỬ VI PHẠM</div>
      </div>
    </section>

    <!-- Overlay 2: Label ("GÂY RỐI • LỪA ĐẢO") -->
    <!-- atMs: 260610 (2.47s), holdMs: 2400 (ends at 4.87s) -->
    <section id="clip-label" class="clip" data-start="2.47" data-duration="2.4" data-track-index="2">
      <div id="label-card" class="hf-plate-ink">
        <div class="label-headline hf-text-light">GÂY RỐI • LỪA ĐẢO</div>
      </div>
    </section>

    <!-- Overlay 4: Warning Icon -->
    <!-- atMs: 265560 (7.42s), holdMs: 1800 (until scene end 8.48s) -->
    <section id="clip-icon" class="clip" data-start="7.42" data-duration="1.06" data-track-index="4">
      <div id="warning-badge" class="hf-plate-ink">
        <svg class="warning-svg" viewBox="0 0 48 48" fill="none">
          <path
            id="warn-triangle"
            d="M 24 6 L 44 42 H 4 Z"
            stroke="#FF6A1A"
            stroke-width="4.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            id="warn-excl-line"
            d="M 24 18 V 28"
            stroke="#FF6A1A"
            stroke-width="4.5"
            stroke-linecap="round"
          />
          <circle
            id="warn-excl-dot"
            cx="24"
            cy="35"
            r="2.5"
            fill="#FF6A1A"
            style="transform-origin: 24px 35px;"
          />
        </svg>
      </div>
    </section>

    <!-- Overlay 3: Punch Phrase ("CỐ Ý GÂY THƯƠNG TÍCH") -->
    <!-- atMs: 265300 (7.16s), holdMs: 2200 (until scene end 8.48s) -->
    <section id="clip-punch" class="clip" data-start="7.16" data-duration="1.32" data-track-index="3">
      <div id="punch-card" class="hf-plate-ink">
        <div class="punch-text hf-text-light">CỐ Ý GÂY THƯƠNG TÍCH</div>
      </div>
    </section>

    <!-- Persistent Bottom Orange Bar -->
    <div id="bottom-orange-bar"></div>
  </div>

  <script>
    // Create single paused master timeline keyed to root data-composition-id
    const tl = gsap.timeline({ paused: true });

    // 1. Camera Motion: Steady subtle zoom-in 1.0x -> 1.08x into torn evidence
    tl.fromTo(
      "#bg-photo-wrapper",
      { scale: 1.0 },
      { scale: 1.08, duration: 8.48, ease: "none" },
      0
    );

    // 2. Shatter Entrance: Tear reveal of the dossier file (0.15s - 0.70s)
    tl.fromTo(
      "#shatter-seam",
      { opacity: 0 },
      { opacity: 1, duration: 0.1, ease: "power1.in" },
      0.15
    );
    tl.to(
      "#shatter-seam",
      { opacity: 0, duration: 0.25, ease: "power2.out" },
      0.28
    );

    tl.to(
      "#shatter-flap-a",
      { x: -90, y: -110, rotation: -4, opacity: 0, duration: 0.5, ease: "power3.in" },
      0.2
    );
    tl.to(
      "#shatter-flap-b",
      { x: 90, y: 110, rotation: 4, opacity: 0, duration: 0.5, ease: "power3.in" },
      0.2
    );

    // 3. Diagram Entrance & Exit ("LỊCH SỬ VI PHẠM")
    // Active within clip window [1.84s, 6.84s)
    tl.fromTo(
      "#diagram-card",
      { y: -30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      1.84
    );
    tl.to(
      "#diagram-card",
      { y: -20, opacity: 0, duration: 0.3, ease: "power2.in" },
      6.50
    );

    // 4. Label Entrance & Exit ("GÂY RỐI • LỪA ĐẢO")
    // Active within clip window [2.47s, 4.87s)
    tl.fromTo(
      "#label-card",
      { scale: 0.90, y: 20, opacity: 0 },
      { scale: 1, y: 0, opacity: 1, duration: 0.42, ease: "power3.out" },
      2.47
    );
    tl.to(
      "#label-card",
      { scale: 0.94, opacity: 0, duration: 0.22, ease: "power2.in" },
      4.62
    );

    // 5. Punch Phrase Entrance ("CỐ Ý GÂY THƯƠNG TÍCH")
    // Active within clip window [7.16s, 8.48s)
    tl.fromTo(
      "#punch-card",
      { scale: 0.90, y: 24, opacity: 0 },
      { scale: 1, y: 0, opacity: 1, duration: 0.42, ease: "power3.out" },
      7.16
    );

    // 6. Warning Icon Draw (SVG progressive stroke tracing, seek-safe with fromTo)
    const trianglePath = document.getElementById("warn-triangle");
    const exclLine = document.getElementById("warn-excl-line");
    const triLen = trianglePath.getTotalLength();
    const lineLen = exclLine.getTotalLength();

    trianglePath.style.strokeDasharray = triLen.toString();
    trianglePath.style.strokeDashoffset = triLen.toString();
    exclLine.style.strokeDasharray = lineLen.toString();
    exclLine.style.strokeDashoffset = lineLen.toString();

    // Badge entrance
    tl.fromTo(
      "#warning-badge",
      { opacity: 0, x: -24 },
      { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" },
      7.42
    );

    // Stroke draw
    tl.fromTo(
      trianglePath,
      { strokeDashoffset: triLen },
      { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
      7.48
    );
    tl.fromTo(
      exclLine,
      { strokeDashoffset: lineLen },
      { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" },
      7.65
    );
    tl.fromTo(
      "#warn-excl-dot",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.15, ease: "power3.out" },
      7.75
    );

    // Register paused timeline on global HyperFrames registry
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s33"] = tl;
  </script>

    </template>
  </body>
