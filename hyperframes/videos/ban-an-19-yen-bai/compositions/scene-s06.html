<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }

      /* Base clip contract layout */
      .clip {
        position: absolute;
        inset: 0;
      }

      /* 3D Perspective Viewport & Rig for Flip entrance */
      .scene-viewport {
        position: absolute;
        inset: 0;
        perspective: 1200px;
        overflow: hidden;
      }

      .camera-rig {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transform-origin: center center;
        will-change: transform, opacity;
      }

      /* Background Photo: Full 1080x1920 bleed coverage, giữ nguyên màu gốc không phủ filter/gradient */
      .bg-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        will-change: transform;
      }

      /* Overlay Layer Containers (within safe zone: top 160, bottom 530, left 40, right 40) */
      .overlay-clip {
        z-index: 10;
        pointer-events: none;
      }

      .overlay-container {
        position: absolute;
        top: 240px;
        left: 40px;
        right: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
      }

      /* Punch Phrase Card (Overlay 1): Solid ink plate with orange accent */
      .punch-card {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 22px 42px;
        background-color: #141414;
        border-radius: 12px;
        border-left: 8px solid #FF6A1A;
        box-shadow: 0 14px 38px rgba(0, 0, 0, 0.58);
        will-change: transform, opacity;
      }

      .punch-title {
        margin: 0;
        font-family: "Be Vietnam Pro", sans-serif;
        font-size: 52px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: 0.04em;
        color: #F7F4EC;
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* Warning Icon Badge (Overlay 2): Solid ink plate with orange stroke */
      .icon-badge {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 190px;
        height: 190px;
        background-color: #141414;
        border-radius: 24px;
        border: 4px solid #FF6A1A;
        box-shadow: 0 16px 42px rgba(0, 0, 0, 0.62);
        will-change: transform, opacity;
      }

      .warning-svg {
        display: block;
      }

      .warn-stroke {
        fill: none;
        stroke: #FF6A1A;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .warn-fill {
        fill: #FF6A1A;
      }

      /* Bottom Orange Signature Bar (Vox visual signature) */
      .bottom-orange-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 8px;
        background-color: #FF6A1A;
        z-index: 100;
        pointer-events: none;
      }

      /* Mandatory Safe Color Utility Classes */
      .hf-text-ink { color: #141414 !important; }
      .hf-text-light { color: #F7F4EC !important; }
      .hf-hl-orange { background-color: #FF6A1A !important; color: #141414 !important; }
      .hf-plate-ink { background-color: #141414 !important; color: #F7F4EC !important; }
      .hf-plate-ink-orange { background-color: #141414 !important; color: #FF6A1A !important; }
      .hf-plate-paper { background-color: #E7E3D9 !important; color: #141414 !important; }
    </style>

    <div
      id="root"
      data-composition-id="scene-s06"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.96"
    >
      <!-- Shot S06-1: Background Photo & Camera Rig -->
      <section id="shot-main" class="clip" data-start="0" data-duration="7.96" data-track-index="0">
        <div class="scene-viewport">
          <div id="camera-rig" class="camera-rig" data-layout-allow-overflow="true">
            <img
              id="bg-img"
              class="bg-photo"
              src="assets/img-14-rural-dispute-slap-conflict.jpg"
              alt="Hiện trường mâu thuẫn gia đình"
              data-layout-allow-overflow="true"
            />
          </div>
        </div>
      </section>

      <!-- Overlay 1: Label Punch-Phrase (1.65s -> 4.05s) -->
      <div id="clip-overlay-1" class="clip overlay-clip" data-start="1.65" data-duration="2.4" data-track-index="1">
        <div class="overlay-container">
          <div id="punch-plate" class="hf-plate-ink punch-card">
            <h2 id="punch-text" class="hf-text-light punch-title">XUNG ĐỘT GIA ĐÌNH</h2>
          </div>
        </div>
      </div>

      <!-- Overlay 2: Self-drawing Warning Icon (4.18s -> 6.18s) -->
      <div id="clip-overlay-2" class="clip overlay-clip" data-start="4.18" data-duration="2.0" data-track-index="2">
        <div class="overlay-container">
          <div id="icon-badge" class="hf-plate-ink icon-badge">
            <svg
              class="warning-svg"
              viewBox="0 0 160 160"
              width="160"
              height="160"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path id="warn-triangle" class="warn-stroke" d="M 80 24 L 142 134 L 18 134 Z" />
              <path id="warn-line" class="warn-stroke" d="M 80 62 L 80 98" />
              <circle id="warn-dot" cx="80" cy="116" r="6" class="warn-fill" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Persistent Brand Signature Bar -->
      <div class="bottom-orange-bar" data-layout-ignore="true"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });

      // Setup SVG progressive self-drawing paths
      const warnTriangle = document.getElementById("warn-triangle");
      const warnLine = document.getElementById("warn-line");

      if (warnTriangle && warnLine) {
        const lenTriangle = warnTriangle.getTotalLength ? warnTriangle.getTotalLength() : 380;
        const lenLine = warnLine.getTotalLength ? warnLine.getTotalLength() : 40;

        warnTriangle.style.strokeDasharray = lenTriangle;
        warnTriangle.style.strokeDashoffset = lenTriangle;
        warnLine.style.strokeDasharray = lenLine;
        warnLine.style.strokeDashoffset = lenLine;

        // Progressive path draw for triangle
        tl.to(
          warnTriangle,
          {
            strokeDashoffset: 0,
            duration: 0.55,
            ease: "power2.out"
          },
          4.30
        );

        // Progressive path draw for exclamation line
        tl.to(
          warnLine,
          {
            strokeDashoffset: 0,
            duration: 0.30,
            ease: "power2.out"
          },
          4.65
        );
      }

      // 1. Flip entrance transition (0.0s -> 0.8s)
      tl.fromTo(
        "#camera-rig",
        {
          rotationY: -28,
          opacity: 0,
          transformPerspective: 1200
        },
        {
          rotationY: 0,
          opacity: 1,
          duration: 0.8,
          ease: "power3.out"
        },
        0
      );

      // 2. Ken Burns zoom-out from 1.08x to 1.0x over the full 7.96s duration
      tl.fromTo(
        "#bg-img",
        {
          scale: 1.08,
          transformOrigin: "center 45%"
        },
        {
          scale: 1.0,
          duration: 7.96,
          ease: "none"
        },
        0
      );

      // 3. Overlay 1: "XUNG ĐỘT GIA ĐÌNH" arrival and exit
      tl.fromTo(
        "#punch-plate",
        {
          y: 28,
          opacity: 0
        },
        {
          y: 0,
          opacity: 1,
          duration: 0.42,
          ease: "power3.out"
        },
        1.65
      );

      tl.to(
        "#punch-plate",
        {
          y: -18,
          opacity: 0,
          duration: 0.28,
          ease: "power2.in"
        },
        3.75
      );

      // 4. Overlay 2: Warning icon badge arrival, dot reveal, and exit
      tl.fromTo(
        "#icon-badge",
        {
          scale: 0.85,
          opacity: 0
        },
        {
          scale: 1,
          opacity: 1,
          duration: 0.35,
          ease: "power3.out"
        },
        4.18
      );

      tl.fromTo(
        "#warn-dot",
        {
          scale: 0,
          opacity: 0,
          transformOrigin: "80px 116px"
        },
        {
          scale: 1,
          opacity: 1,
          duration: 0.20,
          ease: "power3.out"
        },
        4.85
      );

      tl.to(
        "#icon-badge",
        {
          scale: 0.9,
          opacity: 0,
          duration: 0.26,
          ease: "power2.in"
        },
        5.85
      );

      // Register the master timeline
      window.__timelines["scene-s06"] = tl;
    </script>
  
    </template>
  </body>
</html>
