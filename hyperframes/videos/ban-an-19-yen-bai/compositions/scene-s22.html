<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Built-in safe color classes */
      .hf-text-ink { color: #141414 !important; }
      .hf-text-light { color: #F7F4EC !important; }
      .hf-hl-orange { background-color: #FF6A1A !important; color: #141414 !important; }
      .hf-plate-ink { background-color: #141414 !important; color: #F7F4EC !important; }
      .hf-plate-ink-orange { background-color: #141414 !important; color: #FF6A1A !important; }
      .hf-plate-paper { background-color: #E7E3D9 !important; color: #141414 !important; }

      /* Camera & Hero Background Image */
      #camera-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        transform-origin: 50% 55%;
      }
      #hero-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
      }

      /* Overlay Containers */
      .overlay-container {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 220px;
        pointer-events: none;
        z-index: 20;
      }
      .overlay-outcome {
        align-items: flex-end;
        padding-top: 0;
        padding-bottom: 600px;
      }

      /* Cards & Labels */
      .overlay-card {
        display: inline-flex;
        align-items: center;
        gap: 18px;
        padding: 20px 38px;
        border-radius: 6px;
        border-left: 8px solid #FF6A1A;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      }
      .card-indicator {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background-color: #FF6A1A;
        flex-shrink: 0;
      }
      .card-label {
        font-family: "Be Vietnam Pro", sans-serif;
        font-size: 40px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        line-height: 1.2;
      }

      /* Signature bottom orange bar */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 100;
        pointer-events: none;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s22"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.14"
    >
      <!-- Background Photo Clip with Ken Burns & Zoom-Through Camera -->
      <section id="scene-bg" class="clip" data-start="0" data-duration="7.14">
        <div id="camera-frame">
          <img
            id="hero-photo"
            src="assets/img-01-car-crash-intent-outcome.jpg"
            alt="Ẩn dụ ô tô lao vào người đi bộ"
          />
        </div>
      </section>

      <!-- Overlay 1: VÍ DỤ SO SÁNH (Start: 0.3s, Duration: 2.2s) -->
      <section id="clip-compare" class="clip overlay-container" data-start="0.3" data-duration="2.2">
        <div id="card-compare" class="overlay-card hf-plate-ink">
          <div class="card-indicator"></div>
          <div class="card-label hf-text-light">VÍ DỤ SO SÁNH</div>
        </div>
      </section>

      <!-- Overlay 2: HẬU QUẢ XÂY XÁT (Start: 6.22s, Duration: 0.92s) -->
      <section id="clip-outcome" class="clip overlay-container overlay-outcome" data-start="6.22" data-duration="0.92">
        <div id="card-outcome" class="overlay-card hf-plate-ink">
          <div class="card-indicator"></div>
          <div class="card-label hf-text-light">HẬU QUẢ XÂY XÁT</div>
        </div>
      </section>

      <!-- Persistent Brand Bottom Bar -->
      <div id="brand-bottom-bar"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Camera motion: continuous Ken Burns zoom-in (1.0x -> 1.08x) along vehicle trajectory
      tl.fromTo(
        "#camera-frame",
        { scale: 1.0, x: 0, y: 0 },
        { scale: 1.08, x: -16, y: -24, duration: 7.14, ease: "sine.out" },
        0
      );

      // Entrance fade-in for camera frame
      tl.fromTo(
        "#camera-frame",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        0
      );

      // Overlay 1: "VÍ DỤ SO SÁNH" entrance at 0.3s
      tl.fromTo(
        "#card-compare",
        { y: 28, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.3
      );

      // Overlay 1: Exit fade-out before clip window ends at 2.5s
      tl.to(
        "#card-compare",
        { y: -16, opacity: 0, duration: 0.3, ease: "power2.in" },
        2.15
      );

      // Overlay 2: "HẬU QUẢ XÂY XÁT" entrance at 6.22s
      tl.fromTo(
        "#card-outcome",
        { y: 28, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        6.22
      );

      window.__timelines["scene-s22"] = tl;
    </script>
  
    </template>
  </body>
</html>
