<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (chuẩn WCAG từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background: #141414;
        color: #F7F4EC;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Quy ước clip chuẩn HyperFrames: inset 0, layout theo tầng viewport */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Tầng ảnh nền chính phủ toàn bộ khung 1080x1920 */
      .bg-layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      #img-07, .bg-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 50% 40%;
        will-change: transform;
      }

      /* Biến thể nền spotlight: radial vignette tối ở viền */
      #spotlight-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 42%,
          rgba(20, 20, 20, 0.05) 28%,
          rgba(20, 20, 20, 0.45) 70%,
          rgba(20, 20, 20, 0.88) 100%
        );
        pointer-events: none;
      }

      /* Thanh cam nhận diện thương hiệu đáy khung hình */
      #brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background: #FF6A1A;
        z-index: 95;
      }

      /* ==================== CLIP 1: DIAGRAM ==================== */
      #diagram-inner {
        position: absolute;
        top: 240px;
        left: 0;
        right: 0;
        margin-left: auto;
        margin-right: auto;
        width: 860px;
        will-change: transform, opacity;
      }

      .diagram-card {
        background-color: #141414;
        opacity: 1;
        border: 2px solid #FF6A1A;
        border-radius: 18px;
        overflow: hidden;
      }

      .diagram-header {
        background-color: #141414;
        border-bottom: 2px solid #FF6A1A;
        padding: 16px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .diagram-title {
        font-size: 38px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 1px;
        line-height: 1.2;
        margin: 0;
      }

      .diagram-badge {
        background-color: #FF6A1A;
        color: #141414;
        font-size: 20px;
        font-weight: 900;
        padding: 6px 14px;
        border-radius: 6px;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

      .diagram-body {
        background-color: #141414;
        padding: 16px 20px 24px 20px;
      }

      .diagram-svg {
        display: block;
        width: 100%;
        height: auto;
        background-color: #141414;
      }

      /* ==================== CLIP 2: LABEL MỤC TIÊU VÔ CAN ==================== */
      #label-inner {
        position: absolute;
        top: 380px;
        left: 0;
        right: 0;
        margin-left: auto;
        margin-right: auto;
        width: 820px;
        will-change: transform, opacity;
      }

      .label-plate {
        background-color: #141414;
        opacity: 1;
        border-left: 10px solid #FF6A1A;
        border-radius: 16px;
        padding: 26px 36px;
      }

      .label-sub {
        display: inline-block;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1.5px;
        padding: 6px 14px;
        border-radius: 6px;
        margin-bottom: 12px;
        text-transform: uppercase;
        color: #141414;
        background-color: #FF6A1A;
        opacity: 1;
      }

      .label-main {
        font-size: 58px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 1px;
        line-height: 1.2;
        margin-bottom: 16px;
      }

      .label-tag {
        display: inline-block;
        background-color: #F5F0E4;
        color: #141414;
        font-size: 22px;
        font-weight: 700;
        padding: 8px 20px;
        border-radius: 6px;
        letter-spacing: 0.5px;
      }

      /* ==================== CLIP 3: WARNING ICON ==================== */
      #warning-inner {
        position: absolute;
        top: 640px;
        left: 0;
        right: 0;
        margin-left: auto;
        margin-right: auto;
        width: 620px;
        will-change: transform, opacity;
      }

      .warning-plate {
        background-color: #141414;
        opacity: 1;
        border: 2px solid #FF6A1A;
        border-radius: 16px;
        padding: 20px 28px;
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .warning-icon-wrap {
        flex-shrink: 0;
        width: 72px;
        height: 72px;
      }

      .warning-svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .warning-text-wrap {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .warning-title {
        display: inline-block;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 1px;
        padding: 4px 10px;
        border-radius: 4px;
        color: #141414;
        background-color: #FF6A1A;
        opacity: 1;
        width: fit-content;
      }

      .warning-desc {
        font-size: 32px;
        font-weight: 900;
        color: #F7F4EC;
        margin: 0;
        line-height: 1.25;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s01"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="10.27"
    >
      <!-- Shot S01-1: Asset img-07 (img-07-family-conflict-rage-motive.jpg từ Media Manifest) -->
      <section id="shot-bg-clip" class="clip" data-start="0" data-duration="10.27">
        <div class="bg-layer">
          <img
            id="img-07"
            data-asset-id="img-07"
            data-shot-id="S01-1"
            class="bg-photo"
            src="assets/img-07-family-conflict-rage-motive.jpg"
            alt="Asset img-07: Cơn thịnh nộ gia đình bộc phát"
            data-layout-allow-overflow="true"
          />
          <div id="spotlight-overlay"></div>
        </div>
      </section>

      <!-- Dải cam nhận diện thương hiệu cố định mép đáy -->
      <div id="brand-bar-clip" class="clip" data-start="0" data-duration="10.27">
        <div id="brand-bar"></div>
      </div>

      <!-- Overlay 1: Diagram nét đứt chuyển hướng xung đột bạo lực sang nạn nhân (t = 2.18s -> 4.58s) -->
      <section id="diagram-clip" class="clip" data-start="2.18" data-duration="2.40">
        <div id="diagram-inner">
          <div class="diagram-card">
            <div class="diagram-header">
              <h2 class="diagram-title">MŨI TÊN CHUYỂN HƯỚNG</h2>
              <span class="diagram-badge">BẺ HƯỚNG BẤT NGỜ</span>
            </div>
            <div class="diagram-body">
              <svg class="diagram-svg" viewBox="0 0 820 280" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Nền đen đặc cho SVG để chống thấu quang ảnh phía sau -->
                <rect width="820" height="280" rx="12" fill="#141414" />

                <!-- Nút 1: Xung đột gia đình (Bị bố đánh) -->
                <g id="diag-node-1">
                  <rect x="25" y="20" width="220" height="50" rx="8" fill="#141414" stroke="#FF6A1A" stroke-width="2" />
                  <text x="135" y="52" fill="#F7F4EC" font-size="16" font-weight="900" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">XUNG ĐỘT GIA ĐÌNH</text>
                </g>

                <!-- Nét đứt đi xuống từ Nút 1 đến Nút 2 -->
                <path
                  id="diag-path-conflict"
                  d="M 135 70 L 135 130"
                  stroke="#FF6A1A"
                  stroke-width="3"
                  stroke-dasharray="6 4"
                  stroke-linecap="round"
                />

                <!-- Nút 2: Cơn thịnh nộ hung thủ (Khối nền cam đặc #FF6A1A, chữ mực #141414 chuẩn WCAG) -->
                <g id="diag-node-2">
                  <rect x="25" y="130" width="220" height="50" rx="8" fill="#FF6A1A" stroke="#FF6A1A" stroke-width="2" />
                  <text x="135" y="162" fill="#141414" font-size="16" font-weight="900" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">CƠN THỊNH NỘ</text>
                </g>

                <!-- Đường bẻ hướng sang nạn nhân vô can -->
                <path
                  id="diag-path-redirect"
                  d="M 135 180 C 135 248, 275 252, 360 205 C 435 162, 490 155, 565 155"
                  stroke="#FF6A1A"
                  stroke-width="5"
                  fill="none"
                  stroke-linecap="round"
                />

                <!-- Mũi tên chỉ mục tiêu -->
                <polygon
                  id="diag-arrowhead"
                  points="560,146 576,155 560,164"
                  fill="#FF6A1A"
                />

                <!-- Huy hiệu điểm bẻ hướng trút giận (Nền cam đặc #FF6A1A, chữ mực #141414) -->
                <g id="diag-badge">
                  <rect x="235" y="222" width="165" height="34" rx="6" fill="#FF6A1A" />
                  <text x="317" y="244" fill="#141414" font-size="13" font-weight="900" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">TRÚT SAI ĐỐI TƯỢNG</text>
                </g>

                <!-- Nút 3: Nạn nhân vô can -->
                <g id="diag-node-3">
                  <rect x="575" y="130" width="220" height="50" rx="8" fill="#141414" stroke="#FF6A1A" stroke-width="2" />
                  <text x="685" y="162" fill="#F7F4EC" font-size="16" font-weight="900" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">MỤC TIÊU VÔ CAN</text>
                </g>
              </svg>
            </div>
          </div>
        </div>
      </section>

      <!-- Overlay 2: Label mục tiêu vô can (t = 6.71s -> 8.91s) -->
      <section id="label-clip" class="clip" data-start="6.71" data-duration="2.20">
        <div id="label-inner">
          <div class="label-plate">
            <div class="label-sub hf-hl-orange">NGHỊCH LÝ ĐỘNG CƠ</div>
            <div class="label-main hf-text-light">MỤC TIÊU VÔ CAN</div>
            <div class="label-tag hf-plate-paper">TRƯỚC ĐÓ CHẲNG HỀ CÓ MÂU THUẪN</div>
          </div>
        </div>
      </section>

      <!-- Overlay 3: Icon cảnh báo nghịch lý (t = 8.32s -> 10.12s, vị trí Y: 640px không đè Label) -->
      <section id="warning-clip" class="clip" data-start="8.32" data-duration="1.80">
        <div id="warning-inner">
          <div class="warning-plate">
            <div class="warning-icon-wrap">
              <svg class="warning-svg" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Tam giác cảnh báo vẽ nét tự thân -->
                <path
                  id="warn-triangle"
                  d="M 36 9 L 65 59 L 7 59 Z"
                  stroke="#FF6A1A"
                  stroke-width="5"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                />
                <!-- Dấu chấm than cảnh báo -->
                <path
                  id="warn-line"
                  d="M 36 25 L 36 42"
                  stroke="#F7F4EC"
                  stroke-width="5"
                  stroke-linecap="round"
                />
                <circle
                  id="warn-dot"
                  cx="36"
                  cy="50"
                  r="2.5"
                  fill="#F7F4EC"
                />
              </svg>
            </div>
            <div class="warning-text-wrap">
              <span class="warning-title hf-hl-orange">CẢNH BÁO NGHỊCH LÝ</span>
              <span class="warning-desc hf-text-light">ĐỘNG CƠ BẤT THƯỜNG</span>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      // Đăng ký đúng 1 paused timeline trên window.__timelines["scene-s01"]
      const tl = gsap.timeline({ paused: true });

      // ==================== 1. TẦNG NỀN & CAMERA MOTION (ASSET S01-1 / img-07) ====================
      // Mở đầu bằng cú punch dứt khoát (0 -> 0.45s) trên ảnh nền img-07, giữ opacity 1 tuyệt đối
      tl.fromTo(
        "#img-07",
        { scale: 1.14 },
        { scale: 1.0, duration: 0.45, ease: "power4.out" },
        0
      );

      // Ken Burns zoom-in chậm từ 1.0x lên 1.06x tập trung vào biểu cảm giận dữ (0.45s -> 10.27s)
      tl.to(
        "#img-07",
        { scale: 1.06, y: -28, duration: 9.82, ease: "none" },
        0.45
      );

      // ==================== 2. OVERLAY 1: DIAGRAM MŨI TÊN (t = 2.18s -> 4.58s) ====================
      const pConflict = document.getElementById("diag-path-conflict");
      const pRedirect = document.getElementById("diag-path-redirect");
      const lenConflict = pConflict ? pConflict.getTotalLength() : 60;
      const lenRedirect = pRedirect ? pRedirect.getTotalLength() : 480;

      if (pConflict) {
        pConflict.style.strokeDasharray = lenConflict;
        pConflict.style.strokeDashoffset = lenConflict;
      }
      if (pRedirect) {
        pRedirect.style.strokeDasharray = lenRedirect;
        pRedirect.style.strokeDashoffset = lenRedirect;
      }

      // Khối diagram xuất hiện bằng spring-pop (scale 0 -> 1, opacity luôn là 1 để giữ nền đặc)
      tl.fromTo(
        "#diagram-inner",
        { scale: 0, opacity: 1, y: 16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        2.18
      );

      // Đường nét đứt từ xung đột gia đình đi xuống
      tl.fromTo(
        "#diag-path-conflict",
        { strokeDashoffset: lenConflict },
        { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
        2.38
      );

      // Đường bẻ hướng vẽ dần sang nạn nhân
      tl.fromTo(
        "#diag-path-redirect",
        { strokeDashoffset: lenRedirect },
        { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
        2.62
      );

      // Huy hiệu "TRÚT SAI ĐỐI TƯỢNG" xuất hiện trên khúc ngoặt
      tl.fromTo(
        "#diag-badge",
        { scale: 0, opacity: 1 },
        { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" },
        3.0
      );

      // Mũi tên chạm tới mục tiêu vô can
      tl.fromTo(
        "#diag-arrowhead",
        { scale: 0, opacity: 1 },
        { scale: 1, opacity: 1, duration: 0.2, ease: "power2.out" },
        3.2
      );

      tl.fromTo(
        "#diag-node-3",
        { scale: 0, opacity: 1 },
        { scale: 1, opacity: 1, duration: 0.26, ease: "power3.out" },
        3.24
      );

      // Thu gọn biến mất nhẹ nhàng trước khi hết cửa sổ clip
      tl.to(
        "#diagram-inner",
        { opacity: 0, y: -16, duration: 0.24, ease: "power2.in" },
        4.32
      );

      // ==================== 3. OVERLAY 2: LABEL MỤC TIÊU VÔ CAN (t = 6.71s -> 8.91s) ====================
      tl.fromTo(
        "#label-inner",
        { scale: 0, opacity: 1, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        6.71
      );

      tl.to(
        "#label-inner",
        { opacity: 0, y: -14, duration: 0.24, ease: "power2.in" },
        8.66
      );

      // ==================== 4. OVERLAY 3: WARNING ICON (t = 8.32s -> 10.12s) ====================
      const warnTri = document.getElementById("warn-triangle");
      const warnL = document.getElementById("warn-line");
      const lenTri = warnTri ? warnTri.getTotalLength() : 170;
      const lenL = warnL ? warnL.getTotalLength() : 17;

      if (warnTri) {
        warnTri.style.strokeDasharray = lenTri;
        warnTri.style.strokeDashoffset = lenTri;
      }
      if (warnL) {
        warnL.style.strokeDasharray = lenL;
        warnL.style.strokeDashoffset = lenL;
      }

      // Khối cảnh báo pop-in tại mốc 8.32s (vị trí y=640px không va chạm với label y=380px)
      tl.fromTo(
        "#warning-inner",
        { scale: 0, opacity: 1, y: 16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        8.32
      );

      // Vẽ nét tam giác và dấu chấm than
      tl.fromTo(
        "#warn-triangle",
        { strokeDashoffset: lenTri },
        { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
        8.4
      );

      tl.fromTo(
        "#warn-line",
        { strokeDashoffset: lenL },
        { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" },
        8.65
      );

      tl.fromTo(
        "#warn-dot",
        { scale: 0, opacity: 1 },
        { scale: 1, opacity: 1, duration: 0.18, ease: "power2.out" },
        8.75
      );

      // Mờ dần khi kết thúc phân đoạn
      tl.to(
        "#warning-inner",
        { opacity: 0, y: -10, duration: 0.22, ease: "power2.in" },
        9.88
      );

      // Đăng ký timeline cho HyperFrames seek
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s01"] = tl;
    </script>
  
    </template>
  </body>
</html>
