<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #141414;
        color: #f7f4ec;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #e7e3d9;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Background Photo: Phủ toàn bộ khung hình, giữ nguyên màu gốc của asset */
      #bg-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: center center;
      }

      /* Signature bottom orange bar */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 10px;
        background: #ff6a1a;
        z-index: 100;
      }

      /* Beat 1: Question Card Container trong vùng an toàn (safeZone top:160px - bottom:1390px) */
      #question-card-container {
        position: absolute;
        top: 480px;
        left: 60px;
        right: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .question-card {
        width: 100%;
        background: #141414;
        border: 4px solid rgba(247, 244, 236, 0.2);
        border-radius: 20px;
        padding: 44px 36px 40px 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
        position: relative;
      }

      .question-badge {
        display: inline-block;
        background: #ff6a1a;
        color: #141414;
        font-size: 26px;
        font-weight: 900;
        padding: 8px 24px;
        border-radius: 8px;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 24px;
      }

      .question-title {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        font-size: 64px;
        font-weight: 900;
        line-height: 1.25;
        color: #f7f4ec;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: -0.5px;
      }

      .title-line {
        display: block;
      }

      /* SVG Ban Icon Container trên thẻ chất vấn */
      .ban-icon-wrap {
        position: absolute;
        top: -40px;
        right: 20px;
        width: 160px;
        height: 160px;
        filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.7));
      }

      .ban-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      /* Beat 2: Punch Phrase Box ("TẤT NHIÊN LÀ KHÔNG") */
      #punch-card-container {
        position: absolute;
        top: 600px;
        left: 60px;
        right: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .punch-card {
        width: 100%;
        background: #141414;
        border: 6px solid #ff6a1a;
        border-radius: 24px;
        padding: 52px 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.85);
        transform-origin: center center;
      }

      .punch-phrase {
        font-size: 70px;
        font-weight: 900;
        line-height: 1.25;
        color: #ff6a1a;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin: 0;
        white-space: nowrap;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s23"
      data-width="1080"
      data-height="1920"
      data-duration="6.41"
    >
      <!-- Shot 1: Background image toàn khung giữ nguyên màu ảnh gốc -->
      <section
        id="shot-1"
        class="clip"
        data-start="0"
        data-duration="6.41"
        data-track-index="0"
      >
        <img
          id="bg-img"
          src="assets/img-01-car-crash-intent-outcome.jpg"
          alt="Car crash intent vs outcome"
        />
      </section>

      <!-- Overlay Beat 1: Question badge + statement + SVG Ban Icon -->
      <div
        id="overlay-question"
        class="clip"
        data-start="0.77"
        data-duration="3.8"
        data-track-index="1"
      >
        <div id="question-card-container">
          <div class="question-card" id="question-inner">
            <div class="ban-icon-wrap" id="ban-icon-node">
              <svg class="ban-svg" viewBox="0 0 100 100">
                <circle
                  id="ban-circle"
                  cx="50"
                  cy="50"
                  r="42"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="10"
                />
                <line
                  id="ban-slash"
                  x1="20"
                  y1="20"
                  x2="80"
                  y2="80"
                  stroke="#FF6A1A"
                  stroke-width="10"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <div class="question-badge">LẬP LUẬN BIỆN HỘ</div>
            <h1 class="question-title">
              <span class="title-line">CHỈ NHẰM GÂY</span>
              <span class="title-line">TRẦY XƯỚC?</span>
            </h1>
          </div>
        </div>
      </div>

      <!-- Overlay Beat 2: Punch Phrase ("TẤT NHIÊN LÀ KHÔNG") -->
      <div
        id="overlay-punch"
        class="clip"
        data-start="5.2"
        data-duration="1.21"
        data-track-index="2"
      >
        <div id="punch-card-container">
          <div class="punch-card hf-plate-ink-orange" id="punch-inner">
            <h1 class="punch-phrase" id="punch-phrase" data-type="punch-phrase">
              TẤT NHIÊN LÀ KHÔNG
            </h1>
          </div>
        </div>
      </div>

      <!-- Thanh cam đáy khung hình nhận diện thương hiệu -->
      <div id="brand-bottom-bar"></div>
    </div>

    <script>
      // Single paused master timeline cho seeking tất định của HyperFrames
      const tl = gsap.timeline({ paused: true });

      // Khởi tạo đo đạc đường nét SVG ban icon
      const banCircle = document.getElementById("ban-circle");
      const banSlash = document.getElementById("ban-slash");
      let circleLength = 264;
      let slashLength = 85;

      if (banCircle && banCircle.getTotalLength) {
        circleLength = banCircle.getTotalLength();
      }
      if (banSlash && banSlash.getTotalLength) {
        slashLength = banSlash.getTotalLength();
      }

      banCircle.style.strokeDasharray = `${circleLength}`;
      banCircle.style.strokeDashoffset = `${circleLength}`;
      banSlash.style.strokeDasharray = `${slashLength}`;
      banSlash.style.strokeDashoffset = `${slashLength}`;

      // 1. Scene Entrance: Punch camera zoom-settle về 1.08x và giữ tĩnh
      tl.fromTo(
        "#bg-img",
        { scale: 1.15 },
        { scale: 1.08, duration: 0.5, ease: "power4.out" },
        0,
      );

      // 2. Beat 1: Question Card xuất hiện (t = 0.77s)
      tl.fromTo(
        "#question-inner",
        { scale: 0.85, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.77,
      );

      // Tự vẽ icon Ban nét vẽ tay
      tl.fromTo(
        "#ban-icon-node",
        { scale: 0, opacity: 0, rotation: -20 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.35, ease: "power3.out" },
        1.1,
      );
      tl.fromTo(
        banCircle,
        { strokeDashoffset: circleLength },
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        1.15,
      );
      tl.fromTo(
        banSlash,
        { strokeDashoffset: slashLength },
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        1.45,
      );

      // Beat 1 Exit trước khi Beat 2 xuất hiện
      tl.to(
        "#question-inner",
        { scale: 0.94, opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
        3.8,
      );

      // 3. Beat 2: Punch Phrase ("TẤT NHIÊN LÀ KHÔNG") (t = 5.2s)
      tl.fromTo(
        "#punch-inner",
        { scale: 0.8, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power4.out" },
        5.2,
      );

      // Đăng ký timeline vào window.__timelines["scene-s23"]
      window.__timelines["scene-s23"] = tl;
    </script>
  
    </template>
  </body>
</html>
