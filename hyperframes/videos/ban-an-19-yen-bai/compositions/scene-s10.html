<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #F5F0E4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Vox signature persistent bottom bar */
      .bottom-accent-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }

      /* Court Document Dossier Card */
      .dossier-wrapper {
        position: absolute;
        top: 180px;
        left: 65px;
        width: 950px;
        height: 1190px;
        background-color: #E7E3D9;
        border: 3px solid rgba(20, 20, 20, 0.4);
        box-shadow: 14px 14px 0px rgba(20, 20, 20, 0.18);
        padding: 44px 46px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }

      /* Document Header */
      .doc-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid rgba(20, 20, 20, 0.25);
        padding-bottom: 18px;
        margin-bottom: 24px;
      }
      .doc-badge {
        font-size: 21px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #141414;
        text-transform: uppercase;
      }
      .doc-meta {
        font-size: 19px;
        font-weight: 700;
        color: #141414;
        letter-spacing: 1.5px;
      }

      .doc-title {
        font-size: 32px;
        font-weight: 900;
        color: #141414;
        line-height: 1.3;
        margin: 0 0 24px 0;
        text-transform: uppercase;
      }

      /* Allegation Claim Panel */
      .claim-panel {
        background-color: #F5F0E4;
        border: 2px dashed rgba(20, 20, 20, 0.35);
        padding: 24px 30px;
        position: relative;
        margin-bottom: 28px;
      }
      .claim-tag {
        display: inline-block;
        background-color: #FF6A1A;
        color: #141414;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 1.5px;
        padding: 5px 12px;
        margin-bottom: 14px;
        text-transform: uppercase;
      }
      .claim-quote {
        font-size: 34px;
        font-weight: 900;
        color: #141414;
        line-height: 1.35;
        margin: 0 0 16px 0;
      }

      /* Simulated dossier transcript lines (neutral document language) */
      .doc-skeleton-lines {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .skel-line {
        height: 10px;
        background-color: rgba(20, 20, 20, 0.16);
        border-radius: 3px;
        display: block;
      }

      /* Dedicated Stamp Container */
      .stamp-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 12px 0 28px 0;
      }
      .stamp-mark {
        background-color: #FF6A1A;
        color: #141414;
        border: 8px solid #141414;
        outline: 3px dashed #141414;
        outline-offset: -14px;
        padding: 20px 42px;
        box-shadow: 10px 10px 0px rgba(20, 20, 20, 0.25);
        transform-origin: center center;
      }
      .stamp-text {
        font-size: 54px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin: 0;
        line-height: 1.1;
        white-space: nowrap;
      }

      /* Clarification Lower Third Panel */
      .clarification-plate {
        margin-top: auto;
        background-color: #141414;
        border-left: 10px solid #FF6A1A;
        padding: 26px 32px;
        display: flex;
        align-items: center;
        gap: 26px;
        box-shadow: 8px 8px 0px rgba(20, 20, 20, 0.25);
      }
      .ban-icon-box {
        width: 76px;
        height: 76px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
      }
      .clarification-content {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .clarification-headline {
        font-size: 46px;
        font-weight: 900;
        color: #F7F4EC;
        margin: 0;
        line-height: 1.2;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
    </style>

    <div id="root" data-composition-id="scene-s10" data-width="1080" data-height="1920" data-duration="7">
      <!-- Fixed bottom orange accent line -->
      <div class="bottom-accent-bar"></div>

      <!-- Main Visual Scene Clip -->
      <section id="s10-clip" class="clip" data-start="0" data-duration="7">
        <div id="dossier-card" class="dossier-wrapper">
          <!-- Document Header -->
          <div class="doc-header doc-entry">
            <span class="doc-badge">TRÍCH LỤC BẢN ÁN</span>
            <span class="doc-meta">ĐÍNH CHÍNH PHÁP LÝ</span>
          </div>

          <!-- Document Section Title -->
          <h2 class="doc-title doc-entry">GHI NHẬN TÌNH TIẾT TRONG BẢN ÁN</h2>

          <!-- Neutral Claim / Statement Box -->
          <div id="claim-box" class="claim-panel doc-entry">
            <div class="claim-tag">TRÍCH LỤC LỜI KHAI</div>
            <p class="claim-quote">TÌNH TIẾT NÊU TẠI PHIÊN TÒA</p>
            <div class="doc-skeleton-lines">
              <span class="skel-line" style="width: 100%;"></span>
              <span class="skel-line" style="width: 88%;"></span>
              <span class="skel-line" style="width: 72%;"></span>
            </div>
          </div>

          <!-- Dedicated Stamp Slot (Punch Phrase) -->
          <div class="stamp-container">
            <div id="stamp" class="stamp-mark">
              <h1 class="stamp-text">SUY NGHĨ CHỦ QUAN</h1>
            </div>
          </div>

          <!-- Clarification Banner (Ban icon + Label) -->
          <div id="clarification-panel" class="clarification-plate">
            <div class="ban-icon-box">
              <svg id="ban-svg" width="76" height="76" viewBox="0 0 100 100" fill="none">
                <circle cx="50" cy="50" r="40" stroke="#FF6A1A" stroke-width="9" />
                <line id="ban-slash" x1="22" y1="22" x2="78" y2="78" stroke="#FF6A1A" stroke-width="9" stroke-linecap="round" />
              </svg>
            </div>
            <div id="clarification-text" class="clarification-content">
              <div class="clarification-headline">HỒ SƠ KHÔNG GHI</div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Measure SVG path for deterministic self-drawing
      const slash = document.getElementById("ban-slash");
      const slashLen = 82;
      if (slash) {
        slash.style.strokeDasharray = `${slashLen}`;
        slash.style.strokeDashoffset = `${slashLen}`;
      }

      // Phase 1 (0.10s - 0.55s): Court Dossier Document Card punches into view
      tl.fromTo(
        "#dossier-card",
        { scale: 0.9, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.1
      );

      tl.fromTo(
        ".doc-entry",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.35, stagger: 0.08, ease: "power2.out" },
        0.25
      );

      // Phase 2 (0.75s): Stamp "SUY NGHĨ CHỦ QUAN" punches down firmly
      tl.fromTo(
        "#stamp",
        { scale: 2.2, opacity: 0, rotation: -14 },
        { scale: 1, opacity: 1, rotation: -3, duration: 0.32, ease: "power4.out" },
        0.75
      );

      // Micro reverberation impact on card
      tl.fromTo(
        "#dossier-card",
        { y: -5 },
        { y: 0, duration: 0.14, ease: "power2.out" },
        0.85
      );

      // Subtle living ambient motion (Vox collage feel)
      tl.to(
        "#dossier-card",
        { rotation: 0.35, duration: 1.8, ease: "sine.inOut", yoyo: true, repeat: 1 },
        1.4
      );

      // Phase 3 (4.20s): Ban Icon and Clarification Panel enter
      tl.fromTo(
        "#clarification-panel",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.38, ease: "power3.out" },
        4.20
      );

      tl.fromTo(
        "#ban-svg",
        { scale: 0, rotation: -45 },
        { scale: 1, rotation: 0, duration: 0.32, ease: "power3.out" },
        4.22
      );

      tl.fromTo(
        "#ban-slash",
        { strokeDashoffset: slashLen },
        { strokeDashoffset: 0, duration: 0.24, ease: "power2.out" },
        4.36
      );

      // Phase 4 (4.46s): Label "HỒ SƠ KHÔNG GHI" springs in firmly
      tl.fromTo(
        "#clarification-text",
        { x: -20, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        4.46
      );

      // Register master timeline
      window.__timelines["scene-s10"] = tl;
    </script>
  
    </template>
  </body>
</html>
