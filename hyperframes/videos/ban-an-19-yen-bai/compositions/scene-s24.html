<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #E7E3D9;
      color: #141414;
      font-family: 'Be Vietnam Pro', sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #F5F0E4; /* Biến thể card phẳng theo Scene Plan */
      overflow: hidden;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Thanh cam nhận diện thương hiệu cố định mép đáy */
    #signature-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 14px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Vùng an toàn 1080x1920: Safe top: 160px, bottom: 530px (cho caption) */
    .document-stage {
      position: absolute;
      top: 180px;
      left: 60px;
      width: 960px;
      perspective: 1200px;
    }

    /* Header tài liệu hồ sơ */
    .doc-header {
      width: 100%;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid #141414;
      padding-bottom: 16px;
      margin-bottom: 28px;
      transform-origin: top center;
    }

    .doc-tag {
      display: inline-flex;
      align-items: center;
      padding: 8px 18px;
      background-color: #141414;
      color: #F7F4EC;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      border-radius: 6px;
    }

    .doc-sub {
      font-size: 24px;
      font-weight: 700;
      color: #141414;
      letter-spacing: 1px;
    }

    /* Thẻ hồ sơ phân tầng (Unfold cards) */
    .doc-panel {
      position: relative;
      width: 100%;
      background-color: #E7E3D9;
      border: 3.5px solid #141414;
      border-radius: 14px;
      padding: 28px 34px;
      box-shadow: 8px 8px 0px #141414;
      transform-origin: top center;
      will-change: transform, opacity;
    }

    /* Card 1: Ý thức chủ quan */
    #card-subjective {
      margin-bottom: 28px;
    }

    /* Card 2: Hành vi nguy hiểm */
    #card-objective {
      margin-bottom: 30px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .step-badge {
      font-size: 22px;
      font-weight: 900;
      color: #141414;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Badge nhãn overlay: BẢN CHẤT Ý THỨC */
    .badge-highlight {
      display: inline-block;
      background-color: #FF6A1A;
      color: #141414;
      font-size: 30px;
      font-weight: 900;
      padding: 8px 20px;
      border-radius: 8px;
      border: 2px solid #141414;
      box-shadow: 4px 4px 0px #141414;
    }

    .card-title {
      font-size: 40px;
      font-weight: 900;
      line-height: 1.25;
      color: #141414;
      margin-bottom: 12px;
    }

    .card-desc {
      font-size: 26px;
      font-weight: 700;
      color: #141414;
      line-height: 1.4;
      opacity: 0.92;
    }

    /* Icon Check SVG và hộp trạng thái */
    .verification-box {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding-top: 16px;
      border-top: 2px dashed rgba(20, 20, 20, 0.4);
    }

    .check-svg {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .check-path {
      fill: none;
      stroke: #141414;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .verification-label {
      font-size: 24px;
      font-weight: 900;
      color: #141414;
      letter-spacing: 0.5px;
    }

    /* Cầu nối / Dấu ngăn cách 2 bước */
    .separator-flow {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: -14px 0 14px 0;
      z-index: 10;
      position: relative;
    }

    .flow-badge {
      background-color: #141414;
      color: #FF6A1A;
      font-size: 20px;
      font-weight: 900;
      padding: 6px 20px;
      border-radius: 20px;
      letter-spacing: 1px;
    }

    /* Banner chốt: KHÔNG ĐÁNH ĐỒNG TỘI */
    #conclusion-banner {
      width: 100%;
      background-color: #141414;
      border: 3.5px solid #141414;
      border-radius: 14px;
      padding: 24px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 8px 8px 0px #FF6A1A;
      transform-origin: center center;
      will-change: transform, opacity;
    }

    .conclusion-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .conclusion-tag {
      font-size: 20px;
      font-weight: 900;
      color: #FF6A1A;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .conclusion-text {
      font-size: 38px;
      font-weight: 900;
      color: #F7F4EC;
      letter-spacing: 0.5px;
    }

    .conclusion-stamp {
      background-color: #FF6A1A;
      color: #141414;
      font-size: 22px;
      font-weight: 900;
      padding: 10px 18px;
      border-radius: 8px;
      border: 2px solid #F7F4EC;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s24"
    data-width="1080"
    data-height="1920"
    data-duration="6.37"
  >
    <!-- Scene S24 Clip -->
    <div id="scene-s24" class="clip" data-start="0" data-duration="6.37">
      <div class="document-stage">

        <!-- Header tài liệu pháp lý -->
        <header id="doc-header" class="doc-header">
          <div class="doc-tag">TIÊU CHÍ ĐỊNH TỘI</div>
          <div class="doc-sub">BỘ LỌC PHÁP LÝ // 2 BƯỚC</div>
        </header>

        <!-- Card 1: Bước 1 - Ý thức chủ quan -->
        <section id="card-subjective" class="doc-panel">
          <div class="card-meta">
            <span class="step-badge">BƯỚC 1: XÉT Ý THỨC CHỦ QUAN</span>
            <div id="overlay-label-subjective" class="badge-highlight">BẢN CHẤT Ý THỨC</div>
          </div>
          <h2 class="card-title">Ý THỨC NGƯỜI THỰC HIỆN</h2>
          <p class="card-desc">Làm rõ động cơ và ý thức chủ quan thay vì chỉ nhìn vào mức độ nguy hiểm bên ngoài.</p>
          <div id="check-verification" class="verification-box">
            <svg class="check-svg" viewBox="0 0 48 48">
              <path id="check-path" class="check-path" d="M 8 24 L 20 36 L 40 12" />
            </svg>
            <span class="verification-label">XEM XÉT Ý THỨC NGƯỜI THỰC HIỆN</span>
          </div>
        </section>

        <!-- Dấu phân tách rõ ràng -->
        <div id="flow-divider" class="separator-flow">
          <div class="flow-badge">PHÂN BIỆT VỚI NGUY HIỂM KHÁCH QUAN</div>
        </div>

        <!-- Card 2: Bước 2 - Hành vi nguy hiểm đơn thuần -->
        <section id="card-objective" class="doc-panel">
          <div class="card-meta">
            <span class="step-badge">BƯỚC 2: YẾU TỐ NGUY HIỂM KHÁCH QUAN</span>
          </div>
          <h2 class="card-title">HÀNH VI NGUY HIỂM ĐƠN THUẦN</h2>
          <p class="card-desc">Không phải cứ có hành vi nguy hiểm là tự động thành tội giết người.</p>
        </section>

        <!-- Banner chốt nguyên tắc: KHÔNG ĐÁNH ĐỒNG TỘI -->
        <footer id="conclusion-banner">
          <div class="conclusion-left">
            <span class="conclusion-tag">NGUYÊN TẮC ÁP DỤNG</span>
            <h3 id="overlay-label-conclusion" class="conclusion-text">KHÔNG ĐÁNH ĐỒNG TỘI</h3>
          </div>
          <div class="conclusion-stamp">KẾT LUẬN</div>
        </footer>

      </div>
    </div>

    <!-- Thanh cam cố định nhận diện thương hiệu -->
    <div id="signature-bar"></div>
  </div>

  <script>
    // Chuẩn bị đường vẽ SVG Path Draw theo đúng skill svg-path-draw.md
    const pathEl = document.getElementById("check-path");
    const pathLength = pathEl.getTotalLength();
    pathEl.style.strokeDasharray = pathLength;
    pathEl.style.strokeDashoffset = pathLength;

    // Timeline chính, paused, seekable bởi HyperFrames runtime
    const tl = gsap.timeline({ paused: true });

    // 0.0s - 0.6s: Unfold Header & Document Frame
    tl.fromTo("#doc-header",
      { opacity: 0, y: -24, rotationX: -45 },
      { opacity: 1, y: 0, rotationX: 0, duration: 0.6, ease: "power3.out" },
      0.1
    );

    // 0.4s - 1.0s: Card 1 unfold xuất hiện
    tl.fromTo("#card-subjective",
      { opacity: 0, y: -40, rotationX: -30, scale: 0.96 },
      { opacity: 1, y: 0, rotationX: 0, scale: 1, duration: 0.7, ease: "power3.out" },
      0.4
    );

    // 1.57s (190750 ms): Label "BẢN CHẤT Ý THỨC" bật lên với spring-pop settle
    tl.fromTo("#overlay-label-subjective",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      1.57
    );

    // 2.3s: Divider ngăn cách xuất hiện
    tl.fromTo("#flow-divider",
      { opacity: 0, scale: 0.8 },
      { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" },
      2.3
    );

    // 2.7s - 3.4s: Card 2 "Hành vi nguy hiểm đơn thuần" unfold phía dưới
    tl.fromTo("#card-objective",
      { opacity: 0, y: -30, rotationX: -25, scale: 0.97 },
      { opacity: 1, y: 0, rotationX: 0, scale: 1, duration: 0.65, ease: "power3.out" },
      2.7
    );

    // 4.14s (193320 ms): Icon check SVG tự vẽ dần (Self-drawing) + Hộp xác nhận
    tl.fromTo("#check-verification",
      { opacity: 0 },
      { opacity: 1, duration: 0.3, ease: "power1.out" },
      4.0
    );

    tl.to(pathEl,
      { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
      4.14
    );

    // 5.60s (194780 ms): Label & Banner chốt "KHÔNG ĐÁNH ĐỒNG TỘI" bật lên mạnh mẽ
    tl.fromTo("#conclusion-banner",
      { opacity: 0, scale: 0.9, y: 24 },
      { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" },
      5.60
    );

    // Đăng ký timeline duy nhất lên window.__timelines["scene-s24"]
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s24"] = tl;
  </script>

    </template>
  </body>
