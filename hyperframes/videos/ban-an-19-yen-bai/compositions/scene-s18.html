<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
    }
    .clip {
      position: absolute;
      inset: 0;
    }
    /* Background Photo (Full bleed 1080x1920 theo chuẩn Style DNA background-photo) */
    .bg-photo {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      display: block;
    }
    /* Peel Entrance Flaps (Hiệu ứng mở tách đôi hai thực tế đối lập) */
    #peel-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }
    .peel-flap {
      position: absolute;
      top: 0;
      height: 1920px;
      width: 540px;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(rgba(20, 20, 20, 0.25) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(20, 20, 20, 0.25) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }
    #peel-left {
      left: 0;
      transform-origin: 0% 50%;
      border-right: 3px solid #FF6A1A;
    }
    #peel-right {
      left: 540px;
      transform-origin: 100% 50%;
      border-left: 3px solid #FF6A1A;
    }
    /* Vị trí các Overlays trong Safe Zone */
    .overlay-pos-left {
      position: absolute;
      top: 280px;
      left: 60px;
      z-index: 30;
    }
    .overlay-pos-icon {
      position: absolute;
      top: 385px;
      left: 60px;
      z-index: 30;
    }
    .overlay-pos-right {
      position: absolute;
      top: 280px;
      right: 60px;
      z-index: 30;
    }
    /* Tấm nền đen đặc chuẩn WCAG AAA (>16:1) cho chữ trên ảnh */
    .hf-plate-ink {
      background-color: #141414;
      color: #F7F4EC;
    }
    .badge-box {
      display: inline-flex;
      align-items: center;
      padding: 16px 28px;
      border-radius: 12px;
      border-left: 8px solid #FF6A1A;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }
    .badge-box-right {
      display: inline-flex;
      align-items: center;
      padding: 16px 28px;
      border-radius: 12px;
      border-right: 8px solid #FF6A1A;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }
    .badge-text {
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 44px;
      line-height: 1.2;
      color: #F7F4EC;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    /* Icon tròn vẽ tay chuẩn icon-vocabulary */
    .icon-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid #FF6A1A;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .check-svg {
      width: 42px;
      height: 42px;
    }
    /* Dải cam cố định đáy khung hình — chữ ký thị giác Vox-style */
    #brand-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s18"
    data-width="1080"
    data-height="1920"
    data-duration="10.18"
  >
    <!-- Shot S18-1: Nền ảnh phân tách góc bếp bên trái vs đồn công an bên phải -->
    <section id="shot-main" class="clip" data-start="0" data-duration="10.18" data-track-index="0">
      <img
        id="bg-photo"
        class="bg-photo"
        src="assets/img-18-victim-hiding-suspect-police-station.jpg"
        alt="Bố cục chia đôi: Nạn nhân ẩn nấp và đối tượng đầu thú"
      />
      <div id="peel-container">
        <div id="peel-left" class="peel-flap"></div>
        <div id="peel-right" class="peel-flap"></div>
      </div>
    </section>

    <!-- Overlay 1: ẨN NẤP KỊP THỜI (atMs: 143480 -> 3.02s, holdMs: 2200 -> 2.2s) -->
    <section id="shot-badge-hide" class="clip" data-start="3.02" data-duration="2.2" data-track-index="1">
      <div class="overlay-pos-left">
        <div id="badge-hide-el" class="hf-plate-ink badge-box">
          <span class="badge-text">ẨN NẤP KỊP THỜI</span>
        </div>
      </div>
    </section>

    <!-- Overlay 2: Check Icon (atMs: 144130 -> 3.67s, holdMs: 1600 -> 1.6s) -->
    <section id="shot-icon-check" class="clip" data-start="3.67" data-duration="1.6" data-track-index="2">
      <div class="overlay-pos-icon">
        <div id="icon-check-el" class="hf-plate-ink icon-circle">
          <svg class="check-svg" viewBox="0 0 24 24" fill="none" stroke="#FF6A1A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <path id="check-path" d="M20 6L9 17l-5-5"/>
          </svg>
        </div>
      </div>
    </section>

    <!-- Overlay 3: ĐẦU THÚ HÔM SAU (atMs: 149840 -> 9.38s, giữ đến hết cảnh tại 10.18s -> 0.80s) -->
    <section id="shot-badge-surrender" class="clip" data-start="9.38" data-duration="0.80" data-track-index="1">
      <div class="overlay-pos-right">
        <div id="badge-surrender-el" class="hf-plate-ink badge-box-right">
          <span class="badge-text">ĐẦU THÚ HÔM SAU</span>
        </div>
      </div>
    </section>

    <!-- Dải cam đáy thương hiệu -->
    <div id="brand-bottom-bar"></div>
  </div>

  <script>
    // Chuẩn bị đường nét vẽ tự động cho checkmark SVG
    const checkPath = document.getElementById("check-path");
    if (checkPath) {
      const pathLen = checkPath.getTotalLength();
      checkPath.style.strokeDasharray = pathLen;
      checkPath.style.strokeDashoffset = pathLen;
    }

    // Đăng ký đúng 1 timeline gốc paused theo contract HyperFrames
    const tl = gsap.timeline({ paused: true });

    // Transition In "peel": hai mảng giấy xé mở sang hai bên làm lộ rõ bố cục chia đôi
    tl.to("#peel-left", {
      scaleX: 0,
      opacity: 0,
      duration: 0.65,
      ease: "power3.inOut"
    }, 0.1);

    tl.to("#peel-right", {
      scaleX: 0,
      opacity: 0,
      duration: 0.65,
      ease: "power3.inOut"
    }, 0.1);

    // Overlay 1: ẨN NẤP KỊP THỜI (vào ở 3.02s)
    tl.fromTo("#badge-hide-el",
      { scale: 0.85, opacity: 0, y: 20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      3.02
    );

    // Overlay 2: Check Icon (vào ở 3.67s, tự vẽ nét ở 3.75s)
    tl.fromTo("#icon-check-el",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      3.67
    );

    if (checkPath) {
      tl.to("#check-path",
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        3.75
      );
    }

    // Overlay 3: ĐẦU THÚ HÔM SAU (vào ở 9.38s phía bên phải)
    tl.fromTo("#badge-surrender-el",
      { scale: 0.85, opacity: 0, y: 20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
      9.38
    );

    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s18"] = tl;
  </script>

    </template>
  </body>
</html>
