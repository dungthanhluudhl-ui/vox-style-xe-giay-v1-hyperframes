    <script>
      // Khởi tạo GSAP Timeline duy nhất, paused cho HyperFrames
      const tl = gsap.timeline({ paused: true });

      // Chuẩn bị stroke-dash cho các đường vẽ SVG
      document.querySelectorAll(".svg-draw-path").forEach((path) => {
        const len = path.getTotalLength ? path.getTotalLength() : 80;
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
      });

      // 1. GIAI ĐOẠN UNFOLD MỞ RỘNG TRỤC THỜI GIAN (0.12s - 0.70s)
      tl.fromTo(
        "#timeline-rail",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.55, ease: "power3.inOut" },
        0.12,
      );
      tl.fromTo(
        "#rail-arrow",
        { opacity: 0, x: -20 },
        { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" },
        0.58,
      );

      // Đường dóng dọc kết nối
      tl.fromTo(
        ["#conn-1", "#conn-2", "#conn-3"],
        { scaleY: 0 },
        { scaleY: 1, stagger: 0.12, duration: 0.3, ease: "power2.out" },
        0.4,
      );

      // 2. GIAI ĐOẠN HIỆN CỘT (0.35s - 0.90s): 3 nấc lần lượt trồi lên
      tl.fromTo(
        "#pillar-1",
        { y: 45, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.35,
      );
      tl.fromTo(
        "#pillar-2",
        { y: 45, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.5,
      );
      tl.fromTo(
        "#pillar-3",
        { y: 45, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.65,
      );

      // Nét vẽ các icon vector
      tl.to(
        ".svg-draw-path",
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        0.75,
      );

      // 3. OVERLAY 1: "TRỤC THỜI GIAN VỤ ÁN" (Khớp Shotlist atMs: 29030 -> relative 0.91s)
      tl.fromTo(
        "#header-card",
        { y: -40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.91,
      );
      tl.fromTo(
        "#header-accent-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.35, ease: "power2.out" },
        1.25,
      );

      // 4. NHẤN MẠNH MỐC TRUNG TÂM NẤC 2 (1.8s - 2.4s): Tiêu điểm diễn biến
      tl.fromTo(
        "#pillar-2 .node-circle",
        { scale: 1 },
        { scale: 1.15, duration: 0.25, ease: "power2.out" },
        1.8,
      );
      tl.to(
        "#pillar-2 .node-circle",
        { scale: 1, duration: 0.25, ease: "power2.in" },
        2.05,
      );

      // 5. OVERLAY 2: "TRƯỚC • TRONG • SAU" (Khớp Shotlist atMs: 30880 -> relative 2.76s)
      tl.fromTo(
        "#summary-banner",
        { y: 40, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        2.76,
      );
      tl.fromTo(
        ".summary-word",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, stagger: 0.1, duration: 0.32, ease: "power2.out" },
        3.05,
      );
      tl.fromTo(
        ".summary-bullet",
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, stagger: 0.1, duration: 0.25, ease: "power3.out" },
        3.15,
      );

      // Đăng ký timeline chính thức cho HyperFrames runtime
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s04"] = tl;
    </script>
