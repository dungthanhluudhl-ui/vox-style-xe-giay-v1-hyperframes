<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Root canvas 1080x1920 */
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Chuẩn HyperFrames: .clip dùng inset: 0, không set px cứng */
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Container chính của scene để nhận hiệu ứng strike / rung chấn */
      #scene-inner {
        position: absolute;
        inset: 0;
        transform-origin: 50% 40%;
        will-change: transform;
      }

      /* Ảnh nền toàn khung 1080x1920 (background-photo) - giữ nguyên màu gốc, không overlay/filter */
      .bg-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
      }

      /* Thanh cam nhận diện thương hiệu cố định mép đáy */
      .bottom-orange-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 900;
      }

      /* OVERLAY 1: Doc Badge (icon doc tự vẽ + nhãn hồ sơ) */
      .doc-card-container {
        position: absolute;
        left: 60px;
        top: 220px;
        display: inline-flex;
        align-items: center;
        gap: 20px;
        padding: 18px 28px;
        border-radius: 8px;
        border-left: 8px solid #ff6a1a;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
        will-change: transform, opacity;
      }

      .doc-svg {
        width: 60px;
        height: 60px;
        flex-shrink: 0;
      }

      .doc-info {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .doc-title {
        font-size: 30px;
        font-weight: 900;
        letter-spacing: 1px;
        line-height: 1.2;
        text-transform: uppercase;
      }

      /* OVERLAY 2: Punch Phrase Plate (TUYÊN PHẠT 13 NĂM 6 THÁNG) */
      .punch-card-container {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 1040px;
        height: auto;
        padding: 28px 32px;
        border-radius: 6px;
        border-left: 14px solid #ff6a1a;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7);
        will-change: transform, opacity;
      }

      .punch-text {
        margin: 0;
        font-size: 52px;
        font-weight: 900;
        line-height: 1.26;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      /* OVERLAY 3: Crime Badge (TỘI GIẾT NGƯỜI) */
      .crime-badge-container {
        position: absolute;
        left: 60px;
        top: 1205px;
        display: inline-flex;
        align-items: center;
        padding: 14px 28px;
        border-radius: 4px;
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.6);
        will-change: transform, opacity;
      }

      .crime-text {
        font-size: 38px;
        font-weight: 900;
        letter-spacing: 2px;
        line-height: 1.2;
        text-transform: uppercase;
      }
    </style>

    <!-- Composition Root: duration = 10.16s (280140ms đến 290300ms) -->
    <div
      id="root"
      data-composition-id="scene-s36"
      data-width="1080"
      data-height="1920"
      data-duration="10.16"
    >
      <!-- Vỏ bọc rung chấn hiệu ứng Strike gõ búa tuyên án -->
      <div id="scene-inner">
        <!-- Shot 1 Background Photo Clip: phủ toàn bộ khung 1080x1920, giữ nguyên màu gốc -->
        <section id="s36-bg-clip" class="clip" data-start="0" data-duration="10.16">
          <img
            id="court-bg"
            class="bg-photo"
            src="assets/img-10-court-verdict-murder-trial.jpg"
            alt="Phiên toà xét xử hình sự TAND tỉnh Yên Bái"
          />
        </section>

        <!-- Overlay 1: Icon document + Hồ sơ vụ án (atMs 283200 -> 3.06s, holdMs 2000 -> 2.0s) -->
        <div id="clip-doc-overlay" class="clip" data-start="3.06" data-duration="2.0">
          <div id="doc-card" class="doc-card-container hf-plate-ink">
            <svg class="doc-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                id="doc-path-outline"
                d="M26 14 H64 L80 30 V86 H26 Z"
                stroke="#FF6A1A"
                stroke-width="5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                id="doc-path-fold"
                d="M64 14 V30 H80"
                stroke="#FF6A1A"
                stroke-width="5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <line
                id="doc-line-1"
                x1="36"
                y1="46"
                x2="70"
                y2="46"
                stroke="#F7F4EC"
                stroke-width="4.5"
                stroke-linecap="round"
              />
              <line
                id="doc-line-2"
                x1="36"
                y1="60"
                x2="70"
                y2="60"
                stroke="#F7F4EC"
                stroke-width="4.5"
                stroke-linecap="round"
              />
              <line
                id="doc-line-3"
                x1="36"
                y1="74"
                x2="56"
                y2="74"
                stroke="#F7F4EC"
                stroke-width="4.5"
                stroke-linecap="round"
              />
            </svg>
            <div class="doc-info">
              <span class="doc-title hf-text-light">HỒ SƠ VỤ ÁN</span>
            </div>
          </div>
        </div>

        <!-- Overlay 2: Punch Phrase (atMs 287230 -> 7.09s, kéo dài đến hết scene 3.07s) -->
        <div id="clip-punch-phrase" class="clip" data-start="7.09" data-duration="3.07">
          <div id="punch-card" class="punch-card-container hf-plate-ink">
            <h1 class="punch-text hf-text-light">TUYÊN PHẠT 13 NĂM 6 THÁNG</h1>
          </div>
        </div>

        <!-- Overlay 3: Label tội danh (atMs 288920 -> 8.78s, kéo dài đến hết scene 1.38s) -->
        <div id="clip-label-crime" class="clip" data-start="8.78" data-duration="1.38">
          <div id="crime-badge" class="crime-badge-container hf-hl-orange">
            <span class="crime-text hf-text-ink">TỘI GIẾT NGƯỜI</span>
          </div>
        </div>
      </div>

      <!-- Thanh cam đáy cố định không rung -->
      <div id="bottom-bar" class="bottom-orange-bar"></div>
    </div>

    <!-- GSAP Seekable Timeline Script -->
    <script>
      // Thiết lập stroke SVG path vẽ dần cho icon doc
      const docPaths = document.querySelectorAll(
        "#clip-doc-overlay path, #clip-doc-overlay line"
      );
      docPaths.forEach(function (path) {
        if (typeof path.getTotalLength === "function") {
          const len = path.getTotalLength();
          path.style.strokeDasharray = len;
          path.style.strokeDashoffset = len;
        }
      });

      // Tạo timeline chính ở trạng thái paused
      const tl = gsap.timeline({ paused: true });

      // 1. TRANSITION IN: "strike" - Búa toà giáng dứt khoát làm rung chuyển màn hình
      // Giáng xuống nhanh tại t = 0 -> 0.22s
      tl.fromTo(
        "#scene-inner",
        { scale: 1.08, y: -45 },
        { scale: 1.0, y: 0, duration: 0.22, ease: "power4.in" },
        0
      );

      // Rung chấn màn hình dập tắt dần (dùng toạ độ tuyệt đối xác định)
      tl.to("#scene-inner", { y: 14, duration: 0.05, ease: "power1.out" }, 0.22);
      tl.to("#scene-inner", { y: -10, duration: 0.05, ease: "power1.inOut" }, 0.27);
      tl.to("#scene-inner", { y: 6, duration: 0.05, ease: "power1.inOut" }, 0.32);
      tl.to("#scene-inner", { y: -3, duration: 0.05, ease: "power1.inOut" }, 0.37);
      tl.to("#scene-inner", { y: 0, duration: 0.05, ease: "power1.out" }, 0.42);

      // 2. OVERLAY 1: Doc badge xuất hiện lúc t = 3.06s và tự vẽ SVG
      tl.fromTo(
        "#doc-card",
        { scale: 0.85, opacity: 0, y: 24 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        3.06
      );

      // Vẽ stroke viền và các dòng chữ hồ sơ
      tl.to(
        "#doc-path-outline",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        3.15
      );
      tl.to(
        "#doc-path-fold",
        { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
        3.4
      );
      tl.to(
        "#doc-line-1",
        { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" },
        3.55
      );
      tl.to(
        "#doc-line-2",
        { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" },
        3.7
      );
      tl.to(
        "#doc-line-3",
        { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" },
        3.85
      );

      // Doc badge biến mất trước khi clip kết thúc tại 5.06s
      tl.to(
        "#doc-card",
        { opacity: 0, y: -16, duration: 0.26, ease: "power2.in" },
        4.76
      );

      // 3. OVERLAY 2: Punch-phrase "TUYÊN PHẠT 13 NĂM 6 THÁNG" xuất hiện lúc t = 7.09s
      tl.fromTo(
        "#punch-card",
        { scale: 0.94, opacity: 0, x: -36 },
        { scale: 1.0, opacity: 1, x: 0, duration: 0.45, ease: "power4.out" },
        7.09
      );

      // 4. OVERLAY 3: Nhãn "TỘI GIẾT NGƯỜI" đóng dấu quyết định lúc t = 8.78s
      tl.fromTo(
        "#crime-badge",
        { scale: 1.35, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.3, ease: "power3.out" },
        8.78
      );

      // Đăng ký timeline gốc vào window.__timelines theo chuẩn HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s36"] = tl;
    </script>
  
    </template>
  </body>
</html>
