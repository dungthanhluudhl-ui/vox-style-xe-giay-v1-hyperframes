<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định theo WCAG từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Quy ước HyperFrames: .clip inset: 0, không đặt cứng px width/height */
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Khung ảnh nền chính - phủ toàn bộ 1080x1920 theo chuẩn background-photo */
      .bg-photo-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background-color: #141414;
      }
      .bg-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        will-change: transform;
      }

      /* Lớp phủ màng màu dossier tăng tương phản cho các lớp chữ */
      .dossier-tint {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 45%, rgba(20, 20, 20, 0.3) 0%, rgba(20, 20, 20, 0.76) 100%);
        pointer-events: none;
      }

      /* Dải nhận diện thương hiệu Vox cam cố định mép đáy */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 90;
      }

      /* Vùng an toàn (safe-zone: Y từ 160px tới 1390px) */
      .editorial-container {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* 1. Header tag hồ sơ nhân vật (Y: 220px) */
      .header-dossier-tag {
        position: absolute;
        top: 220px;
        left: 80px;
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 14px 28px;
        border-radius: 8px;
        border-left: 8px solid #FF6A1A;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        z-index: 10;
      }
      .tag-num {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #FF6A1A;
      }
      .tag-title {
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 1.5px;
        color: #F7F4EC;
        text-transform: uppercase;
      }

      /* 2. Dây chỉ đỏ kết nối tới nhân vật (Y: 340px) */
      .thread-svg {
        position: absolute;
        top: 310px;
        left: 100px;
        width: 360px;
        height: 220px;
        z-index: 12;
      }
      .red-thread-line {
        fill: none;
        stroke: #FF6A1A;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-dasharray: 8 6;
      }

      /* 3. Con dấu mộc quy ước danh tính: "BÀ HƯƠNG (BẠN BỐ)" (Y: 520px) */
      .stamp-wrapper {
        position: absolute;
        top: 520px;
        left: 80px;
        right: 80px;
        z-index: 20;
      }
      .stamp-plate {
        position: relative;
        background-color: #141414;
        border: 6px solid #FF6A1A;
        border-radius: 12px;
        padding: 36px 40px;
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.65);
      }
      .stamp-inner-border {
        position: absolute;
        inset: 10px;
        border: 2px dashed rgba(255, 106, 26, 0.7);
        border-radius: 6px;
        pointer-events: none;
      }
      .stamp-badge-header {
        display: inline-block;
        padding: 8px 24px;
        border-radius: 4px;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 20px;
      }
      /* Tiêu đề hiển thị đúng nguyên văn theo shotlist: "BÀ HƯƠNG (BẠN BỐ)" */
      .stamp-title-main {
        font-size: 64px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: 2px;
        color: #F7F4EC;
        text-transform: uppercase;
        margin: 0;
      }

      /* 4. Ghi chú pháp lý minh bạch kèm Icon 'doc' (Y: 840px) */
      .legal-note-card {
        position: absolute;
        top: 840px;
        left: 80px;
        right: 80px;
        display: flex;
        align-items: center;
        gap: 28px;
        padding: 26px 32px;
        border-radius: 10px;
        border-left: 8px solid #FF6A1A;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
        z-index: 20;
      }
      .doc-icon-svg {
        width: 64px;
        height: 64px;
        flex-shrink: 0;
      }
      .legal-text-stack {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .legal-headline {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #FF6A1A;
        text-transform: uppercase;
        margin: 0;
      }
      .legal-detail {
        font-size: 28px;
        font-weight: 700;
        line-height: 1.35;
        color: #F7F4EC;
        margin: 0;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s08"
      data-width="1080"
      data-height="1920"
      data-duration="9.19"
    >
      <!-- Shot 1: Căn giữa 9:16, scale 1.1x zoom-in chậm, transitionIn: rise -->
      <section id="shot-1" class="clip" data-start="0" data-duration="9.19">
        <!-- ẢNH NỀN CHÍNH (img-02: Case file suspects board) -->
        <div class="bg-photo-wrapper">
          <img
            id="bg-photo-img"
            class="bg-photo"
            src="assets/img-02-case-file-suspects-board.jpg"
            alt="Hồ sơ vụ án bảng điều tra"
          />
          <div class="dossier-tint"></div>
        </div>

        <!-- CÁC LỚP CHỈ DẪN VÀ ANNOTATION ĐỒNG BỘ THEO SHOTLIST -->
        <div class="editorial-container">
          <!-- 1. Header nhãn hồ sơ nhân vật -->
          <div id="header-tag" class="header-dossier-tag hf-plate-ink">
            <span class="tag-num">03</span>
            <span class="tag-title">HỒ SƠ NHÂN VẬT LIÊN QUAN</span>
          </div>

          <!-- 2. Dây chỉ đỏ kết nối tới nhân vật thứ ba trên hồ sơ -->
          <svg class="thread-svg" viewBox="0 0 360 220">
            <path
              id="thread-path"
              class="red-thread-line"
              d="M 30 20 Q 200 70 330 200"
            />
          </svg>

          <!-- 3. OVERLAY 1: Hiển thị đúng nguyên văn "BÀ HƯƠNG (BẠN BỐ)" -->
          <div id="stamp-container" class="stamp-wrapper">
            <div class="stamp-plate">
              <div class="stamp-inner-border"></div>
              <div class="stamp-badge-header hf-hl-orange">QUY ƯỚC DANH TÍNH</div>
              <h1 class="stamp-title-main">BÀ HƯƠNG (BẠN BỐ)</h1>
            </div>
          </div>

          <!-- 4. OVERLAY 2: ICON 'doc' & GHI CHÚ QUY ƯỚC PHÁP LÝ -->
          <div id="legal-box" class="legal-note-card hf-plate-ink">
            <svg class="doc-icon-svg" viewBox="0 0 64 64" fill="none">
              <!-- SVG doc icon tự vẽ đường nét -->
              <path
                id="doc-outline"
                class="draw-stroke"
                d="M 14 6 L 38 6 L 50 18 L 50 58 L 14 58 Z"
                stroke="#FF6A1A"
                stroke-width="4.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                id="doc-fold"
                class="draw-stroke"
                d="M 38 6 L 38 18 L 50 18"
                stroke="#FF6A1A"
                stroke-width="4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <line
                id="doc-line-1"
                class="draw-stroke"
                x1="22"
                y1="28"
                x2="42"
                y2="28"
                stroke="#F7F4EC"
                stroke-width="3.5"
                stroke-linecap="round"
              />
              <line
                id="doc-line-2"
                class="draw-stroke"
                x1="22"
                y1="38"
                x2="42"
                y2="38"
                stroke="#F7F4EC"
                stroke-width="3.5"
                stroke-linecap="round"
              />
              <line
                id="doc-line-3"
                class="draw-stroke"
                x1="22"
                y1="48"
                x2="34"
                y2="48"
                stroke="#F7F4EC"
                stroke-width="3.5"
                stroke-linecap="round"
              />
            </svg>
            <div class="legal-text-stack">
              <span class="legal-headline">QUY ƯỚC PHÁP LÝ</span>
              <p class="legal-detail">Tên nhân vật mang tính chất giả định</p>
            </div>
          </div>
        </div>

        <!-- Chữ ký thị giác: thanh cam cố định mép đáy -->
        <div class="brand-bottom-bar"></div>
      </section>
    </div>

    <script>
      // Thiết lập đo độ dài thực tế cho các đường vẽ SVG (seek-safe, deterministic)
      const threadPath = document.getElementById("thread-path");
      if (threadPath) {
        const len = threadPath.getTotalLength();
        threadPath.style.strokeDasharray = len;
        threadPath.style.strokeDashoffset = len;
      }

      document.querySelectorAll(".draw-stroke").forEach((el) => {
        const len = el.getTotalLength ? el.getTotalLength() : 60;
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
      });

      // Tạo timeline GSAP duy nhất, ở trạng thái paused theo hợp đồng HyperFrames
      const tl = gsap.timeline({ paused: true });

      // 1. Camera motion: zoom-in chậm từ 1.05x đến 1.18x tập trung vào vị trí ảnh chân dung
      tl.fromTo(
        "#bg-photo-img",
        { scale: 1.05, x: 0, y: 0 },
        { scale: 1.18, x: -30, y: -45, duration: 9.19, ease: "none" },
        0
      );

      // Entrance animation: "rise" trượt nhẹ lên theo shotlist
      tl.fromTo(
        "#header-tag",
        { opacity: 0, y: 35 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.3
      );

      // Dây chỉ đỏ vẽ ra định vị nhân vật trên hồ sơ
      tl.to(
        "#thread-path",
        { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" },
        0.65
      );

      // 2. OVERLAY 1: "BÀ HƯƠNG (BẠN BỐ)"
      // Timestamp theo shotlist: atMs = 57530 ((57530 - 55470)/1000 = 2.06s)
      tl.fromTo(
        "#stamp-container",
        { scale: 1.12, opacity: 0, y: 30 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        2.06
      );

      // 3. OVERLAY 2: ICON 'doc' & GHI CHÚ QUY ƯỚC PHÁP LÝ
      // Timestamp theo shotlist: atMs = 60240 ((60240 - 55470)/1000 = 4.77s)
      tl.fromTo(
        "#legal-box",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        4.77
      );

      // Đường nét icon doc vẽ dần
      tl.to(
        "#doc-outline",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        4.95
      );
      tl.to(
        "#doc-fold",
        { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
        5.2
      );
      tl.to(
        ["#doc-line-1", "#doc-line-2", "#doc-line-3"],
        { strokeDashoffset: 0, duration: 0.35, stagger: 0.08, ease: "power2.out" },
        5.35
      );

      // Đăng ký timeline chính lên window.__timelines["scene-s08"]
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s08"] = tl;
    </script>
  
    </template>
  </body>
</html>
