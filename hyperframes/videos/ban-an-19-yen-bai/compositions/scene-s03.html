<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background: #141414;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #e7e3d9;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* Base layout & full-bleed background */
      #scene-wrapper {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .bg-photo-layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .bg-photo-layer img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 50% 48%;
        will-change: transform;
      }

      /* Visual safe-zone container (Top: 160px, Bottom: 530px, Left: 40px, Right: 40px) */
      .ui-overlay-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Overlay 1: Question Icon Callout Badge */
      #question-badge {
        position: absolute;
        top: 600px;
        left: 445px;
        right: auto;
        bottom: auto;
        width: 190px;
        height: 190px;
        border-radius: 95px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
        border: 4px solid #ff6a1a;
        transform-origin: 50% 50%;
        opacity: 0;
        will-change: transform, opacity;
      }

      .question-svg {
        width: 104px;
        height: 104px;
        overflow: visible;
      }

      /* Overlay 2: Intent Punch Phrase Badge ("Ý CHÍ CHỦ QUAN") */
      #intent-card {
        position: absolute;
        top: 1120px;
        left: 80px;
        right: 80px;
        bottom: auto;
        height: auto;
        padding: 34px 44px;
        border-radius: 12px;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transform-origin: 50% 50%;
        opacity: 0;
        will-change: transform, opacity;
      }

      #intent-bar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 12px;
        background: #ff6a1a;
        transform-origin: 50% 100%;
        will-change: transform;
      }

      .intent-title {
        margin: 0;
        font-size: 64px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: 2px;
        text-align: center;
        text-transform: uppercase;
      }

      /* Fixed bottom orange branding bar */
      .bottom-orange-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background: #ff6a1a;
        z-index: 999;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s03"
      data-width="1080"
      data-height="1920"
      data-duration="7.64"
    >
      <!-- Main Scene Shot S03-1: 7.64s -->
      <section id="shot-s03-1" class="clip" data-start="0" data-duration="7.64">
        <div id="scene-wrapper">
          <!-- Background photo in original colors, unhampered by gradient/filter -->
          <div class="bg-photo-layer">
            <img
              id="bg-photo"
              data-asset-id="img-03"
              src="assets/img-03-injury-rate-forensic-court-cutout.jpg"
              alt="img-03: Hiện trường pháp y và búa tòa án"
            />
          </div>

          <!-- UI Overlays: Question Icon and Intent Label -->
          <div class="ui-overlay-layer">
            <!-- Overlay 1: Question Icon Badge (atMs: 20840 -> offset 0.42s, holdMs: 2000 -> duration 2.45s) -->
            <div
              id="question-badge"
              class="clip hf-plate-ink"
              data-start="0.42"
              data-duration="2.45"
              style="opacity: 0;"
            >
              <svg
                class="question-svg"
                viewBox="0 0 100 100"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  id="q-curve"
                  d="M 32 38 C 32 20, 68 20, 68 38 C 68 50, 50 54, 50 66"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="9"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <circle id="q-dot" cx="50" cy="82" r="5.5" fill="#FF6A1A" />
              </svg>
            </div>

            <!-- Overlay 2: Punch Label (atMs: 25680 -> offset 5.26s, holds to scene end -> duration 2.38s) -->
            <div
              id="intent-card"
              class="clip hf-plate-ink"
              data-start="5.26"
              data-duration="2.38"
              style="opacity: 0;"
            >
              <div id="intent-bar"></div>
              <h1 class="intent-title hf-text-light">Ý CHÍ CHỦ QUAN</h1>
            </div>
          </div>
        </div>
      </section>

      <!-- Signature persistent bottom orange bar -->
      <div class="bottom-orange-bar"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Path preparation for question mark outline trace
      const qPath = document.getElementById("q-curve");
      const pathLength = qPath.getTotalLength();
      qPath.style.strokeDasharray = `${pathLength}`;
      qPath.style.strokeDashoffset = `${pathLength}`;

      // 1. Scene Transition-In: wobble-drop (t = 0.0s -> 0.72s)
      tl.fromTo(
        "#scene-wrapper",
        { y: -130, rotation: 3.2, scale: 1.06, opacity: 0 },
        { y: 0, rotation: 0, scale: 1.0, opacity: 1, duration: 0.72, ease: "power3.out" },
        0
      );

      // 2. Camera Motion: continuous slow zoom-in (1.0x -> 1.05x) across entire scene duration
      tl.fromTo(
        "#bg-photo",
        { scale: 1.0 },
        { scale: 1.05, duration: 7.64, ease: "none" },
        0
      );

      // 3. Overlay 1: Icon question badge arrival (atMs: 20840 -> offset 0.42s)
      tl.fromTo(
        "#question-badge",
        { scale: 0, opacity: 0, rotation: -12 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "power3.out" },
        0.42
      );

      // Progressive drawing of the question mark curve
      tl.fromTo(
        "#q-curve",
        { strokeDashoffset: pathLength },
        { strokeDashoffset: 0, duration: 0.52, ease: "power2.out" },
        0.54
      );

      // Pop-in for the question mark dot
      tl.fromTo(
        "#q-dot",
        { scale: 0, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, duration: 0.24, ease: "power3.out" },
        0.96
      );

      // Exit transition for question badge after hold (holdMs: 2000 -> fades out at t = 2.42s)
      tl.to(
        "#question-badge",
        { scale: 0.85, opacity: 0, duration: 0.35, ease: "power2.in" },
        2.42
      );

      // 4. Overlay 2: "Ý CHÍ CHỦ QUAN" stamp arrival (atMs: 25680 -> offset 5.26s)
      tl.fromTo(
        "#intent-card",
        { scale: 0.9, y: 35, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.44, ease: "power3.out" },
        5.26
      );

      tl.fromTo(
        "#intent-bar",
        { scaleY: 0 },
        { scaleY: 1, duration: 0.36, ease: "power2.out" },
        5.4
      );

      // Register master timeline
      window.__timelines["scene-s03"] = tl;
    </script>
  
    </template>
  </body>
</html>
