  <script>
    // Progressive SVG path draw setup for warning icon
    const tri = document.getElementById("warning-triangle");
    const triLen = tri.getTotalLength();
    tri.style.strokeDasharray = triLen;
    tri.style.strokeDashoffset = triLen;

    const line = document.getElementById("warning-line");
    const lineLen = line.getTotalLength();
    line.style.strokeDasharray = lineLen;
    line.style.strokeDashoffset = lineLen;

    const tl = gsap.timeline({ paused: true });

    // 0.00s: Subtle documentary camera pan-right
    tl.fromTo("#camera-rig",
      { x: -6 },
      { x: 6, duration: 7.04, ease: "none" },
      0
    );

    // 0.00s: Transition in - rise
    tl.fromTo("#scene-container",
      { y: 40, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
      0
    );

    // 0.15s: Pillar and beam setup
    tl.fromTo(".pillar-body",
      { scaleY: 0, transformOrigin: "bottom center" },
      { scaleY: 1, duration: 0.55, ease: "power3.out" },
      0.15
    );
    tl.fromTo("#scale-beam",
      { scaleX: 0, opacity: 0 },
      { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.35
    );

    // 0.45s: Pans drop down
    tl.fromTo("#left-pan-wrap",
      { y: -30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.45
    );
    tl.fromTo("#right-pan-wrap",
      { y: -30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.5
    );

    // Initial state: hide heavy weight and overlays
    tl.set("#heavy-weight", { opacity: 0 }, 0);
    tl.set("#punch-overlay", { opacity: 0, y: 30 }, 0);
    tl.set("#warning-badge", { opacity: 0 }, 0);

    // 0.92s: Overlay 1 - "CÂN NHẮC TOÀN DIỆN" (atMs: 274020, holdMs: 2400)
    tl.fromTo("#overlay-label",
      { y: -20, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.92
    );

    // 1.25s: Mitigating items populate left pan
    tl.fromTo(".left-item",
      { y: 16, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, stagger: 0.12, ease: "power2.out" },
      1.25
    );
    tl.fromTo("#left-acknowledged-stamp",
      { scale: 0.9, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      1.65
    );

    // 1.95s: Scale tilts slightly left (-4.5 deg) as mitigating factors are weighed
    tl.to("#scale-beam", { rotation: -4.5, duration: 0.7, ease: "power2.out" }, 1.95);
    tl.to("#left-pan-wrap", { y: 21, duration: 0.7, ease: "power2.out" }, 1.95);
    tl.to("#right-pan-wrap", { y: -21, duration: 0.7, ease: "power2.out" }, 1.95);

    // 2.35s: Severity item appears on right pan
    tl.fromTo(".right-item",
      { y: 16, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
      2.35
    );

    // 3.32s: Overlay 1 exits cleanly at hold end (0.92 + 2.4s = 3.32s)
    tl.to("#overlay-label",
      { opacity: 0, duration: 0.3, ease: "power2.in" },
      3.32
    );

    // 4.10s: Scale pivots back to level as the reversal approaches
    tl.to("#scale-beam", { rotation: 0, duration: 0.45, ease: "power2.inOut" }, 4.1);
    tl.to("#left-pan-wrap", { y: 0, duration: 0.45, ease: "power2.inOut" }, 4.1);
    tl.to("#right-pan-wrap", { y: 0, duration: 0.45, ease: "power2.inOut" }, 4.1);

    // 4.55s: The Heavy Weight item drops into right pan
    tl.fromTo("#heavy-weight",
      { y: -40, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.35, ease: "power3.in" },
      4.55
    );

    // 4.90s: SEVERE REVERSAL SLAM! Right pan plunges (+76px), left pan rises (-76px)
    tl.to("#scale-beam", { rotation: 15, duration: 0.65, ease: "power4.out" }, 4.9);
