    // Build seekable paused GSAP timeline
    const tl = gsap.timeline({ paused: true });

    // 1. Scene Entrance (Rise Transition & Camera Drift)
    tl.fromTo("#camera-stage",
      { y: 50, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
      0
    );

    // Continuous Subtle Camera Zoom-In
    tl.fromTo("#camera-stage",
      { scale: 1.0 },
      { scale: 1.08, duration: 10.64, ease: "none" },
      0
    );

    // 2. OVERLAY 1: "CỰ LY: 1 MÉT" (Shotlist: atMs 130440 -> 0.94s, holdMs 2400 -> to 3.34s)
    tl.fromTo("#ruler-group",
      { opacity: 0, scale: 0.9, y: 15 },
      { opacity: 1, scale: 1.0, y: 0, duration: 0.45, ease: "power3.out" },
      0.94
    );

    // Rapid Contraction of 1 Metre Distance & Knife Thrust (1.55s -> 2.10s)
    tl.to("#ruler-bar",
      { attr: { x1: 540 }, duration: 0.55, ease: "power3.in" },
      1.55
    );
    tl.to("#ruler-bound-left",
      { attr: { x1: 540, x2: 540 }, duration: 0.55, ease: "power3.in" },
      1.55
    );
    tl.to("#knife-thrust",
      { x: 590, y: 780, duration: 0.55, ease: "power3.in" },
      1.55
    );

    // Fatal Belly Impact at 2.10s (Sharp Forensic Impact)
    tl.fromTo("#impact-belly",
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" },
      2.10
    );
    tl.fromTo("#belly-wave-1",
      { r: 10, opacity: 1 },
      { r: 70, opacity: 0, duration: 0.65, ease: "power2.out" },
      2.10
    );
    tl.fromTo("#belly-wave-2",
      { r: 6, opacity: 1 },
      { r: 45, opacity: 0, duration: 0.55, ease: "power2.out" },
      2.15
    );
    tl.to("#belly-highlight",
      { fillOpacity: 0.45, strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
      2.10
    );

    // Fade out Ruler Overlay by 3.34s
    tl.to("#ruler-group",
      { opacity: 0, scale: 0.95, duration: 0.25, ease: "power2.in" },
      3.15
    );
    tl.to("#svg-ruler",
      { opacity: 0, duration: 0.25, ease: "power2.in" },
      3.15
    );

    // 3. OVERLAY 2: "VÙNG BỤNG NGUY HIỂM" (Shotlist: atMs 132430 -> 2.93s, holdMs 2500 -> to 5.43s)
    tl.fromTo("#overlay-punch",
      { opacity: 0, scale: 0.9, y: 20 },
      { opacity: 1, scale: 1.0, y: 0, duration: 0.45, ease: "power3.out" },
      2.93
    );
    tl.to("#connector-belly",
      { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
      2.93
    );

    // Warning Pulse on Abdomen Wound
    tl.fromTo("#belly-glow",
      { fill: "#141414" },
      { fill: "#FF6A1A", repeat: 5, yoyo: true, duration: 0.3, ease: "sine.inOut" },
      3.00
    );

    // Retract Punch Card at 5.15s (Completes at 5.43s)
    tl.to("#overlay-punch",
      { opacity: 0, y: -15, duration: 0.28, ease: "power2.in" },
      5.15
    );
    tl.to("#connector-belly",
      { opacity: 0, duration: 0.25 },
      5.15
    );

    // 4. Escape Sequence: Running Towards Side Door (6.0s -> 8.4s)
    tl.to("#escape-path",
      { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" },
      6.00
    );
    tl.to("#door-marker",
      { opacity: 1, duration: 0.4, ease: "power2.out" },
      6.30
    );
    tl.fromTo("#escape-tag",
      { opacity: 0, x: -15 },
      { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
      6.20
    );
    // Body shifts posture in flight
    tl.to("#human-body",
      { x: -18, rotation: -2.5, transformOrigin: "540px 800px", duration: 0.85, ease: "power2.out" },
      6.10
    );

    // Fade out Escape Tag & dim route before pursuit strike begins
    tl.to("#escape-tag",
      { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" },
      8.30
    );
    tl.to("#escape-route",
      { opacity: 0.25, duration: 0.35, ease: "power2.out" },
      8.30
    );

    // 5. Pursuit & Secondary Strike at Arm (8.60s -> 9.20s)
    tl.to("#slash-vector",
      { strokeDashoffset: 0, duration: 0.55, ease: "power3.in" },
      8.65
    );

    // Impact Arm Wound at 9.20s
    tl.fromTo("#impact-arm",
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" },
      9.20
    );
    tl.fromTo("#arm-wave",
      { r: 8, opacity: 1 },
      { r: 55, opacity: 0, duration: 0.5, ease: "power2.out" },
      9.20
    );

    // 6. OVERLAY 3: "VẾT THƯƠNG CÁNH TAY" (Shotlist: atMs 138700 -> 9.20s, hold to end of scene)
    tl.fromTo("#overlay-arm",
      { opacity: 0, scale: 0.9, x: -25 },
      { opacity: 1, scale: 1.0, x: 0, duration: 0.45, ease: "power3.out" },
      9.20
    );
    tl.to("#connector-arm",
      { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
      9.20
    );

    // Register single paused timeline onto window.__timelines
    window.__timelines["scene-s17"] = tl;
  </script>
