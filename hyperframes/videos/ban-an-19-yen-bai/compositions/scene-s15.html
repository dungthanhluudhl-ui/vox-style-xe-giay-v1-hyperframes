<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .hf-plate-ink {
        background-color: #141414;
        color: #F7F4EC;
      }
      .hf-text-light {
        color: #F7F4EC;
      }
      .hf-hl-orange {
        background-color: #FF6A1A;
        color: #141414;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s15"
      data-width="1080"
      data-height="1920"
      data-duration="10.64"
    >
      <!-- Background Photo Clip with Strike Entrance & Camera Zoom -->
      <div id="clip-bg" class="clip" data-start="0" data-duration="10.64" style="z-index: 1;">
        <div id="camera-zoom" style="position: absolute; inset: 0; transform-origin: 58% 46%;">
          <div id="camera-shake" style="position: absolute; inset: 0;">
            <img
              id="bg-image"
              src="assets/img-05-knife-attack-elderly-victim.jpg"
              alt="Hiện trường nhát chém vào lưng"
              style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;"
            />
          </div>
        </div>

        <!-- Strike Flash Element (Initial sharp strike flash at t=0) -->
        <div
          id="strike-flash"
          style="position: absolute; inset: 0; pointer-events: none; background-color: #141414; opacity: 1;"
        ></div>
      </div>

      <!-- Overlay 1: Label 'TIẾP CẬN BẤT NGỜ' (atMs: 110340 -> 1.96s, holdMs: 2200 -> 2.2s) -->
      <div id="clip-label-approach" class="clip" data-start="1.96" data-duration="2.2" style="z-index: 20; pointer-events: none;">
        <!-- Annotation Callout Line -->
        <svg id="callout-svg" viewBox="0 0 1080 1920" style="position: absolute; inset: 0; pointer-events: none;">
          <path
            id="callout-line"
            d="M 470 268 L 570 268 L 620 380"
            fill="none"
            stroke="#FF6A1A"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle id="callout-dot" cx="620" cy="380" r="7" fill="#FF6A1A" />
        </svg>

        <!-- Label Card on solid ink plate -->
        <div
          id="label-approach-card"
          class="hf-plate-ink"
          style="position: absolute; top: 220px; left: 60px; display: inline-flex; align-items: center; gap: 16px; padding: 18px 30px; border-left: 6px solid #FF6A1A; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.45);"
        >
          <span style="display: inline-block; width: 12px; height: 12px; border-radius: 50%; background-color: #FF6A1A; flex-shrink: 0;"></span>
          <span style="font-size: 34px; font-weight: 900; letter-spacing: 2px; line-height: 1; text-transform: uppercase;" class="hf-text-light">TIẾP CẬN BẤT NGỜ</span>
        </div>
      </div>

      <!-- Overlay 2 & 3: Punch-phrase 'NHÁT CHÉM VÀO LƯNG' + Icon 'warning' (atMs: 117600 -> 9.22s, duration: 1.42s) -->
      <div id="clip-punch" class="clip" data-start="9.22" data-duration="1.42" style="z-index: 30; pointer-events: none;">
        <div
          id="punch-wrapper"
          style="position: absolute; top: 1120px; left: 60px; right: 60px; display: flex; justify-content: center;"
        >
          <div
            id="punch-card"
            class="hf-plate-ink"
            style="width: 100%; max-width: 960px; padding: 32px 36px; border: 3px solid #FF6A1A; border-radius: 6px; box-shadow: 0 16px 48px rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; gap: 18px;"
          >
            <!-- Warning Icon (SVG Self-Drawing) -->
            <svg id="warning-icon" viewBox="0 0 100 90" width="84" height="76" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                id="warning-triangle"
                d="M 50 10 L 92 80 Q 95 85 88 85 L 12 85 Q 5 85 8 80 Z"
                stroke="#FF6A1A"
                stroke-width="7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                id="warning-bar"
                d="M 50 34 L 50 56"
                stroke="#FF6A1A"
                stroke-width="7"
                stroke-linecap="round"
              />
              <circle id="warning-dot" cx="50" cy="70" r="4.5" fill="#FF6A1A" />
            </svg>

            <!-- Punch Phrase Text -->
            <div
              id="punch-text"
              class="hf-text-light"
              style="font-size: 58px; font-weight: 900; line-height: 1.25; letter-spacing: 2px; text-transform: uppercase; text-align: center;"
            >
              NHÁT CHÉM VÀO LƯNG
            </div>
          </div>
        </div>
      </div>

      <!-- Vox Brand Bottom Orange Bar -->
      <div id="brand-bar-layer" class="clip" data-start="0" data-duration="10.64" style="pointer-events: none; z-index: 50;">
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 10px; background-color: #FF6A1A;"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1. Continuous camera zoom towards the attack point (1.0x -> 1.07x)
      tl.fromTo(
        "#camera-zoom",
        { scale: 1.0 },
        { scale: 1.07, duration: 10.64, ease: "sine.inOut" },
        0
      );

      // 2. Strike entrance transition: sudden flash + initial impact shudder
      tl.fromTo(
        "#strike-flash",
        { opacity: 1 },
        { opacity: 0, duration: 0.22, ease: "power2.out" },
        0
      );
      tl.fromTo(
        "#camera-shake",
        { x: -14, y: 10 },
        { x: 0, y: 0, duration: 0.32, ease: "power4.out" },
        0
      );

      // 3. Setup and animation for Overlay 1 ('TIẾP CẬN BẤT NGỜ' at 1.96s)
      const calloutLine = document.getElementById("callout-line");
      if (calloutLine) {
        const lineLen = calloutLine.getTotalLength();
        calloutLine.style.strokeDasharray = String(lineLen);
        calloutLine.style.strokeDashoffset = String(lineLen);
        tl.fromTo(
          calloutLine,
          { strokeDashoffset: lineLen },
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
          2.08
        );
      }
      tl.fromTo(
        "#callout-dot",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(1.5)" },
        2.5
      );
      tl.fromTo(
        "#label-approach-card",
        { x: -44, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.96
      );
      // Exit before clip ends at 4.16s
      tl.to(
        "#label-approach-card",
        { x: -24, opacity: 0, duration: 0.28, ease: "power2.in" },
        3.88
      );
      tl.to(
        ["#callout-line", "#callout-dot"],
        { opacity: 0, duration: 0.24, ease: "power2.in" },
        3.88
      );

      // 4. Setup and animation for Overlays 2 & 3 ('NHÁT CHÉM VÀO LƯNG' + warning icon at 9.22s)
      const warnTri = document.getElementById("warning-triangle");
      if (warnTri) {
        const triLen = warnTri.getTotalLength();
        warnTri.style.strokeDasharray = String(triLen);
        warnTri.style.strokeDashoffset = String(triLen);
        tl.fromTo(
          warnTri,
          { strokeDashoffset: triLen },
          { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" },
          9.25
        );
      }
      tl.fromTo(
        ["#warning-bar", "#warning-dot"],
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.22, ease: "back.out(1.5)" },
        9.42
      );
      tl.fromTo(
        "#punch-card",
        { scale: 0.88, opacity: 0, y: 28 },
        { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
        9.22
      );
      // Strike impact shudder on knife contact
      tl.fromTo(
        "#camera-shake",
        { x: 12, y: -8 },
        { x: 0, y: 0, duration: 0.28, ease: "power4.out" },
        9.22
      );

      // Register master timeline
      window.__timelines["scene-s15"] = tl;
    </script>
  
    </template>
  </body>
</html>
