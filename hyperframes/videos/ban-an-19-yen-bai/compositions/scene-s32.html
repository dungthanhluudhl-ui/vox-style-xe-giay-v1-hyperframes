    <script>
      // Prepare SVG path dash for stroke drawing
      const checkPath = document.querySelector("#check-path");
      let pathLen = 30;
      if (checkPath) {
        pathLen = checkPath.getTotalLength();
        checkPath.style.strokeDasharray = String(pathLen);
        checkPath.style.strokeDashoffset = String(pathLen);
      }

      // Initial state of timeline elements
      gsap.set("#stamp-box", { opacity: 0, scale: 2.2, rotation: -14 });
      gsap.set("#verify-badge", { opacity: 0, y: 22 });
      gsap.set("#timeline-progress-bar", { scaleX: 0 });
      gsap.set(".timeline-node", { scale: 0.8, opacity: 0 });

      // Build single paused timeline
      const tl = gsap.timeline({ paused: true });

      // 1. Camera subtle continuous zoom-in across 5.12s
      tl.fromTo(
        "#camera",
        { scale: 1 },
        { scale: 1.045, duration: 5.12, ease: "sine.inOut" },
        0
      );

      // 2. Top category header entrance
      tl.fromTo(
        "#top-header",
        { y: -26, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.05
      );

      // 3. Document 3D flip-in transition
      tl.fromTo(
        "#doc-card",
        { rotationY: -76, opacity: 0, scale: 0.88 },
        { rotationY: 0, opacity: 1, scale: 1, duration: 0.75, ease: "power3.out" },
        0.12
      );

      // 4. Staggered reveal of document content
      tl.fromTo(
        ".doc-anim-item",
        { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.42, stagger: 0.07, ease: "power2.out" },
        0.45
      );

      // 5. Timeline drawing progress
      tl.to(
        "#timeline-progress-bar",
        { scaleX: 1, duration: 0.62, ease: "power2.out" },
        0.82
      );
      tl.to(
        ".timeline-node",
        { scale: 1, opacity: 1, duration: 0.35, stagger: 0.1, ease: "power3.out" },
        0.90
      );

      // 6. Overlay 1: Stamp 'TIỀN ÁN ĐƯỢC XÓA' (atMs: 255220 -> t = 2.20s)
      tl.fromTo(
        "#stamp-box",
        { scale: 2.2, opacity: 0, rotation: -14 },
        { scale: 1, opacity: 1, rotation: -3, duration: 0.34, ease: "power4.out" },
        2.20
      );

      // 7. Overlay 2: Check icon & verification badge (atMs: 257440 -> t = 4.42s)
      tl.fromTo(
        "#verify-badge",
        { y: 22, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.32, ease: "power3.out" },
        4.42
      );

      // Animate check path drawing
      tl.fromTo(
        "#check-path",
        { strokeDashoffset: pathLen },
        { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" },
        4.48
      );

      // Register timeline on window.__timelines with root composition id
      window.__timelines["scene-s32"] = tl;
    </script>
