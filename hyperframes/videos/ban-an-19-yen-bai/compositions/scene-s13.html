<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background: #141414;
      color: #F7F4EC;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #141414;
    }

    .clip {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Fixed Vox branding bottom bar */
    #bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 14px;
      background: #FF6A1A;
      z-index: 100;
    }

    /* Full-frame map viewport */
    #map-viewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      transform-origin: 50% 25%;
    }

    #map-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: 50% 40%;
    }

    /* Unfold fold crease line (pure transition element, dissipates quickly) */
    #crease {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255, 255, 255, 0.45);
      z-index: 4;
      pointer-events: none;
    }

    /* Overlay 1: Clock Icon Badge (Vocabulary icon from Style DNA) */
    #clock-badge {
      position: absolute;
      top: 220px;
      bottom: auto;
      left: 470px;
      right: auto;
      width: 140px;
      height: 140px;
      z-index: 10;
      background-color: #141414;
      border: 3px solid #FF6A1A;
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75);
      will-change: transform, opacity;
    }

    /* Overlay 2: Diagram Plate for "LỘ TRÌNH CHUẨN BỊ" */
    #diagram-card {
      position: absolute;
      top: 420px;
      bottom: auto;
      left: 80px;
      right: 80px;
      width: auto;
      height: auto;
      z-index: 10;
      background-color: #141414;
      border: 2.5px solid #FF6A1A;
      border-radius: 24px;
      padding: 38px 44px 34px 44px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
      will-change: transform, opacity;
    }

    .card-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }

    .header-accent-bar {
      width: 90px;
      height: 5px;
      background: #FF6A1A;
      border-radius: 3px;
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 56px;
      font-weight: 900;
      color: #F7F4EC;
      line-height: 1.2;
      text-align: center;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .diagram-visual-box {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .route-svg {
      width: 100%;
      height: auto;
      overflow: visible;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s13"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="7.8"
  >
    <!-- Scene 13 main clip container -->
    <section id="scene-s13" class="clip" data-start="0" data-duration="7.8">
      
      <!-- Unfolding map viewport -->
      <div id="map-viewport" data-layout-allow-overflow="true">
        <img
          id="map-img"
          class="clip"
          src="assets/img-13-night-pursuit-map-ha-giang.jpg"
          alt="Bản đồ hiện trường đêm"
          data-start="0"
          data-duration="7.8"
        />
        <div id="crease"></div>
      </div>

      <!-- Overlay 1: Clock Icon Badge (at relative 2.93s, duration 2.0s) -->
      <div
        id="clock-badge"
        class="clip"
        data-start="2.93"
        data-duration="2"
      >
        <svg class="clock-svg" viewBox="0 0 84 84" width="84" height="84">
          <!-- Clock circle rim (drawn starting from 12 o'clock) -->
          <circle
            id="clock-rim"
            cx="42"
            cy="42"
            r="34"
            fill="none"
            stroke="#FF6A1A"
            stroke-width="5"
            style="transform-origin: 42px 42px; transform: rotate(-90deg);"
          />
          <!-- Ticks -->
          <line x1="42" y1="13" x2="42" y2="19" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
          <line x1="71" y1="42" x2="65" y2="42" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
          <line x1="42" y1="71" x2="42" y2="65" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
          <line x1="13" y1="42" x2="19" y2="42" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" />
          <!-- Center pivot -->
          <circle cx="42" cy="42" r="4.5" fill="#FF6A1A" />
          <!-- Hour hand -->
          <line
            id="hour-hand"
            x1="42"
            y1="42"
            x2="42"
            y2="24"
            stroke="#F7F4EC"
            stroke-width="4.5"
            stroke-linecap="round"
          />
          <!-- Minute hand -->
          <line
            id="minute-hand"
            x1="42"
            y1="42"
            x2="60"
            y2="42"
            stroke="#FF6A1A"
            stroke-width="3.5"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <!-- Overlay 2: Diagram Plate (at relative 3.93s, duration 3.2s) -->
      <div
        id="diagram-card"
        class="clip"
        data-start="3.93"
        data-duration="3.2"
      >
        <div class="card-header">
          <div class="header-accent-bar"></div>
          <h1 class="card-title hf-text-light">LỘ TRÌNH CHUẨN BỊ</h1>
        </div>

        <!-- Pure SVG Route Schematic Diagram -->
        <div class="diagram-visual-box">
          <svg class="route-svg" viewBox="0 0 800 160">
            <!-- Base faint guide paths -->
            <path d="M 126 70 L 368 70" stroke="rgba(247, 244, 236, 0.2)" stroke-width="4" stroke-dasharray="8 8" />
            <path d="M 432 70 L 668 70" stroke="rgba(247, 244, 236, 0.2)" stroke-width="4" stroke-dasharray="8 8" />

            <!-- Active animated route paths -->
            <path id="route-path-1" d="M 126 70 L 368 70" stroke="#FF6A1A" stroke-width="5" stroke-linecap="round" />
            <path id="arrow-1" d="M 354 60 L 368 70 L 354 80" stroke="#FF6A1A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />

            <path id="route-path-2" d="M 432 70 L 668 70" stroke="#FF6A1A" stroke-width="5" stroke-linecap="round" />
            <path id="arrow-2" d="M 654 60 L 668 70 L 654 80" stroke="#FF6A1A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />

            <!-- Node 1: Start Point -->
            <g id="node-1">
              <circle cx="100" cy="70" r="26" fill="#1C1C1C" stroke="#FF6A1A" stroke-width="3" />
              <circle cx="100" cy="70" r="10" fill="#FF6A1A" />
            </g>

            <!-- Node 2: Intermediate Waypoint -->
            <g id="node-2">
              <circle cx="400" cy="70" r="26" fill="#1C1C1C" stroke="#FF6A1A" stroke-width="3" />
              <circle cx="400" cy="70" r="10" fill="#F7F4EC" />
            </g>

            <!-- Node 3: Target Destination -->
            <g id="node-3">
              <circle cx="700" cy="70" r="26" fill="#FF6A1A" stroke="#FF6A1A" stroke-width="3" />
              <circle cx="700" cy="70" r="10" fill="#141414" />
            </g>

            <!-- Scale Ruler along bottom -->
            <g id="scale-ruler">
              <line x1="100" y1="135" x2="700" y2="135" stroke="rgba(247, 244, 236, 0.3)" stroke-width="2" />
              <line x1="100" y1="125" x2="100" y2="145" stroke="#FF6A1A" stroke-width="3" />
              <line x1="250" y1="129" x2="250" y2="141" stroke="rgba(247, 244, 236, 0.4)" stroke-width="2" />
              <line x1="400" y1="125" x2="400" y2="145" stroke="#FF6A1A" stroke-width="3" />
              <line x1="550" y1="129" x2="550" y2="141" stroke="rgba(247, 244, 236, 0.4)" stroke-width="2" />
              <line x1="700" y1="125" x2="700" y2="145" stroke="#FF6A1A" stroke-width="3" />
            </g>
          </svg>
        </div>
      </div>

      <!-- Fixed bottom orange brand bar -->
      <div id="bottom-bar"></div>
    </section>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // 1. Initial Map Unfold Entrance (t = 0.0s to 0.9s)
    tl.fromTo(
      "#map-viewport",
      {
        opacity: 0,
        scaleY: 0.25,
        scaleX: 0.9,
        transformPerspective: 1200,
        rotateX: 28,
      },
      {
        opacity: 1,
        scaleY: 1,
        scaleX: 1,
        rotateX: 0,
        duration: 0.9,
        ease: "power3.out",
      },
      0
    );

    // Fold crease line dissipates as paper opens
    tl.fromTo(
      "#crease",
      { opacity: 0.8 },
      { opacity: 0, duration: 0.85, ease: "power2.inOut" },
      0
    );

    // 2. Camera Motion: Pan from top to bottom & zoom-out (t = 0.0s to 7.8s)
    tl.fromTo(
      "#map-img",
      {
        scale: 1.30,
        y: -110,
      },
      {
        scale: 1.10,
        y: 65,
        duration: 7.8,
        ease: "none",
      },
      0
    );

    // 3. SVG Clock Icon Setup & Animation (at t = 2.93s, data-duration = 2.0s)
    const clockRim = document.getElementById("clock-rim");
    if (clockRim) {
      const rimLen = clockRim.getTotalLength();
      clockRim.style.strokeDasharray = rimLen;
      clockRim.style.strokeDashoffset = rimLen;

      // Clock badge entrance
      tl.fromTo(
        "#clock-badge",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        2.93
      );

      // Draw clock rim
      tl.to(
        clockRim,
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        3.05
      );

      // Rotating minute and hour hands to illustrate passage of preparation time
      tl.fromTo(
        "#minute-hand",
        { rotation: 0, transformOrigin: "42px 42px" },
        { rotation: 360, duration: 1.4, ease: "power2.inOut" },
        3.15
      );

      tl.fromTo(
        "#hour-hand",
        { rotation: 0, transformOrigin: "42px 42px" },
        { rotation: 60, duration: 1.4, ease: "power2.inOut" },
        3.15
      );

      // Smooth exit before data-duration boundary (4.60s to 4.90s)
      tl.to(
        "#clock-badge",
        { opacity: 0, scale: 0.85, duration: 0.3, ease: "power2.in" },
        4.60
      );
    }

    // 4. Diagram Plate "LỘ TRÌNH CHUẨN BỊ" (at t = 3.93s, data-duration = 3.2s)
    tl.fromTo(
      "#diagram-card",
      { opacity: 0, y: 40, scale: 0.94 },
      { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
      3.93
    );

    // Node 1 pops
    tl.fromTo(
      "#node-1",
      { scale: 0, opacity: 0, transformOrigin: "100px 70px" },
      { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.5)" },
      4.15
    );

    // Segment 1 draws
    const path1 = document.getElementById("route-path-1");
    if (path1) {
      const len1 = path1.getTotalLength();
      path1.style.strokeDasharray = len1;
      path1.style.strokeDashoffset = len1;
      tl.to(
        path1,
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        4.35
      );
    }

    tl.fromTo(
      "#arrow-1",
      { opacity: 0, scale: 0, transformOrigin: "368px 70px" },
      { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" },
      4.65
    );

    // Node 2 pops
    tl.fromTo(
      "#node-2",
      { scale: 0, opacity: 0, transformOrigin: "400px 70px" },
      { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.5)" },
      4.75
    );

    // Segment 2 draws
    const path2 = document.getElementById("route-path-2");
    if (path2) {
      const len2 = path2.getTotalLength();
      path2.style.strokeDasharray = len2;
      path2.style.strokeDashoffset = len2;
      tl.to(
        path2,
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        4.95
      );
    }

    tl.fromTo(
      "#arrow-2",
      { opacity: 0, scale: 0, transformOrigin: "668px 70px" },
      { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" },
      5.25
    );

    // Node 3 (Destination target) pops
    tl.fromTo(
      "#node-3",
      { scale: 0, opacity: 0, transformOrigin: "700px 70px" },
      { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.5)" },
      5.35
    );

    // Distance/Time Scale ruler reveals
    tl.fromTo(
      "#scale-ruler",
      { opacity: 0, scaleX: 0.6, transformOrigin: "400px 135px" },
      { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out" },
      5.55
    );

    // Diagram card exits smoothly before end of duration (6.75s to 7.05s)
    tl.to(
      "#diagram-card",
      { opacity: 0, y: -25, scale: 0.96, duration: 0.3, ease: "power2.in" },
      6.75
    );

    // Register paused timeline with HyperFrames runtime
    window.__timelines["scene-s13"] = tl;
  </script>

    </template>
  </body>
</html>
