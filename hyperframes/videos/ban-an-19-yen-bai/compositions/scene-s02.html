      /* Camera rig & background */
      #camera-rig {

        height: calc(100% + 100px);
        transform-origin: center center;
        will-change: transform;

        pointer-events: none;
      }

      /* Safe layout containers */
      .content-layer {
        position: absolute;
        top: 180px;

      #meter-fill {

        right: 0;

      /* Overlay 2: 13 Năm 6 Tháng & Icon Scale */

        color: #ff6a1a;

        margin-bottom: 6px;

      .sentence-title {

        font-weight: 900;
        line-height: 1.15;
        color: #f7f4ec;
        text-transform: uppercase;
        margin: 0;
      }
      .sentence-icon-box {

      .sentence-badge-row {
        display: flex;
        align-items: center;
        margin-top: 24px;
        padding-top: 20px;

      }
      .sentence-tag-text {
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      /* Permanent Bottom Orange Bar */
      .bottom-orange-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 999;
      }
    </style>

    <div

            <line

      <!-- Content Layout Layer -->
      <section

        class="clip"

      >
        <div class="content-layer">
          <!-- Lead Case Tag -->
          <div id="case-tag" class="hf-plate-ink">
            <span class="tag-label">ĐỐI NGHỊCH PHÁP LÝ</span>

          <!-- Overlay 1: THƯƠNG TÍCH 5% (atMs: 13400 -> 3.06s relative) -->
          <div id="injury-card" class="hf-plate-ink">
            <div class="card-header-row">
              <span class="card-category">HẬU QUẢ GIÁM ĐỊNH</span>

          <div id="contrast-line-wrap">

          <!-- Overlay 2: 13 NĂM 6 THÁNG & Scale Icon (atMs: 17740 -> 7.40s relative) -->
          <div id="sentence-card" class="hf-plate-ink">

      <!-- Signature Orange Bottom Bar -->

    <script>
      // Setup progressive SVG stroke paths for Justice Scale icon
      const scalePaths = document.querySelectorAll(".scale-path");
      scalePaths.forEach((path) => {
        const len = path.getTotalLength ? path.getTotalLength() : 100;
        path.style.strokeDasharray = len + 1;
        path.style.strokeDashoffset = len + 1;
      });

      // Master paused timeline
      const tl = gsap.timeline({ paused: true });

      // 1. Initial State
      tl.set("#camera-rig", { scale: 1.14, x: -20, y: 30 });
      tl.set("#case-tag", { opacity: 0, y: -24 });
      tl.set("#injury-card", { opacity: 0, scale: 0.88, y: 35 });
      tl.set("#contrast-line-wrap", { opacity: 0, scale: 0.7 });
      tl.set("#sentence-card", { opacity: 0, scale: 1.22, y: -45 });
      tl.set("#verdict-tag", { opacity: 0, x: -30 });

      // 2. Transition-in "strike" impact at t=0
      tl.to(
        "#camera-rig",
        {
          scale: 1.05,
          duration: 0.5,
          ease: "power4.out",
        },
        0,
      );

      // Camera motion: slow pan-up and pan-right across full scene (10.08s)
      tl.to(
        "#camera-rig",
        {
          y: -25,
          x: 25,
          duration: 10.08,
          ease: "none",
        },
        0,
      );

      // 3. Establish Case Tag
      tl.to(
        "#case-tag",
        {
          opacity: 1,
          y: 0,
          duration: 0.45,
          ease: "power3.out",
        },
        0.5,
      );

      // 4. Overlay 1: THƯƠNG TÍCH 5% (atMs: 13400 -> relative 3.06s)
      tl.to(
        "#injury-card",
        {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.55,
          ease: "power3.out",
        },
        3.06,
      );

      // Micro data bar expands to 5%
      tl.to(
        "#meter-fill",
        {
          width: "5%",
          duration: 0.65,
          ease: "power2.out",
        },
        3.25,
      );

      // 5. Contrast Indicator Appears
      tl.to(
        "#contrast-line-wrap",
        {
          opacity: 1,
          scale: 1,
          duration: 0.45,
          ease: "power3.out",
        },
        5.8,
      );

      // 6. Overlay 2: 13 NĂM 6 THÁNG - Heavy Judicial Strike (atMs: 17740 -> relative 7.40s)
      tl.to(
        "#sentence-card",
        {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.48,
          ease: "power4.out",
        },
        7.4,
      );

      // Verdict badge slide-in
      tl.to(
        "#verdict-tag",
        {
          opacity: 1,
          x: 0,
          duration: 0.35,
          ease: "power3.out",
        },
        7.7,
      );

      // 7. Overlay 3: Justice Scale Icon self-drawing (atMs: 18910 -> relative 8.57s)
      tl.to(
        ".scale-path",
        {
          strokeDashoffset: 0,
          duration: 0.65,
          stagger: 0.08,
          ease: "power2.out",
        },
        8.57,
      );

      // Register timeline strictly to window.__timelines["scene-s02"]
      window.__timelines["scene-s02"] = tl;
    </script>
