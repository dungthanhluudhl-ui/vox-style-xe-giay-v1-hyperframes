<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Background Photo: Covers full frame 1080x1920, keeps original colors */
      .bg-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background-color: #141414;
      }
      #bg-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 36%;
        will-change: transform;
      }

      /* Solid brand bottom bar */
      .bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 90;
      }

      /* Overlay 1: Label plate "NGHI NGỜ QUAN HỆ" */
      .label-container {
        position: absolute;
        top: 1140px;
        left: 60px;
        right: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 40;
        pointer-events: none;
      }
      .label-plate {
        display: inline-flex;
        align-items: center;
        background-color: #141414;
        border-left: 10px solid #ff6a1a;
        border-radius: 14px;
        padding: 22px 42px;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.65);
        opacity: 0;
        will-change: transform, opacity;
      }
      .label-text {
        font-family: "Be Vietnam Pro", sans-serif;
        font-size: 56px;
        font-weight: 900;
        line-height: 1.25;
        color: #f7f4ec;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* Overlay 2: Diagram & Person Icon Badge */
      .icon-container {
        position: absolute;
        top: 860px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 45;
        pointer-events: none;
      }
      .icon-plate {
        width: 190px;
        height: 190px;
        border-radius: 50%;
        background-color: #141414;
        border: 4px solid #ff6a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7);
        opacity: 0;
        will-change: transform, opacity;
      }
      .icon-svg {
        width: 140px;
        height: 140px;
      }
      .draw-stroke {
        stroke: #ff6a1a;
        fill: none;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s09"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6.76"
    >
      <section id="scene-s09" class="clip" data-start="0" data-duration="6.76">
        <!-- Background Photo Asset (original colors preserved) -->
        <div class="bg-wrapper">
          <img
            id="bg-img"
            data-layout-allow-overflow="true"
            src="assets/img-07-family-conflict-rage-motive.jpg"
            alt="Tuấn nghiến răng phẫn uất"
          />
        </div>

        <!-- Overlay 1: NGHI NGỜ QUAN HỆ -->
        <div class="label-container">
          <div id="label-card" class="label-plate">
            <span class="label-text">NGHI NGỜ QUAN HỆ</span>
          </div>
        </div>

        <!-- Overlay 2: Investigative Person Icon & Diagram Ring -->
        <div class="icon-container">
          <div id="icon-card" class="icon-plate">
            <svg class="icon-svg" viewBox="0 0 120 120">
              <!-- Precision investigation focus circle -->
              <circle
                id="ring-path"
                class="draw-stroke"
                cx="60"
                cy="60"
                r="48"
                stroke-width="3"
                style="transform-origin: 60px 60px; transform: rotate(-90deg);"
              />
              <!-- Person icon head -->
              <circle
                id="person-head"
                class="draw-stroke"
                cx="60"
                cy="43"
                r="16"
                stroke-width="5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <!-- Person icon torso -->
              <path
                id="person-body"
                class="draw-stroke"
                d="M 32 94 C 32 74, 44 66, 60 66 C 76 66, 88 74, 88 94"
                stroke-width="5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
        </div>

        <!-- Vox Signature Bottom Orange Bar -->
        <div class="bottom-bar"></div>
      </section>
    </div>

    <script>
      // Prepare SVG path lengths for deterministic progressive drawing
      const strokeElements = [
        document.getElementById("ring-path"),
        document.getElementById("person-head"),
        document.getElementById("person-body")
      ];
      strokeElements.forEach(function (el) {
        if (el && typeof el.getTotalLength === "function") {
          const len = el.getTotalLength();
          el.style.strokeDasharray = len + "";
          el.style.strokeDashoffset = len + "";
        }
      });

      // Construct paused GSAP timeline
      const tl = gsap.timeline({ paused: true });

      // 1. Zoom-through entrance & Ken Burns camera motion on background
      tl.fromTo(
        "#bg-img",
        { scale: 1.32 },
        { scale: 1.0, duration: 0.7, ease: "power3.out" },
        0
      );
      tl.to(
        "#bg-img",
        { scale: 1.08, duration: 6.06, ease: "none" },
        0.7
      );

      // 2. Overlay 1: Label "NGHI NGỜ QUAN HỆ" (at 2.65s, hold for 2.4s)
      tl.fromTo(
        "#label-card",
        { y: 32, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        2.65
      );
      tl.to(
        "#label-card",
        { y: -16, opacity: 0, duration: 0.3, ease: "power2.in" },
        4.75
      );

      // 3. Overlay 2: Person Icon & Diagram Circle (at 4.87s, hold for 1.8s)
      tl.fromTo(
        "#icon-card",
        { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        4.87
      );
      tl.to(
        "#ring-path",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        4.95
      );
      tl.to(
        "#person-head",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        5.15
      );
      tl.to(
        "#person-body",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        5.35
      );

      // Register timeline strictly to window.__timelines["scene-s09"]
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s09"] = tl;
    </script>
  
    </template>
  </body>
</html>
