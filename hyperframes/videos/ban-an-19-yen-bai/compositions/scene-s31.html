      // Single paused timeline contract on window.__timelines["scene-s31"]

      // Pre-measure SVG paths for progressive draw animation

        const len = p.getTotalLength();
        p.style.strokeDasharray = len + 1;
        p.style.strokeDashoffset = len + 1;

      // ----------------------------------------------------

        "#top-docket",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },

        "#punch-group",
        { y: 35, scale: 0.88, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power4.out" },

      );

      // Micro-impact settle on the plate metric

      );

      // ----------------------------------------------------
      // PHASE 3: Scale of Justice Icon Draw (t = 2.34s, atMs 248160)
      // ----------------------------------------------------
      tl.fromTo(
        "#diagram-container",
        { opacity: 0 },
        { opacity: 1, duration: 0.2 },
        2.2,
      );

      // Progressive SVG path stroke draw
      tl.to(
        "#path-pillar, #path-base",
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        2.34,
      );

      tl.to(
        "#path-beam",
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        2.6,
      );

      tl.to(
        ".scale-chain, .scale-pan",
        {
          strokeDashoffset: 0,
          duration: 0.6,
          stagger: 0.08,
          ease: "power2.out",
        },
        2.8,
      );

      // Cards settle in balanced position first
      tl.fromTo(
        "#card-left",
        { scale: 0.8, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        3.0,

      tl.fromTo(
        "#card-right",
        { scale: 0.8, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        3.15,
      );

      // ----------------------------------------------------
      // PHASE 4: Scale Tilting under the weight of Record (t = 3.6s)
      // Beam rotates, Left pan goes UP, Right pan goes DOWN
      // ----------------------------------------------------
      tl.to(
        "#scale-beam-group",
        {
          rotation: 8,
          transformOrigin: "500px 140px",
          duration: 0.85,
          ease: "power3.inOut",
        },
        3.6,
      );

      tl.to(
        "#card-left",
        {
          y: -38,
          duration: 0.85,
          ease: "power3.inOut",
        },
        3.6,
      );

      tl.to(

          y: 38,
          duration: 0.85,
          ease: "power3.inOut",

        "#scan-beam",
        { opacity: 0, scaleY: 0.2 },
        { opacity: 1, scaleY: 1, duration: 0.5, ease: "power2.out" },
        4.6,
      );

      tl.fromTo(
        "#scan-laser",
        { opacity: 0, y: 40 },
        { opacity: 1, y: 220, duration: 1.0, ease: "sine.inOut" },
        4.7,
      );

      // Card Right border highlight pulses
