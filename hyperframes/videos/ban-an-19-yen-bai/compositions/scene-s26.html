    <template>

      <style>
/* hf-autofix contrast (tất định, màu palette) */
.hf-cfix-s26-1 { color: #141414 !important; }
.hf-cfix-s26-2 { color: #141414 !important; }
.hf-cfix-s26-3 { color: #141414 !important; }

/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }

      *,

      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;

        height: 1920px;

      }

      /* Lưới nền ô vuông 84px chuẩn Vox DNA */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        pointer-events: none;
        z-index: 1;
      }

      /* Thanh cam nhận diện thương hiệu cố định mép đáy */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 100;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* Camera layer để thực hiện cameraMotion: pan-left */
      .camera-rig {
        position: absolute;
        inset: 0;
        z-index: 10;
        will-change: transform;
      }

      /* Khu vực nội dung trong Safe Zone [160, 1390] */
      .content-wrapper {
        position: absolute;
        top: 170px;
        left: 56px;
        right: 56px;
        height: 1210px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }

      /* Header & Punch phrase */
      .header-section {
        margin-bottom: 32px;
      }

      .category-badge {
        display: inline-flex;
        align-items: center;
        background-color: #ff6a1a;
        color: #141414;
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 1.5px;
        padding: 6px 16px;
        border-radius: 4px;
        margin-bottom: 16px;
        text-transform: uppercase;
      }

      .main-title {
        margin: 0;
        font-size: 64px;
        font-weight: 900;
        line-height: 1.18;
        color: #141414;
        letter-spacing: -1px;
      }

      /* Flow Tracker Bar: tóm tắt SÂN -> NHÀ -> HÀNG XÓM */
      .flow-summary-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 18px;
        padding: 12px 20px;
        background-color: #f5f0e4;
        border: 2px solid #141414;
        box-shadow: 4px 4px 0px #141414;
        border-radius: 8px;
        width: fit-content;
      }

      .flow-summary-text {
        font-size: 24px;
        font-weight: 900;
        color: #141414;
        letter-spacing: 0.5px;
      }

      /* Khu vực 3 chặng không gian (Diagram / Flow) */
      .diagram-stage {
        position: relative;
        flex: 1;
        margin-top: 10px;
      }

      /* Đường vẽ mũi tên kết nối SVG */
      .flow-svg-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      /* Các thẻ chặng không gian */
      .stage-card {
        position: absolute;
        width: 500px;
        background-color: #f5f0e4;
        border: 2px solid #141414;
        box-shadow: 5px 5px 0px #141414;
        border-radius: 8px;
        padding: 18px 24px;
        z-index: 2;
        transform-origin: center center;
      }

      .stage-card.step-1 {
        top: 0px;
        left: 20px;
      }

      .stage-card.step-2 {
        top: 175px;
        right: 20px;
      }

      .stage-card.step-3 {
        top: 350px;
        left: 20px;
      }

      .stage-card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }

      .stage-pill {
        background-color: #141414;
        color: #f7f4ec;
        font-size: 16px;
        font-weight: 900;
        padding: 4px 10px;
        border-radius: 4px;
        letter-spacing: 1px;
      }

      .stage-action {
        font-size: 18px;
        font-weight: 700;
        color: #ff6a1a;
      }

      .stage-name {
        margin: 0;
        font-size: 34px;
        font-weight: 900;
        color: #141414;
        line-height: 1.2;
      }

      .stage-desc {
        margin: 4px 0 0 0;
        font-size: 20px;
        font-weight: 700;
        color: #141414;
        opacity: 0.85;
      }

      /* Bức tường ngăn cách & Điểm chặn (Khách quan dừng lại) */
      .barrier-container {
        position: absolute;
        bottom: 20px;
        left: 0;
        right: 0;
        background-color: #141414;
        border-radius: 12px;
        padding: 26px 32px;
        border: 3px solid #ff6a1a;
        box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.4);
        display: flex;
        align-items: center;
        gap: 28px;
        z-index: 5;
      }

      .ban-icon-box {
        width: 104px;
        height: 104px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .ban-svg {
        width: 100px;
        height: 100px;
      }

      .barrier-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .barrier-label-tag {
        display: inline-block;
        background-color: #ff6a1a;
        color: #141414;
        font-size: 26px;
        font-weight: 900;
        padding: 6px 16px;
        border-radius: 6px;
        width: fit-content;
        letter-spacing: 0.5px;
      }

      .barrier-reason-title {
        margin: 0;
        font-size: 32px;
        font-weight: 900;
        color: #f7f4ec;
        line-height: 1.25;
      }

      .barrier-reason-sub {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        color: #ff6a1a;
        line-height: 1.3;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s26"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6.8"
    >
      <!-- Lớp lưới nền Vox DNA -->
      <div class="bg-grid"></div>

      <!-- Main Visual Clip -->
      <section id="scene-s26" class="clip" data-start="0" data-duration="6.8">
        <div class="camera-rig" id="camera-rig">
          <div class="content-wrapper">
            <!-- Header thông tin diễn tiến hành vi -->
            <div class="header-section" id="header-box">
              <div class="category-badge">DIỄN TIẾN HÀNH VI</div>
              <h1 class="main-title">TRUY SÁT LIÊN TỤC<br />QUA 3 KHÔNG GIAN</h1>
              <div class="flow-summary-bar" id="flow-summary">
                <span class="flow-summary-text">SÂN ➔ NHÀ ➔ HÀNG XÓM</span>
              </div>
            </div>

            <!-- Khung sơ đồ dòng chảy (Flow Diagram) -->
            <div class="diagram-stage">
              <!-- SVG nối đường truy đuổi -->
              <svg class="flow-svg-layer" viewBox="0 0 968 540">
                <!-- Đường 1: Từ Sân (x: 520, y: 55) sang Nhà (x: 448, y: 225) -->
                <path
                  id="path-arrow-1"
                  d="M 520 60 C 680 60, 640 225, 448 225"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="8"
                  stroke-linecap="round"
                  pathLength="100"
                  stroke-dasharray="100"
                  stroke-dashoffset="100"
                />
                <!-- Đường 2: Từ Nhà (x: 448, y: 255) sang Hàng Xóm (x: 520, y: 405) -->
                <path
                  id="path-arrow-2"
                  d="M 448 255 C 280 255, 340 405, 520 405"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="8"
                  stroke-linecap="round"
                  pathLength="100"
                  stroke-dasharray="100"
                  stroke-dashoffset="100"
                />
                <!-- Đường 3: Từ Hàng Xóm (x: 270, y: 450) cắm xuống Bức tường chắn (x: 270, y: 520) -->
                <path
                  id="path-arrow-3"
                  d="M 270 450 L 270 515"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="8"
                  stroke-linecap="round"
                  stroke-dasharray="10 8"
                  pathLength="100"
                  stroke-dashoffset="100"
                />
              </svg>

              <!-- Chặng 1: SÂN -->
              <div class="stage-card step-1" id="card-step-1">
                <div class="stage-card-top">
                  <span class="stage-pill">CHẶNG 1</span>
                  <span class="stage-action hf-cfix-s26-1">BỎ CHẠY</span>
                </div>
                <h2 class="stage-name">KHU VỰC SÂN</h2>
                <p class="stage-desc">Nạn nhân hoảng sợ tìm đường thoát</p>
              </div>

              <!-- Chặng 2: NHÀ -->
              <div class="stage-card step-2" id="card-step-2">
                <div class="stage-card-top">
                  <span class="stage-pill">CHẶNG 2</span>
                  <span class="stage-action hf-cfix-s26-2">ĐUỔI BẮT</span>
                </div>
                <h2 class="stage-name">VÀO TRONG NHÀ</h2>
                <p class="stage-desc">Tiếp tục truy lùng, không buông tha</p>
              </div>

              <!-- Chặng 3: NHÀ HÀNG XÓM -->
              <div class="stage-card step-3" id="card-step-3">
                <div class="stage-card-top">
                  <span class="stage-pill">CHẶNG 3</span>
                  <span class="stage-action hf-cfix-s26-3">TRUY SÁT TẬN CÙNG</span>
                </div>
                <h2 class="stage-name">SANG NHÀ HÀNG XÓM</h2>
                <p class="stage-desc">Đuổi sang tận khu vực nhà kế bên</p>
              </div>

              <!-- Điểm chặn: DỪNG VÌ MẤT DẤU -->
              <div class="barrier-container" id="barrier-box">
                <div class="ban-icon-box">
                  <svg class="ban-svg" viewBox="0 0 100 100">
                    <circle
                      id="ban-circle"
                      cx="50"
                      cy="50"
                      r="40"
                      fill="none"
                      stroke="#FF6A1A"
                      stroke-width="8"
                      pathLength="100"
                      stroke-dasharray="100"
                      stroke-dashoffset="100"
                    />
                    <line
                      id="ban-line"
                      x1="22"
                      y1="22"
                      x2="78"
                      y2="78"
                      stroke="#FF6A1A"
                      stroke-width="8"
                      stroke-linecap="round"
                      pathLength="100"
                      stroke-dasharray="100"
                      stroke-dashoffset="100"
                    />
                  </svg>
                </div>
                <div class="barrier-content">
                  <div class="barrier-label-tag" id="barrier-label">
                    DỪNG VÌ MẤT DẤU
                  </div>
                  <h3 class="barrier-reason-title">
                    Nạn nhân ẩn nấp thành công
                  </h3>
                  <p class="barrier-reason-sub">
                    Yếu tố khách quan — Không tự ý từ bỏ hành vi
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Dải cam thương hiệu đáy khung hình -->
      <div class="bottom-brand-bar"></div>
    </div>

    <script>
      // Khởi tạo Timeline GSAP tất định, paused: true theo chuẩn HyperFrames
      const tl = gsap.timeline({
        paused: true,
        defaults: { ease: "power3.out" },
      });

      // 1. Scene Entrance: rise nhẹ nhàng từ dưới lên (t = 0.0s -> 0.6s)
      tl.fromTo(
        "#header-box",
        { y: 36, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6 },
        0.1,
      );

      // 2. Chặng 1 xuất hiện (t = 0.4s)
      tl.fromTo(
        "#card-step-1",
        { scale: 0.85, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5 },
        0.4,
      );

      // 3. Mũi tên 1 vẽ từ Sân sang Nhà (t = 0.9s -> 1.5s)
      tl.to(
        "#path-arrow-1",
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        0.9,
      );

      // 4. Chặng 2 xuất hiện (t = 1.3s)
      tl.fromTo(
        "#card-step-2",
        { scale: 0.85, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5 },
        1.3,
      );

      // 5. Mũi tên 2 vẽ từ Nhà sang Hàng xóm (t = 1.7s -> 2.2s)
      tl.to(
        "#path-arrow-2",
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        1.7,
      );

      // 6. Chặng 3 xuất hiện đúng mốc overlay SÂN -> NHÀ -> HÀNG XÓM (t = 2.12s)
      tl.fromTo(
        "#card-step-3",
        { scale: 0.85, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5 },
        2.12,
      );

      // Nhấn mạnh thanh tổng kết chuỗi hành vi
      tl.fromTo(
        "#flow-summary",
        { scale: 0.95, backgroundColor: "#F5F0E4" },
        {
          scale: 1.04,
          backgroundColor: "#FF6A1A",
          duration: 0.35,
          yoyo: true,
          repeat: 1,
          ease: "power2.out",
        },
        2.12,
      );

      // 7. Camera motion: pan-left nhẹ (t = 2.4s -> 5.5s)
      tl.to(
        "#camera-rig",
        { x: -28, duration: 3.2, ease: "sine.inOut" },
        2.4,
      );

      // Mũi tên đứt đoạn lao xuống điểm chặn (t = 4.8s)
      tl.to(
        "#path-arrow-3",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        4.8,
      );

      // 8. Bức tường / Điểm chặn xuất hiện (t = 5.2s)
      tl.fromTo(
        "#barrier-box",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5 },
        5.2,
      );

      // 9. Icon BAN tự vẽ SVG chuẩn mốc atMs: 212800 (t = 5.70s)
      tl.to(
        "#ban-circle",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        5.7,
      );
      tl.to(
        "#ban-line",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        5.85,
      );

      // 10. Label "DỪNG VÌ MẤT DẤU" nảy vào dứt khoát mốc atMs: 212890 (t = 5.79s)
      tl.fromTo(
        "#barrier-label",
        { scale: 0.4, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        5.79,
      );

      // Đăng ký timeline chính lên HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s26"] = tl;
    </script>
  
    </template>
