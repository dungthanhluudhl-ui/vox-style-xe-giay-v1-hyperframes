<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      /* Classes màu an toàn theo WCAG từ style-tokens.json */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #141414;
        color: #F7F4EC;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #141414;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Layer ảnh nền toàn khung (background-photo 1080x1920, giữ nguyên màu gốc) */
      .bg-wrapper {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        transform-origin: 35% 55%;
      }
      .bg-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: 35% 55%;
      }

      /* Vùng an toàn & căn giữa nội dung overlay */
      .overlay-container {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 450px;
        pointer-events: none;
      }

      /* Thẻ Punch-phrase: BÀ HƯƠNG ĐÃ CHẠY THOÁT */
      .punch-card {
        width: 940px;
        background-color: #141414;
        border: 4px solid #FF6A1A;
        border-radius: 20px;
        padding: 36px 42px;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 32px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
      }
      .check-badge {
        flex-shrink: 0;
        width: 88px;
        height: 88px;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: 50% 50%;
      }
      .check-svg {
        width: 88px;
        height: 88px;
        display: block;
      }
      .punch-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .punch-phrase {
        font-size: 54px;
        font-weight: 900;
        line-height: 1.26;
        color: #F7F4EC;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* Thẻ Label kết bài: RANH GIỚI SINH TỬ */
      .label-card {
        width: 900px;
        background-color: #141414;
        border: 4px solid #FF6A1A;
        border-radius: 20px;
        padding: 44px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        box-shadow: 0 28px 64px rgba(0, 0, 0, 0.8);
      }
      .label-rule-line {
        display: block;
        width: 140px;
        height: 4px;
        background-color: #F7F4EC;
        transform-origin: center center;
      }
      .label-phrase {
        font-size: 64px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: 4px;
        color: #FF6A1A;
        text-align: center;
        text-transform: uppercase;
      }

      /* Thanh cam nhận diện cố định ở đáy khung hình (Style DNA signature) */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s39"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="10.08"
    >
      <!-- Shot S39-1: Background photo (img-18) với camera zoom-out và hiệu ứng wobble-drop -->
      <section id="scene-bg" class="clip" data-start="0" data-duration="10.08">
        <div id="bg-wrapper" class="bg-wrapper">
          <img
            id="bg-img"
            class="bg-img"
            src="assets/img-18-victim-hiding-suspect-police-station.jpg"
            alt="Nạn nhân trốn sau gian bếp"
          />
        </div>
      </section>

      <!-- Overlay 1 & 2: Punch phrase "BÀ HƯƠNG ĐÃ CHẠY THOÁT" + Check Icon tự vẽ -->
      <section id="clip-punch" class="clip" data-start="2.61" data-duration="2.59">
        <div class="overlay-container">
          <div id="punch-card" class="punch-card hf-plate-ink">
            <div id="check-badge" class="check-badge">
              <svg class="check-svg" viewBox="0 0 100 100">
                <circle class="check-circle" cx="50" cy="50" r="42" fill="none" stroke="#FF6A1A" stroke-width="8" />
                <path class="check-path" d="M 28 52 L 44 68 L 74 34" fill="none" stroke="#F7F4EC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
            <div class="punch-content">
              <div class="punch-phrase">BÀ HƯƠNG ĐÃ CHẠY THOÁT</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Overlay 3: Label "RANH GIỚI SINH TỬ" -->
      <section id="clip-label" class="clip" data-start="6.80" data-duration="2.40">
        <div class="overlay-container">
          <div id="label-card" class="label-card hf-plate-ink">
            <div id="label-line-top" class="label-rule-line"></div>
            <div class="label-phrase">RANH GIỚI SINH TỬ</div>
            <div id="label-line-bottom" class="label-rule-line"></div>
          </div>
        </div>
      </section>

      <!-- Thanh cam đáy cố định nhận diện thương hiệu -->
      <div class="bottom-brand-bar"></div>
    </div>

    <script>
      // Khởi tạo đo đạc SVG path cho check icon
      const checkPath = document.querySelector(".check-path");
      const checkCircle = document.querySelector(".check-circle");
      if (checkPath && checkCircle) {
        const pathLen = checkPath.getTotalLength();
        checkPath.style.strokeDasharray = String(pathLen);
        checkPath.style.strokeDashoffset = String(pathLen);

        const circleLen = checkCircle.getTotalLength();
        checkCircle.style.strokeDasharray = String(circleLen);
        checkCircle.style.strokeDashoffset = String(circleLen);
      }

      // Xây dựng timeline GSAP duy nhất, seek-safe và tất định
      const tl = gsap.timeline({ paused: true });

      // 1. Vào cảnh: Wobble-drop trên wrapper (t=0 -> 0.75s)
      tl.fromTo(
        "#bg-wrapper",
        { y: -45, rotation: 1.0, opacity: 0.8 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
        0
      );

      // 2. Camera motion: Zoom-out chậm từ 1.05x về 1.0x xuyên suốt toàn bộ scene
      tl.fromTo(
        "#bg-img",
        { scale: 1.05 },
        { scale: 1.0, duration: 10.08, ease: "none" },
        0
      );

      // 3. Overlay 1: Punch phrase "BÀ HƯƠNG ĐÃ CHẠY THOÁT" xuất hiện tại t=2.61s
      tl.fromTo(
        "#punch-card",
        { scale: 0.9, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
        2.61
      );

      // 4. Overlay 2: Check icon vẽ đường viền và nét check tại t=3.40s
      if (checkCircle && checkPath) {
        tl.to(
          checkCircle,
          { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
          3.40
        );
        tl.to(
          checkPath,
          { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
          3.65
        );
        tl.fromTo(
          "#check-badge",
          { scale: 1 },
          { scale: 1.14, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out" },
          3.90
        );
      }

      // 5. Punch-card biến mất êm ái trước khi hết thời gian clip
      tl.to(
        "#punch-card",
        { opacity: 0, y: -20, duration: 0.22, ease: "power2.in" },
        4.95
      );

      // 6. Overlay 3: Label "RANH GIỚI SINH TỬ" xuất hiện tại t=6.80s
      tl.fromTo(
        "#label-card",
        { scale: 0.88, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.52, ease: "power3.out" },
        6.80
      );
      tl.fromTo(
        ["#label-line-top", "#label-line-bottom"],
        { scaleX: 0 },
        { scaleX: 1, duration: 0.38, ease: "power2.out" },
        7.05
      );
      tl.to(
        "#label-card",
        { opacity: 0, y: -15, duration: 0.24, ease: "power2.in" },
        8.95
      );

      // Đăng ký timeline cho HyperFrames runtime
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s39"] = tl;
    </script>
  
    </template>
  </body>
</html>
