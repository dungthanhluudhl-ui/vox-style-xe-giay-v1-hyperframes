      }

      #brand-bottom-bar {

        height: 12px;

    <script>
      const tl = gsap.timeline({ paused: true });

      // Camera motion: slow Ken Burns zoom-in focusing on the anxious gaze
      tl.fromTo(
        "#hero-img",
        { scale: 1.0 },
        { scale: 1.06, duration: 6.67, ease: "none" },
        0
      );

      // Overlay 1: Punch Phrase reveal and exit
      tl.fromTo(
        "#punch-card-box",
        { scale: 0.85, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.62

      tl.to(
        "#punch-card-box",
        { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" },
        3.75
      );

      // Overlay 2: Icon "ban" pop & SVG path draw
      tl.fromTo(
        "#icon-ban-box",
        { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
        2.32
      );
      tl.fromTo(
        "#ban-circle",
        { strokeDashoffset: 252 },
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        2.32
      );
      tl.fromTo(
        "#ban-line",
        { strokeDashoffset: 68 },
        { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
        2.52
      );
      tl.to(
        "#icon-ban-box",
        { opacity: 0, scale: 0.7, duration: 0.35, ease: "power2.in" },
        3.75
      );

      // Overlay 3: Label "BẢN CHẤT HÀNH VI" entrance
      tl.fromTo(
        "#label-box",
        { scale: 0.88, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        5.04
      );

      // Register master timeline on window.__timelines
      window.__timelines["scene-s38"] = tl;
