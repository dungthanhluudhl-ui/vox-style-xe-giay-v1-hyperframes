<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #f5f0e4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f5f0e4;
      }

      /* Chuẩn HyperFrames: .clip luôn full canvas inset: 0, không set width/height cố định */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Camera rig & background photo */
      .camera-rig {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform-origin: 50% 45%;
        will-change: transform;
      }

      .hero-image {
        position: absolute;
        top: -8%;
        left: -8%;
        width: 116%;
        height: 116%;
        object-fit: cover;
        display: block;
      }

      /* Dải cam chữ ký thương hiệu ở mép đáy */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 10px;
        background: #ff6a1a;
        z-index: 100;
      }

      /* Tiêu đề chính: 3 TÌNH TIẾT GIẢM NHẸ (solid ink plate, onDarkText) */
      .plate-header {
        position: absolute;
        top: 220px;
        left: 60px;
        width: 960px;
        height: 96px;
        background: #141414;
        border-left: 12px solid #ff6a1a;
        padding: 0 32px;
        border-radius: 6px;
        box-shadow: 0 16px 36px rgba(20, 20, 20, 0.45);
        display: flex;
        align-items: center;
        will-change: transform, opacity;
      }

      .plate-header-text {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 46px;
        line-height: 1.2;
        color: #f7f4ec;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin: 0;
      }

      /* Nhãn tình tiết dạng thẻ giấy phẳng (solid card paper plate, ink text) */
      .plate-sub {
        position: absolute;
        left: 60px;
        width: 960px;
        height: 88px;
        background: #f5f0e4;
        border: 4px solid #141414;
        border-radius: 6px;
        padding: 0 28px;
        display: flex;
        align-items: center;
        gap: 20px;
        box-shadow: 0 14px 30px rgba(20, 20, 20, 0.35);
        will-change: transform, opacity;
      }

      /* Thanh chỉ báo cam trên thẻ */
      .indicator-bar {
        width: 8px;
        height: 48px;
        background: #ff6a1a;
        border-radius: 2px;
        flex-shrink: 0;
      }

      .plate-sub-text {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 38px;
        line-height: 1.2;
        color: #141414;
        letter-spacing: 0.5px;
        margin: 0;
      }

      /* Tình tiết 1: Đầu thú & Khai báo */
      #overlay-item1 {
        top: 340px;
      }

      /* Tình tiết: Bồi thường viện phí (dành chỗ cho icon check bên phải) */
      .plate-sub-compact {
        position: absolute;
        top: 452px;
        left: 60px;
        width: 760px;
        height: 88px;
        background: #f5f0e4;
        border: 4px solid #141414;
        border-radius: 6px;
        padding: 0 28px;
        display: flex;
        align-items: center;
        gap: 20px;
        box-shadow: 0 14px 30px rgba(20, 20, 20, 0.35);
        will-change: transform, opacity;
      }

      /* Icon check vẽ nét tự động trên nền mực đặc (tương phản 6.4:1 WCAG chuẩn) */
      .check-badge {
        position: absolute;
        top: 452px;
        left: 840px;
        width: 180px;
        height: 88px;
        background: #141414;
        border: 4px solid #ff6a1a;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 14px 30px rgba(20, 20, 20, 0.35);
        will-change: transform, opacity;
      }

      .check-svg {
        display: block;
      }

      #check-path {
        fill: none;
        stroke: #ff6a1a;
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s30"
      data-width="1080"
      data-height="1920"
      data-duration="10"
    >
      <!-- Shot 1: Background photo (img-06) phủ toàn khung hình, pan & wobble-drop -->
      <section id="shot-1" class="clip" data-start="0" data-duration="10">
        <div id="camera-rig" class="camera-rig" data-layout-allow-overflow="true">
          <img
            id="main-image"
            src="assets/img-06-remorseful-defendant-mitigating-evidence.jpg"
            alt="Bị cáo ăn năn và chứng từ giảm nhẹ"
            class="hero-image"
            data-layout-allow-overflow="true"
          />
        </div>
      </section>

      <!-- Tiêu đề: 3 TÌNH TIẾT GIẢM NHẸ (t = 3.0s -> 10.0s) -->
      <div id="clip-header" class="clip" data-start="3.0" data-duration="7.0" style="z-index: 10;">
        <div id="overlay-header" class="plate-header">
          <h2 class="plate-header-text">3 TÌNH TIẾT GIẢM NHẸ</h2>
        </div>
      </div>

      <!-- Tình tiết: ĐẦU THÚ • KHAI BÁO (t = 3.72s -> 10.0s) -->
      <div id="clip-item-1" class="clip" data-start="3.72" data-duration="6.28" style="z-index: 11;">
        <div id="overlay-item1" class="plate-sub">
          <span class="indicator-bar"></span>
          <div class="plate-sub-text">ĐẦU THÚ • KHAI BÁO</div>
        </div>
      </div>

      <!-- Tình tiết: BỒI THƯỜNG VIỆN PHÍ (t = 8.28s -> 10.0s) -->
      <div id="clip-item-2" class="clip" data-start="8.28" data-duration="1.72" style="z-index: 12;">
        <div id="overlay-item2" class="plate-sub-compact">
          <span class="indicator-bar"></span>
          <div class="plate-sub-text">BỒI THƯỜNG VIỆN PHÍ</div>
        </div>
      </div>

      <!-- Icon Check xác nhận hoàn tất bồi thường (t = 8.82s -> 10.0s) -->
      <div id="clip-check" class="clip" data-start="8.82" data-duration="1.18" style="z-index: 14;">
        <div id="icon-check-container" class="check-badge">
          <svg class="check-svg" viewBox="0 0 64 64" width="52" height="52">
            <path id="check-path" d="M 14 32 L 27 45 L 50 19" />
          </svg>
        </div>
      </div>

      <!-- Dải cam đáy cố định không ảnh hưởng bởi camera pan/zoom -->
      <div class="bottom-brand-bar"></div>
    </div>

    <script>
      // Chuẩn bị đường nét tự vẽ cho biểu tượng check
      const checkPath = document.getElementById("check-path");
      if (checkPath) {
        const len = checkPath.getTotalLength();
        checkPath.style.strokeDasharray = len;
        checkPath.style.strokeDashoffset = len;
      }

      // Khởi tạo GSAP timeline chính, bắt buộc paused: true
      const tl = gsap.timeline({ paused: true });

      // 1. Camera wobble-drop entrance (0.0s - 1.3s)
      tl.fromTo(
        "#camera-rig",
        { y: -60, rotation: 1.2, scale: 1.07 },
        { y: 0, rotation: 0, scale: 1.02, duration: 1.3, ease: "power2.out" },
        0
      );

      // Camera pan liên tục theo kịch bản: hướng lên trên và chếch sang trái
      tl.to(
        "#camera-rig",
        { y: -50, x: -35, scale: 1.06, duration: 8.7, ease: "sine.inOut" },
        1.3
      );

      // 2. Tiêu đề "3 TÌNH TIẾT GIẢM NHẸ" xuất hiện lúc 3.0s
      tl.fromTo(
        "#overlay-header",
        { y: 36, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        3.0
      );

      // 3. Tình tiết: "ĐẦU THÚ • KHAI BÁO" xuất hiện lúc 3.72s
      tl.fromTo(
        "#overlay-item1",
        { y: 28, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        3.72
      );

      // 4. Tình tiết: "BỒI THƯỜNG VIỆN PHÍ" xuất hiện lúc 8.28s
      tl.fromTo(
        "#overlay-item2",
        { y: 28, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        8.28
      );

      // 5. Icon Checkbox & SVG Path draw hoàn tất danh sách (8.82s)
      tl.fromTo(
        "#icon-check-container",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        8.82
      );
      tl.to(
        "#check-path",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        8.95
      );

      // Đăng ký timeline cho HyperFrames seek runtime
      window.__timelines["scene-s30"] = tl;
    </script>
  
    </template>
  </body>
</html>
