  <script>
    // Khởi tạo Timeline HyperFrames chính thức (paused: true)
    const tl = gsap.timeline({ paused: true });

    // 1. Camera zoom-in motion mượt mà suốt thời lượng 5.96s
    tl.fromTo("#camera-wrapper", 
      { scale: 0.96 }, 
      { scale: 1.03, duration: 5.96, ease: "none" }, 
      0
    );

    // 2. Entrance (0.0s -> 1.0s): Grow bối cảnh bản đồ và hồ sơ
    tl.fromTo("#header-bar",
      { opacity: 0, y: -20 },
      { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
      0.1
    );

    tl.fromTo("#map-frame",
      { scale: 0.88, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.8, ease: "power3.out" },
      0.15
    );

    // Vẽ đường ranh giới tỉnh Yên Bái
    const ybPath = document.getElementById("yen-bai-boundary");
    if (ybPath) {
      const len = ybPath.getTotalLength();
      ybPath.style.strokeDasharray = len;
      tl.fromTo(ybPath, 
        { strokeDashoffset: len }, 
        { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, 
        0.3
      );
    }

    // Target pin tại Yên Bái
    tl.fromTo("#pin-target",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.7
    );

    tl.fromTo("#map-stamp",
      { y: 15, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.9
    );

    // 3. Info Card Entrance: xuất hiện đồng bộ
    tl.fromTo("#info-card",
      { y: 40, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
      1.1
    );

    // 4. OVERLAY 1: Icon Clock & Hand Animation (atMs 35880 -> relative 1.98s)
    // Đồng hồ xoay kim tới 21:00 (Kim giờ dừng ở 9h = 270deg, Kim phút quay 2 vòng dừng ở 12h = 720deg)
    tl.fromTo("#clock-col",
      { scale: 0.8, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
      1.98
    );

    tl.fromTo("#hour-hand",
      { rotation: 0 },
      { rotation: 270, duration: 1.2, ease: "power2.out" },
      1.98
    );

    tl.fromTo("#minute-hand",
      { rotation: 0 },
      { rotation: 720, duration: 1.4, ease: "power2.out" },
      1.98
    );

    // 5. OVERLAY 2: Label "YÊN BÁI • 21:00" Punch Text (atMs 36910 -> relative 3.01s)
    tl.fromTo("#badge-datetime",
      { y: -14, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      3.01
    );

    tl.fromTo("#main-punch-text",
      { scale: 0.9, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      3.15
    );

    tl.fromTo("#divider-line",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.5, ease: "power2.out" },
      3.35
    );

    tl.fromTo("#sub-punch-text",
      { opacity: 0, y: 10 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
      3.45
    );

    // 6. OVERLAY 3: Pin Highlight Pulse (atMs 39250 -> relative 5.35s)
    tl.fromTo("#pin-overlay-highlight",
      { scale: 0.3, opacity: 0 },
      { scale: 1.15, opacity: 1, duration: 0.35, ease: "power3.out" },
      5.35
    );

    tl.to("#pin-overlay-highlight",
      { scale: 1.0, duration: 0.2, ease: "power2.out" },
      5.70
    );

    // Đăng ký timeline cho seek engine HyperFrames
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s05"] = tl;
  </script>
