      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Safe Color Plates (WCAG Compliant) */
      .hf-plate-ink {
        background-color: #141414;
        color: #F7F4EC;
      }
      .hf-plate-ink-orange {
        background-color: #141414;
        color: #FF6A1A;

      .hf-plate-paper {

      }
      .hf-text-ink {
        color: #141414;
      }
      .hf-text-light {
        color: #F7F4EC;

      /* Photo Layer (Full canvas cover with pan-right) */
      #photo-container {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #141414;
      }
      #photo-img {
        position: absolute;
        top: 0;

      /* Strike Transition Blade */
      #strike-layer {

        position: absolute;

        font-size: 20px;

      .case-tag-sub {

      }

        font-size: 20px;
        font-weight: 700;

        justify-content: space-between;
        border-bottom: 2px solid rgba(247, 244, 236, 0.15);
        padding-bottom: 14px;
      }
      .diagram-title {
        font-size: 38px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 1.5px;
      }
      .diagram-tag {
        background: #FF6A1A;
        color: #141414;
        font-size: 16px;
        font-weight: 900;
        padding: 4px 12px;
        border-radius: 4px;
      }
      .diagram-steps {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .diagram-step-row {
        display: flex;
        align-items: center;
        gap: 16px;
        background: #1f1f1f;
        padding: 12px 18px;
        border-radius: 6px;
        border-left: 4px solid #FF6A1A;
      }
      .step-num {
        width: 40px;
        height: 40px;
        background: #FF6A1A;
        color: #141414;
        font-size: 20px;
        font-weight: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        flex-shrink: 0;
      }
      .step-content {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .step-name {
        font-size: 24px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 0.5px;
      }
      .step-desc {
        font-size: 17px;
        font-weight: 700;

      }

      /* Overlay 3: Punch-phrase - VÙNG TRỌNG YẾU CƠ THỂ */
      #overlay-punch-clip {

      }

      .punch-headline {

        color: #F7F4EC;
        letter-spacing: 1.5px;
      }
      .punch-sub {
        font-size: 24px;
        font-weight: 700;
        color: #FF6A1A;
        letter-spacing: 1px;

      /* Bottom Brand Signature Bar */
      #bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 10px;
        background: #FF6A1A;
        z-index: 999;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s25"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="11.2"
    >
      <!-- Background Photo (img-15: 3 Panels Crime Scene Reconstruction) -->
      <section id="bg-shot" class="clip" data-start="0" data-duration="11.2">
        <div id="photo-container">
          <img
            id="photo-img"
            src="assets/img-15-crime-scene-reconstruction-panels.jpg"
            alt="Hiện trường 3 panel tái hiện hành vi"
            data-layout-allow-overflow="true"
          />
        </div>
        <div id="spotlight-vignette"></div>
        <div id="gradient-scrim"></div>
      </section>

      <!-- Strike Transition Layer -->
      <div id="strike-layer">
        <div class="strike-blade"></div>
      </div>

      <!-- Persistent Case Header (at Y: 180px - 232px) -->
      <section id="case-header-clip" class="clip" data-start="0.3" data-duration="10.9">
        <div class="case-header-bar">
          <div class="case-tag-pill">
            <span class="case-tag-label">CHỨNG CỨ HÀNH VI</span>
            <span class="case-tag-sub">• HỒ SƠ VỤ ÁN</span>
          </div>
        </div>
      </section>

      <!-- Overlay 1: Label - Ý ĐỊNH TƯỚC MẠNG (at Y: 260px - 380px) -->
      <section id="overlay-label-clip" class="clip" data-start="3.0" data-duration="2.4">
        <div class="label-card">
          <div class="label-card-meta">
            <span class="label-badge">CHỨNG CỨ 01</span>
            <span class="label-phase">TUYÊN BỐ TRƯỚC KHI RỜI ĐI</span>
          </div>
          <div class="label-main-text">Ý ĐỊNH TƯỚC MẠNG</div>

      <!-- Overlay 2: Diagram - 3 DẤU HIỆU CẤU THÀNH (at Y: 420px - 700px) -->
      <section id="overlay-diagram-clip" class="clip" data-start="5.26" data-duration="4.5">
        <div class="diagram-card">
          <div class="diagram-header">
            <span class="diagram-title">3 DẤU HIỆU CẤU THÀNH</span>
            <span class="diagram-tag">CHỨNG CỨ TÁI HIỆN</span>
          </div>
          <div class="diagram-steps">
            <div id="step-1" class="diagram-step-row">
              <div class="step-num">01</div>
              <div class="step-content">
                <span class="step-name">LỜI ĐE DỌA</span>
                <span class="step-desc">Tuyên bố rõ ý định giết</span>
              </div>
            </div>
            <div id="step-2" class="diagram-step-row">
              <div class="step-num">02</div>
              <div class="step-content">
                <span class="step-name">DAO NHỌN</span>
                <span class="step-desc">Chủ động mang theo hung khí nguy hiểm</span>

            <div id="step-3" class="diagram-step-row">
              <div class="step-num">03</div>
              <div class="step-content">
                <span class="step-name">ĐÂM VÀO BỤNG</span>
                <span class="step-desc">Tấn công trực diện vị trí trọng yếu</span>
              </div>

      <!-- Overlay 3: Punch-phrase - VÙNG TRỌNG YẾU CƠ THỂ (at Y: 800px - 992px) -->
      <section id="overlay-punch-clip" class="clip" data-start="9.59" data-duration="1.61">
        <div class="punch-card">
          <div class="punch-headline">VÙNG TRỌNG YẾU CƠ THỂ</div>
          <div class="punch-sub">HÀNH VI NGUY HIỂM ĐẾN TÍNH MẠNG</div>
        </div>

      <div id="bottom-brand-bar"></div>

    <script>
      // Single paused timeline registered on window.__timelines["scene-s25"]
      const tl = gsap.timeline({ paused: true });

      // Camera motion: pan-right across 3 reconstruction panels
      // scale: 1.35 gives sufficient margin to pan from +160px (Panel 1) to -160px (Panel 3)
      tl.fromTo(
        "#photo-img",
        { scale: 1.35, x: 160, y: 0 },
        { scale: 1.35, x: -160, y: 0, duration: 11.2, ease: "none" },
        0
      );

      // Strike Transition at entry
      tl.fromTo(
        ".strike-blade",
        { x: -500, y: -300, opacity: 0.95 },
        { x: 1500, y: 900, opacity: 0, duration: 0.4, ease: "power4.out" },
        0
      );

      // Case Header reveal
      tl.fromTo(
        ".case-header-bar",
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.3
      );

      // Overlay 1: Label "Ý ĐỊNH TƯỚC MẠNG" (3.0s - 5.4s)
      tl.fromTo(
        ".label-card",
        { opacity: 0, x: -50 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
        3.0
      );
      tl.to(
        ".label-card",
        { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" },
        5.1
      );

      // Overlay 2: Diagram "3 DẤU HIỆU CẤU THÀNH" (5.26s - 9.76s)
      tl.fromTo(
        ".diagram-card",
        { opacity: 0, y: 40 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        5.26
      );
      tl.fromTo(
        "#step-1",
        { opacity: 0, x: -30 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
        5.6
      );
      tl.fromTo(
        "#step-2",
        { opacity: 0, x: -30 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
        6.4
      );
      tl.fromTo(
        "#step-3",
        { opacity: 0, x: -30 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
        7.3
      );
      tl.to(
        ".diagram-card",
        { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" },
        9.35
      );

      // Overlay 3: Punch-phrase "VÙNG TRỌNG YẾU CƠ THỂ" (9.59s - 11.2s)
      tl.fromTo(
        ".punch-card",
        { opacity: 0, scale: 0.92, y: 30 },
        { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" },
        9.59
      );

      // Register master timeline
      window.__timelines["scene-s25"] = tl;
    </script>
  
    </template>
