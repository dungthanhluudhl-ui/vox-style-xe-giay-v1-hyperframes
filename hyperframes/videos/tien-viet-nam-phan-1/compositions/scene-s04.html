  <script>
    // Progressive SVG path stroke setup for deterministic draw animations
    document.querySelectorAll(".draw-path-fall-1, .draw-path-fall-2, .draw-path-warn-1, .draw-path-warn-2").forEach(function(path) {
      var len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = len;
    });

    // Master seekable GSAP timeline
    const tl = gsap.timeline({ paused: true });

    // ==========================================
    // SHOT 1 CHOREOGRAPHY (0.0s - 3.05s)
    // ==========================================

    // Video 01 Camera: punch slam entrance at 0.0s, followed by gentle zoom
    tl.fromTo("#vid-01",
      { scale: 1.16, rotation: -1.2 },
      { scale: 1.0, rotation: 0, duration: 0.5, ease: "power4.out" },
      0
    );
    tl.to("#vid-01",
      { scale: 1.08, duration: 2.55, ease: "none" },
      0.5
    );

    // Punch Phrase: "CƠN LỐC SỐ 0" (Cue: 28500ms -> 0.35s local, hold ~1.85s -> exit ~2.2s)
    tl.fromTo("#punch-card",
      { scale: 0.35, opacity: 0, y: -35, rotation: -2.5 },
      { scale: 1, opacity: 1, y: 0, rotation: -1.0, duration: 0.45, ease: "power3.out" },
      0.35
    );
    tl.to("#punch-card",
      { opacity: 0, scale: 0.95, y: -15, duration: 0.25, ease: "power2.in" },
      2.2
    );

    // Icon Fall + Badge (Cue: 29500ms -> 1.35s local, hold 1.5s -> exit ~2.85s)
    tl.fromTo("#fall-card",
      { opacity: 0, y: 30, scale: 0.9 },
      { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power3.out" },
      1.35
    );
    tl.to(".draw-path-fall-1",
      { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
      1.45
    );
    tl.to(".draw-path-fall-2",
      { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
      1.8
    );
    tl.to("#fall-card",
      { opacity: 0, scale: 0.95, duration: 0.2, ease: "power2.in" },
      2.85
    );

    // ==========================================
    // SHOT 2 CHOREOGRAPHY (3.05s - 6.21s)
    // ==========================================

    // Image 02 Camera: Ken Burns Pan-up along surging red inflation curve
    tl.fromTo("#img-02",
      { y: 55, scale: 1.06 },
      { y: -30, scale: 1.14, duration: 3.16, ease: "sine.inOut" },
      3.05
    );

    // Label: "SIÊU LẠM PHÁT" (Cue: 31800ms -> 3.65s local, hold ~1.55s -> exit ~5.2s)
    tl.fromTo("#label-hyperinflation",
      { scale: 0.8, opacity: 0, x: -40, rotation: -2.5 },
      { scale: 1, opacity: 1, x: 0, rotation: -1.0, duration: 0.4, ease: "power3.out" },
      3.65
    );
    tl.to("#label-hyperinflation",
      { opacity: 0, x: -20, duration: 0.25, ease: "power2.in" },
      5.2
    );

    // Icon Warning Badge (Cue: 32200ms -> 4.05s local, hold 1.55s -> exit ~5.6s)
    tl.fromTo("#warning-badge",
      { scale: 0.65, opacity: 0, y: 20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
      4.05
    );
    tl.to(".draw-path-warn-1",
      { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
      4.15
    );
    tl.to(".draw-path-warn-2",
      { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
      4.45
    );
    tl.to("#warning-badge",
      { opacity: 0, scale: 0.9, duration: 0.25, ease: "power2.in" },
      5.6
    );

    // Label: "GIAI ĐOẠN 1985-1988" (Cue: 32600ms -> 4.45s local, holds through end of scene)
    tl.fromTo("#label-period",
      { scale: 0.85, opacity: 0, y: 30, rotation: 1.6 },
      { scale: 1, opacity: 1, y: 0, rotation: 0.8, duration: 0.45, ease: "power3.out" },
      4.45
    );

    // Single source of truth paused timeline registration
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s04"] = tl;
  </script>
