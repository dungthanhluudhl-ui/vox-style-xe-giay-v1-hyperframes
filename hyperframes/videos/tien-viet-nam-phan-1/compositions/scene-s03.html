<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }

      /* =========================================================
         BACKGROUND LAYER (Spotlight Variant + Grid 84px)
         ========================================================= */
      .bg-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }

      .grid-pattern {
        position: absolute;
        inset: 0;
        background-size: 84px 84px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px);
      }

      /* Spotlight radial vignette: archival paper focal highlight */
      .spotlight-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 48%,
          rgba(231, 227, 217, 0) 30%,
          rgba(20, 20, 20, 0.44) 72%,
          rgba(15, 15, 15, 0.9) 100%
        );
      }

      /* Tactile paper grain */
      .grain-overlay {
        position: absolute;
        inset: 0;
        opacity: 0.18;
        mix-blend-mode: multiply;
        background-image: radial-gradient(#141414 0.75px, transparent 0.75px);
        background-size: 4px 4px;
      }

      /* Signature persistent orange bar at bottom edge */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 50;
      }

      /* =========================================================
         HYPERFRAMES TIMED CLIP CONTRACT (Always inset: 0)
         ========================================================= */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* =========================================================
         SHOT 1 - VIDEO MEDIA
         Note: <video> omits class="clip" as per core contract.
         ========================================================= */
      #shot1-video {
        position: absolute;
        top: 360px;
        left: 110px;
        width: 860px;
        height: 1040px;
        object-fit: cover;
        background-color: #141414;
        border: 4px solid #141414;
        border-radius: 6px;
        box-shadow:
          14px 18px 0px rgba(20, 20, 20, 0.85),
          0px 24px 48px rgba(0, 0, 0, 0.45);
        z-index: 10;
        pointer-events: none;
      }

      /* Decorative tape elements for Shot 1 inside #shot1-tape-layer */
      .tape-shot1-top {
        position: absolute;
        top: 344px;
        left: 470px;
        width: 140px;
        height: 36px;
        background: rgba(245, 240, 228, 0.94);
        border: 1px dashed rgba(20, 20, 20, 0.35);
        transform: rotate(-2deg);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        z-index: 15;
      }

      .tape-shot1-corner {
        position: absolute;
        top: 1388px;
        left: 810px;
        width: 120px;
        height: 32px;
        background: rgba(255, 106, 26, 0.9);
        transform: rotate(3deg);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        z-index: 15;
      }

      /* =========================================================
         SHOT 2 - ARCHIVAL DOCUMENT CARD
         ========================================================= */
      .media-container {
        position: absolute;
        top: 360px;
        left: 110px;
        width: 860px;
        height: 1040px;
        background-color: #141414;
        border: 4px solid #141414;
        border-radius: 6px;
        box-shadow:
          14px 18px 0px rgba(20, 20, 20, 0.85),
          0px 24px 48px rgba(0, 0, 0, 0.45);
        z-index: 10;
        transform-origin: 50% 50%;
      }

      .media-content {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        border-radius: 2px;
      }

      .tape-shot2-top {
        position: absolute;
        top: -16px;
        left: 360px;
        width: 140px;
        height: 36px;
        background: rgba(245, 240, 228, 0.94);
        border: 1px dashed rgba(20, 20, 20, 0.35);
        transform: rotate(-2deg);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        z-index: 15;
      }

      .tape-shot2-corner {
        position: absolute;
        bottom: -14px;
        right: -16px;
        width: 120px;
        height: 32px;
        background: rgba(255, 106, 26, 0.9);
        transform: rotate(3deg);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        z-index: 15;
      }

      /* =========================================================
         HEADER OVERLAY ZONE (Flex centered at top: 180px)
         ========================================================= */
      .flex-header-zone {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 180px;
        z-index: 30;
      }

      /* Punch Phrase Card: "TỜ 30 ĐỒNG KỲ LẠ" */
      .punch-card {
        background-color: #141414;
        border: 3.5px solid #ff6a1a;
        border-radius: 8px;
        padding: 16px 36px;
        box-shadow:
          8px 10px 0px rgba(255, 106, 26, 0.85),
          0px 18px 32px rgba(0, 0, 0, 0.35);
        text-align: center;
        max-width: 880px;
        opacity: 0;
      }

      .punch-tag {
        display: inline-block;
        color: #ff6a1a;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      .punch-title {
        margin: 0;
        color: #f7f4ec;
        font-size: 54px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: -0.5px;
      }

      /* Label 1 Card: "CHỈ MANG TƯỢNG TRƯNG" */
      .label-card {
        background-color: #141414;
        border: 3.5px solid #ff6a1a;
        border-radius: 8px;
        padding: 18px 36px;
        box-shadow:
          8px 10px 0px rgba(255, 106, 26, 0.85),
          0px 16px 28px rgba(0, 0, 0, 0.35);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 880px;
        opacity: 0;
      }

      .label-sub {
        color: #ff6a1a;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .label-main {
        color: #f7f4ec;
        font-size: 46px;
        font-weight: 900;
        line-height: 1.25;
      }

      /* Label 2 Stamp Slam Card: "NGỪNG LƯU HÀNH" */
      .stamp-card {
        background-color: #141414;
        border: 4px solid #ff6a1a;
        border-radius: 6px;
        padding: 18px 38px;
        box-shadow:
          10px 12px 0px #ff6a1a,
          0 20px 40px rgba(0, 0, 0, 0.45);
        text-align: center;
        transform-origin: 50% 50%;
        max-width: 880px;
        opacity: 0;
      }

      .stamp-badge {
        display: inline-block;
        background-color: #ff6a1a;
        color: #141414;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 2px;
        padding: 4px 14px;
        border-radius: 4px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .stamp-title {
        color: #f7f4ec;
        font-size: 52px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: 1px;
      }

      /* =========================================================
         HAND-DRAWN SVG ICON BADGES
         ========================================================= */
      .icon-placement-zone {
        z-index: 35;
      }

      .icon-badge {
        position: absolute;
        top: 380px;
        right: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        opacity: 0;
        transform-origin: 50% 50%;
      }

      .icon-svg {
        width: 110px;
        height: 110px;
        filter: drop-shadow(4px 6px 0px rgba(20, 20, 20, 0.8));
      }

      .icon-label-pill {
        margin-top: 8px;
        background-color: #141414;
        color: #f7f4ec;
        font-size: 18px;
        font-weight: 900;
        padding: 6px 14px;
        border-radius: 4px;
        border: 2px solid #ff6a1a;
        white-space: nowrap;
        letter-spacing: 1px;
      }

      .path-stroke {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s03"
      data-width="1080"
      data-height="1920"
      data-duration="7.95"
    >
      <!-- Background Paper & Spotlight Layer -->
      <div class="bg-layer" data-layout-ignore="true">
        <div class="grid-pattern"></div>
        <div class="spotlight-vignette"></div>
        <div class="grain-overlay"></div>
      </div>

      <!-- Persistent Signature Bottom Orange Bar -->
      <div class="brand-bottom-bar" data-layout-ignore="true"></div>

      <!-- =========================================================
           SHOT 1 (20200ms -> 24200ms | 0.0s to 4.0s)
           Asset: vid-08 (Banknote recall stop-motion collage)
           ========================================================= -->
      <video
        id="shot1-video"
        src="assets/vid-08-banknote-recall-decision-cutout.mp4"
        data-start="0"
        data-duration="4"
        data-media-start="1"
        muted
        playsinline
      ></video>

      <!-- Archival tactile tape layer for Shot 1 -->
      <div id="shot1-tape-layer" class="clip" data-start="0" data-duration="4" data-layout-ignore="true">
        <div class="tape-shot1-top"></div>
        <div class="tape-shot1-corner"></div>
      </div>

      <!-- Punch Phrase Overlay: TỜ 30 ĐỒNG KỲ LẠ (0.6s to 2.8s) -->
      <div id="punch1-layer" class="clip flex-header-zone" data-start="0.6" data-duration="2.2">
        <div class="punch-card" id="punch1-card">
          <span class="punch-tag">LỊCH SỬ TIỀN TỆ</span>
          <h1 class="punch-title">TỜ 30 ĐỒNG KỲ LẠ</h1>
        </div>
      </div>

      <!-- Question Icon (at 2.3s to 3.9s) -->
      <div id="question-layer" class="clip icon-placement-zone" data-start="2.3" data-duration="1.6" data-layout-ignore="true">
        <div class="icon-badge" id="question-badge">
          <svg class="icon-svg" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="44" fill="#141414" stroke="#FF6A1A" stroke-width="4.5" />
            <path
              id="question-stroke"
              class="path-stroke"
              d="M 37 38 C 37 26, 63 26, 63 38 C 63 48, 50 51, 50 62"
              stroke="#F7F4EC"
              stroke-width="7"
            />
            <circle id="question-dot" cx="50" cy="74" r="5" fill="#FF6A1A" />
          </svg>
          <div class="icon-label-pill">MỆNH GIÁ HIẾM</div>
        </div>
      </div>

      <!-- =========================================================
           SHOT 2 (24200ms -> 28150ms | 4.0s to 7.95s)
           Asset: img-06 (30 Dong banknote recall document cutout)
           ========================================================= -->
      <div id="shot2-layer" class="clip" data-start="4" data-duration="3.95">
        <div class="media-container" id="shot2-card">
          <img
            id="shot2-img"
            class="media-content"
            src="assets/img-06-money-recall-decision-cutout.jpeg"
            alt="Tờ tiền 30 đồng bị thu hồi"
          />
          <div class="tape-shot2-top" data-layout-ignore="true"></div>
          <div class="tape-shot2-corner" data-layout-ignore="true"></div>
        </div>
      </div>

      <!-- Label 1: "CHỈ MANG TƯỢNG TRƯNG" (4.6s to 6.35s) -->
      <div id="label1-layer" class="clip flex-header-zone" data-start="4.6" data-duration="1.75">
        <div class="label-card" id="label1-card">
          <span class="label-sub">KHÔNG HIỆU QUẢ LƯU THÔNG</span>
          <div class="label-main">CHỈ MANG TƯỢNG TRƯNG</div>
        </div>
      </div>

      <!-- Label 2: "NGỪNG LƯU HÀNH" Stamp Slam (6.4s to 7.95s) -->
      <div id="label2-layer" class="clip flex-header-zone" data-start="6.4" data-duration="1.55">
        <div class="stamp-card" id="label2-card">
          <div class="stamp-badge">QUYẾT ĐỊNH THU HỒI</div>
          <div class="stamp-title">NGỪNG LƯU HÀNH</div>
        </div>
      </div>

      <!-- Ban Icon (6.6s to 7.95s) -->
      <div id="ban-layer" class="clip icon-placement-zone" data-start="6.6" data-duration="1.35" data-layout-ignore="true">
        <div class="icon-badge" id="ban-badge">
          <svg class="icon-svg" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="44" fill="#141414" stroke="#FF6A1A" stroke-width="4.5" />
            <circle
              id="ban-circle"
              class="path-stroke"
              cx="50"
              cy="50"
              r="30"
              stroke="#FF6A1A"
              stroke-width="7"
            />
            <line
              id="ban-line"
              class="path-stroke"
              x1="29"
              y1="29"
              x2="71"
              y2="71"
              stroke="#FF6A1A"
              stroke-width="7"
            />
          </svg>
          <div class="icon-label-pill">BỊ BỎ LUÔN</div>
        </div>
      </div>
    </div>

    <!-- =========================================================
         DETERMINISTIC GSAP ANIMATION TIMELINE
         ========================================================= -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // ---------------------------------------------------------
      // SETUP SVG SELF-DRAWING STROKES (Deterministic lengths)
      // ---------------------------------------------------------
      const qPath = document.getElementById("question-stroke");
      const qLen = qPath && qPath.getTotalLength ? qPath.getTotalLength() : 80;
      if (qPath) {
        qPath.style.strokeDasharray = qLen;
        qPath.style.strokeDashoffset = qLen;
      }

      const banCircle = document.getElementById("ban-circle");
      const banCircleLen = banCircle && banCircle.getTotalLength ? banCircle.getTotalLength() : 188.5;
      if (banCircle) {
        banCircle.style.strokeDasharray = banCircleLen;
        banCircle.style.strokeDashoffset = banCircleLen;
      }

      const banLine = document.getElementById("ban-line");
      const banLineLen = banLine && banLine.getTotalLength ? banLine.getTotalLength() : 60;
      if (banLine) {
        banLine.style.strokeDasharray = banLineLen;
        banLine.style.strokeDashoffset = banLineLen;
      }

      // ---------------------------------------------------------
      // SHOT 1 MOTION (0.0s - 4.0s)
      // ---------------------------------------------------------
      // Peel entrance: archival banknote slapped onto surface
      tl.fromTo(
        "#shot1-video",
        { opacity: 0, scale: 0.9, y: 24, rotation: -2 },
        { opacity: 1, scale: 1, y: 0, rotation: 0, duration: 0.65, ease: "power3.out" },
        0.05
      );

      // Fade in decorative tape layer along with video landing
      tl.fromTo(
        "#shot1-tape-layer",
        { opacity: 0 },
        { opacity: 1, duration: 0.45, ease: "power2.out" },
        0.25
      );

      // Punch Phrase entrance at 0.6s (hold until 2.5s -> exit fade)
      tl.fromTo(
        "#punch1-card",
        { opacity: 0, y: 28, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
        0.6
      );
      tl.to(
        "#punch1-card",
        { opacity: 0, y: -14, duration: 0.25, ease: "power2.in" },
        2.5
      );

      // Question Icon entrance at 2.3s
      tl.fromTo(
        "#question-badge",
        { opacity: 0, scale: 0, rotation: -15 },
        { opacity: 1, scale: 1, rotation: 3, duration: 0.35, ease: "power3.out" },
        2.3
      );
      if (qPath) {
        tl.fromTo(
          "#question-stroke",
          { strokeDashoffset: qLen },
          { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
          2.45
        );
      }
      tl.to(
        "#question-badge",
        { opacity: 0, scale: 0.8, duration: 0.2, ease: "power2.in" },
        3.65
      );

      // ---------------------------------------------------------
      // SHOT 2 MOTION (4.0s - 7.95s)
      // ---------------------------------------------------------
      // Camera Zoom-out: 1.08 -> 1.0 (archival document isolation)
      tl.fromTo(
        "#shot2-card",
        { scale: 1.08 },
        { scale: 1.0, duration: 3.95, ease: "sine.out" },
        4.0
      );

      // Label 1: "CHỈ MANG TƯỢNG TRƯNG" at 4.6s
      tl.fromTo(
        "#label1-card",
        { opacity: 0, y: 28, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" },
        4.6
      );
      tl.to(
        "#label1-card",
        { opacity: 0, y: -14, duration: 0.22, ease: "power2.in" },
        6.1
      );

      // Label 2: "NGỪNG LƯU HÀNH" Stamp Slam at 6.4s
      tl.fromTo(
        "#label2-card",
        { opacity: 0, scale: 1.35, rotation: -6 },
        { opacity: 1, scale: 1, rotation: -2, duration: 0.32, ease: "power3.out" },
        6.4
      );

      // Ban Icon entrance at 6.6s
      tl.fromTo(
        "#ban-badge",
        { opacity: 0, scale: 0, rotation: -25 },
        { opacity: 1, scale: 1, rotation: 0, duration: 0.3, ease: "power3.out" },
        6.6
      );
      if (banCircle) {
        tl.fromTo(
          "#ban-circle",
          { strokeDashoffset: banCircleLen },
          { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
          6.7
        );
      }
      if (banLine) {
        tl.fromTo(
          "#ban-line",
          { strokeDashoffset: banLineLen },
          { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" },
          6.95
        );
      }

      // ---------------------------------------------------------
      // REGISTER TIMELINE ON WINDOW
      // ---------------------------------------------------------
      window.__timelines["scene-s03"] = tl;
    </script>
  
    </template>
  </body>
</html>
