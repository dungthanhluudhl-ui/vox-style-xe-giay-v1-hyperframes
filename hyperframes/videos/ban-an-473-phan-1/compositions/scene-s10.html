        top: 0;
        bottom: 0;
        left: 0;
        width: 12px;
        content: "";
        background: var(--orange);
      }

      .price-step--peak {
        background: var(--orange);
      }

      .price-step--peak::before {
        background: var(--ink);
      }

      .price-label {
        margin-bottom: 3px;
        color: var(--ink);
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .price-value {
        color: var(--ink);
        font-size: 49px;
        font-weight: 900;
        line-height: 1.05;
        white-space: nowrap;
      }

      .bottom-signature {

        right: 0;

      >

    <script>
      const purchasePath = document.getElementById("s10-route-purchase");
      const resalePath = document.getElementById("s10-route-resale");
      const sellerDrawParts = document.querySelectorAll(".seller-draw");

      const purchaseLength = purchasePath.getTotalLength();
      const resaleLength = resalePath.getTotalLength();

      purchasePath.style.strokeDasharray = String(purchaseLength);
      purchasePath.style.strokeDashoffset = String(purchaseLength);
      resalePath.style.strokeDasharray = String(resaleLength);
      resalePath.style.strokeDashoffset = String(resaleLength);

      sellerDrawParts.forEach(function (part) {
        const length = part.getTotalLength();
        part.style.strokeDasharray = String(length);
        part.style.strokeDashoffset = String(length);
      });

      function formatPrice(value) {
        return Math.round(value)
          .toString()
          .replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "đ";
      }

      const price100 = { value: 0 };
      const price200 = { value: 100000 };
      const price350 = { value: 200000 };

      const price100Element = document.getElementById("s10-price-value-100");
      const price200Element = document.getElementById("s10-price-value-200");
      const price350Element = document.getElementById("s10-price-value-350");

      const tl = gsap.timeline({
        paused: true,
        defaults: {
          ease: "power3.out"
        }
      });

      tl.fromTo(
        "#s10-video-shell",
        { scale: 1.24 },
        { scale: 1, duration: 0.72, ease: "expo.out" },
        0
      );

      tl.fromTo(
        "#s10-route-panel",
        { y: -26, scale: 1.035, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.54, ease: "power4.out" },
        0.18
      );

      tl.fromTo(
        "#s10-seller",
        { y: 20, scale: 0.9, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.62
      );

      tl.to(
        ".seller-draw",
        {
          strokeDashoffset: 0,
          duration: 0.46,
          ease: "power2.out",
          stagger: 0.08
        },
        0.68
      );

      tl.fromTo(
        "#s10-tien",
        { y: 18, scale: 0.9, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.46, ease: "power3.out" },
        1.34
      );

      tl.to(
        "#s10-route-purchase",
        {
          strokeDashoffset: 0,
          duration: 0.62,
          ease: "power2.out"
        },
        2.24
      );

      tl.fromTo(
        "#s10-purchase-head",
        { opacity: 0 },
        { opacity: 1, duration: 0.16, ease: "power1.out" },
        2.73
      );

      tl.fromTo(
        "#s10-package",
        { x: 0, scale: 0.86, opacity: 0 },
        {
          x: 320,
          scale: 1,
          opacity: 1,
          duration: 0.72,
          ease: "power3.inOut"
        },
        2.24
      );

      tl.fromTo(
        "#s10-price-card-100",
        { x: 54, scale: 0.94, opacity: 0 },
        { x: 0, scale: 1, opacity: 1, duration: 0.28, ease: "power4.out" },
        2.45
      );

      tl.fromTo(
        price100,
        { value: 0 },
        {
          value: 100000,
          duration: 0.3,
          ease: "power3.out",
          onUpdate: function () {
            price100Element.textContent = formatPrice(price100.value);
          }
        },
        2.45
      );

      tl.fromTo(
        "#s10-buyer",
        { y: 18, scale: 0.9, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        4.05
      );

      tl.to(
        "#s10-route-resale",
        {
          strokeDashoffset: 0,
          duration: 0.7,
          ease: "power2.out"
        },
        4.32
      );

      tl.fromTo(
        "#s10-resale-head",
        { opacity: 0 },
        { opacity: 1, duration: 0.16, ease: "power1.out" },
        4.88
      );

      tl.fromTo(
        "#s10-package",
        { x: 320 },
        {
          x: 645,
          duration: 0.8,
          ease: "power3.inOut",
          immediateRender: false
        },
        4.32
      );

      tl.fromTo(
        "#s10-price-card-200",
        { x: 54, scale: 0.94, opacity: 0 },
        { x: 0, scale: 1, opacity: 1, duration: 0.28, ease: "power4.out" },
        4.73
      );

      tl.fromTo(
        price200,
        { value: 100000 },
        {
          value: 200000,
          duration: 0.59,
          ease: "power3.out",
          onUpdate: function () {
            price200Element.textContent = formatPrice(price200.value);
          }
        },
        4.73
      );

      tl.fromTo(
        "#s10-price-card-350",
        { x: 54, scale: 0.94, opacity: 0 },
        { x: 0, scale: 1, opacity: 1, duration: 0.24, ease: "power4.out" },
        6.33
      );

      tl.fromTo(
        price350,
        { value: 200000 },

          duration: 0.27,
          ease: "power3.out",
          onUpdate: function () {
            price350Element.textContent = formatPrice(price350.value);

      );

      tl.to(

          duration: 0.2,

        },

      );

          y: -2,
          duration: 0.07,
          ease: "sine.inOut",
          immediateRender: false
        },
        8
      );

      window.__timelines["scene-s10"] = tl;
    </script>
