<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (chuẩn WCAG từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      /* Quy ước HyperFrames: .clip dùng inset: 0, không set width/height cứng */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Nền toàn khung: ảnh img-06 phủ hết khung hình 1080x1920, crop lệch phải để làm nổi bật song sắt + mức án */
      #hero-bg-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: right center;
        display: block;
        transform-origin: 75% 50%;
      }

      /* Nhãn băng dán phong cách collage */
      .tape-label {
        position: absolute;
        top: 180px;
        left: 60px;
        padding: 8px 20px;
        font-weight: 900;
        font-size: 24px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        border: 2px solid #141414;
        border-radius: 4px;
        box-shadow: 4px 4px 0 #141414;
        z-index: 20;
      }

      /* --- Overlay 1: Question Icon Stamp (atMs: 233550 -> 1.67s, holdMs: 2400 -> đến 4.07s) --- */
      .question-badge-container {
        position: absolute;
        top: 740px;
        left: 60px;
        width: 960px;
        border: 5px solid #FF6A1A;
        border-radius: 18px;
        background: #141414;
        box-shadow: 12px 14px 0 #141414;
        display: flex;
        align-items: center;
        padding: 24px 32px;
        gap: 28px;
        transform-origin: 50% 50%;
        z-index: 30;
      }

      .question-icon-box {
        width: 100px;
        height: 100px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .question-svg {
        width: 90px;
        height: 90px;
      }

      .question-text-box {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .question-tag {
        font-size: 26px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .question-detail {
        font-size: 38px;
        font-weight: 700;
        line-height: 1.3;
        text-transform: uppercase;
      }

      /* --- Overlay 2: Punch Phrase ("VÌ SAO CHỈ 6 NĂM 6 THÁNG?") --- */
      .punch-container {
        position: absolute;
        top: 800px;
        left: 60px;
        width: 960px;
        border: 5px solid #FF6A1A;
        border-radius: 20px;
        background: #141414;
        box-shadow: 14px 16px 0 #141414;
        padding: 34px 40px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        transform-origin: 50% 50%;
        z-index: 40;
      }

      .punch-kicker {
        display: inline-block;
        font-size: 24px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 6px 14px;
        border-radius: 4px;
      }

      .punch-line-upper {
        font-size: 54px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: -0.5px;
      }

      .punch-highlight-box {
        display: inline-block;
        padding: 10px 24px;
        font-size: 64px;
        font-weight: 900;
        line-height: 1.25;
        border-radius: 8px;
        border: 3px solid #141414;
        box-shadow: 6px 6px 0 #141414;
        text-transform: uppercase;
      }

      /* Thanh cam nhận diện thương hiệu đáy khung hình */
      #bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 10px;
        background: #FF6A1A;
        z-index: 999;
      }
    </style>

    <!-- Root composition: 1080x1920, tổng thời lượng 7.0s (S29: 231880 -> 238880) -->
    <div
      id="root"
      data-composition-id="scene-s29"
      data-width="1080"
      data-height="1920"
      data-duration="7.0"
    >
      <!-- Track 0: Nền toàn khung - Nửa phải ảnh img-06 (Song sắt + Bản án 6 năm 6 tháng tù) -->
      <div id="clip-hero" class="clip" data-start="0" data-duration="7.0" data-track-index="0">
        <img
          id="hero-bg-img"
          data-layout-allow-overflow
          src="assets/img-06-injury-rate-prison-sentence-contrast.jpg"
          alt="Song sắt nhà tù và dòng chữ bản án 6 năm 6 tháng tù"
        />
        <!-- Nhãn băng dán phong cách collage -->
        <div id="hero-tag" class="tape-label hf-hl-orange">
          BẢN ÁN SƠ THẨM
        </div>
      </div>

      <!-- Track 1: Overlay Dấu hỏi lớn (atMs: 233550 -> 1.67s, holdMs: 2400 -> đến 4.07s) -->
      <div id="clip-question" class="clip" data-start="1.67" data-duration="2.4" data-track-index="1">
        <div id="question-card" class="question-badge-container">
          <div class="question-icon-box">
            <svg class="question-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="50" cy="50" r="44" stroke="#FF6A1A" stroke-width="4" />
              <path
                id="q-path"
                d="M 34 38 C 34 22, 66 22, 66 38 C 66 52, 50 54, 50 66"
                stroke="#FF6A1A"
                stroke-width="9"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle id="q-dot" cx="50" cy="80" r="5.5" fill="#FF6A1A" />
            </svg>
          </div>
          <div class="question-text-box">
            <div class="question-tag hf-plate-ink-orange">NGHỊCH LÝ ĐỊNH KHUNG</div>
            <div class="question-detail hf-text-light">SAO DƯỚI 7 NĂM?</div>
          </div>
        </div>
      </div>

      <!-- Track 2: Overlay Punch Phrase (atMs: 236190 -> 4.31s, holdMs: 2650 -> đến 7.0s) -->
      <div id="clip-punch" class="clip" data-start="4.31" data-duration="2.69" data-track-index="2">
        <div id="punch-card" class="punch-container">
          <div class="punch-kicker hf-plate-ink-orange">CÂU HỎI MẤU CHỐT</div>
          <div class="punch-line-upper hf-text-light">VÌ SAO CHỈ</div>
          <div id="punch-highlight" class="punch-highlight-box hf-hl-orange">
            6 NĂM 6 THÁNG?
          </div>
        </div>
      </div>

      <!-- Dải cam cố định đáy màn hình (DNA thương hiệu Vox) -->
      <div id="bottom-brand-bar"></div>
    </div>

    <!-- Animation Runtime: GSAP Paused Timeline -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // Setup SVG stroke path cho icon Question mark (Rule svg-path-draw.md)
      const qPath = document.getElementById("q-path");
      if (qPath) {
        const len = qPath.getTotalLength();
        qPath.style.strokeDasharray = len;
        qPath.style.strokeDashoffset = len;
      }

      // --- Beat 1: Camera zoom-in trên ảnh nền toàn khung (0.0s -> 7.0s) ---
      tl.fromTo(
        "#hero-bg-img",
        { scale: 1.0 },
        { scale: 1.15, duration: 7.0, ease: "sine.out" },
        0
      );

      // Thẻ tape nhãn hồ sơ trượt nhẹ vào
      tl.fromTo(
        "#hero-tag",
        { y: -25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
        0.2
      );

      // --- Beat 2: Question Stamp Animation (1.67s -> 4.07s) ---
      tl.fromTo(
        "#question-card",
        { scale: 0.82, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.67
      );

      // SVG Question mark tự vẽ dần nét
      if (qPath) {
        const len = qPath.getTotalLength();
        tl.fromTo(
          qPath,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
          1.8
        );
      }
      tl.fromTo(
        "#q-dot",
        { scale: 0, transformOrigin: "50% 50%" },
        { scale: 1, duration: 0.25, ease: "power2.out" },
        2.1
      );

      // Exit êm của question stamp trước khi clip hết thời gian (t = 3.85s -> 4.05s)
      tl.fromTo(
        "#question-card",
        { opacity: 1, y: 0, scale: 1 },
        { opacity: 0, y: -20, scale: 0.95, duration: 0.2, ease: "power2.in" },
        3.85
      );

      // --- Beat 3: Punch Phrase Reveal (4.31s -> 7.0s) ---
      tl.fromTo(
        "#punch-card",
        { scale: 0.88, opacity: 0, y: 40 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        4.31
      );

      tl.fromTo(
        "#punch-highlight",
        { scale: 0.92, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        4.55
      );

      // BẮT BUỘC: Đăng ký timeline paused vào window.__timelines["scene-s29"]
      window.__timelines["scene-s29"] = tl;
    </script>
  
    </template>
  </body>
</html>
