<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #F5F0E4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* Card Background fallback */
      .scene-card-bg {
        position: absolute;
        inset: 0;
        background-color: #F5F0E4;
      }

      /* Full-bleed 9:16 Hero Photo Layer (Background-Photo) */
      .hero-photo-wrap {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        transform-origin: top left;
        will-change: transform, opacity;
      }

      .hero-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 25%;
        display: block;
        transform-origin: center center;
        will-change: transform;
      }

      /* Top Dossier Context Plate (Đặc 100% mực bảo đảm contrast) */
      .top-meta-plate {
        position: absolute;
        top: 175px;
        left: 80px;
        width: 920px;
        background-color: #141414;
        border: 3px solid #141414;
        border-left: 8px solid #FF6A1A;
        border-radius: 4px;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 20;
        will-change: transform, opacity;
      }

      .case-tag-group {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .accent-box {
        width: 14px;
        height: 14px;
        background-color: #FF6A1A;
      }

      .case-title {
        font-size: 24px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .case-number {
        font-size: 20px;
        font-weight: 900;
        color: #141414;
        letter-spacing: 1px;
        background-color: #FF6A1A;
        padding: 4px 14px;
        border-radius: 4px;
      }

      /* Dossier Document Card (Nền mực đặc nằm trên mặt bàn kim loại) */
      .dossier-card {
        position: absolute;
        top: 980px;
        left: 80px;
        width: 920px;
        height: 380px;
        background-color: #141414;
        border: 3px solid #141414;
        border-left: 8px solid #FF6A1A;
        border-radius: 6px;
        padding: 24px 32px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        z-index: 20;
        will-change: transform, opacity;
      }

      /* Dossier Header */
      .dossier-header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .dossier-tag {
        font-size: 20px;
        font-weight: 900;
        color: #FF6A1A;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .doc-icon-wrap {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Target Name Line */
      .name-row {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 4px;
      }

      .name-prefix {
        font-size: 32px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 1px;
      }

      .name-target-wrap {
        position: relative;
        display: inline-block;
      }

      .name-target {
        font-size: 46px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 1px;
        white-space: nowrap;
      }

      .strike-line {
        position: absolute;
        left: -6px;
        right: -6px;
        top: 28px;
        height: 8px;
        background-color: #FF6A1A;
        border-radius: 4px;
        transform-origin: left center;
        will-change: transform;
        pointer-events: none;
      }

      /* Redacted Stamp */
      .stamp-wrap {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .stamp-redacted {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        background-color: #141414;
        border: 2px solid #FF6A1A;
        border-radius: 4px;
        transform-origin: center center;
        will-change: transform, opacity;
      }

      .stamp-dot {
        width: 8px;
        height: 8px;
        background-color: #FF6A1A;
        border-radius: 50%;
      }

      .stamp-text {
        font-size: 18px;
        font-weight: 900;
        color: #FF6A1A;
        letter-spacing: 1.5px;
      }

      /* Punch Phrase Badge */
      .punch-badge {
        display: flex;
        align-items: center;
        gap: 16px;
        background-color: #FF6A1A;
        border: 3px solid #141414;
        padding: 12px 24px;
        border-radius: 6px;
        transform-origin: center center;
        will-change: transform, opacity;
      }

      .punch-tag {
        font-size: 20px;
        font-weight: 900;
        color: #FF6A1A;
        background-color: #141414;
        padding: 6px 12px;
        border-radius: 4px;
        letter-spacing: 1px;
      }

      .punch-text {
        font-size: 44px;
        font-weight: 900;
        color: #141414;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

      /* Signature Bottom Orange Bar */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s07"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="9.19"
    >
      <div id="scene-s07" class="clip" data-start="0" data-duration="9.19">
        <!-- Background Variant: Card Fallback -->
        <div class="scene-card-bg"></div>

        <!-- Full-bleed 9:16 Photo Layer (Peel Entrance) -->
        <div
          id="hero-photo-wrap"
          class="hero-photo-wrap"
          data-layout-allow-overflow="true"
        >
          <img
            id="hero-img"
            class="hero-image"
            src="assets/img-03-angry-suspect-interrogation-cutout.jpg"
            alt="Chân dung người thợ xây thẩm vấn"
            data-layout-allow-overflow="true"
          />
        </div>

        <!-- Top Context Header Plate -->
        <div id="top-meta-plate" class="top-meta-plate">
          <div class="case-tag-group">
            <div class="accent-box"></div>
            <span class="case-title">BẢN ÁN HOA CHUỐI</span>
          </div>
          <span class="case-number">BÚT LỤC 07</span>
        </div>

        <!-- Dossier Information Card (Placed over the metal table area) -->
        <div id="dossier-card" class="dossier-card">
          <!-- Header with Doc Icon -->
          <div class="dossier-header-row">
            <div class="dossier-tag">HỒ SƠ TỐ TỤNG // BỊ CAN</div>
            <div class="doc-icon-wrap">
              <svg
                id="icon-doc"
                viewBox="0 0 44 44"
                width="40"
                height="40"
                fill="none"
              >
                <!-- Document outline -->
                <path
                  class="doc-stroke"
                  d="M10 6 H28 L36 14 V38 H10 Z"
                  stroke="#FF6A1A"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <!-- Folded Corner -->
                <path
                  class="doc-stroke"
                  d="M28 6 V14 H36"
                  stroke="#FF6A1A"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <!-- Document Lines -->
                <path
                  class="doc-stroke"
                  d="M16 20 H28"
                  stroke="#FF6A1A"
                  stroke-width="2.5"
                  stroke-linecap="round"
                />
                <path
                  class="doc-stroke"
                  d="M16 26 H30"
                  stroke="#FF6A1A"
                  stroke-width="2.5"
                  stroke-linecap="round"
                />
                <path
                  class="doc-stroke"
                  d="M16 32 H24"
                  stroke="#FF6A1A"
                  stroke-width="2.5"
                  stroke-linecap="round"
                />
              </svg>
            </div>
          </div>

          <!-- Struck-through Name (opt-out occlusion via data-layout-allow-occlusion) -->
          <div class="name-row">
            <span class="name-prefix">HỒ SƠ:</span>
            <div
              id="name-target-wrap"
              class="name-target-wrap"
              data-layout-allow-occlusion="true"
              data-layout-allow-overlap="true"
            >
              <span
                id="name-target"
                class="name-target"
                data-layout-allow-occlusion="true"
                data-layout-allow-overlap="true"
              >NGUYỄN VĂN TH.</span>
              <div
                id="strike-line"
                class="strike-line"
                data-layout-allow-occlusion="true"
                data-layout-allow-overlap="true"
              ></div>
            </div>
          </div>

          <!-- Redacted Stamp Indicator -->
          <div class="stamp-wrap">
            <div id="stamp-redacted" class="stamp-redacted">
              <div class="stamp-dot"></div>
              <span class="stamp-text">ĐÃ MÃ HÓA TRONG BẢN ÁN</span>
            </div>
          </div>

          <!-- Final Punch Phrase -->
          <div id="punch-badge" class="punch-badge">
            <div class="punch-tag">QUY ƯỚC</div>
            <div class="punch-text">TẠM GỌI: THẮNG</div>
          </div>
        </div>

        <!-- Signature Bottom Orange Bar -->
        <div class="brand-bottom-bar" data-layout-allow-caption-zone="true"></div>
      </div>
    </div>

    <script>
      // Initialize SVG path lengths for drawing animation
      const docPaths = document.querySelectorAll("#icon-doc .doc-stroke");
      docPaths.forEach((path) => {
        const len = path.getTotalLength();
        path.style.strokeDasharray = `${len}`;
        path.style.strokeDashoffset = `${len}`;
      });

      // Construct single seekable paused GSAP timeline
      const tl = gsap.timeline({ paused: true });

      // 1. Scene Entrance (Peel transition on full-bleed photo)
      tl.fromTo(
        "#hero-photo-wrap",
        { opacity: 0, rotateY: -10, rotateX: 6, y: 40, transformPerspective: 1200 },
        {
          opacity: 1,
          rotateY: 0,
          rotateX: 0,
          y: 0,
          duration: 0.85,
          ease: "power3.out",
        },
        0.1
      );

      // 2. Continuous Camera Motion (zoom-in on hero photo)
      tl.fromTo(
        "#hero-img",
        { scale: 1.0 },
        { scale: 1.08, duration: 9.19, ease: "sine.inOut" },
        0
      );

      // Top Context Plate slides down
      tl.fromTo(
        "#top-meta-plate",
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.4
      );

      // 3. Overlay 1: Dossier Card Enters (atMs: 43270 -> 1.1s)
      tl.fromTo(
        "#dossier-card",
        { opacity: 0, y: 35 },
        { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" },
        1.1
      );

      // Initial state of sub-elements within dossier card
      tl.set("#strike-line", { scaleX: 0 }, 0);
      tl.set("#stamp-redacted", { opacity: 0, scale: 0.8 }, 0);
      tl.set("#punch-badge", { opacity: 0, scale: 0.9, y: 15 }, 0);

      // 4. Overlay 2: Doc Icon & Strikethrough (atMs: 46590 -> 4.42s)
      tl.to(
        "#icon-doc .doc-stroke",
        {
          strokeDashoffset: 0,
          duration: 0.45,
          stagger: 0.08,
          ease: "power2.out",
        },
        4.42
      );

      // Strikethrough line draws over "NGUYỄN VĂN TH."
      tl.fromTo(
        "#strike-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power2.out" },
        4.65
      );

      // Redacted stamp appears
      tl.fromTo(
        "#stamp-redacted",
        { opacity: 0, scale: 1.3, rotation: -5 },
        {
          opacity: 1,
          scale: 1,
          rotation: 0,
          duration: 0.35,
          ease: "power3.out",
        },
        4.95
      );

      // 5. Overlay 3: Punch-phrase Arrival (atMs: 49370 -> 7.2s, held until 9.19s)
      tl.fromTo(
        "#punch-badge",
        { opacity: 0, scale: 0.88, y: 20 },
        {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.55,
          ease: "power3.out",
        },
        7.2
      );

      // Attach timeline to window registry
      window.__timelines["scene-s07"] = tl;
    </script>
  
    </template>
  </body>
</html>
