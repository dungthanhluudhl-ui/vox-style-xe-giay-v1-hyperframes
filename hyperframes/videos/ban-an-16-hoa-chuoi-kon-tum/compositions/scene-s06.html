<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* Ivory Graph Paper Background */
      .grid-canvas {
        position: absolute;
        inset: 0;
        background-color: #e7e3d9;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }

      /* Archival Photo Collage Frame */
      .photo-frame {
        position: absolute;
        top: 60px;
        left: 40px;
        width: 1000px;
        height: 1780px;
        overflow: hidden;
        border: 3px solid #141414;
        background-color: #141414;
        box-shadow: 12px 16px 0px rgba(20, 20, 20, 0.28);
      }

      .camera-rig {
        position: absolute;
        inset: -40px;
        width: calc(100% + 80px);
        height: calc(100% + 80px);
      }

      #hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Decorative Tape Marks (Physical Collage Touch) */
      .photo-tape {
        position: absolute;
        width: 84px;
        height: 26px;
        background-color: rgba(245, 240, 228, 0.88);
        border: 1px solid rgba(20, 20, 20, 0.25);
        z-index: 4;
        pointer-events: none;
      }

      .tape-tl {
        top: 14px;
        left: 20px;
        transform: rotate(-6deg);
      }

      .tape-tr {
        top: 14px;
        right: 20px;
        transform: rotate(5deg);
      }

      /* Centered Layer for Overlay Badges */
      .badge-layer {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 290px;
        pointer-events: none;
        z-index: 10;
      }

      /* Solid Ink Plates for AAA WCAG Contrast over Photography */
      .badge-card {
        position: relative;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 20px;
        background-color: #141414;
        border: 3px solid #141414;
        border-radius: 8px;
        padding: 16px 32px 16px 20px;
        box-shadow: 8px 8px 0px #ff6a1a;
        pointer-events: auto;
      }

      .badge-accent-bar {
        width: 6px;
        height: 52px;
        background-color: #ff6a1a;
        border-radius: 3px;
        flex-shrink: 0;
      }

      .badge-icon-box {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        flex-shrink: 0;
      }

      .badge-text-box {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
      }

      /* Contrast: #FF6A1A on #141414 = 6.4:1 (Pass AA) */
      .badge-eyebrow {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 700;
        font-size: 16px;
        line-height: 1.2;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #ff6a1a;
      }

      /* Contrast: #F7F4EC on #141414 = 16.8:1 (Pass AAA) */
      .badge-title {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 38px;
        line-height: 1.2;
        letter-spacing: 1px;
        color: #f7f4ec;
        white-space: nowrap;
      }

      .loc-title {
        font-size: 44px;
        letter-spacing: 2px;
      }

      /* Vox Brand Orange Baseline Bar */
      .brand-bottom-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s06"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.26"
    >
      <!-- Base Shot Clip: Establishing Tavern Photo & Atmospheric Drift -->
      <div id="clip-bg" class="clip" data-start="0" data-duration="7.26">
        <div class="grid-canvas"></div>

        <div id="photo-frame" class="photo-frame">
          <div id="camera-rig" class="camera-rig" data-layout-allow-overflow="true">
            <img
              id="hero-img"
              src="assets/img-12-vietnam-street-pub-drinking.jpg"
              alt="Quán nhậu vỉa hè Kon Tum"
            />
          </div>

          <div class="photo-tape tape-tl"></div>
          <div class="photo-tape tape-tr"></div>
        </div>

        <div class="brand-bottom-bar"></div>
      </div>

      <!-- Overlay 1 Clip: Self-Drawing Clock Icon + 15:00 23/08/2022 -->
      <div id="clip-time" class="clip" data-start="1.6" data-duration="3.3">
        <div class="badge-layer">
          <div id="time-badge-card" class="badge-card">
            <div id="time-accent-line" class="badge-accent-bar"></div>

            <div class="badge-icon-box">
              <svg class="clock-svg" viewBox="0 0 56 56" width="56" height="56" fill="none">
                <circle
                  id="clock-rim"
                  cx="28"
                  cy="28"
                  r="22"
                  stroke="#FF6A1A"
                  stroke-width="3.5"
                  stroke-linecap="round"
                  transform="rotate(-90 28 28)"
                />
                <line
                  class="clock-tick"
                  x1="28"
                  y1="9"
                  x2="28"
                  y2="12"
                  stroke="#FF6A1A"
                  stroke-width="2.5"
                  stroke-linecap="round"
                />
                <line
                  class="clock-tick"
                  x1="47"
                  y1="28"
                  x2="44"
                  y2="28"
                  stroke="#FF6A1A"
                  stroke-width="2.5"
                  stroke-linecap="round"
                />
                <line
                  class="clock-tick"
                  x1="28"
                  y1="47"
                  x2="28"
                  y2="44"
                  stroke="#FF6A1A"
                  stroke-width="2.5"
                  stroke-linecap="round"
                />
                <line
                  class="clock-tick"
                  x1="9"
                  y1="28"
                  x2="12"
                  y2="28"
                  stroke="#FF6A1A"
                  stroke-width="2.5"
                  stroke-linecap="round"
                />
                <g id="clock-hands">
                  <line
                    id="clock-hour-hand"
                    x1="28"
                    y1="28"
                    x2="38"
                    y2="28"
                    stroke="#FF6A1A"
                    stroke-width="3.5"
                    stroke-linecap="round"
                  />
                  <line
                    id="clock-min-hand"
                    x1="28"
                    y1="28"
                    x2="28"
                    y2="15"
                    stroke="#FF6A1A"
                    stroke-width="3"
                    stroke-linecap="round"
                  />
                  <circle cx="28" cy="28" r="3.5" fill="#FF6A1A" />
                </g>
              </svg>
            </div>

            <div id="time-content" class="badge-text-box">
              <div class="badge-eyebrow">MỐC THỜI GIAN</div>
              <div class="badge-title">15:00 • 23/08/2022</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Overlay 2 Clip: Location Pin + TP. KON TUM -->
      <div id="clip-loc" class="clip" data-start="5.1" data-duration="2.16">
        <div class="badge-layer">
          <div id="loc-badge-card" class="badge-card">
            <div class="badge-accent-bar"></div>

            <div id="pin-icon" class="badge-icon-box">
              <svg class="pin-svg" viewBox="0 0 56 56" width="56" height="56" fill="none">
                <path
                  d="M28 8C20.27 8 14 14.27 14 22c0 10.5 14 26 14 26s14-15.5 14-26c0-7.73-6.27-14-14-14zm0 19c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"
                  fill="#FF6A1A"
                />
              </svg>
            </div>

            <div id="loc-content" class="badge-text-box">
              <div class="badge-eyebrow">ĐỊA ĐIỂM</div>
              <div class="badge-title loc-title">TP. KON TUM</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // SVG path geometry setup
      const clockRim = document.getElementById("clock-rim");
      const rimLen = clockRim && clockRim.getTotalLength ? clockRim.getTotalLength() : 138.23;
      if (clockRim) {
        clockRim.style.strokeDasharray = `${rimLen}`;
        clockRim.style.strokeDashoffset = `${rimLen}`;
      }

      // 1. Scene Entrance: Grow animation
      tl.fromTo(
        "#photo-frame",
        { scale: 0.92, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.8, ease: "power3.out" },
        0
      );

      // 2. Camera Motion: pan-right + documentary forward drift
      tl.fromTo(
        "#camera-rig",
        { x: 35, scale: 1.02 },
        { x: -35, scale: 1.08, duration: 7.26, ease: "none" },
        0
      );

      // 3. Overlay 1: Clock Icon + Timestamp Reveal (atMs: 36600 -> 1.69s, atMs: 37010 -> 2.10s)
      tl.fromTo(
        "#time-badge-card",
        { scale: 0.86, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.69
      );

      if (clockRim) {
        tl.fromTo(
          "#clock-rim",
          { strokeDashoffset: rimLen },
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
          1.72
        );
      }

      tl.fromTo(
        ".clock-tick",
        { opacity: 0 },
        { opacity: 1, duration: 0.25, stagger: 0.04, ease: "power1.out" },
        1.85
      );

      tl.fromTo(
        "#clock-hands",
        { opacity: 0, scale: 0.2 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out", transformOrigin: "28px 28px" },
        1.98
      );

      tl.fromTo(
        "#time-accent-line",
        { scaleY: 0 },
        { scaleY: 1, duration: 0.35, ease: "power2.out", transformOrigin: "top center" },
        2.1
      );

      tl.fromTo(
        "#time-content",
        { opacity: 0, x: -16 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
        2.1
      );

      // Exit Overlay 1 cleanly before second overlay arrives
      tl.to(
        "#time-badge-card",
        { opacity: 0, y: -20, scale: 0.92, duration: 0.3, ease: "power2.in" },
        4.55
      );

      // 4. Overlay 2: Location Stamp (atMs: 40320 -> 5.41s)
      tl.fromTo(
        "#loc-badge-card",
        { scale: 0.86, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        5.2
      );

      tl.fromTo(
        "#pin-icon",
        { y: -16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        5.35
      );

      tl.fromTo(
        "#loc-content",
        { opacity: 0, x: -16 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
        5.41
      );

      // Register the master timeline
      window.__timelines["scene-s06"] = tl;
    </script>
  
    </template>
  </body>
</html>
