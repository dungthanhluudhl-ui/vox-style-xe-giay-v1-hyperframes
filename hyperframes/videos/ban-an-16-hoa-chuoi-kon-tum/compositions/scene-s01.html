<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #e7e3d9;
        font-family: "Be Vietnam Pro", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }

      /* Quy ước clip layout chuẩn của HyperFrames */
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Dấu ấn thương hiệu: Dải cam đáy cố định không zoom/pan */
      #bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 100;
      }

      /* Lớp nền ảnh toàn khung hình (background-photo full frame) - Không card, không bóng đổ giả */
      #bg-photo-wrapper {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
        z-index: 1;
      }

      /* Cắt cúp cận cảnh tập trung 55% nửa trên của asset img-01 (thớt gỗ, bắp chuối tím và ớt đỏ) */
      .bg-photo-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 8%;
        transform-origin: 50% 25%;
        display: block;
      }

      /* Các container overlay căn giữa trong dải an toàn (usableBandY: 160px - 1390px) */
      .overlay-container {
        position: absolute;
        left: 0;
        width: 1080px;
        display: flex;
        justify-content: center;
        pointer-events: none;
      }

      /* 1. Nhãn Label: MÓN ĂN DÂN DÃ */
      #label-container {
        top: 210px;
        z-index: 20;
      }

      .editorial-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 36px;
        border-radius: 8px;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 3px;
        text-transform: uppercase;
        border: 3px solid #141414;
      }

      /* 2. Punch Phrase: NỘM • CANH • CHỢ QUÊ */
      #punch-container {
        top: 1100px;
        z-index: 25;
      }

      .punch-plate {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 18px 44px;
        border-radius: 12px;
        border: 3px solid #141414;
      }

      .punch-word {
        font-size: 54px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        line-height: 1.2;
      }

      .punch-bullet {
        color: #ff6a1a;
        font-size: 40px;
        line-height: 1;
      }

      .punch-accent {
        color: #ff6a1a;
      }

      /* 3. Icon Money Badge (SVG path draw) kèm nhãn hỗ trợ */
      #icon-badge-container {
        top: 1240px;
        z-index: 30;
      }

      .icon-pill {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        border: 3px solid #141414;
        border-radius: 999px;
        padding: 10px 28px 10px 20px;
      }

      .money-svg {
        width: 48px;
        height: 48px;
        display: block;
      }

      .icon-label-text {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        line-height: 1;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s01"
      data-width="1080"
      data-height="1920"
      data-duration="5.88"
    >
      <!-- Shot S01-1 (từ 0s đến 5.88s) -->
      <section id="shot-s01-1" class="clip" data-start="0" data-duration="5.88">
        <!-- Nền ảnh toàn khung hình (background-photo full frame) -->
        <div id="bg-photo-wrapper">
          <img
            id="hero-img"
            class="bg-photo-img"
            src="assets/img-01-kon-tum-court-food-cutout.jpg"
            alt="Bông hoa chuối và ẩm thực dân dã"
          />
        </div>

        <!-- 1. Overlay Label: MÓN ĂN DÂN DÃ (atMs: 300, holdMs: 2300) -->
        <div id="label-container" class="overlay-container">
          <div class="editorial-badge hf-hl-orange">MÓN ĂN DÂN DÃ</div>
        </div>

        <!-- 2. Overlay Punch-Phrase: NỘM • CANH • CHỢ QUÊ (atMs: 2800, holdMs: 2600) -->
        <div id="punch-container" class="overlay-container">
          <div class="punch-plate hf-plate-ink">
            <span class="punch-word hf-text-light">NỘM</span>
            <span class="punch-bullet">•</span>
            <span class="punch-word hf-text-light">CANH</span>
            <span class="punch-bullet">•</span>
            <span class="punch-word punch-accent">CHỢ QUÊ</span>
          </div>
        </div>

        <!-- 3. Overlay Icon: money tự vẽ nét (atMs: 4880, holdMs: 950) -->
        <div id="icon-badge-container" class="overlay-container">
          <div class="icon-pill hf-plate-ink">
            <svg
              id="money-icon"
              class="money-svg"
              viewBox="0 0 64 64"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <!-- Thân tờ tiền -->
              <rect
                class="draw-stroke"
                x="6"
                y="14"
                width="52"
                height="36"
                rx="6"
                stroke="#F7F4EC"
                stroke-width="3.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <!-- Vòng tròn tâm tờ tiền / ngân phiếu -->
              <circle
                class="draw-stroke"
                cx="32"
                cy="32"
                r="9"
                stroke="#FF6A1A"
                stroke-width="3.5"
              />
              <!-- Chi tiết hoa văn mép tiền -->
              <path
                class="draw-stroke"
                d="M14 23V41M50 23V41"
                stroke="#F7F4EC"
                stroke-width="3"
                stroke-linecap="round"
              />
            </svg>
            <span class="icon-label-text hf-text-light">KIẾM ÍT TIỀN</span>
          </div>
        </div>
      </section>

      <!-- Dải cam đáy khung hình cố định nhận diện thương hiệu -->
      <div id="bottom-bar"></div>
    </div>

    <script>
      // Thiết lập SVG Path Draw cho Icon Money (đo đạc hình học thật theo contract)
      const drawPaths = document.querySelectorAll("#money-icon .draw-stroke");
      drawPaths.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      // Tạo timeline chính duy nhất, paused: true theo HyperFrames seek model
      const tl = gsap.timeline({ paused: true });

      // --- 1. ENTRANCE & CAMERA MOTION (0.0s -> 5.88s) ---
      // Entrance: Transition 'rise' mượt mà cho background photo toàn khung
      tl.fromTo(
        "#bg-photo-wrapper",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.05
      );

      // Camera motion: Zoom-in cận cảnh nông sản hoa chuối chậm rãi suốt shot
      tl.fromTo(
        "#hero-img",
        { scale: 1.08, transformOrigin: "50% 25%" },
        { scale: 1.2, duration: 5.83, ease: "none" },
        0.05
      );

      // --- 2. OVERLAY 1: LABEL 'MÓN ĂN DÂN DÃ' (atMs: 300 -> 2600) ---
      // Xuất hiện lúc 0.3s
      tl.fromTo(
        "#label-container",
        { y: -20, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1.0, duration: 0.45, ease: "power3.out" },
        0.3
      );

      // Biến mất lúc 2.3s -> 2.6s (holdMs: 2300ms)
      tl.to(
        "#label-container",
        { y: -12, opacity: 0, duration: 0.3, ease: "power2.in" },
        2.3
      );

      // --- 3. OVERLAY 2: PUNCH PHRASE 'NỘM • CANH • CHỢ QUÊ' (atMs: 2800 -> 5400) ---
      // Xuất hiện lúc 2.8s
      tl.fromTo(
        "#punch-container",
        { y: 30, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1.0, duration: 0.5, ease: "power3.out" },
        2.8
      );

      // Kết thúc lúc 5.4s (holdMs: 2600ms)
      tl.to(
        "#punch-container",
        { y: -10, opacity: 0, duration: 0.35, ease: "power2.in" },
        5.4
      );

      // --- 4. OVERLAY 3: ICON 'MONEY' VẼ TAY (atMs: 4880 -> 5830) ---
      // Xuất hiện badge lúc 4.88s
      tl.fromTo(
        "#icon-badge-container",
        { y: 20, opacity: 0, scale: 0.9 },
        { y: 0, opacity: 1, scale: 1.0, duration: 0.35, ease: "power3.out" },
        4.88
      );

      // Nét vẽ SVG stroke-dashoffset tự vẽ từ 4.88s trong 0.45s
      drawPaths.forEach((path) => {
        const len = path.getTotalLength();
        tl.fromTo(
          path,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
          4.88
        );
      });

      // Đăng ký timeline chính duy nhất vào window.__timelines
      window.__timelines["scene-s01"] = tl;
    </script>
  
    </template>
  </body>
</html>
