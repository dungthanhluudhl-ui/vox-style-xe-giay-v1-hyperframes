    <!-- GSAP Seekable Timeline Contract -->
    <script>
      // Khởi tạo đo đạc SVG icon person cho hiệu ứng vẽ nét
      const personHead = document.getElementById("person-head");
      const personBody = document.getElementById("person-body");
      if (personHead) {
        const headLen = personHead.getTotalLength ? personHead.getTotalLength() : 63;
        personHead.style.strokeDasharray = `${headLen}`;
        personHead.style.strokeDashoffset = `${headLen}`;
      }
      if (personBody) {
        const bodyLen = personBody.getTotalLength ? personBody.getTotalLength() : 60;
        personBody.style.strokeDasharray = `${bodyLen}`;
        personBody.style.strokeDashoffset = `${bodyLen}`;
      }

      // Khởi tạo GSAP timeline chính (bắt buộc paused: true)
      const tl = gsap.timeline({ paused: true });

      // 1. Chuyển cảnh vào (transitionIn: rise)
      tl.fromTo(
        "#photo-wrap",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0
      );

      tl.fromTo(
        "#doc-header",
        { y: -20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.08
      );

      // Camera motion: zoom-in chậm trên nền ảnh phòng xử án 9:16 suốt 7.0s
      tl.fromTo(
        "#court-img",
        { scale: 1.0 },
        { scale: 1.08, duration: 7.0, ease: "none" },
        0
      );

      // 2. Overlay 1: HÀNH VI • Ý THỨC (0.92s -> 3.52s)
      tl.fromTo(
        "#panel-1",
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.92
      );
      tl.fromTo(
        "#panel-1",
        { y: 0, opacity: 1 },
        { y: -16, opacity: 0, duration: 0.22, ease: "power2.in" },
        3.28
      );

      // 3. Overlay 2: CHỨNG CỨ LIÊN QUAN (4.00s -> 6.00s)
      tl.fromTo(
        "#panel-2",
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        4.00
      );
      tl.fromTo(
        "#panel-2",
        { y: 0, opacity: 1 },
        { y: -16, opacity: 0, duration: 0.22, ease: "power2.in" },
        5.76
      );

      // 4. Overlay 3: BỊ CÁO THẮNG + Icon person (6.07s -> 7.00s)
      tl.fromTo(
        "#panel-3",
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        6.07
      );

      tl.fromTo(
        "#person-icon-wrap",
        { scale: 0 },
        { scale: 1, duration: 0.35, ease: "power3.out" },
        6.15
      );

      tl.to(
        "#person-head",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        6.20
      );
      tl.to(
        "#person-body",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        6.28
      );

      // Đăng ký timeline bắt buộc cho HyperFrames seek runtime
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s24"] = tl;
    </script>
