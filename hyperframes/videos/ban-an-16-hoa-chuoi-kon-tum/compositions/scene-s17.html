<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Background Photo: phủ toàn bộ khung 1080x1920, crop chặt nửa trên ảnh */
      .bg-photo-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 2;
      }
      .hero-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
        transform-origin: 50% 25%;
        will-change: transform;
      }

      /* Background variant: chart (4 horizontal rules at 20/40/60/80% + orange ticks overlay) */
      .chart-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }
      .chart-grid-subtle {
        position: absolute;
        inset: 0;
        background-size: 84px 84px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.08) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.08) 1.5px, transparent 1.5px);
      }
      .chart-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: rgba(20, 20, 20, 0.28);
        display: flex;
        align-items: center;
      }
      .chart-tick {
        width: 24px;
        height: 5px;
        background: #FF6A1A;
        display: block;
      }

      /* Header Card / Punch-phrase trên tấm nền mực đặc (WCAG AA/AAA) */
      .header-card {
        position: absolute;
        top: 180px;
        left: 60px;
        right: 60px;
        background: #141414;
        border-left: 8px solid #FF6A1A;
        border-radius: 6px;
        padding: 22px 28px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
        z-index: 20;
      }
      .header-top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .tag-evidence {
        display: inline-block;
        background: #FF6A1A;
        color: #141414;
        font-size: 15px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        padding: 6px 14px;
        border-radius: 4px;
        line-height: 1.2;
      }
      .case-id {
        font-size: 14px;
        font-weight: 700;
        color: #FF6A1A;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .headline-main {
        margin: 14px 0 0 0;
        font-size: 50px;
        font-weight: 900;
        line-height: 1.2;
        color: #F7F4EC;
        text-transform: uppercase;
        letter-spacing: -0.5px;
      }
      .divider-line {
        width: 100%;
        height: 2px;
        background: rgba(247, 244, 236, 0.2);
        margin-top: 14px;
      }

      /* Overlay 1: Bệnh viện Đa khoa tỉnh Kon Tum (t=1.83s -> 4.23s) */
      .badge-hospital-card {
        position: absolute;
        top: 960px;
        left: 60px;
        width: 480px;
        background: #141414;
        border-left: 8px solid #FF6A1A;
        border-radius: 6px;
        padding: 22px 26px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
        z-index: 25;
      }
      .badge-hospital-sub {
        font-size: 15px;
        font-weight: 700;
        color: #FF6A1A;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin: 0 0 8px 0;
        display: block;
        line-height: 1.2;
      }
      .badge-hospital-title {
        font-size: 32px;
        font-weight: 900;
        color: #F7F4EC;
        line-height: 1.25;
        margin: 0;
      }

      /* Overlay 2: Kết quả giám định THƯƠNG TÍCH: 4% (t=4.87s -> 7.20s) */
      .stamp-injury-card {
        position: absolute;
        top: 920px;
        right: 60px;
        width: 530px;
        background: #141414;
        border: 4px solid #FF6A1A;
        border-radius: 8px;
        padding: 24px 28px;
        box-shadow: 14px 14px 0px rgba(20, 20, 20, 0.4);
        z-index: 30;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }
      .stamp-tag {
        display: inline-block;
        background: #FF6A1A;
        color: #141414;
        font-size: 13px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        padding: 6px 12px;
        border-radius: 3px;
        line-height: 1.2;
        margin-bottom: 14px;
      }
      .stamp-content {
        display: flex;
        flex-direction: row;
        align-items: baseline;
        gap: 14px;
        margin-bottom: 14px;
      }
      .stamp-desc {
        font-size: 30px;
        font-weight: 900;
        color: #F7F4EC;
        line-height: 1.1;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .stamp-number {
        font-size: 76px;
        font-weight: 900;
        color: #FF6A1A;
        line-height: 1.1;
      }
      .stamp-sub {
        display: block;
        font-size: 15px;
        font-weight: 700;
        color: #E7E3D9;
        border-top: 1px solid rgba(247, 244, 236, 0.22);
        padding-top: 10px;
        line-height: 1.3;
        margin: 0;
      }

      /* Fixed bottom branding bar */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s17"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.2"
    >
      <!-- Main Visual Scene Clip (0.0s -> 7.2s) -->
      <section id="scene-main-clip" class="clip" data-start="0" data-duration="7.2">
        <!-- Background Photo: Phủ toàn bộ khung hình 1080x1920, crop chặt nửa trên ảnh -->
        <div class="bg-photo-wrapper" data-layout-allow-overflow="true">
          <img
            id="hero-img"
            class="hero-photo"
            src="assets/img-16-victim-injury-suspect-interrogation.jpg"
            alt="Nạn nhân Tùng quấn băng ở cổ tại bệnh viện"
          />
        </div>

        <!-- Background Variant: chart (lưới & đường kẻ kỹ thuật giám định) -->
        <div class="chart-bg" data-layout-ignore="true">
          <div class="chart-grid-subtle"></div>
          <div class="chart-line" style="top: 384px;">
            <div class="chart-tick"></div>
          </div>
          <div class="chart-line" style="top: 768px;">
            <div class="chart-tick"></div>
          </div>
          <div class="chart-line" style="top: 1152px;">
            <div class="chart-tick"></div>
          </div>
          <div class="chart-line" style="top: 1536px;">
            <div class="chart-tick"></div>
          </div>
        </div>

        <!-- Header / Headline punch-phrase đặt trên tấm nền mực đặc -->
        <div id="header-group" class="header-card">
          <div class="header-top-row">
            <div class="tag-evidence">Hồ sơ bệnh án // Bằng chứng</div>
            <span class="case-id">S17 / KON TUM</span>
          </div>
          <h1 class="headline-main">Cấp cứu & Giám định</h1>
          <div class="divider-line"></div>
        </div>
      </section>

      <!-- Overlay 1: Bệnh viện Đa khoa tỉnh Kon Tum (1.83s -> 4.23s) -->
      <div id="clip-hospital-badge" class="clip" data-start="1.83" data-duration="2.4">
        <div id="hospital-badge-card" class="badge-hospital-card">
          <span class="badge-hospital-sub">Cơ sở tiếp nhận cấp cứu</span>
          <h2 class="badge-hospital-title">BVĐK TỈNH KON TUM</h2>
        </div>
      </div>

      <!-- Overlay 2: Kết quả giám định THƯƠNG TÍCH: 4% (4.87s -> 7.20s) -->
      <div id="clip-injury-data" class="clip" data-start="4.87" data-duration="2.33">
        <div id="injury-data-card" class="stamp-injury-card">
          <div class="stamp-tag">KẾT LUẬN GIÁM ĐỊNH</div>
          <div class="stamp-content">
            <span class="stamp-desc">THƯƠNG TÍCH:</span>
            <span class="stamp-number">4%</span>
          </div>
          <div class="stamp-sub">Vết thương vùng cổ sau cấp cứu</div>
        </div>
      </div>

      <!-- Fixed bottom orange bar -->
      <div class="bottom-brand-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Camera Motion: zoom-in chậm tập trung vào vết thương vùng cổ (t = 0.0s -> 7.2s)
      tl.fromTo(
        "#hero-img",
        { scale: 1 },
        { scale: 1.08, duration: 7.2, ease: "none" },
        0
      );

      // 2. Entrance "rise" for Header Card (t = 0.1s -> 0.7s)
      tl.fromTo(
        "#header-group",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.1
      );

      // 3. Overlay 1 Motion: Slide in hospital badge at 1.83s, exit at 3.98s
      tl.fromTo(
        "#hospital-badge-card",
        { x: -40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.83
      );
      tl.to(
        "#hospital-badge-card",
        { x: -20, opacity: 0, duration: 0.25, ease: "power2.in" },
        3.98
      );

      // 4. Overlay 2 Motion: Forensic Stamp entrance at 4.87s (smooth power3.out scale & rise)
      tl.fromTo(
        "#injury-data-card",
        { scale: 0.88, y: 30, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        4.87
      );

      // Register timeline
      window.__timelines["scene-s17"] = tl;
    </script>
  
    </template>
  </body>
</html>
