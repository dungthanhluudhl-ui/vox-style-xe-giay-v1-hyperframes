    .label-tag-dot {

    .label-title {
      font-size: 42px;
      font-weight: 900;
      color: #F7F4EC;

      letter-spacing: -0.5px;
    }

    .label-desc {
      font-size: 20px;
      font-weight: 700;
      color: #F7F4EC;
      margin-top: 10px;
      line-height: 1.35;
    }

    /* SVG đồ hoạ phân tích cú va chạm */
    #impact-svg-wrap {
      position: absolute;
      top: 590px;
      left: 470px;
      width: 440px;
      height: 310px;
      z-index: 28;
      pointer-events: none;
    }

    /* Overlay 2: Punch Phrase CAN NGĂN KỊP THỜI (atMs: 125280 -> 5.36s) */
    #punch-card {
      position: absolute;
      top: 1030px;
      left: 60px;
      width: 960px;
      height: auto;
      background-color: #141414;
      border: 4px solid #141414;
      box-shadow: 14px 14px 0px #FF6A1A;
      padding: 26px 34px;
      z-index: 40;
      transform-origin: 50% 50%;
    }

    .punch-header-row {
      display: flex;

    }

    #punch-badge {
      background-color: #FF6A1A;

      font-weight: 900;
      font-size: 20px;
      padding: 6px 18px;

      box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.3);
      display: inline-block;
    }

    .punch-subtext {
      color: #FF6A1A;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 1px;
    }

    .punch-headline {
      font-size: 62px;
      font-weight: 900;
      line-height: 1.15;
      color: #F7F4EC;
      letter-spacing: -1px;
      margin-bottom: 20px;
    }

    .punch-highlight-box {
      background-color: #FF6A1A;
      color: #141414;
      padding: 2px 16px;
      display: inline-block;
      margin-left: 6px;
    }

    /* Flow diagram 3 bước can ngăn */
    #flow-steps {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #F5F0E4;
      padding: 14px 20px;
      border-left: 8px solid #FF6A1A;
      gap: 12px;
      width: 100%;
    }

    .flow-item {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .flow-num {
      width: 30px;
      height: 30px;
      background-color: #141414;
      color: #F7F4EC;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .flow-txt {
      font-size: 18px;
      font-weight: 900;
      color: #141414;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .flow-sep {
      font-size: 22px;
      font-weight: 900;
      color: #141414;
      padding: 0 4px;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s16"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="8.72"
  >
    <!-- Thanh cam đáy cố định -->
    <div id="bottom-brand-bar"></div>

    <!-- Clip 1: Shot chính toàn cảnh hỗn chiến (0s -> 8.72s) -->
    <section id="scene-shot" class="clip" data-start="0" data-duration="8.72" data-track-index="0">
      <!-- Top case header -->
      <div id="case-header">
        <div class="case-badge-group">
          <div class="case-pill-dark">HỒ SƠ VỤ ÁN</div>
          <div class="case-pill-orange">HIỆN TRƯỜNG</div>
        </div>
        <div class="case-step-label">DIỄN BIẾN 02</div>
      </div>

      <!-- Hero card: Tranh minh hoạ paper-collage hỗn chiến -->
      <div id="hero-card">
        <div class="tape-strip"></div>
        <div class="hero-img-viewport">
          <img
            id="hero-img"
            src="assets/img-08-tavern-brawl-violent-fight.jpg"
            alt="Hiện trường xô xát hỗn chiến trong quán nhậu"
          />
          <div class="hero-card-meta">CHỨNG CỨ THỊ GIÁC // HÌNH 08</div>
        </div>
      </div>
    </section>

    <!-- Clip 2: Overlay Label 1 "GẠT ĐỠ KỊP THỜI" (2.35s -> 4.95s, hold 2.6s) -->
    <section id="shot-label" class="clip" data-start="2.35" data-duration="2.6" data-track-index="1">
      <!-- SVG phân tích hướng đòn đánh bị gạt chệch -->
      <div id="impact-svg-wrap">
        <svg width="440" height="310" viewBox="0 0 440 310" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
              <polygon points="0 0, 10 4, 0 8" fill="#FF6A1A" />
            </marker>
          </defs>
          <!-- Điểm va chạm -->
          <circle id="impact-dot" cx="240" cy="110" r="20" stroke="#FF6A1A" stroke-width="4" fill="rgba(255, 106, 26, 0.25)" />
          <!-- Quỹ đạo đòn đâm thứ 2 -->
          <path id="attack-path" d="M 40 260 Q 140 180 230 115" stroke="#FF6A1A" stroke-width="5" stroke-dasharray="8 6" stroke-linecap="round" />
          <!-- Lực gạt chệch hướng -->
          <path id="deflect-path" d="M 245 105 L 390 40" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowhead)" />
        </svg>
      </div>

      <!-- Hộp nội dung nhãn -->
      <div id="label-box">
        <div class="label-tag">
          <span class="label-tag-dot"></span>
          <span>PHẢN XẠ TỰ VỆ</span>
        </div>
        <div class="label-title">GẠT ĐỠ KỊP THỜI</div>
        <div class="label-desc">Dùng tay gạt chệch hướng nhát đâm thứ hai của hung thủ</div>
      </div>
    </section>

    <!-- Clip 3: Overlay Punch Phrase "CAN NGĂN KỊP THỜI" (5.36s -> 8.72s, hold 3.36s) -->
    <section id="shot-punch" class="clip" data-start="5.36" data-duration="3.36" data-track-index="2">
      <div id="punch-card">
        <div class="punch-header-row">
          <span id="punch-badge">HÀNH ĐỘNG KHẨN CẤP</span>
          <span class="punch-subtext">// ĐÁM ĐÔNG CAN THIỆP</span>
        </div>
        <div class="punch-headline">
          CAN NGĂN <span class="punch-highlight-box">KỊP THỜI</span>
        </div>
        <div id="flow-steps">
          <div class="flow-item">
            <span class="flow-num">1</span>
            <span class="flow-txt">LAO VÀO CAN NGĂN</span>
          </div>
          <div class="flow-sep">➔</div>
          <div class="flow-item">
            <span class="flow-num">2</span>
            <span class="flow-txt">VỨT VỎ CHAI</span>
          </div>
          <div class="flow-sep">➔</div>
          <div class="flow-item">
            <span class="flow-num">3</span>
            <span class="flow-txt">HUNG THỦ BỎ CHẠY</span>

  <script>
    // Chuẩn bị đường nét SVG tự vẽ trước khi timeline chạy
    const attackPath = document.getElementById("attack-path");
    const deflectPath = document.getElementById("deflect-path");
    let len1 = 300;
    let len2 = 200;
    if (attackPath) {
      len1 = Math.ceil(attackPath.getTotalLength()) || 300;
      attackPath.style.strokeDasharray = `${len1}`;
      attackPath.style.strokeDashoffset = `${len1}`;
    }
    if (deflectPath) {
      len2 = Math.ceil(deflectPath.getTotalLength()) || 200;
      deflectPath.style.strokeDasharray = `${len2}`;
      deflectPath.style.strokeDashoffset = `${len2}`;
    }

    // Khởi tạo GSAP timeline chính (paused: true là bắt buộc trong HyperFrames)
    const tl = gsap.timeline({ paused: true });

    // 1. Entrance của Hero Card: hiệu ứng wobble-drop đặc trưng Vox collage
    tl.fromTo(
      "#hero-card",
      { y: -190, rotation: 5, scale: 1.1, opacity: 0 },
      { y: 0, rotation: -1.2, scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
      0.1
    );

    // Header trượt nhẹ xuống
    tl.fromTo(
      "#case-header",
      { y: -30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
      0.25
    );

    // Parallax kịch tính chuyển động nhẹ bên trong khung card
    tl.fromTo(
      "#hero-img",
      { scale: 1, y: 0 },
      { scale: 1.08, y: -24, duration: 7.8, ease: "none" },
      0.85
    );

    // 2. Overlay 1: GẠT ĐỠ KỊP THỜI (atMs: 122270 -> 2.35s)
    tl.fromTo(
      "#label-box",
      { scale: 0.85, opacity: 0, x: -30 },
      { scale: 1, opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
      2.38
    );

    // SVG phân tích lực va chạm tự vẽ ra
    tl.fromTo(
      "#attack-path",
      { strokeDashoffset: len1 },
      { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
      2.45
    );

    tl.fromTo(
      "#impact-dot",
      { scale: 0, opacity: 0, transformOrigin: "240px 110px" },
      { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.5)" },
      2.65
    );

    tl.fromTo(
      "#deflect-path",
      { strokeDashoffset: len2 },
      { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
      2.75
    );

    // Fade out êm trước khi Punch Phrase xuất hiện
    tl.to(
      "#label-box",
      { opacity: 0, scale: 0.95, y: -10, duration: 0.3, ease: "power2.in" },
      4.6
    );

    tl.to(
      "#impact-svg-wrap",
      { opacity: 0, duration: 0.25, ease: "power1.in" },
      4.65
    );

    // 3. Overlay 2: CAN NGĂN KỊP THỜI (atMs: 125280 -> 5.36s)
    tl.fromTo(
      "#punch-card",
      { scale: 1.15, opacity: 0, y: 35 },
      { scale: 1, opacity: 1, y: 0, duration: 0.48, ease: "power4.out" },
      5.38
    );

    tl.fromTo(
      "#punch-badge",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(1.6)" },
      5.55
    );

    tl.fromTo(
      "#flow-steps",
      { opacity: 0, y: 15 },
      { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" },
      5.75
    );

    // Đăng ký timeline cho runtime HyperFrames seek
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s16"] = tl;
  </script>
