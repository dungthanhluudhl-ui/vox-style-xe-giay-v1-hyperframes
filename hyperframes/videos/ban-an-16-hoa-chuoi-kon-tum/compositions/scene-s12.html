<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #141414;
        color: #F7F4EC;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        width: 1080px;
        height: 1920px;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #141414;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Full-frame background photo (static camera) */
      .bg-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 25%;
        display: block;
      }

      /* Document docket styling on solid plate */
      .doc-docket {
        position: absolute;
        top: 160px;
        left: 60px;
        right: 60px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #141414;
        border-left: 10px solid #FF6A1A;
        padding: 16px 24px;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        z-index: 10;
      }
      .docket-tag {
        background-color: #FF6A1A;
        color: #141414;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1.5px;
        padding: 6px 14px;
        border-radius: 4px;
        text-transform: uppercase;
      }
      .docket-meta {
        color: #F7F4EC;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }

      /* Document Evidence Stamp (Overlay 1) */
      .evidence-stamp {
        position: absolute;
        top: 320px;
        left: 60px;
        background-color: #FF6A1A;
        border: 4px solid #141414;
        padding: 18px 28px;
        box-shadow: 8px 8px 0px #141414;
        z-index: 25;
        transform-origin: center center;
        display: inline-block;
      }
      .evidence-stamp-text {
        font-size: 38px;
        font-weight: 900;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        line-height: 1.2;
        color: #141414;
        margin: 0;
        white-space: nowrap;
      }

      /* Punch Phrase Card (Overlay 2) */
      .punch-card {
        position: absolute;
        top: 1155px;
        left: 60px;
        right: 60px;
        background-color: #141414;
        border-radius: 12px;
        border-left: 12px solid #FF6A1A;
        padding: 28px 36px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        z-index: 20;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .punch-eyebrow {
        color: #FF6A1A;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        line-height: 1.2;
        margin: 0;
      }
      .punch-title {
        color: #F7F4EC;
        font-size: 58px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.5px;
        text-transform: uppercase;
        margin: 0;
      }
      .punch-desc {
        color: #E7E3D9;
        font-size: 22px;
        font-weight: 700;
        line-height: 1.35;
        margin: 0;
      }

      /* Vox Signature Bottom Orange Bar */
      .bottom-accent-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 8px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s12"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6.72"
    >
      <section id="shot-s12-1" class="clip" data-start="0" data-duration="6.72">
        <!-- Full-frame background photo (static camera) -->
        <img
          id="hero-img"
          class="bg-photo"
          src="assets/img-03-angry-suspect-interrogation-cutout.jpg"
          alt="Nhân vật Thắng nén giận trong phòng thẩm vấn"
        />

        <!-- Docket Header -->
        <header id="case-header" class="doc-docket">
          <div id="docket-tag" class="docket-tag">BẢN ÁN SỐ 16 / NHẬN ĐỊNH TÒA ÁN</div>
          <div id="docket-meta" class="docket-meta">DIỄN BIẾN LỜI KHAI</div>
        </header>

        <!-- Overlay 1: Evidence Stamp -->
        <div id="evidence-stamp" class="evidence-stamp">
          <div id="stamp-text" class="evidence-stamp-text">NGHĨ BỊ KHINH NGHÈO</div>
        </div>

        <!-- Overlay 2: Punch Phrase -->
        <div id="punch-container" class="punch-card">
          <div id="punch-eyebrow" class="punch-eyebrow">PHẢN ỨNG BAN ĐẦU</div>
          <div id="punch-title" class="punch-title">LẦN ĐẦU: IM LẶNG</div>
          <div id="punch-desc" class="punch-desc">Kìm nén, chưa có phản ứng bột phát</div>
        </div>
      </section>

      <!-- Signature Orange Bar -->
      <div id="bottom-bar" class="bottom-accent-bar"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 0.10s: Docket Header entrance
      tl.fromTo(
        "#case-header",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power4.out" },
        0.1
      );

      // 1.28s: Overlay 1 - Evidence Stamp slams down (atMs: 88240 -> 1.28s)
      tl.fromTo(
        "#evidence-stamp",
        { scale: 1.4, rotation: -5, opacity: 0 },
        { scale: 1, rotation: -2, opacity: 1, duration: 0.3, ease: "power4.out" },
        1.28
      );

      // 3.88s: Overlay 1 exits cleanly before Overlay 2 lands (holdMs: 2600ms -> 1.28 + 2.60 = 3.88s)
      tl.to(
        "#evidence-stamp",
        { opacity: 0, scale: 0.96, duration: 0.25, ease: "power2.in" },
        3.88
      );

      // 4.44s: Overlay 2 - Punch Phrase lands (atMs: 91400 -> 4.44s)
      tl.fromTo(
        "#punch-container",
        { y: 30, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "power4.out" },
        4.44
      );

      window.__timelines["scene-s12"] = tl;
    </script>
  
    </template>
  </body>
</html>
