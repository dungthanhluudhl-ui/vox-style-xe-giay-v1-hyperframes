<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
        overflow: hidden;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }

      /* Base clip contract: inset 0 layout */
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Hero Background Photo: Full-bleed 1080x1920, không bọc trong khung nhỏ, không box-shadow */
      #hero-bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 5;
      }
      #hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
        transform-origin: center center;
      }

      /* Subtle Chart Lines overlay: Tạo nhịp điệu Vox chart trên nền ảnh */
      .chart-grid-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      .chart-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background-color: rgba(20, 20, 20, 0.28);
      }
      .chart-line::before {
        content: "";
        position: absolute;
        left: 0;
        top: -4px;
        width: 28px;
        height: 10px;
        background-color: #FF6A1A;
      }
      .chart-line-1 { top: 22%; }
      .chart-line-2 { top: 44%; }
      .chart-line-3 { top: 66%; }
      .chart-line-4 { top: 84%; }

      /* Fixed signature bottom orange bar */
      #bottom-accent-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 100;
      }

      /* Header Block trong Usable Safe Band (Top 160px - 1390px) */
      #header-block {
        position: absolute;
        top: 165px;
        left: 50px;
        right: 50px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        z-index: 30;
      }
      .header-pill {
        display: inline-block;
        padding: 8px 20px;
        font-size: 22px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        background-color: #FF6A1A;
        color: #141414;
        border: 3px solid #141414;
        box-shadow: 4px 4px 0px #141414;
      }
      .header-title-plate {
        background-color: #141414;
        color: #F7F4EC;
        padding: 14px 22px;
        border-left: 8px solid #FF6A1A;
        border-top: 3px solid #141414;
        border-right: 3px solid #141414;
        border-bottom: 3px solid #141414;
        box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.4);
      }
      .header-title-text {
        font-size: 34px;
        font-weight: 900;
        line-height: 1.3;
        margin: 0;
        letter-spacing: -0.5px;
      }

      /* Overlay 1: 4% THƯƠNG TẬT (Nửa bên trái, khớp biên bản thương tích) */
      #card-injury {
        position: absolute;
        left: 50px;
        top: 760px;
        width: 440px;
        background-color: #F5F0E4;
        border: 4px solid #141414;
        box-shadow: 8px 8px 0px #141414;
        padding: 24px 26px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 40;
        transform-origin: center bottom;
      }
      .card-tag-dark {
        align-self: flex-start;
        padding: 6px 14px;
        font-size: 16px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        background-color: #141414;
        color: #F7F4EC;
      }
      .stat-huge-ink {
        font-size: 96px;
        font-weight: 900;
        line-height: 0.95;
        color: #141414;
        letter-spacing: -3px;
        margin: 6px 0 2px 0;
      }
      .card-desc-ink {
        font-size: 32px;
        font-weight: 900;
        color: #141414;
        line-height: 1.2;
        text-transform: uppercase;
        letter-spacing: -0.5px;
      }
      .card-note-ink {
        font-size: 17px;
        font-weight: 700;
        color: #141414;
        border-top: 2px dashed rgba(20, 20, 20, 0.35);
        padding-top: 10px;
        line-height: 1.35;
      }

      /* Overlay 2: 6 NĂM 6 THÁNG TÙ (Nửa bên phải, khớp song sắt nhà tù) */
      #card-prison {
        position: absolute;
        right: 50px;
        top: 760px;
        width: 480px;
        background-color: #141414;
        border: 4px solid #141414;
        box-shadow: 8px 8px 0px #FF6A1A;
        padding: 24px 26px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 40;
        transform-origin: center bottom;
      }
      .card-tag-orange {
        align-self: flex-start;
        padding: 6px 14px;
        font-size: 16px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        background-color: #FF6A1A;
        color: #141414;
      }
      .stat-huge-orange {
        font-size: 80px;
        font-weight: 900;
        line-height: 0.95;
        color: #FF6A1A;
        letter-spacing: -2px;
        margin: 6px 0 2px 0;
      }
      .card-desc-light {
        font-size: 36px;
        font-weight: 900;
        color: #F7F4EC;
        line-height: 1.2;
        text-transform: uppercase;
        letter-spacing: -0.5px;
      }
      .card-note-light {
        font-size: 17px;
        font-weight: 700;
        color: #F7F4EC;
        border-top: 2px dashed rgba(247, 244, 236, 0.35);
        padding-top: 10px;
        line-height: 1.35;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s03"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6.93"
    >
      <!-- Scene Clip S03 -->
      <section id="scene-s03" class="clip" data-start="0" data-duration="6.93">
        <!-- Hero Background: Ảnh split-screen toàn khung 1080x1920 -->
        <div id="hero-bg">
          <img
            id="hero-img"
            src="assets/img-06-injury-rate-prison-sentence-contrast.jpg"
            alt="Nghịch lý: Thương tật 4% đối đầu bản án 6 năm 6 tháng tù"
          />
        </div>

        <!-- Chart Grid Overlay -->
        <div class="chart-grid-overlay">
          <div class="chart-line chart-line-1"></div>
          <div class="chart-line chart-line-2"></div>
          <div class="chart-line chart-line-3"></div>
          <div class="chart-line chart-line-4"></div>
        </div>

        <!-- Top Header Block -->
        <div id="header-block">
          <div class="header-pill">NGHỊCH LÝ PHÁP LÝ</div>
          <div class="header-title-plate">
            <h1 class="header-title-text">Thương tật 4% đối đầu bản án 6 năm 6 tháng tù</h1>
          </div>
        </div>

        <!-- Overlay 1 (data): 4% THƯƠNG TẬT (atMs 14000 = 2.16s, holdMs 2600 = 2.6s) -->
        <div id="card-injury">
          <div class="card-tag-dark">KẾT QUẢ GIÁM ĐỊNH</div>
          <div>
            <div id="stat-injury-num" class="stat-huge-ink">4%</div>
            <div class="card-desc-ink">THƯƠNG TẬT</div>
          </div>
          <div class="card-note-ink">Nạn nhân vẫn sống &amp; sinh hoạt bình thường</div>
        </div>

        <!-- Overlay 2 (punch-phrase): 6 NĂM 6 THÁNG TÙ (atMs 16800 = 4.96s, holdMs 1900 = 1.9s) -->
        <div id="card-prison">
          <div class="card-tag-orange">BẢN ÁN ÁP DỤNG</div>
          <div>
            <div id="stat-prison-num" class="stat-huge-orange">6 NĂM</div>
            <div class="card-desc-light">6 THÁNG TÙ</div>
          </div>
          <div class="card-note-light">Khung định tội đặc biệt nghiêm khắc</div>
        </div>

        <!-- Fixed Bottom Signature Bar -->
        <div id="bottom-accent-bar"></div>
      </section>
    </div>

    <!-- GSAP Animation -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // 0.0s -> 6.93s: Parallax camera drift tinh tế trên ảnh nền toàn khung
      tl.fromTo(
        "#hero-img",
        { scale: 1.0 },
        { scale: 1.06, duration: 6.93, ease: "none" },
        0
      );

      // 0.1s: Header block punch entrance
      tl.fromTo(
        "#header-block",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.1
      );

      // 2.16s: Overlay 1 ("4% THƯƠNG TẬT") punch in dứt khoát
      // atMs = 14000 (tương đối: 14000 - 11840 = 2160ms = 2.16s)
      tl.fromTo(
        "#card-injury",
        { scale: 0.8, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power4.out" },
        2.16
      );

      // 4.76s: Overlay 1 rời màn hình đúng holdMs 2600ms (2.16s + 2.6s = 4.76s)
      tl.to(
        "#card-injury",
        { scale: 0.85, opacity: 0, y: -20, duration: 0.2, ease: "power2.in" },
        4.76
      );

      // 4.96s: Overlay 2 ("6 NĂM 6 THÁNG TÙ") punch slam in
      // atMs = 16800 (tương đối: 16800 - 11840 = 4960ms = 4.96s)
      tl.fromTo(
        "#card-prison",
        { scale: 1.15, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power4.out" },
        4.96
      );

      tl.fromTo(
        "#stat-prison-num",
        { scale: 0.7, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        5.02
      );

      // Đăng ký master timeline trên window.__timelines
      window.__timelines["scene-s03"] = tl;
    </script>
  
    </template>
  </body>
</html>
