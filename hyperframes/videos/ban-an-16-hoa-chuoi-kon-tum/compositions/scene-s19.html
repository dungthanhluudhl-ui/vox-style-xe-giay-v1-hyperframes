  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. Hero Card & Context Badge Entrance (Grow transition)
    tl.fromTo(
      "#hero-card",
      { scale: 0.85, opacity: 0, y: 35 },
      { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
      0.15

    tl.fromTo(
      "#case-badge",
      { y: -25, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },

      "#hero-img",
      { scale: 1.08, duration: 8.0, ease: "none" },

    // 2. Data Card (Overlay 1) at 3.58s

      { y: 40, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      3.58
    );

    tl.fromTo(
      "#data-bar-fill",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.75, ease: "power2.out" },
      3.8
    );

    tl.to(
      "#data-card",
      { y: -25, opacity: 0, duration: 0.3, ease: "power2.in" },
      5.68
    );

    // 3. Punch Phrase (Overlay 2) at 6.12s

      { scale: 0.9, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power4.out" },

      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power2.out" },
      6.25
    );

    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s19"] = tl;
