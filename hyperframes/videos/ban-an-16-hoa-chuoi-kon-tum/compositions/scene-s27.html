    <script>
      // 1. Measure SVG path lengths deterministically
      const poleEl = document.getElementById("scale-pole-path");
      const poleLen = Math.ceil(poleEl.getTotalLength() || 350);
      poleEl.style.strokeDasharray = `${poleLen}`;
      poleEl.style.strokeDashoffset = `${poleLen}`;

      const beamElements = document.querySelectorAll(".beam-path");
      const beamLengths = [];
      beamElements.forEach((path) => {
        const len = Math.ceil(path.getTotalLength() || 600);
        path.style.strokeDasharray = `${len}`;
        path.style.strokeDashoffset = `${len}`;
        beamLengths.push(len);
      });

      // 2. Create paused master timeline
      const tl = gsap.timeline({ paused: true });

      // Camera: Steady cinematic zoom-out across the 9.75s scene
      tl.fromTo(
        "#bg-photo",
        { scale: 1.16 },
        { scale: 1.0, duration: 9.75, ease: "none" },
        0,
      );

      // Entrance (TransitionIn: "flip" - 3D card perspective unfold)
      tl.fromTo(
        "#camera-wrapper",
        {
          rotationY: 18,
          transformPerspective: 1400,
          opacity: 0,
          scale: 0.96,
        },
        {
          rotationY: 0,
          transformPerspective: 1400,
          opacity: 1,
          scale: 1,
          duration: 0.75,
          ease: "power3.out",
        },
        0,
      );

      // Header card arrival
      tl.fromTo(
        "#header-card",
        { y: -40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.2,
      );

      // Overlay 1: Scale Icon progressive draw (atMs: 216880 -> 0.75s)
      tl.fromTo(
        "#scale-pole-path",
        { strokeDashoffset: poleLen },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        0.75,
      );
      tl.fromTo(
        "#scale-pivot",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
        0.95,
      );

      beamElements.forEach((path, i) => {
        tl.fromTo(
          path,
          { strokeDashoffset: beamLengths[i] },
          { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
          1.05 + i * 0.12,
        );
      });

      // Arrival of Pan 1: Left Card (4% Thương tích)
      tl.fromTo(
        "#pan-left-card",
        { scale: 0.8, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        1.6,
      );

      // Arrival of Pan 2: Right Card (Hành vi hung bạo & lý do không chết)
      tl.fromTo(
        "#pan-right-card",
        { scale: 0.8, opacity: 0, y: 25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        2.3,
      );

      // Overlay 2: Label Stamp "KHÔNG CHỈ TÍNH %" (atMs: 219720 -> 3.59s)
      tl.fromTo(
        "#label-badge",
        { scale: 1.35, opacity: 0, rotation: -4 },
        {
          scale: 1,
          opacity: 1,
          rotation: -1.5,
          duration: 0.45,
          ease: "power3.out",
        },
        3.59,
      );

      // Tilting the balance scale: Heavy emphasis on the right side
      tl.fromTo(
        "#scale-beam-group",
        { rotation: 0 },
        {
          rotation: 8,
          transformOrigin: "490px 35px",
          duration: 1.1,
          ease: "power3.inOut",
        },
        4.7,
      );
      tl.fromTo(
        "#pan-left-card",
        { y: 0 },
        { y: -25, duration: 1.1, ease: "power3.inOut" },
        4.7,
      );
      tl.fromTo(
        "#pan-right-card",
        { y: 0 },
        { y: 30, duration: 1.1, ease: "power3.inOut" },
        4.7,
      );
      tl.fromTo(
        "#pan-right-card",
        { boxShadow: "8px 8px 0px #ff6a1a" },
        {
          boxShadow: "12px 12px 0px #ff6a1a",
          duration: 0.4,
          ease: "power2.out",
        },
        5.1,
      );

      // Overlay 3: Punch Phrase "ĐÁNH GIÁ CÁCH TẤN CÔNG" (atMs: 222150 -> 6.02s)
      tl.fromTo(
        "#punch-plate",
        { y: 55, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" },
        6.02,
      );

      // Register the paused timeline with window.__timelines
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s27"] = tl;
    </script>
