      *, *::before, *::after {

      body {
        margin: 0;
        padding: 0;
        background-color: #F5F0E4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        background-color: #F5F0E4;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Classes màu an toàn theo WCAG từ style-tokens.json */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
      .hf-plate-ink { background-color: #141414; color: #F7F4EC; }

      .hf-plate-paper { background-color: #E7E3D9; color: #141414; }

      /* Khung ảnh & Photo Motion */
      .photo-viewport {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #141414;
      }
      .photo-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: center center;
        will-change: transform;
      }

      /* Lớp Peel Transition */
      .peel-mask {
        position: absolute;
        inset: 0;
        background-color: #F5F0E4;
        z-index: 20;
        pointer-events: none;
        transform-origin: top center;
      }
      .peel-edge-shadow {
        position: absolute;
        left: 0;
        width: 100%;
        height: 24px;
        bottom: 0;
        background: linear-gradient(to top, rgba(20, 20, 20, 0.4), transparent);

      /* Thanh cam thương hiệu cố định mép đáy */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 900;
        pointer-events: none;
      }

      /* Overlay Layout Containers (Dùng Flexbox để tránh xung đột transform GSAP) */
      .flex-overlay {
        display: flex;
        pointer-events: none;
      }
      .top-center {
        justify-content: center;
        align-items: flex-start;
        padding-top: 240px;
      }
      .split-center {

        flex-direction: column;
        align-items: center;

      .tag-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .dot-accent {
        width: 8px;
        height: 8px;
        border-radius: 50%;

        flex: 1;
        height: 3px;
        background: linear-gradient(90deg, transparent, #FF6A1A);

      .split-bar-right {

        border: 2px solid #FF6A1A;

        border-radius: 24px;

        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 2px;

        border-radius: 12px;
        padding: 16px 38px;

        align-items: center;
        gap: 16px;
        will-change: transform, opacity;
      }
      .badge-black {
        background-color: #141414;
        color: #F7F4EC;
        font-size: 20px;
        font-weight: 900;
        padding: 6px 14px;
        border-radius: 6px;

      }
      .title-warn {
        font-size: 46px;
        font-weight: 900;
        color: #141414;
        letter-spacing: 1px;
      }

      /* Card 3: Nạn nhân: Nhập viện (Nửa trên) */
      .side-card-3 {

        font-weight: 700;
        letter-spacing: 2px;
        color: #FF6A1A;
      }
      .side-title {
        font-size: 40px;
        font-weight: 900;
        line-height: 1.25;
      }
      .txt-light { color: #F7F4EC; }
      .txt-orange { color: #FF6A1A; }

      /* Card 4: Punch-phrase Thủ phạm: Án hình sự (Nửa dưới) */
      .punch-card-4 {
        background-color: #141414;
        border-radius: 14px;
        padding: 24px 38px;
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.65);

        flex-direction: column;
        align-items: center;
        gap: 12px;

      .punch-header-row {
        display: flex;

      .punch-kicker-txt {

      .punch-part-1 {

      .punch-hl-wrapper {

        letter-spacing: 1.5px;
        line-height: 1.2;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s18"
      data-width="1080"
      data-height="1920"
      data-duration="10.04"

            id="photo-img"

          <div id="split-badge-el" class="split-badge">

      <!-- Overlay 1: Từ lời nói đùa -->
      <section id="sec-overlay-1" class="clip flex-overlay top-center" data-start="0.48" data-duration="2.2">
        <div id="card-overlay-1" class="plate-card-1">
          <div class="tag-row">

      <section id="sec-overlay-2" class="clip flex-overlay top-center" data-start="3.67" data-duration="2.0">

      <!-- Overlay 4: Thủ phạm: Án hình sự (Nửa dưới - Punch-phrase) -->

          <div class="punch-header-row">

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Camera Zoom-out toàn cảnh trên bức ảnh split
      tl.fromTo(
        "#photo-img",
        { scale: 1.08 },
        { scale: 1.0, duration: 10.04, ease: "none" },
        0
      );

      // 2. Transition In: Peel bóc lớp giấy ngà
      tl.fromTo(
        "#peel-sheet",
        { y: 0 },
        { y: 1940, duration: 0.7, ease: "power2.inOut" },
        0
      );

      // 3. Overlay 1: TỪ LỜI NÓI ĐÙA (Start: 0.48s, Duration: 2.2s)
      tl.fromTo(
        "#card-overlay-1",
        { y: 36, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.48
      );
      tl.fromTo(
        "#card-overlay-1",
        { y: 0, opacity: 1 },
        { y: -24, opacity: 0, duration: 0.28, ease: "power2.in" },
        2.38
      );

      // 4. Split Divider Animation (t = 1.6s)
      tl.fromTo(
        "#split-line-left",
        { scaleX: 0, transformOrigin: "right center" },
        { scaleX: 1, duration: 0.55, ease: "power2.out" },
        1.6
      );
      tl.fromTo(
        "#split-line-right",
        { scaleX: 0, transformOrigin: "left center" },
        { scaleX: 1, duration: 0.55, ease: "power2.out" },
        1.6
      );
      tl.fromTo(
        "#split-badge-el",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        1.85
      );

      // 5. Overlay 2: HỆ QUẢ TỨC THÌ (Start: 3.67s, Duration: 2.0s)
      tl.fromTo(
        "#card-overlay-2",
        { scale: 0.88, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        3.67
      );
      tl.fromTo(
        "#card-overlay-2",
        { scale: 1, opacity: 1 },
        { scale: 0.94, opacity: 0, duration: 0.25, ease: "power2.in" },
        5.4
      );

      // 6. Overlay 3: NẠN NHÂN: NHẬP VIỆN (Start: 6.04s, Duration: 2.0s)
      tl.fromTo(
        "#card-overlay-3",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        6.04
      );
      tl.fromTo(
        "#card-overlay-3",
        { x: 0, opacity: 1 },
        { x: 30, opacity: 0, duration: 0.25, ease: "power2.in" },
        7.78
      );

      // 7. Overlay 4: THỦ PHẠM: ÁN HÌNH SỰ (Punch-phrase, Start: 8.09s, Duration: 1.95s)
      tl.fromTo(
        "#card-overlay-4",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.48, ease: "power3.out" },
        8.09
      );
      tl.fromTo(
        "#punch-hl-bg",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.38, ease: "power2.out" },
        8.28
      );

      // Đăng ký timeline chính với HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s18"] = tl;
    </script>
