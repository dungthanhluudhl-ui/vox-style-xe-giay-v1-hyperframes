<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .bg-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        pointer-events: none;
      }
      .bg-spotlight {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(20, 20, 20, 0) 35%, rgba(20, 20, 20, 0.32) 100%);
        pointer-events: none;
      }
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 999;
      }

      /* An toàn tương phản theo style DNA */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
      .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
      .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
      .hf-plate-paper { background-color: #E7E3D9; color: #141414; }
    </style>

    <div
      id="root"
      data-composition-id="scene-s13"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="9.23"
    >
      <!-- Lớp nền phong cách Vox: giấy ngà, lưới 84px và vignette spotlight -->
      <div class="bg-grid"></div>
      <div class="bg-spotlight"></div>

      <!-- SHOT S13-1: Lớp hình ảnh chính & dòng thời gian (0s -> 9.23s) -->
      <div id="hero-clip" class="clip" data-start="0" data-duration="9.23" style="z-index: 10;">
        <div id="camera-wrapper" style="position: absolute; inset: 0; transform-origin: 50% 48%;">
          <!-- Header chuyên mục dòng thời gian (Y: 175px - nằm trong safe zone) -->
          <div id="scene-header" style="position: absolute; top: 175px; left: 80px; display: flex; align-items: center; gap: 14px;">
            <span style="background: #141414; color: #F7F4EC; font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; font-size: 20px; padding: 6px 14px; border-radius: 6px; letter-spacing: 1px; text-transform: uppercase;">HỒ SƠ VỤ ÁN</span>
            <span style="color: #141414; font-family: 'Be Vietnam Pro', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.5px;">• TÁI HIỆN DÒNG THỜI GIAN</span>
          </div>

          <!-- Khung ảnh chính (Hero Card) - Kích thước chiếm ~54.5% dải hữu dụng [160, 1390] -->
          <div
            id="hero-card"
            style="
              position: absolute;
              top: 400px;
              left: 80px;
              width: 920px;
              height: 670px;
              border-radius: 16px;
              border: 4px solid #141414;
              box-shadow: 10px 10px 0px rgba(20, 20, 20, 0.28);
              background: #F5F0E4;
              overflow: hidden;
            "
          >
            <!-- Ảnh AI Flow paper-collage (giữ nguyên màu, không CSS filter/grayscale theo STYLE DNA §2) -->
            <img
              id="hero-img"
              src="assets/img-11-timeline-confrontation-scene-cutout.jpg"
              alt="17:00 timeline confrontation"
              style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; display: block;"
            />

            <!-- Miếng dán băng dính phong cách collage góc trên ảnh -->
            <div style="position: absolute; top: -12px; right: 40px; width: 120px; height: 32px; background: rgba(231, 227, 217, 0.88); border: 1.5px solid rgba(20, 20, 20, 0.3); transform: rotate(3deg); box-shadow: 2px 2px 4px rgba(20, 20, 20, 0.15); pointer-events: none; z-index: 5;"></div>

            <!-- Callout nhịp căng thẳng giữa cảnh (t = 4.8s -> 6.35s) chống dead-air (>3s) -->
            <div
              id="tension-badge"
              style="
                position: absolute;
                bottom: 24px;
                left: 24px;
                background-color: #141414;
                border: 2px solid #FF6A1A;
                border-radius: 8px;
                padding: 10px 20px;
                display: flex;
                align-items: center;
                gap: 10px;
                box-shadow: 4px 4px 0px rgba(20, 20, 20, 0.4);
                opacity: 0;
              "
            >
              <div style="width: 10px; height: 10px; border-radius: 50%; background-color: #FF6A1A;"></div>
              <span style="font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; font-size: 22px; color: #FF6A1A; letter-spacing: 0.5px; text-transform: uppercase;">LỜI TRÊU CHỌC LẶP LẠI</span>
            </div>
          </div>
        </div>
      </div>

      <!-- OVERLAY 1: Icon đồng hồ 17:00 tự vẽ (startMs: 94080 -> 0.40s, holdMs: 2400 -> 2.40s) -->
      <div id="clock-clip" class="clip" data-start="0.4" data-duration="2.4" style="z-index: 30;">
        <div
          id="clock-card"
          class="hf-plate-ink"
          style="
            position: absolute;
            left: 80px;
            top: 235px;
            width: 130px;
            height: 130px;
            border-radius: 16px;
            border: 3px solid #141414;
            box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
          "
        >
          <svg width="84" height="84" viewBox="0 0 100 100" style="overflow: visible; display: block;">
            <!-- Vòng tròn kim loại đồng hồ tự vẽ stroke -->
            <circle id="clock-rim" cx="50" cy="50" r="38" fill="none" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round" />
            <!-- Vạch mốc giờ 12h, 3h, 6h, 9h -->
            <line x1="50" y1="18" x2="50" y2="26" stroke="#F7F4EC" stroke-width="4" stroke-linecap="round" />
            <line x1="82" y1="50" x2="74" y2="50" stroke="#F7F4EC" stroke-width="4" stroke-linecap="round" />
            <line x1="50" y1="82" x2="50" y2="74" stroke="#F7F4EC" stroke-width="4" stroke-linecap="round" />
            <line x1="18" y1="50" x2="26" y2="50" stroke="#F7F4EC" stroke-width="4" stroke-linecap="round" />
            <!-- Kim phút chỉ 12h (0 độ) -->
            <line id="clock-min" x1="50" y1="50" x2="50" y2="24" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" />
            <!-- Kim giờ nhích đến 17h00 (150 độ) -->
            <line id="clock-hour" x1="50" y1="50" x2="63" y2="72" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round" />
            <!-- Tâm trục xoay -->
            <circle cx="50" cy="50" r="5" fill="#FF6A1A" />
          </svg>
        </div>
      </div>

      <!-- OVERLAY 2: Label 17:00 • TÍNH TIỀN (startMs: 94700 -> 1.02s, holdMs: 2600 -> 2.60s) -->
      <div id="label-clip" class="clip" data-start="1.02" data-duration="2.6" style="z-index: 32;">
        <div
          id="label-card"
          style="
            position: absolute;
            left: 230px;
            top: 235px;
            width: 630px;
            height: 130px;
            border-radius: 16px;
            border: 3px solid #141414;
            box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.22);
            background: #141414;
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 20px;
            opacity: 0;
          "
        >
          <!-- Khối cam nhấn mạnh mốc thời gian 17:00 (chữ mực trên nền cam = 6.4:1) -->
          <div
            id="time-pill"
            style="
              background: #FF6A1A;
              border-radius: 10px;
              padding: 12px 22px;
              display: flex;
              align-items: center;
              justify-content: center;
              box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.25);
            "
          >
            <span style="font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; font-size: 38px; color: #141414; line-height: 1; letter-spacing: 0.5px;">17:00</span>
          </div>

          <!-- Nhãn nội dung hoá đơn tính tiền (chữ sáng #F7F4EC trên nền mực #141414 = 16.8:1) -->
          <div style="display: flex; flex-direction: column; justify-content: center;">
            <span style="font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; font-size: 36px; color: #F7F4EC; line-height: 1.2; letter-spacing: -0.5px;">• TÍNH TIỀN</span>
            <span style="font-family: 'Be Vietnam Pro', sans-serif; font-weight: 700; font-size: 20px; color: #FF6A1A; line-height: 1.2; letter-spacing: 1px; margin-top: 4px;">CHUẨN BỊ RA VỀ</span>
          </div>
        </div>
      </div>

      <!-- OVERLAY 3: Punch-phrase GIỌT NƯỚC TRÀN LY (startMs: 100390 -> 6.71s, holdMs: 2400) -->
      <div id="punch-clip" class="clip" data-start="6.71" data-duration="2.52" style="z-index: 40;">
        <div
          id="punch-card"
          style="
            position: absolute;
            left: 80px;
            top: 1110px;
            width: 920px;
            border-radius: 16px;
            border: 4px solid #141414;
            box-shadow: 12px 12px 0px rgba(20, 20, 20, 0.32);
            background: #141414;
            padding: 26px 36px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
          "
        >
          <!-- Kicker thanh cam điểm nhấn -->
          <div id="punch-kicker" style="display: flex; align-items: center; gap: 14px;">
            <span style="background: #FF6A1A; color: #141414; font-family: 'Be Vietnam Pro', sans-serif; font-weight: 900; font-size: 20px; padding: 6px 14px; border-radius: 6px; letter-spacing: 1px; text-transform: uppercase;">BƯỚC NGOẶT</span>
            <span style="color: #FF6A1A; font-family: 'Be Vietnam Pro', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.5px;">XUNG ĐỘT BÙNG PHÁT</span>
          </div>

          <!-- Tiêu đề điểm nhấn chính (Punch phrase) -->
          <h1
            id="punch-text"
            style="
              margin: 0;
              font-family: 'Be Vietnam Pro', sans-serif;
              font-weight: 900;
              font-size: 64px;
              line-height: 1.2;
              color: #F7F4EC;
              letter-spacing: -1px;
              text-transform: uppercase;
            "
          >
            GIỌT NƯỚC TRÀN LY
          </h1>
        </div>
      </div>

      <!-- Thanh cam thương hiệu cố định mép đáy -->
      <div class="bottom-brand-bar"></div>
    </div>

    <script>
      // Khởi tạo một timeline GSAP duy nhất ở trạng thái paused theo hợp đồng HyperFrames
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Chuẩn bị đường nét vẽ kim đồng hồ
      const clockRim = document.getElementById("clock-rim");
      if (clockRim) {
        const rimLength = 239;
        clockRim.style.strokeDasharray = `${rimLength}`;
        clockRim.style.strokeDashoffset = `${rimLength}`;
      }

      // 1. Vào cảnh kiểu "strike": giáng mạnh khung tranh xuống với gia tốc cao (0.05s)
      tl.fromTo(
        "#hero-card",
        { y: -80, rotation: -2.5, scale: 1.06, opacity: 0 },
        { y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power4.out" },
        0.05
      );
      tl.fromTo(
        "#scene-header",
        { y: -20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.15
      );

      // Chuyển động máy quay: Zoom-in liên tục tạo cảm giác căng thẳng tăng dần (0s -> 9.23s)
      tl.to(
        "#camera-wrapper",
        { scale: 1.07, duration: 9.23, ease: "none" },
        0
      );

      // 2. OVERLAY 1: Đồng hồ xuất hiện và tự vẽ nét tại 0.40s
      tl.fromTo(
        "#clock-card",
        { scale: 0, opacity: 0, rotation: -12 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "power3.out" },
        0.40
      );
      tl.fromTo(
        "#clock-rim",
        { strokeDashoffset: 239 },
        { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
        0.45
      );
      tl.fromTo(
        "#clock-min",
        { scaleY: 0, transformOrigin: "50px 50px" },
        { scaleY: 1, transformOrigin: "50px 50px", duration: 0.4, ease: "power3.out" },
        0.55
      );
      tl.fromTo(
        "#clock-hour",
        { rotation: -150, transformOrigin: "50px 50px" },
        { rotation: 0, transformOrigin: "50px 50px", duration: 0.7, ease: "power3.out" },
        0.60
      );
      // Rút lui êm trước khi hết slot clip (2.45s)
      tl.to(
        "#clock-card",
        { opacity: 0, scale: 0.9, duration: 0.3, ease: "power2.in" },
        2.45
      );

      // 3. OVERLAY 2: Label 17:00 • TÍNH TIỀN trượt vào tại 1.02s
      tl.fromTo(
        "#label-card",
        { x: -35, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.02
      );
      tl.fromTo(
        "#time-pill",
        { scale: 0.8, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.5)" },
        1.15
      );
      // Rút lui êm trước khi hết slot clip (3.30s)
      tl.to(
        "#label-card",
        { opacity: 0, x: -20, duration: 0.3, ease: "power2.in" },
        3.30
      );

      // 4. Nhịp căng thẳng trung gian: Nhắc lại hành vi trêu chọc tại 4.80s (chống dead-air)
      tl.fromTo(
        "#tension-badge",
        { scale: 0, opacity: 0, y: 15 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        4.80
      );
      tl.to(
        "#tension-badge",
        { opacity: 0, duration: 0.25, ease: "power2.in" },
        6.35
      );

      // 5. OVERLAY 3: Punch-phrase GIỌT NƯỚC TRÀN LY giáng mạnh tại 6.71s
      tl.fromTo(
        "#punch-card",
        { scale: 1.14, y: 40, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.4, ease: "power4.out" },
        6.71
      );
      tl.fromTo(
        "#punch-kicker",
        { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, transformOrigin: "0% 50%", duration: 0.3, ease: "power2.out" },
        6.85
      );

      // Đăng ký timeline chính lên window.__timelines
      window.__timelines["scene-s13"] = tl;
    </script>
  
    </template>
