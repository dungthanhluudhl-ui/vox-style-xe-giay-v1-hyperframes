    <script>
      const tl = gsap.timeline({ paused: true });

      // Camera motion: zoom-out across the 7-second scene
      tl.fromTo(
        "#camera-frame",
        { scale: 1.16 },
        { scale: 1.02, duration: 7.0, ease: "power1.out" },
        0
      );

      // Beat 1: Premise card punches in at 0.41s
      tl.fromTo(
        "#premise-card",
        { scale: 0.9, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.41
      );

      // SVG BAN icon self-drawing paths
      const banCircle = document.getElementById("ban-circle");
      const banSlash = document.getElementById("ban-slash");
      const circleLen = banCircle && banCircle.getTotalLength ? banCircle.getTotalLength() : 238.76;
      const slashLen = banSlash && banSlash.getTotalLength ? banSlash.getTotalLength() : 76.37;

      if (banCircle && banSlash) {
        banCircle.style.strokeDasharray = String(circleLen);
        banCircle.style.strokeDashoffset = String(circleLen);
        banSlash.style.strokeDasharray = String(slashLen);
        banSlash.style.strokeDashoffset = String(slashLen);

        tl.to(banCircle, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 0.85);
        tl.to(banSlash, { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, 1.05);
      }

      // Strike line expands across false premise (intentional cross-out)
      tl.fromTo(
        "#strike-bar",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.35, ease: "power3.out" },
        0.95
      );

      // BÁC BỎ stamp slams down
      tl.fromTo(
        "#reject-stamp",
        { scale: 1.7, opacity: 0, rotation: 10 },
        { scale: 1, opacity: 1, rotation: -5, duration: 0.35, ease: "power3.out" },
        1.15
      );

      // Clarifying caption arrives
      tl.fromTo(
        "#premise-subtext",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
        1.55
      );

      // Beat 1 transitions out cleanly before Beat 2
      tl.to(
        "#premise-card",
        { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" },
        2.95
      );

      // Beat 2: Punch phrase card punches in at 3.41s
      tl.fromTo(
        "#punch-card",
        { scale: 0.88, opacity: 0, y: 40 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        3.41
      );

      // Orange accent bar wipes in
      tl.fromTo(
        "#punch-accent-bar",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power3.out" },
        3.8
      );

      // Legal badge settles into place
      tl.fromTo(
        "#punch-legal-badge",
        { opacity: 0, y: 15 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        4.15
      );

      // Beat 2: Punch phrase card transitions out at 6.06s (holdMs: 2650ms after 3.41s)
      tl.to(
        "#punch-card",
        { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" },
        6.06
      );

      window.__timelines["scene-s23"] = tl;
