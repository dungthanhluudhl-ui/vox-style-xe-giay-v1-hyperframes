  <script>
    // Khởi tạo timeline paused duy nhất gắn với window.__timelines["scene-s28"]
    const tl = gsap.timeline({ paused: true });

    // 1. Camera Motion: Zoom-in chậm trên không gian phiên tòa (toàn bộ 6 giây)
    tl.fromTo(
      "#bg-wrapper",
      { scale: 1.0 },
      { scale: 1.08, duration: 6.0, ease: "none" },
      0
    );

    // 2. Punch-phrase Entrance: Bản án áp xuống đanh thép lúc t = 1.0s (226880ms)
    tl.fromTo(
      "#verdict-card",
      { scale: 0.82, opacity: 0, y: 35 },
      { scale: 1.0, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
      1.0
    );

    // Vạch cam mở ra dứt khoát ngay sau khi thẻ đáp xuống
    tl.fromTo(
      "#card-divider",
      { scaleX: 0 },
      { scaleX: 1.0, duration: 0.45, ease: "power2.out" },
      1.35
    );

    // 3. Stamp Slam: Con dấu đỏ "TÍNH CHẤT CÔN ĐỒ" đóng cộp xuống lúc t = 4.3s (230180ms)
    tl.fromTo(
      "#stamp-seal",
      { scale: 2.3, opacity: 0, rotation: -24 },
      { scale: 1.0, opacity: 1, rotation: -7, duration: 0.38, ease: "power4.out" },
      4.3
    );

    // Đăng ký timeline cho HyperFrames render engine
    window.__timelines["scene-s28"] = tl;
  </script>
