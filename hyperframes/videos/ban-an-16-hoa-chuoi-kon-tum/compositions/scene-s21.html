<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Nền giấy ngà và lưới ô vuông 84px chuẩn Vox */
      .vox-grid-bg {
        position: absolute;
        inset: 0;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }

      /* Thanh cam nhận diện cố định mép dưới */
      #brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }

      /* Background Photo: Phủ toàn bộ khung hình 1080x1920 */
      #bg-container {
        position: absolute;
        inset: 0;
        overflow: hidden;
        transform-origin: top center;
        will-change: transform, opacity;
      }
      #bg-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: center center;
        will-change: transform;
      }

      /* Overlay 1: Badge tài liệu pháp lý (Doc Icon) */
      #doc-badge {
        position: absolute;
        top: 220px;
        left: 60px;
        display: flex;
        align-items: center;
        gap: 16px;
        background-color: #141414;
        padding: 14px 24px;
        border: 2.5px solid #FF6A1A;
        box-shadow: 6px 6px 0px #141414;
        will-change: transform, opacity;
      }
      .doc-icon {
        display: block;
        width: 40px;
        height: 40px;
        flex-shrink: 0;
      }
      .doc-label {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #F7F4EC;
        white-space: nowrap;
      }

      /* Overlay 2: Punch Phrase Card */
      #punch-card {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 960px;
        background-color: #141414;
        border: 3.5px solid #FF6A1A;
        box-shadow: 10px 10px 0px #141414;
        padding: 28px 36px;
        will-change: transform, opacity;
      }
      .punch-tag {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #FF6A1A;
        margin-bottom: 12px;
      }
      .punch-main-phrase {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 14px 18px;
        margin: 0;
        line-height: 1.25;
      }
      .punch-word {
        font-size: 52px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: -0.5px;
        white-space: nowrap;
      }
      .punch-symbol {
        font-size: 58px;
        font-weight: 900;
        color: #FF6A1A;
        line-height: 1;
      }
      .punch-sub {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1.5px dashed rgba(247, 244, 236, 0.35);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .punch-sub-text {
        font-size: 22px;
        font-weight: 700;
        color: #F7F4EC;
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }
      .punch-arrow {
        color: #FF6A1A;
        font-size: 22px;
        font-weight: 900;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s21"
      data-width="1080"
      data-height="1920"
      data-duration="6"
    >
      <!-- Nền giấy lưới ngà bảo vệ -->
      <div class="vox-grid-bg"></div>

      <!-- Main Shot Clip: Ảnh nền Bộ luật Hình sự & Kính lúp toàn khung (0.0s -> 6.0s) -->
      <section id="scene-s21" class="clip" data-start="0" data-duration="6">
        <div id="bg-container">
          <img
            id="bg-photo"
            src="assets/img-07-penal-code-investigation-questions.jpg"
            alt="Bộ luật Hình sự và kính lúp điều tra"
          />
        </div>
      </section>

      <!-- Overlay 1 Clip: Icon Doc & Nhãn hồ sơ tố tụng (0.5s -> 2.7s, holdMs = 2200) -->
      <div class="clip" data-start="0.5" data-duration="2.2">
        <div id="doc-badge">
          <svg class="doc-icon" viewBox="0 0 48 48" fill="none">
            <path
              class="doc-path"
              d="M10 6 H30 L38 14 V42 H10 Z"
              stroke="#FF6A1A"
              stroke-width="3.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              class="doc-path"
              d="M30 6 V14 H38"
              stroke="#FF6A1A"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              class="doc-path"
              d="M17 22 H31"
              stroke="#F7F4EC"
              stroke-width="3"
              stroke-linecap="round"
            />
            <path
              class="doc-path"
              d="M17 29 H31"
              stroke="#F7F4EC"
              stroke-width="3"
              stroke-linecap="round"
            />
            <path
              class="doc-path"
              d="M17 36 H25"
              stroke="#F7F4EC"
              stroke-width="3"
              stroke-linecap="round"
            />
          </svg>
          <span class="doc-label">HỒ SƠ TỐ TỤNG</span>
        </div>
      </div>

      <!-- Overlay 2 Clip: Punch Phrase (2.88s -> 5.88s, holdMs = 3000) -->
      <div class="clip" data-start="2.88" data-duration="3.0">
        <div id="punch-card">
          <div class="punch-tag">NGUYÊN TẮC ĐỊNH TỘI</div>
          <div class="punch-main-phrase">
            <span class="punch-word">ĐỊNH TỘI</span>
            <span class="punch-symbol">≠</span>
            <span class="punch-word">% THƯƠNG TẬT</span>
          </div>
          <div class="punch-sub">
            <span class="punch-arrow">▶</span>
            <span class="punch-sub-text">ĐÁNH GIÁ BẢN CHẤT HÀNH VI</span>
          </div>
        </div>
      </div>

      <!-- Thanh cam nhận diện cố định mép dưới -->
      <div id="brand-bar"></div>
    </div>

    <script>
      // Khởi tạo GSAP Timeline dạng paused tuân thủ HyperFrames runtime
      const tl = gsap.timeline({ paused: true });

      // 1. Chuẩn bị hiệu ứng tự vẽ cho SVG paths icon Doc
      const docPaths = document.querySelectorAll(".doc-path");
      docPaths.forEach(function (path) {
        const len = path.getTotalLength();
        path.style.strokeDasharray = len + "";
        path.style.strokeDashoffset = len + "";
      });

      // 2. Chuyển động vào cảnh Unfold cho Background Photo (0.0s -> 0.7s)
      tl.fromTo(
        "#bg-container",
        {
          opacity: 0,
          scaleY: 0.75,
        },
        {
          opacity: 1,
          scaleY: 1,
          duration: 0.7,
          ease: "power3.out",
        },
        0
      );

      // Camera motion zoom-in chậm xuyên suốt cảnh (0.0s -> 6.0s)
      tl.fromTo(
        "#bg-photo",
        { scale: 1.0 },
        { scale: 1.08, duration: 6.0, ease: "none" },
        0
      );

      // 3. Overlay 1: Doc badge xuất hiện (0.5s)
      tl.fromTo(
        "#doc-badge",
        { opacity: 0, scale: 0.85, y: -20 },
        { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.5
      );

      // Nét vẽ icon Doc tuần tự xuất hiện
      docPaths.forEach(function (path, i) {
        const len = path.getTotalLength();
        tl.fromTo(
          path,
          { strokeDashoffset: len },
          {
            strokeDashoffset: 0,
            duration: 0.35,
            ease: "power2.out",
          },
          0.65 + i * 0.07
        );
      });

      // Doc badge kết thúc hiển thị và ẩn đúng theo holdMs (2.35s -> 2.65s, clip kết thúc ở 2.7s)
      tl.fromTo(
        "#doc-badge",
        { opacity: 1, y: 0, scale: 1 },
        { opacity: 0, y: -25, scale: 0.95, duration: 0.3, ease: "power2.in" },
        2.35
      );

      // 4. Overlay 2: Punch Phrase xuất hiện (2.88s)
      tl.fromTo(
        "#punch-card",
        { opacity: 0, y: 35, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
        2.88
      );

      // Dòng phụ trong punch-card trượt vào
      tl.fromTo(
        ".punch-sub",
        { opacity: 0, x: -16 },
        { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" },
        3.2
      );

      // Punch Phrase kết thúc hiển thị và ẩn đúng theo holdMs (5.5s -> 5.85s, clip kết thúc ở 5.88s)
      tl.fromTo(
        "#punch-card",
        { opacity: 1, y: 0, scale: 1 },
        { opacity: 0, y: -25, scale: 0.96, duration: 0.35, ease: "power2.in" },
        5.5
      );

      // Đăng ký timeline chính duy nhất cho HyperFrames
      window.__timelines["scene-s21"] = tl;
    </script>
  
    </template>
  </body>
</html>
