<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      width: 1080px;
      height: 1920px;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    /* Quy chuẩn layout .clip của HyperFrames */
    .clip {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Lớp nền lưới grid và spotlight vignette */
    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      opacity: 0.85;
      z-index: 1;
    }

    /* Camera Stage chứa asset ảnh chính */
    #camera-stage {
      position: absolute;
      inset: -50px;
      z-index: 2;
      will-change: transform;
      transform-origin: 50% 65%;
    }

    .image-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #main-asset {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 68%;
      display: block;
    }

    /* Spotlight vignette theo style token cho cảnh án mạng/cảnh báo */
    .spotlight-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 60%, rgba(20, 20, 20, 0) 35%, rgba(20, 20, 20, 0.48) 100%);
      pointer-events: none;
      z-index: 3;
    }

    /* Tia chớp va đập lúc strike transition-in */
    #impact-flash {
      position: absolute;
      inset: 0;
      background-color: #F7F4EC;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* Overlay 1: Pin & Nhãn ĐỊA BÀN KON TUM */
    #location-group {
      position: absolute;
      top: 540px;
      left: 100px;
      right: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 20;
    }

    .pin-wrapper {
      position: relative;
      width: 68px;
      height: 82px;
      flex-shrink: 0;
      transform-origin: 50% 100%;
    }

    .pin-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(4px 6px 0px rgba(20, 20, 20, 0.6));
    }

    #location-badge {
      display: inline-flex;
      align-items: center;
      background-color: #141414;
      border: 3px solid #141414;
      border-left: 10px solid #FF6A1A;
      border-radius: 8px;
      padding: 16px 32px;
      box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.45);
    }

    .location-text {
      color: #F7F4EC;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Overlay 2: Punch phrase BẢN ÁN GIẾT NGƯỜI */
    #punch-card-wrapper {
      position: absolute;
      top: 800px;
      left: 70px;
      right: 70px;
      display: flex;
      justify-content: center;
      z-index: 30;
    }

    #punch-card {
      width: 100%;
      background-color: #141414;
      border: 4px solid #141414;
      border-radius: 12px;
      padding: 36px 44px;
      box-shadow: 12px 14px 0px rgba(20, 20, 20, 0.55);
      transform-origin: 50% 50%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .punch-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .punch-tag {
      background-color: #FF6A1A;
      color: #141414;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1.5px;
      padding: 8px 18px;
      border-radius: 4px;
      text-transform: uppercase;
      display: inline-block;
    }

    .case-code {
      color: #E7E3D9;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      opacity: 0.9;
    }

    .punch-title {
      color: #F7F4EC;
      font-size: 68px;
      font-weight: 900;
      line-height: 1.22;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .punch-footer {
      border-top: 2px solid rgba(247, 244, 236, 0.2);
      padding-top: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .court-authority {
      color: #E7E3D9;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Thanh cam đáy khung hình - Chữ ký thị giác Vox */
    .bottom-brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 10px;
      background-color: #FF6A1A;
      z-index: 100;
      pointer-events: none;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s02"
    data-width="1080"
    data-height="1920"
    data-duration="5.96"
  >
    <!-- CLIP 0: Background & Camera Visual (Toàn bộ thời lượng scene) -->
    <div id="shot-bg" class="clip" data-start="0" data-duration="5.96" data-track-index="0">
      <div class="grid-pattern"></div>
      <div id="camera-stage">
        <div class="image-container">
          <img
            id="main-asset"
            src="assets/img-01-kon-tum-court-food-cutout.jpg"
            alt="Bản đồ Kon Tum và búa thẩm phán"
          />
        </div>
        <div class="spotlight-vignette"></div>
      </div>
      <div id="impact-flash"></div>
    </div>

    <!-- CLIP 1: Overlays Địa Bàn Kon Tum (Pin + Label) -->
    <div id="overlay-location" class="clip" data-start="0.92" data-duration="2.5" data-track-index="1">
      <div id="location-group">
        <div class="pin-wrapper" id="pin-icon">
          <svg class="pin-svg" viewBox="0 0 68 82" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M34 80C34 80 62 49.3333 62 31C62 15.536 49.464 3 34 3C18.536 3 6 15.536 6 31C6 49.3333 34 80 34 80Z"
              fill="#FF6A1A"
              stroke="#141414"
              stroke-width="5"
              stroke-linejoin="round"
            />
            <circle cx="34" cy="31" r="11" fill="#141414" />
          </svg>
        </div>
        <div id="location-badge">
          <span class="location-text">ĐỊA BÀN KON TUM</span>
        </div>
      </div>
    </div>

    <!-- CLIP 2: Punch phrase BẢN ÁN GIẾT NGƯỜI -->
    <div id="overlay-punch" class="clip" data-start="3.92" data-duration="2.04" data-track-index="2">
      <div id="punch-card-wrapper">
        <div id="punch-card">
          <div class="punch-header">
            <span class="punch-tag">VỤ ÁN HÌNH SỰ</span>
            <span class="case-code">HỒ SƠ XÉT XỬ</span>
          </div>
          <h1 class="punch-title">BẢN ÁN GIẾT NGƯỜI</h1>
          <div class="punch-footer">
            <span class="court-authority">TÒA ÁN NHÂN DÂN TỈNH KON TUM</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Dải cam cố định đáy khung hình nhận diện thương hiệu -->
    <div class="bottom-brand-bar"></div>
  </div>

  <script>
    // Khởi tạo Timeline chuẩn HyperFrames seekable runtime
    const tl = gsap.timeline({ paused: true });

    // 1. Strike Transition-In & Camera Motion (0.0s - 5.96s)
    // Cú đập dứt khoát chuyển tông từ ẩm thực sang tòa án hình sự
    tl.fromTo(
      "#camera-stage",
      { y: -90, scale: 1.16 },
      { y: 0, scale: 1.05, duration: 0.34, ease: "power4.in" },
      0
    );

    // Chớp sáng flash nhẹ ngay khi búa/khung hình va chạm mặt giấy
    tl.fromTo(
      "#impact-flash",
      { opacity: 0.45 },
      { opacity: 0, duration: 0.18, ease: "power2.out" },
      0.34
    );

    // Dư chấn rung máy sau va đập (Camera Shake với giá trị tuyệt đối)
    tl.to("#camera-stage", { y: 14, duration: 0.05, ease: "power1.out" }, 0.34);
    tl.to("#camera-stage", { y: -8, duration: 0.05, ease: "power1.inOut" }, 0.39);
    tl.to("#camera-stage", { y: 4, duration: 0.05, ease: "power1.inOut" }, 0.44);
    tl.to("#camera-stage", { y: 0, duration: 0.07, ease: "power2.out" }, 0.49);

    // Camera chuyển động zoom-in chậm dần liên tục suốt cảnh
    tl.to("#camera-stage", { scale: 1.15, duration: 5.47, ease: "none" }, 0.49);

    // 2. Overlay Pin & Nhãn Địa Bàn (0.92s - 3.42s)
    // Ghim vị trí cắm xuống bản đồ Kon Tum
    tl.fromTo(
      "#pin-icon",
      { scale: 0, opacity: 0, y: -45 },
      { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
      0.92
    );

    // Nhãn "ĐỊA BÀN KON TUM" trượt ra cạnh ghim vị trí (1.27s)
    tl.fromTo(
      "#location-badge",
      { opacity: 0, x: -35 },
      { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" },
      1.27
    );

    // Thu dọn cụm nhãn địa bàn trước khi punch-phrase xuất hiện
    tl.to(
      "#location-group",
      { opacity: 0, y: -16, duration: 0.24, ease: "power2.in" },
      3.18
    );

    // 3. Punch phrase "BẢN ÁN GIẾT NGƯỜI" (3.92s - 5.96s)
    // Đóng dấu phán quyết dứt khoát như dấu mộc đỏ/thép của phiên toà
    tl.fromTo(
      "#punch-card",
      { scale: 1.32, opacity: 0, rotation: -2.5 },
      { scale: 1, opacity: 1, rotation: -1, duration: 0.32, ease: "power4.out" },
      3.92
    );

    // Dư chấn đập thẻ phán quyết
    tl.to("#punch-card", { y: 6, duration: 0.05, ease: "power1.inOut" }, 4.24);
    tl.to("#punch-card", { y: 0, duration: 0.08, ease: "power1.out" }, 4.29);

    // Đăng ký timeline cho HyperFrames seek engine
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s02"] = tl;
  </script>

    </template>
  </body>
</html>
