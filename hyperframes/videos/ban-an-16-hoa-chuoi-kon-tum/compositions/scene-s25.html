      /* Ảnh minh hoạ AI Flow nguyên màu gốc theo STYLE DNA §2 */
      .evidence-image {

      }

      /* Vị trí độc lập từng tag, tuyệt đối không chồng lấn */
      #tag-1 {
        top: 40px;

      #tag-2 {
        top: 360px;

      #tag-3 {
        top: 690px;
        padding: 12px 22px;
        border-left-width: 8px;
      }
      #tag-3 .tag-label {
        font-size: 28px;
      }

      /* Các class màu chuẩn hỗ trợ WCAG */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background: #FF6A1A; color: #141414; }
      .hf-plate-ink { background: #141414; color: #F7F4EC; }
    </style>

    <div

      <section id="scene-s25" class="clip" data-start="0" data-duration="13" data-track-index="0">
        <!-- Nền Chart: 4 đường ngang tương ứng 20%, 40%, 60%, 80% chiều cao canvas -->
        <div class="chart-bg">
          <div class="chart-line" style="top: 384px;"></div>
          <div class="chart-line" style="top: 768px;"></div>

        <!-- Khối Tiêu đề & Punch Phrase mở đầu -->
        <div id="header-group" class="header-container">
          <div class="eyebrow-badge">

        <!-- Thư mục hồ sơ bằng chứng chứa ảnh img-13 -->
        <div class="dossier-wrapper">
          <div id="dossier-card" class="dossier-card">
            <div class="dossier-bar">
              <span class="dossier-bar-title">BẢN GIẢI PHẪU PHÁP Y & HUNG KHÍ</span>

                <span class="tag-label">1. HUNG KHÍ NHỌN</span>
              </div>

              <!-- Frame 2: Thẻ vùng cổ tử huyệt -->

    <script>
      // Timeline gốc chính thức cho HyperFrames - PAUSED theo đúng hợp đồng
      const tl = gsap.timeline({ paused: true });

      // 1. Giai đoạn vào cảnh: Unfold hiệu ứng tài liệu mở ra trên bàn điều tra
      tl.fromTo(
        "#dossier-card",
        { scale: 0.88, opacity: 0, rotateX: -22 },
        { scale: 1, opacity: 1, rotateX: 0, duration: 0.75, ease: "power3.out" },
        0.0
      );

      // Camera motion: Parallax drift chậm tinh tế trên asset suốt toàn cảnh 13s
      tl.fromTo(
        "#evidence-img",
        { scale: 1.0, y: 0 },
        { scale: 1.035, y: -16, duration: 13.0, ease: "none" },
        0.0
      );

      // 2. Overlay 1: "3 YẾU TỐ QUAN TRỌNG" (tương ứng 192300ms trong kịch bản tổng -> 0.42s)
      tl.fromTo(
        "#header-group",
        { y: -35, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        0.42
      );

      // 3. Thẻ 1: "1. HUNG KHÍ NHỌN" (tương ứng 195290ms -> 3.41s)
      // Thẻ phát sáng viền cam + tag nhảy vào dứt khoát
      tl.fromTo(
        "#frame-1",
        { borderColor: "transparent", backgroundColor: "rgba(255, 106, 26, 0)" },
        { borderColor: "#FF6A1A", backgroundColor: "rgba(255, 106, 26, 0.08)", duration: 0.4, ease: "power2.out" },
        3.41
      );
      tl.fromTo(
        "#tag-1",
        { x: 35, opacity: 0, scale: 0.88 },
        { x: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        3.41
      );

      // 4. Thẻ 2: "2. VÙNG CỔ HIỂM" (tương ứng 198370ms -> 6.49s)
      // Hạ sáng thẻ 1 để dẫn hướng mắt người xem sang thẻ 2
      tl.to("#frame-1", { backgroundColor: "rgba(255, 106, 26, 0.02)", opacity: 0.6, duration: 0.35, ease: "power1.out" }, 6.2);

      tl.fromTo(
        "#frame-2",
        { borderColor: "transparent", backgroundColor: "rgba(255, 106, 26, 0)" },
        { borderColor: "#FF6A1A", backgroundColor: "rgba(255, 106, 26, 0.08)", duration: 0.4, ease: "power2.out" },
        6.49
      );
      tl.fromTo(
        "#tag-2",
        { x: 35, opacity: 0, scale: 0.88 },
        { x: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        6.49
      );

      // 5. Thẻ 3: "3. TẤN CÔNG LIÊN TIẾP" (Punch-phrase lúc 202030ms -> 10.15s)
      // Hạ sáng thẻ 2, tập trung tối đa vào đòn tấn công quyết liệt
      tl.to("#frame-2", { backgroundColor: "rgba(255, 106, 26, 0.02)", opacity: 0.6, duration: 0.35, ease: "power1.out" }, 9.9);

      tl.fromTo(
        "#frame-3",
        { borderColor: "transparent", backgroundColor: "rgba(255, 106, 26, 0)" },
        { borderColor: "#FF6A1A", backgroundColor: "rgba(255, 106, 26, 0.12)", duration: 0.4, ease: "power2.out" },
        10.15
      );
      tl.fromTo(
        "#tag-3",
        { y: 20, opacity: 0, scale: 0.84 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power4.out" },
        10.15
      );
      // Nhịp nhấn punch cho yếu tố thứ ba
      tl.to("#tag-3", { scale: 1.05, duration: 0.22, yoyo: true, repeat: 1, ease: "power2.inOut" }, 10.65);

      // Đăng ký timeline cho HyperFrames seek-driven renderer
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s25"] = tl;
    </script>
