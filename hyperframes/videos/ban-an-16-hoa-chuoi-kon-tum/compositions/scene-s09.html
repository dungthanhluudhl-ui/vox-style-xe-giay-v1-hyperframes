<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      /* Class màu an toàn định nghĩa sẵn theo chuẩn WCAG AAA từ style-tokens.json */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      :root {
        --bg-paper: #E7E3D9;
        --bg-card: #F5F0E4;
        --ink: #141414;
        --orange: #FF6A1A;
        --on-dark: #F7F4EC;
        --grid-line: rgba(20, 20, 20, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-paper);
        color: var(--ink);
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: var(--bg-paper);
      }

      /* Quy ước clip bắt buộc: inset: 0, không đặt cứng width/height */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Nền ảnh toàn khung dọc 9:16 chuẩn background-photo full-bleed */
      #bg-photo-wrapper {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: var(--ink);
      }

      #bg-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 55%;
        display: block;
        transform-origin: center center;
      }

      /* Lớp phủ họa tiết lưới Vox DNA mờ nhẹ trên ảnh */
      #grid-overlay {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        pointer-events: none;
      }

      /* Thanh cam nhận diện cố định đáy khung hình theo Vox DNA */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 14px;
        background-color: var(--orange);
        z-index: 100;
      }

      /* Tag ngữ cảnh phía trên */
      .header-pill {
        position: absolute;
        top: 180px;
        left: 60px;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        background-color: var(--ink);
        color: var(--on-dark);
        padding: 12px 24px;
        border-radius: 4px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        border: 2px solid var(--orange);
        box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.85);
        z-index: 10;
      }

      .header-pill-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background-color: var(--orange);
      }

      /* Thẻ Overlay chung: tấm nền mực đặc đảm bảo độ tương phản WCAG */
      .overlay-card {
        position: absolute;
        top: 1060px;
        left: 60px;
        width: 960px;
        height: auto;
        background-color: var(--ink);
        border: 4px solid var(--orange);
        box-shadow: 12px 12px 0px rgba(20, 20, 20, 0.9);
        padding: 34px 40px;
        border-radius: 6px;
      }

      /* Kicker tag màu cam */
      .card-kicker {
        display: inline-block;
        background-color: var(--orange);
        color: var(--ink);
        font-size: 22px;
        font-weight: 900;
        padding: 6px 16px;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 16px;
      }

      /* Tiêu đề chính Overlay 1: đúng nguyên văn "THÙNG THỨ 1 ➔ 2" */
      .flow-title {
        margin: 0 0 12px 0;
        color: var(--on-dark);
        font-size: 64px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .flow-title .arrow {
        color: var(--orange);
        margin: 0 8px;
      }

      .card-subtext {
        margin: 0;
        color: var(--bg-paper);
        font-size: 26px;
        font-weight: 700;
        line-height: 1.35;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* Tiêu đề chính Overlay 2: "LỜI ĐÙA BÀN NHẬU" */
      .punch-title {
        margin: 0 0 12px 0;
        color: var(--on-dark);
        font-size: 64px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: -0.5px;
        text-transform: uppercase;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s09"
      data-width="1080"
      data-height="1920"
      data-duration="8.2"
    >
      <!-- Dải cam cố định chân khung hình theo Vox DNA -->
      <div id="brand-bottom-bar"></div>

      <!-- SHOT CHÍNH: Ảnh toàn khung dọc 9:16 bàn nhậu (0s - 8.2s) -->
      <section id="shot-main" class="clip" data-start="0" data-duration="8.2" style="z-index: 1;">
        <!-- Nền ảnh toàn màn hình 1080x1920 không bị giới hạn thẻ nhỏ -->
        <div id="bg-photo-wrapper">
          <img
            id="bg-photo"
            src="assets/img-12-vietnam-street-pub-drinking.jpg"
            alt="Mặt bàn quán nhậu với cốc bia và vỏ chai"
          />
          <div id="grid-overlay"></div>
        </div>

        <!-- Tag bối cảnh phía trên -->
        <div id="scene-pill" class="header-pill">
          <span class="header-pill-dot"></span>
          <span>DIỄN BIẾN VỤ ÁN • QUÁN NHẬU</span>
        </div>
      </section>

      <!-- OVERLAY 1: Label đúng nguyên văn shotlist "THÙNG THỨ 1 ➔ 2" (2.33s - 4.93s) -->
      <section id="overlay-flow" class="clip" data-start="2.33" data-duration="2.6" style="z-index: 20;">
        <div id="flow-card" class="overlay-card">
          <div class="card-kicker">CHUYỂN TIẾP CUỘC NHẬU</div>
          <h1 class="flow-title">THÙNG THỨ 1 <span class="arrow">➔</span> 2</h1>
          <p class="card-subtext">Lượng bia tiêu thụ tăng cao qua thời gian</p>
        </div>
      </section>

      <!-- OVERLAY 2: Punch Phrase "LỜI ĐÙA BÀN NHẬU" (5.52s - 8.2s) -->
      <section id="overlay-punch" class="clip" data-start="5.52" data-duration="2.68" style="z-index: 20;">
        <div id="punch-card" class="overlay-card">
          <div class="card-kicker">NGUYÊN CƠ PHÁT SINH</div>
          <h1 class="punch-title">LỜI ĐÙA BÀN NHẬU</h1>
          <p class="card-subtext">Trêu chọc chuyện bông hoa chuối của Thắng</p>
        </div>
      </section>
    </div>

    <script>
      // Khởi tạo đúng 1 timeline PAUSED chính cho HyperFrames
      const tl = gsap.timeline({ paused: true });

      // 1. Entrance: Hiệu ứng "rise" toàn bộ khung ảnh bối cảnh và tag
      tl.fromTo(
        "#bg-photo-wrapper",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0
      );

      tl.fromTo(
        "#scene-pill",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.18
      );

      // 2. Camera motion: zoom-in chậm, liên tục và mượt mà trong suốt 8.2s
      tl.fromTo(
        "#bg-photo",
        { scale: 1.0 },
        { scale: 1.15, duration: 8.2, ease: "none" },
        0
      );

      // 3. Overlay 1: Xuất hiện tại 2.33s (Label "THÙNG THỨ 1 ➔ 2")
      tl.fromTo(
        "#flow-card",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        2.33
      );

      // Rút lui nhẹ Overlay 1 trước khi hết slot (4.65s -> 4.90s)
      tl.to(
        "#flow-card",
        { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" },
        4.65
      );

      // 4. Overlay 2: Xuất hiện tại 5.52s (Punch Phrase "LỜI ĐÙA BÀN NHẬU")
      tl.fromTo(
        "#punch-card",
        { y: 45, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        5.52
      );

      // Đăng ký timeline vào hệ thống HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s09"] = tl;
    </script>
  
    </template>
  </body>
</html>
