<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
        -webkit-font-smoothing: antialiased;
      }

      /* Root composition */
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #F5F0E4;
      }

      /* Contract: .clip positioning */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Background-photo layout: covers full frame */
      .full-viewport {
        position: absolute;
        inset: 0;
        overflow: hidden;
        perspective: 1200px;
      }

      .camera-rig {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      .hero-bg-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Altitude & Risk Diagram */
      .altitude-gauge {
        position: absolute;
        top: 240px;
        right: 50px;
        width: 250px;
        height: 640px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        pointer-events: none;
        z-index: 10;
      }

      .gauge-line {
        width: 4px;
        flex-grow: 1;
        background: #FF6A1A;
        margin: 10px 0;
        opacity: 0.85;
      }

      .gauge-badge {
        position: relative;
        font-size: 20px;
        font-weight: 900;
        padding: 8px 16px;
        letter-spacing: 1px;
        text-align: center;
        white-space: nowrap;
        box-shadow: 6px 8px 0px rgba(0, 0, 0, 0.5);
      }

      /* Brand signature bottom bar */
      .bottom-accent-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }

      /* Overlays & Labels */
      .label-card-anchor {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      /* Label 1: BẢN CHẤT HÀNH VI (Top) */
      #label-1-card {
        top: 240px;
        left: 60px;
        padding: 18px 26px;
        border-left: 8px solid #FF6A1A;
        box-shadow: 8px 12px 0px rgba(0, 0, 0, 0.6);
      }

      .label-meta-tag {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 8px;
        padding: 4px 10px;
        border-radius: 2px;
      }

      .label-main-text {
        font-size: 46px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.5px;
        margin: 0;
      }

      /* Label 2: NGUY CƠ KHÁCH QUAN (Mid) */
      #label-2-card {
        top: 540px;
        left: 60px;
        padding: 18px 26px;
        border-left: 8px solid #F7F4EC;
        box-shadow: 8px 12px 0px rgba(0, 0, 0, 0.6);
      }

      /* SVG Diagram connector for shot 2 */
      .diagram-connector {
        position: absolute;
        top: 520px;
        left: 540px;
        width: 240px;
        height: 180px;
        pointer-events: none;
      }

      /* Label 3: VẾT THƯƠNG NHỎ (Near bottom safety net) */
      #label-3-card {
        top: 840px;
        left: 60px;
        padding: 18px 26px;
        border-left: 8px solid #FF6A1A;
        box-shadow: 8px 12px 0px rgba(0, 0, 0, 0.6);
      }

      /* Punch Phrase: NGUY CƠ MẤT MẠNG */
      #punch-card {
        position: absolute;
        top: 1060px;
        left: 60px;
        width: 960px;
        padding: 24px 32px;
        box-shadow: 12px 16px 0px rgba(0, 0, 0, 0.7);
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }

      .punch-text-group {
        display: flex;
        flex-direction: column;
      }

      .punch-title-row {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .punch-lead {
        font-size: 58px;
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: -1px;
      }

      .punch-highlight {
        font-size: 58px;
        font-weight: 900;
        line-height: 1.1;
        padding: 2px 16px;
        display: inline-block;
      }

      .warning-badge {
        width: 96px;
        height: 96px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .warning-svg {
        width: 88px;
        height: 88px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s05"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="10.19"
    >
      <!-- Main Visual Container (Shot S05-1): Full frame background photo -->
      <section id="shot-base" class="clip" data-start="0" data-duration="10.19">
        <div class="full-viewport" id="photo-viewport">
          <div class="camera-rig" id="camera-rig">
            <img
              id="hero-img-14"
              class="hero-bg-photo"
              src="assets/img-14-legal-intent-risk-analogy.jpg"
              alt="Người rơi từ toà nhà cao tầng xuống tấm bạt cứu nạn"
            />
          </div>
        </div>

        <!-- Visual diagram gauge: Đánh dấu độ cao nguy hiểm -->
        <div class="altitude-gauge" id="altitude-gauge">
          <div class="gauge-badge hf-plate-ink" id="gauge-badge-high" style="border: 2px solid #FF6A1A;">TẦNG CAO</div>
          <div class="gauge-line"></div>
          <div class="gauge-badge hf-plate-ink" id="gauge-badge-danger" style="border: 2px solid #FF6A1A;">ĐỘ CAO NGUY HIỂM</div>
          <div class="gauge-line"></div>
          <div class="gauge-badge hf-hl-orange" id="gauge-badge-ground" style="border: 2px solid #141414;">MẶT ĐẤT</div>
        </div>
      </section>

      <!-- Overlay 1: BẢN CHẤT HÀNH VI (25.16s -> 27.36s: scene t = 0.44s to 2.64s) -->
      <div id="clip-ov-1" class="clip" data-start="0.44" data-duration="2.2">
        <div id="label-1-card" class="label-card-anchor hf-plate-ink">
          <span class="label-meta-tag hf-hl-orange">LUẬN ĐIỂM PHÁP LÝ</span>
          <h2 class="label-main-text hf-text-light">BẢN CHẤT HÀNH VI</h2>
        </div>
      </div>

      <!-- Overlay 2: NGUY CƠ KHÁCH QUAN (27.83s -> 29.93s: scene t = 3.11s to 5.21s) -->
      <div id="clip-ov-2" class="clip" data-start="3.11" data-duration="2.1">
        <div id="label-2-card" class="label-card-anchor hf-plate-ink">
          <span class="label-meta-tag hf-hl-orange">YẾU TỐ ĐÁNH GIÁ</span>
          <h2 class="label-main-text hf-text-light">NGUY CƠ KHÁCH QUAN</h2>
        </div>
        <!-- Diagram measure line pointing out fall trajectory -->
        <svg class="diagram-connector" viewBox="0 0 240 180" fill="none">
          <path
            id="diagram-line-2"
            d="M 10 40 L 140 40 L 210 140"
            stroke="#FF6A1A"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="210" cy="140" r="7" fill="#FF6A1A" />
        </svg>
      </div>

      <!-- Overlay 3: VẾT THƯƠNG NHỎ (30.25s -> 32.45s: scene t = 5.53s to 7.73s) -->
      <div id="clip-ov-3" class="clip" data-start="5.53" data-duration="2.2">
        <div id="label-3-card" class="label-card-anchor hf-plate-ink">
          <span class="label-meta-tag hf-hl-orange">HẬU QUẢ THỰC TẾ</span>
          <h2 class="label-main-text hf-text-light">VẾT THƯƠNG NHỎ</h2>
        </div>
      </div>

      <!-- Overlay 4 & 5: NGUY CƠ MẤT MẠNG + Warning Icon (32.79s -> 34.91s: scene t = 8.07s to 10.19s) -->
      <div id="clip-ov-punch" class="clip" data-start="8.07" data-duration="2.12">
        <div id="punch-card" class="hf-plate-ink">
          <div class="punch-text-group">
            <span class="label-meta-tag hf-hl-orange" style="width: fit-content;">ĐỐI LẬP NGUY HIỂM</span>
            <div class="punch-title-row">
              <span class="punch-lead hf-text-light">NGUY CƠ</span>
              <span class="punch-highlight hf-hl-orange">MẤT MẠNG</span>
            </div>
          </div>
          <!-- Warning Icon: SVG Path Draw -->
          <div class="warning-badge" id="warning-box">
            <svg class="warning-svg" viewBox="0 0 100 100" fill="none">
              <!-- Warning Triangle -->
              <path
                id="warning-triangle"
                d="M 50 14 L 88 82 L 12 82 Z"
                stroke="#FF6A1A"
                stroke-width="8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <!-- Warning Exclamation Bar -->
              <path
                id="warning-bar"
                d="M 50 36 L 50 58"
                stroke="#FF6A1A"
                stroke-width="8"
                stroke-linecap="round"
              />
              <!-- Warning Exclamation Dot -->
              <circle
                id="warning-dot"
                cx="50"
                cy="70"
                r="4.5"
                fill="#FF6A1A"
              />
            </svg>
          </div>
        </div>
      </div>

      <!-- Signature persistent bottom accent bar -->
      <div class="bottom-accent-bar" data-layout-ignore="true"></div>
    </div>

    <script>
      // Single paused timeline strictly attached to window.__timelines["scene-s05"]
      const tl = gsap.timeline({ paused: true });

      // Setup SVG paths for progressive draw
      const diagLine = document.querySelector("#diagram-line-2");
      if (diagLine) {
        const len = diagLine.getTotalLength();
        diagLine.style.strokeDasharray = len;
        diagLine.style.strokeDashoffset = len;
      }

      const warnTriangle = document.querySelector("#warning-triangle");
      if (warnTriangle) {
        const len = warnTriangle.getTotalLength();
        warnTriangle.style.strokeDasharray = len;
        warnTriangle.style.strokeDashoffset = len;
      }

      const warnBar = document.querySelector("#warning-bar");
      if (warnBar) {
        const len = warnBar.getTotalLength();
        warnBar.style.strokeDasharray = len;
        warnBar.style.strokeDashoffset = len;
      }

      // ==========================================
      // 1. SCENE ENTRANCE: "unfold" + CAMERA MOTION: "zoom-out"
      // ==========================================
      // Unfold entrance on the main photograph viewport
      tl.fromTo(
        "#photo-viewport",
        {
          opacity: 0,
          scale: 0.96,
          rotationX: 12,
          transformOrigin: "50% 0%"
        },
        {
          opacity: 1,
          scale: 1.0,
          rotationX: 0,
          duration: 0.75,
          ease: "power3.out"
        },
        0
      );

      // Camera motion: slow, continuous zoom-out
      tl.fromTo(
        "#camera-rig",
        {
          scale: 1.12
        },
        {
          scale: 1.0,
          duration: 10.19,
          ease: "none"
        },
        0
      );

      // Fade in altitude gauge diagram
      tl.fromTo(
        "#altitude-gauge",
        { opacity: 0, x: 30 },
        { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" },
        0.2
      );

      // ==========================================
      // 2. OVERLAY 1: BẢN CHẤT HÀNH VI (0.44s - 2.64s)
      // ==========================================
      tl.fromTo(
        "#label-1-card",
        { opacity: 0, y: 35 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.44
      );
      tl.to(
        "#label-1-card",
        { opacity: 0, y: -20, duration: 0.22, ease: "power2.in" },
        2.40
      );

      // ==========================================
      // 3. OVERLAY 2: NGUY CƠ KHÁCH QUAN (3.11s - 5.21s)
      // ==========================================
      tl.fromTo(
        "#label-2-card",
        { opacity: 0, x: -40 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        3.11
      );
      // Diagram line drawing
      tl.to(
        "#diagram-line-2",
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        3.25
      );
      tl.to(
        "#label-2-card",
        { opacity: 0, x: -25, duration: 0.22, ease: "power2.in" },
        4.97
      );

      // ==========================================
      // 4. OVERLAY 3: VẾT THƯƠNG NHỎ (5.53s - 7.73s)
      // ==========================================
      tl.fromTo(
        "#label-3-card",
        { opacity: 0, y: 35 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        5.53
      );
      tl.to(
        "#label-3-card",
        { opacity: 0, y: -20, duration: 0.22, ease: "power2.in" },
        7.49
      );

      // ==========================================
      // 5. OVERLAY 4 & 5: NGUY CƠ MẤT MẠNG + WARNING ICON (8.07s - 10.19s)
      // ==========================================
      // Punch phrase entrance
      tl.fromTo(
        "#punch-card",
        { opacity: 0, scale: 0.92, y: 35 },
        { opacity: 1, scale: 1.0, y: 0, duration: 0.5, ease: "power3.out" },
        8.07
      );

      // Warning icon progressively drawing paths (atMs: 33320 -> relative: 8.60s)
      tl.to(
        "#warning-triangle",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        8.60
      );
      tl.to(
        "#warning-bar",
        { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
        8.85
      );
      tl.fromTo(
        "#warning-dot",
        { scale: 0, transformOrigin: "50% 50%" },
        { scale: 1, duration: 0.25, ease: "power3.out" },
        9.00
      );

      // Register master timeline on window.__timelines
      window.__timelines["scene-s05"] = tl;
    </script>
  
    </template>
  </body>
</html>
