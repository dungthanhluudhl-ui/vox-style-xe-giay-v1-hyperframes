    <script>
      // Khởi tạo độ dài strokeDash cho các đường SVG vẽ tự động
      const animPaths = document.querySelectorAll(".svg-anim-path");
      animPaths.forEach(function (path) {
        const len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
      });

      // Đăng ký đúng 1 paused GSAP timeline cho composition
      const tl = gsap.timeline({ paused: true });

      // 0.0s: Nền ảnh toàn khung xuất hiện và zoom-in chậm tăng áp lực hiện trường
      tl.fromTo(
        "#photo-wrap",
        { opacity: 0 },
        { opacity: 1, duration: 0.45, ease: "power2.out" },
        0
      );
      tl.fromTo(
        "#hero-img",
        { scale: 1.05, x: 0, y: 0 },
        { scale: 1.18, x: -15, y: -25, duration: 9.44, ease: "none" },
        0
      );

      // 0.15s: Header thông tin vụ án xuất hiện
      tl.fromTo(
        "#editorial-header",
        { y: -24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.15
      );

      // 3.43s: Bước 1 - Ghì giữ gáy
      tl.to("#connector-grip", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 3.43);
      tl.fromTo(
        "#target-marker",
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" },
        3.5
      );
      tl.fromTo(
        "#grip-box",
        { x: -35, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        3.55
      );

      // 5.55s - 5.58s: Bước 1 thu lại nhường chỗ cho đường nét động tác đâm
      tl.to("#grip-box", { opacity: 0, x: -20, duration: 0.25, ease: "power2.in" }, 5.55);
      tl.to("#connector-grip", { opacity: 0, duration: 0.25, ease: "power2.in" }, 5.58);
      tl.to("#target-marker", { opacity: 0, duration: 0.25, ease: "power2.in" }, 5.58);

      // 5.60s: Nhát đâm thứ nhất (đâm thốc từ dưới lên vùng cổ)
      tl.to("#strike-line-1", { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, 5.6);
      tl.fromTo(
        "#strike-arrow-1",
        { opacity: 0 },
        { opacity: 1, duration: 0.15, ease: "power2.out" },
        5.85
      );

      // 5.95s: Nhát đâm thứ hai bồi thêm liên tiếp
      tl.to("#strike-line-2", { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, 5.95);
      tl.fromTo(
        "#strike-arrow-2",
        { opacity: 0 },
        { opacity: 1, duration: 0.15, ease: "power2.out" },
        6.2
      );

      // 6.22s: Rung chấn camera tại cú ra đòn quyết liệt
      tl.fromTo(
        "#photo-wrap",
        { x: -8, y: 6 },
        { x: 0, y: 0, duration: 0.22, ease: "power2.out" },
        6.22
      );

      // 6.31s: Punch phrase "ĐÂM VÙNG CỔ HIỂM YẾU" xuất hiện quyết liệt
      tl.fromTo(
        "#punch-card",
        { scale: 0.88, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        6.31
      );
      tl.fromTo(
        "#punch-tag",
        { scale: 0.9, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "power2.out" },
        6.45
      );

      // Đăng ký timeline vào đối tượng HyperFrames toàn cục
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s15"] = tl;
    </script>
