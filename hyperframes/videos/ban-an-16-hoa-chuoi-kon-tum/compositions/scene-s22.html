<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      /* Bảng màu chuẩn theo WCAG từ style-tokens.json */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #141414;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Ảnh nền phủ toàn bộ khung hình 1080x1920 (background-photo), giữ nguyên màu gốc không phủ filter/vignette */
      .hero-bg-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 1;
        transform-origin: 50% 50%;
      }
      .hero-bg-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: 50% 50%;
      }

      /* Lớp SVG Diagram toàn khung thể hiện quỹ đạo rơi nguy hiểm */
      .diagram-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }
      .trajectory-line {
        fill: none;
        stroke: #FF6A1A;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Label nhận diện mở đầu cảnh (VÍ DỤ GIẢ ĐỊNH) */
      .label-badge {
        position: absolute;
        top: 180px;
        left: 60px;
        padding: 14px 28px;
        font-weight: 900;
        font-size: 26px;
        letter-spacing: 2px;
        text-transform: uppercase;
        border: 3px solid #141414;
        box-shadow: 6px 6px 0px #141414;
        z-index: 30;
      }

      /* Điểm chạm & nhãn diagram chỉ vật đỡ giảm lực */
      .impact-callout {
        position: absolute;
        top: 1120px;
        left: 540px;
        display: flex;
        align-items: center;
        gap: 14px;
        z-index: 25;
      }
      .impact-marker-dot {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background-color: #FF6A1A;
        border: 4px solid #141414;
        box-shadow: 0 0 0 4px #F7F4EC;
        flex-shrink: 0;
        transform-origin: 50% 50%;
      }
      .impact-tag-box {
        padding: 12px 24px;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
        border: 2px solid #FF6A1A;
        box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.8);
        white-space: nowrap;
      }

      /* Punch-phrase: MAY MẮN THOÁT CHẾT (từ 3.90s, ẩn sau holdMs 2800ms) */
      .punch-container {
        position: absolute;
        top: 1210px;
        left: 60px;
        right: 60px;
        border-left: 10px solid #FF6A1A;
        padding: 24px 34px;
        box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.8);
        z-index: 40;
      }
      .punch-sub {
        font-size: 22px;
        font-weight: 700;
        color: #FF6A1A;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .punch-title {
        font-size: 54px;
        font-weight: 900;
        line-height: 1.24;
        text-transform: uppercase;
        margin: 0;
        letter-spacing: 0.5px;
      }

      /* Thanh cam nhận diện thương hiệu cố định mép đáy */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 90;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s22"
      data-width="1080"
      data-height="1920"
      data-duration="7"
    >
      <!-- Shot S22-1: 7 giây -->
      <section id="shot-s22-1" class="clip" data-start="0" data-duration="7">
        <!-- Khung ảnh nền toàn khung 9:16 (img-14) phủ kín toàn bộ 1080x1920, giữ nguyên màu gốc -->
        <div id="hero-bg-wrapper" class="hero-bg-wrapper">
          <img
            id="hero-bg-img"
            class="hero-bg-img"
            src="assets/img-14-legal-intent-risk-analogy.jpg"
            alt="Ẩn dụ quỹ đạo rơi nguy hiểm và vật đỡ may mắn"
          />
        </div>

        <!-- Sơ đồ vector vẽ quỹ đạo rơi từ đỉnh cao ốc xuống điểm chặn -->
        <svg class="diagram-layer" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <path
            id="trajectory-path"
            class="trajectory-line"
            d="M 320 460 Q 480 800 600 1120"
          />
        </svg>

        <!-- Label: VÍ DỤ GIẢ ĐỊNH (xuất hiện 0.24s, holdMs 2600ms -> ẩn lúc 2.84s) -->
        <div id="label-hypo" class="label-badge hf-hl-orange">
          VÍ DỤ GIẢ ĐỊNH
        </div>

        <!-- Điểm chạm & nhãn diagram chỉ vật đỡ giảm lực -->
        <div id="impact-callout" class="impact-callout">
          <div id="impact-marker" class="impact-marker-dot"></div>
          <div id="impact-tag" class="impact-tag-box hf-plate-ink">
            VẬT ĐỠ GIẢM LỰC
          </div>
        </div>

        <!-- Punch-phrase: MAY MẮN THOÁT CHẾT (xuất hiện 3.90s, holdMs 2800ms -> ẩn lúc 6.70s) -->
        <div id="punch-container" class="punch-container hf-plate-ink">
          <div id="punch-sub" class="punch-sub">TÌNH TIẾT NGOẠI CẢNH</div>
          <h1 id="punch-title" class="punch-title hf-text-light">MAY MẮN THOÁT CHẾT</h1>
        </div>

        <!-- Thanh dải màu cam cố định chân trang -->
        <div class="brand-bottom-bar"></div>
      </section>
    </div>

    <script>
      // Khởi tạo Timeline GSAP tất định cho composition "scene-s22"
      const tl = gsap.timeline({ paused: true });

      // Thiết lập đo đạc stroke SVG path vẽ dần
      const trajectoryPath = document.getElementById("trajectory-path");
      if (trajectoryPath) {
        const pathLength = trajectoryPath.getTotalLength();
        trajectoryPath.style.strokeDasharray = pathLength + " " + pathLength;
        trajectoryPath.style.strokeDashoffset = pathLength;
      }

      // 1. Chuyển động vào cảnh kiểu Spiral & Camera Zoom-in trên ảnh nền toàn khung (scale luôn >= 1.08 để không lộ viền)
      tl.fromTo(
        "#hero-bg-wrapper",
        { scale: 1.24, rotation: -3 },
        { scale: 1.08, rotation: 0, duration: 0.9, ease: "power3.out" },
        0
      );

      // Camera push-in chậm xuyên suốt thời lượng 7s (từ 1.0 lên 1.07)
      tl.fromTo(
        "#hero-bg-img",
        { scale: 1.0 },
        { scale: 1.07, duration: 7, ease: "none" },
        0
      );

      // 2. Overlay 1: Label "VÍ DỤ GIẢ ĐỊNH" (tại 0.24s, holdMs 2600ms, mờ dần lúc 2.84s)
      tl.fromTo(
        "#label-hypo",
        { y: -25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.24
      );
      tl.to(
        "#label-hypo",
        { y: -15, opacity: 0, duration: 0.35, ease: "power2.in" },
        2.84
      );

      // 3. Diagram animation: Quỹ đạo rơi vẽ dần từ trên cao ốc xuống điểm chặn
      if (trajectoryPath) {
        tl.to(
          "#trajectory-path",
          { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" },
          1.05
        );
      }

      // Callout điểm chạm vật đỡ xuất hiện khi đường quỹ đạo chạm đích (~1.85s)
      tl.fromTo(
        "#impact-marker",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        1.85
      );
      tl.fromTo(
        "#impact-tag",
        { x: -20, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        1.95
      );

      // Ẩn callout trước khi chuyển trọng tâm sang punch phrase
      tl.to(
        "#impact-callout",
        { opacity: 0, y: -10, duration: 0.35, ease: "power2.in" },
        3.40
      );
      if (trajectoryPath) {
        tl.to(
          "#trajectory-path",
          { opacity: 0.25, duration: 0.4, ease: "power2.out" },
          3.40
        );
      }

      // 4. Overlay 2: Punch-phrase "MAY MẮN THOÁT CHẾT" (xuất hiện tại 3.90s, holdMs 2800ms -> ẩn lúc 6.70s)
      tl.fromTo(
        "#punch-container",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        3.90
      );
      tl.fromTo(
        "#punch-sub",
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        4.05
      );
      tl.fromTo(
        "#punch-title",
        { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        4.15
      );

      // Ẩn punch-phrase đúng theo holdMs 2800ms (3.90s + 2.80s = 6.70s)
      tl.to(
        "#punch-container",
        { y: -20, opacity: 0, duration: 0.25, ease: "power2.in" },
        6.70
      );

      // Đăng ký timeline cho HyperFrames seek
      window.__timelines["scene-s22"] = tl;
    </script>
  
    </template>
  </body>
</html>
