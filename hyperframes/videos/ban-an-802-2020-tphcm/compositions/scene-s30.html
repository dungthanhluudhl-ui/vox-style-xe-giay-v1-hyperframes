    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }

      padding: 0;

      background-color: #0d0f12;

      inset: 0;
      background-color: #E7E3D9;

    .bg-spotlight {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, transparent 35%, rgba(20, 20, 20, 0.28) 100%);
      pointer-events: none;
    }

    /* Thanh cam nhận diện cố định ở mép dưới cùng */
    #bottom-accent-bar {

      left: 0;

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // 1. Zoom-through entrance của thẻ tài liệu bản án (0.0s -> 0.7s)
    tl.fromTo(
      "#doc-card",
      { scale: 0.88, opacity: 0, y: 35 },
      { scale: 1.0, opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
      0

    // Camera slow zoom-in 3% xuyên suốt cảnh (0.7s -> 9.24s)
    tl.to(
      "#doc-card",
      { scale: 1.03, duration: 8.54, ease: "none" },
      0.7

    // 2. Overlay 1: Label "ĐIỀU 123 ĐIỂM Q" xuất hiện tại 3.5s
    tl.fromTo(
      ".verdict-tag",
      { y: 24, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      3.5

    // 3. Overlay 2: Punch phrase "ĐỘNG CƠ ĐÊ HÈN" xuất hiện tại 3.92s

      ".verdict-plate",
      { scale: 0.94, y: 32, opacity: 0 },
      { scale: 1.0, y: 0, opacity: 1, duration: 0.48, ease: "power4.out" },
      3.92
    );

    tl.fromTo(
      ".verdict-stripe",
      { scaleY: 0 },
      { scaleY: 1, duration: 0.32, ease: "power2.out" },
      4.05
    );

    // Exit cụm bản án sơ thẩm tại 6.12s
    tl.to(
      "#verdict-container",
      { y: -20, opacity: 0, duration: 0.3, ease: "power2.in" },
      6.12
    );

    // 4. Overlay 3: ĐƠN KHÁNG CÁO xuất hiện tại 6.67s
    tl.fromTo(
      ".appeal-card",
      { y: 36, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      6.67
    );

    // Stamp "ĐƠN KHÁNG CÁO" đóng dấu quyết liệt tại 6.95s

      ".appeal-stamp",
      { scale: 1.45, opacity: 0, rotation: -16 },
      { scale: 1.0, opacity: 1, rotation: -4, duration: 0.38, ease: "power3.out" },
      6.95
    );

    // Exit cụm đơn kháng cáo tại 8.87s
    tl.to(
      "#appeal-container",
      { y: -16, opacity: 0, duration: 0.32, ease: "power2.in" },
      8.87
    );

    // Đăng ký timeline chính thức cho HyperFrames runtime
    window.__timelines["scene-s30"] = tl;
