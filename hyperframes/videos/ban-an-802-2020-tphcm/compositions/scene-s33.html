  <script>
    // Khởi tạo GSAP Timeline chính ở trạng thái paused theo đúng hợp đồng HyperFrames
    const tl = gsap.timeline({ paused: true });

    // Đo đạc hình học SVG chính xác cho hiệu ứng vẽ stroke tự nhiên
    const sigPath = document.getElementById("sig-stroke");
    const sigLen = sigPath.getTotalLength();
    sigPath.style.strokeDasharray = sigLen;
    sigPath.style.strokeDashoffset = sigLen;

    const arrowPath = document.getElementById("flow-arrow-path");
    const arrowLen = arrowPath.getTotalLength();
    arrowPath.style.strokeDasharray = arrowLen;
    arrowPath.style.strokeDashoffset = arrowLen;

    // --- TIMELINE CHOREOGRAPHY ---

    // 1. Vào cảnh: hiệu ứng "rise" cho toàn bộ cụm nội dung (t = 0.05s)
    tl.fromTo("#scene-content",
      { y: 50, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
      0.05
    );

    // Tiêu đề & badge xuất hiện
    tl.fromTo("#header-badge",
      { y: -20, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
      0.15
    );

    tl.fromTo("#header-title",
      { y: 20, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.25
    );

    // Thẻ 1: Pháp lý ly hôn xuất hiện vững chắc
    tl.fromTo("#card-stage-1",
      { scale: 0.94, opacity: 0, y: 20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
      0.4
    );

    // Chữ ký ly hôn được vẽ ra (t = 0.75s -> 1.25s)
    tl.to(sigPath,
      { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
      0.75
    );

    // 2. Overlay 1: Stamp "TỪ CHỐI TÌNH CẢM" đóng dấu đè lên (t = 1.24s theo shotlist)
    tl.fromTo("#rejection-stamp",
      { scale: 1.45, opacity: 0, rotation: 6 },
      { scale: 1, opacity: 1, rotation: -3, duration: 0.38, ease: "power3.out" },
      1.24
    );

    // 3. Mũi tên thù hằn đâm xuyên xuống (t = 2.1s -> 2.65s)
    tl.to(arrowPath,
      { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut" },
      2.1
    );

    tl.fromTo("#flow-arrow-head",
      { scale: 0, opacity: 0, transformOrigin: "center center" },
      { scale: 1, opacity: 1, duration: 0.25, ease: "power2.out" },
      2.55
    );

    // Huy hiệu "Chuẩn bị sẵn công cụ" xuất hiện trên đường tên
    tl.fromTo("#connector-badge",
      { scale: 0.85, opacity: 0, y: -10 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      2.7
    );

    // 4. Khối thẻ 2 (Tội ác tước đoạt mạng sống) xuất hiện (t = 3.3s)
    tl.fromTo("#card-stage-2",
      { scale: 0.95, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
      3.3
    );

    tl.fromTo("#card-2-footer",
      { opacity: 0, x: -20 },
      { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" },
      3.8
    );

    // 5. Overlay 2: Punch Phrase "TƯỚC ĐOẠT MẠNG SỐNG" (t = 5.23s theo shotlist)
    tl.fromTo("#punch-text",
      { scale: 0.72, opacity: 0, y: 15 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      5.23
    );

    // Đăng ký timeline duy nhất cho runtime HyperFrames
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s33"] = tl;
  </script>
