<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #F5F0E4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #F5F0E4;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Card Background Texture & Tone */
      .card-scene {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Dossier / Judicial File Card */
      .dossier-card {
        position: absolute;
        left: 80px;
        top: 360px;
        width: 920px;
        height: 980px;
        background: #E7E3D9;
        border: 3px solid #141414;
        border-radius: 8px;
        box-shadow: 14px 14px 0px #141414;
        padding: 44px 48px;
        display: flex;
        flex-direction: column;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      /* Card Header */
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }
      .card-title {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #141414;
        text-transform: uppercase;
      }
      .badge-classified {
        background: #141414;
        color: #F7F4EC;
        padding: 6px 16px;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 1.5px;
        border-radius: 4px;
        text-transform: uppercase;
      }

      .card-divider {
        width: 100%;
        height: 2px;
        background: #141414;
        margin: 24px 0 32px 0;
      }

      /* Section 1: Original Coded Name */
      .section-block {
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .field-label {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 1.5px;
        color: #141414;
        text-transform: uppercase;
        margin-bottom: 12px;
      }
      .name-box {
        position: relative;
        width: 100%;
        height: 160px;
        background: #F5F0E4;
        border: 2.5px solid #141414;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .name-text {
        font-size: 64px;
        font-weight: 900;
        letter-spacing: 4px;
        color: #141414;
        text-transform: uppercase;
        will-change: opacity;
      }
      .strike-bar {
        position: absolute;
        left: 40px;
        right: 40px;
        height: 8px;
        background: #141414;
        transform-origin: 0% 50%;
        transform: scaleX(0);
        will-change: transform;
      }

      /* Connector / Arrow */
      .connector-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 68px;
        width: 100%;
      }
      .connector-arrow {
        width: 32px;
        height: 32px;
      }

      /* Section 2: Punch-phrase Convention Box */
      .convention-box {
        position: relative;
        width: 100%;
        height: 180px;
        background: #FF6A1A;
        border: 3px solid #141414;
        border-radius: 6px;
        box-shadow: 8px 8px 0px #141414;
        display: flex;
        align-items: center;
        justify-content: center;
        will-change: transform, opacity;
      }
      .punch-text {
        font-size: 58px;
        font-weight: 900;
        letter-spacing: 3px;
        color: #141414;
        text-transform: uppercase;
        text-align: center;
      }

      /* Explanatory Footer */
      .card-footer {
        margin-top: auto;
        padding-top: 24px;
        border-top: 1.5px dashed rgba(20, 20, 20, 0.4);
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .footer-note {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #141414;
        text-transform: uppercase;
        text-align: center;
      }

      /* Permanent Bottom Orange Bar */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s04"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.08"
    >
      <section id="scene-s04" class="clip card-scene" data-start="0" data-duration="7.08">
        <div id="dossier-card" class="dossier-card">
          <!-- Card Header -->
          <div class="card-header">
            <span class="card-title">HỒ SƠ TƯ PHÁP // VỤ ÁN</span>
            <span class="badge-classified">MÃ HÓA</span>
          </div>

          <div class="card-divider"></div>

          <!-- Original Subject Name (strikethrough effect with intentional occlusion opt-out) -->
          <div class="section-block">
            <span class="field-label">NHÂN VẬT CHÍNH (THEO BẢN ÁN)</span>
            <div id="name-box" class="name-box">
              <span id="name-text" class="name-text" data-layout-allow-occlusion="true">ĐÀM MINH TH.</span>
              <div id="strike-bar" class="strike-bar" data-layout-allow-occlusion="true"></div>
            </div>
          </div>

          <!-- Transition Connector -->
          <div id="connector-wrap" class="connector-wrap">
            <svg class="connector-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 4V20M12 20L6 14M12 20L18 14" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>

          <!-- Resolved Convention Name -->
          <div class="section-block">
            <span class="field-label">TÊN GỌI THEO DÕI QUY ƯỚC</span>
            <div id="convention-box" class="convention-box">
              <span class="punch-text">QUY ƯỚC: THÀNH</span>
            </div>
          </div>

          <!-- Note Footer -->
          <div class="card-footer">
            <span class="footer-note">TÊN ĐÃ ĐƯỢC MÃ HÓA MỘT PHẦN TRONG HỒ SƠ</span>
          </div>
        </div>
      </section>

      <!-- Signature Visual Identity Bottom Bar -->
      <div class="bottom-brand-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 0.0s - 0.7s: Transition in - 3D Card Flip
      tl.fromTo(
        "#dossier-card",
        { rotationY: 28, y: 70, opacity: 0, transformPerspective: 1200 },
        { rotationY: 0, y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.1
      );

      // 1.10s (atMs: 26000): Overlay label "ĐÀM MINH TH." springs into view
      tl.fromTo(
        "#name-box",
        { opacity: 0, scale: 0.94, y: 24 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.1
      );

      // 3.80s: Decisive strikethrough line draws across "ĐÀM MINH TH."
      tl.fromTo(
        "#strike-bar",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power2.inOut" },
        3.8
      );

      // 4.05s: Dim the coded name slightly after being struck
      tl.to(
        "#name-text",
        { opacity: 0.38, duration: 0.3, ease: "power1.out" },
        4.05
      );

      // 4.40s: Reveal the connecting flow arrow
      tl.fromTo(
        "#connector-wrap",
        { opacity: 0, y: -12 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
        4.4
      );

      // 4.86s (atMs: 29760): Punch-phrase "QUY ƯỚC: THÀNH" slides & settles firmly
      tl.fromTo(
        "#convention-box",
        { opacity: 0, y: 36, scale: 0.92 },
        { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" },
        4.86
      );

      // Register the seekable timeline for HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s04"] = tl;
    </script>
  
    </template>
  </body>
</html>
