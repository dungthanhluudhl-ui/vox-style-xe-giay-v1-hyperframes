  <script>
    // Khởi tạo GSAP timeline seekable ở trạng thái paused bắt buộc cho HyperFrames
    const tl = gsap.timeline({ paused: true });

    // Đăng ký đúng composition ID "scene-s02"
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s02"] = tl;

    // Chuẩn bị các stroke SVG tự vẽ (dasharray / dashoffset)
    const cross1 = document.getElementById("crossLine1");
    const cross2 = document.getElementById("crossLine2");
    const len1 = cross1.getTotalLength();
    const len2 = cross2.getTotalLength();
    cross1.style.strokeDasharray = len1;
    cross1.style.strokeDashoffset = len1;
    cross2.style.strokeDasharray = len2;
    cross2.style.strokeDashoffset = len2;

    const cLine1 = document.getElementById("connLine1");
    const cLine2 = document.getElementById("connLine2");
    const lenC1 = cLine1.getTotalLength();
    const lenC2 = cLine2.getTotalLength();
    cLine1.style.strokeDasharray = lenC1;
    cLine1.style.strokeDashoffset = lenC1;
    cLine2.style.strokeDasharray = lenC2;
    cLine2.style.strokeDashoffset = lenC2;

    // --- TIMELINE ORCHESTRATION ---

    // 0.0s - 0.6s: TransitionIn "rise" toàn bộ Canvas vào khung hình
    tl.fromTo(
      "#mainCanvas",
      { y: 50, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
      0
    );

    // 0.2s - 0.7s: Header trượt nhẹ vào vị trí
    tl.fromTo(
      "#headerBar",
      { y: -20, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
      0.2
    );

    // 0.4s: BƯỚC 1 xuất hiện vững chãi
    tl.fromTo(
      "#step1",
      { y: 30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
      0.4
    );

    // 0.8s: Vẽ dấu gạch chéo đổ vỡ ly hôn
    tl.to(cross1, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 0.8);
    tl.to(cross2, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 0.95);

    // 2.68s (khớp mốc atMs: 9580ms so với startMs: 6900ms): Label "CHỐI TỪ NỐI LẠI"
    tl.fromTo(
      "#labelReject",
      { scale: 0.8, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.5)" },
      2.68
    );

    // 4.2s: Vẽ connector 1 -> 2 nối tiếp nhịp kể
    tl.to(cLine1, { strokeDashoffset: 0, duration: 0.4, ease: "none" }, 4.2);
    tl.fromTo(
      "#connArrow1",
      { opacity: 0, scale: 0.5 },
      { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" },
      4.55
    );

    // 4.6s: BƯỚC 2 xuất hiện (Chuẩn bị hung khí)
    tl.fromTo(
      "#step2",
      { y: 30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
      4.6
    );

    // 5.37s (khớp mốc atMs: 12270ms so với startMs: 6900ms): Icon "warning" pop-in
    tl.fromTo(
      "#warningIconWrap",
      { scale: 0, opacity: 0, rotation: -15 },
      { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: "back.out(1.7)" },
      5.37
    );

    // 6.02s (khớp mốc atMs: 12920ms so với startMs: 6900ms): Label "CHUẨN BỊ HUNG KHÍ"
    tl.fromTo(
      "#labelWeapons",
      { scale: 0.8, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.5)" },
      6.02
    );

    // 6.9s: Vẽ connector 2 -> 3 (Mũi tên chốt hạ hướng xuống bước 3)
    tl.to(cLine2, { strokeDashoffset: 0, duration: 0.4, ease: "none" }, 6.9);
    tl.fromTo(
      "#connArrow2",
      { opacity: 0, scale: 0.5 },
      { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" },
      7.25
    );

    // 7.3s: BƯỚC 3 xuất hiện với tông nền mực đe dọa
    tl.fromTo(
      "#step3",
      { y: 30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
      7.3
    );

    // 7.7s: Tâm ngắm thu hẹp tập trung vào nạn nhân đơn độc
    tl.fromTo(
      "#targetRing",
      { scale: 1.25, opacity: 0, transformOrigin: "100px 100px" },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      7.7
    );

    // 8.1s: Badge mục tiêu xuất hiện chốt hạ toàn cảnh kế hoạch
    tl.fromTo(
      "#labelAction",
      { scale: 0.85, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power2.out" },
      8.1
    );

    // Nhịp thở nhẹ nhàng cho tâm ngắm (đảm bảo không chết khung hình nhưng vẫn tất định)
    tl.to("#targetRing", { rotation: 90, transformOrigin: "100px 100px", duration: 1.44, ease: "none" }, 8.1);
  </script>

    </template>
