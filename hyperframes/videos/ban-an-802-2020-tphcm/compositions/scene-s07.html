<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #e7e3d9;
      }
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Nền Spotlight & Lưới kẻ Vox */
      #bg-layer {
        position: absolute;
        inset: 0;
        background-color: #e7e3d9;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }
      #spotlight-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(20, 20, 20, 0) 35%,
          rgba(20, 20, 20, 0.42) 95%
        );
        z-index: 2;
      }

      /* Image Hero & Camera Container */
      #hero-container {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 1;
      }
      #hero-wrapper {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform-origin: 50% 50%;
      }
      #hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Dải viền cam nhận diện thương hiệu Vox ở mép đáy */
      #signature-orange-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 10px;
        background-color: #ff6a1a;
        z-index: 100;
      }

      /* Quy tắc tấm nền đặc cho chữ / nhãn */
      .plate-ink {
        background-color: #141414;
        opacity: 1;
      }
      .tag-orange {
        background-color: #ff6a1a;
        color: #141414;
        opacity: 1;
      }

      /* Nhãn 1: Thành - Muốn quay lại (transform được quản lý thuần túy bởi GSAP để tránh xung đột) */
      #badge-thanh {
        position: absolute;
        top: 360px;
        left: 70px;
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        transform-origin: 0% 50%;
        z-index: 20;
      }
      .character-tag {
        font-size: 26px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 1.5px;
        padding: 6px 16px;
        border-radius: 4px;
        text-transform: uppercase;
      }
      .label-card {
        padding: 16px 28px;
        border-radius: 8px;
        border-left: 6px solid #ff6a1a;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.38);
      }
      .label-text {
        color: #f7f4ec;
        font-size: 44px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: 1.5px;
        white-space: nowrap;
      }

      /* Nhãn 2 & 3: Kim - Con dấu chối từ & Không đồng ý */
      #rejection-group {
        position: absolute;
        top: 880px;
        right: 70px;
        display: inline-flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 12px;
        transform: rotate(2deg);
        transform-origin: 100% 50%;
        z-index: 30;
      }
      .rejection-row {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .ban-box {
        width: 86px;
        height: 86px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.38);
        border: 2px solid rgba(255, 106, 26, 0.4);
      }
      .punch-card {
        padding: 18px 34px;
        border-radius: 8px;
        border-right: 6px solid #ff6a1a;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.38);
      }
      .punch-text {
        color: #ff6a1a;
        font-size: 54px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: 2px;
        white-space: nowrap;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s07"
      data-width="1080"
      data-height="1920"
      data-duration="9.74"
    >
      <!-- SHOT BACKGROUND & HERO COLLAGE -->
      <section id="shot-bg" class="clip" data-start="0" data-duration="9.74">
        <div id="bg-layer"></div>
        <div id="hero-container">
          <div id="hero-wrapper" data-layout-allow-overflow="true">
            <img
              id="hero-img"
              src="assets/img-07-paper-cut-couple-separation-memories.jpg"
              alt="Minh hoạ chia cách và ký ức vỡ vụn"
            />
          </div>
        </div>
        <div id="spotlight-vignette"></div>
      </section>

      <!-- OVERLAY 1: THÀNH - MUỐN QUAY LẠI (At 6.41s) -->
      <div id="clip-thanh" class="clip" data-start="6.41" data-duration="3.33">
        <div id="badge-thanh">
          <div class="character-tag tag-orange">THÀNH</div>
          <div class="label-card plate-ink">
            <span class="label-text">MUỐN QUAY LẠI</span>
          </div>
        </div>
      </div>

      <!-- OVERLAYS 2 & 3: KIM - BAN ICON & KHÔNG ĐỒNG Ý (At 8.42s) -->
      <div id="clip-kim" class="clip" data-start="8.42" data-duration="1.32">
        <div id="rejection-group">
          <div class="character-tag tag-orange">KIM</div>
          <div class="rejection-row">
            <div id="ban-icon-box" class="ban-box plate-ink">
              <svg id="ban-svg" width="60" height="60" viewBox="0 0 60 60" fill="none">
                <circle
                  id="ban-circle"
                  cx="30"
                  cy="30"
                  r="24"
                  stroke="#FF6A1A"
                  stroke-width="5"
                />
                <line
                  id="ban-slash"
                  x1="13"
                  y1="13"
                  x2="47"
                  y2="47"
                  stroke="#FF6A1A"
                  stroke-width="5"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <div id="punch-kim" class="punch-card plate-ink">
              <span class="punch-text">KHÔNG ĐỒNG Ý</span>
            </div>
          </div>
        </div>
      </div>

      <!-- THANH CAM ĐẶC TRƯNG MẶC ĐỊNH Ở ĐÁY -->
      <div id="signature-orange-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Camera & Hero Image: Transition-in Wobble-drop (0.0s -> 0.75s)
      tl.fromTo(
        "#hero-wrapper",
        { scale: 1.14, y: -45, rotation: -1.5 },
        { scale: 1.08, y: 0, rotation: 0, duration: 0.75, ease: "power2.out" },
        0
      );

      // 2. Camera Motion: Zoom-out chậm từ 1.08 về 1.0 trong suốt shot (0.75s -> 9.74s)
      tl.to(
        "#hero-wrapper",
        { scale: 1.0, duration: 8.99, ease: "none" },
        0.75
      );

      // 3. Hiệu ứng thở nhẹ của vignette tạo không khí ngột ngạt, xung đột
      tl.fromTo(
        "#spotlight-vignette",
        { opacity: 0.8 },
        { opacity: 1, duration: 4.8, ease: "sine.inOut", yoyo: true, repeat: 1 },
        0
      );

      // 4. Overlay 1 (6.41s): Thành đưa ra đề nghị "MUỐN QUAY LẠI"
      tl.fromTo(
        "#badge-thanh",
        { scale: 0, opacity: 0, y: -24, rotation: -8 },
        { scale: 1, opacity: 1, y: 0, rotation: -3, duration: 0.5, ease: "power3.out" },
        6.41
      );

      // 5. Overlay 2 (8.42s): Biểu tượng "ban" chối từ tự vẽ
      const banCircle = document.getElementById("ban-circle");
      const banSlash = document.getElementById("ban-slash");
      if (banCircle && banSlash) {
        const circleLen = banCircle.getTotalLength();
        const slashLen = banSlash.getTotalLength();
        banCircle.style.strokeDasharray = circleLen;
        banCircle.style.strokeDashoffset = circleLen;
        banSlash.style.strokeDasharray = slashLen;
        banSlash.style.strokeDashoffset = slashLen;

        tl.fromTo(
          "#ban-icon-box",
          { scale: 0, opacity: 0, rotation: -20 },
          { scale: 1, opacity: 1, rotation: 0, duration: 0.35, ease: "power3.out" },
          8.42
        );

        tl.to(
          banCircle,
          { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" },
          8.42
        );

        tl.to(
          banSlash,
          { strokeDashoffset: 0, duration: 0.18, ease: "power2.out" },
          8.56
        );
      }

      // 6. Overlay 3 (8.63s): Punch-phrase "KHÔNG ĐỒNG Ý" đập vào dứt khoát
      tl.fromTo(
        "#punch-kim",
        { scale: 0, opacity: 0, x: 30, rotation: 6 },
        { scale: 1, opacity: 1, x: 0, rotation: 2, duration: 0.45, ease: "power3.out" },
        8.63
      );

      // Đăng ký timeline cho HyperFrames runtime
      window.__timelines["scene-s07"] = tl;
    </script>
  
    </template>
  </body>
</html>
