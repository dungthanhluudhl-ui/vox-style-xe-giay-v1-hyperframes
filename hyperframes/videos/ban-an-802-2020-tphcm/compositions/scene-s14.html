    <template>

      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Core .clip contract: full frame inset: 0 */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Background Spotlight Variant (Style DNA) */
      .bg-base {
        position: absolute;
        inset: 0;
        background-color: #e7e3d9;
        z-index: 1;
      }

      .bg-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        z-index: 2;
      }

      .bg-spotlight {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 42%,
          rgba(20, 20, 20, 0.08) 25%,
          rgba(20, 20, 20, 0.65) 100%
        );
        opacity: 0.75;
        z-index: 3;
      }

      /* Camera & Hero Visual Framing */
      .camera-viewport {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 4;
      }

      .camera-rig {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      .hero-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 38%;
        display: block;
      }

      /* In-camera kinetic SVG overlay */
      .kinetic-svg {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
        z-index: 5;
      }

      /* Overlay Layer Containers - Safe-zone aligned (Y: 160px - 1390px) */
      .overlay-flex-container {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 240px;
        z-index: 20;
      }

      /* Label Card: "NHẮN TIN ZALO" (Solid ink plate, high contrast) */
      .label-card {
        background-color: #141414;
        border: 4px solid #ff6a1a;
        border-radius: 16px;
        padding: 24px 44px;
        box-shadow:
          0 16px 40px rgba(0, 0, 0, 0.65),
          8px 8px 0px #ff6a1a;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 820px;
        will-change: transform, opacity;
      }

      .card-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background-color: #ff6a1a;
        padding: 6px 18px;
        border-radius: 6px;
      }

      .badge-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #141414;
      }

      .badge-text {
        font-size: 22px;
        font-weight: 900;
        color: #141414;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .card-title {
        font-size: 52px;
        font-weight: 900;
        line-height: 1.2;
        color: #f7f4ec;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        text-align: center;
        margin: 0;
      }

      /* Punch Card: "CƠN GHEN TỨC" (Solid ink plate, editorial punch) */
      .punch-card {
        background-color: #141414;
        border: 5px solid #ff6a1a;
        border-radius: 20px;
        padding: 32px 54px;
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.75),
          10px 10px 0px #ff6a1a;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        max-width: 860px;
        will-change: transform, opacity;
      }

      .punch-tag-box {
        background-color: #ff6a1a;
        padding: 8px 22px;
        border-radius: 6px;
      }

      .punch-tag {
        font-size: 24px;
        font-weight: 900;
        color: #141414;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .punch-title {
        font-size: 72px;
        font-weight: 900;
        line-height: 1.15;
        color: #f7f4ec;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-align: center;
        margin: 0;
      }

      .punch-accent-bar {
        width: 120px;
        height: 6px;
        background-color: #ff6a1a;
        border-radius: 3px;
      }

      /* Signature bottom orange bar (Always fixed at bottom edge) */
      .bottom-signature-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 10px;
        background-color: #ff6a1a;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s14"
      data-width="1080"
      data-height="1920"
      data-duration="8.3"
      data-start="0"
    >
      <!-- Background Elements (Spotlight Variant) -->
      <div class="bg-base" aria-hidden="true"></div>
      <div class="bg-grid" aria-hidden="true"></div>
      <div id="bg-spotlight" class="bg-spotlight" aria-hidden="true"></div>

      <!-- Main Visual Scene Shot S14-1 -->
      <div id="shot-s14-1" class="clip" data-start="0" data-duration="8.3">
        <div id="camera-viewport" class="camera-viewport">
          <div id="camera-rig" class="camera-rig" data-layout-allow-overflow="true">
            <img
              id="hero-img"
              class="hero-img"
              src="assets/img-12-stalker-lurking-behind-office-victim.jpg"
              alt="Bóng đen theo dõi phía sau Kim"
            />

            <!-- In-camera kinetic vector & reticle overlay -->
            <svg
              id="kinetic-svg"
              class="kinetic-svg"
              viewBox="0 0 1080 1920"
              preserveAspectRatio="none"
              aria-hidden="true"
            >
              <!-- Reticle & connector for smartphone at 3.06s -->
              <g id="phone-bracket-group" opacity="0">
                <rect
                  id="phone-reticle"
                  x="430"
                  y="1020"
                  width="220"
                  height="280"
                  rx="16"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="4"
                  stroke-dasharray="24 12"
                />
                <path
                  id="phone-connector"
                  d="M 540 1020 L 540 440"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="3"
                  stroke-dasharray="8 6"
                />
                <circle cx="540" cy="1020" r="7" fill="#FF6A1A" />
              </g>

              <!-- Violent force vector slam at 5.06s -->
              <g id="force-vector-group" opacity="0">
                <!-- Diagonal impact slash -->
                <path
                  id="force-arrow"
                  d="M 880 430 L 250 1430"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="16"
                  stroke-linecap="round"
                />
                <!-- Arrowhead chevron -->
                <path
                  id="force-head"
                  d="M 230 1310 L 250 1430 L 370 1410"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="16"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <!-- Secondary kinetic impact streaks -->
                <line
                  x1="830"
                  y1="400"
                  x2="690"
                  y2="620"
                  stroke="#F7F4EC"
                  stroke-width="6"
                  stroke-linecap="round"
                />
                <line
                  x1="940"
                  y1="480"
                  x2="810"
                  y2="690"
                  stroke="#F7F4EC"
                  stroke-width="6"
                  stroke-linecap="round"
                />
                <line
                  x1="430"
                  y1="1200"
                  x2="290"
                  y2="1420"
                  stroke="#F7F4EC"
                  stroke-width="6"
                  stroke-linecap="round"
                />
                <!-- Impact ring -->
                <circle
                  id="impact-ring"
                  cx="250"
                  cy="1430"
                  r="40"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="8"
                />
              </g>
            </svg>
          </div>
        </div>
      </div>

      <!-- Overlay 1: Label "NHẮN TIN ZALO" (3.06s to 5.06s) -->
      <div id="clip-overlay-1" class="clip" data-start="3.06" data-duration="2.0">
        <div class="overlay-flex-container">
          <div id="label-card" class="label-card">
            <div class="card-badge">
              <span class="badge-dot"></span>
              <span class="badge-text">BẰNG CHỨNG</span>
            </div>
            <h2 class="card-title">NHẮN TIN ZALO</h2>
          </div>
        </div>
      </div>

      <!-- Overlay 2: Punch-phrase "CƠN GHEN TỨC" (5.06s to 8.30s) -->
      <div id="clip-overlay-2" class="clip" data-start="5.06" data-duration="3.24">
        <div class="overlay-flex-container">
          <div id="punch-card" class="punch-card">
            <div class="punch-tag-box">
              <span class="punch-tag">ĐỘNG CƠ</span>
            </div>
            <h1 class="punch-title">CƠN GHEN TỨC</h1>
            <div class="punch-accent-bar"></div>
          </div>
        </div>
      </div>

      <!-- Fixed brand bottom signature bar -->
      <div class="bottom-signature-bar" aria-hidden="true"></div>
    </div>

    <script>
      // Single paused timeline registered synchronously
      const tl = gsap.timeline({ paused: true });

      // Measure SVG path lengths for stroke-draw animation
      const forceArrow = document.getElementById("force-arrow");
      const forceHead = document.getElementById("force-head");
      const phoneReticle = document.getElementById("phone-reticle");
      const phoneConnector = document.getElementById("phone-connector");

      if (forceArrow) {
        const len = forceArrow.getTotalLength();
        forceArrow.style.strokeDasharray = len + "";
        forceArrow.style.strokeDashoffset = len + "";
      }
      if (forceHead) {
        const len = forceHead.getTotalLength();
        forceHead.style.strokeDasharray = len + "";
        forceHead.style.strokeDashoffset = len + "";
      }
      if (phoneReticle) {
        const len = phoneReticle.getTotalLength();
        phoneReticle.style.strokeDasharray = len + "";
        phoneReticle.style.strokeDashoffset = len + "";
      }
      if (phoneConnector) {
        const len = phoneConnector.getTotalLength();
        phoneConnector.style.strokeDasharray = len + "";
        phoneConnector.style.strokeDashoffset = len + "";
      }

      // 1. Initial Punch Transition & Lurking Establishing Shot (0s -> 0.7s)
      tl.fromTo(
        "#camera-rig",
        { scale: 1.18, y: -45, x: 0, rotation: 0 },
        { scale: 1.05, y: -20, x: 0, rotation: 0, duration: 0.7, ease: "power4.out" },
        0
      );

      // 2. Pan-down from lurking shadow toward the victim's smartphone (0.7s -> 3.06s)
      tl.to(
        "#camera-rig",
        { y: 35, scale: 1.08, duration: 2.36, ease: "sine.inOut" },
        0.7
      );

      // 3. Overlay 1: "NHẮN TIN ZALO" + Phone Reticle Reveal (at 3.06s)
      tl.to("#phone-bracket-group", { opacity: 1, duration: 0.2 }, 3.06);
      tl.to("#phone-reticle", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 3.06);
      tl.to("#phone-connector", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 3.25);

      tl.fromTo(
        "#label-card",
        { scale: 0.88, opacity: 0, y: -25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        3.06
      );

      // 4. Fade out Overlay 1 before the violent attack (at 4.75s)
      tl.to("#label-card", { opacity: 0, y: -15, duration: 0.28, ease: "power2.in" }, 4.75);
      tl.to("#phone-bracket-group", { opacity: 0, duration: 0.25, ease: "power2.in" }, 4.75);

      // 5. VIOLENT QUẬT NGÃ SLAM & ZOOM-IN (at 5.06s)
      // Rapid camera slam in, diagonal tilt & kinetic shock
      tl.to(
        "#camera-rig",
        { scale: 1.28, x: -35, y: 85, rotation: -2.2, duration: 0.32, ease: "power4.out" },
        5.06
      );
      // Recovery settle from shockwave tilt
      tl.to(
        "#camera-rig",
        { rotation: 0, x: -15, duration: 0.45, ease: "power2.out" },
        5.38
      );
      // Continuing intense push-in toward the ground impact
      tl.to(
        "#camera-rig",
        { scale: 1.34, y: 110, duration: 2.47, ease: "sine.out" },
        5.83
      );

      // Spotlight vignette pulse on attack impact
      tl.to("#bg-spotlight", { opacity: 0.95, duration: 0.25, ease: "power3.out" }, 5.06);
      tl.to("#bg-spotlight", { opacity: 0.72, duration: 0.8, ease: "power2.out" }, 5.35);

      // Kinetic diagonal force vector draw
      tl.to("#force-vector-group", { opacity: 1, duration: 0.05 }, 5.06);
      tl.to("#force-arrow", { strokeDashoffset: 0, duration: 0.32, ease: "power3.out" }, 5.06);
      tl.to("#force-head", { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, 5.22);
      tl.fromTo(
        "#impact-ring",
        { scale: 0.5, opacity: 1, transformOrigin: "250px 1430px" },
        { scale: 2.8, opacity: 0, duration: 0.55, ease: "power2.out" },
        5.26
      );
      // Force vector fades after impact communicates the action
      tl.to("#force-vector-group", { opacity: 0, duration: 0.6, ease: "power2.in" }, 6.8);

      // 6. Punch phrase: "CƠN GHEN TỨC" entrance (at 5.06s)
      tl.fromTo(
        "#punch-card",
        { scale: 1.36, opacity: 0, y: -30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power4.out" },
        5.06
      );
      // Subtle breath settle holding firmly through end of scene
      tl.to(
        "#punch-card",
        { scale: 1.03, duration: 2.7, ease: "sine.inOut" },
        5.55
      );

      // Attach timeline to window registry matching root composition-id
      window.__timelines["scene-s14"] = tl;
    </script>
  
    </template>
