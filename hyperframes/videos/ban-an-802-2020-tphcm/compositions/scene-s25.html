    // Initialize SVG Path lengths for deterministic pen-trace draw

      path.style.strokeDasharray = len + 1;
      path.style.strokeDashoffset = len + 1;
    });

    // Create the single paused GSAP timeline required by HyperFrames
    const tl = gsap.timeline({ paused: true });

    // 1. Scene Entrance (Flip transition)
    // Flip Card In with 3D perspective

      "#hero-card-wrapper",
      {
        rotationY: -38,
        rotationX: 14,
        scale: 0.88,
        opacity: 0,
        z: -120
      },
      {
        rotationY: 0,
        rotationX: 0,
        scale: 1,
        opacity: 1,
        z: 0,
        duration: 0.85,
        ease: "power3.out"
      },
      0
    );

    // Header Slide-in
    tl.fromTo(
      "#header-panel",
      {
        y: -36,
        opacity: 0
      },
      {
        y: 0,
        opacity: 1,
        duration: 0.65,
        ease: "power3.out"
      },
      0.15
    );

    // Continuous 4% Camera Zoom-In across 7.44s
    tl.fromTo(
      "#hero-img",
      {
        scale: 1.0
      },
      {
        scale: 1.04,
        duration: 7.44,
        ease: "none"
      },
      0
    );

    // 2. Overlay 1: Scale Badge Entrance (atMs: 197090 -> 0.51s relative)
    tl.fromTo(
      "#scale-badge",
      {
        scale: 0,
        opacity: 0
      },
      {
        scale: 1,
        opacity: 1,
        duration: 0.5,
        ease: "power3.out"
      },
      0.51
    );

    // Progressive SVG Path Draw for the scale icon
    tl.to(
      "#scale-badge .draw-path",
      {
        strokeDashoffset: 0,
        duration: 0.8,
        stagger: 0.08,
        ease: "power2.out"
      },
      0.65
    );

    // 3. Overlay 2: Label 1 "MỨC ĐỘ NGUY HIỂM" (atMs: 198540 -> 1.96s relative)
    tl.fromTo(
      "#factor-card-1",
      {
        x: -50,
        scale: 0.9,
        opacity: 0
      },
      {
        x: 0,
        scale: 1,
        opacity: 1,
        duration: 0.55,

    );

    // 4. Overlay 3: Label 2 "TÌNH TIẾT GIẢM NHẸ" (atMs: 201360 -> 4.78s relative)

      "#factor-card-2",
      {
        x: 50,
        scale: 0.9,
        opacity: 0
      },
      {
        x: 0,
        scale: 1,
        opacity: 1,
        duration: 0.55,
        ease: "power3.out"
      },
      4.78
    );

    // Subtle breathing highlight pulse on Factor 2 to draw attention to contrast
    tl.fromTo(
      "#factor-card-2",
      {
        borderColor: "#FF6A1A"
      },
      {
        borderColor: "#F7F4EC",
        duration: 0.35,
        yoyo: true,
        repeat: 1,
        ease: "power1.inOut"
      },
      5.35
    );

    // Bind paused timeline to HyperFrames runtime registry
    window.__timelines["scene-s25"] = tl;
