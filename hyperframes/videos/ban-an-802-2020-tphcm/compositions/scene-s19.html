    <div
      id="root"
      data-composition-id="scene-s19"
      data-start="0"

    >
      <section id="shot-s19" class="clip" data-start="0" data-duration="9.66">
        <div class="content-container">
          <!-- TOP: Hypothesis Card -->
          <div
            id="hypo-wrapper"
            class="hypothesis-wrapper"
            data-layout-allow-occlusion="true"
          >
            <div id="hypo-card" class="hypothesis-card">
              <div class="hypothesis-tag">GIẢ THUYẾT BAN ĐẦU</div>
              <h1 class="hypothesis-title">GHEN TUÔNG BỘC PHÁT?</h1>
            </div>

            <!-- Strikethrough Line -->
            <svg class="strike-svg" viewBox="0 0 960 140" preserveAspectRatio="none">
              <line
                id="strike-line"
                x1="20"
                y1="115"
                x2="940"
                y2="25"
                stroke="#FF6A1A"
                stroke-width="12"
                stroke-linecap="round"
              />
            </svg>

            <!-- BAN Icon -->
            <div id="ban-icon" class="ban-icon-wrapper">
              <svg class="ban-svg" viewBox="0 0 80 80">
                <circle
                  id="ban-circle"
                  cx="40"
                  cy="40"
                  r="34"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="8"
                />
                <line
                  id="ban-slash"
                  x1="16"
                  y1="16"
                  x2="64"
                  y2="64"
                  stroke="#FF6A1A"
                  stroke-width="8"
                  stroke-linecap="round"
                />
              </svg>
            </div>
          </div>

          <!-- MIDDLE: Timeline Sequence (Chuỗi hành vi từ sáng đến trưa) -->
          <div class="timeline-section">
            <div class="timeline-rail-container">
              <div id="timeline-rail-fill" class="timeline-rail-fill"></div>
            </div>

            <div class="timeline-steps">
              <!-- Mốc 1: Buổi sáng -->
              <div class="timeline-step" id="step-1">
                <div class="step-marker">
                  <div class="step-marker-dot"></div>
                </div>
                <div class="step-card">
                  <div class="step-header">
                    <span class="step-time-badge">BUỔI SÁNG</span>

                  <div class="step-marker-dot"></div>
                </div>

              <div class="punch-kicker">BẢN CHẤT SỰ VIỆC</div>
              <div class="punch-headline">

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Init SVG path lengths for drawing animations
      const strikeLine = document.getElementById("strike-line");
      const strikeLen = strikeLine.getTotalLength();
      strikeLine.style.strokeDasharray = strikeLen;
      strikeLine.style.strokeDashoffset = strikeLen;

      const banCircle = document.getElementById("ban-circle");
      const banCircleLen = banCircle.getTotalLength();
      banCircle.style.strokeDasharray = banCircleLen;
      banCircle.style.strokeDashoffset = banCircleLen;

      const banSlash = document.getElementById("ban-slash");
      const banSlashLen = banSlash.getTotalLength();
      banSlash.style.strokeDasharray = banSlashLen;
      banSlash.style.strokeDashoffset = banSlashLen;

      // 1. Entrance (0.79s): Flip in the hypothesis card
      tl.fromTo(
        "#hypo-card",
        { rotationX: -80, opacity: 0, y: -40 },
        { rotationX: 0, opacity: 1, y: 0, duration: 0.75, ease: "power3.out" },
        0.79
      );

      // 2. Paradox rejection (3.69s): Strikethrough & self-drawing BAN icon
      tl.to(
        "#strike-line",
        { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" },
        3.69
      );

      tl.fromTo(
        "#ban-icon",
        { opacity: 0, scale: 0.5 },
        { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" },
        3.72
      );

      tl.to(
        "#ban-circle",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        3.75
      );

      tl.to(
        "#ban-slash",
        { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
        4.05
      );

      tl.to(
        "#hypo-card",
        { opacity: 0.55, duration: 0.35, ease: "power1.out" },
        4.10
      );

      // 3. Reveal timeline diagram (4.30s): unbroken sequence from morning to noon
      tl.fromTo(
        "#timeline-rail-fill",
        { scaleY: 0 },
        { scaleY: 1, duration: 1.1, ease: "power1.inOut" },
        4.30
      );

      tl.fromTo(
        "#step-1",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        4.45
      );

      tl.fromTo(
        "#step-2",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        5.00
      );

      // 4. Punch-phrase reveal (5.60s): CHUỖI HÀNH VI CÓ CHỦ ĐÍCH
      tl.fromTo(
        "#punch-wrapper",
        { y: 60, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" },
        5.60
      );

      tl.fromTo(
        "#punch-hl-box",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power3.out" },
        5.85
      );

      window.__timelines["scene-s19"] = tl;
    </script>
