<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }

      /* Quy ước clip */
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Lớp nền lưới giấy đặc trưng Vox */
      .vox-grid-bg {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        pointer-events: none;
      }

      /* Khung ảnh trung tâm dạng Paper Collage */
      .media-frame {
        position: absolute;
        top: 180px;
        left: 54px;
        width: 972px;
        height: 1420px;
        border: 4px solid #141414;
        background-color: #f5f0e4;
        box-shadow: 18px 22px 0px rgba(20, 20, 20, 0.95);
        overflow: hidden;
      }

      .media-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: 50% 70%;
      }

      /* Spotlight / Vignette tập trung vào con đường vực thẳm */
      .spotlight-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 65%, transparent 35%, rgba(20, 20, 20, 0.45) 75%, rgba(20, 20, 20, 0.8) 100%);
        pointer-events: none;
      }

      /* Lát cắt shatter mở màn phong cách collage */
      .shatter-piece-left {
        position: absolute;
        top: 0;
        left: 0;
        width: 50%;
        height: 100%;
        background-color: #141414;
        clip-path: polygon(0 0, 100% 0, 45% 100%, 0 100%);
        z-index: 40;
        pointer-events: none;
      }
      .shatter-piece-right {
        position: absolute;
        top: 0;
        right: 0;
        width: 55%;
        height: 100%;
        background-color: #ff6a1a;
        clip-path: polygon(45% 0, 100% 0, 100% 100%, 0 100%);
        z-index: 40;
        pointer-events: none;
      }

      /* Thanh cam nhận diện thương hiệu cố định mép đáy */
      .vox-bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 60;
      }

      /* Overlay 1: Nhãn CƠ HỘI DỪNG LẠI (Label) */
      .overlay-label-container {
        position: absolute;
        top: 240px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 30;
      }

      .warning-badge {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 16px 36px;
        border: 3px solid #ff6a1a;
        box-shadow: 8px 10px 0px rgba(20, 20, 20, 0.9);
      }

      .warning-icon {
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .badge-text {
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 2px;
        line-height: 1;
        margin: 0;
      }

      /* Overlay 2: Punch Phrase KHÔNG DỪNG LẠI */
      .overlay-punch-container {
        position: absolute;
        top: 1160px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 35;
      }

      .punch-card {
        display: inline-flex;
        align-items: center;
        gap: 20px;
        padding: 22px 42px;
        border: 4px solid #141414;
        box-shadow: 14px 16px 0px #141414;
      }

      .tag-stop {
        padding: 8px 24px;
        font-size: 60px;
        font-weight: 900;
        letter-spacing: 1.5px;
        line-height: 1.1;
      }

      .text-action {
        font-size: 58px;
        font-weight: 900;
        letter-spacing: 1.5px;
        line-height: 1.1;
        margin: 0;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s13"
      data-width="1080"
      data-height="1920"
      data-duration="5.34"
    >
      <!-- Shot S13-1: Nền và hình ảnh chính -->
      <section id="shot-s13-1" class="clip" data-start="0" data-duration="5.34">
        <!-- Lưới nền Vox -->
        <div class="vox-grid-bg"></div>

        <!-- Khung ảnh papercraft cắt dán nghệ thuật -->
        <div class="media-frame" id="media-frame">
          <img
            id="hero-image"
            class="media-image"
            src="assets/img-09-papercut-warning-path-danger.jpg"
            alt="Con đường cảnh báo nguy hiểm"
          />
          <!-- Spotlight phủ lên hình ảnh -->
          <div class="spotlight-vignette"></div>
        </div>

        <!-- Shatter transition fragments lúc vào cảnh -->
        <div id="shatter-left" class="shatter-piece-left"></div>
        <div id="shatter-right" class="shatter-piece-right"></div>
      </section>

      <!-- Overlay 1: Nhãn CƠ HỘI DỪNG LẠI (t=2.1s đến t=3.9s, hold 1.8s đúng chuẩn shotlist) -->
      <section id="clip-overlay-label" class="clip" data-start="2.1" data-duration="1.8">
        <div class="overlay-label-container">
          <div id="warning-badge-el" class="warning-badge hf-plate-ink">
            <div class="warning-icon">
              <!-- Biểu tượng cảnh báo STOP lục giác tự vẽ chuẩn Vox -->
              <svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polygon points="10,2 24,2 32,10 32,24 24,32 10,32 2,24 2,10" fill="#FF6A1A" stroke="#141414" stroke-width="2" />
                <line x1="11" y1="17" x2="23" y2="17" stroke="#141414" stroke-width="3.5" stroke-linecap="round" />
              </svg>
            </div>
            <span class="badge-text">CƠ HỘI DỪNG LẠI</span>
          </div>
        </div>
      </section>

      <!-- Overlay 2: Punch-phrase KHÔNG DỪNG LẠI (t=3.5s đến hết scene t=5.34s, hold đủ 1.84s >= 1.8s) -->
      <section id="clip-overlay-punch" class="clip" data-start="3.5" data-duration="1.84">
        <div class="overlay-punch-container">
          <div id="punch-card-el" class="punch-card hf-plate-ink">
            <span class="tag-stop hf-hl-orange">KHÔNG</span>
            <span class="text-action">DỪNG LẠI</span>
          </div>
        </div>
      </section>

      <!-- Thanh cam đặc trưng Vox ở mép đáy màn hình -->
      <div class="vox-bottom-brand-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Shatter Transition In (0.0s -> 0.45s): 2 mảng cắt bung ra hai phía để hé lộ con đường
      tl.fromTo(
        "#shatter-left",
        { x: 0, opacity: 1 },
        { x: -600, opacity: 0, duration: 0.45, ease: "power3.inOut" },
        0
      );
      tl.fromTo(
        "#shatter-right",
        { x: 0, opacity: 1 },
        { x: 650, opacity: 0, duration: 0.45, ease: "power3.inOut" },
        0
      );

      // 2. Camera Motion: Zoom-in chậm 5% hướng về phía bờ vực
      tl.fromTo(
        "#hero-image",
        { scale: 1.0, y: 0 },
        { scale: 1.05, y: -30, duration: 5.34, ease: "none" },
        0
      );

      // Nhịp ổn định khung hình paper texture
      tl.fromTo(
        "#media-frame",
        { scale: 0.98, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.05
      );

      // 3. Overlay 1: "CƠ HỘI DỪNG LẠI" (t=2.1s -> t=3.9s, thời lượng đúng 1.8s)
      tl.fromTo(
        "#warning-badge-el",
        { scale: 0.85, opacity: 0, y: 20 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        2.1
      );
      // Fade out hoàn tất đúng mốc t=3.9s khi clip hết thời hạn hiển thị
      tl.fromTo(
        "#warning-badge-el",
        { scale: 1.0, opacity: 1 },
        { scale: 0.92, opacity: 0, duration: 0.25, ease: "power2.in" },
        3.65
      );

      // 4. Overlay 2: Punch-phrase "KHÔNG DỪNG LẠI" (t=3.5s -> t=5.34s, hiển thị trọn vẹn 1.84s >= 1.8s)
      tl.fromTo(
        "#punch-card-el",
        { scale: 1.25, opacity: 0, y: -15 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.28, ease: "power4.out" },
        3.5
      );

      // Đăng ký timeline duy nhất vào HyperFrames runtime
      window.__timelines["scene-s13"] = tl;
    </script>
  
    </template>
  </body>
</html>
