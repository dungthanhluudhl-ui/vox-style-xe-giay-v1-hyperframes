<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1920px;
      background-color: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    /* Quy ước bắt buộc: .clip dùng inset: 0 */
    .clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* Wrapper con chứa toàn bộ nội dung để thực hiện hiệu ứng rung chấn, không tween trực tiếp lên .clip */
    .scene-wrapper {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* Nền lưới 84px */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      pointer-events: none;
    }

    /* Biến thể spotlight tối ở rìa khung hình theo STYLE_DNA */
    .bg-spotlight {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 48%, rgba(231, 227, 217, 0) 35%, rgba(20, 20, 20, 0.38) 100%);
      pointer-events: none;
    }

    /* Thanh cam nhận diện cố định ở mép đáy khung hình, không bị ảnh hưởng bởi rung lắc */
    .brand-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 14px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Header tài liệu điều tra */
    .dossier-header {
      position: absolute;
      top: 170px;
      left: 70px;
      right: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #141414;
      padding-bottom: 14px;
    }

    .dossier-tag {
      background-color: #141414;
      color: #F7F4EC;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 6px 14px;
      text-transform: uppercase;
    }

    .dossier-meta {
      font-size: 19px;
      font-weight: 700;
      color: #141414;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Vùng chứa sơ đồ flow / diagram */
    .flow-stage {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* SVG đồ họa flow các đường dẫn */
    .flow-svg {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
    }

    /* Node 0: Điểm xuất phát của mối quan hệ */
    .flow-node-start {
      position: absolute;
      top: 310px;
      left: 0;
      right: 0;
      margin: 0 auto;
      width: fit-content;
      background-color: #F5F0E4;
      border: 3px solid #141414;
      padding: 16px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      box-shadow: 6px 6px 0px #141414;
    }

    .node-subtext {
      font-size: 16px;
      font-weight: 700;
      color: #141414;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .node-title {
      font-size: 26px;
      font-weight: 900;
      color: #141414;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Overlay 1: Nhãn "NGHI NGỜ GHEN TUÔNG" */
    .flow-node-jealousy {
      position: absolute;
      top: 490px;
      left: 0;
      right: 0;
      margin: 0 auto;
      width: fit-content;
      background-color: #FF6A1A;
      border: 4px solid #141414;
      padding: 20px 38px;
      box-shadow: 8px 8px 0px #141414;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 10;
    }

    .jealousy-prefix {
      font-size: 18px;
      font-weight: 900;
      color: #141414;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .jealousy-title {
      font-size: 40px;
      font-weight: 900;
      color: #141414;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* Điểm ngoặt gãy gập góc 90 độ - Hub chuyển hướng */
    .turn-point-hub {
      position: absolute;
      top: 695px;
      left: 705px;
      width: 150px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* Icon Warning chuẩn nét đậm */
    .warning-icon-box {
      width: 104px;
      height: 104px;
      background-color: #141414;
      border: 4px solid #FF6A1A;
      box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .warning-badge-label {
      background-color: #141414;
      color: #FF6A1A;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1.5px;
      padding: 6px 12px;
      border: 2px solid #FF6A1A;
      white-space: nowrap;
      text-transform: uppercase;
    }

    /* Đường đứt gãy chỉ báo lệch hướng tiêu cực */
    .deviation-stamp {
      position: absolute;
      top: 860px;
      left: 705px;
      background-color: #F7F4EC;
      color: #141414;
      border: 2px solid #141414;
      padding: 6px 12px;
      font-size: 17px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0;
    }

    /* Khối Punch-phrase chính: "Ý ĐỊNH SÁT HẠI" */
    .punch-container {
      position: absolute;
      top: 1020px;
      left: 70px;
      width: 940px;
      background-color: #141414;
      border: 6px solid #FF6A1A;
      box-shadow: 14px 14px 0px rgba(20, 20, 20, 0.5);
      padding: 42px 36px 40px 36px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .punch-court-note {
      font-size: 24px;
      font-weight: 700;
      color: #F7F4EC;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .punch-court-note::before,
    .punch-court-note::after {
      content: "";
      display: inline-block;
      width: 36px;
      height: 2px;
      background-color: #FF6A1A;
    }

    .punch-headline {
      font-size: 78px;
      font-weight: 900;
      line-height: 1.15;
      color: #FF6A1A;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-shadow: 0 0 24px rgba(255, 106, 26, 0.35);
    }

    .punch-sub-strip {
      background-color: #FF6A1A;
      color: #141414;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 6px 18px;
      text-transform: uppercase;
      align-self: center;
    }

    /* Các vạch trang trí kiểu hồ sơ pháp lý */
    .hazard-stripe {
      position: absolute;
      height: 8px;
      left: 0;
      right: 0;
      background: repeating-linear-gradient(
        -45deg,
        #FF6A1A,
        #FF6A1A 14px,
        #141414 14px,
        #141414 28px
      );
    }
    .hazard-stripe.top { top: 0; }
    .hazard-stripe.bottom { bottom: 0; }
  </style>

  <div
    id="root"
    data-composition-id="scene-s08"
    data-width="1080"
    data-height="1920"
    data-duration="9.5"
    data-start="0"
  >
    <!-- Scene độc lập S08: Tổng thời lượng 9.5 giây -->
    <section class="clip" id="scene-s08" data-start="0" data-duration="9.5">
      <!-- Wrapper con bọc nội dung động, nhận chuyển động rung chấn thay cho clip -->
      <div class="scene-wrapper" id="scene-wrapper">
        <!-- Nền lưới & spotlight -->
        <div class="bg-grid"></div>
        <div class="bg-spotlight"></div>

        <!-- Header hồ sơ điều tra -->
        <div class="dossier-header" id="dossier-header">
          <div class="dossier-tag">HỒ SƠ BẢN ÁN</div>
          <div class="dossier-meta">DIỄN BIẾN TÂM LÝ TỘI PHẠM</div>
        </div>

        <!-- Sơ đồ Flow & Diagram -->
        <div class="flow-stage">
          <svg class="flow-svg" viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Đường thẳng ban đầu: từ nút bắt đầu xuống nút nghi ngờ -->
            <path
              id="path-initial"
              d="M 540 400 L 540 520"
              stroke="#141414"
              stroke-width="8"
              stroke-linecap="round"
              stroke-dasharray="120"
              stroke-dashoffset="120"
            />

            <!-- Lộ trình tiếp tục xuống trước khi bẻ ngoặt -->
            <path
              id="path-straight-lead"
              d="M 540 600 L 540 760"
              stroke="#141414"
              stroke-width="8"
              stroke-linecap="round"
              stroke-dasharray="160"
              stroke-dashoffset="160"
            />

            <!-- Đoạn rẽ đột ngột 90 độ sang phải -->
            <path
              id="path-turn-right"
              d="M 540 760 L 780 760"
              stroke="#FF6A1A"
              stroke-width="14"
              stroke-linecap="square"
              stroke-linejoin="miter"
              stroke-dasharray="240"
              stroke-dashoffset="240"
            />

            <!-- Đoạn gãy gập góc 90 độ cắm thẳng xuống cụm cảnh báo -->
            <path
              id="path-turn-down"
              d="M 780 760 L 780 1000 L 540 1000"
              stroke="#FF6A1A"
              stroke-width="14"
              stroke-linecap="square"
              stroke-linejoin="miter"
              stroke-dasharray="480"
              stroke-dashoffset="480"
            />

            <!-- Mũi tên cam cắm thẳng vào đỉnh khối cảnh báo -->
            <polygon
              id="arrow-head-final"
              points="540,1030 520,990 560,990"
              fill="#FF6A1A"
              opacity="0"
            />

            <!-- Vạch đứt biểu thị quỹ đạo cũ bị đứt đoạn -->
            <path
              id="path-ghost-old"
              d="M 540 760 L 540 920"
              stroke="rgba(20,20,20,0.3)"
              stroke-width="4"
              stroke-dasharray="12 12"
              opacity="0"
            />
          </svg>

          <!-- Node 1: Mối quan hệ -->
          <div class="flow-node-start" id="node-start">
            <span class="node-subtext">QUAN HỆ TÌNH CẢM</span>
            <span class="node-title">THÀNH &amp; KIM</span>
          </div>

          <!-- Overlay 1: NGHI NGỜ GHEN TUÔNG (t=1.08s, hold 2.4s+) -->
          <div class="flow-node-jealousy" id="node-jealousy">
            <span class="jealousy-prefix">BẮT ĐẦU PHÁT SINH</span>
            <span class="jealousy-title">NGHI NGỜ GHEN TUÔNG</span>
          </div>

          <!-- Điểm ngoặt gãy gập góc 90 độ & Overlay 2: Warning Icon (t=4.87s) -->
          <div class="turn-point-hub" id="turn-hub">
            <div class="warning-icon-box">
              <svg width="60" height="60" viewBox="0 0 60 60" fill="none">
                <path d="M 30 6 L 56 52 L 4 52 Z" fill="#FF6A1A" stroke="#141414" stroke-width="3" stroke-linejoin="round" />
                <line x1="30" y1="22" x2="30" y2="36" stroke="#141414" stroke-width="6" stroke-linecap="round" />
                <circle cx="30" cy="44" r="3.5" fill="#141414" />
              </svg>
            </div>
            <div class="warning-badge-label">HƯỚNG RẤT XẤU</div>
          </div>

          <!-- Nhãn phụ chỉ báo chuyển hướng -->
          <div class="deviation-stamp" id="deviation-stamp">RẼ HƯỚNG BẠO LỰC</div>

          <!-- Overlay 3: Punch-phrase "Ý ĐỊNH SÁT HẠI" (t=7.89s, hold 2.2s+) -->
          <div class="punch-container" id="punch-container">
            <div class="hazard-stripe top"></div>
            <div class="punch-court-note">THEO NHẬN ĐỊNH CỦA TÒA ÁN</div>
            <h1 class="punch-headline">Ý ĐỊNH SÁT HẠI</h1>
            <div class="punch-sub-strip">TƯỚC ĐOẠT TÍNH MẠNG</div>
            <div class="hazard-stripe bottom"></div>
          </div>
        </div>
      </div>

      <!-- Thanh thương hiệu cố định mép đáy -->
      <div class="brand-bottom-bar"></div>
    </section>
  </div>

  <script>
    // Khởi tạo Timeline Paused duy nhất theo hợp đồng HyperFrames
    const tl = gsap.timeline({ paused: true });

    // 1. BEAT 1 (0.0s - 3.5s): Thiết lập ban đầu và xuất hiện "NGHI NGỜ GHEN TUÔNG"
    // Header & Điểm xuất phát rơi vào vị trí tự nhiên
    tl.fromTo("#dossier-header", 
      { y: -30, opacity: 0 }, 
      { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 
      0.2
    );

    tl.fromTo("#node-start", 
      { scale: 0.8, opacity: 0 }, 
      { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 
      0.3
    );

    // Đường flow đoạn đầu vẽ xuống
    tl.to("#path-initial", 
      { strokeDashoffset: 0, duration: 0.5, ease: "none" }, 
      0.6
    );

    // Overlay 1: "NGHI NGỜ GHEN TUÔNG" xuất hiện chính xác tại t = 1.08s (atMs: 60940)
    tl.fromTo("#node-jealousy", 
      { scale: 0, opacity: 0, rotation: -3 }, 
      { scale: 1, opacity: 1, rotation: 0, duration: 0.55, ease: "back.out(1.4)" }, 
      1.08
    );

    // Nhịp đập nhấn mạnh sự nghi ngờ
    tl.to("#node-jealousy", 
      { scale: 1.05, duration: 0.2, yoyo: true, repeat: 1, ease: "power1.inOut" }, 
      2.0
    );

    // 2. BEAT 2 (3.5s - 6.5s): Câu chuyện bắt đầu rẽ sang hướng rất xấu
    // Đường flow tiếp tục dẫn thẳng xuống mốc ngã rẽ
    tl.to("#path-straight-lead", 
      { strokeDashoffset: 0, duration: 0.7, ease: "power2.in" }, 
      3.2
    );

    // Vạch đứt lộ trình cũ bị từ bỏ xuất hiện
    tl.to("#path-ghost-old", 
      { opacity: 0.7, duration: 0.4, ease: "power1.out" }, 
      3.9
    );

    // BƯỚC NGOẶT ĐỘT BIẾN: Đường cam bẻ ngoặt 90 độ sang phải
    tl.to("#path-turn-right", 
      { strokeDashoffset: 0, duration: 0.6, ease: "power3.out" }, 
      4.1
    );

    // Overlay 2: Warning Icon xuất hiện ngay góc gãy gập tại t = 4.87s (atMs: 64730)
    tl.fromTo("#turn-hub", 
      { scale: 0, opacity: 0, rotation: 25 }, 
      { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "power4.out" }, 
      4.87
    );

    // Stamp "RẼ HƯỚNG BẠO LỰC" đóng dấu sắc lạnh
    tl.fromTo("#deviation-stamp", 
      { opacity: 0, y: 15, scale: 0.9 }, 
      { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power2.out" }, 
      5.3
    );

    // Cảnh báo rung giật cảnh báo nguy hiểm
    tl.to("#turn-hub", 
      { rotation: -4, duration: 0.1, yoyo: true, repeat: 3, ease: "sine.inOut" }, 
      5.5
    );

    // 3. BEAT 3 (6.5s - 9.5s): Đường gãy gập dẫn thẳng vào cụm "Ý ĐỊNH SÁT HẠI"
    // Đường cam gãy gập góc 90 độ thứ hai cắm thẳng xuống phía dưới
    tl.to("#path-turn-down", 
      { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 
      6.4
    );

    // Đầu mũi tên tam giác cam xuất hiện cắm xuống
    tl.to("#arrow-head-final", 
      { opacity: 1, duration: 0.2, ease: "power1.out" }, 
      7.2
    );

    // Overlay 3: Punch-phrase "Ý ĐỊNH SÁT HẠI" xuất hiện theo kiểu STRIKE tại t = 7.89s (atMs: 67750)
    tl.fromTo("#punch-container", 
      { scale: 1.35, opacity: 0, y: -20 }, 
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, 
      7.89
    );

    // Rung chấn tác động mạnh mẽ (Impact jolt) lên wrapper con bên trong thay vì phần tử .clip
    tl.to("#scene-wrapper", 
      { y: 6, duration: 0.08, yoyo: true, repeat: 2, ease: "power2.inOut" }, 
      8.39
    );

    // Đăng ký timeline cho runtime HyperFrames
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s08"] = tl;
  </script>

    </template>
  </body>
