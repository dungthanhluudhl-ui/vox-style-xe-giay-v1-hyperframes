<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }

      /* Quy ước clip layout của HyperFrames */
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Nền spotlight với vignette và grid kẻ ô 84px đặc trưng Vox */
      .spotlight-bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 42%, #EAE6DC 0%, #DFDACD 55%, #C2BBB0 100%);
      }
      .grid-pattern {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        pointer-events: none;
      }

      /* Khung ảnh trung tâm dạng paper collage */
      .hero-frame-wrapper {
        position: absolute;
        top: 240px;
        left: 70px;
        width: 940px;
        height: 960px;
        border: 4px solid #141414;
        box-shadow: 14px 14px 0px #141414;
        background-color: #141414;
        overflow: hidden;
      }
      .hero-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 115%;
        object-fit: cover;
        object-position: center top;
        display: block;
      }

      /* Chi tiết dán góc kiểu paper collage */
      .tape-corner {
        position: absolute;
        top: 222px;
        right: 90px;
        width: 130px;
        height: 38px;
        background-color: rgba(245, 240, 228, 0.95);
        border: 2px solid #141414;
        box-shadow: 4px 4px 0px rgba(20, 20, 20, 0.4);
        transform: rotate(7deg);
        z-index: 25;
      }

      /* Overlay 1: Time Label (atMs: 184170 -> t=0.76s, holdMs: 2000) */
      .time-badge {
        position: absolute;
        top: 196px;
        left: 100px;
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 16px 28px;
        background-color: #141414;
        border: 3px solid #141414;
        box-shadow: 8px 8px 0px #FF6A1A;
        z-index: 30;
      }
      .time-icon-circle {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background-color: #FF6A1A;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .time-icon-circle svg {
        width: 20px;
        height: 20px;
        fill: #141414;
      }
      .time-badge-text {
        font-size: 34px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 2px;
        text-transform: uppercase;
        line-height: 1;
      }

      /* Overlay 2: Punch Phrase (atMs: 187090 -> t=3.68s, holdMs: 2200) */
      .punch-container {
        position: absolute;
        top: 1235px;
        left: 70px;
        width: 940px;
        padding: 24px 32px;
        background-color: #141414;
        border: 4px solid #141414;
        box-shadow: 12px 12px 0px #FF6A1A;
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 35;
      }
      .punch-tag-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .punch-tag {
        background-color: #FF6A1A;
        color: #141414;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 2px;
        padding: 6px 14px;
        text-transform: uppercase;
        line-height: 1.1;
      }
      .punch-rule {
        flex-grow: 1;
        height: 3px;
        background-color: rgba(247, 244, 236, 0.3);
      }
      .punch-text {
        font-size: 64px;
        font-weight: 900;
        color: #F7F4EC;
        line-height: 1.15;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin: 0;
      }

      /* Thanh nhận diện thương hiệu cam cố định ở đáy khung hình */
      #bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 16px;
        background-color: #FF6A1A;
        z-index: 99;
      }

      /* Class màu an toàn theo hợp đồng styling */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
      .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
      .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
      .hf-plate-paper { background-color: #E7E3D9; color: #141414; }
    </style>

    <div
      id="root"
      data-composition-id="scene-s23"
      data-width="1080"
      data-height="1920"
      data-duration="5.76"
    >
      <!-- Background Spotlight & Grid -->
      <div class="spotlight-bg"></div>
      <div class="grid-pattern"></div>

      <!-- Shot S23-1: timed element từ 0s tới 5.76s -->
      <section id="shot-s23-1" class="clip" data-start="0" data-duration="5.76">
        <!-- Khung ảnh chính chứa tranh minh họa trụ sở Công an xã -->
        <div id="hero-frame" class="hero-frame-wrapper">
          <img
            id="hero-img"
            class="hero-image"
            src="assets/img-02-thief-surrenders-police-station.jpg"
            alt="Người đàn ông đầu thú tại trụ sở Công an xã"
          />
        </div>

        <!-- Mẩu dán trang trí phong cách collage -->
        <div id="tape-mark" class="tape-corner"></div>

        <!-- Overlay 1: Label mốc thời gian (atMs 184170 -> relative 0.76s) -->
        <div id="time-badge-overlay" class="time-badge">
          <div class="time-icon-circle">
            <svg viewBox="0 0 24 24">
              <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm1 14h-2V7h2v9zm-1-11c-.6 0-1 .4-1 1s.4 1 1 1 1-.4 1-1-.4-1-1-1z" />
            </svg>
          </div>
          <span class="time-badge-text">18:30 - CÙNG NGÀY</span>
        </div>

        <!-- Overlay 2: Punch Phrase điểm nhấn hành vi (atMs 187090 -> relative 3.68s) -->
        <div id="punch-phrase-overlay" class="punch-container">
          <div class="punch-tag-row">
            <span class="punch-tag">BIÊN BẢN</span>
            <div class="punch-rule"></div>
          </div>
          <h2 class="punch-text">ĐẦU THÚ KHAI NHẬN</h2>
        </div>
      </section>

      <!-- Thanh cam đặc trưng thương hiệu ở mép dưới cùng -->
      <div id="bottom-brand-bar"></div>
    </div>

    <script>
      // Đăng ký đúng 1 paused timeline cho HyperFrames
      const tl = gsap.timeline({ paused: true });

      // 1. Vào cảnh: transitionIn "rise" cho toàn bộ khung minh họa (t=0 -> 0.7s)
      tl.fromTo(
        "#hero-frame",
        { y: 80, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0
      );
      tl.fromTo(
        "#tape-mark",
        { y: 60, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.15
      );

      // 2. Camera motion: pan dọc chậm từ bảng hiệu phía trên xuống bóng người đàn ông, kết hợp pan-left nhẹ (0s -> 5.76s)
      tl.fromTo(
        "#hero-img",
        { y: 0, x: 24, scale: 1.14 },
        { y: -88, x: -24, scale: 1.14, duration: 5.76, ease: "none" },
        0
      );

      // 3. Overlay 1: Time Label "18:30 - CÙNG NGÀY" xuất hiện tại t=0.76s, giữ 2s rồi mờ đi
      tl.fromTo(
        "#time-badge-overlay",
        { y: 24, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        0.76
      );
      tl.to(
        "#time-badge-overlay",
        { y: -16, opacity: 0, duration: 0.35, ease: "power2.in" },
        2.9
      );

      // 4. Overlay 2: Punch Phrase "ĐẦU THÚ KHAI NHẬN" xuất hiện tại t=3.68s, giữ tới cuối cảnh
      tl.fromTo(
        "#punch-phrase-overlay",
        { y: 45, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.52, ease: "power3.out" },
        3.68
      );

      // Gắn timeline vào registry của HyperFrames
      window.__timelines["scene-s23"] = tl;
    </script>
  
    </template>
  </body>
</html>
