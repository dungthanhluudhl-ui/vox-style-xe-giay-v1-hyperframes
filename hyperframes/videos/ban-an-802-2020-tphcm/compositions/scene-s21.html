        "#phone-badge",
        { rotation: -12 },

      tl.to("#arrow-2", { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.5)" }, 5.75);

        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },

      tl.fromTo(

        { y: 30, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        6.35
