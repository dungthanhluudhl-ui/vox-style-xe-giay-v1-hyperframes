<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }

      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Thanh cam nhận diện thương hiệu cố định đáy khung hình */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 10px;
        background-color: #ff6a1a;
        z-index: 1000;
      }

      /* Lưới nền phong cách Vox */
      .vox-grid-overlay {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        pointer-events: none;
      }

      /* SHOT 1: Phiên tòa phúc thẩm */
      #shot-1 {
        background-color: #141414;
      }

      #shot-1-punch {
        position: absolute;
        inset: 0;
        transform-origin: center center;
      }

      #shot-1-cam {
        position: absolute;
        inset: 0;
        transform-origin: center 40%;
      }

      #shot-1-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 30%;
        display: block;
      }

      .vignette-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 40%,
          rgba(20, 20, 20, 0.1) 0%,
          rgba(20, 20, 20, 0.6) 100%
        );
        pointer-events: none;
      }

      /* Nhãn Shot 1 */
      .label-badge-1 {
        position: absolute;
        top: 220px;
        left: 70px;
        z-index: 20;
        background-color: #141414;
        border-left: 8px solid #ff6a1a;
        padding: 16px 28px;
        border-radius: 4px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      }

      .label-badge-1 span {
        color: #f7f4ec;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        display: block;
      }

      .label-badge-2 {
        position: absolute;
        top: 315px;
        left: 70px;
        z-index: 20;
        background-color: #ff6a1a;
        padding: 16px 32px;
        border-radius: 4px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      }

      .label-badge-2 span {
        color: #141414;
        font-size: 36px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        display: block;
      }

      /* SHOT 2: Trích dẫn bản án & con dấu */
      #shot-2 {
        background: radial-gradient(
          circle at 50% 45%,
          #f5f0e4 0%,
          #e7e3d9 55%,
          #cfc9bc 100%
        );
      }

      #doc-card {
        position: absolute;
        top: 430px;
        left: 54px;
        width: 972px;
        z-index: 10;
        transform-origin: center center;
      }

      #doc-card-inner {
        background-color: #f5f0e4;
        border: 2px solid rgba(20, 20, 20, 0.35);
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 24px 50px rgba(20, 20, 20, 0.22);
        transform-origin: center center;
      }

      #doc-image {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 4px;
      }

      /* Con dấu TÙ CHUNG THÂN */
      #stamp-container {
        position: absolute;
        top: 800px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        z-index: 30;
      }

      #stamp-verdict {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: #141414;
        border: 6px solid #ff6a1a;
        border-radius: 8px;
        padding: 20px 52px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
        transform-origin: center center;
      }

      #stamp-verdict span {
        color: #ff6a1a;
        font-size: 64px;
        font-weight: 900;
        letter-spacing: 4px;
        line-height: 1;
        text-transform: uppercase;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s35"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="9.86"
    >
      <!-- Dải cam cố định đáy màn hình nhận diện Vox -->
      <div id="brand-bottom-bar"></div>

      <!-- SHOT 1: Phiên tòa tuyên bác kháng cáo (0.00s - 4.45s) -->
      <section id="shot-1" class="clip" data-start="0" data-duration="4.45">
        <div id="shot-1-punch">
          <div id="shot-1-cam">
            <img
              id="shot-1-img"
              src="assets/img-04-courtroom-life-sentence-verdict.jpg"
              alt="Hội đồng xét xử tuyên án"
            />
          </div>
          <div class="vignette-overlay"></div>
        </div>

        <!-- Label 1: HỘI ĐỒNG PHÚC THẨM (1.00s - 3.20s) -->
        <div id="label-1" class="label-badge-1">
          <span>HỘI ĐỒNG PHÚC THẨM</span>
        </div>

        <!-- Label 2: BÁC ĐƠN KHÁNG CÁO (2.65s - 4.45s) -->
        <div id="label-2" class="label-badge-2">
          <span>BÁC ĐƠN KHÁNG CÁO</span>
        </div>
      </section>

      <!-- SHOT 2: Thẻ tài liệu phán quyết bản án & con dấu TÙ CHUNG THÂN (4.45s - 9.86s) -->
      <section id="shot-2" class="clip" data-start="4.45" data-duration="5.41">
        <div class="vox-grid-overlay"></div>

        <!-- Thẻ trích dẫn bản án doc-02 -->
        <div id="doc-card">
          <div id="doc-card-inner">
            <img
              id="doc-image"
              src="assets/doc-02-verdict.png"
              alt="Trích lục bản án phúc thẩm"
            />
          </div>
        </div>

        <!-- Con dấu phán quyết đập xuống (5.36s - 9.86s) -->
        <div id="stamp-container">
          <div id="stamp-verdict">
            <span>TÙ CHUNG THÂN</span>
          </div>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // ================= SHOT 1 (0.00s - 4.45s) =================
      // Entrance animation: Punch vào phiên tòa
      tl.fromTo(
        "#shot-1-punch",
        { scale: 1.08, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0
      );

      // Camera motion: Zoom chậm 4% vào bục khai báo và Quốc huy
      tl.fromTo(
        "#shot-1-cam",
        { scale: 1.0 },
        { scale: 1.04, duration: 4.45, ease: "none" },
        0
      );

      // Overlay 1: HỘI ĐỒNG PHÚC THẨM (atMs: 277580 -> 1.00s, hold 2.20s -> 3.20s)
      tl.fromTo(
        "#label-1",
        { x: -35, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        1.0
      );
      tl.to(
        "#label-1",
        { y: -10, opacity: 0, duration: 0.25, ease: "power2.in" },
        3.2
      );

      // Overlay 2: BÁC ĐƠN KHÁNG CÁO (atMs: 279230 -> 2.65s, hold 1.80s -> hết Shot 1)
      tl.fromTo(
        "#label-2",
        { scale: 0.88, opacity: 0, y: 15 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        2.65
      );

      // ================= SHOT 2 (4.45s - 9.86s) =================
      // Transition In: Cut sang thẻ tài liệu
      tl.fromTo(
        "#doc-card",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        4.45
      );

      // Camera motion: Zoom rất nhẹ 2% thẻ tài liệu
      tl.fromTo(
        "#doc-card-inner",
        { scale: 1.0 },
        { scale: 1.02, duration: 5.41, ease: "sine.out" },
        4.45
      );

      // Overlay: Punch-phrase TÙ CHUNG THÂN đập xuống (atMs: 281940 -> 5.36s)
      tl.fromTo(
        "#stamp-verdict",
        { scale: 1.55, opacity: 0, rotation: -9 },
        {
          scale: 1.0,
          opacity: 1,
          rotation: -3,
          duration: 0.35,
          ease: "power4.out"
        },
        5.36
      );

      // Đăng ký timeline cho HyperFrames seek
      window.__timelines["scene-s35"] = tl;
    </script>
  
    </template>
  </body>
</html>
