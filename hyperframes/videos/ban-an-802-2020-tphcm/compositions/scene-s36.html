    <script>
      // Setup deterministic GSAP animation timeline
      const tl = gsap.timeline({ paused: true });

      // Path length measurement for stroke draw animation
      const returnArrow = document.getElementById("return-arrow");

        const arrowLen = returnArrow.getTotalLength();
        returnArrow.style.strokeDasharray = arrowLen;
        returnArrow.style.strokeDashoffset = arrowLen;

      const wallBarrier = document.getElementById("wall-barrier");

        const barrierLen = wallBarrier.getTotalLength();

        wallBarrier.style.strokeDashoffset = barrierLen;

      // Initial visual states
      gsap.set("#scene-container", { scale: 0.96, opacity: 0 });
      gsap.set("#badge-reflect", { y: -24, opacity: 0, scale: 0.9 });
      gsap.set("#subtitle-text", { opacity: 0, y: -10 });
      gsap.set("#card-thanh", { x: -40, opacity: 0 });
      gsap.set("#arrow-head", { scale: 0, opacity: 0, transformOrigin: "center center" });
      gsap.set("#split-line", { scaleY: 0, transformOrigin: "top center" });
      gsap.set("#card-kim", { x: 40, opacity: 0 });
      gsap.set(".wall-brick", { scaleY: 0, opacity: 0, transformOrigin: "bottom center" });
      gsap.set("#punch-container", { scale: 1.25, opacity: 0, transformOrigin: "center center" });

      // 0.0s - 0.6s: Scene entrance (grow)
      tl.to(
        "#scene-container",
        { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.1
      );

      // 1.34s: Overlay 1 - "ĐIỂM ĐÁNG SUY NGẪM" (287780ms - 286440ms = 1.34s)
      tl.to(
        "#badge-reflect",
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        1.34
      );
      tl.to(
        "#subtitle-text",
        { opacity: 0.85, y: 0, duration: 0.35, ease: "power2.out" },
        1.55
      );

      // 2.1s - 3.2s: "Sau ly hôn, Thành muốn quay lại"

        "#card-thanh",
        { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        2.1

      tl.to(
        "#split-line",
        { scaleY: 1, duration: 0.5, ease: "power2.out" },
        2.3

        2.45

        3.0

      // 3.4s - 4.6s: "Kim không muốn"

        3.65

      tl.to(

        { strokeDashoffset: 0, duration: 0.45, ease: "power3.out" },
        4.15

      // 5.36s: Overlay 2 - Punch phrase "MỘT BÊN CHỐI TỪ" (291800ms - 286440ms = 5.36s)

        { scale: 1, opacity: 1, duration: 0.35, ease: "power4.out" },
        5.36
