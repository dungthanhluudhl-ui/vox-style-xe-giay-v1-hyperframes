<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F5F0E4;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Helper contrast classes */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
    .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
    .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
    .hf-plate-paper { background-color: #E7E3D9; color: #141414; }

    /* Signature bottom brand bar */
    #bottom-brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 100;
      pointer-events: none;
    }

    .camera-layer {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
    }

    /* Shot 1 Elements */
    .img-wrapper {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: 50% 50%;
    }

    #shot1-img {
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      display: block;
    }

    .badge-container {
      position: absolute;
      top: 260px;
      left: 0;
      width: 1080px;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }

    .badge-plate {
      display: inline-flex;
      align-items: center;
      background-color: #141414;
      padding: 16px 36px;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(20, 20, 20, 0.45);
    }

    .badge-bar {
      width: 8px;
      height: 52px;
      background-color: #FF6A1A;
      margin-right: 20px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .badge-text {
      color: #F7F4EC;
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 56px;
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
    }

    /* Shot 2 Elements */
    .shot2-badge-container {
      position: absolute;
      top: 380px;
      left: 0;
      width: 1080px;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }

    .doc-badge {
      display: inline-block;
      font-family: "Be Vietnam Pro", sans-serif;
      font-weight: 900;
      font-size: 38px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 14px 34px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(20, 20, 20, 0.16);
      white-space: nowrap;
      line-height: 1.1;
    }

    .doc-card-container {
      position: absolute;
      left: 43px;
      top: 510px;
      width: 994px;
      background-color: #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(20, 20, 20, 0.18), 0 4px 12px rgba(20, 20, 20, 0.08);
      border: 2px solid rgba(20, 20, 20, 0.16);
      overflow: hidden;
      box-sizing: border-box;
      transform-origin: 50% 50%;
    }

    .doc-image {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s01"
    data-width="1080"
    data-height="1920"
    data-duration="6.83"
  >
    <!-- Brand Signature Bottom Bar -->
    <div id="bottom-brand-bar"></div>

    <!-- SHOT 1 (S01-1): 0s - 3.01s -->
    <div id="shot-1" class="clip" data-start="0" data-duration="3.01" data-track-index="0">
      <div id="shot1-camera" class="camera-layer" data-layout-allow-overflow="true">
        <div id="shot1-img-wrap" class="img-wrapper" data-layout-allow-overflow="true">
          <img
            id="shot1-img"
            src="assets/img-11-court-verdict-evidence-cutout.jpg"
            alt="Hồ sơ vụ án và tang vật"
          >
        </div>
      </div>

      <div class="badge-container">
        <div id="shot1-badge" class="badge-plate">
          <div class="badge-bar"></div>
          <span class="badge-text">TÔI ĐỌC ÁN</span>
        </div>
      </div>
    </div>

    <!-- SHOT 2 (S01-2): 3.01s - 6.83s -->
    <div id="shot-2" class="clip" data-start="3.01" data-duration="3.82" data-track-index="0">
      <div id="shot2-camera" class="camera-layer" data-layout-allow-overflow="true">
        <div id="shot2-card" class="doc-card-container">
          <img
            id="shot2-doc"
            class="doc-image"
            src="assets/doc-01-header.png"
            alt="Bản án số 802/2020/HS-PT"
          >
        </div>
      </div>

      <div class="shot2-badge-container">
        <div id="shot2-badge" class="doc-badge hf-hl-orange">
          BẢN ÁN PHÚC THẨM
        </div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // --- SHOT 1 CHOREOGRAPHY (t = 0s to 3.01s) ---
    // Entrance: Unfold paper dossier from center
    tl.fromTo(
      "#shot1-img-wrap",
      { scaleY: 0.1, opacity: 0 },
      { scaleY: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
      0
    );

    // Continuous slow camera zoom-in 3%
    tl.fromTo(
      "#shot1-camera",
      { scale: 1 },
      { scale: 1.03, duration: 3.01, ease: "none" },
      0
    );

    // Overlay Badge: "TÔI ĐỌC ÁN" (starts at 0.56s, holds 2.0s, exits before cut)
    tl.fromTo(
      "#shot1-badge",
      { y: 32, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      0.56
    );
    tl.to(
      "#shot1-badge",
      { y: -20, opacity: 0, duration: 0.35, ease: "power2.in" },
      2.56
    );

    // --- SHOT 2 CHOREOGRAPHY (t = 3.01s to 6.83s) ---
    // Cut transition to Shot 2: Document card enters with smooth settle
    tl.fromTo(
      "#shot2-card",
      { scale: 0.95, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      3.01
    );

    // Subtle 2% zoom-in camera motion for document card
    tl.fromTo(
      "#shot2-camera",
      { scale: 1 },
      { scale: 1.02, duration: 3.82, ease: "none" },
      3.01
    );

    // Overlay Badge: "BẢN ÁN PHÚC THẨM" (starts at 3.09s, holds 2.5s)
    tl.fromTo(
      "#shot2-badge",
      { y: 24, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      3.09
    );
    tl.to(
      "#shot2-badge",
      { opacity: 0, y: -12, duration: 0.35, ease: "power2.in" },
      5.59
    );

    // Register paused timeline with composition ID
    window.__timelines["scene-s01"] = tl;
  </script>

    </template>
  </body>
</html>
