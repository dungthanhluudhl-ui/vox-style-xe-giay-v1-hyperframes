    <div

      <!-- Overlay 1: 09:30 - 14/07/2019 (at 0.58s, hold 2.4s) -->

      <!-- Overlay 2: Technical Dimension Ruler & DÂY ĐIỆN 90 CM (at 4.47s, hold 2.2s) -->

              <svg class="ruler-svg-el" viewBox="0 0 960 60">
                <!-- Outer reference boundaries -->
                <line x1="40" y1="6" x2="40" y2="54" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round" />
                <line x1="920" y1="6" x2="920" y2="54" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round" />
                <!-- Main span measurement line -->

                <!-- Arrow tips -->

              <ellipse id="pin-ripple-2" cx="100" cy="205" rx="32" ry="10" fill="none" stroke="#FF6A1A" stroke-width="3" opacity="0" />
              <!-- Anchor Dot -->

    <!-- Animation Runtime Script -->
    <script>
      // Single paused master timeline registered on window.__timelines["scene-s09"]
      const tl = gsap.timeline({ paused: true });

      // 1. Setup SVG stroke measurements deterministically
      const rulerLine = document.getElementById("ruler-line");
      if (rulerLine) {
        const rulerLen = 880;
        rulerLine.style.strokeDasharray = `${rulerLen}`;
        rulerLine.style.strokeDashoffset = `${rulerLen}`;
      }

      const pinBody = document.getElementById("pin-body");
      if (pinBody) {
        const len = pinBody.getTotalLength ? pinBody.getTotalLength() : 450;
        pinBody.style.strokeDasharray = `${len}`;
        pinBody.style.strokeDashoffset = `${len}`;
      }

      const pinHole = document.getElementById("pin-hole");
      if (pinHole) {
        const holeLen = pinHole.getTotalLength ? pinHole.getTotalLength() : 138;
        pinHole.style.strokeDasharray = `${holeLen}`;
        pinHole.style.strokeDashoffset = `${holeLen}`;
      }

      // 2. Camera entrance (zoom-through) & continuous subtle pan/zoom (0.0s -> 12.49s)
      tl.fromTo(
        "#camera-layer",
        { scale: 1.14, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.75, ease: "power3.out" },
        0
      );

      // Continuous 3% slow zoom-in & gentle pan from trunk upward (0.75s -> 12.49s)
      tl.fromTo(
        "#hero-img",
        { scale: 1.0, y: 20 },
        { scale: 1.03, y: -25, duration: 11.74, ease: "none" },
        0.75
      );

      // 3. Overlay 1: Time Stamp Badge (at 0.58s, hold 2.4s)
      tl.fromTo(
        "#time-card",
        { x: -50, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.58
      );
      tl.to(
        "#time-card",
        { opacity: 0, x: -30, duration: 0.35, ease: "power2.in" },
        2.60
      );

      // 4. Overlay 2: Technical Dimension Ruler & DÂY ĐIỆN 90 CM (at 4.47s, hold 2.2s)
      tl.fromTo(
        ".diagram-header-plate",
        { y: -24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        4.47
      );
      // Ruler line traces across
      tl.fromTo(
        "#ruler-line",
        { strokeDashoffset: 880 },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        4.55
      );
      // Center badge springs into view using GSAP percent positioning to prevent transform conflict
      tl.fromTo(
        "#ruler-badge",
        { scale: 0.7, opacity: 0, xPercent: -50, yPercent: -50 },
        { scale: 1.0, opacity: 1, xPercent: -50, yPercent: -50, duration: 0.4, ease: "power3.out" },
        4.85
      );
      // Exit fade before clip cutoff (4.47 + 2.2 = 6.67s)
      tl.to(
        "#wire-card",
        { opacity: 0, y: 15, duration: 0.32, ease: "power2.in" },
        6.30
      );

      // 5. Overlay 3: BĂNG KEO VÀNG (at 6.46s, hold 2.0s)
      tl.fromTo(
        "#tape-card",
        { scale: 0.85, opacity: 0, y: 25 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        6.46
      );
      tl.to(
        "#tape-card",
        { opacity: 0, y: -15, duration: 0.3, ease: "power2.in" },
        8.10
      );

      // 6. Overlay 4: Icon "pin" (at 10.10s, hold 2.39s) - Pure visual vocabulary icon
      // Pin badge pops into view
      tl.fromTo(
        "#pin-badge",
        { scale: 0.8, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.45, ease: "power3.out" },
        10.10
      );
      // Progressive SVG path draw for the pin body
      tl.to(
        "#pin-body",
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        10.20
      );
      // Progressive SVG path draw for the inner circle
      tl.to(
        "#pin-hole",
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        10.35
      );
      // Fill transition once stroke finishes
      tl.to(
        "#pin-body",
        { fill: "#FF6A1A", duration: 0.25, ease: "power1.out" },
        10.75
      );
      tl.to(
        "#pin-hole",
        { fill: "#141414", duration: 0.25, ease: "power1.out" },
        10.75
      );
      // Concentric pulse ripples expand once deterministically (finishing at 11.30s and 11.50s, well within 12.49s duration)
      tl.fromTo(
        "#pin-ripple-1",
        { scale: 0.2, opacity: 1, transformOrigin: "100px 205px" },
        { scale: 1.3, opacity: 0, duration: 0.75, ease: "power2.out", immediateRender: false },
        10.55
      );
      tl.fromTo(
        "#pin-ripple-2",
        { scale: 0.2, opacity: 1, transformOrigin: "100px 205px" },
        { scale: 1.2, opacity: 0, duration: 0.75, ease: "power2.out", immediateRender: false },
        10.75
      );

      // Register the built timeline on window.__timelines["scene-s09"]
      window.__timelines["scene-s09"] = tl;
    </script>
