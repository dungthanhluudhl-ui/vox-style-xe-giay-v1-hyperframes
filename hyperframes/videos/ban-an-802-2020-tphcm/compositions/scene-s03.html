<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Core canvas container */
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }

      /* Base clip standard */
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Background variant: spotlight with subtle grid */
      .bg-spotlight {
        position: absolute;
        inset: 0;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.14) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.14) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }

      .spotlight-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 45%, rgba(20, 20, 20, 0) 35%, rgba(20, 20, 20, 0.38) 100%);
        pointer-events: none;
      }

      /* Image collage presentation */
      .media-viewport {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 200px;
        height: 980px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .collage-frame {
        position: relative;
        width: 100%;
        height: 100%;
        border: 4px solid #141414;
        background-color: #141414;
        box-shadow: 0 24px 48px rgba(20, 20, 20, 0.22);
        overflow: hidden;
        transform-origin: 50% 50%;
      }

      .collage-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: 50% 50%;
      }

      /* Editorial tape accent */
      .tape-accent {
        position: absolute;
        top: -14px;
        left: 50px;
        width: 130px;
        height: 32px;
        background: rgba(245, 240, 228, 0.95);
        border: 1.5px solid rgba(20, 20, 20, 0.4);
        transform: rotate(-3deg);
        z-index: 10;
      }

      /* Punch Phrase Overlay */
      .punch-container {
        position: absolute;
        left: 0;
        right: 0;
        top: 1220px;
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
        z-index: 30;
      }

      .punch-badge {
        background-color: #141414;
        border: 4px solid #FF6A1A;
        border-radius: 18px;
        padding: 20px 36px;
        display: inline-flex;
        align-items: center;
        gap: 18px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
        transform-origin: 50% 50%;
      }

      .punch-label {
        font-weight: 900;
        font-size: 64px;
        line-height: 1.1;
        letter-spacing: -1px;
        color: #F7F4EC;
        margin: 0;
      }

      .punch-highlight {
        background-color: #FF6A1A;
        color: #141414;
        font-weight: 900;
        font-size: 64px;
        line-height: 1.1;
        letter-spacing: -1px;
        padding: 6px 20px;
        border-radius: 10px;
        display: inline-block;
      }

      /* Brand bottom signature bar */
      #bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }

      /* Standard safe utility classes */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
      .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
    </style>

    <div
      id="root"
      data-composition-id="scene-s03"
      data-width="1080"
      data-height="1920"
      data-duration="8.46"
    >
      <!-- Shot S03-1: 0s to 8.46s -->
      <section id="shot-s03-1" class="clip" data-start="0" data-duration="8.46">
        <!-- Spotlight Background with Grid -->
        <div class="bg-spotlight"></div>
        <div class="spotlight-vignette"></div>

        <!-- Collage Hero Media Frame -->
        <div class="media-viewport">
          <div id="hero-frame" class="collage-frame">
            <div class="tape-accent"></div>
            <img
              id="hero-img"
              src="assets/img-03-relationship-conflict-rejection-no.jpg"
              alt="Mâu thuẫn tình cảm và sự dứt khoát quay lưng"
            />
          </div>
        </div>
      </section>

      <!-- Punch Phrase Timed Element: from 6.35s to 8.46s (hold 2.11s) -->
      <section id="punch-overlay" class="clip" data-start="6.35" data-duration="2.11">
        <div class="punch-container">
          <div id="punch-badge-node" class="punch-badge">
            <span class="punch-label">QUYỀN</span>
            <span class="punch-highlight">NÓI KHÔNG</span>
          </div>
        </div>
      </section>

      <!-- Fixed Signature Bottom Bar -->
      <div id="bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Scene Entrance: Punch transition for hero frame (0s)
      tl.fromTo(
        "#hero-frame",
        { scale: 0.92, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0
      );

      // 2. Camera Motion: Subtle slow zoom-in from 1.0x to 1.05x throughout shot duration
      tl.fromTo(
        "#hero-img",
        { scale: 1.0 },
        { scale: 1.05, duration: 8.46, ease: "none" },
        0
      );

      // 3. Punch Phrase Reveal: Dynamic punch pop entrance at 6.35s (22790ms relative to scene start)
      tl.fromTo(
        "#punch-badge-node",
        { scale: 0.5, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.45, ease: "power3.out" },
        6.35
      );

      // Register master timeline
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s03"] = tl;
    </script>
  
    </template>
  </body>
</html>
