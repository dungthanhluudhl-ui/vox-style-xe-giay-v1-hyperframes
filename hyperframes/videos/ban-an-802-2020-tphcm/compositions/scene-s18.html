      // Tạo timeline paused duy nhất cho composition "scene-s18"

      // ==========================================
      // KHỞI TẠO TRẠNG THÁI TẤT ĐỊNH (t = 0)
      // ==========================================

      tl.set("#flap-right", { rotation: 35, transformOrigin: "460px 100px" }, 0);
      tl.set("#box-tape", { scaleY: 0, opacity: 0, transformOrigin: "240px 90px" }, 0);
      tl.set("#box-stamp", { scale: 2.0, opacity: 0, rotation: -16 }, 0);

      // ==========================================
      // GIAI ĐOẠN 1: THẢ VẬT CHỨNG & ĐÓNG NẮP THÙNG (0.0s - 3.4s)
      // ==========================================

      // 1. Scene Entrance (Rise Transition)
      tl.fromTo(
        "#scene-s18",
        { y: 36, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.05
      );

      // 2. Thùng hàng xuất hiện vững chãi (Không xung đột CSS transform)
      tl.fromTo(
        "#evidence-box-group",
        { scale: 0.9, opacity: 0, y: 40 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        0.15
      );

      // 3. Vật chứng rơi vào trong thùng carton
      // Dây điện rơi xuống và thu nhỏ lọt vào trong thùng
      tl.to(
        "#wire-item",
        {
          y: 280,
          scale: 0.35,
          opacity: 0,
          rotation: 22,
          duration: 0.65,
          ease: "power2.in",
        },
        0.45
      );

      // Cuộn băng keo rơi tiếp theo sau 0.15s
      tl.to(
        "#tape-item",
        {
          y: 280,
          scale: 0.35,
          opacity: 0,
          rotation: -18,
          duration: 0.65,
          ease: "power2.in",
        },
        0.6
      );

      // 4. Label 1: "PHI TANG HUNG KHÍ" xuất hiện tại t = 1.23s (đúng 148860ms)

        "#label-evidence",
        { y: 24, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        1.23

          duration: 0.45,
          ease: "power3.inOut",
