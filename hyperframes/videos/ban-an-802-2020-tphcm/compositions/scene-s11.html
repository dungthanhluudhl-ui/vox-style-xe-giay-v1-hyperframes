    /* Time range indicator zone in Top Card */

      background-color: rgba(255, 106, 26, 0.08);

  </style>

  <div
    id="root"

  >
    <!-- Background Variant: Chart -->
    <div class="chart-background">

      <div class="chart-rule rule-40"><div class="chart-rule-tick"></div></div>

    <!-- Main Scene Clip -->
    <section id="scene-clip" class="clip" data-start="0" data-duration="7.7">
      <div id="stage-wrapper" class="stage-wrapper">
        
        <!-- Header Zone with Overlay 1 -->
        <header class="header-zone">
          <div id="badge-crucial" class="badge-crucial">CHI TIẾT MẤU CHỐT</div>

        </header>

        <!-- Card 1: Top Stream (Phản ứng tức thì / Bộc phát vài giây) -->
        <div id="card-top" class="comparison-card">
          <div class="card-topbar">
            <div class="card-tag-group">
              <span class="tag-case">DIỄN BIẾN 1</span>
              <span class="tag-nature">PHẢN ỨNG TỨC THÌ</span>
            </div>
            <!-- Overlay 2: BỘC PHÁT: VÀI GIÂY (atMs: 95600 -> 3.19s) -->
            <div id="badge-spontaneous" class="badge-spontaneous">BỘC PHÁT: VÀI GIÂY</div>
          </div>

          <div class="graph-viewport">
            <div id="time-bracket" class="time-bracket-zone"></div>
            
            <svg class="graph-svg" viewBox="0 0 940 300" preserveAspectRatio="none">
              <!-- Horizontal Grid Lines -->
              <line class="grid-line-svg" x1="60" y1="80" x2="880" y2="80" />
              <line class="grid-line-svg" x1="60" y1="150" x2="880" y2="150" />
              
              <!-- Vertical Time Ticks (0s, 1s, 2s, 3s, 4s, 5s) -->
              <line class="grid-line-svg" x1="80" y1="40" x2="80" y2="230" />
              <line class="grid-line-svg" x1="220" y1="40" x2="220" y2="230" />
              <line class="grid-line-svg" x1="360" y1="40" x2="360" y2="230" />

              <line class="grid-line-svg" x1="780" y1="40" x2="780" y2="230" />

              <!-- Baseline Axis -->
              <line id="top-axis" class="axis-baseline-svg" x1="60" y1="225" x2="880" y2="225" />

              <!-- Time Labels -->
              <text class="axis-label top-time-label" x="80" y="262" text-anchor="middle">0s</text>

              <circle id="pulse-ring" cx="305" cy="45" r="14" fill="none" stroke="#FF6A1A" stroke-width="4" />

        <!-- Card 2: Bottom Stream (Chuẩn bị kéo dài / Có toan tính) -->
        <div id="card-bottom" class="comparison-card">
          <div class="card-topbar">

            <div class="tag-nature" style="background-color: #F5F0E4;">TÍNH CHẤT TOAN TÍNH</div>

          <div class="graph-viewport">

              <line class="grid-line-svg" x1="60" y1="80" x2="880" y2="80" />
              <line class="grid-line-svg" x1="60" y1="150" x2="880" y2="150" />

              <line class="grid-line-svg" x1="80" y1="40" x2="80" y2="230" />

              <rect class="cadence-node" x="352" y="112" width="16" height="16" fill="#FF6A1A" transform="rotate(45 360 120)" />

    <!-- Bottom brand bar -->
    <div class="bottom-orange-bar"></div>

  <script>
    // HyperFrames Seek-Safe Animation Architecture
    const tl = gsap.timeline({ paused: true });

    // Setup SVG path length measurements for deterministic seekable stroke draws
    const spikePath = document.querySelector("#spike-surge");
    const spikeLen = spikePath.getTotalLength();
    spikePath.style.strokeDasharray = spikeLen;
    spikePath.style.strokeDashoffset = spikeLen;

    const steadyPath = document.querySelector("#steady-line");
    const steadyLen = steadyPath.getTotalLength();
    steadyPath.style.strokeDasharray = steadyLen;
    steadyPath.style.strokeDashoffset = steadyLen;

    // 0.00s: Scene Flip Entrance (transitionIn: flip)
    tl.fromTo(
      "#stage-wrapper",
      { rotationX: -14, opacity: 0, transformPerspective: 1200 },
      { rotationX: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
      0.0
    );

    // 0.18s: Overlay 1 (CHI TIẾT MẤU CHỐT - atMs: 92590 -> scene-local 0.18s)
    tl.fromTo(
      "#badge-crucial",
      { scale: 0.6, opacity: 0, y: -24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.18
    );

    tl.fromTo(
      "#scene-headline",
      { opacity: 0, x: -35 },
      { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
      0.28
    );

    // 0.55s - 0.75s: The two comparison cards enter sequentially
    tl.fromTo(
      "#card-top",
      { y: 50, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.55
    );

    tl.fromTo(
      "#card-bottom",
      { y: 50, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.75
    );

    // 1.00s: Grid axes and time labels fade in
    tl.fromTo(
      [".axis-baseline-svg", ".grid-line-svg"],
      { opacity: 0 },
      { opacity: 1, duration: 0.45, ease: "power1.out" },
      1.0
    );

    tl.fromTo(
      [".top-time-label", ".btm-time-label"],
      { opacity: 0, y: 8 },
      { opacity: 1, y: 0, duration: 0.35, stagger: 0.04, ease: "power2.out" },
      1.1
    );

    // 1.30s: Bottom continuous steady timeline starts drawing deliberate path across time
    tl.fromTo(
      "#steady-line",
      { strokeDashoffset: steadyLen },
      { strokeDashoffset: 0, duration: 4.8, ease: "none" },
      1.3
    );

    // Cadence nodes appear along the deliberate path
    tl.fromTo(
      ".cadence-node",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, stagger: 0.85, ease: "power3.out" },
      1.6
    );

    tl.fromTo(
      "#callout-steady",
      { opacity: 0, x: 25 },
      { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" },
      2.4
    );

    // 3.19s: Overlay 2 (BỘC PHÁT: VÀI GIÂY - atMs: 95600 -> scene-local 3.19s)
    // Matches script text: "Bởi vì nếu một hành vi xảy ra trong vài giây nóng giận..."
    tl.fromTo(
      "#badge-spontaneous",
      { scale: 0.2, opacity: 0, rotation: -6 },
      { scale: 1, opacity: 1, rotation: 0, duration: 0.42, ease: "power3.out" },
      3.19
    );

    // Sudden lightning / acute spike draws rapidly
    tl.fromTo(
      "#spike-surge",
      { strokeDashoffset: spikeLen },
      { strokeDashoffset: 0, duration: 0.65, ease: "power4.out" },
      3.22
    );

    tl.fromTo(
      "#time-bracket",
      { opacity: 0, scaleY: 0 },
      { opacity: 1, scaleY: 1, transformOrigin: "center bottom", duration: 0.35, ease: "power2.out" },
      3.30
    );

    tl.fromTo(
      "#callout-spike",
      { scale: 0, opacity: 0, y: -10 },
      { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
      3.42
    );

    // Finite pulse animation on the spike peak
    tl.fromTo(
      "#pulse-ring",
      { scale: 0.5, opacity: 0 },
      { scale: 1.6, opacity: 1, duration: 0.32, yoyo: true, repeat: 3, ease: "sine.inOut" },
      3.38
    );

    tl.fromTo(
      "#pulse-center",
      { scale: 0 },
      { scale: 1, duration: 0.25, ease: "power2.out" },
      3.38
    );

    // 5.6s - 7.6s: Subtle non-freezing ambient tension between the two concepts (finite, seek-safe)
    tl.to(
      "#card-top",
      { y: -3, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 1 },
      5.6
    );

    tl.to(
      "#card-bottom",
      { y: 3, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 1 },
      5.7
    );

    // Register paused timeline to window.__timelines
    window.__timelines["scene-s11"] = tl;
  </script>
