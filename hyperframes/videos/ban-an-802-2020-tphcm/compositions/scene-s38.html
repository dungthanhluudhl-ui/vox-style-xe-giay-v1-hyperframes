    <script>
      const tl = gsap.timeline({ paused: true });

      // Pre-measure SVG connectors
      const paths = document.querySelectorAll(".connect-path");
      paths.forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
      });

      // 1. Initial State: Unfold entrance (0.0s -> 0.8s)
      tl.fromTo(
        "#meta-header",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.05
      );

      tl.fromTo(
        "#person-shadow",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.1
      );

      tl.fromTo(
        "#person-silhouette",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.15
      );

      tl.fromTo(
        "#radar-ring-outer",
        { scale: 0.5, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 0.35, duration: 0.7, ease: "power2.out" },
        0.2
      );

      tl.fromTo(
        "#radar-ring-inner",
        { scale: 0.5, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 0.25, duration: 0.7, ease: "power2.out" },
        0.25
      );

      // 2. Overlay 1: BUỒN • TIẾC • GHEN (atMs 302260 = 0.86s relative)
      tl.fromTo(
        "#label-pill",
        { scale: 0.75, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.86
      );

      // 4 Emotion Cards arrival staggered
      const cards = ["#card-buon", "#card-tiec", "#card-ghen", "#card-nghi"];
      const pathIds = ["#path-buon", "#path-tiec", "#path-ghen", "#path-nghi"];

      cards.forEach((cardId, i) => {
        const tArrival = 1.05 + i * 0.16;
        const pElem = document.querySelector(pathIds[i]);
        const pLen = pElem.getTotalLength();

        tl.fromTo(
          pathIds[i],
          { strokeDashoffset: pLen },
          { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
          tArrival - 0.08
        );

        tl.fromTo(
          cardId,
          { scale: 0, opacity: 0, y: 24 },
          { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          tArrival
        );
      });

      // Subtle ambient float (2.2s -> 4.8s) - finite repeat
      tl.to(
        ".emotion-card",
        {
          y: -8,
          duration: 1.1,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 1,
          stagger: 0.08,
        },
        2.2
      );

      // 3. Legal Boundary arrives (5.2s)
      tl.fromTo(
        "#legal-barrier",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
        5.2
      );

      tl.fromTo(
        "#barrier-label",
        { y: 15, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
        5.55
      );

      // 4. Overlay 2: Icon "ban" (atMs 308140 = 6.74s relative)
      tl.fromTo(
        "#ban-badge",
        { scale: 0, opacity: 0, rotation: -45 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: "power3.out" },
        6.74
      );

      // 5. Overlay 3: Punch-phrase "KHÔNG CÓ QUYỀN SỞ HỮU" (atMs 308390 = 6.99s relative)
      tl.fromTo(
        "#punch-plate",
        { scale: 0.85, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power4.out" },
        6.99
      );

      // Register the paused timeline with HyperFrames
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s38"] = tl;
    </script>
