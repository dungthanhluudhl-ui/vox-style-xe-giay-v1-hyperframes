    <!-- GSAP Master Timeline Script -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // Thiết lập trạng thái đo đạc SVG tĩnh
      const ecgPath = document.getElementById("ecg-line");
      const ecgLength = ecgPath.getTotalLength();
      ecgPath.style.strokeDasharray = ecgLength;
      ecgPath.style.strokeDashoffset = ecgLength;

      // Setup khởi tạo các phần tử (fromTo explicit tránh desync seek)
      gsap.set("#peel-anim", { scale: 1, opacity: 1 });
      gsap.set("#stamp-not-stop", { scale: 0, opacity: 0, rotation: -8 });
      gsap.set("#hand-l", { x: -340, opacity: 0 });
      gsap.set("#hand-r", { x: 340, opacity: 0 });
      gsap.set("#punch-card", { y: 60, opacity: 0 });
      gsap.set("#impact-wave", { scale: 0.5, opacity: 0 });
      gsap.set("#ecg-pointer", { cx: 0, cy: 70 });
      gsap.set("#ecg-status-1", { opacity: 1 });
      gsap.set("#ecg-status-2", { opacity: 0 });

      // --- TIMELINE CHOREOGRAPHY ---

      // Phase 0: Chuyển cảnh Peel (0.0s - 0.5s)
      tl.to("#peel-anim", {
        scale: 0,
        opacity: 0,
        duration: 0.5,
        ease: "power2.inOut",
      }, 0);

      // Phase 1: Buông dây (0.0s - 1.8s)
      // "Sau đó Thành buông dây ra..."
      tl.to("#rope-loop", {
        scale: 1.15,
        transformOrigin: "center center",
        duration: 1.2,
        ease: "power2.out",
      }, 0.3);
      tl.to("#rope-knot", {
        y: 35,
        duration: 1.2,
        ease: "power2.out",
      }, 0.3);
      tl.to("#rope-strands", {
        y: 35,
        duration: 1.2,
        ease: "power2.out",
      }, 0.3);
      tl.to("#rope-graphic", {
        y: 60,
        opacity: 0.45,
        duration: 1.3,
        ease: "power2.inOut",
      }, 0.5);

      // Quét nhịp tim ban đầu (0.0s -> 1.99s): Đi qua đoạn có mạch
      tl.to(ecgPath, {
        strokeDashoffset: ecgLength * 0.72,
        duration: 1.99,
        ease: "none",
      }, 0);
      tl.to("#ecg-pointer", {
        cx: 255,
        cy: 70,
        duration: 1.99,
        ease: "none",
      }, 0);

      // Phase 2: Đột biến - KHÔNG DỪNG LẠI (atMs: 142080 -> 1.99s)
      // "Nhưng mà không phải để dừng lại..."
      tl.addLabel("reversal", 1.99);

      // Đổi trạng thái header sang bước 2 (màu đặc đạt chuẩn WCAG)
      tl.to("#chip-step1", {
        backgroundColor: "#262626",
        color: "#f7f4ec",
        duration: 0.25,
      }, "reversal");
      tl.to("#chip-step2", {
        backgroundColor: "#ff6a1a",
        color: "#141414",
        duration: 0.25,
      }, "reversal");

      // Đóng dấu stamp "KHÔNG DỪNG LẠI"
      tl.fromTo(
        "#stamp-not-stop",
        { scale: 2.2, opacity: 0, rotation: -12 },
        {
          scale: 1,
          opacity: 1,
          rotation: -3,
          duration: 0.35,
          ease: "power4.out",
        },
        "reversal"
      );

      // Hai bàn tay lập tức ập vào siết chặt vùng cổ (1.99s - 2.5s)
      // "Anh ta tiếp tục dùng hai tay bóp cổ..."
      tl.fromTo(
        "#hand-l",
        { x: -340, opacity: 0 },
        { x: 30, opacity: 1, duration: 0.45, ease: "power3.out" },
        "reversal+=0.1"
      );
      tl.fromTo(
        "#hand-r",
        { x: 340, opacity: 0 },
        { x: -30, opacity: 1, duration: 0.45, ease: "power3.out" },
        "reversal+=0.1"
      );

      // Vòng dây bị nén ép hoàn toàn
      tl.to("#rope-graphic", {
        opacity: 0.15,
        scale: 0.9,
        duration: 0.4,
      }, "reversal+=0.15");

      // Xung lực va chạm khi hai bàn tay siết vào
      tl.fromTo(
        "#impact-wave",
        { scale: 0.6, opacity: 1 },
        { scale: 1.8, opacity: 0, duration: 0.5, ease: "power2.out" },
