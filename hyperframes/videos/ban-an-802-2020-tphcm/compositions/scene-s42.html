      const tl = gsap.timeline({ paused: true });

      // Scene entrance: Collage frame rises smoothly into place

        "#collage-card",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.05,
      );

      // Horizon sun reveal
      tl.fromTo(
        "#sun-horizon",
        { scale: 0.7, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.75, ease: "power2.out" },
        0.25,
      );

      // Figure entrances (opposite emotional weights)
      tl.fromTo(
        "#figure-man",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.35,
      );

      tl.fromTo(
        "#figure-woman",
        { x: -35, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
        0.35,
      );

      // Overlay 1: "HẬU QUẢ LỚN NHẤT" spring-pop entrance
      tl.fromTo(
        "#overlay-label-card",
        { scale: 0.82, opacity: 0, y: -24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
        0.54,
      );

      // Torn paper fragments drift across the split seam (1.1s - 2.8s)
      const fragments = ["#frag-1", "#frag-2", "#frag-3", "#frag-4", "#frag-5", "#frag-6"];
      fragments.forEach((fragId, idx) => {
        const startTime = 1.1 + idx * 0.18;
        tl.fromTo(
          fragId,
          { x: 0, y: 0, opacity: 0, scale: 0.5 },
          {
            x: 20 + idx * 6,
            y: -15 - idx * 8,
            opacity: 1,
            scale: 1,
            duration: 0.6,
            ease: "power2.out",
          },
          startTime,
        );
      });

      // Overlay 1 exit (holdMs: 2200 fulfilled)
      tl.to(
        "#overlay-label-card",
        { opacity: 0, y: -16, duration: 0.35, ease: "power2.in" },
        3.35,
      );

      // Ambient continuous movement: woman strides forward, sun breathes, man sinks slightly
      tl.to("#figure-woman", { x: 24, duration: 2.8, ease: "sine.inOut" }, 3.6);
      tl.to("#figure-man", { y: 5, duration: 2.4, ease: "sine.inOut" }, 3.8);
      tl.to("#sun-horizon", { scale: 1.06, duration: 2.8, ease: "sine.inOut" }, 3.6);

      // Overlay 2: "CHẤP NHẬN BUÔNG TAY" arrives with heavy punch

        { scale: 0.86, opacity: 0, y: 32 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        6.68,

      // Accent line snap under punch phrase

        "#punch-accent-bar",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "expo.out" },
        6.98,
      );

      // Register master timeline
