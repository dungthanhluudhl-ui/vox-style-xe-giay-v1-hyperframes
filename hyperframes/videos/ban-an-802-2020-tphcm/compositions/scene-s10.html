/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
      color: #141414;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
      background-image: 
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }

    /* Standard .clip container */
    .clip {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Signature bottom brand bar */
    .brand-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 16px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Main photographic hero frame */
    .photo-frame-wrapper {
      position: absolute;
      top: 220px;
      left: 50px;
      width: 980px;
      height: 1140px;
      border: 3px solid #141414;
      border-radius: 14px;
      overflow: hidden;
      background-color: #141414;
      box-shadow: 0 20px 48px rgba(20, 20, 20, 0.3);
      will-change: transform, opacity;
    }

    .hero-photo {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      min-width: 120%;
      object-fit: cover;
      will-change: transform;
    }

    /* Tape accent on top-right of the collage photo */
    .collage-tape {
      position: absolute;
      top: -12px;
      right: 32px;
      width: 110px;
      height: 32px;
      background-color: #FF6A1A;
      transform: rotate(3deg);
      z-index: 5;
      box-shadow: 0 4px 10px rgba(20, 20, 20, 0.2);
    }

    /* Safe Plate & Badge System */
    .hf-plate-ink {
      background-color: #141414;
      color: #F7F4EC;
    }

    .hf-hl-orange {
      background-color: #FF6A1A;
      color: #141414;
    }

    /* Overlay 1: Status badge (Office crowded) */
    .overlay-center-row {
      position: absolute;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    .badge-office-crowded {
      top: 270px;
    }

    .badge-card {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      padding: 18px 36px;
      background-color: #141414;
      border: 2px solid #FF6A1A;
      border-radius: 12px;
      box-shadow: 0 16px 36px rgba(20, 20, 20, 0.45);
      will-change: transform, opacity;
    }

    .badge-indicator {
      width: 14px;
      height: 14px;
      background-color: #FF6A1A;
      border-radius: 50%;
      box-shadow: 0 0 12px #FF6A1A;
    }

    .badge-text {
      font-size: 38px;
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #F7F4EC;
    }

    /* Overlay 2: Clock widget */
    .clock-container {
      top: 250px;
    }

    .clock-widget {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background-color: #141414;
      border: 4px solid #FF6A1A;
      box-shadow: 0 18px 40px rgba(20, 20, 20, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      will-change: transform, opacity;
    }

    .clock-svg {
      width: 140px;
      height: 140px;
    }

    /* Overlay 3: 12:00 Trưa - Chờ đợi */
    .noon-label-container {
      top: 470px;
    }

    .noon-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 36px;
      background-color: #141414;
      border: 2px solid #FF6A1A;
      border-radius: 12px;
      box-shadow: 0 16px 36px rgba(20, 20, 20, 0.45);
      will-change: transform, opacity;
    }

    .noon-time {
      font-size: 40px;
      font-weight: 900;
      color: #FF6A1A;
    }

    .noon-sep {
      font-size: 38px;
      font-weight: 900;
      color: #F7F4EC;
    }

    .noon-state {
      font-size: 40px;
      font-weight: 900;
      color: #F7F4EC;
      text-transform: uppercase;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s10"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="10.56"
  >
    <!-- Base Shot 1: Man watching office from sidewalk iced tea stall -->
    <div id="shot-1" class="clip" data-start="0" data-duration="10.56">
      <div id="photo-frame" class="photo-frame-wrapper">
        <div class="collage-tape"></div>
        <img
          id="hero-img"
          class="hero-photo"
          src="assets/img-05-man-iced-tea-office-watch.jpg"
          alt="Người đàn ông ngồi quán nước theo dõi tòa nhà văn phòng"
        >
      </div>
    </div>

    <!-- Overlay 1: "VĂN PHÒNG ĐÔNG NGƯỜI" (atMs: 83040 -> 1.19s, holdMs: 2200 -> 2.2s) -->
    <div id="clip-overlay-1" class="clip" data-start="1.19" data-duration="2.2">
      <div class="overlay-center-row badge-office-crowded">
        <div id="badge-office" class="badge-card">
          <div class="badge-indicator"></div>
          <span class="badge-text">VĂN PHÒNG ĐÔNG NGƯỜI</span>
        </div>
      </div>
    </div>

    <!-- Overlay 2: Clock Icon Animation (atMs: 88220 -> 6.37s, holdMs: 2000 -> 2.0s) -->
    <div id="clip-overlay-2" class="clip" data-start="6.37" data-duration="2.0">
      <div class="overlay-center-row clock-container">
        <div id="clock-widget" class="clock-widget">
          <svg class="clock-svg" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
            <!-- Dark dial -->
            <circle cx="70" cy="70" r="64" fill="#141414" stroke="#F7F4EC" stroke-width="2.5" />
            <!-- Cardinal ticks -->
            <line x1="70" y1="14" x2="70" y2="24" stroke="#F7F4EC" stroke-width="4" stroke-linecap="round" />
            <line x1="126" y1="70" x2="116" y2="70" stroke="#F7F4EC" stroke-width="4" stroke-linecap="round" />
            <line x1="70" y1="126" x2="70" y2="116" stroke="#F7F4EC" stroke-width="4" stroke-linecap="round" />
            <line x1="14" y1="70" x2="24" y2="70" stroke="#F7F4EC" stroke-width="4" stroke-linecap="round" />
            <!-- Intermediate ticks -->
            <line x1="98" y1="21.5" x2="93" y2="30.2" stroke="#F7F4EC" stroke-width="2.5" stroke-linecap="round" />
            <line x1="118.5" y1="42" x2="109.8" y2="47" stroke="#F7F4EC" stroke-width="2.5" stroke-linecap="round" />
            <line x1="118.5" y1="98" x2="109.8" y2="93" stroke="#F7F4EC" stroke-width="2.5" stroke-linecap="round" />
            <line x1="98" y1="118.5" x2="93" y2="109.8" stroke="#F7F4EC" stroke-width="2.5" stroke-linecap="round" />
            <line x1="42" y1="118.5" x2="47" y2="109.8" stroke="#F7F4EC" stroke-width="2.5" stroke-linecap="round" />
            <line x1="21.5" y1="98" x2="30.2" y2="93" stroke="#F7F4EC" stroke-width="2.5" stroke-linecap="round" />
            <line x1="21.5" y1="42" x2="30.2" y2="47" stroke="#F7F4EC" stroke-width="2.5" stroke-linecap="round" />

      </div>

    <!-- Overlay 3: "12:00 TRƯA - CHỜ ĐỢI" (atMs: 88600 -> 6.75s, holdMs: 2500 -> 2.5s) -->
    <div id="clip-overlay-3" class="clip" data-start="6.75" data-duration="2.5">
      <div class="overlay-center-row noon-label-container">
        <div id="badge-noon" class="noon-badge">
          <span class="noon-time">12:00 TRƯA</span>
          <span class="noon-sep">-</span>
          <span class="noon-state">CHỜ ĐỢI</span>

    <!-- Fixed brand signature bar -->
    <div class="brand-bottom-bar"></div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. Photo frame entrance (Rise) and slow cinematic pan-right
    tl.fromTo(
      "#photo-frame",
      { y: 70, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
      0.1
    );

    tl.fromTo(
      "#hero-img",
      { x: 0 },
      { x: -90, duration: 10.4, ease: "none" },
      0.1
    );

    // 2. Overlay 1: "VĂN PHÒNG ĐÔNG NGƯỜI" (1.19s -> 3.39s)
    tl.fromTo(
      "#badge-office",
      { scale: 0.85, opacity: 0, y: -24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      1.19
    );

    tl.to(
      "#badge-office",
      { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" },
      3.14
    );

    // 3. Overlay 2: Clock widget entrance & fast spin to 12:00 (6.37s -> 8.37s)
    gsap.set("#hour-hand", { transformOrigin: "70px 70px" });
    gsap.set("#minute-hand", { transformOrigin: "70px 70px" });

    tl.fromTo(
      "#clock-widget",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      6.37
    );

    // Minute hand fast spins from 9:30 (180 deg) past full revolutions to 12:00 (720 deg)
    tl.fromTo(
      "#minute-hand",
      { rotation: 180 },
      { rotation: 720, duration: 1.35, ease: "power2.inOut" },
      6.45
    );

    // Hour hand moves from 9:30 (285 deg) to 12:00 (360 deg)
    tl.fromTo(
      "#hour-hand",
      { rotation: 285 },
      { rotation: 360, duration: 1.35, ease: "power2.inOut" },
      6.45
    );

    tl.to(
      "#clock-widget",
      { opacity: 0, scale: 0.88, duration: 0.25, ease: "power2.in" },
      8.12
    );

    // 4. Overlay 3: "12:00 TRƯA - CHỜ ĐỢI" (6.75s -> 9.25s)
    tl.fromTo(
      "#badge-noon",
      { scale: 0.85, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      6.75
    );

    tl.to(
      "#badge-noon",
      { opacity: 0, y: 16, duration: 0.25, ease: "power2.in" },
      9.0
    );

    // Register paused timeline on main composition
    window.__timelines["scene-s10"] = tl;
  </script>
