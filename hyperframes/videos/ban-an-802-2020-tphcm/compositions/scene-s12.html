    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Khởi tạo stroke-dasharray & offset thực tế cho tất cả SVG checkmark
      document.querySelectorAll(".check-path").forEach((p) => {
        const len = p.getTotalLength ? p.getTotalLength() : 25;
        p.style.strokeDasharray = `${len}`;
        p.style.strokeDashoffset = `${len}`;
      });

      // 0.05s - 0.45s: Entrance unfold header & checklist container
      tl.fromTo(
        "#header-block",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.05
      );
      tl.fromTo(
        "#checklist-container",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power2.out" },
        0.15
      );

      // 0.54s (atMs: 100650): Mục 1 - "1. CHUẨN BỊ DÂY"
      tl.fromTo(
        "#item-card-1",
        { x: -40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.38, ease: "power3.out" },
        0.54
      );
      tl.to(
        "#checkbox-1",
        { backgroundColor: "#FF6A1A", duration: 0.22, ease: "power2.out" },
        0.66
      );
      tl.to(
        "#check-path-1",
        { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
        0.72
      );

      // 2.63s (atMs: 102740): Mục 2 - "2. CHUẨN BỊ BĂNG KEO"

        "#rail-progress",
        { height: 190, duration: 0.35, ease: "power2.out" },
        2.42
      );
      tl.fromTo(
        "#item-card-2",
        { x: -40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.38, ease: "power3.out" },
        2.63
      );
      tl.to(
        "#checkbox-2",
        { backgroundColor: "#FF6A1A", duration: 0.22, ease: "power2.out" },
        2.75
      );
      tl.to(
        "#check-path-2",
        { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
        2.81
      );

      // 5.33s (atMs: 105440): Mục 3 - "3. TỚI NƠI LÀM VIỆC"
      tl.to(
        "#rail-progress",
        { height: 380, duration: 0.35, ease: "power2.out" },
        5.12
      );
      tl.fromTo(
        "#item-card-3",
        { x: -40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.38, ease: "power3.out" },
        5.33
      );
      tl.to(
        "#checkbox-3",
        { backgroundColor: "#FF6A1A", duration: 0.22, ease: "power2.out" },
        5.45
      );
      tl.to(
        "#check-path-3",
        { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
        5.51
      );

      // 8.75s (atMs: 108860): Mục 4 - "4. CHỜ VẮNG NGƯỜI"
      tl.to(
        "#rail-progress",
        { height: 570, duration: 0.35, ease: "power2.out" },
        8.52
      );
      tl.fromTo(
        "#item-card-4",
        { x: -40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.38, ease: "power3.out" },
        8.75
      );
      tl.to(
        "#checkbox-4",
        { backgroundColor: "#FF6A1A", duration: 0.22, ease: "power2.out" },
        8.87
      );
      tl.to(

        8.93
      );

      // Đăng ký timeline chính thức cho HyperFrames render
      window.__timelines["scene-s12"] = tl;
