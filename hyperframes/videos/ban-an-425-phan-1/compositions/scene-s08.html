      path.style.strokeDasharray = len + "px";
      path.style.strokeDashoffset = len + "px";

    // Create paused master timeline for HyperFrames
    const tl = gsap.timeline({ paused: true });

      0
    );

    // 0.1s: 3D Flip entrance of the hero photo card

      "#photo-card",
      { rotationY: -80, opacity: 0, scale: 0.92 },
      { rotationY: 0, opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" },
      0.1
    );

    // 0.35s: Header context badge slides down
    tl.fromTo(
      "#header-badge",
      { y: -30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
      0.35
    );

    // 3.19s: Overlay 1 - "GIÁO VIÊN HỢP ĐỒNG" appears (atMs: 57730 -> 3.19s)

      "#stage-contract",
      { y: 30, opacity: 0, scale: 0.9 },
      { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" },
      3.19
    );

    // 4.8s: Flow Indicator Arrow appears
    tl.fromTo(
      "#flow-indicator",
      { x: -15, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
      4.8
    );

    // 6.46s: Overlay 2 - Doc icon & exam card appears (atMs: 61000 -> 6.46s)
    tl.fromTo(
      "#doc-icon-badge",
      { y: 30, opacity: 0, scale: 0.9 },
      { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
      6.46
    );

    // SVG Doc drawing paths
    tl.to("#doc-path-1", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 6.55);
    tl.to("#doc-path-2", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 6.75);
    tl.to("#doc-path-3", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 6.95);

    // 7.21s: Overlay 3 - Punch-phrase "SÁT HẠCH VIÊN CHỨC" (atMs: 61750 -> 7.21s)
    tl.fromTo(
      "#punch-phrase-card",
      { y: 35, opacity: 0, scale: 0.95 },
      { y: 0, opacity: 1, scale: 1, duration: 0.65, ease: "power3.out" },
      7.21
    );

    // 7.45s: Punch tag settles smoothly
    tl.fromTo(
      ".punch-tag",
      { scale: 0.85, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      7.45
    );

    // Register paused timeline on window.__timelines
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s08"] = tl;
  </script>
