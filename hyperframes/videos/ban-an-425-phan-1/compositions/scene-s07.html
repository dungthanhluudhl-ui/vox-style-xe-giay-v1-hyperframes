      // 1. Measure and initialize SVG path draw for clock
      const rim = document.getElementById("clock-rim");

        "#video-wrapper",
        { scale: 1.2, x: 25 },
        { scale: 1.07, x: 8, duration: 1.2, ease: "power3.out" },
        0
      );

      // Camera motion Phase 2: Steady Ken Burns pan-right during video playback (1.2s -> 7.8s)
      tl.to(
        "#video-wrapper",
        { scale: 1.1, x: -18, duration: 6.6, ease: "sine.inOut" },
        1.2
      );

      // Camera motion Phase 3: 3.74s freeze-frame phase with slow Ken Burns pan-right (7.8s -> 11.54s)

        "#video-wrapper",
        { scale: 1.14, x: -38, duration: 3.74, ease: "sine.out" },
        7.8
      );

      // Overlay 1: Clock card arrival & self-drawing path (starts at 0.75s)

        "#clock-card",
        { scale: 0.85, opacity: 0, y: 16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.75

      tl.to(

        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        0.85
      );
      tl.to(
        "#clock-hour",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        1.15
      );
      tl.to(
        "#clock-minute",
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        1.25

      tl.to(

        { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" },
