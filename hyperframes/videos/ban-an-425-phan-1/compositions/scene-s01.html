<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #e7e3d9;
        font-family: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #141414;
      }

      /* Video layer without data-start */
      #video-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
        transform-origin: 50% 50%;
        will-change: transform;
        z-index: 1;
      }

      #vid-s01 {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Strike impact overlay */
      #impact-flash {
        position: absolute;
        inset: 0;
        background-color: #ff6a1a;
        opacity: 0;
        pointer-events: none;
        mix-blend-mode: overlay;
        z-index: 3;
      }

      /* Spotlight vignette */
      #spotlight-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 48%, transparent 40%, rgba(20, 20, 20, 0.72) 100%);
        pointer-events: none;
        z-index: 5;
      }

      /* Signature bottom orange bar */
      #bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 99;
        pointer-events: none;
      }

      /* HyperFrames timed clip standard */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Overlay 1: Scale Icon Badge */
      .scale-badge-wrapper {
        position: absolute;
        top: 220px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .scale-badge {
        background-color: #141414;
        border: 3px solid #ff6a1a;
        box-shadow: 6px 6px 0px #ff6a1a;
        border-radius: 6px;
        padding: 16px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .scale-stem,
      #scale-beam,
      .scale-cords {
        stroke: #ff6a1a;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .scale-pan {
        fill: #ff6a1a;
        stroke: #ff6a1a;
        stroke-width: 2;
        transform-origin: 50% 0%;
      }

      #scale-group {
        transform-origin: 80px 56px;
      }

      .scale-label {
        font-size: 20px;
        font-weight: 900;
        color: #f7f4ec;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-top: 4px;
      }

      /* Overlay 2: Dossier Stamp */
      .label-wrapper {
        position: absolute;
        top: 460px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .case-label-plate {
        background-color: #ff6a1a;
        border: 4px solid #141414;
        box-shadow: 6px 6px 0px #141414;
        padding: 12px 32px;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .case-stamp-tag {
        color: #141414;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 3px;
        text-transform: uppercase;
        line-height: 1.2;
      }

      /* Overlay 3: Punch Phrase Card */
      .punch-wrapper {
        position: absolute;
        top: 360px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0 40px;
      }

      .punch-card {
        background-color: #141414;
        border: 4px solid #ff6a1a;
        box-shadow: 10px 10px 0px #ff6a1a;
        padding: 30px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        transform-origin: 50% 50%;
        max-width: 860px;
        width: 100%;
        will-change: transform, opacity;
      }

      .punch-kicker-row {
        display: flex;
        justify-content: center;
        margin-bottom: 16px;
      }

      .punch-kicker {
        background-color: #ff6a1a;
        color: #141414;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 2px;
        padding: 6px 18px;
        text-transform: uppercase;
      }

      .punch-title {
        margin: 0;
        font-size: 72px;
        font-weight: 900;
        color: #f7f4ec;
        line-height: 1.18;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .punch-rule {
        width: 100%;
        height: 6px;
        background-color: #ff6a1a;
        margin-top: 20px;
        transform-origin: 0% 50%;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s01"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7"
    >
      <!-- Background Video Layer (wrapper without data-start) -->
      <div id="video-wrapper">
        <video
          id="vid-s01"
          src="assets/vid-06-court-gavel-bribery-verdict.mp4"
          data-start="0"
          data-duration="7"
          data-media-start="0.5"
          muted
          playsinline
        ></video>
      </div>

      <!-- Impact Flash for Strike Entrance -->
      <div id="impact-flash"></div>

      <!-- Spotlight Atmosphere Vignette -->
      <div id="spotlight-overlay"></div>

      <!-- Timed Overlay 1: Scale Icon (atMs: 600, holdMs: 2500 -> 0.6s to 3.1s) -->
      <div id="clip-icon-scale" class="clip" data-start="0.6" data-duration="2.5" style="z-index: 20;">
        <div class="scale-badge-wrapper">
          <div id="scale-badge" class="scale-badge">
            <svg id="scale-svg" viewBox="0 0 160 160" width="120" height="120">
              <!-- Pillar & Base -->
              <path class="scale-stem" d="M 80 32 L 80 128 M 50 128 L 110 128" />
              <!-- Rotatable Beam & Pans -->
              <g id="scale-group">
                <path id="scale-beam" d="M 30 56 L 130 56" />
                <!-- Left Pan -->
                <path class="scale-cords" d="M 30 56 L 16 92 M 30 56 L 44 92" />
                <path class="scale-pan" d="M 10 92 Q 30 110 50 92 Z" />
                <!-- Right Pan -->
                <path class="scale-cords" d="M 130 56 L 116 92 M 130 56 L 144 92" />
                <path class="scale-pan" d="M 110 92 Q 130 110 150 92 Z" />
              </g>
            </svg>
            <div class="scale-label">CÔNG LÝ &amp; PHÁP LUẬT</div>
          </div>
        </div>
      </div>

      <!-- Timed Overlay 2: Dossier Label (atMs: 1670, holdMs: 1800 -> 1.67s to 3.47s) -->
      <div id="clip-label" class="clip" data-start="1.67" data-duration="1.8" style="z-index: 21;">
        <div class="label-wrapper">
          <div id="label-badge" class="case-label-plate">
            <div class="case-stamp-tag">HỒ SƠ VỤ ÁN</div>
          </div>
        </div>
      </div>

      <!-- Timed Overlay 3: Punch Phrase (atMs: 3670, holdMs: 2500 -> 3.67s to 7.0s) -->
      <div id="clip-punch" class="clip" data-start="3.67" data-duration="3.33" style="z-index: 22;">
        <div class="punch-wrapper">
          <div id="punch-card" class="punch-card">
            <div class="punch-kicker-row">
              <span class="punch-kicker">ĐẠI ÁN GIAN LẬN</span>
            </div>
            <h1 class="punch-title">VỤ ÁN BI HÀI</h1>
            <div id="punch-underline" class="punch-rule"></div>
          </div>
        </div>
      </div>

      <!-- Fixed Signature Bottom Orange Bar -->
      <div id="bottom-bar"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Strike Entrance & Ken Burns camera motion on video wrapper
      tl.fromTo(
        "#video-wrapper",
        { scale: 1.14, y: -30 },
        { scale: 1.0, y: 0, duration: 0.35, ease: "power4.out" },
        0
      );
      tl.fromTo(
        "#impact-flash",
        { opacity: 0.7 },
        { opacity: 0, duration: 0.32, ease: "power2.out" },
        0
      );
      tl.to(
        "#video-wrapper",
        { scale: 1.075, duration: 6.65, ease: "none" },
        0.35
      );

      // 2. Overlay 1: Scale Icon (clip active: 0.6s -> 3.1s)
      tl.fromTo(
        "#scale-badge",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.65
      );

      // SVG path drawing for scale beam
      const beamPath = document.getElementById("scale-beam");
      if (beamPath) {
        const beamLen = beamPath.getTotalLength ? beamPath.getTotalLength() : 100;
        beamPath.style.strokeDasharray = beamLen;
        beamPath.style.strokeDashoffset = beamLen;
        tl.fromTo(
          "#scale-beam",
          { strokeDashoffset: beamLen },
          { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
          0.75
        );
      }

      // Dynamic tilt on balance pans
      tl.fromTo(
        "#scale-group",
        { rotation: 0 },
        { rotation: -5, duration: 0.6, ease: "sine.inOut" },
        1.1
      );
      tl.to(
        "#scale-group",
        { rotation: 4, duration: 0.65, ease: "sine.inOut" },
        1.7
      );
      tl.to(
        "#scale-group",
        { rotation: 0, duration: 0.4, ease: "sine.out" },
        2.35
      );

      // Smooth exit before clip ends at 3.1s
      tl.to(
        "#scale-badge",
        { opacity: 0, scale: 0.9, duration: 0.22, ease: "power2.in" },
        2.85
      );

      // 3. Overlay 2: Dossier Stamp (clip active: 1.67s -> 3.47s)
      tl.fromTo(
        "#label-badge",
        { scale: 1.4, opacity: 0, rotation: -4 },
        { scale: 1.0, opacity: 1, rotation: -1.5, duration: 0.35, ease: "power3.out" },
        1.72
      );
      tl.to(
        "#label-badge",
        { opacity: 0, y: -16, duration: 0.22, ease: "power2.in" },
        3.22
      );

      // 4. Overlay 3: Punch Phrase (clip active: 3.67s -> 7.0s)
      tl.fromTo(
        "#punch-card",
        { scale: 0.86, opacity: 0, y: 35 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        3.72
      );
      tl.fromTo(
        "#punch-underline",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "power2.out" },
        4.05
      );

      // Register timeline deterministically
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s01"] = tl;
    </script>
  
    </template>
  </body>
</html>
