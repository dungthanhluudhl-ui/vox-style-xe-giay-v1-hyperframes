<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    .clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /* --- CHART BACKGROUND VARIANT (CHỈ ĐƯỜNG KẺ VÀ TICK, KHÔNG TEXT GÂY OCCLUSION/COLLISION) --- */
    .chart-background {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .chart-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: rgba(20, 20, 20, 0.24);
      display: flex;
      align-items: center;
    }

    .chart-tick {
      width: 26px;
      height: 6px;
      background-color: #FF6A1A;
    }

    /* --- HERO PHOTO CARD (PEEL ENTRANCE) --- */
    .hero-card-anchor {
      position: absolute;
      top: 210px;
      left: 110px;
      width: 860px;
      height: 720px;
      transform-origin: 5% 5%;
      will-change: transform, opacity;
      z-index: 10;
    }

    .hero-card-frame {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #F5F0E4;
      border: 5px solid #141414;
      box-shadow: 12px 12px 0px #141414;
      overflow: hidden;
    }

    .hero-img-viewport {
      position: absolute;
      inset: 14px;
      overflow: hidden;
      background-color: #141414;
    }

    .hero-img {
      position: absolute;
      top: -5%;
      left: -5%;
      width: 110%;
      height: 110%;
      object-fit: cover;
      will-change: transform;
    }

    /* Chi tiết sticker băng dính giấy cam */
    .corner-tape {
      position: absolute;
      top: -12px;
      right: 36px;
      width: 115px;
      height: 36px;
      background-color: #FF6A1A;
      border: 2px solid #141414;
      transform: rotate(5deg);
      z-index: 12;
    }

    .hero-badge-tag {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background-color: #141414;
      color: #F7F4EC;
      padding: 8px 20px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      border-left: 6px solid #FF6A1A;
      z-index: 12;
    }

    /* --- OVERLAY: MONEY BADGE --- */
    .money-badge {
      position: absolute;
      top: 175px;
      right: 75px;
      background-color: #FF6A1A;
      border: 4px solid #141414;
      box-shadow: 8px 8px 0px #141414;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 20;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    .money-icon-svg {
      width: 40px;
      height: 40px;
      display: block;
    }

    .money-badge-text {
      color: #141414;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    /* --- OVERLAY: DIAGRAM VECTOR & LABEL (950px -> 1080px) --- */
    .diagram-layer {
      position: absolute;
      top: 950px;
      left: 90px;
      z-index: 25;
    }

    .diagram-svg {
      position: absolute;
      top: -65px;
      left: 120px;
      width: 260px;
      height: 120px;
      overflow: visible;
      pointer-events: none;
    }

    .diagram-plate {
      position: relative;
      background-color: #141414;
      border: 4px solid #141414;
      box-shadow: 8px 8px 0px #FF6A1A;
      padding: 16px 26px;
      display: inline-block;
      will-change: transform, opacity;
    }

    .diagram-sub {
      color: #FF6A1A;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .diagram-title {
      color: #F7F4EC;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1.2;
    }

    /* --- OVERLAY: PUNCH PHRASE (1180px -> 1340px, cách caption band hơn 180px) --- */
    .punch-wrapper {
      position: absolute;
      left: 90px;
      top: 1180px;
      width: 900px;
      z-index: 30;
      will-change: transform, opacity;
    }

    .punch-plate {
      background-color: #141414;
      border: 5px solid #141414;
      border-left: 14px solid #FF6A1A;
      box-shadow: 12px 12px 0px rgba(20, 20, 20, 0.35);
      padding: 22px 34px;
    }

    .punch-eyebrow {
      color: #FF6A1A;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .punch-text {
      color: #F7F4EC;
      font-size: 64px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    /* --- SIGNATURE BOTTOM ACCENT BAR --- */
    .bottom-signature-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 18px;
      background-color: #FF6A1A;
      z-index: 100;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s02"
    data-width="1080"
    data-height="1920"
    data-duration="6"
  >
    <!-- Shot S02-1 Visual Clip (duration: 6s) -->
    <div id="shot-s02" class="clip" data-start="0" data-duration="6">

      <!-- Chart Variant Background (lines + ticks at 20%, 40%, 60%, 80%) -->
      <div class="chart-background">
        <div class="chart-line" style="top: 20%;">
          <div class="chart-tick"></div>
        </div>
        <div class="chart-line" style="top: 40%;">
          <div class="chart-tick"></div>
        </div>
        <div class="chart-line" style="top: 60%;">
          <div class="chart-tick"></div>
        </div>
        <div class="chart-line" style="top: 80%;">
          <div class="chart-tick"></div>
        </div>
      </div>

      <!-- Hero Photo Card with Peel Entrance -->
      <div class="hero-card-anchor" id="hero-card">
        <div class="corner-tape"></div>
        <div class="hero-card-frame">
          <div class="hero-img-viewport">
            <img
              class="hero-img"
              id="hero-img"
              src="assets/img-05-corrupt-official-cash-briefcase.jpg"
              alt="Hối lộ vali tiền"
            />
          </div>
          <div class="hero-badge-tag">HỒ SƠ TANG VẬT #05</div>
        </div>
      </div>

      <!-- Money Icon Badge (at 0.6s) -->
      <div class="money-badge" id="money-badge">
        <svg class="money-icon-svg" viewBox="0 0 48 48" fill="none" stroke="#141414" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="40" height="28" rx="4" />
          <circle cx="24" cy="24" r="6" />
          <line x1="12" y1="18" x2="12" y2="30" />
          <line x1="36" y1="18" x2="36" y2="30" />
        </svg>
        <span class="money-badge-text">TIỀN MẶT</span>
      </div>

      <!-- Diagram Vector & Label: ĐỘNG CƠ VỤ LỢI (at 1.35s) -->
      <div class="diagram-layer">
        <svg class="diagram-svg" viewBox="0 0 260 120" fill="none">
          <path
            id="diagram-arrow-path"
            d="M 30 20 Q 140 20 190 90"
            stroke="#141414"
            stroke-width="5"
            stroke-linecap="round"
            stroke-dasharray="8 6"
          />
          <polygon
            id="diagram-arrow-head"
            points="186,105 204,82 176,82"
            fill="#FF6A1A"
            stroke="#141414"
            stroke-width="3"
          />
        </svg>
        <div class="diagram-plate" id="diagram-plate">
          <div class="diagram-sub">HỐI LỘ VÌ BẢN THÂN</div>
          <div class="diagram-title">ĐỘNG CƠ VỤ LỢI</div>
        </div>
      </div>

      <!-- Punch Phrase: MÓN HỜI BÉO BỞ (at 4.13s, hold through 6.0s = 1.87s > 1.6s) -->
      <div class="punch-wrapper" id="punch-wrapper">
        <div class="punch-plate">
          <div class="punch-eyebrow">QUYỀN LỢI SÁT SƯỜN</div>
          <h1 class="punch-text">MÓN HỜI BÉO BỞ</h1>
        </div>
      </div>

      <!-- Fixed Signature Bottom Orange Line -->
      <div class="bottom-signature-bar"></div>

    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};

    const tl = gsap.timeline({ paused: true });

    // Setup initial SVG stroke properties
    const arrowPath = document.getElementById("diagram-arrow-path");
    if (arrowPath) {
      const len = arrowPath.getTotalLength();
      arrowPath.style.strokeDasharray = len + "";
      arrowPath.style.strokeDashoffset = len + "";
    }

    // --- PHASE 1: PEEL ENTRANCE OF HERO CARD (0.05s -> 0.9s) ---
    tl.fromTo(
      "#hero-card",
      {
        opacity: 0,
        scale: 0.88,
        rotation: -7,
        y: -40,
      },
      {
        opacity: 1,
        scale: 1,
        rotation: 0,
        y: 0,
        duration: 0.8,
        ease: "power3.out",
      },
      0.05
    );

    // Pan-right & gentle Ken Burns on hero image across scene
    tl.fromTo(
      "#hero-img",
      {
        scale: 1.02,
        x: -25,
        y: 15,
      },
      {
        scale: 1.14,
        x: 20,
        y: -15,
        duration: 5.95,
        ease: "sine.out",
      },
      0.05
    );

    // --- PHASE 2: MONEY BADGE POPS IN (at 0.6s) ---
    tl.fromTo(
      "#money-badge",
      {
        scale: 0,
        opacity: 0,
        rotation: -18,
      },
      {
        scale: 1,
        opacity: 1,
        rotation: 4,
        duration: 0.55,
        ease: "power3.out",
      },
      0.6
    );

    // --- PHASE 3: DIAGRAM LABEL & ARROW (at 1.35s) ---
    tl.fromTo(
      "#diagram-plate",
      {
        opacity: 0,
        x: -40,
        scale: 0.92,
      },
      {
        opacity: 1,
        x: 0,
        scale: 1,
        duration: 0.55,
        ease: "power3.out",
      },
      1.35
    );

    if (arrowPath) {
      tl.to(
        arrowPath,
        {
          strokeDashoffset: 0,
          duration: 0.65,
          ease: "power2.out",
        },
        1.45
      );
    }

    tl.fromTo(
      "#diagram-arrow-head",
      {
        opacity: 0,
        scale: 0,
      },
      {
        opacity: 1,
        scale: 1,
        duration: 0.35,
        ease: "power3.out",
      },
      1.95
    );

    // --- PHASE 4: PUNCH PHRASE "MÓN HỜI BÉO BỞ" (at 4.13s) ---
    tl.fromTo(
      "#punch-wrapper",
      {
        opacity: 0,
        y: 40,
        scale: 0.94,
      },
      {
        opacity: 1,
        y: 0,
        scale: 1,
        duration: 0.55,
        ease: "power3.out",
      },
      4.13
    );

    // Đăng ký paused timeline duy nhất cho composition root
    window.__timelines["scene-s02"] = tl;
  </script>

    </template>
  </body>
</html>
