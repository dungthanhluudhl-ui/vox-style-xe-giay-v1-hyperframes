  <script>
    // Setup stroke lengths for deterministic drawing
    function setupStroke(id) {
      const el = document.getElementById(id);
      if (el && el.getTotalLength) {
        const len = Math.ceil(el.getTotalLength());
        el.style.strokeDasharray = len + " " + len;
        el.style.strokeDashoffset = len;
        return len;
      }
      return 200;
    }

    setupStroke("path-flow-right");
    setupStroke("icon-fall-path");

    // Single paused timeline according to HyperFrames contract
    const tl = gsap.timeline({ paused: true });

    // 0.0s -> 7.8s: Subtle slow camera zoom-in
    tl.fromTo("#scene-container", 
      { scale: 1 }, 
      { scale: 1.045, duration: 7.8, ease: "none" }, 
      0
    );

    // Initial state sets for elements that enter later
    gsap.set("#top-header", { opacity: 0, y: -24 });
    gsap.set("#source-card", { opacity: 0, scale: 1.25, y: -40 });
    gsap.set("#path-flow-left", { opacity: 0 });
    gsap.set("#arrow-flow-left", { opacity: 0 });
    gsap.set("#node-left", { opacity: 0, y: 30 });
    gsap.set("#stamp-no-action", { opacity: 0, scale: 1.8 });
    gsap.set("#icon-fall-badge", { opacity: 0, scale: 0.2 });
    gsap.set("#node-right", { opacity: 0, scale: 0.85, y: 20 });
    gsap.set("#arrow-flow-right", { opacity: 0 });
    gsap.set("#punch-card", { opacity: 0, scale: 1.35, y: -20 });
    gsap.set("#takeaway-bar", { opacity: 0, y: 24 });

    // PHASE 1: Strike Entrance (0.0s - 1.2s)
    // Cú giáng mạnh mở đầu cảnh
    tl.to("#top-header", { 
      opacity: 1, 
      y: 0, 
      duration: 0.4, 
      ease: "power3.out" 
    }, 0.1);

    tl.to("#source-card", { 
      opacity: 1, 
      scale: 1, 
      y: 0, 
      duration: 0.5, 
      ease: "power4.out" 
    }, 0.2);

    // Number counting up from 0 to 100.000.000 VNĐ
    const metricCounter = { count: 0 };
    tl.to(metricCounter, {
      count: 100,
      duration: 0.65,
      ease: "power2.out",
      onUpdate: () => {
        const val = Math.round(metricCounter.count);
        const el = document.getElementById("source-amount-val");
        if (el) {
          el.textContent = val + ".000.000";
        }
      }
    }, 0.25);

    // Hứa hẹn ban đầu (Node trái) xuất hiện
    tl.to("#node-left", { 
      opacity: 1, 
      y: 0, 
      duration: 0.45, 
      ease: "power3.out" 
    }, 0.9);

    tl.to(["#path-flow-left", "#arrow-flow-left"], { 
      opacity: 1, 
      duration: 0.35, 
      ease: "power2.out" 
    }, 1.05);

    // PHASE 2: Overlay Label "KHÔNG HỀ LO LÓT" at t = 2.54s
    // Đóng dấu stamp giáng mạnh vào lối rẽ của dòng tiền
    tl.to("#stamp-no-action", { 
      opacity: 1, 
      scale: 1, 
      duration: 0.35, 
      ease: "power4.out" 
    }, 2.54);

    // PHASE 3: Overlay Icon "fall" at t = 4.15s
    // Dòng tiền bẻ gãy, rẽ ngoặt sang đối tác làm ăn
    tl.to("#icon-fall-badge", { 
      opacity: 1, 
      scale: 1, 
      duration: 0.35, 
      ease: "power3.out" 
    }, 4.15);

    tl.to("#icon-fall-path", { 
      strokeDashoffset: 0, 
      duration: 0.35, 
      ease: "power2.out" 
    }, 4.2);

    // Đường nét cam rẽ ngoặt chạy nhanh sang Hộp Phải
    tl.to("#path-flow-right", { 
      strokeDashoffset: 0, 
      duration: 0.45, 
      ease: "power2.out" 
    }, 4.25);

    tl.to("#arrow-flow-right", { 
      opacity: 1, 
      duration: 0.2 
    }, 4.55);

    // Hộp Phải "TRẢ NỢ RIÊNG" bung sáng mạnh mẽ
    tl.to("#node-right", { 
      opacity: 1, 
      scale: 1, 
      y: 0, 
      duration: 0.4, 
      ease: "power3.out" 
    }, 4.45);

    // PHASE 4: Overlay Punch-Phrase "MANG ĐI TRẢ NỢ" at t = 4.81s
    // Cú strike chốt lại toàn bộ sự thật
    tl.to("#punch-card", { 
      opacity: 1, 
      scale: 1, 
      y: 0, 
      duration: 0.4, 
      ease: "power4.out" 
    }, 4.81);

    // Takeaway bar tổng kết xuất hiện
    tl.to("#takeaway-bar", { 
      opacity: 1, 
      y: 0, 
      duration: 0.45, 
      ease: "power3.out" 
    }, 5.3);

    // Đăng ký timeline chính thức vào registry HyperFrames
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s18"] = tl;
  </script>
