    <div

      <!-- Shot S09-1 Clip -->

    <script>
      // Single deterministic paused GSAP timeline
      const tl = gsap.timeline({ paused: true });

      // Path length calculations for SVG stroke animations
      const flowPath = document.getElementById("flow-arrow-path");
      const flowLen = flowPath.getTotalLength();
      flowPath.style.strokeDasharray = flowLen;
      flowPath.style.strokeDashoffset = flowLen;

      const checkPath = document.getElementById("check-path");
      const checkLen = checkPath.getTotalLength();
      checkPath.style.strokeDasharray = checkLen;
      checkPath.style.strokeDashoffset = checkLen;

      // Initial visual states
      gsap.set("#top-tag", { opacity: 0, y: -20 });
      gsap.set("#label-bienche", { scale: 0, opacity: 0 });
      gsap.set("#punch-card", { y: 60, opacity: 0 });
      gsap.set("#stamp-check", { scale: 0, opacity: 0, rotation: 25 });
      gsap.set("#flow-arrow-head", { opacity: 0, scale: 0, transformOrigin: "center center" });
      gsap.set(["#node-left", "#node-right"], { opacity: 0, y: 20 });

      // 0.0s - 0.7s: Wobble-Drop Entrance for Hero Card
      tl.fromTo(
        "#hero-card",
        { y: -720, rotation: -5, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.65, ease: "power2.out" },
        0
      )
      .to("#hero-card", { rotation: 2.5, duration: 0.14, ease: "power1.inOut" }, 0.65)
      .to("#hero-card", { rotation: 0, duration: 0.18, ease: "power1.out" }, 0.79);

      // 0.2s: Top dossier tag fades down
      tl.to("#top-tag", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.2);

      // 0.0s - 8.94s: Continuous camera motion (Ken Burns pan-left)
      tl.fromTo(
        "#hero-img",
        { scale: 1.08, x: 25 },
        { scale: 1.18, x: -35, duration: 8.94, ease: "none" },
        0
      );

      // 0.9s: Flow nodes enter
      tl.to("#node-left", { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.9);
      tl.to("#node-right", { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.1);

      // 1.2s: Flow arrow draws from left node to right node
      tl.to(
        "#flow-arrow-path",
        { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" },
        1.2
      );
      tl.to(
        "#flow-arrow-head",
        { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.5)" },
        1.95
      );

      // 2.16s: Overlay Label "XIN VÀO BIÊN CHẾ" pop entrance
      tl.fromTo(
        "#label-bienche",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        2.16
      );

      // 3.94s: Punch-phrase "NỂ TÌNH BẠN CŨ" enters with solid arrival
      tl.fromTo(
        "#punch-card",
        { y: 60, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        3.94
      );

      // 5.94s: Stamp check badge stamps onto the card (solid commitment)
      tl.fromTo(
        "#stamp-check",
        { scale: 1.9, opacity: 0, rotation: 30 },
        { scale: 1, opacity: 1, rotation: -8, duration: 0.38, ease: "power4.out" },
        5.94
      );
      // Progressive self-drawing check path
      tl.to(
        "#check-path",
        { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
        6.18
      );

      // Register timeline for seek-driven frame render
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s09"] = tl;
    </script>
