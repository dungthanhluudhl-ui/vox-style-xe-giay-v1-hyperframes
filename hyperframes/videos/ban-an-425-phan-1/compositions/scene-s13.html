<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Quy ước clip đúng chuẩn HyperFrames: inset: 0, không gán width/height cứng */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Nền giấy ngà + lưới ô vuông 84px chuẩn Vox DNA */
      #bg-grid {
        position: absolute;
        inset: 0;
        background-color: #e7e3d9;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        z-index: 1;
      }

      /* Thanh cam nhận diện cố định ở đáy khung hình */
      .bottom-orange-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background: #ff6a1a;
        z-index: 99;
      }

      /* Wrapper video căn giữa chuẩn tỷ lệ khung dọc 9:16 (720x1280) theo assetTreatment */
      #video-wrapper {
        position: absolute;
        top: 230px;
        left: 180px;
        width: 720px;
        height: 1280px;
        aspect-ratio: 9 / 16;
        background: #141414;
        border: 4px solid #141414;
        box-shadow: 14px 14px 0px rgba(20, 20, 20, 0.95);
        overflow: hidden;
        z-index: 10;
        transform-origin: 50% 50%;
      }

      /* Thẻ video không mang class clip, không lồng trong timed element */
      #vid-04 {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: 50% 50%;
      }

      /* Chi tiết collage tape dán các góc khung video */
      .paper-tape {
        position: absolute;
        background: #f5f0e4;
        border: 1px solid rgba(20, 20, 20, 0.4);
        z-index: 15;
      }
      .tape-tl {
        top: 215px;
        left: 150px;
        width: 95px;
        height: 32px;
        transform: rotate(-18deg);
      }
      .tape-tr {
        top: 215px;
        left: 835px;
        width: 95px;
        height: 32px;
        transform: rotate(18deg);
      }

      /* Tag hồ sơ đính trên video */
      .video-dossier-tag {
        position: absolute;
        top: 310px;
        left: 80px;
        background: #141414;
        color: #f7f4ec;
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 1.5px;
        padding: 6px 14px;
        border-left: 4px solid #ff6a1a;
        box-shadow: 4px 4px 0px rgba(20, 20, 20, 0.4);
        z-index: 25;
      }

      /* Flow diagram: Chuỗi liên lạc 3 cấp (Giao thông -> Thanh tra -> Nội vụ) */
      #flow-panel {
        position: absolute;
        top: 165px;
        left: 60px;
        width: 960px;
        transform-origin: 50% 0%;
        z-index: 30;
      }

      .flow-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .flow-badge {
        background: #ff6a1a;
        color: #141414;
        font-size: 14px;
        font-weight: 900;
        padding: 4px 10px;
        letter-spacing: 1px;
      }

      .flow-title {
        color: #141414;
        font-size: 19px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .flow-track {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }

      /* Node 1: Sở GTVT / Đề nghị */
      #node-gtvt {
        width: 250px;
        background: #f5f0e4;
        border: 3px solid #141414;
        padding: 12px 14px;
        box-shadow: 6px 6px 0px #141414;
        transform-origin: 50% 50%;
      }
      .node-tag {
        font-size: 13px;
        font-weight: 700;
        color: #141414;
        text-transform: uppercase;
        margin-bottom: 4px;
        opacity: 0.9;
      }
      .node-name {
        font-size: 17px;
        font-weight: 900;
        color: #141414;
        line-height: 1.25;
      }

      /* Mũi tên kết nối giữa các node */
      .arrow-box {
        width: 65px;
        display: flex;
        justify-content: center;
        align-items: center;
        transform-origin: 0% 50%;
      }

      /* Node 2: Chánh Thanh Tra (Ông V.) */
      #node-thanhtra {
        width: 280px;
        background: #141414;
        border: 3px solid #141414;
        padding: 12px 14px;
        box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.4);
        position: relative;
        transform-origin: 50% 50%;
      }
      #node-thanhtra .node-tag {
        color: #ff6a1a;
      }
      #node-thanhtra .node-name {
        color: #f7f4ec;
      }
      .node-subtext {
        font-size: 13px;
        font-weight: 700;
        color: #e7e3d9;
        margin-top: 4px;
      }

      /* Icon person chuẩn Vox xuất hiện bên cạnh Chánh Thanh tra */
      #icon-person-wrapper {
        position: absolute;
        top: -18px;
        right: -16px;
        background: #141414;
        border: 2px solid #ff6a1a;
        border-radius: 50%;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.5);
        transform-origin: 50% 50%;
      }

      /* Node 3: Phòng Nội Vụ (Nguyễn Tấn H1) */
      #node-noivu {
        width: 250px;
        background: #ff6a1a;
        border: 3px solid #141414;
        padding: 12px 14px;
        box-shadow: 6px 6px 0px #141414;
        transform-origin: 50% 50%;
      }
      #node-noivu .node-tag {
        color: #141414;
      }
      #node-noivu .node-name {
        color: #141414;
      }

      /* Overlay 2: Label CẦU NỐI TRUNG GIAN (tem dán) */
      #badge-bridge {
        position: absolute;
        top: 380px;
        right: 70px;
        background: #ff6a1a;
        color: #141414;
        padding: 12px 24px;
        font-weight: 900;
        font-size: 24px;
        letter-spacing: 1.5px;
        border: 3px solid #141414;
        box-shadow: 8px 8px 0px #141414;
        transform-origin: 50% 50%;
        z-index: 40;
      }

      /* Overlay 3: Punch-phrase CHUYÊN VIÊN NỘI VỤ nằm gọn trong dải an toàn */
      #punch-card {
        position: absolute;
        top: 1240px;
        left: 80px;
        width: 920px;
        background: #141414;
        border: 4px solid #141414;
        box-shadow: 10px 10px 0px #ff6a1a;
        padding: 20px 28px;
        transform-origin: 50% 100%;
        z-index: 45;
      }

      .punch-label {
        font-size: 15px;
        font-weight: 900;
        color: #ff6a1a;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      .punch-heading {
        font-size: 56px;
        font-weight: 900;
        color: #f7f4ec;
        line-height: 1.15;
        margin: 0 0 10px 0;
        letter-spacing: -0.5px;
      }

      #punch-accent-line {
        height: 5px;
        background: #ff6a1a;
        width: 100%;
        transform-origin: 0% 50%;
        margin-bottom: 10px;
      }

      .punch-detail {
        font-size: 19px;
        font-weight: 700;
        color: #e7e3d9;
        margin: 0;
        letter-spacing: 0.5px;
      }

      /* Lớp overlay chứa diagram & nhãn có thời gian */
      #stage-overlay {
        z-index: 30;
      }
    </style>

    <!-- Composition Root độc lập cho scene S13, thời lượng 7.8s (98000ms -> 105800ms) -->
    <div
      id="root"
      data-composition-id="scene-s13"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.8"
    >
      <!-- Nền giấy grid -->
      <div id="bg-grid"></div>

      <!-- Băng dán trang trí collage góc khung ảnh dọc -->
      <div class="paper-tape tape-tl"></div>
      <div class="paper-tape tape-tr"></div>

      <!-- Tag hồ sơ đính góc khung -->
      <div class="video-dossier-tag">HỒ SƠ VỤ ÁN // TÀI LIỆU #V-425</div>

      <!-- Wrapper video căn giữa 9:16 (720x1280) KHÔNG có data-start để bảo toàn hợp đồng media playback -->
      <div id="video-wrapper">
        <video
          id="vid-04"
          src="assets/vid-04-inspector-official-handshake-office.mp4"
          data-start="0"
          data-duration="7.8"
          data-media-start="0.1"
          muted
          playsinline
        ></video>
      </div>

      <!-- Lớp đồ hoạ & overlay toàn cảnh có thời lượng chuẩn 7.8s -->
      <div id="stage-overlay" class="clip" data-start="0" data-duration="7.8">
        <!-- Chuỗi liên lạc 3 cấp công vụ -->
        <div id="flow-panel">
          <div class="flow-header">
            <span class="flow-badge">MẮC XÍCH 02</span>
            <span class="flow-title">CHUỖI LIÊN KẾT CÔNG VỤ MỞ RỘNG</span>
          </div>

          <div class="flow-track">
            <!-- Cấp 1: Giao thông -->
            <div id="node-gtvt">
              <div class="node-tag">CẤP 1 • ĐỀ NGHỊ</div>
              <div class="node-name">SỞ GIAO THÔNG</div>
            </div>

            <!-- Mũi tên 1 -->
            <div class="arrow-box" id="arrow-1">
              <svg width="54" height="24" viewBox="0 0 54 24" fill="none">
                <path d="M 4 12 L 44 12" stroke="#141414" stroke-width="3" stroke-linecap="round" />
                <path d="M 36 5 L 45 12 L 36 19" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>

            <!-- Cấp 2: Chánh Thanh Tra (Ông V) -->
            <div id="node-thanhtra">
              <div id="icon-person-wrapper">
                <svg id="icon-person" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FF6A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </div>
              <div class="node-tag">CẤP 2 • TRUNG GIAN</div>
              <div class="node-name">CHÁNH THANH TRA</div>
              <div class="node-subtext">Ông V. (Cả nể nhận lời)</div>
            </div>

            <!-- Mũi tên 2 -->
            <div class="arrow-box" id="arrow-2">
              <svg width="54" height="24" viewBox="0 0 54 24" fill="none">
                <path d="M 4 12 L 44 12" stroke="#141414" stroke-width="3" stroke-linecap="round" />
                <path d="M 36 5 L 45 12 L 36 19" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>

            <!-- Cấp 3: Phòng Nội Vụ -->
            <div id="node-noivu">
              <div class="node-tag">CẤP 3 • THỰC THI</div>
              <div class="node-name">PHÒNG NỘI VỤ</div>
            </div>
          </div>
        </div>

        <!-- Overlay 2 (atMs: 101330 -> 3.33s local): Tem dán CẦU NỐI TRUNG GIAN -->
        <div id="badge-bridge">CẦU NỐI TRUNG GIAN</div>

        <!-- Overlay 3 (atMs: 103350 -> 5.35s local): Punch-phrase CHUYÊN VIÊN NỘI VỤ -->
        <div id="punch-card">
          <div class="punch-label">ĐỐI TƯỢNG KẾT NỐI MỚI</div>
          <h1 class="punch-heading">CHUYÊN VIÊN NỘI VỤ</h1>
          <div id="punch-accent-line"></div>
          <p class="punch-detail">ÔNG NGUYỄN TẤN H1 • UBND THÀNH PHỐ</p>
        </div>
      </div>

      <!-- Thanh cam đáy cố định -->
      <div class="bottom-orange-bar"></div>
    </div>

    <!-- Animation GSAP tất định cho Composition S13 -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Vào cảnh kiểu xoay xoắn ốc (spiral) theo shotlist
      tl.fromTo(
        "#video-wrapper",
        { scale: 0.82, rotation: -7, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
        0.05
      );

      // Camera chuyển động pan-right nhẹ theo shotlist
      tl.fromTo(
        "#vid-04",
        { x: -18, scale: 1.05 },
        { x: 18, scale: 1.05, duration: 7.6, ease: "none" },
        0.1
      );

      // Băng dán dán xuống sau khi khung hình ổn định
      tl.fromTo(
        ".paper-tape",
        { scale: 1.3, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, stagger: 0.08, ease: "power2.out" },
        0.6
      );

      // Tag hồ sơ vụ án xuất hiện
      tl.fromTo(
        ".video-dossier-tag",
        { x: -20, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        0.7
      );

      // 2. Xuất hiện sơ đồ liên kết công vụ (flow diagram)
      tl.fromTo(
        "#flow-panel",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.15
      );

      tl.fromTo(
        "#node-gtvt",
        { scale: 0.85, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.25
      );

      tl.fromTo(
        "#arrow-1",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.35, ease: "power2.out" },
        0.32
      );

      // 3. Overlay 1: Icon person + Cấp 2 Chánh Thanh Tra kích hoạt tại t = 0.38s (98380ms)
      tl.fromTo(
        "#node-thanhtra",
        { scale: 0.85, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.38
      );

      tl.fromTo(
        "#icon-person-wrapper",
        { scale: 0, opacity: 0, rotation: -25 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "power3.out" },
        0.48
      );

      // 4. Mũi tên dẫn hướng sang Phòng Nội Vụ
      tl.fromTo(
        "#arrow-2",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.4, ease: "power2.out" },
        1.8
      );

      tl.fromTo(
        "#node-noivu",
        { scale: 0.85, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        2.0
      );

      // 5. Overlay 2: Label CẦU NỐI TRUNG GIAN đóng dấu mạnh tại t = 3.33s (101330ms)
      tl.fromTo(
        "#badge-bridge",
        { scale: 1.6, opacity: 0, rotation: -8 },
        { scale: 1, opacity: 1, rotation: -3, duration: 0.45, ease: "power4.out" },
        3.33
      );

      // 6. Overlay 3: Punch-phrase CHUYÊN VIÊN NỘI VỤ xuất hiện tại t = 5.35s (103350ms)
      tl.fromTo(
        "#punch-card",
        { y: 35, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        5.35
      );

      tl.fromTo(
        "#punch-accent-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "power2.out" },
        5.6
      );

      // Đăng ký timeline gốc bắt buộc trên window.__timelines["scene-s13"]
      window.__timelines["scene-s13"] = tl;
    </script>
  
    </template>
  </body>
