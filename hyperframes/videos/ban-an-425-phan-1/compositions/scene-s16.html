<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
    /* hf-safe-colors (tất định từ style-tokens.json) */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
    .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
    .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
    .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Khung hình canvas 1080x1920 chuẩn 9:16 */
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      background-color: #E7E3D9; /* Nền giấy ngà Vox */
      overflow: hidden;
    }

    /* Quy ước Clip chuẩn HyperFrames: inset: 0 */
    .clip {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* === NỀN BIẾN THỂ "CHART" CHUẨN STYLE TOKENS (Đường kẻ ngang + tick cam, không chữ thừa) === */
    .chart-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .chart-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background-color: rgba(20, 20, 20, 0.32);
    }

    .chart-tick {
      position: absolute;
      left: 0;
      width: 32px;
      height: 6px;
      background-color: #FF6A1A;
    }

    /* === THANH CAM ĐÁY KHUNG HÌNH (Chữ ký thương hiệu Vox) === */
    .bottom-brand-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 12px;
      background-color: #FF6A1A;
      z-index: 99;
    }

    /* === HEADER / NHÃN PHÂN LOẠI ĐIỀU TRA === */
    .header-zone {
      position: absolute;
      top: 172px;
      left: 50px;
      right: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .header-tag {
      background-color: #141414;
      color: #F7F4EC;
      padding: 10px 20px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-status {
      background-color: #FF6A1A;
      color: #141414;
      padding: 10px 18px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    /* === HERO CARD CHÍNH (COLLAGE & FLOW) === */
    .hero-card {
      position: absolute;
      top: 248px;
      left: 50px;
      width: 980px;
      height: 980px;
      background-color: #F5F0E4; /* Nền card kem */
      border: 4px solid #141414;
      box-shadow: 14px 14px 0px #141414;
      z-index: 5;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .hero-card-header {
      height: 48px;
      background-color: #141414;
      color: #F7F4EC;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .media-viewport {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
      background-color: #0b0f14;
    }

    .media-viewport img {
      position: absolute;
      inset: -5%;
      width: 110%;
      height: 110%;
      object-fit: cover;
      display: block;
    }

    /* Phủ SVG minh họa luồng tiền tức thì */
    .flow-svg-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Nodes định vị tài khoản */
    .account-node {
      position: absolute;
      z-index: 4;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .node-title {
      background-color: #141414;
      color: #F7F4EC;
      padding: 6px 14px;
      font-size: 19px;
      font-weight: 900;
      border: 2px solid #141414;
      box-shadow: 4px 4px 0px rgba(20,20,20,0.5);
    }

    .node-subtext {
      align-self: flex-start;
      background-color: #141414;
      color: #FF6A1A;
      padding: 4px 10px;
      font-size: 17px;
      font-weight: 900;
    }

    #node-source {
      top: 100px;
      left: 50px;
    }

    #node-target {
      bottom: 120px;
      right: 50px;
      align-items: flex-end;
    }

    #node-target .node-subtext {
      align-self: flex-end;
    }

    /* === VÙNG OVERLAYS (Safe Zone: 1260px - 1490px) === */
    .overlays-zone {
      position: absolute;
      top: 1262px;
      left: 50px;
      width: 980px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .punch-row {
      display: flex;
      align-items: stretch;
      gap: 16px;
      height: 106px;
    }

    /* Icon Rise Badge (125210ms) */
    .icon-rise-box {
      width: 106px;
      height: 106px;
      background-color: #141414;
      border: 3px solid #141414;
      border-left: 8px solid #FF6A1A;
      display: grid;
      place-items: center;
      box-shadow: 8px 8px 0px rgba(20,20,20,0.4);
      flex-shrink: 0;
    }

    .icon-rise-box svg {
      width: 58px;
      height: 58px;
    }

    /* Punch-phrase Plate (125600ms) */
    .punch-phrase-plate {
      flex: 1;
      background-color: #141414;
      border: 3px solid #141414;
      display: flex;
      align-items: center;
      padding: 0 28px;
      box-shadow: 8px 8px 0px rgba(20,20,20,0.4);
    }

    .punch-phrase-text {
      color: #F7F4EC; /* onDarkText 16.8:1 trên mực */
      font-size: 50px;
      font-weight: 900;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    /* Label Plate (126480ms) */
    .label-plate {
      align-self: flex-start;
      background-color: #FF6A1A; /* Nền cam nhấn */
      border: 3px solid #141414;
      box-shadow: 8px 8px 0px #141414;
      padding: 12px 26px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .label-text {
      color: #141414; /* Chữ mực 6.4:1 trên nền cam */
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
  </style>


  <!-- ROOT COMPOSITION -->
  <div
    id="root"
    data-composition-id="scene-s16"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="6.21"
  >

    <!-- CLIP CHÍNH: TOÀN BỘ CẢNH S16 -->
    <div id="scene-s16" class="clip" data-start="0" data-duration="6.21">

      <!-- NỀN CHART BIẾN THỂ VỚI 4 ĐƯỜNG KẺ NGANG (20%, 40%, 60%, 80%) THEO STYLE TOKENS -->
      <div class="chart-container">
        <!-- 20% = 384px -->
        <div class="chart-line" style="top: 384px;"></div>
        <div class="chart-tick" style="top: 382px;"></div>

        <!-- 40% = 768px -->
        <div class="chart-line" style="top: 768px;"></div>
        <div class="chart-tick" style="top: 766px;"></div>

        <!-- 60% = 1152px -->
        <div class="chart-line" style="top: 1152px;"></div>
        <div class="chart-tick" style="top: 1150px;"></div>

        <!-- 80% = 1536px -->
        <div class="chart-line" style="top: 1536px;"></div>
        <div class="chart-tick" style="top: 1534px;"></div>
      </div>

      <!-- HEADER BẰNG CHỨNG ĐIỀU TRA -->
      <div id="header-zone" class="header-zone">
        <div class="header-tag">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF6A1A" stroke-width="3">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M7 8h10M7 12h10M7 16h6"/>
          </svg>
          HỒ SƠ 425 // TRUY VẾT DÒNG TIỀN
        </div>
        <div class="header-status">TỨC THÌ</div>
      </div>

      <!-- HERO CARD: DÒNG TIỀN & ĐỒ HỌA CHUYỂN KHOẢN -->
      <div id="hero-card" class="hero-card">
        <div class="hero-card-header">
          <span>SƠ ĐỒ ĐIỀU CHUYỂN // FLOW-08</span>
          <span style="color: #FF6A1A;">100.000.000 VNĐ</span>
        </div>

        <div class="media-viewport">
          <!-- Ảnh media img-08 từ thư mục assets/ -->
          <img
            id="hero-img"
            src="assets/img-08-money-transfer-velocity-flow.jpg"
            alt="Dòng tiền chuyển khoản trung gian"
          />

          <!-- SVG Flow Vẽ Đường Chuyển Tiền Thần Tốc -->
          <svg class="flow-svg-overlay" viewBox="0 0 980 932">
            <defs>
              <filter id="orange-glow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF6A1A" flood-opacity="0.8"/>
              </filter>
            </defs>

            <!-- Đường dẫn dòng tiền uốn lượn nối 2 thiết bị -->
            <path
              id="flow-path-bg"
              d="M 180 200 C 440 180, 520 460, 780 580"
              fill="none"
              stroke="rgba(20,20,20,0.6)"
              stroke-width="12"
              stroke-linecap="round"
            />
            <path
              id="flow-path"
              pathLength="1000"
              d="M 180 200 C 440 180, 520 460, 780 580"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="10"
              stroke-linecap="round"
              stroke-dasharray="1000"
              stroke-dashoffset="1000"
              filter="url(#orange-glow)"
            />

            <!-- Điểm đầu (Chánh thanh tra) -->
            <circle id="origin-point" cx="180" cy="200" r="14" fill="#FF6A1A" stroke="#141414" stroke-width="4"/>
            <!-- Điểm cuối (Chuyên viên nội vụ) -->
            <circle id="dest-point" cx="780" cy="580" r="16" fill="#141414" stroke="#FF6A1A" stroke-width="5"/>
          </svg>

          <!-- Node Chánh Thanh Tra -->
          <div id="node-source" class="account-node">
            <div class="node-title">TK CHÁNH THANH TRA</div>
            <div class="node-subtext">VỪA NHẬN ➔ CHUYỂN TIẾP</div>
          </div>

          <!-- Node Chuyên Viên Nội Vụ -->
          <div id="node-target" class="account-node">
            <div class="node-title">TK CHUYÊN VIÊN NỘI VỤ</div>
            <div class="node-subtext">+ 100.000.000 VNĐ</div>
          </div>
        </div>
      </div>

      <!-- VÙNG OVERLAYS (Shotlist: Icon rise, Punch-phrase, Label) -->
      <div class="overlays-zone">
        <!-- Hàng 1: Icon Rise + Punch-phrase -->
        <div class="punch-row">
          <!-- Icon vocabulary: rise (atMs: 125210 => 3.21s) -->
          <div id="overlay-icon" class="icon-rise-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="#FF6A1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
              <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
          </div>

          <!-- Punch phrase: "BẮN THẲNG TÀI KHOẢN" (atMs: 125600 => 3.60s) -->
          <div id="overlay-punch" class="punch-phrase-plate">
            <h1 class="punch-phrase-text">BẮN THẲNG TÀI KHOẢN</h1>
          </div>
        </div>

        <!-- Hàng 2: Label: "ĐÍCH ĐẾN TIỀN CỌC" (atMs: 126480 => 4.48s) -->
        <div id="overlay-label" class="label-plate">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <div class="label-text">ĐÍCH ĐẾN TIỀN CỌC</div>
        </div>
      </div>

      <!-- THANH CAM ĐÁY KHUNG HÌNH CỐ ĐỊNH -->
      <div class="bottom-brand-bar"></div>

    </div>
  </div>

  <!-- GSAP ANIMATION RUNTIME -->
  <script>
    // Đăng ký timeline chính, paused: true theo hợp đồng HyperFrames
    const tl = gsap.timeline({
      paused: true,
      defaults: { ease: "power3.out" }
    });

    // 1. Giai đoạn mở đầu (0.0s): Transition in "grow" cho Card Hero
    tl.fromTo(
      "#hero-card",
      { scale: 0.8, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
      0.0
    );

    tl.fromTo(
      "#header-zone",
      { y: -30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5 },
      0.15
    );

    // 2. Ken Burns Pan-left trên ảnh img-08
    tl.fromTo(
      "#hero-img",
      { scale: 1.0, x: 20 },
      { scale: 1.08, x: -30, duration: 6.21, ease: "none" },
      0.0
    );

    // 3. Xuất hiện Node tài khoản nguồn (0.35s)
    tl.fromTo(
      "#node-source",
      { scale: 0, opacity: 0, y: 15 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.35
    );

    // 4. Đường nét phát sáng màu cam (Flow Line) bắn từ Chánh thanh tra -> Chuyên viên nội vụ
    tl.fromTo(
      "#flow-path",
      { strokeDashoffset: 1000 },
      { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" },
      0.65
    );

    // 5. Node đích đến nảy lên khi nhận dòng tiền (1.35s)
    tl.fromTo(
      "#node-target",
      { scale: 0, opacity: 0, y: -15 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      1.35
    );

    tl.fromTo(
      "#dest-point",
      { scale: 0, transformOrigin: "center center" },
      { scale: 1.4, duration: 0.35, yoyo: true, repeat: 1, ease: "power2.out" },
      1.35
    );

    // 6. Overlays theo đúng Shotlist:
    // (a) Overlay Icon "rise" tại 125210ms (relative: 3.21s)
    tl.fromTo(
      "#overlay-icon",
      { scale: 0, opacity: 0, rotation: -12 },
      { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "power3.out" },
      3.21
    );

    // (b) Overlay Punch-phrase "BẮN THẲNG TÀI KHOẢN" tại 125600ms (relative: 3.60s)
    tl.fromTo(
      "#overlay-punch",
      { scale: 0.88, opacity: 0, x: -35 },
      { scale: 1, opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
      3.60
    );

    // (c) Overlay Label "ĐÍCH ĐẾN TIỀN CỌC" tại 126480ms (relative: 4.48s)
    tl.fromTo(
      "#overlay-label",
      { scale: 0.85, opacity: 0, y: 25 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      4.48
    );

    // BẮT BUỘC: Đăng ký timeline chính vào window.__timelines["scene-s16"]
    window.__timelines["scene-s16"] = tl;
  </script>

    </template>
  </body>
</html>
