    <script>
      const tl = gsap.timeline({ paused: true });

      // Setup initial dash states for SVG paths
      const divider = document.getElementById("divider-line");
      if (divider) {
        divider.style.strokeDashoffset = "930";
      }

      const warnTriangle = document.getElementById("warn-triangle");
      if (warnTriangle) {
        const triLen = warnTriangle.getTotalLength();
        warnTriangle.style.strokeDasharray = triLen;
        warnTriangle.style.strokeDashoffset = triLen;
      }

      // ==========================================
      // PHASE 1: ENTRANCE (0.0s - 1.5s) - "Peel" & Split Reveal
      // ==========================================
      tl.fromTo(
        "#header-bar",
        { y: -70, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.1
      );

      // Center dividing dashed line reveals from top to bottom
      tl.fromTo(
        "#divider-line",
        { strokeDashoffset: 930 },
        { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
        0.2
      );

      // Left and right side cards peel in from opposite angles
      tl.fromTo(
        "#card-left",
        { x: -90, rotationY: -16, opacity: 0 },
        { x: 0, rotationY: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.25
      );

      tl.fromTo(
        "#card-right",
        { x: 90, rotationY: 16, opacity: 0 },
        { x: 0, rotationY: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.35
      );

      // Diagrams pop into view
      tl.fromTo(
        "#svg-wallet-closed",
        { scale: 0.75, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.55
      );

      tl.fromTo(
        "#svg-wallet-open",
        { scale: 0.75, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.65
      );

      // Cash fluttering out on right side
      tl.fromTo(
        ".flying-bill",
        { y: 25, opacity: 0, scale: 0.6 },
        { y: 0, opacity: 1, scale: 1, duration: 0.4, stagger: 0.12, ease: "power2.out" },
        0.85
      );

      // Right card progress meter fills to 100%
      tl.fromTo(
        "#meter-fill-right",
        { width: "0%" },
        { width: "100%", duration: 0.75, ease: "power3.out" },
        1.1
      );

      // ==========================================
      // PHASE 2: OVERLAY 1 - "CHƯA XÒE TIỀN" (at 2.18s = 84180ms)
      // ==========================================
      tl.fromTo(
        "#label-left",
        { scale: 0.3, opacity: 0, rotation: -6 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.42, ease: "power3.out" },
        2.18
      );

      tl.fromTo(
        "#subnote-left",
        { y: 15, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" },
        2.4
      );

      // ==========================================
      // PHASE 3: OVERLAY 2 - "TỰ MÓC HẦU BAO" (at 3.33s = 85330ms)
      // ==========================================
      tl.fromTo(
        "#label-right",
        { scale: 0.3, opacity: 0, rotation: 6 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.42, ease: "power3.out" },
        3.33
      );

      tl.fromTo(
        "#subnote-right",
        { y: 15, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" },
        3.55
      );

      // Pulse right side shadow to emphasize the one-sided sacrifice
      tl.to(
        "#card-right",
        {
          boxShadow: "14px 14px 0px #FF6A1A",
          duration: 0.35,
          yoyo: true,
          repeat: 1,
          ease: "sine.inOut"
        },
        4.1
      );

      // ==========================================
      // PHASE 4: OVERLAY 3 - PUNCH-PHRASE "CÁI KẾT HẾT HỒN" (at 5.29s = 87290ms)
      // ==========================================
      tl.fromTo(
        "#punch-card",
        { y: 110, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power4.out" },
        5.29
      );

      // ==========================================
      // PHASE 5: OVERLAY 4 - WARNING ICON DRAW (at 5.50s = 87500ms)
      // ==========================================
      tl.to(
        "#warn-triangle",
        { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
        5.50
      );

      tl.fromTo(
        "#warn-exclamation",
        { opacity: 0, scaleY: 0 },
        { opacity: 1, scaleY: 1, duration: 0.25, ease: "power3.out" },
        5.75
      );

      tl.fromTo(
        "#warn-dot",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.18, ease: "power3.out" },
        5.88
      );

      // Hold punch card through scene end (7.08s)
      window.__timelines["scene-s11"] = tl;
    </script>
