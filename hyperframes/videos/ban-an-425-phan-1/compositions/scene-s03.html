<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #141414;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Rule: .clip must have position: absolute; inset: 0 */
      .clip {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* 84px square grid background (Vox identity) */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }

      /* Permanent orange brand bar at bottom edge */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 1000;
      }

      /* Top Editorial Tag (Safe zone >= 160px) */
      .editorial-tag {
        position: absolute;
        top: 175px;
        left: 100px;
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 10;
      }

      .tag-pill {
        background-color: #141414;
        color: #F7F4EC;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 1.5px;
        padding: 6px 14px;
        text-transform: uppercase;
        border-radius: 4px;
      }

      .tag-subtitle {
        color: #141414;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      /* Hero Visual Card (Cutout / Collage) */
      .hero-card {
        position: absolute;
        top: 380px;
        left: 100px;
        width: 880px;
        height: 930px;
        background-color: #F5F0E4;
        border: 4px solid #141414;
        box-shadow: 12px 12px 0px #141414;
        overflow: hidden;
      }

      .hero-viewport {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .hero-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 25%;
        display: block;
        transform-origin: center center;
      }

      /* Decorative collage tape */
      .card-tape {
        position: absolute;
        top: -8px;
        right: 48px;
        width: 120px;
        height: 34px;
        background-color: #E7E3D9;
        border: 2px solid #141414;
        transform: rotate(3deg);
        z-index: 15;
      }

      /* Corner stamp badge */
      .card-stamp {
        position: absolute;
        bottom: 24px;
        right: 24px;
        background-color: #141414;
        color: #FF6A1A;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 1.5px;
        padding: 8px 16px;
        border: 2px solid #FF6A1A;
        text-transform: uppercase;
        z-index: 15;
      }

      /* Overlay 1: Person Icon Callout */
      .person-callout {
        position: absolute;
        top: 410px;
        left: 130px;
        background-color: #141414;
        border: 3px solid #FF6A1A;
        box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.4);
        padding: 10px 20px;
        display: flex;
        align-items: center;
        gap: 14px;
        z-index: 30;
      }

      .person-svg-wrap {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .person-label {
        margin: 0;
        font-size: 24px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      /* Overlay 2: Punch Phrase "TỰ BỎ TIỀN TÚI" */
      .punch-card {
        position: absolute;
        top: 240px;
        left: 100px;
        width: 880px;
        background-color: #FF6A1A;
        border: 4px solid #141414;
        box-shadow: 10px 10px 0px #141414;
        padding: 18px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        z-index: 40;
      }

      .punch-kicker {
        font-size: 18px;
        font-weight: 700;
        color: #141414;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .punch-headline {
        margin: 0;
        font-size: 64px;
        font-weight: 900;
        line-height: 1.15;
        color: #141414;
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }

      /* Overlay 3: Label "CHẠY SUẤT BIÊN CHẾ" */
      .label-card {
        position: absolute;
        top: 1340px;
        left: 140px;
        width: 800px;
        background-color: #141414;
        border: 3px solid #141414;
        box-shadow: 8px 8px 0px rgba(20, 20, 20, 0.45);
        padding: 16px 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        z-index: 40;
      }

      .label-tag {
        background-color: #FF6A1A;
        color: #141414;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1.2px;
        padding: 6px 12px;
        border-radius: 4px;
        text-transform: uppercase;
      }

      .label-text {
        margin: 0;
        font-size: 38px;
        font-weight: 900;
        line-height: 1.2;
        color: #F7F4EC;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s03"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7"
    >
      <!-- Base Background & Signature Bottom Bar -->
      <div class="bg-grid"></div>
      <div class="brand-bottom-bar"></div>

      <!-- Track 0: Main Shot Clip (0s - 7s) -->
      <section id="shot-main" class="clip" data-start="0" data-duration="7" data-track-index="0">
        <!-- Top Editorial Category Tracker -->
        <div id="editorial-tag" class="editorial-tag">
          <div class="tag-pill">HỒ SƠ 425</div>
          <div class="tag-subtitle">NGHỊCH LÝ ĐIỀU TRA</div>
        </div>

        <!-- Main Visual Card (img-02 with Ken Burns zoom) -->
        <div id="hero-card" class="hero-card">
          <div class="card-tape"></div>
          <div class="card-stamp">TÀI LIỆU #02</div>
          <div class="hero-viewport">
            <img
              id="hero-img"
              class="hero-img"
              src="assets/img-02-teacher-recruitment-fraud-bribe.jpg"
              alt="Minh họa đưa tiền chạy việc"
            />
          </div>
        </div>
      </section>

      <!-- Track 1: Person Icon Overlay (1.20s - 3.20s) -->
      <div id="clip-person" class="clip" data-start="1.2" data-duration="2.0" data-track-index="1">
        <div id="person-card" class="person-callout">
          <div class="person-svg-wrap">
            <svg class="person-svg" viewBox="0 0 44 44" width="36" height="36" xmlns="http://www.w3.org/2000/svg">
              <circle
                class="draw-path"
                cx="22"
                cy="13"
                r="7"
                fill="none"
                stroke="#FF6A1A"
                stroke-width="3.5"
                stroke-linecap="round"
              />
              <path
                class="draw-path"
                d="M 9 37 C 9 26, 35 26, 35 37"
                fill="none"
                stroke="#FF6A1A"
                stroke-width="3.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <h2 class="person-label">QUAN CHỨC TRUNG GIAN</h2>
        </div>
      </div>

      <!-- Track 2: Punch Phrase Overlay (3.29s - 7.00s) -->
      <div id="clip-punch" class="clip" data-start="3.29" data-duration="3.71" data-track-index="2">
        <div id="punch-card" class="punch-card">
          <div class="punch-kicker">HÀNH VI BẤT THƯỜNG</div>
          <h1 class="punch-headline">TỰ BỎ TIỀN TÚI</h1>
        </div>
      </div>

      <!-- Track 3: Context Label Overlay (5.14s - 7.00s) -->
      <div id="clip-label" class="clip" data-start="5.14" data-duration="1.86" data-track-index="3">
        <div id="label-card" class="label-card">
          <span class="label-tag">MỤC ĐÍCH</span>
          <span class="label-text">CHẠY SUẤT BIÊN CHẾ</span>
        </div>
      </div>
    </div>

    <script>
      // Single paused master timeline for HyperFrames
      const tl = gsap.timeline({ paused: true });

      // Deterministic SVG stroke-dash setup
      const drawPaths = document.querySelectorAll(".draw-path");
      drawPaths.forEach((path) => {
        const len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
      });

      // 1. Scene Entrance (grow transition) at t = 0
      tl.fromTo(
        "#hero-card",
        { scale: 0.92, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.1
      );

      tl.fromTo(
        "#editorial-tag",
        { y: -16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        0.2
      );

      // Ken Burns slow zoom-in on image (1.0x to 1.1x across the 7.0s duration)
      tl.fromTo(
        "#hero-img",
        { scale: 1.0 },
        { scale: 1.10, duration: 7.0, ease: "none" },
        0
      );

      // 2. Overlay 1: Person Icon Callout at t = 1.20s (holds to ~3.0s, exits before punch)
      tl.fromTo(
        "#person-card",
        { scale: 0.7, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.20
      );

      // Self-drawing SVG path for person icon
      drawPaths.forEach((path) => {
        tl.to(
          path,
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
          1.25
        );
      });

      // Exit transition for person callout before punch phrase arrives
      tl.to(
        "#person-card",
        { scale: 0.85, opacity: 0, duration: 0.20, ease: "power2.in" },
        3.00
      );

      // 3. Overlay 2: Punch Phrase "TỰ BỎ TIỀN TÚI" at t = 3.29s (spring grow)
      tl.fromTo(
        "#punch-card",
        { scale: 0.65, opacity: 0, y: 15 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        3.29
      );

      // 4. Overlay 3: Context Label "CHẠY SUẤT BIÊN CHẾ" at t = 5.14s
      tl.fromTo(
        "#label-card",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        5.14
      );

      // Register master timeline with exact matching composition id
      window.__timelines["scene-s03"] = tl;
    </script>
  
    </template>
  </body>
</html>
