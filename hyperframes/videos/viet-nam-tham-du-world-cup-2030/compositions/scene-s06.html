    * { box-sizing: border-box; }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(20,20,20,.28) 100%),
        #E7E3D9;
    }
    .clip { position: absolute; inset: 0; }

    #video-viewport, #image-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #video-viewport { z-index: 1; }
    #video-camera {
      position: absolute;
      top: -152px;
      left: 0;
      width: 1250px;
      height: 2223px;
    }
    #video-1 {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #shot-2 { z-index: 2; overflow: hidden; }
    #image-camera {
      position: absolute;
      inset: 0;
      transform-origin: 52% 54%;
    }
    #image-1 {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    #shot-1-overlay { z-index: 3; pointer-events: none; }
    .label {
      position: absolute;
      width: max-content;
      max-width: 960px;
      padding: 20px 27px 23px;
      background: #141414;

      line-height: 1.25;

    #opposition-label {
      left: 60px;

  <div id="root" data-composition-id="scene-s06" data-width="1080" data-height="1920" data-duration="8.24">

        <video
          id="video-1"
          src="assets/vid-03-officials-disapproval-cutout-collage.mp4"

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // A quick change of crop introduces the protest, then pans toward the cup.
    tl.fromTo("#video-camera",
      { x: 0 },
      { x: -70, duration: 0.32, ease: "power3.out" },
      0
    );
    tl.fromTo("#video-camera",
      { x: -70 },
      { x: -170, duration: 4.52, ease: "power2.inOut" },
      0.32
    );

    tl.fromTo("#opposition-label",
      { scale: 0, opacity: 0, transformOrigin: "left center" },
      { scale: 1, opacity: 1, duration: 0.32, ease: "power3.out" },
      2.55
    );

    // Cut to the still, tightening the crop around the cup and its existing text.
    tl.fromTo("#image-camera",
      { scale: 1.07, x: 0 },
      { scale: 1.23, x: -22, duration: 3.24, ease: "power2.inOut" },
      4.92
    );
    tl.fromTo("#quality-label",
      { scale: 0, opacity: 0, transformOrigin: "left center" },
      { scale: 1, opacity: 1, duration: 0.34, ease: "power3.out" },
      5.76
    );

    window.__timelines["scene-s06"] = tl;
  </script>
