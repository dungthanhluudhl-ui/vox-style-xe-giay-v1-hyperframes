<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { font-family: "Be Vietnam Pro", sans-serif; }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #F5F0E4;
      perspective: 1000px;
    }
    .clip { position: absolute; inset: 0; }

    #shot-one {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      background: #F5F0E4;
      transform-origin: center center;
    }
    #reaction-video,
    #still-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }
    #reaction-video {
      position: absolute;
      inset: 0;
    }

    #shot-two {
      z-index: 2;
      pointer-events: none;
    }
    #still-frame {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #F5F0E4;
    }

    .question {
      position: absolute;
      z-index: 3;
      top: 1160px;
      left: 76px;
      width: 928px;
      height: 142px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 28px;
      border-radius: 12px;
      background: #141414;
      color: #F7F4EC;
      font-size: 62px;
      font-weight: 900;
      line-height: 1.2;
      white-space: nowrap;
      text-align: center;
      transform-origin: center center;
    }

    #brand-bar {
      position: absolute;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      background: #FF6A1A;
    }
  </style>

  <div id="root" data-composition-id="scene-s11" data-width="1080" data-height="1920" data-duration="5.64">
    <div id="shot-one">
      <video
        id="reaction-video"
        src="assets/vid-06-player-social-media-reaction-cutout.mp4"
        muted
        playsinline
        data-start="0"
        data-duration="3.17"
        data-media-start="2"
      ></video>
      <div class="clip" data-start="0" data-duration="3.17">
        <div id="question-one" class="question">VIỆT NAM 2030?</div>
      </div>
    </div>

    <section id="shot-two" class="clip" data-start="3.17" data-duration="2.47">
      <div id="still-frame">
        <img
          id="still-image"
          src="assets/img-07-vietnam-footballer-social-media-reaction.jpg"
          alt=""
        >
      </div>
      <div id="question-two" class="question">BẠN NGHĨ SAO?</div>
    </section>

    <div id="brand-bar" aria-hidden="true"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo(
      "#shot-one",
      { rotationY: -55, opacity: 0 },
      { rotationY: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
      0
    );
    tl.fromTo(
      "#question-one",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      0.08
    );

    tl.fromTo(
      "#still-frame",
      { opacity: 0 },
      { opacity: 1, duration: 0.3, ease: "none" },
      3.17
    );
    tl.fromTo(
      "#question-two",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      3.25
    );

    window.__timelines["scene-s11"] = tl;
  </script>

    </template>
  </body>
</html>
