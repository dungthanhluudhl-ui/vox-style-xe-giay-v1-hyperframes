<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { font-family: "Be Vietnam Pro", sans-serif; }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(rgba(20,20,20,0.32) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(20,20,20,0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }

    .clip { position: absolute; inset: 0; }

    #shot-1 { overflow: hidden; }

    #camera {
      position: absolute;
      inset: 0;
      transform-origin: 50% 48%;
    }

    #hero-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #label {
      position: absolute;
      z-index: 2;
      left: 64px;
      top: 1130px;
      width: max-content;
      max-width: 950px;
      padding: 20px 30px 22px;
      background: #141414;
      color: #F7F4EC;
      font-size: 65px;
      font-weight: 900;
      line-height: 1.18;
      white-space: nowrap;
      transform-origin: left center;
      opacity: 0;
    }

    #brand-bar {
      position: absolute;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      background: #FF6A1A;
    }
  </style>

  <div id="root" data-composition-id="scene-s01" data-width="1080" data-height="1920" data-duration="8">
    <section id="shot-1" class="clip" data-start="0" data-duration="8">
      <div id="camera" data-layout-allow-overflow>
        <img id="hero-image" src="assets/img-05-vietnam-football-world-cup-dream.jpg" alt="">
      </div>
      <div id="label">TIN TỪ FIFA</div>
    </section>
    <div id="brand-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Zoom-through entrance settles into a wide view of the player and trophy.
    tl.fromTo("#camera",
      { scale: 1.22, x: 0, y: 0, opacity: 0.65 },
      { scale: 1, x: 0, y: 0, opacity: 1, duration: 0.48, ease: "power3.out" },
      0
    );

    // Push toward the torn-paper opening without moving so far that the trophy leaves frame.
    tl.fromTo("#camera",
      { scale: 1, x: 0, y: 0 },
      { scale: 1.23, x: -58, y: 8, duration: 5.5, ease: "power2.inOut" },
      2.3
    );

    tl.fromTo("#label",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
      6.36
    );

    window.__timelines["scene-s01"] = tl;
  </script>

    </template>
  </body>
</html>
