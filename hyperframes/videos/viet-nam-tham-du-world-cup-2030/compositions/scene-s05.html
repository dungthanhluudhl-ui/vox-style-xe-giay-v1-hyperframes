<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%,
          rgba(20, 20, 20, 0) 32%,
          rgba(20, 20, 20, 0.28) 100%),
        #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    #shot-1 {
      overflow: hidden;
    }

    #image-frame {
      position: absolute;
      inset: 0;
      overflow: hidden;
      transform-origin: 50% 50%;
    }

    #hero-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #quote-panel {
      position: absolute;
      left: 615px;
      top: 445px;
      width: 435px;
      height: 690px;
      display: flex;
      align-items: center;
      padding: 36px;
      background: #141414;
      transform-origin: left center;
    }

    #quote {
      margin: 0;
      color: #F7F4EC;
      font-size: 54px;
      font-weight: 900;
      line-height: 1.34;
      overflow-wrap: normal;
    }

    #brand-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      z-index: 10;
      background: #FF6A1A;
    }
  </style>

  <div id="root" data-composition-id="scene-s05" data-width="1080" data-height="1920" data-duration="6.72">
    <section id="shot-1" class="clip" data-start="0" data-duration="6.72">
      <div id="image-frame" data-layout-allow-overflow>
        <img id="hero-image" src="assets/img-06-asia-map-slots-collage.jpg" alt="">
      </div>
      <div id="quote-panel">
        <p id="quote">CƠ HỘI ≠ SUẤT VÉ</p>
      </div>
    </section>
    <div id="brand-bar" aria-hidden="true"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo("#shot-1",
      { clipPath: "inset(0 50% 0 50%)" },
      { clipPath: "inset(0 0% 0 0%)", duration: 0.48, ease: "power3.out" },
      0
    );

    tl.fromTo("#image-frame",
      { scale: 1.27, x: 0, y: 0 },
      { scale: 1.18, x: 0, y: 0, duration: 3.28, ease: "none" },
      0
    );
    tl.fromTo("#image-frame",
      { scale: 1.18, x: 0, y: 0 },
      { scale: 0.53, x: -235, y: -95, duration: 0.62, ease: "power3.out" },
      3.28
    );

    tl.fromTo("#quote-panel",
      { scaleX: 0, opacity: 0 },
      { scaleX: 1, opacity: 1, duration: 0.48, ease: "power3.out" },
      3.28
    );
    tl.fromTo("#quote",
      { scale: 0.9, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.28, ease: "power3.out" },
      3.4
    );

    window.__timelines["scene-s05"] = tl;
  </script>

    </template>
  </body>
</html>
