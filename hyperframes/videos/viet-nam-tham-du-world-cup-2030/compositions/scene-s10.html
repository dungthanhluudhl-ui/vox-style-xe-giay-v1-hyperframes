<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { font-family: "Be Vietnam Pro", sans-serif; }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #E7E3D9;
      color: #141414;
    }
    .spotlight {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 43%,
        rgba(20,20,20,0) 30%,
        rgba(20,20,20,0.28) 100%);
      pointer-events: none;
    }
    .clip { position: absolute; inset: 0; }
    .shot-stage { position: absolute; inset: 0; }

    .image-frame {
      position: absolute;
      left: 135px;
      top: 318px;
      width: 810px;
      height: 1032px;
      overflow: hidden;
      background: #F5F0E4;
      border: 12px solid #F5F0E4;
    }
    .image-window {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .camera {
      position: absolute;
      inset: 0;
    }
    .camera img {
      position: absolute;
      display: block;
      height: auto;
    }
    #rivals-image {
      width: 850px;
      left: 0;
      top: -235px;
    }
    #dream-image {
      width: 685px;
      left: 80px;
      top: -105px;
    }

    .label-zone {
      position: absolute;
      left: 90px;
      top: 176px;
      width: 900px;
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .label {
      position: absolute;
      max-width: 900px;
      padding: 13px 34px 15px;
      background: #141414;
      color: #F7F4EC;
      font-size: 62px;
      font-weight: 900;
      line-height: 1.18;
      text-align: center;
      white-space: nowrap;
      opacity: 0;
    }
    #current-label { font-size: 49px; }

    .bottom-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      background: #FF6A1A;
      z-index: 10;
    }
  </style>

  <div id="root" data-composition-id="scene-s10" data-width="1080" data-height="1920" data-duration="10.2">
    <div class="spotlight"></div>

    <section id="shot-1" class="clip" data-start="0" data-duration="5.94">
      <div id="first-stage" class="shot-stage">
        <div class="image-frame">
          <div class="image-window">
            <div id="rivals-camera" class="camera">
              <img id="rivals-image" src="assets/img-03-asian-football-tier-cutout.jpg" alt="">
            </div>
          </div>
        </div>
        <div class="label-zone">
          <div id="thailand-label" class="label">THÁI LAN</div>
          <div id="indonesia-label" class="label">INDONESIA</div>
          <div id="malaysia-label" class="label">MALAYSIA</div>
        </div>
      </div>
    </section>

    <section id="shot-2" class="clip" data-start="5.94" data-duration="4.26">
      <div class="shot-stage">
        <div class="image-frame">
          <div class="image-window">
            <div id="dream-camera" class="camera">
              <img id="dream-image" src="assets/img-05-vietnam-football-world-cup-dream.jpg" alt="">
            </div>
          </div>
        </div>
        <div class="label-zone">
          <div id="current-label" class="label">THỰC LỰC HIỆN TẠI</div>
        </div>
      </div>
    </section>

    <div class="bottom-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // Peel reveals the first shot; the image then drifts left to lead the eye right.
    tl.fromTo("#first-stage",
      { clipPath: "inset(0 100% 0 0)" },
      { clipPath: "inset(0 0% 0 0)", duration: 0.48, ease: "power3.out" },
      0
    );
    tl.fromTo("#rivals-camera",
      { x: 0 },
      { x: -40, duration: 5.8, ease: "power1.inOut" },
      0.08
    );

    tl.fromTo("#thailand-label",
      { opacity: 0, scale: 0.88 },
      { opacity: 1, scale: 1, duration: 0.32, ease: "power3.out" },
      1.44
    );
    tl.set("#thailand-label", { opacity: 0 }, 2.94);

    tl.fromTo("#indonesia-label",
      { opacity: 0, scale: 0.88 },
      { opacity: 1, scale: 1, duration: 0.32, ease: "power3.out" },
      2.94
    );
    tl.set("#indonesia-label", { opacity: 0 }, 4.44);

    tl.fromTo("#malaysia-label",
      { opacity: 0, scale: 0.88 },
      { opacity: 1, scale: 1, duration: 0.32, ease: "power3.out" },
      4.44
    );

    // The second shot cuts in wide and moves slightly toward the player.
    tl.fromTo("#dream-camera",
      { x: 0 },
      { x: -35, duration: 4.1, ease: "power1.inOut" },
      5.96
    );
    tl.fromTo("#current-label",
      { opacity: 0, scale: 0.9 },
      { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" },
      7.52
    );

    window.__timelines["scene-s10"] = tl;
  </script>

    </template>
  </body>
</html>
