<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { font-family: "Be Vietnam Pro", sans-serif; }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #F5F0E4;
    }
    .clip { position: absolute; inset: 0; }
    #shot-1 { perspective: 1000px; }
    #stage {
      position: absolute;
      inset: 0;
      background: #F5F0E4;
      transform-origin: 50% 50%;
    }
    #photo-frame {
      position: absolute;
      left: 56px;
      top: 170px;
      width: 968px;
      height: 1050px;
      overflow: hidden;
      border: 3px solid #141414;
      background: #E7E3D9;
    }
    #camera {
      position: absolute;
      left: 0;
      top: 0;
      width: 1120px;
      height: 2007px;
    }
    #photo {
      display: block;
      width: 1120px;
      height: 2007px;
      object-fit: cover;
    }
    #stamp {
      position: absolute;
      left: 190px;
      top: 1260px;
      width: 700px;
      height: 104px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 5px solid #FF6A1A;
      background: #141414;
      color: #F7F4EC;
      font-size: 51px;
      font-weight: 900;
      letter-spacing: 1px;
      white-space: nowrap;
      opacity: 0;
      transform-origin: 50% 50%;
    }
    #bottom-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      background: #FF6A1A;
      z-index: 10;
    }
  </style>

  <div id="root" data-composition-id="scene-s02" data-width="1080" data-height="1920" data-duration="8.12">
    <section id="shot-1" class="clip" data-start="0" data-duration="8.12">
      <div id="stage">
        <div id="photo-frame" data-layout-allow-overflow>
          <div id="camera">
            <img id="photo" src="assets/img-08-fifa-president-announcement-cutout.jpg" alt="">
          </div>
        </div>
        <div id="stamp">ĐANG NGHIÊN CỨU</div>
      </div>
    </section>
    <div id="bottom-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo("#stage",
      { rotationY: -55, opacity: 0 },
      { rotationY: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
      0
    );

    tl.fromTo("#camera",
      { x: -8, y: -45 },
      { x: -132, y: -780, duration: 8.02, ease: "power2.inOut" },
      0
    );

    tl.fromTo("#stamp",
      { opacity: 0, scale: 1.4, rotation: -12 },
      { opacity: 1, scale: 1, rotation: -3, duration: 0.28, ease: "power4.out" },
      2.54
    );

    window.__timelines["scene-s02"] = tl;
  </script>

    </template>
  </body>
</html>
