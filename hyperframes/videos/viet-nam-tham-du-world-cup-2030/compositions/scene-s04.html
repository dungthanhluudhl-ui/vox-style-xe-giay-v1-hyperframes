<!doctype html>

/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { font-family: "Be Vietnam Pro", sans-serif; }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #E7E3D9;
    }
    .chart-rule {
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(20,20,20,0.32);
    }
    .chart-rule::before {
      content: "";
      position: absolute;
      left: 0;
      top: -8px;
      width: 25px;
      height: 19px;
      background: #FF6A1A;
    }
    .clip { position: absolute; inset: 0; }

    .video-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .scene-video, .scene-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #video-one-stage { z-index: 2; }
    #video-two-stage { z-index: 3; }
    #image-shot { z-index: 4; }
    #shot-one-text { z-index: 5; }
    #shot-two-text { z-index: 6; }
    #shot-three-text { z-index: 7; }

    .plate {
      position: absolute;
      display: inline-block;
      width: max-content;
      max-width: 920px;
      padding: 19px 27px 21px;
      background: #141414;
      color: #F7F4EC;
      font-size: 51px;
      font-weight: 900;
      line-height: 1.25;
      white-space: nowrap;
    }
    #revenue-label { left: 62px; top: 205px; }
    #approval-video-label { left: 62px; top: 205px; }
    #approval-image-label { left: 62px; top: 205px; }
    #slots-label {
      left: 62px;
      top: 357px;
      background: #FF6A1A;
      color: #141414;
      font-size: 68px;
    }
    #brand-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      z-index: 20;
      background: #FF6A1A;
    }
  </style>
