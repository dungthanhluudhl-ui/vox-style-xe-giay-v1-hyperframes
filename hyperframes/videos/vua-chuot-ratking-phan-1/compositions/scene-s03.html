        2.94,

        { scale: 0.7, opacity: 0, y: -25 },
        { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },

      // === SHOT S03-3 (5.66s -> 7.54s) ===

        "#vid-05-media",
