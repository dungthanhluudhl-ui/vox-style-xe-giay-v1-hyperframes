    /* Persistent bottom brand bar */

      position: absolute;
      bottom: 0;

  </style>

  <div
    id="root"
    data-composition-id="scene-s02"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="5.18"
    data-layout-allow-overflow="true"
  >
    <!-- Persistent Dossier Frame Vignette -->
    <div class="dossier-frame" data-layout-ignore="true"></div>

    <!-- SHOT 1 MEDIA (0s to 3.12s) - Timed directly for HyperFrames media ownership -->
    <video
      id="s02-vid"
      src="assets/vid-01-rat-king-mystery-document.mp4"
      muted
      playsinline
      data-start="0"
      data-duration="3.12"
      data-media-start="1"
      data-layout-allow-overflow="true"
    ></video>

    <!-- SHOT 1 OVERLAYS (0s to 3.12s) -->
    <div
      id="shot-1-overlay"
      class="clip"
      data-start="0"
      data-duration="3.12"
      data-layout-allow-overflow="true"
    >
      <!-- Archival Header Bar -->
      <div id="dossier-header-1" class="dossier-header-bar" data-layout-allow-overflow="true">
        <div class="archive-stamp">HỒ SƠ LƯU TRỮ #02</div>
        <div class="archive-status">
          <span class="status-indicator"></span>CHƯA CÓ LỜI GIẢI
        </div>
      </div>

      <!-- Label: BẾ TẮC LÝ THUYẾT -->
      <div id="label-stagnation" data-layout-allow-overflow="true">
        <div class="label-tag-header">
          <span class="label-dot"></span>
          <span class="label-category">KHOA HỌC // NGHỊCH LÝ</span>
        </div>
        <div class="label-main-text">BẾ TẮC LÝ THUYẾT</div>
      </div>

      <!-- Warning Callout Icon -->
      <div id="warning-badge" data-layout-allow-overflow="true">
        <div class="warning-icon-wrap">
          <svg class="warning-svg" viewBox="0 0 80 80" width="64" height="64">
            <path
              id="warn-triangle"
              d="M 40 10 L 72 68 L 8 68 Z"
              fill="none"
              stroke="#FF6A1A"
              stroke-width="6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <line
              id="warn-exclamation"
              x1="40"
              y1="28"
              x2="40"
              y2="48"
              stroke="#F7F4EC"
              stroke-width="5"
              stroke-linecap="round"
            />
            <circle id="warn-point" cx="40" cy="58" r="3" fill="#F7F4EC" />

    <img

      class="clip"

  <script>
    // Setup warning triangle stroke length deterministically
    const tri = document.getElementById("warn-triangle");
    if (tri) {
      const len = Math.ceil(tri.getTotalLength ? tri.getTotalLength() : 197);
      tri.style.strokeDasharray = len + "";
      tri.style.strokeDashoffset = len + "";
    }

    // Build the master timeline
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // --- SHOT 1 CHOREOGRAPHY (0s to 3.12s) ---
    // TransitionIn: Unfold document overlay from top
    tl.fromTo(
      "#shot-1-overlay",
      { scaleY: 0.88, opacity: 0, transformOrigin: "50% 15%" },
      { scaleY: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
      0
    );

    // CameraMotion: Archival pan right across Shot 1
    tl.fromTo(
      "#s02-vid",
      { x: -35 },
      { x: 35, duration: 3.12, ease: "none" },
      0
    );

    // Header 1 entrance
    tl.fromTo(
      "#dossier-header-1",
      { y: -30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.15
    );

    // Overlay Label: "BẾ TẮC LÝ THUYẾT" at 0.97s (holds 1.70s -> exits at 2.67s)
    tl.fromTo(
      "#label-stagnation",
      { scale: 0.88, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.97
    );
    tl.to(
      "#label-stagnation",
      { opacity: 0, y: -15, duration: 0.35, ease: "power2.in" },
      2.67
    );

    // Overlay Warning Callout at 2.12s (holds until end of shot at 3.12s)
    tl.fromTo(
      "#warning-badge",
      { scale: 0.88, opacity: 0, y: 20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
      2.12
    );
    tl.to(
      "#warn-triangle",
      { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
      2.18
    );
    tl.fromTo(
      "#warn-exclamation, #warn-point",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out", stagger: 0.06 },
      2.45
    );

    // --- SHOT 2 CHOREOGRAPHY (3.12s to 5.18s) ---
    // CameraMotion: Ken Burns push (1.0x to 1.07x) on dossier specimen
    tl.fromTo(
      "#shot-2-img",
      { scale: 1.0, transformOrigin: "50% 50%" },
      { scale: 1.07, duration: 2.06, ease: "power1.out" },
      3.12
    );

    // Header 2 entrance
    tl.fromTo(
      "#dossier-header-2",
      { y: -25, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
      3.15
    );

    // Punch Phrase: "HỒ SƠ MẪU VẬT" at 3.84s (holds through 5.18s)
    tl.fromTo(
      "#punch-card",
      { scale: 0.9, opacity: 0, y: 35 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      3.84
    );
    tl.fromTo(
      "#punch-rule-line",
      { scaleX: 0, transformOrigin: "0% 50%" },
      { scaleX: 1, duration: 0.4, ease: "power2.out" },
      4.05
    );

    // Register single paused timeline on window.__timelines
    window.__timelines["scene-s02"] = tl;
  </script>
