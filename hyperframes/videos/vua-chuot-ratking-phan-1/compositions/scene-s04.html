    <div

      <!-- Lớp nền đồ thị (chart variant) -->

      <!-- Header kỹ thuật nhận diện phong cách Vox -->

    <!-- Animation Runtime GSAP (seek-safe, paused, deterministic) -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // Thiết lập transformOrigin và baseline tĩnh TRƯỚC khi đưa vào timeline
      gsap.set("#vid-03", { transformOrigin: "0% 0%" });
      gsap.set("#img-02", { transformOrigin: "50% 50%" });
      gsap.set("#meter-fill", { transformOrigin: "0% 50%", scaleX: 0.12 });
      gsap.set("#counter-val", { innerText: 8 });

      // ==========================================
      // SHOT 1 CHOREOGRAPHY (0.0s -> 5.84s)
      // ==========================================

      // 1. Transition In "peel": Entrance từ 0.1s đến 0.85s
      tl.fromTo(
        "#vid-03",
        {
          rotationX: 10,
          rotationZ: -3,
          scale: 0.92,
          opacity: 0,
          x: 20
        },
        {
          rotationX: 0,
          rotationZ: 0,
          scale: 1,
          opacity: 1,
          x: 0,
          duration: 0.75,
          ease: "power3.out"
        },
        0.1
      );

      // Pan camera bắt đầu tuần tự SAU KHI entrance hoàn thành (tại 0.85s -> 5.84s), không xung đột thuộc tính x
      tl.to(
        "#vid-03",
        { x: -20, duration: 4.99, ease: "none" },
        0.85
      );

      // 2. Vòng định vị tâm nút thắt đuôi xuất hiện gọn gàng, bán trong suốt
      tl.fromTo(
        "#knot-reticle",
        { scale: 0.3, opacity: 0, rotation: -45 },
        { scale: 1, opacity: 0.75, rotation: 0, duration: 0.5, ease: "power3.out" },
        0.8
      );

      // 3. Overlay 1: Nhãn "NÚT THẮT ĐUÔI" (1.73s -> 3.53s)
      tl.fromTo(
        "#overlay-knot",
        { opacity: 0, y: 24, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
        1.73
      );
      tl.to(
        "#overlay-knot",
        { opacity: 0, y: -12, duration: 0.3, ease: "power2.in" },
        3.23
      );

      // 4. Overlay 2: Nhãn "LỰC KÉO ĐỐI NGHỊCH" (3.62s -> 5.84s)
      tl.fromTo(
        "#overlay-pull",
        { opacity: 0, y: 28, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
        3.62
      );
      // Mũi tên lực kéo đối nghịch bung sang 2 phía
      tl.fromTo(
        ".force-arrow-left",
        { x: 35, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        3.75
      );
      tl.fromTo(
        ".force-arrow-right",
        { x: -35, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        3.75
      );
      tl.to(
        "#overlay-pull",
        { opacity: 0, y: -14, duration: 0.34, ease: "power2.in" },
        5.5
      );

      // ==========================================
      // SHOT 2 CHOREOGRAPHY (5.84s -> 11.08s)
      // ==========================================

      // 1. Transition In "grow": Phóng to khung cận cảnh từ tâm
      tl.fromTo(
        "#img-02",
        { scale: 0.92, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.65, ease: "power3.out" },
        5.84
      );

      // 2. Camera Motion: Ken Burns zoom-in chậm vào tâm nút thắt
      tl.to(
        "#img-02",
        { scale: 1.12, duration: 4.59, ease: "none" },
        6.49
      );

      // 3. Overlay 1: Icon crowd & Thang đo quy mô (6.73s -> 9.13s)
      tl.fromTo(
        "#crowd-card",
        { opacity: 0, y: 28, scale: 0.95 },
        { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
        6.73
      );
      // SVG path self-drawing
      tl.fromTo(
        ".crowd-stroke",
        { strokeDashoffset: 160 },
        { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" },
        6.85
      );
      // Thanh meter mở rộng bằng scaleX (không dùng width gây reflow)
      tl.fromTo(
        "#meter-fill",
        { scaleX: 0.12 },
        { scaleX: 0.88, duration: 0.8, ease: "power2.out" },
        7.0
      );
      tl.to(
        "#crowd-card",
        { opacity: 0, y: -14, duration: 0.32, ease: "power2.in" },
        8.8
      );

      // 4. Overlay 2: Punch Phrase "3 ĐẾN 32+ CON" (9.27s -> 11.08s)
      tl.fromTo(
        "#punch-card",
        { opacity: 0, scale: 0.92, y: 32 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" },
        9.27
      );
      // Hiệu ứng nhảy số đếm quy mô: set điểm mốc 8 tại 9.4s và đếm lên 32
      tl.set("#counter-val", { innerText: 8 }, 9.4);
      tl.to(
        "#counter-val",
        { innerText: 32, snap: { innerText: 1 }, duration: 0.65, ease: "power2.out" },
        9.4
      );

      // Đăng ký timeline duy nhất đã paused cho root composition "scene-s04"
      window.__timelines["scene-s04"] = tl;
    </script>
