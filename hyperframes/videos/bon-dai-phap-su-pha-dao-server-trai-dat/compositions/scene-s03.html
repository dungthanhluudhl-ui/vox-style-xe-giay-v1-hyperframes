        linear-gradient(90deg, rgba(20,20,20,0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }
    .clip { position: absolute; inset: 0; }

    .first-window {
      position: absolute;
      left: 140px;
      top: 160px;
      width: 800px;
      height: 1230px;
      overflow: hidden;
      background: #141414;

    .first-camera {
      position: absolute;
      left: -35px;

      width: 870px;
      height: 1410px;

      height: 100%;

      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #orbit-hold { object-position: 50% 38%; }
    #exercise-image { object-position: 50% 88%; }

    .overlay {
      z-index: 5;

      { opacity: 1 },
      { opacity: 0, duration: 0.01, ease: "none" },
      4.11);
    tl.fromTo(["#split-left", "#split-right"],
      { opacity: 0 },
      { opacity: 1, duration: 0.08, ease: "none" },
      4.12);
    tl.fromTo("#exercise-camera",
      { scale: 1 },
      { scale: 1.08, duration: 4.06, ease: "power2.out" },
      4.12);
    tl.fromTo("#comparison-plate",
      { scale: 0.9, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.36, ease: "power3.out" },

    window.__timelines["scene-s03"] = tl;
