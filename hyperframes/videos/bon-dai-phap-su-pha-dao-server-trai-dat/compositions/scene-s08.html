<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { font-family: "Be Vietnam Pro", sans-serif; }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #E7E3D9;
    }
    .clip { position: absolute; inset: 0; }

    .chart-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(20,20,20,0.32);
    }
    .chart-line::before {
      content: "";
      position: absolute;
      left: 0;
      top: -8px;
      width: 20px;
      height: 18px;
      background: #FF6A1A;
    }
    .chart-line:nth-child(1) { top: 384px; }
    .chart-line:nth-child(2) { top: 768px; }
    .chart-line:nth-child(3) { top: 1152px; }
    .chart-line:nth-child(4) { top: 1536px; }

    .media-frame {
      position: absolute;
      left: 70px;
      top: 170px;
      width: 940px;
      height: 1150px;
      overflow: hidden;
      background: #141414;
    }
    #video-frame { z-index: 1; }
    #video-camera {
      position: absolute;
      inset: 0;
      transform-origin: 50% 58%;
    }
    #periodic-video {
      position: absolute;
      left: 0;
      top: 0;
      width: 940px;
      height: 1150px;
      object-fit: cover;
      object-position: center center;
    }

    #image-shot {
      z-index: 3;
      background: #E7E3D9;
    }
    #image-camera {
      position: absolute;
      left: 0;
      top: 0;
      width: 1220px;
      height: 2186px;
    }
    #puzzle-image {
      display: block;
      width: 1220px;
      height: 2186px;
      object-fit: cover;
    }

    .overlay-layer { z-index: 4; pointer-events: none; }
    .data-plate {
      position: absolute;
      left: 96px;
      top: 1192px;
      width: max-content;
      max-width: 888px;
      padding: 15px 30px 17px;
      background: #141414;
      color: #F7F4EC;
      font-size: 64px;
      font-weight: 900;
      line-height: 1.34;
      white-space: nowrap;
      transform-origin: left center;
    }
    #image-data { z-index: 5; }

    #brand-bar {
      position: absolute;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 0;
      height: 12px;
      background: #FF6A1A;
    }
  </style>

  <div id="root" data-composition-id="scene-s08" data-width="1080" data-height="1920" data-duration="6.68">
    <div aria-hidden="true">
      <div class="chart-line"></div>
      <div class="chart-line"></div>
      <div class="chart-line"></div>
      <div class="chart-line"></div>
    </div>

    <div id="video-frame" class="media-frame">
      <div id="video-camera">
        <video
          id="periodic-video"
          src="assets/vid-08-paper-cutout-periodic-table.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="4.2"
          data-media-start="1.5"
        ></video>
      </div>
    </div>

    <section id="video-data" class="clip overlay-layer" data-start="0" data-duration="4.2">
      <div id="first-plate" class="data-plate">11 Ô TRỐNG</div>
    </section>

    <section id="image-shot" class="clip" data-start="4.2" data-duration="2.48">
      <div class="media-frame">
        <div id="image-camera" data-layout-allow-overflow>
          <img id="puzzle-image" src="assets/img-07-solving-puzzle-scientific-clues.jpg" alt="">
        </div>
      </div>
      <div id="image-data" class="data-plate">100 NĂM SAU</div>
    </section>

    <div id="brand-bar" aria-hidden="true"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });

    // A brief horizontal strike reveals the video without masking the assembly action.
    tl.fromTo("#video-frame",
      { clipPath: "inset(0 100% 0 0)" },
      { clipPath: "inset(0 0% 0 0)", duration: 0.24, ease: "power3.out" },
      0
    );
    tl.fromTo("#video-camera",
      { scale: 1.04 },
      { scale: 1.17, duration: 4.1, ease: "power2.out" },
      0
    );
    tl.fromTo("#first-plate",
      { scale: 0.82, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.30, ease: "power3.out" },
      0.46
    );

    // The second shot cuts to the still, then pans right across the same image.
    tl.fromTo("#image-camera",
      { x: -48, y: -420 },
      { x: -230, y: -420, duration: 2.40, ease: "power2.inOut" },
      4.2
    );

    window.__timelines["scene-s08"] = tl;
  </script>

    </template>
  </body>
</html>
