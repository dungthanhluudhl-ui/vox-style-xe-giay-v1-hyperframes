    #root {

    .clip { position: absolute; inset: 0; }

      height: 1180px;

      background: #141414;
    }
    #shot-1 { z-index: 1; }
    #image-motion {
      position: absolute;
      left: -55px;
      top: -38px;
      width: 1140px;
      height: 2043px;
      will-change: transform;

    #image-motion img {

    }
    #writing-video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

      line-height: 1.22;

      white-space: nowrap;
      transform-origin: left center;
    }
    #bottom-bar {
      position: absolute;
      z-index: 10;

      right: 0;

    const tl = gsap.timeline({ paused: true });

    tl.fromTo(
      "#shot-1",
      { y: 85, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.46, ease: "power3.out" },

      ["#label-2", 1.9],
      ["#label-3", 3.47],
      ["#label-4", 5.12]

        selector,
        { scale: 0.82, opacity: 0, y: 16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        at
