  <!-- Animation Timeline Script -->
  <script>
    // Initialize paused master timeline
    const tl = gsap.timeline({ paused: true });

    // Setup initial SVG stroke dash measurements deterministically
    const crackPath = document.getElementById("crack-path");
    const crackLen = crackPath.getTotalLength();

    const crackSub1 = document.getElementById("crack-sub-1");
    const crackSub1Len = crackSub1.getTotalLength();

    const crackSub2 = document.getElementById("crack-sub-2");
    const crackSub2Len = crackSub2.getTotalLength();

    const warnTriangle = document.getElementById("warning-triangle");
    const warnTriLen = warnTriangle.getTotalLength();

    // =========================================================================
    // SHOT 1 CHOREOGRAPHY (t = 0.0s to 5.0s)
    // =========================================================================

    // 1. Tracker and stage entrance
    tl.fromTo("#s1-tracker", 
      { y: -30, opacity: 0 }, 
      { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 
      0.1
    );

    // 2. Party cards slide in from flanks
    tl.fromTo("#card-gov", 
      { x: -120, opacity: 0 }, 
      { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 
      0.3
    );

    tl.fromTo("#card-students", 
      { x: 120, opacity: 0 }, 
      { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 
      0.35
    );

    // 3. Table contour appears
    tl.fromTo("#s1-table-wrap", 
      { scale: 0.92, opacity: 0, transformOrigin: "50% 50%" }, 
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 
      0.5
    );

    // 4. Crack Line Strikes Through (1.0s - 1.35s) using explicit fromTo
    tl.fromTo(crackPath, 
      { strokeDasharray: crackLen, strokeDashoffset: crackLen }, 
      { strokeDashoffset: 0, duration: 0.35, ease: "power4.in" }, 
      1.0
    );
    tl.fromTo(crackSub1, 
      { strokeDasharray: crackSub1Len, strokeDashoffset: crackSub1Len }, 
      { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, 
      1.2
    );
    tl.fromTo(crackSub2, 
      { strokeDasharray: crackSub2Len, strokeDashoffset: crackSub2Len }, 
      { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, 
      1.25
    );

    // 5. Shatter Effect: Table Shards break apart (1.35s) - explicit fromTo for seek safety
    tl.fromTo("#shard-1", 
      { x: 0, y: 0, rotation: 0, transformOrigin: "50% 50%" }, 
      { x: -48, y: -28, rotation: -5, duration: 0.7, ease: "power3.out" }, 
      1.35
    );
    tl.fromTo("#shard-2", 
      { x: 0, y: 0, rotation: 0, transformOrigin: "50% 50%" }, 
      { x: 52, y: -24, rotation: 6, duration: 0.7, ease: "power3.out" }, 
      1.35
    );
