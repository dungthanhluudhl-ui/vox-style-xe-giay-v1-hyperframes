        mix-blend-mode: multiply;

    <div

      <!-- Overlay Shot 1: Khung ngắm máy quay hội tụ (1.25s -> 4.05s) -->

        <div id="viewfinder-inner" class="viewfinder-box">

    <script>
      const tl = gsap.timeline({ paused: true });

      // Shot 1: Video toàn cảnh phóng viên báo chí Ken Burns zoom nhẹ (0 -> 4.5s)
      tl.fromTo("#vid-1", { scale: 1.0 }, { scale: 1.08, duration: 4.5, ease: "none" }, 0);

      // Shot 1: Viewfinder máy quay xuất hiện và thu hút ánh nhìn (1.25s -> 4.05s)
      tl.fromTo("#viewfinder-inner", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1.0, duration: 0.4, ease: "power3.out" }, 1.25);
      tl.to("#viewfinder-inner", { opacity: 0, duration: 0.3, ease: "power2.in" }, 3.75);

      // Shot 1: Label TIÊU ĐIỂM BẮC KINH (2.3s -> 4.1s)
      tl.fromTo("#shot-1-label-inner", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.3);
      tl.to("#shot-1-label-inner", { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, 3.75);

      // Shot 2: Cắt cận cảnh sinh viên tuyệt thực (4.5s -> 7.5s)
      tl.fromTo("#vid-2", { scale: 1.12 }, { scale: 1.16, duration: 3.0, ease: "sine.out" }, 4.5);

      // Shot 2: Card TUYỆT THỰC ĐÒI CẢI CÁCH & KHÁNG NGHỊ ÔN HÒA (5.52s -> 7.32s)
      tl.fromTo("#shot-2-card-inner", { opacity: 0, y: 36, scale: 0.96 }, { opacity: 1, y: 0, scale: 1.0, duration: 0.5, ease: "power3.out" }, 5.52);
      tl.to("#shot-2-card-inner", { opacity: 0, y: -20, duration: 0.35, ease: "power2.in" }, 6.95);

      // Captions đồng bộ tuần tự theo dòng thời gian
      tl.fromTo("#caption-1-text", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 0.05);
      tl.fromTo("#caption-2-text", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 1.35);
      tl.fromTo("#caption-3-text", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 2.65);
      tl.fromTo("#caption-4-text", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 3.85);
      tl.fromTo("#caption-5-text", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 5.05);
      tl.fromTo("#caption-6-text", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 6.25);

      // Đăng ký timeline với HyperFrames
      window.__timelines["scene-s01"] = tl;
