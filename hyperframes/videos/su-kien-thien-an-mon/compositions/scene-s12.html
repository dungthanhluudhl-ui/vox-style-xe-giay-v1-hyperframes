    <div

      <!-- Lớp hạt noise/grain nền phong cách báo chí tài liệu -->
      <div class="paper-grain" data-layout-ignore="true"></div>

      <!-- ==================== SHOT 1: QUOTE ĐANH THÉP ==================== -->
      <section id="shot-1" class="clip" data-start="0" data-duration="4">
        <div id="shot-1-content">

          <div id="speaker-label-wrapper">
            <div class="speaker-box">

    <script>
      // Khởi tạo GSAP Timeline bắt buộc ở trạng thái paused
      const tl = gsap.timeline({ paused: true });

      // Chuẩn bị đường nét vẽ tự sinh cho SVG path
      const ragePath = document.getElementById("rage-path");
      if (ragePath) {
        const rageLen = ragePath.getTotalLength();
        ragePath.style.strokeDasharray = rageLen;
        ragePath.style.strokeDashoffset = rageLen;
      }

      const fallPath = document.getElementById("fall-path");
      if (fallPath) {
        const fallLen = fallPath.getTotalLength();
        fallPath.style.strokeDasharray = fallLen;
        fallPath.style.strokeDashoffset = fallLen;
      }

      const fallArrow = document.getElementById("fall-arrow");
      if (fallArrow) {
        const arrowLen = fallArrow.getTotalLength();
        fallArrow.style.strokeDasharray = arrowLen;
        fallArrow.style.strokeDashoffset = arrowLen;
      }

      // ==========================================
      // CHOREOGRAPHY SHOT 1: [0.0s -> 4.0s]
      // ==========================================

      // 0.1s: Header xuất hiện nhẹ nhàng
      tl.fromTo(
        "#meta-header",
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0.1
      );

      // 0.83s: Label "LÝ BẰNG CẢNH BÁO" trượt ra dứt khoát (atMs: 105330)
      tl.fromTo(
        "#speaker-label-wrapper",
        { opacity: 0, x: -50 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        0.83
      );

      // 1.82s: STRIKE ENTRANCE cho Punch Phrase "«CÁC ANH ĐÃ ĐI QUÁ XA»" (atMs: 106320)
      // 1. Chớp sáng va chạm (strike flash)
      tl.fromTo(
        "#strike-flash",
        { opacity: 0.4 },
        { opacity: 0, duration: 0.14, ease: "power2.out" },
        1.82
      );

      // 2. Khối chữ giáng mạnh xuống (scale 1.35 -> 1.0, không overshoot lố lăng)
      tl.fromTo(
        "#quote-box",
        { opacity: 0, scale: 1.35, y: -20 },
        { opacity: 1, scale: 1.0, y: 0, duration: 0.38, ease: "power4.out" },
        1.82
      );

      // 3. Highlight đen bung ra phía sau chữ "ĐÃ ĐI QUÁ XA»"
      tl.to(
        "#quote-hl-bg",
        { scaleX: 1, duration: 0.32, ease: "power3.out" },
        2.02
      );

      // 4. Kẻ thước kỹ thuật xuất hiện hoàn tất bố cục
      tl.fromTo(
        "#ruler-box",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        2.2
      );

      // (Giữ nguyên vị trí vững chắc đến hết 4.0s: hold > 1.6s theo quy chuẩn Style DNA)

      // ==========================================
      // CHOREOGRAPHY SHOT 2: [4.0s -> 7.0s]
      // ==========================================

      // 4.0s: Camera pan-right & zoom nhẹ mô phỏng cú lia theo bước chân
      tl.fromTo(
        "#shot-2-stage",
        { x: -30, scale: 1.0 },
        { x: 20, scale: 1.03, duration: 3.0, ease: "sine.out" },
        4.0
      );

      // 4.1s: Người bước đi hướng vào cánh cửa
      tl.fromTo(
        "#figure-wrap",
        { opacity: 0, y: 35 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
        4.1
      );

      // 4.35s: Bóng cam đặc (#ff7a1a) bật ra sau lưng (dấu ấn Vox Cutout DNA)
      tl.to(
        ".figure-shadow-orange",
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        4.35
      );

      // 4.7s: Tia thị nộ màu cam chém gắt ngang màn hình
      tl.to(
        "#rage-path",
        { strokeDashoffset: 0, duration: 0.32, ease: "power3.out" },
        4.7
      );

      // 5.45s: Label "CƠN GIẬN DỮ" đập vào (atMs: 109950)
      tl.fromTo(
        "#fury-card",
        { opacity: 0, scale: 0.88, y: 24 },
        { opacity: 1, scale: 1.0, y: 0, duration: 0.45, ease: "power3.out" },
        5.45
      );

      // 5.55s: Icon 'fall' tự vẽ nét sắc bén hoàn thiện biểu tượng thất bại
      tl.to(
        "#fall-path",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        5.55
      );
      tl.to(
        "#fall-arrow",
        { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
        5.85
      );

      // Đăng ký timeline chính thức lên window.__timelines["scene-s12"]
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s12"] = tl;
    </script>
