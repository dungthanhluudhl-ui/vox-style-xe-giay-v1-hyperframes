      /* Permanent Brand Signature Bottom Bar */
      #brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 100;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s02"
      data-width="1080"

    >
      <!-- SHOT 1: 0.0s -> 6.19s (rel ms: 0 -> 6190) -->

          <img
            id="shot1-img"

              <svg class="warning-icon" viewBox="0 0 64 64">
                <polygon points="32,6 60,56 4,56" fill="none" stroke="#FF6A1A" stroke-width="6" stroke-linejoin="round" />
                <line x1="32" y1="24" x2="32" y2="40" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round" />

    <script>
      const tl = gsap.timeline({ paused: true });

      // Measure SVG path for deterministic draw
      const docPath = document.getElementById("doc-path");
      if (docPath) {
        const len = docPath.getTotalLength();
        docPath.style.strokeDasharray = len;
        docPath.style.strokeDashoffset = len;
      }

      // ==========================================
      // SHOT 1 CHOREOGRAPHY (0.0s -> 6.19s)
      // ==========================================

      // Camera: Slow pan left across the wide scene
      tl.fromTo(
        "#shot1-img",
        { x: 0, scale: 1.05 },
        { x: -90, scale: 1.15, duration: 6.19, ease: "none" },
        0
      );

      // Archival Stamp entrance
      tl.fromTo(
        "#shot1-badge",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.3
      );

      // Diplomatic prestige seal appears
      tl.fromTo(
        "#shot1-seal",
        { scale: 0.85, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.7
      );

      // At 4.32s: The Prestige Seal shatters/shrinks as the blow strikes
      tl.to(
        "#shot1-seal",
        { scale: 0.7, opacity: 0, duration: 0.25, ease: "power2.in" },
        4.28
      );

      // Slash line cuts across
      tl.fromTo(
        "#shot1-slash",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.2, ease: "power4.out" },
        4.30
      );

      // PUNCH PHRASE entrance (atMs: 11820 -> relative 4.32s)
      tl.fromTo(
        "#shot1-punch-card",
        { scale: 1.3, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power4.out" },
        4.32
      );

      // ==========================================
      // SHOT 2 CHOREOGRAPHY (6.19s -> 10.0s)
      // ==========================================

      // Camera: Zoom-in into camera lenses and reporters
      tl.fromTo(
        "#shot2-img",
        { scale: 1.0 },
        { scale: 1.18, duration: 3.81, ease: "none" },
        6.19
      );

      // Shot 2 Archival Badge
      tl.fromTo(
        "#shot2-badge",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        6.45
      );

      // Label & Doc Icon Entrance (atMs: 14900 -> relative 7.4s)
      tl.fromTo(
        "#shot2-doc-card",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        7.4
      );

      // Animate Doc SVG path drawing
      if (docPath) {
        tl.to(
          docPath,
          { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
          7.45
        );
      }

      // Register timeline on HyperFrames registry
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s02"] = tl;
    </script>
