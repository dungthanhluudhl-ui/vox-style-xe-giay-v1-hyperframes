  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #e7e3d9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Composition Root */
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #e7e3d9;
      }

      /* Background Grid */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
        opacity: 0.6;
        pointer-events: none;
      }

      /* Base Clip Styling */
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .shot-inner {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      /* Hero Media Container */
      .media-frame {
        position: absolute;
        inset: -40px;
        overflow: hidden;
      }

      .hero-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      /* Spotlight Vignette (dark radial gradient for psychological tension) */
      .spotlight-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 48%,
          rgba(20, 20, 20, 0.08) 22%,
          rgba(20, 20, 20, 0.58) 68%,
          rgba(14, 14, 14, 0.88) 100%
        );
        mix-blend-mode: multiply;
        pointer-events: none;
      }

      /* Permanent Bottom Brand Bar */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 14px;
        background: #ff6a1a;
        z-index: 100;
      }

      /* Documentary Header Archive Tag */
      .top-archive-badge {
        position: absolute;
        top: 180px;
        left: 60px;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        background: #141414;
        padding: 10px 22px;
        border-radius: 4px;
        border-left: 5px solid #ff6a1a;
        z-index: 70;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      .archive-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ff6a1a;
      }

      .archive-text {
        font-size: 20px;
        font-weight: 700;
        color: #f7f4ec;
        letter-spacing: 2px;
      }

      /* Warning Card (Shot 1) */
      .warning-card {
        position: absolute;
        top: 290px;
        left: 60px;
        right: 60px;
        display: flex;
        align-items: center;
        gap: 28px;
        background: #141414;
        padding: 28px 36px;
        border-left: 10px solid #ff6a1a;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
        z-index: 60;
        transform-origin: left center;
        will-change: transform, opacity;
      }

      .warning-icon-box {
        width: 68px;
        height: 68px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
      }

      .warning-svg {
        width: 64px;
        height: 64px;
        display: block;
      }

      .warning-tag {
        font-size: 20px;
        font-weight: 700;
        color: #ff6a1a;
        letter-spacing: 2px;
        margin-bottom: 4px;
      }

      .warning-heading {
        font-size: 46px;
        font-weight: 900;
        color: #f7f4ec;
        letter-spacing: -0.5px;
        line-height: 1.18;
      }

      /* Diagram Container (Shot 2) */
      .diagram-container {
        position: absolute;
        top: 360px;
        left: 60px;
        width: 960px;
        height: 600px;
        z-index: 55;
        pointer-events: none;
        transform-origin: center center;
        will-change: transform, opacity;
      }

      .diagram-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      /* Punch Phrase Card (Shot 2) */
      .punch-card {
        position: absolute;
        top: 1100px;
        left: 60px;
        right: 60px;
        background: #141414;
        padding: 38px 48px 42px;
        border-left: 12px solid #ff6a1a;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
        z-index: 60;
        transform-origin: left center;
        will-change: transform, opacity;
      }

      .punch-badge {
        font-size: 22px;
        font-weight: 900;
        color: #ff6a1a;
        letter-spacing: 3px;
        margin-bottom: 12px;
      }

      .punch-title {
        font-size: 64px;
        font-weight: 900;
        color: #f7f4ec;
        line-height: 1.15;
        letter-spacing: -1px;
        margin: 0;
      }

      .punch-accent-line {
        width: 100%;
        height: 5px;
        background: #ff6a1a;
        margin-top: 24px;
        transform-origin: left;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s06"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="10"
    >
      <!-- Global Grid Background -->
      <div class="bg-grid"></div>

      <!-- Global Documentary Tag (Upper Safe Zone) -->
      <div class="top-archive-badge">
        <span class="archive-dot"></span>
        <span class="archive-text">HỒ SƠ ĐỐI ĐẦU • 5.1989</span>
      </div>

      <!-- ============================================================ -->
      <!-- SHOT 1: S06-1 (0.0s - 5.0s) - Cảnh báo sai lầm, wobble-drop  -->
      <!-- ============================================================ -->
      <section id="shot-1" class="clip" data-start="0" data-duration="5">
        <div id="shot-1-inner" class="shot-inner">
          <div class="media-frame">
            <img
              id="img-s1"

              src="assets/img-01-interrogation-confrontation-cutout-map.jpeg"
              alt="Cuộc đối chất căng thẳng về chính sách thiết quân luật"
            />
          </div>

          <!-- Spotlight Vignette -->
          <div class="spotlight-vignette"></div>

          <!-- Overlay: Warning Label -->
          <div id="s1-warning-card" class="warning-card">
            <div class="warning-icon-box">
              <svg class="warning-svg" viewBox="0 0 48 48">
                <polygon
                  class="warning-poly"
                  points="24,6 44,42 4,42"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="4.5"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                />
                <line
                  id="warning-line"
                  x1="24"
                  y1="18"
                  x2="24"
                  y2="28"
                  stroke="#FF6A1A"
                  stroke-width="4.5"
                  stroke-linecap="round"
                />
                <circle id="warning-dot" cx="24" cy="35" r="2.8" fill="#FF6A1A" />
              </svg>
            </div>
            <div class="warning-text-group">
              <div class="warning-tag">TRIỆU TỬ DƯƠNG</div>
              <div class="warning-heading">CẢNH BÁO SAI LẦM</div>
            </div>
          </div>
        </div>
      </section>

      <!-- ============================================================ -->
      <!-- SHOT 2: S06-2 (5.0s - 10.0s) - Pan sang bản đồ, mũi tên cam  -->
      <!-- ============================================================ -->
      <section id="shot-2" class="clip" data-start="5" data-duration="5">
        <div id="shot-2-inner" class="shot-inner">
          <div class="media-frame">
            <img
              id="img-s2"
              class="hero-image"
              src="assets/img-01-interrogation-confrontation-cutout-map.jpeg"
              alt="Bản đồ phân mảnh và nguy cơ leo thang"
            />
          </div>

          <!-- Spotlight Vignette -->
          <div class="spotlight-vignette"></div>

          <!-- Overlay: Diagram (Arrow piercing boundary into conflict) -->
          <div id="s2-diagram" class="diagram-container">
            <svg class="diagram-svg" viewBox="0 0 960 600" fill="none">
              <!-- Boundary Rings -->
              <circle
                class="diagram-ring"
                cx="500"
                cy="300"
                r="180"
                stroke="#FF6A1A"
                stroke-width="3.5"
                stroke-dasharray="10 8"
                opacity="0.75"
              />
              <circle
                class="diagram-ring"
                cx="500"
                cy="300"
                r="260"
                stroke="rgba(247,244,236,0.3)"
                stroke-width="2"
                stroke-dasharray="14 10"
              />
              <circle
                class="diagram-ring"
                cx="500"
                cy="300"
                r="80"
                stroke="#FF6A1A"
                stroke-width="2"
                opacity="0.5"
              />

              <!-- Center Crosshair Guideline -->
              <line
                x1="120"
                y1="300"
                x2="840"
                y2="300"
                stroke="rgba(247,244,236,0.25)"
                stroke-width="1.5"
                stroke-dasharray="6 6"
              />

              <!-- Urban Boundary Marker Label -->
              <rect
                x="370"
                y="36"
                width="260"
                height="38"
                rx="4"
                fill="#141414"
                stroke="#FF6A1A"
                stroke-width="2"
              />
              <text
                x="500"
                y="62"
                text-anchor="middle"
                fill="#F7F4EC"
                font-family="'Be Vietnam Pro', sans-serif"
                font-size="19"
                font-weight="900"
                letter-spacing="2"
              >
                RANH GIỚI LÒNG DÂN
              </text>

              <!-- Piercing Bold Arrow Shaft -->
              <line
                id="diagram-arrow-shaft"
                x1="80"
                y1="300"
                x2="690"
                y2="300"
                stroke="#FF6A1A"
                stroke-width="15"
                stroke-linecap="round"
                stroke-dasharray="640"
                stroke-dashoffset="640"
              />

              <!-- Arrowhead -->
              <polygon id="diagram-arrow-head" points="685,274 745,300 685,326" fill="#FF6A1A" />

              <!-- Action Label On Shaft -->
              <g id="diagram-shaft-label">
                <rect x="150" y="244" width="240" height="36" rx="4" fill="#141414" />
                <text
                  x="270"
                  y="268"
                  text-anchor="middle"
                  fill="#FF6A1A"
                  font-family="'Be Vietnam Pro', sans-serif"
                  font-size="17"
                  font-weight="900"
                  letter-spacing="1"
                >
                  PHẢN ỨNG CỨNG RẮN
                </text>
              </g>

              <!-- Escalation Conflict Tag -->
              <g id="diagram-impact-tag">
                <polygon
                  points="765,248 905,248 925,300 905,352 765,352"
                  fill="#141414"
                  stroke="#FF6A1A"
                  stroke-width="2.5"
                />
                <text
                  x="840"
                  y="284"
                  text-anchor="middle"
                  fill="#FF6A1A"
                  font-family="'Be Vietnam Pro', sans-serif"
                  font-size="16"
                  font-weight="900"
                  letter-spacing="1.5"
                >
                  BÙNG NỔ
                </text>
                <text
                  x="840"
                  y="320"
                  text-anchor="middle"
                  fill="#F7F4EC"
                  font-family="'Be Vietnam Pro', sans-serif"
                  font-size="20"
                  font-weight="900"
                >
                  XUNG ĐỘT
                </text>
              </g>
            </svg>
          </div>

          <!-- Overlay: Punch Phrase Card -->
          <div id="s2-punch-card" class="punch-card">
            <div class="punch-badge">BÁO ĐỘNG LỊCH SỬ</div>
            <h1 class="punch-title">HẬU QUẢ KHÔN LƯỜNG</h1>
            <div class="punch-accent-line"></div>
          </div>
        </div>
      </section>

      <!-- Fixed Signature Bottom Brand Bar -->
      <div class="bottom-brand-bar"></div>
    </div>

    <!-- Animation Orchestration -->
    <script>
      // Single paused timeline registered strictly on window.__timelines["scene-s06"]
      const tl = gsap.timeline({ paused: true });

      // ============================================================
      // SHOT 1 CHOREOGRAPHY (t = 0.0s to 5.0s)
      // ============================================================

      // Wobble-drop entrance on Shot 1 container (heavy, weighted settle)
      tl.fromTo(
        "#shot-1-inner",
        { y: -130, rotation: -3.5, scale: 1.07, opacity: 0 },
        { y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" },
        0
      );

      // Slow camera zoom-in focused on the pointing interrogator
      tl.fromTo(
        "#img-s1",
        { scale: 1.18, x: 20, y: 10 },
        { scale: 1.35, x: -35, y: -25, duration: 5.0, ease: "none" },
        0
      );

      // Warning Card arrival at 1.26s (atMs: 46760, relative: 1.26s)
      tl.fromTo(
        "#s1-warning-card",
        { y: 50, opacity: 0, scale: 0.92 },
        { y: 0, opacity: 1, scale: 1, duration: 0.52, ease: "power3.out" },
        1.26
      );

      // Warning Icon vector path draw
      tl.fromTo(
        ".warning-poly",
        { strokeDasharray: 140, strokeDashoffset: 140 },
        { strokeDashoffset: 0, duration: 0.46, ease: "power2.out" },
        1.34
      );

      tl.fromTo(
        "#warning-line",
        { opacity: 0, y: -6 },
        { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" },
        1.55
      );

      tl.fromTo(
        "#warning-dot",
        { scale: 0, transformOrigin: "24px 35px" },
        { scale: 1, duration: 0.22, ease: "power3.out" },
        1.65
      );

      // Warning Card exit after holding 2.4s (1.26 + 2.4 = 3.66s)
      tl.to(
        "#s1-warning-card",
        { y: -24, opacity: 0, duration: 0.42, ease: "power2.in" },
        3.66
      );

      // ============================================================
      // SHOT 2 CHOREOGRAPHY (t = 5.0s to 10.0s)
      // ============================================================

      // Shot 2 camera pan-right across the desk to the frightened figure and urban map
      tl.fromTo(
        "#img-s2",
        { scale: 1.34, x: 50, y: -15 },
        { scale: 1.48, x: -60, y: -40, duration: 5.0, ease: "sine.out" },
        5.0
      );

      // Diagram container arrival at 6.03s (atMs: 51530, relative: 6.03s)
      tl.fromTo(
        "#s2-diagram",
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        6.03
      );

      // Boundary rings concentric expand
      tl.fromTo(
        ".diagram-ring",
        { opacity: 0, scale: 0.75, transformOrigin: "500px 300px" },
        { opacity: 0.75, scale: 1, duration: 0.65, ease: "power2.out", stagger: 0.08 },
        6.12
      );

      // Bold orange arrow pierces through urban boundary line into conflict center
      tl.fromTo(
        "#diagram-arrow-shaft",
        { strokeDashoffset: 640 },
        { strokeDashoffset: 0, duration: 0.52, ease: "power4.out" },
        6.34
      );

      // Arrowhead snaps forward on impact
      tl.fromTo(
        "#diagram-arrow-head",
        { scale: 0, opacity: 0, transformOrigin: "685px 300px" },
        { scale: 1, opacity: 1, duration: 0.24, ease: "power3.out" },
        6.75
      );

      // Piercing action label fades in
      tl.fromTo(
        "#diagram-shaft-label",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" },
        6.58
      );

      // Impact conflict badge triggers
      tl.fromTo(
        "#diagram-impact-tag",
        { scale: 0, opacity: 0, transformOrigin: "765px 300px" },
        { scale: 1, opacity: 1, duration: 0.38, ease: "power3.out" },
        6.88
      );

      // Punch Phrase Card arrival at 6.63s (atMs: 52130, relative: 6.63s)
      tl.fromTo(
        "#s2-punch-card",
        { y: 55, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.52, ease: "power3.out" },
        6.63
      );

      // Punch Card accent line sweep
      tl.fromTo(
        ".punch-accent-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.44, ease: "power3.out" },
        6.96
      );

      // Punch Phrase exit after holding 2.2s (6.63 + 2.2 = 8.83s)
      tl.to(
        "#s2-punch-card",
        { y: -20, opacity: 0, duration: 0.45, ease: "power2.in" },
        8.83
      );

      // Diagram gentle settle before scene cut
      tl.to(
        "#s2-diagram",
        { opacity: 0, scale: 0.96, duration: 0.42, ease: "power2.in" },
        9.45
      );

      // Register timeline strictly on window.__timelines
      window.__timelines["scene-s06"] = tl;
    </script>
  
    </template>
  </body>
</html>
