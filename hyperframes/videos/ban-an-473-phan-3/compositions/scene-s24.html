    // Single Paused GSAP Timeline for Deterministic HyperFrames Seeking

    tl.fromTo(
      "#camera-rig",
      { scale: 1.22, opacity: 0 },

      "#defendant-silhouette",

      0.6
    );
    tl.fromTo(
      "#defendant-silhouette",
      { y: -6 },
      { y: 0, duration: 1.0, ease: "sine.inOut" },
      1.6
    );

    tl.fromTo(
      "#an-treo-badge",
      { scale: 0.5, opacity: 0 },
      { scale: 1.0, opacity: 1.0, duration: 0.35, ease: "power3.out" },
      0.60
    );

    // 4. Overlay 1: "Được giảm 6 tháng" arrives (atMs: 196160 -> 0.90s)
    tl.fromTo(
      "#label-reduction",
      { y: -30, opacity: 0, scale: 0.92 },
      { y: 0, opacity: 1.0, scale: 1.0, duration: 0.45, ease: "power3.out" },
      0.90
    );

    // 5. The Slam: Iron Prison Doors slam shut (2.40s)
    // Single fromTo with default immediateRender keeps doors open at x: ±210 from t=0 to 2.40s
    tl.fromTo(
      "#door-left",
      { x: -210 },
      { x: 0, duration: 0.18, ease: "power4.in" },
      2.40
    );
    tl.fromTo(
      "#door-right",
      { x: 210 },
      { x: 0, duration: 0.18, ease: "power4.in" },
      2.40
    );

      "#prison-frame",
      { x: -14 },
      { x: 0, duration: 0.25, ease: "elastic.out(1.2, 0.3)" },
      2.58
    );

    // Padlock drops down and snaps locked
    tl.fromTo(
      "#padlock-group",
      { y: -80, opacity: 0, scale: 1.5 },
      { y: 0, opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" },
      2.58
    );

    // Shockwave Ring Expanding (animating SVG attribute r via attr plugin)

      "#impact-ring",
      { attr: { r: 10 }, opacity: 1, strokeWidth: 8 },
      { attr: { r: 160 }, opacity: 0, strokeWidth: 1, duration: 0.35, ease: "power2.out" },

    tl.fromTo("#shard-3", { x: 0, y: 0, rotation: 0, opacity: 1 }, { x: 150, y: 210, rotation: 65, opacity: 0, duration: 0.55, ease: "power2.in" }, 2.58);
    tl.fromTo("#shard-4", { x: 0, y: 0, rotation: 0, opacity: 1 }, { x: -160, y: 310, rotation: -70, opacity: 0, duration: 0.55, ease: "power2.in" }, 2.58);
    tl.fromTo("#shard-5", { x: 0, y: 0, rotation: 0, opacity: 1 }, { x: -30, y: 340, rotation: -25, opacity: 0, duration: 0.55, ease: "power2.in" }, 2.58);
