  <script>
    function formatNumberVN(val) {
      return Math.round(val).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    const riseArrow = document.getElementById("rise-arrow");
    const riseHead = document.getElementById("rise-head");
    if (riseArrow && riseHead) {
      const lenArrow = riseArrow.getTotalLength();
      riseArrow.style.strokeDasharray = lenArrow;
      riseArrow.style.strokeDashoffset = lenArrow;
      const lenHead = riseHead.getTotalLength();
      riseHead.style.strokeDasharray = lenHead;
      riseHead.style.strokeDashoffset = lenHead;
    }

    const tl = gsap.timeline({ paused: true });

    // ENTRANCE: Header, chart grid lines, ticks and axis values
    tl.fromTo("#header-block", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.10);
    tl.fromTo(".chart-grid-line", { scaleX: 0 }, { scaleX: 1, duration: 0.50, stagger: 0.05, ease: "power2.out" }, 0.15);
    tl.fromTo(".tick-mark", { scaleX: 0 }, { scaleX: 1, duration: 0.30, stagger: 0.05, ease: "power2.out" }, 0.22);
    tl.fromTo(".axis-val", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35, stagger: 0.05, ease: "power2.out" }, 0.20);

    // ==========================================
    // SHOT S05-1: TIẾN (0.00s - 4.73s)
    // ==========================================
    tl.fromTo("#footer-1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.45);
    tl.fromTo("#bar-1", { scaleY: 0 }, { scaleY: 1, duration: 1.60, ease: "power3.out" }, 0.55);
    tl.fromTo("#val-box-1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.50, ease: "power2.out" }, 0.55);

    const countTien = { val: 0 };
    tl.fromTo(countTien, 
      { val: 0 }, 
      {
        val: 1632, duration: 1.60, ease: "power2.out",
        onUpdate: () => {
          const el = document.getElementById("num-1");
          if (el) el.textContent = formatNumberVN(countTien.val);
        }
      }, 
      0.55
    );

    // Punch Card 1 (TIẾN: 1.632) xuất hiện lúc 2.94s, ẩn lúc 4.55s
    tl.fromTo("#punch-card-1", 
      { opacity: 0, y: 20, scale: 0.96 }, 
      { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power3.out" }, 
      2.94
    );
    tl.to("#rise-arrow", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 3.20);
    tl.to("#rise-head", { strokeDashoffset: 0, duration: 0.30, ease: "power2.out" }, 3.45);
    tl.to("#punch-card-1", { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" }, 4.55);

    // ==========================================
    // SHOT S05-2: SƠN (4.73s - 7.64s)
    // Camera pan nhẹ về phía cột Sơn
    // ==========================================
    tl.to("#camera-stage", { x: -30, duration: 0.9, ease: "power2.inOut" }, 4.73);

    tl.fromTo("#footer-2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 4.75);
    tl.fromTo("#bar-2", { scaleY: 0 }, { scaleY: 1, duration: 1.50, ease: "power3.out" }, 4.85);
    tl.fromTo("#val-box-2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.50, ease: "power2.out" }, 4.85);

    const countSon = { val: 0 };
    tl.fromTo(countSon, 
      { val: 0 }, 
      {
        val: 2066, duration: 1.55, ease: "power2.out",
        onUpdate: () => {
          const el = document.getElementById("num-2");
          if (el) el.textContent = formatNumberVN(countSon.val);
        }
      }, 
      4.85
    );

    // Punch Card 2 (SƠN: 2.066) xuất hiện lúc 5.85s, ẩn lúc 7.45s
    tl.fromTo("#punch-card-2", 
      { opacity: 0, y: 20, scale: 0.96 }, 
      { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power3.out" }, 
      5.85
    );
    tl.to("#punch-card-2", { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" }, 7.45);

    // ==========================================
    // SHOT S05-3: ĐỨC HUY (7.64s - 10.88s)
    // Camera zoom out nhẹ nhìn toàn cảnh 3 cột so sánh
    // ==========================================
    tl.to("#camera-stage", { x: 0, scale: 0.98, duration: 0.8, ease: "power2.inOut" }, 7.64);

    tl.fromTo("#footer-3", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 7.65);
    tl.fromTo("#bar-3", { scaleY: 0 }, { scaleY: 1, duration: 1.35, ease: "power3.out" }, 7.75);
    tl.fromTo("#val-box-3", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.50, ease: "power2.out" }, 7.75);

    const countHuy = { val: 0 };
    tl.fromTo(countHuy, 
      { val: 0 }, 
      {
        val: 1331, duration: 1.40, ease: "power2.out",
        onUpdate: () => {
          const el = document.getElementById("num-3");
          if (el) el.textContent = formatNumberVN(countHuy.val);
        }
      }, 
      7.75
    );

    // Punch Card 3 (ĐỨC HUY: 1.331) xuất hiện lúc 9.40s với icon density
    tl.fromTo("#punch-card-3", 
      { opacity: 0, y: 20, scale: 0.96 }, 
      { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power3.out" }, 
      9.40
    );
    tl.fromTo("#density-icon circle", 
      { scale: 0, opacity: 0, transformOrigin: "center center" }, 
      { scale: 1, opacity: 1, duration: 0.30, stagger: 0.05, ease: "power2.out" }, 
      9.65
    );

    window.__timelines["scene-s05"] = tl;
  </script>
