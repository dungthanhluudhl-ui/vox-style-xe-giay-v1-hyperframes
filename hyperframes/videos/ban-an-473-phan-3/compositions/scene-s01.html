<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      /* Paper grid texture */
      .grid-layer {
        position: absolute;
        inset: 0;
        background-size: 84px 84px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      }
      /* Cards and typography */
      .badge-pill {
        position: absolute;
        top: 190px;
        left: 48px;
        background: #141414;
        color: #F7F4EC;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 10px 24px;
        border-radius: 999px;
        border: 2px solid #FF6A1A;
        box-shadow: 4px 4px 0px rgba(20, 20, 20, 0.3);
        display: inline-flex;
        align-items: center;
        gap: 12px;
        z-index: 25;
      }
      .badge-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #FF6A1A;
        flex-shrink: 0;
      }
      .headline-card {
        position: absolute;
        top: 260px;
        left: 48px;
        right: 48px;
        background: #F5F0E4;
        border: 3.5px solid #141414;
        border-radius: 16px;
        padding: 26px 32px;
        box-shadow: 8px 8px 0px #FF6A1A;
        z-index: 25;
      }
      .headline-title {
        margin: 0;
        font-size: 46px;
        font-weight: 900;
        line-height: 1.22;
        color: #141414;
        letter-spacing: -0.5px;
      }
      .headline-sub {
        margin: 12px 0 0 0;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.36;
        color: rgba(20, 20, 20, 0.82);
      }
      .callout-wrapper {
        position: absolute;
        top: 920px;
        left: 48px;
        right: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        z-index: 25;
      }
      .callout-card {
        background: #141414;
        border: 3.5px solid #FF6A1A;
        border-radius: 16px;
        padding: 20px 28px;
        box-shadow: 6px 6px 0px rgba(255, 106, 26, 0.45);
        flex: 1;
      }
      .callout-tag {
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 2.5px;
        color: #FF6A1A;
        text-transform: uppercase;
      }
      .callout-text {
        font-size: 38px;
        font-weight: 900;
        color: #F7F4EC;
        line-height: 1.2;
        margin-top: 6px;
      }
      .callout-note {
        font-size: 20px;
        font-weight: 700;
        color: rgba(247, 244, 236, 0.76);
        margin-top: 6px;
      }
      .icon-box {
        width: 110px;
        height: 110px;
        background: #141414;
        border: 3.5px solid #FF6A1A;
        border-radius: 16px;
        box-shadow: 6px 6px 0px rgba(255, 106, 26, 0.45);
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s01"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="9.09"
      data-layout-allow-overflow
    >
      <!-- Base Ivory Layer -->
      <div id="base-paper" data-layout-ignore style="position: absolute; inset: 0; background-color: #E7E3D9; z-index: 0;"></div>

      <!-- Video Shot 1: 0s to 5.52s (Trim 0 to 5.5s) -->
      <video
        id="vid-shot-1"
        data-start="0"
        data-duration="5.52"
        data-media-start="0"
        data-track-index="0"
        muted
        playsinline
        src="assets/vid-07-independent-crime-network-diagram.mp4"
        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; transform-origin: 50% 50%;"
      ></video>

      <!-- Video Shot 2: 5.52s to 9.09s (Trim 4.4 to 8.0s) -->
      <video
        id="vid-shot-2"
        data-start="5.52"
        data-duration="3.57"
        data-media-start="4.4"
        data-track-index="0"
        muted
        playsinline
        src="assets/vid-07-independent-crime-network-diagram.mp4"
        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; transform-origin: 50% 50%;"
      ></video>

      <!-- Unified Paper Grid & Grain Overlay (Multiply Blend) -->
      <div id="paper-texture-overlay" data-layout-ignore style="position: absolute; inset: 0; pointer-events: none; z-index: 10; mix-blend-mode: multiply;">
        <div class="grid-layer"></div>
        <svg width="1080" height="1920" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.18; pointer-events: none;">
          <filter id="paper-grain">
            <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" />
            <feColorMatrix type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.08  0 0 0 0 0.08  0 0 0 0.18 0" />
          </filter>
          <rect width="100%" height="100%" filter="url(#paper-grain)" />
        </svg>
      </div>

      <!-- SHOT 1 OVERLAYS (0s to 5.52s) -->
      <div
        id="shot1-overlays"
        class="clip"
        data-start="0"
        data-duration="5.52"
        data-track-index="1"
        data-layout-allow-overflow
        style="position: absolute; inset: 0; pointer-events: none; z-index: 20;"
      >
        <!-- Top Editorial Badge -->
        <div id="s1-badge" class="badge-pill">
          <span class="badge-dot"></span>
          <span>KẾT QUẢ ĐIỀU TRA</span>
        </div>

        <!-- Headline Statement -->
        <div id="s1-headline" class="headline-card">
          <h1 class="headline-title">TIẾN TÁCH BIỆT HOÀN TOÀN</h1>
          <p class="headline-sub">Không đăng ảnh hay video vào nhóm do Sơn và Huy lập</p>
        </div>

        <!-- Isolation Boundary Diagram -->
        <div id="s1-barrier-container" style="position: absolute; top: 820px; left: 48px; right: 48px; height: 80px;">
          <svg viewBox="0 0 984 80" width="100%" height="80" style="overflow: visible;">
            <path id="barrier-path-1" class="draw-path" d="M 0 40 L 984 40" fill="none" stroke="#FF6A1A" stroke-width="6" stroke-dasharray="16 12" stroke-linecap="round" />
            <path id="barrier-hashes-1" class="draw-path" d="M 0 20 L 0 60 M 492 18 L 492 62 M 984 20 L 984 60" fill="none" stroke="#FF6A1A" stroke-width="5" stroke-linecap="round" />
          </svg>
        </div>

        <!-- Callout: Label + Ban Icon -->
        <div id="s1-callout-wrapper" class="callout-wrapper">
          <div id="s1-ban-icon" class="icon-box">
            <svg viewBox="0 0 100 100" width="76" height="76">
              <!-- Outer Circle -->
              <path id="ban-circle" class="draw-path" d="M 50 12 A 38 38 0 1 1 49.99 12 Z" fill="none" stroke="#FF6A1A" stroke-width="8" stroke-linecap="round" />
              <!-- Diagonal Slash -->
              <path id="ban-slash" class="draw-path" d="M 23 23 L 77 77" fill="none" stroke="#FF6A1A" stroke-width="8" stroke-linecap="round" />
            </svg>
          </div>
          <div id="s1-label-card" class="callout-card">
            <div class="callout-tag">TRẠNG THÁI</div>
            <div class="callout-text">Ranh giới cách ly</div>
            <div class="callout-note">Không ghi nhận hoạt động đăng tải</div>
          </div>
        </div>
      </div>

      <!-- SHOT 2 OVERLAYS (5.52s to 9.09s) -->
      <div
        id="shot2-overlays"
        class="clip"
        data-start="5.52"
        data-duration="3.57"
        data-track-index="1"
        data-layout-allow-overflow
        style="position: absolute; inset: 0; pointer-events: none; z-index: 20;"
      >
        <!-- Top Editorial Badge -->
        <div id="s2-badge" class="badge-pill">
          <span class="badge-dot"></span>
          <span>QUAN HỆ ĐỐI XỨNG</span>
        </div>

        <!-- Headline Statement -->
        <div id="s2-headline" class="headline-card">
          <h1 class="headline-title">SƠN &amp; HUY CŨNG KHÔNG ĐĂNG</h1>
          <p class="headline-sub">Ngược lại, cả hai không đăng vào bất kỳ nhóm nào của Tiến</p>
        </div>

        <!-- Blocked Cross-Interaction Barrier -->
        <div id="s2-barrier-container" style="position: absolute; top: 820px; left: 48px; right: 48px; height: 80px;">
          <svg viewBox="0 0 984 80" width="100%" height="80" style="overflow: visible;">
            <path id="barrier-path-2" class="draw-path" d="M 0 40 L 984 40" fill="none" stroke="#FF6A1A" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round" />
            <path id="barrier-arrows-2" class="draw-path" d="M 430 22 L 470 40 L 430 58 M 554 22 L 514 40 L 554 58" fill="none" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
            <path id="barrier-cross-2" class="draw-path" d="M 492 14 L 492 66" fill="none" stroke="#141414" stroke-width="8" stroke-linecap="round" />
          </svg>
        </div>

        <!-- Callout: Label + Phone Icon -->
        <div id="s2-callout-wrapper" class="callout-wrapper">
          <div id="s2-phone-icon" class="icon-box">
            <svg viewBox="0 0 100 100" width="76" height="76">
              <!-- Phone Body -->
              <path id="phone-body" class="draw-path" d="M 36 14 L 64 14 A 10 10 0 0 1 74 24 L 74 76 A 10 10 0 0 1 64 86 L 36 86 A 10 10 0 0 1 26 76 L 26 24 A 10 10 0 0 1 36 14 Z" fill="none" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
              <!-- Speaker Notch & Home Indicator -->
              <path id="phone-details" class="draw-path" d="M 42 22 L 58 22 M 43 78 L 57 78" fill="none" stroke="#F7F4EC" stroke-width="4" stroke-linecap="round" />
              <!-- Diagonal Block Slash -->
              <path id="phone-slash" class="draw-path" d="M 36 36 L 64 64" fill="none" stroke="#FF6A1A" stroke-width="5" stroke-linecap="round" />
            </svg>
          </div>
          <div id="s2-label-card" class="callout-card">
            <div class="callout-tag">KẾT NỐI</div>
            <div class="callout-text">Không tương tác chéo</div>
            <div class="callout-note">Hai hệ sinh thái chat vận hành độc lập</div>
          </div>
        </div>
      </div>

      <!-- Signature Vox Orange Bottom Bar -->
      <div id="bottom-brand-bar" data-layout-ignore style="position: absolute; bottom: 0; left: 0; right: 0; height: 14px; background: #FF6A1A; z-index: 100;"></div>
    </div>

    <!-- Animation Orchestration -->
    <script>
      // 1. Measure and prepare all progressive SVG self-drawing paths
      document.querySelectorAll(".draw-path").forEach((p) => {
        const len = Math.ceil(p.getTotalLength ? p.getTotalLength() : 300);
        p.style.strokeDasharray = `${len} ${len}`;
        p.style.strokeDashoffset = `${len}`;
      });

      // 2. Build single paused timeline
      const tl = gsap.timeline({ paused: true });

      // ==========================================
      // SHOT 1: 0.00s -> 5.52s
      // ==========================================

      // Entrance unfold + continuous zoom-in camera motion on Video 1
      tl.fromTo(
        "#vid-shot-1",
        { scale: 1.05, clipPath: "inset(0% 0% 100% 0%)" },
        { scale: 1.05, clipPath: "inset(0% 0% 0% 0%)", duration: 0.65, ease: "power3.out" },
        0
      );
      tl.to(
        "#vid-shot-1",
        { scale: 1.15, duration: 4.87, ease: "sine.inOut" },
        0.65
      );

      // Top badge and headline card enter
      tl.fromTo(
        "#s1-badge",
        { y: -25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.2
      );
      tl.fromTo(
        "#s1-headline",
        { y: 35, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" },
        0.35
      );

      // Shot 1 Overlays (atMs: 1690 -> 1.69s)
      // Barrier line draws across
      const barrier1 = document.getElementById("barrier-path-1");
      const lenB1 = Math.ceil(barrier1.getTotalLength());
      tl.fromTo(
        "#barrier-path-1",
        { strokeDashoffset: lenB1 },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        1.69
      );
      const barrierH1 = document.getElementById("barrier-hashes-1");
      const lenBH1 = Math.ceil(barrierH1.getTotalLength());
      tl.fromTo(
        "#barrier-hashes-1",
        { strokeDashoffset: lenBH1 },
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        1.85
      );

      // Label card pops in (holdMs: 2500)
      tl.fromTo(
        "#s1-label-card",
        { scale: 0.8, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.69
      );

      // Icon: ban self-draws (atMs: 1930 -> 1.93s, holdMs: 2000)
      tl.fromTo(
        "#s1-ban-icon",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" },
        1.93
      );
      const banCircle = document.getElementById("ban-circle");
      const lenBC = Math.ceil(banCircle.getTotalLength());
      tl.fromTo(
        "#ban-circle",
        { strokeDashoffset: lenBC },
        { strokeDashoffset: 0, duration: 0.48, ease: "power2.out" },
        1.93
      );
      const banSlash = document.getElementById("ban-slash");
      const lenBS = Math.ceil(banSlash.getTotalLength());
      tl.fromTo(
        "#ban-slash",
        { strokeDashoffset: lenBS },
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        2.18
      );

      // Gentle exit transition for Shot 1 elements before cut
      tl.to(
        ["#s1-callout-wrapper", "#s1-barrier-container"],
        { opacity: 0, y: -16, duration: 0.35, ease: "power2.in" },
        4.85
      );
      tl.to(
        ["#s1-headline", "#s1-badge"],
        { opacity: 0, duration: 0.3, ease: "power2.in" },
        5.15
      );

      // ==========================================
      // SHOT 2: 5.52s -> 9.09s
      // ==========================================

      // Hard cut at 5.52s; Camera pan-right on Video 2
      tl.fromTo(
        "#vid-shot-2",
        { scale: 1.12, x: 25 },
        { scale: 1.12, x: -65, duration: 3.57, ease: "sine.inOut" },
        5.52
      );

      // Top badge and headline card enter
      tl.fromTo(
        "#s2-badge",
        { y: -25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        5.65
      );
      tl.fromTo(
        "#s2-headline",
        { y: 35, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        5.8
      );

      // Dashed barrier and cross-blocker draw across
      const barrier2 = document.getElementById("barrier-path-2");
      const lenB2 = Math.ceil(barrier2.getTotalLength());
      tl.fromTo(
        "#barrier-path-2",
        { strokeDashoffset: lenB2 },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        6.2
      );
      const barrierA2 = document.getElementById("barrier-arrows-2");
      const lenBA2 = Math.ceil(barrierA2.getTotalLength());
      tl.fromTo(
        "#barrier-arrows-2",
        { strokeDashoffset: lenBA2 },
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        6.45
      );
      const barrierC2 = document.getElementById("barrier-cross-2");
      const lenBC2 = Math.ceil(barrierC2.getTotalLength());
      tl.fromTo(
        "#barrier-cross-2",
        { strokeDashoffset: lenBC2 },
        { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
        6.75
      );

      // Label card pops in (atMs: 6950 -> 6.95s, holdMs: 2000)
      tl.fromTo(
        "#s2-label-card",
        { scale: 0.8, opacity: 0, y: 20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        6.95
      );

      // Icon: phone self-draws (atMs: 7730 -> 7.73s, holdMs: 1300)
      tl.fromTo(
        "#s2-phone-icon",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        7.73
      );
      const phoneBody = document.getElementById("phone-body");
      const lenPB = Math.ceil(phoneBody.getTotalLength());
      tl.fromTo(
        "#phone-body",
        { strokeDashoffset: lenPB },
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        7.73
      );
      const phoneDetails = document.getElementById("phone-details");
      const lenPD = Math.ceil(phoneDetails.getTotalLength());
      tl.fromTo(
        "#phone-details",
        { strokeDashoffset: lenPD },
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        8.0
      );
      const phoneSlash = document.getElementById("phone-slash");
      const lenPS = Math.ceil(phoneSlash.getTotalLength());
      tl.fromTo(
        "#phone-slash",
        { strokeDashoffset: lenPS },
        { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" },
        8.2
      );

      // 3. Register root timeline
      window.__timelines["scene-s01"] = tl;
    </script>
  
    </template>
  </body>
</html>
