    <template>

      <style>
    * {

    body {

    #root {

    /* Spotlight Background: Paper Grid + Vignette + Grain */
    .bg-canvas {
      position: absolute;
      inset: 0;
      background-color: #E7E3D9;
      background-image:
        linear-gradient(rgba(20, 20, 20, 0.26) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(20, 20, 20, 0.26) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      z-index: 1;
    }

    .bg-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(231, 227, 217, 0) 32%, rgba(20, 20, 20, 0.38) 100%);
      pointer-events: none;
      z-index: 2;
    }

    .bg-grain {
      position: absolute;
      inset: 0;
      opacity: 0.18;
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 3;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Fixed Vox Orange Signature Bottom Bar */
    .bottom-signature-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 16px;
      background: #FF6A1A;
      z-index: 999;
    }

    /* Standardized timed clips */
    .clip {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* Collage Hero Frame per Shot */
    .collage-frame {
      position: absolute;
      top: 360px;
      left: 60px;
      width: 960px;
      height: 920px;
      border: 5px solid #141414;
      border-radius: 16px;
      overflow: hidden;
      background: #F5F0E4;
      box-shadow: 14px 14px 0px rgba(20, 20, 20, 0.95);
      z-index: 12;
      will-change: transform;
    }

    .media-photo {
      position: absolute;
      width: 150%;
      height: 150%;
      object-fit: cover;
      top: -25%;
      left: -25%;
      filter: contrast(1.08) brightness(0.98);
      will-change: transform;
    }

    /* Strike Flash Layer */
    .strike-flash {
      position: absolute;
      inset: 0;
      background: #FFFFFF;
      mix-blend-mode: overlay;
      opacity: 0;
      pointer-events: none;
      z-index: 90;

    /* Headline Punch Containers */

      position: absolute;
      top: 175px;

      justify-content: center;

    .punch-card {

    .punch-pre-tag {

    .punch-title {

    .punch-title-light {

      border-radius: 6px;

    .punch-text-orange {

    /* Paper Stamps */
    .paper-stamp {
      position: absolute;
      padding: 10px 20px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 6px;
      z-index: 35;

    .stamp-benefit {

      background: #F5F0E4;

    }

    .stamp-danger {

    /* Fish Metaphor Card */
    .fish-metaphor-card {
      position: absolute;
      top: 1140px;
      left: 90px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #F5F0E4;
      border: 4px solid #141414;
      border-radius: 12px;
      padding: 14px 22px;
      box-shadow: 8px 8px 0px #141414;
      z-index: 35;
      will-change: transform, opacity;
    }

    .fish-metaphor-icon {
      width: 48px;

    }

    .fish-metaphor-text {
      font-size: 26px;
      font-weight: 900;

      line-height: 1.2;
      text-transform: uppercase;
    }

    /* Icon Badges */
    .icon-badge {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 35;
      will-change: transform, opacity;
    }

    .icon-check-badge {
      top: 390px;
      right: 90px;
      width: 120px;
      height: 120px;
      background: #141414;
      border: 5px solid #FF6A1A;
      border-radius: 50%;
      box-shadow: 8px 8px 0px rgba(20, 20, 20, 0.6);
    }

    .icon-scale-badge {
      top: 1010px;
      right: 90px;
      width: 160px;
      height: 160px;
      background: #141414;
      border: 5px solid #FF6A1A;
      border-radius: 20px;
      box-shadow: 10px 10px 0px rgba(20, 20, 20, 0.7);
    }

    /* Annotation Sticky Note */
    .annotation-card {
      position: absolute;
      top: 1330px;
      left: 60px;
      right: 60px;
      background: #141414;
      border: 4px solid #FF6A1A;
      border-radius: 14px;
      padding: 18px 24px;
      box-shadow: 8px 8px 0px rgba(20, 20, 20, 0.8);
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 35;
      will-change: transform, opacity;
    }

    .annotation-pointer {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      stroke: #FF6A1A;
      fill: none;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .annotation-text {
      font-size: 34px;
      font-weight: 900;
      color: #F7F4EC;
      line-height: 1.25;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .annotation-text span {
      color: #FF6A1A;
    }

    .draw-path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s30"
    data-width="1080"
    data-height="1920"
    data-duration="9.07"
  >
    <!-- Spotlight Background System -->
    <div class="bg-canvas"></div>
    <div class="bg-vignette"></div>
    <div class="bg-grain"></div>

    <!-- Permanent Signature Bottom Bar -->
    <div class="bottom-signature-bar"></div>

    <!-- ==================== SHOT 1: 0.00s - 4.35s ==================== -->
    <section id="shot-1" class="clip" data-start="0" data-duration="4.35" data-layout-allow-overflow>
      <!-- Strike Flash Overlay -->
      <div id="strike-flash" class="strike-flash"></div>

      <!-- Shot 1 Hero Collage Frame -->
      <div id="collage-frame-1" class="collage-frame">
        <img
          id="photo-1"
          class="media-photo"
          src="assets/img-06-scale-consequence-vs-benefit.jpeg"
          alt="Cán cân công lý - bên nhẹ"
        />
      </div>

      <!-- Cutout Stamp: Lợi ích trước mắt -->
      <div id="stamp-benefit-1" class="paper-stamp stamp-benefit">
        + LỢI ÍCH TRƯỚC MẮT
      </div>

      <!-- Metaphor Card: Giỏ cá nhỏ minh họa -->
      <div id="fish-card-1" class="fish-metaphor-card">
        <svg class="fish-metaphor-icon" viewBox="0 0 48 48" fill="none">
          <path d="M8 24C14 16 32 16 40 24C32 32 14 32 8 24Z" fill="#FF6A1A" stroke="#141414" stroke-width="3"/>
          <circle cx="16" cy="24" r="3" fill="#141414"/>
          <path d="M40 24L46 16V32L40 24Z" fill="#FF6A1A" stroke="#141414" stroke-width="3"/>
        </svg>
        <div class="fish-metaphor-text">TỐC ĐỘ BẮT CÁ</div>
      </div>

      <!-- Punch Overlay 1 (at 0.94s) -->
      <div id="punch-group-1" class="punch-container">
        <div class="punch-card">
          <div class="punch-pre-tag">THỦ ĐOẠN NGẮN HẠN</div>

        </div>
      </div>

      <!-- Icon Overlay 1: Check Icon (at 1.33s) -->
      <div id="icon-check-1" class="icon-badge icon-check-badge">
        <svg viewBox="0 0 100 100" width="76" height="76">
          <path
            id="check-path-1"

            d="M24 52 L42 70 L78 30"
            stroke="#FF6A1A"

          />
        </svg>
      </div>
    </section>

    <!-- ==================== SHOT 2: 4.35s - 9.07s ==================== -->
    <section id="shot-2" class="clip" data-start="4.35" data-duration="4.72" data-layout-allow-overflow>
      <!-- Shot 2 Hero Collage Frame -->
      <div id="collage-frame-2" class="collage-frame">
        <img
          id="photo-2"
          class="media-photo"
          src="assets/img-06-scale-consequence-vs-benefit.jpeg"

      <div id="punch-group-2" class="punch-container">
        <div class="punch-card punch-card-dark">
          <div class="punch-pre-tag">CÁI GIÁ PHẢI TRẢ</div>
          <h1 class="punch-title punch-title-light">HẬU QUẢ <span class="punch-text-orange">NGHIÊM TRỌNG</span></h1>

      <div id="icon-scale-2" class="icon-badge icon-scale-badge">
        <svg viewBox="0 0 120 120" width="120" height="120">
          <path id="scale-pillar" class="draw-path" d="M60 22 L60 98 M40 98 L80 98" stroke="#F7F4EC" stroke-width="7"/>
          <path id="scale-beam" class="draw-path" d="M22 36 L98 62" stroke="#FF6A1A" stroke-width="9"/>
          <path id="scale-pan-left" class="draw-path" d="M22 36 L12 60 M22 36 L32 60 M8 60 L36 60" stroke="#F7F4EC" stroke-width="5"/>
          <path id="scale-pan-right" class="draw-path" d="M98 62 L88 88 M98 62 L108 88 M82 88 L114 88" stroke="#FF6A1A" stroke-width="6"/>
          <rect id="scale-weight" x="90" y="74" width="16" height="14" fill="#FF6A1A" stroke="#141414" stroke-width="3"/>
        </svg>
      </div>

      <!-- Annotation Label (at 6.95s) -->
      <div id="annotation-label-2" class="annotation-card">
        <svg class="annotation-pointer" viewBox="0 0 44 44">
          <path d="M8 22 L36 22 M24 10 L36 22 L24 34"/>

  </div>

  <script>
    // Prepare SVG stroke lengths synchronously
    const checkPath = document.getElementById("check-path-1");
    if (checkPath) {
      const len = checkPath.getTotalLength();
      checkPath.style.strokeDasharray = len;
      checkPath.style.strokeDashoffset = len;
    }

    const scalePathSelectors = ["#scale-pillar", "#scale-beam", "#scale-pan-left", "#scale-pan-right"];
    scalePathSelectors.forEach((selector) => {
      const el = document.querySelector(selector);
      if (el) {
        const len = el.getTotalLength();
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
      }
    });

    // Create paused master GSAP timeline
    const tl = gsap.timeline({ paused: true });

    // =========================================================================
    // SHOT 1: 0.00s - 4.35s
    // =========================================================================

    // Strike Flash
    tl.fromTo(
      "#strike-flash",
      { opacity: 0.85 },
      { opacity: 0, duration: 0.28, ease: "power2.out" },
      0.0
    );

    // Initial frame entrance
    tl.fromTo(
      "#collage-frame-1",
      { scale: 1.08, y: 15 },
      { scale: 1.0, y: 0, duration: 0.65, ease: "power3.out" },
      0.0
    );

    // Shot 1 camera: pan-left on light side of scale
    tl.fromTo(
      "#photo-1",
      { scale: 1.25, xPercent: 12, yPercent: -5 },
      { scale: 1.33, xPercent: 5, yPercent: -5, duration: 4.35, ease: "none" },
      0.0
    );

    // Benefit Stamp entrance
    tl.fromTo(
      "#stamp-benefit-1",
      { scale: 0, opacity: 0, rotation: -18 },
      { scale: 1, opacity: 1, rotation: -5, duration: 0.45, ease: "power3.out" },
      0.35
    );

    // Fish Metaphor Card entrance
    tl.fromTo(
      "#fish-card-1",
      { y: 35, opacity: 0, scale: 0.85 },
      { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
      0.55
    );

    // Punch 1 entrance at 0.94s (hold 1.8s)
    tl.fromTo(
      "#punch-group-1",
      { y: -50, scale: 0.85, opacity: 0 },
      { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.94
    );

    // Icon Check entrance at 1.33s (hold 1.3s)
    tl.fromTo(
      "#icon-check-1",
      { scale: 0, opacity: 0, rotation: -35 },
      { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: "power3.out" },
      1.33
    );

    if (checkPath) {
      tl.to(
        "#check-path-1",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        1.45
      );
    }

    // Shot 1 elements settle before cut
    tl.to(
      "#icon-check-1",
      { scale: 0.8, opacity: 0, duration: 0.3, ease: "power2.in" },
      2.85
    );

    tl.to(
      "#punch-group-1",
      { y: -15, opacity: 0.2, duration: 0.5, ease: "power2.in" },
      3.6
    );

    // =========================================================================
    // SHOT 2: 4.35s - 9.07s
    // =========================================================================

    // Transition cut at 4.35s: Thump on Shot 2 frame
    tl.fromTo(
      "#collage-frame-2",
      { y: -30, scale: 1.05 },
      { y: 0, scale: 1.0, duration: 0.45, ease: "power3.out" },
      4.35
    );

    // Camera cut & pan-right onto heavy prison consequences
    tl.fromTo(
      "#photo-2",
      { scale: 1.36, xPercent: -15, yPercent: -8 },
      { scale: 1.44, xPercent: -22, yPercent: -10, duration: 4.72, ease: "none" },
      4.35
    );

    // Danger stamp slam
    tl.fromTo(
      "#stamp-danger-2",
      { scale: 1.8, opacity: 0, rotation: 18 },
      { scale: 1, opacity: 1, rotation: 6, duration: 0.4, ease: "power4.out" },
      4.55
    );

    // Punch 2 entrance at 4.89s (hold 1.9s)
    tl.fromTo(
      "#punch-group-2",
      { y: -60, scale: 0.88, opacity: 0 },
      { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power4.out" },
      4.89
    );

    // Scale Icon entrance at 5.65s (hold 1.5s)
    tl.fromTo(
      "#icon-scale-2",
      { scale: 0, opacity: 0, y: 25 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      5.65
    );

    // Progressive draw of scale paths
    scalePathSelectors.forEach((selector, index) => {
      tl.to(
        selector,
        { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" },
        5.8 + index * 0.1
      );
    });

    tl.fromTo(
      "#scale-weight",
      { scaleY: 0, transformOrigin: "50% 100%" },
      { scaleY: 1, duration: 0.25, ease: "power2.out" },
      6.25
    );

    // Annotation Label entrance at 6.95s (hold 2.0s)
    tl.fromTo(
      "#annotation-label-2",
      { x: -40, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      6.95
    );

    // Register timeline to HyperFrames
    window.__timelines["scene-s30"] = tl;
  </script>
