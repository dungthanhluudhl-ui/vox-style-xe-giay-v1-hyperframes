    /* 3 thumbnail video gửi kèm */

  </style>

  <div
    id="root"

    data-start="0"
    data-width="1080"
    data-height="1920"

  >
    <!-- Texture giấy ngà Vox -->
    <div class="paper-grain" data-layout-ignore="true"></div>

    <!-- Thanh cam signature ở đáy -->
    <div class="bottom-brand-bar" data-layout-ignore="true"></div>

    <!-- Clip duy nhất cho Scene S03 (duration: 6.45s = 20670 - 14220) -->

      id="scene-s03"

    >
      <!-- VÙNG OVERLAY RIÊNG BIỆT TRÊN ĐẦU (Shot 1 & Shot 2) -->
      <div id="top-overlay-zone" data-layout-allow-overflow="true">
        <!-- Shot 1: Label "Vài clip Zalo?" (atMs: 15010 -> local 0.79s) -->
        <div id="label-vai-clip" data-layout-allow-overflow="true" data-layout-allow-overlap="true">
          Vài clip Zalo?
        </div>

        <!-- Shot 1: Dấu hỏi cam lớn (atMs: 16410 -> local 2.19s) -->
        <div id="icon-question-wrap" data-layout-allow-overflow="true" data-layout-allow-overlap="true">
          <svg class="question-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="60" cy="60" r="52" fill="#FF6A1A" stroke="#141414" stroke-width="8"/>
            <path id="question-path" d="M49 46C49 38 54 33 61 33C68 33 73 38 73 44C73 51 68 54 63 58C59 61 58 64 58 69" stroke="#141414" stroke-width="9" stroke-linecap="round" fill="none"/>
            <circle id="question-dot" cx="58" cy="85" r="6" fill="#141414"/>

        <div id="punch-khiem-ton" data-layout-allow-overflow="true" data-layout-allow-overlap="true" data-layout-allow-occlusion="true">

          <div id="icon-warning-wrap" data-layout-allow-overflow="true">

              <path d="M50 40V60" stroke="#141414" stroke-width="8" stroke-linecap="round"/>

                Đã gửi <span class="quote-mark" id="quote-left">“</span><span class="highlight-word">vài video</span><span class="quote-mark" id="quote-right">”</span> vào đây...

  <script>
    // Chuẩn bị stroke-draw cho icon question mark chuẩn ngôn ngữ Vox
    const qPath = document.getElementById("question-path");
    if (qPath && qPath.getTotalLength) {
      const qLen = qPath.getTotalLength();
      qPath.style.strokeDasharray = qLen.toString();
      qPath.style.strokeDashoffset = qLen.toString();
    }

    // Khởi tạo GSAP Timeline paused đúng contract HyperFrames
    const tl = gsap.timeline({ paused: true });

    // -------------------------------------------------------------
    // SHOT 1: 0.00s -> 3.70s (14220ms - 17920ms)
    // -------------------------------------------------------------

    // 1. Phone Mockup Punch-in tại t=0.08s (sử dụng endpoints tuyệt đối)
    tl.fromTo(
      "#phone-mockup",
      { scale: 0.75, opacity: 0, y: 60, rotation: -2, x: 0 },
      { scale: 1.0, opacity: 1, y: 0, rotation: 0, x: 0, duration: 0.55, ease: "power3.out" },
      0.08
    );

    // 2. Camera zoom-in nhẹ toàn cảnh từ 0.0s đến 3.5s
    tl.fromTo(
      "#scene-s03",
      { scale: 1.0 },
      { scale: 1.05, duration: 3.5, ease: "sine.inOut" },
      0.0
    );

    // 3. Tin nhắn chat 1 xuất hiện
    tl.fromTo(
      "#chat-msg-1",
      { opacity: 0, y: 20, scale: 0.95 },
      { opacity: 1, y: 0, scale: 1.0, duration: 0.35, ease: "power2.out" },
      0.30
    );

    // 4. Tin nhắn chat 2 bật lên
    tl.fromTo(
      "#chat-msg-2",
      { opacity: 0, y: 24, scale: 0.95 },
      { opacity: 1, y: 0, scale: 1.0, duration: 0.40, ease: "power3.out" },
      0.50
    );

    // 5. Overlay Label: "Vài clip Zalo?" (atMs 15010 -> 0.79s local)
    tl.fromTo(
      "#label-vai-clip",
      { scale: 0.3, opacity: 0, rotation: -14, y: 0 },
      { scale: 1.0, opacity: 1, rotation: -3, y: 0, duration: 0.42, ease: "power3.out" },
      0.79
    );

    // 6. Overlay Icon: Question mark cam (atMs 16410 -> 2.19s local)
    tl.fromTo(
      "#icon-question-wrap",
      { scale: 0, opacity: 0, rotation: 20 },
      { scale: 1.0, opacity: 1, rotation: 6, duration: 0.45, ease: "power3.out" },
      2.19
    );

    // Stroke-draw dần đường cong dấu hỏi
    if (qPath) {
      tl.to(
        "#question-path",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        2.28
      );
    }

    // -------------------------------------------------------------
    // SHOT 2: 3.70s -> 6.45s (17920ms - 20670ms)
    // -------------------------------------------------------------

    // 7. Chuyển shot:
    // Thu gọn và ẩn nhãn + icon Shot 1 để giải phóng không gian
    tl.to("#label-vai-clip", { opacity: 0, scale: 0.85, y: -16, duration: 0.30, ease: "power2.in" }, 3.50);
    tl.to("#icon-question-wrap", { opacity: 0, scale: 0.85, duration: 0.30, ease: "power2.in" }, 3.50);

    // Camera chuyển sang tĩnh và zoom cận cảnh nhẹ
    tl.to("#scene-s03", { scale: 1.07, duration: 0.40, ease: "power2.out" }, 3.70);

    // Hiệu ứng "Tremble" rung lắc mỉa mai trên mockup điện thoại
    // Sử dụng chuỗi tween nối tiếp '>' để loại bỏ triệt để sai số dấu phẩy động
    tl.to("#phone-mockup", { rotation: -1.6, x: -6, duration: 0.07, ease: "none" }, 3.75)
      .to("#phone-mockup", { rotation: 1.8, x: 7, duration: 0.07, ease: "none" }, ">")
      .to("#phone-mockup", { rotation: -1.2, x: -5, duration: 0.07, ease: "none" }, ">")
      .to("#phone-mockup", { rotation: 1.4, x: 5, duration: 0.07, ease: "none" }, ">")
      .to("#phone-mockup", { rotation: -0.6, x: -3, duration: 0.07, ease: "none" }, ">")
      .to("#phone-mockup", { rotation: 0, x: 0, duration: 0.10, ease: "power1.out" }, ">");

    // Dấu ngoặc kép kẹp chữ "vài video" phóng ra
    tl.fromTo(
      "#quote-left",
      { scale: 0, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.25, ease: "power3.out" },
      4.15
    );
    tl.fromTo(
      "#quote-right",
      { scale: 0, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 0.25, ease: "power3.out" },
      4.25
    );

    // Đợt rung nhẹ thứ 2 trước punch phrase (nối tiếp sạch bằng '>')
    tl.to("#phone-mockup", { rotation: 1.0, x: 3, duration: 0.06, ease: "none" }, 5.25)
      .to("#phone-mockup", { rotation: -1.0, x: -3, duration: 0.06, ease: "none" }, ">")
      .to("#phone-mockup", { rotation: 0, x: 0, duration: 0.08, ease: "power1.out" }, ">");

    // 8. Overlay Punch Phrase: "RẤT KHIÊM TỐN" (atMs 19760 -> 5.54s local)
    tl.fromTo(
      "#punch-khiem-ton",
      { scale: 1.7, opacity: 0, rotation: -6, y: -20 },
      { scale: 1.0, opacity: 1, rotation: 2, y: 0, duration: 0.32, ease: "power4.out" },
      5.54
    );

    // 9. Overlay Icon: Warning bật lên trên góc badge punch (atMs 19850 -> 5.63s local)
    tl.fromTo(
      "#icon-warning-wrap",
      { scale: 0, opacity: 0, rotation: -25 },
      { scale: 1.0, opacity: 1, rotation: 6, duration: 0.28, ease: "power3.out" },
      5.63
    );

    // Đăng ký timeline chính thức vào registry HyperFrames
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s03"] = tl;
  </script>
