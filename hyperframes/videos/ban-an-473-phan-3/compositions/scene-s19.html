    <script>
      // Setup SVG paths for progressive self-drawing
      const paths = document.querySelectorAll(".draw-path");
      paths.forEach((p) => {
        if (typeof p.getTotalLength === "function") {
          const length = p.getTotalLength();
          p.style.strokeDasharray = length;
          p.style.strokeDashoffset = length;
        }
      });

      // Synchronous Paused GSAP Timeline
      const tl = gsap.timeline({ paused: true });

      // 1. Header Entrances (t = 0.1s -> 0.6s)
      tl.fromTo(
        "#cat-pill",
        { y: -25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.1
      );
      tl.fromTo(
        "#sub-pill",
        { y: -25, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.2
      );
      tl.fromTo(
        "#punch-phrase",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.25
      );

      // Wobble-drop entrance for hero-frame-wrap (t = 0.15s -> 0.85s)
      tl.fromTo(
        "#hero-frame-wrap",
        { y: -120, rotation: -3, opacity: 0, scale: 0.95 },
        { y: 0, rotation: 0, opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" },
        0.15
      );

      // Ken Burns Slow Zoom: 1.0 -> 1.09 throughout full duration (7.31s)
      tl.fromTo(
        "#hero-image",
        { scale: 1.0, x: 0 },
        { scale: 1.09, x: -25, duration: 7.31, ease: "none" },
        0
      );

      // 2. Overlay: Icon "scale" (atMs 159200 -> t = 1.20s, hold 1.6s -> 2.80s)
      tl.fromTo(
        "#scale-icon-card",
        { scale: 0.75, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        1.2
      );
      // Staggered path draws for the scale icon
      paths.forEach((p, idx) => {
        tl.to(
          p,
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
          1.25 + idx * 0.035
        );
      });
      // Icon exits at 2.60s (faded out by 2.80s)
      tl.to(
        "#scale-icon-card",
        { opacity: 0, scale: 0.9, y: -15, duration: 0.2, ease: "power2.in" },
        2.6
      );

      // 3. Overlay: Label "Có công cách mạng" (atMs 160660 -> t = 2.66s, hold 2.2s -> 4.86s)
      tl.fromTo(
        "#label-cong-cach-mang",
        { scale: 0.85, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        2.66
      );

      // Weight shift downward indicator tag appears alongside label 1
      tl.fromTo(
        "#weight-tag",
        { opacity: 0, x: 30 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
        2.85
      );

      // Pulse ring on left pan
      tl.fromTo(
        "#pan-pulse-ring",
        { scale: 0.6, opacity: 0.9 },
        { scale: 1.4, opacity: 0, duration: 1.1, ease: "power2.out" },
        2.7
      );

      // Label 1 exits at 4.56s (cleared before 4.86s)
      tl.to(
        "#label-cong-cach-mang",
        { opacity: 0, y: -20, scale: 0.95, duration: 0.3, ease: "power2.in" },
        4.56
      );

      // 4. Overlay: Label "Lao động chính" (atMs 164210 -> t = 6.21s, hold 1.8s -> 7.31s)
      tl.fromTo(
        "#label-lao-dong-chinh",
        { scale: 0.85, opacity: 0, y: 35 },
        { scale: 1, opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        6.21
      );

      // Second pulse ring on left pan for final evidence landing
      tl.fromTo(
        "#pan-pulse-ring",
        { scale: 0.6, opacity: 0.9 },
        { scale: 1.45, opacity: 0, duration: 0.9, ease: "power2.out" },
        6.25
      );

      // Register timeline synchronously on window.__timelines
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s19"] = tl;
    </script>
