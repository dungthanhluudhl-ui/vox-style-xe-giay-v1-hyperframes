    <!-- SCRIPT ĐIỀU KHIỂN CHUYỂN ĐỘNG (GSAP) -->
    <script>
      // Khởi tạo timeline paused duy nhất
      const tl = gsap.timeline({
        paused: true,
        defaults: { ease: "power3.out" }
      });

      // Đo đường path của icon check để vẽ stroke tự nhiên
      const checkPath = document.getElementById("check-tick-path");
      if (checkPath) {
        const tickLen = checkPath.getTotalLength() || 30;
        checkPath.style.strokeDasharray = tickLen + "px";
        checkPath.style.strokeDashoffset = tickLen + "px";
      }

      // ==========================================
      // GIAI ĐOẠN 1 (0.0s - 5.02s): SHOT S12-1
      // Mở tiệm bán sản phẩm bình thường
      // ==========================================

      // 0.0s - 0.8s: Zoom-through camera entrance (Chỉ dùng duy nhất 1 fromTo trên #main-stage)
      tl.fromTo(
        "#main-stage",
        { scale: 1.12, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.8, ease: "power2.out" },
        0
      );

      // Header và đường kẻ split xuất hiện
      tl.fromTo(
        "#sec-header",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6 },
        0.2
      );

      tl.fromTo(
        "#split-line",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 0.4, duration: 0.8, transformOrigin: "top center" },
        0.4
      );

      // Cửa hàng nhỏ bên trái pop-in
      tl.fromTo(
        "#shop-column",
        { scale: 0.6, opacity: 0, y: 50 },
        { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
        0.5
      );

      // 1.78s: Thẻ nhãn 'Cửa hàng sản phẩm'
      tl.fromTo(
        "#shop-meta-card",
        { scale: 0.85, opacity: 0, y: -16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.78
      );

      // 4.03s: Icon check stamp xuất hiện xác nhận hợp thức
      tl.fromTo(
        "#shop-check-stamp",
        { scale: 0, opacity: 0, rotation: -12 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "power3.out" },
        4.03
      );

      // Vẽ nét icon check
      if (checkPath) {
        tl.to(
          "#check-tick-path",
          { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
          4.25
        );
      }

      // ==========================================
      // GIAI ĐOẠN 2 (5.02s - 12.81s): SHOT S12-2
      // Rạp phim người lớn lấn át & Bị niêm phong
      // ==========================================

      // 5.02s: Camera pan nhẹ sang phải bằng tl.to (tuyệt đối, không fromTo đè lên)
      tl.to(
        "#main-stage",
        { x: -40, duration: 1.0, ease: "power2.inOut" },
        5.02
      );

      // Shop bên trái co nhẹ lại và mờ bớt
      tl.to(
        "#shop-column",
        { scale: 0.82, opacity: 0.55, duration: 0.8 },
        5.2
      );

      // Rạp chiếu bóng mọc lên chiếm lĩnh khung hình
      tl.fromTo(
        "#cinema-building",
        { scaleY: 0.1, scaleX: 0.7, opacity: 0, y: 150 },
        {
          scaleY: 1,
          scaleX: 1,
          opacity: 1,
          y: 0,
          duration: 0.9,
          transformOrigin: "bottom center",
          ease: "power4.out"
        },
        5.3
      );

      // Ánh sáng bên trong rạp bừng sáng
      tl.fromTo(
        "#cinema-interior-glow",
        { opacity: 0, scale: 0.5 },
        { opacity: 0.9, scale: 1.2, duration: 0.8, ease: "sine.inOut" },
        6.0
      );

      // Đèn bóng Marquee nhấp nháy luân phiên
      tl.to("#b2, #b4, #b6, #b8", { backgroundColor: "#FF6A1A", boxShadow: "0 0 10px #FF6A1A", duration: 0.3 }, 6.2);
      tl.to("#b1, #b3, #b5, #b7, #b9", { backgroundColor: "#7a340b", boxShadow: "none", duration: 0.3 }, 6.5);
      tl.to("#b1, #b3, #b5, #b7, #b9", { backgroundColor: "#FF6A1A", boxShadow: "0 0 10px #FF6A1A", duration: 0.3 }, 6.8);
      tl.to("#b2, #b4, #b6, #b8", { backgroundColor: "#FF6A1A", boxShadow: "0 0 10px #FF6A1A", duration: 0.3 }, 7.1);

      // 7.78s: Punch phrase "RẠP PHIM NGƯỜI LỚN" xuất hiện mạnh mẽ
      tl.fromTo(
        "#punch-box",
        { scale: 0.5, opacity: 0, y: -30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        7.78
      );

      // 9.44s: Đám đông 'crowd' ùa vào rạp
      tl.fromTo(
        "#crowd-group",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        9.44
      );

      tl.fromTo(
        "#crowd-p1, #crowd-p2, #crowd-p3, #crowd-p4, #crowd-p5, #crowd-p6",
        { scaleY: 0, opacity: 0 },
        {
          scaleY: 1,
          opacity: 1,
          duration: 0.45,
          stagger: 0.06,
          transformOrigin: "bottom center",
          ease: "power3.out"
        },
        9.6
      );

      // 10.68s: PHÁP LUẬT VÀO CUỘC - Chăng băng niêm phong & Thẻ kết luận
      // Băng cảnh sát số 1 chăng từ trái sang
      tl.fromTo(
        "#tape-line-1",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.35, transformOrigin: "left center", ease: "power4.out" },
        10.68
      );

      // Băng cảnh sát số 2 chăng từ phải sang
      tl.fromTo(
        "#tape-line-2",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.35, transformOrigin: "right center", ease: "power4.out" },
        10.88
      );

      // Con dấu niêm phong pháp luật đập mạnh xuống giữa rạp
      tl.fromTo(
        "#law-seal",
        { scale: 2.5, opacity: 0, rotation: -24 },
        { scale: 1, opacity: 1, rotation: -6, duration: 0.4, ease: "power4.out" },
        11.08
      );

      // Thẻ hành động pháp lý dưới cùng trồi lên chốt hạ
      tl.fromTo(
        "#law-footer-card",
        { y: 80, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        11.18
      );

      // Ánh sáng rạp tắt hoàn toàn do bị đình chỉ
      tl.to(
        "#cinema-interior-glow",
        { opacity: 0, duration: 0.25 },
        11.15
      );
      tl.to(
        ".bulb",
        { backgroundColor: "#3a1805", boxShadow: "none", duration: 0.2 },
        11.15
      );

      // Đăng ký timeline cho HyperFrames runtime seek
      window.__timelines["scene-s12"] = tl;
    </script>
