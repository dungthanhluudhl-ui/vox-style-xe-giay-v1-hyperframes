      // 1. Initial visual setup
      gsap.set("#package-card", { scale: 0, opacity: 0, y: -260, rotation: -6 });
      gsap.set("#label-pack", { scale: 0, opacity: 0 });
      gsap.set(".zalo-node", { scale: 0, opacity: 0 });
      gsap.set("#punch-groups-container", { scale: 0.8, opacity: 0 });
      gsap.set("#icon-crowd-box", { scale: 0, opacity: 0 });

      gsap.set("#deluge-layer", { opacity: 0 });
      gsap.set(".data-card", { x: -60, opacity: 0 });
      gsap.set("#data-counter-box", { scale: 0.85, opacity: 0 });
      gsap.set("#label-clips", { scale: 0, opacity: 0 });

      gsap.set("#bar-1", { y: -1920, opacity: 0 });
      gsap.set("#bar-2", { y: -1920, opacity: 0 });
      gsap.set("#bar-3", { y: -1920, opacity: 0 });
      gsap.set(".crossbar", { scaleX: 0, opacity: 0 });
      gsap.set("#punch-prison-container", { scale: 0.4, opacity: 0, rotation: -3 });
      gsap.set("#icon-fall-stamp", { scale: 0, opacity: 0 });

      // Measure SVG dashed lines
      const connLines = [
        document.getElementById("line-1"),
        document.getElementById("line-2"),
        document.getElementById("line-3"),
        document.getElementById("line-4"),
        document.getElementById("line-5"),
        document.getElementById("line-6"),
      ];

      connLines.forEach((p) => {
        if (p && p.getTotalLength) {
          const len = Math.ceil(p.getTotalLength());
          p.style.strokeDasharray = `${len}`;
          p.style.strokeDashoffset = `${len}`;
        }
      });

      // 2. Initialize master paused timeline
      const tl = gsap.timeline({ paused: true });

      // ==========================================
      // BEAT 1: GÓI HÀNG BAN ĐẦU (0.0s - 3.2s)
      // ==========================================
      tl.to(
        "#package-card",
        {
          y: 0,
          scale: 1,
          opacity: 1,
          rotation: 0,
          duration: 0.75,
          ease: "power3.out",
        },
        0.2,
      );

      tl.to("#package-card", { rotation: 2.2, duration: 0.2, ease: "sine.inOut" }, 0.95);
      tl.to("#package-card", { rotation: 0, duration: 0.18, ease: "sine.out" }, 1.15);

      tl.to("#camera", { scale: 1.05, duration: 4.6, ease: "power1.out" }, 0.2);

      // Overlay Label: "Gói vài trăm nghìn" at t = 1.14s, hold 2.0s
      tl.to("#label-pack", { scale: 1, opacity: 1, duration: 0.38, ease: "power3.out" }, 1.14);
      tl.to("#label-pack", { opacity: 0, scale: 0.85, duration: 0.25, ease: "power2.in" }, 3.14);

      // ==========================================
      // BEAT 2: PHÌNH TO THÀNH MẠNG LƯỚI ZALO (3.2s - 4.85s)
      // ==========================================
      tl.to(
        "#package-card",
        {
          y: -190,
          scale: 0.65,
          duration: 0.65,
          ease: "power3.inOut",
        },
        3.2,
      );

      connLines.forEach((p, idx) => {
        if (p) {
          tl.to(
            p,
            { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
            3.35 + idx * 0.05,
          );
        }
      });

      tl.to(
        ".zalo-node",
        {
          scale: 1,
          opacity: 1,
          duration: 0.42,
          ease: "power3.out",
          stagger: 0.08,
        },
        3.5,
      );

      // ==========================================
      // BEAT 3: PUNCH 1 "HÀNG TRĂM NHÓM" (4.85s - 6.4s)
      // ==========================================
      // Clean handoff: fade out network & package card as punch arrives
      tl.to("#network-layer", { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.75);
      tl.to("#package-card", { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.75);

      // Punch 1 at t = 4.85s, hold 1.55s (to 6.4s)
      tl.to(
        "#punch-groups-container",
        {
          scale: 1,
          opacity: 1,
          duration: 0.42,
          ease: "power3.out",
        },
        4.85,
      );

      // Transition cut flash at t = 5.1s
      tl.to("#cut-flash", { opacity: 0.85, duration: 0.08, ease: "none" }, 5.1);
      tl.to("#cut-flash", { opacity: 0, duration: 0.22, ease: "power2.out" }, 5.18);

      // Darkening vignette for consequence beat
      tl.to("#spotlight-overlay", { opacity: 0.88, duration: 0.7, ease: "power2.out" }, 5.1);

      // Chart lines turn urgent
      tl.to(
        ".chart-line",
        { backgroundColor: "rgba(255,106,26,0.45)", duration: 0.5 },
        5.1,
      );

      // Camera zooms out for macro scope
      tl.to("#camera", { scale: 0.96, duration: 3.5, ease: "power2.out" }, 5.1);

      // Overlay Icon: "crowd" at t = 6.2s, hold 1.4s

      tl.to("#icon-crowd-box", { opacity: 0, scale: 0.7, duration: 0.25 }, 7.6);

      // Fade out Punch 1 at 6.4s
      tl.to(
        "#punch-groups-container",
        { opacity: 0, scale: 0.9, duration: 0.25, ease: "power2.in" },
        6.4,
      );

      // ==========================================
      // BEAT 4: DIGITAL DELUGE (6.4s - 8.8s)
      // ==========================================
      tl.to("#deluge-layer", { opacity: 1, duration: 0.1 }, 6.45);
      tl.to(
        ".data-card",
        {
          x: 0,
          opacity: 1,
          duration: 0.38,
          ease: "power3.out",
          stagger: 0.08,
        },
        6.5,
      );

      tl.to(
        "#data-counter-box",
        {
          scale: 1,
          opacity: 1,
          duration: 0.45,
          ease: "power3.out",
        },
        6.8,
      );

      // Overlay Label: "Hàng nghìn clip tải" at t = 7.59s, hold 2.0s
      tl.to("#label-clips", { scale: 1, opacity: 1, duration: 0.36, ease: "power3.out" }, 7.59);
      tl.to("#label-clips", { opacity: 0, scale: 0.85, duration: 0.24 }, 9.59);

      // ==========================================
      // BEAT 5: BA BẢN ÁN TÙ - SONG SẮT ĐÓNG SẬP (8.8s - 10.63s)
      // ==========================================
      // Deluge layer fades out cleanly before bars slam shut
      tl.to("#deluge-layer", { opacity: 0, duration: 0.15, ease: "power2.in" }, 8.75);

      // Bar 1 slams at 8.80s
      tl.to("#bar-1", { y: 0, opacity: 1, duration: 0.28, ease: "power4.in" }, 8.8);
      tl.to("#stage", { y: -16, duration: 0.06, ease: "power2.out" }, 9.08);
      tl.to("#stage", { y: 0, duration: 0.1, ease: "power2.inOut" }, 9.15);

      // Bar 2 slams at 9.02s
      tl.to("#bar-2", { y: 0, opacity: 1, duration: 0.28, ease: "power4.in" }, 9.02);
      tl.to("#stage", { y: 14, duration: 0.06, ease: "power2.out" }, 9.3);
      tl.to("#stage", { y: 0, duration: 0.1, ease: "power2.inOut" }, 9.37);

      // Bar 3 slams at 9.24s
      tl.to("#bar-3", { y: 0, opacity: 1, duration: 0.28, ease: "power4.in" }, 9.24);
      tl.to("#stage", { y: -20, duration: 0.07, ease: "power2.out" }, 9.52);
      tl.to("#stage", { y: 0, duration: 0.12, ease: "power2.inOut" }, 9.6);

      // Crossbars lock in
      tl.to(".crossbar", { scaleX: 1, opacity: 1, duration: 0.26, ease: "power3.out" }, 9.45);

      // Punch 2: "BA BẢN ÁN TÙ" at t = 9.84s (holds to end)
      tl.to(
        "#punch-prison-container",
        {
          scale: 1,
          opacity: 1,
          rotation: 0,
          duration: 0.38,
          ease: "power4.out",
        },
        9.84,
      );

      // Overlay Icon: "fall" / Padlock stamp at t = 10.2s, hold to end
      tl.to(
        "#icon-fall-stamp",
        {
          scale: 1,
          opacity: 1,
          duration: 0.25,
          ease: "power4.out",
        },
        10.2,
      );

      // 3. Register master timeline
      window.__timelines["scene-s28"] = tl;
    </script>
