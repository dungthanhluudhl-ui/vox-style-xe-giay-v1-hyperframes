    <div

    >
      <!-- Nền giấy ngà + lưới 84px chuẩn -->
      <div class="grid-bg"></div>

      <!-- Lớp hạt nhiễu grain giấy tự tạo SVG (18% multiply) -->
      <svg class="grain-overlay" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
        <filter id="noiseFilter">
          <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" />

        </filter>

      </svg>

      <!-- Dải cam chữ ký thương hiệu ở đáy -->
      <div class="brand-orange-bar"></div>

      <!-- Paper peel curtain cho hiệu ứng mở cảnh (peel transition) -->
      <div id="peel-curtain"></div>

      <!-- Khung cảnh chính và camera rig -->
      <div id="camera-rig" data-layout-allow-overflow="true">
        <!-- Băng dính trang trí phong cách collage -->
        <div class="paper-tape tape-top-left"></div>
        <div class="paper-tape tape-top-right"></div>

        <!-- Header nhãn hồ sơ -->
        <div class="header-badge" id="header-badge">

          <span class="badge-text">Cơ chế phát tán // Mạng lưới</span>

        <!-- Khung video vid-07 crop 9:16 tỉ lệ cắt dán -->
        <div class="video-wrapper" id="video-frame">
          <video
            id="vid-network"
            src="assets/vid-07-independent-crime-network-diagram.mp4"

          ></video>

        <!-- Khu vực sơ đồ nhánh và nhãn: "Nhân bản nhóm chat" -->
        <div class="diagram-stage">
          <!-- Label xuất hiện lúc t = 2.18s (217580ms) -->
          <div id="label-clone-group">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FF6A1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>

    <script>
      // Khởi tạo GSAP Timeline ở trạng thái paused bắt buộc
      const tl = gsap.timeline({ paused: true });

      // Cài đặt độ dài vẽ stroke cho icon tiền tệ từ DOM geometry thật
      const bagPath = document.querySelector("#money-bag");
      const tiePath = document.querySelector("#money-tie");
      const symbolPath = document.querySelector("#money-symbol");
      if (bagPath && tiePath && symbolPath) {
        const bagLen = bagPath.getTotalLength();
        const tieLen = tiePath.getTotalLength();
        const symLen = symbolPath.getTotalLength();
        bagPath.style.strokeDasharray = bagLen;
        bagPath.style.strokeDashoffset = bagLen;
        tiePath.style.strokeDasharray = tieLen;
        tiePath.style.strokeDashoffset = tieLen;
        symbolPath.style.strokeDasharray = symLen;
        symbolPath.style.strokeDashoffset = symLen;
      }

      // 1. Chuyển động máy quay zoom-in nhẹ xuyên suốt cảnh (Camera motion: zoom-in)
      tl.fromTo(
        "#camera-rig",
        { scale: 1.0 },
        { scale: 1.05, duration: 5.2, ease: "none" },
        0
      );

      // 2. Hiệu ứng bóc giấy mở đầu (Peel Transition) lúc t = 0 -> 0.65s
      tl.fromTo(
        "#peel-curtain",
        {
          clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)",
          opacity: 1
        },
        {
          clipPath: "polygon(100% 0%, 100% 0%, 100% 100%, 100% 100%)",
          opacity: 0,
          duration: 0.65,
          ease: "power3.inOut"
        },
        0
      );

      // 3. Khung video & Header cố định xuất hiện tự tin
      tl.fromTo(
        "#header-badge",
        { y: -20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.25
      );
      tl.fromTo(
        "#video-frame",
        { scale: 0.94, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.3
      );

      // 4. Nhóm chat nhân bản: Label xuất hiện lúc t = 2.18s (217580ms - 215400ms)
      tl.fromTo(
        "#label-clone-group",
        { scale: 0.82, opacity: 0, y: -15 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
        2.18
      );

      // 3 nhánh nhóm chat độc lập bung ra theo đà nhân bản
      tl.fromTo(
        "#node-1",
        { y: 25, opacity: 0, scale: 0.92 },
        { y: 0, opacity: 1, scale: 1.0, duration: 0.38, ease: "power3.out" },
        2.35
      );
      tl.fromTo(
        "#node-2",
        { y: 25, opacity: 0, scale: 0.92 },
        { y: 0, opacity: 1, scale: 1.0, duration: 0.38, ease: "power3.out" },
        2.48
      );
      tl.fromTo(
        "#node-3",
        { y: 25, opacity: 0, scale: 0.92 },
        { y: 0, opacity: 1, scale: 1.0, duration: 0.38, ease: "power3.out" },
        2.61
      );

      // 5. Khung Punch Phrase: "THẤY TIỀN HỌC THEO" lúc t = 3.99s (219390ms - 215400ms)
      tl.fromTo(
        "#punch-card",
        { y: 35, opacity: 0, scale: 0.96 },
        { y: 0, opacity: 1, scale: 1.0, duration: 0.42, ease: "power3.out" },
        3.99
      );

      // 6. Icon tiền tệ (money icon) vẽ stroke & pop lúc t = 4.14s (219540ms - 215400ms)
      tl.fromTo(
        "#money-icon-box",
        { scale: 0, rotation: -10, opacity: 0 },
        { scale: 1.0, rotation: 0, opacity: 1, duration: 0.38, ease: "power3.out" },
        4.14
      );
      if (bagPath && tiePath && symbolPath) {
        tl.to("#money-bag", { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" }, 4.2);
        tl.to("#money-tie", { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, 4.35);
        tl.to("#money-symbol", { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, 4.45);
      }

      // 7. Nhãn Sơn & Đức Huy gia nhập mạng lưới xuất hiện lúc t = 4.35s
      tl.fromTo(
        "#characters-row",
        { opacity: 0, x: -20 },
        { opacity: 1, x: 0, duration: 0.38, ease: "power3.out" },
        4.35
      );

      // BẮT BUỘC: Đăng ký timeline cho runtime HyperFrames seek
      window.__timelines["scene-s27"] = tl;
    </script>
