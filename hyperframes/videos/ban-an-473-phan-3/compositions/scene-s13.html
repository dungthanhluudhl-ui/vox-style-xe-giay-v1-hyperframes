    <!-- GSAP Seekable Timeline Script -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // Camera subtle zoom-in across scene
      tl.fromTo(
        "#camera-stage",
        { scale: 1.0, y: 0 },
        { scale: 1.04, y: -10, duration: 7.48, ease: "none" },
        0
      );

      // Transition In: "rise" (settled quickly for deterministic contrast)

        ".matrix-stage, .header-kicker",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        0.02
      );

      // Phone mockups pop-in sequence
      tl.fromTo(
        "#phone-1",
        { y: -40, opacity: 0, scale: 0.92 },
        { y: 0, opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" },
        0.08

        "#phone-2",

        { x: 0, opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" },
        0.14

        "#phone-3",
        { x: 40, opacity: 0, scale: 0.92 },
        { x: 0, opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" },
        0.20
      );

      // Suspects Cage pops into central slot
      tl.fromTo(
        "#suspects-cage",
        { scale: 0.88, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        0.45
      );

      // Suspect avatars stagger
      tl.fromTo(
        ".suspect-item",
        { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, stagger: 0.08, ease: "power3.out" },
        0.65
      );

      // Progressive SVG path draw for network cables
      const cablePaths = document.querySelectorAll(".cable-path");
      cablePaths.forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
      });

      tl.to(
        cablePaths,
        { strokeDashoffset: 0, duration: 0.8, stagger: 0.08, ease: "power2.out" },
        0.95
      );

      // Connection nodes pulse in
      tl.fromTo(
        ".cable-pulse",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, stagger: 0.06, ease: "power3.out" },
        1.45
      );

      // Shotlist Overlay: Punch "ZALO & INTERNET" atMs 112220 (rel: 2.90s)
      tl.fromTo(
        "#punch-card",
        { y: 30, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        2.90
      );

      // Shotlist Overlay: Icon "phone" atMs 113170 (rel: 3.85s)
      tl.fromTo(
        "#phone-icon-wrap",
        { scale: 0, opacity: 0, rotation: -15 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: "power3.out" },
        3.85
      );

      // Shotlist Overlay: Label "Phương tiện gây án" atMs 113520 (rel: 4.20s)
      tl.fromTo(
        "#label-badge",
        { x: -30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        4.20
      );

      // Climax: "bị xác định phạm tội" (rel: 5.65s)
      tl.to("#suspects-cage", { borderColor: "#FF6A1A", duration: 0.2 }, 5.55);

      tl.fromTo(
        "#verdict-stamp",
        { scale: 1.7, opacity: 0, rotation: -8 },
        { scale: 1, opacity: 1, rotation: -2, duration: 0.35, ease: "power4.out" },
        5.65
      );

      window.__timelines["scene-s13"] = tl;
    </script>
