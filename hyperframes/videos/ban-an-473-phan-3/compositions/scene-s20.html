<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #E7E3D9;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      width: 1080px;
      height: 1920px;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
    }

    /* Grid nền phong cách Vox */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.16) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
      pointer-events: none;
      z-index: 1;
    }

    /* Video layers */
    .video-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      z-index: 2;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    /* Lớp phủ vignette nhẹ tạo chiều sâu cho video và làm nổi bật graphic overlays */
    .screen-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(20,20,20,0.1) 40%, rgba(20,20,20,0.55) 100%);
      pointer-events: none;
      z-index: 3;
    }

    /* Chữ ký thị giác: thanh cam cố định đáy khung hình */
    .vox-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 14px;
      background-color: #FF6A1A;
      z-index: 100;
    }

    /* Base clip container */
    .clip {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* Floating Pill Badge (Icon + Nhãn nhỏ gọn ≤4 từ) */
    .pill-badge-container {
      position: absolute;
      left: 80px;
      top: 220px;
      display: flex;
      align-items: center;
      gap: 20px;
      background: #141414;
      border: 3px solid #FF6A1A;
      border-radius: 60px;
      padding: 16px 36px 16px 24px;
      box-shadow: 6px 6px 0px #FF6A1A;
      transform-origin: 0% 50%;
      will-change: transform, opacity;
    }

    .pill-badge-text {
      color: #F7F4EC;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .icon-box {
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Thẻ thông tin tài liệu / tình tiết giảm nhẹ */
    .evidence-card {
      position: absolute;
      left: 70px;
      width: 940px;
      background: #F5F0E4;
      border: 4px solid #141414;
      border-radius: 12px;
      padding: 32px 36px;
      box-shadow: 10px 10px 0px #FF6A1A;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    #card-medal {
      top: 340px;
    }

    #card-military {
      top: 560px;
    }

    .card-header-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #141414;
      color: #F7F4EC;
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .card-header-tag .tag-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #FF6A1A;
      display: inline-block;
    }

    .card-title {
      font-size: 46px;
      font-weight: 900;
      line-height: 1.25;
      color: #141414;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .card-subtitle {
      font-size: 26px;
      font-weight: 700;
      color: rgba(20, 20, 20, 0.78);
      line-height: 1.35;
    }

    .accent-rule {
      width: 100%;
      height: 4px;
      background: #FF6A1A;
      margin: 14px 0 10px 0;
      transform-origin: 0% 50%;
    }

    /* Punch phrase lớn (Climax của scene) */
    .punch-container {
      position: absolute;
      top: 680px;
      left: 60px;
      width: 960px;
      background: #141414;
      border: 5px solid #FF6A1A;
      border-radius: 16px;
      padding: 48px 40px;
      box-shadow: 14px 14px 0px #FF6A1A;
      text-align: center;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    .punch-sup {
      font-size: 24px;
      font-weight: 900;
      color: #FF6A1A;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .punch-main {
      font-size: 70px;
      font-weight: 900;
      color: #F7F4EC;
      line-height: 1.15;
      letter-spacing: -1px;
      text-transform: uppercase;
    }

    .punch-bar {
      width: 120px;
      height: 6px;
      background: #FF6A1A;
      margin: 20px auto 0 auto;
      border-radius: 3px;
    }

    /* SVG draw paths */
    .draw-path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s20"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="9.47"
  >
    <!-- Background grid giấy ngà chuẩn Vox -->
    <div class="bg-grid"></div>

    <!-- SHOT 1: Video chiếc cân công lý đo lường tài liệu và huân chương (0.0s - 6.16s) -->
    <video
      id="vid-shot-1"
      class="video-layer"
      data-start="0"
      data-duration="6.16"
      data-media-start="0"
      muted
      playsinline
      src="assets/vid-02-paper-cutout-justice-scale.mp4"
    ></video>

    <!-- SHOT 2: Video búa thẩm phán gõ nhịp ghi nhận tình tiết (6.16s - 9.47s) -->
    <video
      id="vid-shot-2"
      class="video-layer"
      data-start="6.16"
      data-duration="3.31"
      data-media-start="4.7"
      muted
      playsinline
      src="assets/vid-02-paper-cutout-justice-scale.mp4"
    ></video>

    <!-- Lớp phủ tạo chiều sâu và độ tương phản cho text -->
    <div class="screen-vignette"></div>

    <!-- OVERLAY 1: Icon Doc (Tài liệu / Giấy tờ nộp thêm) (1.60s - 3.10s) -->
    <div id="clip-doc" class="clip" data-start="1.6" data-duration="1.5">
      <div id="badge-doc" class="pill-badge-container">
        <div class="icon-box">
          <svg viewBox="0 0 64 64" width="48" height="48">
            <path class="draw-path" d="M16 8 H38 L50 20 V56 H16 Z" stroke="#FF6A1A" stroke-width="4.5" />
            <path class="draw-path" d="M38 8 V20 H50" stroke="#FF6A1A" stroke-width="4.5" />
            <path class="draw-path" d="M24 30 H42" stroke="#F7F4EC" stroke-width="4" />
            <path class="draw-path" d="M24 40 H42" stroke="#F7F4EC" stroke-width="4" />
            <path class="draw-path" d="M24 48 H34" stroke="#F7F4EC" stroke-width="4" />
          </svg>
        </div>
        <span class="pill-badge-text">TÀI LIỆU CHỨNG MINH</span>
      </div>
    </div>

    <!-- OVERLAY 2: Thẻ Huân chương kháng chiến (Đức Huy) (2.83s - 5.03s) -->
    <div id="clip-medal" class="clip" data-start="2.83" data-duration="2.2">
      <div id="card-medal" class="evidence-card">
        <div class="card-header-tag">
          <span class="tag-dot"></span>
          <span>TÌNH TIẾT GIẢM NHẸ • ĐỨC HUY</span>
        </div>
        <h2 class="card-title">Huân chương kháng chiến</h2>
        <div id="rule-medal" class="accent-rule"></div>
        <p class="card-subtitle">Thân nhân được Nhà nước tặng thưởng</p>
      </div>
    </div>

    <!-- OVERLAY 3: Thẻ Nghĩa vụ quân sự (Sơn) (5.24s - 7.24s) -->
    <div id="clip-military" class="clip" data-start="5.24" data-duration="2.0">
      <div id="card-military" class="evidence-card">
        <div class="card-header-tag">
          <span class="tag-dot"></span>
          <span>TÌNH TIẾT GIẢM NHẸ • HỒNG SƠN</span>
        </div>
        <h2 class="card-title">Nghĩa vụ quân sự</h2>
        <div id="rule-military" class="accent-rule"></div>
        <p class="card-subtitle">Từng tham gia phục vụ trong quân đội</p>
      </div>
    </div>

    <!-- OVERLAY 4: Icon Check (Tòa ghi nhận tình tiết) (6.73s - 8.13s) -->
    <div id="clip-check" class="clip" data-start="6.73" data-duration="1.4">
      <div id="badge-check" class="pill-badge-container">
        <div class="icon-box">
          <svg viewBox="0 0 64 64" width="48" height="48">
            <circle class="draw-path" cx="32" cy="32" r="25" stroke="#FF6A1A" stroke-width="4.5" />
            <path class="draw-path" d="M21 33 L29 41 L45 23" stroke="#F7F4EC" stroke-width="5" />
          </svg>
        </div>
        <span class="pill-badge-text">TÒA ÁN GHI NHẬN</span>
      </div>
    </div>

    <!-- OVERLAY 5: Punch Phrase "GIẢM NHẸ BỔ SUNG" (8.19s - 9.47s) -->
    <div id="clip-punch" class="clip" data-start="8.19" data-duration="1.28">
      <div id="punch-card" class="punch-container">
        <div class="punch-sup">HỘI ĐỒNG XÉT XỬ KẾT LUẬN</div>
        <h1 class="punch-main">GIẢM NHẸ BỔ SUNG</h1>
        <div id="punch-bar-line" class="punch-bar"></div>
      </div>
    </div>

    <!-- Chữ ký thị giác: thanh cam cố định đáy khung hình -->
    <div class="vox-bottom-bar"></div>
  </div>

  <script>
    // Chuẩn bị đường vẽ SVG tự vẽ (SVG path draw)
    document.querySelectorAll(".draw-path").forEach((path) => {
      const len = Math.ceil(path.getTotalLength ? path.getTotalLength() : 180);
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = len;
    });

    // Tạo đúng một paused GSAP timeline cho toàn bộ composition
    const tl = gsap.timeline({ paused: true });

    // -------------------------------------------------------------
    // SHOT 1: Camera Zoom & Visuals (0.00s -> 6.16s)
    // -------------------------------------------------------------
    // Entrance grow nhẹ cho video shot 1
    tl.fromTo(
      "#vid-shot-1",
      { scale: 1.0, opacity: 0 },
      { scale: 1.03, opacity: 1, duration: 0.6, ease: "power2.out" },
      0
    );
    // Camera zoom-in tài liệu và cân công lý xuyên suốt Shot 1
    tl.to(
      "#vid-shot-1",
      { scale: 1.12, duration: 5.56, ease: "none" },
      0.6
    );

    // Overlay 1: Badge icon Doc xuất hiện khi nhắc tới tài liệu chứng nhận
    tl.fromTo(
      "#badge-doc",
      { scale: 0, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      1.6
    );
    tl.to(
      "#clip-doc .draw-path",
      { strokeDashoffset: 0, duration: 0.5, ease: "power2.out", stagger: 0.08 },
      1.7
    );
    tl.to(
      "#badge-doc",
      { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" },
      2.85
    );

    // Overlay 2: Thẻ Huân chương kháng chiến (Đức Huy)
    tl.fromTo(
      "#card-medal",
      { scale: 0.85, opacity: 0, y: 40 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      2.83
    );
    tl.fromTo(
      "#rule-medal",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.4, ease: "power2.out" },
      3.05
    );
    tl.to(
      "#card-medal",
      { opacity: 0, scale: 0.95, y: -20, duration: 0.25, ease: "power2.in" },
      4.78
    );

    // Overlay 3: Thẻ Nghĩa vụ quân sự (Sơn)
    tl.fromTo(
      "#card-military",
      { scale: 0.85, opacity: 0, y: 40 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      5.24
    );
    tl.fromTo(
      "#rule-military",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.4, ease: "power2.out" },
      5.45
    );
    tl.to(
      "#card-military",
      { opacity: 0, scale: 0.95, y: -20, duration: 0.25, ease: "power2.in" },
      6.99
    );

    // -------------------------------------------------------------
    // SHOT 2: Búa thẩm phán gõ nhịp ghi nhận (6.16s -> 9.47s)
    // -------------------------------------------------------------
    // Shot 2 cắt cảnh trực tiếp (transitionIn: cut) tại 6.16s
    tl.fromTo(
      "#vid-shot-2",
      { scale: 1.0 },
      { scale: 1.04, duration: 3.31, ease: "none" },
      6.16
    );

    // Overlay 4: Icon Check & Badge "TÒA ÁN GHI NHẬN"
    tl.fromTo(
      "#badge-check",
      { scale: 0, opacity: 0, y: 30 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      6.73
    );
    tl.to(
      "#clip-check .draw-path",
      { strokeDashoffset: 0, duration: 0.5, ease: "power2.out", stagger: 0.12 },
      6.85
    );
    tl.to(
      "#badge-check",
      { opacity: 0, scale: 0.95, duration: 0.2, ease: "power2.in" },
      7.95
    );

    // Overlay 5: Climax Punch Phrase "GIẢM NHẸ BỔ SUNG"
    tl.fromTo(
      "#punch-card",
      { scale: 0.8, opacity: 0, y: 50 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      8.19
    );
    tl.fromTo(
      "#punch-bar-line",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.35, ease: "power2.out" },
      8.4
    );

    // Đăng ký timeline chính thức vào registry HyperFrames
    window.__timelines["scene-s20"] = tl;
  </script>

  </body>
