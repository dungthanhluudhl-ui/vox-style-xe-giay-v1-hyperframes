<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #0b0f14;
        color: #f7f4ec;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }

      /* Base layout chuẩn cho các clip full-frame */
      .clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Media layers (Video & Image) */
      .media-element {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        display: block;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      #vid-03 {
        z-index: 1;
      }

      #img-06 {
        z-index: 1;
      }

      /* Lớp phủ Spotlight Vignette theo DNA backgroundVariant: spotlight */
      .spotlight-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 48%,
          transparent 35%,
          rgba(15, 18, 22, 0.45) 75%,
          rgba(10, 12, 16, 0.8) 100%
        );
        pointer-events: none;
        z-index: 5;
      }

      /* Lưới ô vuông 84px đặc trưng Vox collage */
      .grid-overlay {
        position: absolute;
        inset: 0;
        background-size: 84px 84px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.14) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.14) 1.5px, transparent 1.5px);
        mix-blend-mode: multiply;
        pointer-events: none;
        z-index: 6;
      }

      /* Lớp grain giấy báo ngà */
      .grain-overlay {
        position: absolute;
        inset: 0;
        opacity: 0.18;
        mix-blend-mode: multiply;
        pointer-events: none;
        z-index: 7;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Container punch badges định vị bằng flexbox, không dùng translate(-50%) */
      .punch-layer {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 260px;
        padding-left: 60px;
        padding-right: 60px;
        z-index: 25;
        pointer-events: none;
      }

      /* Thẻ Punch Card phong cách Brutalist Paper Collage */
      .punch-card {
        width: 100%;
        max-width: 960px;
        background-color: #141414;
        border-radius: 18px;
        padding: 30px 40px;
        box-shadow:
          0 20px 48px rgba(0, 0, 0, 0.65),
          8px 8px 0px rgba(255, 106, 26, 0.45);
        border: 2px solid rgba(255, 106, 26, 0.3);
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .punch-card.card-danger {
        border: 3px solid #ff6a1a;
        box-shadow:
          0 22px 54px rgba(0, 0, 0, 0.75),
          10px 10px 0px #ff6a1a;
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .card-tag {
        font-size: 24px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 3px;
        color: #ff6a1a;
      }

      .card-tag.tag-white {
        color: #f7f4ec;
      }

      .card-title {
        font-size: 70px;
        font-weight: 900;
        line-height: 1.25;
        color: #f7f4ec;
        letter-spacing: -1px;
        margin: 0;
      }

      .text-orange {
        color: #ff6a1a;
      }

      /* Icon SVG tự vẽ dần chuẩn DNA Vox */
      .drawn-icon {
        display: block;
        flex-shrink: 0;
      }

      .draw-stroke {
        fill: none;
        stroke: #ff6a1a;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Thanh cam nhận diện thương hiệu cố định ở đáy (1080x12px) */
      #persistent-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 12px;
        background-color: #ff6a1a;
        z-index: 50;
        pointer-events: none;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s35"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="5.6"
      data-layout-allow-overflow="true"
    >
      <!-- TRACK 0: MEDIA CLIPS -->
      <!-- Shot 1 Video (0.0s -> 3.6s): Chiếc cân nghiêng, đĩa tiền 30 triệu bổng lên -->
      <video
        id="vid-03"
        class="media-element"
        src="assets/vid-03-scale-consequence-vs-benefit.mp4"
        data-start="0"
        data-duration="3.6"
        data-media-start="0"
        data-track-index="0"
        muted
        playsinline
        preload="auto"
      ></video>

      <!-- Shot 2 Image (3.6s -> 5.6s): Cửa sắt & tờ lịch 38 tháng tù ghì sập đáy -->
      <img
        id="img-06"
        class="clip media-element"
        src="assets/img-06-scale-consequence-vs-benefit.jpeg"
        alt="Bản án 38 tháng tù"
        data-start="3.6"
        data-duration="2.0"
        data-track-index="0"
      />

      <!-- BACKGROUND OVERLAYS (Spotlight, 84px Grid, Paper Grain) -->
      <div class="spotlight-vignette" data-layout-ignore="true"></div>
      <div class="grid-overlay" data-layout-ignore="true"></div>
      <div class="grain-overlay" data-layout-ignore="true"></div>

      <!-- TRACK 1: PUNCH OVERLAYS -->
      <!-- Punch 1 Clip: "THU 30 TRIỆU" + icon money (2.22s -> 3.60s) -->
      <div
        id="punch-shot-1"
        class="clip punch-layer"
        data-start="2.22"
        data-duration="1.38"
        data-track-index="1"
      >
        <div id="punch-card-1" class="punch-card">
          <div class="card-header">
            <span class="card-tag">LỢI NHUẬN BẤT CHÍNH</span>
            <svg
              id="icon-money"
              class="drawn-icon"
              viewBox="0 0 64 64"
              width="54"
              height="54"
            >
              <rect
                class="draw-stroke"
                x="6"
                y="16"
                width="52"
                height="32"
                rx="5"
              />
              <circle class="draw-stroke" cx="32" cy="32" r="8" />
              <line class="draw-stroke" x1="14" y1="24" x2="14" y2="40" />
              <line class="draw-stroke" x1="50" y1="24" x2="50" y2="40" />
            </svg>
          </div>
          <h2 class="card-title">
            <span class="text-orange">THU</span> 30 TRIỆU
          </h2>
        </div>
      </div>

      <!-- Punch 2 Clip: "GIÁ: 38 THÁNG TÙ" + icon warning (3.96s -> 5.60s) -->
      <div
        id="punch-shot-2"
        class="clip punch-layer"
        data-start="3.96"
        data-duration="1.64"
        data-track-index="1"
      >
        <div id="punch-card-2" class="punch-card card-danger">
          <div class="card-header">
            <span class="card-tag tag-white">CÁI GIÁ CUỐI CÙNG</span>
            <svg
              id="icon-warning"
              class="drawn-icon"
              viewBox="0 0 64 64"
              width="54"
              height="54"
            >
              <path class="draw-stroke" d="M32 7 L59 53 L5 53 Z" />
              <line class="draw-stroke" x1="32" y1="23" x2="32" y2="37" />
              <circle class="draw-stroke" cx="32" cy="45" r="2.5" />
            </svg>
          </div>
          <h2 class="card-title">
            GIÁ: <span class="text-orange">38 THÁNG TÙ</span>
          </h2>
        </div>
      </div>

      <!-- Chữ ký nhận diện thương hiệu: Dải cam mỏng đáy khung hình -->
      <div id="persistent-bottom-bar" data-layout-ignore="true"></div>
    </div>

    <script>
      // 1. Đo và khởi tạo stroke-dasharray/offset cho tất cả icon SVG tự vẽ
      var strokeElements = document.querySelectorAll(".draw-stroke");
      strokeElements.forEach(function (el) {
        var len = 180;
        if (typeof el.getTotalLength === "function") {
          try {
            len = Math.ceil(el.getTotalLength());
          } catch (e) {
            len = 180;
          }
        }
        el.style.strokeDasharray = (len + 2) + "px";
        el.style.strokeDashoffset = (len + 2) + "px";
        el.setAttribute("data-len", (len + 2).toString());
      });

      // 2. Tạo duy nhất 1 GSAP timeline gốc ở trạng thái PAUSED
      const tl = gsap.timeline({ paused: true });

      // --- SHOT 1 CHOREOGRAPHY (0.0s -> 3.6s) ---
      // Entrance animation: "strike" - giáng mạnh từ trên xuống có độ nén
      tl.fromTo(
        "#vid-03",
        { y: -45, opacity: 0.75 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        0
      );

      // Camera motion: zoom-in chậm dần theo shotlist
      tl.fromTo(
        "#vid-03",
        { scale: 1.0 },
        { scale: 1.08, duration: 3.6, ease: "none" },
        0
      );

      // Punch overlay 1: "THU 30 TRIỆU" xuất hiện tại t = 2.22s (atMs: 280700)
      tl.fromTo(
        "#punch-card-1",
        { y: 48, opacity: 0, scale: 0.94 },
        { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        2.22
      );

      // Icon Money tự vẽ xuất hiện tại t = 2.55s (atMs: 281070)
      tl.fromTo(
        "#icon-money",
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" },
        2.55
      );

      var moneyStrokes = document.querySelectorAll("#icon-money .draw-stroke");
      moneyStrokes.forEach(function (stroke, idx) {
        var strokeLen = parseFloat(stroke.getAttribute("data-len")) || 180;
        tl.fromTo(
          stroke,
          { strokeDashoffset: strokeLen },
          { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
          2.59 + idx * 0.07
        );
      });

      // --- SHOT 2 CHOREOGRAPHY (3.6s -> 5.6s) ---
      // Transition in: "cut" với hiệu ứng chấn động ghì sập tại t = 3.6s
      tl.fromTo(
        "#img-06",
        { y: -30, scale: 1.04 },
        { y: 0, scale: 1.0, duration: 0.28, ease: "power4.out" },
        3.6
      );

      // Punch overlay 2: "GIÁ: 38 THÁNG TÙ" xuất hiện tại t = 3.96s (atMs: 282440)
      tl.fromTo(
        "#punch-card-2",
        { y: 56, opacity: 0, scale: 0.92 },
        { y: 0, opacity: 1, scale: 1, duration: 0.48, ease: "power3.out" },
        3.96
      );

      // Icon Warning tự vẽ xuất hiện tại t = 4.55s (atMs: 283070)
      tl.fromTo(
        "#icon-warning",
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" },
        4.55
      );

      var warningStrokes = document.querySelectorAll("#icon-warning .draw-stroke");
      warningStrokes.forEach(function (stroke, idx) {
        var strokeLen = parseFloat(stroke.getAttribute("data-len")) || 180;
        tl.fromTo(
          stroke,
          { strokeDashoffset: strokeLen },
          { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" },
          4.59 + idx * 0.08
        );
      });

      // 3. Đăng ký timeline duy nhất cho HyperFrames render engine
      window.__timelines["scene-s35"] = tl;
    </script>
  
    </template>
  </body>
</html>
