  <script>
    // Khởi tạo Timeline GSAP độc lập ở trạng thái paused cho HyperFrames seek
    const tl = gsap.timeline({ paused: true });

    // Đo đạc hình học SVG chính xác để animate nét vẽ stroke-dashoffset
    const arrowFallPath = document.getElementById("arrow-fall-path");
    if (arrowFallPath) {
      const lenFall = arrowFallPath.getTotalLength();
      arrowFallPath.style.strokeDasharray = lenFall;
      arrowFallPath.style.strokeDashoffset = lenFall;
    }

    const branchArrowPath = document.getElementById("branch-arrow-path");
    if (branchArrowPath) {
      const lenBranch = branchArrowPath.getTotalLength();
      branchArrowPath.style.strokeDasharray = lenBranch;
      branchArrowPath.style.strokeDashoffset = lenBranch;
    }

    // ==================== GSAP CHOREOGRAPHY ====================

    // --- SHOT 1: Tiến & Sơn xin giảm án (0s -> 3.48s) ---
    // Transition In: Flip 3D nhẹ nhàng
    tl.fromTo(
      "#shot1-inner",
      { opacity: 0, rotationY: -16, scale: 0.94 },
      { opacity: 1, rotationY: 0, scale: 1, duration: 0.65, ease: "power3.out" },
      0
    );

    // Pan camera nhẹ trên ảnh Tiến & Sơn (pan-left)
    tl.fromTo(
      "#shot1-img",
      { x: 25 },
      { x: -30, duration: 3.48, ease: "none" },
      0
    );

    // Overlay Tiến & Sơn: Giảm án (atMs: 135410 -> 0.81s)
    tl.fromTo(
      "#shot1-overlay",
      { opacity: 0, y: 36 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      0.81
    );

    // Animate nét vẽ SVG mũi tên fall
    if (arrowFallPath) {
      const lenFall = arrowFallPath.getTotalLength();
      tl.fromTo(
        arrowFallPath,
        { strokeDashoffset: lenFall },
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        0.95
      );
    }

    // Kết thúc hiển thị overlay shot 1 trước khi chuyển cảnh (holdMs: 2200 -> 3.01s)
    tl.to(
      "#shot1-overlay",
      { opacity: 0, y: -16, duration: 0.35, ease: "power2.in" },
      3.01
    );


    // --- SHOT 2: Đức Huy xin án treo (3.48s -> 8.22s) ---
    // Transition In: Cut sang nửa phải (Đức Huy)
    tl.fromTo(
      "#shot2-inner",
      { opacity: 0.3 },
      { opacity: 1, duration: 0.15, ease: "power1.out" },
      3.48
    );

    // Pan camera nhẹ trên ảnh Đức Huy (pan-right)
    tl.fromTo(
      "#shot2-img",
      { x: -20 },
      { x: 35, duration: 4.74, ease: "none" },
      3.48
    );

    // Punch Phrase: HUY: XIN ÁN TREO (atMs: 138400 -> 3.80s)
    tl.fromTo(
      "#punch-huy",
      { scale: 0.85, opacity: 0, y: 24 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      3.80
    );

    // Sơ đồ phân nhánh xuất hiện kèm mũi tên rẽ nhánh
    tl.fromTo(
      "#shot2-diagram",
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      4.10
    );

    if (branchArrowPath) {
      const lenBranch = branchArrowPath.getTotalLength();
      tl.fromTo(
        branchArrowPath,
        { strokeDashoffset: lenBranch },
        { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" },
        4.30
      );
    }

    // Label: Cải tạo ngoài xã hội (atMs: 140030 -> 5.43s)
    tl.fromTo(
      "#label-caitao",
      { scale: 0.9, opacity: 0, y: 20 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      5.43
    );

    // Thoái trào nhẹ nhàng ở cuối scene trước khi cắt sang scene kế tiếp (7.7s)
    tl.to(
      ["#punch-huy", "#label-caitao", "#shot2-diagram"],
      { opacity: 0.3, duration: 0.45, ease: "power2.in" },
      7.70
    );

    // Đăng ký timeline chính vào registry của HyperFrames
    window.__timelines["scene-s16"] = tl;
  </script>
