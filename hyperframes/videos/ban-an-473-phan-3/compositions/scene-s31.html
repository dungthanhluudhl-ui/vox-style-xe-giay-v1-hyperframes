      docStroke.setAttribute("stroke-dasharray", String(docLen));
      docStroke.setAttribute("stroke-dashoffset", String(docLen));
      tl.fromTo(
        "#doc-stroke",
        { strokeDashoffset: docLen },
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        3.95
      );

    tl.to(

    tl.fromTo(

      { scale: 1, duration: 0.32, ease: "power3.out" },
      5.19
    );
    tl.to(

    );

    // Official Verdict Stamp Slam ("TIẾN: 38 THÁNG"): enters at 8.28s, holds till end
