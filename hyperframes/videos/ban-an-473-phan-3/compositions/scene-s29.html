  <!-- Master Timeline Orchestration -->
  <script>
    const tl = gsap.timeline({ paused: true });

    // 0. Establish explicit stable resting baselines at t=0 for all timed elements
    tl.set("#diagram-card", { scale: 0.94, opacity: 0 }, 0);
    tl.set("#top-card", { y: -20, opacity: 0 }, 0);
    tl.set("#fishing-rod", { x: 0, y: 0, opacity: 1, rotation: 0 }, 0);
    tl.set("#electrodes", { y: -450, opacity: 0 }, 0);
    tl.set("#fish-1-body", { rotation: 0 }, 0);
    tl.set("#fish-2-body", { rotation: 0 }, 0);
    tl.set("#fish-3-body", { rotation: 0 }, 0);
    tl.set("#blast-flash", { opacity: 0 }, 0);
    tl.set("#water-glow", { opacity: 0 }, 0);
    tl.set(["#shockwave-1", "#shockwave-2"], { opacity: 0 }, 0);
    tl.set("#punch-card", { y: 40, opacity: 0, scale: 0.95 }, 0);
    tl.set("#warning-path", { strokeDashoffset: 120 }, 0);
    tl.set("#warning-exclamation", { scale: 0, transformOrigin: "50% 50%" }, 0);
    tl.set("#lightning-arcs", { opacity: 0 }, 0);

    // 1. Camera Steady Cinematic Zoom (0s -> 6.29s)
    tl.fromTo("#camera-rig", 
      { scale: 1.0 }, 
      { scale: 1.05, duration: 6.29, ease: "none" }, 
      0
    );

    // 2. Primary Visual: Diagram Card Shatter/Entrance (0.1s -> 0.55s)
    tl.to("#diagram-card", 
      { scale: 1.0, opacity: 1, duration: 0.45, ease: "power3.out" }, 
      0.1
    );

    // 3. Phase 1: Fish Swimming & Bobber Floating (0s -> 3.6s)
    tl.fromTo("#fish-1-swim", 
      { x: 0, y: 0 }, 
      { x: 25, y: -8, duration: 1.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 
      0
    );
    tl.fromTo("#fish-2-swim", 
      { x: 0, y: 0 }, 
      { x: -28, y: 10, duration: 1.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 
      0
    );
    tl.fromTo("#fish-3-swim", 
      { x: 0, y: 0 }, 
      { x: 20, y: -6, duration: 1.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, 
      0
    );
    tl.fromTo("#bobber", 
      { y: 0 }, 
      { y: 8, duration: 0.85, ease: "sine.inOut", yoyo: true, repeat: 3 }, 
      0
    );

    // 4. Overlay 1: Top Card ("Câu cá bình thường") appears at 1.55s (232780 ms), holds until 3.45s
    tl.to("#top-card", 
      { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 
      1.55
    );
    tl.to("#top-card", 
      { y: -20, opacity: 0, duration: 0.25, ease: "power2.in" }, 
      3.45
    );

    // 5. Phase 2: Fishing Rod Rejected & Electrodes Plunge In (3.5s -> 4.25s)
    tl.to("#fishing-rod", 
      { x: -180, y: -70, opacity: 0, rotation: -25, duration: 0.35, ease: "power2.in" }, 
      3.50
    );
    tl.to("#electrodes", 
      { y: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, 
      3.80
    );

    // 6. Phase 3: Electrocution Blast at 4.65s (235880 ms)
    tl.fromTo("#blast-flash", 
      { opacity: 0.75 }, 
      { opacity: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, 
      4.65
    );
    tl.fromTo("#water-glow", 
      { opacity: 0 }, 
      { opacity: 0.45, duration: 0.1, ease: "power2.out", immediateRender: false }, 
      4.65
    );

    // Expanding Shockwaves
    tl.fromTo("#shockwave-1", 
      { attr: { r: 10 }, opacity: 1 }, 
      { attr: { r: 300 }, opacity: 0, duration: 0.85, ease: "power2.out", immediateRender: false }, 
      4.65
    );
    tl.fromTo("#shockwave-2", 
      { attr: { r: 10 }, opacity: 1 }, 
      { attr: { r: 300 }, opacity: 0, duration: 0.85, ease: "power2.out", immediateRender: false }, 
      4.70
    );

    // Fish Shocked: Flip Belly-Up
    tl.to("#fish-1-body", 
      { rotation: 165, transformOrigin: "0px 0px", duration: 0.25, ease: "power3.out" }, 
      4.65
    );
    tl.to("#fish-2-body", 
      { rotation: -170, transformOrigin: "0px 0px", duration: 0.25, ease: "power3.out" }, 
      4.65
    );
    tl.to("#fish-3-body", 
      { rotation: 175, transformOrigin: "0px 0px", duration: 0.25, ease: "power3.out" }, 
      4.65
    );

    // 7. Overlay 2: Punch Card "XẢ ĐIỆN CẢ HỒ" (4.65s, holds until 6.29s)
    tl.to("#punch-card", 
      { y: 0, opacity: 1, scale: 1.0, duration: 0.4, ease: "power4.out" }, 
      4.65
    );

    // 8. Overlay 3: Warning Icon Self-Drawing Path (4.83s, 236060 ms)
    tl.to("#warning-path", 
      { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 
      4.83
    );
    tl.to("#warning-exclamation", 
      { scale: 1, duration: 0.18, ease: "power3.out" }, 
      5.00
    );

    // 9. Lightning Arc Crackles (Discrete deterministic flickers)
    const flickerMoments = [4.65, 4.80, 4.96, 5.16, 5.42, 5.72, 6.02];
    flickerMoments.forEach((ts) => {
      tl.set("#lightning-arcs", { opacity: 1 }, ts);
      tl.set("#lightning-arcs", { opacity: 0 }, ts + 0.08);
    });

    // Register paused timeline with root composition id
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s29"] = tl;
  </script>
