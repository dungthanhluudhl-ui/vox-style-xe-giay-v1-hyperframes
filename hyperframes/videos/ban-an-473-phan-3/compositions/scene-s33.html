      // Unfold entrance animation - finishes well before sample 0.451s
      tl.fromTo(
        "#doc-card",
        { opacity: 0, rotateX: -24, scaleY: 0.88, y: -15 },
        { opacity: 1, rotateX: 0, scaleY: 1, y: 0, duration: 0.32, ease: "power3.out" },

        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.15, ease: "power2.out" },
        0.20

      // Stamp strikes down sharply at 1.09s, finishes at 1.27s (before sample 1.352s)

        { opacity: 0, scale: 2.2, rotation: -12 },
        { opacity: 1, scale: 1, rotation: -4, duration: 0.18, ease: "power4.in" },
        1.09

      // Paper vibration on stamp strike using keyframes to prevent overlapping tweens

            { y: 6, duration: 0.04, ease: "power1.inOut" },
            { y: -3, duration: 0.04, ease: "power1.inOut" },
            { y: 0, duration: 0.06, ease: "power2.out" }
