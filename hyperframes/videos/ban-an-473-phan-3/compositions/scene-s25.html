    // Khởi tạo paused timeline duy nhất theo hợp đồng HyperFrames
    const tl = gsap.timeline({ paused: true });

    // ==========================================
    // CHOREOGRAPHY
    // ==========================================

    // 0. Camera Zoom-in nhẹ xuyên suốt 8.32s
    tl.fromTo("#cameraRig", 
      { scale: 1.0 }, 
      { scale: 1.06, duration: 8.32, ease: "none" }, 
      0
    );

    // 1. Entrance: Header dẫn nhập xuất hiện mượt
    tl.fromTo("#leadHeader",
      { y: -40, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
      0.15
    );

    // 2. Entrance Mockup Phone: Trồi lên từ dưới (Rise)
    tl.fromTo("#phoneStage",
      { y: 380, opacity: 0, scale: 0.92 },
      { y: 0, opacity: 1, scale: 1.0, duration: 0.85, ease: "power3.out" },
      0.3
    );

    // Đổ bóng cam: GSAP quản lý hoàn toàn x/y (không có CSS transform xung đột)
    tl.fromTo("#phoneShadow",
      { x: 0, y: 0, opacity: 0 },
      { x: 16, y: 18, opacity: 1, duration: 0.5, ease: "power2.out" },
      0.7
    );

    // 3. App UI Animation: Search bar focus (smooth power3.out, không bouncy)
    tl.fromTo("#searchBox",
      { scale: 0.96, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      1.05
    );

    // Search Cursor nhấp nháy
    tl.fromTo("#searchCursor",
      { opacity: 1 },
      { opacity: 0, duration: 0.35, repeat: 5, yoyo: true, ease: "steps(1)" },
      1.25
    );

    // Grid sản phẩm pop-in stagger mượt mà
    tl.fromTo("#prod1",
      { y: 30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      1.5
    );

    tl.fromTo("#prod2",
      { y: 30, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      1.7
    );

    tl.fromTo("#liveBanner",
      { y: 20, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
      1.9
    );

    // Cart badge nảy nhẹ
    tl.fromTo("#phoneCart",
      { scale: 1 },
      { scale: 1.22, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out" },
      2.15
    );

    // Gentle float riêng trên phoneFloatWrapper (tách phần tử, độc lập entrance, 100% deterministic)
    tl.fromTo("#phoneFloatWrapper",
      { y: 0 },
      { y: -10, duration: 1.8, yoyo: true, repeat: 2, ease: "sine.inOut" },
      2.5
    );

    // ==========================================
    // OVERLAYS ĐỒNG BỘ CHÍNH XÁC VỚI SHOTLIST
    // ==========================================

    // 4. Icon Phone Vocabulary: atMs 204940 (tương đối 4.33s)
    tl.fromTo("#phoneIconAccent",
      { scale: 0, opacity: 0, rotation: -20 },
      { scale: 1, opacity: 1, rotation: 10, duration: 0.5, ease: "power3.out" },
      4.33
    );

    // 5. Label Sticker: "Khởi đầu đời thường" tại atMs 206700 (tương đối 6.09s)
    tl.fromTo("#labelTape",
      { scale: 0, opacity: 0, rotation: 6 },
      { scale: 1, opacity: 1, rotation: -2, duration: 0.45, ease: "power3.out" },
      6.09
    );

    tl.fromTo("#packageSticker",
      { scale: 0, opacity: 0, rotation: -10 },
      { scale: 1, opacity: 1, rotation: 4, duration: 0.4, ease: "power3.out" },
      6.25
