<!doctype html>
<html lang="vi" data-resolution="portrait"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080, height=1920"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
#root{position:relative;width:1080px;height:1920px;background:#E7E3D9;overflow:hidden}
.bg-wrap{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.bg-grid{position:absolute;left:-168px;top:-168px;width:1416px;height:2256px;
 background-image:linear-gradient(to right,rgba(20,20,20,0.32) 1.5px,transparent 1.5px),linear-gradient(to bottom,rgba(20,20,20,0.32) 1.5px,transparent 1.5px);
 background-size:84px 84px}
.capy-stage{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;width:1080px;height:1920px;padding:160px 40px 530px;box-sizing:border-box}
.capy-actor{display:block;height:100%;width:auto;max-width:100%;object-fit:contain;transform-origin:center center}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
 <div class="bg-wrap"><div id="bg-grid" class="bg-grid"></div></div>
 <div class="capy-stage"><img id="capy-actor" class="capy-actor clip" data-start="0" data-duration="4" data-track-index="0" src="assets/capy-v1-host-question.png" width="1024" height="1536" alt="Capybara narrator, question pose"></div>
</div>
<script src="assets/gsap.min.js"></script>
<script>
(() => {
 const tl = gsap.timeline({ paused: true });
 tl.fromTo('#bg-grid', { x: 0, y: 0 }, { x: -84, y: 0, duration: 4, ease: 'none', immediateRender: false }, 0);
 tl.fromTo('#capy-actor', { scale: 0.97 }, { scale: 1, duration: 0.6, ease: 'power2.out', immediateRender: false }, 0);
 window.__timelines = window.__timelines || {};
 window.__timelines['main'] = tl;
})();
</script></body></html>
