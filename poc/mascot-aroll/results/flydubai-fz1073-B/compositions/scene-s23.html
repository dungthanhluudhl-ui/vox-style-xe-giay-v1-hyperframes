      <style>

.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      background: #F5F0E4;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      width: 1080px;
      height: 1920px;
    }

    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F5F0E4;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Safe color tokens */
    .hf-text-ink { color: #141414; }
    .hf-text-light { color: #F7F4EC; }
    .hf-hl-orange { background: #FF6A1A; color: #141414; }
    .hf-plate-ink { background: #141414; color: #F7F4EC; }
    .hf-plate-ink-orange { background: #141414; color: #FF6A1A; }
    .hf-plate-paper { background: #E7E3D9; color: #141414; }

    /* Crosshairs decoration */
    .crosshair {
      position: absolute;
      width: 28px;
      height: 28px;
      pointer-events: none;
    }
    .crosshair::before, .crosshair::after {
      content: "";
      position: absolute;
      background-color: rgba(20, 20, 20, 0.35);
    }
    .crosshair::before {
      top: 13px;
      left: 0;
      width: 28px;
      height: 2px;
    }
    .crosshair::after {
      top: 0;
      left: 13px;
      width: 2px;
      height: 28px;
    }

    /* Punch phrase block */
    #punch-card-wrapper {
      position: absolute;
      top: 240px;
      left: 140px;
      width: 800px;
      height: 130px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #punch-card {
      width: 100%;
      height: 100%;
      background-color: #FF6A1A;
      border: 4px solid #141414;
      border-radius: 18px;
      box-shadow: 10px 10px 0px #141414;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }

    #punch-text {
      color: #141414;
      font-size: 58px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      white-space: nowrap;
      line-height: 1.2;
    }

    /* SVG Timeline layer */
    #timeline-svg {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      pointer-events: none;
    }

    /* Cards */
    .timeline-card-wrapper {
      position: absolute;
      left: 280px;
      width: 700px;
      height: 160px;
    }

    .timeline-card {
      width: 100%;
      height: 100%;
      background-color: #141414;
      border-radius: 18px;
      box-shadow: 10px 10px 0px rgba(20, 20, 20, 0.25);
      border-left: 16px solid #FF6A1A;
      display: flex;
      align-items: center;
      padding-left: 40px;
      box-sizing: border-box;
      transform-origin: left center;
    }

    .card-inner {
      width: 100%;
      display: flex;
      align-items: center;
    }

    .card-text {
      color: #F7F4EC;

      line-height: 1.2;

    #card-1994-wrapper {
      top: 590px;
    }

    #card-2026-wrapper {
      top: 990px;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s23"
    data-width="1080"
    data-height="1920"
    data-duration="10.32"
  >
    <section id="shot-s23-1" class="clip" data-start="0" data-duration="10.32">
      <!-- Decorative corner crosshairs -->
      <div class="crosshair" style="top: 180px; left: 80px;"></div>
      <div class="crosshair" style="top: 180px; right: 80px;"></div>
      <div class="crosshair" style="top: 1360px; left: 80px;"></div>
      <div class="crosshair" style="top: 1360px; right: 80px;"></div>

      <!-- Punch Phrase Header -->
      <div id="punch-card-wrapper">
        <div id="punch-card">
          <span id="punch-text">LỖ HỔNG NỘI BỘ</span>
        </div>
      </div>

      <!-- Timeline SVG layer (Spine, Connectors, Nodes) -->
      <svg id="timeline-svg" viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Spine segment 1: 440 to 670 -->
        <line
          id="spine-seg-1"
          x1="190" y1="440" x2="190" y2="670"
          stroke="#141414" stroke-width="8" stroke-linecap="round"
        />

        <!-- Connector 1: 190 to 280 at y=670 -->
        <line
          id="connector-1"
          x1="190" y1="670" x2="280" y2="670"
          stroke="#141414" stroke-width="6" stroke-linecap="round"
        />

        <!-- Node 1 at (190, 670) -->
        <g id="node-1" style="transform-origin: 190px 670px;">
          <circle cx="190" cy="670" r="26" fill="#FF6A1A" stroke="#141414" stroke-width="6" />
          <circle cx="190" cy="670" r="9" fill="#141414" />
        </g>

        <!-- Spine segment 2: 670 to 1070 -->
        <line
          id="spine-seg-2"
          x1="190" y1="670" x2="190" y2="1070"
          stroke="#141414" stroke-width="8" stroke-linecap="round"
        />

        <!-- Connector 2: 190 to 280 at y=1070 -->
        <line
          id="connector-2"
          x1="190" y1="1070" x2="280" y2="1070"

        />

        <!-- Node 2 at (190, 1070) -->
        <g id="node-2" style="transform-origin: 190px 1070px;">
          <circle cx="190" cy="1070" r="26" fill="#FF6A1A" stroke="#141414" stroke-width="6" />
          <circle cx="190" cy="1070" r="9" fill="#141414" />
        </g>

        <!-- Spine segment 3: 1070 to 1270 -->
        <line
          id="spine-seg-3"
          x1="190" y1="1070" x2="190" y2="1270"
          stroke="#141414" stroke-width="8" stroke-linecap="round"
        />

        <!-- Arrow head at the end of timeline (190, 1285) -->
        <polygon
          id="spine-arrow"

      <!-- Label 1: 1994: FedEx 705 -->

        </div>

    </section>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Measure SVG stroke lengths for path drawing
    const paths = [
      { id: "spine-seg-1", len: 230 },
      { id: "spine-seg-2", len: 400 },
      { id: "spine-seg-3", len: 200 },
      { id: "connector-1", len: 90 },
      { id: "connector-2", len: 90 }
    ];

    paths.forEach(item => {
      const el = document.getElementById(item.id);
      if (el) {
        const length = el.getTotalLength ? el.getTotalLength() : item.len;
        el.style.strokeDasharray = length;
        el.style.strokeDashoffset = length;
      }
    });

    // 1. Punch Phrase entrance ("unfold" reveal at 0.28s)
    tl.fromTo(
      "#punch-card",
      { scaleX: 0, opacity: 0 },
      { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
      0.28
    );
    tl.fromTo(
      "#punch-text",
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
      0.46
    );

    // Punch Phrase subtle ambient breathe
    tl.to(
      "#punch-card",
      { scale: 1.014, duration: 1.3, yoyo: true, repeat: 5, ease: "sine.inOut" },
      1.1
    );

    // 2. Timeline spine segment 1 & node 1
    tl.to(
      "#spine-seg-1",
      { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
      0.45
    );
    tl.fromTo(
      "#node-1",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      0.82
    );
    tl.to(
      "#connector-1",
      { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
      1.02
    );

    // 3. Card 1994 entrance ("unfold" from spine at 1.28s)
    tl.fromTo(
      "#card-1994",
      { scaleX: 0, opacity: 0 },
      { scaleX: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
      1.28
    );
    tl.fromTo(
      "#text-1994",
      { opacity: 0, x: -16 },
      { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" },
      1.48
    );

    // Card 1994 subtle ambient bob (vertical drift)
    tl.to(
      "#card-1994-inner",
      { y: -6, duration: 1.2, yoyo: true, repeat: 5, ease: "sine.inOut" },
      2.0
    );

    // 4. Timeline spine segment 2 bridging to 2026
    tl.to(
      "#spine-seg-2",
      { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" },
      3.3
    );
    tl.fromTo(
      "#node-2",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      4.0
    );
    tl.to(
      "#connector-2",
      { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" },
      4.25
    );

    // 5. Card 2026 entrance ("unfold" from spine at 4.58s)
    tl.fromTo(
      "#card-2026",
      { scaleX: 0, opacity: 0 },
      { scaleX: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
      4.58
    );
    tl.fromTo(
      "#text-2026",
      { opacity: 0, x: -16 },
      { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" },
      4.78
    );

    // Card 2026 subtle ambient drift-x (horizontal drift)
    tl.to(
      "#card-2026-inner",
      { x: 6, duration: 1.1, yoyo: true, repeat: 3, ease: "sine.inOut" },
      5.3
    );

    // 6. Timeline spine segment 3 & terminating arrow
    tl.to(
      "#spine-seg-3",
      { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
      5.1
    );
    tl.fromTo(
      "#spine-arrow",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.3, ease: "power2.out" },
      5.55
    );

    // Register paused timeline with HyperFrames runtime
    window.__timelines["scene-s23"] = tl;
  </script>
