<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      /* Class màu an toàn theo style-tokens.json và WCAG AAA/AA */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        user-select: none;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* Hợp đồng layout clip: dùng inset: 0, không đặt width/height cứng */
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Nền spotlight theo style DNA v2: nền giấy ngà #E7E3D9 + radial vignette ở mép, KHÔNG có lưới */
      .spotlight-bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 45%, rgba(231, 227, 217, 0) 32%, rgba(20, 20, 20, 0.28) 100%), #E7E3D9;
        z-index: 1;
      }

      /* Wrapper tổng cho toàn bộ nội dung scene */
      #scene-content {
        position: absolute;
        inset: 0;
        z-index: 2;
        transform-origin: 540px 720px;
      }

      /* Lớp đồ họa thước đo góc nghiêng */
      #diagram-ambient {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #gauge-svg {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }

      /* 1. Punch phrase container (đúng 1 khối chữ duy nhất: "NGHIÊNG 140 ĐỘ") */
      #punch-wrap {
        position: absolute;
        top: 220px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
        pointer-events: none;
      }
      .punch-box {
        background-color: #141414;
        color: #FF6A1A;
        font-size: 56px;
        font-weight: 900;
        line-height: 1.2;
        border-radius: 16px;
        padding: 16px 44px;
        border: 2px solid rgba(255, 106, 26, 0.45);
        box-shadow: 0 16px 36px rgba(20, 20, 20, 0.25);
        letter-spacing: -0.5px;
        will-change: transform, opacity;
      }

      /* 2. Nhãn 1 container (đúng 1 khối chữ duy nhất: "Gần như lật úp") */
      #label-1-wrap {
        position: absolute;
        top: 1090px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
        pointer-events: none;
      }
      .label-1-box {
        background-color: #FF6A1A;
        color: #141414;
        font-size: 38px;
        font-weight: 900;
        line-height: 1.25;
        border-radius: 12px;
        padding: 14px 40px;
        box-shadow: 0 10px 28px rgba(255, 106, 26, 0.35);
        will-change: transform, opacity;
      }

      /* 3. Nhãn 2 container (đúng 1 khối chữ duy nhất: "Hất văng kẻ tấn công") */
      #label-2-wrap {
        position: absolute;
        top: 1200px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
        pointer-events: none;
      }
      .label-2-box {
        background-color: #141414;
        color: #F7F4EC;
        font-size: 36px;
        font-weight: 900;
        line-height: 1.25;
        border-radius: 12px;
        padding: 14px 40px;
        border-left: 8px solid #FF6A1A;
        box-shadow: 0 12px 30px rgba(20, 20, 20, 0.22);
        will-change: transform, opacity;
      }
    </style>

    <!-- Root composition: 1080x1920 @ 5.9s (150010 - 144110 = 5900ms) -->
    <div
      id="root"
      data-composition-id="scene-s21"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="5.9"
    >
      <!-- Nền spotlight -->
      <div class="spotlight-bg"></div>

      <!-- Main clip scene S21 -->
      <section id="scene-s21" class="clip" data-start="0" data-duration="5.9">
        <div id="scene-content">
          <!-- Đồ họa sơ đồ kỹ thuật thước đo góc nghiêng & máy bay DC-10 -->
          <div id="diagram-ambient">
            <svg id="gauge-svg" viewBox="0 0 1080 1920">
              <defs>
                <!-- Vùng cắt bán cầu hiển thị chân trời bên trong đồng hồ (tâm 540, 720, r=280) -->
                <clipPath id="horizon-clip">
                  <circle cx="540" cy="720" r="280" />
                </clipPath>
              </defs>

              <!-- Mặt hiển thị chân trời kỹ thuật bên trong đồng hồ -->
              <g clip-path="url(#horizon-clip)">
                <!-- Nửa trên (trời) -->
                <rect x="250" y="430" width="580" height="290" fill="#E7E3D9" />
                <!-- Nửa dưới (đất) -->
                <rect x="250" y="720" width="580" height="290" fill="#DDD8CE" />
                <!-- Đường chân trời chuẩn 0° -->
                <line x1="250" y1="720" x2="830" y2="720" stroke="#141414" stroke-width="3" stroke-dasharray="14 10" />
                <!-- Các vạch nấc pitch độ cao tham chiếu -->
                <line x1="500" y1="660" x2="580" y2="660" stroke="#141414" stroke-width="2.5" stroke-dasharray="8 6" />
                <line x1="515" y1="600" x2="565" y2="600" stroke="#141414" stroke-width="2" stroke-dasharray="6 4" />
                <line x1="500" y1="780" x2="580" y2="780" stroke="#141414" stroke-width="2.5" stroke-dasharray="8 6" />
                <line x1="515" y1="840" x2="565" y2="840" stroke="#141414" stroke-width="2" stroke-dasharray="6 4" />
              </g>

              <!-- Vành đồng hồ đo góc nghiêng (Dial Bezel) -->
              <circle cx="540" cy="720" r="280" stroke="#141414" stroke-width="4.5" fill="none" />
              <circle cx="540" cy="720" r="306" stroke="rgba(20,20,20,0.32)" stroke-width="2" fill="none" />

              <!-- Các vạch chia độ chuẩn khí động học trên vành -->
              <!-- 0° (đỉnh - cánh bằng) -->
              <line x1="540" y1="440" x2="540" y2="400" stroke="#141414" stroke-width="6" stroke-linecap="round" />
              <!-- 30° phải -->
              <line x1="680" y1="477.5" x2="697" y2="467.5" stroke="#141414" stroke-width="3.5" stroke-linecap="round" />
              <!-- 60° phải -->
              <line x1="782.5" y1="580" x2="799.8" y2="570" stroke="#141414" stroke-width="3.5" stroke-linecap="round" />
              <!-- 90° phải (cánh vuông góc 90 độ) -->
              <line x1="820" y1="720" x2="860" y2="720" stroke="#141414" stroke-width="6" stroke-linecap="round" />
              <!-- 120° phải -->
              <line x1="782.5" y1="860" x2="799.8" y2="870" stroke="#141414" stroke-width="3.5" stroke-linecap="round" />
              <!-- VẠCH 140° MỐC CỰC HẠN (Màu cam điểm nhấn) -->
              <line x1="713.6" y1="926.8" x2="745" y2="964" stroke="#FF6A1A" stroke-width="8" stroke-linecap="round" />
              <!-- 180° (đáy - lật úp hoàn toàn) -->
              <line x1="540" y1="1000" x2="540" y2="1040" stroke="#141414" stroke-width="6" stroke-linecap="round" />

              <!-- Vạch đối xứng bên trái -->
              <line x1="400" y1="477.5" x2="383" y2="467.5" stroke="#141414" stroke-width="3.5" stroke-linecap="round" />
              <line x1="297.5" y1="580" x2="280.2" y2="570" stroke="#141414" stroke-width="3.5" stroke-linecap="round" />
              <line x1="260" y1="720" x2="220" y2="720" stroke="#141414" stroke-width="6" stroke-linecap="round" />

              <!-- Cung đo góc 140° (từ 0° đỉnh -> 140° phải theo chiều kim đồng hồ) -->
              <!-- Độ dài cung R=280: 2 * PI * 280 * (140/360) ≈ 684.2px -->
              <path
                id="arc-140"
                d="M 540 440 A 280 280 0 0 1 720 934.5"
                stroke="#FF6A1A"
                stroke-width="10"
                stroke-linecap="round"
                fill="none"
                stroke-dasharray="685"
                stroke-dashoffset="685"
              />

              <!-- Điểm đánh dấu mốc 140 độ tại đầu cung -->
              <g id="target-marker" opacity="0">
                <circle cx="720" cy="934.5" r="16" fill="#FF6A1A" />
                <circle cx="720" cy="934.5" r="28" stroke="#FF6A1A" stroke-width="3.5" fill="none" opacity="0.65" />
              </g>

              <!-- Hình vẽ silhouette máy bay DC-10 nhìn từ phía sau (thuần vector, KHÔNG chứa chữ) -->
              <!-- Tâm xoay đúng trọng tâm máy bay (540, 720) -->
              <g id="airplane">
                <!-- Cánh trái & cánh phải (sải cánh lớn quét lùi) -->
                <path d="M 350 748 L 508 726 L 508 714 L 350 738 Z" fill="#141414" />
                <path d="M 730 748 L 572 726 L 572 714 L 730 738 Z" fill="#141414" />
                <!-- Khe ray cánh tà sau (chi tiết kỹ thuật cam) -->
                <line x1="420" y1="740" x2="420" y2="754" stroke="#FF6A1A" stroke-width="3.5" stroke-linecap="round" />
                <line x1="460" y1="734" x2="460" y2="748" stroke="#FF6A1A" stroke-width="3.5" stroke-linecap="round" />
                <line x1="660" y1="740" x2="660" y2="754" stroke="#FF6A1A" stroke-width="3.5" stroke-linecap="round" />
                <line x1="620" y1="734" x2="620" y2="748" stroke="#FF6A1A" stroke-width="3.5" stroke-linecap="round" />

                <!-- Động cơ số 1 và 3 dưới cánh (vỏ động cơ turbofan) -->
                <rect x="425" y="736" width="30" height="42" rx="15" fill="#141414" stroke="#FF6A1A" stroke-width="3" />
                <circle cx="440" cy="757" r="10" fill="#FF6A1A" />
                <rect x="625" y="736" width="30" height="42" rx="15" fill="#141414" stroke="#FF6A1A" stroke-width="3" />
                <circle cx="640" cy="757" r="10" fill="#FF6A1A" />

                <!-- Cánh đuôi ngang (Horizontal stabilizers) -->
                <path d="M 450 666 L 520 658 L 520 652 L 450 658 Z" fill="#141414" />
                <path d="M 630 666 L 560 658 L 560 652 L 630 658 Z" fill="#141414" />

                <!-- Cánh đuôi đứng (Vertical fin) đặc trưng của DC-10 -->
                <path d="M 526 680 L 533 585 L 547 585 L 554 680 Z" fill="#141414" />
                <line x1="540" y1="585" x2="540" y2="630" stroke="#FF6A1A" stroke-width="3" />

                <!-- Động cơ số 2 đặt xuyên qua gốc đuôi đứng (đặc trưng bất hủ của DC-10) -->
                <rect x="522" y="630" width="36" height="48" rx="16" fill="#141414" stroke="#FF6A1A" stroke-width="3.5" />
                <circle cx="540" cy="654" r="12" fill="#FF6A1A" />

                <!-- Thân máy bay (Fuselage sau) -->
                <ellipse cx="540" cy="720" rx="34" ry="40" fill="#141414" stroke="#FF6A1A" stroke-width="2.5" />
                <circle cx="540" cy="720" r="14" fill="#FF6A1A" />
                <!-- Tâm tiêu điểm -->
                <line x1="532" y1="720" x2="548" y2="720" stroke="#141414" stroke-width="2" />
                <line x1="540" y1="712" x2="540" y2="728" stroke="#141414" stroke-width="2" />
              </g>
            </svg>
          </div>

          <!-- Khối chữ 1: Punch phrase (1 khối chữ duy nhất, không tách span con) -->
          <div id="punch-wrap">
            <div id="punch-badge" class="punch-box">NGHIÊNG 140 ĐỘ</div>
          </div>

          <!-- Khối chữ 2: Label 1 (1 khối chữ duy nhất, không ký tự icon/emoji) -->
          <div id="label-1-wrap">
            <div id="label-1-card" class="label-1-box">Gần như lật úp</div>
          </div>

          <!-- Khối chữ 3: Label 2 (1 khối chữ duy nhất) -->
          <div id="label-2-wrap">
            <div id="label-2-card" class="label-2-box">Hất văng kẻ tấn công</div>
          </div>
        </div>
      </section>
    </div>

    <!-- Animation Runtime: Đăng ký duy nhất 1 paused timeline trên window.__timelines["scene-s21"] -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // 1. Vào cảnh: hiệu ứng zoom-through toàn bộ sơ đồ (không xoay, không méo)
      tl.fromTo(
        "#scene-content",
        { scale: 0.72, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        0
      );

      // 2. Punch phrase "NGHIÊNG 140 ĐỘ" xuất hiện ở t = 0.39s (theo shotlist atMs: 144500)
      tl.fromTo(
        "#punch-badge",
        { scale: 0.84, opacity: 0, y: -24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.39
      );

      // 3. Máy bay bắt đầu cuộn nghiêng dũng mãnh từ 0° lên 140° (từ t = 0.85s đến 2.39s)
      // transformOrigin chuẩn tại tâm đồng hồ (540px 720px)
      tl.to(
        "#airplane",
        {
          rotation: 140,
          transformOrigin: "540px 720px",
          duration: 1.54,
          ease: "power2.inOut",
        },
        0.85
      );

      // Đồng thời cung cam 140° vẽ dần theo tốc độ lật của máy bay
      tl.to(
        "#arc-140",
        {
          strokeDashoffset: 0,
          duration: 1.54,
          ease: "power2.inOut",
        },
        0.85
      );

      // 4. Mốc 140° chạm ngưỡng: điểm target lóe sáng xác nhận góc tới hạn
      tl.fromTo(
        "#target-marker",
        { scale: 0, opacity: 0, transformOrigin: "720px 934.5px" },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        2.39
      );

      // 5. Label 1 "Gần như lật úp" xuất hiện tại t = 2.39s (theo shotlist atMs: 146500)
      tl.fromTo(
        "#label-1-card",
        { y: 28, opacity: 0, scale: 0.92 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        2.39
      );

      // 6. Rung lắc khí động học cực hạn khi giữ góc 140° (finite repeats, giá trị tuyệt đối tất định)
      tl.to(
        "#airplane",
        {
          rotation: 142.5,
          transformOrigin: "540px 720px",
          duration: 0.45,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 3,
        },
        2.6
      );

      // 7. Label 2 "Hất văng kẻ tấn công" xuất hiện tại t = 4.09s (theo shotlist atMs: 148200)
      tl.fromTo(
        "#label-2-card",
        { y: 28, opacity: 0, scale: 0.92 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        4.09
      );

      // 8. Chuyển động thở nhẹ nền (ambient bobbing, finite repeat, không dùng repeat: -1)
      tl.to(
        "#diagram-ambient",
        {
          y: -8,
          duration: 2.1,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 1,
        },
        1.0
      );

      // Đăng ký timeline cho HyperFrames seek
      window.__timelines["scene-s21"] = tl;
    </script>
  
    </template>
  </body>
</html>
