      <style>

      * {

      }
      html, body {

        height: 100%;

      .hf-plate-paper { background-color: #E7E3D9; color: #141414; }

      /* Khối Punch-phrase */
      #punch-card {

        top: 190px;
        left: 80px;

        border-radius: 20px;

      /* Khối Sơ đồ trung tâm */

    </style>

    <div
      id="root"
      data-composition-id="scene-s10"
      data-start="0"
      data-width="1080"

      data-duration="7.9"
    >
      <!-- Scene Clip: tổng thời lượng 7.9s -->
      <section id="scene-s10" class="clip" data-start="0" data-duration="7.9">
        <!-- Nền spotlight tối dần ở rìa (không lưới) -->
        <div class="spotlight-bg"></div>

        <!-- 1. Punch phrase: RÀO CẢN MỘT CHIỀU (t=0.38s) -->
        <div id="punch-card" class="hf-plate-ink">
          <div class="punch-bar"></div>
          <h1 class="punch-title hf-text-light">RÀO CẢN MỘT CHIỀU</h1>
        </div>

        <!-- 2. Sơ đồ mặt cắt căn phòng và ổ khóa một chiều -->
        <div id="diagram-wrap">
          <svg id="diagram-svg" viewBox="0 0 920 860" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <!-- Đầu mũi tên nguy cơ bên ngoài (bị chặn) -->
              <marker id="arrow-blocked" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
                <path d="M 0 0 L 12 6 L 0 12 Z" fill="#141414" />
              </marker>
              <!-- Đầu mũi tên nguy cơ bên trong -->
              <marker id="arrow-threat" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
                <path d="M 0 0 L 12 6 L 0 12 Z" fill="#FF6A1A" />
              </marker>
            </defs>

            <!-- Tấm đế nền của sơ đồ kỹ thuật -->
            <rect x="10" y="10" width="900" height="840" rx="20" fill="#E7E3D9" stroke="#141414" stroke-width="4" />

            <!-- Mặt sàn bên trong phòng: nền phẳng không lưới theo chuẩn spotlight -->
            <rect x="330" y="60" width="530" height="740" rx="12" fill="#F5F0E4" stroke="none" />

            <!-- Bức tường kiên cố bao quanh căn phòng -->
            <g stroke="#141414" stroke-width="16" stroke-linecap="square">
              <!-- Tường trên -->
              <line x1="330" y1="60" x2="860" y2="60" />
              <!-- Tường phải -->
              <line x1="860" y1="60" x2="860" y2="800" />
              <!-- Tường đáy -->
              <line x1="860" y1="800" x2="330" y2="800" />
              <!-- Tường trái đoạn trên -->
              <line x1="330" y1="60" x2="330" y2="200" />
              <!-- Tường trái đoạn dưới -->
              <line x1="330" y1="480" x2="330" y2="800" />
            </g>

            <!-- Khu vực cửa bảo vệ hướng ra ngoài (y: 200..480) -->
            <g id="door-structure">
              <!-- Cột đỡ khung cửa có vạch gia cố -->
              <rect x="316" y="196" width="30" height="18" fill="#141414" />
              <rect x="316" y="466" width="30" height="18" fill="#141414" />

              <!-- Cánh cửa dày kiên cố -->
              <rect id="door-leaf" x="310" y="214" width="38" height="252" rx="4" fill="#141414" stroke="#FF6A1A" stroke-width="4" />

              <!-- Chốt khóa thép vươn ra ngoài -->
              <g id="lock-bolts">
                <rect x="282" y="250" width="28" height="16" rx="3" fill="#141414" />
                <rect x="274" y="332" width="36" height="18" rx="3" fill="#FF6A1A" />
                <rect x="282" y="414" width="28" height="16" rx="3" fill="#141414" />
              </g>

              <!-- Vòng cung chắn bảo vệ hướng ra bên ngoài -->
              <path id="barrier-shield" d="M 270 170 Q 190 340 270 510" fill="none" stroke="#FF6A1A" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 10" />
            </g>

            <!-- Vector tấn công từ bên ngoài (bị chặn hoàn toàn) -->
            <g id="outside-threat-group">
              <!-- Mũi tên từ ngoài lao vào cửa -->
              <line x1="70" y1="341" x2="228" y2="341" stroke="#141414" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-blocked)" />
            </g>

            <!-- Điểm va chạm / Đẩy lùi nguy cơ bên ngoài -->
            <g id="outside-deflection">
              <line x1="246" y1="290" x2="246" y2="392" stroke="#141414" stroke-width="12" stroke-linecap="round" />
              <!-- Dấu chặn cam -->
              <path d="M 234 329 L 258 353 M 258 329 L 234 353" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round" />
            </g>

            <!-- Vị trí người trong phòng ("Bạn") -->
            <g id="target-person-group">
              <!-- Vòng radar định vị tọa độ -->
              <circle cx="680" cy="270" r="58" fill="none" stroke="#141414" stroke-width="3" stroke-dasharray="8 6" />
              <circle cx="680" cy="270" r="42" fill="rgba(20,20,20,0.06)" />
              <!-- Biểu tượng nhân vật / người dùng -->
              <circle cx="680" cy="254" r="15" fill="#141414" />
              <path d="M 656 290 C 656 274 668 271 680 271 C 692 271 704 274 704 290 Z" fill="#141414" />
              <!-- Vạch dấu cộng tâm ngắm -->
              <line x1="680" y1="202" x2="680" y2="216" stroke="#141414" stroke-width="3" />
              <line x1="680" y1="324" x2="680" y2="338" stroke="#141414" stroke-width="3" />
              <line x1="612" y1="270" x2="626" y2="270" stroke="#141414" stroke-width="3" />
              <line x1="734" y1="270" x2="748" y2="270" stroke="#141414" stroke-width="3" />
            </g>

            <!-- Vị trí mối nguy hại bên trong phòng -->
            <g id="threat-marker-group">
              <!-- Vòng sóng cảnh báo nhấp nhô -->
              <circle id="threat-pulse" cx="580" cy="620" r="56" fill="rgba(255,106,26,0.18)" stroke="#FF6A1A" stroke-width="4" />
              <!-- Hình thoi cảnh báo nguy hiểm -->
              <polygon points="580,566 634,620 580,674 526,620" fill="#FF6A1A" stroke="#141414" stroke-width="6" />
              <!-- Dấu chấm than bên trong hình thoi -->
              <line x1="580" y1="592" x2="580" y2="628" stroke="#141414" stroke-width="6" stroke-linecap="round" />
              <circle cx="580" cy="646" r="4" fill="#141414" />
            </g>

            <!-- Đường nguy cơ nội bộ: không có rào cản ngăn cách -->
            <line
              id="internal-vector"
              x1="580"
              y1="560"
              x2="662"
              y2="334"
              stroke="#FF6A1A"
              stroke-width="8"
              stroke-linecap="round"
              stroke-dasharray="270"
              stroke-dashoffset="270"
              marker-end="url(#arrow-threat)"
            />

            <!-- Vòng liên kết thể hiện cánh cửa bất lực khi mối nguy nằm cùng phòng -->
            <g id="door-helpless">
              <path d="M 356 340 C 430 340 450 430 450 510" fill="none" stroke="#141414" stroke-width="4" stroke-dasharray="6 6" />
              <!-- Huy hiệu câu hỏi/nghịch lý cạnh cánh cửa -->
              <circle cx="450" cy="540" r="22" fill="#141414" stroke="#FF6A1A" stroke-width="3" />
              <!-- Dấu ? biểu tượng -->
              <path d="M 444 532 C 444 526 448 522 452 522 C 456 522 459 525 459 529 C 459 534 453 536 453 543" fill="none" stroke="#F7F4EC" stroke-width="3.2" stroke-linecap="round" />
              <circle cx="453" cy="551" r="2.2" fill="#F7F4EC" />
            </g>
          </svg>
        </div>

        <!-- 3. Nhãn 1: Ngăn bên ngoài (t=1.98s) -->
        <div id="label-outside" class="diagram-badge hf-plate-ink">
          <span>Ngăn bên ngoài</span>
        </div>

        <!-- 4. Nhãn 2: Nguy cơ bên trong (t=3.98s) -->
        <div id="label-inside" class="diagram-badge hf-hl-orange">
          <span>Nguy cơ bên trong</span>
        </div>
      </section>

    <!-- Script GSAP Timeline tất định cho Scene S10 -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // 0.10s: Toàn bộ sơ đồ xuất hiện với hiệu ứng 'grow'
      tl.fromTo(
        "#diagram-wrap",
        { scale: 0.92, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
        0.1
      );

      // 0.38s: Punch-phrase "RÀO CẢN MỘT CHIỀU" xuất hiện ('grow')
      tl.fromTo(
        "#punch-card",
        { scale: 0.88, opacity: 0, y: 16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.38
      );

      // 0.65s: Cánh cửa kiên cố đóng chặt vào ngàm
      tl.fromTo(
        "#door-leaf",
        { x: -32, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.65
      );

      // 0.90s: Các chốt thép khóa ngoài vươn ra
      tl.fromTo(
        "#lock-bolts",
        { x: 22, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
        0.9
      );

      // 1.30s: Vector nguy cơ bên ngoài lao tới
      tl.fromTo(
        "#outside-threat-group",
        { x: -70, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
        1.3
      );

      // 1.65s: Vành đai bảo vệ kích hoạt, va chạm và đẩy lùi nguy cơ bên ngoài
      tl.fromTo(
        "#barrier-shield",
        { opacity: 0, scale: 0.82 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" },
        1.65
      );
      tl.fromTo(
        "#outside-deflection",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
        1.75
      );

      // 1.98s: Nhãn 1 "Ngăn bên ngoài" xuất hiện
      tl.fromTo(
        "#label-outside",
        { y: -22, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.98
      );

      // 2.50s: Tọa độ người trong phòng ("Bạn") được định vị
      tl.fromTo(
        "#target-person-group",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        2.5
      );

      // 3.40s: Mối nguy hại cùng phòng lộ diện
      tl.fromTo(
        "#threat-marker-group",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        3.4
      );

      // 3.75s: Vector tấn công trực diện vẽ thẳng từ mối nguy tới bạn
      tl.fromTo(
        "#internal-vector",
        { strokeDashoffset: 270 },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        3.75
      );

      // 3.98s: Nhãn 2 "Nguy cơ bên trong" xuất hiện
      tl.fromTo(
        "#label-inside",
        { y: 22, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        3.98
      );

      // 4.30s: Cánh cửa bất lực (biểu tượng nghịch lý kết nối)
      tl.fromTo(
        "#door-helpless",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power2.out" },
        4.3
      );

      // 4.30s - 7.50s: Nhịp cảnh báo hữu hạn tất định (repeat: 3 = 4 nửa chu kỳ)
      tl.fromTo(
        "#threat-pulse",
        { scale: 0.95, opacity: 0.3 },
        { scale: 1.25, opacity: 0.85, duration: 0.8, repeat: 3, yoyo: true, ease: "sine.inOut" },
        4.3
      );

      // Chuyển động liên tục hữu hạn suốt cảnh (bob/drift không xoay, không xung đột thời gian)
      tl.to(
        "#diagram-wrap",
        { y: -10, duration: 7.9, ease: "sine.inOut" },
        0
      );
      tl.to(
        "#punch-card",
        { y: 6, duration: 6.9, ease: "sine.inOut" },
        1.0
      );

      // Đăng ký timeline gốc duy nhất
      window.__timelines["scene-s10"] = tl;
    </script>
