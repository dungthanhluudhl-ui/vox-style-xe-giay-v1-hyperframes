    <div

        <div id="bg-grid" class="bg-grid"></div>

      <!-- Main Visual Scene -->
      <section id="shot-s25-1" class="clip" data-start="0" data-duration="7.4">
        <!-- 1. Punch Phrase: MẮT XÍCH SINH TỒN -->
        <div id="punch-card">
          <div class="punch-top-bar"></div>
          <div class="punch-content">

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1. Background Grid Drift: direction = right, distance D = 133px (min(150, round(18 * 7.4)))
      tl.fromTo(
        "#bg-grid",
        { x: 0, y: 0 },
        { x: 133, y: 0, duration: 7.4, ease: "none", immediateRender: false },
        0
      );

      // 2. Punch Phrase Entrance ("MẮT XÍCH SINH TỒN" at 0.3s)
      tl.fromTo(
        "#punch-card",
        { scale: 0.86, opacity: 0, y: -20 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power4.out" },
        0.3
      );

      // Continuous subtle idle bob on Punch card
      tl.fromTo(
        "#punch-card",
        { y: 0 },
        { y: -6, duration: 3.0, ease: "sine.inOut", yoyo: true, repeat: 1 },
        0.9
      );

      // 3. Connector 1 Path Draw (1.0s -> 1.5s)
      const rail1 = document.getElementById("rail-1-path");
      const rail1Len = (rail1 && rail1.getTotalLength) ? rail1.getTotalLength() : 150;
      rail1.style.strokeDasharray = rail1Len;
      tl.fromTo(
        rail1,
        { strokeDashoffset: rail1Len },
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        1.0
      );
      tl.fromTo(
        "#rail-1-dot",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
        1.3
      );

      // 4. Card 1 Entrance ("Mở cửa & khống chế" at 1.6s)
      tl.fromTo(
        "#card-1",
        { x: -70, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        1.6
      );
      tl.fromTo(
        "#card-1-icon",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        1.8
      );

      // Continuous idle bob on Card 1 (starts 2.3s, finite, no repeat:-1)
      tl.fromTo(
        "#card-1",
        { y: 0 },
        { y: 6, duration: 2.3, ease: "sine.inOut", yoyo: true, repeat: 1 },
        2.3
      );

      // 5. Connector 2 Path Draw (4.3s -> 4.8s)
      const rail2 = document.getElementById("rail-2-path");
      const rail2Len = (rail2 && rail2.getTotalLength) ? rail2.getTotalLength() : 154;
      rail2.style.strokeDasharray = rail2Len;
      tl.fromTo(
        rail2,
        { strokeDashoffset: rail2Len },
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        4.3
      );
      tl.fromTo(
        "#chain-node",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        4.6
      );

      // 6. Card 2 Entrance ("Tiếp sức & kiểm soát" at 5.0s)
      tl.fromTo(
        "#card-2",
        { x: 70, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        5.0
      );
      tl.fromTo(
        "#card-2-icon",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        5.2
      );

      // Continuous idle drift on Card 2
      tl.fromTo(
        "#card-2",
        { y: 0 },
        { y: -6, duration: 1.8, ease: "sine.inOut" },
        5.6
      );

      // 7. Connector 3 & Shield Node Draw (5.6s -> 6.5s)
      const rail3 = document.getElementById("rail-3-path");
      const rail3Len = (rail3 && rail3.getTotalLength) ? rail3.getTotalLength() : 84;
      rail3.style.strokeDasharray = rail3Len;
      tl.fromTo(
        rail3,
        { strokeDashoffset: rail3Len },
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
        5.6
      );
      tl.fromTo(
        "#shield-node",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        5.8
      );

      const shieldCheck = document.getElementById("shield-check");
      const checkLen = (shieldCheck && shieldCheck.getTotalLength) ? shieldCheck.getTotalLength() : 60;
      shieldCheck.style.strokeDasharray = checkLen;
      tl.fromTo(
        shieldCheck,
        { strokeDashoffset: checkLen },
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        6.1
      );

      // Register master timeline
      window.__timelines["scene-s25"] = tl;
    </script>
