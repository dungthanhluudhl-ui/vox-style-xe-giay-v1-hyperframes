    /* Step cards (2 nhãn văn bản) */

  <div id="root" data-composition-id="scene-s19" data-start="0" data-width="1080" data-height="1920" data-duration="5.92">
    <section id="scene-s19" class="clip" data-start="0" data-duration="5.92">

      <!-- Punch Phrase -->
      <div id="punch-card" class="punch-container">
        <span class="punch-text">ÂM MƯU TRỤC LỢI</span>
      </div>

      <!-- Step 1: Đồ họa vô hiệu hóa tổ bay (Graphic Icon Node thuần túy - không text) -->
      <div id="step1-node" class="step1-container">
        <svg width="76" height="76" viewBox="0 0 100 100" fill="none">
          <!-- Buồng lái / tổ bay -->
          <circle cx="36" cy="36" r="10" fill="#F7F4EC" />
          <path d="M 22 66 C 22 52, 50 52, 50 66" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" />
          <circle cx="64" cy="36" r="10" fill="#F7F4EC" />
          <path d="M 50 66 C 50 52, 78 52, 78 66" stroke="#F7F4EC" stroke-width="5" stroke-linecap="round" />
          <!-- Dấu cảnh báo / xung đột cắt ngang -->
          <path d="M 20 20 L 80 80" stroke="#FF6A1A" stroke-width="8" stroke-linecap="round" />
          <circle cx="50" cy="50" r="44" stroke="#FF6A1A" stroke-width="3" stroke-dasharray="6 6" />
        </svg>
      </div>

      <!-- Connector 1: Step 1 -> Step 2 -->
      <svg id="conn1" class="connector-svg" viewBox="0 0 60 120">
        <path id="conn1-path" d="M 30 0 L 30 92" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round" fill="none" />
        <polygon id="conn1-arrow" points="16,88 44,88 30,112" fill="#FF6A1A" style="transform-origin: 30px 100px;" />
      </svg>

      <!-- Step 2: Card Giả lập tai nạn -->
      <div id="step2-card" class="flow-card">
        <div class="card-icon-wrap">

          <svg width="68" height="68" viewBox="0 0 100 100" fill="none">
            <path d="M 78 22 L 62 38 L 48 34 L 38 44 L 52 50 L 42 60 L 32 58 L 26 64 L 34 68 L 22 80 L 32 80 L 40 70 L 46 76 L 50 68 L 48 58 L 58 48 L 64 62 L 74 52 L 70 38 Z" fill="#FF6A1A" />

      <!-- Connector 2: Step 2 -> Step 3 -->
      <svg id="conn2" class="connector-svg" viewBox="0 0 60 120">
        <path id="conn2-path" d="M 30 0 L 30 92" stroke="#141414" stroke-width="6" stroke-linecap="round" fill="none" />
        <polygon id="conn2-arrow" points="16,88 44,88 30,112" fill="#141414" style="transform-origin: 30px 100px;" />

      <!-- Step 3: Card Tiền bảo hiểm -->
      <div id="step3-card" class="flow-card">
        <div class="card-icon-wrap">
          <!-- Icon hợp đồng bảo hiểm và tiền tài sản -->
          <svg width="68" height="68" viewBox="0 0 100 100" fill="none">
            <rect x="22" y="18" width="56" height="64" rx="8" stroke="#141414" stroke-width="6" fill="#F5F0E4" />
            <path d="M 34 36 L 66 36" stroke="#141414" stroke-width="5" stroke-linecap="round" />
            <path d="M 34 50 L 56 50" stroke="#141414" stroke-width="5" stroke-linecap="round" />

            <path d="M 62 54 L 62 70 M 58 57 C 58 55, 66 55, 66 59 C 66 63, 58 61, 58 65 C 58 69, 66 69, 66 67" stroke="#FF6A1A" stroke-width="3" stroke-linecap="round" />

  <script>
    const tl = gsap.timeline({ paused: true });

    // 1. Đo độ dài thực tế của các đường dẫn SVG connector
    const conn1Path = document.getElementById("conn1-path");
    const len1 = conn1Path.getTotalLength();
    conn1Path.style.strokeDasharray = len1;
    conn1Path.style.strokeDashoffset = len1;

    const conn2Path = document.getElementById("conn2-path");
    const len2 = conn2Path.getTotalLength();
    conn2Path.style.strokeDasharray = len2;
    conn2Path.style.strokeDashoffset = len2;

    // 2. Sequence vào cảnh (Grow entrance theo kịch bản)
    // Punch phrase xuất hiện lúc 0.4s (133200 ms)
    tl.fromTo("#punch-card",
      { scale: 0.82, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.4
    );

    // Step 1: Icon đồ họa xuất hiện lúc 1.0s
    tl.fromTo("#step1-node",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      1.0
    );

    // Connector 1: Kéo đường dẫn từ Step 1 xuống Step 2 (1.8s -> 2.3s)
    tl.fromTo(conn1Path,
      { strokeDashoffset: len1 },
      { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
      1.8
    );
    tl.fromTo("#conn1-arrow",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.2, ease: "power2.out" },
      2.2
    );

    // Step 2: "Giả lập tai nạn" xuất hiện lúc 2.4s (135200 ms)
    tl.fromTo("#step2-card",
      { scale: 0.85, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      2.4
    );

    // Connector 2: Kéo đường dẫn từ Step 2 xuống Step 3 (3.3s -> 3.8s)
    tl.fromTo(conn2Path,
      { strokeDashoffset: len2 },
      { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
      3.3
    );
    tl.fromTo("#conn2-arrow",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.2, ease: "power2.out" },
      3.7
    );

    // Step 3: "Tiền bảo hiểm" xuất hiện lúc 4.0s (136800 ms)
    tl.fromTo("#step3-card",
      { scale: 0.85, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      4.0
    );

    // 3. Ambient Idle Motion (Không xoay, chu kỳ hữu hạn, lệch pha theo chuẩn DNA v2)
    // Punch card: breathe nhẹ (scale 1 -> 1.012 -> 1)
    tl.to("#punch-card",
      { scale: 1.012, duration: 2.4, yoyo: true, repeat: 1, ease: "sine.inOut" },
      0.9
    );

    // Step 1: bob dọc (y: 0 -> -6 -> 0)
    tl.to("#step1-node",
      { y: -6, duration: 1.1, yoyo: true, repeat: 2, ease: "sine.inOut" },
      1.5
    );

    // Step 2: drift ngang (x: 0 -> 5 -> 0)
    tl.to("#step2-card",
      { x: 5, duration: 1.3, yoyo: true, repeat: 1, ease: "sine.inOut" },
      2.9
    );

    // Step 3: bob dọc nhẹ (y: 0 -> -5 -> 0)
    tl.to("#step3-card",
      { y: -5, duration: 1.2, yoyo: true, repeat: 0, ease: "sine.inOut" },
      4.5
    );

    // Đăng ký timeline cho HyperFrames runtime
    window.__timelines = window.__timelines || {};
    window.__timelines["scene-s19"] = tl;
  </script>
