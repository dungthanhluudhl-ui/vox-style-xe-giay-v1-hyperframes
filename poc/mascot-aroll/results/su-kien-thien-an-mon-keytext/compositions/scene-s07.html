<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #E7E3D9;
      }

      /* Spotlight vignette overlay: dark radial vignette at edges, no grid */
      .spotlight-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at 50% 50%, rgba(231, 227, 217, 0) 38%, rgba(20, 20, 20, 0.28) 100%);
        z-index: 1;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      #scene-content {
        position: absolute;
        inset: 0;
        z-index: 2;
      }

      #diagram-wrapper {
        position: absolute;
        inset: 0;
        transform-origin: 540px 960px;
      }

      /* Punch Phrase: 1 punch phrase, style headline-900, zero rotation */
      .punch-card {
        position: absolute;
        left: 90px;
        top: 360px;
        width: 900px;
        background: #141414;
        border-left: 10px solid #FF6A1A;
        border-radius: 8px;
        padding: 24px 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 16px 36px rgba(20, 20, 20, 0.2);
        z-index: 10;
        opacity: 0;
      }

      .punch-text {
        font-family: "Be Vietnam Pro", sans-serif;
        font-size: 54px;
        font-weight: 900;
        line-height: 1.25;
        color: #F7F4EC; /* onDarkText WCAG 16.8:1 */
        letter-spacing: -0.5px;
        text-align: center;
        text-transform: uppercase;
      }

      /* Label 1: TIẾNG NÓI ÔN HOÀ, style card-ink */
      .label-card-ink {
        position: absolute;
        left: 130px;
        top: 760px;
        width: 330px;
        background: #141414;
        border-radius: 6px;
        padding: 14px 22px;
        box-shadow: 0 10px 24px rgba(20, 20, 20, 0.16);
        z-index: 9;
        opacity: 0;
      }

      .label-text-light {
        font-family: "Be Vietnam Pro", sans-serif;
        font-size: 26px;
        font-weight: 900;
        line-height: 1.3;
        color: #F7F4EC; /* onDarkText WCAG 16.8:1 */
        letter-spacing: 0.5px;
        text-transform: uppercase;
        text-align: center;
        display: block;
      }

      /* Label 2: KHE CỬA ĐỐI THOẠI, style card-orange */
      .label-card-orange {
        position: absolute;
        left: 610px;
        top: 1140px;
        width: 350px;
        background: #FF6A1A;
        border-radius: 6px;
        padding: 14px 22px;
        box-shadow: 0 10px 24px rgba(255, 106, 26, 0.25);
        z-index: 9;
        opacity: 0;
      }

      .label-text-ink {
        font-family: "Be Vietnam Pro", sans-serif;
        font-size: 26px;
        font-weight: 900;
        line-height: 1.3;
        color: #141414; /* Ink on orange WCAG 6.4:1 */
        letter-spacing: 0.5px;
        text-transform: uppercase;
        text-align: center;
        display: block;
      }

      /* SVG Diagram */
      .diagram-svg {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        display: block;
      }

      .flow-stream {
        fill: none;
        stroke: #141414;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .flow-barrier {
        transform-origin: 540px 960px;
      }

      /* Safe contrast standard utility classes */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { background-color: #FF6A1A; color: #141414; }
      .hf-plate-ink { background-color: #141414; color: #F7F4EC; }
      .hf-plate-ink-orange { background-color: #141414; color: #FF6A1A; }
      .hf-plate-paper { background-color: #E7E3D9; color: #141414; }
    </style>

    <div
      id="root"
      data-composition-id="scene-s07"
      data-width="1080"
      data-height="1920"
      data-duration="9"
    >
      <!-- Background: spotlight radial vignette, NO grid -->
      <div class="spotlight-overlay"></div>

      <div class="clip" data-start="0" data-duration="9">
        <div id="scene-content">
          <div id="diagram-wrapper">
            <svg id="main-diagram" class="diagram-svg" viewBox="0 0 1080 1920">
              <!-- Grid-less technical layout background accents -->
              <g opacity="0.4">
                <line x1="120" y1="580" x2="960" y2="580" stroke="#141414" stroke-width="1.5" stroke-dasharray="6 6" />
                <line x1="120" y1="1380" x2="960" y2="1380" stroke="#141414" stroke-width="1.5" stroke-dasharray="6 6" />
              </g>

              <!-- INCOMING FLOW (Tiếng nói ôn hoà): converging force lines -->
              <g id="flow-streams">
                <!-- Stream 1 (Upper Wave) -->
                <path
                  id="stream-1"
                  class="flow-stream"
                  d="M 110 720 C 260 720, 370 760, 492 760"
                  stroke-width="12"
                />

                <!-- Stream 2 (Main Center Wave) -->
                <path
                  id="stream-2"
                  class="flow-stream"
                  d="M 80 840 C 240 840, 360 840, 492 840"
                  stroke-width="20"
                />

                <!-- Chevrons on Stream 2 indicating continuous forward thrust -->
                <path d="M 240 826 L 260 840 L 240 854" fill="none" stroke="#E7E3D9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M 330 826 L 350 840 L 330 854" fill="none" stroke="#E7E3D9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M 420 826 L 440 840 L 420 854" fill="none" stroke="#E7E3D9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

                <!-- Stream 3 (Lower Wave) -->
                <path
                  id="stream-3"
                  class="flow-stream"
                  d="M 120 950 C 270 950, 380 910, 492 910"
                  stroke-width="12"
                />

                <!-- Impact Stops & Deflection Sparks at the Barrier Face -->
                <line x1="492" y1="720" x2="492" y2="790" stroke="#FF6A1A" stroke-width="10" stroke-linecap="round" />
                <line x1="492" y1="800" x2="492" y2="880" stroke="#FF6A1A" stroke-width="14" stroke-linecap="round" />
                <line x1="492" y1="890" x2="492" y2="945" stroke="#FF6A1A" stroke-width="10" stroke-linecap="round" />

                <!-- Deflected / Broken vectors rebounding backward -->
                <line x1="490" y1="820" x2="445" y2="790" stroke="#141414" stroke-width="6" stroke-linecap="round" />
                <line x1="490" y1="860" x2="445" y2="890" stroke="#141414" stroke-width="6" stroke-linecap="round" />
                <line x1="490" y1="755" x2="455" y2="735" stroke="#141414" stroke-width="4" stroke-linecap="round" />
                <line x1="490" y1="915" x2="455" y2="935" stroke="#141414" stroke-width="4" stroke-linecap="round" />
              </g>

              <!-- MONOLITHIC MILITARY WALL (Bức tường thiết quân luật) -->
              <g id="wall-barrier" class="flow-barrier">
                <!-- Upper Wall Section -->
                <rect x="500" y="580" width="80" height="430" rx="6" fill="#141414" />
                <!-- Armor Reinforcement Bands (Orange) -->
                <rect x="492" y="620" width="16" height="34" rx="2" fill="#FF6A1A" />
                <rect x="492" y="730" width="16" height="46" rx="2" fill="#FF6A1A" />
                <rect x="492" y="850" width="16" height="50" rx="2" fill="#FF6A1A" />
                <rect x="492" y="940" width="16" height="34" rx="2" fill="#FF6A1A" />

                <!-- Structural cross-hatching inside upper wall -->
                <line x1="515" y1="640" x2="565" y2="690" stroke="rgba(247,244,236,0.25)" stroke-width="3" />
                <line x1="515" y1="750" x2="565" y2="800" stroke="rgba(247,244,236,0.25)" stroke-width="3" />
                <line x1="515" y1="860" x2="565" y2="910" stroke="rgba(247,244,236,0.25)" stroke-width="3" />

                <!-- Lower Wall Section -->
                <rect x="500" y="1060" width="80" height="300" rx="6" fill="#141414" />
                <rect x="492" y="1120" width="16" height="40" rx="2" fill="#FF6A1A" />
                <rect x="492" y="1220" width="16" height="40" rx="2" fill="#FF6A1A" />
                <line x1="515" y1="1140" x2="565" y2="1190" stroke="rgba(247,244,236,0.25)" stroke-width="3" />
                <line x1="515" y1="1240" x2="565" y2="1290" stroke="rgba(247,244,236,0.25)" stroke-width="3" />

                <!-- The Narrow Crack / Aperture Gate between y=1010 and y=1060 -->
                <rect x="500" y="1010" width="80" height="50" fill="none" stroke="#FF6A1A" stroke-width="3" stroke-dasharray="6 4" />
                <line x1="500" y1="1010" x2="580" y2="1010" stroke="#FF6A1A" stroke-width="6" />
                <line x1="500" y1="1060" x2="580" y2="1060" stroke="#FF6A1A" stroke-width="6" />
              </g>

              <!-- NARROW DIALOGUE APERTURE FLOW (Khe cửa đối thoại mong manh) -->
              <g id="dialogue-branch">
                <!-- Thin fragile tributary funneling from peace stream towards the opening -->
                <path
                  d="M 370 940 C 430 960, 460 1000, 492 1035"
                  fill="none"
                  stroke="#141414"
                  stroke-width="5"
                  stroke-dasharray="8 6"
                />

                <!-- Single orange ray emerging and passing through the gap -->
                <path
                  id="dialogue-line"
                  d="M 490 1035 L 590 1035 C 670 1035, 710 1080, 780 1140"
                  fill="none"
                  stroke="#FF6A1A"
                  stroke-width="8"
                  stroke-linecap="round"
                />

                <!-- Dialogue Terminal Beacon / Ray of Hope -->
                <g id="dialogue-beacon">
                  <circle id="beacon-ring" cx="780" cy="1140" r="22" fill="none" stroke="#FF6A1A" stroke-width="3" opacity="0.7" />
                  <circle cx="780" cy="1140" r="10" fill="#FF6A1A" />
                  <circle cx="780" cy="1140" r="4" fill="#141414" />
                </g>
              </g>
            </svg>
          </div>

          <!-- OVERLAY 1: TIẾNG NÓI ÔN HOÀ (atMs: 56150, rel: 0.65s) -->
          <div id="label-on-hoa" class="label-card-ink">
            <span class="label-text-light">TIẾNG NÓI ÔN HOÀ</span>
          </div>

          <!-- OVERLAY 2: BỨC TƯỜNG QUÂN LUẬT (atMs: 58650, rel: 3.15s) -->
          <div id="punch-phrase" class="punch-card">
            <span class="punch-text">BỨC TƯỜNG QUÂN LUẬT</span>
          </div>

          <!-- OVERLAY 3: KHE CỬA ĐỐI THOẠI (atMs: 61680, rel: 6.18s) -->
          <div id="label-doi-thoai" class="label-card-orange">
            <span class="label-text-ink">KHE CỬA ĐỐI THOẠI</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Setup measurement for stroke paths
      const streamPaths = ["#stream-1", "#stream-2", "#stream-3", "#dialogue-line"];
      streamPaths.forEach((selector) => {
        const el = document.querySelector(selector);
        if (el) {
          const len = el.getTotalLength ? el.getTotalLength() : 500;
          el.style.strokeDasharray = len + 10;
          el.style.strokeDashoffset = len + 10;
        }
      });

      // Master Paused Timeline (mandatory contract)
      const tl = gsap.timeline({ paused: true });

      // 1. T=0.0s ENTRANCE: Main diagram visible at t=0.25s (opacity >= 0.8 guaranteed)
      // Entrance style: "punch" - quick sharp arrival, zero overshoot
      tl.fromTo(
        "#main-diagram",
        { scale: 0.92, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" },
        0
      );

      // Flow paths draw in dynamically from left to barrier
      tl.to(
        "#stream-1",
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        0.05
      );
      tl.to(
        "#stream-2",
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        0.08
      );
      tl.to(
        "#stream-3",
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        0.12
      );

      // Dialogue ray cuts through the gap
      tl.to(
        "#dialogue-line",
        { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" },
        0.3
      );

      // 2. OVERLAY 1: TIẾNG NÓI ÔN HOÀ
      // Appears at 0.65s (56150ms - 55500ms), holds 2.5s -> exits at 3.15s
      tl.fromTo(
        "#label-on-hoa",
        { scale: 0.88, opacity: 0, y: 16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        0.65
      );
      tl.to(
        "#label-on-hoa",
        { opacity: 0, y: -12, duration: 0.25, ease: "power2.in" },
        3.15
      );

      // 3. OVERLAY 2: BỨC TƯỜNG QUÂN LUẬT (Punch Phrase)
      // Appears at 3.15s (58650ms - 55500ms), holds 3.0s -> exits at 6.15s
      tl.fromTo(
        "#punch-phrase",
        { scale: 0.86, opacity: 0, y: 22 },
        { scale: 1, opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        3.15
      );
      tl.to(
        "#punch-phrase",
        { opacity: 0, y: -14, duration: 0.28, ease: "power2.in" },
        6.15
      );

      // 4. OVERLAY 3: KHE CỬA ĐỐI THOẠI
      // Appears at 6.18s (61680ms - 55500ms), holds 2.6s -> ends at 8.78s
      tl.fromTo(
        "#label-doi-thoai",
        { scale: 0.88, opacity: 0, y: 16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        6.18
      );
      tl.fromTo(
        "#dialogue-beacon",
        { scale: 0.4, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
        6.22
      );
      tl.to(
        "#label-doi-thoai",
        { opacity: 0, duration: 0.22, ease: "power2.in" },
        8.78
      );

      // 5. CONTINUOUS CAMERA & AMBIENT LIFE MOTION (No rotation, deterministic)
      // Seamless camera pan-down: drift 30px down over entire 9s duration
      tl.fromTo(
        "#diagram-wrapper",
        { y: -15 },
        { y: 15, duration: 9.0, ease: "none" },
        0
      );

      // Subtle wall monolithic breathe (scale 1 -> 1.012 -> 1, finite repeat)
      tl.to(
        "#wall-barrier",
        { scale: 1.012, duration: 4.5, yoyo: true, repeat: 1, ease: "sine.inOut" },
        0.25
      );

      // Subtle horizontal stream pressure pulsation
      tl.to(
        "#flow-streams",
        { x: 6, duration: 2.2, yoyo: true, repeat: 3, ease: "sine.inOut" },
        0.8
      );

      // Subtle beacon pulse near the dialogue opening
      tl.to(
        "#beacon-ring",
        { scale: 1.35, opacity: 0.2, duration: 1.2, yoyo: true, repeat: 1, ease: "sine.inOut" },
        6.4
      );

      // Bind to global timeline registry
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s07"] = tl;
    </script>
  
    </template>
  </body>
</html>
