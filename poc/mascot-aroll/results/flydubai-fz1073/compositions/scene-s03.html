<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #E7E3D9;
        overflow: hidden;
        font-family: "Be Vietnam Pro", sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .media-wrapper {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        will-change: transform, opacity;
        transform-origin: 50% 50%;
      }
      .media-img {
        display: block;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        will-change: transform;
        transform-origin: 50% 50%;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s03"
      data-width="1080"
      data-height="1920"
      data-duration="9.74"
    >
      <!-- Shot 1: Cận cảnh tiêu đề báo chí 'FLIGHT FZ1073', camera lùi dần mở rộng góc nhìn -->
      <div
        id="shot-1"
        class="clip"
        data-start="0"
        data-duration="3.47"
        data-track-index="0"
      >
        <div id="shot1-wrapper" class="media-wrapper" data-layout-allow-overflow="true">
          <img
            id="shot1-media"
            class="media-img"
            src="assets/img-04-flight-fz1073-missing-airplane-poster.jpg"
            alt="FLIGHT FZ1073 Close-up"
          />
        </div>
      </div>

      <!-- Shot 2: Tái định vị sang cụm lộ trình Dubai - Tel Aviv và bóng máy bay viền đỏ -->
      <div
        id="shot-2"
        class="clip"
        data-start="3.47"
        data-duration="3.28"
        data-track-index="0"
      >
        <div id="shot2-wrapper" class="media-wrapper" data-layout-allow-overflow="true">
          <img
            id="shot2-media"
            class="media-img"
            src="assets/img-04-flight-fz1073-missing-airplane-poster.jpg"
            alt="Lộ trình Dubai - Tel Aviv và bóng máy bay"
          />
        </div>
      </div>

      <!-- Shot 3: Mở rộng toàn cảnh poster báo chí khẩn cấp, camera lùi chậm bao quát nguy cơ -->
      <div
        id="shot-3"
        class="clip"
        data-start="6.75"
        data-duration="2.99"
        data-track-index="0"
      >
        <div id="shot3-wrapper" class="media-wrapper" data-layout-allow-overflow="true">
          <img
            id="shot3-media"
            class="media-img"
            src="assets/img-04-flight-fz1073-missing-airplane-poster.jpg"
            alt="Toàn cảnh poster báo chí khẩn cấp FZ1073"
          />
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Shot 1: Hiệu ứng grow nhẹ lúc vào + camera pull-out từ tiêu đề FZ1073
      tl.fromTo(
        "#shot1-wrapper",
        { scale: 0.94, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0
      );
      tl.fromTo(
        "#shot1-media",
        { scale: 1.7, x: 0, y: 280 },
        { scale: 1.32, x: 0, y: 130, duration: 3.47, ease: "power2.out" },
        0
      );

      // Shot 2: Cắt thẳng sang khung crop lộ trình & máy bay viền đỏ, lia nhẹ (crop-reframe)
      tl.fromTo(
        "#shot2-media",
        { scale: 1.55, x: 50, y: -190 },
        { scale: 1.42, x: -30, y: -130, duration: 3.28, ease: "sine.out" },
        3.47
      );

      // Shot 3: Cắt thẳng sang toàn cảnh poster báo chí, lùi chậm (pull-out) mở trọn bố cục
      tl.fromTo(
        "#shot3-media",
        { scale: 1.18, x: 0, y: -20 },
        { scale: 1.0, x: 0, y: 0, duration: 2.99, ease: "power1.out" },
        6.75
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s03"] = tl;
    </script>
  
    </template>
  </body>
