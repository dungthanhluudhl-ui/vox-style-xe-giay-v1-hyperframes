<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #141414;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .shot-viewport {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .shot-camera {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      .asset-media {
        display: block;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        pointer-events: none;
        user-select: none;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s01"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.18"
    >
      <!-- Shot S01-1: Mở đầu video, thiết lập bối cảnh chuyến bay bình thường, push-in từ phi công lên bầu trời -->
      <section
        id="shot-1"
        class="clip"
        data-start="0"
        data-duration="3.47"
      >
        <div id="shot-1-viewport" class="shot-viewport" data-layout-allow-overflow="true">
          <div id="shot-1-cam" class="shot-camera" data-layout-allow-overflow="true">
            <img
              src="assets/img-01-safe-ascent-aviation-poster.jpg"
              class="asset-media"
              alt="Poster hàng không cất cánh an toàn"
            />
          </div>
        </div>
      </section>

      <!-- Shot S01-2: Cắt cận cảnh vào phi cơ vươn lên tầng mây vàng cam, giữ ổn định rồi zoom sâu trước khúc ngoặt -->
      <section
        id="shot-2"
        class="clip"
        data-start="3.47"
        data-duration="3.71"
      >
        <div id="shot-2-viewport" class="shot-viewport" data-layout-allow-overflow="true">
          <div id="shot-2-cam" class="shot-camera" data-layout-allow-overflow="true">
            <img
              src="assets/img-01-safe-ascent-aviation-poster.jpg"
              class="asset-media"
              alt="Cận cảnh phi cơ trên tầng mây"
            />
          </div>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Shot 1: transitionIn "rise" (dịch trục y và làm rõ dần từ dưới lên)
      tl.fromTo(
        "#shot-1-viewport",
        { y: 60, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.65, ease: "power3.out" },
        0
      );

      // Shot 1: cameraMotion "push-in" kết hợp lia nhẹ lên phía bầu trời
      tl.fromTo(
        "#shot-1-cam",
        { scale: 1.15, y: -100 },
        { scale: 1.28, y: -20, duration: 3.47, ease: "sine.inOut" },
        0
      );

      // Shot 2: transitionIn "cut" (nhận mốc cắt tự nhiên tại 3.47s qua clip visibility)
      // Shot 2: cameraMotion "crop-reframe" cận cảnh phi cơ trên mây
      // Giai đoạn 1: Duy trì góc cận cảnh ổn định theo nhịp kể
      tl.fromTo(
        "#shot-2-cam",
        { scale: 1.72, y: 460, x: 0 },
        { scale: 1.75, y: 470, x: -10, duration: 1.73, ease: "sine.out" },
        3.47
      );

      // Giai đoạn 2: Đẩy khung hình sâu hơn tại điểm ngoặt lời thoại ("Nhưng có một tình huống đáng sợ hơn nhiều:")
      tl.to(
        "#shot-2-cam",
        { scale: 1.84, y: 490, x: -20, duration: 1.98, ease: "power2.out" },
        5.20
      );

      window.__timelines["scene-s01"] = tl;
    </script>
  
    </template>
  </body>
</html>
