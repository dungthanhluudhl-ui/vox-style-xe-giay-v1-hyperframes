<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #E7E3D9;
        overflow: hidden;
        font-family: "Be Vietnam Pro", sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .media-container {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .media-img {
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        display: block;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      #media-wrap-1 {
        clip-path: inset(0% 0% 0% 0%);
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s12"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.59"
    >
      <!-- Shot S12-1: Tiếp quản cần lái buồng lái đưa máy bay hạ cánh (0.0s - 4.0s) -->
      <section id="shot-1" class="clip" data-start="0" data-duration="4.0">
        <div id="media-wrap-1" class="media-container">
          <img
            id="img-cockpit"
            class="media-img"
            src="assets/img-10-airplane-cockpit-landing-pilots.jpg"
            alt="Hai phi công điều khiển cần lái buồng lái"
          />
        </div>
      </section>

      <!-- Shot S12-2: Bản đồ chuyển hướng hạ cánh khẩn cấp xuống Tabuk (4.0s - 7.59s) -->
      <section id="shot-2" class="clip" data-start="4.0" data-duration="3.59">
        <div id="media-wrap-2" class="media-container">
          <img
            id="img-map"
            class="media-img"
            src="assets/img-06-flight-route-map-infographic.jpg"
            alt="Bản đồ đường bay hạ cánh khẩn cấp xuống Tabuk"
          />
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // === SHOT S12-1 (0s -> 4.0s) ===
      // Hiệu ứng vào cảnh unfold: mở rộng khung nhìn từ tâm theo phương dọc
      tl.fromTo(
        "#media-wrap-1",
        { clipPath: "inset(48% 0% 48% 0%)", opacity: 0.85 },
        { clipPath: "inset(0% 0% 0% 0%)", opacity: 1, duration: 0.7, ease: "power3.out" },
        0
      );

      // Camera motion: pan-left lia chậm theo cần lái kết hợp push-in nhẹ nhàng
      tl.fromTo(
        "#img-cockpit",
        { scale: 1.14, x: 45, y: 0 },
        { scale: 1.18, x: 5, y: -10, duration: 2.2, ease: "sine.inOut" },
        0
      );
      tl.to(
        "#img-cockpit",
        { scale: 1.22, x: -45, y: -22, duration: 1.8, ease: "sine.inOut" },
        2.2
      );

      // === SHOT S12-2 (4.0s -> 7.59s) ===
      // Chuyển cảnh: Cut dứt khoát sang bản đồ
      // Camera motion: pan-right bám theo lộ trình hướng tới điểm đáp Tabuk tại Ả Rập Xê Út
      tl.fromTo(
        "#img-map",
        { scale: 1.15, x: -50, y: 20 },
        { scale: 1.20, x: -5, y: 0, duration: 1.8, ease: "power2.out" },
        4.0
      );
      // Điểm nhấn thị giác nhịp 2: đẩy camera sâu hơn vào khu vực Tabuk
      tl.to(
        "#img-map",
        { scale: 1.26, x: 42, y: -25, duration: 1.79, ease: "power2.inOut" },
        5.8
      );

      window.__timelines["scene-s12"] = tl;
    </script>
  
    </template>
  </body>
</html>
