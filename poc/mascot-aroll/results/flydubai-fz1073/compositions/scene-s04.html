      <style>

.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }

      height: 1920px;

      will-change: transform;

      width: 1080px;
      height: 1920px;
      object-fit: cover;
      object-position: center;
      pointer-events: none;

  <div
    id="root"
    data-composition-id="scene-s04"
    data-width="1080"
    data-height="1920"
    data-duration="8.91"
  >

    <section
      id="shot-1"
      class="clip"
      data-start="0"

  <script>
    window.__timelines = window.__timelines || {};

      "#media-wrap-3",
      { scale: 1.0, x: 0, y: 0 },
      { scale: 1.09, x: 0, y: -30, duration: 2.87, ease: "power2.out", immediateRender: false },
