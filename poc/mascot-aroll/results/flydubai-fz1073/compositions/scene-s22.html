<!doctype html>
<html>
  <head>

  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
        font-family: "Be Vietnam Pro", sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }
      .bg-wrap {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .bg-grid {
        position: absolute;
        left: -168px;
        top: -168px;
        width: 1416px;
        height: 2256px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .media-box {
        position: absolute;
        left: 40px;
        top: 442px;
        width: 1000px;
        height: 667px;
        overflow: hidden;
        will-change: transform;
      }
      .media-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s22"
      data-width="1080"
      data-height="1920"
      data-duration="10.32"
    >
      <!-- Lớp nền grid-moving chuẩn ADN v2 cho shot contain, trôi hướng down -->
      <div class="bg-wrap">
        <div id="bg-grid" class="bg-grid"></div>
      </div>

      <!-- Shot S22-1: 0s -> 4.19s | Camera pull-out | transitionIn grow -->
      <section id="shot-1" class="clip" data-start="0" data-duration="4.19">
        <div id="shot-1-wrap" class="media-box" data-layout-allow-overflow>
          <img
            src="assets/img-16-police-escort-injured-victim.jpg"
            alt="Hiện trường nạn nhân bị thương được cảnh sát áp giải"
          />
        </div>
      </section>

      <!-- Shot S22-2: 4.19s -> 7.59s | Camera crop-reframe | transitionIn cut -->
      <section id="shot-2" class="clip" data-start="4.19" data-duration="3.4">
        <div id="shot-2-wrap" class="media-box" data-layout-allow-overflow>
          <img
            src="assets/img-16-police-escort-injured-victim.jpg"
            alt="Cận cảnh vết thương và vòng tay bảo vệ"
          />
        </div>
      </section>

      <!-- Shot S22-3: 7.59s -> 10.32s | Camera pull-out | transitionIn cut -->
      <section id="shot-3" class="clip" data-start="7.59" data-duration="2.73">
        <div id="shot-3-wrap" class="media-box" data-layout-allow-overflow>
          <img
            src="assets/img-16-police-escort-injured-victim.jpg"
            alt="Toàn cảnh hiện trường trong đêm"
          />
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Nền lưới di chuyển hướng down: D = min(150, round(18 * 10.32)) = 150px
      tl.fromTo(
        "#bg-grid",
        { x: 0, y: 0 },
        { x: 0, y: 150, duration: 10.32, ease: "none", immediateRender: false },
        0
      );

      // Shot S22-1 (0s -> 4.19s): entrance grow nhẹ rồi pull-out chậm rãi
      tl.fromTo(
        "#shot-1-wrap",
        { scale: 1.06, opacity: 0 },
        { scale: 1.05, opacity: 1, duration: 0.5, ease: "power2.out" },
        0
      );
      tl.to(
        "#shot-1-wrap",
        { scale: 1.0, duration: 3.69, ease: "sine.out" },
        0.5
      );

      // Shot S22-2 (4.19s -> 7.59s): cut trực diện, crop-reframe đổi góc nhìn (pan ≤40px, scale ≤1.08)
      tl.fromTo(
        "#shot-2-wrap",
        { x: 18, y: 12, scale: 1.02 },
        { x: -18, y: -12, scale: 1.07, duration: 3.4, ease: "sine.inOut" },
        4.19
      );

      // Shot S22-3 (7.59s -> 10.32s): cut trực diện, camera lùi chậm (pull-out) mở rộng không gian
      tl.fromTo(
        "#shot-3-wrap",
        { scale: 1.06, x: 0, y: 0 },
        { scale: 1.0, x: 0, y: 0, duration: 2.73, ease: "sine.out" },
        7.59
      );

      window.__timelines["scene-s22"] = tl;
    </script>
  
    </template>
  </body>
</html>
