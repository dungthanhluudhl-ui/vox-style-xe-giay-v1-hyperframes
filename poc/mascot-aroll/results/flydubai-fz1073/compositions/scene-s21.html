      const tl = gsap.timeline({ paused: true });

      // ==========================================
      // SHOT 1: XE BUÝT PHANH GẤP (0s -> 3.11s)
      // ==========================================
      // Vạch chia giữa xuất hiện bung mở

        { scaleY: 0 },
        { scaleY: 1, duration: 0.6, ease: "power2.out" },
        0.1
      );

      // Panel xe buýt mở ra (unfold)
      tl.fromTo(
        "#bus-card",
        { scaleX: 0.7, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.15
      );

      // Véc-tơ gia tốc giật một chiều (drift-x)
      tl.fromTo(
        "#bus-vector",
        { x: 30, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.4
      );

      // Ambient drift-x nhẹ mô phỏng quán tính phanh gấp (tất định, finite repeat)
      tl.to(
        "#bus-vector",
        { x: -10, duration: 0.45, yoyo: true, repeat: 4, ease: "sine.inOut" },
        0.9
      );

      // Nhãn Overlay 1: XE BUÝT PHANH GẤP xuất hiện lúc t = 1.04s (hold 2.0s)
      tl.fromTo(
        "#bus-label",
        { y: -24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        1.04
      );

      // Nhãn 1 mờ dần trước khi chuyển sang shot 2
      tl.to("#bus-label", { opacity: 0, duration: 0.25, ease: "power1.in" }, 2.95);

      // ==========================================
      // SHOT 2: PHI CƠ LỘN NHÀO (3.11s -> 6.76s)
      // ==========================================
      // Panel xe buýt hạ độ đậm để tôn bên phải
      tl.to("#bus-card", { opacity: 0.28, duration: 0.45, ease: "power2.out" }, 3.11);

      // Panel máy bay xuất hiện (punch/grow)
      tl.fromTo(
        "#plane-card",
        { scale: 0.9, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        3.11
      );

      // Vòng xoay lộn 140 độ bung ra
      tl.fromTo(
        "#plane-rotation-arc",
        { opacity: 0, y: -20 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        3.35
      );

      // Nhãn Overlay 2: PHI CƠ LỘN NHÀO xuất hiện lúc t = 3.58s (hold 2.8s)
      tl.fromTo(
        "#plane-label",
        { y: -24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
        3.58
      );

      // Các mũi tên lực hỗn loạn breathe (scale nhẹ 1 -> 1.03)
      tl.to(
        "#plane-vectors",
        { scale: 1.03, duration: 0.4, yoyo: true, repeat: 6, ease: "sine.inOut" },
        3.7
      );

      // Nhãn 2 fade out trước khi hết Shot 2
      tl.to("#plane-label", { opacity: 0, duration: 0.25, ease: "power1.in" }, 6.45);

      // ==========================================
      // SHOT 3: HẠ CÁNH VỀ MEMPHIS (6.76s -> 10.68s)
      // ==========================================
      // Panel bản đồ xuất hiện (grow-in)
      tl.fromTo(
        "#map-card",
        { scale: 0.92, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        6.76
      );

      // Chuẩn bị stroke-dasharray cho flight path
      const flightPath = document.getElementById("flight-path");
      const flightGlow = document.getElementById("flight-path-glow");
      const pathLength = flightPath ? flightPath.getTotalLength() : 850;

      if (flightPath && flightGlow) {
        flightPath.style.strokeDasharray = pathLength;
        flightPath.style.strokeDashoffset = pathLength;
        flightGlow.style.strokeDasharray = "16 12";
        flightGlow.style.strokeDashoffset = pathLength;
      }

      // Quỹ đạo bay khẩn cấp tự vẽ dần (SVG path draw)
      tl.fromTo(
        [flightPath, flightGlow],
        { strokeDashoffset: pathLength },
        { strokeDashoffset: 0, duration: 1.6, ease: "power2.out" },
        7.05
      );

      // Mũi tên dẫn hướng và radar đích đến hiện rõ
      tl.fromTo(
        ["#path-arrowhead", "#memphis-terminal"],
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        8.2
      );

      // Sóng radar Memphis tỏa ra (breathe/scale)
      tl.fromTo(
        "#radar-ring",
        { scale: 0.7, opacity: 1 },
        { scale: 1.35, opacity: 0.2, duration: 0.7, yoyo: true, repeat: 3, ease: "sine.out" },
        8.4
      );

      // Camera push-in nhẹ nhàng cho toàn bộ khung bản đồ
      tl.to("#map-card", { scale: 1.035, duration: 3.8, ease: "none" }, 6.8);

      // Punch Phrase: HẠ CÁNH VỀ MEMPHIS xuất hiện lúc t = 8.86s (giữ 1.82s đến hết 10.68s)
      tl.fromTo(
        "#punch-box",
        { scale: 0.86, opacity: 0, y: 28 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power4.out" },
        8.86
      );

      // Đăng ký timeline duy nhất trên window.__timelines
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s21"] = tl;
    </script>
