<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
        font-family: "Be Vietnam Pro", sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Nền lưới chuyển động (grid-moving) cho cảnh contain S10-1 */
      .bg-wrap {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #E7E3D9;
      }
      .bg-grid {
        position: absolute;
        left: -168px;
        top: -168px;
        width: 1416px;
        height: 2256px;
        background-image: linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
                          linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }

      /* Shot S10-1: contain box cố định {40, 495, 1000, 560} */
      .s10-1-box {
        position: absolute;
        left: 40px;
        top: 495px;
        width: 1000px;
        height: 560px;
        overflow: hidden;
      }
      .s10-1-media-wrap {
        width: 1000px;
        height: 560px;
        will-change: transform;
      }
      .media-contain-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Shot S10-2 & S10-3: Fullscreen cover */
      .fullscreen-box {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .fullscreen-media {
        width: 1080px;
        height: 1920px;
        will-change: transform;
      }
      .fullscreen-img {
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        display: block;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s10"
      data-width="1080"
      data-height="1920"
      data-duration="9.39"
      data-start="0"
    >
      <!-- Nền chuyển động cho toàn scene (hiện rõ quanh shot contain S10-1) -->
      <div class="bg-wrap">
        <div id="bg-grid" class="bg-grid"></div>
      </div>

      <!-- S10-1: Dẫn nguồn tin Thủ tướng Israel và chân dung phi công (0.00s - 3.80s) -->
      <section id="shot-1" class="clip" data-start="0" data-duration="3.8">
        <div class="s10-1-box">
          <div id="s10-1-media-wrap" class="s10-1-media-wrap">
            <img src="assets/img-15-netanyahu-pilot-split-view.png" class="media-contain-img" alt="" />
          </div>
        </div>
      </section>

      <!-- S10-2: Cơ trưởng nhấn nút mở khóa khẩn cấp (3.80s - 7.69s) -->
      <section id="shot-2" class="clip" data-start="3.8" data-duration="3.89">
        <div class="fullscreen-box">
          <div id="s10-2-media-wrap" class="fullscreen-media">
            <img src="assets/img-12-pilot-emergency-cockpit-unlock.jpg" class="fullscreen-img" alt="" />
          </div>
        </div>
      </section>

      <!-- S10-3: Hành khách và phi hành đoàn tràn vào khống chế (7.69s - 9.39s) -->
      <section id="shot-3" class="clip" data-start="7.69" data-duration="1.7">
        <div class="fullscreen-box">
          <div id="s10-3-media-wrap" class="fullscreen-media">
            <img src="assets/img-07-airplane-cockpit-breach-illustration.jpg" class="fullscreen-img" alt="" />
          </div>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Lưới nền trôi theo hướng diag-dr: D = 150px, dx = 105px, dy = 105px
      tl.fromTo(
        "#bg-grid",
        { x: 0, y: 0 },
        { x: 105, y: 105, duration: 9.39, ease: "none", immediateRender: false },
        0
      );

      // Shot S10-1: Vào cảnh dứt khoát (strike), scale ≤ 1.08, pan ≤ 40px, đổi nhịp thị giác tại 2.0s
      tl.fromTo(
        "#s10-1-media-wrap",
        { scale: 1.06, opacity: 0, x: 0, y: 0 },
        { scale: 1.0, opacity: 1, x: 0, y: 0, duration: 0.35, ease: "power3.out" },
        0
      );
      tl.to(
        "#s10-1-media-wrap",
        { x: 15, scale: 1.03, duration: 1.65, ease: "power1.inOut" },
        0.35
      );
      tl.to(
        "#s10-1-media-wrap",
        { x: 30, scale: 1.06, duration: 1.8, ease: "power1.out" },
        2.0
      );

      // Shot S10-2: Cắt vào (cut), camera đẩy gấp (push-in) vào chi tiết công tắc mở cửa
      tl.fromTo(
        "#s10-2-media-wrap",
        { scale: 1.0, x: 0, y: 0 },
        { scale: 1.15, x: -30, y: -60, duration: 1.8, ease: "power2.out" },
        3.8
      );
      tl.to(
        "#s10-2-media-wrap",
        { scale: 1.25, x: -45, y: -90, duration: 2.09, ease: "power1.out" },
        5.6
      );

      // Shot S10-3: Cắt vào (cut), camera đẩy mạnh tạo xung lực xông vào buồng lái
      tl.fromTo(
        "#s10-3-media-wrap",
        { scale: 1.04, x: 0, y: 0 },
        { scale: 1.22, x: 20, y: -40, duration: 1.7, ease: "power2.out" },
        7.69
      );

      // Đăng ký timeline chính
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s10"] = tl;
    </script>
  
    </template>
  </body>
</html>
