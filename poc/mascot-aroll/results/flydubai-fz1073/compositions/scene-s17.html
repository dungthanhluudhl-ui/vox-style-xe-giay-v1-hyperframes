<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #E7E3D9;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E7E3D9;
    }
    /* Lớp Nền Lưới Chuyển Động */
    .bg-wrap {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      pointer-events: none;
    }
    .bg-grid {
      position: absolute;
      left: -168px;
      top: -168px;
      width: 1416px;
      height: 2256px;
      background-image:
        linear-gradient(to right, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }
    /* Clip quy ước full frame */
    .clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    /* Wrapper Media Contain cố định tọa độ */
    .media-box {
      position: absolute;
      left: 228px;
      top: 566px;
      width: 625px;
      height: 418px;
      overflow: hidden;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
    .media-asset {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s17"
    data-width="1080"
    data-height="1920"
    data-duration="6.56"
  >
    <!-- Lớp NỀN (không timed, đặt trước mọi phần tử khác) -->
    <div class="bg-wrap">
      <div id="bg-grid" class="bg-grid"></div>
    </div>

    <!-- Shot S17-1: Canh giữa bức ảnh DC-10 trên đường lăn, strike entrance + push-in -->
    <section id="shot-1" class="clip" data-start="0" data-duration="3.66">
      <div id="shot1-box" class="media-box">
        <img
          class="media-asset"
          src="assets/img-17-fedex-cargo-plane-runway.jpg"
          alt="FedEx McDonnell Douglas DC-10 Runway"
        />
      </div>
    </section>

    <!-- Shot S17-2: Cut cận cảnh phần mũi máy bay và buồng lái, crop-reframe -->
    <section id="shot-2" class="clip" data-start="3.66" data-duration="2.90">
      <div id="shot2-box" class="media-box">
        <img
          class="media-asset"
          src="assets/img-17-fedex-cargo-plane-runway.jpg"
          alt="FedEx DC-10 Cockpit Reframe"
        />
      </div>
    </section>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // 1. Lớp nền lưới chuyển động (driftDir: right, D = 118px)
    tl.fromTo(
      "#bg-grid",
      { x: 0, y: 0 },
      { x: 118, y: 0, duration: 6.56, ease: "none", immediateRender: false },
      0
    );

    // 2. Shot 1 (0s -> 3.66s): Strike entrance + Push-in
    // Strike entrance hạ dứt khoát lúc mở cảnh
    tl.fromTo(
      "#shot1-box",
      { opacity: 0, y: -28, scale: 0.98 },
      { opacity: 1, y: 0, scale: 1.005, duration: 0.32, ease: "power4.out" },
      0
    );
    // Push-in nhịp 1 (0.32s -> 1.8s: "nhân viên hàng không tấn công tổ bay")
    tl.fromTo(
      "#shot1-box",
      { y: 0, scale: 1.005 },
      { y: 0, scale: 1.025, duration: 1.48, ease: "power1.inOut", immediateRender: false },
      0.32
    );
    // Push-in nhịp 2 đẩy sâu hơn (1.8s -> 3.66s: "từng xảy ra từ năm 1994")
    tl.fromTo(
      "#shot1-box",
      { y: 0, scale: 1.025 },
      { y: 0, scale: 1.06, duration: 1.86, ease: "power2.out", immediateRender: false },
      1.8
    );

    // 3. Shot 2 (3.66s -> 6.56s): Cut + Crop-reframe về phía mũi máy bay ("trên chuyến FedEx 705")
    tl.fromTo(
      "#shot2-box",
      { scale: 1.04, x: -16, opacity: 1 },
      { scale: 1.075, x: -36, opacity: 1, duration: 2.9, ease: "power1.out", immediateRender: false },
      3.66
    );

    window.__timelines["scene-s17"] = tl;
  </script>

    </template>
  </body>
</html>
