  <body>
    <template>
      
      <style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
#root{position:relative;width:1080px;height:1920px;background:#E7E3D9;overflow:hidden}
.bg-chart{position:absolute;left:0;top:0;width:1080px;height:1920px}

<div id="root" data-composition-id="scene-s11" data-start="0" data-duration="4.45" data-width="1080" data-height="1920">
 <div class="bg-chart"><div class="chart-line" style="top:20%"></div><div class="chart-tick" style="top:20%"></div><div class="chart-line" style="top:40%"></div><div class="chart-tick" style="top:40%"></div><div class="chart-line" style="top:60%"></div><div class="chart-tick" style="top:60%"></div><div class="chart-line" style="top:80%"></div><div class="chart-tick" style="top:80%"></div></div>
 <div class="capy-stage"><img id="capy-actor-1" class="capy-actor clip" data-start="0" data-duration="2.52" data-track-index="0" data-mascot-id="capy-v1-host-question" src="assets/capy-v1-host-question.png" width="1024" height="1536" alt="Capybara narrator, question pose"></div>
 <div class="capy-stage"><img id="capy-actor-2" class="capy-actor clip" data-start="2.52" data-duration="1.93" data-track-index="0" data-mascot-id="capy-v1-host-explain" src="assets/capy-v1-host-explain.png" width="1024" height="1536" alt="Capybara narrator, explain pose"></div>
</div>
<script>
(() => {
 const tl = gsap.timeline({ paused: true });
 
 tl.fromTo("#capy-actor-1",{scale:0.97},{scale:1,duration:0.6,ease:"power2.out",immediateRender:false},0);
 tl.set("#capy-actor-2",{scale:1},0);
 window.__timelines = window.__timelines || {};
 window.__timelines["scene-s11"] = tl;
})();
