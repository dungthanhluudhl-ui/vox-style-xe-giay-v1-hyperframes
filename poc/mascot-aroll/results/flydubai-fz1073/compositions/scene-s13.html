<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #141414;
        color: #f7f4ec;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #141414;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .shot-viewport {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .camera-rig {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      .media-img {
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        display: block;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s13"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="5.04"
    >
      <!-- Shot 1 (S13-1): Cắt cận cảnh vào khu vực cửa buồng lái khống chế cơ phó (0s - 2.45s) -->
      <section id="shot-1" class="clip" data-start="0" data-duration="2.45">
        <div class="shot-viewport">
          <div id="shot-1-rig" class="camera-rig" data-layout-allow-overflow="true">
            <img
              class="media-img"
              src="assets/img-09-cockpit-struggle-flight-incident-diagram.jpg"
              alt="Khu vực cửa buồng lái khống chế cơ phó"
            />
          </div>
        </div>
      </section>

      <!-- Shot 2 (S13-2): Dời góc nhìn xuống khoang ghế lái và sàn buồng lái, đẩy chậm camera (2.45s - 5.04s) -->
      <section id="shot-2" class="clip" data-start="2.45" data-duration="2.59">
        <div class="shot-viewport">
          <div id="shot-2-rig" class="camera-rig" data-layout-allow-overflow="true">
            <img
              class="media-img"
              src="assets/img-09-cockpit-struggle-flight-incident-diagram.jpg"
              alt="Khoang ghế lái điều khiển và vị trí sơ cứu cơ trưởng"
            />
          </div>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Shot 1 (0s - 2.45s): Punch entrance zoom vào nhóm giằng co ở cửa, sau đó lia trôi chậm
      tl.fromTo(
        "#shot-1-rig",
        { scale: 1.82, y: 140 },
        { scale: 1.65, y: 170, duration: 0.45, ease: "power4.out" },
        0
      );
      tl.to(
        "#shot-1-rig",
        { scale: 1.7, y: 190, duration: 2.0, ease: "sine.inOut" },
        0.45
      );

      // Shot 2 (2.45s - 5.04s): Cut góc nhìn xuống ghế lái và sàn buồng lái, camera push-in chậm
      tl.fromTo(
        "#shot-2-rig",
        { scale: 1.45, y: -260 },
        { scale: 1.62, y: -310, duration: 2.59, ease: "sine.out" },
        2.45
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s13"] = tl;
    </script>
  
    </template>
  </body>
</html>
