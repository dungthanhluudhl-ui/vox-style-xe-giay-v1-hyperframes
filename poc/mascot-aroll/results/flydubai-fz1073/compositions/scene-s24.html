    <script>
      // 1. Khởi tạo timeline chính ở trạng thái paused theo hợp đồng HyperFrames
      const tl = gsap.timeline({ paused: true });

      // 2. Thiết lập đường dẫn SVG (đo geometry thực tế để strokeDashoffset seek-safe)
      const pathPairs = [
        { under: "#path-1-under", active: "#path-1" },
        { under: "#path-2-under", active: "#path-2" },
        { under: "#path-3-under", active: "#path-3" },
        { under: "#path-4-under", active: "#path-4" },
        { under: "#path-5-under", active: "#path-5" }
      ];

      pathPairs.forEach(function (pair) {
        const elUnder = document.querySelector(pair.under);
        const elActive = document.querySelector(pair.active);
        if (elUnder && elActive) {
          const len = elActive.getTotalLength();
          elUnder.style.strokeDasharray = len;
          elUnder.style.strokeDashoffset = len;
          elActive.style.strokeDasharray = len;
          elActive.style.strokeDashoffset = len;
        }
      });

      // Đặt tâm xoay/scale hình học cho các node SVG
      document.querySelector("#node-1").style.transformOrigin = "220px 400px";
      document.querySelector("#node-2").style.transformOrigin = "540px 400px";
      document.querySelector("#node-3").style.transformOrigin = "540px 660px";
      document.querySelector("#node-4").style.transformOrigin = "860px 660px";
      document.querySelector("#node-5").style.transformOrigin = "540px 940px";

      // 3. Nền lưới chuyển động trôi chậm tất định (diag-dr: dx=93, dy=93 trong 7.4s)
      tl.fromTo(
        "#bg-grid",
        { x: 0, y: 0 },
        { x: 93, y: 93, duration: 7.4, ease: "none", immediateRender: false },
        0
      );

      // --- SHOT 1: Tiến trình liên hoàn các mắt xích (0.0s -> 3.6s) ---
      // 0.15s: Node 1 (Mở khóa) xuất hiện
      tl.fromTo(
        "#node-1",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.15
      );

      // 0.20s: Label 1 "MỞ KHÓA ỨNG CỨU" vào cảnh (rise: y: 35 -> 0, không xoay)
      tl.fromTo(
        "#label-1",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.20
      );

      // 0.65s: Nối từ Node 1 sang Node 2
      tl.to("#path-1-under", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 0.65);
      tl.to("#path-1", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 0.65);

      // 1.25s: Node 2 (Hành khách ứng cứu) sáng rõ khi nét vẽ vừa chạm đích
      tl.fromTo(
        "#node-2",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.25
      );

      // 1.50s: Nối từ Node 2 xuống Node 3
      tl.to("#path-2-under", { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 1.50);
      tl.to("#path-2", { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 1.50);

      // 2.05s: Node 3 (Khống chế hung thủ) xuất hiện
      tl.fromTo(
        "#node-3",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        2.05
      );

      // 2.22s: Label 2 "GIỮ VỮNG CẦN LÁI" vào cảnh (rise: y: 35 -> 0, đúng atMs 177420)
      tl.fromTo(
        "#label-2",
        { y: 35, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        2.22
      );

      // 2.45s: Nối từ Node 3 sang Node 4
      tl.to("#path-3-under", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 2.45);
      tl.to("#path-3", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 2.45);

      // 3.05s: Node 4 (Phi công giữ cần lái) xuất hiện
      tl.fromTo(
        "#node-4",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        3.05
      );

      // 3.35s: Toàn bộ 4 mắt xích sáng bừng sắc cam đẩy lùi vùng tối
      tl.to(
        ".node-glow",
        { opacity: 0.85, scale: 1.18, duration: 0.45, yoyo: true, repeat: 1, ease: "power2.out" },
        3.35
      );

      // --- SHOT 2: Hội tụ và thông điệp cốt lõi (3.6s -> 7.4s) ---
      // 3.60s: Camera push-in nhẹ nhàng tiến gần vào mô hình chuỗi hành động
      tl.to("#flow-stage", { scale: 1.05, duration: 3.8, ease: "sine.out" }, 3.60);

      // 3.75s: Đường dẫn thứ 4 vươn xuống Điểm hạ cánh an toàn
      tl.to("#path-4-under", { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" }, 3.75);
      tl.to("#path-4", { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" }, 3.75);

      // 4.60s: Node 5 (Mắt xích & Biểu tượng ĐIỂM HẠ CÁNH AN TOÀN) xuất hiện uy lực
      tl.fromTo(
        "#node-5",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        4.60
      );

      // 4.85s: Đường dẫn kết nối từ Điểm hạ cánh an toàn xuống punch card
      tl.to("#path-5-under", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 4.85);
      tl.to("#path-5", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 4.85);

      // 5.06s: Punch-phrase "MUA THÊM CƠ HỘI" xuất hiện uy lực (grow + rise, không xoay, đúng atMs 180260)
      tl.fromTo(
        "#punch-card",
        { scale: 0.92, y: 30, opacity: 0 },
        { scale: 1, y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        5.06
      );

      // 5.35s: Điểm hạ cánh an toàn phát sáng xung radar củng cố thông điệp đúc kết
      tl.to(
        "#node-5-glow",
        { opacity: 0.9, scale: 1.22, duration: 0.5, yoyo: true, repeat: 1, ease: "power2.out" },
        5.35
      );

      // --- CHUYỂN ĐỘNG NỀN LIÊN TỤC (IDLE MOTION) HỮU HẠN & LỆCH PHA THEO ADN v2 ---
      // Label 1: bob dọc nhẹ (hữu hạn, endpoint tường minh)
      tl.fromTo(
        "#label-1",
        { y: 0 },
        { y: -6, duration: 0.8, yoyo: true, repeat: 5, ease: "sine.inOut" },
        0.90
      );

      // Label 2: drift-x ngang nhẹ (hữu hạn, lệch pha với Label 1)
      tl.fromTo(
        "#label-2",
        { x: 0 },
        { x: 6, duration: 0.75, yoyo: true, repeat: 4, ease: "sine.inOut" },
        2.80
      );

      // Punch card: breathe scale 1.0 -> 1.012 sau khi xuất hiện
      tl.to(
        "#punch-card",
        { scale: 1.012, duration: 0.85, yoyo: true, repeat: 1, ease: "sine.inOut" },
        5.70
      );

      // 4. Đăng ký timeline hoàn tất vào window.__timelines["scene-s24"]
      window.__timelines["scene-s24"] = tl;
    </script>
