<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #e7e3d9;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      #shot1-viewport {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        z-index: 1;
      }
      #shot1-camera,
      #shot1-zoom {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 50% 50%;
      }
      #shot1-video {
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        display: block;
      }
      #shot2-clip {
        z-index: 2;
        overflow: hidden;
      }
      #shot2-camera,
      #shot2-zoom {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 50% 50%;
      }
      #shot2-img {
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        display: block;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s01"
      data-width="1080"
      data-height="1920"
      data-duration="6.68"
    >
      <!-- Shot 1: S01-1 (0.0s - 3.6s) Video bảng điều tra trinh thám u ám, dấu hỏi vàng phát sáng -->
      <div id="shot1-viewport">
        <div id="shot1-camera" data-layout-allow-overflow="true">
          <div id="shot1-zoom">
            <video
              id="shot1-video"
              src="assets/vid-02-mystery-investigation-board-questions.mp4"
              muted
              playsinline
              data-start="0"
              data-duration="3.6"
              data-media-start="1"
            ></video>
          </div>
        </div>
      </div>

      <!-- Shot 2: S01-2 (3.6s - 6.68s) Ảnh tĩnh chi tiết hồ sơ chứng cứ cắt dán -->
      <div id="shot2-clip" class="clip" data-start="3.6" data-duration="3.08">
        <div id="shot2-camera" data-layout-allow-overflow="true">
          <div id="shot2-zoom">
            <img
              id="shot2-img"
              src="assets/img-05-investigation-board-clues-evidence.jpeg"
              alt="Bảng điều tra hồ sơ chứng cứ"
            />
          </div>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Shot 1: Zoom-through entrance (1.28 -> 1.15) và lia máy sang phải (x: 45 -> -55)
      tl.fromTo(
        "#shot1-camera",
        { x: 45 },
        { x: -55, duration: 3.6, ease: "power1.inOut" },
        0
      );

      tl.fromTo(
        "#shot1-zoom",
        { scale: 1.28 },
        { scale: 1.15, duration: 1.0, ease: "power3.out" },
        0
      );

      tl.to(
        "#shot1-zoom",
        { scale: 1.18, duration: 2.6, ease: "none" },
        1.0
      );

      // Shot 2: Cắt sang ảnh tĩnh, camera push-in tăng tốc ở cue 'hơi bị siêu nhiên' (4.8s)
      tl.fromTo(
        "#shot2-camera",
        { y: 0 },
        { y: -10, duration: 1.2, ease: "sine.inOut" },
        3.6
      );

      tl.to(
        "#shot2-camera",
        { y: -35, duration: 1.88, ease: "power2.out" },
        4.8
      );

      tl.fromTo(
        "#shot2-zoom",
        { scale: 1.02 },
        { scale: 1.06, duration: 1.2, ease: "sine.inOut" },
        3.6
      );

      tl.to(
        "#shot2-zoom",
        { scale: 1.14, duration: 1.88, ease: "power2.out" },
        4.8
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s01"] = tl;
    </script>
  
    </template>
  </body>
</html>
