<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #141414;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      .camera-wrapper {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        will-change: transform;
      }

      .media-element {
        display: block;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s03"
      data-width="1080"
      data-height="1920"
      data-duration="9.1"
    >
      <!-- Shot 1 (0.00s - 2.89s): vid-04, punch entrance, static camera -->
      <div id="shot-1-camera" class="camera-wrapper" data-layout-allow-overflow="true">
        <video
          id="vid-s03-1"
          src="assets/vid-04-rat-king-cutout-animation.mp4"
          muted
          playsinline
          data-start="0"
          data-duration="2.89"
          data-media-start="0.5"
          class="media-element"
        ></video>
      </div>

      <!-- Shot 2 (2.89s - 5.66s): img-01, hard cut, push-in camera -->
      <section
        id="shot-2"
        class="clip"
        data-start="2.89"
        data-duration="2.77"
        data-layout-allow-overflow="true"
      >
        <div id="shot-2-camera" class="camera-wrapper" data-layout-allow-overflow="true">
          <img
            id="img-s03-2"
            src="assets/img-01-rat-king-cutout-title.jpeg"
            class="media-element"
            alt=""
          />
        </div>
      </section>

      <!-- Shot 3 (5.66s - 7.39s): vid-05, strike entrance, crop-reframe camera -->
      <div id="shot-3-camera" class="camera-wrapper" data-layout-allow-overflow="true">
        <video
          id="vid-s03-3"
          src="assets/vid-05-cutout-leader-prohibition-red-cross.mp4"
          muted
          playsinline
          data-start="5.66"
          data-duration="1.73"
          data-media-start="1"
          class="media-element"
        ></video>
      </div>

      <!-- Shot 4 (7.39s - 9.10s): img-04, hard cut, pull-out camera -->
      <section
        id="shot-4"
        class="clip"
        data-start="7.39"
        data-duration="1.71"
        data-layout-allow-overflow="true"
      >
        <div id="shot-4-camera" class="camera-wrapper" data-layout-allow-overflow="true">
          <img
            id="img-s03-4"
            src="assets/img-04-splinter-ninja-turtles-red-cross.jpeg"
            class="media-element"
            alt=""
          />
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // S03-1: vid-04 (0.00s -> 2.89s)
      // Cú đập punch dứt khoát giới thiệu danh xưng Rat King u ám cùng đàn chuột đen bò qua lại
      tl.fromTo(
        "#shot-1-camera",
        { scale: 1.14, x: 0, y: 0 },
        { scale: 1.0, x: 0, y: 0, duration: 0.35, ease: "power4.out" },
        0
      );

      // S03-2: img-01 (2.89s -> 5.66s)
      // Cắt sắc nét sang ảnh tĩnh title card, camera đẩy tới (push-in) tạo chiều sâu
      tl.fromTo(
        "#shot-2-camera",
        { scale: 1.0, x: 0, y: 0 },
        { scale: 1.08, x: 0, y: 0, duration: 2.77, ease: "sine.out" },
        2.89
      );

      // S03-3: vid-05 (5.66s -> 7.39s)
      // Va chạm dứt khoát (strike) đúng cue "Và không..." phủ định hình tượng Ninja Rùa, crop-reframe
      tl.fromTo(
        "#shot-3-camera",
        { scale: 1.22, y: -25, x: 0 },
        { scale: 1.12, y: 0, x: 0, duration: 0.22, ease: "power4.out" },
        5.66
      );
      tl.fromTo(
        "#shot-3-camera",
        { scale: 1.12, y: 0, x: 0 },
        { scale: 1.14, y: 0, x: 0, duration: 1.51, ease: "sine.out" },
        5.88
      );

      // S03-4: img-04 (7.39s -> 9.10s)
      // Cắt sang ảnh tĩnh chốt lại chi tiết hài hước về 4 con rùa, camera lùi nhẹ (pull-out)
      tl.fromTo(
        "#shot-4-camera",
        { scale: 1.08, x: 0, y: 0 },
        { scale: 1.0, x: 0, y: 0, duration: 1.71, ease: "power2.out" },
        7.39
      );

      window.__timelines["scene-s03"] = tl;
    </script>
  
    </template>
  </body>
</html>
