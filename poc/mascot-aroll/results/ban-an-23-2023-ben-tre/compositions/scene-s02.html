    <script>
      window.__timelines = window.__timelines || {};

      // 1. CAMERA MOTION: drift-out liền mạch suốt cả shot (1.05 -> 1.00, ease: none)
      tl.fromTo(
        "#camera-rig",
        { scale: 1.05 },
        { scale: 1.0, duration: 6.71, ease: "none" },
        0,
      );

      // 2. ENTRANCE TRANSITION: rise (trượt từ dưới lên, duration: 0.7s)

        0.1,

      tl.to("#pan-right", { y: -4, duration: 0.7, ease: "sine.inOut" }, 1.6);
      tl.to("#scale-pointer", { rotation: -0.5, duration: 0.7, ease: "sine.inOut" }, 1.6);

      // 4. OVERLAY 1: PUNCH PHRASE "25 TRIỆU VS 20 NĂM TÙ" (atMs 11710 -> local 2.37s)
      tl.fromTo(
        "#punch-phrase",
        { scale: 0.86, opacity: 0, y: -24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.52, ease: "power3.out" },
        2.37,
      );

      // 5. OVERLAY 2: "Món nợ ban đầu" + Vật thể nợ xuất hiện (atMs 12800 -> local 3.46s)
      tl.fromTo(
        "#debt-item",
        { scale: 0, opacity: 0, y: -28 },

        3.46,

      tl.fromTo(

        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        3.56,
      );

      // Món nợ đặt lên đĩa trái -> cán cân hơi chùng sang trái (-3.5 deg)
      tl.to("#scale-beam", { rotation: -3.5, duration: 0.55, ease: "power2.out" }, 3.5);
      tl.to("#pan-left", { y: 24, duration: 0.55, ease: "power2.out" }, 3.5);
      tl.to("#pan-right", { y: -24, duration: 0.55, ease: "power2.out" }, 3.5);
      tl.to("#scale-pointer", { rotation: -3.5, duration: 0.55, ease: "power2.out" }, 3.5);

      // 6. OVERLAY 3: "Cái giá phải trả" + Khối án tù giáng mạnh xuống (atMs 14000 -> local 4.66s)
      tl.fromTo(
        "#prison-weight",
        { y: -180, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.38, ease: "power4.in" },
        4.66,
      );
      tl.fromTo(
        "#label-prison",
        { scale: 0.88, opacity: 0, y: 18 },
        { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },

      tl.to("#pan-left", { y: -105, duration: 0.6, ease: "power3.out" }, 5.04);
      tl.to("#pan-right", { y: 105, duration: 0.6, ease: "power3.out" }, 5.04);

      tl.to("#scale-stand", { x: 3, duration: 0.08, ease: "power1.inOut" }, 5.06);
      tl.to("#scale-stand", { x: -3, duration: 0.08, ease: "power1.inOut" }, 5.14);

      tl.to("#scale-beam", { rotation: 15.5, duration: 0.5, ease: "sine.inOut" }, 5.64);
      tl.to("#scale-beam", { rotation: 16, duration: 0.5, ease: "sine.inOut" }, 6.14);
