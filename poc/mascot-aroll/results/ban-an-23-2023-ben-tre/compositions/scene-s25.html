<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

  <body>
    <template>
      <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #F5F0E4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #F5F0E4;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Camera carrier for subtle pan-right motion */
      #camera-carrier {
        position: absolute;
        inset: 0;
        will-change: transform;
      }

      /* Punch Phrase: 1/3 text blocks */
      .punch-card {
        position: absolute;
        top: 240px;
        left: 80px;
        right: 80px;
        text-align: center;
        font-size: 60px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 30px 36px;
        border-left: 20px solid #FF6A1A;
        border-radius: 6px;
        box-shadow: 0 18px 36px rgba(20, 20, 20, 0.14);
        will-change: transform, opacity;
      }

      /* Flow Diagram Canvas */
      #diagram-area {
        position: absolute;
        top: 420px;
        left: 80px;
        width: 920px;
        height: 740px;
      }

      /* Pure SVG connecting vector and graphics */
      #flow-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* Graphical Flow Cards (strictly non-textual icon cards) */
      .flow-card {
        position: absolute;
        width: 380px;
        height: 250px;
        background-color: #E7E3D9;
        border: 4px solid #141414;
        border-radius: 8px;
        box-shadow: 8px 8px 0px #141414;
        will-change: transform, opacity;
      }
      #node-a {
        top: 20px;
        left: 10px;
      }
      #node-b {
        bottom: 20px;
        right: 10px;
      }

      .flow-card-inner {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        will-change: transform;
      }
      .card-bar {
        height: 40px;
        background-color: #141414;
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 10px;
      }
      .bar-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .bar-dash {
        height: 6px;
        width: 48px;
        border-radius: 3px;
      }
      .card-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12px;
        gap: 10px;
      }
      .node-icon-svg {
        width: 100%;
        height: 110px;
      }
      .card-metric-lines {
        width: 80%;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .metric-line {
        height: 5px;
        border-radius: 2px;
      }

      /* Action Label: 2/3 text blocks */
      .action-card {
        position: absolute;
        top: 1240px;
        left: 120px;
        right: 120px;
        text-align: center;
        font-size: 42px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        padding: 24px 32px;
        border: 4px solid #141414;
        border-radius: 8px;
        box-shadow: 8px 8px 0px #141414;
        will-change: transform, opacity;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s25"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="4.3"
    >
      <section id="scene-s25" class="clip" data-start="0" data-duration="4.3">
        <div id="camera-carrier">
          <!-- Text 1: Punch Phrase -->
          <div id="punch-card" class="punch-card hf-plate-ink">HÀNH VI CHE GIẤU</div>

          <!-- Flow Diagram Visuals (No extra text nodes) -->
          <div id="diagram-area">
            <!-- SVG Arrow and Vector Path -->
            <svg id="flow-svg" viewBox="0 0 920 740" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Dashed Guide Path -->
              <path
                d="M 390 145 C 610 145, 310 595, 530 595"
                stroke="#141414"
                stroke-width="5"
                stroke-dasharray="10 10"
                opacity="0.25"
              />
              <!-- Animated Dynamic Flow Path -->
              <path
                id="flow-path"
                d="M 390 145 C 610 145, 310 595, 530 595"
                stroke="#FF6A1A"
                stroke-width="10"
                stroke-linecap="round"
              />
              <!-- Destination Arrowhead -->
              <polygon
                id="arrow-head"
                points="525,580 555,595 525,610"
                fill="#FF6A1A"
                stroke="#141414"
                stroke-width="3"
              />
              <!-- Midway Directional Beacon -->
              <circle cx="475" cy="370" r="14" fill="#FF6A1A" stroke="#141414" stroke-width="4" id="flow-beacon" />
              <circle cx="475" cy="370" r="26" stroke="#FF6A1A" stroke-width="3" fill="none" opacity="0.6" id="flow-beacon-ring" />
            </svg>

            <!-- Node A: Điểm gây án (Hiện trường / Nạn nhân) -->
            <div id="node-a" class="flow-card">
              <div id="node-a-inner" class="flow-card-inner">
                <div class="card-bar">
                  <div class="bar-dot" style="background:#FF6A1A"></div>
                  <div class="bar-dash" style="background:#F7F4EC"></div>
                  <div class="bar-dash" style="background:rgba(247,244,236,0.3)"></div>
                </div>
                <div class="card-body">
                  <svg class="node-icon-svg" viewBox="0 0 200 130" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="35,105 85,15 135,105" fill="#FF6A1A" stroke="#141414" stroke-width="5" stroke-linejoin="round"/>
                    <line x1="85" y1="46" x2="85" y2="76" stroke="#141414" stroke-width="6" stroke-linecap="round"/>
                    <circle cx="85" cy="92" r="4.5" fill="#141414"/>
                    <circle cx="155" cy="74" r="10" fill="#141414"/>
                    <path d="M 148 88 L 175 88 L 188 108" stroke="#141414" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M 160 88 L 142 108" stroke="#141414" stroke-width="5" stroke-linecap="round"/>
                  </svg>
                  <div class="card-metric-lines">
                    <div class="metric-line" style="width: 85%; background: #141414;"></div>
                    <div class="metric-line" style="width: 55%; background: #FF6A1A;"></div>
                    <div class="metric-line" style="width: 70%; background: rgba(20,20,20,0.3);"></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Node B: Địa điểm tẩu tán (Bờ sông) -->
            <div id="node-b" class="flow-card">
              <div id="node-b-inner" class="flow-card-inner">
                <div class="card-bar">
                  <div class="bar-dot" style="background:#FF6A1A"></div>
                  <div class="bar-dash" style="background:#F7F4EC"></div>
                  <div class="bar-dash" style="background:rgba(247,244,236,0.3)"></div>
                </div>
                <div class="card-body">
                  <svg class="node-icon-svg" viewBox="0 0 200 130" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 95 15 C 80 15, 68 27, 68 42 C 68 62, 95 88, 95 88 C 95 88, 122 62, 122 42 C 122 27, 110 15, 95 15 Z" fill="#FF6A1A" stroke="#141414" stroke-width="5" stroke-linejoin="round"/>
                    <circle cx="95" cy="42" r="8" fill="#141414"/>
                    <path d="M 18 105 Q 48 95, 78 105 T 138 105 T 188 105" stroke="#141414" stroke-width="5" stroke-linecap="round" fill="none"/>
                    <path d="M 10 118 Q 45 110, 75 118 T 135 118 T 185 118" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round" fill="none"/>
                  </svg>
                  <div class="card-metric-lines">
                    <div class="metric-line" style="width: 45%; background: #FF6A1A;"></div>
                    <div class="metric-line" style="width: 80%; background: #141414;"></div>
                    <div class="metric-line" style="width: 60%; background: rgba(20,20,20,0.3);"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Text 2: Action Label Card -->
          <div id="action-card" class="action-card hf-hl-orange">Kéo xác ra sông</div>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Path length calculation
      const flowPath = document.getElementById("flow-path");
      const pathLen = flowPath.getTotalLength();
      flowPath.style.strokeDasharray = pathLen;
      flowPath.style.strokeDashoffset = pathLen;

      // 1. Camera subtle pan-right across full duration (4.3s)
      tl.fromTo(
        "#camera-carrier",
        { x: -18 },
        { x: 18, duration: 4.3, ease: "none" },
        0
      );

      // 2. Diagram Node Entrances (rise)
      tl.fromTo(
        "#node-a",
        { opacity: 0, y: 45 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.15
      );

      tl.fromTo(
        "#node-b",
        { opacity: 0, y: 45 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.35
      );

      // 3. SVG Flow Path draw (from Node A to Node B)
      tl.fromTo(
        "#flow-path",
        { strokeDashoffset: pathLen },
        { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" },
        0.45
      );

      tl.fromTo(
        "#arrow-head",
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out", transformOrigin: "center center" },
        1.2
      );

      // 4. Directional beacon pulse
      tl.fromTo(
        "#flow-beacon",
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out", transformOrigin: "center center" },
        0.8
      );

      tl.fromTo(
        "#flow-beacon-ring",
        { opacity: 0, scale: 0.4 },
        { opacity: 0.8, scale: 1.3, duration: 0.5, ease: "power2.out", transformOrigin: "center center" },
        0.85
      );

      // 5. Punch Phrase Entrance at 1.46s (201200ms - 199740ms)
      tl.fromTo(
        "#punch-card",
        { opacity: 0, y: 40 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        1.46
      );

      // 6. Action Label Entrance at 2.26s (202000ms - 199740ms)
      tl.fromTo(
        "#action-card",
        { opacity: 0, y: 35 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        2.26
      );

      // 7. Subtle continuous ambient motion on inner wrappers (deterministic, rotation = 0)
      tl.fromTo(
        "#node-a-inner",
        { y: 0 },
        { y: -6, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 1 },
        0.9
      );

      tl.fromTo(
        "#node-b-inner",
        { y: 0 },
        { y: 6, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 1 },
        0.9
      );

      tl.fromTo(
        "#flow-beacon",
        { scale: 1 },
        { scale: 1.25, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 3, transformOrigin: "center center" },
        1.2
      );

      // Master timeline registry
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s25"] = tl;
    </script>
  
    </template>
  </body>
</html>
