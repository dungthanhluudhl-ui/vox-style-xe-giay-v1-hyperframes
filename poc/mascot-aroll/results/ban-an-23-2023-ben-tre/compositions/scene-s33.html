<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #F5F0E4;
      color: #141414;
      font-family: "Be Vietnam Pro", sans-serif;
      overflow: hidden;
      width: 1080px;
      height: 1920px;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #F5F0E4;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    #scene-container {
      position: absolute;
      inset: 0;
      transform-origin: 540px 960px;
    }

    /* Track 1: Label Badge */
    .label-track {
      position: absolute;
      top: 240px;
      left: 0;
      width: 1080px;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }

    .label-card {
      background-color: #141414;
      border-radius: 8px;
      padding: 14px 28px;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 8px 24px rgba(20, 20, 20, 0.12);
    }

    .label-dot {
      width: 10px;
      height: 10px;
      background-color: #FF6A1A;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .label-text {
      color: #F7F4EC;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
    }

    /* Diagram Section: Scales of Justice */
    #diagram-wrap {
      position: absolute;
      top: 360px;
      left: 90px;
      width: 900px;
      height: 680px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 5;
    }

    svg.scale-svg {
      width: 900px;
      height: 680px;
      overflow: visible;
    }

    #scale-beam {
      transform-origin: 450px 200px;
    }

    /* Track 2: Punch Phrase */
    .punch-track {
      position: absolute;
      top: 1140px;
      left: 0;
      width: 1080px;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }

    .punch-card {
      background-color: #141414;
      border-radius: 16px;
      padding: 26px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 40px rgba(20, 20, 20, 0.16);
    }

    .punch-title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: 0.5px;
      text-align: center;
      white-space: nowrap;
      margin: 0;
    }

    .punch-light {
      color: #F7F4EC;
    }

    .punch-orange {
      color: #FF6A1A;
    }

    .punch-bar {
      width: 120px;
      height: 6px;
      background-color: #FF6A1A;
      border-radius: 3px;
      margin-top: 16px;
    }
  </style>

  <div
    id="root"
    data-composition-id="scene-s33"
    data-width="1080"
    data-height="1920"
    data-duration="5.98"
  >
    <div id="scene-s33" class="clip" data-start="0" data-duration="5.98">
      <div id="scene-container">
        <!-- Label Overlay -->
        <div class="label-track">
          <div id="mitigation-label" class="label-card">
            <span class="label-dot"></span>
            <span class="label-text">Chỉ giảm mức phạt</span>
          </div>
        </div>

        <!-- Central Diagram: Cán cân công lý -->
        <div id="diagram-wrap">
          <svg class="scale-svg" viewBox="0 0 900 680">
            <!-- Base & Stem Assembly -->
            <g id="scale-base">
              <rect x="330" y="575" width="240" height="26" rx="6" fill="#141414" />
              <rect x="380" y="555" width="140" height="20" rx="4" fill="#141414" />
              <rect x="360" y="608" width="180" height="6" rx="3" fill="#FF6A1A" />
            </g>

            <g id="scale-pillar">
              <polygon points="450,185 435,215 465,215" fill="#141414" />
              <rect x="443" y="215" width="14" height="340" fill="#141414" />
            </g>

            <!-- Crossbeam (pure vector - non-text rotation permitted) -->
            <g id="scale-beam">
              <rect x="150" y="194" width="600" height="12" rx="4" fill="#141414" />
              <!-- Pivot joints -->
              <circle cx="170" cy="200" r="6" fill="#141414" />
              <circle cx="730" cy="200" r="6" fill="#141414" />
              <circle cx="450" cy="200" r="12" fill="#FF6A1A" />
              <circle cx="450" cy="200" r="5" fill="#141414" />
            </g>

            <!-- Left Pan (Mitigation - Lighter load, rises slightly) -->
            <g id="pan-left">
              <line x1="170" y1="200" x2="120" y2="380" stroke="#141414" stroke-width="3" />
              <line x1="170" y1="200" x2="220" y2="380" stroke="#141414" stroke-width="3" />
              <path d="M 105 380 Q 170 416 235 380 Z" fill="none" stroke="#141414" stroke-width="6" stroke-linecap="round" />
              <!-- Minimalist mitigation token -->
              <rect x="150" y="340" width="40" height="40" rx="4" fill="none" stroke="#141414" stroke-width="4" />
              <line x1="160" y1="360" x2="180" y2="360" stroke="#141414" stroke-width="4" stroke-linecap="round" />
            </g>

            <!-- Right Pan (Crime / Irreversible fact - Heavy weight, plummets) -->
            <g id="pan-right">
              <line x1="730" y1="200" x2="680" y2="380" stroke="#141414" stroke-width="3" />
              <line x1="730" y1="200" x2="780" y2="380" stroke="#141414" stroke-width="3" />
              <path d="M 665 380 Q 730 416 795 380 Z" fill="#141414" stroke="#141414" stroke-width="6" />
              <!-- Solid heavy weight block -->
              <rect x="685" y="290" width="90" height="90" rx="6" fill="#141414" />
              <rect x="726" y="315" width="8" height="28" rx="3" fill="#FF6A1A" />
              <rect x="726" y="352" width="8" height="8" rx="2" fill="#FF6A1A" />
            </g>
          </svg>
        </div>

        <!-- Punch Phrase Overlay -->
        <div class="punch-track">
          <div id="punch-card" class="punch-card">
            <h2 class="punch-title">
              <span class="punch-light">KHÔNG THỂ</span> <span class="punch-orange">QUAY ĐẦU</span>
            </h2>
            <div class="punch-bar"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Initial setup: explicit endpoints to remain seek-deterministic
    gsap.set("#mitigation-label", { opacity: 0, y: -24 });
    gsap.set("#punch-card", { opacity: 0, scale: 0.88, y: 30 });
    gsap.set("#scale-beam", { rotation: 0 });
    gsap.set("#pan-left", { y: 0 });
    gsap.set("#pan-right", { y: 0 });

    // Camera motion: continuous drift-out throughout entire scene (5.98s)
    tl.fromTo(
      "#scene-container",
      { scale: 1.04 },
      { scale: 1.0, duration: 5.98, ease: "none" },
      0
    );

    // Entrance Animation: "shatter" assembly of the diagram parts (0.15s - 0.75s)
    tl.fromTo(
      "#scale-base",
      { scaleY: 0, opacity: 0 },
      { scaleY: 1, opacity: 1, duration: 0.45, ease: "power2.out" },
      0.15
    );
    tl.fromTo(
      "#scale-pillar",
      { y: 60, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.2
    );
    tl.fromTo(
      "#scale-beam",
      { y: -40, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.28
    );
    tl.fromTo(
      "#pan-left",
      { x: -36, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      0.38
    );
    tl.fromTo(
      "#pan-right",
      { x: 36, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
      0.44
    );

    // Label 1: "Chỉ giảm mức phạt" arrives at 1.05s (shotlist atMs: 253150)
    tl.to(
      "#mitigation-label",
      { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      1.05
    );

    // Diagram Interaction: Scale of Justice tilts decisively (1.75s - 2.55s)
    // Left side rises slightly, Right side (irreversible crime) drops firmly
    tl.to(
      "#scale-beam",
      { rotation: 7.5, duration: 0.75, ease: "power3.inOut" },
      1.75
    );
    tl.to(
      "#pan-left",
      { y: -36, duration: 0.75, ease: "power3.inOut" },
      1.75
    );
    tl.to(
      "#pan-right",
      { y: 36, duration: 0.75, ease: "power4.out" },
      1.75
    );

    // Punch Phrase: "KHÔNG THỂ QUAY ĐẦU" arrives at 2.70s (shotlist atMs: 254800)
    tl.to(
      "#punch-card",
      { opacity: 1, scale: 1.0, y: 0, duration: 0.52, ease: "power3.out" },
      2.70
    );

    // Subtle continuous micro-motion: breathe on diagram (non-rotational, finite)
    tl.to(
      "#diagram-wrap",
      { y: -5, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 1 },
      2.8
    );

    window.__timelines["scene-s33"] = tl;
  </script>

    </template>
  </body>
</html>
