    <script>
      // Prepare path stroke dash patterns for progressive draw
      const pathElements = [
        ...document.querySelectorAll("#card-1 .draw-stroke"),
        ...document.querySelectorAll("#card-2 .draw-stroke"),
        document.querySelector("#arrow-stem"),
        document.querySelector("#ban-circle"),
        document.querySelector("#ban-slash")
      ];

      pathElements.forEach((el) => {
        if (el && el.getTotalLength) {
          const len = el.getTotalLength();
          el.style.strokeDasharray = len + 1;
          el.style.strokeDashoffset = len + 1;
        }
      });

      // Construct seekable GSAP timeline
      const tl = gsap.timeline({ paused: true });

      // Camera continuous drift-in (8.28s)
      tl.fromTo(
        "#camera-rig",
        { scale: 1 },
        { scale: 1.04, duration: 8.28, ease: "none" },
        0
      );

      // Transition-in: zoom-through entrance of stage at scene start
      tl.fromTo(
        "#diagram-stage",
        { scale: 0.88, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.65, ease: "power3.out" },
        0.05
      );

      // Card 1 enters at 1.36s (205400 ms)
      tl.fromTo(
        "#card-1",
        { opacity: 0, y: 36, scale: 0.96 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
        1.36
      );

      // Card 1 icons draw
      tl.to(
        "#card-1 .draw-stroke",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out", stagger: 0.08 },
        1.45
      );
      tl.fromTo(
        "#card-1 .accent-stroke",
        { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" },
        1.75
      );

      // Card 1 subtle idle breathing (finite, out-of-phase)
      tl.to(
        "#card-1",
        { y: -6, duration: 1.8, ease: "sine.inOut", yoyo: true, repeat: 3 },
        2.1
      );

      // Plus connector enters at 2.35s
      tl.fromTo(
        "#connector-plus",
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
        2.35
      );

      // Card 2 enters at 3.24s (207280 ms)
      tl.fromTo(
        "#card-2",
        { opacity: 0, y: 36, scale: 0.96 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
        3.24
      );

      // Card 2 force vectors draw
      tl.to(
        "#card-2 .draw-stroke",
        { strokeDashoffset: 0, duration: 0.42, ease: "power2.out", stagger: 0.08 },
        3.32
      );

      // Card 2 subtle idle breathing (finite, out-of-phase)
      tl.to(
        "#card-2",
        { y: 6, duration: 1.9, ease: "sine.inOut", yoyo: true, repeat: 2 },
        3.9
      );

      // Downward arrow draws at 4.4s
      tl.to(
        "#arrow-stem",
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        4.4
      );
      tl.fromTo(
        "#arrow-head",
        { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" },
        4.85
      );

      // Punch Phrase enters at 5.46s (209500 ms) - forceful slam
      tl.fromTo(
        "#punch-card",
        { opacity: 0, scale: 1.15 },
        { opacity: 1, scale: 1.0, duration: 0.45, ease: "power4.out" },
        5.46
      );

      // Ban symbol drawing on punch card
      tl.to(
        "#ban-circle",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        5.62
      );
      tl.to(
        "#ban-slash",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        5.88
      );

      // Subtle hold pulse on punch card till end of scene
      tl.to(
        "#punch-card",
        { scale: 1.015, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 1 },
        6.08
      );

      // Bind timeline to HyperFrames runtime registry
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s26"] = tl;
    </script>
