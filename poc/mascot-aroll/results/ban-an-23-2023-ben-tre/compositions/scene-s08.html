<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #F5F0E4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #F5F0E4;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      #camera-rig {
        position: absolute;
        inset: 0;
        transform-origin: 540px 800px;
        will-change: transform;
      }

      /* Flow SVG Styling */
      .flow-svg {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
      }
      .flow-stem {
        stroke: #141414;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .flow-branch-left {
        stroke: #141414;
        stroke-width: 6;
        stroke-dasharray: 12 10;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .flow-branch-right {
        stroke: #FF6A1A;
        stroke-width: 10;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .ban-icon-shape {
        stroke: #FF6A1A;
        stroke-width: 8;
        stroke-linecap: round;
        fill: none;
      }
      .lightning-shape {
        fill: #FF6A1A;
        stroke: #141414;
        stroke-width: 4;
        stroke-linejoin: round;
      }

      /* Punch Phrase: 1 trong 3 khối chữ, đặt trên nền mực đậm */
      #punch-box {
        position: absolute;
        top: 250px;
        left: 140px;
        width: 800px;
        padding: 26px 40px;
        background-color: #141414;
        border-left: 16px solid #FF6A1A;
        box-shadow: 12px 12px 0px rgba(20, 20, 20, 0.18);
        display: flex;
        align-items: center;
        justify-content: center;
        will-change: transform, opacity;
      }
      .punch-text {
        margin: 0;
        font-size: 58px;
        font-weight: 900;
        line-height: 1.3;
        letter-spacing: 1px;
        color: #F7F4EC;
        text-transform: uppercase;
        text-align: center;
      }

      /* Nhãn 1: "Nhiều lối thương lượng" */
      #card-negotiate {
        position: absolute;
        top: 840px;
        left: 90px;
        width: 440px;
        padding: 22px 28px;
        background-color: #E7E3D9;
        border: 4px solid #141414;
        box-shadow: 8px 8px 0px #141414;
        will-change: transform, opacity;
      }
      .label-negotiate-text {
        margin: 0;
        font-size: 34px;
        font-weight: 700;
        line-height: 1.34;
        color: #141414;
        text-align: center;
      }

      /* Nhãn 2: "Đường cùng bẫy điện" */
      #card-trap {
        position: absolute;
        top: 1060px;
        right: 90px;
        width: 450px;
        padding: 24px 30px;
        background-color: #FF6A1A;
        border: 5px solid #141414;
        box-shadow: 10px 10px 0px #141414;
        will-change: transform, opacity;
      }
      .label-trap-text {
        margin: 0;
        font-size: 36px;
        font-weight: 900;
        line-height: 1.34;
        color: #141414;
        text-align: center;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s08"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="7.11"
    >
      <section id="scene-s08" class="clip" data-start="0" data-duration="7.11">
        <div id="camera-rig">
          <!-- Flow SVG Diagram -->
          <svg class="flow-svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
            <!-- Nút gốc ngã rẽ -->
            <circle id="origin-node" cx="540" cy="460" r="18" fill="#141414" />

            <!-- Trục chính dẫn vào ngã ba -->
            <path id="path-stem" class="flow-stem" d="M 540 478 L 540 600" />

            <!-- Nhánh trái: các lối thoát thương lượng (nét đứt) -->
            <path id="path-left-main" class="flow-branch-left" d="M 540 600 C 470 650, 360 690, 310 760" />
            <path id="path-left-sub1" class="flow-branch-left" d="M 310 760 C 260 780, 200 805, 170 840" />
            <path id="path-left-sub2" class="flow-branch-left" d="M 310 760 L 310 836" />
            <path id="path-left-sub3" class="flow-branch-left" d="M 310 760 C 370 780, 430 805, 460 840" />

            <!-- Icon cấm (Ban) trên nhánh trái thể hiện bị gạt bỏ -->
            <g id="ban-group" opacity="0">
              <circle class="ban-icon-shape" cx="310" cy="760" r="36" />
              <line class="ban-icon-shape" x1="285" y1="735" x2="335" y2="785" />
            </g>

            <!-- Nhánh phải: hướng Đạt chọn, bẫy điện nguy hiểm (nét cam ziczac) -->
            <path id="path-right-flow" class="flow-branch-right" d="M 540 600 C 620 640, 710 680, 740 760 L 710 820 L 780 890 L 730 960 L 765 1054" />

            <!-- Icon tia sét bẫy điện -->
            <path
              id="lightning-icon"
              class="lightning-shape"
              d="M 870 940 L 830 1000 L 870 1000 L 840 1070 L 920 985 L 875 985 Z"
              opacity="0"
            />
          </svg>

          <!-- 3 Khối chữ duy nhất của cảnh (1 Punch Phrase + 2 Labels, không xoay) -->
          <div id="punch-box">
            <h1 class="punch-text">LỰA CHỌN SAI LẦM</h1>
          </div>

          <div id="card-negotiate">
            <p class="label-negotiate-text">Nhiều lối thương lượng</p>
          </div>

          <div id="card-trap">
            <p class="label-trap-text">Đường cùng bẫy điện</p>
          </div>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Khởi tạo dash pattern cho các SVG paths
      const pathsToMeasure = [
        "#path-stem",
        "#path-left-main",
        "#path-left-sub1",
        "#path-left-sub2",
        "#path-left-sub3",
        "#path-right-flow"
      ];
      pathsToMeasure.forEach((selector) => {
        const el = document.querySelector(selector);
        if (el) {
          const len = el.getTotalLength();
          el.style.strokeDasharray = len + 2;
          el.style.strokeDashoffset = len + 2;
        }
      });

      // Trạng thái ban đầu an toàn cho các khối
      gsap.set(["#punch-box", "#card-negotiate", "#card-trap"], { opacity: 0 });
      gsap.set("#origin-node", { scale: 0, transformOrigin: "540px 460px" });
      gsap.set("#ban-group", { scale: 0, transformOrigin: "310px 760px" });
      gsap.set("#lightning-icon", { scale: 0, transformOrigin: "870px 1000px" });

      // 1. Toàn bộ cảnh: Camera drift-out chậm rãi, liền mạch suốt 7.11s
      tl.fromTo(
        "#camera-rig",
        { scale: 1.05 },
        { scale: 1.0, duration: 7.11, ease: "none" },
        0
      );

      // 2. Điểm xuất phát và thân ngã rẽ xuất hiện (0.1s - 1.4s)
      tl.to("#origin-node", { scale: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.to("#path-stem", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 0.3);

      // 3. Nhánh trái vẽ ra các phương án thương lượng (0.7s - 1.57s)
      tl.to("#path-left-main", { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 0.7);
      tl.to("#path-left-sub1", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.15);
      tl.to("#path-left-sub2", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.2);
      tl.to("#path-left-sub3", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.25);

      // 4. Nhãn 1: "Nhiều lối thương lượng" xuất hiện tại t = 1.57s (atMs 60500)
      tl.fromTo(
        "#card-negotiate",
        { opacity: 0, y: 30, scale: 0.85 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
        1.57
      );

      // Nhánh thương lượng bị gạt bỏ: Dấu Ban bật lên (2.4s)
      tl.fromTo(
        "#ban-group",
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
        2.4
      );

      // 5. Punch Phrase: "LỰA CHỌN SAI LẦM" xuất hiện mạnh mẽ tại t = 4.07s (atMs 63000)
      tl.fromTo(
        "#punch-box",
        { opacity: 0, scale: 1.2, y: -20 },
        { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power4.out" },
        4.07
      );

      // 6. Nhánh phải: Con đường bẫy điện lao xuống (4.4s - 5.07s)
      tl.to("#path-right-flow", { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" }, 4.4);

      // Tia sét cảnh báo lóe lên
      tl.fromTo(
        "#lightning-icon",
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" },
        4.9
      );

      // 7. Nhãn 2: "Đường cùng bẫy điện" bật vào tại t = 5.07s (atMs 64000)
      tl.fromTo(
        "#card-trap",
        { opacity: 0, y: 30, scale: 0.85 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
        5.07
      );

      // 8. Chuyển động liên tục hữu hạn (breathe / bob) - không để khung hình chết cứng
      // Thẻ thương lượng nhấp nhô nhẹ (bobbing)
      tl.to(
        "#card-negotiate",
        { y: -8, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 3 },
        2.2
      );

      // Punch Phrase thở nhẹ (breathe)
      tl.to(
        "#punch-box",
        { scale: 1.012, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 1 },
        4.6
      );

      // Thẻ bẫy điện dịch ngang nhẹ (drift-x)
      tl.to(
        "#card-trap",
        { x: 6, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 1 },
        5.6
      );

      // Đăng ký timeline cho HyperFrames seek
      window.__timelines["scene-s08"] = tl;
    </script>
  
    </template>
  </body>
</html>
