<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: #E7E3D9;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Camera Rig for continuous subtle drift-in */
      #camera-rig {
        position: absolute;
        inset: 0;
        transform-origin: 540px 960px;
      }

      /* Background Variant: CHART (4 horizontal ruled lines at 20%, 40%, 60%, 80% + left-edge orange ticks) */
      .chart-line {
        position: absolute;
        left: 0;
        width: 100%;
        height: 2px;
        background-color: rgba(20, 20, 20, 0.22);
        transform-origin: left center;
      }
      .chart-tick {
        position: absolute;
        left: 0;
        width: 36px;
        height: 8px;
        background-color: #FF6A1A;
      }

      /* Block chữ 1: Label Timestamp (Top) */
      #label-timestamp {
        position: absolute;
        top: 220px;
        left: 80px;
        display: inline-flex;
        align-items: center;
        background-color: #141414;
        color: #F7F4EC;
        padding: 14px 28px;
        border-radius: 6px;
        box-shadow: 0 8px 24px rgba(20, 20, 20, 0.12);
        opacity: 0;
        z-index: 10;
      }
      #label-timestamp .dot {
        width: 12px;
        height: 12px;
        background-color: #FF6A1A;
        border-radius: 2px;
        margin-right: 16px;
        flex-shrink: 0;
      }
      #label-timestamp .text {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.5px;
        line-height: 1;
      }

      /* Center Diagram Container */
      #diagram-container {
        position: absolute;
        top: 330px;
        left: 60px;
        width: 960px;
        height: 520px;
        z-index: 5;
        transform-origin: center top;
      }
      #diagram-content {
        position: absolute;
        inset: 0;
      }

      /* Block chữ 2: Punch Phrase duy nhất (CUỘN DÂY ĐIỆN 12M) */
      #punch-phrase {
        position: absolute;
        top: 890px;
        left: 80px;
        width: 920px;
        background-color: #141414;
        color: #F7F4EC;
        border-left: 14px solid #FF6A1A;
        padding: 30px 40px;
        border-radius: 6px;
        box-shadow: 0 16px 36px rgba(20, 20, 20, 0.18);
        opacity: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: center center;
      }
      #punch-phrase h1 {
        margin: 0;
        font-size: 64px;
        font-weight: 900;
        line-height: 1.25;
        letter-spacing: 1px;
        text-align: center;
        white-space: nowrap;
        color: #F7F4EC;
      }

      /* Block chữ 3: Label Intent (Ý định đoạt mạng) */
      #label-intent {
        position: absolute;
        top: 1080px;
        left: 140px;
        width: 800px;
        background-color: #FF6A1A;
        color: #141414;
        padding: 24px 36px;
        border-radius: 6px;
        box-shadow: 0 12px 30px rgba(255, 106, 26, 0.25);
        opacity: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: center center;
      }
      #label-intent .text {
        font-size: 46px;
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: 1px;
        text-align: center;
        text-transform: uppercase;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s09"
      data-width="1080"
      data-height="1920"
      data-duration="6.75"
    >
      <section id="scene-s09" class="clip" data-start="0" data-duration="6.75">
        <!-- CHART BACKGROUND VARIANT (4 Ruled Lines at 20%, 40%, 60%, 80% + Orange Ticks) -->
        <div id="chart-bg">
          <!-- 20% = 384px -->
          <div class="chart-line" style="top: 384px;"></div>
          <div class="chart-tick" style="top: 381px;"></div>
          <!-- 40% = 768px -->
          <div class="chart-line" style="top: 768px;"></div>
          <div class="chart-tick" style="top: 765px;"></div>
          <!-- 60% = 1152px -->
          <div class="chart-line" style="top: 1152px;"></div>
          <div class="chart-tick" style="top: 1149px;"></div>
          <!-- 80% = 1536px -->
          <div class="chart-line" style="top: 1536px;"></div>
          <div class="chart-tick" style="top: 1533px;"></div>
        </div>

        <!-- CAMERA RIG (Continuous Ken Burns drift-in) -->
        <div id="camera-rig">
          <!-- BLOCK CHỮ 1: NHÃN MỐC THỜI GIAN (15:00 ngày 10/9) -->
          <div id="label-timestamp">
            <div class="dot"></div>
            <div class="text">15:00 ngày 10/9</div>
          </div>

          <!-- HERO DIAGRAM: 12-METER WIRE SPOOL & MEASUREMENT RAIL (Không chứa text) -->
          <div id="diagram-container">
            <div id="diagram-content">
              <svg width="960" height="520" viewBox="0 0 960 520" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- TECHNICAL BASELINE RAIL (y = 260) -->
                <!-- Start Datum Bracket (x = 200) -->
                <line x1="200" y1="160" x2="200" y2="360" stroke="#141414" stroke-width="4" stroke-linecap="square" />
                <circle cx="200" cy="260" r="6" fill="#141414" />

                <!-- Guide Track Line (Background Rail) -->
                <line x1="200" y1="260" x2="860" y2="260" stroke="rgba(20, 20, 20, 0.25)" stroke-width="4" stroke-dasharray="8 8" />

                <!-- RULER NOTCHES / DIVISION TICKS (Total 660px length) -->
                <!-- 0m: x=200 -->
                <line x1="200" y1="240" x2="200" y2="280" stroke="#141414" stroke-width="3" />
                <!-- Subticks between 0 and 3m -->
                <line x1="255" y1="252" x2="255" y2="268" stroke="rgba(20,20,20,0.5)" stroke-width="2" />
                <line x1="310" y1="252" x2="310" y2="268" stroke="rgba(20,20,20,0.5)" stroke-width="2" />
                <!-- 3m: x=365 -->
                <line x1="365" y1="244" x2="365" y2="276" stroke="#141414" stroke-width="3" />
                <!-- Subticks between 3 and 6m -->
                <line x1="420" y1="252" x2="420" y2="268" stroke="rgba(20,20,20,0.5)" stroke-width="2" />
                <line x1="475" y1="252" x2="475" y2="268" stroke="rgba(20,20,20,0.5)" stroke-width="2" />
                <!-- 6m: x=530 -->
                <line x1="530" y1="244" x2="530" y2="276" stroke="#141414" stroke-width="3" />
                <!-- Subticks between 6 and 9m -->
                <line x1="585" y1="252" x2="585" y2="268" stroke="rgba(20,20,20,0.5)" stroke-width="2" />
                <line x1="640" y1="252" x2="640" y2="268" stroke="rgba(20,20,20,0.5)" stroke-width="2" />
                <!-- 9m: x=695 -->
                <line x1="695" y1="244" x2="695" y2="276" stroke="#141414" stroke-width="3" />
                <!-- Subticks between 9 and 12m -->
                <line x1="750" y1="252" x2="750" y2="268" stroke="rgba(20,20,20,0.5)" stroke-width="2" />
                <line x1="805" y1="252" x2="805" y2="268" stroke="rgba(20,20,20,0.5)" stroke-width="2" />
                <!-- 12m Target Stop: x=860 -->
                <line x1="860" y1="240" x2="860" y2="280" stroke="#FF6A1A" stroke-width="4" />

                <!-- ACTIVE EXTENSION BAR (Draws progressively with wire) -->
                <line id="dimension-bar" x1="200" y1="310" x2="860" y2="310" stroke="#FF6A1A" stroke-width="6" stroke-linecap="round" />
                <!-- Dimension baseline start & end arrows -->
                <polygon points="200,310 216,303 216,317" fill="#FF6A1A" />

                <!-- 12M END TARGET STOP BRACKET -->
                <g id="end-bracket">
                  <line x1="860" y1="160" x2="860" y2="360" stroke="#FF6A1A" stroke-width="6" stroke-linecap="square" />
                  <polygon points="860,310 844,303 844,317" fill="#FF6A1A" />
                  <circle cx="860" cy="260" r="10" fill="#FF6A1A" />
                  <circle cx="860" cy="260" r="5" fill="#E7E3D9" />
                </g>

                <!-- WIRE SPOOL ASSEMBLY (Left: x=100, y=260) -->
                <g id="wire-spool">
                  <!-- Outer Spool Flange -->
                  <circle cx="100" cy="260" r="82" fill="#F5F0E4" stroke="#141414" stroke-width="6" />
                  <!-- Wire Coils wrapped around core -->
                  <circle cx="100" cy="260" r="66" stroke="#141414" stroke-width="6" fill="none" stroke-dasharray="14 6" />
                  <circle cx="100" cy="260" r="52" stroke="#FF6A1A" stroke-width="6" fill="none" stroke-dasharray="12 4" />
                  <circle cx="100" cy="260" r="38" stroke="#141414" stroke-width="6" fill="none" stroke-dasharray="8 4" />
                  <!-- Inner Spool Arbor Core -->
                  <circle cx="100" cy="260" r="22" fill="#141414" />
                  <circle cx="100" cy="260" r="8" fill="#E7E3D9" />
                </g>

                <!-- UNCOILING ELECTRIC WIRE PATH -->
                <!-- Outer Insulated Jacket -->
                <path
                  id="wire-outer"
                  d="M 100 178 C 120 150, 150 200, 200 260 L 860 260"
                  stroke="#141414"
                  stroke-width="12"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  fill="none"
                />
                <!-- Inner Live Core Accent -->
                <path
                  id="wire-core"
                  d="M 100 178 C 120 150, 150 200, 200 260 L 860 260"
                  stroke="#FF6A1A"
                  stroke-width="4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  fill="none"
                />

                <!-- HIGH-VOLTAGE HAZARD SPARK (Appears at 12m tip) -->
                <g id="hazard-spark">
                  <path
                    d="M 875 220 L 895 242 L 882 245 L 902 275 L 872 254 L 885 250 Z"
                    fill="#FF6A1A"
                    stroke="#141414"
                    stroke-width="3"
                    stroke-linejoin="round"
                  />
                </g>
              </svg>
            </div>
          </div>

          <!-- BLOCK CHỮ 2: PUNCH PHRASE (CUỘN DÂY ĐIỆN 12M) - 1 TEXT NODE ĐƠN NHẤT -->
          <div id="punch-phrase">
            <h1>CUỘN DÂY ĐIỆN 12M</h1>
          </div>

          <!-- BLOCK CHỮ 3: NHÃN Ý ĐỊNH (Ý định đoạt mạng) -->
          <div id="label-intent">
            <div class="text">Ý định đoạt mạng</div>
          </div>
        </div>
      </section>
    </div>

    <!-- GSAP TIMELINE SCRIPT -->
    <script>
      // Single paused master timeline registered to window.__timelines["scene-s09"]
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s09"] = tl;

      // Setup Wire SVG Path Dasharray & Dashoffset for progressive drawing
      const wireOuter = document.getElementById("wire-outer");
      const wireCore = document.getElementById("wire-core");
      const wireLength = wireOuter.getTotalLength();

      wireOuter.style.strokeDasharray = wireLength;
      wireOuter.style.strokeDashoffset = wireLength;

      wireCore.style.strokeDasharray = wireLength;
      wireCore.style.strokeDashoffset = wireLength;

      // 1. BEAT 0.0s - 0.6s: Entrance & Background Unfold (Non-rotational unfold)
      tl.fromTo(
        ".chart-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.6, ease: "power2.out", stagger: 0.08 },
        0
      );
      tl.fromTo(
        ".chart-tick",
        { x: -40, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power2.out", stagger: 0.08 },
        0.1
      );

      // Camera Rig Continuous Drift-in (Scale 1 -> 1.04 across scene duration 6.75s)
      tl.fromTo(
        "#camera-rig",
        { scale: 1 },
        { scale: 1.04, duration: 6.75, ease: "none" },
        0
      );

      // Diagram Container Unfold Entrance (t = 0.2s)
      tl.fromTo(
        "#diagram-container",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.2
      );

      // Spool Pop Arrival (t = 0.4s)
      tl.fromTo(
        "#wire-spool",
        { scale: 0, opacity: 0, transformOrigin: "100px 260px" },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.4
      );

      // 2. BEAT 0.65s: Block chữ 1 Entrance ("15:00 ngày 10/9", atMs: 66690 -> 0.65s)
      tl.fromTo(
        "#label-timestamp",
        { y: -24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.65
      );
      // Gentle fade out at t = 3.3s trước khi punch phrase xuất hiện
      tl.to(
        "#label-timestamp",
        { y: -14, opacity: 0, duration: 0.35, ease: "power2.in" },
        3.3
      );

      // 3. BEAT 1.0s - 3.5s: Uncoiling Wire & 12m Measurement Rail Draw
      tl.fromTo(
        "#dimension-bar",
        { scaleX: 0, transformOrigin: "200px 310px" },
        { scaleX: 1, duration: 2.3, ease: "power2.inOut" },
        1.0
      );

      // Wire draws progressively
      tl.to(
        wireOuter,
        { strokeDashoffset: 0, duration: 2.3, ease: "power2.inOut" },
        1.0
      );
      tl.to(
        wireCore,
        { strokeDashoffset: 0, duration: 2.3, ease: "power2.inOut" },
        1.0
      );

      // 12m Target Stop Bracket locks in (t = 3.3s)
      tl.fromTo(
        "#end-bracket",
        { scaleY: 0, opacity: 0, transformOrigin: "860px 260px" },
        { scaleY: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
        3.3
      );

      // Hazard Spark pops in (t = 3.5s)
      tl.fromTo(
        "#hazard-spark",
        { scale: 0, opacity: 0, transformOrigin: "885px 250px" },
        { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
        3.5
      );

      // 4. BEAT 3.84s: Block chữ 2 Entrance - Punch Phrase ("CUỘN DÂY ĐIỆN 12M", atMs: 69880 -> 3.84s)
      tl.fromTo(
        "#punch-phrase",
        { scale: 0.88, opacity: 0, y: 16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        3.84
      );

      // 5. BEAT 4.83s: Block chữ 3 Entrance - Label Intent ("Ý định đoạt mạng", atMs: 70870 -> 4.83s)
      tl.fromTo(
        "#label-intent",
        { y: 28, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        4.83
      );

      // Continuous subtle alive motion (Finite, seek-safe, no repeat: -1)
      // Diagram subtle bobbing
      tl.to(
        "#diagram-content",
        { y: -6, duration: 2.8, ease: "sine.inOut", yoyo: true, repeat: 1 },
        0.8
      );

      // Punch phrase subtle breathe
      tl.to(
        "#punch-phrase",
        { scale: 1.012, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 },
        4.34
      );
    </script>
  
    </template>
  </body>
</html>
