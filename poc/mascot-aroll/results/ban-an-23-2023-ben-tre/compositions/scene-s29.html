  <body>
    <template>

      <style>
      /* hf-safe-colors (tất định từ style-tokens.json) */
      .hf-text-ink { color: #141414; }
      .hf-text-light { color: #F7F4EC; }
      .hf-hl-orange { color: #141414; background-color: #FF6A1A; }
      .hf-plate-ink { color: #F7F4EC; background-color: #141414; }
      .hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
      .hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* CAMERA CONTAINER */
      #camera-container {
        position: absolute;
        inset: 0;
        transform-origin: 50% 45%;
        will-change: transform;
      }

      /* CHART BACKGROUND VARIANT (4 ruled lines at 20%, 40%, 60%, 80% + orange ticks) */
      .chart-bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .chart-line {
        position: absolute;
        left: 36px;
        right: 0;
        height: 2px;
        background-color: rgba(20, 20, 20, 0.22);
        transform-origin: left center;
      }

      .chart-tick {
        position: absolute;
        left: 0;
        width: 36px;
        height: 4px;
        background-color: #FF6A1A;
        transform-origin: left center;
      }

      .line-20 { top: 20%; }
      .line-40 { top: 40%; }
      .line-60 { top: 60%; }
      .line-80 { top: 80%; }

      /* MAIN DIAGRAM WRAPPER */
      #diagram-wrapper {
        position: absolute;
        left: 70px;
        right: 70px;
        top: 310px;
        display: flex;
        flex-direction: column;
        align-items: center;
        will-change: transform;
      }

      /* CARD 1: FALSE PREMISE (LABEL 1 - NÓNG GIẬN NHẤT THỜI) */
      #card-hypo {
        width: 100%;
        height: 160px;
        background-color: #F5F0E4;
        border: 3px solid #141414;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        transform-origin: center top;
        box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.16);
      }

      .hypo-text {
        font-size: 50px;
        font-weight: 900;
        color: #141414;
        letter-spacing: -0.5px;
        text-transform: uppercase;
      }

      .strike-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .strike-path {
        stroke: #FF6A1A;
        stroke-width: 10;
        stroke-linecap: round;
        fill: none;
      }

      /* CONNECTOR */
      .connector-box {
        width: 100%;
        height: 80px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .connector-svg {
        width: 60px;
        height: 80px;
      }

      .connector-path {
        stroke: #141414;
        stroke-width: 4;
        stroke-dasharray: 8 6;
        fill: none;
      }

      /* CARD 2: EVIDENCE TIMELINE (LABEL 2) */
      #card-evidence {
        width: 100%;
        background-color: #141414;
        border-radius: 8px;
        padding: 38px 40px;
        display: flex;
        flex-direction: column;
        transform-origin: center top;
        box-shadow: 8px 8px 0px rgba(20, 20, 20, 0.22);
      }

      .evidence-header {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        margin-bottom: 26px;
      }

      .evidence-title {
        font-size: 50px;
        font-weight: 900;
        color: #F7F4EC;
        letter-spacing: -0.5px;
      }

      /* TIMELINE GRAPHIC BAR (PURE VISUAL SEGMENTS) */
      .timeline-track {
        width: 100%;
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .timeline-segment {
        flex: 1;
        height: 18px;
        background-color: #FF6A1A;
        border-radius: 4px;
        transform-origin: left center;
      }

      /* GAP BETWEEN CARDS */
      .spacer {
        width: 100%;
        height: 54px;
      }

      /* PUNCH PHRASE PLATE (PUNCH PHRASE) */
      #punch-card {
        width: 100%;
        background-color: #FF6A1A;
        border: 4px solid #141414;
        box-shadow: 12px 12px 0px #141414;
        border-radius: 8px;
        padding: 40px 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: center center;
      }

      .punch-text {
        font-size: 64px;
        font-weight: 900;
        color: #141414;
        letter-spacing: -0.5px;
        text-transform: uppercase;
        text-align: center;
        line-height: 1.15;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s29"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="4.5"
    >
      <section id="scene-s29" class="clip" data-start="0" data-duration="4.5">
        <!-- CHART BACKGROUND VARIANT -->
        <div class="chart-bg">
          <div class="chart-tick line-20"></div>
          <div class="chart-line line-20"></div>

          <div class="chart-tick line-40"></div>
          <div class="chart-line line-40"></div>

          <div class="chart-tick line-60"></div>
          <div class="chart-line line-60"></div>

          <div class="chart-tick line-80"></div>
          <div class="chart-line line-80"></div>
        </div>

        <!-- CAMERA MOVEMENT WRAPPER -->
        <div id="camera-container">
          <div id="diagram-wrapper">
            <!-- KHỐI CHỮ 1 (LABEL 1): NÓNG GIẬN NHẤT THỜI (DIỄN ĐẠT KHÔNG ĐỊNH LƯỢNG) -->
            <div id="card-hypo">
              <span id="hypo-text" class="hypo-text">NÓNG GIẬN NHẤT THỜI</span>
              <svg class="strike-svg" viewBox="0 0 940 160" preserveAspectRatio="none" data-layout-allow-occlusion="true">
                <!-- Diagonal slash -->
                <line
                  id="strike-line-1"
                  class="strike-path"
                  x1="30"
                  y1="130"
                  x2="910"
                  y2="30"
                  stroke-dasharray="920"
                  stroke-dashoffset="920"
                />
                <!-- Horizontal bar -->
                <line
                  id="strike-line-2"
                  class="strike-path"
                  x1="50"
                  y1="80"
                  x2="890"
                  y2="80"
                  stroke-dasharray="860"
                  stroke-dashoffset="860"
                />
              </svg>
            </div>

            <!-- CONNECTOR ARROW (GRAPHIC ONLY) -->
            <div class="connector-box">
              <svg class="connector-svg" viewBox="0 0 60 80">
                <line
                  id="connector-line"
                  class="connector-path"
                  x1="30"
                  y1="6"
                  x2="30"
                  y2="74"
                  stroke-dasharray="80"
                  stroke-dashoffset="80"
                />
              </svg>
            </div>

            <!-- KHỐI CHỮ 2 (LABEL 2): Chuẩn bị nhiều giờ -->
            <div id="card-evidence">
              <div class="evidence-header">
                <span id="evidence-title" class="evidence-title">Chuẩn bị nhiều giờ</span>
              </div>
              <div class="timeline-track">
                <div class="timeline-segment"></div>
                <div class="timeline-segment"></div>
                <div class="timeline-segment"></div>
                <div class="timeline-segment"></div>

            <div class="spacer"></div>

            <!-- KHỐI CHỮ 3 (PUNCH PHRASE): KHÔNG THỂ BỘC PHÁT -->
            <div id="punch-card">
              <span id="punch-text" class="punch-text">KHÔNG THỂ BỘC PHÁT</span>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({
        paused: true,
        defaults: { ease: "power3.out" },
      });

      // 1. Continuous camera drift-out across the entire scene (0s -> 4.5s)
      tl.fromTo(
        "#camera-container",
        { scale: 1.05 },
        { scale: 1.0, duration: 4.5, ease: "none" },
        0
      );

      // 2. Chart lines intro
      tl.fromTo(
        ".chart-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, stagger: 0.06, ease: "power2.out" },
        0.05
      );
      tl.fromTo(
        ".chart-tick",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.3, stagger: 0.06, ease: "power2.out" },
        0.1
      );

      // 3. Card 1 unfold entrance
      tl.fromTo(
        "#card-hypo",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.2
      );
      tl.fromTo(
        "#hypo-text",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
        0.35
      );

      // 4. Decisive strike-out effect rejecting the impulse thesis
      tl.fromTo(
        "#strike-line-1",
        { strokeDashoffset: 920 },
        { strokeDashoffset: 0, duration: 0.38, ease: "power2.inOut" },
        0.72
      );
      tl.fromTo(
        "#strike-line-2",
        { strokeDashoffset: 860 },
        { strokeDashoffset: 0, duration: 0.32, ease: "power2.inOut" },
        0.82
      );

      // 5. Downward connector draw
      tl.fromTo(
        "#connector-line",
        { strokeDashoffset: 80 },
        { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
        0.98
      );

      // 6. Card 2 entrance: "Chuẩn bị nhiều giờ" (atMs 229780 -> 1.12s)
      tl.fromTo(
        "#card-evidence",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        1.12
      );
      tl.fromTo(
        "#evidence-title",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
        1.25
      );
      tl.fromTo(
        ".timeline-segment",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, stagger: 0.08, ease: "power2.out" },
        1.35
      );

      // 7. Punch phrase entrance: "KHÔNG THỂ BỘC PHÁT" (atMs 231140 -> 2.48s)
      tl.fromTo(
        "#punch-card",
        { scale: 0.82, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.48, ease: "power4.out" },
        2.48
      );
      tl.fromTo(
        "#punch-text",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" },
        2.58
      );

      // 8. Subtle post-settle breathing motion (finite, deterministic, no rotation)
      tl.fromTo(
        "#diagram-wrapper",
        { y: 0 },
        { y: -6, duration: 1.4, ease: "sine.inOut" },
        3.1
      );

      // Register timeline
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s29"] = tl;
    </script>
  
    </template>
