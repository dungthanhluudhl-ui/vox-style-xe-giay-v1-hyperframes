<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>S06 - Vox Style Composition</title>
    <!-- Google Fonts CDN: Be Vietnam Pro (weights 700 and 900) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
    <!-- GSAP CDN -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        background-color: #e7e3d9;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #e7e3d9;
      }

      /* Video background container */
      #video-wrapper {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        z-index: 1;
        transform-origin: 50% 50%;
      }

      #crowd-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Paper grid texture */
      .paper-grid {
        position: absolute;
        inset: 0;
        background-size: 84px 84px;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px);
        pointer-events: none;
        z-index: 2;
        mix-blend-mode: multiply;
      }

      /* Subtle paper grain & spotlight overlay */
      .grain-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 45%,
          transparent 40%,
          rgba(20, 20, 20, 0.3) 100%
        );
        pointer-events: none;
        z-index: 3;
        mix-blend-mode: multiply;
      }

      /* Full-frame overlay clip */
      .clip {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
      }

      #overlay-layer {
        z-index: 10;
      }

      /* Fixed bottom orange signature bar */
      .bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 100;
      }

      /* Context Header Badge (Top safe zone) */
      #context-header {
        position: absolute;
        top: 175px;
        left: 60px;
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 20;
      }

      .header-pill {
        background-color: #ff6a1a;
        color: #141414;
        font-size: 20px;
        font-weight: 900;
        padding: 8px 16px;
        border-radius: 4px;
        letter-spacing: 0.5px;
      }

      .header-title {
        background-color: #141414;
        color: #f7f4ec;
        font-size: 24px;
        font-weight: 900;
        padding: 8px 18px;
        border-radius: 4px;
        letter-spacing: 0.5px;
      }

      /* TV Screen Censor / Callout */
      #censor-box {
        position: absolute;
        left: 130px;
        top: 550px;
        width: 300px;
        height: 205px;
        background-color: rgba(20, 20, 20, 0.88);
        border: 2px dashed #ff6a1a;
        border-radius: 6px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        padding: 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        z-index: 15;
      }

      .censor-tag-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .censor-badge {
        background-color: #ff6a1a;
        color: #141414;
        font-size: 14px;
        font-weight: 900;
        padding: 3px 8px;
        border-radius: 2px;
      }

      .censor-status {
        color: #f7f4ec;
        font-size: 14px;
        font-weight: 700;
      }

      .censor-main-title {
        color: #f7f4ec;
        font-size: 20px;
        font-weight: 900;
        line-height: 1.3;
        margin: 6px 0;
      }

      .censor-note {
        color: #ff6a1a;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.4px;
      }

      /* Flow SVG Canvas */
      #flow-svg {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        z-index: 12;
      }

      /* Flow Attention Label */
      #arrow-label {
        position: absolute;
        left: 360px;
        top: 1210px;
        background-color: #141414;
        border: 2px solid #ff6a1a;
        box-shadow: 4px 4px 0px #ff6a1a;
        padding: 10px 22px;
        border-radius: 6px;
        z-index: 18;
      }

      .arrow-label-text {
        color: #f7f4ec;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0.5px;
      }

      /* Product Card at Cashier Counter */
      #product-card {
        position: absolute;
        left: 560px;
        top: 640px;
        width: 440px;
        background-color: #f5f0e4;
        border: 3.5px solid #141414;
        box-shadow: 8px 8px 0px #ff6a1a;
        padding: 24px 28px;
        border-radius: 6px;
        z-index: 22;
        transform-origin: 0% 50%;
      }

      .card-tag-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .card-category {
        background-color: #ff6a1a;
        color: #141414;
        font-size: 16px;
        font-weight: 900;
        padding: 4px 10px;
        border-radius: 3px;
        letter-spacing: 0.4px;
      }

      .card-indicator {
        color: #141414;
        font-size: 15px;
        font-weight: 700;
      }

      .card-title {
        color: #141414;
        font-size: 42px;
        font-weight: 900;
        line-height: 1.18;
        margin: 0 0 10px 0;
        letter-spacing: -0.5px;
      }

      .card-description {
        color: #141414;
        font-size: 19px;
        font-weight: 700;
        margin-bottom: 16px;
        line-height: 1.3;
      }

      .card-footer {
        display: flex;
        align-items: center;
        border-top: 2px dashed rgba(20, 20, 20, 0.35);
        padding-top: 12px;
      }

      .card-action {
        color: #141414;
        font-size: 16px;
        font-weight: 900;
      }

      /* Endpoint Lock Reticle (Isolated HTML Container) */
      #target-reticle {
        position: absolute;
        left: 729px; /* 775px center - 46px radius */
        top: 839px;  /* 885px center - 46px radius */
        width: 92px;
        height: 92px;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: 50% 50%;
        pointer-events: none;
        z-index: 25;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-width="1080"
      data-height="1920"
      data-duration="5.96"
    >
      <!-- Video Layer (Scaled during Grow Transition) -->
      <div id="video-wrapper" data-layout-allow-overflow="true">
        <video
          id="crowd-video"
          src="assets/vid-03-papercut-crowd-scandal-storefront.mp4"
          data-start="0"
          data-duration="5.96"
          data-media-start="1.5"
          muted
          playsinline
        ></video>
      </div>

      <!-- Paper Grid & Vignette Texture -->
      <div class="paper-grid"></div>
      <div class="grain-overlay"></div>

      <!-- Main Animated Overlay Clip -->
      <div id="overlay-layer" class="clip" data-start="0" data-duration="5.96">
        <!-- Editorial Context Header (Safe Zone Top) -->
        <div id="context-header">
          <span class="header-pill">VỤ ÁN 473</span>
          <span class="header-title">THỦ ĐOẠN DẪN DỤ</span>
        </div>

        <!-- TV Screen Censor / Attention Anchor -->
        <div id="censor-box">
          <div class="censor-tag-row">
            <span class="censor-badge">NGOÀI CỬA</span>
            <span class="censor-status">MÀN HÌNH TV</span>
          </div>
          <div class="censor-main-title">[ PHIM NGƯỜI LỚN ]</div>
          <div class="censor-note">CHIẾU ĐỂ KÉO KHÁCH</div>
        </div>

        <!-- Flow Line SVG (TV -> Crowd -> Cashier Counter) -->
        <svg
          id="flow-svg"
          viewBox="0 0 1080 1920"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          data-layout-allow-overflow="true"
        >
          <!-- Outer subtle shadow path -->
          <path
            id="flow-path-shadow"
            d="M 280 755 C 280 990, 370 1170, 530 1170 C 670 1170, 740 1020, 775 885"
            stroke="rgba(20,20,20,0.4)"
            stroke-width="12"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <!-- Primary Orange Flow Path -->
          <path
            id="flow-path"
            d="M 280 755 C 280 990, 370 1170, 530 1170 C 670 1170, 740 1020, 775 885"
            stroke="#FF6A1A"
            stroke-width="7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <!-- Arrowhead at Cashier Counter Point (775, 885) -->
          <path
            id="arrow-head"
            d="M 748 905 L 775 885 L 802 900"
            stroke="#FF6A1A"
            stroke-width="8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

        <!-- Endpoint Lock Reticle (Target Ring at Counter 775, 885) -->
        <div id="target-reticle">
          <svg width="92" height="92" viewBox="0 0 92 92" fill="none">
            <circle
              cx="46"
              cy="46"
              r="34"
              stroke="#FF6A1A"
              stroke-width="4"
              stroke-dasharray="6 6"
              fill="none"
            />
            <circle cx="46" cy="46" r="12" fill="#FF6A1A" />
            <line x1="0" y1="46" x2="24" y2="46" stroke="#FF6A1A" stroke-width="3" />
            <line x1="68" y1="46" x2="92" y2="46" stroke="#FF6A1A" stroke-width="3" />
            <line x1="46" y1="0" x2="46" y2="24" stroke="#FF6A1A" stroke-width="3" />
            <line x1="46" y1="68" x2="46" y2="92" stroke="#FF6A1A" stroke-width="3" />
          </svg>
        </div>

        <!-- Flow Direction Label (Max 4 words) -->
        <div id="arrow-label">
          <span class="arrow-label-text">BẺ HƯỚNG CHÚ Ý</span>
        </div>

        <!-- Product Card at Cashier Counter -->
        <div id="product-card">
          <div class="card-tag-row">
            <span class="card-category">QUẦY THU NGÂN</span>
            <span class="card-indicator">● ĐÍCH ĐẾN THẬT</span>
          </div>
          <h2 class="card-title">HÀNG Ở QUẦY</h2>
          <div class="card-description">Món hàng thực sự cần bán</div>
          <div class="card-footer">
            <span class="card-action">ĐẶT SẴN TRONG TIỆM</span>
          </div>
        </div>
      </div>

      <!-- Signature Orange Bar at Bottom -->
      <div class="bottom-bar"></div>
    </div>

    <!-- Animation Script -->
    <script>
      // 1. Setup paths stroke dash lengths deterministically
      const flowPath = document.getElementById("flow-path");
      const flowShadow = document.getElementById("flow-path-shadow");
      const arrowHead = document.getElementById("arrow-head");

      const measuredLen =
        flowPath && flowPath.getTotalLength ? flowPath.getTotalLength() : 960;

      if (flowPath) {
        flowPath.style.strokeDasharray = measuredLen;
        flowPath.style.strokeDashoffset = measuredLen;
      }
      if (flowShadow) {
        flowShadow.style.strokeDasharray = measuredLen;
        flowShadow.style.strokeDashoffset = measuredLen;
      }

      const arrowHeadLen =
        arrowHead && arrowHead.getTotalLength ? arrowHead.getTotalLength() : 80;

      if (arrowHead) {
        arrowHead.style.strokeDasharray = arrowHeadLen;
        arrowHead.style.strokeDashoffset = arrowHeadLen;
      }

      // 2. Build Single Paused GSAP Timeline
      const tl = gsap.timeline({ paused: true });

      // S06 Transition In: "grow" camera settle on storefront video
      tl.fromTo(
        "#video-wrapper",
        { scale: 1.08 },
        { scale: 1.0, duration: 1.4, ease: "power3.out" },
        0,
      );

      // Context Badge Entrance
      tl.fromTo(
        "#context-header",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.2,
      );

      // TV Screen Censor / Callout Box Entrance
      tl.fromTo(
        "#censor-box",
        { scale: 0.85, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.35,
      );

      // Overlay 1: flowArrow begins drawing at 43680ms (relative t = 1.17s)
      tl.to(
        "#flow-path",
        { strokeDashoffset: 0, duration: 1.25, ease: "power2.out" },
        1.17,
      );
      tl.to(
        "#flow-path-shadow",
        { strokeDashoffset: 0, duration: 1.25, ease: "power2.out" },
        1.17,
      );

      // Arrow Label ("BẺ HƯỚNG CHÚ Ý") pop at crowd bend
      tl.fromTo(
        "#arrow-label",
        { scale: 0.6, opacity: 0, y: 15 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        1.75,
      );

      // Arrowhead drawn continuously at cashier counter
      tl.to(
        "#arrow-head",
        { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" },
        2.42,
      );

      // Overlay 2: productCard appears at 45320ms (relative t = 2.81s)
      // "Thẻ sản phẩm không xuất hiện trước 45320ms"
      tl.fromTo(
        "#product-card",
        { scale: 0, opacity: 0, y: 30 },
        { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        2.81,
      );

      // Overlay 3: endpoint target ring lock-on at 47220ms (relative t = 4.71s)
      // "Đầu mũi tên khóa vào thẻ sản phẩm bằng một vòng cam co giãn nhẹ"
      tl.fromTo(
        "#target-reticle",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        4.71,
      );

      // Settle pulse feedback on product card shadow
      tl.to(
        "#product-card",
        {
          boxShadow: "12px 12px 0px #FF6A1A",
          duration: 0.25,
          ease: "power2.out",
        },
        4.85,
      );

      // 3. Register Timeline directly with root composition ID
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
