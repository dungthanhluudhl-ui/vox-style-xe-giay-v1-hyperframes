<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>S01 - Phương Pháp Khác</title>
    <!-- Google Fonts: Be Vietnam Pro 700 & 900 theo đúng quy định font của Vox DNA -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #E7E3D9;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Nền giấy ngà + Lưới ô vuông 84px chuẩn Vox DNA */
      .grid-layer {
        position: absolute;
        inset: 0;
        background-color: #E7E3D9;
        background-image:
          linear-gradient(to right, rgba(20, 20, 20, 0.28) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.28) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }

      /* Lớp grain (hạt nhiễu) 18% blend multiply tạo chất liệu báo giấy */
      .grain-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.18;
        mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Chữ ký thị giác: thanh cam cố định mép đáy khung hình */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 14px;
        background-color: #FF6A1A;
        z-index: 999;
      }

      /* Shot 1 - Container chuyển động zoom-out */
      #shot1-content {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 540px 810px;
      }

      /* Badge trung tâm định vị chủ đề */
      .center-badge-wrap {
        position: absolute;
        left: 540px;
        top: 810px;
        transform: translate(-50%, -50%);
        z-index: 20;
      }
      .center-badge {
        background: #141414;
        color: #F7F4EC;
        border: 3px solid #141414;
        box-shadow: 8px 8px 0px #FF6A1A;
        border-radius: 12px;
        padding: 24px 38px;
        text-align: center;
        min-width: 480px;
      }
      .center-badge .badge-sub {
        font-size: 22px;
        font-weight: 900;
        color: #FF6A1A;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .center-badge .badge-title {
        font-size: 46px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: 1px;
        margin: 0;
      }
      .center-badge .badge-tag {
        display: inline-block;
        margin-top: 10px;
        background-color: #F5F0E4;
        color: #141414;
        font-size: 18px;
        font-weight: 900;
        padding: 4px 14px;
        border-radius: 4px;
        letter-spacing: 1.5px;
      }

      /* Đường kết nối dạng biểu đồ nối từ tâm ra 4 chip */
      .connectors-svg {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
        z-index: 10;
      }
      .connector-line {
        stroke: rgba(20, 20, 20, 0.45);
        stroke-width: 3px;
        stroke-dasharray: 8 8;
        fill: none;
      }

      /* Thẻ chip phương pháp bán hàng (phong cách giấy cắt dán) */
      .paper-chip {
        position: absolute;
        z-index: 30;
      }
      .chip-card {
        display: flex;
        align-items: center;
        gap: 20px;
        background: #F5F0E4;
        border: 3px solid #141414;
        box-shadow: 6px 6px 0px #141414;
        border-radius: 12px;
        padding: 18px 28px;
        transform-origin: 50% 50%;
      }
      .chip-icon-box {
        width: 58px;
        height: 58px;
        border-radius: 8px;
        background-color: #141414;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .chip-icon-box svg {
        width: 36px;
        height: 36px;
      }
      .chip-text {
        font-size: 38px;
        font-weight: 900;
        color: #141414;
        letter-spacing: 1.5px;
        white-space: nowrap;
      }

      /* Tọa độ 4 chip giữ trọn trong safe-zone (Y: 160-1460, X: 40-1040) */
      #chip-1 {
        left: 80px;
        top: 470px;
      }
      #chip-2 {
        right: 80px;
        top: 550px;
      }
      #chip-3 {
        left: 80px;
        top: 1040px;
      }
      #chip-4 {
        right: 80px;
        top: 1120px;
      }

      /* Vệt quét cam (orange wipe) quét sạch 4 chip sang 2 mép khung */
      #wipe-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 380px;
        background: linear-gradient(90deg, rgba(255, 106, 26, 0) 0%, #FF6A1A 30%, #FF6A1A 70%, rgba(255, 106, 26, 0) 100%);
        opacity: 0;
        pointer-events: none;
        z-index: 45;
      }

      /* Video shot 2 */
      #shot2-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 50;
      }

      /* Lớp phủ cho shot 2: Vignette giấy tối nhẹ để tôn nổi punch phrase */
      #shot2-overlay {
        z-index: 60;
        pointer-events: none;
      }
      .vignette-layer {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 45%, rgba(20, 20, 20, 0.15) 0%, rgba(20, 20, 20, 0.72) 75%, rgba(20, 20, 20, 0.9) 100%);
      }

      /* Punch Phrase: "MỘT CÁCH KHÁC" */
      .punch-container {
        position: absolute;
        left: 70px;
        right: 70px;
        bottom: 520px;
        text-align: center;
        z-index: 70;
        pointer-events: auto;
      }
      .punch-box {
        display: inline-block;
        background-color: rgba(20, 20, 20, 0.94);
        border: 4px solid #FF6A1A;
        box-shadow: 8px 8px 0px #FF6A1A;
        border-radius: 16px;
        padding: 30px 46px;
        width: 100%;
        box-sizing: border-box;
      }
      .punch-label {
        font-size: 24px;
        font-weight: 900;
        color: #FF6A1A;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .punch-title {
        font-size: 72px;
        font-weight: 900;
        line-height: 1.34;
        color: #F7F4EC;
        letter-spacing: 2.5px;
        margin: 0;
        text-transform: uppercase;
      }
      .punch-accent-bar {
        width: 100%;
        height: 6px;
        background-color: #FF6A1A;
        margin-top: 16px;
        border-radius: 3px;
        transform-origin: center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="10.68"
      data-layout-allow-overflow="true"
    >
      <!-- SHOT 1 (0.00s -> 7.17s): 4 chip bán hàng xuất hiện rồi bị quét bay -->
      <section id="shot1" class="clip" data-start="0" data-duration="7.17" data-layout-allow-overflow="true">
        <!-- Lớp nền giấy lưới hạt mực -->
        <div class="grid-layer"></div>
        <div class="grain-overlay"></div>

        <div id="shot1-content" data-layout-allow-overflow="true">
          <!-- Đường line kết nối dạng sơ đồ minh hoạ (annotated diagram) -->
          <svg class="connectors-svg" viewBox="0 0 1080 1920">
            <!-- Nối từ tâm tới chip 1 -->
            <path id="conn-1" class="connector-line" d="M 420 740 L 260 560" />
            <!-- Nối từ tâm tới chip 2 -->
            <path id="conn-2" class="connector-line" d="M 660 760 L 800 640" />
            <!-- Nối từ tâm tới chip 3 -->
            <path id="conn-3" class="connector-line" d="M 420 880 L 260 1050" />
            <!-- Nối từ tâm tới chip 4 -->
            <path id="conn-4" class="connector-line" d="M 660 880 L 800 1130" />
          </svg>

          <!-- Khối định vị chủ đề trung tâm -->
          <div class="center-badge-wrap" data-layout-allow-overflow="true">
            <div id="center-badge" class="center-badge">
              <div class="badge-sub">MÔ HÌNH QUEN THUỘC</div>
              <h1 class="badge-title">BÁN HÀNG TRÊN MẠNG</h1>
              <div class="badge-tag">4 PHƯƠNG ÁN</div>
            </div>
          </div>

          <!-- Chip 1: Trả phí (chạy quảng cáo) - atMs: 2870 -->
          <div id="chip-1" class="paper-chip" data-layout-allow-overflow="true">
            <div id="chip-1-card" class="chip-card">
              <div class="chip-icon-box">
                <!-- Icon: money (tiền tệ / quảng cáo trả phí) -->
                <svg viewBox="0 0 48 48" fill="none">
                  <rect x="6" y="11" width="36" height="26" rx="4" stroke="#FF6A1A" stroke-width="3.5" />
                  <circle cx="24" cy="24" r="6" stroke="#FF6A1A" stroke-width="3.5" />
                  <path d="M 12 24 L 14 24 M 34 24 L 36 24" stroke="#FF6A1A" stroke-width="3.5" stroke-linecap="round" />
                </svg>
              </div>
              <div class="chip-text">TRẢ PHÍ</div>
            </div>
          </div>

          <!-- Chip 2: Gương mặt (thuê KOL) - atMs: 3900 -->
          <div id="chip-2" class="paper-chip" data-layout-allow-overflow="true">
            <div id="chip-2-card" class="chip-card">
              <div class="chip-icon-box">
                <!-- Icon: person (gương mặt đại diện / KOL) -->
                <svg viewBox="0 0 48 48" fill="none">
                  <circle cx="24" cy="15" r="7" stroke="#FF6A1A" stroke-width="3.5" />
                  <path d="M 10 39 C 10 30 16 27 24 27 C 32 27 38 30 38 39" stroke="#FF6A1A" stroke-width="3.5" stroke-linecap="round" />
                </svg>
              </div>
              <div class="chip-text">GƯƠNG MẶT</div>
            </div>
          </div>

          <!-- Chip 3: Phát trực tiếp (livestream) - atMs: 4850 -->
          <div id="chip-3" class="paper-chip" data-layout-allow-overflow="true">
            <div id="chip-3-card" class="chip-card">
              <div class="chip-icon-box">
                <!-- Icon: phone (điện thoại phát trực tiếp sóng phát) -->
                <svg viewBox="0 0 48 48" fill="none">
                  <rect x="14" y="7" width="20" height="34" rx="4" stroke="#FF6A1A" stroke-width="3.5" />
                  <circle cx="24" cy="35" r="2" fill="#FF6A1A" />
                  <path d="M 37 18 C 39 20 40 23 40 25 C 40 27 39 30 37 32" stroke="#FF6A1A" stroke-width="3" stroke-linecap="round" />
                  <path d="M 11 18 C 9 20 8 23 8 25 C 8 27 9 30 11 32" stroke="#FF6A1A" stroke-width="3" stroke-linecap="round" />
                </svg>
              </div>
              <div class="chip-text">PHÁT TRỰC TIẾP</div>
            </div>
          </div>

          <!-- Chip 4: −30% (giảm giá sâu) - atMs: 5500 -->
          <div id="chip-4" class="paper-chip" data-layout-allow-overflow="true">
            <div id="chip-4-card" class="chip-card">
              <div class="chip-icon-box">
                <!-- Icon: fall (mũi tên giảm giá lao dốc) -->
                <svg viewBox="0 0 48 48" fill="none">
                  <path d="M 8 16 L 22 30 L 30 22 L 40 32" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                  <polyline points="28,32 40,32 40,20" stroke="#FF6A1A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </div>
              <div class="chip-text">−30%</div>
            </div>
          </div>

          <!-- Nét quét cam đẩy các chip bay ra ngoài ở cuối shot 1 -->
          <div id="wipe-bar" data-layout-allow-overflow="true"></div>
        </div>
      </section>

      <!-- SHOT 2 (7.17s -> 10.68s): Video đối tượng gõ laptop & dàn điện thoại -->
      <video
        id="shot2-video"
        class="clip"
        data-start="7.17"
        data-duration="3.51"
        data-media-start="2.245"
        src="assets/vid-02-cyber-scammer-suspect-profile.mp4"
        muted
        playsinline
      ></video>

      <!-- Lớp đồ họa phủ của Shot 2: Vignette + Punch Phrase -->
      <section id="shot2-overlay" class="clip" data-start="7.17" data-duration="3.51">
        <div class="vignette-layer"></div>
        <div class="grain-overlay"></div>

        <!-- Punch phrase: "MỘT CÁCH KHÁC" (atMs: 8120, giữ 2560ms đến hết cảnh) -->
        <div class="punch-container">
          <div id="punch-card" class="punch-box">
            <div class="punch-label">CHIẾN THUẬT NGẦM</div>
            <h1 class="punch-title">MỘT CÁCH KHÁC</h1>
            <div id="punch-accent" class="punch-accent-bar"></div>
          </div>
        </div>
      </section>

      <!-- Dải màu cam thương hiệu luôn cố định ở mép dưới -->
      <div class="bottom-brand-bar"></div>
    </div>

    <script>
      // Khởi tạo GSAP Timeline duy nhất ở trạng thái paused theo đúng composition contract
      const tl = gsap.timeline({ paused: true });

      // ==========================================
      // GIAI ĐOẠN 1: SHOT 1 (0.00s -> 7.17s)
      // ==========================================

      // Camera motion: Zoom-out nhẹ toàn shot 1 từ 1.08 về 1.00
      tl.fromTo(
        "#shot1-content",
        { scale: 1.08 },
        { scale: 1.0, duration: 6.72, ease: "none" },
        0
      );

      // 0.30s: Khối chủ đề "BÁN HÀNG TRÊN MẠNG" hạ cánh mượt mà
      tl.fromTo(
        "#center-badge",
        { scale: 0, opacity: 0, y: 36 },
        { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.3
      );

      // 2.87s (atMs: 2870): Chip 1 "TRẢ PHÍ" xuất hiện
      tl.fromTo(
        "#chip-1",
        { scale: 0, opacity: 0, y: 24, rotation: -6 },
        { scale: 1, opacity: 1, y: 0, rotation: -2, duration: 0.5, ease: "power3.out" },
        2.87
      );
      tl.fromTo(
        "#conn-1",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        2.95
      );
      // Nhịp bob nhẹ sau khi vào (lệch pha)
      tl.to(
        "#chip-1-card",
        { y: -6, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 },
        3.45
      );

      // 3.90s (atMs: 3900): Chip 2 "GƯƠNG MẶT" xuất hiện
      tl.fromTo(
        "#chip-2",
        { scale: 0, opacity: 0, y: 24, rotation: 6 },
        { scale: 1, opacity: 1, y: 0, rotation: 2, duration: 0.5, ease: "power3.out" },
        3.90
      );
      tl.fromTo(
        "#conn-2",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        3.98
      );
      tl.to(
        "#chip-2-card",
        { y: 6, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 1 },
        4.45
      );

      // 4.85s (atMs: 4850): Chip 3 "PHÁT TRỰC TIẾP" xuất hiện
      tl.fromTo(
        "#chip-3",
        { scale: 0, opacity: 0, y: 24, rotation: -4 },
        { scale: 1, opacity: 1, y: 0, rotation: -1.5, duration: 0.45, ease: "power3.out" },
        4.85
      );
      tl.fromTo(
        "#conn-3",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        4.92
      );
      tl.to(
        "#chip-3-card",
        { y: -5, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 0 },
        5.40
      );

      // 5.50s (atMs: 5500): Chip 4 "−30%" xuất hiện
      tl.fromTo(
        "#chip-4",
        { scale: 0, opacity: 0, y: 24, rotation: 5 },
        { scale: 1, opacity: 1, y: 0, rotation: 1.5, duration: 0.45, ease: "power3.out" },
        5.50
      );
      tl.fromTo(
        "#conn-4",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        5.57
      );

      // 6.72s (atMs: 6720): Nét quét cam (wipe) tràn qua, hất văng 4 chip ra hai mép khung
      tl.fromTo(
        "#wipe-bar",
        { x: -450, opacity: 0.95 },
        { x: 1250, opacity: 0.95, duration: 0.45, ease: "power2.inOut" },
        6.72
      );
      // Hai chip bên trái văng mạnh sang trái
      tl.to(
        "#chip-1, #chip-3",
        { x: -800, rotation: -18, opacity: 0, duration: 0.42, ease: "power3.in" },
        6.72
      );
      // Hai chip bên phải văng mạnh sang phải
      tl.to(
        "#chip-2, #chip-4",
        { x: 800, rotation: 18, opacity: 0, duration: 0.42, ease: "power3.in" },
        6.72
      );
      // Badge và line tan biến
      tl.to(
        "#center-badge",
        { scale: 0.8, opacity: 0, duration: 0.35, ease: "power2.in" },
        6.72
      );
      tl.to(
        ".connector-line",
        { opacity: 0, duration: 0.2 },
        6.72
      );

      // ==========================================
      // GIAI ĐOẠN 2: SHOT 2 (7.17s -> 10.68s)
      // ==========================================

      // Video tự động phát từ data-start="7.17". 
      // Camera parallax nhẹ: Zoom rất chậm từ 1.00 lên 1.05 trên video
      tl.fromTo(
        "#shot2-video",
        { scale: 1.0 },
        { scale: 1.05, duration: 3.51, ease: "sine.out" },
        7.17
      );

      // Lớp overlay mờ dần vào (dissolve transition)
      tl.fromTo(
        "#shot2-overlay",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        7.17
      );

      // 8.12s (atMs: 8120): Punch Phrase "MỘT CÁCH KHÁC" xuất hiện uy lực
      tl.fromTo(
        "#punch-card",
        { scale: 0.84, opacity: 0, y: 50 },
        { scale: 1.0, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        8.12
      );
      tl.fromTo(
        "#punch-accent",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power2.out" },
        8.35
      );

      // Đăng ký timeline cho HyperFrames runtime seek
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
