<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>S04 — Tên tự đặt</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #f5f0e4;
        --paper-deep: #e7e3d9;
        --ink: #141414;
        --orange: #ff6a1a;
        --cream: #f7f4ec;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "Be Vietnam Pro", sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
      }

      .clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .scene-surface {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background:
          linear-gradient(92deg, rgba(20, 20, 20, 0.025), transparent 24%, rgba(20, 20, 20, 0.018) 72%, transparent),
          var(--paper);
        perspective: 1400px;
      }

      .scene-surface::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.18;
        mix-blend-mode: multiply;
        background-image:
          radial-gradient(circle at 18% 24%, rgba(20, 20, 20, 0.28) 0 0.7px, transparent 0.9px),
          radial-gradient(circle at 72% 66%, rgba(20, 20, 20, 0.22) 0 0.65px, transparent 0.85px),
          radial-gradient(circle at 42% 86%, rgba(20, 20, 20, 0.18) 0 0.55px, transparent 0.8px);
        background-size: 13px 17px, 19px 23px, 11px 29px;
      }

      .editorial-kicker {
        position: absolute;
        top: 184px;
        left: 70px;
        margin: 0;
        color: var(--ink);
        font-size: 27px;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .editorial-kicker::before {
        content: "";
        display: inline-block;
        width: 42px;
        height: 8px;
        margin-right: 15px;
        vertical-align: 4px;
        background: var(--orange);
      }

      .punch-wrap {
        position: absolute;
        top: 270px;
        left: 70px;
        width: 940px;
        min-height: 168px;
        display: flex;
        align-items: center;
      }

      .punch {
        display: block;
        margin: 0;
        color: var(--ink);
        font-size: 82px;
        font-weight: 900;
        line-height: 1.08;
        letter-spacing: -0.045em;
      }

      .punch-highlight {
        position: relative;
        display: inline-block;
        z-index: 1;
      }

      .punch-highlight::after {
        content: "";
        position: absolute;
        z-index: -1;
        right: -9px;
        bottom: 4px;
        left: -7px;
        height: 22px;
        background: var(--orange);
      }

      .comparison {
        position: absolute;
        top: 570px;
        left: 0;
        width: 1080px;
        height: 720px;
      }

      .paper-card {
        position: absolute;
        top: 40px;
        width: 380px;
        height: 540px;
        border: 5px solid var(--ink);
        background: var(--cream);
        box-shadow: 14px 14px 0 var(--ink);
        transform-style: preserve-3d;
        backface-visibility: hidden;
      }

      .paper-card::before {
        content: "";
        position: absolute;
        top: 29px;
        left: 29px;
        width: 68px;
        height: 10px;
        background: var(--orange);
      }

      .card-left {
        left: 55px;
      }

      .card-right {
        right: 55px;
      }

      .card-inner {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 60px 36px 48px;
      }

      .card-index {
        position: absolute;
        top: 27px;
        right: 30px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0.12em;
      }

      .card-title {
        margin: 0;
        color: var(--ink);
        font-size: 76px;
        font-weight: 900;
        line-height: 1.08;
        letter-spacing: -0.05em;
        text-align: center;
      }

      .card-right .card-title {
        font-size: 56px;
        line-height: 1.13;
      }

      .card-caption {
        position: absolute;
        right: 30px;
        bottom: 28px;
        left: 30px;
        margin: 0;
        border-top: 3px solid var(--ink);
        padding-top: 15px;
        color: var(--ink);
        font-size: 23px;
        font-weight: 900;
        letter-spacing: 0.055em;
        text-align: center;
        text-transform: uppercase;
      }

      .stamp {
        position: absolute;
        z-index: 5;
        top: 400px;
        left: 88px;
        width: 314px;
        min-height: 86px;
        display: grid;
        place-items: center;
        border: 6px double var(--orange);
        padding: 12px 16px;
        background: var(--ink);
        color: var(--cream);
        font-size: 25px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: 0.07em;
        text-align: center;
        text-transform: uppercase;
        transform-origin: 50% 50%;
      }

      .connector {
        position: absolute;
        z-index: 4;
        top: 228px;
        left: 430px;
        width: 220px;
        height: 140px;
        overflow: visible;
      }

      .connector-path {
        fill: none;
        stroke: var(--orange);
        stroke-width: 13;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }

      .break-mark {
        fill: none;
        stroke: var(--ink);
        stroke-width: 8;
        stroke-linecap: square;
      }

      .mismatch-label {
        position: absolute;
        z-index: 6;
        top: 386px;
        left: 420px;
        width: 240px;
        margin: 0;
        padding: 11px 15px;
        border: 3px solid var(--ink);
        background: var(--paper);
        color: var(--ink);
        font-size: 21px;
        font-weight: 900;
        letter-spacing: 0.045em;
        line-height: 1.2;
        text-align: center;
        text-transform: uppercase;
      }

      .footnote {
        position: absolute;
        top: 1330px;
        left: 90px;
        width: 900px;
        margin: 0;
        border-left: 12px solid var(--orange);
        padding: 24px 0 24px 28px;
        color: var(--ink);
        font-size: 34px;
        font-weight: 700;
        line-height: 1.42;
      }

      .bottom-signature {
        position: absolute;
        z-index: 20;
        right: 0;
        bottom: 0;
        left: 0;
        height: 18px;
        background: var(--orange);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6.44"
      data-fps="30"
    >
      <section
        id="s04-scene"
        class="clip"
        data-start="0"
        data-duration="6.44"
        data-track-index="0"
      >
        <div class="scene-surface">
          <p id="s04-kicker" class="editorial-kicker">Quy ước trong câu chuyện</p>

          <div id="s04-punch-wrap" class="punch-wrap">
            <h1 id="s04-punch" class="punch">
              TÊN <span class="punch-highlight">TỰ ĐẶT</span>
            </h1>
          </div>

          <div class="comparison" aria-label="So sánh tên kể chuyện và hồ sơ gốc">
            <article id="s04-card-left" class="paper-card card-left">
              <div class="card-inner">
                <span class="card-index">01</span>
                <h2 class="card-title">TIẾN</h2>
                <p class="card-caption">Dùng để theo dõi</p>
              </div>
            </article>

            <div id="s04-stamp" class="stamp">Nhãn kể chuyện</div>

            <svg
              id="s04-connector"
              class="connector"
              viewBox="0 0 220 140"
              aria-label="Đường nối bị ngắt"
            >
              <path id="s04-line-a" class="connector-path" d="M 4 70 H 82" />
              <path id="s04-line-b" class="connector-path" d="M 138 70 H 202" />
              <path id="s04-arrow" class="connector-path" d="M 184 48 L 208 70 L 184 92" />
              <path id="s04-break-a" class="break-mark" d="M 94 42 L 112 96" />
              <path id="s04-break-b" class="break-mark" d="M 113 42 L 131 96" />
            </svg>

            <p id="s04-mismatch" class="mismatch-label">Không đồng nhất</p>

            <article id="s04-card-right" class="paper-card card-right">
              <div class="card-inner">
                <span class="card-index">02</span>
                <h2 class="card-title">HỒ SƠ GỐC</h2>
                <p class="card-caption">Tên được công bố</p>
              </div>
            </article>
          </div>

          <p id="s04-footnote" class="footnote">
            Một nhãn để kể chuyện không thay thế danh tính trong bản án.
          </p>
        </div>
      </section>

      <div class="bottom-signature" aria-hidden="true"></div>
    </div>

    <script>
      const tl = gsap.timeline({
        paused: true,
        defaults: {
          ease: "power3.out"
        }
      });

      const drawPaths = [
        document.getElementById("s04-line-a"),
        document.getElementById("s04-line-b"),
        document.getElementById("s04-arrow"),
        document.getElementById("s04-break-a"),
        document.getElementById("s04-break-b")
      ];

      drawPaths.forEach(function (path) {
        const length = path.getTotalLength();
        path.style.strokeDasharray = String(length);
        path.style.strokeDashoffset = String(length);
      });

      tl.fromTo(
        "#s04-kicker",
        { opacity: 0, x: -34 },
        { opacity: 1, x: 0, duration: 0.46 },
        0.08
      );

      tl.fromTo(
        "#s04-card-left",
        { opacity: 0, rotationY: -92, x: -38, transformOrigin: "0% 50%" },
        {
          opacity: 1,
          rotationY: 0,
          x: 0,
          transformOrigin: "0% 50%",
          duration: 0.76,
          ease: "power4.out"
        },
        0.26
      );

      tl.fromTo(
        "#s04-punch",
        { opacity: 0, rotationX: -78, y: 34, transformOrigin: "50% 100%" },
        {
          opacity: 1,
          rotationX: 0,
          y: 0,
          transformOrigin: "50% 100%",
          duration: 0.62,
          ease: "power4.out"
        },
        0.91
      );

      tl.fromTo(
        "#s04-stamp",
        { opacity: 0, scale: 1.32, rotation: -11, y: -34 },
        {
          opacity: 1,
          scale: 1,
          rotation: -4,
          y: 0,
          duration: 0.48,
          ease: "power3.out"
        },
        1.32
      );

      tl.fromTo(
        "#s04-footnote",
        { opacity: 0, x: -28 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" },
        2.55
      );

      tl.to(
        "#s04-punch",
        { opacity: 0, y: -18, duration: 0.34, ease: "power2.in" },
        3.72
      );

      tl.fromTo(
        "#s04-card-right",
        { opacity: 0, rotationY: 92, x: 38, transformOrigin: "100% 50%" },
        {
          opacity: 1,
          rotationY: 0,
          x: 0,
          transformOrigin: "100% 50%",
          duration: 0.7,
          ease: "power4.out"
        },
        3.98
      );

      tl.to(
        "#s04-line-a",
        { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" },
        4.14
      );

      tl.to(
        "#s04-line-b",
        { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" },
        4.35
      );

      tl.to(
        "#s04-arrow",
        { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" },
        4.56
      );

      tl.to(
        ["#s04-break-a", "#s04-break-b"],
        {
          strokeDashoffset: 0,
          duration: 0.22,
          stagger: 0.07,
          ease: "power2.out"
        },
        4.62
      );

      tl.fromTo(
        "#s04-mismatch",
        { opacity: 0, scale: 0.82, y: 14 },
        {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.42,
          ease: "power3.out"
        },
        4.8
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
