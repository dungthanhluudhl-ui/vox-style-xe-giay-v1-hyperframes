<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>S01 — Một cách khác</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

    <style>
      :root {
        --paper: #e7e3d9;
        --card: #f5f0e4;
        --ink: #141414;
        --orange: #ff6a1a;
        --cream: #f7f4ec;
        --grid-line: rgba(20, 20, 20, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "Be Vietnam Pro", sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
      }

      .clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .paper-background {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background-color: var(--paper);
        background-image:
          linear-gradient(to right, var(--grid-line) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, var(--grid-line) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }

      .paper-background::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.18;
        mix-blend-mode: multiply;
        background-image:
          radial-gradient(circle at 12% 18%, rgba(20, 20, 20, 0.18) 0 1px, transparent 1.5px),
          radial-gradient(circle at 72% 33%, rgba(20, 20, 20, 0.13) 0 1px, transparent 1.5px),
          radial-gradient(circle at 44% 77%, rgba(20, 20, 20, 0.16) 0 1px, transparent 1.5px);
        background-size: 13px 17px, 19px 23px, 29px 31px;
      }

      .opening-scene {
        z-index: 10;
        overflow: hidden;
      }

      .opening-camera {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform-origin: 50% 48%;
        will-change: transform;
      }

      .opening-heading {
        position: absolute;
        top: 198px;
        left: 72px;
        width: 936px;
        margin: 0;
        text-align: center;
        font-size: 76px;
        font-weight: 900;
        line-height: 1.16;
        letter-spacing: -2.2px;
      }

      .opening-heading .accent-block {
        display: inline-block;
        margin-top: 18px;
        padding: 6px 20px 10px;
        background: var(--ink);
        color: var(--cream);
      }

      .center-mark {
        position: absolute;
        left: 50%;
        top: 840px;
        width: 188px;
        height: 188px;
        margin-left: -94px;
        margin-top: -94px;
        display: grid;
        place-items: center;
        border: 8px solid var(--ink);
        border-radius: 50%;
        background: var(--orange);
        color: var(--ink);
        font-size: 92px;
        font-weight: 900;
        line-height: 1;
        box-shadow: 14px 14px 0 var(--ink);
      }

      .chip {
        position: absolute;
        min-height: 184px;
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 26px 32px;
        border: 6px solid var(--ink);
        background: var(--card);
        box-shadow: 12px 12px 0 var(--orange);
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .chip-icon {
        flex: 0 0 106px;
        width: 106px;
        height: 106px;
        display: block;
      }

      .chip-icon path,
      .chip-icon line,
      .chip-icon circle,
      .chip-icon rect,
      .chip-icon polyline {
        fill: none;
        stroke: var(--ink);
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .chip-text {
        display: block;
        font-size: 42px;
        font-weight: 900;
        line-height: 1.08;
        letter-spacing: -1px;
        white-space: nowrap;
      }

      #chip-paid {
        top: 500px;
        left: 74px;
      }

      #chip-face {
        top: 500px;
        right: 68px;
      }

      #chip-live {
        top: 1032px;
        left: 58px;
      }

      #chip-discount {
        top: 1032px;
        right: 80px;
      }

      .common-label {
        position: absolute;
        left: 50%;
        bottom: 224px;
        width: 720px;
        margin-left: -360px;
        padding: 18px 30px;
        border: 5px solid var(--ink);
        background: var(--orange);
        color: var(--ink);
        text-align: center;
        font-size: 35px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: 1.4px;
      }

      .video-clip {
        z-index: 20;
        display: block;
        object-fit: cover;
        object-position: 50% 42%;
        background: var(--ink);
        will-change: transform, opacity;
      }

      .video-treatment {
        z-index: 22;
        pointer-events: none;
        overflow: hidden;
      }

      .video-treatment::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 50% 42%,
            rgba(20, 20, 20, 0) 32%,
            rgba(20, 20, 20, 0.18) 76%,
            rgba(20, 20, 20, 0.42) 100%
          );
      }

      .video-treatment::after {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.12;
        mix-blend-mode: multiply;
        background-image:
          radial-gradient(circle at 16% 24%, rgba(247, 244, 236, 0.7) 0 1px, transparent 1.4px),
          radial-gradient(circle at 78% 66%, rgba(20, 20, 20, 0.42) 0 1px, transparent 1.5px);
        background-size: 17px 19px, 23px 29px;
      }

      .transition-wipe {
        z-index: 30;
        overflow: hidden;
        pointer-events: none;
      }

      .wipe-stroke {
        position: absolute;
        top: 0;
        left: -340px;
        width: 340px;
        height: 100%;
        background: var(--orange);
        box-shadow:
          -28px 0 0 rgba(255, 106, 26, 0.34),
          28px 0 0 rgba(255, 106, 26, 0.58);
        transform-origin: 50% 50%;
        will-change: transform;
      }

      .punch-clip {
        z-index: 40;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: 0 52px 470px;
        pointer-events: none;
      }

      .punch-phrase {
        position: relative;
        width: 100%;
        padding: 28px 34px 34px;
        border: 7px solid var(--cream);
        background: var(--orange);
        color: var(--ink);
        box-shadow: 15px 15px 0 var(--ink);
        text-align: center;
        font-size: 76px;
        font-weight: 900;
        line-height: 1.08;
        letter-spacing: -2.6px;
        transform-origin: 50% 100%;
        will-change: transform, opacity;
      }

      .punch-phrase::before {
        content: "KHÔNG THEO LỐI CŨ";
        position: absolute;
        top: -54px;
        left: 24px;
        padding: 9px 17px;
        background: var(--ink);
        color: var(--cream);
        font-size: 24px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 1px;
        transform: rotate(-2deg);
      }

      .bottom-brand-bar {
        position: absolute;
        z-index: 100;
        left: 0;
        right: 0;
        bottom: 0;
        height: 24px;
        background: var(--orange);
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="10.68"
      data-fps="30"
    >
      <div class="paper-background" aria-hidden="true"></div>

      <section
        id="opening-scene"
        class="clip opening-scene"
        data-start="0"
        data-duration="7.17"
        data-track-index="1"
        data-layout-allow-overflow="true"
      >
        <div id="opening-camera" class="opening-camera">
          <h1 id="opening-heading" class="opening-heading">
            MUỐN BÁN HÀNG
            <span class="accent-block">TRÊN MẠNG?</span>
          </h1>

          <div id="center-mark" class="center-mark" aria-hidden="true">?</div>

          <article
            id="chip-paid"
            class="chip"
            data-layout-allow-overflow="true"
          >
            <svg class="chip-icon" viewBox="0 0 120 120" aria-hidden="true">
              <circle cx="60" cy="60" r="43"></circle>
              <path d="M73 40c-7-6-27-7-30 5-4 15 33 9 31 27-2 15-25 14-34 5"></path>
              <line x1="60" y1="28" x2="60" y2="91"></line>
            </svg>
            <span class="chip-text">TRẢ PHÍ</span>
          </article>

          <article
            id="chip-face"
            class="chip"
            data-layout-allow-overflow="true"
          >
            <svg class="chip-icon" viewBox="0 0 120 120" aria-hidden="true">
              <circle cx="60" cy="39" r="20"></circle>
              <path d="M24 99c4-24 17-34 36-34s32 10 36 34"></path>
              <path d="M38 27c7-15 38-18 45 3"></path>
            </svg>
            <span class="chip-text">GƯƠNG MẶT</span>
          </article>

          <article
            id="chip-live"
            class="chip"
            data-layout-allow-overflow="true"
          >
            <svg class="chip-icon" viewBox="0 0 120 120" aria-hidden="true">
              <rect x="32" y="12" width="56" height="96" rx="8"></rect>
              <circle cx="60" cy="92" r="3"></circle>
              <path d="M52 43l24 14-24 14z"></path>
              <path d="M20 39c-9 13-9 29 0 42"></path>
              <path d="M100 39c9 13 9 29 0 42"></path>
            </svg>
            <span class="chip-text">PHÁT TRỰC TIẾP</span>
          </article>

          <article
            id="chip-discount"
            class="chip"
            data-layout-allow-overflow="true"
          >
            <svg class="chip-icon" viewBox="0 0 120 120" aria-hidden="true">
              <polyline points="20,30 48,58 66,44 98,79"></polyline>
              <polyline points="78,79 98,79 98,59"></polyline>
              <line x1="28" y1="94" x2="92" y2="94"></line>
            </svg>
            <span class="chip-text">−30%</span>
          </article>

          <div id="common-label" class="common-label">BỐN LỐI ĐI QUEN THUỘC</div>
        </div>
      </section>

      <video
        id="suspect-video"
        class="clip video-clip"
        data-start="7.17"
        data-duration="3.51"
        data-media-start="2.245"
        data-track-index="2"
        src="assets/vid-02-cyber-scammer-suspect-profile.mp4"
        muted
        playsinline
        preload="auto"
      ></video>

      <div
        id="video-treatment"
        class="clip video-treatment"
        data-start="7.17"
        data-duration="3.51"
        data-track-index="3"
        aria-hidden="true"
      ></div>

      <div
        id="transition-wipe"
        class="clip transition-wipe"
        data-start="6.72"
        data-duration="0.45"
        data-track-index="4"
        data-layout-allow-overflow="true"
        aria-hidden="true"
      >
        <div id="wipe-stroke" class="wipe-stroke"></div>
      </div>

      <section
        id="punch-clip"
        class="clip punch-clip"
        data-start="8.12"
        data-duration="2.56"
        data-track-index="5"
      >
        <div id="punch-phrase" class="punch-phrase">MỘT CÁCH KHÁC</div>
      </section>

      <div class="bottom-brand-bar" aria-hidden="true"></div>
    </div>

    <script>
      const tl = gsap.timeline({
        paused: true,
        defaults: {
          ease: "power3.out"
        }
      });

      const drawableShapes = document.querySelectorAll(
        ".chip-icon path, .chip-icon line, .chip-icon circle, .chip-icon rect, .chip-icon polyline"
      );

      drawableShapes.forEach(function (shape) {
        const length = shape.getTotalLength();
        shape.style.strokeDasharray = String(length);
        shape.style.strokeDashoffset = String(length);
      });

      tl.fromTo(
        "#opening-camera",
        { scale: 1.16 },
        { scale: 1, duration: 6.55, ease: "sine.out" },
        0
      );

      tl.fromTo(
        "#opening-heading",
        { scale: 1.34, opacity: 0, y: -42 },
        { scale: 1, opacity: 1, y: 0, duration: 0.72, ease: "expo.out" },
        0.08
      );

      tl.fromTo(
        "#center-mark",
        { scale: 0, opacity: 0, rotation: -18 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.58, ease: "power4.out" },
        1.2
      );

      tl.fromTo(
        "#common-label",
        { scaleX: 0, opacity: 0 },
        {
          scaleX: 1,
          opacity: 1,
          transformOrigin: "50% 50%",
          duration: 0.46,
          ease: "power3.out"
        },
        2.08
      );

      tl.fromTo(
        "#chip-paid",
        { x: -170, y: 34, scale: 0.76, opacity: 0, rotation: -8 },
        { x: 0, y: 0, scale: 1, opacity: 1, rotation: -2, duration: 0.52 },
        2.87
      );

      tl.to(
        "#chip-paid .chip-icon path, #chip-paid .chip-icon line, #chip-paid .chip-icon circle",
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        2.94
      );

      tl.fromTo(
        "#chip-face",
        { x: 170, y: 20, scale: 0.76, opacity: 0, rotation: 8 },
        { x: 0, y: 0, scale: 1, opacity: 1, rotation: 2, duration: 0.52 },
        3.9
      );

      tl.to(
        "#chip-face .chip-icon path, #chip-face .chip-icon circle",
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
        3.97
      );

      tl.fromTo(
        "#chip-live",
        { x: -190, y: 38, scale: 0.76, opacity: 0, rotation: -6 },
        { x: 0, y: 0, scale: 1, opacity: 1, rotation: 1.5, duration: 0.5 },
        4.85
      );

      tl.to(
        "#chip-live .chip-icon path, #chip-live .chip-icon line, #chip-live .chip-icon circle, #chip-live .chip-icon rect",
        { strokeDashoffset: 0, duration: 0.52, ease: "power2.out" },
        4.92
      );

      tl.fromTo(
        "#chip-discount",
        { x: 190, y: 32, scale: 0.76, opacity: 0, rotation: 7 },
        { x: 0, y: 0, scale: 1, opacity: 1, rotation: -2.5, duration: 0.48 },
        5.5
      );

      tl.to(
        "#chip-discount .chip-icon polyline, #chip-discount .chip-icon line",
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" },
        5.56
      );

      tl.to(
        "#chip-paid",
        {
          y: -9,
          duration: 0.7,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 3
        },
        3.42
      );

      tl.to(
        "#chip-face",
        {
          y: 10,
          duration: 0.76,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 2
        },
        4.46
      );

      tl.to(
        "#chip-live",
        {
          y: -8,
          duration: 0.68,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 1
        },
        5.39
      );

      tl.to(
        "#chip-discount",
        {
          y: 8,
          duration: 0.62,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 0
        },
        6.03
      );

      tl.to(
        "#chip-paid, #chip-live",
        {
          x: -760,
          rotation: -10,
          duration: 0.43,
          ease: "expo.in"
        },
        6.72
      );

      tl.to(
        "#chip-face, #chip-discount",
        {
          x: 760,
          rotation: 10,
          duration: 0.43,
          ease: "expo.in"
        },
        6.72
      );

      tl.to(
        "#opening-heading, #center-mark, #common-label",
        {
          scale: 0.82,
          opacity: 0,
          duration: 0.38,
          ease: "power3.in"
        },
        6.75
      );

      tl.fromTo(
        "#wipe-stroke",
        { x: 0, scaleX: 1, skewX: -7 },
        {
          x: 1420,
          scaleX: 1.25,
          skewX: -7,
          duration: 0.45,
          ease: "expo.inOut"
        },
        6.72
      );

      tl.fromTo(
        "#suspect-video",
        { scale: 1.08, x: 18, y: 8, opacity: 0 },
        {
          scale: 1.065,
          x: 13,
          y: 4,
          opacity: 1,
          duration: 0.38,
          ease: "power2.out"
        },
        7.17
      );

      tl.to(
        "#suspect-video",
        {
          scale: 1.015,
          x: -12,
          y: -8,
          duration: 3.13,
          ease: "sine.inOut"
        },
        7.55
      );

      tl.fromTo(
        "#video-treatment",
        { opacity: 0 },
        { opacity: 1, duration: 0.42, ease: "power2.out" },
        7.17
      );

      tl.fromTo(
        "#punch-phrase",
        { scale: 1.38, y: 54, opacity: 0, rotation: -2 },
        {
          scale: 1,
          y: 0,
          opacity: 1,
          rotation: 0,
          duration: 0.58,
          ease: "expo.out"
        },
        8.12
      );

      tl.fromTo(
        "#punch-phrase",
        { x: -4 },
        {
          x: 4,
          duration: 0.12,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 5
        },
        8.7
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
