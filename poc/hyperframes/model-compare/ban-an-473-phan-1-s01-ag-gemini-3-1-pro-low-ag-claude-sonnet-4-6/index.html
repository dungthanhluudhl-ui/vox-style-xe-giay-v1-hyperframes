<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Scene S01</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #0b0f14;
      font-family: "Be Vietnam Pro", sans-serif;
    }
    
    #root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #E7E3D9;
    }
    
    .clip {
      position: absolute;
      inset: 0;
    }
    
    .full-frame {
      position: absolute;
      inset: 0;
    }
    
    /* Background Grid & Grain */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(20,20,20,0.32) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(20,20,20,0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px;
    }
    
    .bg-grain {
      position: absolute;
      inset: 0;
      background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
      opacity: 0.18;
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    /* Chips */
    .chip-wrapper {
      position: absolute;
    }
    
    .chip-content {
      background: #F5F0E4;
      border: 4px solid #141414;
      border-radius: 24px;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 44px;
      font-weight: 900;
      color: #141414;
      box-shadow: 8px 8px 0px #FF6A1A;
      will-change: transform, opacity;
    }
    
    .chip-content svg {
      width: 56px;
      height: 56px;
    }

    #chip1 { top: 450px; left: 80px; }
    #chip2 { top: 650px; right: 80px; }
    #chip3 { top: 950px; left: 80px; }
    #chip4 { top: 1150px; right: 80px; }

    /* Orange Wipe */
    #wipe-fill {
      position: absolute;
      inset: 0;
      background: #FF6A1A;
      transform-origin: left center;
      will-change: transform;
    }

    /* Video */
    #vid-02 {
      object-fit: cover;
      object-position: center center;
      width: 100%;
      height: 100%;
      will-change: transform;
    }

    /* Vignette */
    #vignette {
      background: radial-gradient(circle at center, transparent 30%, rgba(20,20,20,0.7) 100%);
    }

    /* Punch Phrase */
    #punch-inner {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    #punch-text {
      font-size: 110px;
      font-weight: 900;
      color: #F7F4EC;
      text-align: center;
      text-shadow: 0px 6px 16px rgba(0,0,0,0.7);
      will-change: transform, opacity;
    }

    /* Brand Bottom Bar */
    #bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 12px;
      background: #FF6A1A;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="10.68">
    
    <!-- Background (Global) -->
    <div class="bg-grid"></div>
    <div class="bg-grain"></div>

    <!-- Shot 1 Camera Rig -->
    <div id="shot1-camera-rig" class="full-frame">
      
      <!-- Chips -->
      <div class="chip-wrapper clip" id="chip1" data-start="2.87" data-duration="4.30">
        <div class="chip-content">
          <svg viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="20" height="12" rx="2"/>
            <circle cx="12" cy="12" r="2"/>
            <path d="M6 12h.01M18 12h.01"/>
          </svg>
          <span>TRẢ PHÍ</span>
        </div>
      </div>
      
      <div class="chip-wrapper clip" id="chip2" data-start="3.90" data-duration="3.27">
        <div class="chip-content">
          <svg viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span>GƯƠNG MẶT</span>
        </div>
      </div>
      
      <div class="chip-wrapper clip" id="chip3" data-start="4.85" data-duration="2.32">
        <div class="chip-content">
          <svg viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
            <line x1="12" y1="18" x2="12.01" y2="18"/>
          </svg>
          <span>PHÁT TRỰC TIẾP</span>
        </div>
      </div>
      
      <div class="chip-wrapper clip" id="chip4" data-start="5.50" data-duration="1.67">
        <div class="chip-content">
          <svg viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/>
            <polyline points="16 17 22 17 22 11"/>
          </svg>
          <span>−30%</span>
        </div>
      </div>

      <!-- Orange Wipe -->
      <div id="wipe-wrapper" class="clip full-frame" data-start="6.72" data-duration="0.45">
        <div id="wipe-fill"></div>
      </div>
    </div>

    <!-- Shot 2 Video -->
    <video id="vid-02" class="clip" src="assets/vid-02-cyber-scammer-suspect-profile.mp4" data-start="7.17" data-duration="3.51" data-media-start="2.245" muted playsinline></video>
    
    <!-- Vignette -->
    <div id="vignette" class="clip full-frame" data-start="7.17" data-duration="3.51"></div>
    
    <!-- Punch Phrase -->
    <div id="punch-container" class="clip full-frame" data-start="8.12" data-duration="2.56">
      <div id="punch-inner" class="full-frame">
        <div id="punch-text">MỘT CÁCH KHÁC</div>
      </div>
    </div>

    <!-- Brand Bottom Bar -->
    <div id="bottom-bar"></div>

  </div>

  <script>
    document.fonts.ready.then(() => {
      const tl = gsap.timeline({ paused: true });

      // Shot 1 Camera Drift (Zoom-out)
      tl.fromTo("#shot1-camera-rig",
        { scale: 1.15 },
        { scale: 1, duration: 7.17, ease: "none" },
        0
      );

      // Chip 1 Entrance & Bob
      tl.fromTo("#chip1 .chip-content",
        { scale: 0, opacity: 0, rotation: -3 },
        { scale: 1, opacity: 1, rotation: -3, duration: 0.6, ease: "power3.out" },
        2.87
      );
      tl.to("#chip1 .chip-content",
        { y: -12, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 2 },
        2.87 + 0.6
      );

      // Chip 2 Entrance & Bob
      tl.fromTo("#chip2 .chip-content",
        { scale: 0, opacity: 0, rotation: 4 },
        { scale: 1, opacity: 1, rotation: 4, duration: 0.6, ease: "power3.out" },
        3.90
      );
      tl.to("#chip2 .chip-content",
        { y: -12, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 2 },
        3.90 + 0.6
      );

      // Chip 3 Entrance & Bob
      tl.fromTo("#chip3 .chip-content",
        { scale: 0, opacity: 0, rotation: -2 },
        { scale: 1, opacity: 1, rotation: -2, duration: 0.6, ease: "power3.out" },
        4.85
      );
      tl.to("#chip3 .chip-content",
        { y: -12, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 1 },
        4.85 + 0.6
      );

      // Chip 4 Entrance & Bob
      tl.fromTo("#chip4 .chip-content",
        { scale: 0, opacity: 0, rotation: 3 },
        { scale: 1, opacity: 1, rotation: 3, duration: 0.6, ease: "power3.out" },
        5.50
      );
      tl.to("#chip4 .chip-content",
        { y: -12, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 },
        5.50 + 0.6
      );

      // Wipe Animation (Pushing chips away)
      tl.to("#chip1 .chip-content", { x: -800, duration: 0.45, ease: "power3.in" }, 6.72);
      tl.to("#chip3 .chip-content", { x: -800, duration: 0.45, ease: "power3.in" }, 6.72);
      tl.to("#chip2 .chip-content", { x: 800, duration: 0.45, ease: "power3.in" }, 6.72);
      tl.to("#chip4 .chip-content", { x: 800, duration: 0.45, ease: "power3.in" }, 6.72);

      tl.fromTo("#wipe-fill",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power3.in" },
        6.72
      );

      // Shot 2 Video Dissolve In
      tl.fromTo("#vid-02",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "none" },
        7.17
      );

      // Shot 2 Camera Parallax
      tl.fromTo("#vid-02",
        { scale: 1.1 },
        { scale: 1.0, duration: 3.51, ease: "none" },
        7.17
      );

      // Punch Phrase Entrance
      tl.fromTo("#punch-text",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
        8.12
      );

      window.__timelines["main"] = tl;
    });
  </script>
</body>
</html>
