<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
  <title>Vox Style Scene S01</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0; padding: 0; background-color: #E7E3D9; color: #141414;
      font-family: "Be Vietnam Pro", sans-serif; overflow: hidden;
      width: 1080px; height: 1920px; -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative; width: 1080px; height: 1920px;
      overflow: hidden; background-color: #E7E3D9;
    }
    .clip { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; }
    .grid-background {
      position: absolute; inset: 0; background-color: #E7E3D9;
      background-image:
        linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
      background-size: 84px 84px; z-index: 1;
    }
    #brand-bottom-bar {
      position: absolute; bottom: 0; left: 0; width: 1080px; height: 12px;
      background-color: #FF6A1A; z-index: 999;
    }
    #shot1-layer { position: absolute; inset: 0; z-index: 5; }
    #intro-banner {
      position: absolute; top: 230px; left: 60px; width: 960px;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      transform-origin: 50% 50%; will-change: transform, opacity; z-index: 6;
    }
    .tag-category {
      background-color: #141414; color: #F7F4EC; font-size: 26px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase; padding: 8px 24px;
      display: inline-block; margin-bottom: 16px; box-shadow: 4px 4px 0 rgba(20,20,20,0.4);
    }
    .headline-main {
      font-size: 72px; font-weight: 900; line-height: 1.25;
      color: #141414; text-transform: uppercase; letter-spacing: -1px;
    }
    .headline-underline { width: 240px; height: 8px; background-color: #FF6A1A; margin-top: 18px; }
    .paper-chip {
      position: absolute; width: 440px; height: 165px; background-color: #F5F0E4;
      border: 3px solid #141414; box-shadow: 8px 8px 0 #141414; display: flex;
      align-items: center; padding: 0 26px; gap: 20px; transform-origin: 50% 50%;
      will-change: transform, opacity; z-index: 7;
    }
    .tape-strip {
      position: absolute; top: -14px; left: 36px; width: 90px; height: 24px;
      background-color: rgba(255, 106, 26, 0.9); transform: rotate(-3deg);
      border-left: 2px dashed rgba(20, 20, 20, 0.3); border-right: 2px dashed rgba(20, 20, 20, 0.3);
    }
    .chip-icon { width: 72px; height: 72px; flex-shrink: 0; }
    .chip-icon svg {
      width: 100%; height: 100%; stroke: #141414; fill: none;
      stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round;
    }
    .chip-content { display: flex; flex-direction: column; justify-content: center; }
    .chip-label-sub {
      font-size: 20px; font-weight: 700; color: #141414; opacity: 0.85;
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px;
    }
    .chip-label-main {
      font-size: 38px; font-weight: 900; color: #141414;
      text-transform: uppercase; line-height: 1.15;
    }
    #chip-1 { top: 580px; left: 70px; }
    #chip-2 { top: 730px; left: 570px; }
    #chip-3 { top: 980px; left: 70px; }
    #chip-4 { top: 1130px; left: 570px; }
    #wipe-band {
      position: absolute; top: -200px; left: -1600px; width: 1400px; height: 2320px;
      background-color: #FF6A1A; transform: rotate(-12deg);
      box-shadow: 0 0 60px rgba(20, 20, 20, 0.5); z-index: 30; will-change: transform;
    }
    #s01-video {
      position: absolute; inset: 0; width: 1080px; height: 1920px;
      object-fit: cover; z-index: 10; will-change: transform;
    }
    #shot2-layer { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
    .video-vignette {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(180deg, rgba(20,20,20,0.65) 0%, rgba(20,20,20,0.08) 25%, rgba(20,20,20,0.2) 65%, rgba(20,20,20,0.85) 100%);
    }
    #punch-container {
      position: absolute; top: 1020px; left: 60px; width: 960px; display: flex;
      flex-direction: column; align-items: center; text-align: center;
      transform-origin: 50% 50%; will-change: transform, opacity; z-index: 5;
    }
    .punch-prefix-card {
      background-color: #141414; color: #F7F4EC; font-size: 42px; font-weight: 900;
      letter-spacing: 1.5px; text-transform: uppercase; padding: 12px 36px; margin-bottom: -10px;
      z-index: 2; border: 3px solid #141414; box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.35); transform: rotate(-1.5deg);
    }
    .punch-hero-card {
      background-color: #FF6A1A; color: #141414; font-size: 80px; font-weight: 900;
      line-height: 1.15; letter-spacing: -1px; text-transform: uppercase; padding: 18px 46px;
      border: 4px solid #141414; box-shadow: 12px 12px 0 #141414; transform: rotate(1deg); z-index: 1;
    }
    .punch-highlight {
      background-color: #141414; color: #F7F4EC; padding: 0 16px;
      display: inline-block; border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-start="0" data-duration="10.68" data-layout-allow-overflow>
    <div id="brand-bottom-bar"></div>

    <!-- SHOT 1: CÁC PHƯƠNG ÁN THÔNG THƯỜNG (0s -> 7.17s) -->
    <div id="shot1-layer" class="clip" data-start="0" data-duration="7.17" data-layout-allow-overflow>
      <div class="grid-background"></div>
      <div id="intro-banner">
        <div class="tag-category">MÔ HÌNH TIẾP CẬN</div>
        <h1 class="headline-main">4 CÁCH BÁN HÀNG<br>THÔNG THƯỜNG</h1>
        <div class="headline-underline"></div>
      </div>
      <div id="chip-1" class="paper-chip">
        <div class="tape-strip"></div>
        <div class="chip-icon">
          <svg viewBox="0 0 64 64">
            <rect x="6" y="16" width="52" height="32" rx="4" />
            <circle cx="32" cy="32" r="8" />
            <line x1="16" y1="24" x2="16" y2="40" />
            <line x1="48" y1="24" x2="48" y2="40" />
          </svg>
        </div>
        <div class="chip-content">
          <div class="chip-label-sub">QUẢNG CÁO</div>
          <div class="chip-label-main">TRẢ PHÍ</div>
        </div>
      </div>
      <div id="chip-2" class="paper-chip">
        <div class="tape-strip" style="transform: rotate(2deg); left: auto; right: 36px;"></div>
        <div class="chip-icon">
          <svg viewBox="0 0 64 64">
            <circle cx="32" cy="20" r="10" />
            <path d="M12 52 C12 38, 20 34, 32 34 C44 34, 52 38, 52 52" />
          </svg>
        </div>
        <div class="chip-content">
          <div class="chip-label-sub">THUÊ KOL</div>
          <div class="chip-label-main">GƯƠNG MẶT</div>
        </div>
      </div>
      <div id="chip-3" class="paper-chip">
        <div class="tape-strip"></div>
        <div class="chip-icon">
          <svg viewBox="0 0 64 64">
            <rect x="18" y="10" width="28" height="46" rx="5" />
            <line x1="28" y1="48" x2="36" y2="48" />
            <path d="M10 22 C6 27, 6 37, 10 42" />
            <path d="M54 22 C58 27, 58 37, 54 42" />
          </svg>
        </div>
        <div class="chip-content">
          <div class="chip-label-sub">LIVESTREAM</div>
          <div class="chip-label-main">TRỰC TIẾP</div>
        </div>
      </div>
      <div id="chip-4" class="paper-chip">
        <div class="tape-strip" style="transform: rotate(-1deg); left: auto; right: 40px;"></div>
        <div class="chip-icon">
          <svg viewBox="0 0 64 64">
            <polyline points="10,18 26,34 38,24 54,44" />
            <polyline points="40,44 54,44 54,30" />
          </svg>
        </div>
        <div class="chip-content">
          <div class="chip-label-sub">KHUYẾN MÃI</div>
          <div class="chip-label-main">−30%</div>
        </div>
      </div>
      <div id="wipe-band" data-layout-allow-overflow></div>
    </div>

    <!-- SHOT 2 VIDEO: NGHI PHẠM VÀ DÀN MÁY TÍNH (7.17s -> 10.68s) -->
    <video
      id="s01-video"
      class="clip"
      data-start="7.17"
      data-duration="3.51"
      data-media-start="2.245"
      muted
      playsinline
      src="assets/vid-02-cyber-scammer-suspect-profile.mp4"
    ></video>

    <!-- SHOT 2 GRAPHICS OVERLAY: PUNCH PHRASE (7.17s -> 10.68s) -->
    <div id="shot2-layer" class="clip" data-start="7.17" data-duration="3.51" data-layout-allow-overflow>
      <div class="video-vignette" data-layout-ignore data-layout-allow-occlusion></div>
      <div id="punch-container" data-layout-allow-overflow>
        <div class="punch-prefix-card">PHƯƠNG PHÁP MỚI</div>
        <div class="punch-hero-card">MỘT CÁCH <span class="punch-highlight">KHÁC</span></div>
      </div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    document.querySelectorAll(".chip-icon svg *").forEach(function(path) {
      if (typeof path.getTotalLength === "function") {
        const len = Math.ceil(path.getTotalLength());
        path.style.strokeDasharray = len + " " + len;
        path.style.strokeDashoffset = len;
      }
    });

    // --- SHOT 1 CHOREOGRAPHY (0.00s -> 7.17s) ---
    tl.fromTo("#intro-banner", { scale: 0.75, opacity: 0, y: 35 }, { scale: 1, opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.20);
    tl.to("#intro-banner", { y: -60, scale: 0.92, duration: 0.50, ease: "power2.inOut" }, 2.35);

    // Chip 1 (TRẢ PHÍ): Vào 2.87s -> 3.32s, Bob 3.38s -> 6.58s
    tl.fromTo("#chip-1", { scale: 0, opacity: 0, rotation: -8, y: 20 }, { scale: 1, opacity: 1, rotation: -2, y: 0, duration: 0.45, ease: "power3.out" }, 2.87);
    tl.to("#chip-1 svg *", { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" }, 2.92);
    tl.to("#chip-1", { y: -6, duration: 0.80, repeat: 3, yoyo: true, ease: "sine.inOut" }, 3.38);

    // Chip 2 (GƯƠNG MẶT): Vào 3.90s -> 4.35s, Bob 4.40s -> 6.50s
    tl.fromTo("#chip-2", { scale: 0, opacity: 0, rotation: 8, y: 20 }, { scale: 1, opacity: 1, rotation: 2.5, y: 0, duration: 0.45, ease: "power3.out" }, 3.90);
    tl.to("#chip-2 svg *", { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" }, 3.95);
    tl.to("#chip-2", { y: 6, duration: 0.70, repeat: 2, yoyo: true, ease: "sine.inOut" }, 4.40);

    // Chip 3 (TRỰC TIẾP): Vào 4.85s -> 5.30s, Bob 5.35s -> 6.55s
    tl.fromTo("#chip-3", { scale: 0, opacity: 0, rotation: -6, y: 20 }, { scale: 1, opacity: 1, rotation: -1.5, y: 0, duration: 0.45, ease: "power3.out" }, 4.85);
    tl.to("#chip-3 svg *", { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" }, 4.90);
    tl.to("#chip-3", { y: -5, duration: 0.60, repeat: 1, yoyo: true, ease: "sine.inOut" }, 5.35);

    // Chip 4 (−30%): Vào 5.50s -> 5.95s, Bob 6.00s -> 6.66s (kết thúc trước 6.72s để tránh overlap)
    tl.fromTo("#chip-4", { scale: 0, opacity: 0, rotation: 7, y: 20 }, { scale: 1, opacity: 1, rotation: 1.5, y: 0, duration: 0.45, ease: "power3.out" }, 5.50);
    tl.to("#chip-4 svg *", { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" }, 5.55);
    tl.to("#chip-4", { y: 5, duration: 0.33, repeat: 1, yoyo: true, ease: "sine.inOut" }, 6.00);

    // Wipe quét cam & đẩy các chip bay ra khỏi khung lúc 6.72s -> 7.15s
    tl.fromTo("#wipe-band", { x: 0 }, { x: 3200, duration: 0.45, ease: "power2.inOut" }, 6.72);
    tl.to("#chip-1", { x: -800, rotation: -25, opacity: 0, duration: 0.38, ease: "power2.in" }, 6.74);
    tl.to("#chip-2", { x: 800, rotation: 25, opacity: 0, duration: 0.38, ease: "power2.in" }, 6.75);
    tl.to("#chip-3", { x: -800, rotation: -20, opacity: 0, duration: 0.38, ease: "power2.in" }, 6.76);
    tl.to("#chip-4", { x: 800, rotation: 20, opacity: 0, duration: 0.38, ease: "power2.in" }, 6.77);
    tl.to("#intro-banner", { opacity: 0, scale: 0.95, duration: 0.30, ease: "power2.in" }, 6.75);

    // --- SHOT 2 CHOREOGRAPHY (7.17s -> 10.68s) ---
    tl.fromTo("#s01-video", { scale: 1.04, y: 15 }, { scale: 1.10, y: -20, duration: 3.51, ease: "none" }, 7.17);
    tl.fromTo("#punch-container", { scale: 1.35, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.48, ease: "power4.out" }, 8.12);

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
