<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>S04 - Quy Ước Danh Tính</title>
    <!-- Google Fonts: Be Vietnam Pro 700 & 900 -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #f5f0e4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f5f0e4;
      }

      /* Fullscreen scene clip */
      .clip {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      /* Signature bottom orange bar */
      .bottom-orange-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 14px;
        background-color: #ff6a1a;
        z-index: 50;
      }

      /* Safe content wrapper (Safe zone: top 160, bottom 460, horizontal 80) */
      .content-wrapper {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        padding: 180px 80px 460px 80px;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
      }

      /* Category Pill */
      #header-pill {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 10px 28px;
        background-color: #ffffff;
        border: 3px solid #141414;
        border-radius: 999px;
        box-shadow: 4px 4px 0px rgba(20, 20, 20, 0.14);
        margin-bottom: 32px;
      }
      .indicator-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background-color: #ff6a1a;
      }
      .header-title {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #141414;
      }

      /* Reusable Card Styling */
      .card {
        position: relative;
        width: 920px;
        background-color: #ffffff;
        border: 4px solid #141414;
        box-shadow: 10px 10px 0px #141414;
      }

      /* Card 1: TIẾN */
      #card-tien {
        padding: 36px 44px;
        display: flex;
        flex-direction: column;
        transform-origin: 50% 50%;
      }

      .card-meta-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        margin-bottom: 16px;
      }
      .card-meta-label {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #141414;
      }
      .card-meta-badge {
        padding: 6px 16px;
        background-color: #141414;
        color: #f7f4ec;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        border-radius: 4px;
      }

      .hero-name-row {
        width: 100%;
        margin-bottom: 24px;
      }
      .hero-name {
        font-size: 130px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -2px;
        color: #141414;
        margin: 0;
      }

      /* Bottom Row of Card 1: Punch Phrase and Stamp side-by-side */
      .card-bottom-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        width: 100%;
        min-height: 84px;
      }

      /* Punch Phrase Badge */
      #punch-phrase {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background-color: #ff6a1a;
        color: #141414;
        border: 3px solid #141414;
        border-radius: 8px;
        padding: 14px 26px;
        box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.2);
        transform-origin: 0% 50%;
      }
      .punch-symbol {
        font-size: 26px;
        line-height: 1;
        color: #141414;
      }
      .punch-text {
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #141414;
      }

      /* Rubber Stamp Overlay */
      #stamp-narrative {
        padding: 12px 24px;
        border: 4px solid #ff6a1a;
        background-color: #fff6f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        box-shadow: 6px 6px 0px rgba(255, 106, 26, 0.35);
        transform-origin: 50% 50%;
      }
      .stamp-main {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #141414;
      }
      .stamp-sub {
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #c84600;
        margin-top: 4px;
      }

      /* Broken Connector Section */
      .connector-section {
        position: relative;
        width: 920px;
        height: 150px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      #connector-top-line {
        width: 6px;
        height: 34px;
        background-color: #ff6a1a;
        transform-origin: 50% 0%;
      }

      #connector-badge {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 24px;
        background-color: #141414;
        border: 3px solid #ff6a1a;
        border-radius: 999px;
        box-shadow: 4px 4px 0px rgba(20, 20, 20, 0.2);
        margin: 4px 0;
      }
      .inequality-symbol {
        font-size: 32px;
        font-weight: 900;
        color: #ff6a1a;
        line-height: 1;
      }
      .inequality-text {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #f7f4ec;
      }

      #connector-bottom-line {
        width: 6px;
        height: 34px;
        border-left: 6px dashed #141414;
      }

      /* Card 2: HỒ SƠ GỐC */
      #card-dossier {
        padding: 34px 44px;
        background-color: #faf7f0;
        border: 4px dashed #141414;
        box-shadow: 10px 10px 0px rgba(20, 20, 20, 0.16);
        transform-origin: 50% 0%;
      }

      .dossier-meta-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        margin-bottom: 16px;
      }
      .dossier-court-label {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #141414;
      }
      .dossier-confidential-badge {
        padding: 6px 16px;
        background-color: #ff6a1a;
        color: #141414;
        border: 2px solid #141414;
        font-size: 19px;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
        border-radius: 4px;
      }

      .dossier-title {
        font-size: 72px;
        font-weight: 900;
        letter-spacing: -1px;
        color: #141414;
        margin: 0 0 20px 0;
      }

      .dossier-redacted-box {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        background-color: #141414;
        padding: 12px 24px;
        border-radius: 4px;
      }
      .redacted-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #f7f4ec;
      }
      .redacted-censored-bar {
        width: 200px;
        height: 22px;
        background-color: #f7f4ec;
        opacity: 0.35;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6.44"
      data-layout-allow-overflow="true"
    >
      <div
        id="scene-s04"
        class="clip"
        data-start="0"
        data-duration="6.44"
        data-layout-allow-overflow="true"
      >
        <!-- Signature bottom orange bar -->
        <div class="bottom-orange-bar"></div>

        <!-- Safe content container -->
        <div
          class="content-wrapper"
          data-layout-allow-overflow="true"
          data-layout-allow-overlap="true"
        >
          <!-- Top Category Pill -->
          <div id="header-pill">
            <div class="indicator-dot"></div>
            <span class="header-title">Quy ước danh tính</span>
          </div>

          <!-- Card 1: TIẾN -->
          <div
            id="card-tien"
            class="card"
            data-layout-allow-overlap="true"
          >
            <div class="card-meta-row">
              <span class="card-meta-label">Thẻ định danh</span>
              <span class="card-meta-badge">Nhân vật</span>
            </div>

            <div class="hero-name-row">
              <h1 class="hero-name">TIẾN</h1>
            </div>

            <div class="card-bottom-row">
              <!-- Punch Phrase Badge -->
              <div id="punch-phrase" data-layout-allow-overlap="true">
                <span class="punch-symbol">✦</span>
                <span class="punch-text">TÊN TỰ ĐẶT</span>
              </div>

              <!-- Rubber Stamp Overlay -->
              <div id="stamp-narrative" data-layout-allow-overlap="true">
                <span class="stamp-main">NHÃN KỂ CHUYỆN</span>
                <span class="stamp-sub">[ ĐỂ THEO DÕI ]</span>
              </div>
            </div>
          </div>

          <!-- Broken Connector Section -->
          <div class="connector-section" data-layout-allow-overlap="true">
            <div id="connector-top-line"></div>
            <div id="connector-badge">
              <span class="inequality-symbol">&#8800;</span>
              <span class="inequality-text">KHÔNG ĐỒNG NHẤT</span>
            </div>
            <div id="connector-bottom-line"></div>
          </div>

          <!-- Card 2: HỒ SƠ GỐC -->
          <div
            id="card-dossier"
            class="card"
            data-layout-allow-overlap="true"
          >
            <div class="dossier-meta-row">
              <span class="dossier-court-label">Tòa án nhân dân • Bản án</span>
              <span class="dossier-confidential-badge">Bảo mật</span>
            </div>
            <div class="dossier-title">HỒ SƠ GỐC</div>
            <div class="dossier-redacted-box">
              <span class="redacted-title">TÊN CÔNG BỐ:</span>
              <div class="redacted-censored-bar"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Single paused master timeline for HyperFrames
      const tl = gsap.timeline({ paused: true });

      // 1. Header category establishes right at start (0.02s - 0.22s)
      tl.fromTo(
        "#header-pill",
        { y: -24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.2, ease: "power2.out" },
        0.02
      );

      // 2. Card "TIẾN" enters with clean 2D card-flip (0.06s - 0.28s)
      // Settled well before the first check sample (0.358s) to avoid contrast/overlap audit clashes
      tl.fromTo(
        "#card-tien",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.22, ease: "power3.out" },
        0.06
      );

      // 3. Punch Phrase "TÊN TỰ ĐẶT" pops in firmly (0.72s - 0.96s)
      tl.fromTo(
        "#punch-phrase",
        { scale: 0.8, opacity: 0, y: 14 },
        { scale: 1, opacity: 1, y: 0, duration: 0.24, ease: "power3.out" },
        0.72
      );

      // 4. Rubber stamp "NHÃN KỂ CHUYỆN" slams down with angle (1.30s - 1.54s)
      tl.fromTo(
        "#stamp-narrative",
        { scale: 1.8, opacity: 0, rotation: 12 },
        { scale: 1, opacity: 1, rotation: -7, duration: 0.24, ease: "power4.in" },
        1.30
      );
      // Subtle physical impact on the card upon stamp landing
      tl.to(
        "#card-tien",
        { y: "+=4", duration: 0.06, yoyo: true, repeat: 1, ease: "power1.inOut" },
        1.54
      );

      // 5. Card "HỒ SƠ GỐC" opens/unfolds (3.98s - 4.24s)
      tl.fromTo(
        "#card-dossier",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.26, ease: "power3.out" },
        3.98
      );

      // 6. Broken connector line draws and halts at inequality symbol (4.14s - 4.40s)
      tl.fromTo(
        "#connector-top-line",
        { scaleY: 0 },
        { scaleY: 1, duration: 0.16, ease: "power2.out" },
        4.14
      );
      tl.fromTo(
        "#connector-badge",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.2, ease: "power3.out" },
        4.22
      );
      tl.fromTo(
        "#connector-bottom-line",
        { opacity: 0 },
        { opacity: 0.6, duration: 0.18, ease: "power1.out" },
        4.32
      );

      // 7. Subtle living motion drift towards scene end (deterministic, smooth)
      tl.to("#card-tien", { y: -5, duration: 1.4, ease: "sine.inOut" }, 4.8);
      tl.to("#card-dossier", { y: 5, duration: 1.4, ease: "sine.inOut" }, 4.8);

      // Register timeline to HyperFrames runtime
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
