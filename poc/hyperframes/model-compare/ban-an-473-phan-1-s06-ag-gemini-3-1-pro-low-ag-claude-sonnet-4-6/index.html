<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Scene S06 - HyperFrames</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Root sizing must be 100% per contract */
        #root {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #E7E3D9;
            overflow: hidden;
            font-family: "Be Vietnam Pro", sans-serif;
        }

        /* Vox Style Grid Background */
        .bg-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px),
                linear-gradient(90deg, rgba(20, 20, 20, 0.32) 1.5px, transparent 1.5px);
            background-size: 84px 84px;
            background-position: center center;
            z-index: 0;
        }

        /* Grain Overlay */
        .bg-grid::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            opacity: 0.18;
            mix-blend-mode: multiply;
            pointer-events: none;
        }

        /* Main Video Container (Framed Cutout Style) */
        .video-wrapper {
            position: absolute;
            inset: 80px 40px 140px 40px; /* Leaves room for grid and bottom bar */
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 24px 64px rgba(20, 20, 20, 0.4);
            background-color: #141414;
            z-index: 10;
            will-change: transform, opacity;
            opacity: 0; /* Prevent flash before GSAP initializes */
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* TV Blur Overlay (Static position based on cameraMotion: static) */
        .tv-blur {
            position: absolute;
            top: 22%;
            left: 12%;
            width: 28%;
            height: 14%;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            background-color: rgba(20, 20, 20, 0.2);
            border-radius: 16px;
            z-index: 15;
        }

        /* Overlays Layer */
        .overlays-container {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
        }

        /* Flow Arrow */
        .flow-arrow-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        #arrow-path {
            fill: none;
            stroke: #FF6A1A;
            stroke-width: 18;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 8px 16px rgba(20,20,20,0.2));
        }

        #arrow-head {
            fill: #FF6A1A;
            filter: drop-shadow(0 8px 16px rgba(20,20,20,0.2));
            will-change: transform, opacity;
            opacity: 0;
        }

        /* Product Card */
        .product-card {
            position: absolute;
            left: 610px;
            top: 1130px;
            background-color: #F5F0E4;
            color: #141414;
            border: 5px solid #141414;
            border-radius: 20px;
            padding: 28px 40px;
            font-size: 52px;
            font-weight: 900;
            line-height: 1.2;
            white-space: nowrap;
            box-shadow: 12px 12px 0 #FF6A1A;
            will-change: transform, opacity;
            z-index: 25;
            opacity: 0;
        }

        /* Endpoint Ring */
        .endpoint-ring {
            position: absolute;
            left: 585px;
            top: 1105px;
            width: 440px;
            height: 165px;
            border: 8px solid #FF6A1A;
            border-radius: 32px;
            z-index: 24;
            will-change: transform, opacity;
            opacity: 0;
        }

        /* Brand Bottom Bar */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 24px;
            background-color: #FF6A1A;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="5.96">
        
        <div class="bg-grid"></div>

        <!-- Video Layer with Entrance Animation. Timing is on the wrapper. -->
        <div class="video-wrapper clip" id="scene-container" data-start="0" data-duration="5.96">
            <video 
                id="main-video" 
                src="assets/vid-03-papercut-crowd-scandal-storefront.mp4" 
                muted 
                playsinline 
                data-media-start="1.5">
            </video>
            <div class="tv-blur"></div>
        </div>

        <!-- Graphics Overlays -->
        <div class="overlays-container">
            
            <!-- Flow Arrow (Starts at TV, curves to counter) -->
            <svg class="flow-arrow-svg" viewBox="0 0 1080 1920">
                <!-- Path: Start (200, 600) -> Curve -> End (550, 1200) -->
                <path id="arrow-path" d="M 220 600 C 220 1050, 350 1200, 550 1200" />
                <!-- Arrowhead pointing right at the end of the path -->
                <polygon id="arrow-head" points="520,1170 580,1200 520,1230" />
            </svg>

            <!-- Endpoint Ring -->
            <div id="endpoint-ring" class="endpoint-ring"></div>

            <!-- Product Card -->
            <div id="product-card" class="product-card">
                HÀNG Ở QUẦY
            </div>

        </div>

        <div class="bottom-bar"></div>
    </div>

    <script>
        document.fonts.ready.then(() => {
            const tl = gsap.timeline({ paused: true });

            // Set transform origins via GSAP to avoid CSS conflict
            gsap.set("#scene-container", { transformOrigin: "center center" });
            gsap.set("#arrow-head", { transformOrigin: "550px 1200px" });
            gsap.set("#product-card", { transformOrigin: "left center" });
            gsap.set("#endpoint-ring", { transformOrigin: "center center" });

            // 1. Scene Entrance (Grow/Spring-pop)
            // Occurs at start of scene (0s)
            tl.fromTo("#scene-container", 
                { scale: 0, opacity: 0 }, 
                { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, 
                0
            );

            // 2. Flow Arrow Draw
            // Starts at 43680ms (relative: 1.17s)
            const arrowPath = document.getElementById("arrow-path");
            const pathLength = arrowPath.getTotalLength();
            
            // Setup initial state for drawing
            arrowPath.style.strokeDasharray = pathLength;
            arrowPath.style.strokeDashoffset = pathLength;

            tl.to(arrowPath, 
                { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" }, 
                1.17
            );

            // Arrowhead pops in just as the line finishes drawing
            tl.fromTo("#arrow-head",
                { scale: 0, opacity: 0 },
                { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
                1.17 + 1.0
            );

            // 3. Product Card Pop
            // Starts at 45320ms (relative: 2.81s)
            tl.fromTo("#product-card",
                { scale: 0, opacity: 0, x: -30 },
                { scale: 1, opacity: 1, x: 0, duration: 0.6, ease: "power3.out" },
                2.81
            );

            // 4. Endpoint Ring Pulse (khóa vào thẻ sản phẩm)
            // Starts at 47220ms (relative: 4.71s)
            // Pops in, then pulses slightly without fading out
            tl.fromTo("#endpoint-ring",
                { scale: 0.9, opacity: 0 },
                { scale: 1.15, opacity: 1, duration: 0.3, ease: "power2.out" },
                4.71
            );
            tl.to("#endpoint-ring",
                { scale: 1.05, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 1 },
                4.71 + 0.3
            );

            // Register timeline with HyperFrames
            window.__timelines["main"] = tl;
        });
    </script>
</body>
</html>
