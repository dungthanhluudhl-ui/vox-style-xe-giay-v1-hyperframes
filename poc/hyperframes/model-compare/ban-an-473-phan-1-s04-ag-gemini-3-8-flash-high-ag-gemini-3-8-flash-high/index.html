<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>S04 - Tên Tự Đặt</title>
    <!-- Google Fonts CDN load theo đúng composition contract -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #F5F0E4;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
      }

      /* Nền hạt giấy nhẹ - blend multiply */
      .grain-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.16;
        mix-blend-mode: multiply;
        z-index: 10;
      }

      /* Dải cam nhận diện Vox cố định mép dưới */
      .brand-bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        background-color: #FF6A1A;
        z-index: 50;
      }

      /* Khung phối cảnh 3D cho hiệu ứng flip thẻ */
      .scene-stage {
        position: absolute;
        inset: 0;
        perspective: 1200px;
        transform-style: preserve-3d;
      }

      /* Vùng an toàn chứa nội dung chính */
      .content-wrapper {
        position: absolute;
        top: 180px;
        left: 80px;
        right: 80px;
        height: 1240px;
      }

      /* Khu vực Punch phrase */
      .header-zone {
        position: relative;
        width: 100%;
        margin-bottom: 36px;
      }

      .editorial-kicker {
        display: inline-flex;
        align-items: center;
        background-color: #141414;
        color: #F7F4EC;
        font-size: 20px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 2px;
        padding: 6px 14px;
        border-radius: 4px;
        margin-bottom: 12px;
      }

      .punch-container {
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .punch-phrase {
        margin: 0;
        font-size: 78px;
        font-weight: 900;
        line-height: 1.18;
        letter-spacing: -2px;
        color: #141414;
        text-transform: uppercase;
      }

      /* Gạch chân nằm hoàn toàn trong luồng flexbox, tránh escaped_container */
      .punch-underline {
        width: 100%;
        height: 8px;
        background-color: #FF6A1A;
        margin-top: 6px;
        transform-origin: left center;
      }

      /* Thẻ 1: Thẻ TIẾN */
      .card-tien-wrap {
        position: absolute;
        top: 230px;
        left: 30px;
        width: 860px;
        height: 310px;
        transform-origin: center center;
        transform-style: preserve-3d;
      }

      .paper-card {
        width: 100%;
        height: 100%;
        background-color: #E7E3D9;
        border: 4px solid #141414;
        box-shadow: 12px 12px 0px #141414;
        border-radius: 8px;
        padding: 26px 40px;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .card-badge {
        display: inline-block;
        align-self: flex-start;
        background-color: #141414;
        color: #F7F4EC;
        font-size: 19px;
        font-weight: 900;
        letter-spacing: 1.5px;
        padding: 6px 16px;
        border-radius: 4px;
        text-transform: uppercase;
      }

      .card-title-tien {
        margin: 4px 0 0 0;
        font-size: 96px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -2px;
        color: #141414;
      }

      .card-sublabel {
        font-size: 22px;
        font-weight: 700;
        color: #141414;
        letter-spacing: -0.5px;
        margin: 0;
      }

      /* Con dấu quy ước đóng lên thẻ */
      .stamp-badge {
        position: absolute;
        right: 32px;
        top: 68px;
        background-color: #FF6A1A;
        color: #141414;
        border: 5px solid #141414;
        box-shadow: 6px 6px 0px #141414;
        padding: 10px 22px;
        border-radius: 6px;
        text-align: center;
        transform-origin: center center;
        z-index: 5;
      }

      .stamp-inner-text {
        font-size: 30px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* Khu vực đường nối đứt đoạn giữa 2 thẻ */
      .connector-zone {
        position: absolute;
        top: 540px;
        left: 30px;
        width: 860px;
        height: 190px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .connector-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .break-alert-pill {
        position: relative;
        z-index: 4;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background-color: #141414;
        border: 3px solid #FF6A1A;
        box-shadow: 6px 6px 0px rgba(20, 20, 20, 0.4);
        padding: 10px 24px;
        border-radius: 50px;
        transform-origin: center center;
      }

      .break-symbol {
        color: #F7F4EC;
        font-size: 32px;
        font-weight: 900;
        line-height: 1;
      }

      .break-text {
        color: #F7F4EC;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      /* Thẻ 2: Thẻ HỒ SƠ GỐC */
      .card-hoso-wrap {
        position: absolute;
        top: 730px;
        left: 30px;
        width: 860px;
        height: 310px;
        transform-origin: center center;
      }

      .dark-card {
        width: 100%;
        height: 100%;
        background-color: #141414;
        border: 4px solid #141414;
        box-shadow: 12px 12px 0px #FF6A1A;
        border-radius: 8px;
        padding: 26px 40px;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .card-badge-orange {
        display: inline-block;
        align-self: flex-start;
        background-color: #FF6A1A;
        color: #141414;
        font-size: 19px;
        font-weight: 900;
        letter-spacing: 1.5px;
        padding: 6px 16px;
        border-radius: 4px;
        text-transform: uppercase;
      }

      .card-title-hoso {
        margin: 4px 0 0 0;
        font-size: 88px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -2px;
        color: #F7F4EC;
      }

      .redacted-tape {
        display: inline-flex;
        align-self: flex-start;
        align-items: center;
        background-color: #242424;
        border-left: 6px solid #FF6A1A;
        padding: 6px 16px;
      }

      .redacted-text {
        font-size: 20px;
        font-weight: 700;
        color: #F7F4EC;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6.44"
      data-layout-allow-overflow="true"
    >
      <!-- Background SVG paper noise -->
      <div class="grain-layer" data-layout-ignore="true">
        <svg width="100%" height="100%">
          <filter id="paperGrain">
            <feTurbulence
              type="fractalNoise"
              baseFrequency="0.8"
              numOctaves="3"
              stitchTiles="stitch"
            />
          </filter>
          <rect width="100%" height="100%" filter="url(#paperGrain)" />
        </svg>
      </div>

      <!-- Main Scene Clip -->
      <section id="scene-s04" class="clip" data-start="0" data-duration="6.44">
        <div class="scene-stage">
          <div class="content-wrapper">
            <!-- Header Zone: Punch Phrase -->
            <div class="header-zone">
              <div id="kicker-tag" class="editorial-kicker">
                <span>QUY ƯỚC LỜI KỂ</span>
              </div>
              <br />
              <div
                id="punch-wrap"
                class="punch-container"
                data-layout-allow-overflow="true"
              >
                <h1 id="punch-text" class="punch-phrase">TÊN TỰ ĐẶT</h1>
                <div id="punch-line" class="punch-underline"></div>
              </div>
            </div>

            <!-- Card 1: Thẻ Tiến -->
            <div
              id="card-tien"
              class="card-tien-wrap"
              data-layout-allow-overlap="true"
            >
              <div class="paper-card" data-layout-allow-overlap="true">
                <span class="card-badge">NHÂN VẬT QUY ƯỚC</span>
                <div
                  class="card-title-tien"
                  data-layout-allow-overlap="true"
                >
                  TIẾN
                </div>
                <div
                  class="card-sublabel"
                  data-layout-allow-overlap="true"
                >
                  DÙNG THEO DÕI TRUYỆN
                </div>
                <!-- Stamp: Nhãn Kể Chuyện -->
                <div
                  id="stamp-badge"
                  class="stamp-badge"
                  data-layout-allow-overlap="true"
                  data-layout-allow-overflow="true"
                >
                  <span class="stamp-inner-text">NHÃN KỂ CHUYỆN</span>
                </div>
              </div>
            </div>

            <!-- Broken Connector Section -->
            <div id="connector-zone" class="connector-zone">
              <svg
                class="connector-svg"
                viewBox="0 0 860 190"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <!-- Upper line segment descending from Card 1 -->
                <line
                  id="conn-line-top"
                  x1="430"
                  y1="0"
                  x2="430"
                  y2="55"
                  stroke="#FF6A1A"
                  stroke-width="6"
                  stroke-linecap="round"
                />
                <!-- Diagonal break cuts -->
                <g id="conn-cut-marks">
                  <line
                    x1="412"
                    y1="82"
                    x2="448"
                    y2="64"
                    stroke="#FF6A1A"
                    stroke-width="5"
                    stroke-linecap="round"
                  />
                  <line
                    x1="412"
                    y1="96"
                    x2="448"
                    y2="78"
                    stroke="#FF6A1A"
                    stroke-width="5"
                    stroke-linecap="round"
                  />
                </g>
                <!-- Lower line segment reaching towards Card 2 -->
                <line
                  id="conn-line-bot"
                  x1="430"
                  y1="130"
                  x2="430"
                  y2="190"
                  stroke="#FF6A1A"
                  stroke-width="6"
                  stroke-dasharray="8 6"
                  stroke-linecap="round"
                />
              </svg>

              <!-- Disconnection Badge -->
              <div id="break-badge" class="break-alert-pill">
                <span class="break-symbol">≠</span>
                <span class="break-text">KHÔNG ĐỒNG NHẤT</span>
              </div>
            </div>

            <!-- Card 2: Thẻ Hồ Sơ Gốc -->
            <div id="card-hoso" class="card-hoso-wrap">
              <div class="dark-card">
                <span class="card-badge-orange">BẢN ÁN CÔNG BỐ</span>
                <div class="card-title-hoso">HỒ SƠ GỐC</div>
                <div class="redacted-tape">
                  <span class="redacted-text">DANH TÍNH PHÁP LÝ</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Signature bottom bar -->
      <div class="brand-bottom-bar" data-layout-ignore="true"></div>
    </div>

    <!-- Animation Runtime Script -->
    <script>
      const tl = gsap.timeline({ paused: true });

      // Initial visual states
      gsap.set("#kicker-tag", { opacity: 0, y: -16 });
      gsap.set("#punch-wrap", { opacity: 0, y: -24 });
      gsap.set("#punch-line", { scaleX: 0 });
      gsap.set("#card-tien", { opacity: 0, rotationY: 72, scale: 0.9 });
      gsap.set("#stamp-badge", { opacity: 0, scale: 2.2, rotation: 16 });
      gsap.set("#conn-line-top", { strokeDasharray: 60, strokeDashoffset: 60 });
      gsap.set("#conn-line-bot", { strokeDasharray: 60, strokeDashoffset: 60 });
      gsap.set("#conn-cut-marks", { opacity: 0, scale: 0.6, transformOrigin: "430px 85px" });
      gsap.set("#break-badge", { opacity: 0, scale: 0.3 });
      gsap.set("#card-hoso", { opacity: 0, y: 45, scale: 0.94 });

      // 1. Card 1: Thẻ TIẾN lật vào theo trục dọc (at 0.26s)
      tl.to(
        "#card-tien",
        {
          opacity: 1,
          rotationY: 0,
          scale: 1,
          duration: 0.65,
          ease: "power3.out",
        },
        0.26
      );

      // 2. Punch phrase "TÊN TỰ ĐẶT" xuất hiện (at 0.91s)
      tl.to(
        "#kicker-tag",
        {
          opacity: 1,
          y: 0,
          duration: 0.35,
          ease: "power2.out",
        },
        0.82
      );
      tl.to(
        "#punch-wrap",
        {
          opacity: 1,
          y: 0,
          duration: 0.45,
          ease: "power3.out",
        },
        0.91
      );
      tl.to(
        "#punch-line",
        {
          scaleX: 1,
          duration: 0.4,
          ease: "power2.out",
        },
        1.05
      );

      // 3. Con dấu "NHÃN KỂ CHUYỆN" đóng mạnh xuống thẻ TIẾN (at 1.32s)
      tl.to(
        "#stamp-badge",
        {
          opacity: 1,
          scale: 1,
          rotation: -8,
          duration: 0.32,
          ease: "power4.out",
        },
        1.32
      );

      // Thẻ TIẾN rung phản lực nhẹ khi con dấu giáng xuống (at 1.58s)
      tl.to(
        "#card-tien",
        {
          y: 6,
          duration: 0.05,
          yoyo: true,
          repeat: 1,
          ease: "power1.inOut",
        },
        1.58
      );

      // 4. Thẻ 2: HỒ SƠ GỐC xuất hiện (at 3.98s)
      tl.to(
        "#card-hoso",
        {
          opacity: 1,
          y: 0,
          scale: 1,
          duration: 0.55,
          ease: "power3.out",
        },
        3.98
      );

      // 5. Broken Connector kích hoạt (at 4.14s)
      // Nét trên kéo xuống từ thẻ TIẾN
      tl.to(
        "#conn-line-top",
        {
          strokeDashoffset: 0,
          duration: 0.22,
          ease: "none",
        },
        4.14
      );

      // Huy hiệu "≠ KHÔNG ĐỒNG NHẤT" nảy ra ở điểm ngắt (at 4.32s)
      tl.to(
        "#break-badge",
        {
          opacity: 1,
          scale: 1,
          duration: 0.32,
          ease: "power3.out",
        },
        4.32
      );

      // Vết cắt xéo đứt đoạn (at 4.45s)
      tl.to(
        "#conn-cut-marks",
        {
          opacity: 1,
          scale: 1,
          duration: 0.18,
          ease: "power2.out",
        },
        4.45
      );

      // Nét dưới đứt đoạn chỉ đi tới một nửa (at 4.48s)
      tl.to(
        "#conn-line-bot",
        {
          strokeDashoffset: 0,
          duration: 0.22,
          ease: "none",
        },
        4.48
      );

      // Đăng ký timeline paused vào registry theo đúng contract
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
