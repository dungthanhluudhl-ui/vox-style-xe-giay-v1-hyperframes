<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Giai đoạn A — caption-track + audio test (an-le-64)</title>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="an-le-64-caption-test"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-fps="30"
      data-duration="49.333333"
    >
      <audio
        id="narration"
        data-start="0"
        data-duration="49.333333"
        src="assets/narration.mp3"
      ></audio>

      <div
        id="caption-slot"
        class="clip"
        data-composition-id="caption-track"
        data-composition-src="compositions/caption-track.html"
        data-start="0"
        data-duration="49.333333"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["an-le-64-caption-test"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
