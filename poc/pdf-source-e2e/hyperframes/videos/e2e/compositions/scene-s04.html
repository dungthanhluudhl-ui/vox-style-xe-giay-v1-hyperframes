    // Left card unfolds from top (transitionIn: unfold)

      { scaleX: 1, duration: 0.4, ease: "power2.out" },

      { opacity: 0, scale: 0.88 },
      { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
      3.77

    // Sub-badges in bottom card

      "#badge-vai-tro",

    tl.fromTo(
      "#badge-phu-thuoc",
      { opacity: 0, x: -20 },
      { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" },
      4.25
    );

    // Label CẤP TRÊN appears in top card (atMs: 23490 -> 4.49s)
    tl.fromTo(
      "#label-cap-tren",
      { opacity: 0, scale: 0.88 },
      { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },

    );
    tl.fromTo(
      "#sub-cap-tren",
      { opacity: 0, y: 12 },

    // 3. Arrow draws down from Cấp Trên to Hồng Hải (atMs: 24580 -> 5.58s)
    tl.fromTo(

      { strokeDashoffset: 140 },
      { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },

    tl.fromTo(
