<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Quy ước clip của HyperFrames: absolute inset 0 */
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* Nền spotlight: giấy ngà #E7E3D9 + radial vignette tối + lưới ô vuông 84px */
      .bg-spotlight {
        position: absolute;
        inset: 0;
        background-color: #E7E3D9;
        background-image:
          radial-gradient(circle at 50% 50%, transparent 40%, rgba(20, 20, 20, 0.28) 100%),
          linear-gradient(to right, rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20, 20, 20, 0.12) 1.5px, transparent 1.5px);
        background-size: 100% 100%, 84px 84px, 84px 84px;
      }

      /* Thanh cam nhận diện thương hiệu cố định mép dưới cùng */
      .bottom-brand-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 12px;
        background: #FF6A1A;
        z-index: 100;
      }

      /* Lớp hình chính: ảnh img-02 collage phòng xử phúc thẩm */
      #hero-container {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #hero-img {
        width: 768px;
        height: 1376px;
        object-fit: contain;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      /* Wrapper nội dung các shot tài liệu nằm gọn trong dải an toàn Y [160, 1390] */
      .shot-content-wrapper {
        position: absolute;
        left: 40px;
        right: 40px;
        top: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        pointer-events: none;
      }

      /* Thẻ tài liệu bản án bằng chứng: giữ nguyên tỉ lệ, không crop, nền card rõ ràng */
      .doc-card {
        width: 1000px;
        background: #F5F0E4;
        padding: 12px;
        border-radius: 12px;
        border: 2px solid rgba(20, 20, 20, 0.25);
        box-shadow: 0 20px 48px rgba(20, 20, 20, 0.4);
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      .doc-img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 6px;
      }

      /* Nhãn shot 2: BẢN ÁN PHÚC THẨM */
      .doc-header-label {
        background: #141414;
        color: #F7F4EC;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 2px;
        padding: 10px 28px;
        border-radius: 8px;
        border-left: 6px solid #FF6A1A;
        box-shadow: 0 8px 24px rgba(20, 20, 20, 0.35);
        display: inline-block;
      }

      /* Container chứa các số liệu mức án ở Shot 3 */
      #shot-3-badges-container {
        position: relative;
        width: 100%;
        height: 96px;
      }

      .badge-slot {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
      }

      /* Badge mức án cũ 3 NĂM */
      .sentence-badge-old {
        position: relative;
        background: #141414;
        color: #F7F4EC;
        font-size: 46px;
        font-weight: 900;
        letter-spacing: 1px;
        padding: 14px 34px;
        border-radius: 10px;
        border: 2px solid rgba(247, 244, 236, 0.2);
        box-shadow: 0 10px 28px rgba(20, 20, 20, 0.35);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }

      /* Vạch gạch cam qua án cũ */
      .strike-line {
        position: absolute;
        left: -6px;
        right: -6px;
        top: 50%;
        height: 6px;
        background: #FF6A1A;
        border-radius: 3px;
        transform: translateY(-50%) scaleX(0);
        transform-origin: left center;
      }

      /* Badge mức án mới 1 NĂM 6 THÁNG: nền cam #FF6A1A, chữ mực #141414 (WCAG 6.4:1) */
      .sentence-badge-new {
        background: #FF6A1A;
        color: #141414;
        font-size: 48px;
        font-weight: 900;
        letter-spacing: 1px;
        padding: 14px 38px;
        border-radius: 10px;
        border: 2px solid #141414;
        box-shadow: 0 12px 36px rgba(255, 106, 26, 0.45);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
      }
    </style>

    <div
      id="root"
      data-composition-id="scene-s05"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="9"
    >
      <!-- Lớp nền spotlight và thanh cam thương hiệu cố định xuyên suốt scene S05 -->
      <div id="bg-clip" class="clip" data-start="0" data-duration="9">
        <div class="bg-spotlight"></div>
        <div class="bottom-brand-bar"></div>
      </div>

      <!-- Shot 1 -> 3: Ảnh chính img-02 phòng xử án (lớp hình nền t=0 đến t=9) -->
      <div id="hero-clip" class="clip" data-start="0" data-duration="9">
        <div id="hero-container">
          <img
            id="hero-img"
            src="assets/img-02-court-appeal-sentence-reduction.jpg"
            alt="Toàn cảnh phòng xử phúc thẩm"
          />
        </div>
      </div>

      <!-- Shot 2 (S05-2): Bản án trang 1 (doc-01) xác lập ngày và cơ quan xét xử (t=1.5s -> t=5.02s) -->
      <div id="shot-2-clip" class="clip" data-start="1.5" data-duration="3.52">
        <div id="shot-2-wrapper" class="shot-content-wrapper">
          <div id="shot-2-label-wrapper">
            <div id="shot-2-label" class="doc-header-label">BẢN ÁN PHÚC THẨM</div>
          </div>
          <div id="doc-01-card" class="doc-card">
            <img
              src="assets/doc-01-header.png"
              class="doc-img"
              alt="Trích lục bản án phúc thẩm trang 1"
            />
          </div>
        </div>
      </div>

      <!-- Shot 3 (S05-3): Bản án trang 23 (doc-03) và biến đổi giảm hình phạt (t=5.02s -> t=9.0s) -->
      <div id="shot-3-clip" class="clip" data-start="5.02" data-duration="3.98">
        <div id="shot-3-wrapper" class="shot-content-wrapper">
          <div id="shot-3-badges-container">
            <div id="badge-old-slot" class="badge-slot">
              <div id="badge-old" class="sentence-badge-old" data-layout-allow-overlap>
                <span>3 NĂM</span>
                <div id="strike-line" class="strike-line"></div>
              </div>
            </div>
            <div id="badge-new-slot" class="badge-slot">
              <div id="badge-new" class="sentence-badge-new">
                <span>1 NĂM 6 THÁNG</span>
              </div>
            </div>
          </div>
          <div id="doc-03-card" class="doc-card">
            <img
              src="assets/doc-03-verdict.png"
              class="doc-img"
              alt="Trích lục tuyên án trang 23"
            />
          </div>
        </div>
      </div>
    </div>

    <script>
      // Đăng ký đúng 1 paused GSAP timeline cho composition
      const tl = gsap.timeline({ paused: true });

      // SHOT 1 (0.0s -> 1.5s): Nhịp mở kết quả, transitionIn zoom-through, camera zoom-out
      tl.fromTo(
        "#hero-img",
        { scale: 1.15, opacity: 0 },
        { scale: 1.05, opacity: 1, duration: 1.2, ease: "power2.out" },
        0
      );
      tl.to(
        "#hero-img",
        { scale: 1.0, duration: 0.3, ease: "none" },
        1.2
      );

      // SHOT 2 (1.5s -> 5.02s): doc-01 xuất hiện dứt khoát (cut), camera zoom-in nhẹ tối đa 3%
      tl.fromTo(
        "#shot-2-wrapper",
        { opacity: 0, scale: 0.98 },
        { opacity: 1, scale: 1.0, duration: 0.15, ease: "power2.out" },
        1.5
      );
      tl.fromTo(
        "#shot-2-label",
        { y: -16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        1.5
      );
      tl.to(
        "#doc-01-card",
        { scale: 1.03, duration: 3.37, ease: "none" },
        1.65
      );

      // SHOT 3 (5.02s -> 9.0s): doc-03 thay thế doc-01 (cut), static camera
      tl.fromTo(
        "#doc-03-card",
        { opacity: 0, scale: 0.98 },
        { opacity: 1, scale: 1.0, duration: 0.15, ease: "power2.out" },
        5.02
      );

      // t=6.13s (atMs: 32130): Con số 3 NĂM xuất hiện ở trung tâm phía trên thẻ
      tl.fromTo(
        "#badge-old",
        { scale: 0, opacity: 0, x: 0 },
        { scale: 1, opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
        6.13
      );

      // t=7.4s (atMs: 33400): Khi lời thoại đến "xuống còn 1 năm 6 tháng tù":
      // "3 NĂM" dịch sang trái, vạch cam gạch ngang; "1 NĂM 6 THÁNG" pop vào vị trí chính giữa
      tl.to(
        "#badge-old",
        { x: -340, scale: 0.85, opacity: 0.45, duration: 0.4, ease: "power2.out" },
        7.4
      );
      tl.to(
        "#strike-line",
        { scaleX: 1, duration: 0.25, ease: "power2.out" },
        7.5
      );
      tl.fromTo(
        "#badge-new",
        { scale: 0, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        7.4
      );

      // t=8.2s: Giữ 3 năm đủ 1.6s theo shotlist rồi fade out nhẹ; 1 năm 6 tháng và doc-03 tiếp tục hiện rõ đến hết video
      tl.to(
        "#badge-old",
        { opacity: 0, duration: 0.3, ease: "power2.in" },
        8.2
      );

      // Gắn timeline vào window.__timelines["scene-s05"]
      window.__timelines = window.__timelines || {};
      window.__timelines["scene-s05"] = tl;
    </script>
  
    </template>
  </body>
</html>
