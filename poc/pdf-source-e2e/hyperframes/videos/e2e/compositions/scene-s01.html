<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;900&display=swap" />
      <style>
/* hf-safe-colors (tất định từ style-tokens.json) */
.hf-text-ink { color: #141414; }
.hf-text-light { color: #F7F4EC; }
.hf-hl-orange { color: #141414; background-color: #FF6A1A; }
.hf-plate-ink { color: #F7F4EC; background-color: #141414; }
.hf-plate-ink-orange { color: #FF6A1A; background-color: #141414; }
.hf-plate-paper { color: #141414; background-color: #F5F0E4; }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: #E7E3D9;
        color: #141414;
        font-family: "Be Vietnam Pro", sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #E7E3D9;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(20,20,20,.32) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, rgba(20,20,20,.32) 1.5px, transparent 1.5px);
        background-size: 84px 84px;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      .photo-frame {
        position: absolute;
        top: 208px;
        left: 91px;
        width: 898px;
        height: 1110px;
        overflow: hidden;
        border: 5px solid #141414;
        background: #141414;
      }

      .photo {
        display: block;
        width: 100%;
        height: auto;
        transform-origin: 50% 0%;
        will-change: transform;
      }

      .number-clip {
        z-index: 3;
        pointer-events: none;
      }

      .number-badge {
        position: absolute;
        top: 1020px;
        right: 24px;
        width: 242px;
        height: 178px;
        display: grid;
        place-items: center;
        border: 5px solid #141414;
        background: #FF6A1A;
        color: #141414;
        font-size: 112px;
        font-weight: 900;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        will-change: transform, opacity;
      }

      .bottom-bar {
        position: absolute;
        z-index: 10;
        right: 0;
        bottom: 0;
        left: 0;
        height: 15px;
        background: #FF6A1A;
      }
    </style>

    <div id="root" data-composition-id="scene-s01" data-start="0" data-width="1080" data-height="1920" data-fps="30" data-duration="5.44">
      <div class="grid" aria-hidden="true"></div>

      <section id="courtroom-shot" class="clip" data-start="0" data-duration="5.44" data-track-index="0">
        <div class="photo-frame" data-layout-allow-overflow aria-hidden="true">
          <img
            id="courtroom-photo"
            class="photo"
            src="assets/img-03-courtroom-defendant-verdict-sentence.jpg"
            alt=""
          />
        </div>
      </section>

      <div id="number-overlay" class="clip number-clip" data-start="4.37" data-duration="1.07" data-track-index="1">
        <div id="number-badge" class="number-badge" data-layout-allow-overlap>83</div>
      </div>

      <div class="bottom-bar" aria-hidden="true"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        ".photo-frame",
        { y: 52, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.72, ease: "power3.out" },
        0
      );

      // The framed crop begins on the defendant, then drifts toward the files.
      // Keep the lower verdict detail outside the frame's principal viewing area.
      tl.fromTo(
        "#courtroom-photo",
        { x: 20, y: -28, scale: 1.035 },
        { x: -24, y: -28, scale: 1.065, duration: 5.4, ease: "none" },
        0
      );

      tl.fromTo(
        "#number-badge",
        { y: 26, scale: 0.86, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.34, ease: "power3.out" },
        4.37
      );

      window.__timelines["scene-s01"] = tl;
    </script>
  
    </template>
  </body>
</html>
